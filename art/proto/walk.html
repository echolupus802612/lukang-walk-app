<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>散步吧・走路頁原型</title>
<style>
/* 走路頁原型：一個畫面只有一個主角（小嚮導＋地面箭頭＋距離），其餘退成文字或圖示；底部三個分頁。
   顏色、字型沿用主畫面（src/app.html），不改成別人的配色。 */
@font-face{font-family:"LXGW WenKai TC";src:url("../../docs/fonts/walk-kai.woff2") format("woff2");font-weight:400}
@font-face{font-family:"LXGW WenKai TC";src:url("../../docs/fonts/walk-kai-bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Noto Sans TC";src:url("../../docs/fonts/walk-sans.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Noto Sans TC";src:url("../../docs/fonts/walk-sans-bold.woff2") format("woff2");font-weight:700}
:root{--bg:#9a3a27;--bg2:#82301f;--ink:#fbf3e6;--soft:#f3dccb;--gold:#f2c14e;--gold2:#c9922a;
  --card:#fbf3e6;--cardink:#3a1a12;--cardsoft:#7a5a4c;--well:#f2e3cf;--line:rgba(251,243,230,.22)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#1b0c08;display:grid;place-items:center;font:500 16px/1.5 "Noto Sans TC",system-ui,sans-serif;color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none}
.phone{position:relative;width:393px;height:852px;border-radius:44px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 38%,var(--bg) 0%,var(--bg2) 100%);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.status{height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 6px;font:600 16px system-ui}

/* 頂列：名稱在左，次要功能收成圖示在右 */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 0 22px}
.top b{font:700 24px/1 "LXGW WenKai TC",serif;opacity:.85}
.icons{display:flex;gap:10px}
.icon{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:var(--ink);
  display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.on{background:var(--ink);color:var(--bg2)}
.band{font-size:12px;color:var(--soft);text-align:center;margin-top:4px}

.hint{margin-top:14px;text-align:center;font:400 17px/1.4 "LXGW WenKai TC",serif;color:var(--soft)}
.pet{position:relative;width:340px;aspect-ratio:400/330;margin:6px auto 0}
.pet svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kid{position:absolute;left:11.25%;top:-8.8%;width:77.5%;height:93.94%;background:no-repeat 0 0/400% 100% url(../../docs/sprites/walk.webp)}
.dist{text-align:center;font:700 64px/1 "Noto Sans TC",sans-serif;letter-spacing:.5px;margin-top:6px}
.dist small{font-size:20px;font-weight:500;margin-left:6px;color:var(--soft)}
.say{margin:14px auto 0;max-width:300px;text-align:center;font:400 17px/1.45 "LXGW WenKai TC",serif;color:var(--soft)}

/* 主要操作只用文字：換個地方｜收工；次要的再小一號 */
.acts{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:22px;font:400 19px "LXGW WenKai TC",serif}
.acts button,.minor button{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:8px 6px}
.acts i{width:1px;height:18px;background:var(--line)}
.minor{display:flex;justify-content:center;gap:26px;margin-top:10px;font:500 14px "Noto Sans TC",sans-serif}
.minor button{color:var(--soft);display:flex;align-items:center;gap:6px}
.minor svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 底部分頁 */
.tabs{position:absolute;left:0;right:0;bottom:0;height:86px;padding-bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(42,13,7,.35);border-top:1px solid rgba(251,243,230,.08)}
.tabs button{background:none;border:0;color:rgba(251,243,230,.5);font:500 12px/1 "Noto Sans TC",sans-serif;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tabs button.on{color:var(--ink)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 分享面板：米白卡片從下往上，跟地點卡同一套樣式 */
.veil{position:absolute;inset:0;background:rgba(20,6,3,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);color:var(--cardink);border-radius:22px 22px 0 0;
  padding:10px 20px 34px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.veil.on .sheet{transform:none}
.grip{width:40px;height:5px;border-radius:3px;background:rgba(58,26,18,.18);margin:0 auto 14px}
.sheet h3{font:700 19px "LXGW WenKai TC",serif;margin-bottom:10px}
.quote{background:var(--well);border-radius:12px;padding:10px 14px;font:400 16px/1.5 "LXGW WenKai TC",serif;color:var(--cardink);margin-bottom:6px}
.opts{list-style:none;padding:0}
.opts li+li{border-top:1px solid rgba(58,26,18,.1)}
.opts button{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;padding:10px 2px;color:var(--cardink);
  font:500 17px "Noto Sans TC",sans-serif;cursor:pointer;text-align:left}
.opts .ic{width:42px;height:42px;border-radius:50%;background:var(--well);display:grid;place-items:center;color:var(--bg);flex:none;font:700 17px system-ui}
.opts .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opts .note{margin-left:auto;font-size:13px;color:var(--cardsoft)}
/* 選單頁：紅磚底上的米白分組卡片，跟彈窗的列表同一套樣式 */
.page{position:absolute;left:0;right:0;top:54px;bottom:86px;overflow:auto;padding:12px 18px 24px;display:none}
.page.on{display:block}
.walk.off{display:none}
.page h2{font:700 26px "LXGW WenKai TC",serif;margin:6px 4px 14px}
.group{margin-bottom:18px}
.group h4{font:700 14px "LXGW WenKai TC",serif;color:var(--soft);margin:0 6px 6px;letter-spacing:1px}
.rows{background:var(--card);color:var(--cardink);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;font:400 17px "LXGW WenKai TC",serif}
.row+.row{border-top:1px solid rgba(58,26,18,.1)}
.row .v{margin-left:auto;font:500 15px "Noto Sans TC",sans-serif;color:var(--bg)}
.row .chev{margin-left:auto;color:var(--cardsoft);font:400 18px system-ui}
.row .v+.chev{margin-left:6px}
.row .sub{display:block;font:400 12px "Noto Sans TC",sans-serif;color:var(--cardsoft)}
.toggle{margin-left:auto;width:48px;height:28px;border-radius:14px;background:rgba(58,26,18,.18);position:relative;border:0;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--bg)}
.toggle.on::after{left:23px}
.page .foot{text-align:center;font-size:12px;color:var(--soft);opacity:.7;margin-top:4px}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,10px);background:var(--cardink);color:var(--card);
  padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>18:00</span><span>●●● 82%</span></div>

  <div class="walk" id="walkView">
  <div class="top">
    <b>散步吧</b>
    <div class="icons">
      <div><button class="icon" id="voice" aria-label="語音：開" title="語音"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div>
      <div><button class="icon" id="share" aria-label="分享這趟散步" title="分享"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5v10h14V11h-1"/></svg></button></div>
    </div>
  </div>

  <div class="hint">這次要去：一處看風景的地方</div>
  <div class="pet">
    <svg viewBox="0 0 400 330" aria-hidden="true">
      <g transform="translate(200 268) scale(1 .42)"><g id="wedge" transform="rotate(14)"><g transform="scale(3.4) translate(0 3)">
        <path d="M0 -38 L28 32 L0 17 L-28 32 Z" fill="none" stroke="rgba(42,13,7,.5)" stroke-width="7" stroke-linejoin="round"/>
        <path d="M0 -38 L28 32 L0 17 L-28 32 Z" fill="#f2c14e" stroke="#f2c14e" stroke-width="3" stroke-linejoin="round"/>
      </g></g></g>
      <ellipse cx="200" cy="268" rx="74" ry="15" fill="rgba(42,13,7,.4)"/>
      <g transform="translate(200 268) scale(1 .42)"><text y="9" text-anchor="middle" font-size="24" fill="rgba(251,243,230,.6)" transform="translate(-60 -162) scale(1 2.4)" font-family="LXGW WenKai TC">北</text></g>
    </svg>
    <div class="kid" id="kid"></div>
  </div>
  <div class="dist" id="dist">467<small>公尺</small></div>
  <div class="say">今天想去哪走走？跟我來。</div>

  <div class="acts"><button>換個地方</button><i></i><button>收工</button></div>
  <div class="minor">
    <button><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>帶我回去</button>
    <button><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>記一筆</button>
  </div>
  </div>

  <!-- 選單：把散落在主畫面的設定、資料來源、回報收在這裡 -->
  <section class="page" id="menuView" aria-label="選單">
    <h2>選單</h2>
    <div class="group"><h4>散步</h4><div class="rows">
      <div class="row">到站範圍<span class="v">自動</span><span class="chev">›</span></div>
      <div class="row">隱藏剩餘距離<button class="toggle" aria-label="隱藏剩餘距離"></button></div>
      <div class="row">小嚮導語音<button class="toggle on" aria-label="小嚮導語音"></button></div>
    </div></div>
    <div class="group"><h4>回程</h4><div class="rows">
      <div class="row"><span>回程地點<span class="sub">已儲存，只存在這支手機</span></span><span class="chev">›</span></div>
    </div></div>
    <div class="group"><h4>外觀</h4><div class="rows">
      <div class="row">深淺色<span class="v">跟隨手機</span><span class="chev">›</span></div>
    </div></div>
    <div class="group"><h4>關於</h4><div class="rows">
      <div class="row">問題回報・意見<span class="chev">›</span></div>
      <div class="row">資料來源與授權<span class="chev">›</span></div>
    </div></div>
    <p class="foot">散步吧 1.7</p>
  </section>

  <nav class="tabs">
    <button class="on" data-view="walkView"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>散步</button>
    <button data-view="notes"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5C7 18 10 18.5 12 20c2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg>散步筆記</button>
    <button data-view="menuView"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>選單</button>
  </nav>

  <div class="veil" id="veil">
    <div class="sheet" role="dialog" aria-label="分享這趟散步">
      <div class="grip"></div>
      <h3>分享這趟散步</h3>
      <p class="quote" id="quote"></p>
      <ul class="opts" id="opts"></ul>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const $ = id => document.getElementById(id);
/* 小嚮導走路動畫：四格精靈圖 */
let f = 0; setInterval(() => { f = (f + 1) % 4; $('kid').style.backgroundPosition = `${f / 3 * 100}% 0`; }, 150);
/* 語音開關 */
$('voice').onclick = () => { const on = $('wave').style.display === 'none'; $('wave').style.display = on ? '' : 'none';
  $('voice').setAttribute('aria-label', on ? '語音：開' : '語音：關'); };

/* 分享文字：不透露目的地，只說還有多遠，附 #散步吧 */
const text = () => `小嚮導要帶我去一個還不知道的地方，還有 ${$('dist').firstChild.textContent} 公尺 #散步吧`;
const ic = {
  line: '<svg viewBox="0 0 24 24"><path d="M12 4C7 4 3 7.2 3 11.2c0 3.6 3.2 6.6 7.5 7.1l.7 2.2 2.6-2.3c4.2-.6 7.2-3.6 7.2-7C21 7.2 17 4 12 4z"/><path d="M7.5 9.5v3.5h2M11.5 9.5V13M14 13V9.5l2.5 3.5V9.5"/></svg>', ig: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6"/></svg>',
  threads: '<span>@</span>', x: '<span>X</span>', bsky: '<svg viewBox="0 0 24 24"><path d="M12 11C10 7 7 5 5 5s-2 3 0 6 5 2 7 0zm0 0c2-4 5-6 7-6s2 3 0 6-5 2-7 0zm0 0c-1 3-3 6-5 7m5-7c1 3 3 6 5 7"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>'
};
/* 各平台的發文連結：按下去直接開該平台的發文頁，文字已填好（只能帶文字，帶不了圖） */
const targets = [
  {id:'line', name:'LINE', url: t => `https://line.me/R/share?text=${encodeURIComponent(t)}`},
  {id:'ig', name:'Instagram', note:'先複製文字', copy:true, url: () => 'https://www.instagram.com/'},
  {id:'threads', name:'Threads', url: t => `https://www.threads.net/intent/post?text=${encodeURIComponent(t)}`},
  {id:'x', name:'X', url: t => `https://x.com/intent/tweet?text=${encodeURIComponent(t)}`},
  {id:'bsky', name:'Bluesky', url: t => `https://bsky.app/intent/compose?text=${encodeURIComponent(t)}`},
  {id:'copy', name:'複製文字', copy:true},
  {id:'more', name:'其他 App…', system:true}
];
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
async function copy(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ return false; } }
$('opts').innerHTML = targets.filter(x => !x.system || navigator.share).map(x =>
  `<li><button data-id="${x.id}"><span class="ic">${ic[x.id]}</span>${x.name}${x.note ? `<span class="note">${x.note}</span>` : ''}</button></li>`).join('');
$('opts').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const x = targets.find(t => t.id === b.dataset.id), t = text();
  window.lastShare = {target: x.id, text: t, url: x.url ? x.url(t) : null};
  if (x.system){ try{ await navigator.share({text: t}); }catch(err){} return; }
  if (x.copy){ toast(await copy(t) ? (x.id === 'ig' ? '已複製，貼到 IG 的說明欄' : '已複製') : '無法複製'); }
  if (x.url && !window.noOpen) window.open(x.url(t), '_blank', 'noopener,noreferrer');
  $('veil').classList.remove('on');
};
/* 底部分頁：散步、選單可切換；散步筆記在 App 裡是原生畫面，原型先提示 */
document.querySelector('.tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.view === 'notes'){ toast('散步筆記會開原生的日誌畫面'); return; }
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('walkView').classList.toggle('off', b.dataset.view !== 'walkView');
  $('menuView').classList.toggle('on', b.dataset.view === 'menuView');
};
document.querySelectorAll('.toggle').forEach(t => t.onclick = () => t.classList.toggle('on'));
$('share').onclick = () => { $('quote').textContent = text(); $('veil').classList.add('on'); };
$('veil').onclick = e => { if (e.target === $('veil')) $('veil').classList.remove('on'); };
</script>
</body>
</html>
