name: Build and test iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'docs/**', 'data/**', 'tools/build_page.py', 'tools/build_ios_credits.py', '.github/workflows/ios-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lukang-walk-app-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROJECT: ios/LukangWalk.xcodeproj
      SCHEME: LukangWalk
      BUNDLE_ID: io.github.echolupus802612.lukangwalk
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 檢查繁體中文與臺灣用語
        run: python3 tools/check_zh_tw.py

      - name: 驗證散步日誌儲存與舊版資料遷移
        run: |
          xcrun swiftc -parse-as-library ios/LukangWalk/WalkJournalStore.swift tools/test_walk_journal.swift -o "$RUNNER_TEMP/test-walk-journal"
          "$RUNNER_TEMP/test-walk-journal"

      - name: Select an available iPhone
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" "$sdk" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as src:
              devices = json.load(src)["devices"]
          sdk = tuple(map(int, sys.argv[2].split(".")))
          prefix = "com.apple.CoreSimulator.SimRuntime.iOS-"
          candidates = []
          for identifier, models in devices.items():
              if not identifier.startswith(prefix):
                  continue
              version = tuple(map(int, identifier[len(prefix):].split("-")))
              if version[0] != sdk[0]:
                  continue
              for model in models:
                  if model["isAvailable"] and model["name"].startswith("iPhone"):
                      candidates.append((version != sdk, model["name"] != "iPhone 16", version, model["name"], model["udid"]))
          if not candidates:
              sys.exit(f"No available iPhone simulator for SDK {sys.argv[2]}")
          _, _, version, name, udid = min(candidates)
          print(f"{name} / iOS {'.'.join(map(str, version))} / {udid}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"SIMULATOR_ID={udid}", file=env)
          PY

      - name: Build for the iPhone simulator
        id: build_sim
        run: |
          settings=(
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -parallel-testing-enabled NO
          )
          xcodebuild build-for-testing "${settings[@]}" \
            -resultBundlePath "$RUNNER_TEMP/LukangWalk-Build.xcresult"

      - name: Package simulator app and capture the ready screen
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/LukangWalk.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/LukangWalk-Simulator.zip"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$app"
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState discharging --batteryLevel 100
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/LukangWalk-iPhone-preview.png"

      - name: Upload simulator app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LukangWalk-Simulator
          path: ${{ runner.temp }}/LukangWalk-Simulator.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload simulator preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LukangWalk-iPhone-preview
          path: ${{ runner.temp }}/LukangWalk-iPhone-preview.png
          if-no-files-found: error

      - name: Archive unsigned Release build for iPhone
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/LukangWalk.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test -x "$RUNNER_TEMP/LukangWalk.xcarchive/Products/Applications/LukangWalk.app/LukangWalk"
          ditto -c -k --keepParent "$RUNNER_TEMP/LukangWalk.xcarchive" "$RUNNER_TEMP/LukangWalk-Unsigned-Device.zip"

      - name: Upload unsigned device archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LukangWalk-Unsigned-Device
          path: ${{ runner.temp }}/LukangWalk-Unsigned-Device.zip
          if-no-files-found: error
          compression-level: 0

      - name: Run iPhone UI tests
        id: test
        run: |
          settings=(
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -parallel-testing-enabled NO
          )
          # 換成乾淨安裝，讓通知權限提示與已送達通知都從這一次驗收開始。
          xcrun simctl uninstall "$SIMULATOR_ID" "$BUNDLE_ID"
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/LukangWalk.app"
          xcrun simctl privacy "$SIMULATOR_ID" grant location "$BUNDLE_ID"
          # 放入系統「照片」，讓測試從標準選擇器挑圖；兩側色塊供重新開啟後核對。
          python3 - "$RUNNER_TEMP/Walk-Photo-Picker.png" <<'PY'
          from pathlib import Path
          import struct, sys, zlib

          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data))

          width, height = 320, 240
          row = b"\x00" + bytes((232, 46, 69)) * 160 + bytes((20, 182, 206)) * 160
          header = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)
          Path(sys.argv[1]).write_bytes(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", header)
                                        + chunk(b"IDAT", zlib.compress(row * height)) + chunk(b"IEND", b""))
          PY
          xcrun simctl addmedia "$SIMULATOR_ID" "$RUNNER_TEMP/Walk-Photo-Picker.png"
          # 在全新安裝的模擬器建立 1.3 實際使用的兩種檔案，讓新版第一次啟動時匯入。
          container="$(xcrun simctl get_app_container "$SIMULATOR_ID" "$BUNDLE_ID" data)"
          icon="ios/LukangWalk/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          sips -s format jpeg "$RUNNER_TEMP/Walk-Photo-Picker.png" --out "$RUNNER_TEMP/legacy-a.jpg" > /dev/null
          sips -s format jpeg "$icon" --out "$RUNNER_TEMP/legacy-b.jpg" > /dev/null
          python3 - "$container" "$RUNNER_TEMP" "$icon" <<'PY'
          from pathlib import Path
          import json, shutil, sys
          data, temp, icon = map(Path, sys.argv[1:])
          walk = data / "Library/Application Support/Walk"
          album = walk / "PhotoAlbum"
          album.mkdir(parents=True, exist_ok=True)
          records = []
          for index, (day, jpeg, png) in enumerate([
              ("2026.11.05", temp / "legacy-a.jpg", temp / "Walk-Photo-Picker.png"),
              ("2026.10.16", temp / "legacy-b.jpg", icon)
          ], start=1):
              visit_id = f"95677970-90CB-48F9-BD5B-00000000000{index}"
              generation = f"25CF3C04-9333-49AB-8CEC-00000000000{index}"
              folder = album / generation
              folder.mkdir()
              shutil.copyfile(jpeg, folder / "photo.jpg")
              shutil.copyfile(png, folder / "card.png")
              visit = dict(id=visit_id, placeID=1009, name="楠仔腳蔓社學堂遺蹟", date=day, isSimulated=False)
              records.append(dict(visit=visit, generation=generation))
          (album / "visits.json").write_text(json.dumps(records, ensure_ascii=False), encoding="utf-8")
          footprints = dict(ver=2, voice=True, drawn=3, seen=[1009, 1008], recent=[1009, 1008],
                            sim_drawn=0, sim_seen=[], sim_recent=[])
          (walk / "footprints.json").write_text(json.dumps(footprints), encoding="utf-8")
          PY
          xcodebuild test-without-building "${settings[@]}" \
            -resultBundlePath "$RUNNER_TEMP/LukangWalk-Tests.xcresult"
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/LukangWalk-Tests.xcresult" | tee "$RUNNER_TEMP/test-summary.json"
          jq -e '.passedTests > 0' "$RUNNER_TEMP/test-summary.json"

      - name: Preserve the Xcode test report
        if: ${{ !cancelled() && steps.build_sim.outcome != 'skipped' }}
        run: |
          if [[ -d "$RUNNER_TEMP/LukangWalk-Tests.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/LukangWalk-Tests.xcresult" "$RUNNER_TEMP/LukangWalk-Tests.xcresult.zip"
          elif [[ -d "$RUNNER_TEMP/LukangWalk-Build.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/LukangWalk-Build.xcresult" "$RUNNER_TEMP/LukangWalk-Build.xcresult.zip"
          fi

      - name: Upload test report
        if: ${{ !cancelled() && steps.build_sim.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LukangWalk-TestResults
          path: ${{ runner.temp }}/LukangWalk-*.xcresult.zip
          if-no-files-found: warn
          compression-level: 0
