帶著紀念的用意。","area":"新興區・高雄市"},{"id":5966,"name":"柯旗化故居","lat":22.63604,"lng":120.299901,"cat":"history","tag":"歷史建築","desc":"寫《新英文法》的柯旗化曾在白色恐怖時期兩度入獄，出獄後與家人住在八德二路。這處故居留下他和家人在政治迫害下生活的歷史。","area":"新興區・高雄市","ph":"文"},{"id":5967,"name":"逍遙園","lat":22.63177,"lng":120.309122,"cat":"history","tag":"歷史建築","desc":"這座宅院把日式和西洋建築的做法放在一起，是少見的和洋折衷建築。白天能看清宅院的淡雅線條，入夜點燈後則映著暖黃色的光。","area":"新興區・高雄市","ph":"文"},{"id":5968,"name":"原旗山上水道","lat":22.890439,"lng":120.479614,"cat":"history","tag":"歷史建築","desc":"這處自來水設施在一九二五年建成，當年是臺灣主要的中型水道之一。它也記下了舊高雄縣最早興建現代自來水系統的歷史。","area":"旗山區・高雄市","ph":"文"},{"id":5969,"name":"地景橋","lat":22.88431,"lng":120.48565,"cat":"other","desc":"橫跨楠梓仙溪的步道橋，前身是糖廠載運甘蔗的五分車軌道。舊橋歷經莫拉克風災，後來重新建造，供行人和自行車通行。","area":"旗山區・高雄市"},{"id":5970,"name":"旗山亭仔腳（石拱圈）","lat":22.884898,"lng":120.481851,"cat":"history","tag":"歷史建築","desc":"旗山街上的亭仔腳，用大小不一的砂頁岩砌出半圓石拱。一座接一座的騎樓讓街道多了公共空間，也見證店家沿街做生意的歷史。","area":"旗山區・高雄市","ph":"文"},{"id":5971,"name":"旗山天后宮","lat":22.886601,"lng":120.482836,"cat":"worship","tag":"古蹟","desc":"廟埕、三川殿、天井和正殿沿著中軸前後排列，屋內以疊斗式木樑柱撐起空間。磚牆採少見的美式砌法，建廟的木材與石材則來自中國。","area":"旗山區・高雄市","ph":"文"},{"id":5972,"name":"旗山孔廟","lat":22.88878,"lng":120.47624,"cat":"worship","desc":"鼓山公園裡的孔廟採宋代建築樣式，入口設了一座五開牌坊。殿宇用黃色琉璃瓦、朱紅樑柱和白色欄柵，也是春季祭孔的場所。","area":"旗山區・高雄市"},{"id":5973,"name":"旗山橋","lat":22.88174,"lng":120.48759,"cat":"other","desc":"這座跨楠梓仙溪的橋連起高雄平原和山區。舊橋在莫拉克風災中受重創，重建時採單塔脊背橋設計，橋長五百三十五公尺。","area":"旗山區・高雄市"},{"id":5974,"name":"旗山武德殿","lat":22.88798,"lng":120.48018,"cat":"worship","desc":"日治時期為推廣武士道，各地興建武德殿作為道場。旗山的這處場館也屬於這段歷史，當時參與柔道和劍道練習的有軍警與青年。","area":"旗山區・高雄市"},{"id":5975,"name":"旗山生活文化園區","lat":22.88999,"lng":120.48085,"cat":"culture","desc":"園區由舊校舍整建而成，保留了一九二〇年所建的大禮堂和教職員辦公、教學空間。禮堂入口排著三道拱門，上方是木造交叉山牆。","area":"旗山區・高雄市"},{"id":5976,"name":"旗山車站(原旗山驛)","lat":22.884619,"lng":120.481889,"cat":"history","tag":"歷史建築","desc":"這座淡藍色車站建於一九一三至一九一五年間，造型融合日式、維多利亞式與哥德式風格。這種由日本帶入臺灣的建築做法，也常被稱為擬洋風。","area":"旗山區・高雄市","ph":"文"},{"id":5977,"name":"旗山農會","lat":22.887012,"lng":120.481967,"cat":"history","tag":"古蹟","desc":"從外觀推測，這棟農會建築可能建於日治時期。裡頭用鋼筋混凝土柱支撐樓板，到了三樓，屋頂還留著木構屋架和舊式黑瓦。","area":"旗山區・高雄市","ph":"文"},{"id":5978,"name":"東九道之驛－旗糖農創園區","lat":22.88162,"lng":120.49168,"cat":"culture","desc":"園區的前身是一九〇九年創立的旗山糖廠，曾是南臺灣的重要製糖基地。糖廠停產後，大片土地和廠區一度閒置，才有後來的農創園區。","area":"旗山區・高雄市"},{"id":5979,"name":"聖若瑟天主堂","lat":22.88487,"lng":120.47901,"cat":"worship","desc":"一九五九年，戴剛德神父請義大利建築師在旗山設計這座仿哥德式教堂。灰色洗石子山牆兩側各有高塔，中央上方則立著耶穌像。","area":"旗山區・高雄市"},{"id":5980,"name":"鼓山公園","lat":22.89,"lng":120.47706,"cat":"nature","desc":"沿鼓山地勢闢建的公園，原是旗山神社所在，隔著溪能望見旗尾山。園中大樹之間散布青銅和石刻雕塑，後來還建了孔廟。","area":"旗山區・高雄市"},{"id":5981,"name":"勞動女性紀念公園","lat":22.59447,"lng":120.28084,"cat":"nature","desc":"一九七三年，旗津前往高雄的渡輪翻覆，二十五名在加工出口區工作的女性罹難。她們合葬於旗津，這座公園紀念的正是這些勞動女性。","area":"旗津區・高雄市"},{"id":5982,"name":"戰爭與和平紀念公園主題館","lat":22.59118,"lng":120.28289,"cat":"nature","desc":"旗津這座公園記錄了臺籍士兵在二次大戰和國共內戰中離鄉的經歷。經老兵、遺族及許昭榮等人奔走，公園在二〇〇九年落成。","area":"旗津區・高雄市"},{"id":5983,"name":"旗後天后宮","lat":22.613481,"lng":120.268523,"cat":"worship","tag":"古蹟","desc":"廟裡留有清光緒年間的銅鐘和一副木對聯，聯文把旗峰、鼓嶼與潮汐寫在一起。還能看到「敕封順天聖母」古匾和花崗石柱礎。","area":"旗津區・高雄市","ph":"文"},{"id":5984,"name":"旗後教會","lat":22.61182,"lng":120.26763,"cat":"worship","desc":"打狗港開放通商後，蘇格蘭傳教士馬雅各醫生也來到旗津。當年成立的打狗禮拜堂，是臺灣基督長老教會早期在高雄落腳的地方。","area":"旗津區・高雄市"},{"id":5985,"name":"旗後礮臺","lat":22.615556,"lng":120.265278,"cat":"history","tag":"古蹟","desc":"這座清末海防建築位在旗後，是臺灣早期結合中西形式的砲臺之一。它留著清政府延請西方技師督造海防工事的歷史痕跡。","area":"旗津區・高雄市","ph":"文"},{"id":5986,"name":"旗津天后宮","lat":22.61338,"lng":120.26843,"cat":"worship","desc":"相傳福建漁戶徐阿華遇風漂流至旗津，在此落腳後招來同鄉，迎奉湄洲媽祖。如今旗津鬧區的這座廟，延續了三百多年的海神信仰。","area":"旗津區・高雄市"},{"id":5987,"name":"旗津彩虹教堂","lat":22.60234,"lng":120.27345,"cat":"worship","desc":"旗津沙灘上的彩色拱架，用幾何線條把真正的海景框了起來。旁邊的水池從特定角度看像是接進大海，光影也隨時間改變。","area":"旗津區・高雄市"},{"id":5988,"name":"旗津星空隧道","lat":22.61287,"lng":120.26411,"cat":"other","desc":"這段八十八公尺長的隧道，原是日治時期開鑿的軍事設施。二〇〇五年以後重新整理成星空隧道，也增設了供自行車使用的棧道。","area":"旗津區・高雄市"},{"id":5989,"name":"旗津老街（廟前路）","lat":22.61266,"lng":120.26824,"cat":"worship","desc":"旗津早年道路狹窄、巷子又多，人力三輪車曾是島上主要的交通工具。如今老街一帶仍有觀光三輪車，延續這門少見的行業。","area":"旗津區・高雄市"},{"id":5990,"name":"旗津觀光漁港","lat":22.59086,"lng":120.2869,"cat":"other","desc":"南汕里的漁港位在旗津中段，紅燈碼頭、漁市和漁港廣場都在這裡。往東便是高雄港主航道，可以近看大小輪船來往。","area":"旗津區・高雄市"},{"id":5991,"name":"旗津貝殼館","lat":22.60115,"lng":120.27425,"cat":"culture","desc":"館內收藏兩千多種貝類標本，由黃葛亮和沈淑惠提供。除了巨大的二枚貝，還能看到鸚鵡螺、黑星寶螺和龍宮貝等不同收藏。","area":"旗津區・高雄市"},{"id":5992,"name":"旗津風車公園","lat":22.58829,"lng":120.28415,"cat":"nature","desc":"海邊七座三葉式風車迎風轉動，公園旁連著旗津漁港的觀光步道。除了觀海看臺和表演廣場，沿途還散布以海洋生物為題的拼貼作品。","area":"旗津區・高雄市"},{"id":5993,"name":"高雄燈塔(旗津旗后燈塔)","lat":22.61552,"lng":120.26471,"cat":"history","desc":"燈塔又叫旗後燈塔，最早由英國技師在一八八三年建造。它和砲臺共構，在臺灣頗為少見，也見證高雄港一路開發的歷史。","area":"旗津區・高雄市"},{"id":5994,"name":"大愛園區","lat":22.96549,"lng":120.5451,"cat":"culture","desc":"莫拉克風災後，杉林成了家園重建的基地，園區裡有教堂、工坊與廣場。細看住家外觀，各族居民用了不同的圖騰，例如布農族家屋上的繽紛菱形。","area":"杉林區・高雄市"},{"id":5995,"name":"大武壠文化事務所","lat":22.98037,"lng":120.55287,"cat":"other","desc":"莫拉克風災後，小林居民在杉林重建家園，大武壠文化事務所也在這裡落腳。日光小林沿用故鄉的路名，族人也以歌謠和祭儀延續傳統。","area":"杉林區・高雄市","ph":"觀"},{"id":5996,"name":"天主教真福山社福園區","lat":23.00495,"lng":120.56304,"cat":"culture","desc":"這片占地二十八甲的園區，由臺灣首位天主教樞機主教單國璽籌建。規劃內容除了社會服務活動中心，也包括安養院與育幼院。","area":"杉林區・高雄市"},{"id":5997,"name":"杉林大橋","lat":22.99076,"lng":120.55088,"cat":"other","desc":"楠梓仙溪上的舊橋在莫拉克風災中受損，新橋在二〇一三年底啟用。這裡連接溪流兩岸，也是杉林與甲仙之間的重要通道。","area":"杉林區・高雄市"},{"id":5998,"name":"永齡杉林有機農業園區","lat":22.97752,"lng":120.55051,"cat":"culture","desc":"莫拉克風災後，永齡基金會在杉林設立有機農業園區，協助因災失去工作的居民。園區由專業團隊教種有機作物，讓居民重新投入耕作。","area":"杉林區・高雄市"},{"id":5999,"name":"黃家伙房","lat":22.9604,"lng":120.53214,"cat":"history","desc":"月眉里這座百年伙房，留下客家人來杉林開墾的足跡。入口牌樓正面寫著「孝友遺風」，轉到背面則是「五經世第」，都是黃家勉勵後代的話。","area":"杉林區・高雄市"},{"id":6000,"name":"中芸漁港","lat":22.48336,"lng":120.39905,"cat":"other","desc":"林園這處近海漁港多見小型漁船，數量最多的是俗稱「三角虎」的船。船上掛著許多燈泡，帶著漁獲返港時，碼頭便聚滿魚販和攤商。","area":"林園區・高雄市"},{"id":6001,"name":"原頂林仔邊警察官吏派出所","lat":22.505058,"lng":120.394577,"cat":"history","tag":"歷史建築","desc":"派出所把紅磚牆和木構架用在同一棟建築裡，木構部分以編竹夾泥做牆，外頭再覆雨淋板。辦公室前的門廊突出於正面，窗上還設了水平雨庇。","area":"林園區・高雄市","ph":"文"},{"id":6002,"name":"市境之南樹","lat":22.47626,"lng":120.41382,"cat":"scenic","desc":"汕尾海邊這棵黃槿，長在高雄市境的最南端。它歷經幾次風災仍抽出綠葉，從樹旁還能望見太陽從大武山方向升起。","area":"林園區・高雄市"},{"id":6003,"name":"林園安樂樓","lat":22.50565,"lng":120.39512,"cat":"other","desc":"這棟約建於一九三〇年的巴洛克建築，曾是日本軍士官俱樂部，後來也開過酒家和旅館。老樓雖已荒廢，電視劇《一把青》仍曾來此取景。","area":"林園區・高雄市"},{"id":6004,"name":"林園海洋濕地公園","lat":22.49176,"lng":120.38572,"cat":"nature","desc":"這片只有六點二公頃的袖珍濕地緊鄰大海，就在林園海岸上。站在公園裡，近處能看濕地，目光越過臺灣海峽的海面還能遠眺小琉球。","area":"林園區・高雄市"},{"id":6005,"name":"林園港埔黃家（江夏派）古厝","lat":22.496108,"lng":120.38046,"cat":"history","tag":"歷史建築","desc":"黃家大厝沿中軸前後排了五進，家族擴建時再逐道向兩側添上護龍。左邊有三道、右邊有九道，最前面一排房舍圍出長條形的大埕。","area":"林園區・高雄市","ph":"文"},{"id":6006,"name":"南橫天池","lat":23.27748,"lng":120.91693,"cat":"other","desc":"長青祠後方這座高山湖泊海拔約兩千兩百公尺，因為輪廓像心臟，也被叫作心湖。湖水終年不乾，從箭竹草坡望下去，碧綠池面常伴著山霧。","area":"桃源區・高雄市","ph":"觀"},{"id":6007,"name":"寶山二集團櫻花公園","lat":23.05943,"lng":120.73112,"cat":"nature","desc":"櫻花公園在海拔約一千五百公尺的山上，占地約三十八甲。櫻花盛開時，近處是一片粉色，遠方還望得見關山與庫哈諾辛山。","area":"桃源區・高雄市","ph":"觀"},{"id":6008,"name":"寶山二集團櫻花公園(38甲櫻花公園)","lat":23.03777,"lng":120.70744,"cat":"nature","desc":"人們也叫這座櫻花公園「三十八甲」，因為園地面積就約有三十八甲。從高處能看到小關山、建山和寶來，晴天甚至能遠望高雄及臺南市區。","area":"桃源區・高雄市"},{"id":6009,"name":"布農文化展示中心","lat":23.26348,"lng":120.82577,"cat":"other","desc":"梅山遊客中心旁的展示館收藏了許多布農族文物，由玉山國家公園管理。從生命禮俗、編織到建築和工藝，展覽談的是布農族人生活的不同面向。","area":"桃源區・高雄市","ph":"觀"},{"id":6010,"name":"拉阿魯哇文化祭場","lat":23.1336,"lng":120.72122,"cat":"other","desc":"拉阿魯哇族傳說中的聖貝是友人留下的紀念，也象徵豐收。族人在美蘭社區上方搭起草造祭場，舉行聖貝祭，紀念這段情誼並祈求豐收。","area":"桃源區・高雄市"},{"id":6011,"name":"桃源區原住民文化館","lat":23.15922,"lng":120.76627,"cat":"culture","desc":"群山環繞的文化館有三層樓，設有手工藝展示區、教室和大型展場。館前還留了一片戶外展演場，部落的祭典也能在此舉行。","area":"桃源區・高雄市","ph":"觀"},{"id":6012,"name":"梅山遊客中心","lat":23.26336,"lng":120.826,"cat":"scenic","desc":"這處服務站設在桃源區最北端的山區，是南橫公路進入玉山國家公園管理區的門戶。遊客中心附近也設有露營區，供往來的人休息。","area":"桃源區・高雄市"},{"id":6013,"name":"瓦阿係吊橋","lat":23.21677,"lng":120.80361,"cat":"other","desc":"復興部落與對岸的清水臺地之間，隔著荖濃溪。這座長二百六十五公尺的吊橋，連起部落和居民在臺地上耕作的田地。","area":"桃源區・高雄市"},{"id":6014,"name":"索阿紀吊橋","lat":23.13138,"lng":120.72451,"cat":"other","desc":"美蘭部落的文化也出現在這座車行吊橋上。橋柱畫著熊鷹羽毛的圖樣，橋臺做成山豬造型，橋頭還豎著族人合力拉緊吊索的雕像。","area":"桃源區・高雄市"},{"id":6015,"name":"馬舒霍爾文化聚落所","lat":23.27343,"lng":120.82564,"cat":"other","desc":"布農族人早年遷來時，看到滿地的黃藤，便以「馬舒霍爾」為聚落命名。後來這裡改稱梅山，部落廣植梅樹，冬季山間便開出梅花。","area":"桃源區・高雄市"},{"id":6016,"name":"同安張家古厝","lat":22.7523,"lng":120.26723,"cat":"history","desc":"清代留下的張家住宅，是以紅磚紅瓦砌成的閩式三合院。大厝有前後兩落，連同兩側伸出的廂房和護龍，排出當地所說的「九包五」格局。","area":"梓官區・高雄市"},{"id":6017,"name":"潮旅梓官（蚵子寮漁港）","lat":22.72687,"lng":120.25446,"cat":"scenic","area":"梓官區・高雄市"},{"id":6018,"name":"赤崁劉家古厝","lat":22.73735,"lng":120.2466,"cat":"other","area":"梓官區・高雄市"},{"id":6019,"name":"原日本第六海軍燃料廠(高雄煉油廠)","lat":22.705219,"lng":120.304532,"cat":"history","tag":"歷史建築","desc":"這裡在一九四〇年代是日本海軍的燃料廠，戰後修復後成為中油高雄煉油廠。直到二〇一五年底關廠，這片廠區記錄了臺灣煉油業七十多年的變化。","area":"楠梓區・高雄市","ph":"文"},{"id":6020,"name":"原日本第六海軍燃料廠總辦公廳","lat":22.70337,"lng":120.303788,"cat":"history","tag":"古蹟","desc":"這座磚木混合的辦公廳在一九四三年完工，前後兩棟用走廊相連。當年會計、總務和廠長室都在前棟，後面那一棟則是職員餐廳。","area":"楠梓區・高雄市","ph":"文"},{"id":6021,"name":"台灣基督長老教會楠梓禮拜堂","lat":22.730377,"lng":120.328535,"cat":"worship","tag":"歷史建築","desc":"教會最初在橋頭買下一間店鋪作禮拜堂，後來才遷往楠梓。現在這棟仿希臘羅馬式的兩層教堂由黃曹設計，一九二九年舉行獻堂典禮。","area":"楠梓區・高雄市","ph":"文"},{"id":6022,"name":"右昌森林公園","lat":22.72056,"lng":120.29345,"cat":"nature","desc":"楠梓這座公園裡有遙控飛機飛場和飛行解說中心，飛行是園區的一大主題。解說中心用彎曲屋頂表現氣流，周圍還種了樹、開了水道。","area":"楠梓區・高雄市"},{"id":6023,"name":"楊家古厝","lat":22.712896,"lng":120.288099,"cat":"history","tag":"古蹟","desc":"這座清代閩南式宅院前後共有三落，門多達一百二十扇。建屋時用了咾咕石、三合土和福杉木，石、土、木都成了老屋的一部分。","area":"楠梓區・高雄市","ph":"文"},{"id":6024,"name":"楠梓天后宮","lat":22.727907,"lng":120.330121,"cat":"worship","tag":"古蹟","desc":"三川殿、正殿和後殿各自獨立，左右另有護龍相伴。順著屋頂看，主殿有雙連山牆，兩邊護龍用的是曲線柔和的水形馬背。","area":"楠梓區・高雄市","ph":"文"},{"id":6025,"name":"空中的雨林-R17世運站","lat":22.70145,"lng":120.30236,"cat":"culture","desc":"紅線從南往北穿出半屏山後，第一座高架車站就在這裡。站體外觀像一艘雪白的帆船，把山的綠色和高雄的海港意象放在一起。","area":"楠梓區・高雄市"},{"id":6026,"name":"高雄都會公園","lat":22.73328,"lng":120.31042,"cat":"nature","desc":"這座占地九十五公頃的公園，主要利用昔日台糖青埔農場的土地。樹林間有散步道和涼亭，也有景觀親水池、兒童遊戲場和球場。","area":"楠梓區・高雄市"},{"id":6027,"name":"十鼓橋糖文創園區","lat":22.75885,"lng":120.31308,"cat":"culture","desc":"橋頭糖廠北區的倉庫群，在二〇一一年成了十鼓擊樂團經營的園區。舊倉庫有了鼓樂演出和鼓藝教學，讓糖廠裡多了一種聲音。","area":"橋頭區・高雄市"},{"id":6028,"name":"橋仔頭糖廠","lat":22.755101,"lng":120.313831,"cat":"history","tag":"古蹟","desc":"糖廠的行政中心有殖民時期的陽臺樣式，廠房則留著日治初期的鋼鐵構造。從職工宿舍、水塔到神社遺跡，還能看出製糖人工作的地方與生活圈。","area":"橋頭區・高雄市","ph":"文"},{"id":6029,"name":"橋仔頭糖廠文化景觀","lat":22.752779,"lng":120.315692,"cat":"history","tag":"文化景觀","desc":"園區中段是糖廠最早建成、投入運作的地方，也一直是行政辦公區。北面有倉庫與糖業博物館，南面則是宿舍和藝術村，園內還留有五分車系統。","area":"橋頭區・高雄市","ph":"文"},{"id":6030,"name":"橋仔頭糖廠藝術村/白屋","lat":22.75263,"lng":120.31639,"cat":"culture","desc":"一九〇一年創立的糖廠，百年後迎來了藝術家的駐村計畫。二〇〇一年，橋仔頭文史協會與藝術家合作，開始把老工業遺址轉為文化保存的聚落。","area":"橋頭區・高雄市","ph":"觀"},{"id":6031,"name":"橋頭白樹彩繪村","lat":22.75988,"lng":120.30386,"cat":"other","desc":"二〇一一年，八位創作者來到白樹，在老房子上作畫。從社區信仰中心代天府往兩邊看，有些圖案帶著農村生活的影子，有些則走詼諧路線。","area":"橋頭區・高雄市"},{"id":6032,"name":"橋頭老街（余登發故居）","lat":22.75653,"lng":120.31162,"cat":"structure","desc":"橋頭老家是黨外民選縣長余登發的故居。一九七九年他被捕後，黨外人士在此集結示威，讓這座農家出身政治人物的老宅成為地方民主史的一部分。","area":"橋頭區・高雄市"},{"id":6033,"name":"永安宮","lat":22.81819,"lng":120.22492,"cat":"worship","desc":"廟宇前後有三進，中殿供奉天上聖母。站在廟埕往上看，前殿正脊有雙龍朝仙，垂脊上又有張翅的彩鳳和騰躍的青龍。","area":"永安區・高雄市"},{"id":6034,"name":"永安蘇班長安心漁場","lat":22.83044,"lng":120.2123,"cat":"other","desc":"蘇圓禎是永安石斑魚產銷班班長，在漁場裡介紹石斑魚平日吃些什麼。這裡也把養魚人家的生活做成體驗，像是動手製作迷你膠筏。","area":"永安區・高雄市"},{"id":6035,"name":"永新灣","lat":22.81513,"lng":120.21001,"cat":"scenic","desc":"永安海岸整建後，有了寫著石斑魚故鄉的石牆、漁夫造型裝置和看海的涼亭。除了夕陽，偶爾還能看見載運液化天然氣的船隻進港。","area":"永安區・高雄市"},{"id":6036,"name":"維新彩繪村","lat":22.80601,"lng":120.24544,"cat":"other","desc":"維新里的新舊屋舍之間，居民家的圍牆成了動物畫布。大狗、鯊魚，還有吃花生的土撥鼠，都用立體彩繪營造出快要走出牆面的模樣。","area":"永安區・高雄市"},{"id":6037,"name":"鹽田社區社區彩繪","lat":22.83446,"lng":120.20937,"cat":"other","desc":"昔日鹽田成為野鳥棲息的濕地，隔著一條路就是老紅磚聚落。彩繪替古厝添了顏色，也讓社區有了「迷幻岩村」的稱呼。","area":"永安區・高雄市"},{"id":6038,"name":"劉家百年古厝","lat":22.89301,"lng":120.21821,"cat":"history","desc":"湖內的劉家村留著三棟百年老屋，都是用早年臺灣製造的紅磚砌成。每戶約有百坪，從屋外就能看出老磚宅的規模。","area":"湖內區・高雄市"},{"id":6039,"name":"大湖番茄會社","lat":22.88951,"lng":120.24245,"cat":"history","desc":"這座日治時期臺日合資的番茄工場，早年生產的番茄全供外銷。戰後曾改做鳳梨罐頭，如今老煙囪旁還長著一株百年鳳凰木。","area":"湖內區・高雄市"},{"id":6040,"name":"太陽谷","lat":22.80378,"lng":120.40708,"cat":"scenic","desc":"谷地也叫嫦娥山或嫦娥谷，疏鬆的泥岩受暴雨和烈日侵蝕，留下鋸齒狀山稜。幾乎不長草的環形山谷，還會在湖面映出倒影。","area":"燕巢區・高雄市"},{"id":6041,"name":"田寮月世界","lat":22.886,"lng":120.38898,"cat":"scenic","desc":"田寮這片被稱作月世界的地貌，在地理學上叫作惡地。泥岩受河水、雨水侵蝕與風化，地表能生長的多是箭竹這類耐旱、耐鹽的淺根植物。","area":"田寮區・高雄市"},{"id":6042,"name":"石頭廟（田寮慈玄聖天宮）","lat":22.83569,"lng":120.38654,"cat":"worship","desc":"一九九四年，廟方曾協助因承包商倒閉而失業的泰籍勞工。為了答謝，工人主動幫忙興建後殿，用石頭、珊瑚和貝殼拼貼出「石頭廟」的樣貌。","area":"田寮區・高雄市"},{"id":6043,"name":"小林村紀念公園","lat":23.15425,"lng":120.64019,"cat":"nature","desc":"二〇〇九年莫拉克颱風期間，獻肚山崩落的土石掩埋小林村。紀念公園設在舊村南邊的高地，紀念在這場災難中失去生命的四百六十二位村民。","area":"甲仙區・高雄市"},{"id":6044,"name":"甲仙大橋","lat":23.08059,"lng":120.58484,"cat":"other","desc":"甲仙入口的橋橫跨楠梓仙溪，舊橋在莫拉克風災中受損後，於二〇一〇年重建完成。新橋是長約三百公尺的大跨度鋼拱橋。","area":"甲仙區・高雄市"},{"id":6045,"name":"甲仙貓巷彩繪村","lat":23.08303,"lng":120.58916,"cat":"structure","desc":"甲仙郵局旁這條百公尺長的巷子，上方撐起六種顏色的陽傘。居民、商家和師生一起畫出採芋貓、考古貓等角色，把甲仙的生活放進貓咪的世界。","area":"甲仙區・高雄市"},{"id":6046,"name":"頂崁Q版神明彩繪村","lat":23.0691,"lng":120.57698,"cat":"other","area":"甲仙區・高雄市"},{"id":6047,"name":"九芎林里社貞官伯公","lat":22.910195,"lng":120.573303,"cat":"history","tag":"古蹟","desc":"客家人稱土地公為伯公，九芎林的伯公壇以三塊石材組成的碑石為中心。地方相傳，早年來開拓竹頭背和九芎林的幾個姓氏，共同立下此壇。","area":"美濃區・高雄市","ph":"文"},{"id":6048,"name":"曾文忠美術館","lat":22.89877,"lng":120.5448,"cat":"culture","desc":"畫家曾文忠在永安街的客家夥房長大，常用水彩和油畫描繪美濃。二〇〇〇年，他將祖屋重建為畫廊，展出自己與其他藝術家的作品。","area":"美濃區・高雄市"},{"id":6049,"name":"永安老街","lat":22.89744,"lng":120.5475,"cat":"structure","desc":"美濃開庄時，十六姓先民在這裡建起二十四座夥房，取街名「永安」，盼能長久安居。從敬字亭到東門樓約兩公里，是美濃最早興起的街道之一。","area":"美濃區・高雄市"},{"id":6050,"name":"瀰濃庄敬字亭","lat":22.902182,"lng":120.533882,"cat":"history","tag":"古蹟","desc":"六角形的敬字亭外用清水磚、內以卵石砌成，創建時的磚還曾從福州渡海運來。亭上分出投紙口、通風口等開口，煙囪頂端做成葫蘆形。","area":"美濃區・高雄市","ph":"文"},{"id":6051,"name":"瀰濃庄里社真官伯公","lat":22.898629,"lng":120.533533,"cat":"history","tag":"古蹟","desc":"相傳這是美濃開庄時的伯公壇，中心的砂岩碑石奉祀土地之神。碑額只刻菊花紋，附近欄板上卻有鳳凰、麒麟等色彩豐富的泥塑。","area":"美濃區・高雄市","ph":"文"},{"id":6052,"name":"瀰濃東門樓","lat":22.895588,"lng":120.548872,"cat":"history","tag":"古蹟","desc":"一九三七年改建後的門樓以鋼筋混凝土築成三層，越往上樓面越小。對照日治時期老照片，今天的一樓還留著當時的樣貌。","area":"美濃區・高雄市","ph":"文"},{"id":6053,"name":"竹仔門電廠","lat":22.869468,"lng":120.586336,"cat":"history","tag":"古蹟","desc":"這座發電廠位在荖濃溪和濁口溪匯流處的下游，早年叫竹仔門發電所。一九〇九年興建的廠房裝有四臺發電機，是日治時期的水力設施。","area":"美濃區・高雄市","ph":"文"},{"id":6054,"name":"美濃南隆輔天五穀宮","lat":22.866396,"lng":120.543142,"cat":"worship","tag":"歷史建築","desc":"南隆的五穀宮信仰，起初是羅阿東在自家正廳供奉紙繪的三恩祖像。當時地方正經歷疫病，一九二三年又在羅家正堂舉行開光儀式。","area":"美濃區・高雄市","ph":"文"},{"id":6055,"name":"美濃原鄉緣紙傘文化村","lat":22.88273,"lng":120.54693,"cat":"other","desc":"油紙傘是美濃傳下來的手工藝，源頭和廣東原鄉有關。早期美濃的傘廠常把「廣」字放進名字裡，像廣華興、廣振興和廣德興都是例子。","area":"美濃區・高雄市"},{"id":6056,"name":"美濃客家文物館","lat":22.91107,"lng":120.55754,"cat":"culture","desc":"文物館把美濃常見的菸樓和客家合院融進建築設計。館方從二〇〇一年成立起，就用社區博物館的方式，和居民一起保存地方歷史與文化。","area":"美濃區・高雄市"},{"id":6057,"name":"美濃廣善堂","lat":22.90762,"lng":120.529649,"cat":"worship","tag":"歷史建築","desc":"宣講堂的正面用細緻彩繪與對聯裝飾，是廣善堂容易辨認的地方。屋頂外形沿用傳統民居的樣式，抬頭還能看見支撐屋身的大木構架。","area":"美濃區・高雄市","ph":"文"},{"id":6058,"name":"美濃文創中心","lat":22.89978,"lng":120.54223,"cat":"culture","desc":"永安老街上的這處中心，以既有歷史建築整理成新的文化空間，在二〇一五年底落成。園內高大的老茄苳枝葉茂密，與老建築相伴。","area":"美濃區・高雄市"},{"id":6059,"name":"美濃民俗村","lat":22.89313,"lng":120.51397,"cat":"other","desc":"美濃屬於客家六堆中的右堆，也是高雄最大的客家聚落。民俗村集合地方產業工作者，從人文地理到日常習俗，介紹這座客庄的生活。","area":"美濃區・高雄市"},{"id":6060,"name":"美濃水橋","lat":22.898273,"lng":120.537011,"cat":"history","tag":"古蹟","desc":"獅子頭圳的分支流經美濃溪時遇到高低落差，於是設計了兼具引水和過橋用途的水橋。橋前還立著改築紀念碑，記下工程起訖和設計者。","area":"美濃區・高雄市","ph":"文"},{"id":6061,"name":"美濃湖","lat":22.90736,"lng":120.5515,"cat":"scenic","desc":"一七四八年興建的人工湖，西北面靠山，另外三面圍著田地。湖畔設有環湖步道和自行車道，散步時水面、山景與農田接連出現。","area":"美濃區・高雄市"},{"id":6062,"name":"美濃窯","lat":22.90521,"lng":120.52283,"cat":"culture","desc":"藝術家朱邦雄在靈山山腳成立陶藝工作室，以大型陶壁和公共藝術為創作方向。工作空間向山林敞開，有時也能看見陶壁雕塑製作的過程。","area":"美濃區・高雄市"},{"id":6063,"name":"美濃舊橋","lat":22.898951,"lng":120.542474,"cat":"history","tag":"歷史建築","desc":"早年美濃庄往南得靠渡船過溪，一九三〇年才在派出所對面建起鋼筋混凝土橋。橋下有六座橋墩，連起永安老街與南邊幾處聚落。","area":"美濃區・高雄市","ph":"文"},{"id":6064,"name":"美濃警察分駐所","lat":22.899861,"lng":120.542446,"cat":"history","tag":"歷史建築","desc":"舊分駐所的中央走廊把辦公室和所長宿舍分在兩側。正面入口有圓窗，山牆帶泥塑裝飾，兩側凸出的窗子則用來增加室內採光。","area":"美濃區・高雄市","ph":"文"},{"id":6065,"name":"美濃邱添貴派下夥房","lat":22.899429,"lng":120.540946,"cat":"history","tag":"古蹟","desc":"邱家先人於清咸豐年間在美濃置產，後來成了中庄的代表家族。這座約建於一九二〇年代的夥房，第三進曾在二〇一六年美濃地震中受損。","area":"美濃區・高雄市","ph":"文"},{"id":6066,"name":"金瓜寮聖蹟亭","lat":22.874447,"lng":120.525378,"cat":"history","tag":"古蹟","desc":"當地居民劉添傳興建的敬字亭，以清水磚砌成三層六角形。外觀看似三層，裡頭其實分上下兩層，下層焚字紙，上層奉祀倉頡。","area":"美濃區・高雄市","ph":"文"},{"id":6067,"name":"黃蝶翠谷","lat":22.88405,"lng":120.57739,"cat":"scenic","desc":"谷中長著許多鐵刀木，樹葉正是銀紋淡黃蝶幼蟲的食物。這裡記錄過一百一十種蝴蝶，黃蝶大量飛起時，成群的蝶影是山谷的一大特色。","area":"美濃區・高雄市"},{"id":6068,"name":"龍肚庄里社真官伯公","lat":22.88018,"lng":120.566746,"cat":"history","tag":"古蹟","desc":"龍肚庄的伯公壇以一塊里社真官碑為中心，碑額刻有太極圖案。碑後的卵石堆出隆起的龜背，前方另有供桌與層層相接的池、堂空間。","area":"美濃區・高雄市","ph":"文"},{"id":6069,"name":"光榮碼頭","lat":22.61843,"lng":120.29226,"cat":"other","desc":"愛河出海口與高雄港交會處的十三號碼頭，從前負責載運往來金門、馬祖的人員與物資。後來轉成遊憩空間，在岸邊能同時看到港景與市區高樓。","area":"苓雅區・高雄市"},{"id":6070,"name":"八五大樓","lat":22.61164,"lng":120.30026,"cat":"other","desc":"這棟地上八十五層、地下五層的高樓，加上天線總高三百七十八公尺。它在一九九七年完工，由李祖原建築師團隊將中國元素融入設計。","area":"苓雅區・高雄市"},{"id":6071,"name":"新光碼頭","lat":22.60906,"lng":120.29773,"cat":"other","desc":"八五大樓旁的新光路盡頭，就是這片舊港區。碼頭透過公共藝術作品與休憩設施重新整理，多了能在港邊停留的空間。","area":"苓雅區・高雄市"},{"id":6072,"name":"正義車站","lat":22.63471,"lng":120.34266,"cat":"other","desc":"兩座對稱的出入口有如山形，屋面曲線則取自衝浪板，玻璃帷幕負責引進日光。站南側民宅外牆還有何彥霖創作的《天空之門》壁畫。","area":"苓雅區・高雄市"},{"id":6073,"name":"自來水公園","lat":22.62729,"lng":120.3149,"cat":"nature","desc":"公園裡彩色大球的前身，是一九六〇年興建的蓄水塔，高達三十八公尺。停用後水塔漆上七彩顏色，舊的自來水輸配管線也一起保存。","area":"苓雅區・高雄市"},{"id":6074,"name":"苓雅寮陳進丁古宅","lat":22.613696,"lng":120.29825,"cat":"history","tag":"歷史建築","desc":"陳進丁在一九一七年買下過田仔的土地時，打狗正展開第二期築港工程。這一帶後來劃入市區商業地域，陳家宅子則在一九四一年建成。","area":"苓雅區・高雄市","ph":"文"},{"id":6075,"name":"衛武迷迷村(苓雅國際壁畫區)","lat":22.62716,"lng":120.34393,"cat":"culture","desc":"衛武營附近的老社區，從二〇一六年苓雅國際街頭藝術節開始，陸續迎來各國藝術家。居民家的大片外牆成了畫布，壁畫散在日常生活的巷弄裡。","area":"苓雅區・高雄市"},{"id":6076,"name":"陳中和紀念館","lat":22.613389,"lng":120.295572,"cat":"culture","tag":"歷史建築","desc":"清末苓雅寮一頭連著海邊，一頭通往鳳山，已是重要市街。這座私人宅第是高雄早期的西式洋樓，在當時民間自己興建的房屋中相當少見。","area":"苓雅區・高雄市","ph":"文"},{"id":6077,"name":"高雄市文化中心","lat":22.6258,"lng":120.31814,"cat":"culture","desc":"文化中心自民國七十年成立，戶外有七公頃多的綠地。裡頭的至德堂和至善廳提供演出空間，旁邊廣州一街上也聚集了許多畫廊。","area":"苓雅區・高雄市"},{"id":6078,"name":"高雄市私立三信家商學生活動中心","lat":22.622051,"lng":120.32878,"cat":"history","tag":"歷史建築","desc":"學生活動中心的樑柱乍看像木造，其實使用的是混凝土。設計大量採用仿木構的形式，搭配Ｔ形小樑，讓整體看起來比材料本身輕盈。","area":"苓雅區・高雄市","ph":"文"},{"id":6079,"name":"高雄市私立三信家商波浪教室","lat":22.622051,"lng":120.32878,"cat":"history","tag":"歷史建築","desc":"教室原有的階梯一路延伸到走廊，在外觀留下起伏的波浪形線條。牆面採用清水模工法，讓混凝土本身的質地也成了建築的特色。","area":"苓雅區・高雄市","ph":"文"},{"id":6080,"name":"高雄關帝廟(武廟)","lat":22.63027,"lng":120.33155,"cat":"worship","desc":"居民也叫這裡武廟，早年的名字是「關帝廳」。主殿奉祀關羽，配祀註生娘娘和福德正神，後殿則供奉觀音、普賢與文殊菩薩。","area":"苓雅區・高雄市"},{"id":6081,"name":"多納屯子役古戰場","lat":22.91636,"lng":120.71216,"cat":"other","desc":"多納部落入口的這處隘口，記下日治初期族人聯合鄰近部落反抗壓迫的歷史。日方稱當時的事件為「屯子役」，後來的地名也沿用了這個讀音。","area":"茂林區・高雄市","ph":"觀"},{"id":6082,"name":"多納石板屋","lat":22.91088,"lng":120.71598,"cat":"history","desc":"早年多納居民會到溫泉溪取黑灰色板岩，互相幫忙堆砌房屋。族人把石板分公母，較黑、較厚重的公石板常拿來當屋頂或床鋪。","area":"茂林區・高雄市","ph":"觀"},{"id":6083,"name":"多納高吊橋","lat":22.91453,"lng":120.68841,"cat":"scenic","desc":"龍頭山上這座吊橋橫跨濁口溪，位在萬山與多納之間。橋身長二百三十二公尺，離溪谷一百零三公尺，建橋歷史也和日治時期的部落往來有關。","area":"茂林區・高雄市","ph":"觀"},{"id":6084,"name":"得樂日嘎橋","lat":22.88345,"lng":120.65452,"cat":"other","desc":"莫拉克風災損毀茂林的對外道路，重建的橋梁在二〇一三年完工。八百八十公尺長的橋身取名「得樂日嘎」，用的就是茂林的魯凱族語發音。","area":"茂林區・高雄市"},{"id":6085,"name":"情人谷","lat":22.87588,"lng":120.66683,"cat":"scenic","desc":"魯凱族語稱這處山谷為「吐拔魯」，位置在濁口溪的一條支流。峽谷裡有清溪和瀑潭，吊橋橫跨水面，下方還能見到平坦的溪地。","area":"茂林區・高雄市"},{"id":6086,"name":"情人谷","lat":22.88466,"lng":120.66647,"cat":"scenic","area":"茂林區・高雄市","ph":"觀"},{"id":6087,"name":"茂林入口意象公園","lat":22.88052,"lng":120.64995,"cat":"nature","desc":"群山環繞的公園是進入茂林部落時的一處休憩空間。從園內可以遠眺得樂日嘎橋，看橋身橫過山間的景色。","area":"茂林區・高雄市","ph":"觀"},{"id":6088,"name":"茂林環境教育中心","lat":22.88626,"lng":120.66334,"cat":"other","desc":"茂林以越冬的紫斑蝶著名，也有山谷地形與原住民族文化。環境教育中心串聯地方社區和學校等夥伴，把這些在地特色做成課程。","area":"茂林區・高雄市","ph":"觀"},{"id":6089,"name":"茂林紫蝶幽谷","lat":22.88766,"lng":120.66314,"cat":"scenic","desc":"茂林紫斑蝶生態公園是當地賞蝶季的主要活動地點。沿著園內的步道接上紫蝶幽谷賞蝶步道，有機會看到成群蝴蝶一起飛舞。","area":"茂林區・高雄市","ph":"觀"},{"id":6090,"name":"茂林谷","lat":22.89138,"lng":120.67359,"cat":"scenic","desc":"濁口溪和木勝溪在這裡會合，谷地的魯凱族語原名「羅木斯」，意思是美麗的山谷。兩股水流在彎曲岩壁旁匯聚，形成深藍色的水潭。","area":"茂林區・高雄市"},{"id":6091,"name":"茂林遊客中心","lat":22.88585,"lng":120.66338,"cat":"other","desc":"二〇二四年啟用的遊客中心，把魯凱族傳統元素融入設計。館內有觸控導覽牆和互動電視牆，可以先認識茂林的自然景觀與部落文化。","area":"茂林區・高雄市","ph":"觀"},{"id":6092,"name":"白雲寺","lat":22.90966,"lng":120.18306,"cat":"worship","desc":"寺院背靠白砂崙的沙丘，面向古瀉湖淤積形成的平原。供奉釋迦牟尼佛的殿宇採宮殿式樣，以黃色琉璃瓦搭配朱紅色樑柱。","area":"茄萣區・高雄市"},{"id":6093,"name":"茄萣膠筏協會-漁家說家常","lat":22.9151,"lng":120.18218,"cat":"other","desc":"茄萣漁人關心的二仁溪，曾深受污染，整治後溪畔開始長出紅樹林。招潮蟹和彈塗魚也跟著出現，成了協會向來客介紹的河岸景象。","area":"茄萣區・高雄市"},{"id":6094,"name":"金鑾宮","lat":22.89509,"lng":120.18362,"cat":"worship","desc":"廟門上的神像彩繪，出自畫師潘麗水之手。這座廟宇也留下百餘年來，沿海漁民靠海生活、寄託信仰的故事。","area":"茄萣區・高雄市"},{"id":6095,"name":"竹滬明寧靖王廟-華山殿","lat":22.86342,"lng":120.2289,"cat":"worship","area":"路竹區・高雄市"},{"id":6096,"name":"高雄科學園區-尋找公共藝術","lat":22.83081,"lng":120.25604,"cat":"nature","desc":"園區橫跨路竹、岡山和永安三區，面積約五百七十公頃。這片園地聚集的產業包括光電、精密機械，以及以醫療器材為主的生技業。","area":"路竹區・高雄市"},{"id":6097,"name":"高雄路竹天后宮","lat":22.86622,"lng":120.25488,"cat":"worship","desc":"路竹居民早年在中山路建廟，後來街市逐漸擴大，舊廟已沒有擴建空間。一九七九年決定另建新廟，市區舊廟也保留下來，形成新舊並存的格局。","area":"路竹區・高雄市"},{"id":6098,"name":"二仁溪親水公園","lat":22.88629,"lng":120.33049,"cat":"nature","desc":"二仁溪是高雄與臺南的界河，中游曾聚集廢五金回收與提煉工廠，水質一度嚴重惡化。從二〇〇一年起大力整治後，河岸才漸漸恢復生機。","area":"阿蓮區・高雄市"},{"id":6099,"name":"澄清湖棒球場","lat":22.6546,"lng":120.35905,"cat":"other","desc":"澄清湖畔這座球場是南部職棒的重要場地。二〇〇一年世界盃棒球錦標賽預賽，臺灣與美國交手時，曾有兩萬五千名觀眾進場。","area":"鳥松區・高雄市"},{"id":6100,"name":"原日本海軍鳳山無線電信所","lat":22.630119,"lng":120.373945,"cat":"history","tag":"古蹟","desc":"鳳山這座無線電信所在一九一七年興建，是日治時期臺灣三大無線電信所之一。戰後這裡曾被用來偵訊、拘禁政治受難者，也曾是軍方的管訓場所。","area":"鳳山區・高雄市","ph":"文"},{"id":6101,"name":"台糖鳳山園藝休閒廣場","lat":22.61469,"lng":120.35843,"cat":"nature","desc":"五甲這片戶外展場把花市、園藝造景和美食放在一起，散步時能一路看不同的花木。旁邊就是衛武營公園，一側還鄰近澄清湖。","area":"鳳山區・高雄市"},{"id":6102,"name":"大東文化藝術中心","lat":22.62497,"lng":120.36349,"cat":"other","desc":"半透明的薄膜天棚像一排熱氣球，懸在半開放的廣場上方。白天光線透過天棚落下，夜裡則由燈光和噴泉映照著藝術中心。","area":"鳳山區・高雄市"},{"id":6103,"name":"曹公廟/平成砲台","lat":22.62771,"lng":120.35704,"cat":"worship","desc":"鳳山人為紀念清代知縣曹謹而建了這座廟。廟前廣場南側的石碑中，有四塊長條花崗石拼成「曹公圳記」，記下水圳命名與曹謹的功績。","area":"鳳山區・高雄市"},{"id":6104,"name":"東便門(同儀門)/東福橋","lat":22.62149,"lng":120.36308,"cat":"history","desc":"清代鳳山縣新城留下的城門中，東便門仍保有原來的模樣。旁邊的東福橋跨過鳳山溪，讓人能一起看見當年縣城的城門和溪上橋梁。","area":"鳳山區・高雄市"},{"id":6105,"name":"澄瀾砲台","lat":22.62393,"lng":120.35472,"cat":"history","desc":"鳳山縣新城西南角留下的不規則八角形砲台，是古城現存的三座砲台之一。沿著兩側翼牆還能看見舊孔洞，從上方可以望向護城河。","area":"鳳山區・高雄市"},{"id":6106,"name":"衛武營國家藝術文化中心","lat":22.623,"lng":120.34244,"cat":"culture","desc":"白色屋頂起伏得像波浪，遠看整座建築又像一艘太空船。裡面容納歌劇院、音樂廳等不同表演場地，外頭則是一大片與都會公園相鄰的草地。","area":"鳳山區・高雄市"},{"id":6107,"name":"衛武營都會公園","lat":22.61977,"lng":120.33954,"cat":"nature","desc":"高低起伏的草坡間保留了遮蔭的老樹，鳥兒也在這裡築巢。這座市區公園是居民爭取數十年才實現的，當年他們叫它「綠色之夢」。","area":"鳳山區・高雄市"},{"id":6108,"name":"訓風砲台","lat":22.61984,"lng":120.36192,"cat":"history","desc":"龍山寺後方的弧形石牆，是昔日鳳山溪通往出海口的砲台遺構。牆裡嵌著「訓風」橫額，額上左右兩側做成泥塑書卷的模樣。","area":"鳳山區・高雄市"},{"id":6109,"name":"鳳儀書院","lat":22.627162,"lng":120.359501,"cat":"history","tag":"古蹟","desc":"這裡曾是生員讀書和參加歲試的地方，院內也祭祀文昌等神祇。門廳前的照壁和正門兩旁的石鼓，仍能看出當年建造書院的講究。","area":"鳳山區・高雄市","ph":"文"},{"id":6110,"name":"鳳山仙公廟","lat":22.61535,"lng":120.35534,"cat":"worship","desc":"居民俗稱的仙公廟，正式名稱是鳳山鎮南宮，供奉呂洞賓、李鐵拐與神農大帝。廟前有九龍池，影壁上還能看到八仙過海的故事。","area":"鳳山區・高雄市"},{"id":6111,"name":"鳳山城隍廟","lat":22.62726,"lng":120.35919,"cat":"worship","desc":"正殿供奉城隍爺，廟裡最有意思的兩件文物是「你來了」木匾和一面大算盤。前者提醒人終須向城隍報到，後者象徵計算一生的善惡功過。","area":"鳳山區・高雄市"},{"id":6112,"name":"鳳山基督長老教會","lat":22.6284,"lng":120.36099,"cat":"worship","desc":"古鳳山北門一帶的白色教堂，源於馬雅各醫師在當地購地宣教。如今的建築有高聳的仿哥德式雙塔，扇形階梯上方立著醒目的十字架。","area":"鳳山區・高雄市"},{"id":6113,"name":"鳳山天公廟","lat":22.62521,"lng":120.35975,"cat":"worship","desc":"居民口中的天公廟，正式名稱是供奉玉皇上帝的「鳳邑玉皇宮」。早年這裡只是土階茅屋，隨香火漸盛，才有今天金碧輝煌的規模。","area":"鳳山區・高雄市"},{"id":6114,"name":"鳳山溪綠園道","lat":22.61713,"lng":120.35957,"cat":"nature","desc":"整治後的鳳山溪沿岸成了居民散步的綠帶，全長約八公里。沿路串起大東文化藝術中心、東便門和訓風砲台，也把新舊鳳山連在一起。","area":"鳳山區・高雄市"},{"id":6115,"name":"鳳山縣城殘蹟","lat":22.627758,"lng":120.356489,"cat":"history","tag":"古蹟","desc":"東便門是用咾咕石砌成的單拱城門，旁邊東福橋的橋墩像一艘艘六角形小船。散布在舊城範圍裡的三座砲台，也都保留了咾咕石牆基。","area":"鳳山區・高雄市","ph":"文"},{"id":6116,"name":"鳳山黃埔新村","lat":22.618725,"lng":120.363507,"cat":"history","tag":"文化景觀","desc":"陸軍官校對面的房舍在日治時期落成，戰後成了軍人眷屬的住處。這裡原名誠正新村，等到陸軍軍官學校在鳳山復校，才改稱黃埔新村。","area":"鳳山區・高雄市","ph":"文"},{"id":6117,"name":"鳳山龍山寺","lat":22.620735,"lng":120.362093,"cat":"worship","tag":"古蹟","desc":"這座清代古寺的起源，流傳著一則石榴樹的故事。相傳旅人把觀音香火遺在井旁樹上，鄉人見香火夜裡發光，便以樹木雕成觀音像奉祀。","area":"鳳山區・高雄市","ph":"文"},{"id":6118,"name":"原高雄市役所（高雄市立歷史博物館）","lat":22.627041,"lng":120.286761,"cat":"culture","tag":"古蹟","desc":"愛河畔的舊市政府是二二八事件的歷史現場，也曾見證高雄半個世紀的市政。市府遷走後，老建築改成博物館，用文物與展覽說高雄的故事。","area":"鹽埕區・高雄市","ph":"文"},{"id":6119,"name":"市民廣場","lat":22.62557,"lng":120.28558,"cat":"nature","desc":"鹽埕舊圓環改成了廣場，中央的噴泉會配合音樂和燈光展演。沿著林蔭步道散步，還能看到立體藝術燈箱，以及運用光雕設計的景觀牆。","area":"鹽埕區・高雄市"},{"id":6120,"name":"高雄市二二八和平公園","lat":22.62551,"lng":120.28763,"cat":"nature","desc":"愛河西岸的新紀念碑刻著二二八事件始末，讓人能在適合閱讀的高度駐足。通往紀念廣場的牆面上，留有一百六十八位可考受難者的姓名。","area":"鹽埕區・高雄市"},{"id":6121,"name":"高雄市立電影館","lat":22.62244,"lng":120.28878,"cat":"culture","desc":"愛河邊這座小巧的場館，是高雄早期專門推廣電影文化的地方。除了觀賞電影，館內也收藏電影書籍、藝術影片和紀錄片。","area":"鹽埕區・高雄市"},{"id":6122,"name":"高雄市音樂館","lat":22.62743,"lng":120.28646,"cat":"culture","desc":"愛河畔的白色五層樓建築裡，演奏廳是室內樂和音樂發表會的場地。戶外另有音樂廣場，和河岸綠地相連，演奏時河邊也聽得到樂聲。","area":"鹽埕區・高雄市"},{"id":6123,"name":"內惟李氏古宅","lat":22.662771,"lng":120.279366,"cat":"history","tag":"古蹟","desc":"李榮在內惟興建這座洋樓，以中央主廳和突出的門廊為中軸，左右對稱。四周繞著拱廊，門廊上的西式柱頭和圓弧山牆最容易辨認。","area":"鼓山區・高雄市","ph":"文"},{"id":6124,"name":"內惟車站","lat":22.66613,"lng":120.28719,"cat":"other","desc":"內惟舊稱「內圍」，名稱和早年聚落用土石或竹籬作圍牆有關。車站把這段歷史化成弧形的林帶，再搭配景觀濕地，呈現地方的水塘風貌。","area":"鼓山區・高雄市"},{"id":6125,"name":"原愛國婦人會館(紅十字育幼中心)","lat":22.623947,"lng":120.273348,"cat":"history","tag":"古蹟","desc":"這棟曾作紅十字育幼中心的會館，最醒目的是層層疊砌的紅磚。磚牆也是承擔整棟建築重量的主要構造，從外觀就能看出它的做法。","area":"鼓山區・高雄市","ph":"文"},{"id":6126,"name":"哈瑪星鐵道文化園區","lat":22.62122,"lng":120.27744,"cat":"culture","desc":"這片園區保留了哈瑪星昔日的鐵道支線，老火車也停在這裡。除了沿著軌道看港都鐵路留下的風景，還能走進懷舊的「嘟嘟火車」。","area":"鼓山區・高雄市"},{"id":6127,"name":"哨船頭山碉堡(西子灣)","lat":22.62063,"lng":120.268,"cat":"history","desc":"山上的觀景平台繞著二次大戰留下的碉堡而建，和打狗英國領事館的山上官邸遙遙相對。從平台能俯看哈瑪星的屋頂，視線還能一路越過高雄港到旗津。","area":"鼓山區・高雄市"},{"id":6128,"name":"壽山Love情人觀景台","lat":22.62548,"lng":120.27401,"cat":"other","desc":"忠烈祠旁的平台用三十二種愛的宣言做成飾板，也放了可以傳聲的裝置藝術。旁邊三座獼猴石雕各有寓意，往山下看則是港都的山海景色。","area":"鼓山區・高雄市"},{"id":6129,"name":"新濱町一丁目連棟紅磚街屋","lat":22.620116,"lng":120.274066,"cat":"structure","tag":"歷史建築","desc":"兩層高的紅磚街屋連成一排，每戶立面以四柱分出三扇窗。牆上可見洗石子、面磚等不同材質，抬頭還能找到女兒牆上的幾何裝飾。","area":"鼓山區・高雄市","ph":"文"},{"id":6130,"name":"棧二庫、棧二之一庫","lat":22.618916,"lng":120.277197,"cat":"history","tag":"歷史建築","desc":"高雄舊港區這兩座倉庫為了方便搬運貨物，把內部留成沒有柱子的寬闊空間。從大片捲門往上看，鋼製屋架跨過了整個庫房。","area":"鼓山區・高雄市","ph":"文"},{"id":6131,"name":"武德殿","lat":22.624518,"lng":120.272523,"cat":"worship","tag":"古蹟","desc":"這裡原是練習傳統武藝的場所，建築兼有佛寺、宮殿和神社的特色。正門有弧形的唐破風，簷下柱子上的箭與靶浮雕也呼應了原來的用途。","area":"鼓山區・高雄市","ph":"文"},{"id":6132,"name":"美術館車站","lat":22.65153,"lng":120.28117,"cat":"culture","desc":"鄰近高雄市立美術館的車站，以水波的曲線設計建築。防洪設施融入綠化斜坡，周圍還有水景、植栽和可散步停留的林間小徑。","area":"鼓山區・高雄市"},{"id":6133,"name":"舊三和銀行","lat":22.622107,"lng":120.274505,"cat":"history","tag":"歷史建築","desc":"哈瑪星商業興盛時留下的銀行，外牆以土黃色面磚和洗石子裝飾。骨架雖是鋼筋混凝土，屋內的天花板卻用竹筋夾泥做成。","area":"鼓山區・高雄市","ph":"文"},{"id":6134,"name":"舊打狗驛","lat":22.621742,"lng":120.275442,"cat":"culture","tag":"歷史建築","desc":"日治時期，港站通往碼頭貨倉的鐵道支線叫作「濱線」，日語讀音成 /* ---------- 幾何 ---------- */
const R = 6371000, rad = x => x*Math.PI/180;
function dist(a,b){const p1=rad(a[0]),p2=rad(b[0]),dp=p2-p1,dl=rad(b[1]-a[1]);
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function bearing(a,b){const p1=rad(a[0]),p2=rad(b[0]),dl=rad(b[1]-a[1]);
  const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360}
function move(p,deg,m){const d=m/R,b=rad(deg),la=rad(p[0]),lo=rad(p[1]);
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return [la2*180/Math.PI,lo2*180/Math.PI]}
const norm180 = a => ((a%360)+540)%360-180;
const fmt = m => m>=1000?[(m/1000).toFixed(1),'公里']:[String(Math.round(m)),'公尺'];

/* ---------- 選目的地：環帶內按距離加權，近的機率高，避開剛去過的 ----------
   選的距離內沒有地點就不硬抽：回傳 {none, near}，讓玩家自己決定要不要走遠 */
function draw(pos, band){
  const recent = rec('recent'), cur = S.target && S.target.id;
  const all = PLACES.map(p=>({p,d:dist(pos,[p.lat,p.lng])})).filter(x=>x.p.id!==cur && x.d>=60);
  const long=navigation && LONG_BANDS[band-BANDS.length];
  const candidates=long ? all.filter(x=>x.d>=long.min && x.d<long.max) : all;
  let pool = candidates.filter(x=>!recent.includes(x.p.id));
  if (!pool.length) pool = candidates;
  let ring=pool;
  if (!long){
    const b = BANDS[band];
    ring = pool.filter(x=>x.d>=b.min && x.d<=b.max);
    if (ring.length<4) ring = pool.filter(x=>x.d<=b.max);
    if (!ring.length) return {none:true, near: pool.sort((a,b)=>a.d-b.d)[0] || null};
  } else if (!ring.length) return {none:true};
  const w = ring.map(x=>1/Math.max(x.d,120)**2), sum = w.reduce((a,c)=>a+c,0);
  let r = Math.random()*sum;
  for (let i=0;i<ring.length;i++){ if((r-=w[i])<=0) return ring[i]; }
  return ring[ring.length-1];
}

/* ---------- 狀態 ---------- */
const S = {phase:'ready', band:1, pos:null, acc:0, heading:null, sim:false, target:null, startD:0,
  shown:0, voice:store.get('voice',true), last:{}, lastMoveAt:Date.now(), saidHalf:false, saidNear:false,
  behindSince:0, lastFarAt:0, watch:null, lock:null, act:null, actUntil:0, anim:'', animAt:0, flip:false,
  fixAt:0, hitFix:0, hits:0, cardT:0, offer:null, forcedSim:false, walked:0, walkFrom:null, memo:null};

function act(name, ms){ S.act=name; S.actUntil=Date.now()+ms; }

/* 語音：先播預錄的 Breeze 音檔（voice/<事件>_<第幾句>.mp3，到達一律是 voice/arrived.mp3）；
   載不到或被擋才退回瀏覽器內建 TTS。同一個 <audio> 重複用，第一次在使用者點按時播放後，iOS 才放行之後的播放 */
const voiceEl = new Audio(); voiceEl.preload = 'auto';
function speak(line, src){
  if (!S.voice) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const fallback = ()=>{ if (!('speechSynthesis' in window) || $('say').textContent!==line) return; try{
    const u = new SpeechSynthesisUtterance(line); u.lang='zh-TW'; u.rate=1; u.pitch=1.1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} };
  voiceEl.onerror = fallback;
  voiceEl.src = src; voiceEl.currentTime = 0;
  const p = voiceEl.play(); if (p && p.catch) p.catch(e=>{ if (e && e.name!=='AbortError') fallback(); });
}
const URGENT = {greet:1, arrived:1, bye:1};   // 這幾句可以打斷正在講的話，其他的等講完
function say(ev, vars={}){
  const now = Date.now(); if (S.last[ev] && now-S.last[ev] < 12000) return false;
  if (!URGENT[ev] && S.voice && !voiceEl.paused && !voiceEl.ended) return false;
  S.last[ev]=now;
  const list = LINES[ev], i = Math.floor(Math.random()*list.length);
  const line = list[i];
  const el = $('say'); el.textContent = line; el.classList.add('on');
  clearTimeout(say.t); say.t = setTimeout(()=>el.classList.remove('on'), 5000);
  speak(line, ev==='arrived' ? 'voice/arrived.mp3' : `voice/${ev}_${i}.mp3`);
  return true;
}

/* ---------- 定位與指南針 ---------- */
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;
  if (h==null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  if (S.heading==null && !S.sim && S.started) $('mode').textContent = 'GPS 實走';   // 指南針晚一點才醒
  S.heading = (h + so + 360) % 360;
}
const orientEv = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
let sensorSerial = 0;
let currentSession = null;
let receiveNative = null;
let cancelFirstFix=null;
function resetFixes(){
  S.anchor=null; S.hits=0; S.heading=null; S.lastTimestamp=0;
  S.hitFix=S.fixAt; S.behindSince=0; S.lastMoveAt=Date.now();
}
function updatePosition(p){
  const {latitude,longitude,accuracy,speed} = p.coords;
  if (![latitude,longitude,accuracy,p.timestamp].every(Number.isFinite) || accuracy<0 ||
      p.timestamp<=S.lastTimestamp || Date.now()-p.timestamp>2000) return false;
  S.lastTimestamp=p.timestamp;
  const np=[latitude,longitude];
  if (!S.anchor || dist(S.anchor,np)>4 || speed>0.6){
    if (S.anchor) S.lastMoveAt=Date.now();
    S.anchor=np;
  }
  S.pos=np; S.acc=accuracy; S.fixAt++;
  tick();
  return true;
}
async function keepAwake(){
  if (native){native.postMessage({action:'awake',enabled:true});return}
  try{
    if (!navigator.wakeLock) return;
    const lock=await navigator.wakeLock.request('screen');
    if (S.phase==='walking') S.lock=lock;
    else await lock.release();
  }catch(e){}
}
// 收工、轉模擬時把定位、指南針、螢幕常亮都關掉；下次出發重新取得（臨時定位失敗的人也能重試）
function stopSensors(notifyStop=true,notifyAwake=true){
  cancelFirstFix?.(); cancelFirstFix=null;
  if (receiveNative) removeEventListener('lukangNative',receiveNative);
  receiveNative=null;
  if (native && notifyStop && currentSession!==null) native.postMessage({action:'stop',session:currentSession});
  currentSession=null;
  $('notificationWarning').hidden=true;
  if (native && notifyAwake) native.postMessage({action:'awake',enabled:false});
  if (S.watch!==null){ try{ navigator.geolocation.clearWatch(S.watch); }catch(e){} S.watch=null; }
  removeEventListener(orientEv, onOrient);
  if (S.lock){ try{ S.lock.release(); }catch(e){} } S.lock=null;
  resetFixes(); S.acc=0;
}
function listenToNative(session, finishFirstFix){
  receiveNative=({detail})=>{
    if (currentSession!==session || detail?.session!==session) return;
    switch(detail.type){
      case 'position':
        if (updatePosition(detail)) finishFirstFix?.(true);
        break;
      case 'heading':
        S.heading=Number.isFinite(detail.degrees)?detail.degrees:null;
        if (S.started && S.phase==='walking'){
          $('mode').textContent=S.heading===null?'GPS（無指南針）':'GPS 實走';
          if (navigation) refreshWalkDisplay(); else tick();
        }
        break;
      case 'pause':
        if (nativeJournal && tripID && !S.sim) previousLegs=null;
        resetFixes(); break;
      case 'error':
        if (finishFirstFix?.(false)){S.locationFailure=detail.reason;break}
        if (S.phase==='arrived'){stopSensors(); S.started=false;break}
        finishJournal('interrupted');
        reset();
        useSim(detail.reason==='approximate'?'目前只允許大概位置，先在鹿港天后宮前模擬走走。':'定位中斷了，先在鹿港天后宮前模擬走走。');

    }

}
async function startSensors(){
  const session = ++sensorSerial;
  currentSession=session;
  S.locationFailure=null;
  resetFixes();
  return new Promise(res=>{
    let waiting=true;
    const timer=setTimeout(()=>finish(false),12000);
    function finish(ok){
      if (!waiting) return false;
      waiting=false; cancelFirstFix=null; clearTimeout(timer); res(ok);
      return true;
    }
    cancelFirstFix=()=>finish(false);
    if (native){
      listenToNative(session,finish);
      native.postMessage({action:'start',session});
      return;
    }
    if (!navigator.geolocation){finish(false);return}
    if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(permission=>{
        if (currentSession===session && permission==='granted') addEventListener(orientEv,onOrient);
      }).catch(()=>{});
    } else addEventListener(orientEv,onOrient);
    try{
      S.watch = navigator.geolocation.watchPosition(p=>{
        if (currentSession===session && updatePosition(p)) finish(true);
      },()=>finish(false),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
    }catch(e){finish(false)}

}
function useSim(reason){
  stopSensors();   // 模擬時方向由模擬按鈕決定，不讓真的指南針搶
  S.sim = true; S.acc = 5; if (S.heading==null) S.heading = 0;
  const tm = PLACES.find(p=>p.id===SIM_HOME) || PLACES[0];
  S.pos = move([tm.lat,tm.lng], 200, 30);
  $('mode').textContent='模擬行走';
  $('foot').textContent = reason;
}

/* ---------- 流程 ---------- */
async function go(){
  freshWalkPage=false;
  if (S.phase==='ready' && !S.started){
    S.started = true; $('go').disabled = true; $('go').textContent='找方向中…';
    if (!S.offer) say('greet'); // 在使用者點按時先開口，iOS 才肯放聲音
    if (S.sim){ S.acc=5; S.heading ??= 0; }
    const request = S.sim ? null : startSensors();
    const session = currentSession;
    const ok = request ? await request : true;
    if (!S.started || S.phase!=='ready' || session!==currentSession) return;
    if (!S.sim){
      if (!ok){
        S.offer=null;
        const reason={denied:'未取得定位權限',approximate:'目前只允許大概位置'}[S.locationFailure]||'拿不到目前位置';
        useSim(native?reason+'，先在鹿港天后宮前模擬走走。':'拿不到定位（需要 HTTPS 網址並允許定位），先在鹿港天后宮前模擬走走。');
      }
      else if (S.band<BANDS.length && !PLACES.some(p=>dist(S.pos,[p.lat,p.lng])<=NO_PLACE)){ S.offer=null; useSim('你附近 5 公里內還沒有收錄的地點，先在鹿港天后宮前模擬走走。'); }
      else { $('mode').textContent = S.heading==null?'GPS（無指南針）':'GPS 實走'; $('foot').textContent=''; }
    }
    $('go').disabled=false;
  }
  pick();
}
function pick(){
  // 上一次說「這個距離內沒有」，玩家按了「那就走遠一點」→ 直接去最近那處
  let x = draw(S.pos, S.band);
  if (S.offer && S.phase==='ready' && x.none && x.near?.p.id===S.offer.p.id) x=x.near;
  S.offer = null;
  if (x.none){
    if (S.phase==='walking'){ $('sub').textContent = '這個距離內沒有別的地方了'; return; }
    const n = x.near;
    S.offer = n;
    S.started=false; stopSensors();
    $('hint').textContent = n ? offerHint(n) : S.band>=BANDS.length ? '這個距離範圍沒有收錄地點，換個距離試試。' : '附近沒有可以去的地方';
    $('go').textContent = n ? '那就走遠一點' : '出門散步吧';
    return;
  }
  recSet('drawn', rec('drawn',0)+1);
  if (nativeJournal){
    if (tripID) previousLegs=journalDistance();
    else { tripID=crypto.randomUUID(); previousLegs=0; }
    if (navigation && !S.sim) try{ localStorage.setItem('lukangNavBand',JSON.stringify({id:tripID,band:S.band})); }catch(e){}
  }
  showWalk(x.p,x.d);
  if (nativeJournal){
    const target={id:tripID,isSimulated:S.sim,placeID:x.p.id,name:x.p.name,area:x.p.area || '',
                  latitude:x.p.lat,longitude:x.p.lng};
    native.postMessage(S.sim ? {action:'journalBegin',...target} : {action:'target',session:currentSession,...target});
  } else if (backgroundWalk && !S.sim){
    native.postMessage({action:'target',session:currentSession,placeID:x.p.id,latitude:x.p.lat,longitude:x.p.lng});
  }
}
function journalDistance(){
  return previousLegs===null || S.walked===null ? null : previousLegs+S.walked;
}
function offerHint(n){
  return navPrefs.hideDistance ? '這個距離內沒有地點，可以走遠一點。' : `這個距離內沒有地點，最近一處約 ${fmt(n.d).join(' ')}`;
}
function finishJournal(status,stop=null){
  if (nativeJournal && tripID && S.phase==='walking')
    native.postMessage({action:'journalFinish',id:tripID,status,walked:journalDistance(),stop});
}
function showWalk(place,distance){
  freshWalkPage=false;
  try{ const pre = new Audio(); pre.preload='auto'; pre.src='voice/arrived.mp3'; }catch(e){}
  if (place.ph){ const im = new Image(); im.src = `photos/${place.id}.webp`; }
  S.walked=distance===null?null:0; S.walkFrom=S.pos;
  S.target=place; S.startD=distance; S.saidHalf=false; S.saidNear=false; S.phase='walking';
  S.pickAt=Date.now(); S.lastFarAt=S.pickAt; S.hits=0;
  $('hint').textContent = '這次要去：' + (HINT[place.cat]||HINT.other);
  $('bands').hidden = true; $('go').hidden = true; $('walkrow').hidden = false;
  $('photoAlbum').hidden=true;
  $('journalNote').hidden=!nativeJournal || !tripID;
  $('distanceHint').hidden=!navigation; $('dist').classList.toggle('pressable',navigation);
  $('go').disabled=false; $('redraw').disabled=!S.pos;
  $('sim').classList.toggle('on',S.sim);
  void keepAwake();
  if (navigation) refreshWalkDisplay();
  tick(true);
}
function arrive(){
  const t=S.target;
  const previous=rec('seen');
  const seen=previous.includes(t.id)?previous:[...previous,t.id];
  const recent=[t.id,...rec('recent').filter(i=>i!==t.id)].slice(0,12);
  const prefix=S.sim?'sim_':'';
  saveValues({[prefix+'seen']:seen,[prefix+'recent']:recent});
  if (S.sim) finishJournal('arrived',seen.length);
  stopSensors();
  if (native) native.postMessage({action:'arrived'});
  else try{ navigator.vibrate && navigator.vibrate([60,40,120]); }catch(e){}
  const visitID=nativeJournal ? tripID : nativePhotos && S.sim ? crypto.randomUUID() : null;
  showArrival(t,seen.length,visitID);
}
function showArrival(t,count,visitID,arrivalDate){
  freshWalkPage=false;
  let walked=null;
  if (S.phase==='walking' && S.walked!==null){
    if (nativeJournal && visitID===tripID){
      // 手機可能先在背景判定抵達，頁面沒有觀察到的最後一段無法計算。
      if (S.sim || (S.pos && dist(S.pos,[t.lat,t.lng])<=(navPrefs.arrivalRadius || 40))) walked=journalDistance();
    }
    else if (S.target?.id===t.id) walked=Math.max(S.walked,S.startD);
  }
  tripID=null; previousLegs=0;
  S.started=false; S.phase='arrived'; S.target=t;
  clearInterval(simT); simT=null;
  $('distanceHint').hidden=true; $('dist').classList.remove('pressable');
  $('walkrow').hidden=true; $('sim').classList.remove('on');
  $('photoAlbum').hidden=true;
  $('journalNote').hidden=true; $('visitNote').hidden=!nativeJournal || !visitID;
  $('go').disabled=false;
  document.querySelector('.app').inert=true;
  say('arrived');
  $('cno').textContent = `第 ${count} 站`;
  const now = new Date(), pad = v => String(v).padStart(2, '0');
  S.memo = {id:visitID,placeID:t.id,isSimulated:S.sim,name:t.name,stop:count,area:t.area || '',walked,
            date:arrivalDate || `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}`};
  if (nativePhotos) $('snap').hidden=!visitID;
  $('cname').textContent = t.name;
  $('ctag').textContent = TAG[t.tag] || HINT[t.cat] || '';
  $('cdesc').textContent = t.desc || '沒有留下說明的地方。站一下，看看它現在的樣子。';
  const ph = $('cph');   // 有官方照片就放在地名下面，沒有就整塊不出現
  if (t.ph){ ph.src = `photos/${t.id}.webp`; ph.alt = t.name + '的照片'; ph.hidden = false; }
  else { ph.hidden = true; ph.removeAttribute('src'); }
  clearTimeout(S.cardT);
  S.cardT = setTimeout(()=>{
    if (S.phase!=='arrived') return;
    $('veil').classList.add('on'); $('again').focus();
    acknowledgeVisibleArrival();
  }, 1800);
}
function reset(){
  clearTimeout(S.cardT); S.cardT=0;
  document.querySelector('.app').inert=false;
  $('veil').classList.remove('on'); S.phase='ready'; S.target=null; S.offer=null;
  S.memo=null; tripID=null; previousLegs=0;
  $('photoAlbum').hidden=!(nativePhotos || nativeJournal); $('journalNote').hidden=true; $('visitNote').hidden=true;
  $('bands').hidden=false; $('go').hidden=false; $('go').textContent='再走一趟'; $('walkrow').hidden=true;
  $('distanceHint').hidden=true; $('dist').classList.remove('masked','pressable');
  $('sim').classList.remove('on');
  $('hint').textContent='選一個遠近，出門散步吧'; $('dist').innerHTML='？<small></small>'; $('sub').textContent=statLine();
}
const statLine = () => `${S.sim?'模擬：':''}出發過 ${rec('drawn',0)} 次 · 到過 ${rec('seen').length} 處`;

// 真實足跡由手機入帳。地點卡顯示後才回覆，讓頁面重載時仍能收到尚未揭曉的地點。
let presentingToken=null;
const shownTokens=new Set();
function acknowledgeVisibleArrival(){
  if (!presentingToken || document.hidden || !$('veil').classList.contains('on')) return;
  const token=presentingToken;
  shownTokens.add(token); presentingToken=null;
  native.postMessage({action:'arrivalShown',token});
}
function receiveWalkEvent({detail}){
  if (!detail) return;
  const {type,session,placeID,token}=detail;
  if (type==='notificationUnavailable'){
    if (session===currentSession && S.phase==='walking' && !S.sim) $('notificationWarning').hidden=false;
    return;
  }
  if (type!=='arrival' && type!=='resumeWalk') return;
  if (type==='arrival' && shownTokens.has(token)){
    native.postMessage({action:'arrivalShown',token});
    return;
  }
  if (!Number.isSafeInteger(session) || session<1 || !Number.isSafeInteger(placeID)) return;
  if (navigation && session<=endedForReturn && !(type==='arrival' && detail.replayAfterReturn===true)) return;
  const place=PLACES.find(p=>p.id===placeID);
  if (type==='resumeWalk'){
    // 同一趟的舊快照不能覆蓋剛換好的目的地，或讓已收工的散步重新開始。
    if (!place || session<sensorSerial || (session===sensorSerial && (currentSession===null || S.phase==='walking'))) return;
    if (tripID && tripID!==detail.id) finishJournal('interrupted');
    stopSensors(false);
    reset();
    sensorSerial=currentSession=session;
    S.sim=false; S.started=true; S.pos=null; S.offer=null;
    if (nativeJournal){ tripID=typeof detail.id==='string' ? detail.id : null; previousLegs=null; }
    if (navigation && tripID) try{
      const saved=JSON.parse(localStorage.getItem('lukangNavBand'));
      if (saved?.id===tripID && Number.isInteger(saved.band) && saved.band>=0 && saved.band<BANDS.length+LONG_BANDS.length) selectBand(saved.band);
    }catch(e){}
    listenToNative(session);
    $('mode').textContent='GPS（無指南針）'; $('dist').textContent='？'; $('sub').textContent='正在取得目前位置…'; $('foot').textContent='';
    showWalk(place,null);
    return;
  }
  if (typeof token!=='string' || !token || token===presentingToken ||
      !Array.isArray(detail.seen) || !Array.isArray(detail.recent)) return;
  sensorSerial=Math.max(sensorSerial,session);
  presentingToken=token;
  Object.assign(appValues,{seen:detail.seen,recent:detail.recent});
  if (tripID && tripID!==token) finishJournal('interrupted');
  if (session!==currentSession || (nativeJournal && detail.distanceIncomplete===true)) S.walked=null;
  stopSensors(false);
  S.sim=false;
  // 換地點與到達可能同時發生；以手機已經記錄的地點揭曉。
  if (!place) S.pos=null;
  showArrival(place || {id:placeID,name:'先前造訪的地點',desc:'這一站已記入足跡，目前的地點資料沒有收錄這裡。'},detail.seen.length,token,detail.date);
}

/* ---------- 每次位置變化 ---------- */
function refreshWalkDisplay(d){
  if (S.phase!=='walking') return;
  $('dist').classList.toggle('masked',navPrefs.hideDistance);
  if (navPrefs.hideDistance) $('dist').textContent='剩餘距離已隱藏';
  else if (!S.pos || !S.target) $('dist').textContent='？';
  else {
    const [n,u]=fmt(d ?? dist(S.pos,[S.target.lat,S.target.lng]));
    const sm=document.createElement('small'); sm.textContent=u;
    $('dist').replaceChildren(n,sm);
  }
  if (!S.pos || !S.target) return;
  $('sub').textContent = S.acc>35 ? (navPrefs.hideDistance ? '定位訊號較弱' : `定位誤差約 ${Math.round(S.acc)} 公尺`)
    : S.heading==null ? `沒有指南針・目標在${DIR8[Math.round(bearing(S.pos,[S.target.lat,S.target.lng])/45)%8]}方` : statLine();
}
function tick(first){
  if (S.phase!=='walking' || !S.pos || !S.target) return;
  const tp=[S.target.lat,S.target.lng], d=dist(S.pos,tp);
  if (S.startD===null){ S.startD=d; $('redraw').disabled=false; }
  if (S.walkFrom){
    const step = dist(S.walkFrom, S.pos);
    if (step > 80) S.walkFrom = S.pos;
    else if (step >= 3 && (S.sim || S.acc <= 35)){ if (S.walked!==null) S.walked += step; S.walkFrom = S.pos; }
  } else S.walkFrom = S.pos;
  refreshWalkDisplay(d);
  if (S.acc>60 && say('weak')) act('care', 4000);
  /* 到達：定位夠準（誤差 ≤ ACC_OK），而且連續兩筆不同的定位都在範圍內才算，避免一筆亂跳的定位就揭曉。
     門檻還要在巷弄裡實測校準 */
  if (d <= (navPrefs.arrivalRadius || Math.min(ARRIVE+S.acc/2,40))){
    if (S.sim){ if (!(navigation && first)) arrive(); return; }
    if (S.acc > ACC_OK){ S.hits=0; if (!navPrefs.hideDistance) $('sub').textContent='已經很近了，等定位準一點…'; return; }
    if (backgroundWalk){ if (!navPrefs.hideDistance) $('sub').textContent='已經很近了，確認位置中…'; return; }
    if (S.fixAt !== S.hitFix){ S.hitFix = S.fixAt; S.hits++; }
    if (S.hits >= 2) return arrive();
    if (!navPrefs.hideDistance) $('sub').textContent='已經很近了，確認位置中…'; return;
  }
  S.hits = 0;
  if (navPrefs.hideDistance) return;
  const now=Date.now();
  if (!first && !S.saidHalf && d < S.startD/2 && S.startD>300){ S.saidHalf=true; say('half'); }
  else if (!S.saidNear && d < 80){ S.saidNear=true; say('near'); }
  else if (d>250 && now-S.lastFarAt>90000){ S.lastFarAt=now; say('far'); }
}

/* ---------- 每個影格依相對角度更新地面環與小嚮導 ---------- */
function frame(){
  const t0 = performance.now();
  let rel = 0;
  const blind = S.heading==null;   // 沒有可靠朝向：箭頭改成「上方是北」的絕對方位，不講左右、不叫人轉身
  if (S.target && S.pos){
    const b = bearing(S.pos,[S.target.lat,S.target.lng]);
    rel = norm180(b - (S.heading||0));
    if (S.phase==='walking' && !blind && Math.abs(rel)>120){
      if (!S.behindSince) S.behindSince=Date.now(); else if (Date.now()-S.behindSince>3500) say('behind');
    } else S.behindSince=0;
  }
  S.shown = norm180(S.shown + norm180(rel - S.shown) * 0.12);   // 收回 ±180，不然轉幾圈會累積成 -270° 被當成「在背後」
  const a = S.shown;
  $('wedge').setAttribute('transform', `rotate(${a.toFixed(1)})`);
  const nh = rad(-(S.heading||0));   // 「北」字沿著地面環走，告訴你手機朝哪
  $('north').setAttribute('transform', `translate(${(172*Math.sin(nh)).toFixed(1)} ${(-172*Math.cos(nh)).toFixed(1)}) scale(1 2.4)`);
  if (S.phase==='walking' && Date.now()-S.lastMoveAt>45000){ S.lastMoveAt=Date.now(); if (say('idle')) act('care', 5000); }
  pose(a, t0, blind);
  requestAnimationFrame(frame);
}

/* ---------- 角色：依情境挑動作 ----------
   到了→歡呼；收工→不捨；停太久或訊號差→關心（一次性）
   走路中：目標在背後→拉扯；在側邊→指方向；在前方且在走→走動；在前方但停著→先指前方，久了就停下等 */
function pose(a, t0, blind){
  const now = Date.now(), ar = Math.abs(a);
  let name = 'idle', flip = false;
  if (S.phase==='arrived') name = 'cheer';
  else if (S.act && now < S.actUntil) name = S.act;
  else if (S.phase==='walking' && S.target){
    if (!blind && ar > 120){ name = 'pull'; flip = a > 0; }          // 素材往左拉，目標在右後方時水平翻轉
    else if (!blind && ar > 35){ name = 'point'; flip = a < 0; }      // 素材指向右方，目標在左方時水平翻轉
    else if (now - S.lastMoveAt < (S.sim ? 1500 : 6000)) name = 'walk';   // GPS 約每 3 秒才確認一次移動
    else if (now - Math.max(S.lastMoveAt, S.pickAt||0) < 15000) name = 'pointup';
  }
  const k = $('kid'), A = ANIM[name];
  if (name !== S.anim){
    S.anim = name; S.animAt = t0;
    k.style.backgroundImage = `url(sprites/${name}.webp)`;
    k.style.backgroundSize = `${A.n*100}% 100%`;
  }
  if (flip !== S.flip){ S.flip = flip; k.classList.toggle('flip', flip); }
  const i = still.matches ? 0 : A.seq[Math.floor((t0 - S.animAt) / A.ms) % A.seq.length];
  k.style.backgroundPosition = `${A.n>1 ? i/(A.n-1)*100 : 0}% 0`;
}

/* ---------- 模擬：每 100ms 走一步（加速 8 倍） ---------- */
let simT=null;
function hold(btn, fn){
  const start=e=>{e.preventDefault(); if(simT) return; S.lastMoveAt=Date.now(); simT=setInterval(fn,100)};
  const end=()=>{clearInterval(simT); simT=null};
  btn.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,end));
}
// 模擬時，人面向自己走的方向（手機跟著轉），方向判斷才合理
hold($('stepTo'), ()=>{ if(S.phase!=='walking') return; const b=bearing(S.pos,[S.target.lat,S.target.lng]);
  const dir=b+(Math.random()-.5)*50; S.heading=(S.heading+norm180(dir-S.heading)*.25+360)%360;
  S.pos=move(S.pos, dir, 1.2); S.lastMoveAt=Date.now(); tick(); });
let randDir = Math.random()*360;
hold($('stepRand'), ()=>{ if(S.phase!=='walking') return; randDir += (Math.random()-.5)*30; S.heading=(randDir+360)%360;
  S.pos=move(S.pos, randDir, 1.2); S.lastMoveAt=Date.now(); tick(); });
$('turn').onclick = ()=>{ S.heading = ((S.heading||0)+90)%360; };

/* ---------- 按鈕 ---------- */
function selectBand(band){
  S.band=band;
  document.querySelectorAll('#bands button').forEach(b=>{
    const selected=+b.dataset.b===band;
    b.classList.toggle('sel',selected);b.setAttribute('aria-pressed',String(selected));
  });
  if (S.phase==='ready'){
    S.offer=null; $('hint').textContent='選一個遠近，出門散步吧';
    if (!S.started) $('go').textContent='出門散步吧';
  }
}
document.querySelectorAll('#bands button').forEach(b=>b.onclick=()=>selectBand(+b.dataset.b));
if (navigation){
  $('navlinks').hidden=false; $('cardNavlinks').hidden=false; $('bands').classList.add('long');
  document.querySelectorAll('#bands button[hidden]').forEach(b=>b.hidden=false);
  $('navigationSettings').onclick=$('cardNavigationSettings').onclick=()=>native.postMessage({action:'navigationSettings'});
  $('returnNavigation').onclick=$('cardReturnNavigation').onclick=()=>{
    const message={action:'returnNavigation'};
    if (currentSession!==null) message.session=currentSession;
    if (tripID || S.memo?.id) message.id=tripID || S.memo.id;
    native.postMessage(message);
  };
  function applyPreferences(p){
    if (typeof p.hideDistance==='boolean') navPrefs.hideDistance=p.hideDistance;
    if (typeof p.hasReturnPoint==='boolean') navPrefs.hasReturnPoint=p.hasReturnPoint;
    if ([0,25,50,100].includes(p.arrivalRadius) && p.arrivalRadius!==navPrefs.arrivalRadius){
      navPrefs.arrivalRadius=p.arrivalRadius; S.hits=0; S.hitFix=S.fixAt;
    }
    $('returnNavigation').title=$('cardReturnNavigation').title=navPrefs.hasReturnPoint ? '開始回程' : '設定回程地點';
    if (navPrefs.hideDistance && [...LINES.half,...LINES.near,...LINES.far].includes($('say').textContent)){
      $('say').classList.remove('on'); $('say').textContent=''; voiceEl.pause(); voiceEl.onerror=null;
      try{ speechSynthesis.cancel(); }catch(e){}
    }
    if (S.offer) $('hint').textContent=offerHint(S.offer);
    refreshWalkDisplay();
  }
  applyPreferences(window.lukangNavigation);
  let pressTimer;
  const endPress=()=>{ clearTimeout(pressTimer); };
  $('dist').addEventListener('pointerdown',e=>{
    endPress();
    if (S.phase!=='walking' || e.button!==0 || !e.isPrimary) return;
    const target=S.target;
    pressTimer=setTimeout(()=>{
      if (S.phase!=='walking' || S.target!==target) return;
      const hidden=!navPrefs.hideDistance;
      applyPreferences({hideDistance:hidden}); native.postMessage({action:'setHideDistance',hidden});
    },600);
  });
  for (const event of ['pointerup','pointercancel','pointerleave']) $('dist').addEventListener(event,endPress);
  $('dist').addEventListener('contextmenu',e=>{ if (S.phase==='walking') e.preventDefault(); });
  addEventListener('lukangNative',({detail})=>{
    if (detail?.type==='navigationPreferences'){ applyPreferences(detail); return; }
    if (detail?.type!=='leaveForReturn') return;
    endedForReturn=Math.max(endedForReturn,sensorSerial);
    endPress(); clearInterval(simT); simT=null;
    clearTimeout(say.t); $('say').classList.remove('on'); $('say').textContent='';
    voiceEl.pause(); voiceEl.onerror=null; try{ speechSynthesis.cancel(); }catch(e){}
    presentingToken=null; S.started=false; stopSensors(false,false);
    if (!S.forcedSim){ S.sim=false; S.pos=null; }
    reset(); $('go').disabled=false; $('go').textContent='出門散步吧';
    $('mode').textContent=S.sim ? '模擬行走' : '尚未出發'; $('foot').textContent='';
  });
}
$('go').onclick = go;
$('redraw').onclick = pick;
// 收工＝結束這趟散步：關定位、指南針和螢幕常亮；下次出發重新取得
$('stop').onclick = ()=>{ say('bye'); act('bye', 3200);
  finishJournal('stopped');
  S.started = false; stopSensors();
  if (!S.forcedSim){ S.sim = false; $('foot').textContent = ''; }
  reset(); $('go').textContent = '出門散步吧'; $('mode').textContent = S.sim ? '模擬行走' : '已收工'; };
$('again').onclick = ()=>{ reset(); $('go').focus(); };

/* ---------- 拍一張留念：在手機上將相片與這一趟的地點、日期繪成透卡 ---------- */
if (native || typeof renderShareCard !== 'function') $('snap').hidden = true;
const loadImg = src => new Promise((ok, no)=>{ const i = new Image(); i.onload = ()=>ok(i); i.onerror = no; i.src = src; });
async function drawPhotoCard(photoUrl,m,sprites){
  const [photo,sticker,avatar]=await Promise.all([loadImg(photoUrl),loadImg(sprites.cheer),loadImg(sprites.idle)]);
  const words=m.name+m.area+'散步吧小嚮導走了公里公尺第站'+m.date;
  await Promise.all(['700 40px "LXGW WenKai TC"', '500 40px "LXGW WenKai TC"', '700 40px "Noto Sans TC"', '500 40px "Noto Sans TC"']
    .map(font=>document.fonts.load(font,words).catch(()=>{})));
  const distanceLine=m.walked===null?'':'走了 '+fmt(m.walked).join(' ');
  return renderShareCard({photo,sticker,avatar,theme:'brick',name:m.name,stop:m.stop,line:distanceLine,place:m.area,date:m.date});
}
function cardBase64(card){
  const png=card.toDataURL('image/png'), prefix='data:image/png;base64,';
  if (!png.startsWith(prefix)) throw new Error('透卡圖片未能產生。');
  return png.slice(prefix.length);
}
let shareFile = null, shareUrl = '';
function shareMsg(text){ $('shareMsg').textContent = text; }
if (nativeJournal){
  $('photoAlbum').hidden=false; $('photoAlbum').textContent='散步日誌';
  $('photoAlbum').onclick=()=>native.postMessage({action:'journal'});
  $('journalNote').onclick=()=>{
    if (S.phase==='walking' && tripID) native.postMessage({action:'journal',id:tripID});
  };
  $('visitNote').onclick=()=>{
    if (S.phase==='arrived' && S.memo?.id && $('veil').classList.contains('on')) native.postMessage({action:'journal',id:S.memo.id});
  };
  window.lukangJournalPlaces=ids=>{
    const wanted=new Set(Array.isArray(ids)?ids:[]);
    return PLACES.filter(p=>wanted.has(p.id)).map(p=>({placeID:p.id,name:p.name,latitude:p.lat,longitude:p.lng}));
  };
  window.lukangRenderJournalCard=async (photoBase64,snapshot)=>{
    const titles={walking:'散步途中',stopped:'已收工的散步',interrupted:'中斷的散步',arrived:'到站紀錄',legacy:'舊到訪地點'};
    if (!snapshot || typeof snapshot.id!=='string' || !snapshot.id || !Object.hasOwn(titles,snapshot.status))
      throw new Error('找不到這一趟散步日誌。');
    const reveal=snapshot.status==='arrived' || snapshot.status==='legacy';
    const name=reveal && typeof snapshot.name==='string' && snapshot.name.trim() ? snapshot.name : titles[snapshot.status];
    const memo={name,area:reveal && typeof snapshot.area==='string' ? snapshot.area : '',
                stop:reveal && Number.isSafeInteger(snapshot.stop) && snapshot.stop>0 ? snapshot.stop : null,
                walked:Number.isFinite(snapshot.walked) && snapshot.walked>=0 ? snapshot.walked : null,
                date:typeof snapshot.date==='string' && /^\d{4}\.\d{2}\.\d{2}$/.test(snapshot.date) ? snapshot.date : ''};
    return cardBase64(await drawPhotoCard('data:image/jpeg;base64,'+photoBase64,memo,window.lukangCardSprites));
  };
} else if (nativePhotos){
  $('photoAlbum').hidden=false;
  $('photoAlbum').onclick=()=>native.postMessage({action:'photoAlbum'});
}
if (nativePhotos){
  $('snap').onclick=()=>{
    if (S.phase!=='arrived' || !$('veil').classList.contains('on') || !S.memo?.id) return;
    const {id,placeID,name,date,isSimulated,stop,walked,area}=S.memo;
    native.postMessage({action:'walkPhoto',visit:{id,placeID,name,date,isSimulated,stop,walked,area}});
  };
  function canRecoverPhoto(){
    return freshWalkPage && S.phase==='ready' && !S.started && !S.memo;
  }
  function validPhotoSnapshot(m,id){
    return m && typeof id==='string' && id.length>0 && m.id===id &&
      Number.isSafeInteger(m.placeID) && m.placeID>0 && typeof m.name==='string' && m.name.trim().length>0 &&
      typeof m.date==='string' && /^\d{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12]\d|3[01])$/.test(m.date) &&
      typeof m.isSimulated==='boolean' && Number.isSafeInteger(m.stop) && m.stop>0 &&
      (m.walked===null || (Number.isFinite(m.walked) && m.walked>=0)) && typeof m.area==='string';
  }
  window.lukangRenderWalkCard=async (photoBase64,visitID,recoveredMemo)=>{
    const current=S.memo;
    let memo;
    if (visitID && current?.id===visitID && S.phase==='arrived' && $('veil').classList.contains('on')){
      memo=current;
    } else if (canRecoverPhoto() && validPhotoSnapshot(recoveredMemo,visitID)){
      // 相機開啟期間頁面可能被系統回收。只使用原生端為這次選圖保留的到站資料。
      memo={...recoveredMemo};
    } else {
      throw new Error('這一趟散步已經結束。');
    }
    // 離線頁面使用原生端隨附的兩張角色圖，讓 WebKit 可以匯出畫布。
    const card=await drawPhotoCard('data:image/jpeg;base64,'+photoBase64,memo,window.lukangCardSprites);
    if (current ? S.memo!==current : !canRecoverPhoto()) throw new Error('目前顯示的散步紀錄已變更。');
    return cardBase64(card);
  };
} else if (!native){
  $('snap').onclick=()=>{ $('cam').value=''; $('cam').click(); };
}
$('shareRetake').onclick = ()=>{ $('cam').value = ''; $('cam').click(); };
$('shareClose').onclick = ()=>{ $('sharev').classList.remove('on'); $('snap').focus(); };
$('cam').onchange = async ()=>{
  const f = $('cam').files && $('cam').files[0];
  if (!f || !S.memo) return;
  $('sharev').classList.add('on'); $('shareGo').disabled = true; shareMsg('做成透卡中…');
  const photoUrl = URL.createObjectURL(f);
  try{
    const m=S.memo;
    const cv=await drawPhotoCard(photoUrl,m,{cheer:'sprites/cheer.webp',idle:'sprites/idle.webp'});
    const blob = await new Promise(ok=>cv.toBlob(ok, 'image/png'));
    if (!blob) throw new Error('toBlob');
    shareFile = new File([blob], `散步吧_${m.name}.png`, {type:'image/png'});
    if (shareUrl) URL.revokeObjectURL(shareUrl);
    shareUrl = URL.createObjectURL(blob);
    $('shareImg').src = shareUrl; $('shareImg').alt = `${m.name}的散步透卡`;
    const canShare = !!(navigator.canShare && navigator.canShare({files:[shareFile]}));
    $('shareGo').textContent = canShare ? '分享' : '存圖片';
    $('shareGo').disabled = false; shareMsg(canShare ? '' : '這個瀏覽器不能直接分享，先存成圖片再上傳。');
    $('shareGo').focus();
  }catch(e){
    shareMsg('這張照片讀不出來，換一張試試。');
  }finally{ URL.revokeObjectURL(photoUrl); }
};
$('shareGo').onclick = async ()=>{
  if (!shareFile) return;
  const m = S.memo, text = `今天走到了${m.name}（第 ${m.stop} 站）#散步吧`;
  if (navigator.canShare && navigator.canShare({files:[shareFile]})){
    try{ await navigator.share({files:[shareFile], text}); shareMsg(''); }
    catch(e){ if (e && e.name !== 'AbortError') shareMsg('沒有分享出去，可以再試一次。'); }
    return;
  }
  const a = document.createElement('a'); a.href = shareUrl; a.download = shareFile.name;
  document.body.append(a); a.click(); a.remove();
  shareMsg('已存成圖片，可以到相簿或下載資料夾找它。');
};
$('voice').textContent = '語音：'+(S.voice?'開':'關');
$('voice').onclick = ()=>{ S.voice=!S.voice; store.set('voice',S.voice); $('voice').textContent='語音：'+(S.voice?'開':'關');
  if(!S.voice){ try{speechSynthesis.cancel()}catch(e){} voiceEl.pause(); } };
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){
    if (nativeJournal && tripID && !S.sim) previousLegs=null;
    clearInterval(simT);simT=null;return
  }
  acknowledgeVisibleArrival();
  if (!native && S.started && S.phase==='walking') void keepAwake();
});
if (location.hash==='#sim'){ S.forcedSim = true; useSim('模擬模式：按住「往目的地走」前進。'); }
$('sub').textContent = statLine();
$('foot').textContent ||= `全台 ${PLACES.length.toLocaleString('zh-TW')} 個地點`;
requestAnimationFrame(frame);
if (backgroundWalk){
  addEventListener('lukangNative',receiveWalkEvent);
  native.postMessage({action:'ready'});
}
}
</script>
