","lat":25.011087,"lng":121.454585,"cat":"history","tag":"古蹟","desc":"板橋林家在清代擴建的園邸，至今保留水榭、樓閣、假山與涼亭。從方鑑齋、來青閣走到月波水榭，可以看出傳統庭園的不同空間安排。","area":"板橋區・新北市","ph":"文"},{"id":2205,"name":"江子翠河口景觀河濱公園","lat":25.03651,"lng":121.46987,"cat":"nature","desc":"江子翠的河濱綠地位在新店溪與大漢溪交會處。大片草地沿著水岸展開，兩條河川在眼前交會，也為都市留出開闊的休憩空間。","area":"板橋區・新北市","ph":"觀"},{"id":2206,"name":"浮洲藝術河濱公園","lat":24.99638,"lng":121.43854,"cat":"nature","desc":"板橋浮洲的河濱草地上，立著黑板、講臺、課桌椅和小學生立牌，拼成戶外教室。草坪旁還畫了跳格子，連下課遊戲也搬到河邊。","area":"板橋區・新北市","ph":"觀"},{"id":2207,"name":"浮洲遊戲場","lat":25.00352,"lng":121.44068,"cat":"other","desc":"浮洲把茉莉花故鄉與九龍傳說融入河濱共融遊戲場，並以恐龍為遊具主題。孩子可以嘗試太空漫步設施，大人也有自己的體健區。","area":"板橋區・新北市","ph":"觀"},{"id":2208,"name":"湳仔溝鐵馬驛站","lat":25.02114,"lng":121.44806,"cat":"other","desc":"新月橋旁的抽水站整理出一處單車驛站，讓人在大漢溪畔歇腳。驛站也蒐集在地文史資料，把板橋湳仔溪的故事帶進休憩空間。","area":"板橋區・新北市","ph":"觀"},{"id":2209,"name":"國家檔案館","lat":25.07376,"lng":121.37442,"cat":"culture","desc":"林口的國家檔案館兼具典藏、研究、展示與檔案應用功能。十層樓的綠建築旁保留原有次生林，讓閱讀國家檔案的空間與林地相鄰。","area":"林口區・新北市","ph":"觀"},{"id":2210,"name":"新北市立圖書館林口分館","lat":25.06974,"lng":121.36408,"cat":"culture","desc":"林口分館用黑、白、灰作為閱讀空間的主要色調，配上北歐風格桌椅。簡約的家具與溫和氣氛，讓人在圖書館也有居家閱讀的感覺。","area":"林口區・新北市","ph":"觀"},{"id":2211,"name":"新北市立圖書館林口東勢閱讀室","lat":25.06875,"lng":121.37749,"cat":"other","desc":"林口東勢閱讀室最醒目的是頭頂的銀河帶狀天花板，抬頭就像望向星空。室內以白色為底，搭配銀灰色細節，帶出太空般的閱讀氣氛。","area":"林口區・新北市","ph":"觀"},{"id":2212,"name":"林口謙益居","lat":25.107332,"lng":121.323056,"cat":"history","tag":"古蹟","desc":"舊稱小南灣頂福的林口聚落裡，謙益居是南灣洪家的祖厝。興建宅第的洪港承繼家族農業，祖籍則可追溯到福建泉州晉江。","area":"林口區・新北市","ph":"文"},{"id":2213,"name":"水牛坑(水牛坑越野場地)","lat":25.11984,"lng":121.3188,"cat":"scenic","desc":"林口海邊的水牛坑，原是附近養牛人家放牧的地方。面向臺灣海峽可看海與夕陽，也能遠望海岸上的風力發電機和林口發電廠。","area":"林口區・新北市","ph":"觀"},{"id":2214,"name":"竹林山觀音寺","lat":25.0837,"lng":121.38941,"cat":"worship","desc":"林口的觀音寺主祀十八手觀音佛祖，是林口、蘆竹與龜山一帶居民的信仰中心。殿宇採宮殿式外觀，中央庭院也留有寬闊的參拜空間。","area":"林口區・新北市","ph":"觀"},{"id":2215,"name":"南寮福德宮","lat":24.99583,"lng":121.41077,"cat":"worship","desc":"樹林南寮的土地公廟，前身是地方所稱的「三粒石土地公」，後因信眾還願而擴建。廟前廣場供居民活動，右側還有冷礦泉嬉水池。","area":"樹林區・新北市","ph":"觀"},{"id":2216,"name":"台灣原住民族企業社(瑪伐流國際工藝社)","lat":24.95593,"lng":121.40312,"cat":"culture","area":"樹林區・新北市","ph":"觀"},{"id":2217,"name":"山仔腳公園","lat":24.97158,"lng":121.39374,"cat":"nature","desc":"山佳舊稱山仔腳，因聚落靠近龜崙嶺山麓而得名。沿鹿角溪設置的公園保留這個老地名，溪岸木棧道上能看小魚，也能坐看黃昏景色。","area":"樹林區・新北市","ph":"觀"},{"id":2218,"name":"山佳車站","lat":24.972325,"lng":121.392744,"cat":"history","tag":"古蹟","desc":"日治時期設立的山仔腳停車場，隨地名演變而成為今日的山佳車站。早年的紀錄已提到這裡運送大量煤炭，留下礦業與鐵道相依的歷史。","area":"樹林區・新北市","ph":"文"},{"id":2219,"name":"新北市軍人忠靈祠(武器公園)","lat":25.01347,"lng":121.40953,"cat":"worship","desc":"大同山向陽山坡上的忠靈祠，前身是軍人公墓。靈堂設於一九五九年，後來在原地整建，作為追思因公殉職軍人與亡故榮民的場所。","area":"樹林區・新北市","ph":"觀"},{"id":2220,"name":"樹林原住民主題部落公園","lat":24.96983,"lng":121.41182,"cat":"nature","desc":"大漢溪左岸的原住民主題公園，把彩繪帶上堤坡與圓形活動廣場。廣場上的圖騰是園區醒目的元素，也為族人與居民提供辦活動的空間。","area":"樹林區・新北市","ph":"觀"},{"id":2221,"name":"樹林太平橋碑","lat":24.984199,"lng":121.418888,"cat":"history","tag":"古蹟","area":"樹林區・新北市","ph":"文"},{"id":2222,"name":"樹林後村圳改修碑及水汴頭","lat":24.980201,"lng":121.425742,"cat":"history","tag":"古蹟","area":"樹林區・新北市","ph":"文"},{"id":2223,"name":"樹林石灰坑拱橋","lat":24.973155,"lng":121.379228,"cat":"history","tag":"歷史建築","desc":"山佳的石灰坑早年開採煤礦，拱橋的由來有一說與山仔腳煤礦有關。相傳興橋是為了讓運煤臺車穿過溪谷，連起礦區兩端。","area":"樹林區・新北市","ph":"文"},{"id":2224,"name":"樹林石頭溪圳道及改修碑","lat":24.9534,"lng":121.37013,"cat":"history","tag":"歷史建築","area":"樹林區・新北市","ph":"文"},{"id":2225,"name":"樹林聖蹟亭","lat":24.996142,"lng":121.41884,"cat":"history","tag":"歷史建築","desc":"樹林潭底的聖蹟亭，是鄉人在清同治年間募款興建的惜字亭。寫過字的廢紙集中在亭內焚化，留下的灰燼稱作「聖蹟」，祭典時再送入河海。","area":"樹林區・新北市","ph":"文"},{"id":2226,"name":"樹林車站","lat":24.9914,"lng":121.4246,"cat":"other","desc":"縱貫線上的樹林車站採跨站式設計，站體銜接鐵路的兩側。三座月臺裡有兩座是島式、一座是側式，也是認識鐵道空間配置的地方。","area":"樹林區・新北市","ph":"觀"},{"id":2227,"name":"蓋淡坑遺址","lat":24.97411,"lng":121.38661,"cat":"other","desc":"山仔腳曾有許多煤坑，蓋淡坑是當地早年產煤量相當大的礦場。一九五九年封坑後，遺址與附近曾用來運煤的山佳車站，共同留下礦業記憶。","area":"樹林區・新北市","ph":"觀"},{"id":2228,"name":"鐵道地景公園","lat":24.97291,"lng":121.39449,"cat":"nature","desc":"山佳車站旁的公園展示黑色煤斗車與調動機，呼應地方運煤歷史。沿山佳街走，牆上的立體彩繪又讓鯊魚、袋鼠與臺灣黑熊出現在街角。","area":"樹林區・新北市","ph":"觀"},{"id":2229,"name":"青龍嶺","lat":24.99992,"lng":121.40337,"cat":"other","desc":"大同山西北稜上可見一條青龍雕塑，遠看像睡龍伏臥，因而得名青龍嶺。山間步道串連大同山與稜頂，沿途可望見層層山色。","area":"樹林區・新北市","ph":"觀"},{"id":2230,"name":"鹿角溪公園","lat":24.97171,"lng":121.39607,"cat":"nature","desc":"鹿角溪旁的公園以全齡休閒為目標，分期設置鄰里休憩區、兒童遊戲場與銀髮體健區。從日常散步到運動，不同世代都有可以使用的空間。","area":"樹林區・新北市","ph":"觀"},{"id":2231,"name":"世界宗教博物館","lat":25.00796,"lng":121.50781,"cat":"culture","desc":"永和的宗教博物館以各地宗教的法器、祭壇和建築為展示內容。大廳裡多座宗教建築模型並列，讓人能近看不同信仰的空間特色。","area":"永和區・新北市","ph":"觀"},{"id":2232,"name":"中興街(韓國街)","lat":25.0117,"lng":121.5174,"cat":"other","desc":"永和中興街因聚集韓國商品而有「韓國街」之名。區公所曾委託復興美工設計招牌，翠綠、桃紅、鮮黃與天藍等色彩串起整條街景。","area":"永和區・新北市","ph":"觀"},{"id":2233,"name":"保福宮","lat":25.01312,"lng":121.5087,"cat":"worship","desc":"永和保福宮供奉保生大帝，香火分自大龍峒保安宮。重簷歇山式殿宇裡，可從藻井木雕、石雕龍柱一路看到牆上彩繪。","area":"永和區・新北市","ph":"觀"},{"id":2234,"name":"博愛藝術街","lat":25.01584,"lng":121.51781,"cat":"structure","desc":"永和一群退休老師希望把藝術帶進街坊，於是發起藝教協會，推動博愛街造街。這條約五百公尺的小街，也因此多了居民共同營造的藝文氣息。","area":"永和區・新北市","ph":"觀"},{"id":2235,"name":"楊三郎美術館","lat":25.01593,"lng":121.51675,"cat":"culture","desc":"美術館展出油畫家楊三郎各時期的創作，從山川風景到人物寫生都有。樓上另有楊夫人的瓶花靜物與鄉土園景，可並看兩人的畫風。","area":"永和區・新北市","ph":"觀"},{"id":2236,"name":"永和網溪別墅","lat":25.015868,"lng":121.51693,"cat":"history","tag":"古蹟","desc":"網溪別墅因位在今日新店溪畔而得名，最初的主人是永和首任鎮長楊仲佐。兒子楊三郎與媳婦許玉燕後來在此生活，兩人都是臺灣畫家。","area":"永和區・新北市","ph":"文"},{"id":2237,"name":"綠寶石河濱公園","lat":25.01526,"lng":121.50496,"cat":"nature","desc":"「綠寶石」這個名字，道出人口稠密的永和對開闊綠地的珍惜。河畔除了各類球場與溜冰場，也有寵物公園、行人步道和休閒廣場。","area":"永和區・新北市","ph":"觀"},{"id":2238,"name":"五堵鐵路隧道","lat":25.082908,"lng":121.679404,"cat":"history","tag":"歷史建築","area":"汐止區・新北市","ph":"文"},{"id":2239,"name":"拱北殿","lat":25.09446,"lng":121.64215,"cat":"worship","desc":"汐止三秀山上的廟宇主祀呂仙祖，也奉祀釋迦牟尼佛與孔子，融合儒釋道三教。入冬前後附近的槭樹轉紅，成為山中醒目的季節景色。","area":"汐止區・新北市","ph":"觀"},{"id":2240,"name":"新山夢湖","lat":25.1279,"lng":121.63604,"cat":"scenic","desc":"新山坐落在友蚋山向南延伸的支稜，峰頂多岩塊，稜線一側是陡直岩壁。從突出的巨岩遠望，可看開闊山勢，天際還連著北海岸海域。","area":"汐止區・新北市","ph":"觀"},{"id":2241,"name":"星光橋","lat":25.07645,"lng":121.66255,"cat":"other","desc":"汐止的景觀橋以單斜塔跨越基隆河，讓行人和自行車共享。傾斜的白色橋塔形似指向天空的巨型麥克風，夜間燈色為橋面換上不同表情。","area":"汐止區・新北市","ph":"觀"},{"id":2242,"name":"汐止康誥坑溪","lat":25.05929,"lng":121.65363,"cat":"other","desc":"發源於四分尾山的康誥坑溪，穿過汐止市區後匯入基隆河。下游沿岸栽有成排櫻花，冬末春初花開時，溪岸便成了賞花步道。","area":"汐止區・新北市","ph":"觀"},{"id":2243,"name":"汐止忠順廟及神社石燈","lat":25.068483,"lng":121.658957,"cat":"worship","tag":"歷史建築","area":"汐止區・新北市","ph":"文"},{"id":2244,"name":"汐止星際遊戲場","lat":25.07787,"lng":121.66353,"cat":"other","desc":"汐止把八大行星變成遊戲場裡不同的活動區，土星是沙坑，火星則是籃球場。孩子以外，長者也有以天王星為主題的樂齡區。","area":"汐止區・新北市","ph":"觀"},{"id":2245,"name":"汐止水道布設記碑","lat":25.047503,"lng":121.659129,"cat":"history","tag":"歷史建築","area":"汐止區・新北市","ph":"文"},{"id":2246,"name":"汐止白雲派出所","lat":25.037689,"lng":121.641093,"cat":"history","tag":"歷史建築","desc":"白雲里的舊派出所源自日治時期在山區設立的十三分出張所。地點正好在汐止、南港與石碇往來的孔道上，見證地方早年警政發展。","area":"汐止區・新北市","ph":"文"},{"id":2247,"name":"汐止老街","lat":25.07032,"lng":121.66237,"cat":"structure","desc":"汐止中正路一帶舊稱水返腳街，曾是基隆河上重要的貨物轉運地。沿街仍可見傳統紅磚牆和巴洛克式洋樓，也留有碼頭與隘門的歷史痕跡。","area":"汐止區・新北市","ph":"觀"},{"id":2248,"name":"汐止茄苳腳臺灣鐵路遺蹟","lat":25.070599,"lng":121.664375,"cat":"history","tag":"古蹟","area":"汐止區・新北市","ph":"文"},{"id":2249,"name":"茄苳瀑布","lat":25.05338,"lng":121.67608,"cat":"other","desc":"大尖山後山的溪谷裡，茄苳瀑布順著岩壁分層落下，底下匯成一潭。山雖不高，落差卻有數層樓高，未見瀑布便可先聽溪水聲。","area":"汐止區・新北市","ph":"觀"},{"id":2250,"name":"金龍山北峰寺","lat":25.07427,"lng":121.6313,"cat":"worship","desc":"金龍湖畔的北峰寺從日治時期的小廟，逐步擴建成有數座大殿的寺院。寺中供奉觀世音菩薩，是汐止社后一帶居民的信仰中心。","area":"汐止區・新北市","ph":"觀"},{"id":2251,"name":"陳萬乞古厝","lat":25.06837,"lng":121.65619,"cat":"history","area":"汐止區・新北市","ph":"觀"},{"id":2252,"name":"下泰山巖","lat":25.06075,"lng":121.43203,"cat":"worship","desc":"地方習稱「下廟」的顯應祖師泰山巖，其名與泰山地勢有關。西南較高的地區稱頂泰山，東北較低的稱下泰山，兩座泰山巖也依此區分。","area":"泰山區・新北市","ph":"觀"},{"id":2253,"name":"敢部隊指揮部碉堡遺址(文史影像公園)","lat":25.05946,"lng":121.42978,"cat":"nature","desc":"泰山人口中的「敢部隊」，指的是二戰末期部署在臺北的日軍第六十六師團。文史影像公園裡的碉堡遺址，因這支部隊的代號而得名。","area":"泰山區・新北市","ph":"觀"},{"id":2254,"name":"明志書院","lat":25.046972,"lng":121.426602,"cat":"history","tag":"歷史建築","desc":"清代墾戶胡焯猷將泰山的竹圍、房屋和魚池捐為義學，並以租穀支應辦學。這處讓地方子弟讀書的義學，後來發展為明志書院。","area":"泰山區・新北市","ph":"文"},{"id":2255,"name":"泰山大窠坑新築道路記念碑","lat":25.05645,"lng":121.404813,"cat":"history","tag":"古蹟","area":"泰山區・新北市","ph":"文"},{"id":2256,"name":"泰山娃娃產業文化館","lat":25.06205,"lng":121.43465,"cat":"culture","desc":"泰山的娃娃製造與居民的工作記憶，和一九六七年美寧工廠在此設廠有關。文化館以這段芭比娃娃生產史，介紹地方的產業與生活。","area":"泰山區・新北市","ph":"觀"},{"id":2257,"name":"泰山森林書屋","lat":25.0567,"lng":121.42748,"cat":"other","desc":"辭修公園綠樹間的紅磚建築，也是泰山原住民族文化活動中心。四面採光的書屋讓人伴著樹影閱讀，附近的親山步道另有觀景平台。","area":"泰山區・新北市","ph":"觀"},{"id":2258,"name":"頂泰山巖","lat":25.043755,"lng":121.423571,"cat":"worship","tag":"古蹟","desc":"泰山古廟建於清乾隆年間，日治時期的整修曾由匠師陳應彬領徒主持。屋頂鋪黃琉璃瓦、綴綠色剪邊，彎曲的燕尾脊上另有剪黏。","area":"泰山區・新北市","ph":"文"},{"id":2259,"name":"一滴水紀念館","lat":25.17822,"lng":121.43077,"cat":"culture","desc":"這座跨國移築的紀念館，館名取自水上勉珍惜資源、連一滴水都善用的禪宗思想。「一滴水」也紀念移築志工聚沙成塔般的奉獻。","area":"淡水區・新北市","ph":"觀"},{"id":2260,"name":"三協成糕餅博物館","lat":25.16943,"lng":121.44049,"cat":"culture","desc":"淡水老街上的糕餅博物館，以三協成的各式糕餅為主角。假日街上人潮熱鬧，館內亦可見大人與孩子一同品嚐傳統糕餅的景象。","area":"淡水區・新北市","ph":"觀"},{"id":2261,"name":"公司田溪程氏古厝","lat":25.189386,"lng":121.428165,"cat":"history","tag":"歷史建築","desc":"公司田溪畔的程氏古厝，是竹葦與水渠環繞的閩南式三合院農宅。正身入口設三階安山岩踏階，兩側護龍的臺基則向外逐漸降低。","area":"淡水區・新北市","ph":"文"},{"id":2262,"name":"前清淡水關稅務司官邸","lat":25.174058,"lng":121.436187,"cat":"history","tag":"古蹟","desc":"清末淡水開港設關後，稅務司官邸落腳面向淡水河的高地。正面十一道半圓拱廊對應後方木製百葉窗，抬高的磚石基座另留通風孔。","area":"淡水區・新北市","ph":"文"},{"id":2263,"name":"前清英國領事官邸","lat":25.17535,"lng":121.4335,"cat":"history","desc":"紅毛城東側的領事官邸由英國建築師設計，並由華人技師以中國建材施工。紅磚樓、拱圈迴廊、斜屋頂和高臺階，構成鮮明的洋樓外觀。","area":"淡水區・新北市","ph":"觀"},{"id":2264,"name":"原英商嘉士洋行倉庫","lat":25.165656,"lng":121.446332,"cat":"history","tag":"古蹟","desc":"淡水開港後，嘉士洋行在鼻仔頭租地經營，後與殼牌公司簽約成為代理商。留下的倉庫與洋行貿易相連，記下河港一帶工商活動的發展。","area":"淡水區・新北市","ph":"文"},{"id":2265,"name":"小白宮(新北市立淡水古蹟博物館)","lat":25.1742,"lng":121.43627,"cat":"worship","desc":"淡水人熟知的小白宮，是清末關稅務司官邸，因白色西班牙式外觀而得名。當年砲臺埔高地聚集外商住家，官邸見證開港後的河口景觀。","area":"淡水區・新北市","ph":"觀"},{"id":2266,"name":"巫登益美術館","lat":25.1747,"lng":121.43583,"cat":"culture","area":"淡水區・新北市","ph":"觀"},{"id":2267,"name":"得忌利士商行","lat":25.17261,"lng":121.43692,"cat":"other","desc":"淡水開港後活躍的洋行中，得忌利士除了貿易，也以航運為主要業務。昔日河港水深可停泊大船，商行的歷史便與港口繁盛時的航路相連。","area":"淡水區・新北市","ph":"觀"},{"id":2268,"name":"新北市忠烈祠","lat":25.17896,"lng":121.42828,"cat":"worship","desc":"新北市的忠烈祠奉祀因公殉職且事蹟足供追思的軍人、警察與民眾。這處紀念場所延續對其奉獻與殉職事蹟的祭祀。","area":"淡水區・新北市","ph":"觀"},{"id":2269,"name":"新北市滬尾防災宣導主題館","lat":25.172,"lng":121.43733,"cat":"culture","desc":"淡水河畔的防災館把外觀做成消防車，門前還設有消防吉祥物郵筒。館內用投影與虛擬實境遊戲，讓人從互動中認識防災觀念。","area":"淡水區・新北市","ph":"觀"},{"id":2270,"name":"楓樹湖","lat":25.18721,"lng":121.49918,"cat":"scenic","desc":"大屯山脈西側的楓樹湖，在農民多年照料下種出成片木蓮。盛開的花朵輪廓像蓮花寶座，因此也有人稱它為長在樹上的蓮花。","area":"淡水區・新北市","ph":"觀"},{"id":2271,"name":"淡水「楓樹湖庄禁牌」","lat":25.18954,"lng":121.495212,"cat":"history","tag":"歷史建築","area":"淡水區・新北市","ph":"文"},{"id":2272,"name":"淡水八角塔","lat":25.17665,"lng":121.43747,"cat":"other","desc":"淡江中學的八角塔原名信望愛塔，於一九二五年完工。建築採三合院格局，由中央高塔向兩翼教室逐次降低，兼具西式與在地建築特色。","area":"淡水區・新北市","ph":"觀"},{"id":2273,"name":"淡水公司田溪橋遺蹟","lat":25.190305,"lng":121.443687,"cat":"history","tag":"古蹟","desc":"公司田溪的新橋上仍保存舊橋構件，舊石碑安置在南岸入口。橋板石材、舊橋墩與碼頭石材分別排列在橋面和步道旁，讓人辨識歷史痕跡。","area":"淡水區・新北市","ph":"文"},{"id":2274,"name":"淡水崎仔頂施家古厝","lat":25.169948,"lng":121.441504,"cat":"history","tag":"古蹟","desc":"崎仔頂施家古厝的正身與護室之間，用跨度較大的磚拱相通。仔細看窗牆，可分辨柿蒂形通氣孔、直櫺窗與護室山牆的小圓窗。","area":"淡水區・新北市","ph":"文"},{"id":2275,"name":"淡水忠寮李舉人宅","lat":25.177394,"lng":121.465639,"cat":"history","tag":"古蹟","desc":"忠寮李家宅第的屋頂值得抬頭細看，山牆和屋脊留有書卷、螭虎與螭龍等裝飾。門樓一側還有泥塑的「書」，呼應舉人宅的身分。","area":"淡水區・新北市","ph":"文"},{"id":2276,"name":"淡水文化園區-殼牌倉庫","lat":25.16589,"lng":121.44698,"cat":"culture","desc":"淡水鼻仔頭的舊殼牌倉庫，前身是開港後出現的英商嘉士洋行倉庫。昔日的儲油倉庫與油槽後來轉作地方文化和社區大學的空間。","area":"淡水區・新北市","ph":"觀"},{"id":2277,"name":"淡水木下靜涯舊居","lat":25.171475,"lng":121.43926,"cat":"history","tag":"歷史建築","desc":"淡水的木下靜涯舊居，北側戶外階梯分兩折向上，連到二樓簷廊。廊外可見塗白的紅磚柱與鏤空花格磚，保留住家的建築細節。","area":"淡水區・新北市","ph":"文"},{"id":2278,"name":"淡水水上機場","lat":25.164411,"lng":121.446637,"cat":"history","tag":"古蹟","desc":"日治時期的淡水水上機場設在鼻仔頭一帶，突出河面的地形正對出海口。浮洲南方有數公里長的開闊水面，當年便用作水上飛機的天然跑道。","area":"淡水區・新北市","ph":"文"},{"id":2279,"name":"淡水海關碼頭","lat":25.174674,"lng":121.431852,"cat":"history","tag":"古蹟","desc":"淡水在清同治年間開設海關，滬尾街沿河一帶成為碼頭區。日治時期陸續填築碼頭、興建檢查設施，留下磚造倉庫等港務建築。","area":"淡水區・新北市","ph":"文"},{"id":2280,"name":"淡水渡船頭燈杆","lat":25.17004,"lng":121.43892,"cat":"history","tag":"歷史建築","desc":"渡船頭的方形鋼架原名淡水港前導燈，設於一九五一年。綠色燈架下的白色三角日標，曾與後導燈配合，引導船隻進入淡水港。","area":"淡水區・新北市","ph":"文"},{"id":2281,"name":"淡水漁人碼頭(淡二漁港)","lat":25.18339,"lng":121.41147,"cat":"scenic","desc":"淡水河出海口右岸的第二漁港，因夕陽和浮動碼頭而廣為人知。漲退潮時碼頭跟著水面升降，從木棧道與情人橋可看港邊漁船。","area":"淡水區・新北市","ph":"觀"},{"id":2282,"name":"淡水漁人舞台","lat":25.18172,"lng":121.41486,"cat":"other","desc":"淡水漁人碼頭旁的音樂舞臺，曾在二〇一六年以海港展演空間之姿登場。原創樂團在海風與夕陽間輪番演出，也有了交流創作的地方。","area":"淡水區・新北市","ph":"觀"},{"id":2283,"name":"淡水漁業生活文化影像館","lat":25.17368,"lng":121.43453,"cat":"culture","desc":"淡水第一漁港旁的舊油庫機房，整理後成了白牆綠窗的影像館。館內保留替漁船補給的紅色老幫浦，也展出長年拍攝的淡水黑白風景。","area":"淡水區・新北市","ph":"觀"},{"id":2284,"name":"淡水福佑宮","lat":25.170118,"lng":121.439844,"cat":"worship","tag":"古蹟","desc":"淡水河口北岸因航道變化而漸趨繁盛，福佑宮便與這段清代港市發展相連。三川殿內的舊楹聯，還留下早期滬尾港信仰的線索。","area":"淡水區・新北市","ph":"文"},{"id":2285,"name":"淡水禮拜堂","lat":25.171881,"lng":121.438407,"cat":"worship","tag":"古蹟","desc":"淡水開港通商後，馬偕於一八七二年抵達河港傳教，在此建立長老教會淡水教會。禮拜堂的源起，也與當年洋行活動頻繁的港市有關。","area":"淡水區・新北市","ph":"文"},{"id":2286,"name":"淡水紅樓","lat":25.17142,"lng":121.43941,"cat":"other","desc":"這座十九世紀末完工的樓房，因殖民地式紅磚外觀而被稱為紅樓。歷經數次改造，淡水人曾一度看到黃樓，後來整修才恢復原色。","area":"淡水區・新北市","ph":"觀"},{"id":2287,"name":"淡水紅毛城","lat":25.175289,"lng":121.432983,"cat":"history","tag":"古蹟","desc":"淡水河口北岸的山丘，曾有西班牙人興築的聖多明哥城。荷蘭人後來在此重建聖安東尼奧城，民間所稱的「紅毛城」由此而來。","area":"淡水區・新北市","ph":"文"},{"id":2288,"name":"淡水老街","lat":25.17103,"lng":121.43855,"cat":"structure","desc":"淡水中正路連到重建街、清水街，交織出熱鬧的老街區。沿街既有傳統餅舖與雜貨店，也有玩具和服飾商店，新舊店面比鄰而立。","area":"淡水區・新北市","ph":"觀"},{"id":2289,"name":"淡水藝術工坊","lat":25.17226,"lng":121.43744,"cat":"culture","desc":"藝術工坊的基地原有日治時期四連棟警眷宿舍，改建時將拆下的舊瓦留作室內裝修。新館採綠建築設計，也讓老宿舍的材料有了新用途。","area":"淡水區・新北市","ph":"觀"},{"id":2290,"name":"淡水街長多田榮吉故居","lat":25.173289,"lng":121.437312,"cat":"history","tag":"古蹟","desc":"淡水街長多田榮吉的日式故居位在埔頂山丘半腰，屋前地勢可俯瞰淡水河與觀音山。宅內早期裝設的自來水設備，也是它的歷史特色。","area":"淡水區・新北市","ph":"文"},{"id":2291,"name":"淡水重建街14號街屋","lat":25.170825,"lng":121.440117,"cat":"structure","tag":"古蹟","desc":"重建街的街屋沿淡水山勢排列，十四號與隔鄰十六號原是連棟建築。前庭、露臺和入口廊下共同構成室外空間，鄰戶間以彎拱門相通。","area":"淡水區・新北市","ph":"文"},{"id":2292,"name":"淡水重建街16號街屋","lat":25.170784,"lng":121.44014,"cat":"structure","tag":"古蹟","desc":"重建街十六號曾是陳家住宅，屋內中段的房間也一度租給他人。磚造洗石子立面與突出的露臺，仍能看出這排依山街屋的早期樣貌。","area":"淡水區・新北市","ph":"文"},{"id":2293,"name":"淡水金色水岸","lat":25.16786,"lng":121.44375,"cat":"scenic","desc":"從淡水和衷宮到小漁港的河畔，有林蔭步道、漁作空間和觀潮灣。沿水岸坐下，對岸的觀音山與河口景色便一同映入眼中。","area":"淡水區・新北市","ph":"觀"},{"id":2294,"name":"淡水龍山寺","lat":25.170038,"lng":121.442132,"cat":"worship","tag":"古蹟","desc":"清代淡水街市逐漸由河岸往後街發展，龍山寺也隨聚落的商業活動而興建。寺院約於咸豐八年建成掛匾，留下港市擴張的時代痕跡。","area":"淡水區・新北市","ph":"文"},{"id":2295,"name":"淡江大橋","lat":25.17542,"lng":121.41778,"cat":"other","desc":"在淡水河流入大海的地方，單塔不對稱斜張橋跨越水面，連結淡水與八里。大橋的國際競圖由札哈・哈蒂勝出，橋塔也成了河口景觀的一部分。","area":"淡水區・新北市","ph":"觀"},{"id":2296,"name":"清法戰爭滬尾古戰場城岸遺蹟","lat":25.187699,"lng":121.418806,"cat":"history","tag":"歷史建築","desc":"沙崙仔地處淡水河口，留有清法戰爭時期滬尾古戰場的城岸地景。現存遺蹟分散在數處高地，部分表面已長滿黃槿灌叢。","area":"淡水區・新北市","ph":"文"},{"id":2297,"name":"滬尾偕醫館","lat":25.171767,"lng":121.438541,"cat":"culture","tag":"古蹟","desc":"馬偕曾在滬尾偕醫館行醫與傳教，這裡是北臺灣早期的西式醫院。除醫療器具外，館內還展示馬偕家的老風琴與家人穿過的唐裝。","area":"淡水區・新北市","ph":"文"},{"id":2298,"name":"滬尾櫻花大道","lat":25.16879,"lng":121.46148,"cat":"scenic","desc":"沿著淡水樹林口至三空泉一帶，道旁栽植吉野櫻與山櫻花。這條地方團體與區公所共同推動的櫻花大道，以淡水的舊稱滬尾為名。","area":"淡水區・新北市","ph":"觀"},{"id":2299,"name":"滬尾礮臺","lat":25.179017,"lng":121.429568,"cat":"history","tag":"古蹟","desc":"清法戰爭後，劉銘傳在淡水主持興建滬尾礮臺，是清末海防留下的建築。今日雖已不見大砲，仍可從外牆與殘留的砲座辨識當年規模。","area":"淡水區・新北市","ph":"文"},{"id":2300,"name":"無極真元天壇(天元宮)","lat":25.18566,"lng":121.48609,"cat":"worship","desc":"大屯山系西北面的天元宮，於一九九二年增建五層圓形天壇。每層聖殿供奉不同先佛，櫻花盛開時，層層殿宇與花枝相互映襯。","area":"淡水區・新北市","ph":"觀"},{"id":2301,"name":"牧師樓與姑娘樓","lat":25.17518,"lng":121.43447,"cat":"other","desc":"紅磚砌成的拱廊沿著牧師樓展開，斜屋頂下的高台階面向庭園。春夏草地翠綠，冬日換上櫻花，也能在這裡望見淡水夕照。","area":"淡水區・新北市","ph":"觀"},{"id":2302,"name":"理學堂大書院","lat":25.175936,"lng":121.434367,"cat":"worship","tag":"古蹟","desc":"馬偕用加拿大故鄉牛津郡鄉親的捐款，在淡水建起這座書院。觀音山石門楣刻著中英文校名，昔日課堂從神學一路教到植物與臨床醫學。","area":"淡水區・新北市","ph":"文"},{"id":2303,"name":"琉傳天下琉星花園","lat":25.18952,"lng":121.47665,"cat":"nature","desc":"琉璃作品穿插在花園造景中，讓人看見這門工藝融入日常生活的不同模樣。園內也有彈珠遊戲和動手創作琉璃的體驗。","area":"淡水區・新北市","ph":"觀"},{"id":2304,"name":"紅樹林生態教育館","lat":25.154698,"lng":121.458697,"cat":"culture","desc":"教育館緊鄰淡水紅樹林自然保留區，展覽介紹水筆仔的一生，也帶人認識招潮蟹與彈塗魚。從觀景窗望出去，成片樹冠一直延伸到河口。","area":"淡水區・新北市","ph":"觀"},{"id":2305,"name":"紅毛城園區(新北市立淡水古蹟博物館)","lat":25.17543,"lng":121.43294,"cat":"culture","desc":"淡水河畔醒目的朱紅城堡，見證了西班牙人築城、荷蘭人重建的歷史。昔日漢人稱荷蘭人為「紅毛」，這個稱呼也成了城堡的名字。","area":"淡水區・新北市","ph":"觀"},{"id":2306,"name":"緣道觀音廟","lat":25.21262,"lng":121.49106,"cat":"worship","desc":"仿唐式廟宇坐落淡水山谷，步道串起小橋、流水與瀑布造景。庭園裡分布著三十三尊觀音石雕，遠處還可望見大屯山與七星山。","area":"淡水區・新北市","ph":"觀"},{"id":2307,"name":"鄞山寺(汀州會館)","lat":25.169295,"lng":121.44824,"cat":"worship","tag":"古蹟","desc":"清代汀州人在淡水建寺，供奉家鄉信仰的定光古佛。從這座兼具會館身分的廟宇，可以認識南方客家移民帶來的祭祀傳統。","area":"淡水區・新北市","ph":"文"},{"id":2308,"name":"錦繡莊文化園區","lat":25.18472,"lng":121.479,"cat":"culture","desc":"淡水瓦窯坑的庭園裡，園主把多年收藏的古石雕安置在原有地景中。沿石階經過池塘與涼亭，草木間還穿插著佛像、石獅與詩畫。","area":"淡水區・新北市","ph":"觀"},{"id":2309,"name":"關渡媽祖石","lat":25.125588,"lng":121.463894,"cat":"worship","tag":"古蹟","area":"淡水區・新北市","ph":"文"},{"id":2310,"name":"雲門劇場","lat":25.18017,"lng":121.42932,"cat":"culture","desc":"雲門舞集的八里排練場遭逢火災後，來到中央廣播電臺淡水分臺舊址。這座結合原有建築打造的劇場，延續了舞團在臺灣創作與演出的歷程。","area":"淡水區・新北市","ph":"觀"},{"id":2311,"name":"馬偕紀念館","lat":25.1743,"lng":121.43543,"cat":"culture","desc":"馬偕在淡水成家後與妻子張聰明同住於此。這棟白色西班牙式住宅由他親自設計督工，採用廈門建材，廊道因應北臺灣潮濕多雨的氣候。","area":"淡水區・新北市","ph":"觀"},{"id":2312,"name":"深坑老街","lat":25.00169,"lng":121.61474,"cat":"structure","desc":"街口的大茄冬樹是深坑老街的地標，街裡最有名的是帶炭香的豆腐。除了用鹽滷製成的豆腐，在地的茶葉、竹筍和黑豬肉也合稱深坑四寶。","area":"深坑區・新北市","ph":"觀"},{"id":2313,"name":"深坑黃氏永安居","lat":25.001062,"lng":121.610927,"cat":"history","tag":"古蹟","desc":"黃則水兄弟在萬順寮興建的三合院，以對山砂岩砌成基座，上面再疊磚牆。抬頭可見燕尾脊與剪黏匾額，護龍山牆也藏著綠釉花磚窗。","area":"深坑區・新北市","ph":"文"},{"id":2314,"name":"炮子崙瀑布","lat":24.98655,"lng":121.60703,"cat":"scenic","desc":"深坑的炮子崙溪流入山谷，在蓊鬱山林間形成瀑布。水量充足時，瀑頂會分出四道水柱並排落下，「四龍瀑布」的別名便由此而來。","area":"深坑區・新北市","ph":"觀"},{"id":2315,"name":"鎮南宮","lat":24.99157,"lng":121.61505,"cat":"worship","desc":"深坑阿柔里山中的這座廟，主祀一塊被風化成媽祖模樣的巨石。居民稱祂為石媽祖，圍護廟宇的牆也由一塊塊方石堆砌而成。","area":"深坑區・新北市","ph":"觀"},{"id":2316,"name":"大羅蘭溪","lat":24.77468,"lng":121.50069,"cat":"scenic","desc":"泰雅語地名指兩溪交會之處，從巴陵越嶺狩獵的族人曾因水土豐沃在此定居。溪道在青翠兩岸間時寬時窄，清水裡還看得到魚群。","area":"烏來區・新北市","ph":"觀"},{"id":2317,"name":"桶後溪","lat":24.83681,"lng":121.63138,"cat":"other","area":"烏來區・新北市","ph":"觀"},{"id":2318,"name":"烏來加九寮臺車道橋樑遺構","lat":24.884403,"lng":121.538729,"cat":"history","tag":"歷史建築","area":"烏來區・新北市","ph":"文"},{"id":2319,"name":"烏來台車","lat":24.861007,"lng":121.550516,"cat":"scenic","desc":"昔日載運木材的小台車，後來成了通往烏來瀑布的觀光車。最早由人力推行，改用柴油引擎後，瀑布站也開鑿隧道取代迴轉用的轉盤。","area":"烏來區・新北市","ph":"觀"},{"id":2320,"name":"烏來吊橋","lat":24.86552,"lng":121.55166,"cat":"other","desc":"南勢溪上的吊橋架在三層樓高的橋墩間，橋墩裝飾著泰雅族傳統圖騰。登橋向北看是紅色拱橋，向南則能俯瞰南勢溪與桶後溪匯流。","area":"烏來區・新北市","ph":"觀"},{"id":2321,"name":"烏來林業生活館","lat":24.84851,"lng":121.55172,"cat":"culture","area":"烏來區・新北市","ph":"觀"},{"id":2322,"name":"烏來溫泉","lat":24.8634,"lng":121.55034,"cat":"other","desc":"當地泰雅族以「烏來」稱呼滾燙的泉水，地名也和溫泉相連。這裡的碳酸氫鈉泉散布在攬勝大橋周邊，以及忠治、西羅岸等地。","area":"烏來區・新北市","ph":"觀"},{"id":2323,"name":"烏來瀑布遊客中心","lat":24.84845,"lng":121.55126,"cat":"other","desc":"瀑布遊客中心所在的烏來山區，兩側山峰夾著蜿蜒溪流。附近的烏來瀑布落差約八十公尺，一道白色水流從高處直落山谷。","area":"烏來區・新北市","ph":"觀"},{"id":2324,"name":"烏來空中纜車","lat":24.84904,"lng":121.55159,"cat":"other","desc":"這座往復式空中纜車橫越烏來山谷，一車上山，另一車便下山。從車廂往外看，烏來瀑布的白色水流與南勢溪峽谷都在眼前。","area":"烏來區・新北市","ph":"觀"},{"id":2325,"name":"烏來紅河谷","lat":24.88435,"lng":121.54034,"cat":"other","desc":"加九寮溪在這裡匯入南勢溪，清澈的水裡可見魚蝦游動。從紅色的加九寮景觀大橋俯瞰，形狀各異的巨石散布在碧綠溪流間。","area":"烏來區・新北市","ph":"觀"},{"id":2326,"name":"烏來老街","lat":24.86414,"lng":121.55162,"cat":"structure","desc":"從烏來街到瀑布路一帶，街上可以嘗到馬告料理、月桃飯與炭烤山豬肉。店家也賣小米酒和小米麻糬，沿途還有機會欣賞原住民族歌舞。","area":"烏來區・新北市","ph":"觀"},{"id":2327,"name":"烏來覽勝大橋","lat":24.86192,"lng":121.55136,"cat":"other","desc":"連起烏來老街與溫泉街的這座大橋，從南勢溪上橫跨兩岸。橋梁曾遭風災損壞，後來提高防洪標準，翻修後成了烏來的地標。","area":"烏來區・新北市","ph":"觀"},{"id":2328,"name":"烏來觀光台車","lat":24.86131,"lng":121.55109,"cat":"other","desc":"沿著烏來走向瀑布的鐵軌，最早行駛的是運木台車。當年工人改以人力推車載客，後來引進柴油動力，也在瀑布站鑿出迴轉隧道。","area":"烏來區・新北市","ph":"觀"},{"id":2329,"name":"酋長文創園區","lat":24.848,"lng":121.55104,"cat":"culture","desc":"烏來的歌舞劇場以泰雅族文化為主題，節目從迎賓舞、竹竿舞到婚宴慶典舞蹈。舞者頭上的翎毛或花冠，以及象徵紋面的臉部彩繪，也都是看點。","area":"烏來區・新北市","ph":"觀"},{"id":2330,"name":"三瓜子隧道及三貂嶺舊隧道","lat":25.056461,"lng":121.84204,"cat":"history","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2331,"name":"三貂嶺車站","lat":25.06554,"lng":121.82256,"cat":"other","desc":"基隆河左岸的小站，月臺旁的鐵道沿著上游河谷延伸。三貂嶺站早在一九二二年啟用，沿線除了峭立山壁，還可見河床被水鑽出的壺穴。","area":"瑞芳區・新北市","ph":"觀"},{"id":2332,"name":"九份老街","lat":25.10987,"lng":121.84518,"cat":"structure","desc":"淘金者曾讓山坡上的聚落繁盛，也留下層層疊疊的街屋。電影《悲情城市》在這裡取景，九份面山望海的街景也隨著銀幕走入更多人的記憶。","area":"瑞芳區・新北市","ph":"觀"},{"id":2333,"name":"九份金礦博物館","lat":25.10794,"lng":121.8423,"cat":"culture","desc":"老礦工曾水池把九份自家的房舍改成博物館，由兒孫接力守護。館內收藏他從坑裡帶出的千餘種原石，保留下尚未提煉的礦石模樣。","area":"瑞芳區・新北市","ph":"觀"},{"id":2334,"name":"五番坑","lat":25.10706,"lng":121.84214,"cat":"other","desc":"日治時期開鑿的礦坑，曾以高空輸送管把礦土送到山下的搗礦場。坑口前原有輕便鐵路，如今前方的小公園平臺可以望向深澳岬角。","area":"瑞芳區・新北市","ph":"觀"},{"id":2335,"name":"八斗子車站","lat":25.13444,"lng":121.80194,"cat":"scenic","desc":"深澳線的終點緊貼太平洋海岸，簡樸的無人月臺橫跨瑞芳與基隆的交界。站在月臺上，可以望著列車沿山海之間的鐵道駛來。","area":"瑞芳區・新北市","ph":"觀"},{"id":2336,"name":"勸濟堂","lat":25.11034,"lng":121.85965,"cat":"worship","desc":"金瓜石居民奉關聖帝君為守護神，廟裡既有背山望海的巨型銅像，也有從唐山分靈的金面神像。石柱上的花鳥人物以立體雕刻呈現。","area":"瑞芳區・新北市","ph":"觀"},{"id":2337,"name":"南雅奇岩(南雅奇石)","lat":25.1196,"lng":121.8928,"cat":"scenic","desc":"東北角南雅海岸山勢陡峭，沿岸奇岩讓這條地質步道成了露天教室。沿著海岸觀察各種岩體的輪廓，也能看見東北角典型的海蝕地貌。","area":"瑞芳區・新北市","ph":"觀"},{"id":2338,"name":"國際終戰和平紀念園區","lat":25.11093,"lng":121.85833,"cat":"culture","desc":"二戰期間，日軍在金瓜石設立戰俘營，關押來自多個同盟國的戰俘。園區紀念這段戰俘被迫採掘銅礦、有人因此喪命的歷史。","area":"瑞芳區・新北市","ph":"觀"},{"id":2339,"name":"新北市立黃金博物館","lat":25.10796,"lng":121.85766,"cat":"culture","desc":"這座以金瓜石為現場的生態博物館，把礦業遺址、山間聚落和自然景觀一併納入。沿著金瓜石與水湳洞留下的礦業痕跡，也能認識礦區居民的生活。","area":"瑞芳區・新北市","ph":"觀"},{"id":2340,"name":"昇平戲院","lat":25.10873,"lng":121.84341,"cat":"culture","desc":"九份昔日市場旁的木造戲臺，原是人們聚在一起看歌仔戲的地方。戲臺倒塌後原地興建戲院，後來《多桑》和《悲情城市》都曾在此取景。","area":"瑞芳區・新北市","ph":"觀"},{"id":2341,"name":"本山五坑","lat":25.10659,"lng":121.85896,"cat":"other","desc":"金瓜石本山山腰上的五坑，屬於昔日九座採礦坑道之一。礦車頭、壓風機、盥洗間與運礦索道留存下來，讓人看見採金所需的設備。","area":"瑞芳區・新北市","ph":"觀"},{"id":2342,"name":"水湳洞本山六坑口及索道系統","lat":25.11243,"lng":121.859961,"cat":"history","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2343,"name":"水湳洞選煉廠","lat":25.118313,"lng":121.864654,"cat":"history","tag":"歷史建築","desc":"俗稱「十三層遺址」的舊選煉廠坐落水湳洞山坡，過去用來提煉金、銀、銅礦。遠看廠房像層層堆起的宮殿，長長的廢煙道則隱現在山稜間。","area":"瑞芳區・新北市","ph":"文"},{"id":2344,"name":"深澳漁港","lat":25.13259,"lng":121.82071,"cat":"other","desc":"舊稱「番仔澳」的漁港位在深澳岬角，港邊散布著適合磯釣的岩岸。港內的海釣船常往基隆嶼與北方三島海域，讓這裡以休閒海釣聞名。","area":"瑞芳區・新北市","ph":"觀"},{"id":2345,"name":"猴硐介壽橋紀念碑","lat":25.088553,"lng":121.829374,"cat":"history","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2346,"name":"猴硐壺穴","lat":25.07954,"lng":121.82486,"cat":"other","desc":"猴硐至三貂嶺之間，基隆河切過堅硬的暖暖砂岩，在河床留下許多圓滑坑洞。強勁渦流帶著砂石長期旋轉磨蝕，才鑽出這些壺穴。","area":"瑞芳區・新北市","ph":"觀"},{"id":2347,"name":"猴硐煤礦博物園區","lat":25.08687,"lng":121.82785,"cat":"culture","desc":"煤礦曾支撐猴硐聚落的生活，運煤橋與瑞三鑛業整煤廠都留在園區一帶。從整煤的廠房到運送煤炭的橋，串得起當年礦業的生產過程。","area":"瑞芳區・新北市","ph":"觀"},{"id":2348,"name":"猴硐礦工文史館","lat":25.08074,"lng":121.82415,"cat":"culture","desc":"退休礦工合力把瑞三本礦的舊事務所變成文史館，留住猴硐採煤的記憶。館方用礦工剪影作為標誌，呼應上千人曾在此下坑工作的歲月。","area":"瑞芳區・新北市","ph":"觀"},{"id":2349,"name":"猴硐神社鳥居","lat":25.087619,"lng":121.829279,"cat":"history","tag":"歷史建築","desc":"這座鳥居屬於日治時期建立的猴硐神社，設立緣起與當地煤礦事業有關。瑞三鑛業創辦人李建興等人率團敬獻，留下礦區信仰的痕跡。","area":"瑞芳區・新北市","ph":"文"},{"id":2350,"name":"猴硐貓公所","lat":25.08793,"lng":121.82746,"cat":"other","desc":"猴硐由煤礦聚落轉型為貓村後，地方成立專門照護街貓的貓公所。從清點貓口、製作身分證到設置醫療站，都屬於它的工作。","area":"瑞芳區・新北市","ph":"觀"},{"id":2351,"name":"猴硐貓村","lat":25.0872,"lng":121.8268,"cat":"other","desc":"車站旁的村落因居民與志工照顧街貓而聞名，愛貓人也循著網路分享來訪。聚落裡的貓不太怕人，散步時就有機會看見牠們的身影。","area":"瑞芳區・新北市","ph":"觀"},{"id":2352,"name":"猴硐貓橋","lat":25.08696,"lng":121.82722,"cat":"other","desc":"原為車頭頂聚落居民進出而建的車站陸橋，後來連起貓村與煤礦園區。隨著兩側往來的人變多，狹窄的舊陸橋也迎來改建。","area":"瑞芳區・新北市","ph":"觀"},{"id":2353,"name":"猴硐車站","lat":25.0868,"lng":121.82753,"cat":"other","desc":"這座鐵路小站的舊稱「猴洞」，來自附近山中曾有猴群棲身的洞穴。瑞芳至猴洞段在日治時期通車，站名後來才改寫作「猴硐」。","area":"瑞芳區・新北市","ph":"觀"},{"id":2354,"name":"猴硐遊客中心","lat":25.09191,"lng":121.83132,"cat":"other","desc":"靠近金字碑古道的遊客中心，以紅色薄膜屋頂呼應聚落的老磚房。開放長廊讓風和日光進入中庭，低垂的屋面把雨水引入花園。","area":"瑞芳區・新北市","ph":"觀"},{"id":2355,"name":"瑞三鑛業整煤廠","lat":25.08665,"lng":121.82754,"cat":"history","desc":"猴硐煤礦聚落裡，瑞三鑛業留下的整煤廠是北臺灣礦業史的一處見證。廠房遺跡記錄了昔日礦工來到猴硐討生活的歲月。","area":"瑞芳區・新北市","ph":"觀"},{"id":2356,"name":"瑞芳區臺金濂洞煉銅廠煙道","lat":25.112414,"lng":121.8646,"cat":"history","tag":"文化景觀","area":"瑞芳區・新北市","ph":"文"},{"id":2357,"name":"瑞芳四腳亭砲台","lat":25.1168,"lng":121.781162,"cat":"history","tag":"古蹟","desc":"位在基隆港東南方的砲臺，原名深澳堡壘，是日治初期興建的防禦工事。當時為防範軍隊從澳底或宜蘭方向登陸，將砲兵部署於這一帶。","area":"瑞芳區・新北市","ph":"文"},{"id":2358,"name":"瑞芳翁山英故居","lat":25.108147,"lng":121.843541,"cat":"history","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2359,"name":"瑞芳老街","lat":25.10954,"lng":121.80655,"cat":"structure","desc":"往日的渡口附近有家商店名叫「瑞芳」，來往宜蘭的旅人與上山淘金的人常在此歇腳。人們說著要去瑞芳，久而久之，店名也成了地名。","area":"瑞芳區・新北市","ph":"觀"},{"id":2360,"name":"磅坑口","lat":25.10875,"lng":121.83952,"cat":"other","desc":"「磅硿口」是當地人對隧道口的稱呼，九份山這條隧道曾容得下兩輛輕便車交會。山泉會從堅硬岩壁的縫隙滲下，大雨過後尤其明顯。","area":"瑞芳區・新北市","ph":"觀"},{"id":2361,"name":"礦工宿舍","lat":25.07917,"lng":121.82487,"cat":"other","desc":"猴硐礦工家庭居住的工寮，地方上稱作「寮仔」。早期房內用木板隔間，兩戶能透過牆上的小孔共用一盞燈，廚房與浴廁也共同使用。","area":"瑞芳區・新北市","ph":"觀"},{"id":2362,"name":"祈堂老街(金瓜石老街)","lat":25.10966,"lng":121.85853,"cat":"worship","desc":"黃金博物館上方的山坡聚落，昔日是礦工日常買賣的中心，有「金瓜石銀座」之稱。沿著山勢建起的街屋至今仍有人居住，保留小城生活的樣貌。","area":"瑞芳區・新北市","ph":"觀"},{"id":2363,"name":"聖明宮","lat":25.10792,"lng":121.84418,"cat":"worship","desc":"廟裡主祀的關聖帝君，原在金山民宅中受奉，日治時期才移到九份崙仔頂。後來居民在此成立勸忠堂，並祀孚佑帝君等五位恩主公。","area":"瑞芳區・新北市","ph":"觀"},{"id":2364,"name":"臺陽公司瑞芳辦事處歷史建築群","lat":25.110105,"lng":121.842721,"cat":"history","tag":"歷史建築","desc":"八號坪的瑞芳鑛業所設在八番坑旁，後來成為臺陽公司的辦事處。平屋頂搭配層次錯落的出簷板，西北側則可見形似亭仔腳的柱列。","area":"瑞芳區・新北市","ph":"文"},{"id":2365,"name":"臺陽礦業國英坑","lat":25.113045,"lng":121.838947,"cat":"history","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2366,"name":"舊宜蘭線猴硐隧道群","lat":25.102259,"lng":121.830244,"cat":"history","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2367,"name":"蝙蝠洞公園","lat":25.12632,"lng":121.83212,"cat":"nature","desc":"瑞芳海岸的公園設有賞蝠平臺，可在傍晚觀察蝙蝠活動。園旁通往海濱社區的舊鐵道路線，還留有海濱車站的遺跡。","area":"瑞芳區・新北市","ph":"觀"},{"id":2368,"name":"豎崎路","lat":25.10903,"lng":121.84328,"cat":"other","desc":"九份山城這條縱向街道全由石階串起，兩旁紅磚與木造街屋間，有茶藝館與昇平戲院。入夜後紅燈籠沿階亮起，也能從街上遠眺山城聚落。","area":"瑞芳區・新北市","ph":"觀"},{"id":2369,"name":"金字碑","lat":25.084072,"lng":121.840914,"cat":"history","tag":"古蹟","desc":"清代總兵劉明燈北巡經過三貂嶺，把沿途山勢寫成詩，題在古道旁的岩壁。刻字原貼有金箔，被人喚作金字牌，碑首還雕著雙龍托珠。","area":"瑞芳區・新北市","ph":"文"},{"id":2370,"name":"金瓜石地質公園 (本山礦體)","lat":25.10166,"lng":121.85878,"cat":"nature","desc":"山頂露出的金脈岩體形似金瓜，成了金瓜石地名的由來。這座礦山的金脈從山頂一路向下延伸，直至海平面以下仍有分布。","area":"瑞芳區・新北市","ph":"觀"},{"id":2371,"name":"金瓜石太子賓館","lat":25.107812,"lng":121.858352,"cat":"culture","tag":"古蹟","desc":"昔日臺金公司的第一招待所，在金瓜石留下講究的迎賓入口。沿階梯望向玄關，幾何排列的洗石子地坪、屋頂破風與一旁的厚皮香互相呼應。","area":"瑞芳區・新北市","ph":"文"},{"id":2372,"name":"金瓜石礦業圳道及圳橋","lat":25.112152,"lng":121.853785,"cat":"history","tag":"古蹟","desc":"金瓜石山區的圳道與圳橋，曾把溪水引往水湳洞製煉場的儲水池與濃泥槽。溪谷間的拱橋橋面呈凹字形，至今還看得出昔日引水的構造。","area":"瑞芳區・新北市","ph":"文"},{"id":2373,"name":"金瓜石神社","lat":25.104774,"lng":121.858773,"cat":"history","tag":"古蹟","desc":"日治初期來到金瓜石工作的日本礦業人員，在最早開採的本山第一坑附近設立山神社。山頭東側的小平地，寄託著礦工面對危險工作時的信仰。","area":"瑞芳區・新北市","ph":"文"},{"id":2374,"name":"金瓜石金泉寺及火葬場","lat":25.111526,"lng":121.854521,"cat":"worship","tag":"歷史建築","area":"瑞芳區・新北市","ph":"文"},{"id":2375,"name":"開成殿(天公廟)","lat":25.10792,"lng":121.84664,"cat":"worship","desc":"九份高處的天公廟主祀玉皇大帝，與福山宮為鄰。來到這處居民祈福的廟宇，還能利用居高臨下的視野，欣賞整片山城景色。","area":"瑞芳區・新北市","ph":"觀"},{"id":2376,"name":"陰陽海","lat":25.12294,"lng":121.86412,"cat":"scenic","desc":"水湳洞外海可見近岸的黃褐色與外海的藍色相接，形成漸層。金瓜石山上的礦物風化後隨水入海，含鐵懸浮物讓海灣顯出獨特色澤。","area":"瑞芳區・新北市","ph":"觀"},{"id":2377,"name":"黃金瀑布","lat":25.11718,"lng":121.86157,"cat":"scenic","desc":"水湳洞山間，溪畔裸露的岩石沿途泛著金黃色。溪水到了瀑布順著一層層金黃岩面奔流而下，湍急的白色水花襯出岩床的顏色。","area":"瑞芳區・新北市","ph":"觀"},{"id":2378,"name":"鼻頭龍洞地質公園","lat":25.12123,"lng":121.8871,"cat":"nature","desc":"從鼻頭到龍洞，海浪與風在岩岸留下海蝕溝、海崖與蜂窩般的孔洞。仔細看岩面，還能辨認交錯的層理、生痕化石，以及成片的蕈狀岩。","area":"瑞芳區・新北市","ph":"觀"},{"id":2379,"name":"吊腳樓","lat":24.99099,"lng":121.66033,"cat":"history","desc":"石碇東街的房屋倚著柱子撐在河床上方，這種順應溪岸空間的建築便是吊腳樓。街屋緊密相連，也形成當地少見的「不見天街」。","area":"石碇區・新北市","ph":"觀"},{"id":2380,"name":"文山煤礦公車站","lat":25.01064,"lng":121.67719,"cat":"other","desc":"石碇昔日礦區的候車亭，由地方團隊重新設計，留下採煤生活的線索。坐椅仿照礦工使用的台車，低頭還能看見地面彩繪的鐵軌。","area":"石碇區・新北市","ph":"觀"},{"id":2381,"name":"格頭雲瀑","lat":24.94371,"lng":121.6226,"cat":"scenic","desc":"小格頭四周群山環繞，樹林間的水氣聚成雲霧，常有低海拔的雲海可看。向北望去，玉桂嶺等山頭時而浮出雲面，時而隱入白霧。","area":"石碇區・新北市","ph":"觀"},{"id":2382,"name":"石碇北宜公路","lat":24.99795,"lng":121.65301,"cat":"other","desc":"這條連接臺北與宜蘭的山區公路，全長約五十八公里。沿線穿過新店、石碇與坪林，越過頭城金面山後，山區景色轉為蘭陽平原。","area":"石碇區・新北市","ph":"觀"},{"id":2383,"name":"石碇宗教文化園區","lat":25.01609,"lng":121.69851,"cat":"culture","desc":"石碇永定里的宮廟沿山路分布，聖興宮、姑娘廟與財神廟等形成信仰聚落。姑娘橋景觀廊道、濱水廣場和觀魚賞鳥步道串起沿岸空間。","area":"石碇區・新北市","ph":"觀"},{"id":2384,"name":"石碇淡蘭藝文館","lat":24.99095,"lng":121.65974,"cat":"culture","desc":"想認識石碇的地方文化與藝術，可以從館內一樓的「石碇達人所」開始。這裡展示石碇特色商品，也提供地方導覽與旅遊資訊。","area":"石碇區・新北市","ph":"觀"},{"id":2385,"name":"石碇老街","lat":24.99072,"lng":121.66094,"cat":"structure","desc":"萬壽橋把石碇老街分為兩側，西街曾是染布與茶葉買賣的集散地，東街隨採煤興起。沿溪架空的吊腳樓和緊密相連的不見天街，留下聚落發展的痕跡。","area":"石碇區・新北市","ph":"觀"},{"id":2386,"name":"佛光山石門北海道場","lat":25.25558,"lng":121.57069,"cat":"other","desc":"石門的佛光山道場承襲人間佛教的理念，重視佛法和日常生活的連結。教育、文化、慈善與醫療等利生事業，都是教團實踐信仰的方式。","area":"石門區・新北市","ph":"觀"},{"id":2387,"name":"十八王公廟","lat":25.29205,"lng":121.58623,"cat":"worship","desc":"乾華里這座祠廟的信仰，源於十七位商人與一隻忠犬的傳說。相傳商人海難身亡，倖存的狗也隨主人殉死，居民將牠和眾人合葬。","area":"石門區・新北市","ph":"觀"},{"id":2388,"name":"富基漁港","lat":25.2926,"lng":121.5353,"cat":"other","desc":"富貴岬附近的小漁村，利用隱蔽寬闊的灣澳發展近海漁業。這裡以盛產花蟹聞名，漁船帶回的還有龍蝦、烏賊及各式魚蝦貝類。","area":"石門區・新北市","ph":"觀"},{"id":2389,"name":"富貴角","lat":25.29828,"lng":121.53763,"cat":"scenic","desc":"冬季東北季風在臺灣本島北端的岬角留下風稜石，也把樹木吹成獨特姿態。循平緩步道沿礁岸走，沿途可見濱海植物及八角形燈塔。","area":"石門區・新北市","ph":"觀"},{"id":2390,"name":"富貴角公園","lat":25.29239,"lng":121.53839,"cat":"nature","desc":"老梅海灣由富貴角與石門礁岸環抱，園內並存風稜石、石槽與沙丘。平緩的步道沿著海岬展開，適合慢慢欣賞形態各異的海岸地景。","area":"石門區・新北市","ph":"觀"},{"id":2391,"name":"尖山湖紀念碑","lat":25.24074,"lng":121.56469,"cat":"other","desc":"日治時期一架日本海軍飛機因天候不佳墜落尖山湖，機上七人罹難。當局在墜機處樹立高大的紀念碑，也設置神社與石燈柱弔祭。","area":"石門區・新北市","ph":"觀"},{"id":2392,"name":"新十八王公廟","lat":25.27204,"lng":121.59484,"cat":"worship","desc":"半山腰的廟宇供奉十八王公，信仰中特別引人注目的是第十八位忠犬王公。廟旁有一尊約十層樓高的黑龍義犬塑像，以蹲坐姿態守在山間。","area":"石門區・新北市","ph":"觀"},{"id":2393,"name":"白沙灣遊客中心（白沙灣自然中心）","lat":25.28399,"lng":121.5202,"cat":"other","desc":"白沙灣的環境教育基地，把北海岸的沙、海與石滬漁業帶入課程。從觀察沙粒認識大屯火山地質，到淨灘與海洋保育，都以眼前的海岸為教材。","area":"石門區・新北市","ph":"觀"},{"id":2394,"name":"石門婚紗廣場","lat":25.28763,"lng":121.53128,"cat":"nature","desc":"石門海邊這片廣場原是鐵皮攤販聚集處，後來改為供人拍婚紗的空間。面海的場景以藍白色搭配，讓地中海風格的造景與海面同框。","area":"石門區・新北市","ph":"觀"},{"id":2395,"name":"石門嵩山社區百年石砌梯田","lat":25.24424,"lng":121.56654,"cat":"other","desc":"尖山湖附近的梯田以陽明山火山岩砌成，先民用三角鼎立的方式交錯堆疊田埂。沿田間小徑望去，幾何狀石牆也會與盛開的鳶尾花或波斯菊相映。","area":"石門區・新北市","ph":"觀"},{"id":2396,"name":"石門情人廟","lat":25.28134,"lng":121.53982,"cat":"worship","desc":"富基漁港上方的廟宇主祀西藏愛情如意佛，人們前來祈求姻緣與家庭和睦。主廟兩旁還有一對枝幹彼此纏繞的夫妻樹。","area":"石門區・新北市","ph":"觀"},{"id":2397,"name":"石門洞","lat":25.2959,"lng":121.56843,"cat":"scenic","desc":"海岸上的天然石門是石門區地名的由來，清代就列入淡水外八景。循階梯登上洞頂，可以俯看沿岸浪濤，天際還望得見富貴角燈塔。","area":"石門區・新北市","ph":"觀"},{"id":2398,"name":"石門風力發電站(風車公園)","lat":25.29278,"lng":121.58182,"cat":"nature","desc":"石門山頭的風力發電機組利用當地風場，也是臺灣早期商轉風電的地標。沿人行步道可到觀景臺欣賞風車，現場看板也呈現機組運轉資訊。","area":"石門區・新北市","ph":"觀"},{"id":2399,"name":"石門風箏公園","lat":25.2897,"lng":121.54871,"cat":"nature","desc":"老梅海邊的風箏公園，緣起於石門歷年舉辦的風箏節。寬廣場地迎著海風，既是各地好手交流放飛的地方，也讓家庭能一起牽線放風箏。","area":"石門區・新北市","ph":"觀"},{"id":2400,"name":"老梅石槽","lat":25.29209,"lng":121.54546,"cat":"other","desc":"春天的老梅海岸，大片海藻附著在一列列石槽上，讓岩岸染上鮮綠。順著海岸望去，綠色帶狀紋路沿溝槽並排伸展，是這片海岸最鮮明的景象。","area":"石門區・新北市","ph":"觀"},{"id":2401,"name":"老梅綠石槽","lat":25.29235,"lng":121.5454,"cat":"other","desc":"老梅海岸的石槽到了春天便披上綠藻，從岸邊看去，一道道鮮綠色延伸向海。蔚藍海水與石槽相映，也吸引許多攝影愛好者。","area":"石門區・新北市","ph":"觀"},{"id":2402,"name":"草里漁港","lat":25.28236,"lng":121.60624,"cat":"other","desc":"舊名阿里荖的小漁港，最早是小漁船與舢舨的停泊處。港灣水淺，漁船平日在此作業，風浪較大時便轉往鄰近的富基漁港避風。","area":"石門區・新北市","ph":"觀"},{"id":2403,"name":"國聖埔據點","lat":25.20362,"lng":121.6763,"cat":"other","desc":"野柳岬旁的這處海防據點，原先是軍事管制區，後來才轉為濱海休憩空間。山海之間仍保留海巡崗哨與碉堡的特色。","area":"萬里區・新北市","ph":"觀"},{"id":2404,"name":"東澳漁港","lat":25.20358,"lng":121.69265,"cat":"other","desc":"野柳半島東側的小港藏在灣內，灣外有山岬和伸向海中的岩礁。居民多以捕魚維生，漁船日常作業的漁場就在半島東邊的近海。","area":"萬里區・新北市","ph":"觀"},{"id":2405,"name":"汪汪地瓜園產業故事館","lat":25.21498,"lng":121.64424,"cat":"culture","desc":"金山賴家兄妹從販售地瓜與控窯體驗出發，後來成立地瓜故事館。門前的小黃狗雕像迎客，館裡則以炭火甕烤出地瓜的香氣。","area":"萬里區・新北市","ph":"觀"},{"id":2406,"name":"瑪鋉運動公園","lat":25.17505,"lng":121.68989,"cat":"nature","desc":"公園就在瑪鋉溪右岸，和萬里國小隔溪相望。「瑪鋉」沿用萬里的舊地名，溪畔的單槓、漫步機與轉腰器則供居民活動筋骨。","area":"萬里區・新北市","ph":"觀"},{"id":2407,"name":"萬里大鵬足湯公園","lat":25.21302,"lng":121.64831,"cat":"nature","desc":"萬里的足湯公園把溫泉泡腳池設在半戶外空間，泡腳時也能感受周邊環境。池旁有涼亭，附近的員潭溪景觀橋與自行車道串起溪景。","area":"萬里區・新北市","ph":"觀"},{"id":2408,"name":"萬里漁村生活館","lat":25.20519,"lng":121.68922,"cat":"culture","desc":"萬里沿海聚落的生計和漁業息息相關，港裡往往停滿漁船。在漁村生活館認識漁業知識，也能多了解眼前這片海岸與居民的關係。","area":"萬里區・新北市","ph":"觀"},{"id":2409,"name":"螃蟹主題公園","lat":25.19485,"lng":121.68677,"cat":"nature","desc":"龜吼海邊的公園以萬里蟹為主角，兩座大型螃蟹公仔相當醒目。從公園望向海面，既可看潮汐起落，也能觀察河水推積的砂粒。","area":"萬里區・新北市","ph":"觀"},{"id":2410,"name":"野柳保安宮","lat":25.20443,"lng":121.68803,"cat":"worship","desc":"野柳漁港旁供奉開漳聖王的廟宇，與靠海維生的村落緊鄰。萬里一帶漁民長久以來敬奉這位神明，把祂視為海上生活的精神寄託。","area":"萬里區・新北市","ph":"觀"},{"id":2411,"name":"野柳地質公園","lat":25.2064,"lng":121.69047,"cat":"nature","desc":"大屯山餘脈伸向海中形成的岬角，經風化與海蝕留下滿地奇岩。除了女王頭，沿途還有蕈狀岩、豆腐石、燭狀岩與壺穴可細看。","area":"萬里區・新北市","ph":"觀"},{"id":2412,"name":"野柳海洋世界","lat":25.2052,"lng":121.69122,"cat":"other","desc":"野柳地質公園旁的三層環形建築，是北海岸的海洋展示場館。館內可以觀察海獅、海豚，探索海底世界，也有水上芭蕾與高空跳水表演。","area":"萬里區・新北市","ph":"觀"},{"id":2413,"name":"野柳漁港","lat":25.20499,"lng":121.68721,"cat":"other","desc":"野柳半島西側的天然灣澳，日治時期已有防波堤與供小船停靠的碼頭。漁港後來逐步擴建，見證萬里沿岸漁業與漁貨運銷的發展。","area":"萬里區・新北市","ph":"觀"},{"id":2414,"name":"野柳燈塔","lat":25.21357,"lng":121.69725,"cat":"other","desc":"野柳岬頂的燈塔立在龜頭山最高處，造型取自當地海岸的燭臺石。它位在富貴角與基隆兩座燈塔之間，協助船舶辨識基隆港方向。","area":"萬里區・新北市","ph":"觀"},{"id":2415,"name":"高家繡球花田-第三園區","lat":25.17133,"lng":121.6316,"cat":"culture","desc":"萬里的花田裡，繡球花沿著小溪與小徑綻放，園內還種出雙心圖樣。走到高處回望，可以一眼看見大片花田交錯的品種與色彩。","area":"萬里區・新北市","ph":"觀"},{"id":2416,"name":"龜吼漁港","lat":25.19649,"lng":121.68895,"cat":"other","desc":"萬里漁民把當日漁獲直接在港邊卸下拍賣，小漁村也逐漸形成魚市。彩繪樓房與湛藍海水圍著漁港，市集由在地船主經營。","area":"萬里區・新北市","ph":"觀"},{"id":2417,"name":"湧蓮寺","lat":25.08326,"lng":121.47135,"cat":"worship","desc":"蘆洲市街的廟宇因所在地被視為蓮花穴，得名「湧蓮」。正殿供奉南海觀世音佛祖，兩旁有善才、龍女與護法陪祀，是居民的信仰中心。","area":"蘆洲區・新北市","ph":"觀"},{"id":2418,"name":"蘆洲保和宮","lat":25.084074,"lng":121.471279,"cat":"worship","tag":"古蹟","desc":"泉州同安李氏移居蘆洲後，依照原鄉信仰重塑保生大帝像。最初由族內七個角頭輪流奉祀，後來組成神明會，延續在臺家族的祭祀傳統。","area":"蘆洲區・新北市","ph":"文"},{"id":2419,"name":"蘆洲八角樓","lat":25.080397,"lng":121.471239,"cat":"history","tag":"歷史建築","desc":"溪墘聚落裡的磚造八角樓，前方留有一小片庭園。立面上的泥塑、洗石子簷板，以及以幾何圖案分割的推拉窗，都值得停下細看。","area":"蘆洲區・新北市","ph":"文"},{"id":2420,"name":"蘆洲李宅","lat":25.085426,"lng":121.466659,"cat":"history","tag":"古蹟","desc":"李家祖宅依中軸對稱布局，三進宅院共有六道護龍。特別的是兩側各有一列護龍朝外，另外圍成院落，從格局上看如同三座合院並排。","area":"蘆洲區・新北市","ph":"文"},{"id":2421,"name":"蘆洲陳頭北古厝","lat":25.095897,"lng":121.461977,"cat":"history","tag":"古蹟","desc":"蘆洲陳家的傳統三合院，由正身與兩側護龍圍合而成。正廳屋簷用立磚把雨水引往兩旁，再由鰲魚口排出，兼具裝飾與排水功能。","area":"蘆洲區・新北市","ph":"文"},{"id":2422,"name":"三貂角燈塔","lat":25.00755,"lng":122.00189,"cat":"scenic","desc":"臺灣本島東端的白色燈塔，俯望馬崗漁港與萊萊海岸。館內設有展示空間，天氣晴朗時從高處向海望去，還能看見遠方的龜山島。","area":"貢寮區・新北市","ph":"觀"},{"id":2423,"name":"卯澳吳家樓仔厝","lat":25.013521,"lng":121.98905,"cat":"history","tag":"歷史建築","desc":"卯澳吳家老宅的主屋前方圍著厚實石牆，入口門框還保留原有的亂石砌法。靠近轉角處，較平整的大石和周圍石塊搭配出不同紋理。","area":"貢寮區・新北市","ph":"文"},{"id":2424,"name":"卯澳故事館","lat":25.01493,"lng":121.989,"cat":"culture","desc":"舊草嶺自行車道旁的故事館園區，保留卯澳的海岸原生林、石頭屋和水梯田。沿塊石步道走到樹蔭下，可以同時聽見林梢風聲與海潮。","area":"貢寮區・新北市","ph":"觀"},{"id":2425,"name":"卯澳漁村","lat":25.01178,"lng":121.99164,"cat":"other","desc":"三貂角附近的老漁村面向海灣，居民長年捕魚或養殖九孔。相傳從高處看，灣澳的輪廓像個「卯」字，村名便由此而來。","area":"貢寮區・新北市","ph":"觀"},{"id":2426,"name":"卯澳灣（卯澳社區）","lat":25.01255,"lng":121.99152,"cat":"other","desc":"三貂角西側的小海灣，左右有萊萊山與荖蘭山環抱。鐵路與幹道都繞過聚落，讓灣內至今保留東北角傳統漁村的風貌。","area":"貢寮區・新北市","ph":"觀"},{"id":2427,"name":"卯澳石頭古厝建築","lat":25.01328,"lng":121.98926,"cat":"other","desc":"卯澳人用海岸砂岩砌牆、後山竹材搭屋架，老屋原本多以野茅草覆頂。最常見的一條龍格局，用大小相近的卵石或略經打鑿的石塊疊起牆身。","area":"貢寮區・新北市","ph":"觀"},{"id":2428,"name":"和美漁港","lat":25.07912,"lng":121.91407,"cat":"other","desc":"三貂角附近這座小漁港，周邊海岸可見接連的海蝕崖。海岸地形升降，加上東北季風吹來的浪長期侵蝕，塑造了港外的岩岸風貌。","area":"貢寮區・新北市","ph":"觀"},{"id":2429,"name":"四角窟觀景台","lat":25.00395,"lng":122.0023,"cat":"other","desc":"舊草嶺環狀線沿途的觀景臺，可以從高處俯看四角窟海岸。下方海蝕平臺平坦開闊，常能看見釣客站在岩岸面海垂釣。","area":"貢寮區・新北市","ph":"觀"},{"id":2430,"name":"東興宮","lat":25.02048,"lng":121.95038,"cat":"worship","desc":"挖子地方的王爺信仰，始於居民從基隆和平島迎來林、溫、傅三府王爺香火。最初村民以茅草搭起小廟，一同祭拜、祈求聚落平安。","area":"貢寮區・新北市","ph":"觀"},{"id":2431,"name":"桃源谷","lat":24.96639,"lng":121.89202,"cat":"scenic","desc":"綿延數公里的山頂草原，舊稱綑牛仔山，是早年孩子在農閒時放牛、嬉戲的地方。秋冬山風和海風一起吹過草坡，滿山芒花隨風起伏。","area":"貢寮區・新北市","ph":"觀"},{"id":2432,"name":"極東公園","lat":25.01144,"lng":122.0029,"cat":"nature","desc":"馬崗漁港旁的公園靠著山、面向太平洋，鄰近臺灣本島極東點。從步道走上觀景平臺，可把漁村與海天相接的遼闊水面一併收入眼底。","area":"貢寮區・新北市","ph":"觀"},{"id":2433,"name":"澳底漁港","lat":25.05747,"lng":121.92651,"cat":"other","desc":"三面環山的天然灣澳，海底多岩石、漂砂少，日治時期已有小型避風泊地。港內既可見近海漁業的日常，也保有供船隻避風的功能。","area":"貢寮區・新北市","ph":"觀"},{"id":2434,"name":"福隆車站","lat":25.01589,"lng":121.94472,"cat":"other","desc":"臺鐵福隆站的站前風景，少不了熱騰騰的便當香。假日常看到旅人各自捧著一個便當，乾脆坐在站門口的臺階上吃起來。","area":"貢寮區・新北市","ph":"觀"},{"id":2435,"name":"福隆遊客中心","lat":25.01692,"lng":121.9425,"cat":"other","desc":"福隆海水浴場旁的紅瓦白牆建築，兼具遊客中心與藝文展覽空間。館內的展示與解說涵蓋東北角海岸的自然生態、人文史蹟及景點。","area":"貢寮區・新北市","ph":"觀"},{"id":2436,"name":"福龍海洋驛站","lat":25.02073,"lng":121.95114,"cat":"other","desc":"海巡廳舍轉型成親近海洋的休憩與教育空間，福龍是這項計畫最早設置的一站。它分成福隆與龍門兩個分站，沿著東北角海岸展開。","area":"貢寮區・新北市","ph":"觀"},{"id":2437,"name":"舊草嶺自行車隧道","lat":25.00535,"lng":121.9576,"cat":"other","desc":"福隆到石城間的舊鐵路山洞，用紅磚砌出長長的圓拱。北口「制天險」的門額寫下穿山之難，這條隧道也和民謠《丟丟銅仔》相連。","area":"貢寮區・新北市","ph":"觀"},{"id":2438,"name":"舊草嶺隧道","lat":25.00395,"lng":121.95834,"cat":"history","desc":"穿過草嶺的舊鐵路隧道，曾是宜蘭線串連福隆與石城的重要工程。南口題著「白雲飛處」，北口則是「制天險」，留下當年鑿山通車的記憶。","area":"貢寮區・新北市","ph":"觀"},{"id":2439,"name":"虎字碑","lat":24.9806,"lng":121.925942,"cat":"history","tag":"古蹟","desc":"草嶺古道風口的天然崖石上，清代總兵劉明燈留下草書「虎」字。筆勢一氣呵成，周圍刻有對稱雲紋，寄託了鎮風的用意。","area":"貢寮區・新北市","ph":"文"},{"id":2440,"name":"貢寮新社慈仁宮暨奉憲示禁碑","lat":25.024851,"lng":121.922173,"cat":"worship","tag":"古蹟","area":"貢寮區・新北市","ph":"文"},{"id":2441,"name":"貢寮環保公園","lat":25.02143,"lng":121.90567,"cat":"nature","desc":"雙溪對岸的公園沿用原有地貌，把山丘與濕地步道融入河畔綠地。從貢寮老街一側散步，可以沿著重新整理的水道欣賞河岸景觀。","area":"貢寮區・新北市","ph":"觀"},{"id":2442,"name":"貢寮老街","lat":25.02025,"lng":121.90922,"cat":"structure","desc":"雙溪南岸的老街入口，有座裝飾山豬圖樣的牌樓。這個設計呼應貢寮舊名「槓仔寮」，其中「槓仔」一詞在巴賽族語中指的是陷阱。","area":"貢寮區・新北市","ph":"觀"},{"id":2443,"name":"遇見雞母嶺","lat":25.06803,"lng":121.90018,"cat":"other","desc":"貢寮西北的山村因早年雉雞成群而得名，曾是淡蘭北路楊廷理古道的重要據點。先民在山地開闢水梯田，留下聚落鮮明的農耕地景。","area":"貢寮區・新北市","ph":"觀"},{"id":2444,"name":"遠望坑親水公園","lat":25.00253,"lng":121.92997,"cat":"nature","desc":"草嶺古道北端入口的谷地四面環山，步道穿過梯田與溪谷。水流聲夾著鳥鳴，到了夏末秋初，沿途還能聞到白色野薑花的香氣。","area":"貢寮區・新北市","ph":"觀"},{"id":2445,"name":"金沙灣海濱公園","lat":25.07513,"lng":121.916,"cat":"nature","desc":"龍洞與澳底之間的小海灣，陽光灑下時，灘地會泛出金色。海邊兼有沙和礫石，面前是開闊藍海，適合沿著灣岸慢慢欣賞。","area":"貢寮區・新北市","ph":"觀"},{"id":2446,"name":"雄鎮蠻煙碑","lat":24.990359,"lng":121.925001,"cat":"history","tag":"古蹟","desc":"草嶺古道上的天然崖石，保留劉明燈所書的「雄鎮蠻煙」。四個楷書大字旁有雲紋浮雕，落款還可辨認同治六年的年代與題字人的身分。","area":"貢寮區・新北市","ph":"文"},{"id":2447,"name":"靈鷲山‧福城","lat":25.01818,"lng":121.9503,"cat":"other","desc":"福隆的靈鷲山福城，把天眼石窟的造型帶入室內空間。石窟意象配合多媒體互動展示，讓參觀者在虛實交錯的場景中認識佛教主題。","area":"貢寮區・新北市","ph":"觀"},{"id":2448,"name":"靈鷲山無生道場","lat":25.01777,"lng":121.97316,"cat":"other","desc":"福隆海邊的山上道場三面環海，從阿育王柱入山，可望向太平洋。沿途經過天眼門與十一面觀音，還可見朝海端望的黑面金身多羅觀音。","area":"貢寮區・新北市","ph":"觀"},{"id":2449,"name":"靈鷲山無生道場","lat":25.02157,"lng":121.9832,"cat":"other","desc":"心道法師創建的山頂道場，以一對鷹眼造型的天眼門迎人。門旁石柱刻有不同宗教的圖像，登高則能遠望東北角海岸與日升日落。","area":"貢寮區・新北市","ph":"觀"},{"id":2450,"name":"馬崗哨所","lat":25.01689,"lng":121.9976,"cat":"other","desc":"通往馬崗潮間帶的路上，白色哨所坐落在海岸高處。觀景臺正好能俯看潮間帶的地質紋理，再把視線一路延伸到遠處的海平線。","area":"貢寮區・新北市","ph":"觀"},{"id":2451,"name":"馬崗漁港","lat":25.01378,"lng":122.00478,"cat":"other","desc":"三貂角燈塔下方的海岸，是馬崗漁民日常出海的起點。港內漁船多往龜山島與三貂灣作業，當日往返，附近岩岸也有釣客磯釣。","area":"貢寮區・新北市","ph":"觀"},{"id":2452,"name":"馬崗潮間帶","lat":25.01594,"lng":122.00035,"cat":"other","desc":"漁港前有一片被海浪磨平的海蝕平臺，表面散布小潮池和潮溝。低頭望向岩面，可以看見綠藻在潮水進退之間生長。","area":"貢寮區・新北市","ph":"觀"},{"id":2453,"name":"馬崗街11、12號民宅","lat":25.013558,"lng":122.00186,"cat":"history","tag":"歷史建築","desc":"馬崗街相鄰的兩戶民宅，用就地取得、大小不一的砂岩砌出屋牆與防浪牆。厚實石屋和身後山景、眼前海面，組成海角漁村的生活風景。","area":"貢寮區・新北市","ph":"文"},{"id":2454,"name":"鮮物本鋪","lat":25.07236,"lng":121.91964,"cat":"other","desc":"貢寮海邊曾是九孔養殖重鎮，後來受病菌影響，養殖業一度衰退。在地第二代回鄉利用與海相通的潮池，藉天然潮汐換水，延續九孔養殖。","area":"貢寮區・新北市","ph":"觀"},{"id":2455,"name":"鹽寮抗日紀念碑","lat":25.04142,"lng":121.92752,"cat":"other","desc":"鹽寮海濱公園裡的石碑，紀念乙未戰爭中臺灣軍民抵抗日軍的歷史。《馬關條約》簽訂後，日軍從澳底登陸，這段海岸也成為戰事的起點。","area":"貢寮區・新北市","ph":"觀"},{"id":2456,"name":"鹽寮海濱公園(藍灣海濱休憩園區)","lat":25.04124,"lng":121.92645,"cat":"nature","desc":"貢寮鹽寮的海濱公園，金黃色沙岸一路向福隆延伸。開闊灘地除了能看海，也是沙雕、沙灘排球和灘釣等活動的場地。","area":"貢寮區・新北市","ph":"觀"},{"id":2457,"name":"龍洞四季灣","lat":25.10192,"lng":121.91819,"cat":"other","desc":"龍洞的露天海水泳池，由天然海蝕平臺改建而成，讓泳池與海岸景觀連在一起。周圍步道也能漫步望海，感受東北角不同季節的風貌。","area":"貢寮區・新北市","ph":"觀"},{"id":2458,"name":"龍洞岩場","lat":25.11342,"lng":121.922,"cat":"other","desc":"龍洞海岸的峭壁由堅硬緻密的四稜砂岩構成，源自古老的近海沉積。岩縫間可以看見攀岩用的固定點，這裡也是攀岩者熟悉的天然岩場。","area":"貢寮區・新北市","ph":"觀"},{"id":2459,"name":"龍洞灣海洋公園","lat":25.11799,"lng":121.9174,"cat":"nature","desc":"東北角的龍洞灣能遮擋外海潮流，清澈灣水裡聚集多種魚類。雀鯛、蝶魚和隆頭魚都在這裡棲息，其中又以變色雀鯛特別常見。","area":"貢寮區・新北市","ph":"觀"},{"id":2460,"name":"龍門吊橋","lat":25.02277,"lng":121.93545,"cat":"scenic","desc":"雙溪上的紅色吊橋連著福隆與龍門，從綠樹間橫過水面。站在橋上可以看河岸與福隆的金黃沙灘，有時還能望見獨木舟滑過。","area":"貢寮區・新北市","ph":"觀"},{"id":2461,"name":"中山溫泉公園","lat":25.22198,"lng":121.63998,"cat":"nature","desc":"金山的公園重新引入溫泉水，把泡腳池與原有的金包里公共浴室結合在一起。散步來到池畔，也能看見溫泉如何融入地方生活。","area":"金山區・新北市","ph":"觀"},{"id":2462,"name":"中角灣","lat":25.23895,"lng":121.6344,"cat":"other","desc":"金山這片內凹的沙岸，常有北風推起一道道浪，是北海岸知名的衝浪地點。假日時站在海邊，就能看見許多衝浪者在浪頭上來去。","area":"金山區・新北市","ph":"觀"},{"id":2463,"name":"中角灣(中角灣國際衝浪基地)","lat":25.2412,"lng":121.6334,"cat":"other","desc":"北風吹向內凹的灣口，讓中角灣持續湧起適合衝浪的浪花。岸上有細沙與寬廣淺灘，既能近看浪頭，也能看衝浪者沿著浪面滑行。","area":"金山區・新北市","ph":"觀"},{"id":2464,"name":"新北市衝浪運動教育園區","lat":25.23972,"lng":121.6306,"cat":"culture","desc":"金山的衝浪教育園區串起海灣、校園與陸上練習場。從中角國小的衝浪學苑到金山高中的戶外場地，可以看見沿海運動如何走入學校。","area":"金山區・新北市","ph":"觀"},{"id":2465,"name":"朱銘美術館","lat":25.24645,"lng":121.61119,"cat":"culture","desc":"雕塑家朱銘選在金山的山間打造藝術公園，把不同時期的作品放進不同地貌。沿著戶外空間行走，欣賞雕塑的同時也能看見周圍山色。","area":"金山區・新北市","ph":"觀"},{"id":2466,"name":"水尾景觀公園","lat":25.22104,"lng":121.6425,"cat":"nature","desc":"金包里溪和員潭溪在水尾漁村旁匯流入海，背後就是獅頭山。沿員潭溪景觀步道散步，拱橋橫過水面，把山腳漁村與河口景色連在一起。","area":"金山區・新北市","ph":"觀"},{"id":2467,"name":"水尾景觀公園","lat":25.22233,"lng":121.6471,"cat":"nature","desc":"獅頭山腳的小漁村面向出海口，來自金山與萬里的員潭溪在水尾流入海洋。溪水與金包里溪交會，讓人在海岸邊也能看見清澈溪景。","area":"金山區・新北市","ph":"觀"},{"id":2468,"name":"燭臺雙嶼","lat":25.23284,"lng":121.6545,"cat":"scenic","desc":"金山岬外的兩座石柱，原是岬角連成一體的岩石。海浪沿節理侵蝕，先形成海蝕洞與海拱，最後留下這對流傳「夫妻石」傳說的海上地標。","area":"金山區・新北市","ph":"觀"},{"id":2469,"name":"獅頭山公園(獅頭山步道)","lat":25.22533,"lng":121.64574,"cat":"nature","desc":"金山岬上的公園位在海拔約七十公尺的高處，步道沿途保有豐富生態。向東可望野柳岬，轉向西側則有磺港漁港與中角海岸。","area":"金山區・新北市","ph":"觀"},{"id":2470,"name":"磺清大橋","lat":25.2298,"lng":121.63525,"cat":"scenic","desc":"金山清水農地間的磺清路看來筆直，路面卻一路高低起伏，居民形容為「波浪大道」。這段路也是萬金石馬拉松沿途辨識度很高的景色。","area":"金山區・新北市","ph":"觀"},{"id":2471,"name":"磺港公共浴室(黃金之湯)","lat":25.22779,"lng":121.64406,"cat":"other","desc":"金山大屯山地熱帶的泉水剛湧出時透明無色，接觸空氣後才漸漸變成金褐色。池底的沉積和泉色，都來自泉水所含的鐵。","area":"金山區・新北市","ph":"觀"},{"id":2472,"name":"磺港漁港","lat":25.23042,"lng":121.64774,"cat":"other","desc":"金山岬西南側的漁港開在磺溪河口，過去曾用來運送大屯山硫磺，因而得名。厚層砂岩構成的岬角擋住東北季風，讓船隻有處避風。","area":"金山區・新北市","ph":"觀"},{"id":2473,"name":"芑豐居(李芑豐古宅)","lat":25.23057,"lng":121.62647,"cat":"other","desc":"漳州移民李佈來金山開墾，家族留下北海岸的閩南式三合院。前方半月形池塘映著老宅，院落也保存了金包里望族的居住樣貌。","area":"金山區・新北市","ph":"觀"},{"id":2474,"name":"金包里慈護宮","lat":25.220796,"lng":121.640294,"cat":"worship","tag":"歷史建築","desc":"相傳地方人士捐地募款，才在金包里建起這座媽祖廟。原廟供奉的媽祖如今稱「大媽」，地方也流傳著居民在野柳海邊岩洞發現媽祖像的故事。","area":"金山區・新北市","ph":"文"},{"id":2475,"name":"金山慈護宮","lat":25.22092,"lng":121.64028,"cat":"worship","desc":"金山人稱為「大廟」的慈護宮，坐落下街，主祀金面媽祖。從屋架到屋頂處處可見細緻雕工，大殿還保存清代同治年間的八角龍柱。","area":"金山區・新北市","ph":"觀"},{"id":2476,"name":"金山老街(金包里老街)","lat":25.22183,"lng":121.63827,"cat":"structure","desc":"金包里老街過去集散金山的農產與漁獲，保留清代以來的街市風貌。廣安宮廟口的鴨肉攤延續特有的吃法，客人自己端菜穿行街上。","area":"金山區・新北市","ph":"觀"},{"id":2477,"name":"金山舊機場遺址","lat":25.23029,"lng":121.62116,"cat":"history","desc":"金山昔日的小型軍用機場，多數原址已經改變用途。現場還留下三個巨大的石輪，當年用來滾壓地面，成了辨識舊機場的線索。","area":"金山區・新北市","ph":"觀"},{"id":2478,"name":"金山遊客中心","lat":25.22325,"lng":121.64467,"cat":"other","desc":"獅頭山海濱公園入口的遊客中心，位在欣賞燭臺雙嶼的山海動線上。周邊一側是獅頭山步道，另一處可認識地方歷史的是金包里老街。","area":"金山區・新北市","ph":"觀"},{"id":2479,"name":"丁蘭谷","lat":25.01713,"lng":121.87594,"cat":"scenic","desc":"雙溪魚行里的丁子蘭坑，有一片早年列入雙溪八景的山谷景色。谷中結合原有的自然環境與生態工法造景，留下山村的風貌。","area":"雙溪區・新北市","ph":"觀"},{"id":2480,"name":"三忠廟","lat":25.03476,"lng":121.86478,"cat":"worship","desc":"雙溪居民也稱這座廟為三公廟，供奉南宋的文天祥、陸秀夫與張世傑。清代移民連元喬渡海來臺時，便攜著一尊文天祥神像。","area":"雙溪區・新北市","ph":"觀"},{"id":2481,"name":"三貂嶺生態友善隧道","lat":25.05683,"lng":121.84301,"cat":"history","desc":"昔日宜蘭線的鐵路隧道，荒廢多年後改為單車與步行空間。鋼筋鋪成的路面穿越山洞，洞口水池也讓暗處到亮處的過渡成為風景。","area":"雙溪區・新北市","ph":"觀"},{"id":2482,"name":"不厭亭","lat":25.08941,"lng":121.84753,"cat":"other","desc":"雙溪與九份交界的山亭，名字取自李白「相看兩不厭」的詩句。兩側可分望雙溪與瑞芳，晴時看得見海，雲氣聚合時又有雲海。","area":"雙溪區・新北市","ph":"觀"},{"id":2483,"name":"十三層親水公園(三貂親水公園)","lat":25.07792,"lng":121.85376,"cat":"nature","desc":"牡丹溪中游的高灘地，闢成一片被山林環抱的親水公園。溪水沿著草地流過，附近層層梯田和零星農舍，也成了河岸風景的一部分。","area":"雙溪區・新北市","ph":"觀"},{"id":2484,"name":"南天花苑","lat":25.03991,"lng":121.86883,"cat":"other","desc":"雙溪南天宮後方的三座小山丘，遍植杜鵑、櫻花與楓香。這片曾列入雙溪八景的花苑，和奉祀關聖帝君的廟宇共同構成風景。","area":"雙溪區・新北市","ph":"觀"},{"id":2485,"name":"林益和堂中藥店","lat":25.0346,"lng":121.86456,"cat":"worship","desc":"雙溪老街上的中藥店由中醫師林燦廷在清代創立，由後代接續經營。西式洋樓融合古典裝飾，在三忠廟附近的街屋間相當醒目。","area":"雙溪區・新北市","ph":"觀"},{"id":2486,"name":"牡丹老街","lat":25.05881,"lng":121.85073,"cat":"structure","desc":"雙溪山間的牡丹曾因淘金興盛，產業轉移後，街區漸漸安靜下來。老街上的駐地工作站以咖啡、山藥奶昔和地方故事接待來訪的人。","area":"雙溪區・新北市","ph":"觀"},{"id":2487,"name":"牡丹車站","lat":25.05877,"lng":121.85199,"cat":"other","desc":"宜蘭線這座小站舊稱武丹坑驛，後來才遷到現在的位置。為了減緩鐵路坡度，站內軌道繞出約一百二十度的大彎，是月臺旁的特殊風景。","area":"雙溪區・新北市","ph":"觀"},{"id":2488,"name":"聖南寺","lat":25.0507,"lng":121.85738,"cat":"worship","desc":"雙溪早期建立的佛教道場，在山區對外往來不易的年代開始興建。幾代住持接力經營，後來由第四代住持宏修法師完成各項建設。","area":"雙溪區・新北市","ph":"觀"},{"id":2489,"name":"茶花莊","lat":25.03141,"lng":121.84641,"cat":"other","desc":"雙溪的茶花園栽培來自臺灣以外多地的茶花，品種包括日本、美國與加拿大等地的栽培種。從花瓣排列到花朵大小，都能看出差異。","area":"雙溪區・新北市","ph":"觀"},{"id":2490,"name":"落羽松秘境","lat":25.04785,"lng":121.86163,"cat":"other","desc":"雙溪與牡丹之間有一片落羽松林，原是宜蘭線鐵路改道後留下的土地。林地緊鄰仍在使用的鐵道，可以同時看見樹列與列車穿行。","area":"雙溪區・新北市","ph":"觀"},{"id":2491,"name":"虎豹潭","lat":24.9721,"lng":121.82761,"cat":"scenic","desc":"北勢溪北支流源頭的深潭，因兩旁山丘像虎與豹而得名。墨綠潭水映著山林，沿潭旁環狀步道散步，秋日還可看到山坡上的芒花。","area":"雙溪區・新北市","ph":"觀"},{"id":2492,"name":"軟橋段親水公園","lat":25.03361,"lng":121.8395,"cat":"nature","desc":"雙溪平林一帶的溪畔公園，採生態工法整理水岸。清澈溪水加上封溪禁漁所保留下來的魚群，讓這段溪岸成了觀魚的地方。","area":"雙溪區・新北市","ph":"觀"},{"id":2493,"name":"連舉人古厝","lat":25.03585,"lng":121.86198,"cat":"history","desc":"雙溪的連旭春赴福州參加鄉試中舉，鄉人便稱他的住所為「舉人厝」。清代總兵劉明燈巡察噶瑪蘭途中，也曾特意前來拜訪。","area":"雙溪區・新北市","ph":"觀"},{"id":2494,"name":"雙溪保我黎民碑","lat":25.035618,"lng":121.864339,"cat":"history","tag":"古蹟","area":"雙溪區・新北市","ph":"文"},{"id":2495,"name":"雙溪車站","lat":25.03855,"lng":121.86653,"cat":"other","desc":"昔日的頂雙溪驛原為木造站房，隨煤礦興盛、客貨量增加，改建為水泥站房。站內設有兩座島式月臺，往牡丹一段的鐵道坡度較陡。","area":"雙溪區・新北市","ph":"觀"},{"id":2496,"name":"雙溪雙貢生莊厝","lat":25.03113,"lng":121.846895,"cat":"history","tag":"古蹟","desc":"莊家兄弟先後成為貢生，讓耕讀傳家的宅院有了「雙貢生」之稱。砂岩石牆上可見竹節造型窗櫺，周圍雕著花草與象徵福氣的蝙蝠。","area":"雙溪區・新北市","ph":"文"},{"id":2497,"name":"魚行驛站","lat":25.02576,"lng":121.87366,"cat":"other","desc":"魚行里的綠地曾是清代官兵整備之處，採煤年代又成為傾倒煤渣的灘地。今日驛站把地方煤礦記憶融入土地公廟、瞭望臺與植栽空間。","area":"雙溪區・新北市","ph":"觀"},{"id":2498,"name":"Lipahak三鶯原生態園區","lat":24.94173,"lng":121.35495,"cat":"culture","desc":"大漢溪右岸、鳶山腳下的高灘地，由都市裡的原住民族人共同耕種。園區緊鄰南靖部落，名字在阿美族語中有「發自內心的歡喜」之意。","area":"鶯歌區・新北市","ph":"觀"},{"id":2499,"name":"二坑隧道","lat":24.95944,"lng":121.3625,"cat":"other","desc":"鶯歌孫龍步道沿途的小隧道，過去是輕便運煤車行經的路段。當年的軌道通往五益煤礦二坑，礦坑停採後仍留下這段產業痕跡。","area":"鶯歌區・新北市","ph":"觀"},{"id":2500,"name":"宏德宮","lat":24.95781,"lng":121.35643,"cat":"worship","desc":"鶯歌居民口中的孫臏廟，主祀戰國時代的孫臏。廟名取「宏揚武德」之意，規模雖小，廟宇裝飾卻相當精緻華麗。","area":"鶯歌區・新北市","ph":"觀"},{"id":2501,"name":"新北市立鶯歌陶瓷博物館","lat":24.94925,"lng":121.35203,"cat":"culture","desc":"鶯歌的陶瓷專業博物館，把臺灣近百年的製陶歷程搬進展覽。從地方產業的發展認識陶器，也能看到不同世代留在器物裡的生活記憶。","area":"鶯歌區・新北市","ph":"觀"},{"id":2502,"name":"新北市美術館","lat":24.95349,"lng":121.35823,"cat":"culture","desc":"鶯歌溪與大漢溪交會處，銀白色美術館的外牆豎起高低錯落的管狀線條。建築師取材自河岸蘆葦，讓整片牆面有如一叢迎風搖曳的植物。","area":"鶯歌區・新北市","ph":"觀"},{"id":2503,"name":"新旺集瓷","lat":24.95117,"lng":121.3478,"cat":"culture","desc":"這處鶯歌陶藝空間用動手做的方式介紹傳統工藝。從親自手拉坯開始，人們可以在手掌與陶土接觸的過程中認識陶瓷。","area":"鶯歌區・新北市","ph":"觀"},{"id":2504,"name":"汪洋居古厝","lat":24.95267,"lng":121.35327,"cat":"history","desc":"文化路上的磚造街屋有三開間、兩層樓，騎樓與二樓牆面以巴洛克式裝飾修飾。屋裡留存昔日經營米糧用的錢櫃，記錄鶯歌的商業歲月。","area":"鶯歌區・新北市","ph":"觀"},{"id":2505,"name":"碧龍宮","lat":24.96247,"lng":121.36611,"cat":"worship","desc":"廟中供奉的石頭狀似大龜，龜背還有八卦般的紋路，地方因此稱這裡為龜公廟。相傳曾姓父子在樹下發現奇石，後來才築廟奉祀。","area":"鶯歌區・新北市","ph":"觀"},{"id":2506,"name":"臺華窯","lat":24.95089,"lng":121.34857,"cat":"other","desc":"鶯歌這家窯場從一九八三年創立，長年研究陶瓷的釉色與燒製技術。從器物的形制到彩瓷的表現，都能看出窯場嘗試建立自身風格的歷程。","area":"鶯歌區・新北市","ph":"觀"},{"id":2507,"name":"許新旺陶瓷紀念博物館","lat":24.9509,"lng":121.3478,"cat":"culture","desc":"從一九二六年開始的鶯歌陶業，後來以許新旺之名成立紀念博物館。館裡安排手拉坯、手捏陶與釉上彩繪，可從製作過程認識陶瓷。","area":"鶯歌區・新北市","ph":"觀"},{"id":2508,"name":"鶯歌合興窯煙囪","lat":24.95606,"lng":121.3592,"cat":"history","tag":"歷史建築","area":"鶯歌區・新北市","ph":"文"},{"id":2509,"name":"鶯歌成發居","lat":24.953261,"lng":121.354004,"cat":"history","tag":"歷史建築","area":"鶯歌區・新北市","ph":"文"},{"id":2510,"name":"鶯歌永吉公園","lat":24.96027,"lng":121.3351,"cat":"nature","desc":"炮仗花盛開時，成串橘色筒狀花像小喇叭般垂下，與公園內不同品種的櫻花同場。除了沿路賞花，園裡也有遊戲與體健設施。","area":"鶯歌區・新北市","ph":"觀"},{"id":2511,"name":"鶯歌汪洋居","lat":24.952772,"lng":121.35316,"cat":"history","tag":"古蹟","desc":"余家經營米糧，在鶯歌建起三開間的紅磚店屋。抬頭看半圓山牆，商號匾額旁的南瓜與藤蔓象徵子孫連綿，兩側還有鏤空磚欄杆。","area":"鶯歌區・新北市","ph":"文"},{"id":2512,"name":"鶯歌烘爐窯","lat":24.953426,"lng":121.355479,"cat":"history","tag":"歷史建築","desc":"鶯歌製陶產業留下的老窯，南面外牆有四個拱口，曾用來進出陶瓷產品。風化牆面露出不同砌磚方式，女兒牆還以紅磚排成連續八角圖案。","area":"鶯歌區・新北市","ph":"文"},{"id":2513,"name":"鶯歌百年大榕樹","lat":24.97621,"lng":121.36842,"cat":"scenic","desc":"位在鶯歌、樹林與龜山交界的老榕樹，曾是兔仔坑通往鶯歌山路的制高點。如今多條稜線與山林步道在此交會，樹下成了認路的地標。","area":"鶯歌區・新北市","ph":"觀"},{"id":2514,"name":"鶯歌石","lat":24.958747,"lng":121.360087,"cat":"history","tag":"文化景觀","desc":"鶯歌地名來自山頭一塊形似鳥類的天然巨石，清代方志已記錄相關傳說。民間故事中，這隻石鳥曾吐出霧瘴，阻擋鄭成功軍隊前進。","area":"鶯歌區・新北市","ph":"文"},{"id":2515,"name":"鶯歌老街","lat":24.95221,"lng":121.34734,"cat":"structure","desc":"陶瓷街、尖山埔路一帶的舊陶廠，逐漸轉成商店與手作空間。逛街時既能看到各式陶藝作品，也能從老廠房想像鶯歌曾經的製陶生活。","area":"鶯歌區・新北市","ph":"觀"},{"id":2516,"name":"鶯歌車站","lat":24.95457,"lng":121.35515,"cat":"other","area":"鶯歌區・新北市","ph":"觀"},{"id":2517,"name":"兒八公園碉堡","lat":24.823867,"lng":120.947474,"cat":"nature","tag":"歷史建築","desc":"南寮一帶的公園整地時，才發現被樹木掩住的戰時碉堡。這座工事建於二戰末期，原負責機場防禦，後來原地保留成為公園的一部分。","area":"北區・新竹市","ph":"文"},{"id":2518,"name":"內天后宮","lat":24.800822,"lng":120.961994,"cat":"worship","tag":"歷史建築","desc":"新竹人稱這座廟為內媽祖廟，主祀天上聖母。清代廟宇周圍不僅是居民祭拜之處，也因人群聚集而形成興盛的市集。","area":"北區・新竹市","ph":"文"},{"id":2519,"name":"南寮運動公園","lat":24.844269,"lng":120.930842,"cat":"nature","desc":"南寮漁港附近的公園容納足球場、槌球場與兒童遊戲區。自行車道沿園區環繞，橋下還設籃球場，讓不同年齡的人都有地方運動。","area":"北區・新竹市","ph":"觀"},{"id":2520,"name":"原新竹地方法院","lat":24.808159,"lng":120.96785,"cat":"history","tag":"歷史建築","desc":"舊法院前身為日治時期臺北地方法院新竹支部，後來掌理整個新竹州的司法事務。入口門廊挑高，外牆以洗石子搭配溝面磚。","area":"北區・新竹市","ph":"文"},{"id":2521,"name":"周益記","lat":24.806233,"lng":120.9657,"cat":"history","tag":"古蹟","desc":"新竹周家第四代周敏益買下的傳統街屋，沿用「周益記」之名。實際建造年代仍難確定，神明廳立柱上卻留有清代庚辰年的落款。","area":"北區・新竹市","ph":"文"},{"id":2522,"name":"市府大禮堂","lat":24.807438,"lng":120.969491,"cat":"history","tag":"歷史建築","desc":"這座新竹市府集會空間，保留戰後現代建築的折板屋頂與大跨度會堂。外牆從預鑄空心水泥花磚到洗石子立面，都能看出當時的營造方式。","area":"北區・新竹市","ph":"文"},{"id":2523,"name":"康朗段防空碉堡","lat":24.823867,"lng":120.947474,"cat":"history","tag":"古蹟","desc":"新竹機場西北端的防空工事，建於二戰末期，以鋼筋混凝土澆成。吊鐘狀碉堡分成四層，厚實底座與逐層向上的輪廓相當鮮明。","area":"北區・新竹市","ph":"文"},{"id":2524,"name":"康樂段防空碉堡","lat":24.823867,"lng":120.947474,"cat":"history","tag":"古蹟","desc":"二戰末期為守衛新竹機場，日軍在西北側設下防空碉堡。康樂段的堡體外觀像吊鐘，厚實的鋼筋混凝土結構高約十二公尺。","area":"北區・新竹市","ph":"文"},{"id":2525,"name":"張氏節孝坊","lat":24.816882,"lng":120.969942,"cat":"history","tag":"古蹟","desc":"湳雅莊萬年橋畔的石坊，為紀念鄭用錦之妻張棗娘而設。從清代同治年間題准到正式落成相隔數年，是新竹留下的節孝牌坊之一。","area":"北區・新竹市","ph":"文"},{"id":2526,"name":"或者新州屋","lat":24.80464,"lng":120.96808,"cat":"culture","desc":"新竹舊城的這棟百貨樓，由戴吳獅家族創立，是當地早期的百貨公司。歷經商業型態改變與多年歇業，老樓後來由或者團隊投入再利用。","area":"北區・新竹市","ph":"觀"},{"id":2527,"name":"新竹少年刑務所演武場","lat":24.803876,"lng":120.959773,"cat":"culture","tag":"古蹟","desc":"日治時期新竹少年刑務所的演武場，以磚牆與洗石子做出傳統日式木構的外觀。外牆突出線條像梁枋，入口的雙坡屋頂也突顯正門位置。","area":"北區・新竹市","ph":"文"},{"id":2528,"name":"新竹少年刑務所職務官舍群","lat":24.823867,"lng":120.947474,"cat":"history","tag":"歷史建築","desc":"昔日新竹少年刑務所的官舍區，依職務等級配置不同住宅。除了單層木造的丙種、丁種官舍，生活區還設有鋪臺灣瓦的木造浴場。","area":"北區・新竹市","ph":"文"},{"id":2529,"name":"新竹州廳","lat":24.806708,"lng":120.968824,"cat":"history","tag":"古蹟","desc":"日治時期統轄桃竹苗的行政中樞，以兩層磚造建築圍成對稱的ㄇ字形。旁邊的檔案室採清水磚牆與圓形頂窗，保留官署建築的細節。","area":"北區・新竹市","ph":"文"},{"id":2530,"name":"新竹市役所","lat":24.806346,"lng":120.970086,"cat":"history","tag":"古蹟","desc":"新竹升格為市時，這座兩層樓磚造廳舍也啟用，成為市政辦公處。屋頂和裝飾帶有日本傳統樣式，搭配西方近代建築的屋身。","area":"北區・新竹市","ph":"文"},{"id":2531,"name":"新竹市警察局(原新竹警察署)","lat":24.806374,"lng":120.968546,"cat":"history","tag":"歷史建築","desc":"新竹升格為市後設警察署，日治時期另建這座兩層樓的加強磚造廳舍。新竹市警察局沿用舊署建築，留下警政機關在此發展的歷史。","area":"北區・新竹市","ph":"文"},{"id":2532,"name":"新竹水仙宮","lat":24.80857,"lng":120.964988,"cat":"worship","tag":"古蹟","desc":"長和宮旁的小巷另一側，坐落著供奉水仙尊王的廟宇。這位北門郊商敬奉的航海神，原先安奉在長和宮後殿，與地方貿易關係密切。","area":"北區・新竹市","ph":"文"},{"id":2533,"name":"新竹漁港","lat":24.848839,"lng":120.926673,"cat":"scenic","area":"北區・新竹市","ph":"觀"},{"id":2534,"name":"新竹都城隍廟","lat":24.804228,"lng":120.965619,"cat":"worship","tag":"古蹟","desc":"竹塹城西門街的市場裡，廟中供奉城隍爺與城隍夫人。清代行政區劃更動，城隍神格也從廳城隍逐次晉升，民間因此稱為都城隍廟。","area":"北區・新竹市","ph":"文"},{"id":2535,"name":"新竹都城隍廟","lat":24.804504,"lng":120.96294,"cat":"worship","desc":"清代淡水同知曾曰瑛倡建這座廟，後來臺北府初設府治於新竹，城隍也晉升為威靈公。地方上以「新竹城隍爺」稱道這裡的香火。","area":"北區・新竹市","ph":"觀"},{"id":2536,"name":"新竹鄭氏家廟","lat":24.809965,"lng":120.965477,"cat":"worship","tag":"古蹟","desc":"北門街上的家廟，由新竹浯江鄭氏在清代咸豐年間創建。家族原居福建漳浦，後來遷到浯江，也就是今日金門，這段遷徙成了家廟的背景。","area":"北區・新竹市","ph":"文"},{"id":2537,"name":"新竹長和宮","lat":24.808534,"lng":120.964895,"cat":"worship","tag":"古蹟","desc":"北門街旁的媽祖廟建於清代乾隆年間，正面朝向舊竹塹城的北門出口。因早年位於城外，居民也稱它「外媽祖廟」，與城內的媽祖廟區別。","area":"北區・新竹市","ph":"文"},{"id":2538,"name":"李克承博士故居","lat":24.801539,"lng":120.964172,"cat":"history","tag":"古蹟","desc":"新竹醫師李克承曾居住的日式木屋，兩翼呈曲尺形，門窗細部反覆用到圓形圖案。房舍也曾作為藝文聚會空間，有「西門會館」的別稱。","area":"北區・新竹市","ph":"文"},{"id":2539,"name":"楊氏節孝坊","lat":24.803073,"lng":120.964537,"cat":"culture","tag":"古蹟","desc":"石坊街上的清代牌坊，建於道光年間，是為竹塹居民林熾的妻子楊居娘所立。它也保留了當時朝廷以建坊旌表民間節孝事蹟的歷史。","area":"北區・新竹市","ph":"文"},{"id":2540,"name":"淨業院","lat":24.818665,"lng":120.959792,"cat":"worship","tag":"古蹟","desc":"竹塹樹林頭庄的這座齋堂，屬於龍華派壹是堂系統。北門鄭如蘭為妻子鄭陳潤建院修佛，她也曾渡海走訪鼓山湧泉寺等名剎。","area":"北區・新竹市","ph":"文"},{"id":2541,"name":"眷村博物館","lat":24.814075,"lng":120.966854,"cat":"culture","desc":"紅門與白線構成眷村博物館的入口，廣場上還擺著飛機副油箱改造的水塔。館內用生活用品與情境陳列，重現眷村家庭的小角落。","area":"北區・新竹市","ph":"觀"},{"id":2542,"name":"竹光國民運動中心","lat":24.807544,"lng":120.95353,"cat":"other","desc":"新竹的運動中心一樓設有泳池，八道標準短水道可供練泳。旁邊還有兒童池、蒸氣室與水療池，照顧不同年齡的運動需求。","area":"北區・新竹市","ph":"觀"},{"id":2543,"name":"蘇氏節孝坊","lat":24.819533,"lng":120.971669,"cat":"history","tag":"古蹟","desc":"新竹湳雅的這座牌坊，建於清代光緒年間，為旌表吳國步妻子蘇氏而立。石坊保存完整，周邊環境也保有原有風貌。","area":"北區・新竹市","ph":"文"},{"id":2544,"name":"進士第(鄭用錫宅第)","lat":24.809436,"lng":120.965329,"cat":"history","tag":"古蹟","desc":"鄭用錫在竹塹北門外興建的宅第，採三落兩院格局。門前吊筒木雕與兩側獅座各有細部，大門旁的鏤刻石窗則雕出對稱的螭虎紋樣。","area":"北區・新竹市","ph":"文"},{"id":2545,"name":"進益摃丸文化會館","lat":24.805623,"lng":120.963307,"cat":"culture","desc":"新竹製丸老店把兩代手藝搬進文化會館，用地方導覽與展示介紹摃丸。從親自手搥到手捏成形，可以實際體會傳統製丸的步驟。","area":"北區・新竹市","ph":"觀"},{"id":2546,"name":"長和公園","lat":24.808258,"lng":120.961384,"cat":"nature","desc":"外媽祖廟附近的大榕樹，是長和公園的地方地標。園內以榕樹公廣場為核心，搭配花架涼亭、座椅與環園慢跑道，也是鄰里聚會的地方。","area":"北區・新竹市","ph":"觀"},{"id":2547,"name":"長和宮","lat":24.808564,"lng":120.962338,"cat":"worship","desc":"清代竹塹郊商多次集資重修長和宮，也常在此議事，廟宇逐漸兼具會館功能。廟中供奉的媽祖與水仙尊王，都寄託了商人航海平安的心願。","area":"北區・新竹市","ph":"觀"},{"id":2548,"name":"中央公園","lat":24.80798,"lng":120.970425,"cat":"nature","desc":"新竹中央路旁的老公園，是許多居民童年遊玩的地方。整建時保留大片綠地，把動態遊戲與探索學習結合，延續親子共遊的用途。","area":"東區・新竹市","ph":"觀"},{"id":2549,"name":"台灣省政府糧食局新竹管理處","lat":24.807921,"lng":120.976931,"cat":"history","tag":"歷史建築","desc":"日治時期管理稻米的米穀局在新竹設置事務所，後改為食糧局。現址辦公廳舍在戰時新建，保留了地方糧食行政機關的沿革。","area":"東區・新竹市","ph":"文"},{"id":2550,"name":"台電新竹變電所控制室","lat":24.788715,"lng":121.008217,"cat":"history","tag":"歷史建築","desc":"變電所留下的黃色建築，原作電力控制與通訊之用。鋼筋混凝土加強磚造的屋身前，還有接入建物的電纜溝，透露昔日用途。","area":"東區・新竹市","ph":"文"},{"id":2551,"name":"新竹信用組合","lat":24.805969,"lng":120.967851,"cat":"history","tag":"古蹟","desc":"從居民每日小額儲蓄的貯金會開始，後來的新竹信用組合搬入大同路大樓。入口上方的大拱圈搭配三扇圓拱窗，讓金融建築有了鮮明面貌。","area":"東區・新竹市","ph":"文"},{"id":2552,"name":"新竹公園","lat":24.801313,"lng":120.975543,"cat":"nature","desc":"麗池是新竹公園裡的小湖，許多居民記得曾在此划船的日子。現在湖上有蜿蜒的九曲橋與涼亭，沿岸走便能從不同角度欣賞水景。","area":"東區・新竹市","ph":"觀"},{"id":2553,"name":"新竹公園湖畔料亭","lat":24.801897,"lng":120.979453,"cat":"nature","tag":"歷史建築","desc":"日治時期麗池旁的市營休憩所，後來擴建為庭園式料亭。戰後這幾棟房舍曾供空軍醫務隊、學校與眷戶使用，留下多層次的生活記憶。","area":"東區・新竹市","ph":"文"},{"id":2554,"name":"新竹公會堂","lat":24.803339,"lng":120.967387,"cat":"history","tag":"歷史建築","desc":"日治時期由官民集資興建的公會堂，曾是新竹街居民舉行集會的場所。這座一九二一年落成的建築後來作為社教館，延續公共文化用途。","area":"東區・新竹市","ph":"文"},{"id":2555,"name":"新竹動物園―舊大門、噴水池、黃魚鴞欄舍","lat":24.801071,"lng":120.979498,"cat":"history","tag":"歷史建築","desc":"動物園舊入口的洗石子門柱上裝飾著鑄鐵象頭與蹲獅。園內圓形噴水池和半圓穹頂的黃魚鴞欄舍，也保存早期動物園設施的樣貌。","area":"東區・新竹市","ph":"文"},{"id":2556,"name":"新竹孔廟","lat":24.800099,"lng":120.975618,"cat":"worship","area":"東區・新竹市","ph":"觀"},{"id":2557,"name":"新竹州圖書館","lat":24.805151,"lng":120.971182,"cat":"culture","tag":"古蹟","desc":"從街立圖書館發展而來的新竹州圖書館，在一九二五年完工。戰後館舍由地方政府接收，隨行政歸屬更替，先後作為市立與縣立圖書館。","area":"東區・新竹市","ph":"文"},{"id":2558,"name":"新竹州圖書館","lat":24.805235,"lng":120.968575,"cat":"culture","area":"東區・新竹市","ph":"觀"},{"id":2559,"name":"新竹州警務部部長官舍","lat":24.807197,"lng":120.971284,"cat":"history","tag":"古蹟","desc":"日治時期的新竹州官舍區與州廳隔著護城河相望，區內依職等分配住宅。這座警務部長官舍位在知事官邸旁，留下昔日高等官舍區的線索。","area":"東區・新竹市","ph":"文"},{"id":2560,"name":"新竹市孔廟","lat":24.799874,"lng":120.978222,"cat":"worship","tag":"歷史建築","desc":"清代淡水廳的儒學學宮，是今日新竹孔廟的前身。原廟一度成為日軍守備隊營地，後來恢復祭典，大成殿也繼續安置神位。","area":"東區・新竹市","ph":"文"},{"id":2561,"name":"新竹市立動物園","lat":24.800156,"lng":120.977347,"cat":"scenic","area":"東區・新竹市","ph":"觀"},{"id":2562,"name":"新竹市美術館","lat":24.814076,"lng":120.964151,"cat":"culture","desc":"這座美術館的建築有另一個名字，叫做「新竹市役所」。翻看新竹市的市定古蹟名錄，記錄的正是市役所這個名稱。","area":"東區・新竹市","ph":"觀"},{"id":2563,"name":"新竹市鐵道藝術村","lat":24.804191,"lng":120.974395,"cat":"culture","desc":"臺鐵新竹站的舊倉庫，整修後成了鐵道藝術村。空間仍保有倉庫的日式風格，也為駐村藝術家提供創作場所，讓鐵道設施有了新用途。","area":"東區・新竹市","ph":"觀"},{"id":2564,"name":"新竹春室Glass Studio + The POOL","lat":24.801322,"lng":120.975921,"cat":"other","area":"東區・新竹市","ph":"觀"},{"id":2565,"name":"新竹水道-取水口","lat":24.805381,"lng":120.993686,"cat":"history","tag":"古蹟","desc":"日治時期新竹街為改善飲用水而興建水道，經多年規劃後完工通水。取水設施中的唧筒室採鋼筋混凝土構造，外覆洗石子，頂上是木屋架。","area":"東區・新竹市","ph":"文"},{"id":2566,"name":"新竹水道取水口展示館","lat":24.806103,"lng":120.991977,"cat":"culture","area":"東區・新竹市","ph":"觀"},{"id":2567,"name":"新竹火車站","lat":24.801706,"lng":120.971832,"cat":"history","tag":"古蹟","desc":"新竹驛由曾留學德國的松崎萬長設計，站房呈現鮮明的德國哥德風格。鋸齒狀山牆、突出的拱心石與窗拱，讓立面帶有層層起伏的線條。","area":"東區・新竹市","ph":"文"},{"id":2568,"name":"新竹站1-5號倉庫","lat":24.804412,"lng":120.977462,"cat":"history","tag":"歷史建築","desc":"隨鐵路貨運帶動城市發展，新竹站周邊也增加倉儲空間。從舊地圖可見，一至五號倉庫原本連成長條建築，留下車站處理貨物的空間格局。","area":"東區・新竹市","ph":"文"},{"id":2569,"name":"新竹觀測所","lat":24.799539,"lng":120.975699,"cat":"history","tag":"歷史建築","desc":"新竹公園內的觀測所建於日治時期，原是總督府測震系統的一環。二戰期間為躲避空襲，建築曾塗上迷彩，並利用周圍樹林掩護。","area":"東區・新竹市","ph":"文"},{"id":2570,"name":"新竹金山寺","lat":24.777651,"lng":121.015136,"cat":"worship","tag":"古蹟","desc":"竹科園區內的古寺坐落冷水坑畔，清泉環繞，也有靈泉寺之名。它源於龍華齋教傳統，主祀觀音佛祖，另奉釋迦佛與阿彌陀佛。","area":"東區・新竹市","ph":"文"},{"id":2571,"name":"新竹關帝廟","lat":24.802581,"lng":120.966633,"cat":"worship","tag":"古蹟","desc":"新竹南門路上的街屋型廟宇，三開間的三川殿標示入口。從廟埕經中庭、過水廊到正殿與後殿，空間向內一進一進展開。","area":"東區・新竹市","ph":"文"},{"id":2572,"name":"日本海軍第六燃料廠新竹支廠","lat":24.801184,"lng":120.998208,"cat":"history","tag":"歷史建築","desc":"二戰時期的航空燃料工廠，留下高約六十公尺的大煙囪，筒身仍可見彈痕。戰後廠區成為空軍忠貞新村，軍事工業與眷村生活在此接續。","area":"東區・新竹市","ph":"文"},{"id":2573,"name":"日本海軍第六燃料廠煉油廠遺存建築群","lat":24.799968,"lng":121.000062,"cat":"history","tag":"歷史建築","desc":"赤土崎一帶的廠房遺跡，屬於二戰時期日本海軍第六燃料廠的新竹支廠。這裡負責合成燃料相關作業，廣大的廠區也曾包含員工宿舍。","area":"東區・新竹市","ph":"文"},{"id":2574,"name":"明湖公園","lat":24.778344,"lng":120.968479,"cat":"nature","desc":"青草湖附近這座林蔭公園，規劃步道時讓路線順著原有樹木。高架景觀步道連向湖畔，林間也有磨石子沙坑溜滑梯與共融式鞦韆。","area":"東區・新竹市","ph":"觀"},{"id":2575,"name":"有樂館","lat":24.804912,"lng":120.969582,"cat":"culture","tag":"歷史建築","desc":"日治時期的歐式劇場曾設冷氣，是新竹市區的公共娛樂場所。二戰空襲摧毀屋頂和座席，四周牆面倖存，戰後整修成為國民大戲院。","area":"東區・新竹市","ph":"文"},{"id":2576,"name":"李錫金孝子坊","lat":24.780092,"lng":120.967501,"cat":"history","tag":"古蹟","desc":"青草湖一帶的清代牌坊，為旌表李錫金的孝行而立。這位祖籍泉州晉江的新竹人，身後在光緒年間獲建石坊紀念。","area":"東區・新竹市","ph":"文"},{"id":2577,"name":"汀甫圳渡槽-土地公坑溪、客雅溪、成德路","lat":24.813829,"lng":120.967475,"cat":"worship","tag":"歷史建築","desc":"汀甫圳橫越溪谷的渡槽，留下不同時代營造技術相接的痕跡。土地公坑段的橋墩用清水紅磚砌成，上方水槽則採用鋼筋混凝土。","area":"東區・新竹市","ph":"文"},{"id":2578,"name":"湖畔料亭","lat":24.801605,"lng":120.975396,"cat":"history","desc":"麗池邊的日式料亭，過去曾接待官員與商人宴飲。戰後空間先安置單身飛行員，後來成為空軍十一村的眷舍，見證湖畔生活的轉變。","area":"東區・新竹市","ph":"觀"},{"id":2579,"name":"玻璃工藝博物館","lat":24.801389,"lng":120.975481,"cat":"culture","area":"東區・新竹市","ph":"觀"},{"id":2580,"name":"科學園區探索館","lat":24.783253,"lng":121.002519,"cat":"culture","desc":"新竹科學園區創立時的首批標準廠房中，第十六棟被保留下來。這棟舊廠房後來整修成史料館，成了認識園區科技發展的空間。","area":"東區・新竹市","ph":"觀"},{"id":2581,"name":"竹塹城迎曦門","lat":24.804212,"lng":120.970199,"cat":"history","tag":"古蹟","desc":"新竹東門街的圓環中央，仍立著清代竹塹城的迎曦門。這是當年城垣留存的一座城門，從道光年間建城至今，見證舊城的變遷。","area":"東區・新竹市","ph":"文"},{"id":2582,"name":"竹蓮寺","lat":24.798836,"lng":120.96998,"cat":"worship","tag":"歷史建築","desc":"閩南移民最早在竹塹南門外搭起小祠供奉觀音，清代嘉慶年間遷到現址後稱為竹蓮寺。幾次重修與地方人士的參與，留下長久的信仰歷史。","area":"東區・新竹市","ph":"文"},{"id":2583,"name":"竹蓮寺","lat":24.802744,"lng":120.964016,"cat":"worship","desc":"相傳居民在樹下見到觀音像，迎入小祠後逐漸形成地方信仰。今天廟中的細雕花窗、古匾與畫作，都是欣賞竹塹傳統廟宇工藝的細節。","area":"東區・新竹市","ph":"觀"},{"id":2584,"name":"竹蓮里傳統聚落古井","lat":24.798525,"lng":120.970941,"cat":"history","tag":"古蹟","desc":"竹塹南門外的傳統聚落曾共用這口井，與附近竹蓮寺同屬聚落發展的線索。古井出現的年代尚難確定，但見證了居民取水的日常。","area":"東區・新竹市","ph":"文"},{"id":2585,"name":"絕版影像館UP Gallery","lat":24.79937,"lng":120.97489,"cat":"culture","desc":"影像館所在的建築，與新竹早期民間玻璃工廠有深厚淵源。玻璃產業留下的場所在廖益嘉規劃修繕後，轉為展現影像創作的空間。","area":"東區・新竹市","ph":"觀"},{"id":2586,"name":"綠光公園","lat":24.812322,"lng":120.98196,"cat":"nature","desc":"公園用透水瀝青、小型滯洪區與雨水撲滿示範都市保水。孩子可以試玩復古汲水器，園內新植的喬木則逐漸構成擋風的林帶。","area":"東區・新竹市","ph":"觀"},{"id":2587,"name":"護城河","lat":24.804876,"lng":120.95427,"cat":"nature","desc":"新竹市中心的護城河沿線，東門城與站前一帶的水岸空間彼此相連。河中錯落的飛石、水生植物與圓形藝文舞臺，讓人可以親近水邊。","area":"東區・新竹市","ph":"觀"},{"id":2588,"name":"辛志平校長故居","lat":24.804252,"lng":120.973899,"cat":"history","tag":"古蹟","desc":"日治時期新竹中學校的校長宿舍，從創校以來便有歷任校長居住。如今以辛志平校長之名保存，記錄校園教育與宿舍生活的歷史。","area":"東區・新竹市","ph":"文"},{"id":2589,"name":"迎曦門(東門城)","lat":24.804205,"lng":120.968232,"cat":"history","desc":"新竹人所說的東門城，在國定古蹟名錄裡叫作「竹塹城迎曦門」。一座城門的名字，也把新竹舊城的名稱留了下來。","area":"東區・新竹市","ph":"觀"},{"id":2590,"name":"金城新村","lat":24.794589,"lng":121.002695,"cat":"history","tag":"歷史建築","desc":"原名金門新村的軍眷聚落，最初在新竹郊外舊營區興建。這一帶曾是日本海軍燃料廠員工宿舍區，戰後用來安置金門駐軍眷屬。","area":"東區・新竹市","ph":"文"},{"id":2591,"name":"關新公園","lat":24.785927,"lng":121.016082,"cat":"nature","desc":"新竹關新的公園把原有小山丘納入遊戲區，讓孩子順著地形跑跳。南側設有低齡孩子使用的草坡溜滑梯，並依不同年齡規劃遊樂空間。","area":"東區・新竹市","ph":"觀"},{"id":2592,"name":"隆恩圳","lat":24.806328,"lng":120.986294,"cat":"nature","desc":"清代開墾竹塹時使用的古圳，至今仍影響新竹市區的綠地分布。沿著水道與老樹走，可穿過高架綠地、林地與遊戲場，串起數座公園。","area":"東區・新竹市","ph":"觀"},{"id":2593,"name":"青草湖","lat":24.774935,"lng":120.966782,"cat":"scenic","area":"東區・新竹市","ph":"觀"},{"id":2594,"name":"靜心湖","lat":24.77969,"lng":121.011363,"cat":"scenic","desc":"竹科內的湖面映著樹蔭與波光，湖畔白牆和紅色幾何窗格相映。走到太極廣場，還能看見朱銘的雕塑，以靜止形體展現動作的力道。","area":"東區・新竹市","ph":"觀"},{"id":2595,"name":"高峰植物園","lat":24.788113,"lng":120.979742,"cat":"nature","desc":"原為新竹州立赤土崎林業試驗場的園地，培育本土植物與外來樹種。多樣林木吸引留鳥、候鳥和昆蟲，讓這裡成為觀察森林生態的場所。","area":"東區・新竹市","ph":"觀"},{"id":2596,"name":"黑蝙蝠中隊文物陳列館","lat":24.812011,"lng":120.969663,"cat":"culture","desc":"文物陳列館前的綠地，以黑蝙蝠中隊的飛行任務為主題改為公園。星空航道、夢想之翼等裝置，把隊史與飛行意象帶進戶外空間。","area":"東區・新竹市","ph":"觀"},{"id":2597,"name":"海山漁港","lat":24.765237,"lng":120.900783,"cat":"scenic","desc":"受潮汐影響的海山漁港，設有高出地面約一層樓的觀海平臺。站在高處可以望見香山濕地的蚵寮，也能看遠處的海面與天際相接。","area":"香山區・新竹市","ph":"觀"},{"id":2598,"name":"浸水楊家古厝","lat":24.79919,"lng":120.92404,"cat":"history","tag":"古蹟","desc":"浸水楊家的古宅分為前後兩棟，各有廂房與護龍。前棟設公廳，後棟則有神明廳，使用的福州杉、閩南磚也透露當年的建材來源。","area":"香山區・新竹市","ph":"文"},{"id":2599,"name":"港南運河公園","lat":24.822819,"lng":120.907764,"cat":"nature","desc":"新竹港南的運河兩岸，各自發展出不同的親水空間。北側有攀爬網與平衡木，南側則沿水設散步道、木平臺和能看夕照的觀景處。","area":"香山區・新竹市","ph":"觀"},{"id":2600,"name":"青青草原","lat":24.772794,"lng":120.925708,"cat":"scenic","desc":"五條步道串起五片草地，讓人能在寬闊草原與山景間散步。順著地勢設置的磨石子溜滑梯，也是親子到這座大型公園遊玩的特色。","area":"香山區・新竹市","ph":"觀"},{"id":2601,"name":"香山天后宮","lat":24.769333,"lng":120.914492,"cat":"worship","tag":"歷史建築","desc":"香山漁民長年祭拜媽祖，現有紀錄可追溯到清代道光年間建廟。後來地方人士再度發起重建，使廟宇延續為沿海居民的信仰中心。","area":"香山區・新竹市","ph":"文"},{"id":2602,"name":"香山森林","lat":24.767776,"lng":120.947391,"cat":"nature","desc":"香山這片面積不大的森林，以一排排高聳筆直的樹幹吸引攝影者。日光從樹梢穿下，在林間照出明暗相間的層次。","area":"香山區・新竹市","ph":"觀"},{"id":2603,"name":"香山火車站(前香山驛)","lat":24.763126,"lng":120.913851,"cat":"history","tag":"古蹟","desc":"日治時期興建的香山驛，是西部幹線少數留存的木造車站。站房有覆瓦的歇山屋頂與廊道，屋簷下交叉成形的木構件也很特別。","area":"香山區・新竹市","ph":"文"},{"id":2604,"name":"三毛夢屋","lat":24.574057,"lng":121.105899,"cat":"culture","desc":"桃山村吊橋上方的紅磚木屋，曾是作家三毛短暫居住、尋找靈感之處。沿途可讀她的選文，屋內則展示作品與照片。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2605,"name":"五峰鄉原住民族館","lat":24.576179,"lng":121.104133,"cat":"culture","desc":"五峰的族群文化展示空間，坐落在依日式風格仿建的建築裡。館內以家屋、服飾、日用品與樂器，介紹泰雅族和賽夏族先民的生活。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2606,"name":"張學良文化園區","lat":24.572491,"lng":121.105447,"cat":"culture","desc":"五峰清泉曾是張學良在臺幽禁的地方，他從重慶來臺後在此度過十三年。文化園區以故居為核心，留下近代歷史在這座山村的印記。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2607,"name":"梅后蔓瀑布","lat":24.649835,"lng":121.157479,"cat":"scenic","desc":"花園部落深山中的瀑布，位在花園溪上游，因此也叫花園瀑布。通往水瀑的原始步道穿行竹林與杉木林，林間深處可見充沛溪水落下。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2608,"name":"民都有泰雅雕刻園區","lat":24.58389,"lng":121.111104,"cat":"culture","desc":"桃山村各部落的泰雅族人一起學習木雕，把原先長滿雜草的土地整理成雕刻園區。園內一石一木由族人動手布置，留下共同創作的過程。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2609,"name":"清泉一號吊橋","lat":24.573367,"lng":121.104264,"cat":"other","desc":"清泉部落高處的老吊橋，日治時期已橫跨上坪溪。兩岸居民靠它往來、買賣物產，橋也見證了山間不同聚落的交流。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2610,"name":"清泉天主堂","lat":24.576572,"lng":121.104396,"cat":"worship","desc":"走過吊橋、登上石階，山腰上的教堂便映入眼前。清泉部落的這處信仰空間與丁松青神父的投入有關，堂內的彩繪鑲嵌玻璃尤其醒目。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2611,"name":"清泉溫泉","lat":24.573454,"lng":121.105621,"cat":"other","desc":"五峰清泉一帶有數處碳酸氫鈉泉源，早年為泰雅族與賽夏族聚居地。日治時期的井上溫泉以「清泉試浴」之名，成為昔日新竹八景之一。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2612,"name":"清泉藝術之森","lat":24.572924,"lng":121.103891,"cat":"culture","desc":"桃山派出所、員警宿舍與衛生室等閒置房舍，整修後連成一座藝術園區。清泉在地創作者與地方文化進駐，讓原有公共建築有了新用途。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2613,"name":"賽夏族矮人祭場文物館","lat":24.622568,"lng":121.099375,"cat":"culture","desc":"五峰朱家莊部落的地名意指遍地扁石，文物館與賽夏族巴斯達隘祭場就在同一區域。這裡以賽夏文化為主題，介紹族人的歷史與傳統。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2614,"name":"青葉甜柿園","lat":24.621123,"lng":121.113691,"cat":"other","desc":"五峰和平部落到了甜柿產季，山坡果樹間便可見一顆顆套袋果實。園內的甜柿成熟時鮮橘飽滿，也讓來客體驗親手採果。","area":"五峰鄉・新竹縣","ph":"觀"},{"id":2615,"name":"二寮神木","lat":24.68186,"lng":121.066772,"cat":"scenic","desc":"北埔大林社區的老樟樹，守在二寮古步道入口，樹齡估計超過五百年。從樹下延伸的路徑可見相思樹、樟樹與成片桂竹。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2616,"name":"北埔六塘落羽松","lat":24.700208,"lng":121.082359,"cat":"other","desc":"隱在北埔山林的落羽松圍著水塘生長，到了冬季樹葉漸轉橘紅。平靜水面映出整排樹影，周邊還可體驗手沖咖啡與曬柿。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2617,"name":"北埔冷泉","lat":24.66299,"lng":121.07243,"cat":"scenic","desc":"北埔的天然冷泉，形成條件與地下水和地層密不可分。充足的地下水遇上能產生大量二氧化碳的岩層，才具備孕育冷泉的條件。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2618,"name":"北埔姜氏家廟","lat":24.697856,"lng":121.057557,"cat":"worship","tag":"古蹟","desc":"北埔姜氏族人集資延請匠師，在日治時期建成家廟。兩堂、兩道過水廊與兩座橫屋組成院落，留下當年宗族合力營建的格局。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2619,"name":"北埔姜阿新洋樓","lat":24.700135,"lng":121.05786,"cat":"culture","tag":"古蹟","desc":"原屬天水堂的房舍經大地震受損，姜阿新遂籌建新的洋樓。這裡也是接待生意夥伴的禮賓空間，營建時特別延請本地匠師參與。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2620,"name":"北埔忠恕堂","lat":24.698733,"lng":121.057749,"cat":"worship","tag":"歷史建築","desc":"北埔這座一堂二橫屋的三合院，建於日治時期，主體依中軸對稱排列。仔細看左側橫屋，便能發現它順著基地形狀微微向內偏轉。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2621,"name":"北埔慈天宮","lat":24.699773,"lng":121.05826,"cat":"worship","tag":"古蹟","desc":"北埔庄的觀音信仰與清代金廣福開墾有關。相傳墾首姜秀鑾帶著觀音神像進入北埔，先搭小寮供奉，後來發展成地方廟宇。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2622,"name":"北埔秀巒公園","lat":24.699608,"lng":121.060038,"cat":"nature","desc":"北埔街東南側的公園，最初由大隘居民為紀念金廣福墾戶姜秀巒所設。這處綠地早年名為秀巒山，後來才正式稱為秀巒公園。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2623,"name":"北埔老街","lat":24.699825,"lng":121.05722,"cat":"structure","desc":"慈天宮前的廟埕是北埔老街聚集人潮的地方，周圍街巷延續客庄市街風貌。沿街可見在地特產與傳統小吃，信仰與生活緊密相連。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2624,"name":"北埔鄧南光故居","lat":24.698279,"lng":121.05829,"cat":"history","tag":"歷史建築","desc":"北埔鄧家宅院因曾種大片柑橘，也叫作柑園。日治時期建起的鋼筋混凝土洋房，與戰後由鄧南光姪子開設的世源醫院相連。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2625,"name":"北埔金剛寺","lat":24.693095,"lng":121.043791,"cat":"worship","desc":"南埔山麓的寺院由妙禪法師開山，後來在九二一地震中倒塌重建。妙禪原是北埔人，除學佛外，也曾研習詩書畫、雕塑與建築。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2626,"name":"北埔雙安橋","lat":24.696756,"lng":121.053578,"cat":"history","tag":"歷史建築","desc":"北埔的紅磚三拱橋，以砂岩壘起橋基，橋面並供人行與圳水通過。地方流傳姜家出資造橋作嫁妝，免去女兒與迎親隊伍涉溪之苦。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2627,"name":"南埔水圳","lat":24.695539,"lng":121.049268,"cat":"history","desc":"北埔南埔的灌溉大圳穿過多處隧道，把水引向田間，也供居民日常使用。圳邊仍有運轉的竹筒式水車，讓人看見傳統取水的巧思。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2628,"name":"老時代休閒農庒","lat":24.67339,"lng":121.063841,"cat":"other","desc":"北埔的農莊有大片草地，讓人以實作接觸早期農村生活。從控窯、烤肉到親子手作，寬廣的園地也提供團體一同活動的空間。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2629,"name":"膨風茶文物館","lat":24.707247,"lng":121.068448,"cat":"culture","desc":"北埔三代傳承的茶工廠，後來轉為展示膨風茶文化的園區。館裡收藏早年的製茶器具，也能透過製茶介紹與擂茶體驗認識客庄茶事。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2630,"name":"藍鵲書房","lat":24.700783,"lng":121.054559,"cat":"culture","desc":"北埔老街附近的複合書房，留有安靜讀書的空間。這裡也不定期舉行讀書會與講座，讓不同領域的讀者相遇，分享彼此的觀點。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2631,"name":"鄧南光影像紀念館","lat":24.698433,"lng":121.058237,"cat":"culture","desc":"老洋房裡還留有早期診間的格局，現在陳列北埔攝影家鄧南光的作品。從本名鄧騰輝的生平到大型老相機，都能在館中看到。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2632,"name":"金廣福公館","lat":24.700754,"lng":121.057822,"cat":"culture","tag":"古蹟","desc":"清代的金廣福墾號在此辦公，作為開墾大隘地區的據點。墾號由閩、粵籍人士合資，名稱裡的「廣」和「福」分別取自廣東與福建。","area":"北埔鄉・新竹縣","ph":"文"},{"id":2633,"name":"麥客田園","lat":24.697617,"lng":121.04327,"cat":"other","desc":"南埔文化生態區裡的田園種有多種蔬菜，也展出老農具。園內可以體驗控窯、製作客家米食或擂茶，從田間一路認識農家的餐桌。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2634,"name":"麻布山林","lat":24.703409,"lng":121.06333,"cat":"other","desc":"北埔山林間的蓮葉田與荷花生態池，到了夏天可見花朵迎風搖曳。沿竹林步道散步後，也能坐上茶席，品味在地的東方美人茶。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2635,"name":"龍瑛宗文學館","lat":24.700292,"lng":121.054471,"cat":"culture","desc":"北埔公學校留下的日式宿舍，整修後成了紀念作家龍瑛宗的文學館。除了作品與生平介紹，館裡還重現了他的書房場景。","area":"北埔鄉・新竹縣","ph":"觀"},{"id":2636,"name":"寶山元聖宮","lat":24.739579,"lng":121.027095,"cat":"worship","desc":"寶山村的三官大帝信仰，從日治時期建立的這座廟宇延續至今。芎蕉窩、泥船、寶岡及枋仔坑等聚落，都是共同參與祭祀的地方。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2637,"name":"寶山小西湖","lat":24.712853,"lng":121.013055,"cat":"scenic","desc":"寶山油田村丘陵旁的農塘，原是農家蓄水的小池塘。拱橋倒映在水面，配上湖畔的農業景觀，讓這裡有了「小西湖」的稱呼。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2638,"name":"寶山蠟藝館","lat":24.731047,"lng":120.960586,"cat":"culture","desc":"寶山的燭園從廣場前的泥塑擋土牆開始，就處處可見手作痕跡。館內展示不同造型的藝術蠟燭，也提供動手製作蠟燭的體驗。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2639,"name":"寶山鄉生態公園","lat":24.764087,"lng":120.991036,"cat":"nature","desc":"客家文化與生態綠地結合的公園，設有圓形戶外劇場。環繞園區的步道長約一公里，沿途兩側都有綠植，適合健走與賞花。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2640,"name":"寶湖吊橋．碧湖吊橋","lat":24.749012,"lng":121.046599,"cat":"other","desc":"群山環繞的水庫上，寶湖與碧湖兩座吊橋連接兩端。橋面鋪著厚實枕木，橋墩用石砌成，其中較窄的寶湖吊橋專供行人賞湖。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2641,"name":"忻品集","lat":24.726201,"lng":120.984412,"cat":"other","desc":"寶山新城的農場以番茄、草莓與彩椒為主，也種高麗菜、小黃瓜等蔬果。隨產季來到田間，可以親自摘採當季成熟的作物。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2642,"name":"新城新豐宮","lat":24.730986,"lng":120.965802,"cat":"worship","desc":"寶山新城的老廟主祀三山國王，是新城、寶斗、深井三地共同的信仰中心。除了王爺誕辰，居民也曾帶自家飼養的閹雞到廟前比賽。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2643,"name":"木炭的家-永興炭窯","lat":24.723079,"lng":120.992463,"cat":"history","desc":"寶山的老炭窯延續傳統工法，把晾乾的木材按粗細分作炭材與燃料。經過數週入窯悶燒，才得到煙少耐燒、帶木香的木炭。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2644,"name":"深井村茶花園區","lat":24.727272,"lng":120.941142,"cat":"nature","desc":"寶山深井村的邱氏兄弟長年投入茶花培育，園地散布在村中各處。從幼苗、盆景到近千個品種，可觀察新竹縣花姿態各異的花形。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2645,"name":"深井生態園","lat":24.716152,"lng":120.947006,"cat":"scenic","desc":"寶山深井的生態園以青蛙造型拱門迎人，園裡也設有青蛙裝置藝術。透過展示區介紹青蛙的一生，讓人從熟悉的小動物認識環境生態。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2646,"name":"溪源洞老仙爺廟","lat":24.727058,"lng":121.042366,"cat":"worship","desc":"地方人士集資在山溪旁鑿洞，奉祀尊稱「救苦大仙」的仙爺。廟後岩壁陡立，山溪環繞，地震損毀後居民又將這座小廟修建起來。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2647,"name":"漣漪書屋","lat":24.750013,"lng":121.044768,"cat":"culture","desc":"沙湖壢藝術村的日治時期磚造平房，正面朝向寶山水庫。推開木門、沿枕木階梯往下，便能看見湖面上的林影與風吹起的漣漪。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2648,"name":"玖龍宮","lat":24.747396,"lng":120.974482,"cat":"worship","desc":"山中的廟埕視野開闊，站在高處可遠眺五指山。門口一對石獅守著階梯，正殿供奉玉皇大帝，樸素的建築和清爽的裝飾別有風味。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2649,"name":"田心緣生態園區","lat":24.7405,"lng":120.952008,"cat":"culture","desc":"寶山深井社區的園地由志工共同經營，以奉米幫助弱勢，實踐地方公益。白梅開花時，生態園也成了人們欣賞花色的地方。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2650,"name":"種子星球","lat":24.72321,"lng":121.009043,"cat":"culture","desc":"藝術家林舜龍用漂流木和廢棄家具，在三根大木之間架起種子造型的作品。樹頭上的桌椅象徵客家好客，木屋空間則像林間祕密基地。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2651,"name":"種福禪寺","lat":24.754468,"lng":121.049216,"cat":"worship","desc":"寶山水庫附近的觀音堂，創建於清代同治年間，主祀觀世音菩薩。山湖村居民在此祭拜，寺院與周圍清幽山水同為地方風景。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2652,"name":"聖女小德蘭教堂","lat":24.73036,"lng":120.961037,"cat":"worship","desc":"寶山的新城天主堂是新竹教區的朝聖地，堂外立著巨大的小德蘭聖像。二樓聖殿的窗戶由彩繪玻璃組成，日光入內便映出不同顏色。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2653,"name":"開心田緣","lat":24.726752,"lng":120.972965,"cat":"other","desc":"這座農場從農作生產出發，也推動食農教育與生態復育。經營者提倡分享多餘資源，希望透過永續農業，讓土地上的生物共同生活。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2654,"name":"雙胞胎井","lat":24.732563,"lng":121.027857,"cat":"history","desc":"寶山村口的古井曾提供居民日常飲水，泉水以清甜著稱。村裡有多對雙胞胎，地方耆老因而把兩件事連成傳說，成了井名的由來。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2655,"name":"雙豐宮","lat":24.765394,"lng":120.990331,"cat":"worship","desc":"開墾大隘時期興建的廟宇，原在雙溪國小所在地，後來才遷到現址。雙溪與三峰居民在此奉祀福德正神、義民爺和五穀神農大帝。","area":"寶山鄉・新竹縣","ph":"觀"},{"id":2656,"name":"凌空廊道","lat":24.699889,"lng":121.262353,"cat":"scenic","desc":"尖石那羅與煤源之間的山路高處，設有視野開闊的觀景廊道。站在部落的制高點，鳥嘴山、馬武督山等山峰都能收入眼底。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2657,"name":"北得拉曼巨木群","lat":24.734827,"lng":121.291246,"cat":"scenic","desc":"北得拉曼山保存低海拔紅檜巨木群，也是當地泰雅族人敬重的聖山。這片山林曾是少年接受勇氣與智慧考驗的地方，山頂還可遠望雲霧群峰。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2658,"name":"北角吊橋","lat":24.701909,"lng":121.19751,"cat":"other","desc":"油羅溪上的吊橋以紅色橋門架與鋼纜跨越兩岸，單跨長約二百二十公尺。它是通往馬胎部落的重要橋梁，也成了尖石河谷的地標。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2659,"name":"司馬庫斯","lat":24.578906,"lng":121.334455,"cat":"scenic","desc":"尖石深山裡的泰雅族聚落，坐落在海拔約一千六百公尺的山區。從部落步道走進原始森林，可見千年巨木，山林間也常有雲霧繚繞。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2660,"name":"天然谷溫泉","lat":24.687296,"lng":121.222284,"cat":"other","desc":"青蛙石步道附近的溫泉出水豐沛，屬碳酸氫鈉泉，泉質接近中性。園中種有大量椰樹與外來花卉，讓山間湯池帶有南國風情。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2661,"name":"宇老觀景台","lat":24.667662,"lng":121.281961,"cat":"scenic","desc":"尖石前山與後山的分界處，設有面向群山的觀景臺。向東可俯看玉峰村谷地，山巒在遠處層層疊起，雲氣匯聚時還有雲海景色。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2662,"name":"小錦屏瀑布","lat":24.648168,"lng":121.204835,"cat":"scenic","desc":"尖石鄉的小錦屏山谷裡，水流從高處傾瀉而下，濺起陣陣水花。瀑布周圍環境清幽，附近也有溫泉池，形成冷暖並存的山間景色。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2663,"name":"尖石TAPUNG古堡（李崠隘勇監督所）","lat":24.692612,"lng":121.303668,"cat":"history","tag":"古蹟","desc":"新竹與桃園交界的李崠山高處，保存日治時期隘勇監督所的遺跡。古堡以原住民族語定名，從所在山頭可眺望三光、秀巒與玉峰一帶。","area":"尖石鄉・新竹縣","ph":"文"},{"id":2664,"name":"尖石原住民文物館","lat":24.704754,"lng":121.202012,"cat":"culture","desc":"尖石的泰雅族文化展示，從傳統家屋、農具和獵具說起。館內也可見桂竹編成的魚簍與貝珠腿鈴，了解農耕、狩獵與祭典如何連著族人的生活。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2665,"name":"尖石岩","lat":24.706771,"lng":121.204969,"cat":"scenic","desc":"那羅溪和嘉樂溪之間，聳立著一塊尖形巨石，頂端還長著長年青翠的松柏。這塊經風雨沖蝕仍然矗立的岩石，也是尖石鄉的地標。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2666,"name":"尖石鄉原住民文化館","lat":24.70456,"lng":121.202018,"cat":"culture","desc":"尖石山區的文化館，常設展呈現泰雅族家屋、服飾與農耕器具。從這些生活用品，可以認識族人如何耕作、狩獵，以及隨之發展的生活方式。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2667,"name":"李崠山古堡","lat":24.692829,"lng":121.303598,"cat":"history","desc":"李崠山頂的紅磚古堡，留下抗日時期的戰場遺跡。巴洛克風格的大門已顯斑駁，堡體現存牆壁與射口，仍可辨認紅磚和水泥的構造。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2668,"name":"梅花山莊","lat":24.674375,"lng":121.19539,"cat":"other","desc":"尖石梅花村半山腰的山莊，原本以種植日本甜柿為主。每到秋季果實成熟，果園吸引人們來採柿，也成了附近登山客造訪的地方。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2669,"name":"比麟瀑布","lat":24.692675,"lng":121.220898,"cat":"scenic","desc":"尖石錦屏村比麟部落附近，沿那羅溪畔可見一道瀑布從山壁奔流而下。碧綠水面映著周圍林木，飛散的水花帶來溪谷的清涼。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2670,"name":"泰崗野溪溫泉","lat":24.622623,"lng":121.295993,"cat":"scenic","desc":"泰崗溪畔除了天然溫泉，也有秋季賞楓的景色。穿過控溪吊橋後，桂竹林間的小徑一路伸向野溪池，讓人沿途感受山林變化。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2671,"name":"秀巒野溪溫泉","lat":24.621046,"lng":121.287427,"cat":"scenic","desc":"玉峰溪、泰崗溪與白石溪交會的溪谷，有無色無味的露天野溪溫泉。從控溪與軍艦岩吊橋望去，可見形如出航軍艦的岩石，秋季還添上楓紅。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2672,"name":"老鷹溪瀑布（裡埔瀑布）","lat":24.662835,"lng":121.300914,"cat":"scenic","desc":"老鷹溪步道沿山谷走到盡頭，便是又稱裡埔瀑布的水景。前段路徑多採自然工法，後段的木棧道則懸在溪床上方，可一路欣賞山景。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2673,"name":"萬里山園","lat":24.69268,"lng":121.315592,"cat":"other","desc":"玉峰村馬美部落的山園位在海拔約一千四百公尺處，群山環繞。園內種有多種櫻花，每到春天接續開放，粉色花朵鋪滿山間。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2674,"name":"軍艦岩","lat":24.622215,"lng":121.28636,"cat":"scenic","desc":"白石溪與泰崗溪匯流處，一座巨石聳立水中，側看像軍艦揚帆前行。秀巒當地也流傳石下溪水是苦花魚故鄉的說法。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2675,"name":"那羅那山月桃工坊","lat":24.679738,"lng":121.243432,"cat":"other","desc":"那羅部落的工坊以月桃為主角，從葉片、果實到纖維，介紹族人如何使用這種植物。除了認識泰雅族的日常，也能親手製作月桃保養品。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2676,"name":"錦屏大橋","lat":24.687931,"lng":121.218486,"cat":"other","desc":"尖石錦屏的鋼架拱橋，將泰雅族故事放進橋上雕塑。沿欄杆看過去，一幅幅圖像記錄族人的起居、風俗與神話，讓過橋也像在讀地方故事。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2677,"name":"錦屏教會","lat":24.689426,"lng":121.219378,"cat":"worship","desc":"尖石錦屏教會的外牆，密密嵌著大顆卵石，整座教堂遠看就像石屋。來自教友的奉獻與部落傳統石屋的造型，在這座長老教會建築相遇。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2678,"name":"錦屏美人湯","lat":24.670655,"lng":121.208171,"cat":"other","desc":"錦屏的溫泉含碳酸氫根，當地以「美人湯」稱呼這類泉水。透明水中有時可見礦物質與微生物自然生成的溫泉花，是觀察泉質的特色。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2679,"name":"鎮西堡教會","lat":24.573675,"lng":121.30872,"cat":"worship","desc":"鎮西堡族人以秀巒溪石與白色大理石，花多年築起這座教堂。黃色屋頂下，藍白相間的牆面刻著部落圖騰與故事，將信仰和山村記憶留在石上。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2680,"name":"鎮西堡神木群","lat":24.539559,"lng":121.294385,"cat":"scenic","desc":"基那吉山與馬望山間的高山森林，潮濕水氣孕育紅檜、扁柏與香杉。走入神木區，沿途巨大的檜木樹幹上，還覆著青苔與蕨類。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2681,"name":"霞喀羅櫻花谷","lat":24.589612,"lng":121.252638,"cat":"scenic","desc":"尖石山頭在花季被櫻花染成粉色，清晨薄霧在群山與花樹間飄過。沿櫻花步道散步，遇上微風，還可見花瓣從枝頭落下。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2682,"name":"高島縱走","lat":24.662882,"lng":121.227118,"cat":"scenic","desc":"從尖石那羅部落起登的中級山路線，串起高台山以及小、中、大島田山。沿途杉林環繞，海拔從一千多公尺一路升至一千八百公尺以上。","area":"尖石鄉・新竹縣","ph":"觀"},{"id":2683,"name":"丹桂宮","lat":24.689013,"l
