ng":121.021466,"cat":"worship","desc":"峨眉山邊的老廟，是居民長年祭拜的信仰中心，廟內奉有五穀神農大帝與文昌帝君。屋宇的雕梁畫棟配上背後青山，留下細看匠藝的空間。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2684,"name":"元光寺","lat":24.64267,"lng":121.012359,"cat":"worship","desc":"又稱獅巖洞的佛寺，依山建在峨眉六寮的山巔，鄰近苗栗縣界。清代普捷和尚在此開山，成為獅頭山寺廟群早期的祖廟。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2685,"name":"十二寮時光村(借問站)","lat":24.671447,"lng":120.994309,"cat":"scenic","desc":"峨眉十二寮的客庄被群山和湖水環繞，茶香、鳥鳴與田園構成聚落的日常。時光村也推動分享與永續生活，讓來訪者接觸在地文化。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2686,"name":"參山多元路線_獅頭山、峨眉湖(竹縣段)","lat":24.680932,"lng":120.980082,"cat":"other","desc":"這條自行車路線穿過獅頭山與峨眉湖之間，兼有森林與湖泊景色。新竹縣境內的一段地勢平緩，沿途可看山林綠意倒映湖面。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2687,"name":"天恩彌勒佛院","lat":24.681275,"lng":120.988107,"cat":"other","desc":"峨眉富興村細茅埔的佛院，最醒目的是高聳的彌勒佛像與寬敞道院。院名取自感念上天恩賜與彌勒護佑，反映創辦時的信仰意涵。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2688,"name":"富興茶葉展售中心","lat":24.697091,"lng":120.985962,"cat":"other","desc":"峨眉湖北岸的茶葉展示空間，有座綠草環繞的庭院。院中石雕刻出古代仕女執壺泡茶的姿態，呼應富興一帶的茶文化與湖畔風景。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2689,"name":"富興隆聖宮","lat":24.688521,"lng":120.988929,"cat":"worship","desc":"峨眉富興的關聖帝君信仰，據傳起於清代墾民高清盛帶來的靈符。起初靈符奉在隘寮之內，逐漸發展成居民共同祭祀的廟宇。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2690,"name":"小雨滴藝術空間","lat":24.688392,"lng":120.974381,"cat":"culture","desc":"許菊與邱建清夫妻共同創立的藝術空間，以柴燒陶藝為特色。許菊常以女體作為陶塑題材，在這裡可以認識她對造形與燒製的探索。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2691,"name":"峨眉天主堂","lat":24.687631,"lng":121.022312,"cat":"worship","tag":"歷史建築","desc":"峨眉的天主堂由高伯龍神父興建、法籍修士潘國磐設計。兩棟加強磚造建築一前一後排列，從外觀便能看出後高前低的配置。","area":"峨眉鄉・新竹縣","ph":"文"},{"id":2692,"name":"峨眉湖","lat":24.6794,"lng":120.98532,"cat":"scenic","desc":"這座由臺灣工程人員設計建造的水庫本名大埔水庫，因位在峨眉鄉而被稱為峨眉湖。當地舊稱月眉，名字取自峨眉溪轉彎處形似彎月的沖積地。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2693,"name":"峨眉湖遊艇碼頭","lat":24.683622,"lng":120.989426,"cat":"scenic","desc":"峨眉湖碼頭停靠著電動遊艇「峨眉一號」，船頂設太陽能板，以電力推動船身。搭船環湖時，可以從水面回望周圍的湖岸與山景。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2694,"name":"張家橘子園","lat":24.697158,"lng":121.005502,"cat":"other","desc":"峨眉的橘園地勢平緩起伏，採果時沿果樹慢慢走就能動手。園方備有籃子與剪刀，讓孩子也能在家人陪伴下體驗親手摘橘。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2695,"name":"月眉柑園","lat":24.70144,"lng":121.000798,"cat":"other","desc":"峨眉山區的柑園種有茂谷柑與桶柑等柑橘，肥沃土壤和當地水源適合果樹生長。成熟果實的酸甜滋味，也是這片山間果園的特色。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2696,"name":"望月亭","lat":24.64343,"lng":121.01093,"cat":"scenic","desc":"獅山古道以這座亭子為界，前後兩段路面從石砌步道變成柏油路。亭子也是古道制高點，能遠眺中港溪與南庄一帶的風景。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2697,"name":"木刻夢想王與免費商店","lat":24.671133,"lng":120.994607,"cat":"other","desc":"從玩偶到保溫壺，店裡整理著居民捐出的乾淨二手物。來客也可以帶物品交換，像以雞蛋換玩偶，延續早年農村互助的習慣。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2698,"name":"歇心茶樓","lat":24.655337,"lng":121.02432,"cat":"other","desc":"獅山遊客中心旁的茶樓隱在山林中，斜面屋頂搭配酒甕和竹編裝飾。這些客家風格的細節，和戶外座位周圍的綠意融在一起。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2699,"name":"沽月日光休憩聚落","lat":24.672174,"lng":120.993822,"cat":"other","desc":"十二寮湖畔的休憩聚落，一邊臨水，一邊望向周圍山林。來訪者可在這裡聽地方故事、接觸客庄傳統技藝，認識農村生活的步調。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2700,"name":"海會庵","lat":24.64342,"lng":121.01368,"cat":"worship","desc":"三面環山的寺庵前臨峽谷，供奉西方三聖與釋迦牟尼佛。廟前幾株枝葉濃密的桂花樹隨風送香，向遠處則可看見香山、竹南沿海。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2701,"name":"獅山遊客中心","lat":24.655003,"lng":121.024473,"cat":"culture","desc":"昔日獅山國小的校舍，整修後成為提供導覽與多媒體介紹的遊客中心。旁邊的教師宿舍改作茶樓，春末還有油桐花在樹下飄落。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2702,"name":"細茅埔吊橋","lat":24.683809,"lng":120.988054,"cat":"other","desc":"從峨眉湖北岸的吊橋走向中央，波光水色便在腳下展開。這座橋連結富興與湖光兩村，從橋上還可望見獅頭山、鵝公髻山和五指山。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2703,"name":"萬佛庵","lat":24.652156,"lng":121.022987,"cat":"worship","desc":"新竹與苗栗交界的獅頭山上，這座佛寺依著天然岩洞而建。山林裡早有修道人在此修行，經整建與重建後，才有今日的寺庵樣貌。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2704,"name":"赤柯山油茶工坊","lat":24.686496,"lng":121.01078,"cat":"other","desc":"峨眉的工坊以在地現榨苦茶油為特色，也使用本地栽種的印加果榨油。油茶產銷班培訓食農教育講師，讓人從作物認識油品的來源。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2705,"name":"金剛寺","lat":24.6469,"lng":121.01609,"cat":"worship","desc":"妙禪法師創建的寺院原稱滌心堂，殿前科林斯柱為寺廟帶來歐式風格。寺中還收藏溥儒的題字與文字學家董作賓的作品。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2706,"name":"靈霞洞","lat":24.64591,"lng":121.01641,"cat":"history","desc":"日治時期建成的石廟依著淺岩洞，巴洛克式牌樓是門面最醒目的特色。洞內奉祀釋迦牟尼佛、觀音菩薩與阿難尊者等。","area":"峨眉鄉・新竹縣","ph":"觀"},{"id":2707,"name":"劉氏雙堂屋","lat":24.837835,"lng":121.04922,"cat":"worship","desc":"上枋寮劉家依原鄉形式興建祖堂，宅院因分前後兩堂而稱雙堂屋。後來族人再添建左右橫屋，發展成兩堂六橫、環抱禾埕的大宅。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2708,"name":"原新埔照門派出所","lat":24.847019,"lng":121.115531,"cat":"history","tag":"歷史建築","desc":"照門居民捐資興建的派出所，保留日式單層木造廳舍格局。灰瓦下的入口破風向前突出，雨淋板外牆與原有窗戶都可細看。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2709,"name":"吳濁流故居","lat":24.838333,"lng":121.110065,"cat":"history","tag":"歷史建築","desc":"作家吳濁流成長的客家夥房，以「至德堂」為堂號。中央公廳和兩側子孫居住的橫屋前有稻田與水圳，後方山丘則種有果樹。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2710,"name":"埤塘窩生態園區","lat":24.856876,"lng":121.105612,"cat":"culture","desc":"九芎湖一帶的水生植物園區，早年種過水稻與果樹。後來圳道和池塘逐漸失去功能，地主與社區一起整理，讓荒置田地有了生態教育用途。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2711,"name":"墾園生態休閒渡假園區","lat":24.844718,"lng":121.04394,"cat":"culture","desc":"新埔的園地裡，竹林、古道、水塘與農舍圍著開闊草坪。花木間飼養長耳兔等小動物，草地旁還有鞦韆和溜滑梯可供孩子活動。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2712,"name":"大日馬術文創園區","lat":24.839094,"lng":121.053138,"cat":"culture","desc":"新埔山間的馬術園區，既有室內騎乘場，也有露天場地和教學空間。園裡一條綠意環繞的騎乘步道通向山間，讓騎馬經驗延伸到林野。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2713,"name":"新埔劉家祠","lat":24.827068,"lng":121.075141,"cat":"worship","tag":"古蹟","desc":"新埔劉家在祖先廳掛上多方匾額，當中「本支百世」是清代總兵劉明燈所題。從正堂到兩側橫屋，都可見翹起的燕尾屋脊。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2714,"name":"新埔廣和宮","lat":24.828066,"lng":121.074604,"cat":"worship","desc":"新埔客家人稱三山國王為「王爺」，因此把供奉三山國王的廣和宮叫作王爺宮。這份信仰隨移民來臺，在新埔成了地方居民的祭祀中心。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2715,"name":"新埔張氏家廟","lat":24.827129,"lng":121.071168,"cat":"worship","tag":"古蹟","desc":"新埔張家祠由張雲龍在清代同治年間倡建，早年是兩層樓的雙堂建築。原有祠堂後來在戰火中焚毀，族人再度投入重建。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2716,"name":"新埔怒潮亭","lat":24.82703,"lng":121.067547,"cat":"history","tag":"歷史建築","desc":"鳳山溪畔的六角橋亭，底座以鵝卵石砌成，上有紅瓦與洗石子柱。昔日怒潮學校學生常在溪邊休息、盥洗，亭名也由此而來。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2717,"name":"新埔文昌祠","lat":24.829173,"lng":121.075003,"cat":"worship","desc":"新埔祭拜文昌帝君的祠堂始建於清代，早年同時充作書房與廟堂。祠宇曾因火災毀損，後來地方再次重建，延續客庄的文昌信仰。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2718,"name":"新埔朱氏家廟","lat":24.82731,"lng":121.076393,"cat":"worship","tag":"歷史建築","desc":"和平街上的宗祠原是朱家子孫的住屋，經宗親提議才改作家廟。廟前是鳳山溪沖積平原，遠望犁頭山，與劉家祠、潘宅同在一帶。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2719,"name":"新埔林氏家廟","lat":24.829016,"lng":121.07611,"cat":"worship","tag":"古蹟","desc":"背靠大屏山的林氏宗祠，採一堂兩橫屋的格局，主祭比干公與歷代祖先。祠中也奉祀媽祖、義民爺，並設捐建有功者的長生祿位。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2720,"name":"新埔潘屋","lat":24.827425,"lng":121.075992,"cat":"history","tag":"古蹟","desc":"潘家先祖從廣東梅縣渡臺，後來落腳新埔石頭坑。長房與二房再到新埔街設立潘金和公號並興建宅院，留下家族發展的軌跡。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2721,"name":"新埔老街","lat":24.827129,"lng":121.075692,"cat":"structure","desc":"新埔街巷間密布客家宗祠、家廟與老屋，有「三街六巷九宗祠」的說法。沿老街轉入小巷，就能看到不同家族留下的祭祀空間。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2722,"name":"新埔若瑟天主堂","lat":24.827742,"lng":121.073025,"cat":"worship","desc":"街角的西班牙式教堂由桑朗度神父興建，見證天主教在新埔的發展。地方教會曾提供醫療資源，也透過幼稚園和內思高工參與教育。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2723,"name":"新埔范氏家廟","lat":24.829067,"lng":121.076673,"cat":"worship","tag":"古蹟","desc":"新埔後街的范家祠，由族人於清代咸豐年間集資興建，是街區早期的宗祠。祠後靠著丘陵，前方越過街區與河階稻田可望向犁頭山。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2724,"name":"新埔褒忠亭","lat":24.84358,"lng":121.03623,"cat":"worship","tag":"古蹟","desc":"新埔的義民廟是北臺灣客家族群共同的信仰中心。地方祭祀可追溯到清代林爽文事件，當時六張犁庄與石壁潭庄居民組織義民軍保衛家鄉。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2725,"name":"新埔西河堂（林浩流公廳）","lat":24.840485,"lng":121.042838,"cat":"worship","tag":"歷史建築","desc":"饒平林浩流渡海來臺，從六家遷到新埔枋寮後，以茅草屋安家。房舍逐步改為泥磚，家族也在此發展，西河堂留下這段移居的記憶。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2726,"name":"新埔詹家黃金風鈴木","lat":24.836815,"lng":121.083851,"cat":"other","desc":"春天的詹家花園，接續迎來炮仗花與黃花風鈴木的花期。成片橘紅炮仗花像瀑布般垂下，接著又能看見滿樹金黃的風鈴木。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2727,"name":"新埔鎮民代表會","lat":24.827953,"lng":121.071533,"cat":"history","tag":"歷史建築","desc":"新埔舊鎮民代表會是兩層平頂建築，水平雨遮與垂直飾板勾出簡潔立面。代表會遷出後，這裡成了展示柿染作品與體驗柿染的地方。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2728,"name":"新埔鎮民眾服務站","lat":24.827936,"lng":121.071083,"cat":"history","tag":"歷史建築","desc":"戰後地方自治與選舉展開之際，新埔成立民眾服務站。這裡曾是國民黨在鄉鎮設置的基層服務據點，反映當時地方政治運作的歷史。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2729,"name":"新埔陳氏宗祠","lat":24.828101,"lng":121.076418,"cat":"worship","tag":"古蹟","desc":"新埔陳家在清代同治年間興建的宗祠，面寬五開間，天井兩側各有廂房。正堂後方增設一排枕頭槓屋，形成近似三堂相連的格局。","area":"新埔鎮・新竹縣","ph":"文"},{"id":2730,"name":"日本公園","lat":24.82971,"lng":121.076109,"cat":"nature","desc":"新埔老街後方的小山坡上，園內種有河津櫻、吉野櫻等櫻樹與青楓。從高點向南遠眺，鳳山溪和頭前溪之間的分水嶺在眼前展開。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2731,"name":"涼井","lat":24.838242,"lng":121.07662,"cat":"history","desc":"新埔旱坑里早年缺水，村民須走遠路來這口開庄古井挑水做飯。後來供水系統改善，居民仍立下紀念牌，記錄井水曾養活全村的歲月。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2732,"name":"照門鳳凰花","lat":24.845961,"lng":121.103059,"cat":"scenic","desc":"照門國小前的鳳凰木到了初夏盛開，枝頭滿是橘紅色花朵。花季恰好碰上畢業季，在花樹下合影也成了校門前獨有的風景。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2733,"name":"福祥仙人掌園","lat":24.857059,"lng":121.094127,"cat":"other","desc":"新埔這座植物園從帶刺的仙人掌到肥厚的多肉植物，分成幾個主題區。除了觀察熱帶景觀與水生植物，也可選盆器與植株組成自己的小花園。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2734,"name":"蓮華山三聖宮","lat":24.831297,"lng":121.098884,"cat":"worship","desc":"蓮華山古道入口的廟宇位居高處，前有鳳山溪支流、旁有老樹。廟內以關聖帝君為主祀，與灶君、呂仙公共稱三恩主公。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2735,"name":"金柏橘園","lat":24.862385,"lng":121.143473,"cat":"other","desc":"新埔的果園以無籽桶柑為特色，成熟果實多汁，帶有清甜滋味。來到樹間可以親手採橘、品嘗新鮮果汁，認識這種在地柑果。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2736,"name":"金漢柿餅教育園區","lat":24.84419,"lng":121.078604,"cat":"culture","desc":"新埔旱坑里的三代柿餅廠，每到秋季便把金黃柿子層層攤開曬製。除了欣賞日光下的曬柿場景，也能透過解說認識傳統柿餅工序。","area":"新埔鎮・新竹縣","ph":"觀"},{"id":2737,"name":"圭窯新彩燒","lat":24.904361,"lng":120.986795,"cat":"culture","desc":"陶藝家陳威恩在新豐的工作坊，一樓展示生活陶器，樓上是上課的教室。他自行研發低碳柴燒方式，讓人從作品中看見傳統燒陶的新做法。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2738,"name":"坡頭漁港","lat":24.927326,"lng":120.971494,"cat":"scenic","desc":"紅毛港尾端的小漁港，以前被居民直稱為坡頭村的海邊。膠筏與中小型漁船停在港內，一有船隻返航，岸邊便有人等著挑選當日漁獲。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2739,"name":"埔和公園","lat":24.922469,"lng":120.991307,"cat":"nature","desc":"新豐的共融公園把磨石子溜滑梯嵌進小山丘，附近有沙坑、鳥巢式鞦韆和旋轉盤。場地雖小，涼亭與水龍頭也方便遊戲後休息整理。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2740,"name":"大口吃米","lat":24.916821,"lng":121.011538,"cat":"other","desc":"新豐稻田裡的食農體驗，從認識田裡的稻作延伸到餐桌。除了動手做米漢堡與稻荷壽司，稻穀結穗時還可學著扭結、裝飾祝繩。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2741,"name":"天德堂","lat":24.867369,"lng":120.979601,"cat":"worship","desc":"松柏嶺西側的廟宇由地方人士合資興建，供奉無形古佛。廟前廣場是居民放風箏、活動的地方，下坡古道也成了早晚散步的路線。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2742,"name":"新竹溪南永寧宮","lat":24.90266,"lng":120.984957,"cat":"worship","desc":"新豐重興村的廟宇坐東朝西，主祀玉皇大帝，也奉祀伯公與伯婆。受限於基地與建廟資源，至今仍保留民房式樣的廟身。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2743,"name":"新豐三元宮","lat":24.900618,"lng":120.997684,"cat":"worship","desc":"新豐田園間立著紅色牌樓，穿過去便能見到三川殿前的石獅。這對石獅身形圓潤，扁平的臉配上八字形嘴，表情格外生動。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2744,"name":"新豐池和宮","lat":24.910075,"lng":120.976224,"cat":"worship","desc":"池府王爺廟的重簷歇山屋頂，裝飾著龍鳳與武將剪黏。三川殿兩旁有八角鐘鼓樓，穿過廟宇後方，還有一座安靜的小花園。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2745,"name":"新豐紅樹林","lat":24.90913,"lng":120.969238,"cat":"scenic","desc":"紅毛溪出海口的水筆仔與海茄苳，在步道兩側交織成綠色隧道。從林蔭間俯看泥灘，有機會看到招潮蟹揮螯、彈塗魚在泥面移動。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2746,"name":"新豐觀海大道","lat":24.911473,"lng":120.966562,"cat":"other","desc":"新豐紅毛港出海口附近的步道，沿海岸一路延伸至坡頭漁港。白沙、海堤與林間小徑交替出現，開闊處能眺望臺灣海峽。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2747,"name":"普元佛道院","lat":24.924412,"lng":120.977537,"cat":"other","desc":"新豐坡頭村的廟宇同祀多位神明，包括池府王爺、觀音菩薩、玉皇大帝與王母娘娘。前來參拜的信徒，分布在新豐、湖口及竹北等地。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2748,"name":"鬍子多肉植物園區","lat":24.895119,"lng":121.012714,"cat":"nature","desc":"園主鬍子哥細心栽培的多肉植物，在園中展現不同品種與造型。沿著陳列觀察，可以近看一株株植物各自的姿態，也認識栽培者的日常照料。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2749,"name":"鳳坑公園","lat":24.904543,"lng":120.970622,"cat":"nature","desc":"走過新豐紅樹林木棧道，盡頭就是鳳坑村的老朴樹林。朴樹曾是沿海防風林常用樹種，園內成群的老樹保留了這段海岸風景。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2750,"name":"鳳坑沙灣","lat":24.903873,"lng":120.967319,"cat":"scenic","desc":"泥沙多年堆積後，往日漁港成了沙灣，圓柱狀消波塊一根接一根向海中延伸。漲潮時石柱立在水面，潮退後又顯出不同的海岸線條。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2751,"name":"鳳蓮宮","lat":24.871174,"lng":120.994356,"cat":"worship","desc":"地方居民捐出廟地並募集資金，建成這座奉祀觀世音菩薩的廟宇。除了神農帝、註生娘娘等神明，廟旁另設文昌廳，供奉文昌與關聖帝君。","area":"新豐鄉・新竹縣","ph":"觀"},{"id":2752,"name":"九讚頭車站","lat":24.720664,"lng":121.136188,"cat":"other","desc":"橫山的內灣線小站，因附近九讚頭客家聚落而得名。過去主要承擔水泥產品與原料的貨運，後來貨運減少，車站也轉向服務山區遊客。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2753,"name":"內山環線(環1-2) (竹縣段)","lat":24.716989,"lng":121.154707,"cat":"other","desc":"這段沿臺三線展開的自行車路線，從關西串起橫山、竹東、北埔與峨眉。一路能遇見牛欄河水岸、內灣線車站與頭前溪景色。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2754,"name":"內灣天主堂","lat":24.706199,"lng":121.180408,"cat":"worship","desc":"內灣聖母升天堂的初期聚會處，曾設在日治時期南河瘧疾防治所的舊址。煤礦興盛、外來人口增加的年代，教堂也參與礦村的信仰生活。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2755,"name":"內灣林業展示館","lat":24.706392,"lng":121.1812,"cat":"culture","desc":"內灣老街轉角的舊工作站，現在作為介紹地方林業的展示館。除了昔日山城伐木的歷史，館內也談在地樹種、螢火蟲與桐花生態。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2756,"name":"內灣老街","lat":24.705262,"lng":121.182269,"cat":"structure","desc":"橫山深處的內灣，日治時期因採煤與伐木而帶動街市繁榮。走在老街上，早期留下的建築與街道痕跡，仍能讓人想像產業興盛的年代。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2757,"name":"內灣親水公園","lat":24.706126,"lng":121.17633,"cat":"nature","desc":"內灣老街旁的公園以生態工法整理池水，岸邊栽著大片落羽松。入秋冬後樹葉漸漸轉色，步道串起池畔不同角度的林間倒影。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2758,"name":"內灣車站","lat":24.705423,"lng":121.182499,"cat":"other","desc":"內灣支線終點的車站，保留早年運礦、運木後的山城風貌。瓷磚與水泥牆搭配木框推窗，站前大牆則裝飾了劉興欽筆下的大嬸婆。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2759,"name":"劉興欽漫畫教育博物館","lat":24.704963,"lng":121.183149,"cat":"culture","desc":"漫畫家劉興欽以阿三哥、大嬸婆等角色為人熟知，也曾授權內灣商家使用人物圖像。內灣國小的展館讓他的漫畫人物與山城的淵源有了展示空間。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2760,"name":"大山背樂善堂","lat":24.699209,"lng":121.139636,"cat":"worship","tag":"古蹟","desc":"大山背居民利用油羅溪谷的砂岩砌牆，建成這座供奉釋迦牟尼佛與文殊、普賢菩薩的佛堂。堂內裝飾簡潔，牆上「忠孝廉節」出自劉家驥手筆。","area":"橫山鄉・新竹縣","ph":"文"},{"id":2761,"name":"天人岩屋","lat":24.710422,"lng":121.166492,"cat":"other","desc":"田野間架高的玻璃屋，一面外牆做成三層樓高的攀岩牆。屋前有清溪，旁邊池塘種著水生植物，後方稻田則保留農業體驗空間。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2762,"name":"富貴車站","lat":24.715545,"lng":121.167371,"cat":"other","desc":"內灣線的南河站後來改名富貴，和竹東的榮華站湊成一對吉祥名字。小站月臺順著鐵道彎曲，緊鄰平交道與周圍山林。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2763,"name":"幻多奇另類博物館","lat":24.705717,"lng":121.181472,"cat":"culture","desc":"內灣的收藏館陳列徐孟光多年蒐集的奇特展品，內容跨越動物與人造物件。從豬鼻龜到特大面額的鈔票，各類收藏並排在同一屋簷下。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2764,"name":"廣濟宮","lat":24.706593,"lng":121.181779,"cat":"worship","desc":"內灣老街盡頭的廟宇，起於居民迎請褒忠義民爺守護聚落。廟裡後來也奉祀開漳聖王、天上聖母與三官大帝，成為地方信仰中心。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2765,"name":"木馬道遺址","lat":24.707098,"lng":121.183048,"cat":"history","desc":"內灣派出所上方的古道，是早年伐木工人把木材運下山的路。當地試採煤礦時發現豐富林木，此後以木馬運材，古道也留下木馬之名。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2766,"name":"橫山車站","lat":24.720571,"lng":121.116549,"cat":"other","desc":"內灣線上的橫山小站，拆除木造站房後只留下一座候車亭。月臺與鐵軌邊栽了許多櫻花，花季時，平日安靜的小站便多了賞花人。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2767,"name":"步居草","lat":24.719525,"lng":121.115974,"cat":"culture","desc":"鄉間的休憩空間設有黏土教室，旅人可以坐下來親手捏陶。從手掌觸摸泥土到塑出自己想要的形狀，創作成了停留村間的一種方式。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2768,"name":"豐鄉瀑布","lat":24.692964,"lng":121.143806,"cat":"scenic","desc":"橫山豐鄉村的瀑布落差約十公尺，清澈水流落入岩壁下的小潭。潭面映出兩側樹木的綠意，這片山水也吸引新人來此拍攝婚紗。","area":"橫山鄉・新竹縣","ph":"觀"},{"id":2769,"name":"八角樓","lat":24.875156,"lng":121.053689,"cat":"history","desc":"湖口羅家建造的紅磚樓，昔日是地方仕紳與商人聚會的場所。巴洛克風格的紅磚牆圍成田字形格局，四面共有八拱，因而得名。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2770,"name":"嶢品藝術街坊(嶢品藝術）","lat":24.877233,"lng":121.057642,"cat":"culture","desc":"室內設計師黃騰嶢經營的藝術空間，結合他對藝術和花藝的喜好。館內可見蕭任能的銅雕作品，也不定期呈現其他臺灣藝術家的創作。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2771,"name":"木石花園博物館","lat":24.876882,"lng":121.056257,"cat":"nature","desc":"館主鄭榮次因為惜物、多年累積各種收藏，館裡的展品從宗教神像跨到卡通人物。史努比、彌勒佛與郵政寶寶等物件，勾起不同年代的生活記憶。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2772,"name":"松湖園","lat":24.933447,"lng":121.050317,"cat":"other","desc":"田園裡的園區有兩片大草坪，也栽種多樣植物，包括不易落葉的墨西哥落羽松。沙坑、迷你足球場和小動物區，讓孩子能在戶外活動。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2773,"name":"湖口三元宮","lat":24.87702,"lng":121.058506,"cat":"worship","tag":"古蹟","desc":"湖口老街旁的信仰中心主祀三官大帝，廟埕前有戲臺。正殿用磚砌方柱承重，樸實的結構與老街上成排的磚柱拱廊彼此呼應。","area":"湖口鄉・新竹縣","ph":"文"},{"id":2774,"name":"湖口公二公園","lat":24.899074,"lng":121.045318,"cat":"nature","desc":"湖口的這座公園到了初夏，阿勃勒便在樹梢開出成串黃花。花序從枝頭往下垂，像一條條金鏈，是園內辨認季節變化的風景。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2775,"name":"湖口公五特色公園","lat":24.894219,"lng":121.046214,"cat":"nature","desc":"湖口公園把軍事意象融入兒童遊戲，從裝甲戰車造型設施到障礙闖關各有玩法。無障礙路徑串起綠地、幼齡遊具與共融遊戲區。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2776,"name":"湖口好客文創園區","lat":24.896618,"lng":121.062504,"cat":"culture","desc":"紅磚拱形街屋與客家圓樓，共同圍出介紹湖口客家文化的園區。從農業交流、民俗古禮到屋頂的彩色交趾陶，都能認識地方生活的不同面向。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2777,"name":"湖口服務區-北站","lat":24.860989,"lng":121.012077,"cat":"other","desc":"湖口北站將三麗鷗角色放進服務區，從入口布景開始就能看到卡通主題。館內高約三公尺的凱蒂貓雕像，是整處空間最醒目的裝飾。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2778,"name":"湖口老街","lat":24.877093,"lng":121.056991,"cat":"structure","desc":"老湖口車站曾帶動街區發展，之後沿街興建一排排大正年間風格的建築。紅磚牆搭配家族堂號浮雕，留下車站遷移前的市街樣貌。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2779,"name":"湖口鄉農會農民社區小舖","lat":24.896208,"lng":121.062097,"cat":"other","desc":"湖口農會的社區小舖，是農民直接展示自家農產的地方市集。從新鮮蔬果到各種加工製品，可以近距離認識附近田地生產的食材。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2780,"name":"溪南湖口顯聖宮","lat":24.902973,"lng":121.04783,"cat":"worship","desc":"鬧區裡的廟埕前有兩座牌樓，中間設戲臺，慶典時可演戲酬神。三川門旁的石獅與前廊牆堵上的石雕，值得走近欣賞匠師的手工。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2781,"name":"綠點子花藝生活館","lat":24.873495,"lng":121.001199,"cat":"culture","desc":"湖口的花藝館裡可見花禮與綠色盆栽，也設有插花教學。學員先選自己喜歡的花，再用不同葉材和排列方式，試出各自的作品。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2782,"name":"老湖口天主堂（含老湖口月台遺蹟）","lat":24.876573,"lng":121.055188,"cat":"worship","tag":"歷史建築","desc":"湖口老街西端較高的臺地，原是清代大湖口車站的所在地。後來義大利籍滿思謙神父籌建天主堂，舊月臺遺跡與教堂共同留下地方記憶。","area":"湖口鄉・新竹縣","ph":"文"},{"id":2783,"name":"草是木陶創","lat":24.877339,"lng":121.080781,"cat":"culture","desc":"葉士綺與先生在湖口山間生活，把作陶、木作與日常工藝帶進創作空間。一人專心處理陶土，另一人擅長蓋房與製作生活用具。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2784,"name":"詹志良·陶玩","lat":24.876936,"lng":121.05562,"cat":"culture","desc":"陶藝家詹志良把湖口老街的舊餐廳變成工作室，前半部展示自藏古玩與陶作。窗臺和層架上都是收藏，旁邊工作臺也留給學員體驗上釉。","area":"湖口鄉・新竹縣","ph":"觀"},{"id":2785,"name":"6Plaza廣場","lat":24.807624,"lng":121.038655,"cat":"nature","desc":"高鐵新竹站旁的小型商場，以生活用品、服飾和兒童遊樂空間為主。館內還有獨立書店，家人可在遊戲之餘找個地方共讀。","area":"竹北市・新竹縣","ph":"觀"},{"id":2786,"name":"Being Different手工香水實驗室","lat":24.823739,"lng":121.02911,"cat":"other","desc":"竹北的香水實驗室以柔和奶色為底，兩面牆排列著錐形瓶與各式香精。透明玻璃瓶透出繽紛原料，讓人從氣味之外也能看見調香的材料。","area":"竹北市・新竹縣","ph":"觀"},{"id":2787,"name":"Ciao巧手捏捏","lat":24.824448,"lng":121.025659,"cat":"culture","desc":"竹北這間手作工作室從基礎開始，由老師陪學員完成作品。除了讓有經驗的人練習技巧，也設計親子課程，讓家長和孩子一起動手。","area":"竹北市・新竹縣","ph":"觀"},{"id":2788,"name":"Tsutaya Bookstore蔦屋竹北樹海店" ":"觀"},{"id":2800,"name":"新竹縣縣史館","lat":24.830243,"lng":121.013188,"cat":"culture","desc":"新竹縣為保存縣市分治後的檔案與地方史料，籌設這座縣史館。日治時期新竹州圖書館留下的藏書，也是館方著手整理保存的文獻。","area":"竹北市・新竹縣","ph":"觀"},{"id":2801,"name":"新竹高鐵站","lat":24.808144,"lng":121.040414,"cat":"other","desc":"姚仁喜設計的車站，將晶圓與玻璃化為建築元素。圓弧流線的屋頂則取自客家圍龍屋，讓竹科的產業特色與地方建築傳統在站房相遇。","area":"竹北市・新竹縣","ph":"觀"},{"id":2802,"name":"日享藝術EnjoyArt","lat":24.819264,"lng":121.024902,"cat":"culture","desc":"竹北的親子藝術工作室，會帶著孩子用樹枝、花材與小果實組成節慶花圈。另一種手作以仿餅乾質地的黏土塑形，做出小巧飾物。","area":"竹北市・新竹縣","ph":"觀"},{"id":2803,"name":"東海有機萊姆園","lat":24.853268,"lng":120.948032,"cat":"other","desc":"竹北濱海稻田間的綠籬內，種有百餘棵萊姆果樹。盛產時果實從綠色漸轉為黃，來到果園便可跟著認識成熟狀態並親手採收。","area":"竹北市・新竹縣","ph":"觀"},{"id":2804,"name":"水圳森林公園","lat":24.810087,"lng":121.035668,"cat":"nature","desc":"新竹高鐵站附近的公園，留有一片可散步與遊戲的寬廣草坪。白天有人帶著寵物在草地活動，也有人鋪開野餐墊，在都市綠地休息。","area":"竹北市・新竹縣","ph":"觀"},{"id":2805,"name":"福樂休閒漁村","lat":24.862645,"lng":120.942698,"cat":"scenic","desc":"竹北拔子窟一帶盛行烏魚養殖，有養殖戶將魚塭發展為休閒漁村。園裡養殖池旁遍植花木，能同時看見濱海漁業與休憩空間的樣貌。","area":"竹北市・新竹縣","ph":"觀"},{"id":2806,"name":"竹北六張犁問禮堂","lat":24.81179,"lng":121.022763,"cat":"history","tag":"歷史建築","desc":"六張犁西側永昌宮後方的客家農宅，從一條龍擴建成一堂二橫的院落。紅瓦白牆配卵石鋪面，院牆還留有祭天公的磚砌壁龕。","area":"竹北市・新竹縣","ph":"文"},{"id":2807,"name":"竹北六張犁大夫第","lat":24.811069,"lng":121.024273,"cat":"history","tag":"歷史建築","desc":"林先坤為紀念父親所建的善慶堂，是六張犁聚落早期的核心。父子兩代同獲追封奉直大夫後，祠堂改稱大夫第，並擴建前堂。","area":"竹北市・新竹縣","ph":"文"},{"id":2808,"name":"竹北六張犁忠孝堂〈東平里13號〉","lat":24.811537,"lng":121.02335,"cat":"worship","tag":"歷史建築","desc":"六張犁林家住宅以白灰牆與瓦頂圍成小院，天井用卵石鋪地。右側橫屋曾兼作穀倉與豬舍，可以看見農家把祭祀和生計放在同一宅院的方式。","area":"竹北市・新竹縣","ph":"文"},{"id":2809,"name":"竹北六張犁忠孝堂〈東平里18號〉","lat":24.811486,"lng":121.02413,"cat":"worship","tag":"歷史建築","desc":"六張犁林家這座三合院，用卵石打基礎、泥磚砌牆，傳統瓦頂下是卵石天井。日治時期因風水考量在原牆內加建圍牆，形成少見的雙牆格局。","area":"竹北市・新竹縣","ph":"文"},{"id":2810,"name":"竹北六張犁林家祠","lat":24.811304,"lng":121.023748,"cat":"worship","tag":"古蹟","desc":"六張犁聚落中心的祠堂，屬於祖籍廣東饒平的林氏族人。家祠的沿革與清代成立的次聖公嘗有關，族人曾共同置辦祭田，維持祭祖所需。","area":"竹北市・新竹縣","ph":"文"},{"id":2811,"name":"竹北問禮堂" 遊戲場。周圍有溜滑梯、傳聲筒與攀岩牆，地面則鋪了軟木，讓孩子在不同遊具之間探索。","area":"竹北市・新竹縣","ph":"觀"},{"id":2823,"name":"豆腐岩","lat":24.800061,"lng":121.029613,"cat":"scenic","desc":"頭前溪中一列列方正的塊體，看起來像泡在湯裡的豆腐，是暱稱的由來。水流從規律的縫隙穿過，讓靜止排列的方塊襯出不同水紋。","area":"竹北市・新竹縣","ph":"觀"},{"id":2824,"name":"音符公園","lat":24.801252,"lng":121.042467,"cat":"nature","desc":"竹北的音樂主題公園，從坡道到欄杆都藏著樂器元素。黑白配色像鋼琴鍵盤，沿路探索之餘，也可使用高溜滑梯與多種攀爬遊具。","area":"竹北市・新竹縣","ph":"觀"},{"id":2825,"name":"魔王城堡公園","lat":24.805941,"lng":121.03159,"cat":"nature","desc":"竹北公七公園把城堡設計成可闖關的遊戲場。孩子可以沿垂直攀岩牆向上爬，再挑戰懸空踏板與滑桿，在移動中練習平衡與膽量。","area":"竹北市・新竹縣","ph":"觀"},{"id":2826,"name":"魔豆歷險公園","lat":24.809404,"lng":121.024975,"cat":"nature","desc":"綠樹下的遊戲場以《傑克與魔豆》為題，將魔豆秘林與蜿蜒藤蔓化為場景。大型攀網、藏身涵洞與挑高溜滑梯，組成不同難度的玩法。","area":"竹北市・新竹縣","ph":"觀"},{"id":2827,"name":"鳳凰飛翔遊樂場","lat":24.833062,"lng":121.001226,"cat":"nature","desc":"園裡的老鳳凰木，成了遊戲場設計鳳雛學飛的靈感。孩子能在木屑鋪面上的鞦韆、滑軌與攀爬架間移動，模仿幼鳥在樹枝間跳躍。","area":"竹北市・新竹縣","ph":"觀"},{"id":2828,"name":"Wah！幾散竹東","lat":24.738469,"lng":121.094209,"cat":"history","desc":"竹東的原住民族文化空間，以泰雅語「來聊天」的意思命名。園內有品牌育成與展示空間，也可見泰雅青年設計、帶有部落人像的文創作品。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2829,"name":"上員車站","lat":24.777835,"lng":121.055655,"cat":"other","desc":"這座小站位在新竹縣竹東鎮，屬於臺鐵內灣線。站體規模簡單，是內灣線行經竹東時的一處鐵道風景。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2830,"name":"上坪老街","lat":24.663541,"lng":121.120515,"cat":"structure","desc":"竹東到五峰之間的老街，曾轉運木材、樟腦與茶葉，也是漢人與泰雅族交換物資的地方。街屋融合閩南紅磚與仿巴洛克裝飾，留下關口的歷史。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2831,"name":"二重親子公園","lat":24.768399,"lng":121.059706,"cat":"nature","desc":"竹東二重的社區公園，把高低不同的水泥跳樁變成跑酷練習場。孩子可依自己的能力選擇攀爬或跳躍的路徑，逐步挑戰不同高度。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2832,"name":"儒醫吳天祐紀念碑","lat":24.734035,"lng":121.086874,"cat":"history","tag":"歷史建築","desc":"竹東國小操場後方的山坡立著一座紀念碑，源於地方仕紳吳錦堂捐地給學校。居民為感念善舉，以他父親、儒醫吳天祐之名立碑。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2833,"name":"名冠藝術館","lat":24.744979,"lng":121.078778,"cat":"culture","desc":"閒置的陶瓷工廠在經營者規劃下，轉型為一棟三層樓藝術館。走進一樓藝文沙龍，可以看工藝品、翻書畫冊，也為創作者保留交流空間。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2834,"name":"客家戲曲公園","lat":24.737117,"lng":121.090166,"cat":"nature","desc":"竹東中央市場旁的育樂公園，以開闊綠地供人下棋、聊天。這裡也是客家藝文活動的場地，有時可以聽民謠、欣賞採茶戲演出。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2835,"name":"榮華車站","lat":24.74849,"lng":121.083006,"cat":"other","desc":"竹東鎮的內灣線小站，帶出了一張有趣的吉祥語車票。沿線原本名叫南河的小站改稱富貴，兩個站名並列就成為「榮華富貴」。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2836,"name":"玉泉山普照宮","lat":24.733044,"lng":121.084421,"cat":"worship","desc":"竹東森林公園內的廟宇奉祀關聖帝君，位置與山間步道相連。廟旁的三層景觀臺提供高處視野，從這裡可以俯看竹東鎮景色。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2837,"name":"瓦當人文書屋","lat":24.730429,"lng":121.089095,"cat":"culture","desc":"竹東大林路上的藍色大門，後面是一間獨立書店。約二十坪的書屋有店主選書、咖啡與舊式物件，組成小鎮閱讀與停留的空間。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2838,"name":"甘露寺","lat":24.744606,"lng":121.080929,"cat":"worship","desc":"竹東的這座寺院供奉釋迦牟尼佛，寺身不大，樓高三層，另設僧眾居住的寮房。簡樸的佛堂承擔小鎮居民禮佛與修行的需要。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2839,"name":"竹東中正公園","lat":24.732021,"lng":121.092668,"cat":"nature","desc":"頭前溪支流旁的公園，把樹杞林與卵石梯田等地方意象放進遊戲場。繽紛色塊區隔不同遊具，讓孩子在玩耍中接觸竹東客庄的風景。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2840,"name":"竹東九牧第","lat":24.767354,"lng":121.051969,"cat":"history","tag":"古蹟","desc":"林春秀興建的合院採一堂六橫屋格局，曾是商議竹東大圳工程的重要場所。為開圳成立的三益株式會社，也曾設在這座宅院裡。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2841,"name":"竹東台泥親子公園","lat":24.728647,"lng":121.093654,"cat":"nature","desc":"竹東舊水泥廠的土地，改成順應地形的綠地遊戲場。園內保留大理石地景藝術，也利用下凹地形重新設計遊樂空間，讓舊廠留下痕跡。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2842,"name":"竹東圳入水口","lat":24.698727,"lng":121.095886,"cat":"history","tag":"歷史建築","desc":"竹東大圳取自上坪溪的水，經軟橋分廠後進入第一號隧道。入水口留下紅磚構造，碑上也刻著開工、竣工與創設功勞者林春秀的名字。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2843,"name":"竹東大圳","lat":24.705157,"lng":121.097477,"cat":"scenic","desc":"從燥樹排攔取上坪溪水的大圳，把水引入竹東二重埔與三重埔。原本的灌溉工程讓大片荒埔成了農田，後來也參與科學園區供水。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2844,"name":"竹東寵物運動公園","lat":24.735222,"lng":121.099486,"cat":"nature","desc":"頭前溪河濱生態公園旁，有座專門供狗活動的運動公園。園內依犬隻體型劃分空間，搭配不同設施，讓主人能陪狗散步與奔跑。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2845,"name":"竹東惠昌宮","lat":24.738137,"lng":121.087117,"cat":"worship","desc":"竹東市鎮中心的廟宇主祀三山國王，也同時奉祀觀音、地藏等佛教神明。廟前演戲的傳統由來已久，金光布袋戲也曾在這裡登場。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2846,"name":"竹東慈惠堂","lat":24.721324,"lng":121.074726,"cat":"worship","desc":"竹東的慈惠堂供奉瑤池金母，是各地慈惠堂分堂之一。金母信仰在臺灣各地發展，竹東分堂也成了地方信徒共同禮拜的據點。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2847,"name":"竹東曉江亭","lat":24.730347,"lng":121.090824,"cat":"history","tag":"古蹟","desc":"軟坡溪的東寧橋頭，地方人士在興建石拱橋時捐款設立茶亭。亭旁有福德祠，橋下則是竹東著名的洗衫坑，串起往日居民的生活空間。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2848,"name":"竹東森林公園步道","lat":24.731911,"lng":121.082878,"cat":"nature","desc":"竹東鎮立圖書館後方的步道繞行森林公園，沿路有植物解說牌。經過涼亭、廣場與山中寺廟，還可登普照宮的三層觀景臺遠望。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2849,"name":"竹東甘屋渤海堂","lat":24.705635,"lng":121.09656,"cat":"worship","tag":"古蹟","desc":"竹東員崠子的甘家合院，由甘照錦興建，保有一堂兩橫屋的傳統配置。中央堂屋少見地建成兩層樓，橫屋則融入西式磚砌拱廊。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2850,"name":"竹東生態河濱公園","lat":24.746821,"lng":121.087805,"cat":"nature","desc":"頭前溪畔的河濱公園，沿溪留有成片草地與可騎單車的空間。水質淨化、自然保育和運動設施也在此並存，散步便能看見河岸的綠意。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2851,"name":"竹東蕭如松故居建築群","lat":24.739826,"lng":121.088159,"cat":"culture","tag":"歷史建築","desc":"竹東這群房舍原為日治時期的官舍與街營宿舍，戰後改作高中教師宿舍。藝術家蕭如松曾住在其中一棟，讓校園生活與地方美術史在此交會。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2852,"name":"竹東車站","lat":24.738217,"lng":121.094699,"cat":"history","tag":"歷史建築","desc":"戰後初期完成的竹東站，沿用並調整日治時期鐵道部的設計。它見證鐵路從新竹延伸到內灣的過程，保存下來的站體仍作車站使用。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2853,"name":"竹東頭重並禁、示禁二碑","lat":24.780127,"lng":121.029288,"cat":"history","tag":"歷史建築","desc":"頭重保有兩塊清代石碑，分別題作「申約併禁碑」與「奉憲示禁碑」。後者由淡水同知具名，碑上文字至今仍可辨認。","area":"竹東鎮・新竹縣","ph":"文"},{"id":2854,"name":"篁城竹簾文化館","lat":24.739942,"lng":121.091727,"cat":"culture","desc":"竹東的竹簾工廠經歷三代，從竹材買賣逐漸發展為竹簾與紡織品的結合。選用尖石、五峰山區的桂竹，取其竹皮光澤、韌性與彈力。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2855,"name":"軟橋彩繪村","lat":24.695454,"lng":121.097468,"cat":"culture","desc":"竹東前往五峰的沿途，軟橋居民把自家牆面變成彩繪畫布。素人畫家吳先生帶著村民一起作畫，讓社區故事沿著街道一幅幅展開。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2856,"name":"頤禾園","lat":24.696415,"lng":121.101638,"cat":"other","desc":"竹東軟橋山林環繞的有機農園，春季以水田裡的插秧作為食農體驗。赤腳踩進濕泥，彎腰把嫩苗種下，便能體會種稻的勞動。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2857,"name":"頭前溪彩虹屋","lat":24.736292,"lng":121.089989,"cat":"culture","desc":"頭前溪畔這排房屋沿水道並列，每棟外牆都呈現不同色彩。從水邊望過去，規律排列的建築與一連串顏色，成了這裡的拍攝特色。","area":"竹東鎮・新竹縣","ph":"觀"},{"id":2858,"name":"公四水霧公園","lat":24.774849,"lng":121.0773,"cat":"nature","desc":"芎林街區附近的狹長公園分成多種遊戲區，特別的是地面會噴出細緻水霧。孩子穿梭設施之間，也能在炎夏感受霧氣的涼意。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2859,"name":"方口獅公園","lat":24.780626,"lng":121.074344,"cat":"nature","desc":"芎林的客家方口獅被放大成一整座遊具，孩子可以從獅口溜下滑梯。進入獅身有繪圖板，走到尾巴則是攀爬牆，處處呼應地方舞獅文化。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2860,"name":"紙寮窩造紙工坊","lat":24.780286,"lng":121.082726,"cat":"culture","desc":"芎林紙寮窩因盛產桂竹又有水源，劉家在此建紙寮、發展手工金銀紙產業。工坊保留早年的造紙設備，並以展示與手作介紹傳統技藝。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2861,"name":"自然谷環境信託基地","lat":24.749913,"lng":121.148054,"cat":"scenic","desc":"芎林山區的環境信託基地，步道旁有多樣植物，季節轉換時可觀察林相變化。除了聆聽鳥聲，也有繩索攀樹等活動能從不同角度接近森林。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2862,"name":"芎林五和宮","lat":24.736295,"lng":121.119948,"cat":"worship","desc":"芎林五龍村的廟宇主祀天上聖母，清代嘉慶年間已經建立。過去鹿寮坑、山豬湖、大肚、橫山和沙坑五庄共同奉祀，正是「五和」的由來。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2863,"name":"芎林呈甘橋及捐題碑","lat":24.772715,"lng":121.083024,"cat":"history","tag":"歷史建築","desc":"芎林高梘頭的橋橫跨九芎溪，原名積德橋。清代居民由林先坤等仕紳捐款搭建木橋，屢受風災損壞才陸續改建，石碑也留下捐建的記憶。","area":"芎林鄉・新竹縣","ph":"文"},{"id":2864,"name":"芎林姜家天水堂","lat":24.76667,"lng":121.083895,"cat":"worship","desc":"芎林姜家的傳統三合院，以紅磚老屋保存家族生活的痕跡。冬季到初春，附近梅樹開出白花，白色花枝映著紅牆，是古厝特有的季節景色。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2865,"name":"芎林文林閣","lat":24.773335,"lng":121.082573,"cat":"other","desc":"芎林這座奉祀三恩主與文昌帝君的廟宇，原本也是舉人鄧兆熊創設的學堂。後來文林社在此發展，成為頭前溪流域文人交流的據點。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2866,"name":"芎林金玉豐精米所","lat":24.783605,"lng":121.074596,"cat":"culture","tag":"歷史建築","desc":"芎林的精米廠借用下山圳水流，推動水礱碾米去穀。農民陳玉慶在臺灣米外銷的年代設立精米所，讓灌溉圳道也為加工產業提供動力。","area":"芎林鄉・新竹縣","ph":"文"},{"id":2867,"name":"鄧雨賢音樂文化公園","lat":24.774081,"lng":121.085534,"cat":"nature","desc":"《望春風》與《雨夜花》的作曲者鄧雨賢，曾在芎林國小任教。地方將舊野戰醫院改為音樂公園，露天舞臺、草地與人物介紹共同紀念這段淵源。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2868,"name":"順翌休閒馬場","lat":24.780918,"lng":121.101838,"cat":"other","desc":"芎林中坑村的馬場，除了露天場地與小型室內馬場，也安排野外騎乘空間。賞馬區、小動物區與採果區，讓人從騎馬延伸到農村活動。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2869,"name":"飛鳳山代勸堂","lat":24.764519,"lng":121.10816,"cat":"worship","desc":"芎林地方仕紳選在飛鳳山腰建廟，至今已有百餘年歷史。廟裡主祀關聖帝君、孚佑帝君和司命真君，居民也稱這裡為聖帝廟。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2870,"name":"鹿寮坑花旗木秘境","lat":24.75416,"lng":121.141786,"cat":"scenic","desc":"芎林鹿寮坑的山坡沿途栽著花旗木，每逢春季，粉紅花枝在路上連成一片。到了黃昏，夕陽斜照花朵，也為山坡帶來不同光色。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2871,"name":"鹿寮坑黃屋伙房江夏堂","lat":24.745281,"lng":121.138216,"cat":"worship","desc":"樟之細路旁的客家夥房，由鹿寮坑黃氏家族代代守護。紅磚瓦屋、老木門窗和寬敞禾埕共同保留，還能看出傳統聚落的生活格局。","area":"芎林鄉・新竹縣","ph":"觀"},{"id":2872,"name":"仙草一分田","lat":24.788527,"lng":121.172287,"cat":"scenic","desc":"關西田野裡，仙草開花時整片農地泛起紫色，花穗隨風輕晃。附近還有南山的金城武樹，兩處地景都和當地開闊田野相連。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2873,"name":"元和宮","lat":24.801781,"lng":121.139503,"cat":"worship","desc":"關西坪林國小西側的廟宇，主祀三官大帝，也奉祀神農、文昌與媽祖等神明。廟前有棵老榕樹，與百年廟宇一同見證居民的信仰生活。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2874,"name":"元馨柿餅","lat":24.825402,"lng":121.116694,"cat":"other","desc":"關西秋冬日照與風勢適合把鮮柿自然風乾，製成金黃、帶嚼勁的柿餅。當地元馨的柿餅製作傳到第四代，延續靠陽光與風完成的手藝。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2875,"name":"潮音禪寺","lat":24.784723,"lng":121.177697,"cat":"worship","desc":"鳳山溪與牛欄河相會的關西山間，坐落著這座百年禪寺。歷代住持逐步建起寺院規模，群山環繞的環境也成為僧眾修習佛法的所在。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2876,"name":"牛欄河親水公園","lat":24.792346,"lng":121.18084,"cat":"nature","desc":"關西老街附近的親水公園，步道順著牛欄河畔延伸。沿路走到東安古橋下方，可從河岸仰望日治時期建成的橋梁，欣賞橋與溪水的關係。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2877,"name":"石爺亭","lat":24.788579,"lng":121.176998,"cat":"other","desc":"關西居民奉祀一大一小兩顆石頭，分別尊稱石爺與石婆。當地有認石爺為乾爹、祈求孩子平安長大的習俗，石爺生日義子也會回來祭拜。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2878,"name":"磐龍石木坊","lat":24.802529,"lng":121.186922,"cat":"culture","desc":"關西一間閒置多年的茶廠，經木石雕藝術家蔡永福整理成創作與展覽空間。館中可見石雕硯臺和奇木作品，舊廠房因此換上不同用途。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2879,"name":"臺紅茶葉文化館","lat":24.791215,"lng":121.175691,"cat":"culture","desc":"關西羅家在日治時期創辦的茶業設施，如今以文化館介紹地方茶產業。紅磚牆與木造窗櫺構成老建築的特色，也留下早期製茶興盛的印記。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2880,"name":"藥師佛禪寺","lat":24.791117,"lng":121.204752,"cat":"worship","desc":"寺中主祀東方藥師琉璃光佛，二樓大雄寶殿則供奉三寶佛。藥師佛十二大願中為眾生解除病苦的信念，是信眾到此禮佛的文化背景。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2881,"name":"裕大關西仙草茶","lat":24.786076,"lng":121.177747,"cat":"other","desc":"關西的仙草工廠前有一片綠色仙草田，附設的黑蜜館以展板介紹地方產業故事。除了認識原料，也能動手把仙草做成麵條或麻糬。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2882,"name":"金廣成文化館","lat":24.788502,"lng":121.212246,"cat":"culture","desc":"文化館記錄關西四寮溪上游的開墾歷程。清代墾首蔡華亮聯合周源寶等人組成金廣成墾號，這個名稱也成為地方拓墾歷史的線索。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2883,"name":"金錦山義民廟","lat":24.767861,"lng":121.224235,"cat":"worship","desc":"山林前的義民廟背山面水，燕尾屋脊高高翹起，前方可望向壽桃山。一樓奉祀義民爺，左右另有註生娘娘與城隍爺陪祀。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2884,"name":"關西南陽堂鄧屋","lat":24.826185,"lng":121.114183,"cat":"worship","tag":"歷史建築","desc":"關西大旱坑的鄧家老屋，採一堂三橫的客家夥房格局。前方禾埕、後方水井與化胎仍可辨認，公廳兩側是族人住所，外橫屋曾作牲畜空間。","area":"關西鎮・新竹縣","ph":"文"},{"id":2885,"name":"關西台灣紅茶公司","lat":24.791309,"lng":121.175727,"cat":"history","tag":"歷史建築","desc":"關西製茶業興盛時，羅碧玉看見紅茶外銷的發展機會，創立臺灣紅茶公司。廠房留下地方茶業由茶園走向國際市場的歷史。","area":"關西鎮・新竹縣","ph":"文"},{"id":2886,"name":"關西天主堂","lat":24.794332,"lng":121.176246,"cat":"worship","desc":"關西北斗里的教堂，以哥德式尖塔與灰白洗石子外牆立在街區。拱形彩繪玻璃為室內引入色光，聖母像與耶穌像也有細緻雕工。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2887,"name":"關西太和宮","lat":24.790904,"lng":121.177002,"cat":"worship","tag":"古蹟","desc":"關西居民也稱這座奉祀三官大帝的廟宇為三界廟。殿內有細緻木作、交趾陶與石雕，傳統祭典時廟坪還會搬演平安戲。","area":"關西鎮・新竹縣","ph":"文"},{"id":2888,"name":"關西東安古橋","lat":24.790854,"lng":121.179812,"cat":"history","tag":"古蹟","desc":"日治時期建成的五孔石橋橫跨牛欄河，連起關西街區與東安里。四座橋墩撐起連續的半圓拱，從河岸望去可見石砌外層與整齊的橋孔。","area":"關西鎮・新竹縣","ph":"文"},{"id":2889,"name":"關西櫻花秘境","lat":24.802987,"lng":121.141747,"cat":"scenic","desc":"關西坪林國小對面的農塘，湖畔栽著一排高度適中的櫻花樹。花季時粉色花枝接近人眼的高度，水面也映出沿岸一圈花影。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2890,"name":"關西稻田彩繪","lat":24.792893,"lng":121.178547,"cat":"other","desc":"關西農家利用不同顏色、品種的稻米，在田裡種出大型主題圖案。秋收前從高處俯看，才能把不同稻色拼出的整幅圖案收進眼底。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2891,"name":"關西老街","lat":24.789324,"lng":121.176371,"cat":"structure","desc":"鳳山溪與牛欄河交會的關西鎮，是仙草與柑橘產地。中正路上的老街保存紅磚街屋與拱形騎樓，沿著廊道走便能看見昔日聚落的格局。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2892,"name":"關西蝙蝠洞","lat":24.767983,"lng":121.224251,"cat":"scenic","desc":"錦山里帽盒山下的天然石灰岩洞，幽深處是蝙蝠棲息的地方。黃昏成群蝙蝠從洞中飛出，這幅景象也有「帽盒翔蝙」之名。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2893,"name":"關西鄭氏祠堂","lat":24.793189,"lng":121.17776,"cat":"worship","tag":"古蹟","desc":"關西鄭家祠堂以一堂三橫屋圍成合院，門上題著「滎陽世第」。正廳供奉祖先牌位，後方化胎上的荔枝樹與卵石擋土牆留有客家建築特色。","area":"關西鎮・新竹縣","ph":"文"},{"id":2894,"name":"關西鎮農會仙草加工廠","lat":24.803355,"lng":121.162679,"cat":"other","desc":"關西農會的加工廠，把田裡採收的仙草做成仙草茶、仙草凍與仙草乾。從略帶絨毛的綠葉到各種成品，可以認識地方農產如何經過加工。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2895,"name":"雲海休閒茶廠","lat":24.824501,"lng":121.162422,"cat":"other","desc":"關西的休閒茶廠有大片茶園，也在農園裡栽培果樹、復育獨角仙。除了看茶樹與製茶產業，園區的導覽也介紹昆蟲和早年使用的農具。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2896,"name":"馬武督長老教會","lat":24.779675,"lng":121.256264,"cat":"worship","desc":"馬武督泰雅族人的磚瓦教堂，外觀簡樸，已陪伴部落數代。傳道人帶著孩子參與詩班、學習母語，讓教堂同時成為傳承語言的空間。","area":"關西鎮・新竹縣","ph":"觀"},{"id":2897,"name":"Global Mall 桃園A19","lat":25.00198,"lng":121.20244,"cat":"other","desc":"桃園的多層商場以家庭日常需求安排不同店舖，地上樓層與地下空間相連。室內大量運用木質材料與綠意，讓城市商場帶有自然氣息。","area":"中壢區・桃園市","ph":"觀"},{"id":2898,"name":"Xpark 八景島水族館","lat":25.01723,"lng":121.21427,"cat":"culture","desc":"水族館的識別標誌從海洋孕育生命的概念出發，也把遺傳物質的形態帶入設計。彼此連接的點與線，描繪出生命與演化的意象。","area":"中壢區・桃園市","ph":"觀"},{"id":2899,"name":"中壢仁海宮","lat":24.96234,"lng":121.22794,"cat":"worship","desc":"中壢、平鎮、楊梅等十三庄在清代合力建廟，初奉觀音，後來增奉媽祖。廟宇坐落新街，居民也因此稱這處共同信仰中心為新街廟。","area":"中壢區・桃園市","ph":"觀"},{"id":2900,"name":"中壢光影電影館(光影一館)","lat":24.93551,"lng":121.23781,"cat":"culture","desc":"馬祖新村原有的眷村居民活動中心，改為兩層樓的電影館。一樓展示電影與藝文主題，樓上則設有小型影廳，讓老建築延續聚集人群的功能。","area":"中壢區・桃園市","ph":"觀"},{"id":2901,"name":"中壢埔頂彭城堂","lat":24.959488,"lng":121.237427,"cat":"worship","tag":"歷史建築","desc":"中壢埔頂的傳統家屋，早年用附近取得的卵石打地基，再以竹子與土牆築屋。後來先整修右橫屋，換上磚牆紅瓦，留下農宅逐步改建的歷程。","area":"中壢區・桃園市","ph":"文"},{"id":2902,"name":"中壢庄內厝子黃宅明德居","lat":24.98471,"lng":121.18213,"cat":"history","tag":"古蹟","desc":"黃家祖先從廣東陸豐渡臺，後代五兄弟經營水田與茶園，逐步買下耕作的土地。日治時期在中壢庄內建成明德居，作為家族公廳與祖厝。","area":"中壢區・桃園市","ph":"文"},{"id":2903,"name":"中壢燃藜第","lat":24.96008,"lng":121.20457,"cat":"history","tag":"古蹟","desc":"廣東饒平劉氏移居中壢後，由第十九世二十位堂兄弟共同興建這座家宅。宅院落成於日治時期，留下同族人合力建屋的宗族歷史。","area":"中壢區・桃園市","ph":"文"},{"id":2904,"name":"中壢聖蹟亭及東伯公","lat":24.962756,"lng":121.228676,"cat":"worship","tag":"歷史建築","desc":"中壢新街的讀書人興盛，惜字風俗促成了聖蹟亭的興建。亭身為三層磚造，外表以洗石子處理，保留傳統惜字亭上下分段的造型。","area":"中壢區・桃園市","ph":"文"},{"id":2905,"name":"中壢藝術館","lat":24.95826,"lng":121.22748,"cat":"culture","desc":"中壢這座多功能藝文場館，從一九八五年起服務地方。館內設音樂廳、演講廳與兩間展覽室，既能欣賞演出，也能觀看不同展覽。","area":"中壢區・桃園市","ph":"觀"},{"id":2906,"name":"中壢鐵道4號、5號倉庫","lat":24.954587,"lng":121.227829,"cat":"history","tag":"歷史建築","desc":"中壢車站旁的鐵道倉庫，最早服務南桃園的米穀與茶葉儲運。戰後四號倉庫由臺鐵票務中心使用，存放火車票與印票機具。","area":"中壢區・桃園市","ph":"文"},{"id":2907,"name":"中壢馬祖新村","lat":24.936008,"lng":121.237077,"cat":"history","tag":"歷史建築","desc":"龍岡的眷村為安置駐守馬祖的軍人家屬而興建，中央圓環設有八角亭。從亭子望出去，棋盤狀街道與向外排列的眷舍，構成聚落格局。","area":"中壢區・桃園市","ph":"文"},{"id":2908,"name":"中壢龍岡圓環軍人雕像及周邊營舍","lat":24.925597,"lng":121.244109,"cat":"history","tag":"歷史建築","desc":"龍岡圓環原有一座涼亭，後來改為衝鋒戰士雕像，成為軍眷聚落的地標。周邊營舍與曾作電影院的文藝活動中心，留下軍民共有的生活記憶。","area":"中壢區・桃園市","ph":"文"},{"id":2909,"name":"台灣高鐵探索館","lat":25.01187,"lng":121.2139,"cat":"culture","area":"中壢區・桃園市","ph":"觀"},{"id":2910,"name":"台灣高鐵桃園站","lat":25.01299,"lng":121.21486,"cat":"other","desc":"桃園的高鐵站鄰近國際機場，是臺灣重要的旅客往來據點。來自北部及中南部的旅人在此匯集，讓車站有了「機場的入口」之稱。","area":"中壢區・桃園市","ph":"觀"},{"id":2911,"name":"圓光禪寺","lat":25.0021,"lng":121.19481,"cat":"worship","desc":"綠瓦白牆裡，北方宮殿式殿堂與庭園相互搭配，整體依傳統佛教叢林規制規劃。側門上的斑鹿與法輪，象徵佛陀在鹿野苑初次說法。","area":"中壢區・桃園市","ph":"觀"},{"id":2912,"name":"壢小故事森林","lat":24.95392,"lng":121.22054,"cat":"other","area":"中壢區・桃園市","ph":"觀"},{"id":2913,"name":"壢景町","lat":24.95362,"lng":121.22211,"cat":"history","desc":"日治時期中壢郡役所的官舍，曾有臺籍警察家庭在此居住。這棟老屋後來見證中壢事件，修復後以壢景町之名留下城市民主發展的記憶。","area":"中壢區・桃園市","ph":"觀"},{"id":2914,"name":"樂天桃園棒球場","lat":25.00033,"lng":121.20156,"cat":"other","desc":"原名桃園國際棒球場的球場，是許多球迷看中華職棒的地方。從看臺上的安打、全壘打助威聲，到演唱會的安可聲，都屬於這座球場的記憶。","area":"中壢區・桃園市","ph":"觀"},{"id":2915,"name":"老街溪河川教育中心","lat":24.95365,"lng":121.2183,"cat":"structure","desc":"老街溪畔的河川教育中心，把室內展示和眼前的河流環境放在一起。從認識河川變遷到健走淨溪、手作與食農活動，都圍繞這條溪展開。","area":"中壢區・桃園市","ph":"觀"},{"id":2916,"name":"華泰名品城","lat":25.01366,"lng":121.21264,"cat":"other","desc":"桃園高鐵站旁的商場以美式露天購物街為特色，店舖沿戶外空間展開。園區分期發展，匯集國內外品牌與餐廳，成為青埔的購物據點。","area":"中壢區・桃園市","ph":"觀"},{"id":2917,"name":"青塘園","lat":25.00556,"lng":121.2061,"cat":"other","desc":"昔日用於農田灌溉、防洪調節的埤塘，如今成了都市裡的親水空間。沿木棧道與緩坡繞行，可以從觀景平臺看水面，旁邊還有戶外劇場。","area":"中壢區・桃園市","ph":"觀"},{"id":2918,"name":"馬祖新村眷村文創園區","lat":24.9356,"lng":121.23779,"cat":"culture","desc":"駐守馬祖列島的陸軍眷屬，曾在這片為他們規劃的眷村生活。村內有不少高階軍官家庭，留下「星星滿天飛」的說法，如今聚落保存眷村文化。","area":"中壢區・桃園市","ph":"觀"},{"id":2919,"name":"黑松飲料博物館","lat":24.97715,"lng":121.23706,"cat":"culture","desc":"喜宴上的綠洲果汁、帶著氣泡的黑松沙士，都在館內的時光廊道裡勾起回憶。沿著熟悉的飲料回望，也能想起和家人同桌吃喜酒的日子。","area":"中壢區・桃園市","ph":"觀"},{"id":2920,"name":"龍岡圖書館(桃園市立圖書館龍岡分館)","lat":24.93768,"lng":121.2559,"cat":"other","desc":"榕樹隧道與台貿公園草坡旁的圖書館，由建築師盧俊廷設計。建築將風、日光、水與綠意視為空間的一部分，回應城市讀者親近自然的需求。","area":"中壢區・桃園市","ph":"觀"},{"id":2921,"name":"龍岡森林公園","lat":24.93391,"lng":121.23574,"cat":"nature","desc":"龍岡大操場周邊的大片綠地，經整理後成為森林公園。開闊空間增加了當地居民散步休憩的地方，也常見人們帶著寵物在草地活動。","area":"中壢區・桃園市","ph":"觀"},{"id":2922,"name":"龍岡清真寺","lat":24.93005,"lng":121.25365,"cat":"worship","desc":"桃園龍岡的清真寺，是認識當地穆斯林信仰的場域。從入口門樓、大殿門廳到男女分設的空間，都呈現伊斯蘭禮拜場所的安排。","area":"中壢區・桃園市","ph":"觀"},{"id":2923,"name":"77巧克力共和國","lat":24.94174,"lng":121.29292,"cat":"other","area":"八德區・桃園市","ph":"觀"},{"id":2924,"name":"八塊厝民俗藝術村(大湳森林公園)","lat":24.95482,"lng":121.30162,"cat":"nature","desc":"大湳森林公園裡的民俗藝術村，提供地方居民與閩南族群聚集、交流的空間。傳統藝文創作與展演在此進行，也結合數位技術與社區參與。","area":"八德區・桃園市","ph":"觀"},{"id":2925,"name":"八塊無線送信所","lat":24.972114,"lng":121.302622,"cat":"history","tag":"古蹟","desc":"日治末期，桃園臺地設置多座飛行場，也增設對空無線電通信設施。八塊無線送信所便是其中一環，留下早期航空發展的通訊歷史。","area":"八德區・桃園市","ph":"文"},{"id":2926,"name":"八德三元宮","lat":24.930205,"lng":121.284585,"cat":"worship","tag":"古蹟","desc":"八德先民在清代開墾時建廟，奉祀分掌天、地、水的三官大帝。居民以天官賜福、地官赦罪、水官解厄寄託心願，成了地方重要信仰。","area":"八德區・桃園市","ph":"文"},{"id":2927,"name":"八德中正堂","lat":24.956928,"lng":121.301869,"cat":"history","tag":"歷史建築","desc":"八德軍方早年以同袍儲蓄會盈餘興建文康中心，供官兵休閒娛樂。附近居民與軍眷也到這裡看電影、參加集會，留下共同的生活記憶。","area":"八德區・桃園市","ph":"文"},{"id":2928,"name":"八德呂宅著存堂","lat":24.927262,"lng":121.280462,"cat":"worship","tag":"古蹟","desc":"八德呂氏族人合資買田、興建著存堂，既是祭祀祖先萬春公的祠堂，也管理田產租務。地方稱它上公厝，見證同宗家族共同經營的方式。","area":"八德區・桃園市","ph":"文"},{"id":2929,"name":"八德呂達川祠堂","lat":24.9351,"lng":121.28344,"cat":"worship","tag":"歷史建築","desc":"八德呂達川一支的族人建成下公厝，與附近著存堂同出呂萬春一脈。堂號「貽訓堂」取自家族以孝友為根本的訓示。","area":"八德區・桃園市","ph":"文"},{"id":2930,"name":"八德喻竹居","lat":24.927248,"lng":121.260248,"cat":"history","tag":"歷史建築","desc":"霄裡李家以屋後桂竹林為宅院命名，傳統合院的正廳作家族祭祖之用。檜木門板配有活動式門鎖，門戶彩繪與剪黏也各有細節。","area":"八德區・桃園市","ph":"文"},{"id":2931,"name":"八德埤塘自然生態公園","lat":24.94166,"lng":121.31125,"cat":"nature","desc":"八德的都市公園保留桃園常見的埤塘地貌，在大片綠地間留下一池水域。這裡兼具居民休憩與濕地生態的功能，散步時能親近原有水環境。","area":"八德區・桃園市","ph":"觀"},{"id":2932,"name":"八德廣福宮","lat":24.930705,"lng":121.288283,"cat":"worship","tag":"歷史建築","desc":"八德興豐公園一角的土地公廟，早在清代就是八塊厝居民祭拜的地方。廟前仍立有石碑，和地方祭祀紀錄一起留下福德正神的信仰歷史。","area":"八德區・桃園市","ph":"文"},{"id":2933,"name":"八德敦德堂","lat":24.936918,"lng":121.288362,"cat":"worship","tag":"歷史建築","desc":"八德邱家的三合院，以正身、兩側橫屋與圍牆圈出前埕。中央正身供家族祭祀，左右則安排私廳與廂房，兼顧宗族與日常起居。","area":"八德區・桃園市","ph":"文"},{"id":2934,"name":"八德餘慶堂","lat":24.93434,"lng":121.287437,"cat":"worship","tag":"歷史建築","desc":"八德邱家的堂屋建於二戰期間，鄰近當時的八塊厝機場。據地方口述，日軍曾將此處用作航空隊指揮場所，戰後才由邱家收回作祠堂。","area":"八德區・桃園市","ph":"文"},{"id":2935,"name":"桃園北區客家會館","lat":24.93436,"lng":121.26221,"cat":"culture","desc":"八德的北區客家會館，是為了連結北桃園客家族群與地方歷史而設。透過這個共同空間，居民能重新認識先民在當地生活的文化脈絡。","area":"八德區・桃園市","ph":"觀"},{"id":2936,"name":"桃園防災教育館","lat":24.93668,"lng":121.29828,"cat":"culture","desc":"桃園的防災教育場館分成五個展區，將教育、訓練與科技結合。大人和孩子都能透過互動體驗，認識防災知識與面對災害的準備。","area":"八德區・桃園市","ph":"觀"},{"id":2937,"name":"楓樹腳公園","lat":24.9347,"lng":121.29575,"cat":"nature","desc":"草原和既有樹群之間豎起長頸鹿造型遊戲塔，靈感來自居民口中的城市動物園。高滑梯與懸空爬籠延伸到空中，帶出不同的攀爬挑戰。","area":"八德區・桃園市","ph":"觀"},{"id":2938,"name":"茄苳里埤塘公園","lat":24.96557,"lng":121.27264,"cat":"nature","desc":"茄苳里的公園圍繞一片開闊埤塘，廣大的水面與岸邊綠意構成生態景觀。沿湖設有景觀步道，可用步行或騎車的速度欣賞水岸。","area":"八德區・桃園市","ph":"觀"},{"id":2939,"name":"霄裡大池(霄裡池)","lat":24.91197,"lng":121.25401,"cat":"scenic","desc":"清代霄裡社族人與漢人合作，依地形開鑿大池，匯集溪水與湧泉。這片以社名命名的水域成為霄裡大圳的水源，滋養八德一帶農田。","area":"八德區・桃園市","ph":"觀"},{"id":2940,"name":"光泉牛奶園地（大園廠）","lat":25.05532,"lng":121.16082,"cat":"other","area":"大園區・桃園市","ph":"觀"},{"id":2941,"name":"前空軍桃園基地設施群","lat":25.047405,"lng":121.24634,"cat":"history","tag":"古蹟","desc":"桃園舊空軍基地起建於二戰期間，戰後經多次增建，歷經不同國家與軍種使用。留下的設施群曾供軍機與偵察機部署，見證臺灣航空歷史。","area":"大園區・桃園市","ph":"文"},{"id":2942,"name":"圳頭里軍史公園","lat":25.09342,"lng":121.1967,"cat":"nature","desc":"大園圳頭的高架橋下，陳列多件陸海空軍退役裝備。從登陸運輸車到中正號戰鬥機，不同年代、用途的軍事文物在公園裡同場展示。","area":"大園區・桃園市","ph":"觀"},{"id":2943,"name":"大園公園","lat":25.06586,"lng":121.19392,"cat":"nature","desc":"老街溪畔的公園結合綠地、運動和兒童遊憩空間。沿路可見白千層、臺灣欒樹與黑板樹等喬木，搭配灌木呈現不同季節的風景。","area":"大園區・桃園市","ph":"觀"},{"id":2944,"name":"大園北港張家古厝","lat":25.081057,"lng":121.166484,"cat":"history","tag":"歷史建築","desc":"大園北港的農宅只在一側伸出廂房，以院落配置因應海邊的防風需求。木造門窗、牛棚、豬舍與水井，都留下近代農家生活的痕跡。","area":"大園區・桃園市","ph":"文"},{"id":2945,"name":"桃園國際機場","lat":25.07701,"lng":121.23198,"cat":"other","desc":"桃園的國際機場是臺灣國際航班主要的起降地，也匯集往來各地的旅人。航廈內有餐飲與各式休憩空間，構成出入境旅程中的一站。","area":"大園區・桃園市","ph":"觀"},{"id":2946,"name":"竹圍漁港","lat":25.11686,"lng":121.24416,"cat":"other","area":"大園區・桃園市","ph":"觀"},{"id":2947,"name":"草漯沙丘地質公園","lat":25.08023,"lng":121.16669,"cat":"nature","desc":"桃園海岸的沙丘會隨風浪慢慢改變形狀，隆起的沙脊並非固定不動。東北季風與海浪搬運沙粒，讓同一片海岸在不同日子呈現不同線條。","area":"大園區・桃園市","ph":"觀"},{"id":2948,"name":"南興落羽松（原 八德落羽松森林）","lat":24.91719,"lng":121.26243,"cat":"scenic","desc":"霄裡大池附近的落羽松林，冬天會從綠色轉成橙黃與紅色。成片樹列旁有溪水流過，天光、水色與不同深淺的葉色一同構成景致。","area":"大溪區・桃園市","ph":"觀"},{"id":2949,"name":"原住民族文化會館","lat":24.89614,"lng":121.28198,"cat":"culture","desc":"桃園原住民族文化會館，是不同族群在都市裡認識文化、聯繫原鄉的據點。館舍也是桃園城市故事館群的一部分，呈現城市多族群的面貌。","area":"大溪區・桃園市","ph":"觀"},{"id":2950,"name":"大慶洞","lat":24.88624,"lng":121.28521,"cat":"culture","desc":"大溪橋旁的舊隧道，昔日是桃園與大溪往來的狹窄通路。武嶺橋建成後，隧道逐漸失去原有功能，經整理成為大漢溪畔的散步空間。","area":"大溪區・桃園市","ph":"觀"},{"id":2951,"name":"大溪中央路148號","lat":24.88269,"lng":121.28761,"cat":"history","tag":"歷史建築","area":"大溪區・桃園市","ph":"文"},{"id":2952,"name":"大溪中央路隆泰","lat":24.880617,"lng":121.28779,"cat":"history","tag":"歷史建築","desc":"蕭家幾代在老街經營雜貨與布行，前面辦公、後面居住，店屋一路向後延伸四落。臨街的清水紅磚砌成三段圓拱，山牆兩側還有小獅。","area":"大溪區・桃園市","ph":"文"},{"id":2953,"name":"大溪中山路19號","lat":24.88166,"lng":121.286791,"cat":"history","tag":"歷史建築","desc":"這棟大溪街屋在日治時期賣酒，走廊至今保留當年存酒的木櫥櫃。外頭的紅磚三拱牌樓融合巴洛克山牆與本土吉祥紋飾，屋內仍見漢式格局。","area":"大溪區・桃園市","ph":"文"},{"id":2954,"name":"大溪中正公園","lat":24.88335,"lng":121.28471,"cat":"nature","area":"大溪區・桃園市","ph":"觀"},{"id":2955,"name":"大溪公園","lat":24.883883,"lng":121.284825,"cat":"nature","tag":"文化景觀","desc":"大漢溪河階邊緣的公園，利用崖線保留開闊的臨河視野。大溪神社遺構、公會堂與武德殿分布園中，記錄地方不同時期的公共生活。","area":"大溪區・桃園市","ph":"文"},{"id":2956,"name":"大溪公會堂","lat":24.881871,"lng":121.285151,"cat":"history","tag":"歷史建築","desc":"大溪居民昔日舉行典禮、集會的場所，是一棟日治時期的單層洋式磚造建築。戰後公會堂被納入總統行館，反映公共空間用途的轉變。","area":"大溪區・桃園市","ph":"文"},{"id":2957,"name":"大溪和平路48、48-1號","lat":24.885053,"lng":121.287785,"cat":"culture","tag":"歷史建築","desc":"大溪和平路上的兩間清末街屋，由古家在日治時期買下，曾經營雜貨與糕餅。從兩坎三落、過水相連的格局，能看出地方典型店屋的形制。","area":"大溪區・桃園市","ph":"文"},{"id":2958,"name":"大溪和平路54號","lat":24.88516,"lng":121.287603,"cat":"history","tag":"歷史建築","desc":"黃家在日治時期買下相鄰店面，曾經營豆干、油車間等生意。臨街第一進仍保有傳統商店構造，後方住家則因生活需求改建為樓房。","area":"大溪區・桃園市","ph":"文"},{"id":2959,"name":"大溪和平路Kenko","lat":24.884725,"lng":121.288592,"cat":"history","tag":"歷史建築","desc":"大溪老街這座原屬建築業者的店屋，在山牆中央留下羅馬字母店名。華麗的洗石子立面仿出石材質感，屋內承重牆則混用土埆磚與紅磚。","area":"大溪區・桃園市","ph":"文"},{"id":2960,"name":"大溪和平路協興","lat":24.884729,"lng":121.288323,"cat":"history","tag":"歷史建築","desc":"大溪老店原名恆產，先做建材與煤炭生意，後以協興之名轉為藥局。牌樓有三道圓拱，柱頭的紅磚逐層外挑，與洗石子柱身形成對照。","area":"大溪區・桃園市","ph":"文"},{"id":2961,"name":"大溪和平路廣大","lat":24.884764,"lng":121.288446,"cat":"history","tag":"歷史建築","desc":"張家店屋曾與隔壁茂發一起改建，內部換成鋼筋混凝土樓房。面街的牌樓仍可見日治時期清水磚，山牆則在後來的老街整修中重新砌築。","area":"大溪區・桃園市","ph":"文"},{"id":2962,"name":"大溪和平路李記興源","lat":24.88504,"lng":121.287567,"cat":"history","tag":"歷史建築","desc":"大溪這棟店屋後方緊鄰林本源家族的通議第，受圍牆限制，只發展到前後兩落。牌樓後來恢復山尖輪廓，兩側女兒牆以水平線收邊。","area":"大溪區・桃園市","ph":"文"},{"id":2963,"name":"大溪和平路永發","lat":24.884748,"lng":121.288498,"cat":"history","tag":"歷史建築","desc":"邱家當年請不同匠師各做一間店屋，施工時用帆布遮起，完工才一同揭幕。永發的牌樓果實、靈獸齊聚，山牆上的孔雀開屏尤其醒目。","area":"大溪區・桃園市","ph":"文"},{"id":2964,"name":"大溪和平路玉寶堂","lat":24.88462,"lng":121.288621,"cat":"worship","tag":"歷史建築","desc":"清代道光年間的店屋用土埆築牆、福杉支撐屋瓦。山牆正面以洗石子仿石材，蝙蝠、花瓶與植物紋相間，背面則是較為簡單的砌磚。","area":"大溪區・桃園市","ph":"文"},{"id":2965,"name":"大溪和平路盛源","lat":24.88472,"lng":121.28837,"cat":"history","tag":"歷史建築","desc":"大溪老街的三拱牌樓上，山頭紅色「江」字點出原屋主姓氏，下方店號則是盛源。祥禽瑞獸與花草紋樣圍著匾額，左右開間還寄寓出將入相。","area":"大溪區・桃園市","ph":"文"},{"id":2966,"name":"大溪和平路茂發","lat":24.884781,"lng":121.2884,"cat":"history","tag":"歷史建築","desc":"蘇家店屋改建時，留下老街牌樓和亭仔腳。抬頭看山尖，家徽周圍穿插西式卷草、彩帶花籃與立體螺紋短柱，兩側小山牆以凹弧呼應。","area":"大溪區・桃園市","ph":"文"},{"id":2967,"name":"大溪和平路金源","lat":24.885395,"lng":121.286957,"cat":"history","tag":"歷史建築","desc":"大溪這間傳統店屋從臨街面向後延伸三落，第二落大廳供奉神明。頭落後方另設一廳與大廳對望，因朝向相反，地方稱為「倒向廳」。","area":"大溪區・桃園市","ph":"文"},{"id":2968,"name":"大溪和平路金記同興","lat":24.885119,"lng":121.287445,"cat":"history","tag":"歷史建築","desc":"店屋緊鄰通議第圍牆，兩落之間以過水相連。圓弧山牆上的「金同興」用紅磚磨粉塑成，柱頭的洗石子則做成盛滿蓮霧的籃子。","area":"大溪區・桃園市","ph":"文"},{"id":2969,"name":"大溪和平路錦發","lat":24.885382,"lng":121.286997,"cat":"history","tag":"歷史建築","desc":"和平路的老屋還留著日治時期的圓弧山牆，兩側短柱雕有蝙蝠銜銅錢，取意「福在眼前」。騎樓圓柱採西式柱頭，與洗石子立面相襯。","area":"大溪區・桃園市","ph":"文"},{"id":2970,"name":"大溪埔頂公園","lat":24.90772,"lng":121.28065,"cat":"nature","desc":"大溪埔頂重劃區的公園有大片草地，成排林木一路向遠處延伸。高速公路穿過園地，將這片供居民散步休憩的綠地分成兩大區塊。","area":"大溪區・桃園市","ph":"觀"},{"id":2971,"name":"大溪太武新村","lat":24.903142,"lng":121.280701,"cat":"history","tag":"歷史建築","desc":"八二三砲戰後興建的軍官眷村，受美援時期居住形式影響。紅磚與鋼筋水泥築成二層四戶並列的房舍，每戶各有入口，空間也相當寬敞。","area":"大溪區・桃園市","ph":"文"},{"id":2972,"name":"大溪建成商行","lat":24.88179,"lng":121.28637,"cat":"history","tag":"歷史建築","desc":"大溪樟腦與煤礦業者簡阿牛的宅第，穹頂中央留有一個「簡」字。翼塔、雙柱與三開間門面頗具氣勢，細看裝飾還有象徵經商的算盤珠。","area":"大溪區・桃園市","ph":"文"},{"id":2973,"name":"大溪敬字亭","lat":24.890576,"lng":121.27619,"cat":"history","tag":"古蹟","desc":"大溪清代的敬字亭分成三層，內層砌磚，外層取用大漢溪的砂岩。頂層刻著「聖蹟」，中層題「敬字亭」，橫額與對聯留下敬惜文字的傳統。","area":"大溪區・桃園市","ph":"文"},{"id":2974,"name":"大溪普濟堂","lat":24.88653,"lng":121.28608,"cat":"worship","desc":"大溪的廟宇主祀關聖帝君、孚佑仙祖與九天司命，地方合稱三聖恩主。關聖帝君誕辰的慶典十分熱鬧，大溪居民也稱它為第二個過年。","area":"大溪區・桃園市","ph":"觀"},{"id":2975,"name":"大溪木藝生態博物館﹣大溪歷史館","lat":24.8809,"lng":121.2865,"cat":"culture","desc":"大溪警政宿舍群裡一排四戶的房子，因而有「四連棟」的稱呼。日治時期的官舍與戰後住戶增建的水泥房舍並存，如今成了展示地方歷史的館舍。","area":"大溪區・桃園市","ph":"觀"},{"id":2976,"name":"大溪木藝生態博物館﹣木生活館","lat":24.88173,"lng":121.28497,"cat":"culture","desc":"昔日蔣公行館的生活空間，如今開放作為大溪木藝生態博物館的館舍。這裡連結地方木藝傳統，讓技藝、藝術創作與產業有了交流場所。","area":"大溪區・桃園市","ph":"觀"},{"id":2977,"name":"大溪木藝生態博物館﹣武德殿","lat":24.88105,"lng":121.28609,"cat":"worship","desc":"日治時期各地陸續興建武德殿，供警察與青年子弟練習武道。大溪這座場館在一九三五年落成，記錄了當年柔道與劍道訓練的歷史。","area":"大溪區・桃園市","ph":"觀"},{"id":2978,"name":"大溪木藝生態博物館﹣鳳飛飛故事館","lat":24.87992,"lng":121.28714,"cat":"culture","desc":"今日的故事館，日治時期是大溪郡役所警察課長的官舍。當時大溪郡轄區延伸到今日復興與尖石山區，警察課也掌理與山地部落的關係。","area":"大溪區・桃園市","ph":"觀"},{"id":2979,"name":"大溪李金興公店","lat":24.88134,"lng":121.28763,"cat":"history","tag":"歷史建築","desc":"大溪月眉李家以金興為商號，在上街留下公店。清代店屋已拆除，今天仍留在原地使用的騎樓與牌樓，則是日治時期市區改正後的面貌。","area":"大溪區・桃園市","ph":"文"},{"id":2980,"name":"大溪林宅梅鶴山莊","lat":24.839086,"lng":121.285055,"cat":"history","tag":"歷史建築","desc":"林登雲用古人「梅妻鶴子」的典故為宅第命名，林家公媽廳吉慶堂位在中央。右側護龍比左側長，昔日曬穀的寬闊前埕仍勾勒出大宅規模。","area":"大溪區・桃園市","ph":"文"},{"id":2981,"name":"大溪橋","lat":24.88482,"lng":121.2839,"cat":"other","desc":"中正公園下方的大橋橫跨大漢溪，橋身呼應大溪老街的巴洛克風格。走上橋可以俯看河岸，夜間纜索亮起線燈，又是另一種溪畔景色。","area":"大溪區・桃園市","ph":"觀"},{"id":2982,"name":"大溪武德殿","lat":24.881058,"lng":121.286222,"cat":"worship","tag":"歷史建築","desc":"日治時期警察必須修習武道，各地因此設有武德殿。大溪這座郡市等級的場館在一九三五年落成，是當年以警察系統推廣武道的歷史見證。","area":"大溪區・桃園市","ph":"文"},{"id":2983,"name":"大溪河濱公園","lat":24.89327,"lng":121.28363,"cat":"nature","desc":"大溪橋對岸的河濱公園，沿大漢溪左岸展開大片綠地。除了孩子使用的遊樂設施，也有讓人散步、歇腳的草地，能從河岸回望小鎮。","area":"大溪區・桃園市","ph":"觀"},{"id":2984,"name":"大溪石板古道","lat":24.886333,"lng":121.285611,"cat":"history","tag":"歷史建築","desc":"清代挑夫在大漢溪碼頭卸下貨物後，沿著這條石板路往返大溪街上。整條古道都以石板鋪設，又被稱為碼頭古道，留下河運興盛時的痕跡。","area":"大溪區・桃園市","ph":"文"},{"id":2985,"name":"大溪簡氏古厝","lat":24.845444,"lng":121.275845,"cat":"history","tag":"歷史建築","desc":"福建南靖簡家遷到大溪內柵庄，留下以卵石打基礎、土埆磚砌牆的三合院。宅院幾度整修，從清代到戰後的材料都可在建築上找到。","area":"大溪區・桃園市","ph":"文"},{"id":2986,"name":"大溪簡送德古宅","lat":24.854743,"lng":121.280934,"cat":"history","tag":"古蹟","desc":"經營商行與農地的地方仕紳簡送德，選在大溪安家立業。他自福建延請匠師，歷經數年完成宅院，並為這座家宅取名「永安居」。","area":"大溪區・桃園市","ph":"文"},{"id":2987,"name":"大溪落羽松公園","lat":24.8725,"lng":121.25518,"cat":"nature","desc":"大溪公園以水圳、樟樹林和客家文化安排不同空間。入口介紹落羽松與舊地名的由來，園內也有客家、原住民族意象廣場和樟樹瞭望臺。","area":"大溪區・桃園市","ph":"觀"},{"id":2988,"name":"大溪蓮座山觀音寺","lat":24.872122,"lng":121.280822,"cat":"worship","tag":"古蹟","desc":"大漢溪畔的觀音寺在清代嘉慶年間建立，主祀觀音佛祖。循百步雲梯上山，寺前老榕枝葉開展，能俯看蜿蜒河階與遠方層疊山巒。","area":"大溪區・桃園市","ph":"文"},{"id":2989,"name":"大溪蘭室","lat":24.881632,"lng":121.287012,"cat":"history","tag":"歷史建築","desc":"地方仕紳呂鷹揚的宅第，將閩南格局和西洋式紅白橫帶牌樓結合。正中雕一隻鷹，左右各題「呂」字，把屋主姓名巧妙放進立面。","area":"大溪區・桃園市","ph":"文"},{"id":2990,"name":"大溪農會倉庫","lat":24.880847,"lng":121.286834,"cat":"history","tag":"歷史建築","desc":"戰時貯存稻米的倉庫，有大跨度木屋架與帶防潮層的磚牆，牆面上下留通氣窗。舊倉後來成為大溪木藝生態博物館的社頭文化館。","area":"大溪區・桃園市","ph":"文"},{"id":2991,"name":"大溪郡役所舊構及留置場","lat":24.88015,"lng":121.28685,"cat":"history","tag":"歷史建築","desc":"大溪郡役所殘存的清水磚牆，原是警察課辦公室的一部分，戰後繼續作警務使用。旁邊留置場設四間扇形拘留室，仍可辨認西式木屋架。","area":"大溪區・桃園市","ph":"文"},{"id":2992,"name":"大溪陵寢","lat":24.848446,"lng":121.286033,"cat":"history","tag":"歷史建築","desc":"原名頭寮賓館的建築曾存放總統府檔案，蔣經國逝世後奉厝於此。紅瓦黑牆圍成四合院式空間，中庭方柱迴廊旁種有梅樹與龍柏。","area":"大溪區・桃園市","ph":"文"},{"id":2993,"name":"大溪齋明寺","lat":24.888962,"lng":121.27435,"cat":"worship","tag":"古蹟","desc":"主祀觀音菩薩的禪寺，前身是龍華派齋堂福份宮。雙重牆欄隔開寺前空間，入口成對門柱上題著與法音、禪機有關的對句。","area":"大溪區・桃園市","ph":"文"},{"id":2994,"name":"後慈湖","lat":24.84527,"lng":121.30239,"cat":"other","area":"大溪區・桃園市","ph":"觀"},{"id":2995,"name":"慈湖紀念雕塑公園","lat":24.84156,"lng":121.2937,"cat":"nature","desc":"大溪慈湖的雕塑公園，集合由臺灣各地捐來的蔣中正銅像。原先分布在不同地方的紀念雕像集中陳列，成為認識相關歷史的一處空間。","area":"大溪區・桃園市","ph":"觀"},{"id":2996,"name":"慈湖遊客中心","lat":24.84037,"lng":121.29427,"cat":"scenic","desc":"慈湖陵寢旁的遊客中心採閩南式建築，館內展出蔣中正與蔣經國時期的文物。歷史影片和現場解說，提供認識兩蔣與慈湖的背景。","area":"大溪區・桃園市","ph":"觀"},{"id":2997,"name":"慈湖陵寢","lat":24.841972,"lng":121.299228,"cat":"history","tag":"歷史建築","desc":"原名洞口賓館的總統行館，在蔣中正逝世、靈柩奉厝後改稱慈湖陵寢。依山傍水的紅瓦磚造平房採四合院形式，圓洞門通往兩側庭院。","area":"大溪區・桃園市","ph":"文"},{"id":2998,"name":"新南老街","lat":24.88174,"lng":121.28656,"cat":"structure","desc":"大溪舊城裡的新南老街，老巷保有安靜的藝文氣息。漫步街間，可以從與和平老街不同的步調，感受大嵙崁留下來的另一種市街風貌。","area":"大溪區・桃園市","ph":"觀"},{"id":2999,"name":"月眉通路","lat":24.884937,"lng":121.287981,"cat":"history","tag":"歷史建築","desc":"清末到日治時期，這條古道連結大溪老街與盛產稻米的月眉。李騰芳家族在月眉經營米穀，利用河運發展商號，古道也隨家業開闢。","area":"大溪區・桃園市","ph":"文"},{"id":3000,"name":"李騰芳古宅","lat":24.890772,"lng":121.295679,"cat":"history","tag":"古蹟","desc":"大溪月眉李家以米業起家，李騰芳考取功名後，宅院留下不少書畫裝飾。兩落四護龍圍出中庭，門廳與正廳的大木雕刻尤其細緻。","area":"大溪區・桃園市","ph":"文"},{"id":3001,"name":"桃園三層地區陂圳系統","lat":24.84608,"lng":121.31853,"cat":"history","tag":"文化景觀","desc":"大溪三層圳順著地形，串連白石陂、龍過脈陂、慈湖與牛角湳陂。池塘間的涵管調控水量，讓上游蓄水能穩定灌溉下游稻田。","area":"大溪區・桃園市","ph":"文"},{"id":3002,"name":"福仁宮","lat":24.88587,"lng":121.28656,"cat":"worship","desc":"和平老街盡頭的大廟，緣起於大溪漳州移民奉祀開漳聖王的習俗。清代李炳生等人集資建廟，讓居民逢年過節可以就近祭拜。","area":"大溪區・桃園市","ph":"觀"},{"id":3003,"name":"經國紀念館﹙北橫遊客中心﹚","lat":24.8493,"lng":121.28539,"cat":"culture","desc":"北橫入口的遊客中心，也保存介紹蔣經國與這段山區歷史的文物。透過館內展示及互動設備，能從人物經歷認識北橫發展的背景。","area":"大溪區・桃園市","ph":"觀"},{"id":3004,"name":"舊百吉隧道","lat":24.83544,"lng":121.30218,"cat":"other","area":"大溪區・桃園市","ph":"觀"},{"id":3005,"name":"迷宮巷-鳳飛飛故居","lat":24.88584,"lng":121.28682,"cat":"worship","desc":"大溪福仁宮旁的「後尾仔」有一片狹窄曲折的巷弄，歌手鳳飛飛的故居就在其中。沿土埆厝與石板牆轉彎，便從老街的喧鬧步入居民生活的巷道。","area":"大溪區・桃園市","ph":"觀"},{"id":3006,"name":"阿姆坪薑母島","lat":24.81469,"lng":121.30391,"cat":"scenic","desc":"阿姆坪碼頭對岸的枕頭山，因偶像劇《命中注定我愛你》取景而有薑母島之名。從湖上望去可見石門水庫山水，島上還有居民奉祀的老土地公。","area":"大溪區・桃園市","ph":"觀"},{"id":3007,"name":"頭寮大池賞鳥","lat":24.83684,"lng":121.28302,"cat":"scenic","desc":"頭寮的人工埤塘分成大小兩池，早年供應灌溉，也有農民利用池水養魚。寬廣水域維持了適合鳥類聚集的環境，成為當地觀鳥的地方。","area":"大溪區・桃園市","ph":"觀"},{"id":3008,"name":"1895乙未保台紀念公園","lat":24.94827,"lng":121.20551,"cat":"nature","desc":"桃園這座紀念公園以乙未戰役為主題，將地方歷史放進當代公園設計。人們在自然景觀間散步，也能接觸這段戰役留下的歷史記憶。","area":"平鎮區・桃園市","ph":"觀"},{"id":3009,"name":"平鎮千頃第","lat":24.91979,"lng":121.19603,"cat":"history","tag":"歷史建築","desc":"平鎮黃家從興建正身開始，陸續添建左右橫屋與門樓。原先坐東朝西的合院，透過門樓調整入口方向，面向八角塘與綠水溪一帶。","area":"平鎮區・桃園市","ph":"文"},{"id":3010,"name":"平鎮褒忠祠(義民廟)","lat":24.94739,"lng":121.205,"cat":"worship","desc":"平鎮居民於清代乾隆年間建義民亭，主要奉祀義民爺。後來地方人士募款擴建，改名褒忠祠，歷次修整才逐漸形成今天的規模。","area":"平鎮區・桃園市","ph":"觀"},{"id":3011,"name":"忠貞新村文化園區","lat":24.92764,"lng":121.25432,"cat":"culture","desc":"忠貞新村是從滇緬邊區撤來臺灣的軍人與家屬重新安家的地方。文化園區留下這段從金三角到桃園的遷徙記憶，連起戰地生活與眷村日常。","area":"平鎮區・桃園市","ph":"觀"},{"id":3012,"name":"新勢公園","lat":24.95186,"lng":121.21671,"cat":"nature","desc":"平鎮這座公園的開闊綠地上，分布著彩色兒童遊戲場與極限運動區。園內也將水資源循環設為戶外學習主題，讓遊戲與環境教育並存。","area":"平鎮區・桃園市","ph":"觀"},{"id":3013,"name":"鑊篤陂塘生態公園","lat":24.9082,"lng":121.20254,"cat":"nature","desc":"平鎮的這處陂塘早年曾供居民釣魚，後來規劃成環湖生態公園。竹林圍著一池平靜水面，留下水利設施轉作休憩空間的地方風景。","area":"平鎮區・桃園市","ph":"觀"},{"id":3014,"name":"雲南文化公園","lat":24.92872,"lng":121.25506,"cat":"nature","desc":"桃園這座主題公園以雲南文化為核心，保存滇緬邊區部隊遷臺後的地方記憶。當年落腳此地的軍民，也帶來家鄉的飲食與生活習慣。","area":"平鎮區・桃園市","ph":"觀"},{"id":3015,"name":"Sqiy(志繼)自力更生之碑","lat":24.82236,"lng":121.38158,"cat":"history","tag":"歷史建築","desc":"志繼部落以砂岩雕成紀念碑，記錄當年開鑿水圳的工程。石面陰刻「自力更生之碑」，側邊還留著日治時期大溪郡警察課長的題名。","area":"復興區・桃園市","ph":"文"},{"id":3016,"name":"三民蝙蝠洞","lat":24.8381,"lng":121.3503,"cat":"other","desc":"三民里北側溪谷中，天然岩洞的洞口上方有泉水灑落，因而有水濂洞之稱。昔日許多蝙蝠在粗獷的岩洞內棲息，也給了洞穴現在的名字。","area":"復興區・桃園市","ph":"觀"},{"id":3017,"name":"三龜戲水","lat":24.68328,"lng":121.39279,"cat":"scenic","desc":"玉峰溪與三光溪在巴陵匯成大漢溪，河水在山間數度迴繞。從高處回望，水流沖蝕出的山脊像三隻烏龜伸頭入水，成了這幅景致的名字。","area":"復興區・桃園市","ph":"觀"},{"id":3018,"name":"佐久間總督追懷紀念碑台基","lat":24.813474,"lng":121.351094,"cat":"history","tag":"歷史建築","desc":"角板山公園內的石造臺基，曾承托紀念日治時期總督佐久間左馬太的碑體。戰後碑身拆除、原地改建復興亭，周圍階梯、矮牆和排水溝仍存。","area":"復興區・桃園市","ph":"文"},{"id":3019,"name":"優霞雲瀑布、嘎嘎生態池","lat":24.81385,"lng":121.38476,"cat":"scenic","desc":"霞雲里的瀑布與生態池，連著泰雅耆老傳下的池塘故事。藍綠水色、池中水草與出沒其間的鳥獸，也讓這片水域在地方傳說中多了神祕色彩。","area":"復興區・桃園市","ph":"觀"},{"id":3020,"name":"北橫三橋（羅浮橋、復興橋、巴陵橋）","lat":24.80037,"lng":121.36692,"cat":"other","desc":"北橫沿大漢溪谷而行，羅浮橋、復興橋與巴陵橋分別跨越山谷。羅浮橋以鮮紅色橋身搭配拱形橋墩，在群山之間特別容易辨認。","area":"復興區・桃園市","ph":"觀"},{"id":3021,"name":"基國派教堂","lat":24.840151,"lng":121.347644,"cat":"worship","tag":"歷史建築","desc":"復興基國派部落的教堂以石塊逐層砌成，立面上方的弧線象徵雲端。入口前方再設一面小山牆，圓洞狀的大門讓石造教堂更有辨識度。","area":"復興區・桃園市","ph":"文"},{"id":3022,"name":"大漢橋","lat":24.67473,"lng":121.40457,"cat":"scenic","area":"復興區・桃園市","ph":"觀"},{"id":3023,"name":"小烏來天空繩橋","lat":24.79033,"lng":121.37548,"cat":"scenic","desc":"北橫沿線的小烏來風景區裡，天空繩橋為山區增添一處親近自然的空間。周邊還有瀑布、水岸與透明空中步道，呈現不同角度的山林景觀。","area":"復興區・桃園市","ph":"觀"},{"id":3024,"name":"巴陵橋_巴陵大橋_巴陵舊橋","lat":24.68107,"lng":121.37798,"cat":"other","desc":"一抹淡粉色鋼橋跨過大漢溪，在大片青綠山林中標出巴陵的位置。橋長約二百二十公尺，大跨度的鋼骨結構成了北橫沿線的地標。","area":"復興區・桃園市","ph":"觀"},{"id":3025,"name":"復興巴壟橋紀念柱","lat":24.68183,"lng":121.37795,"cat":"history","tag":"歷史建築","desc":"巴陵一號隧道口旁立著高約八公尺的紀念柱，記錄日治時期鐵線橋的興建。柱面一側刻著日文橋名，另一側留有土木局與完工年月。","area":"復興區・桃園市","ph":"文"},{"id":3026,"name":"復興巴陵橋暨巴陵一、二號隧道","lat":24.680959,"lng":121.377924,"cat":"history","tag":"歷史建築","desc":"巴陵舊橋與兩側隧道跨越大漢溪谷，是北橫早期工程留下的設施。橋體採單孔吊橋形式，以電焊鋼梁加勁，與復興橋同屬當時採用的新工法。","area":"復興區・桃園市","ph":"文"},{"id":3027,"name":"拉拉山生態教育館","lat":24.710997,"lng":121.433198,"cat":"culture","desc":"拉拉山森林步道起點的教育館，緊鄰紅檜純林。從館旁走入環形步道，沿途設置巨木解說牌，可以逐株認識森林裡的大樹。","area":"復興區・桃園市","ph":"觀"},{"id":3028,"name":"新竹林區管理處大溪工作站復興分站招待所","lat":24.814113,"lng":121.351429,"cat":"history","tag":"歷史建築","desc":"角板山的林業招待所，前身與日治時期的樟腦專賣事業有關。室內多用臺灣檜木，簡潔的空間格局及木梁柱保有原貌。","area":"復興區・桃園市","ph":"文"},{"id":3029,"name":"東眼山自然教育中心","lat":24.825018,"lng":121.417558,"cat":"scenic","desc":"雪山山脈西稜的柳杉林中，教育中心以真實森林環境作為學習場域。東眼山的輪廓像躺臥的側臉，日出恰從眼窩位置升起，便有了山名。","area":"復興區・桃園市","ph":"觀"},{"id":3030,"name":"樂信瓦旦紀念公園","lat":24.79178,"lng":121.36396,"cat":"nature","desc":"羅馬公路旁的紀念公園，用入口照片牆介紹樂信．瓦旦的事蹟。登上木造眺望臺，可隨季節看見盛開的櫻花或成熟時呈金黃色的小米。","area":"復興區・桃園市","ph":"觀"},{"id":3031,"name":"泰雅故事公園","lat":24.79249,"lng":121.36619,"cat":"nature","area":"復興區・桃園市","ph":"觀"},{"id":3032,"name":"溪口台地","lat":24.8092,"lng":121.34658,"cat":"scenic","desc":"大漢溪在角板山南面轉彎，圈出分成四層的三角形河階地。上兩層闢為梯田，下兩層是草坪，從角板山高處可以看清整片地形。","area":"復興區・桃園市","ph":"觀"},{"id":3033,"name":"溪口吊橋","lat":24.810275,"lng":121.348374,"cat":"history","tag":"歷史建築","desc":"石門水庫上游的吊橋跨過大漢溪，連接角板山與溪口部落。舊橋以長木片鋪成狹窄橋面，曾是部落居民往來河谷兩岸的主要通道。","area":"復興區・桃園市","ph":"文"},{"id":3034,"name":"溪口吊橋遺構","lat":24.811693,"lng":121.345818,"cat":"history","tag":"歷史建築","desc":"第一代溪口鐵線橋曾橫跨大漢溪，是角板山與溪口臺地間的重要聯絡。橋身在颱風中沖毀後，兩端留存的基座仍記錄日治時期的橋梁工程。","area":"復興區・桃園市","ph":"文"},{"id":3035,"name":"爺亨梯田","lat":24.67529,"lng":121.37287,"cat":"scenic","desc":"巴陵西南側的爺亨，以山坡梯田和溫泉聞名。從對岸三光一帶回望，層層田埂沿地形起伏，連成北橫山谷裡鮮明的耕作線條。","area":"復興區・桃園市","ph":"觀"},{"id":3036,"name":"綠光森林","lat":24.81742,"lng":121.37498,"cat":"other","desc":"復興往東眼山的路上，海拔約七百公尺處有一片山林景觀。從這個高度向遠處望去，能同時欣賞南插天山與北插天山的山勢。","area":"復興區・桃園市","ph":"觀"},{"id":3037,"name":"義興吊橋","lat":24.79031,"lng":121.36683,"cat":"other","desc":"羅浮部落附近的吊橋，讓來客沿著獵人走過的地方認識山林。周邊的自然景觀與部落文化，也連起人們對彩虹橋與永恆獵場的想像。","area":"復興區・桃園市","ph":"觀"},{"id":3038,"name":"角板山薰風閣","lat":24.813263,"lng":121.350584,"cat":"history","tag":"歷史建築","desc":"日治時期的角板山是進入山區的重要中繼點，日本官員與軍隊常在此留宿。薰風閣的出現，和當時鋪設軌道、加強山地行政管制的歷史相連。","area":"復興區・桃園市","ph":"文"},{"id":3039,"name":"角板山賓館","lat":24.816218,"lng":121.348919,"cat":"culture","tag":"歷史建築","desc":"大漢溪在角板山前急轉，對岸留下層層三角形河階。蔣中正因這片山水想起浙江奉化故鄉，在山上建造賓館，並將對岸命名為溪口臺地。","area":"復興區・桃園市","ph":"文"},{"id":3040,"name":"赫威神木群","lat":24.79036,"lng":121.43755,"cat":"scenic","area":"復興區・桃園市","ph":"觀"},{"id":3041,"name":"太平洋自行車博物館","lat":24.98586,"lng":121.03231,"cat":"culture","area":"新屋區・桃園市","ph":"觀"},{"id":3042,"name":"後湖溪生態園區","lat":24.9952,"lng":121.02041,"cat":"culture","desc":"永安漁港北側的後湖溪，昔日是灌溉河道，半封閉水域較少受季風與潮汐擾動。平靜河面兩側有紅樹林，水筆仔與海茄苳在泥岸生長。","area":"新屋區・桃園市","ph":"觀"},{"id":3043,"name":"新屋濱海植物園","lat":24.98159,"lng":121.01731,"cat":"nature","area":"新屋區・桃園市","ph":"觀"},{"id":3044,"name":"新屋百年石滬群","lat":24.94824,"lng":120.98951,"cat":"scenic","area":"新屋區・桃園市","ph":"觀"},{"id":3045,"name":"新屋石滬故事館","lat":24.95115,"lng":120.99603,"cat":"culture","area":"新屋區・桃園市","ph":"觀"},{"id":3046,"name":"新屋綠色走廊","lat":24.96945,"lng":121.01234,"cat":"other","area":"新屋區・桃園市","ph":"觀"},{"id":3047,"name":"新屋范姜祖堂","lat":24.976206,"lng":121.104302,"cat":"worship","tag":"古蹟","desc":"新屋范姜家族的雙姓，連著范家子弟受姜家扶養、感念恩情的故事。祖堂成了後代尋根之處，也保留同一家族如何並承兩姓的記憶。","area":"新屋區・桃園市","ph":"文"},{"id":3048,"name":"新屋范姜老屋(新屋區中正路110巷3號)","lat":24.9746,"lng":121.10401,"cat":"structure","tag":"古蹟","desc":"范姜家的三號老屋以卵石作基、深紅磚砌牆，中庭與走廊鋪青石板。門上黃色交趾陶拼出「陶渭流芳」，抬頭還可看見簷下的人物塑像。","area":"新屋區・桃園市","ph":"文"},{"id":3049,"name":"新屋范姜老屋(新屋區中正路110巷6號)","lat":24.97513,"lng":121.10415,"cat":"structure","tag":"古蹟","desc":"新屋范姜家的六號宅院，用尺磚牆身與卵石牆座呈現樸素外觀。窗上書卷形浮雕題著「松茂」「竹苞」，外牆的鏤空處還鑲有綠釉花瓶。","area":"新屋區・桃園市","ph":"文"},{"id":3050,"name":"新屋范姜老屋（新屋區中正路110巷2號）","lat":24.974326,"lng":121.103941,"cat":"structure","tag":"古蹟","desc":"范姜家二號老屋的前堂題著「陶渭傳芳」，一堂三橫屋圍出宅院。院中供奉孔子，入口以卵石、條石打基，土埆灰牆留住客家家宅的質地。","area":"新屋區・桃園市","ph":"文"},{"id":3051,"name":"新屋葉芳題老屋","lat":24.99886,"lng":121.03035,"cat":"history","tag":"古蹟","desc":"新屋葉家後人葉芳題興建的家宅，從一堂二橫陸續擴充為一堂四橫。卵石牆基、屋簷雙鯉落水口與堂前獅子泥塑，都是看得見的匠藝。","area":"新屋區・桃園市","ph":"文"},{"id":3052,"name":"新屋蚵間石滬群","lat":24.9468,"lng":120.988812,"cat":"history","tag":"文化景觀","desc":"新屋蚵間的石滬群，依海岸地形用一顆顆卵石堆砌而成。漁民利用潮水進退捕魚，留下至今仍承載傳統漁業知識的海岸地景。","area":"新屋區・桃園市","ph":"文"},{"id":3053,"name":"新屋農博環境教育園區","lat":25.00571,"lng":121.04772,"cat":"culture","desc":"桃園農業博覽會的會場，展期結束後轉作環境教育園區。太陽能板建築、裝置藝術與生態池分布在公共空間，讓人從散步中認識環境議題。","area":"新屋區・桃園市","ph":"觀"},{"id":3054,"name":"新屋農會倉庫","lat":24.97218,"lng":121.10801,"cat":"history","tag":"歷史建築","desc":"新屋農會保留下來的舊倉庫群，是日治時期北臺灣的穀倉建築。除了結構、座向與外形值得留意，屋內還保存少見的大型木造碾米機。","area":"新屋區・桃園市","ph":"文"},{"id":3055,"name":"桃園：太平洋自行車博物館","lat":24.986481,"lng":121.029649,"cat":"culture","desc":"由臺灣自行車製造廠成立的博物館，從設計、組裝與手工製車認識自行車。品牌長年開發折疊車，也藉展館把騎乘文化帶給更多人。","area":"新屋區・桃園市","ph":"觀"},{"id":3056,"name":"永安海螺文化體驗園區","lat":24.98977,"lng":121.01549,"cat":"culture","desc":"永安海邊的文化體驗園區，以海螺為建築造形的靈感。原本出現在海岸的自然形態，在這裡化成一座能從外觀辨識的建築。","area":"新屋區・桃園市","ph":"觀"},{"id":3057,"name":"永安漁港","lat":24.98773,"lng":121.01578,"cat":"other","area":"新屋區・桃園市","ph":"觀"},{"id":3058,"name":"海洋客家牽罟文化館","lat":24.97608,"lng":121.01578,"cat":"culture","area":"新屋區・桃園市","ph":"觀"},{"id":3059,"name":"范姜老屋群","lat":24.97619,"lng":121.10444,"cat":"history","area":"新屋區・桃園市","ph":"觀"},{"id":3060,"name":"藻礁生態環境教室","lat":25.01629,"lng":121.03677,"cat":"scenic","desc":"桃園新屋這處環境教室，專門把藻礁當作認識生態的主題。以藻礁為主角的教育場館，在臺灣並不多見。","area":"新屋區・桃園市","ph":"觀"},{"id":3061,"name":"國際土地政策研究訓練中心","lat":24.991987,"lng":121.297759,"cat":"history","tag":"歷史建築","desc":"臺灣與美國的土地政策機構合作創辦訓練所，將戰後土地改革經驗帶入國際交流。中心建築以半圓薄殼屋頂為特色，呈現現代主義風格。","area":"桃園區・桃園市","ph":"文"},{"id":3062,"name":"土地改革陳列館","lat":24.991809,"lng":121.298513,"cat":"culture","tag":"歷史建築","desc":"桃園這處展示土地改革的館舍，坐落在戰後由陂塘填土開闢的土地上。旁邊的國際土地政策研究訓練中心與它同採現代建築形式。","area":"桃園區・桃園市","ph":"文"},{"id":3063,"name":"奧爾森林學堂","lat":25.00185,"lng":121.32756,"cat":"worship","area":"桃園區・桃園市","ph":"觀"},{"id":3064,"name":"孔廟","lat":25.00099,"lng":121.32762,"cat":"worship","desc":"虎頭山上的孔廟由地方人士倡建，是桃園舉行祭孔的場所。廟中設有孔子立姿神像，讓來訪者能從具體雕像認識儒家祭祀的特色。","area":"桃園區・桃園市","ph":"觀"},{"id":3065,"name":"彩韻廣場","lat":25.00279,"lng":121.28695,"cat":"nature","desc":"桃園市政中心入口的圓環廣場，以水瀑和夜間投光營造迎賓景致。水舞緞裝置像人張開雙臂，柔軟緞帶的造形呼應廣場的開放空間。","area":"桃園區・桃園市","ph":"觀"},{"id":3066,"name":"新民老街","lat":24.99409,"lng":121.31151,"cat":"culture","desc":"大廟商圈裡這條不到三百公尺的街道，曾有「桃園第一街」之稱。商業重心移轉後，老街步調慢了下來，街頭還能看見店家間的日常往來。","area":"桃園區・桃園市","ph":"觀"},{"id":3067,"name":"桃園1-4號生態埤塘","lat":24.97999,"lng":121.28955,"cat":"scenic","desc":"這處桃園埤塘在保留原有功能之外，增設了供人親水的空間。沿環池步道與木棧道散步，可以從原木平臺、景觀涼亭觀察池水與生態。","area":"桃園區・桃園市","ph":"觀"},{"id":3068,"name":"桃園77藝文町","lat":24.99172,"lng":121.3115,"cat":"culture","desc":"桃園車站前商圈裡的日式建築群，原為警察宿舍。修復後，老宿舍改作藝文與創意活動的園區，讓舊城生活空間有了新的公共用途。","area":"桃園區・桃園市","ph":"觀"},{"id":3069,"name":"桃園光影文化館(光影二館)","lat":24.99918,"lng":121.30752,"cat":"culture","desc":"埔新路上的電影文化館坐落在桃園舊市區，周邊有老廟、學校與果菜市場。場館將街市文化融入藝術、懷舊與親子等電影主題。","area":"桃園區・桃園市","ph":"觀"},{"id":3070,"name":"桃園大廟口派出所","lat":24.995149,"lng":121.311038,"cat":"worship","tag":"歷史建築","desc":"日治時期桃園大廟口的兩層樓建築，一樓是派出所，二樓是保甲聯合會議所。兩種機構共用一棟房舍，反映保甲制度與警察行政的連結。","area":"桃園區・桃園市","ph":"文"},{"id":3071,"name":"桃園大樹林橋","lat":24.988062,"lng":121.317388,"cat":"history","tag":"歷史建築","desc":"日治時期興建的鋼筋混凝土橋，跨過曾是桃園古城東界的東門溪。橋隨當地大樹林地名命名，早年是連接桃園與鶯歌的一段道路。","area":"桃園區・桃園市","ph":"文"},{"id":3072,"name":"桃園市土地公文化館","lat":24.99819,"lng":121.32125,"cat":"worship","area":"桃園區・桃園市","ph":"觀"},{"id":3073,"name":"桃園忠烈祠","lat":25.006054,"lng":121.324996,"cat":"worship","tag":"古蹟","desc":"虎頭山麓的建築群原是日治時期神社，二戰後改作忠烈祠。從神社轉換祭祀用途的同時，也保留原有建築配置，是觀察這段歷史的場所。","area":"桃園區・桃園市","ph":"文"},{"id":3074,"name":"桃園慈護宮","lat":24.98882,"lng":121.3067,"cat":"worship","desc":"位在桃園市中心的廟宇，是居民往來祭拜的地方。殿內香煙與街區日常相鄰，讓人從這處信仰中心看到傳統祭祀融入城市生活的樣貌。","area":"桃園區・桃園市","ph":"觀"},{"id":3075,"name":"桃園景福宮","lat":24.994665,"lng":121.311036,"cat":"worship","tag":"古蹟","desc":"桃園人稱為大廟的聖王廟，坐落在市中心，面寬九開間。穿過四柱三間的牌樓，寬廣前埕通向三川殿，廟身則是兩進兩廊的四合院格局。","area":"桃園區・桃園市","ph":"文"},{"id":3076,"name":"桃園楊氏家廟","lat":24.99438,"lng":121.31196,"cat":"worship","tag":"歷史建築","desc":"桃園中南街的老屋，清代曾由徐家買下作出租之用。日治時期房舍歸入楊六使公祭祀公業，見證市街店屋與家族祭祀空間之間的轉變。","area":"桃園區・桃園市","ph":"文"},{"id":3077,"name":"桃園武陵橋","lat":24.990137,"lng":121.316214,"cat":"history","tag":"歷史建築","desc":"東門溪上最初有清代鐵路興建的桃仔園坑橋，鐵路改線後轉供公路使用。後來建成的武陵橋，成為縱貫道從龜山進入桃園的一段。","area":"桃園區・桃園市","ph":"文"},{"id":3078,"name":"桃園無線受信所","lat":25.010095,"lng":121.288836,"cat":"history","tag":"古蹟","desc":"桃園臺地地勢開闊，日治時期被選作無線電和電信設施的基地。這座受信所的沿革，與當年海上通信網擴張及航空事業發展相連。","area":"桃園區・桃園市","ph":"文"},{"id":3079,"name":"桃園藝文廣場","lat":25.0175,"lng":121.29998,"cat":"nature","desc":"桃園中正路繁忙商圈旁，大片綠地和寬闊步道形成一座藝文廣場。草地上常有人玩飛盤，步道則是居民慢跑、享受戶外空間的地方。","area":"桃園區・桃園市","ph":"觀"},{"id":3080,"name":"桃園車站舊倉庫","lat":24.989943,"lng":121.31576,"cat":"history","tag":"歷史建築","desc":"桃園鐵路周邊的農業倉庫，在日治時期增設了肥料配合所倉庫。當年的配合所還包括工廠與通運倉庫，呈現鐵路、農業加工和儲運的關係。","area":"桃園區・桃園市","ph":"文"},{"id":3081,"name":"桃園軌道願景館","lat":24.98994,"lng":121.31553,"cat":"culture","desc":"日治時期的鐵道倉庫，經修復後成為介紹桃園軌道發展的展館。和洋折衷的老建築內，展示鐵路地下化與捷運系統的規劃構想。","area":"桃園區・桃園市","ph":"觀"},{"id":3082,"name":"桃園郡米榖統制組合倉庫","lat":24.995872,"lng":121.307605,"cat":"history","tag":"歷史建築","desc":"日治時期為管控米穀流通，新竹州在各郡組設米穀統制組合。桃園這座倉庫便是當年產業設施的遺存，可從中認識戰時稻米管理。","area":"桃園區・桃園市","ph":"文"},{"id":3083,"name":"米倉劇場","lat":24.99563,"lng":121.30774,"cat":"culture","desc":"日治時期的米穀統制組合在桃園建造倉庫，用以就地儲藏產區的餘米。今天的米倉劇場沿用這座舊設施，也留下稻米曾受統制的產業記憶。","area":"桃園區・桃園市","ph":"觀"},{"id":3084,"name":"舊桃園縣警察局桃園分局","lat":24.990036,"lng":121.312114,"cat":"history","tag":"歷史建築","desc":"戰後桃園分局最初沿用東本願寺房舍，之後才陸續興建辦公廳舍。現存老分局留下早期警察建築的標準樣式，也曾與武陵派出所共用。","area":"桃園區・桃園市","ph":"文"},{"id":3085,"name":"虎頭山公園","lat":25.00167,"lng":121.3343,"cat":"nature","area":"桃園區・桃園市","ph":"觀"},{"id":3086,"name":"虎頭山環保公園","lat":25.01204,"lng":121.32837,"cat":"nature","area":"桃園區・桃園市","ph":"觀"},{"id":3087,"name":"土牛溝楊梅段","lat":24.920558,"lng":121.172621,"cat":"history","tag":"文化景觀","desc":"清代官府為劃分漢人開墾與原住民族活動範圍，從立碑劃界逐漸改以挖溝為界。挖出的泥土堆在溝邊，形狀像牛，遂有土牛溝之名。","area":"楊梅區・桃園市","ph":"文"},{"id":3088,"name":"富岡老街","lat":24.93642,"lng":121.08227,"cat":"structure","desc":"富岡舊稱伯公岡，日治時期設站後帶來攤商與人潮，農業小鎮隨之發展。車站旁的中正路老街，就是當時最早形成的商業街區。","area":"楊梅區・桃園市","ph":"觀"},{"id":3089,"name":"楊梅故事園區","lat":24.9051,"lng":121.14557,"cat":"culture","area":"楊梅區・桃園市","ph":"觀"},{"id":3090,"name":"楊梅江夏堂","lat":24.897781,"lng":121.148884,"cat":"worship","tag":"歷史建築","desc":"楊梅燕子窩的黃家祠堂，屬於祖籍廣東嘉應州的黃氏族人。地方特別稱它「燕子窩江夏堂」，與附近泉水窩另一座同名祠堂相區分。","area":"楊梅區・桃園市","ph":"文"},{"id":3091,"name":"楊梅道東堂玉明屋","lat":24.930632,"lng":121.126342,"cat":"worship","tag":"古蹟","desc":"楊梅鄭家的客家夥房由莿竹林環繞，屋前陂塘分出洗衣、養魚與養鴨的空間。道東堂門楣刻著八仙人物，廊下還能看見木雕雙獅座。","area":"楊梅區・桃園市","ph":"文"},{"id":3092,"name":"楊梅道東堂雙堂屋","lat":24.926592,"lng":121.146767,"cat":"worship","tag":"古蹟","desc":"鄭家第四房後人的公厝有前後兩落堂屋，因此地方慣稱雙堂屋。宅院經逐步添建才成為雙堂六橫的規模，留下高山頂客家宗族的生活格局。","area":"楊梅區・桃園市","ph":"文"},{"id":3093,"name":"粼粼波光、翩翩白影(地景藝術節白鷺鷥)","lat":24.93385,"lng":121.07583,"cat":"other","desc":"富岡的農業埤塘既供灌溉，池裡的魚蝦也吸引鳥類前來覓食。白鷺鷥與波光相伴的意象，讓人回想農田、水圳和鳥類曾經緊密相依的風景。","area":"楊梅區・桃園市","ph":"觀"},{"id":3094,"name":"臺灣電力公司楊梅倉庫（I棟通風倉庫）","lat":24.908906,"lng":121.160563,"cat":"history","tag":"歷史建築","desc":"台電為輸配電工程備料而建的楊梅倉庫，四面無牆，保留寬闊通風的空間。鋁桁架以鉚釘固定，四棟雙坡屋頂相連，形成一座長形大棚。","area":"楊梅區・桃園市","ph":"文"},{"id":3095,"name":"郭元益糕餅博物館","lat":24.92809,"lng":121.16753,"cat":"culture","desc":"傳統漢餅和婚嫁禮俗密不可分，博物館收藏與這兩者相關的文物。從訂婚大餅的文化意義到親手製作糕餅，可逐步認識臺灣的烘焙傳統。","area":"楊梅區・桃園市","ph":"觀"},{"id":3096,"name":"侏羅紀博物館","lat":25.0435,"lng":121.29534,"cat":"culture","desc":"桃園這座博物館以寶石為主題，將地質知識與藝術放進同一個展覽空間。參觀時也可藉互動體驗，從不同角度認識自然形成的寶石。","area":"蘆竹區・桃園市","ph":"觀"},{"id":3097,"name":"南崁1號穀倉及農機倉庫","lat":25.047029,"lng":121.293609,"cat":"history","tag":"歷史建築","desc":"南崁的舊穀倉所在區域，日治時期曾將土地轉交桃園郡米穀統制組合。從這段土地沿革推測，倉庫可能曾用於當時的米穀儲藏與管理。","area":"蘆竹區・桃園市","ph":"文"},{"id":3098,"name":"南崁溪水岸公園","lat":25.04642,"lng":121.28732,"cat":"nature","desc":"南崁溪流過龜山、桃園與蘆竹，沿岸多座公園串起連續的水岸綠地。步行或騎車沿溪前進，便能從不同區段欣賞都市河岸景色。","area":"蘆竹區・桃園市","ph":"觀"},{"id":3099,"name":"外社輕便車站","lat":25.08233,"lng":121.30569,"cat":"other","desc":"蘆竹外社早年曾是農村輕便鐵道的終點，路線拆除後車站也隨之消失。後來社區重新打造車站，讓居民看得到當年農村運輸的歷史。","area":"蘆竹區・桃園市","ph":"觀"},{"id":3100,"name":"蘆竹五福宮","lat":25.053719,"lng":121.295132,"cat":"worship","tag":"古蹟","desc":"蘆竹居民奉祀玄壇元帥趙公明，民間也尊稱祂為財神。地方傳說強調祂忠勇、善於蓄財又樂於濟人，這些故事成了五福宮信仰的背景。","area":"蘆竹區・桃園市","ph":"文"},{"id":3101,"name":"蘆竹德馨堂","lat":25.079317,"lng":121.28604,"cat":"worship","tag":"古蹟","desc":"蘆竹陳氏族人為紀念渡海來臺的先祖而建宗祠，中堂安奉祖先牌位。屋頂起燕尾，前方設有牌樓，土埆牆也保留早年營造的痕跡。","area":"蘆竹區・桃園市","ph":"文"},{"id":3102,"name":"蘆竹慎德居","lat":25.081309,"lng":121.312844,"cat":"history","tag":"歷史建築","desc":"蘆竹林家的客家夥房前臨陂塘、後有防風竹林，以一堂二橫圍成宅院。牆面從下而上可見卵石、紅磚與土埆，材料多取自附近。","area":"蘆竹區・桃園市","ph":"文"},{"id":3103,"name":"長流當代美術館(桃園館)","lat":25.04988,"lng":121.30168,"cat":"culture","area":"蘆竹區・桃園市","ph":"觀"},{"id":3104,"name":"崙坪文化地景園區","lat":24.99923,"lng":121.1659,"cat":"culture","desc":"桃園崙坪的園區把客家傳統工藝、地方歷史遺跡與綠地放在同一片空間。沿園內散步，可以一邊看自然景觀，一邊認識在地文化。","area":"觀音區・桃園市","ph":"觀"},{"id":3105,"name":"甘泉寺","lat":25.03709,"lng":121.08164,"cat":"worship","desc":"桃園觀音的百年廟宇，匯聚儒、釋、道三教信仰。歷次修繕逐步形成今日的廟貌，也是當地居民長久以來參拜的信仰中心。","area":"觀音區・桃園市","ph":"觀"},{"id":3106,"name":"草漯石門水庫移民新村衛生室","lat":25.066719,"lng":121.13202,"cat":"history","tag":"歷史建築","desc":"石門水庫興建時，部分大漢溪沿岸居民被迫搬遷到草漯，衛生室即為照護移民所設。灰白抿石子牆和淺綠玻璃門窗，保留當時的建築風格。","area":"觀音區・桃園市","ph":"文"},{"id":3107,"name":"觀音白沙岬燈塔","lat":25.041029,"lng":121.075993,"cat":"history","tag":"古蹟","desc":"觀音溪附近的白沙岬海岸，在日治初期獲選為設置燈塔的位置。當時往來基隆、高雄與南洋的船隻常經這段海域，需要燈光協助辨認海岸。","area":"觀音區・桃園市","ph":"文"},{"id":3108,"name":"三坑老街","lat":24.84435,"lng":121.24842,"cat":"structure","desc":"龍潭的客家村三坑子，清代曾有繁忙的河港與商街，因而有龍潭第一街的稱呼。大圳完成後河面水位下降，原有碼頭的轉運功能也逐漸式微。","area":"龍潭區・桃園市","ph":"觀"},{"id":3109,"name":"三坑自然生態公園","lat":24.83895,"lng":121.25738,"cat":"nature","desc":"大漢溪畔的生態湖與大片草坪，構成三坑公園的主要景色。園區以生態工法整理水岸、栽種本地草木，木拱橋與戲水渠道穿插其間。","area":"龍潭區・桃園市","ph":"觀"},{"id":3110,"name":"佳安里(石門十一份)","lat":24.83509,"lng":121.24165,"cat":"scenic","desc":"石門十一份留下興建水庫時美國工程師居住的宿舍群，房舍融合日式與美式風格。大片草地與成蔭樹木環繞老屋，成了龍潭居民休憩的空間。","area":"龍潭區・桃園市","ph":"觀"},{"id":3111,"name":"十一份觀光文化園區","lat":24.83583,"lng":121.23905,"cat":"culture","desc":"龍潭十一份園區用「十一份禮物」為題，從石門與佳安的發展歷史切入地方文化。自然環境、風土設計和永續發展，也是園內關注的主題。","area":"龍潭區・桃園市","ph":"觀"},{"id":3112,"name":"大平橋","lat":24.831271,"lng":121.245537,"cat":"history","tag":"歷史建築","desc":"龍潭大平聚落北邊的紅橋，橫跨又稱清水坑溪的溪流。早年三坑子是貨物轉運站，一溪之隔的大平居民靠這座橋往返兩個聚落。","area":"龍潭區・桃園市","ph":"文"},{"id":3113,"name":"小人國","lat":24.83195,"lng":121.18711,"cat":"other","desc":"龍潭的主題樂園將各地知名建築縮成原來的二十五分之一，園內排列上百件模型。從臺灣各地到歐亞景觀，能近看建築原有的比例與細節。","area":"龍潭區・桃園市","ph":"觀"},{"id":3114,"name":"桃園客家文化館","lat":24.8452,"lng":121.23463,"cat":"culture","area":"龍潭區・桃園市","ph":"觀"},{"id":3115,"name":"棒球名人堂","lat":24.84625,"lng":121.22778,"cat":"worship","desc":"龍潭的展示館外觀就是一顆直徑約三十二公尺的棒球。走進球體內，可見歷屆入選名人堂球員的相關文物，認識臺灣棒球的發展歷程。","area":"龍潭區・桃園市","ph":"觀"},{"id":3116,"name":"渴望園區","lat":24.8396,"lng":121.18384,"cat":"culture","desc":"龍潭這片低密度開發的園區，把生活、生產與生態安排在同一地區。廣大園地裡保留近九十公頃的公園綠地，成為居民日常休閒的空間。","area":"龍潭區・桃園市","ph":"觀"},{"id":3117,"name":"菱潭街興創基地","lat":24.8648,"lng":121.21259,"cat":"culture","desc":"龍潭大池附近的舊第一市場美食街，曾閒置多年，後來重新成為創業與文化空間。繪著龍潭地景的燈籠掛在街上，店鋪間可聽講座、學料理。","area":"龍潭區・桃園市","ph":"觀"},{"id":3118,"name":"鍾肇政文學生活園區","lat":24.86433,"lng":121.21418,"cat":"culture","area":"龍潭區・桃園市","ph":"觀"},{"id":3119,"name":"龍潭三和江夏科文祖堂","lat":24.846866,"lng":121.193508,"cat":"worship","tag":"歷史建築","desc":"龍潭三和的黃氏祖堂，以一堂四橫屋組成客家合院。家族早年以種茶為業，祖堂外觀樸素，最能細看的是講究的紅磚石作與節制的屋脊剪黏。","area":"龍潭區・桃園市","ph":"文"},{"id":3120,"name":"龍潭三坑川盛信記商店","lat":24.843895,"lng":121.247971,"cat":"history","tag":"歷史建築","desc":"三坑老街上的商店，是清代帶步廊的傳統街屋。大漢溪航運興盛時，三坑子負責內陸聚落與淡水、萬華間的貨運，店屋也見證這段繁榮。","area":"龍潭區・桃園市","ph":"文"},{"id":3121,"name":"龍潭武德殿","lat":24.864082,"lng":121.214894,"cat":"worship","tag":"歷史建築","desc":"日治時期武德會透過警察系統在臺推廣武道，龍潭也留下武德殿。這類場館將劍術、柔術等修習空間與祭祀武神的神龕設在同一建築內。","area":"龍潭區・桃園市","ph":"文"},{"id":3122,"name":"龍潭烏樹林翁宅祖堂六桂傳香","lat":24.884215,"lng":121.219895,"cat":"worship","tag":"歷史建築","desc":"翁家遷居龍潭烏樹林、逐步立業後，建起六桂傳香祖堂。宅院歷經後代數度修整，堂屋仍保有豐富細緻的裝飾，記錄客家家族在此開墾的歷史。","area":"龍潭區・桃園市","ph":"文"},{"id":3123,"name":"龍潭石拱橋","lat":24.85022,"lng":121.21167,"cat":"history","tag":"歷史建築","desc":"上林野溪上的石拱橋，在日治初期的地圖中已有紀錄。溪流後來成為灌溉圳道，橋則連接溪東、溪西兩處居民的田地與生活空間。","area":"龍潭區・桃園市","ph":"文"},{"id":3124,"name":"龍潭翁新統大屋（正廳、右第一護龍）","lat":24.886699,"lng":121.219178,"cat":"history","tag":"古蹟","desc":"烏樹林翁家落腳龍潭、建成祖堂後，隨著家族人口增加再另建夥房。翁新統主持興建的大屋，正廳與右側第一護龍留下宗族擴展的痕跡。","area":"龍潭區・桃園市","ph":"文"},{"id":3125,"name":"龍潭聖蹟亭","lat":24.866505,"lng":121.20775,"cat":"worship","tag":"古蹟","desc":"龍潭的惜字亭用來焚化寫過字的紙張，寄託客家人敬惜文字、崇敬倉頡與文昌帝君的傳統。亭園沿中軸對稱配置，三進庭院依序展開。","area":"龍潭區・桃園市","ph":"文"},{"id":3126,"name":"龍潭觀光大池","lat":24.86356,"lng":121.20944,"cat":"scenic","area":"龍潭區・桃園市","ph":"觀"},{"id":3127,"name":"A8藝文中心","lat":25.06051,"lng":121.36998,"cat":"culture","desc":"長庚醫院站共構大樓內的藝文中心，以當代藝術和地方文化為主軸。約百坪的展覽空間位在商場與醫院旁，為日常街區添了一處看展的地方。","area":"龜山區・桃園市","ph":"觀"},{"id":3128,"name":"Global Mall 桃園A8","lat":25.0606,"lng":121.37007,"cat":"other","desc":"桃園這間環球購物中心靠近國際機場，同時有旅客與林口地區居民使用。商店聚在一處，連起出遊前後的購物需求與在地日常生活。","area":"龜山區・桃園市","ph":"觀"},{"id":3129,"name":"前龜山陸光三村活動中心","lat":24.998478,"lng":121.340499,"cat":"history","tag":"歷史建築","desc":"龜山陸光三村的兩層樓活動中心，保留戰後現代主義建築樣式。它後來改為眷村故事館，由社區居民用在地文物說出自己的生活經驗。","area":"龜山區・桃園市","ph":"文"},{"id":3130,"name":"台塑企業文物館","lat":25.03459,"lng":121.38812,"cat":"culture","area":"龜山區・桃園市","ph":"觀"},{"id":3131,"name":"壽山巖觀音寺","lat":25.00335,"lng":121.36591,"cat":"worship","tag":"古蹟","desc":"相傳順寂法師從普陀山迎來觀音像，路過龜山時先安奉在樹下。後來信士在此建立三草庵，這段故事也成了壽山巖觀音信仰的起源。","area":"龜山區・桃園市","ph":"文"},{"id":3132,"name":"桃園酒廠","lat":25.05694,"lng":121.37473,"cat":"other","desc":"文化一路上的巨大酒瓶模型是酒廠的地標，前身為林口酒廠。園旁有酒甕裝置，入口步道上葡萄藤與綠樹相伴，呼應當地製酒產業。","area":"龜山區・桃園市","ph":"觀"},{"id":3133,"name":"楓樹坑","lat":25.01507,"lng":121.34082,"cat":"scenic","desc":"三個谷地組成的農村，因早年遍植楓樹而得名。今天沿農田與鄉間小路散步，能隨季節看見綠色稻浪、白茫茫芒花或飄落的油桐花。","area":"龜山區・桃園市","ph":"觀"},{"id":3134,"name":"龜山憲光二村","lat":24.992102,"lng":121.342249,"cat":"history","tag":"歷史建築","desc":"桃園龜山保留的憲兵眷舍，最初以成排的單層平房為主，之後又增建新式房舍。從不同格局的住戶空間，可見早期眷村的居住方式。","area":"龜山區・桃園市","ph":"文"},{"id":3135,"name":"龜山樟腦寮協和磚廠","lat":25.040808,"lng":121.386055,"cat":"history","tag":"歷史建築","desc":"龜山磚業興盛時留下的八卦窯，利用分段輪燒方式製作磚瓦。局部留存的拱形窯門、煙道與中空煙囪，仍能看出窯爐的構造。","area":"龜山區・桃園市","ph":"文"},{"id":3136,"name":"龜山第一河濱公園","lat":24.99581,"lng":121.32967,"cat":"nature","desc":"南崁溪穿過龜山市區，沿岸綠地設有自行車道與散步道。河水整治後吸引水鳥棲息，走在河濱可以一邊看鳥，一邊欣賞溪岸景色。","area":"龜山區・桃園市","ph":"觀"},{"id":3137,"name":"龜山迴龍寺","lat":25.019786,"lng":121.408919,"cat":"worship","tag":"歷史建築","desc":"龜山的石觀音信仰，經地方庄紳商人募資，逐步建成今天的寺院。從大殿到後續完工的鐘鼓樓、拜亭和東西廂，都記錄居民共同建廟的歷程。","area":"龜山區・桃園市","ph":"文"},{"id":3138,"name":"龜崙嶺鐵道橋遺構","lat":25.015839,"lng":121.392368,"cat":"history","tag":"古蹟","desc":"現代公路橋下還留有清代鐵道的橋基，橫跨塔寮坑溪上游。這段遺構屬於當年經龜崙嶺通往桃園的鐵路，見證劉銘傳時期的建設。","area":"龜山區・桃園市","ph":"文"},{"id":3139,"name":"七美遊客中心","lat":23.196004,"lng":119.425188,"cat":"other","desc":"七美的遊客中心把港口、地質與幸福方舟等島嶼意象融入建築。除了提供地方旅遊資訊，館舍也以節能與輕量設計回應海島環境。","area":"七美鄉・澎湖縣","ph":"觀"},{"id":3140,"name":"七美雙心石滬","lat":23.220252,"lng":119.446974,"cat":"history","tag":"文化景觀","desc":"七美的頂隙滬以玄武岩砌成，內外滬房圍出兩顆相連的心。左側伸腳末端呈螺鉤狀，右側接回岸邊，滬內還保有存魚的魚井。","area":"七美鄉・澎湖縣","ph":"文"},{"id":3141,"name":"小台灣","lat":23.208426,"lng":119.443572,"cat":"scenic","desc":"七美東北海岸的海蝕平臺，從高處看去，輪廓酷似臺灣本島。旁邊還有像龜山島的小岩石，退潮時露出的海岸線條尤其清楚。","area":"七美鄉・澎湖縣","ph":"觀"},{"id":3142,"name":"望夫石","lat":23.18745,"lng":119.4301,"cat":"scenic","desc":"七美海岸的岩石，風化成女子仰躺般的輪廓。地方傳說一名婦人天天到岸邊等候出海未歸的丈夫，這段故事也讓石頭有了望夫之名。","area":"七美鄉・澎湖縣","ph":"觀"},{"id":3143,"name":"牛母坪","lat":23.20878,"lng":119.43534,"cat":"other","desc":"七美的崖頂草原因海面上有一塊像牛的岩石而得名。往下望，海灣和海蝕平臺並列，還能看見帶有層理的火山角礫岩。","area":"七美鄉・澎湖縣","ph":"觀"},{"id":3144,"name":"龍埕","lat":23.20174,"lng":119.437532,"cat":"scenic","desc":"七美南向的海岸，有一片凝灰岩與玄武岩交錯的海蝕平臺。熔岩流受擠壓形成褶皺，附著岩面的藻苔加深色差，從高處能看清曲折紋路。","area":"七美鄉・澎湖縣","ph":"觀"},{"id":3145,"name":"先人種下的花—望安花宅聚落","lat":23.37128,"lng":119.49375,"cat":"history","desc":"望安的漁民把原鄉工法帶到島上，配合地形、風向與家族需要築成花宅。屋與屋之間逐漸形成巷道，水井與位在花心的信仰中心也延續下來。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3146,"name":"將軍澳嶼","lat":23.366623,"lng":119.527687,"cat":"scenic","desc":"望安對面的島嶼，早年因居民採集珊瑚而興盛。港邊小樓一棟接著一棟，熱鬧街景頗有港市風情，因此曾有「小香港」的稱呼。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3147,"name":"望安綠蠵龜觀光保育中心","lat":23.364965,"lng":119.506923,"cat":"scenic","desc":"望安潭門港附近的海龜造型建築，展示島上候鳥、保育動物與綠蠵龜生態。除了學習分辨海龜，館內也介紹上元乞龜的地方信仰。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3148,"name":"東吉嶼","lat":23.25583,"lng":119.6725,"cat":"scenic","desc":"澎湖南方四島國家公園裡的東吉嶼，與西吉、東嶼坪、西嶼坪及周圍海域共同受到保護。島上人煙稀少，仍保留自然的海島樣貌。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3149,"name":"東嶼坪嶼","lat":23.25972,"lng":119.51667,"cat":"scenic","desc":"南方四島中的火山島以玄武岩方山地形為主，東北側海岸有海蝕溝、洞與石柱。轉到西南兩側，又可見珊瑚碎屑累積成的砂礫灘。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3150,"name":"花宅聚落(中社村)","lat":23.37013,"lng":119.49601,"cat":"other","desc":"望安聚落四周山丘像環繞花心的花瓣，早期移民就在中央一帶墾地築屋，因此得名花宅。後來因位居本島各村中央，村名改為中社。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3151,"name":"花嶼","lat":23.40361,"lng":119.3225,"cat":"scenic","desc":"澎湖群島西端的這座島，地質以安山岩為特色，與常見的玄武岩方山相當不同。黏稠熔岩不易流動，堆積形態也留下異於其他島嶼的輪廓。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3152,"name":"西吉嶼","lat":23.24917,"lng":119.61556,"cat":"scenic","desc":"東吉嶼西方的無人島，屬於澎湖南方四島國家公園。北面與西面高聳的玄武岩海崖綿延數百公尺，一根根清晰的柱狀節理構成岩壁。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3153,"name":"貓嶼","lat":23.32512,"lng":119.32125,"cat":"scenic","desc":"望安西南外海的大貓嶼、小貓嶼及周圍礁岩，共同構成這組海島。大小兩島都由玄武岩形成，四面陡峭懸崖讓島身與海面界線分明。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3154,"name":"鴛鴦窟、藏軍洞","lat":23.35742,"lng":119.50047,"cat":"scenic","desc":"望安東北側的天然谷地，據說早年有鴛鴦在水窟戲水而得名。外海有馬鞍山嶼屏障，日治時期曾設海軍基地，藏軍洞便是留下的遺跡。","area":"望安鄉・澎湖縣","ph":"觀"},{"id":3155,"name":"南寮古厝群","lat":23.58529,"lng":119.66875,"cat":"other","desc":"澎湖南寮靠近內陸，早年以農業為主，村中保留不少紅瓦石牆的傳統房舍。從獨棟住宅、三合院到大家族的群居空間，可見農村生活的格局。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3156,"name":"南寮許返古宅","lat":23.585458,"lng":119.669688,"cat":"history","tag":"歷史建築","desc":"南寮許返是保寧宮小法傳承的重要人物，故宅保留細緻的門樓與剪黏。洩水口做成龍頭鯉身的鰲魚，兩側門柱上還嵌入泥塑獅子。","area":"湖西鄉・澎湖縣","ph":"文"},{"id":3157,"name":"大城北林登豫古宅","lat":23.565162,"lng":119.624999,"cat":"history","tag":"歷史建築","desc":"日治時期大城北的四櫸頭古宅，結合澎湖傳統住宅與當時引入的西式工法。後院高丘留有戰時防空壕，屋旁則曾有飼養豬牛的空間。","area":"湖西鄉・澎湖縣","ph":"文"},{"id":3158,"name":"林投公園","lat":23.55866,"lng":119.64256,"cat":"nature","desc":"澎湖林投海濱早年大量種植木麻黃，設立公園時已是一片綠蔭。沿著入口步道走到盡頭，旁邊還有由軍人公墓演變而來的忠靈祠。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3159,"name":"林投日軍上陸紀念碑","lat":23.561594,"lng":119.644877,"cat":"history","tag":"古蹟","desc":"林投海岸的石碑，記錄甲午戰爭期間日軍登陸澎湖的事件。日治時期在登陸處立起的紀念碑採花崗岩製作，從基座可看出八角形輪廓。","area":"湖西鄉・澎湖縣","ph":"文"},{"id":3160,"name":"沙港村˙大尾尖頂塔","lat":23.605472,"lng":119.629,"cat":"other","desc":"沙港北勢與南勢各有石塔，大尾尖頂的山丘正好位在兩者中間。據地方耆老口述，居民依信仰在山丘安塔，寄託平衡地勢、保佑村庄的願望。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3161,"name":"沙港村˙花後塔","lat":23.605985,"lng":119.626348,"cat":"other","desc":"沙港村外海的石塔，因立在名為花後的地方而得名。據地方口述，居民為呼應南北不同地勢而建塔，塔身特意留有一處風口。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3162,"name":"湖西拱北礮臺","lat":23.562691,"lng":119.609654,"cat":"history","tag":"古蹟","desc":"清代劉銘傳在澎湖增建新式砲臺時，這座設於媽宮城東方的拱北山上。它位在內陸，主要用來守護媽宮港後方，是澎湖防禦史的一環。","area":"湖西鄉・澎湖縣","ph":"文"},{"id":3163,"name":"澎湖機場旅遊服務中心","lat":23.560616,"lng":119.6297,"cat":"other","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3164,"name":"澎湖龜壁港社","lat":23.5841,"lng":119.6712,"cat":"other","desc":"澎湖南寮舊稱龜壁港社，早期移民多來自閩南泉州，以半農半漁維生。聚落信仰中心是奉祀保生大帝的保寧宮，延續地方共同祭祀。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3165,"name":"白坑村˙石塔","lat":23.603556,"lng":119.66,"cat":"other","desc":"白坑居民擔心北方季風直入村中，依地方信仰設立石塔守護聚落。塔身罕見地漆上顏色，頂部的太陽能標識燈也為附近船隻提供方向。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3166,"name":"菓葉觀日樓","lat":23.57884,"lng":119.68093,"cat":"scenic","desc":"湖西東側的小漁村適合觀日，村名「菓葉」正是黃槿的地方稱呼。早年這裡曾有大片黃槿林，後來樹名也成了澎湖聚落的名字。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3167,"name":"錠鉤嶼","lat":23.61861,"lng":119.70028,"cat":"scenic","desc":"雞善嶼東南方的玄武岩小島，因輪廓像船錨而得名。柱狀岩層中有時夾著橄欖石團塊，熔岩冷卻方向與海蝕也塑造出不同節理。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3168,"name":"雞善嶼","lat":23.62662,"lng":119.68582,"cat":"scenic","desc":"北寮村東北外海的大、小雞善嶼，以玄武岩景觀著稱，也有「東海黃山」的稱呼。兩座島平時為海水所隔，退潮時中間的地形才連起來。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3169,"name":"離島出走 isle.travel studio","lat":23.58708,"lng":119.64177,"cat":"other","desc":"紅羅魚灶裡的工作室，坐落於澎湖昔日加工漁獲的場所。早年各村以魚灶大量製作魚乾，把醃漬、曬乾等保存方式融入海島漁業。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3170,"name":"青螺村˙陽明妙塔","lat":23.603583,"lng":119.65,"cat":"other","desc":"青螺村西側山仔頭高地的石塔，與村落向西發展的信仰故事相連。現在的塔是重建後的樣貌，特別之處是塔體也具聚雨功能。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3171,"name":"龍門南崁閉鎖陣地","lat":23.57737,"lng":119.66151,"cat":"scenic","desc":"昔日稱作裡正角地下指揮所的軍事陣地，後來移交地方整理為文化景點。入口醒目的「龍門」二字，標示出這處曾具戰備用途的空間。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3172,"name":"龍門村˙石塔","lat":23.565833,"lng":119.678,"cat":"other","desc":"龍門後灣沙灘兩旁山頭圍成凹口，居民擔心水浪直衝村莊，依信仰設石塔鎮守。地方還流傳安塔祭儀的故事，反映漁村面海生活的心情。","area":"湖西鄉・澎湖縣","ph":"觀"},{"id":3173,"name":"龍門裡正角日軍上陸紀念碑","lat":23.554499,"lng":119.681525,"cat":"history","tag":"古蹟","desc":"甲午戰爭期間，日軍在裡正角登陸澎湖，再向太武山推進。日治時期在龍門海岸所立的石碑，留下當地成為戰事登陸點的歷史。","area":"湖西鄉・澎湖縣","ph":"文"},{"id":3174,"name":"中屯風力園區","lat":23.6204,"lng":119.6058,"cat":"culture","desc":"白沙中屯村的八座白色風力發電機，豎立在昔日苗圃一帶。葉片可隨風力調整角度與轉速，既是島上風力資源的利用，也成了地方地標。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3175,"name":"北海遊客中心","lat":23.668792,"lng":119.60354,"cat":"other","desc":"白沙赤崁村的北海遊客中心，原是旅人前往吉貝、險礁及目斗嶼的起點。館舍因重建調整服務，留下北海群島旅遊發展的一段歷程。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3176,"name":"北鐵砧嶼","lat":23.78639,"lng":119.60028,"cat":"scenic","desc":"澎湖本島西北外海的無人島，因方平輪廓像鐵砧而得名。四周陡崖
