55414,"lng":120.65773,"cat":"worship","desc":"瑞峰竹坑溪步道上的瀑布，從近百公尺高的峭壁筆直落下。瀑布後方岩壁天然內凹，小徑嵌在岩縫間，走過時就能從水簾後方觀看飛瀑。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1294,"name":"中央廣播電臺民雄分臺廣播文物館","lat":23.56458,"lng":120.429684,"cat":"culture","tag":"歷史建築","desc":"民雄放送所的機房前段保存了戰時播音室，後來成為廣播文物館。兩層樓建物呈丁字形，入口門廊轉出弧線，二樓開有半圓天窗，牆面則採土黃色洗石子。","area":"民雄鄉・嘉義縣","ph":"文"},{"id":1295,"name":"中央廣播電臺民雄分臺日式招待所","lat":23.560339,"lng":120.430523,"cat":"history","tag":"歷史建築","desc":"民雄放送所的舊招待所保留傳統日式民宅模樣，外牆覆著層層雨淋板。入口兩柱的洗石子基座嵌有卵石，房舍地板抬高，底下的通氣孔也成了立面的一部分。","area":"民雄鄉・嘉義縣","ph":"文"},{"id":1296,"name":"大士爺廟","lat":23.556156,"lng":120.429565,"cat":"worship","tag":"古蹟","desc":"民雄這座廟重建時合祀四座廟宇的神明，從三川殿與兩旁山門並立就能看出端倪。殿前石獅來自舊慶誠宮，木雕上還能細看漁翁與樵夫的身影。","area":"民雄鄉・嘉義縣","ph":"文"},{"id":1297,"name":"民雄「何元英祠堂」","lat":23.54555,"lng":120.392349,"cat":"worship","tag":"歷史建築","desc":"民雄雙援的何氏祠堂，由何元英與後代原本居住的祖厝改建而成。何元英是家中第五子，人稱「雙援五房公」，祠內一同祭祀他與來臺祖先的神位。","area":"民雄鄉・嘉義縣","ph":"文"},{"id":1298,"name":"南靖糖廠倉庫群","lat":23.414493,"lng":120.384198,"cat":"history","tag":"歷史建築","desc":"糖廠早年在這排磚木倉庫存放蔗糖與肥料，門窗採向兩旁拉開的形式。雨淋板牆面上，細長木條等距排列，抬頭還可見鋪著日本瓦的屋頂與長方形氣窗。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1299,"name":"南靖車站","lat":23.412694,"lng":120.386944,"cat":"history","tag":"歷史建築","desc":"南靖糖廠興建後，聚落日益熱鬧，載人與運糖都有了鐵路需求。連到車站的鐵軌讓廠內生產與外界相接，車站的來歷也就與糖業密不可分。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1300,"name":"嘉南大圳八掌溪渡槽橋","lat":23.429204,"lng":120.41473,"cat":"history","tag":"古蹟","desc":"嘉南大圳的水流在這裡經由渡槽跨過八掌溪，延續北幹線的灌溉路徑。這座一九二六年興建的鋼筋混凝土橋長兩百五十九公尺，是北幹線最長的渡槽橋。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1301,"name":"後寮羅氏宗祠","lat":23.411257,"lng":120.36242,"cat":"worship","tag":"歷史建築","desc":"水上後寮居民感念羅美源捐地，於日治時期建祠紀念他，廳內也奉祀關公。北港匠師把傳統大木作與洋式建築手法帶入這座羅氏家祠。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1302,"name":"水上南靖糖廠製糖工場","lat":23.411,"lng":120.379171,"cat":"history","tag":"歷史建築","desc":"東洋製糖於一九〇九年設立南靖製糖所，廠內並設農場與製酒精的副產工場。初期以英式機械壓榨甘蔗製成粗糖，隔年起也用碳酸法生產白糖。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1303,"name":"水上善德堂","lat":23.433275,"lng":120.41788,"cat":"worship","tag":"古蹟","desc":"堂內留下不少清代以來的碑刻，正身與護龍也保有完整格局。牆上的彩繪是匠師陳玉峰的作品，題材各異，可以在同一座建築裡比較他的不同畫風。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1304,"name":"水上機場少華樓","lat":23.45483,"lng":120.4026,"cat":"history","tag":"歷史建築","desc":"嘉義空軍基地裡的少華樓，是戰後初期水上機場為因應聯隊需要所留下的建築。從這棟樓的保存，也能追溯空軍營區當時的營建方式與駐防歷史。","area":"水上鄉・嘉義縣","ph":"文"},{"id":1305,"name":"溪口曾氏洋樓","lat":23.60253,"lng":120.392323,"cat":"history","tag":"古蹟","desc":"溪口曾家洋樓以紅白相間的磚帶裝飾外牆，山牆中央的捲草花環裡嵌著一個「曾」字。往上看是展翅的老鷹，門額則留有詩人黃傳心的「檻外雲山」。","area":"溪口鄉・嘉義縣","ph":"文"},{"id":1306,"name":"半天巖紫雲寺","lat":23.46227,"lng":120.595223,"cat":"worship","tag":"古蹟","desc":"番路山間的老寺供奉觀世音菩薩，四周山峰環抱，雲氣常在山間聚散。相傳清康熙年間，一位僧人路過此地，便搭起茅舍安奉隨身攜來的觀音像。","area":"番路鄉・嘉義縣","ph":"文"},{"id":1307,"name":"牛埔仔愛情大草原","lat":23.44363,"lng":120.59087,"cat":"scenic","desc":"觸口附近的開闊草地以愛情和阿里山為題，布置成一處戶外裝置園區。純白的大禮盒與火紅愛心錯落在草坪上，遠遠就能看到鮮明的輪廓與色彩。","area":"番路鄉・嘉義縣","ph":"觀"},{"id":1308,"name":"番路鄭家古厝","lat":23.446094,"lng":120.601598,"cat":"history","tag":"歷史建築","desc":"茂未公於一八九九年興建鄭家祠堂，屋子以龍眼木搭成，留存至今。家族還種著日治時期傳下的咖啡樹，替這座老宅多留下一段山村生活的記憶。","area":"番路鄉・嘉義縣","ph":"文"},{"id":1309,"name":"番路陸軍第五彈藥儲備庫(第一分庫)H01、H03、H07 倉庫","lat":23.457658,"lng":120.525978,"cat":"history","tag":"歷史建築","desc":"八二三炮戰之後，軍方在番路興建這批彈藥倉庫。留存建築採用檜木構成的大跨度屋架，記錄了當時兩岸軍事對峙下，臺灣本島興建備戰設施的歷史。","area":"番路鄉・嘉義縣","ph":"文"},{"id":1310,"name":"觸口自然教育中心","lat":23.453168,"lng":120.559498,"cat":"scenic","desc":"番路淺山的自然教育中心就設在南區樹木銀行，園內有多棵受到保留的老樹。生態水道穿過綠地，綠意館則以取得黃金級標章的綠建築介紹環境教育。","area":"番路鄉・嘉義縣","ph":"觀"},{"id":1311,"name":"逐鹿傳說梅花鹿園","lat":23.44677,"lng":120.58536,"cat":"scenic","desc":"觸口轆子腳的沖積平台地勢平坦，曾是鄒族傳統的梅花鹿獵場。祖先用「圍捕梅花鹿的地方」來稱呼這片土地，逐鹿之名也延續著族人與鹿的關係。","area":"番路鄉・嘉義縣","ph":"觀"},{"id":1312,"name":"鄒族逐鹿文創園區","lat":23.44662,"lng":120.58387,"cat":"culture","desc":"逐鹿部落以歌舞展演、文化導覽和手作體驗，讓訪客接觸鄒族生活。園區也從飲食與文創作品介紹部落，把文化的傳承放進可以親身參與的活動裡。","area":"番路鄉・嘉義縣","ph":"觀"},{"id":1313,"name":"台灣肖楠母樹林","lat":23.5041,"lng":120.69549,"cat":"scenic","desc":"奮起湖老街近旁有條穿過肖楠母樹林的步道，從街區便可走進林下。春末初夏或秋冬交替時，沿途還有機會見到螢火蟲在樹影間發亮。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1314,"name":"圓潭生態園區","lat":23.52894,"lng":120.65935,"cat":"culture","desc":"瑞里一號橋附近的綠色步道，沿途有清澈水域與多種動物棲息。散步時可留意鳥類、蝴蝶、甲蟲和蛙類，春末夏初也有機會看見螢火蟲。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1315,"name":"土地公廟","lat":23.47788,"lng":120.67421,"cat":"worship","desc":"頂笨仔居民祭拜土地公的福德宮，廟裡以刻著「福德正神」的石碑代替神像。人們還借聚落的名字打趣，稱這裡為「全臺灣最笨的土地公廟」。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1316,"name":"奮起湖(南側)杉林棧道","lat":23.50349,"lng":120.69329,"cat":"scenic","desc":"奮起湖南側的兩段棧道，因沿途種著柳杉與臺灣杉而得名。步道各有出入口，在老老街南端附近以一段產業道路相接，串起林間和聚落的風景。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1317,"name":"奮起湖老老街（下腳店仔）","lat":23.50211,"lng":120.69675,"cat":"structure","desc":"當地人口中的「下腳店仔」，是奮起湖商家最早聚集之處。這條街在鐵路與公路闢建以前就已成形，要找山城商業的起點，可以從這段老街認識。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1318,"name":"奮起湖老街","lat":23.50511,"lng":120.69495,"cat":"structure","desc":"奮起湖有「南臺灣九份」的稱呼，老街也是這個山城受人注意的地方。在街上散步，沿途看的就是奮起湖的老街景。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1319,"name":"奮起湖車庫","lat":23.505864,"lng":120.695744,"cat":"history","tag":"古蹟","desc":"山城鐵道旁的車庫保有機車頭出入的大門，兩側一排木框玻璃窗映出老車庫的輪廓。細看上方氣窗，每扇以傾斜木片分隔，下方窗戶則能左右推拉。","area":"竹崎鄉・嘉義縣","ph":"文"},{"id":1320,"name":"木馬棧道","lat":23.50623,"lng":120.69602,"cat":"scenic","desc":"奮起湖北側的這條棧道，前身是林業年代用來拖拉木材的木馬道。如今它和奮起步道相接，散步路線也就沿用了當年山林運材的路徑。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1321,"name":"百年砌石梯田","lat":23.47865,"lng":120.67331,"cat":"scenic","desc":"頂笨仔的居民為了在山坡上耕種，就地拾取原石，一塊塊壘起田地外牆。層層石牆能固定土壤、減少流失，這片梯田已在山坡上經歷百年風雨。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1322,"name":"竹崎車站","lat":23.52582,"lng":120.553589,"cat":"history","tag":"古蹟","desc":"阿里山林業鐵路上的竹崎站，候車室朝月台開了木框玻璃窗。站房入口的雨遮微微上揚，兩端山牆另有圓窗，木柱上細密的斜木格也值得看。","area":"竹崎鄉・嘉義縣","ph":"文"},{"id":1323,"name":"苦楝老樹","lat":23.47969,"lng":120.67584,"cat":"scenic","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1324,"name":"蝙蝠生態館","lat":23.50463,"lng":120.65965,"cat":"culture","desc":"阿里山鐵路一座廢棄隧道成了蝙蝠棲地，洞口設有柵欄以減少干擾。附近的水社寮舊站改成生態館，透過即時影像便能觀察洞裡蝙蝠的活動。","area":"竹崎鄉・嘉義縣","ph":"觀"},{"id":1325,"name":"義竹翁清江宅","lat":23.334192,"lng":120.243563,"cat":"history","tag":"古蹟","desc":"義竹翁氏家族祖籍泉州，這座宅院把洋樓與後方合院連在一起。連續拱廊遮住直射的陽光，正廳前的雨庇還能看見盾牌與月桂冠的裝飾。","area":"義竹鄉・嘉義縣","ph":"文"},{"id":1326,"name":"三代木及象鼻木","lat":23.51652,"lng":120.80919,"cat":"scenic","desc":"倒下的檜木在霧林裡長出苔蘚，潮濕的樹身正好讓落下的種子發芽。第二代樹木跨在第一代身上生長，後來第三代又在第二代樹幹上萌芽，留下三代相疊的樣貌。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1327,"name":"二萬平","lat":23.50854,"lng":120.79073,"cat":"scenic","desc":"海拔約兩千公尺的二萬平，是阿里山森林鐵路上的中繼站。沿著軌道望去是蒼翠林木，天候變化時，這裡也有機會看見夕陽與雲海。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1328,"name":"五奇之日出","lat":23.50946,"lng":120.82274,"cat":"scenic","desc":"阿里山的日出常從晨霧間透出光，接著朝陽越過山頭，將天際漸漸照亮。遇上雲海的清晨，山峰下翻動的雲層也會一起進入眼前的景象。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1329,"name":"五奇之晚霞","lat":23.52937,"lng":120.78095,"cat":"scenic","desc":"傍晚看阿里山的天色，可以在慈雲寺、沼平公園或山上車站附近停留。對高岳與小笠原山也是賞晚霞的地點，從不同山頭都能等候暮色染上天邊。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1330,"name":"五奇之森林","lat":23.51315,"lng":120.80927,"cat":"scenic","desc":"昔日阿里山林場後來成為國家森林遊樂區，高大的古木在步道上方交會成蔭。沿小徑能聽見林鳥鳴叫，逢花季，山裡又多了各色花景。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1331,"name":"五奇之鐵道","lat":23.51028,"lng":120.80442,"cat":"scenic","desc":"阿里山的登山鐵路起初為轉運木材而建，列車曾把山林與木材集散地連在一起。昔日林業使用的路線，後來轉為旅人搭乘小火車遊覽森林的路途。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1332,"name":"十字路鐵道","lat":23.494,"lng":120.74115,"cat":"scenic","desc":"十字村南緣曾是來吉、達邦與特富野等部落古道的交會點，後來也有森林鐵路經過。八八風災後列車中斷多年，直到二〇一七年，社區才再度響起火車鳴笛。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1333,"name":"原臺灣總督府氣象臺阿里山觀象所","lat":23.435467,"lng":120.780967,"cat":"history","tag":"古蹟","desc":"萬歲山北麓的高山觀象所，於一九三二年用檜木建成，後來改稱阿里山測候所。這裡的氣象觀測曾與玉山、臺中的資料相互對照，用來研究高空氣象。","area":"阿里山鄉・嘉義縣","ph":"文"},{"id":1334,"name":"受鎮宮","lat":23.51764,"lng":120.81078,"cat":"worship","desc":"山上居民信仰的廟宇奉祀玄天上帝、福德正神和註生娘娘。地方流傳農曆三月三日前有蛾飛來停在神像上，這些被稱作「神蛾」的訪客後來鑑定為枯球羅紋蛾。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1335,"name":"土石流紀念公園","lat":23.57463,"lng":120.74266,"cat":"nature","desc":"豐山村入口原是一片植群茂密的森林，如今成為紀念土石流的公園。地表留著一塊塊巨石，讓走進聚落的人看見這片土地與災害相伴的痕跡。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1336,"name":"姊妹潭","lat":23.51924,"lng":120.81404,"cat":"scenic","desc":"柳杉林後有兩座大小相鄰的高山湖泊，先映入眼簾的是較小的妹潭。地方傳說將兩潭與一對姊妹的愛情故事相連，為清澈碧綠的潭水留下名字。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1337,"name":"庫巴（mayasvi瑪雅斯比傳統祭典）","lat":23.45593,"lng":120.75003,"cat":"culture","desc":"鄒族男子在庫巴集會，部落也在此舉行傳統祭典。茅草屋頂和階梯旁種著作為天神辨認標記的神花木槲蘭，旁邊的雀榕則被視為天神降臨的階梯。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1338,"name":"新八景之28號巨木","lat":23.51917,"lng":120.80973,"cat":"scenic","desc":"巨木群棧道上的二十八號紅檜是合併木，樹身高約四十五公尺，胸高直徑達四公尺。仰看巨大的主幹，也能留意寄身樹上的黃花杜鵑與條蕨。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1339,"name":"新八景之塔山奇岩","lat":23.52972,"lng":120.78206,"cat":"scenic","desc":"塔山頂的岩峰又叫後藤岩，層次分明的岩石沿節理斷裂，形成陡峭絕壁。從奇岩上的平台可俯望阿里山溪谷，天晴時還能遠眺玉山與秀姑巒山。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1340,"name":"新八景之慈雲寺觀景","lat":23.5172,"lng":120.80769,"cat":"worship","desc":"阿里山山中的古寺建於一九一九年，興建時取意自印度佛教聖地靈鷲山。殿內奉祀的釋迦牟尼佛像外層鑄銅、內部飾以金砂，素有「千年古佛」之稱。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1341,"name":"新八景之水山巨木","lat":23.50892,"lng":120.80837,"cat":"scenic","desc":"昔日從阿里山通往東埔的水山線鐵路旁，留有一株水山巨木。樹旁闢了約三百六十公尺的自然步道，穿過濃密林蔭後便能從平台觀賞巨木。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1342,"name":"新八景之神怡流瀑","lat":23.51903,"lng":120.80746,"cat":"scenic","desc":"神怡橋跨過阿里山溪，橋下水聲不斷，溪旁古木高聳。這裡也是第二期巨木群步道的起點，沿約四百多公尺的棧道，可以接連看見十六株千年巨木。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1343,"name":"新八景之阿里山神木遺跡","lat":23.51914,"lng":120.80656,"cat":"scenic","desc":"阿里山森林鐵路沿線曾有一株高聳紅檜，與穿梭的小火車一同成為山區的代表景象。今日的神木遺跡，仍把旅人的目光帶回森林鐵路與古木相伴的歲月。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1344,"name":"新八景之香林拱橋","lat":23.51679,"lng":120.81107,"cat":"scenic","desc":"香林的拱橋跨在溪水上，兩岸綠樹遮蔭，遠處是翠綠山巒。過橋後的小徑旁有平台，從那裡回頭看，便能把拱橋與橋下流水一同收進眼底。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1345,"name":"日警官舍","lat":23.45371,"lng":120.74891,"cat":"other","desc":"這棟百年檜木別館藏在阿里山鄒族的大社裡。從前是警察官舍，如今檜木老屋仍是部落裡一處帶著歷史的建築。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1346,"name":"樹靈塔","lat":23.517493,"lng":120.808351,"cat":"history","tag":"古蹟","desc":"林業開發時期興建的石塔，用來祭慰山中被伐的樹木，也追念伐木工程的罹難者。中央圓柱前的弧形銅匾寫著「樹靈塔」，塔尖則像數層盤子相疊。","area":"阿里山鄉・嘉義縣","ph":"文"},{"id":1347,"name":"沼平(車站及公園周邊)","lat":23.51057,"lng":120.81097,"cat":"nature","desc":"沼平車站旁的開闊地闢作公園，山櫻花、大島櫻等高山植物分布其間。這裡也是祝山觀日步道的起點，附近的集材機則留下林場年代的工作痕跡。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1348,"name":"琴山河合博士旌功碑","lat":23.517008,"lng":120.808006,"cat":"history","tag":"古蹟","desc":"林學博士河合鈰太郎曾踏查阿里山，參與森林開發與林業鐵路路線的測量規劃。他過世後，山上在一九三二年立起這塊紀念碑，記錄其參與探勘的經歷。","area":"阿里山鄉・嘉義縣","ph":"文"},{"id":1349,"name":"百合廣場","lat":23.52703,"lng":120.74134,"cat":"nature","desc":"來吉部落的百合廣場坐落在綠意環繞的地方，鄰近來吉國小與行諄橋。廣場結合自然生態與部落藝文，呈現來吉聚落與山林相伴的風貌。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1350,"name":"石盤谷峭壁藝術林","lat":23.60179,"lng":120.73609,"cat":"scenic","desc":"乾坑溪上游的石盤谷瀑布旁，有一大片傾斜的天然岩壁，大小約相當於一座足球場。岩坡上方設有輔助繩索，從岩面的幅度便可感受這片峭壁的尺度。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1351,"name":"石鼓盤觀光大橋","lat":23.57527,"lng":120.74539,"cat":"scenic","desc":"九二一地震後，豐山興建這座鋼拱橋，重新接起聚落對外的道路。長一百四十公尺的橋身以提籃式鋼拱一次跨過，中間沒有落墩，輪廓從遠處就很鮮明。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1352,"name":"祝山(車站及其周邊)","lat":23.51127,"lng":120.82303,"cat":"scenic","desc":"祝山地勢突出，早在日治時期，人們便循山間步道上來等待日出。清晨站在開闊處，晨光從山頭灑落，遇上合適天候還能看見雲海填滿山谷。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1353,"name":"茶山大石壁","lat":23.30965,"lng":120.68575,"cat":"scenic","desc":"阿里山鄉南端的茶山部落，又稱珈雅瑪，境內有一大片傾斜的岩坡。這道石壁的規模在當地格外醒目，常被拿來與隙頂的韭菜坪大峭壁並提。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1354,"name":"蛟龍瀑布","lat":23.55391,"lng":120.76647,"cat":"scenic","desc":"豐山東南側的蛟龍溪流到塔山尾稜，從斷層形成的高聳岩壁向下瀉落。日治時期的手繪地圖便將它標成「大瀧」，描寫的正是這道瀑布驚人的規模。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1355,"name":"豐山大石鼓園區","lat":23.59256,"lng":120.74673,"cat":"culture","desc":"百年前土石流搬運而來的巨石，構成豐山大石鼓一帶的景觀。二〇〇一年納莉颱風又留下新的痕跡，眼前河床可以看見溪流侵蝕、搬運與堆積的結果。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1356,"name":"豐山觀景台","lat":23.5675,"lng":120.74803,"cat":"scenic","desc":"豐山往社後坪的舊路上，有一處能把聚落、山巒和溪谷一起收入眼底的平台。從附近就望得見蛟龍瀑布，雨季水勢充沛時，遠方崖面上的飛瀑特別醒目。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1357,"name":"達娜伊谷自然生態公園","lat":23.37831,"lng":120.67797,"cat":"nature","desc":"山美部落的達娜伊谷位在曾文溪上游集水區，鄒族語地名有「忘憂谷」的意思。溪谷的生態得以恢復，也與部落居民共同守護土地的努力相連。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1358,"name":"阿里山林業暨鐵道文化景觀","lat":23.435467,"lng":120.780967,"cat":"history","tag":"文化景觀","desc":"舊林場裡保留著伐木年代的遺跡與紀念物，鐵路則從平地一路進入高山。沿線聚落因林業而形成，讓這片山景也記錄了居民與森林相處的方式。","area":"阿里山鄉・嘉義縣","ph":"文"},{"id":1359,"name":"阿里山林業暨鐵道文化景觀","lat":23.537738,"lng":120.608059,"cat":"history","tag":"文化景觀","desc":"阿里山與太平山、八仙山曾並列臺灣三大官營林場。開採山林而興築的鐵道，連起山區和嘉義市區，兩端聚落的生活與產業也隨木材流動而改變。","area":"阿里山鄉・嘉義縣","ph":"文"},{"id":1360,"name":"阿里山生態教育館","lat":23.513384,"lng":120.81278,"cat":"culture","desc":"阿里山舊工作站等老建築經整建後，成為介紹自然與山林文化的展館。從鄒族與高山植物到林業往事、文學藝術，展覽從不同角度呈現人與森林的關係。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1361,"name":"阿里山香林神木","lat":23.51897,"lng":120.8098,"cat":"scenic","desc":"這株由樹幹合生的紅檜，早年被稱為「光武檜」。當時推算它可能在東漢光武帝年間萌芽，因而留下這個將老樹與歷史年代連在一起的別名。","area":"阿里山鄉・嘉義縣","ph":"觀"},{"id":1362,"name":"原鹿草庄役場","lat":23.411297,"lng":120.308511,"cat":"history","tag":"歷史建築","area":"鹿草鄉・嘉義縣","ph":"文"},{"id":1363,"name":"七堵火車(前)站","lat":25.097242,"lng":121.716059,"cat":"history","tag":"歷史建築","desc":"昔日七堵前站的木造站房，在新站啟用後保留為歷史建築。小站的屋頂把切妻與歇山兩種形式組在一起，兩側輪廓並不對稱，是最容易辨認的特色。","area":"七堵區・基隆市","ph":"文"},{"id":1364,"name":"七堵鐵道公園","lat":25.097548,"lng":121.71606,"cat":"nature","desc":"七堵舊站的木造站房與兩株老榕樹一起保存於公園，月台和軌道則重現昔日車站的樣子。抬頭細看屋脊，還能找到早年為電線絕緣而設的礙子。","area":"七堵區・基隆市","ph":"觀"},{"id":1365,"name":"大牛稠山河居","lat":25.141956,"lng":121.686779,"cat":"scenic","desc":"七堵山間的農園種有柚子、山藥與樹梅，隨作物季節安排不同農事體驗。從田間實際栽種的植物認識食物，也成了這裡推廣食農教育的方式。","area":"七堵區・基隆市","ph":"觀"},{"id":1366,"name":"富民親水公園","lat":25.134,"lng":121.673684,"cat":"nature","desc":"瑪陵坑溪畔的小公園依山而設，清澈溪面上能見到樹影，水裡也有小魚穿梭。油桐花落時，白花點綴在溪谷綠地間，和潺潺水聲一同伴著散步的人。","area":"七堵區・基隆市","ph":"觀"},{"id":1367,"name":"泰安瀑布","lat":25.070216,"lng":121.716877,"cat":"scenic","desc":"七堵的草濫山瀑布藏在林間，一段不長的步道就能抵達。沿途有茂密的樹木和涓涓細流，越靠近瀑布，便越能感受到溪谷裡的清涼水霧。","area":"七堵區・基隆市","ph":"觀"},{"id":1368,"name":"瑪西焦炭窯","lat":25.11766,"lng":121.68065,"cat":"history","desc":"七堵瑪西山裡留著用山石逐塊疊起的焦炭窯，建造時沒有使用混凝土。遠看連綿的石砌外牆像座矮城，走近窯口便能看出當年煤礦產業留下的工作場景。","area":"七堵區・基隆市","ph":"觀"},{"id":1369,"name":"瑪陵坑石頭厝","lat":25.11606,"lng":121.69513,"cat":"history","tag":"歷史建築","desc":"瑪陵坑早年參與採煤的周火生曾是這座石頭厝的主人，房舍後來由劉家住用。入口旁二層石屋與紅磚拱廊相鄰，粗厚石牆和細緻磚拱並置，頗有特色。","area":"七堵區・基隆市","ph":"文"},{"id":1370,"name":"百福公園","lat":25.08758,"lng":121.69285,"cat":"nature","desc":"七堵這片公園把運動場地和休憩綠地放在一起，是居民平常活動的地方。園內的「鷹雄船長」雕像以基隆市鳥老鷹扮作船長，把港城的航海文化也帶進公園。","area":"七堵區・基隆市","ph":"觀"},{"id":1371,"name":"翠谷橋壺穴","lat":25.110988,"lng":121.68669,"cat":"scenic","desc":"從翠谷橋往瑪陵坑溪看，溪床上的岩石分布著大小、深淺不同的圓坑。這些被稱為壺穴的地形，是溪水長年沖刷堅硬岩面，一點一滴磨出的痕跡。","area":"七堵區・基隆市","ph":"觀"},{"id":1372,"name":"中法戰役陣亡戰士紀念碑","lat":25.142953,"lng":121.745543,"cat":"history","desc":"基隆太白街上的紀念碑，追念一八八四年清法戰爭基隆之役捐軀的將士。這一方碑石留下港口歷經戰事的記憶，也是今日認識當年戰役的一處地標。","area":"中山區・基隆市","ph":"觀"},{"id":1373,"name":"仙洞巖","lat":25.14522,"lng":121.748064,"cat":"worship","tag":"文化景觀","desc":"基隆山壁上的海蝕洞，相傳曾有人在這裡得道，因此有了仙洞之名。清同治年間便有人在洞中興建佛寺，早年奉祀釋迦牟尼與觀音，留下港邊洞窟信仰的歷史。","area":"中山區・基隆市","ph":"文"},{"id":1374,"name":"仙洞隧道","lat":25.144838,"lng":121.738532,"cat":"history","tag":"歷史建築","desc":"基隆港貨運繁忙後，一九一七年開鑿隧道，讓貨運列車從車站開往西岸碼頭。臨港線停用後，洞裡拆去鐵軌、鋪上柏油，仍可看出貨車曾經穿山而過的路徑。","area":"中山區・基隆市","ph":"文"},{"id":1375,"name":"佛手洞","lat":25.145234,"lng":121.74794,"cat":"scenic","desc":"沿碎石步道走進海蝕洞，內部涼爽，石壁上還留著天然海蝕的痕跡。洞穴深處抬頭可見岩壁風化成手掌般的形狀，連指節紋理都能辨認，因而被稱為佛手。","area":"中山區・基隆市","ph":"觀"},{"id":1376,"name":"基隆地標","lat":25.135218,"lng":121.737293,"cat":"other","desc":"從基隆港邊望向虎仔山，山頂的大字拼出「KEELUNG」，是港城熟悉的地標。到了山上的觀景台，視角剛好反過來，可以俯瞰市區街景和波光閃動的港灣。","area":"中山區・基隆市","ph":"觀"},{"id":1377,"name":"基隆燈塔","lat":25.155318,"lng":121.747597,"cat":"history","tag":"古蹟","desc":"白米甕與仙洞之間，有一處伸向海面的岬角名為萬人堆鼻。日籍技師大澤正業在岬上興建燈塔，於一九〇〇年點燈，從此在基隆港西岸為來船指引方向。","area":"中山區・基隆市","ph":"文"},{"id":1378,"name":"基隆站南北號誌樓轉轍站","lat":25.1335,"lng":121.7399,"cat":"history","tag":"歷史建築","desc":"第二代基隆車站興建時，鐵路增設號誌樓、聯動裝置與轉轍設備，以指揮列車進出。南號誌樓在一九三〇年建成，留下港口鐵道依靠機械調度的歷史。","area":"中山區・基隆市","ph":"文"},{"id":1379,"name":"外木山湖海灣","lat":25.17246,"lng":121.7089,"cat":"other","desc":"外木山漁港與大武崙澳底漁村之間，沿海岸伸展著一段湖海路。漁港附近的天然海水泳場、澳底白色的人工沙灘，讓人沿岸看見兩種不同的海濱地貌。","area":"中山區・基隆市","ph":"觀"},{"id":1380,"name":"外木山漁港","lat":25.159493,"lng":121.733225,"cat":"scenic","desc":"協和莊漁港緊鄰天然灣澳，小漁村背山臨海，從岸邊可見漁船穿梭。沿外木山海岸往澳底望去，綿長海岸線仍保有礁岸與山海相接的模樣。","area":"中山區・基隆市","ph":"觀"},{"id":1381,"name":"太平山城(罾仔寮)","lat":25.134361,"lng":121.738453,"cat":"culture","desc":"基隆港西側山坡上的聚落，地方稱作「罾仔寮」，名字裡的罾是一種傳統漁具。沿著蜿蜒小徑往上走，可以從居民生活的山城望向港口與海面。","area":"中山區・基隆市","ph":"觀"},{"id":1382,"name":"建港紀念碑（基隆築港殉職者紀念碑）","lat":25.142283,"lng":121.7457,"cat":"history","tag":"歷史建築","desc":"開闢基隆港西十六號碼頭時，多名工人在工程中傷亡。為追念這些築港人，一九三〇年在球仔山上面海處立起紀念碑，讓碑身朝向他們參與建造的港灣。","area":"中山區・基隆市","ph":"文"},{"id":1383,"name":"情人湖濱海大道","lat":25.164,"lng":121.72034,"cat":"other","desc":"沿外木山漁港到澳底之間的海岸散步，一邊是山，一邊是開闊海面。濱海大道順著岸線延伸約五公里，路旁礁岩被海浪沖刷成各種形狀。","area":"中山區・基隆市","ph":"觀"},{"id":1384,"name":"木山砲台","lat":25.15927,"lng":121.72619,"cat":"history","tag":"古蹟","desc":"內木山堡壘興建於日治初期，當年是基隆防禦設施的一部分。舊堡除三處砲座外，也有兵舍與指揮所，保留了港城海防建築的歷史線索。","area":"中山區・基隆市","ph":"文"},{"id":1385,"name":"海興游泳池","lat":25.161413,"lng":121.732214,"cat":"scenic","desc":"基隆外木山海岸的天然礁石圍出一處海水泳池，夏天常有戲水的聲音。陽光將海水照亮時，沿著礁石間的縫隙望去，還能找找小螃蟹的身影。","area":"中山區・基隆市","ph":"觀"},{"id":1386,"name":"球子山燈塔","lat":25.146387,"lng":121.744215,"cat":"scenic","desc":"昔日軍事管制區內的燈塔位在球子山半山腰，隔海和基隆嶼相望。沿著平緩的坡道走近塔身，眼前便是海港與遠處穿梭不停的船隻。","area":"中山區・基隆市","ph":"觀"},{"id":1387,"name":"白米甕砲台","lat":25.15551,"lng":121.74333,"cat":"history","tag":"古蹟","desc":"立在基隆港左翼的舊砲台，曾負責港口外海的防禦。站在砲台往外看，可以飽覽港外海面，東北方不遠就是基隆嶼，也能理解此處開闊的視野。","area":"中山區・基隆市","ph":"文"},{"id":1388,"name":"高遠新村港務局局長官舍（築港出張所仙洞町官舍）","lat":25.142078,"lng":121.744847,"cat":"history","tag":"歷史建築","desc":"基隆築港期間，仙洞町一帶興建官舍，供技師與職員住宿。戰後房舍改由港務局員工使用，高遠新村的局長官舍也留下築港聚落延續下來的生活面貌。","area":"中山區・基隆市","ph":"文"},{"id":1389,"name":"1949太平輪紀念公園","lat":25.1412,"lng":121.75648,"cat":"nature","desc":"一九四九年，從上海開往基隆的太平輪在途中與貨輪相撞沉沒，許多原欲來臺避難的乘客遭逢海難。公園裡的紀念碑面向大海，記錄這段移民歷史。","area":"中正區・基隆市","ph":"觀"},{"id":1390,"name":"中正公園","lat":25.13417,"lng":121.75111,"cat":"nature","desc":"順著基隆山勢層層展開的公園，把市民的休憩綠地與宗教空間連在一起。最高處的白色觀音像是園內地標，登高後可俯望基隆市區。","area":"中正區・基隆市","ph":"觀"},{"id":1391,"name":"二沙灣砲台","lat":25.137589,"lng":121.757567,"cat":"history","tag":"古蹟","desc":"二沙灣最早的清代砲台設在山下港邊，曾經歷鴉片戰爭與清法戰爭。登上後來的山上砲台，可遠眺船隻進出基隆港，也能理解港口防禦位置的變化。","area":"中正區・基隆市","ph":"文"},{"id":1392,"name":"信二防空洞","lat":25.13281,"lng":121.74701,"cat":"history","desc":"基隆中正公園牌樓旁，可見二戰時期以人力開鑿的臨時指揮所。坑道分成東、西兩部分，內側仍露出天然岩壁，頂部高度也隨開鑿地形而起伏。","area":"中正區・基隆市","ph":"觀"},{"id":1393,"name":"八尺門","lat":25.155444,"lng":121.772741,"cat":"scenic","desc":"和平島與臺灣本島之間的狹長水道，在最窄處被稱為八尺門。白色拱形的和平橋一跨而過，水道中沒有橋墩，漁船便從橋下出入。","area":"中正區・基隆市","ph":"觀"},{"id":1394,"name":"八斗子清代官煤(主井、風坑)","lat":25.127341,"lng":121.799603,"cat":"history","tag":"歷史建築","desc":"清代在八斗子設立官營煤礦，還聘請英國技師與工匠開鑿煤井，以機械取代傳統採煤。留在當地的主井與風坑，記下臺灣早年開始採用西式採礦技術的經過。","area":"中正區・基隆市","ph":"文"},{"id":1395,"name":"北白川宮紀念碑","lat":25.13887,"lng":121.75323,"cat":"worship","tag":"歷史建築","desc":"一九三三年設立的柱狀紀念碑，記下北白川宮能久親王在基隆停駐的一段歷史。一八九五年日本領軍來臺接收之際，他曾以二沙灣的舊海關官舍作為駐地。","area":"中正區・基隆市","ph":"文"},{"id":1396,"name":"北白川宮能久親王紀念碑","lat":25.139112,"lng":121.753285,"cat":"worship","desc":"市區一隅的石碑，為紀念一八九五年曾駐紮基隆舊海關官舍的北白川宮能久親王而設。碑面以洗石子工法做出粗糙質地，原有文字如今已難以辨清。","area":"中正區・基隆市","ph":"觀"},{"id":1397,"name":"和平島地質公園","lat":25.162017,"lng":121.764477,"cat":"nature","desc":"基隆東北方的島岸經海浪侵蝕，形成方整如豆腐的岩塊與頂寬柄細的蕈狀石。園內也留有化石與西荷時期的蕃字洞，沿海岸能同時讀到地質與人文的痕跡。","area":"中正區・基隆市","ph":"觀"},{"id":1398,"name":"和平島天顯宮","lat":25.158185,"lng":121.767173,"cat":"worship","desc":"和平島山坡頂的廟宇主祀伍顯靈官大帝，廟前排列著五百多尊羅漢石雕。從這裡可面望基隆港，每年大帝千秋時，信眾還會隨著隊伍繞境。","area":"中正區・基隆市","ph":"觀"},{"id":1399,"name":"國立海洋科技博物館","lat":25.13959,"lng":121.7932,"cat":"culture","desc":"基隆海岸旁的博物館以多個展廳介紹海洋，從海洋環境到海洋科學各有主題。互動展品讓人動手探索，也讓學校與家庭能從不同角度認識海裡的生態。","area":"中正區・基隆市","ph":"觀"},{"id":1400,"name":"國立海洋科技博物館","lat":25.14054,"lng":121.79673,"cat":"culture","desc":"八斗子附近的海洋博物館把科技體驗和海洋文化放進展覽。海洋劇場以大銀幕呈現水下生態，潮境智能海洋館則用虛擬與擴增實境遊戲，讓人親身參與。","area":"中正區・基隆市","ph":"觀"},{"id":1401,"name":"基隆塔","lat":25.133036,"lng":121.746911,"cat":"other","desc":"橘色高塔的靈感來自基隆港的橋式起重機，把碼頭常見的輪廓帶進市區。走上離地約六十四公尺的空中廊道，港口、城市與周圍山海都在腳下展開。","area":"中正區・基隆市","ph":"觀"},{"id":1402,"name":"基隆嶼","lat":25.192813,"lng":121.78691,"cat":"scenic","desc":"從北海岸或基隆市區望向外海，常能看到這座小島獨立海上的輪廓。昔日的軍事管制區開放觀光後，人們也能從島上回望海天交界，近聽浪聲。","area":"中正區・基隆市","ph":"觀"},{"id":1403,"name":"基隆市原住民文化會館","lat":25.153694,"lng":121.77166,"cat":"culture","desc":"八尺門的原住民文化會館把展演、族語推廣和文物展示放在同一棟建築裡。三、四樓的故事館收藏各族文物，走到戶外則可看見廣場與吊橋景觀。","area":"中正區・基隆市","ph":"觀"},{"id":1404,"name":"基隆市政府大樓","lat":25.131671,"lng":121.744608,"cat":"history","tag":"歷史建築","desc":"市政府所在的基地，清末曾是通判署，日治時期又在此興建市役所。保存下來的廳舍於一九三二年完工，戰後仍作市府辦公之用，見證基隆地方行政的延續。","area":"中正區・基隆市","ph":"文"},{"id":1405,"name":"基隆美術館","lat":25.131254,"lng":121.74417,"cat":"culture","desc":"基隆公會堂的藝文歷史可追溯到一九〇三年，這裡後來發展成複合文化場館。除了美術館的展覽空間，還設有文物陳列室、展演中心和介紹基隆故事的咖啡館。","area":"中正區・基隆市","ph":"觀"},{"id":1406,"name":"基隆要塞司令官邸","lat":25.140437,"lng":121.758365,"cat":"history","tag":"古蹟","desc":"一九三一年建成的宅第，起初是巴士公司社長流水偉助的家。原先位在山頂的官邸遭轟炸後，軍方於戰後接收這處住宅，改為基隆要塞司令居住的地方。","area":"中正區・基隆市","ph":"文"},{"id":1407,"name":"基隆要塞司令部","lat":25.141489,"lng":121.762696,"cat":"history","tag":"古蹟","desc":"基隆要塞指揮所於一九〇三年升格為司令部，曾是日治時期北臺灣的軍事指揮中心。它管轄的範圍從基隆、淡水一路延伸到新竹、後龍等地。","area":"中正區・基隆市","ph":"文"},{"id":1408,"name":"基隆要塞司令部校官眷舍","lat":25.141084,"lng":121.75887,"cat":"history","tag":"古蹟","desc":"大沙灣一帶的舊眷舍，是日治時期隨基隆要塞司令部設置而興建的軍官住宅。當時這裡屬真砂町，留下的房舍為港區軍事建築補上日常居住的一面。","area":"中正區・基隆市","ph":"文"},{"id":1409,"name":"大沙灣石圍遺構","lat":25.141296,"lng":121.758417,"cat":"history","tag":"歷史建築","desc":"大沙灣的防禦石圍曾歷經鴉片戰爭與清法戰爭，如今留下部分牆體。下段以土夯實，外壁可見夯打痕跡，上方另疊砂岩石板，保護下方的土牆。","area":"中正區・基隆市","ph":"文"},{"id":1410,"name":"市長官邸","lat":25.144638,"lng":121.761526,"cat":"history","tag":"古蹟","desc":"基隆大沙灣這座日治時期的宅第原為松浦社宅，戰後曾作為市長官邸和市府員工宿舍。房屋隨著居住者更替而增改建，同一空間留下不同時期的使用痕跡。","area":"中正區・基隆市","ph":"文"},{"id":1411,"name":"彭佳嶼燈塔","lat":25.628988,"lng":122.075655,"cat":"history","tag":"古蹟","desc":"離島上的磚造燈塔於一九〇九年完工點燈，曾是日本與基隆間航線的重要指引。石橋絢彥設計的塔身由八角形基座轉成圓形，可見當時洋式與日式造塔技術的交會。","area":"中正區・基隆市","ph":"文"},{"id":1412,"name":"必應創造展演空間","lat":25.14081,"lng":121.75836,"cat":"culture","desc":"沙灣歷史文化園區裡的舊公車處經整修後，在二〇二四年轉為音樂與藝文展演空間。從公車工作的老場地到表演現場，港邊的歷史園區也有了新的聲音。","area":"中正區・基隆市","ph":"觀"},{"id":1413,"name":"忠烈祠","lat":25.13171,"lng":121.746935,"cat":"worship","desc":"基隆中正公園山腰曾是基隆神社所在地，戰後改建為紀念烈士的祠堂。紅色樑柱撐起飛簷翹角的宮殿式屋頂，從綠意山林與城市樓房之間就能認出。","area":"中正區・基隆市","ph":"觀"},{"id":1414,"name":"旭丘指揮所","lat":25.142923,"lng":121.762171,"cat":"history","tag":"歷史建築","desc":"旭丘山上的建物原是地方募款興建的松本紀念館，用來紀念參與基隆築港的松本虎太。二戰期間建物被徵作軍事陣地，戰後又經歷長期管制。","area":"中正區・基隆市","ph":"文"},{"id":1415,"name":"望幽谷","lat":25.146008,"lng":121.798278,"cat":"scenic","desc":"八斗子漁港旁這處舊稱大湖頂的谷地呈Ｖ字形，綠草沿兩側山坡伸向海面。白天可遠望基隆嶼，夜裡海上漁火與遠方九份的燈光則呈現另一種景色。","area":"中正區・基隆市","ph":"觀"},{"id":1416,"name":"望海巷跨海景觀橋","lat":25.138843,"lng":121.799027,"cat":"structure","desc":"八斗子沿海有一座約一百七十公尺長的景觀橋，串起車站、鐵道自行車與潮境公園。橋面可步行也可騎車，跨過海岸時，山海景色隨著腳步轉換角度。","area":"中正區・基隆市","ph":"觀"},{"id":1417,"name":"正濱漁港色彩屋","lat":25.152637,"lng":121.769105,"cat":"other","desc":"正濱漁港在日治時期興建，曾因商船進出、魚貨集散而繁盛。今日沿港排列的小屋各有顏色，成片鮮明的外牆與港內船影相映，是老漁港的新風景。","area":"中正區・基隆市","ph":"觀"},{"id":1418,"name":"民族英雄紀念碑","lat":25.141005,"lng":121.756088,"cat":"history","tag":"歷史建築","desc":"清法戰爭後，陣亡清軍原安葬在二沙灣山麓，後來因開闢道路而遭破壞。基隆士紳池清祥重新收葬遺骨，碑與墓塚留下地方悼念戰亡將士的歷史。","area":"中正區・基隆市","ph":"文"},{"id":1419,"name":"沙灣歷史文化園區","lat":25.14096,"lng":121.755986,"cat":"culture","desc":"大沙灣石圍、要塞司令官邸與校官眷舍，共同留下基隆港不同時期的軍事記憶。石圍曾歷經清法戰爭，修復後的近代官舍則設有展覽和文創空間。","area":"中正區・基隆市","ph":"觀"},{"id":1420,"name":"清法戰爭紀念園區","lat":25.1407,"lng":121.75774,"cat":"culture","tag":"古蹟","desc":"這處一八八五年設立的公墓，安葬清法戰爭中喪生的法國軍人。園內可見分屬不同年代的紀念碑與墓塚，也是基隆少數直接保留戰爭記憶的地方。","area":"中正區・基隆市","ph":"文"},{"id":1421,"name":"漁會正濱大樓","lat":25.150737,"lng":121.765505,"cat":"history","tag":"歷史建築","desc":"漁港旁的「水產館」在一九三五年落成，當時由基隆水產支會經營。隨著周邊漁業設施陸續完備，這棟辦公大樓也成了認識正濱漁港發展的地標。","area":"中正區・基隆市","ph":"文"},{"id":1422,"name":"潮境公園","lat":25.14254,"lng":121.8025,"cat":"nature","desc":"八斗子半島東側原本堆放垃圾的海邊，整理後成了面向望海巷海灣的公園。「潮境」一詞指冷暖洋流混合的海域，浮游生物繁盛時，魚群也會聚集。","area":"中正區・基隆市","ph":"觀"},{"id":1423,"name":"潮境公園","lat":25.144124,"lng":121.804714,"cat":"nature","desc":"八斗子海岸的公園背山面海，草地和裝置藝術一同面向太平洋。園名借自冷暖洋流交會的海域，散步時除了看海，也可留意沿岸孕育的海洋生態。","area":"中正區・基隆市","ph":"觀"},{"id":1424,"name":"潮境智能海洋館","lat":25.14475,"lng":121.80294,"cat":"culture","desc":"八斗子濱海的展示館用科技介紹海洋，把虛擬實境、擴增實境和感測裝置帶進展場。人在沉浸式投影裡移動、互動，能換個方式探索水下世界。","area":"中正區・基隆市","ph":"觀"},{"id":1425,"name":"碧砂漁港","lat":25.14372,"lng":121.7877,"cat":"other","desc":"八斗子觀光漁港有魚貨集散區，也有海鮮餐廳，讓人看到漁獲從港邊到餐桌的一面。港口入口的遠洋漁船「海功號」退役後停放在這裡，成了醒目的地標。","area":"中正區・基隆市","ph":"觀"},{"id":1426,"name":"社寮天后宮","lat":25.155188,"lng":121.7652,"cat":"worship","desc":"和平島居民稱這座廟為「社寮媽祖間」，早年的名稱則是大雞籠港口天后宮。廟裡主祀湄洲媽祖，閩南式建築上的雕刻和彩繪也留下沿海聚落的工藝風貌。","area":"中正區・基隆市","ph":"觀"},{"id":1427,"name":"社寮東砲台","lat":25.158509,"lng":121.772066,"cat":"history","desc":"和平島舊稱社寮，清末的海防砲台在日治時期改建，分成東、西兩座。沿步道可見蓄水池、觀測所等舊設施，也能從山頭遠望基隆嶼與和平島海岸。","area":"中正區・基隆市","ph":"觀"},{"id":1428,"name":"覺修宮","lat":25.135286,"lng":121.74856,"cat":"worship","desc":"哨船頭的老爺廟曾在戰火中損毀，戰後重建，奉祀田都元帥與釋迦牟尼佛。相傳田都元帥精通音樂戲劇，也因此有表演工作者來此祈求演出順利。","area":"中正區・基隆市","ph":"觀"},{"id":1429,"name":"阿根納造船廠遺構","lat":25.153772,"lng":121.769493,"cat":"history","tag":"歷史建築","desc":"八尺門岸邊曾是煤礦裝運碼頭與倉庫，後來租給造船廠製造遊艇和帆船。從外圍看，巨大的鋼筋混凝土骨架和斑駁牆面，仍勾勒出造船年代的廠房輪廓。","area":"中正區・基隆市","ph":"文"},{"id":1430,"name":"頂石閣砲台","lat":25.14608,"lng":121.763145,"cat":"history","tag":"歷史建築","desc":"清末的洋式砲台只留下部分殘跡，確切興建年代仍待考證。現存前後兩層磚造拱券，與劉銘傳時期其他新式砲台的做法相近，是辨認舊建築形式的線索。","area":"中正區・基隆市","ph":"文"},{"id":1431,"name":"麗都蝶客花園","lat":25.134314,"lng":121.745059,"cat":"nature","desc":"東岸旅客中心三樓的空中花園，讓人站在港邊高處看船、看市街。植栽與藝術裝置分布在觀景平台旁，從花園望出去就是基隆港的開闊水面。","area":"中正區・基隆市","ph":"觀"},{"id":1432,"name":"龍目井（和平島紅毛井）","lat":25.156992,"lng":121.770261,"cat":"history","tag":"歷史建築","desc":"和平島盤踞島北側的自然湧泉，因位在「龍仔頂」山的眼睛處而得名。十七世紀來到此地的西班牙人曾鑿井取水，後來登島的荷蘭人也在這裡汲水。","area":"中正區・基隆市","ph":"文"},{"id":1433,"name":"修竹居","lat":25.12468,"lng":121.73632,"cat":"history","tag":"古蹟","desc":"陳德成因兩子成家、住處日漸擁擠，在一九三五年於原宅旁另建三合院。屋子中央是奉祀祖先的公媽廳，家人日常居住的房間則分列在正身兩側。","area":"仁愛區・基隆市","ph":"文"},{"id":1434,"name":"國門廣場","lat":25.132186,"lng":121.74016,"cat":"nature","desc":"基隆港邊的廣場以「零點」為構想，呼應這裡曾是海路、鐵路與縱貫公路的出發點。開闊的活動空間臨著港口，到了夜晚，水舞和燈光也成為岸邊的風景。","area":"仁愛區・基隆市","ph":"觀"},{"id":1435,"name":"城隍廟","lat":25.13108,"lng":121.74036,"cat":"worship","desc":"仁愛區忠一路上的護國城隍廟，清代以來便是港都市民的信仰中心。地方相傳正殿城隍爺與清代基隆廳官員包容有關，神明形象也寄託居民對清廉與守護的期盼。","area":"仁愛區・基隆市","ph":"觀"},{"id":1436,"name":"基隆港西二西三碼頭倉庫(含空橋)","lat":25.134884,"lng":121.74121,"cat":"history","tag":"歷史建築","desc":"西岸碼頭的兩座倉庫原是日治時期築港計畫的一環，後來因客貨運量增加而陸續改建。成對倉庫與空橋記錄了基隆港逐步將旅客、貨物分流的歷程。","area":"仁愛區・基隆市","ph":"文"},{"id":1437,"name":"基隆福德宮","lat":25.128149,"lng":121.739411,"cat":"worship","desc":"仁愛市場旁的土地公廟創建於清道光年間，居民從街坊日常往來中延續香火。留意廟門和樑柱，可見長年焚香留下的深色痕跡，也是鄰里祭拜的印記。","area":"仁愛區・基隆市","ph":"觀"},{"id":1438,"name":"奠濟宮","lat":25.12817,"lng":121.74297,"cat":"worship","desc":"基隆廟口夜市的攤商街區，是在這座開漳聖王廟周邊慢慢發展起來的。廟宇始建於清同治年間，奉祀唐代陳元光將軍，至今仍是居民熟悉的信仰中心。","area":"仁愛區・基隆市","ph":"觀"},{"id":1439,"name":"慶安宮","lat":25.129666,"lng":121.74062,"cat":"worship","desc":"基隆人熟悉的媽祖廟，最初於清乾隆年間在牛稠港建立，後來遷到市區街角。廟宇跟著港城發展，也一直是漁民出海前祈求平安的地方。","area":"仁愛區・基隆市","ph":"觀"},{"id":1440,"name":"槓子寮砲台","lat":25.14391,"lng":121.78189,"cat":"history","desc":"基隆東側高地的舊砲台，曾和牛稠嶺砲台一同守護八斗子外港。留存的砲座、兵舍和觀測區記錄海防歷史，登高還能遠望和平島、基隆嶼與鼻頭角。","area":"仁愛區・基隆市","ph":"觀"},{"id":1441,"name":"海洋廣場","lat":25.13114,"lng":121.74079,"cat":"nature","desc":"市區與港口相接的廣場設有親水步道和觀景平台，站在岸邊就能看大小船隻進出。抬頭望向對面山頂，拼出基隆英文地名的大字也在視野裡。","area":"仁愛區・基隆市","ph":"觀"},{"id":1442,"name":"海港大樓","lat":25.132979,"lng":121.74038,"cat":"history","tag":"歷史建築","desc":"基隆港合同廳舍由技師鈴置良一設計，將海關、水上警察、港務及郵務等單位集中在一起。戰後大樓由港務局接收，延續了在港邊處理航運事務的用途。","area":"仁愛區・基隆市","ph":"文"},{"id":1443,"name":"獅球嶺砲台","lat":25.12109,"lng":121.73438,"cat":"history","tag":"古蹟","desc":"基隆港南方的山丘曾設砲台，清代用來守住通往臺北盆地的孔道。從這處靠近市中心的高地，眼前可見高速公路穿出隧道，遠處則是基隆市街。","area":"仁愛區・基隆市","ph":"文"},{"id":1444,"name":"許梓桑古厝","lat":25.127428,"lng":121.744206,"cat":"history","tag":"歷史建築","desc":"曾任基隆區長、也喜愛吟詩的許梓桑，在玉田里山腰建起慶餘堂。這座兩層樓三合院結合漢式與巴洛克裝飾，殘存牆面上仍看得到竹節造型的圓窗。","area":"仁愛區・基隆市","ph":"文"},{"id":1445,"name":"陽明海洋文化藝術館","lat":25.132811,"lng":121.740707,"cat":"culture","desc":"一九一五年落成的日本郵船基隆出張所，是今日海洋文化藝術館的前身。戰後曾由招商局使用，如今改以展覽介紹海運知識，也讓人認識港口工作者的日常。","area":"仁愛區・基隆市","ph":"觀"},{"id":1446,"name":"陽明海運","lat":25.132655,"lng":121.740097,"cat":"history","tag":"歷史建築","desc":"日本郵船當年在基隆興建的辦事處，由技師森山松之助和井手薰共同設計。這棟一九一五年落成的港邊建築，後來成為陽明海洋文化藝術館的館舍。","area":"仁愛區・基隆市","ph":"文"},{"id":1447,"name":"佛光山極樂寺","lat":25.131,"lng":121.74728,"cat":"worship","desc":"田寮河畔的道場背靠中正公園，在基隆行政與文教區之間兼辦宗教、文化和藝術活動。寺內既有信眾弘法共修的空間，也把社會教育帶進城市生活。","area":"信義區・基隆市","ph":"觀"},{"id":1448,"name":"大佛禪寺","lat":25.133267,"lng":121.751438,"cat":"worship","desc":"中正公園內的禪寺主祀觀音菩薩，醒目的彌勒佛像則帶著笑容迎人。高大的佛身周圍環繞五位童子，讓這座山中寺院多了歡喜與圓滿的意象。","area":"信義區・基隆市","ph":"觀"},{"id":1449,"name":"天外天復育公園","lat":25.12187,"lng":121.77707,"cat":"nature","desc":"基隆舊垃圾掩埋場封場後經過六年復育，成為供市民親近山林的環保公園。地面重新種下多種植物，也逐漸吸引動物回來，呈現土地轉變後的生態。","area":"信義區・基隆市","ph":"觀"},{"id":1450,"name":"希望之丘","lat":25.131599,"lng":121.748978,"cat":"nature","desc":"中正公園裡的共融遊戲場，保留早年大象遊具的意象，並沿山勢安排磨石子溜滑梯。三層樓高的遊戲塔、溜冰場與生態步道，讓孩子有多種探索方式。","area":"信義區・基隆市","ph":"觀"},{"id":1451,"name":"月眉山靈泉禪寺","lat":25.11604,"lng":121.76398,"cat":"worship","desc":"月眉山腰的禪寺四面環山，殿堂掩映在綠意之間。這座日治時期創建的寺院，是北臺灣佛教發展的重要據點，曾有「北台首剎」的稱呼。","area":"信義區・基隆市","ph":"觀"},{"id":1452,"name":"槓仔寮砲台","lat":25.144621,"lng":121.779959,"cat":"history","tag":"古蹟","desc":"信義區山頂留有日治初期興建的新式砲台，當時用來瞭望八斗子海面。由於早年往來不便，遺構受到的干擾較少，後來整理時仍保有相當完整的格局。","area":"信義區・基隆市","ph":"文"},{"id":1453,"name":"阿姆斯脫朗砲","lat":25.13498,"lng":121.75907,"cat":"history","desc":"役政公園裡保存著英國製造的清代大砲，從劉銘傳擔任巡撫的年代一路留存至今。長逾五公尺、重約十二公噸的砲身，是港城海防歷史留下的實物。","area":"信義區・基隆市","ph":"觀"},{"id":1454,"name":"靈泉禪寺佛殿","lat":25.116082,"lng":121.763872,"cat":"worship","tag":"歷史建築","desc":"月眉山派佛教在靈泉禪寺發展，寺院佛殿也在善慧和尚與地方信眾支持下完成。磚木混合的殿身採抬樑構架，前簷深而高、後簷略低，形成前後不同的層次。","area":"信義區・基隆市","ph":"文"},{"id":1455,"name":"靈泉禪寺開山堂","lat":25.115339,"lng":121.76247,"cat":"worship","tag":"歷史建築","desc":"背山環水的開山堂，是月眉山靈泉禪寺裡一棟兩層磚造洋樓。從東側正門往兩旁看，四周迴廊把建物圍起，保留日治時期涼臺式建築的樣貌。","area":"信義區・基隆市","ph":"文"},{"id":1456,"name":"劉銘傳隧道","lat":25.12552,"lng":121.73193,"cat":"history","tag":"古蹟","desc":"獅球嶺的清代鐵道隧道從南、北兩端同時開挖，曾因高度有落差而調整才順利接合。南口上方還留著劉銘傳所題的「曠宇天開」四字。","area":"安樂區・基隆市","ph":"文"},{"id":1457,"name":"十方大覺寺","lat":25.13072,"lng":121.72801,"cat":"worship","desc":"安樂區山坡頂的寺院依地形而建，從高處能望見基隆港。寺內沿用傳統園林格局，天王殿等殿堂分布在天井四周，形成城市邊緣一處清幽山寺。","area":"安樂區・基隆市","ph":"觀"},{"id":1458,"name":"大武崙澳底漁港","lat":25.166844,"lng":121.707664,"cat":"scenic","desc":"基隆澳底的漁村旁，港灣和彎月形沙灘緊緊相鄰。金色細沙沿著水面彎出弧線，兩側還有礁岩與松林，從清晨到傍晚都能看見海岸光線的變化。","area":"安樂區・基隆市","ph":"觀"},{"id":1459,"name":"大武崙砲台","lat":25.15676,"lng":121.7056,"cat":"history","desc":"情人湖附近的大武崙山頂，留有曾兼顧海防與陸防的舊砲台。沿入口通道可辨出營房、砲盤與稜堡外垣，遠處則能看見瑪鋉溪及大武崙澳海面。","area":"安樂區・基隆市","ph":"觀"},{"id":1460,"name":"大武崙砲台","lat":25.158625,"lng":121.70905,"cat":"history","tag":"古蹟","desc":"大武崙扼住基隆與淡水間的水陸孔道，鴉片戰爭時已有清軍駐守，清法戰爭期間也曾設隘。登上山頂砲台，才能同時看清山路與海灣的相對位置。","area":"安樂區・基隆市","ph":"文"},{"id":1461,"name":"情人湖公園","lat":25.14939,"lng":121.7083,"cat":"nature","desc":"六條山澗在大武崙山腰交會，匯成原名「五叉碑」的高地湖泊。環湖林木茂密，春夏間在翠綠水面旁散步，常有蟲鳴、鳥叫和彩蝶相伴。","area":"安樂區・基隆市","ph":"觀"},{"id":1462,"name":"情人湖公園","lat":25.1569,"lng":121.70613,"cat":"nature","desc":"大武崙山腰的湖面分成兩片相連的水域，模樣像一對情人相依。園內有兩條不同路線的步道，可以貼近湖畔看水色，也能走進周邊山林。","area":"安樂區・基隆市","ph":"觀"},{"id":1463,"name":"老大公廟","lat":25.12925,"lng":121.73308,"cat":"worship","desc":"基隆人將清代漳泉械鬥中喪生的人尊稱為老大公，並在廟中共同祭祀。每年的中元祭由開龕門揭幕，到關龕門告一段落，也延續地方化解往日仇怨的心意。","area":"安樂區・基隆市","ph":"觀"},{"id":1464,"name":"拉波波村","lat":25.07762,"lng":121.755058,"cat":"other","desc":"溪流環繞的露營園地，以南法村莊為命名靈感，把童趣帶進基隆山林。水邊與林間有豐富生態，運氣好時，還能看見臺灣藍鵲在樹梢間來往。","area":"暖暖區・基隆市","ph":"觀"},{"id":1465,"name":"暖暖安德宮","lat":25.10231,"lng":121.73863,"cat":"worship","desc":"暖暖的百年老廟主祀媽祖，廟門上一對以木頭雕成的老門神是難得一見的作品。廟對面另有古今名人碑林，記錄地方文風與人物故事。","area":"暖暖區・基隆市","ph":"觀"},{"id":1466,"name":"暖暖淨水場八角井樓","lat":25.096335,"lng":121.732646,"cat":"history","tag":"歷史建築","desc":"暖暖水道順著坡地高低安排淨水設施，井樓裡的水閥負責分水。紅磚砌成八角形，七面開窗，一面設拱形入口，上下兩道白色洗石子襯出井樓輪廓。","area":"暖暖區・基隆市","ph":"文"},{"id":1467,"name":"暖暖淨水場幫浦間","lat":25.096486,"lng":121.733772,"cat":"history","tag":"歷史建築","desc":"東、西勢溪交會處的抽水機房，是基隆早年水道設施的一部分。機房與水庫、沉澱池及慢濾池共同供應港區市民和船舶所需的用水，留下港城發展的基礎。","area":"暖暖區・基隆市","ph":"文"},{"id":1468,"name":"暖暖淨水廠百年幫浦間","lat":25.09787,"lng":121.73347,"cat":"history","desc":"西勢溪上游的水源地曾支撐基隆最早的供水系統，幫浦間就是把水送入市區的重要設施。建物保留日治時期的紅磚構造，在溪畔仍可辨認早期淨水工程的面貌。","area":"暖暖區・基隆市","ph":"觀"},{"id":1469,"name":"暖暖親水公園","lat":25.100967,"lng":121.735704,"cat":"nature","desc":"雙龍橋與水源橋之間的公園順溪伸展，沿岸以生態工法改善護岸，也留下不同生物棲息的空間。約四公里的帶狀綠地，伴著居民散步、戲水與觀賞溪景。","area":"暖暖區・基隆市","ph":"觀"},{"id":1470,"name":"暖暖運動公園","lat":25.094933,"lng":121.742954,"cat":"nature","desc":"東碇路一帶的運動公園有開闊綠地與各式運動設施，居民能在山景間活動身體。跨過景觀吊橋就能連到對面的暖東苗圃，將兩處休憩空間串在一起。","area":"暖暖區・基隆市","ph":"觀"},{"id":1471,"name":"雙生土地公廟","lat":25.095846,"lng":121.733921,"cat":"worship","desc":"暖暖水源路巷內的小廟，同時奉祀兩尊土地公。地方信仰中，兩位神明分別照看不同方位與族群，共同守護居民，也讓這裡成為街坊日常祈願的地方。","area":"暖暖區・基隆市","ph":"觀"},{"id":1472,"name":"黃蠟石文化館","lat":25.10486,"lng":121.73869,"cat":"culture","desc":"市府以前的單身宿舍，後來成為介紹暖暖地質的文化館。館內用實物呈現當地的黃蠟石，也以模型解說溪流壺穴，讓人能從一塊石頭看到整片地景。","area":"暖暖區・基隆市","ph":"觀"},{"id":1473,"name":"太平山林鐵舊天送埤車站","lat":24.662485,"lng":121.619698,"cat":"history","tag":"歷史建築","desc":"太平山採伐的紅檜、扁柏，早年仰賴羅東森林鐵路運下山。這座一九二四年竣工的車站位在沿線中段，保留了從土場到竹林之間的運材記憶。","area":"三星鄉・宜蘭縣","ph":"文"},{"id":1474,"name":"宜蘭叭哩沙支廳廳舍","lat":24.666449,"lng":121.651978,"cat":"history","tag":"歷史建築","desc":"三星的舊警務廳舍留下油印室與總機室，曾分別用來印文件和轉接警用電話。屋前的木構簷廊遮雨，木製上下推拉窗與雨淋板則保留了老建築的細節。","area":"三星鄉・宜蘭縣","ph":"文"},{"id":1475,"name":"中興文化創意園區","lat":24.69515,"lng":121.7711,"cat":"culture","desc":"宜蘭的舊紙廠早期把甘蔗渣、芒草製成紙漿，主要生產新聞紙，也製造其他文化與工業用紙。造紙業留下的廠地，後來發展成今天的文化創意園區。","area":"五結鄉・宜蘭縣","ph":"觀"},{"id":1476,"name":"中興紙廠四結廠區歷史建築群","lat":24.69446,"lng":121.771342,"cat":"history","tag":"歷史建築","desc":"四結的工業建築群源自二結糖廠利用蔗渣製紙的事業，後在日治時期擴建為羅東廠區。大型廠房仍保留完整的製紙產業脈絡，見證宜蘭從糖業延伸出的造紙歷史。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1477,"name":"二結圳","lat":24.706018,"lng":121.772117,"cat":"history","tag":"文化景觀","desc":"溪水引入大二結地區後，除了灌溉農田，也供沿岸居民洗衣、育苗和放牛。兩岸以圓石砌起護堤，孩子下水抓蝦、摸蜆的記憶也都留在這條水圳裡。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1478,"name":"二結王公廟","lat":24.708205,"lng":121.768823,"cat":"worship","tag":"歷史建築","desc":"古公三王的香火早年隨居民來到二結，後來的閩南式廟宇曾由社區千人合力搬移。舊廟成為二結庄生活文化館，仍看得到精雕的樑柱和過往祭典的器物。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1479,"name":"二結紙廠殉職碑","lat":24.701364,"lng":121.765136,"cat":"history","tag":"古蹟","desc":"二結糖廠以蔗渣造紙的往事，也留下紀念殉職員工的石碑。穿過兩座石燈籠之間的小徑，可見方柱形碑身，側面刻下十三位員工的姓名、年齡與籍貫。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1480,"name":"二結農會穀倉","lat":24.705258,"lng":121.774858,"cat":"history","tag":"古蹟","desc":"蘭陽多雨，為維持稻穀品質，當地農業組合在二結興建大型磚造穀倉。倉庫和碾米場彼此配合，附近的水圳、稻田與車站也連成昔日農家生活的一部分。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1481,"name":"冬山河親水公園","lat":24.67299,"lng":121.81581,"cat":"nature","desc":"公園依著冬山河設置親水空間，池形取自蘭陽溪流蜿蜒的線條。沿岸小石牆和水裡的大白石，分別象徵竹籬與悠游的鴨子，描繪宜蘭養鴨人家的生活。","area":"五結鄉・宜蘭縣","ph":"觀"},{"id":1482,"name":"利澤國際偶戲藝術村","lat":24.66774,"lng":121.82344,"cat":"culture","desc":"五結利澤的藝術村以當代偶戲為主題，由無獨有偶工作室劇團帶入多年創作經驗。戲偶在這裡既是展演的主角，也是工作坊、教育活動和國際交流的起點。","area":"五結鄉・宜蘭縣","ph":"觀"},{"id":1483,"name":"利澤簡廣惠宮","lat":24.666532,"lng":121.823979,"cat":"worship","tag":"古蹟","desc":"利澤簡這座清代老廟歷經多次修建，留下宜蘭地方樸素的磚木風格。燕尾屋脊上有雙龍拜塔，飛禽走獸與四季花草的剪黏，則沿著屋頂曲線點綴其間。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1484,"name":"利澤簡永安宮","lat":24.666595,"lng":121.823152,"cat":"worship","tag":"古蹟","desc":"清代興建永安宮時，建材與工匠都從唐山而來。百年後再度重建，地方改選南澳的肖楠和樟木，延請宜蘭匠師陳銀生等人施作，奠定今日廟宇格局。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1485,"name":"四結基督長老教會","lat":24.696607,"lng":121.769768,"cat":"worship","tag":"歷史建築","desc":"四結教會創設於一九五四年，後由建築師劉明國設計現有禮拜堂。建築將禮拜空間與梯塔併在一起，梯塔既能通往屋頂，外觀也帶有教堂鐘樓的意象。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1486,"name":"大二結社區（二結穀倉稻農文化館）","lat":24.70517,"lng":121.77467,"cat":"culture","desc":"大二結聚落由蘭陽溪畔的渡口發展而來，地方產業從稻作延伸到紙廠。二結穀倉與王公廟等文化空間，讓居民能從農事與祭典重訪三個村落共同的生活記憶。","area":"五結鄉・宜蘭縣","ph":"觀"},{"id":1487,"name":"大埔永安石板橋","lat":24.680519,"lng":121.813524,"cat":"history","tag":"古蹟","desc":"五結成安宮旁的石板橋建於清光緒年間，是通蘭古道南段留下的舊橋。當年羅東與利澤簡之間的大埔庄為水陸交會處，行旅便在這一帶往來。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1488,"name":"宜蘭傳藝園區","lat":24.68563,"lng":121.82409,"cat":"culture","desc":"冬山河畔的傳藝園區以臺灣早期民間聚落為藍本，將傳統工法融入建築群。走在院落與街屋之間，能從房舍的排列與外觀，感受昔日鄉村和民俗生活的空間尺度。","area":"五結鄉・宜蘭縣","ph":"觀"},{"id":1489,"name":"慈林紀念館","lat":24.708324,"lng":121.771198,"cat":"culture","tag":"歷史建築","desc":"林義雄的舊宅保留清水磚牆、檜木隔間與閩南紅瓦屋頂。老屋後來改為紀念館，悼念在一九八〇年林宅血案中喪生的母親林游阿妹，以及雙胞胎女兒亮均、亭均。","area":"五結鄉・宜蘭縣","ph":"文"},{"id":1490,"name":"清水大閘門","lat":24.6923,"lng":121.83178,"cat":"other","desc":"冬山河下游的下清水，是溪流走向出海口時地勢最低窪的一帶。這座閘門另稱五結防潮閘門，坐落在河水將要入海的位置，也成了五結沿河的地標。","area":"五結鄉・宜蘭縣","ph":"觀"},{"id":1491,"name":"仁山植物園","lat":24.62538,"lng":121.75933,"cat":"nature","desc":"冬山新寮溪畔的園地原是中山苗圃，早期專門培育造林樹苗。隨著林業與保育需求轉變，這裡逐步改為植物園，讓森林教育與踏青健行共用同一片綠地。","area":"冬山鄉・宜蘭縣","ph":"觀"},{"id":1492,"name":"冬山三奇美徑 (宜蘭伯朗大道)","lat":24.6455,"lng":121.81445,"cat":"other","desc":"冬山三奇村的田間小路，在大片稻田裡接連轉過九道彎。這段約兩公里的農路從奉尊宮附近延伸，因為開闊田野中蜿蜒的曲線，有了「宜蘭伯朗大道」的別名。","area":"冬山鄉・宜蘭縣","ph":"觀"},{"id":1493,"name":"冬山河生態綠舟(冬山河森林公園)","lat":24.6388,"lng":121.78853,"cat":"nature","desc":"冬山河中上游的自然公園，保留了原生林地和水域，也將河流與藝術做為園區主題。散步時能從林間走到水邊，看看不同棲地如何在河岸相接。","area":"冬山鄉・宜蘭縣","ph":"觀"},{"id":1494,"name":"冬瓜山橋","lat":24.635129,"lng":121.78817,"cat":"history","tag":"歷史建築","desc":"一九三〇年建成的橋以鋼筋混凝土樑柱支撐，橋墩下疊了石塊，減少水流沖刷。過橋時可留意一格接一格的拱形護欄，以及兩端圓形的橋頭柱。","area":"冬山鄉・宜蘭縣","ph":"文"},{"id":1495,"name":"奉尊宮","lat":24.64487,"lng":121.81296,"cat":"worship","desc":"三奇美徑入口的廟前廣場，正對蘭陽平原大片稻田。站在廣場望出去，蜿蜒農路在稻浪裡轉過一道道彎，清晨還有機會遇見山間薄霧。","area":"冬山鄉・宜蘭縣","ph":"觀"},{"id":1496,"name":"舊冬山鄉公所","lat":24.634562,"lng":121.792315,"cat":"history","tag":"歷史建築","desc":"八角形門廊位在老廳舍正中央，這裡原是日治時期的冬山庄役場。戰後增建的二樓延續一樓的長方窗與洗石子外牆。","area":"冬山鄉・宜蘭縣","ph":"文"},{"id":1497,"name":"道教總廟三清宮","lat":24.63948,"lng":121.73175,"cat":"worship","desc":"冬山梅花湖風景區的山腰上，坐落著道教總廟三清宮。廟宇所在位置比環湖道路高，沿湖畔步行往山腰，便將梅花湖和山間廟宇連在同一段行程裡。","area":"冬山鄉・宜蘭縣","ph":"觀"},{"id":1498,"name":"南澳生態教育館","lat":24.467998,"lng":121.793697,"cat":"culture","desc":"南澳工作站搬到這片樟樹造林地後，將戶外規劃為原生植物標本園，並在主建築旁設置展館。室內介紹森林資源利用與保育，戶外則能接著認識原生植物。","area":"南澳鄉・宜蘭縣","ph":"觀"},{"id":1499,"name":"東岳湧泉","lat":24.52494,"lng":121.82981,"cat":"other","desc":"北迴鐵路雙軌工程意外挖出地下水脈，後來整理成東澳國小附近的湧泉公園。清澈泉水全年約十四至十六度，即使夏日炎熱，水裡仍帶著涼意。","area":"南澳鄉・宜蘭縣","ph":"觀"},{"id":1500,"name":"粉鳥林","lat":24.49731,"lng":121.8415,"cat":"scenic","desc":"東澳灣最南端的小漁港，以湛藍海水和陡峭岩岸為背景。早年港邊常有野鴿群聚，在地人便取臺語「粉鳥」為名，留下粉鳥林這個海岸地名。","area":"南澳鄉・宜蘭縣","ph":"觀"},{"id":1501,"name":"員山周振東武舉人宅","lat":24.750505,"lng":121.701125,"cat":"history","tag":"古蹟","desc":"周振東在清同治年間考中武舉人，之後選在員山五十溪邊興建宅第。兩進四護龍的合院外有圍牆，後方仍保留部分二層銃櫃，留下清代民宅防禦的痕跡。","area":"員山鄉・宜蘭縣","ph":"文"},{"id":1502,"name":"員山結頭份大樹公","lat":24.759721,"lng":121.719623,"cat":"history","tag":"文化景觀","desc":"結頭份居民口中的大樹公，是臺灣原生的茄苳。舊照片可見第一代老樹濃密的枝葉，一九八七年颱風將它吹倒，今日所見則是經過復育的第二代樹木。","area":"員山鄉・宜蘭縣","ph":"文"},{"id":1503,"name":"宜蘭酒廠阿蘭城集水井","lat":24.768069,"lng":121.727168,"cat":"history","tag":"古蹟","desc":"阿蘭城水源品質良好，日治時期宜蘭的製酒工場為此在這裡設計集水設施。集水井仍留有鋼筋混凝土頂板，井緣一圈紅磚清楚區分井身與四周地面。","area":"員山鄉・宜蘭縣","ph":"文"},{"id":1504,"name":"望龍埤","lat":24.77439,"lng":121.6988,"cat":"scenic","desc":"員山枕山村三面環山的狹長湖泊，又叫軟埤，相傳是山洪沖積而成。湖水高低隨雨量改變，地方便借「雲從龍」為埤命名，寄託對充沛雨水的期盼。","area":"員山鄉・宜蘭縣","ph":"觀"},{"id":1505,"name":"深溝水源地","lat":24.720702,"lng":121.705793,"cat":"history","tag":"文化景觀","desc":"蘭陽平原上的深溝水源地保有濕地生態，淨水場利用濕地系統處理水質。隨著宜蘭自來水需求和設施改變，這裡也成為認識水資源與在地生態的教育場所。","area":"員山鄉・宜蘭縣","ph":"文"},{"id":1506,"name":"福山植物園","lat":24.75994,"lng":121.58475,"cat":"nature","desc":"烏來與員山交界的國有森林，自一九八六年起籌設福山試驗林。植物園位於這片自然資源豐富的山區，將林地本身作為認識植物與山林的場域。","area":"員山鄉・宜蘭縣","ph":"觀"},{"id":1507,"name":"蜊埤湖","lat":24.75531,"lng":121.69719,"cat":"scenic","desc":"員山福園旁的湖面，從高處看形似一隻張開殼的蛤蜊，因此有了蜊埤湖的名字。湖上還架著一座追思橋，與這片湖水一同構成福園旁的景象。","area":"員山鄉・宜蘭縣","ph":"觀"},{"id":1508,"name":"壯圍二戰時期海岸防禦陣地群","lat":24.795322,"lng":121.817905,"cat":"history","tag":"古蹟","desc":"二戰末期，日軍為防衛蘭陽平原，在壯圍海岸一帶設下多處陣地。戰後初期仍由國軍接續使用，這些遺跡也留下不同年代海岸防衛的歷史。","area":"壯圍鄉・宜蘭縣","ph":"文"},{"id":1509,"name":"壯圍沙丘生態園區","lat":24.74386,"lng":121.8165,"cat":"culture","desc":"黃聲遠設計的園區把空間留給谷地，讓沙丘本身成為視線焦點。沙穴般的建築與宜蘭海岸地形相呼應，走在其中，一側是鄉村田野，旁邊還有池水映景。","area":"壯圍鄉・宜蘭縣","ph":"觀"},{"id":1510,"name":"壯圍鄉游氏家廟追遠堂","lat":24.747187,"lng":121.801186,"cat":"worship","tag":"古蹟","desc":"壯圍游氏家族以追念先人德澤之意為家廟取名，地方也稱它為六結追遠堂。正立面可見匠師顏金鐘所繪燒的彩瓷，木構架上的雕刻與彩繪也留存下來。","area":"壯圍鄉・宜蘭縣","ph":"文"},{"id":1511,"name":"大福觀海旭日平台","lat":24.80309,"lng":121.8181,"cat":"other","desc":"壯圍大福海邊的平台背靠樹林，正對龜山島，是欣賞「龜山朝日」的地方。沿著濱海自行車道經過，也可以在這裡停下來看海，回望岸上的自然林蔭。","area":"壯圍鄉・宜蘭縣","ph":"觀"},{"id":1512,"name":"東港榕樹公園","lat":24.71719,"lng":121.82699,"cat":"nature","desc":"宜蘭河與蘭陽溪出海口旁，東港碼頭附近的公園種著兩排老榕樹。十多棵榕樹的枝葉相互搭接，像一座天然涼亭，將漁港邊的休息空間罩在樹蔭下。","area":"壯圍鄉・宜蘭縣","ph":"觀"},{"id":1513,"name":"永鎮海濱公園","lat":24.77581,"lng":121.81769,"cat":"nature","desc":"永鎮廟後方就是壯圍沿海的公園，入口的大樹下聚著當地飲料和小吃攤。從廟宇走到海邊的這段空間，也把沿岸遊憩和村裡的日常生活接在一起。","area":"壯圍鄉・宜蘭縣","ph":"觀"},{"id":1514,"name":"永鎮濱海驛站","lat":24.77547,"lng":121.8158,"cat":"other","desc":"壯圍海岸的驛站位在永鎮濱海遊憩區，是沿海自行車道上的休息點。面朝海面停下腳步，可以等候日光從龜山島方向升起，欣賞蘭陽的「龜山朝日」。","area":"壯圍鄉・宜蘭縣","ph":"觀"},{"id":1515,"name":"蘭陽溪口","lat":24.71819,"lng":121.8314,"cat":"other","desc":"宜蘭河、冬山河與蘭陽溪在東港附近會合，沖積出的沙丘和沼澤成了河口的特色。這裡可見鰻苗等魚類，也有水鳥停留，適合帶望遠鏡觀察。","area":"壯圍鄉・宜蘭縣","ph":"觀"},{"id":1516,"name":"原太平山俱樂部","lat":24.492345,"lng":121.536542,"cat":"history","tag":"歷史建築","desc":"一九三七年興建的兩層日式檜木樓，曾是太平山俱樂部，戰後改作招待所。修建成文史館後，樓內陳列林場使用的器具，以及山區開發沿革的資料。","area":"大同鄉・宜蘭縣","ph":"文"},{"id":1517,"name":"太平山蹦蹦車","lat":24.493176,"lng":121.53583,"cat":"scenic","desc":"開放式車廂沿昔日太平山森林鐵路茂興線前行，穿過巨木遮蔭的三公里山路。到了茂興站，還可沿森林步道散步，在原生蕨類園繼續認識林下植物。","area":"大同鄉・宜蘭縣","ph":"觀"},{"id":1518,"name":"太平山鎮安宮","lat":24.493692,"lng":121.534903,"cat":"worship","tag":"歷史建築","desc":"太平山莊中央階梯的高處，有一座迎向朝陽的廟宇，海拔約一千九百五十公尺。它的前身與日治時期的加羅山神社相連，老林場也曾為神社舉行祭典與運動會。","area":"大同鄉・宜蘭縣","ph":"文"},{"id":1519,"name":"寒溪吊橋","lat":24.61216,"lng":121.68772,"cat":"scenic","desc":"吊橋橫跨番社坑溪上游，將寒溪部落與華興社區一帶聯繫起來。從橋身下方流過的溪水，也點出了這座橋在兩岸居民日常往來中的位置。","area":"大同鄉・宜蘭縣","ph":"觀"},{"id":1520,"name":"寒溪神社遺跡","lat":24.608864,"lng":121.687368,"cat":"history","tag":"古蹟","desc":"日治時期，殖民政府在原住民族部落設置神社，寒溪祠便是其中一處。這類規模較小的祠常由當地警察兼任神職，遺跡也記錄了當時部落承受的治理方式。","area":"大同鄉・宜蘭縣","ph":"文"},{"id":1521,"name":"清水地熱公園","lat":24.61181,"lng":121.63657,"cat":"nature","desc":"大同鄉清水村南側有一片以地熱為名的公園，位在清水溪谷之中。這處溪谷與長埤湖相距不遠，是宜蘭山區兩種相鄰的水岸景觀。","area":"大同鄉・宜蘭縣","ph":"觀"},{"id":1522,"name":"副總統陳公手植紀念圃","lat":24.754736,"lng":121.751016,"cat":"history","tag":"歷史建築","desc":"一九五四年，陳誠到宜蘭視察造林計畫，在縣政府親手種下一株龍柏。紀念圃內另植有縣樹臺灣欒樹，一旁混凝土碑柱上的字跡已略見風化。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1523,"name":"化龍一村眷舍群","lat":24.756581,"lng":121.750006,"cat":"history","tag":"歷史建築","desc":"這片眷舍所在的土地從清代武營、日治時期練兵場，到二戰時改作野戰醫院。周圍留下的日式房舍，當年供醫官、護理人員住宿，也用於存放物品。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1524,"name":"南機場八角塔台","lat":24.732158,"lng":121.751101,"cat":"history","tag":"歷史建築","desc":"宜蘭南機場的舊塔台呈八角形，推測是二戰期間為引導軍機起降所建。從外面看似有三層，走近辨認，上方其實是有屋頂、四周半開放的觀測台。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1525,"name":"南機場風向帶","lat":24.729022,"lng":121.752434,"cat":"history","tag":"古蹟","desc":"南機場早年使用的風向設施，是一棟厚磚牆圍成的小型方屋，牆上留著長形窗。混凝土屋頂鋪土，原有木桿懸掛風向旗，為起降飛機提供天候資訊。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1526,"name":"南門外石砌牆","lat":24.755274,"lng":121.750159,"cat":"history","tag":"歷史建築","desc":"宜蘭南門外舊稱「石頭城」，清代曾設練兵場，石牆至少在日治時期的照片中已可辨認。兩層黑色頁岩以人字形疊砌，頂部再平鋪收邊，可能是練兵場留下的城牆。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1527,"name":"南門外防空壕","lat":24.754763,"lng":121.750971,"cat":"history","tag":"歷史建築","desc":"日治末期因應太平洋戰爭，宜蘭南門外興建了供官員避難的防空壕。今天保留下來的磚拱構造，記下當時城市在空襲威脅下準備避難空間的歷史。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1528,"name":"台灣戲劇館","lat":24.75487,"lng":121.75175,"cat":"culture","desc":"宜蘭在一九九〇年設立戲劇館，收藏臺灣傳統戲劇的歷史資料。從歌仔戲到布袋戲、皮影戲，各種民間表演都在館內留下可供認識和研究的紀錄。","area":"宜蘭市・宜蘭縣"},{"id":1529,"name":"台鐵宜蘭工務段舊木工房","lat":24.753567,"lng":121.757222,"cat":"history","tag":"歷史建築","desc":"宜蘭鐵路通車前後，工務段便設置木工房，一九一八年建成的房舍後來正式啟用。木構架與室內工作區的格局保留下來，讓人看見鐵路日常維護的另一面。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1530,"name":"台鐵宜蘭工務段舊鐵匠房","lat":24.753453,"lng":121.757172,"cat":"history","tag":"歷史建築","desc":"鐵匠房的工作區仍有磚砌爐灶和排煙管，外頭並設水槽。抬頭能看見屋頂中央特別架高的天窗，既為日式木屋引入光線，也讓打鐵產生的熱氣向上排出。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1531,"name":"台鐵宜蘭工務段辦公室","lat":24.754022,"lng":121.757664,"cat":"history","tag":"歷史建築","desc":"宜蘭工務段的辦公室自日治時期興建以來，一直用來處理鐵路工程事務。隨業務需要陸續增建段長室與辦公樓，旁邊的鐵工房、木工房也見證同一段鐵道歷史。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1532,"name":"台鐵宜蘭車站舊倉庫群","lat":24.75632,"lng":121.758334,"cat":"history","tag":"歷史建築","desc":"宜蘭到蘇澳的鐵路先行通車後，站前道路連到舊城，也吸引倉儲業者進駐。宜蘭線全線開通又帶動新倉庫陸續興建，留下車站旁一整片貨運年代的建築群。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1533,"name":"台鐵宜蘭車站舊警察派出所","lat":24.754264,"lng":121.75777,"cat":"history","tag":"歷史建築","desc":"宜蘭驛旁的小型派出所原先辦理鐵路警察業務，推測建於日治後期。戰後一度改作軍事運輸辦公室，處理軍人搭車與裝備運送，仍與車站工作緊密相連。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1534,"name":"台鐵宜蘭運務段舊辦公室","lat":24.754211,"lng":121.757446,"cat":"history","tag":"歷史建築","desc":"宜蘭運務段的舊辦公室是戰後興建的單層建物，屋頂採西式木構架。從外面的洗石子牆面到裡頭的磨石子，兩種做法配合開口處的混凝土板，形成簡潔的外觀。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1535,"name":"宜蘭孔子廟","lat":24.762947,"lng":121.75611,"cat":"worship","tag":"歷史建築","desc":"宜蘭地方士紳在清同治年間倡建孔廟，進士楊士芳等人號召鄉里一同參與。仰山書院山長陳維英參考臺南孔廟繪圖，為此地留下儒學與地方文教的印記。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1536,"name":"宜蘭市建業里舊軍事掩體（1）","lat":24.729193,"lng":121.751769,"cat":"history","tag":"歷史建築","desc":"建業里的舊掩體可以看見卵石砌牆與上方覆土，確切用途仍缺少文獻說明。地方耆老曾提到地下通道，但通道已經塌陷，原有格局也難以確認。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1537,"name":"宜蘭市建軍里飛機掩體群","lat":24.753395,"lng":121.737126,"cat":"history","tag":"歷史建築","desc":"建軍里留有以鋼筋混凝土築成的舊飛機掩體，周遭逐漸長出灌木和喬木。外牆保持素面，青苔、裸露的卵石和風化痕跡，讓人看見舊構造的材料。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1538,"name":"宜蘭市昭應宮","lat":24.757572,"lng":121.752761,"cat":"worship","tag":"古蹟","desc":"宜蘭中山路上的老廟自一八〇八年創建，歷來主祀天后媽祖。廟中仍留有清代建築，從舊城街區裡的這座信仰據點，可以追溯宜蘭聚落的形成。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1539,"name":"宜蘭市陳土金醫師宅","lat":24.755973,"lng":121.757154,"cat":"history","tag":"歷史建築","desc":"宜蘭街醫師陳土金早年在地方行醫，購地後在此安家。家宅旁原來是一片空地，後來起了樓房，兒子陳在三經營的景安藥房就在隔壁。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1540,"name":"宜蘭河濱公園","lat":24.76486,"lng":121.7558,"cat":"nature","desc":"宜蘭河兩岸從西門橋到宜興橋一帶，闢有綿延的城市綠地。寬闊草地、運動設施與景觀步道沿河分布，讓居民從市區走入河畔，就能看水景或運動。","area":"宜蘭市・宜蘭縣","ph":"觀"},{"id":1541,"name":"宜蘭濁水溪治水工事竣功記念碑","lat":24.718552,"lng":121.770159,"cat":"history","tag":"古蹟","desc":"今日的蘭陽溪昔稱宜蘭濁水溪，大雨後常夾帶土砂暴漲，威脅兩岸民家。日治時期自一九二九年起展開治水，工程在一九三六年完成，石碑由此留下。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1542,"name":"宜蘭火車站給水塔","lat":24.753018,"lng":121.758122,"cat":"history","tag":"歷史建築","desc":"蒸汽火車行經宜蘭需要補充用水，車站因而在一九一九年興建給水塔。厚磚牆砌成圓筒形塔身，下方開門，上方承托圓桶水槽，細緻砌工至今可辨。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1543,"name":"宜蘭磚窯","lat":24.767358,"lng":121.752109,"cat":"history","tag":"古蹟","desc":"宜蘭河北岸富含黏土，早年沿河興起燒製紅磚的窯場。津梅磚窯留下十三目的窯身，地面與拱頂都用磚砌成，是認識宜蘭傳統目仔窯的實物。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1544,"name":"宜蘭美術館","lat":24.7548,"lng":121.7519,"cat":"culture","desc":"舊城南門角五岔路口旁的美術館，前身是臺灣銀行早年在宜蘭設立的分行。建築歷經戰時毀損與多次修復，走進展館，也能從館舍本身閱讀不同年代的痕跡。","area":"宜蘭市・宜蘭縣","ph":"觀"},{"id":1545,"name":"宜蘭設治紀念館","lat":24.755366,"lng":121.749618,"cat":"culture","tag":"歷史建築","desc":"宜蘭廳長的舊官舍在一九二三年重建為郡守官舍，戰後又長期作為縣長官邸。融合日式與西式風格的住宅保留下來，成為介紹地方行政沿革的紀念館。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1546,"name":"宜蘭設縣紀念碑","lat":24.754781,"lng":121.750929,"cat":"history","tag":"歷史建築","desc":"宜蘭縣於一九五〇年成立，十年後，縣長林才添立碑紀念設縣滿十週年。紀念碑以花崗岩雕成，碑身一體兩面，北面刻著「宜蘭設縣紀念碑」。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1547,"name":"宜蘭運動公園","lat":24.73798,"lng":121.75274,"cat":"nature","desc":"這片城市綠地占地約二十七公頃，草地與各種運動場館同處園中。除了田徑場、籃球場與網球場，還有溜冰場和大型室內泳池，讓不同運動各有空間。","area":"宜蘭市・宜蘭縣"},{"id":1548,"name":"宜蘭酒廠(甲子蘭酒文物館)","lat":24.7563,"lng":121.74941,"cat":"culture","desc":"宜蘭舊城西路的酒廠始於一九〇九年，園區仍能見到製酒產業與城市發展相伴的痕跡。甲子蘭酒文物館藉展示和文化體驗，介紹臺灣釀酒與地方生活的關係。","area":"宜蘭市・宜蘭縣","ph":"觀"},{"id":1549,"name":"宜蘭酒廠歷史建築群","lat":24.756411,"lng":121.749388,"cat":"history","tag":"歷史建築","desc":"舊酒廠留下紅酒發酵室、倉庫與事務室，也保有理髮室、浴室等員工生活設施。木箱倉庫曾在戰時炸毀，戰後依原貌重建，後來一度成為員工餐廳。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1550,"name":"幾米廣場(丟丟噹森林公園)","lat":24.75263,"lng":121.757,"cat":"nature","desc":"宜蘭車站前的公園有九株高約十四公尺的鋼構巨樹，建築師黃聲遠以此呼應舊稱「九芎城」。舊宿舍區的空間經重新設計，成了旅人抵達城市時便望見的藝術地標。","area":"宜蘭市・宜蘭縣","ph":"觀"},{"id":1551,"name":"忠靈塔","lat":24.752999,"lng":121.753326,"cat":"history","tag":"歷史建築","desc":"這方略呈長三角形的碑石，原先設立的原因尚無定論，依題刻推測與追念殉職者有關。碑石戰後一度倒在中山公園，重新豎立時，殘缺的一角以水泥補起。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1552,"name":"思源里飛機掩體1","lat":24.752677,"lng":121.732999,"cat":"history","tag":"歷史建築","desc":"思源里留有宜蘭軍用機場年代的舊機堡，確切興建年份仍待考證。龜殼般的混凝土外形尚可辨認，兩面磚牆是戰後加砌，牆上也留有斷裂痕跡。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1553,"name":"思源里飛機掩體2","lat":24.753247,"lng":121.733654,"cat":"history","tag":"歷史建築","desc":"看似龜殼的水泥構造，是宜蘭舊機場周邊保留下來的飛機掩體之一。戰後有人在機堡背面補上磚牆，前方幾片高度不一的舊牆，仍可看出原來場地的範圍。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1554,"name":"林氏家廟追遠堂","lat":24.755701,"lng":121.751723,"cat":"worship","tag":"古蹟","desc":"清道光年間，漳州七縣移居蘭陽的林姓族人共同組成興德會，在宜蘭城南興建家廟。眾人也在頭圍下埔購置田產，用以維持各地林氏共同的祭祀。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1555,"name":"獻馘碑","lat":24.752915,"lng":121.753603,"cat":"history","tag":"古蹟","desc":"宜蘭公園裡的大理石紀念碑立於一九一一年，與日治時期殖民政府對泰雅族部落的治理有關。圓柱刻著「獻馘碑」三字，基座碑文則由清代廩生林拱辰撰寫。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1556,"name":"碧霞宮","lat":24.759407,"lng":121.751132,"cat":"worship","tag":"古蹟","desc":"宜蘭城隍街的武穆王廟以岳飛為主神，在臺灣廟宇中較為少見。廟史可以追溯到早年的坎興鸞堂，與文人敬神、以扶鸞請示神意的傳統相連。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1557,"name":"第一商業銀行宜蘭分行","lat":24.757311,"lng":121.752398,"cat":"history","tag":"古蹟","desc":"一九二一年興建的分行，以對稱立面、高聳壁柱與長窗呈現早年銀行的莊重外觀。二樓背牆還能辨認戰時掃射留下的孔洞，為這棟金融建築添上一層歷史。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1558,"name":"舊主秘公館","lat":24.755185,"lng":121.750014,"cat":"culture","tag":"歷史建築","desc":"昔日宜蘭廳署旁的日式宿舍緊鄰首長官邸，戰後一度成為縣政府主任秘書的住處。房舍經過修復，轉為九芎埕藝文空間，延續老官舍的使用。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1559,"name":"舊宜蘭縣議會","lat":24.751477,"lng":121.753606,"cat":"history","tag":"歷史建築","desc":"宜蘭縣議會在一九五九年遷入這棟廳舍，後因審議需要增設小型會議室。正面一列直條窗勾出簡潔的外觀，入口圍牆與舊餐廳則保留早年議會的模樣。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1560,"name":"舊宜蘭菸酒賣捌所","lat":24.755778,"lng":121.756703,"cat":"history","tag":"古蹟","desc":"宜蘭鬧區裡的兩層日式木屋，早年是菸酒專賣制度下負責配銷的賣捌所。戰後房舍由河川管理機關買下，改為首長官舍，保留下少見的日式書院住宅。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1561,"name":"舊日軍通信中心","lat":24.753058,"lng":121.753328,"cat":"history","tag":"歷史建築","desc":"宜蘭市區這座大型碉堡，是日治後期日本海軍聯絡蘭陽與外地通信單位的舊據點。確切建成年份仍未確認，留下的建物則記錄了戰時軍事通信的用途。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1562,"name":"舊糧食局宜蘭辦公廳","lat":24.754748,"lng":121.756935,"cat":"history","tag":"歷史建築","desc":"戰後初期，臺灣省糧食局在宜蘭設置辦公廳舍，建築於一九四六年落成。紅磚牆的砌工細緻，屋頂和室內格局仍帶日式特色，部分木柱後來改用鋼樑。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1563,"name":"舊臺灣銀行宜蘭分行","lat":24.755044,"lng":121.751833,"cat":"history","tag":"歷史建築","desc":"臺灣銀行於一八九九年在宜蘭設立出張所，是最早一批地方據點之一。從日治時期升格為支店，到戰後改組為分行，見證了宜蘭早期金融業的發展。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1564,"name":"菌寶貝博物館","lat":24.77634,"lng":121.73557,"cat":"culture","desc":"博物館從微小的菌類入手，帶人認識平日肉眼難以看見的微生物世界。導覽介紹有益菌與有害菌，也安排從生活用品出發的手作體驗。","area":"宜蘭市・宜蘭縣","ph":"觀"},{"id":1565,"name":"西鄉廳憲德政碑","lat":24.757727,"lng":121.744751,"cat":"history","tag":"歷史建築","desc":"宜蘭廳長西鄉菊次郎任內修築堤防，減輕宜蘭河氾濫對市街的威脅。堤防完工後被稱作西鄉堤防，居民又在一九〇五年立碑，記下這段治水經過。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1566,"name":"農糧署宜蘭市公糧倉庫群","lat":24.757006,"lng":121.760343,"cat":"history","tag":"歷史建築","desc":"宜蘭鐵路旁的公糧倉庫坐落於舊城東門外的壯一庄，原是街區與農村交界的水田。日治末期在此興建統制倉庫，從稻田到儲糧建築的變化，留下地方糧政的痕跡。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1567,"name":"進士里飛機掩體1","lat":24.737456,"lng":121.743407,"cat":"history","tag":"歷史建築","desc":"進士里的舊機堡，推測與二戰時宜蘭軍用機場的設置有關。圓弧形的混凝土主體和前方舊牆仍在，正面、背面則能看到戰後另外砌上的磚牆。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1568,"name":"進士里飛機掩體2","lat":24.737004,"lng":121.742364,"cat":"history","tag":"歷史建築","desc":"這座外輪廓近似龜殼的舊構造，曾是宜蘭機場周邊用來收容軍機的掩體。背面磚牆屬戰後增建，與原有混凝土並置，讓人分辨前後兩個時期的改動。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1569,"name":"開蘭進士楊士芳旗杆座","lat":24.740702,"lng":121.749222,"cat":"history","tag":"古蹟","desc":"宜蘭人楊士芳在一八六八年考中進士，幾年後重修擺厘庄舊宅，在正廳前的稻埕立起一對旗杆座。科舉功名就這樣化成家門前看得見的標記。","area":"宜蘭市・宜蘭縣","ph":"文"},{"id":1570,"name":"二五連水門公園","lat":24.82912,"lng":121.81924,"cat":"nature","desc":"礁溪猴洞溪與頭城砂仔港排水交會的地方，闢有這座水門公園。附近是大塭的排水閘門，讓河岸休憩空間與地方水利設施並列在一起。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1571,"name":"二龍河","lat":24.81088,"lng":121.79052,"cat":"scenic","desc":"五峰旗與虎頭山的水流匯成河道，流經礁溪淇武蘭、洲仔尾兩個老聚落。兩岸居民沿河生活，也在這條二龍河上發展出傳承兩百年的龍舟文化。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1572,"name":"五峰旗聖母朝聖地","lat":24.82964,"lng":121.74725,"cat":"other","desc":"礁溪五峰旗風景區上方的朝聖地，坐落於松柏環繞的山坡，是前往抹茶山途中的地點。海拔約一百七十公尺的視野，已能向下俯瞰蘭陽平原。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1573,"name":"吳沙故居","lat":24.78745,"lng":121.76024,"cat":"culture","desc":"礁溪四城北門巷的吳家三合院，四周仍有族人居住，讓家宅與聚落一同延續。現存建築約在一九二一年興建，保留傳統合院布局，也承接地方對吳沙的記憶。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1574,"name":"呂美麗精雕藝術館","lat":24.81551,"lng":121.78381,"cat":"culture","desc":"呂美麗自一九八九年投入雕刻，從鄉土、生活和佛像發展出三類作品。館中可看她如何把相熟的生活題材，分別用黃楊木、黃金與琉璃表現出來。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1575,"name":"大塭觀光休閒養殖場","lat":24.81936,"lng":121.79544,"cat":"scenic","desc":"礁溪大塭的養殖池排列在蘭陽平原靠海的一側，水面映著日光，遠方還看得見山巒。步道沿魚塭邊緣延伸，讓人可以近看池面與海岸濕地相接的風景。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1576,"name":"柴圍佃圳水門公園","lat":24.79422,"lng":121.75401,"cat":"nature","desc":"白鵝村的佃圳水門負責調節農田灌溉用水，圳邊順著護岸闢有小公園。木造六角亭的柱上留著勸善對聯，旁邊的大理石桌椅讓人歇腳看水。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1577,"name":"武暖石板橋","lat":24.782097,"lng":121.762336,"cat":"culture","tag":"古蹟","desc":"清光緒年間，通蘭古道在今四城一帶設有這座小橋。十五條等長石板以榫接相連，組成約四公尺長的橋面，當年的行旅便踩著這些石板往來宜蘭與礁溪。","area":"礁溪鄉・宜蘭縣","ph":"文"},{"id":1578,"name":"湯圍溝溫泉公園(湯圍風呂)","lat":24.82851,"lng":121.76996,"cat":"nature","desc":"礁溪自然湧出的熱泉在這裡聚成水道，早年人們直稱它為「燒水溝」。園區保留熱氣從溝面升起的地景，小橋跨過水流，與市區街巷緊緊相鄰。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1579,"name":"湯圍溫泉溝","lat":24.828766,"lng":121.769945,"cat":"history","tag":"歷史建築","desc":"這處傳統公共浴池利用天然溫泉溝的湧水，沿水道分成上下兩池。礁溪和鄰近鄉鎮的居民習慣早晚來泡湯，溝邊也成了熟人閒聊家常的地方。","area":"礁溪鄉・宜蘭縣","ph":"文"},{"id":1580,"name":"猴洞坑瀑布","lat":24.84153,"lng":121.78266,"cat":"scenic","desc":"礁溪近郊的瀑布從巨大岩壁上落下，分為上下兩層，中段以瀑潭相隔。雨季溪水充沛，沿著總落差約二、三十公尺的岩面傾瀉，格外顯出水勢。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1581,"name":"玉清宮","lat":24.80484,"lng":121.74978,"cat":"worship","desc":"礁溪九龍山白鵝湖的廟宇主祀玉皇上帝，一九七六年開始興建。四層廟身各有用途，下方為朝儀會館與禪房，上層分設道祖殿與玉皇殿。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1582,"name":"礁溪協天廟老戲臺","lat":24.818135,"lng":121.769362,"cat":"worship","tag":"歷史建築","desc":"礁溪居民在協天廟祭拜關聖帝君，廟前的老戲臺則是酬神戲與地方活動留下的舞台。戲臺的太師壁、木構件與基座，記錄傳統戲曲和廟宇相伴的年代。","area":"礁溪鄉・宜蘭縣","ph":"文"},{"id":1583,"name":"礁溪德陽宮","lat":24.82656,"lng":121.77322,"cat":"worship","desc":"礁溪居民稱中壇元帥為太子爺，也有人稱祂哪吒太子，祂正是這座老廟的主神。依廟方沿革，創廟始於清嘉慶年間，兩百多年來延續著地方的太子信仰。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1584,"name":"礁溪溫泉公園","lat":24.8326,"lng":121.77668,"cat":"nature","desc":"礁溪市區的綠地保有百年老樹和原有植被，林間還藏著日式浴池遺跡。散步除了看溫泉鄉的泡湯歷史，也能找到紀念孫中山百年誕辰的石碑。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1585,"name":"礁溪溫泉地景廣場","lat":24.82853,"lng":121.77565,"cat":"nature","desc":"礁溪北側入口的廣場，以當地四菱砂岩打造地標塔與蜿蜒水路。從石材到依山傍水的布局，都把宜蘭山水縮進街角的一片開放空間。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1586,"name":"礁溪溫泉廣場","lat":24.8288,"lng":121.77366,"cat":"nature","desc":"礁溪路與溫泉路口的廣場，是許多人進入溫泉鄉時最先認出的地標。入口一塊巨大石碑刻著「礁溪溫泉」四字，讓街口也成了熟悉的留影背景。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1587,"name":"礁溪站前廣場","lat":24.82703,"lng":121.77535,"cat":"nature","desc":"礁溪火車站前的廣場，把溫泉鄉最熟悉的泡湯體驗放在出站後的第一個停留點。冬日坐在這裡泡泡腳，便能用雙腳感受礁溪的泉水。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1588,"name":"礁溪鄉公所舊辦公廳","lat":24.82369,"lng":121.771266,"cat":"history","tag":"歷史建築","desc":"日治時期興建的舊鄉公所，曾是礁溪居民洽辦地方事務的行政中心。外牆以水平與垂直線條分出窗、門的位置，裝飾集中在開口附近，留下樸實莊重的外觀。","area":"礁溪鄉・宜蘭縣","ph":"文"},{"id":1589,"name":"臺灣銀行礁溪訓練中心","lat":24.825878,"lng":121.77342,"cat":"history","tag":"歷史建築","desc":"德陽宮對面的日式住宅前身是西山旅館，見證礁溪早年的溫泉開發。屋裡的座敷鋪著榻榻米，搭配外部特殊屋頂形式，保留舊溫泉旅館的建築風貌。","area":"礁溪鄉・宜蘭縣","ph":"文"},{"id":1590,"name":"金車生技水產養殖研發中心","lat":24.81757,"lng":121.79335,"cat":"scenic","desc":"礁溪的水產養殖基地同時設有參觀空間，讓民眾認識白蝦的養殖環境。園區分設室內、戶外養殖設施，並將水產生產與生態教育安排在一起。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1591,"name":"金車礁溪蘭花園","lat":24.82078,"lng":121.78427,"cat":"nature","desc":"一九八八年成立的礁溪蘭花園，長期專門培育供應市場的蝴蝶蘭。園區後來也發展生態、美學教育與親子互動，讓人從一株蘭花認識背後的培育產業。","area":"礁溪鄉・宜蘭縣","ph":"觀"},{"id":1592,"name":"開蘭吳宅公廳","lat":24.788147,"lng":121.759268,"cat":"history","tag":"歷史建築","desc":"吳沙聚落的公廳由第四代後人興建，小型磚造三合院前有內埕，後方巷道旁有古井。牆腳以卵石堆砌，上方改用斗子牆，樸素的五開間是族人共用的地方。","area":"礁溪鄉・宜蘭縣","ph":"文"},{"id":1593,"name":"羅東文化工場","lat":24.67187,"lng":121.76459,"cat":"culture","desc":"羅東市區的文化工場，以特別的建築造型成為小鎮地標。場館把藝文展演、運動休閒與文創活動放在一起，成了人們欣賞作品和日常活動的公共空間。","area":"羅東鎮・宜蘭縣","ph":"觀"},{"id":1594,"name":"羅東林區管理處碉堡(1)","lat":24.685427,"lng":121.77231,"cat":"history","tag":"歷史建築","desc":"森林鐵道把太平山木材運入羅東，林務機關也隨之在竹林一帶扎根。約在一九五〇年代興建的碉堡，原用來守護林鐵，為林場留下戰後警戒年代的印記。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1595,"name":"羅東林區管理處碉堡(2)","lat":24.682091,"lng":121.771724,"cat":"history","tag":"歷史建築","desc":"羅東林區曾是重要的生產據點，約在一九五〇年代設置碉堡保護林場設施。保留下來的建築，讓人看見當時的林業聚落除了生產，也留下了防守的準備。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1596,"name":"羅東林區管理處舊勞工俱樂部","lat":24.683103,"lng":121.771936,"cat":"history","tag":"歷史建築","desc":"羅東林場的老俱樂部保有日式建築特色，早年是林業從業者聚集的空間。後來改為幼稚園、增設托兒班，房子也成了許多林場員工子女成長的地方。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1597,"name":"羅東林區管理處舊檢車庫","lat":24.684986,"lng":121.772302,"cat":"history","tag":"歷史建築","desc":"日治時期的森林鐵路檢車室原是一層木屋，後來遭颱風摧毀。現存車庫在一九七一年重建，留下羅東林場替鐵路車輛做檢查維護的工作記憶。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1598,"name":"羅東林區管理處舊辦公室","lat":24.683848,"lng":121.771755,"cat":"history","tag":"歷史建築","desc":"貯木場的辦公室曾兼作調度、工會與福利會的工作空間。建物於一九六二年改建為現貌，歇山式屋頂鋪日本瓦，門前的亭仔腳也留著早年辦公房舍的樣子。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1599,"name":"羅東林區管理處貯木池區","lat":24.684313,"lng":121.772738,"cat":"history","tag":"歷史建築","desc":"太平山原木運到羅東後，會從鐵道旁斜台卸進池裡浸泡，避免木料乾裂。池中突出的水泥樁曾用來區分木材等級，兩座池子也分別存放待售與已標得的木料。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1600,"name":"羅東林場","lat":24.684052,"lng":121.771351,"cat":"history","tag":"文化景觀","desc":"太平山木材早年在羅東鎮北側集中、貯放與標售，再轉運到外地。這片完整保留下來的林場後來被劃為林業文化專用區，讓產業原有的空間得以延續。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1601,"name":"羅東林業文化園區","lat":24.68193,"lng":121.77225,"cat":"culture","desc":"從太平山運下的木頭，昔日就在羅東的出張所與貯木池一帶集散加工。伐木結束後，園區保留林業現場的樣貌，成為能在市區認識產業與生態的文化景觀。","area":"羅東鎮・宜蘭縣","ph":"觀"},{"id":1602,"name":"羅東林業文化園區","lat":24.684455,"lng":121.772424,"cat":"culture","desc":"羅東林場停在一九八二年告別太平山伐木的轉折點，出張所與貯木池大致留在原處。後來以林業歷史與生態為主題重新整理，讓人從老林場認識羅東鎮的發展。","area":"羅東鎮・宜蘭縣","ph":"觀"},{"id":1603,"name":"羅東聯勤被服廠","lat":24.679374,"lng":121.772881,"cat":"history","tag":"歷史建築","desc":"羅東林場南側的軍用被服廠在波密拉颱風後重建，裁剪縫紉大樓於一九六二年落成。兩層樓分頭作業，樓上剪裁、樓下縫紉，奠基碑還刻有中美合作的圖案。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1604,"name":"羅東運動公園","lat":24.68112,"lng":121.75305,"cat":"nature","desc":"由日本高野景觀建築團隊設計的公園，占地約四十七公頃，以水、綠意與健康為主題。一九九六年開園後，這片開闊綠地也成了羅東人日常運動的場所。","area":"羅東鎮・宜蘭縣","ph":"觀"},{"id":1605,"name":"羅東鎮勉民堂","lat":24.674967,"lng":121.770268,"cat":"worship","tag":"古蹟","desc":"羅東的老鸞堂主祀關聖帝君、呂仙祖和司命灶君，早年由地方仕紳藍新倡建。廳堂有「九門三窗」的格局，連神龕兩側與後方都分別設有門窗。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1606,"name":"羅東鎮北成聖母升天堂","lat":24.675694,"lng":121.762145,"cat":"worship","tag":"古蹟","desc":"北成街的天主堂在安惠民神父規劃下興建，落成時命名為聖母升天堂。當年奠基儀式曾邀孩子一起在地基放入聖牌，讓地方信仰的記憶也埋進教堂裡。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1607,"name":"舊羅東郡役所","lat":24.678537,"lng":121.769251,"cat":"history","tag":"古蹟","desc":"日治時期設置羅東郡，郡役所曾管理羅東、五結、三星與冬山等地。廳舍正面沿中軸對稱排列，中央入口特別拉高，底層的八角形門洞尤其醒目。","area":"羅東鎮・宜蘭縣","ph":"文"},{"id":1608,"name":"內埤海灣","lat":24.57706,"lng":121.87052,"cat":"other","desc":"南方澳人稱內埤漁港為「內埤仔」，從港旁稍高的地方望去，可以發現一彎海岸。山嵐和海面圍出這片安靜的水灣，也是漁村居民熟悉的風景。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1609,"name":"南方澳南天宮(金媽祖、玉媽祖)","lat":24.58188,"lng":121.86499,"cat":"worship","desc":"南方澳漁港旁的媽祖廟，是漁民與居民共同的信仰中心。宮中以金媽祖、玉媽祖聞名，從廟旁往外望，還能把平日討海人進出的港灣收進眼底。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1610,"name":"南方澳大橋","lat":24.58585,"lng":121.86952,"cat":"other","desc":"橫跨航道的橋身把南方澳第三漁港與造船廠連在一起，也將環港生活圈串成一線。從高處往下看，漁船作業的港區和造船的地方就在水面兩側。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1611,"name":"南方澳觀景台","lat":24.57651,"lng":121.86676,"cat":"other","desc":"舊蘇花公路邊的觀景台搭在斷崖上，是從高處看南方澳漁港的地方。站上木棧平台，視線越過港灣向外海展開，也能看清漁港被山海圍起的樣貌。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1612,"name":"南方澳進安宮(寶石珊瑚媽祖)","lat":24.5842,"lng":121.86452,"cat":"worship","desc":"南方澳第三漁港附近的進安宮，保留一尊超過兩百年的開基媽祖。相傳帆船躲避東北季風時，船上的媽祖曾被迎到岸邊石洞祭拜，從此留下守護漁民。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1613,"name":"南方澳遊客中心","lat":24.58447,"lng":121.8645,"cat":"other","desc":"進安宮旁的兩層綠建築，以漁村和討海生活作為設計元素。館內介紹南方澳與宜蘭海岸的海洋文化、濕地生態，讓人從展覽開始認識港邊的環境。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1614,"name":"後山公路文物館","lat":24.59674,"lng":121.83472,"cat":"culture","desc":"蘇澳這座主題館以宜蘭、花蓮的公路建設為收藏與展示重點，於二〇一一年設立。從闢建道路、架橋到開鑿隧道的歷程，能看見東部公路如何逐步成形。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1615,"name":"朝陽漁港","lat":24.46007,"lng":121.82105,"cat":"other","desc":"大南澳海邊的小漁港面向太平洋，北側有烏石鼻的天然地形作屏障。附近海域水深、黑潮流經，帶來多樣魚獲，也形塑了港邊的漁業生活。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1616,"name":"獅子公園","lat":24.58876,"lng":121.85967,"cat":"nature","desc":"蘇澳丘陵半山腰的公園，沿用了一段昔日通往南方澳的蘇南公路。港區另闢新路後，舊路慢慢轉為居民運動與散步的空間，也留下山腰道路的記憶。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1617,"name":"珊瑚法界博物館","lat":24.58248,"lng":121.86406,"cat":"culture","desc":"南方澳漁港巷弄裡的小型博物館，由家庭空間改建而來。館內以保存臺灣珊瑚產業歷史與推廣珊瑚雕刻為主題，從漁村近看珊瑚與工藝的關係。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1618,"name":"蘇澳冷泉公園","lat":24.59731,"lng":121.8507,"cat":"nature","desc":"蘇澳鎮內的公園圍繞一處低溫礦泉而設，天然泉水屬於少見的碳酸冷泉。蘭陽平原上的這片湧泉地景，也讓蘇澳發展出自己的泡冷泉文化。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1619,"name":"蘇澳張公廟","lat":24.595797,"lng":121.850599,"cat":"worship","tag":"古蹟","desc":"蘇澳居民習慣稱晉安宮為張公廟，祭祀福建永春、安溪一帶尊奉的張公聖君。《噶瑪蘭廳志》便記載蘇澳街居民合力建廟，可見這份信仰在港鎮扎根已久。","area":"蘇澳鎮・宜蘭縣","ph":"文"},{"id":1620,"name":"蘇澳扇形鐵道暨轉車台","lat":24.594987,"lng":121.855694,"cat":"history","tag":"歷史建築","desc":"宜蘭線走到蘇澳便是終點，地方俗諺也以火車開到蘇澳形容到了盡頭。站內的轉車台能讓車頭換方向，或轉向維修線，留下終點站辦理調車的重要設備。","area":"蘇澳鎮・宜蘭縣","ph":"文"},{"id":1621,"name":"蘇澳港","lat":24.59687,"lng":121.8572,"cat":"other","desc":"南方澳與北方澳從兩側環抱，讓三面靠山的蘇澳形成面向太平洋的天然深水港。舊稱東港的商港歷經擴建，從蘭陽地方貨物的集散處發展為國際貿易港。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1622,"name":"蘇澳燈塔","lat":24.599879,"lng":121.884787,"cat":"history","tag":"古蹟","desc":"北方澳的燈塔在日治時期開始興築，初設時未派專任看守員，由附近警察輪流巡視。燈塔在二戰時因空襲受損，直到一九四九年修復後才再度運作。","area":"蘇澳鎮・宜蘭縣","ph":"文"},{"id":1623,"name":"蘇澳砲台山及金刀比羅社遺蹟","lat":24.593334,"lng":121.856908,"cat":"history","tag":"古蹟","desc":"蘇澳砲台山上，昔日金刀比羅社的建築雖已消失，石柱、石桌椅與石燈籠仍留在原地。正殿基座後來與公園一同規劃，走看石件便能辨認神社的舊址。","area":"蘇澳鎮・宜蘭縣","ph":"文"},{"id":1624,"name":"蘇澳鎮舊垃圾焚化場","lat":24.606339,"lng":121.815608,"cat":"history","tag":"歷史建築","desc":"宜蘭縣第一座垃圾焚化爐於一九八〇年建在蘇澳，採直立式爐體。鋼筋混凝土建成的廠房有兩層在地下、一層露出地面，記錄地方早年的垃圾處理方式。","area":"蘇澳鎮・宜蘭縣","ph":"文"},{"id":1625,"name":"討海文化館","lat":24.58525,"lng":121.87184,"cat":"culture","desc":"南方澳的討海文化館位在豆腐岬濱海遊憩區入口，一旁就是跨港路。南方澳大橋與海水浴場都在附近，館舍所在的位置正好連起漁港和海灣。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1626,"name":"頂寮生態公園","lat":24.6397,"lng":121.84268,"cat":"nature","desc":"新城溪口北岸的濕地公園，是宜蘭濱海自行車道溪南段的終點。沿著水邊停下來，能觀察在濕地活動的水鳥，也看見蘇澳工業區旁另一面的溪口風景。","area":"蘇澳鎮・宜蘭縣","ph":"觀"},{"id":1627,"name":"北關海潮公園","lat":24.91193,"lng":121.86842,"cat":"nature","desc":"宜蘭東北角的海濱公園以山海相接的景色和特殊地質聞名，北關海潮也列入蘭陽八景。站在濱海地帶看潮水來去，山勢與海岸輪廓便同時映入眼前。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1628,"name":"北關海潮公園","lat":24.91255,"lng":121.8776,"cat":"nature","desc":"頭城更新里的海邊曾是清代防守蘭陽的北關，與南方關卡遙相呼應。今日的蘭城公園保留這個地名，也讓人從海岸礁岩和山勢認識當年設關的緣由。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1629,"name":"大坑觀景台","lat":24.85644,"lng":121.8321,"cat":"other","desc":"大坑海邊的白色建物原是海防哨所，後來閒置，經整頓改為景觀咖啡館。過去瞭望海面的視角如今用來賞景，從屋旁望出去便是一整片開闊海面。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1630,"name":"大溪漁港","lat":24.94116,"lng":121.9015,"cat":"other","desc":"靠近龜山島的漁港以漁獲種類豐富著稱，港內的魚市場伴隨船隻回航而熱鬧起來。午後常見漁民把整晚捕來的魚貨搬上岸，形成大溪熟悉的港邊風景。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1631,"name":"大溪蜜月灣","lat":24.93556,"lng":121.8847,"cat":"other","desc":"大溪的海灣彎如眉月，兩端被礁岩圍住，中央只留一小段細軟沙灘。沿著清澈海水散步，可在鵝卵石間看浪，也有機會遇上在沙地奔跑的魔鬼蟹。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1632,"name":"大里天公廟(草嶺慶雲宮)","lat":24.96955,"lng":121.9252,"cat":"worship","desc":"大里海邊的百年廟宇也叫草嶺慶雲宮，奉祀早年從漳州迎來的玉皇大帝。這座漁村天公廟與蘭陽平原的開發相伴，至今仍是居民共同的信仰中心。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1633,"name":"大里遊客中心","lat":24.96922,"lng":121.9246,"cat":"other","desc":"大里這處遊客中心介紹草嶺古道沿線的人文史蹟，也整理東北角與宜蘭的山海景點。館內的多媒體放映室，以影像讓人先認識蘭陽，再走入古道。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1634,"name":"小鎮職人-藝驛頭城文化基地","lat":24.85759,"lng":121.8241,"cat":"other","desc":"頭城返鄉青年留下原本即將拆除的老屋，把它改成金魚厝邊的地方文化據點。從老街藝術季到文化工作坊，屋裡持續串起地方創作、體驗與青年培力。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1635,"name":"峭壁小屋","lat":24.9747,"lng":121.9378,"cat":"other","desc":"石城的咖啡館面向海灣，能從岸邊遠眺龜山島。附近就是舊草嶺隧道一帶，除了看海，也有觀察列車穿越隧道的視角，是鐵道與海景同框的地方。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1636,"name":"烏石港舊址","lat":24.865568,"lng":121.832542,"cat":"history","tag":"文化景觀","desc":"港中的黑色礁石讓烏石港得名，這裡曾是蘭陽溪以北多條溪流共同的出口。清代商旅仰賴港口進出宜蘭，直到十九世紀末淤積，舊港才失去通航功能。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1637,"name":"烏石港驛站","lat":24.86926,"lng":121.83484,"cat":"other","desc":"蘭陽博物館園區東北角的驛站，由蘇喻哲以「透明盒子」為構想設計。建築遠看像一艘停在港邊的帆船，呼應烏石港的貿易歷史，也作為環境教育空間。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1638,"name":"石牌縣界公園","lat":24.86501,"lng":121.77523,"cat":"nature","desc":"北宜公路在坪林與頭城交界穿越山嶺，縣界公園就設在約五百三十八公尺高處。這裡也是俗稱「九彎十八拐」路段的頂端，留下往來宜蘭途中歇腳看山的空間。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1639,"name":"竹安溪口","lat":24.84136,"lng":121.826,"cat":"other","desc":"水田、魚塭和淡水沼澤交錯分布在竹安溪出海口，當地養殖九孔、鰻魚與草蝦。秋冬候鳥南遷時，常停在濕地覓食潮汐帶來的魚蝦。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1640,"name":"舊大溪橋","lat":24.941928,"lng":121.895355,"cat":"history","tag":"古蹟","desc":"頭城大溪上保留一座五連拱的混凝土橋，早年負責串連溪流南北兩側。它與舊大里橋的落成年代相近，成排拱跨仍留著日治時期橋梁的輪廓。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1641,"name":"舊大里橋","lat":24.963796,"lng":121.920343,"cat":"history","tag":"古蹟","desc":"大里溪邊的舊橋於一九四一年落成，曾承擔宜蘭海岸南北往來的任務。戰時鋼筋用量受到管制，橋身改採石拱砌築，留下物資限制也影響工法的痕跡。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1642,"name":"舊草嶺隧道","lat":24.983978,"lng":121.955541,"cat":"history","tag":"古蹟","desc":"宜蘭線鐵路為穿越草嶺而開鑿隧道，於一九二四年貫通，日後因新隧道啟用而退役。兩端紅磚拱門的門額各不相同，北口寫「制天險」，南口為「白雲飛處」。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1643,"name":"蘭陽博物館","lat":24.86866,"lng":121.83274,"cat":"culture","desc":"烏石港附近的博物館，以宜蘭常見的單面山作為建築造型，大幅傾斜的外牆像一面山壁。海岸與濕地環繞館舍，展覽也從自然環境延伸到蘭陽地方文化。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1644,"name":"頭城慶元宮","lat":24.857258,"lng":121.824128,"cat":"worship","tag":"古蹟","desc":"頭城廟名裡的「慶元」，指吳沙率眾來到蘭陽開墾的嘉慶元年。前殿牌樓與石柱上留有修建年代的落款，讓人從廟宇構件讀出街庄發展的歲月。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1645,"name":"頭城梗枋福神碑","lat":24.897032,"lng":121.861577,"cat":"history","tag":"歷史建築","desc":"梗枋的石碑刻著「福神」，地方口傳將它與土地公和古道商旅的信仰相連。關於立碑原因仍有不同說法，確切來歷尚待文獻印證。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1646,"name":"頭城老街","lat":24.85696,"lng":121.82416,"cat":"structure","desc":"和平街自清代便因烏石港商業往來而發展，素有「開蘭第一街」之稱。約六百公尺長的街道兩端各有土地公廟，沿街走過，也就看見昔日街庄的大致範圍。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1647,"name":"頭城鎮南北門福德祠","lat":24.855857,"lng":121.823425,"cat":"worship","tag":"古蹟","desc":"頭圍老街南北兩端各有一座福德祠，供奉土地公與土地婆，兩廟都朝著街內。早年烏石港帶動街市繁榮，兩座小祠也標出了當時商業街區的兩頭。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1648,"name":"頭城鎮新長興樹記","lat":24.857552,"lng":121.824372,"cat":"history","tag":"古蹟","desc":"頭城長興行的陳家兄弟在一九三二年分戶，次子陳木樹另立「新長興樹記」店號。相鄰兩戶街屋原是一同興建，建築與店名都留著家族分業的故事。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1649,"name":"頭城鎮老紅長興","lat":24.857602,"lng":121.82439,"cat":"history","tag":"古蹟","desc":"頭城陳春榮人稱老紅，與弟弟合力創設長興行經營米糧。留下的店屋原與兩側連棟興建，前後兼有住家和營業用途，記錄頭城商家住在自家店裡的年代。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1650,"name":"龜山島","lat":24.84241,"lng":121.95014,"cat":"scenic","desc":"頭城以東的海面上，有一座外形像浮龜的火山島，宜蘭人遠望島影便能辨認家鄉。離岸約十公里的龜山島，也是臺灣少見能在海上望見輪廓的活火山。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1651,"name":"龜山島","lat":24.86948,"lng":121.8401,"cat":"other","desc":"宜蘭外海的火山島經常雲霧繚繞，除了海景，還有軍事坑道和普陀巖等人文遺跡。從龜尾湖、冷泉到原生蒲葵林，可以在同一座島上看到不同生態。","area":"頭城鎮・宜蘭縣","ph":"觀"},{"id":1652,"name":"龜山遊覽遭難者之招魂碑","lat":24.941742,"lng":121.902576,"cat":"history","tag":"古蹟","desc":"一九三八年龜山島遊覽遇上海難，家屬集資在大溪海岸立碑招魂，讓石碑面向龜山島。兩旁石燈籠守著祭壇，基座正面刻下罹難者姓名，後方留有碑誌。","area":"頭城鎮・宜蘭縣","ph":"文"},{"id":1653,"name":"三地門中山公園","lat":22.71568,"lng":120.65468,"cat":"nature","desc":"三地門鄉公所對面的綠地，戰後才規劃成今日的公園。這塊基地早年曾用於祭祀，從歷史場地轉成公共空間，也成了初訪三地門時認識聚落的地點。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1654,"name":"三地門文化館","lat":22.71545,"lng":120.65478,"cat":"culture","desc":"三地門中山公園裡的文化館，設在日治時期留下的神社舊址。館內有文物展區、視聽室及觀景台，部落廚房上的巨大老鷹雕塑則從遠處就很醒目。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1655,"name":"三地門藝術村","lat":22.7208,"lng":120.66042,"cat":"culture","desc":"三地村的街道呈棋盤狀，沿著坡地興建的房子遠看像一層層緩緩升起的階梯。部落以工藝創作出名，村裡的作品也承載著族人將手藝傳給下一代的心意。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1656,"name":"台灣原住民族文化園區","lat":22.7084,"lng":120.65081,"cat":"culture","desc":"這座戶外博物館的設立，源於族群領袖對保存原住民族文化的倡議。園區從維護各族原有文化出發，也提供社會教育、學術研究與不同族群交流的空間。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1657,"name":"地磨兒藝術公園","lat":22.71837,"lng":120.65548,"cat":"nature","desc":"三地門鄉公所上方的藝術公園，以排灣語「地磨兒」為名。這個名字指的是三地村，也帶有排灣族身為太陽子民的意涵，讓公園與部落身分相連。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1658,"name":"大津瀑布","lat":22.8614,"lng":120.64562,"cat":"scenic","desc":"屏東沿山地帶的這道瀑布，入口位在高樹鄉新豐村。除了大津之名，當地也有人稱它為阿烏瀑布、尾寮瀑布或新豐瀑布，幾個名字指的都是同一處。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1659,"name":"德萊公園","lat":22.76472,"lng":120.70329,"cat":"nature","desc":"德文村的公園把部落傳統雕刻與石板屋放進綠地，讓人從園中景物認識在地文化。作品和建築共同呈現族人居住、創作與延續手藝的方式。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1660,"name":"莎卡蘭口社村","lat":22.76976,"lng":120.64677,"cat":"nature","desc":"莎卡蘭溪旁的口社是排灣族部落，早先由溪流上游的大社分出。部落流傳兩名獵人帶著獵犬來到高媽安的故事，當時獵狗久久不願離開那片舊社土地。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1661,"name":"賽嘉無動力飛行傘","lat":22.75272,"lng":120.64746,"cat":"other","desc":"中央山脈的屏障使賽嘉村一帶有較穩定的上升氣流，成了無動力飛行傘活動的地方。公園分設山上的起飛區與平地著陸區，空中視野也格外開闊。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1662,"name":"賽嘉驛站","lat":22.74362,"lng":120.63951,"cat":"other","desc":"賽嘉部落裡的驛站設在國小校園，和村內集會所相鄰。這所學校以飛行與生態為特色，驛站也就座落在部落教育和日常聚會的生活空間裡。","area":"三地門鄉・屏東縣","ph":"觀"},{"id":1663,"name":"九如全人照顧園區","lat":22.73501,"lng":120.48945,"cat":"nature","desc":"同一棟園區建築，樓下是長輩的日間照顧空間，樓上則安排健身、烘焙與親子活動。孩子可以在室內沙坑、球池和溜滑梯遊玩，也有彈跳床和滑步車。","area":"九如鄉・屏東縣","ph":"觀"},{"id":1664,"name":"九如鄉三山國王廟","lat":22.730833,"lng":120.484611,"cat":"worship","tag":"古蹟","desc":"廟宇的創建年代有明末、清乾隆年間兩種記載，可從正殿左側的廟產碑認識這段爭議。花崗岩碑上還記下地方購田置產，為三山國王祭典作準備的往事。","area":"九如鄉・屏東縣","ph":"文"},{"id":1665,"name":"九如鄉耆老村龔家古厝","lat":22.76,"lng":120.479361,"cat":"history","tag":"歷史建築","desc":"耆老村龔家宅院以前後兩落和兩側護龍圍合，兼有閩南合院與客家圍籠屋的特色。前落山牆上的鐵剪刀原用來抗震，是屏東傳統民宅少見的細節。","area":"九如鄉・屏東縣","ph":"文"},{"id":1666,"name":"巴轆公園","lat":22.73572,"lng":120.48976,"cat":"nature","desc":"九如舊稱巴轆社，公園的名字就保留了這段地方記憶。園裡闢有生態池和兒童遊樂空間，附近社區水溝甚至養著鯉魚，成了散步時能留意的小風景。","area":"九如鄉・屏東縣","ph":"觀"},{"id":1667,"name":"龔家古厝","lat":22.75962,"lng":120.49564,"cat":"culture","desc":"龔家祖先四兄弟從里港土庫遷來耆老村後，留下這座古樸的三合院。寬廣宅地裡分出約三十個房間，屋內彼此相通，能想見大家族共同生活的格局。","area":"九如鄉・屏東縣","ph":"觀"},{"id":1668,"name":"佳冬楊氏宗祠","lat":22.419472,"lng":120.547306,"cat":"worship","tag":"古蹟","desc":"佳冬楊姓族人為紀念祖先楊雲岫等人開創家業，邀集內埔、車城及佳冬各村宗親共同建祠。以公嘗名義購地置產，也讓分居各庄的後代有了共同祭祖之所。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1669,"name":"佳冬蕭宅","lat":22.417897,"lng":120.55025,"cat":"history","tag":"古蹟","desc":"佳冬蕭家祖籍廣東梅縣，留下的宅院以五座堂屋排在同一中軸上，圍出四個內埕。兩側成排橫屋與長天井相伴，再由騎馬廊橫向串起，是規模完整的圍龍式合院。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1670,"name":"佳冬西隘門","lat":22.418534,"lng":120.548223,"cat":"history","tag":"古蹟","desc":"佳冬聚落的西側隘門採門樓形式，朝外的一面嵌有「褒忠」橫額，與北隘門相呼應。依北隘門所存碑記推算，西隘門的歷史可能上溯清嘉慶年間。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1671,"name":"佳冬鄉張家商樓","lat":22.418031,"lng":120.549257,"cat":"history","tag":"歷史建築","desc":"佳冬張家早年務農，家宅同時也是經商的店面，據後代口述約建於日治初期。家人曾收購鱔魚、青蛙等水產供應旅店與飯店，老屋也留下庄內買賣的故事。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1672,"name":"佳冬鄉神社","lat":22.411583,"lng":120.562417,"cat":"history","tag":"歷史建築","desc":"日治時期的神社設在佳冬飛行場西南角，旁邊是當年的農業學校。原有祭祀空間可從兩座鳥居、參道與神道橋辨認，留下農村聚落一段殖民時期的景觀。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1673,"name":"佳冬鄉防空洞","lat":22.426778,"lng":120.564611,"cat":"history","tag":"歷史建築","desc":"佳冬飛行場的防空洞，曾供二戰時期機場人員避難。紅磚疊砌的長形外觀有些像燒陶的蛇窯，兩側設有出口，後來整地時經地方人士爭取才得以保留。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1674,"name":"屏東縣佳冬鄉蕭屋洋樓","lat":22.41809,"lng":120.550095,"cat":"history","tag":"歷史建築","desc":"經商致富的佳冬蕭家除了五落大厝，也在一九三〇年興建洋樓。入口上方用直線勾出回字形圖案，中央帶菱形紋，陽臺上的羅馬柱則點出當時流行的洋式風格。","area":"佳冬鄉・屏東縣","ph":"文"},{"id":1675,"name":"來義鄉二峰圳","lat":22.525956,"lng":120.656587,"cat":"history","tag":"文化景觀","desc":"鳥居信平為解決屏東旱季蔗田用水問題而規劃水圳，一九二三年完工。分水設施將水送入三條幹線，旁邊還有一棵相傳由他種下的老桃花心木。","area":"來義鄉・屏東縣","ph":"文"},{"id":1676,"name":"排灣族望嘉舊社-人頭骨架、頭骨塚紀念碑","lat":22.483056,"lng":120.655278,"cat":"history","tag":"古蹟","desc":"排灣族望嘉舊社的入口路旁，曾設有一座歷史悠久的頭骨架。日治時期，原有頭骨被集中埋藏，並立下刻有望嘉社名稱的頭骨塚石碑，留下部落歷史的印記。","area":"來義鄉・屏東縣","ph":"文"},{"id":1677,"name":"六堆天后宮","lat":22.615253,"lng":120.566357,"cat":"worship","tag":"古蹟","desc":"清代內埔庄街位在六堆客庄往來的中心，地方居民希望在此合建媽祖廟。鍾麟江倡議後，六十多個客庄共同募資，讓分散各地的居民有了共同祭祀媽祖的地方。","area":"內埔鄉・屏東縣","ph":"文"},{"id":1678,"name":"屏東縣內埔鄉老埤村馬卡道老祖祠","lat":22.6343,"lng":120.600603,"cat":"worship","tag":"歷史建築","desc":"老埤村的馬卡道老祖祠，外觀近似伯公祠，琉璃瓦鋪成兩面斜坡屋頂。祭祀者口述，村民戰後為安置離開原本祭祀場所的祀壺，在庄北建起這座小祠。","area":"內埔鄉・屏東縣","ph":"文"},{"id":1679,"name":"新北勢庄東柵門","lat":22.626831,"lng":120.544222,"cat":"history","tag":"古蹟","desc":"客庄東側的柵門以卵石砌牆腳、磚牆承重，牆內仍能辨認安放門栓的孔洞。牆腳還放著早年榨糖用的石製碾具，後來改作保護牆基的石墩。","area":"內埔鄉・屏東縣","ph":"文"},{"id":1680,"name":"南州糖廠砂糖倉庫","lat":22.4942,"lng":120.517899,"cat":"history","tag":"歷史建築","desc":"糖廠旁四棟單層磚木倉庫，曾用來存放製成的砂糖。倉庫外牆沒有窗戶，前方水泥地留有軌道和鋼構月台棚架，可見倉儲與鐵路原本如何銜接。","area":"南州鄉・屏東縣","ph":"文"},{"id":1681,"name":"溪北國民小學神社遺構","lat":22.495452,"lng":120.510704,"cat":"history","tag":"歷史建築","desc":"溪州糖廠早年提供土地興建尋常小學校，校園西南側另設神社。學校在戰時曾供軍隊臨時駐紮，戰後原有神社拆除，留下遺構記錄校地的變遷。","area":"南州鄉・屏東縣","ph":"文"},{"id":1682,"name":"下淡水溪鐵橋（高屏溪舊鐵橋）","lat":22.660925,"lng":120.441838,"cat":"history","tag":"古蹟","desc":"高屏溪舊稱下淡水溪，河面上的鐵橋於一九一三年通車，專供列車跨越大河。這項工程將兩岸的鐵路接起來，也讓下淡水溪的舊河名留在橋名裡。","area":"屏東市・屏東縣","ph":"文"},{"id":1683,"name":"中山公園內水池橋樑","lat":22.675639,"lng":120.492611,"cat":"nature","tag":"歷史建築","desc":"屏東中山公園水池上的橋，曾是日治時期阿猴神社參拜路線上的神道橋。原來的神社後改稱阿緱神社，戰後一度轉作忠烈祠，池上的橋也留存這段沿革。","area":"屏東市・屏東縣","ph":"文"},{"id":1684,"name":"中山公園內防空洞與涼亭","lat":22.675639,"lng":120.492611,"cat":"nature","tag":"歷史建築","desc":"屏東公園東南角的防空洞與涼亭，原址曾是日治時期的末廣稻荷社。戰後約在一九四八至一九四九年間拆除神社、改建設施，讓同個角落留下不同時期的用途。","area":"屏東市・屏東縣","ph":"文"},{"id":1685,"name":"光復紀念碑","lat":22.675639,"lng":120.492611,"cat":"history","tag":"歷史建築","desc":"這塊紀念碑原址在日治時期立有忠魂碑，紀念霧台抗日事件等戰事中身亡的日籍軍警。一九四七年改立光復紀念碑，下方矩形石砌基座仍可見早年樣式。","area":"屏東市・屏東縣","ph":"文"},{"id":1686,"name":"原屏東水道水源地","lat":22.67024,"lng":120.50277,"cat":"history","tag":"文化景觀","desc":"屏東舊水源地裡，從鑿井、集水井到氣曝池、過濾池與淨水池，仍可順著設施辨認供水程序。場區內還留有唧筒室與配水塔，保存城市早年用水的工程痕跡。","area":"屏東市・屏東縣","ph":"文"},{"id":1687,"name":"原日本第八飛行聯隊隊長官舍","lat":22.674778,"lng":120.484806,"cat":"history","tag":"歷史建築","desc":"屏東中山路這座官舍建於一九三七年，原供駐地飛行部隊長官居住。屋頂鋪黑瓦，入口的小門廊內凹，外牆上帶不規則溝紋的面磚尤其有辨識度。","area":"屏東市・屏東縣","ph":"文"},{"id":1688,"name":"原臺灣銀行屏東支店","lat":22.671387,"lng":120.489385,"cat":"history","tag":"歷史建築","desc":"臺灣銀行在屏東的業務據點原叫阿緱出張所，後來因地名與制度調整而改稱屏東支店。日治時期曾改建為兩層樓，戰後又加蓋一層，成為後來的三層樓房。","area":"屏東市・屏東縣","ph":"文"},{"id":1689,"name":"宗聖公祠","lat":22.667194,"lng":120.491583,"cat":"worship","tag":"古蹟","desc":"六堆客家曾氏族人籌資建起宗祠，一九二九年完工，奉祀宗聖曾子與歷代祖先。祠內也供奉曾子之父曾點和夏禹，將族譜源流放進共同祭祀的空間。","area":"屏東市・屏東縣","ph":"文"},{"id":1690,"name":"小陽。日栽書屋","lat":22.67812,"lng":120.4858,"cat":"culture","desc":"二〇一五年成立的獨立書屋，伴著眷村老建築修整，一路走進勝利星村的日常。書屋取「日得知、識成林」之意，把閱讀比作每天照顧植栽、讓它慢慢長大的事。","area":"屏東市・屏東縣","ph":"觀"},{"id":1691,"name":"屏東公園共融遊戲場","lat":22.67439,"lng":120.4902,"cat":"nature","desc":"屏東公園的遊戲場把紅尾伯勞做成六公尺高的溜滑梯，孩子可沿不同難度的路徑往上爬。從鳥眼的位置往外望，視角就像從樹上看公園，旁邊另有沙坑與鞦韆。","area":"屏東市・屏東縣","ph":"觀"},{"id":1692,"name":"屏東和平共融遊戲場","lat":22.68463,"lng":120.50123,"cat":"nature","desc":"和平公園設有樹屋、鑽石爬網，也有輪椅鞦韆和無障礙滑軌，讓不同需求的孩子一同參與。廣場上的復古汲水泵浦與花灑區，則提供另一種親手玩水的方式。","area":"屏東市・屏東縣","ph":"觀"},{"id":1693,"name":"屏東市勝利新村、崇仁新村（成功區）日治時期軍官眷舍","lat":22.674238,"lng":120.484349,"cat":"culture","tag":"歷史建築","desc":"眷舍成排坐落在屏東街區，日治時期的官舍與前後庭院仍留下生活細節。有些院中留著可裝水或細砂的消防槽，圍牆也設小孔，讓垃圾從街道一側直接清運。","area":"屏東市・屏東縣","ph":"文"},{"id":1694,"name":"屏東市大和旅社","lat":22.670119,"lng":120.48674,"cat":"history","tag":"歷史建築","desc":"屏東火車站旁的旅社於一九三四年創設，是早年旅人出入車站時熟悉的落腳處。後來經營權由陳家轉交鍾家，改名大成旅社，建築也留下站前商業的記憶。","area":"屏東市・屏東縣","ph":"文"},{"id":1695,"name":"屏東市海豐鄭家古厝","lat":22.699117,"lng":120.511686,"cat":"history","tag":"歷史建築","desc":"祖籍惠州海豐的鄭家在屏東定居，老宅於一九一四年興建。三合院後方的兩層洋樓以紅磚砌起弧拱，石門額寫著「榮陽」，閩式宅院裡也看得到西式裝飾。","area":"屏東市・屏東縣","ph":"文"},{"id":1696,"name":"屏東書院","lat":22.67866,"lng":120.492768,"cat":"history","tag":"古蹟","desc":"清代鳳山知縣吳性誠命郭萃、林夢陽等人興建書院，最初因經費有限，只先建成屋身。後來地方仕紳陸續募捐補上漆繪、購置田產，才有了繼續辦學的根基。","area":"屏東市・屏東縣","ph":"文"},{"id":1697,"name":"屏東永大共融遊戲場","lat":22.66054,"lng":120.47779,"cat":"nature","desc":"永大遊戲場把一艘大海盜船放進沙坑中央，船上有溜滑梯、平衡木、望遠鏡和傳聲筒。旁邊另設輪椅使用者也能靠近的沙桌，大人則可使用健身器材。","area":"屏東市・屏東縣","ph":"觀"},{"id":1698,"name":"屏東演武場","lat":22.674526,"lng":120.490402,"cat":"culture","tag":"歷史建築","desc":"日治時期供人練習武道的演武場，入口以帶曲線的唐破風屋頂突顯門廊。建築修復後改作展覽、藝文體驗與教育空間，和屏東美術館及廣場連成一片。","area":"屏東市・屏東縣","ph":"文"},{"id":1699,"name":"屏東玉皇宮","lat":22.66686,"lng":120.49222,"cat":"worship","desc":"這座廟宇的前身是民族路夜市裡的碧山堂，早年奉祀媽祖並以扶乩濟世。後來遷往仁愛路、改名玉皇宮，也增祀玄天上帝，信仰隨著廟址一同延續。","area":"屏東市・屏東縣","ph":"觀"},{"id":1700,"name":"屏東糖廠","lat":22.66141,"lng":120.493,"cat":"history","desc":"臺灣製糖株式會社在阿緱廳歸來庄設工場，一九〇七年落成後開始製糖。戰後改為臺糖屏東糖廠，從早年的阿緱分工場到屏東糖廠，廠名也記錄地方糖業的時代轉換。","area":"屏東市・屏東縣","ph":"觀"},{"id":1701,"name":"屏東縣民公園","lat":22.65739,"lng":120.4961,"cat":"nature","desc":"殺蛇溪北岸的糖廠土地，經整理後成為屏東市民的公共綠地。園裡留有紙漿廠遺跡，還能從糖業主題的水景走到大樹廣場，沿途看看產業舊址的新面貌。","area":"屏東市・屏東縣","ph":"觀"},{"id":1702,"name":"屏東縣立圖書館總館","lat":22.68341,"lng":120.50414,"cat":"nature","desc":"屏東縣圖總館從不同年齡讀者的需求安排空間，一樓為嬰幼兒保留專區。家具高度配合孩子的視線，五感玩具與可清洗的爬行地板，也讓幼兒能自在探索。","area":"屏東市・屏東縣","ph":"觀"},{"id":1703,"name":"屏東美術館","lat":22.67485,"lng":120.48991,"cat":"culture","desc":"屏東市公所舊辦公廳舍由公所技士林榕樟設計監造，於一九五三年啟用。市公所遷出後，這棟戰後早期縣轄市的行政建築轉作美術館，展開另一段公共生活。","area":"屏東市・屏東縣","ph":"觀"},{"id":1704,"name":"屏東藝術館","lat":22.67709,"lng":120.47726,"cat":"culture","desc":"屏東文化中心籌設時，將藝術館與圖書館分開規劃，讓表演藝術有自己的劇場。館內舞台、排練室與化妝室支援音樂、舞蹈及戲劇演出，也能舉辦文化講座。","area":"屏東市・屏東縣","ph":"觀"},{"id":1705,"name":"屏東蘭州共融遊戲場","lat":22.68026,"lng":120.48532,"cat":"nature","desc":"屏東市這座遊戲場把各式動物外形融入溜滑梯，分成鯨魚、恐龍、貓狗、森林和幼兒等區。除了遊具各有模樣，就連廁所也做成一隻大瓢蟲。","area":"屏東市・屏東縣","ph":"觀"},{"id":1706,"name":"屏菸1936文化基地","lat":22.66258,"lng":120.50496,"cat":"culture","desc":"一九三六年設立的屏東菸葉廠，在停止運作後整區登錄為歷史建築。後來改作文化基地，以博物館和文創空間延續老廠房，從屏東的角度介紹地方文化。","area":"屏東市・屏東縣","ph":"觀"},{"id":1707,"name":"幸福公園","lat":22.67829,"lng":120.49134,"cat":"nature","desc":"屏東市街角的共融遊戲場，設有飛機造型攀爬架和三座磨石子溜滑梯。孩子可在沙坑玩耍，園裡還有親子鞦韆與輪椅使用者也能玩的鞦韆。","area":"屏東市・屏東縣","ph":"觀"},{"id":1708,"name":"復興公園","lat":22.65953,"lng":120.48466,"cat":"nature","desc":"屏東這座遊戲場從蜂巢得到靈感，讓六角形空間往上堆疊、向旁交錯。蜜蜂與採蜜造型穿插在遊具之間，孩子可以穿過一格格蜂巢，逐一發現不同玩法。","area":"屏東市・屏東縣","ph":"觀"},{"id":1709,"name":"慈鳳宮","lat":22.67094,"lng":120.48632,"cat":"worship","desc":"屏東人奉祀的阿猴媽祖，與地方繞境、會香和文化季相連。大殿裡的石鼓、蟠龍石柱雕紋細膩，殿上老匾和記錄史事的碑刻，也留有清代信仰的痕跡。","area":"屏東市・屏東縣","ph":"觀"},{"id":1710,"name":"牛疫紀念碑","lat":22.673861,"lng":120.505071,"cat":"history","tag":"歷史建築","desc":"日治初期屏東曾設牛疫血清製造所，地方經歷多年的防疫工作，到一九二〇年撲滅牛疫。人們因此立下紀念碑，為影響牛隻與地方生活的疫災留下記錄。","area":"屏東市・屏東縣","ph":"文"},{"id":1711,"name":"職人町","lat":22.67245,"lng":120.49484,"cat":"culture","desc":"林務局舊宿舍曾作為安置單親媽媽的彩虹家園，後來又成為青年創業的空間。老房舍如今匯集年輕職人與移民族群的創作，也將屏東地方品牌帶進眷宿巷弄。","area":"屏東市・屏東縣","ph":"觀"},{"id":1712,"name":"蕭氏家廟","lat":22.686111,"lng":120.481917,"cat":"worship","tag":"古蹟","desc":"崇蘭蕭家的宗祠建於清光緒年間，日治時期再度重修，至今持續祭祀先祖。木構廳堂裡的傳統工藝，也與蕭家後代在此聚集的家族記憶相連。","area":"屏東市・屏東縣","ph":"文"},{"id":1713,"name":"邱姓河南堂忠實第","lat":22.673333,"lng":120.507306,"cat":"worship","tag":"歷史建築","desc":"屏東邱家的忠實第留下客家宅第的格局，木雕、泥塑、彩繪與交趾陶裝點其間。老屋也作為社區展覽和親子教學空間，讓地方歷史回到鄉土課堂。","area":"屏東市・屏東縣","ph":"文"},{"id":1714,"name":"阿猴城門(朝陽門)","lat":22.676278,"lng":120.491908,"cat":"history","tag":"古蹟","desc":"清道光年間，阿猴街居民和官府合力築城，朝陽門便是當時城壘留下的入口。拱形門洞以磚砌成，左右搭配卵石城牆，轉角又以交錯砌磚銜接。","area":"屏東市・屏東縣","ph":"文"},{"id":1715,"name":"阿緱糖廠辦公廳舍(第一本館、第二本館、第三本館、第四本館、第五本館)","lat":22.661279,"lng":120.493172,"cat":"history","tag":"歷史建築","desc":"屏東糖廠的五棟辦公廳舍留下日治時期糖業機構的行政空間。第五本館可見洗石子和褐色磚搭配的外牆，東側旋梯通往二樓，屋脊還有鳩尾造型的鬼瓦。","area":"屏東市・屏東縣","ph":"文"},{"id":1716,"name":"高屏舊鐵橋與河濱公園","lat":22.66522,"lng":120.44553,"cat":"nature","desc":"舊鐵橋從九曲堂跨越高屏溪通往六塊厝，清代舊河名讓它也被稱為下淡水溪鐵橋。這座一九一三年興建、長逾一千五百公尺的橋，曾是高屏兩地重要的鐵路連結。","area":"屏東市・屏東縣","ph":"觀"},{"id":1717,"name":"力社村陳家古厝","lat":22.541736,"lng":120.511387,"cat":"history","tag":"古蹟","desc":"陳家祖先沿東港溪來到力社開墾，在一九一六年仿家鄉住宅式樣興建老宅。護龍山牆下段砌石、上段砌磚，氣窗與入口兩旁的冊頁匾也可細看。","area":"崁頂鄉・屏東縣","ph":"文"},{"id":1718,"name":"恆春古城","lat":22.008049,"lng":120.747976,"cat":"history","tag":"古蹟","desc":"古稱瑯嶠的恆春，坐落在臺地與中央山脈尾端之間的縱谷平原。清代城內街道呈雙丁字形，居民集中於西門、南門，北門一帶為練兵營，四門各有不同的地方記憶。","area":"恆春鎮・屏東縣","ph":"文"},{"id":1719,"name":"恆春蘭軍楚勇義塚","lat":22.003813,"lng":120.754975,"cat":"history","tag":"古蹟","desc":"恆春古城東門外的義塚，合葬清代駐守恆春的蘭軍與楚勇兵士。義塚始建於一八七九年，今天位在第一公墓內，也能與地方志中記載的駐軍歷史相對照。","area":"恆春鎮・屏東縣","ph":"文"},{"id":1720,"name":"鵝鑾鼻燈塔","lat":21.902235,"lng":120.852657,"cat":"history","tag":"古蹟","desc":"臺灣南端岬角上的燈塔舊稱南岬燈塔，興建背景與清末接連發生的海難有關。戰後更換旋轉透鏡電燈，照向巴士海峽與太平洋交會的海面，因而有「東亞之光」的美稱。","area":"恆春鎮・屏東縣","ph":"文"},{"id":1721,"name":"建功庄東柵門","lat":22.48012,"lng":120.56379,"cat":"history","tag":"古蹟","desc":"建功庄東邊的客家柵門，門額可見摹自乾隆御筆的「褒忠」二字。兩側留下卵石護牆，門樓上方以仰合瓦鋪成燕尾屋脊，彩繪浮雕點出村庄入口。","area":"新埤鄉・屏東縣","ph":"文"},{"id":1722,"name":"新埤玉環善牧天主堂","lat":22.495194,"lng":120.590561,"cat":"worship","tag":"歷史建築","desc":"新埤的圓筒形教堂，由德籍道明會傳教士規劃，一九六五年興建。來自浙江披山島的玉環新村居民與鄰近馬卡道族人合力施工，把沿山地區不同族群的生活史留在堂內。","area":"新埤鄉・屏東縣","ph":"文"},{"id":1723,"name":"春日鄉力里溪水圳進水塔","lat":22.442833,"lng":120.651167,"cat":"history","tag":"歷史建築","desc":"屏東蔗田需要穩定的灌溉水源，日治時期便在力里溪上游河床下興築水圳。這座一九二五年興建的進水設施汲取伏流水，記下沿溪農田與製糖產業的關係。","area":"春日鄉・屏東縣","ph":"文"},{"id":1724,"name":"浸水營古道(屏東段)","lat":22.407566,"lng":120.756419,"cat":"history","tag":"文化景觀","desc":"屏東山區的古道曾串連臺灣東西兩側，也是南部各部落往來的路徑。歷代行人循路遷居、交易、送信或傳教，讓這段山路留下不同族群穿越山脈的記憶。","area":"春日鄉・屏東縣","ph":"文"},{"id":1725,"name":"人工溼地公園","lat":22.45104,"lng":120.4557,"cat":"nature","desc":"大鵬灣由蚵田與軍事用地轉為遊憩水域時，也面臨改善水質的需要。人工濕地兼顧淨水與復育，讓原有的濱灣濕地景觀，重新成為認識潟湖的一部分。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1726,"name":"原東港警察官舍群及原東港辦務署署長官舍","lat":22.466289,"lng":120.446296,"cat":"history","tag":"歷史建築","desc":"東港辦務署署長的宿舍在十九世紀末就已建成，周邊另有警察官舍與水上警察見張所。這組房舍保留了早期地方行政人員在港鎮裡居住與工作的痕跡。","area":"東港鎮・屏東縣","ph":"文"},{"id":1727,"name":"映霞橋亭","lat":22.44131,"lng":120.4918,"cat":"scenic","desc":"通往大鵬灣左岸濕地的步行與自行車橋，跨過林邊大排，橋面上有涼亭般的屋頂。透光雙斜面搭配Ｖ形木百葉，既順應南方日照，也減少通行對周邊動物的干擾。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1728,"name":"東港海鮮街","lat":22.46488,"lng":120.4492,"cat":"structure","desc":"東港漁港隔海望向小琉球，凌晨便有漁船進出，一天的魚貨買賣隨之展開。當地海鮮街與漁港作息緊密相連，黑鮪魚季也成了人們認識東港漁業的時節。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1729,"name":"東港聖彌額爾天主堂","lat":22.465917,"lng":120.453004,"cat":"worship","tag":"歷史建築","desc":"東港天主堂的造型取自《舊約》中旅途中搭起帳篷敬拜的故事。主堂外牆以洗石子作成，少有繁複雕飾，西南側的四層方塔讓人從街上便能辨認。","area":"東港鎮・屏東縣","ph":"文"},{"id":1730,"name":"東隆宮","lat":22.46314,"ln
