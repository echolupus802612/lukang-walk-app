韻洪扆兄弟古厝","lat":24.418661,"lng":118.301498,"cat":"history","tag":"古蹟","desc":"洪家兄弟的宅院以前後房舍組成近似三進的格局，屋頂兼有翹脊和圓脊。牆上大量運用「出磚入石」，紅磚與石塊交錯，立面富有變化。","area":"金城鎮・金門縣","ph":"文"},{"id":5500,"name":"文臺寶塔","lat":24.39877,"lng":118.306013,"cat":"history","tag":"古蹟","desc":"明洪武年間，周德興奉命在金門建造三座石塔，這座寶塔就是其中之一。它歷經戰事仍保有原貌，也是金門倖存、未受砲彈損傷的明代石塔。","area":"金城鎮・金門縣","ph":"文"},{"id":5501,"name":"明遺老街","lat":24.40359,"lng":118.30875,"cat":"structure","desc":"金門城北門外這條老街已有四百多年歷史，兩旁並排著低矮街屋。街道原來在東西南北四個出口都設有隘門，保留了早年城外市街的格局。","area":"金城鎮・金門縣","ph":"觀"},{"id":5502,"name":"李氏家廟","lat":24.41101,"lng":118.29718,"cat":"worship","tag":"歷史建築","desc":"這座家廟以院門圍起正屋，屋頂是閩南式雙斜坡。抬頭能看見剪黏和泥塑裝飾，屋脊兩端還各藏著釉陶做成的龍形飾物。","area":"金城鎮・金門縣","ph":"文"},{"id":5503,"name":"林可遠三落大厝","lat":24.43319,"lng":118.31897,"cat":"history","tag":"歷史建築","desc":"這座三進閩南大厝是地方仕紳林可遠的故居，他也是捐建奎閣的林斐章之孫。清同治年間，他因協助鄉里防盜，曾獲贈「利周鄉黨」匾額。","area":"金城鎮・金門縣","ph":"文"},{"id":5504,"name":"模範街（一度於戰地政務時期稱為自強街)","lat":24.43193,"lng":118.31924,"cat":"history","tag":"歷史建築","desc":"兩層樓的店屋沿街相連，紅磚拱圈串出一排騎樓。抬頭看屋頂邊緣，還有綠釉花瓶形欄杆，和下面一層層挑出的紅磚裝飾相映。","area":"金城鎮・金門縣","ph":"文"},{"id":5505,"name":"歐厝戰車","lat":24.39547,"lng":118.33486,"cat":"other","desc":"歐厝海灘留下的美製「地獄貓」驅逐戰車，曾在訓練場裡充當標靶。訓練場裁撤後，車身留在海邊，退潮時就能看見它的模樣。","area":"金城鎮・金門縣","ph":"觀"},{"id":5506,"name":"歐陽鐘遠洋樓","lat":24.408052,"lng":118.331587,"cat":"history","tag":"歷史建築","desc":"歐陽鐘遠在新加坡和馬來西亞經商後，把錢寄回家鄉興建這棟洋樓。一九一八年落成時，聚落裡的人稱它為「歐厝大樓」。","area":"金城鎮・金門縣","ph":"文"},{"id":5507,"name":"水頭417 地號洋樓（出洋客的故事）","lat":24.40964,"lng":118.29834,"cat":"history","tag":"歷史建築","desc":"這棟房子原本是大宅的側翼，因基地較深，便蓋成兩層樓。前方加上一座捲棚小亭，磚牆和條石牆之間保有閩南住宅與洋樓結合的格局。","area":"金城鎮・金門縣","ph":"文"},{"id":5508,"name":"水頭57 地號洋樓（僑鄉文化展示）","lat":24.409663,"lng":118.29891,"cat":"history","tag":"歷史建築","desc":"得月樓旁的老洋樓經整修後，展示金門人早年僑居南洋的生活。屋內的房間配置和建材兼有中西特色，展覽也談到當年的衣食住行。","area":"金城鎮・金門縣","ph":"文"},{"id":5509,"name":"水頭王氏古厝","lat":24.41133,"lng":118.29608,"cat":"history","tag":"歷史建築","desc":"王家老宅原可追溯至明末清初，最初只有後面一進，四面牆各用不同材料構築。後來整修將牆面抹灰，原先的砌法已不容易從外觀辨認。","area":"金城鎮・金門縣","ph":"文"},{"id":5510,"name":"水頭黃氏酉堂別業","lat":24.410643,"lng":118.298142,"cat":"worship","tag":"古蹟","desc":"黃家的書院宅第，曾把講學、居住和遊賞安排在同一座院子裡。早年庭院有池沼與曲橋，如今主要作為住宅使用。","area":"金城鎮・金門縣","ph":"文"},{"id":5511,"name":"水頭（又名前水頭、金水）","lat":24.41147,"lng":118.29996,"cat":"history","tag":"歷史建築","desc":"金城鎮西南方的聚落也叫金水，以黃姓居民為主，同時有其他姓氏人家。早年它位在金門和廈門往來的要點，聚落生活與海上交通關係密切。","area":"金城鎮・金門縣","ph":"文"},{"id":5512,"name":"泰安宮","lat":24.41644,"lng":118.31104,"cat":"worship","area":"金城鎮・金門縣","ph":"觀"},{"id":5513,"name":"洪克保番仔厝","lat":24.41819,"lng":118.30124,"cat":"history","tag":"歷史建築","desc":"前棟是俗稱番仔厝的住宅，後棟留有一廳兩房，中間隔著天井。正面下方用泉州白石砌牆，上方抹蚵殼灰，側邊則換成一條條平砌的石材。","area":"金城鎮・金門縣","ph":"文"},{"id":5514,"name":"洪合剩、洪合達宅","lat":24.4333,"lng":118.31844,"cat":"history","tag":"歷史建築","desc":"洪家兄弟早年到印尼做土產生意，返鄉後在後浦並排蓋了兩棟大厝。這棟屬於洪合剩與洪合達，隔壁就是兄弟洪合淵的家。","area":"金城鎮・金門縣","ph":"文"},{"id":5515,"name":"洪合淵宅","lat":24.43326,"lng":118.3185,"cat":"history","tag":"歷史建築","desc":"印尼土產生意做起來後，洪合淵兄弟把資金帶回後浦。兩棟相連的兩進大宅在一九三〇年落成，右鄰是弟兄洪合剩和洪合達的宅院。","area":"金城鎮・金門縣","ph":"文"},{"id":5516,"name":"浯島城隍廟","lat":24.43246,"lng":118.31617,"cat":"worship","desc":"後浦的城隍信仰和總兵衙署的遷移有關。清康熙年間，陳龍把衙署由金門城移到後浦，也分香奉祀城隍爺，至今已延續三百多年。","area":"金城鎮・金門縣","ph":"觀"},{"id":5517,"name":"浯江書院","lat":24.43424,"lng":118.31704,"cat":"history","desc":"後浦鬧區裡的書院，講堂桌椅仍整齊地面向朱熹像排列。從這個安靜角落的陳設，還能看出早年學子坐在堂下受教的情景。","area":"金城鎮・金門縣","ph":"觀"},{"id":5518,"name":"清金門鎮總兵署","lat":24.43225,"lng":118.31836,"cat":"history","tag":"古蹟","desc":"總兵署原址叫作「叢青軒」，相傳明代進士許獬曾在這裡讀書。到了清康熙年間，總兵陳龍看中後浦人丁興旺，才把衙署從舊金門城遷來。","area":"金城鎮・金門縣","ph":"文"},{"id":5519,"name":"漢影雲根摩崖石刻群","lat":24.393855,"lng":118.312654,"cat":"history","tag":"古蹟","desc":"古崗湖南側的獻台山上，岩壁刻著明魯王親筆留下的題字。魯王為反清復明曾在金門停留十多年，這方石刻便是他駐留島上的痕跡。","area":"金城鎮・金門縣","ph":"文"},{"id":5520,"name":"燕南書院暨太文巖寺舊址","lat":24.406685,"lng":118.31373,"cat":"worship","tag":"文化景觀","desc":"金門燕南山上的書院，相傳與宋代學者朱熹有關。如今原址重建的中殿奉祀黑面清水祖師，後殿則為朱子殿。","area":"金城鎮・金門縣","ph":"文"},{"id":5521,"name":"珠山下三落","lat":24.40208,"lng":118.32133,"cat":"history","tag":"古蹟","desc":"這座三進大厝前方緊鄰大潭，空間窄，又是村裡往來的通道，主要入口便轉向一側。屋身以泉州白石墊底，上方則是抹了灰漿的紅磚牆。","area":"金城鎮・金門縣","ph":"文"},{"id":5522,"name":"珠山大道宮","lat":24.401864,"lng":118.320617,"cat":"worship","tag":"歷史建築","desc":"宮廟前後兩進，右側連著護龍，閩南式斜屋頂配上向內收起的翹脊。靠近細看，屋脊和山牆上方還裝飾著交趾陶與剪黏。","area":"金城鎮・金門縣","ph":"文"},{"id":5523,"name":"珠山聚落","lat":24.40148,"lng":118.32058,"cat":"history","desc":"金門西南方的村落以薛姓一家族為主，祖先在元代從廈門薛嶺前來定居。民居坐落在周圍高地之間，聚族而居的歷史已延續數百年。","area":"金城鎮・金門縣","ph":"觀"},{"id":5524,"name":"珠山（薛厝坑、山仔兜）","lat":24.402099,"lng":118.321008,"cat":"history","tag":"歷史建築","desc":"聚落裡的房舍順著山勢密密排開，既有閩南古厝，也有後來蓋的洋樓。老房子的花崗石牆有的排成人字形，有的以大小不一的石塊交錯砌成。","area":"金城鎮・金門縣","ph":"文"},{"id":5525,"name":"珠浦許氏家廟","lat":24.43152,"lng":118.31605,"cat":"worship","tag":"歷史建築","desc":"許氏家廟前後有三進，兩側外牆下半部以花崗石疊砌，上方改用磚。前進屋簷使用金門少見的斷簷升箭口做法，和後兩進的雙坡瓦頂不同。","area":"金城鎮・金門縣","ph":"文"},{"id":5526,"name":"白氏先祖草寮舊址（現為王宅）","lat":24.412644,"lng":118.296167,"cat":"history","tag":"歷史建築","desc":"宅前以帶屋頂的院門作為入口，正屋和兩旁房舍的屋脊各有特色。正屋雙坡瓦頂的脊尾上翹，側邊則有圓脊、水泥瓦頂和平屋頂。","area":"金城鎮・金門縣","ph":"文"},{"id":5527,"name":"翟山坑道","lat":24.3903,"lng":118.32054,"cat":"history","area":"金城鎮・金門縣","ph":"觀"},{"id":5528,"name":"茅山塔","lat":24.40861,"lng":118.28834,"cat":"history","desc":"金門島西南角的古塔鄰近港區，站上觀景平台，港口景色就在眼前。目光再放遠些，還能看到金城市區、后豐港和海上的建功嶼。","area":"金城鎮・金門縣","ph":"觀"},{"id":5529,"name":"莒光樓","lat":24.42478,"lng":118.31872,"cat":"history","tag":"古蹟","desc":"豐蓮山旁的樓閣把傳統城樓架在現代建築基座之上，是金門的象徵之一。從樓上向外看，能將金城一帶的景色收入眼底。","area":"金城鎮・金門縣","ph":"文"},{"id":5530,"name":"莒光湖","lat":24.42739,"lng":118.31647,"cat":"other","desc":"湖畔的大草地和兒童遊具，讓這裡成了金城居民週末散步、野餐的地方。傍晚水岸燈光亮起，湖面還會映著夕陽的橘紅色。","area":"金城鎮・金門縣","ph":"觀"},{"id":5531,"name":"葉華成故居（葉華成酒史館）","lat":24.39932,"lng":118.30582,"cat":"history","desc":"葉華成的閩南大宅整修後，成了記錄金酒歷史的展館。從蒸煮、培麴到灌裝，展覽把製酒工序和金門人的日常生活放在一起介紹。","area":"金城鎮・金門縣","ph":"觀"},{"id":5532,"name":"董允耀洋樓","lat":24.39978,"lng":118.31371,"cat":"history","tag":"古蹟","desc":"古崗村雙峰巖宮下方，坐落著一棟保存完整的洋樓。它將中式與西式建築元素放在一起，從村裡遠遠望過去，就能辨認出宅子的輪廓。","area":"金城鎮・金門縣","ph":"文"},{"id":5533,"name":"董光得洋樓","lat":24.4004,"lng":118.31379,"cat":"history","tag":"歷史建築","desc":"董光得曾在董允耀的公司擔任會計，把積蓄寄回金門蓋起這棟洋樓。抬頭看山牆，立體花卉泥塑之間還留著屋主姓名的羅馬拼音。","area":"金城鎮・金門縣","ph":"文"},{"id":5534,"name":"董石獅、董詩揚(石羊)二落大厝","lat":24.398654,"lng":118.314829,"cat":"history","tag":"歷史建築","desc":"董家兄弟與下一代在新加坡打拚，把錢合起來蓋了這座兩進大厝。建造時由董詩揚在家鄉監工，還請來兩組師傅共同施作。","area":"金城鎮・金門縣","ph":"文"},{"id":5535,"name":"蔡開盛宅第","lat":24.41092,"lng":118.29807,"cat":"history","tag":"歷史建築","desc":"蔡開國與蔡清竹叔姪在印尼經營土產，匯款回家請蔡開盛興建宅第。房舍前後兩進，右側又加上樓房，當年的花費有一半用在室內裝修。","area":"金城鎮・金門縣","ph":"文"},{"id":5536,"name":"薛氏大宗宗祠","lat":24.40188,"lng":118.32165,"cat":"worship","tag":"歷史建築","desc":"這是開浯始祖薛貞固之後，仁、義、禮、智、信五房後人共同的宗祠。清乾隆年間由義房族人倡建，後來歷經數次修繕。","area":"金城鎮・金門縣","ph":"文"},{"id":5537,"name":"薛永南兄弟大樓","lat":24.40267,"lng":118.32065,"cat":"history","tag":"歷史建築","desc":"薛家兄弟在菲律賓經商致富後，回鄉蓋了這棟帶連續拱柱的洋樓。每層保留一廳四房的格局，從二樓外廊還能望見以宗祠為中心的珠山聚落。","area":"金城鎮・金門縣","ph":"文"},{"id":5538,"name":"薛清江宅","lat":24.41184,"lng":118.33633,"cat":"history","tag":"歷史建築","desc":"這座兩進大厝建於一九三五年，正面的泉州白石板與紅磚排列出牆面層次。屋內從木作格扇到腳下鋪面都很細緻，前進牆頭還做了書卷裝飾。","area":"金城鎮・金門縣","ph":"文"},{"id":5539,"name":"薛芳見洋樓","lat":24.401066,"lng":118.32066,"cat":"history","tag":"歷史建築","desc":"這棟用菲律賓僑匯興建的高樓，以前兼有防禦用途，鄉人暱稱「機關樓」。二樓門邊還有一方石刻，留下屋主以及木匠、石匠等師傅的名字。","area":"金城鎮・金門縣","ph":"文"},{"id":5540,"name":"虛江嘯臥石刻群","lat":24.398418,"lng":118.305675,"cat":"history","tag":"古蹟","desc":"文臺寶塔南邊的山麓有一群巨石，石面上留下明清文人與武將的詩文。人們熟悉的「虛江嘯臥」四字，就是明代將領俞大猷的題刻。","area":"金城鎮・金門縣","ph":"文"},{"id":5541,"name":"豐蓮山牧馬侯祠","lat":24.42061,"lng":118.32238,"cat":"worship","tag":"古蹟","desc":"三進古廟供奉被稱為「開浯恩主」的陳淵，今天的樣貌源於清道光年間重建。當地流傳他顯靈保護鄉民的故事，也留下「福佑聖侯」的封號。","area":"金城鎮・金門縣","ph":"文"},{"id":5542,"name":"迴向殿","lat":24.40408,"lng":118.30951,"cat":"worship","desc":"金門城北門外的明遺老街走到底，就是這座廟，廟門朝向街道。殿內奉祀北嶽大帝與玄天上帝等神明，另有四尊軍將爺陪祀。","area":"金城鎮・金門縣","ph":"觀"},{"id":5543,"name":"邱良功古厝","lat":24.43263,"lng":118.31792,"cat":"history","tag":"古蹟","desc":"浯江街中段的老屋是邱良功的祖厝，裡面還保存一面方形銅鏡。另有兩塊雕龍的石刻，每塊都刻著「聖旨」二字。","area":"金城鎮・金門縣","ph":"文"},{"id":5544,"name":"邱良功母節孝坊","lat":24.431385,"lng":118.318537,"cat":"history","tag":"古蹟","desc":"石坊為紀念邱良功的母親許氏獨力養育孩子而立，四根石柱撐起三層簷樓。仔細看石刻屋簷，瓦當、滴水和微翹的翼角都模仿木造屋頂。","area":"金城鎮・金門縣","ph":"文"},{"id":5545,"name":"鄧長壽洋樓","lat":24.432686,"lng":118.318246,"cat":"history","tag":"歷史建築","desc":"新加坡華僑鄧長壽於一九二一年興建這棟洋樓。戰地政務時期它曾是浯江招待所，後來也用來接待外賓、將領和來金門勞軍的藝人。","area":"金城鎮・金門縣","ph":"文"},{"id":5546,"name":"鄭文周番仔厝","lat":24.41237,"lng":118.29656,"cat":"history","tag":"歷史建築","desc":"鄭家兄弟在印尼泗水做土產與海運生意，把錢寄回家鄉改建宅院。原本的閩南大厝買下後，主屋改為番仔厝，前方仍保留傳統格局。","area":"金城鎮・金門縣","ph":"文"},{"id":5547,"name":"金城城區地下坑道","lat":24.433798,"lng":118.319934,"cat":"history","tag":"歷史建築","desc":"金城市區地底藏著戰地年代留下的坑道，從街面上很難看出它的存在。地上少數同時兼作其他用途的堡體，才透露地下建築的痕跡。","area":"金城鎮・金門縣","ph":"文"},{"id":5548,"name":"金城民防坑道","lat":24.43311,"lng":118.32021,"cat":"other","desc":"一九六八年起，金門開始利用島上的花崗岩地層大規模修築地下坑道。金城的民防坑道就是其中一處，留下城鎮與戰地生活相連的歷史。","area":"金城鎮・金門縣","ph":"觀"},{"id":5549,"name":"金城海濱休閒公園","lat":24.4302,"lng":118.31027,"cat":"nature","desc":"浯江溪出海口旁的公園兩面臨海，從岸邊可以望見烈嶼和建功嶼。沿途的植物也設有解說牌，讓人看海之餘能順道辨認海濱草木。","area":"金城鎮・金門縣","ph":"觀"},{"id":5550,"name":"金城車站","lat":24.43346,"lng":118.31989,"cat":"other","desc":"東門圓環旁的民生大樓有八層高，底層就是金城的公車站。大廳挑高且明亮，來往車班密集，是金門居民熟悉的交通據點。","area":"金城鎮・金門縣","ph":"觀"},{"id":5551,"name":"金水寺","lat":24.41214,"lng":118.29524,"cat":"worship","area":"金城鎮・金門縣","ph":"觀"},{"id":5552,"name":"金門城北門外明遺古街","lat":24.40368,"lng":118.3089,"cat":"structure","tag":"歷史建築","desc":"明代金門城內商業日漸興盛，沿著人來人往的北門往外延伸出這條街。靠城牆的一端叫「街頂」，另一端叫「街下」，中央還留著花崗石鋪面。","area":"金城鎮・金門縣","ph":"文"},{"id":5553,"name":"金門基督教會","lat":24.43364,"lng":118.31746,"cat":"worship","desc":"原有教堂不敷使用，歐陽候牧師便發起建新堂。會眾買下清代舊縣丞署的部分土地，一九二四年落成時，除了會所，這裡也設有小學和幼稚園。","area":"金城鎮・金門縣","ph":"觀"},{"id":5554,"name":"金門朱子祠","lat":24.434501,"lng":118.317379,"cat":"worship","tag":"古蹟","desc":"從儀門走入書院，經過講堂，到最深處才是朱子祠，兩側廊邊原有學舍。祠前伸出的月臺是接詔行禮的地方，後方還有一座敬字亭。","area":"金城鎮・金門縣","ph":"文"},{"id":5555,"name":"金門石雕公園","lat":24.42688,"lng":118.31549,"cat":"nature","desc":"浯江溪口南岸散落著大型雕塑，作品的材料都取自金門本地的花崗岩。園內除了石雕，也有小橋流水和為紀念胡璉而建的伯玉亭。","area":"金城鎮・金門縣","ph":"觀"},{"id":5556,"name":"閩王祠","lat":24.431968,"lng":118.318427,"cat":"worship","tag":"歷史建築","desc":"祠堂前後兩進，屋頂鋪著筒瓦，翹起的脊線上用花磚和剪黏裝飾。從側面看，黑色面磚下是橫向平砌的花崗石條，兩種材質清楚分開。","area":"金城鎮・金門縣","ph":"文"},{"id":5557,"name":"陳振芳古厝","lat":24.41997,"lng":118.32104,"cat":"history","tag":"歷史建築","desc":"這棟兩進紅瓦大厝，正面和背面都設了磚製的「石敢當」。細看山牆上的泥塑，能找到蝙蝠、蝴蝶、書摺與如意，巷門上還開著扇形採光窗。","area":"金城鎮・金門縣","ph":"文"},{"id":5558,"name":"陳氏古厝","lat":24.4195,"lng":118.32088,"cat":"history","tag":"歷史建築","desc":"紅瓦大厝前後兩進，正屋屋脊上翹，左側護龍則做成圓脊。牆頭原有的剪黏雖已散失，兩端還辨認得出書本和書卷的造型。","area":"金城鎮・金門縣","ph":"文"},{"id":5559,"name":"陳詩吟洋樓","lat":24.431525,"lng":118.317734,"cat":"history","tag":"古蹟","desc":"高坑出身的陳詩吟早年到新加坡和印尼經商，致富後斥資三萬銀元興建洋樓。這棟僑商留下的家宅，後來被列為金門縣定古蹟。","area":"金城鎮・金門縣","ph":"文"},{"id":5560,"name":"雄獅堡","lat":24.43135,"lng":118.31007,"cat":"history","tag":"歷史建築","desc":"浯江出海口右側的這塊地，舊稱同安渡頭，是早年後浦往來外地的渡口。過去從這段海岸到西門外高地，還曾是一片墳場。","area":"金城鎮・金門縣","ph":"文"},{"id":5561,"name":"靈濟寺（觀音亭）","lat":24.43157,"lng":118.3186,"cat":"worship","tag":"歷史建築","desc":"廟前的拜亭屋簷伸得很遠，後來改成北方式樣，和兩進廟身連在一起。兩側牆面也各有顏色，前進漆紅、後進漆黃，夾著磚和花崗石的牆身。","area":"金城鎮・金門縣","ph":"文"},{"id":5562,"name":"魁星樓(奎閣)","lat":24.43131,"lng":118.31781,"cat":"worship","tag":"古蹟","desc":"這座兩層小樓呈正六角形，二樓六面都有迴廊。往上看，琉璃瓦的重簷中央立著泥塑葫蘆，翹起的六個簷角下還藏著獸形泥塑。","area":"金城鎮・金門縣","ph":"文"},{"id":5563,"name":"黃乃甫番仔厝","lat":24.40905,"lng":118.30059,"cat":"history","tag":"歷史建築","desc":"黃乃甫早年在印尼經營雜貨店，生意有成後回家鄉興建這棟住宅。宅子屬於金門俗稱「番仔厝」的建築，主屋採大九架格局。","area":"金城鎮・金門縣","ph":"文"},{"id":5564,"name":"黃天露宅","lat":24.40943,"lng":118.30102,"cat":"history","tag":"歷史建築","desc":"屋主在印尼經商後返鄉建了兩進大厝，並在側邊的護樓加上一座塔樓。正面彩釉面磚的花色相當鮮明，在十八支樑一帶尤其醒目。","area":"金城鎮・金門縣","ph":"文"},{"id":5565,"name":"黃寬永宅","lat":24.43304,"lng":118.31874,"cat":"history","tag":"歷史建築","desc":"黃寬永早年到菲律賓經商，清末致富後回到家鄉建起宅院。房屋以大厝為主體，右手邊另接一排護龍，保留傳統民居的配置。","area":"金城鎮・金門縣","ph":"文"},{"id":5566,"name":"黃廷參三落大厝","lat":24.41069,"lng":118.29713,"cat":"history","tag":"歷史建築","desc":"大厝前兩進是傳統閩南樣式，到了第三進才出現南洋建築的風格。正門上方留有「江夏流芳」門額，磚牆與條石砌牆並用。","area":"金城鎮・金門縣","ph":"文"},{"id":5567,"name":"黃廷宙銃樓","lat":24.40981,"lng":118.2992,"cat":"history","tag":"歷史建築","desc":"黃廷宙在印尼經商，返鄉後因家中遭劫，在清代大厝旁加蓋洋樓和銃樓。如今牆上仍能看到竹節造型的簷口，以及鯉魚形的排水口。","area":"金城鎮・金門縣","ph":"文"},{"id":5568,"name":"黃文東宅","lat":24.40976,"lng":118.30045,"cat":"history","tag":"歷史建築","desc":"黃文東早年在印尼麻里吧板經商，一九二五年匯款回家興建住宅。宅子後來隨家人生活需要增設衛浴，也有部分門窗換成了鋁製。","area":"金城鎮・金門縣","ph":"文"},{"id":5569,"name":"黃朝賓宅（前水頭116號）","lat":24.41143,"lng":118.29575,"cat":"history","tag":"歷史建築","desc":"前水頭這座兩進大厝，牆腳用花崗石平砌，牆角則以煙炙磚柱收邊。最醒目的是前方兩側的女兒牆，上面排著一整列花瓶形欄杆。","area":"金城鎮・金門縣","ph":"文"},{"id":5570,"name":"黃水應宅","lat":24.412896,"lng":118.29716,"cat":"history","tag":"歷史建築","desc":"這棟房舍起初為洪家所有，由黃水應的父親黃光明買下。原來是單進大厝帶四間側房，後來改成當地稱作「三蓋廊」的特殊形式。","area":"金城鎮・金門縣","ph":"文"},{"id":5571,"name":"黃永遷、黃永鑿兄弟洋樓","lat":24.409527,"lng":118.298656,"cat":"history","tag":"歷史建築","desc":"黃永遷和黃永鑿兩兄弟在印尼經商致富，回鄉後將原有宅院改建成洋樓。建成後交給弟弟黃永甫管理，樓房也留下兄弟共同打拚的家族故事。","area":"金城鎮・金門縣","ph":"文"},{"id":5572,"name":"黃汝楫番仔厝","lat":24.41135,"lng":118.2976,"cat":"history","tag":"歷史建築","desc":"黃汝楫在印尼峇厘吧板經商致富，回到家鄉建了這棟番仔厝。屋子落成不久便遇上日軍占領金門，屋主又離家前往印尼居住。","area":"金城鎮・金門縣","ph":"文"},{"id":5573,"name":"黃濟古厝","lat":24.40985,"lng":118.29973,"cat":"history","tag":"歷史建築","desc":"這棟古厝從正面走到側邊，就能看到好幾種不同砌牆方式。花崗石有的排成人字、有的水平壘疊，側房牆面上方還混用了磚和瓦。","area":"金城鎮・金門縣","ph":"文"},{"id":5574,"name":"黃福星宅","lat":24.41046,"lng":118.29598,"cat":"history","tag":"歷史建築","desc":"兩進大厝的屋脊向上翹起，石板條砌成的牆腳上方嵌著手繪彩瓷。仔細看門面，就能讀到「五福臨門」和「六合同春」等吉祥祝詞。","area":"金城鎮・金門縣","ph":"文"},{"id":5575,"name":"黃積啟古厝","lat":24.40964,"lng":118.29933,"cat":"history","tag":"歷史建築","desc":"古厝坐落在前水頭的大厝與銃樓前方，用的是只向一側伸出廂房的「單伸手」格局。屋頂採雙坡圓脊，原有三處出入口，其中兩處設在院門上。","area":"金城鎮・金門縣","ph":"文"},{"id":5576,"name":"黃紹光宅","lat":24.40919,"lng":118.30048,"cat":"history","tag":"歷史建築","desc":"這棟兩進大宅有院門，也有左側護龍。抬頭看屋頂，正屋採閩南式翹脊，左護龍則用圓脊，前進略微內縮的牆面上開著兩扇窗。","area":"金城鎮・金門縣","ph":"文"},{"id":5577,"name":"黃輝古厝","lat":24.41039,"lng":118.29626,"cat":"history","tag":"歷史建築","desc":"宅前有一口半月形池塘，後面的大厝由前後兩進和左右護龍組成。正屋鋪紅瓦、屋脊上翹，兩邊護龍則用水泥瓦，脊線也是圓的。","area":"金城鎮・金門縣","ph":"文"},{"id":5578,"name":"三眼井","lat":24.47884,"lng":118.30759,"cat":"history","desc":"古寧頭南山聚落的公共水井，在同一口井上開了三個汲水孔。井眼排成品字形，從前居民來打水時，三個人可以各占一邊同時取水。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5579,"name":"中山紀念林","lat":24.43926,"lng":118.35472,"cat":"scenic","desc":"金門第一座森林遊樂區裡，有多條散步步道，也有池塘和戶外劇場。園區後方的三友園把松、竹、梅種在一起，沿途可看見三種植物不同的姿態。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5580,"name":"乳山故壘","lat":24.43711,"lng":118.35248,"cat":"other","desc":"與中山紀念林相連的這片舊營地，保留了早年駐軍留下的工事。經國家公園整理後，原來的軍事空間成了認識金門戰地歲月的地方。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5581,"name":"北山播音牆","lat":24.48892,"lng":118.31305,"cat":"history","desc":"古寧頭北山的斷崖上，巨大播音器曾用來隔海喊話，鄧麗君的聲音也曾從這裡傳出。這道牆和馬山播音站，都留下金門戰地年代的聲音記憶。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5582,"name":"北山斷崖","lat":24.4889,"lng":118.3142,"cat":"other","desc":"古寧頭北方海岸的斷崖像一面紅牆，崖頂有成片木麻黃迎著海風。往海岸線看，成排留下的反登陸樁，又為這片地貌添上戰地的痕跡。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5583,"name":"北山李氏兄弟洋樓","lat":24.47841,"lng":118.31147,"cat":"history","tag":"歷史建築","desc":"李家三兄弟在馬來西亞經商，將錢匯回北山興建洋樓。房子的主體剛剛成形，就碰上一九四九年的古寧頭戰役，工程也因此中斷。","area":"金寧鄉・金門縣","ph":"文"},{"id":5584,"name":"南山二落大厝群","lat":24.479103,"lng":118.30586,"cat":"history","tag":"歷史建築","desc":"李炎得在越南經商後匯款回鄉，請惠安師傅主持興建這片大厝。一九四九年軍人曾拆下前廳門板當作床鋪，屋裡也留下一段戰地生活史。","area":"金寧鄉・金門縣","ph":"文"},{"id":5585,"name":"古寧頭北山古洋樓","lat":24.47911,"lng":118.31263,"cat":"history","tag":"古蹟","desc":"李家三兄弟在馬尼拉經營椰子貿易，返鄉後先為母親興建兩進大厝。幾年後他們又蓋起雙層洋樓，留下北山僑鄉人家的生活故事。","area":"金寧鄉・金門縣","ph":"文"},{"id":5586,"name":"古寧頭戰史館","lat":24.483,"lng":118.321,"cat":"culture","desc":"這座館為紀念古寧頭戰役而建，後來交由金門國家公園管理。館裡以十三幅大型油畫鋪陳這場戰事，讓人透過畫面認識當年的經過。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5587,"name":"古寧頭牌樓","lat":24.47652,"lng":118.31542,"cat":"history","desc":"這座牌樓立在古寧頭一帶，是為了紀念古寧頭戰役中犧牲的戰士。它也讓今天經過的人想起，這片聚落曾經直接承受戰爭。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5588,"name":"古寧頭聚落","lat":24.47564,"lng":118.3082,"cat":"history","desc":"北山、南山和林厝三個村子合稱古寧頭，也是古寧頭戰役的主戰場。這裡的居民多姓李，許多老屋門楣上都寫著「隴西衍派」。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5589,"name":"古龍頭水尾塔","lat":24.476513,"lng":118.312014,"cat":"history","tag":"古蹟","desc":"花崗石砌成的實心方塔層層向上，最頂端收成葫蘆形。頂層塔身特別用一整塊花崗石鑿成，四個面上還各自刻著一個字。","area":"金寧鄉・金門縣","ph":"文"},{"id":5590,"name":"后湖海濱公園","lat":24.41693,"lng":118.34433,"cat":"nature","desc":"料羅灣西岸這片細白沙灘，和歐厝、泗湖、尚義等地的沙岸一路相連。海岸線綿延數公里，沙地上也常見人在海邊玩沙、堆沙堡。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5591,"name":"慈湖","lat":24.46897,"lng":118.30675,"cat":"scenic","desc":"一九六九年興建慈堤後，堤外仍是海，堤內則圍成了今天的慈湖。後來加設的觀景平台，讓人能在湖邊停下來欣賞金門的夕陽。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5592,"name":"慈湖三角堡","lat":24.46514,"lng":118.29762,"cat":"scenic","desc":"慈湖海岸的碉堡外牆留著迷彩，周圍還能辨認舊壕溝。堡裡過去不只用來執行任務，也是駐軍吃住的地方，保留了前線生活的樣子。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5593,"name":"李光前將軍廟","lat":24.46845,"lng":118.31685,"cat":"worship","desc":"這座廟紀念在古寧頭戰役中殉職的李光前團長。許多曾在金門當兵的人都曾到此參拜，向將軍祈求軍旅生活順利，成了島上獨特的信仰記憶。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5594,"name":"李森掽洋樓","lat":24.48062,"lng":118.3109,"cat":"history","tag":"歷史建築","desc":"李森掽從菲律賓匯款回鄉，由妻子李許瑞在金門監工建起洋樓。古寧頭戰役的巷戰留下彈孔，之後這裡還曾改作村公所和雜貨店。","area":"金寧鄉・金門縣","ph":"文"},{"id":5595,"name":"李開和洋樓","lat":24.47825,"lng":118.30734,"cat":"history","tag":"歷史建築","desc":"洋樓一樓向前突出的門廊，用花崗石六角柱和花瓶形欄杆相連。走到轉角，磚柱表面還看得到摻入蠣殼的洗石子，材料又不一樣。","area":"金寧鄉・金門縣","ph":"文"},{"id":5596,"name":"楊氏明馨祖祠暨楊清廉紀念館","lat":24.45553,"lng":118.34144,"cat":"worship","desc":"這座紀念楊清廉的館舍與楊氏祖祠在二〇一一年建成。館裡設有一方文字碑，讓人能從碑刻讀到此處的介紹。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5597,"name":"楊華故居","lat":24.45692,"lng":118.30618,"cat":"history","tag":"古蹟","desc":"清代武將楊華的家宅是一座帶左護龍的閩南三進大厝。門廳用三川脊，前後廳則是燕尾脊，門邊的團龍木雕和磚雕也保留細緻的紋樣。","area":"金寧鄉・金門縣","ph":"文"},{"id":5598,"name":"楊金魚、楊篤選宅第","lat":24.45636,"lng":118.30721,"cat":"history","tag":"歷史建築","desc":"宅院由兩座兩進大厝和側邊的樓房組成，其中一座前方留有隘門牆。屋身下緣以花崗石條平砌，正面與側面採用了不同的石紋做法。","area":"金寧鄉・金門縣","ph":"文"},{"id":5599,"name":"榜林王天乞古厝","lat":24.42838,"lng":118.340351,"cat":"history","tag":"古蹟","desc":"榜林王家的老宅前後兩進，正面以花崗石砌牆腳，上方改用紅磚。正屋的脊線向上翹起，左側護龍則作成圓脊，兩處屋頂輪廓很不一樣。","area":"金寧鄉・金門縣","ph":"文"},{"id":5600,"name":"湖下一營區 (W027據點)","lat":24.47256,"lng":118.29155,"cat":"other","desc":"金門早年的這處營區，以當地花崗岩和鋼筋混凝土建成。最能看出施工艱辛的是地下坑道，岩體裡的通道是當年靠人力一點點鑿出來的。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5601,"name":"湖下三間樓仔","lat":24.45629,"lng":118.30454,"cat":"history","tag":"歷史建築","desc":"湖下三位合夥人早年一起經營油坊和商船，從漳州、石碼運竹器與木料回金門販售。生意做起來後，三人蓋了相連的洋樓，各自住進其中一棟。","area":"金寧鄉・金門縣","ph":"文"},{"id":5602,"name":"湖下楊允泡及楊盤讀古厝","lat":24.456496,"lng":118.306661,"cat":"history","tag":"古蹟","desc":"前面是兩進大厝，後來隔著天井又加蓋一進，後屋得從側院單獨進出。前進的大門用花崗石作框，旁邊牆面還嵌有馬約利卡彩色磁磚。","area":"金寧鄉・金門縣","ph":"文"},{"id":5603,"name":"湖下海堤","lat":24.4556,"lng":118.30245,"cat":"other","desc":"湖下聚落旁這道寬闊的海堤，正好能望見跨海的金門大橋。天氣晴朗的黃昏，夕陽和長長的橋身會同時落在視野裡。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5604,"name":"盤山忠勇部隊伏地堡","lat":24.44093,"lng":118.33732,"cat":"history","tag":"歷史建築","desc":"這座舊堡以石塊和鋼筋混凝土構築，外觀低矮，幾乎貼著地面。入口上還留著泥塑「忠勇」二字，記下當年駐守部隊的名稱。","area":"金寧鄉・金門縣","ph":"文"},{"id":5605,"name":"盤山翁氏家廟","lat":24.447397,"lng":118.338608,"cat":"worship","tag":"古蹟","desc":"翁氏家廟前方設有院埕、照壁和一座閩南式小亭。小亭的雙坡屋頂鋪著筒瓦，翹起的屋脊上既有剪黏，也能看見兩側的龍形裝飾。","area":"金寧鄉・金門縣","ph":"文"},{"id":5606,"name":"翁君琴、振團、耀韮三代古厝","lat":24.44824,"lng":118.34044,"cat":"history","tag":"歷史建築","desc":"這棟翁家老宅保留兩進翹脊大厝的格局，紅磚牆身疊在花崗石牆腳上。最醒目的是屋外用了不少日本製的彩釉磁磚，為傳統門面添了花色。","area":"金寧鄉・金門縣","ph":"文"},{"id":5607,"name":"翁德晏三蓋廊厝","lat":24.44765,"lng":118.33989,"cat":"history","tag":"歷史建築","desc":"院門圍住這座「三蓋廊」閩南住宅，前院裡還有一口古井。左右山牆有泥塑裝飾，巷門上方則用一扇扇形小窗讓空氣流通。","area":"金寧鄉・金門縣","ph":"文"},{"id":5608,"name":"翁贊商、翁贊榮洋樓","lat":24.44672,"lng":118.33797,"cat":"history","tag":"歷史建築","desc":"兩層樓的正面由煙炙磚疊砌，外廊的一道道磚拱支在柱頭上。往頂樓看，女兒牆圍住樓頂，柱身與牆頭還可以找到細緻的灰泥裝飾。","area":"金寧鄉・金門縣","ph":"文"},{"id":5609,"name":"許丕簡古厝","lat":24.459161,"lng":118.36406,"cat":"history","tag":"古蹟","desc":"這棟許家民居在兩側增建房間，形成俗稱「小六路」的格局，左方另接護龍。看屋頂就能分辨不同部分，正屋的翹脊與側房的圓脊並列。","area":"金寧鄉・金門縣","ph":"文"},{"id":5610,"name":"謹慎堂","lat":24.479497,"lng":118.306323,"cat":"worship","tag":"歷史建築","desc":"清光緒年間，李家兄弟從漳州運木料、石碼運石材建起家宅。門上的「謹慎堂」匾也有來歷，是家中行醫者替人看病後收到的贈禮。","area":"金寧鄉・金門縣","ph":"文"},{"id":5611,"name":"金門和平紀念園區(林厝砲陣地)","lat":24.47603,"lng":118.31649,"cat":"culture","desc":"古寧頭戰役的主戰場如今成了紀念園區，沿路土丘之間還散布著大小不同的舊堡。這片園地紀念胡璉將軍，也紀念當年參戰的官兵。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5612,"name":"金門大橋","lat":24.45218,"lng":118.30403,"cat":"other","desc":"這座跨海大橋橫過深水海域，把大金門的金寧和小金門的烈嶼接在一起。橋身全長五點四一公里，最長的一跨約有兩百公尺。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5613,"name":"金門雙乳山坑道","lat":24.446958,"lng":118.357772,"cat":"history","tag":"古蹟","desc":"雙乳山的起伏山勢底下，留著乳南與乳北兩部分的舊坑道。把山體和地面的軍事營舍放在一起看，可以認識戰地年代如何運用島上地形。","area":"金寧鄉・金門縣","ph":"文"},{"id":5614,"name":"雙鯉古地關帝廟","lat":24.47591,"lng":118.31117,"cat":"worship","desc":"南山、北山和林厝居民共同在這裡祭拜關帝爺，也供奉關平與周倉。「雙鯉」之名取自湖的形狀，蜿蜒的水岸讓人聯想到頭尾交錯的一對鯉魚。","area":"金寧鄉・金門縣","ph":"觀"},{"id":5615,"name":"何仁慈古厝","lat":24.47884,"lng":118.38904,"cat":"history","tag":"歷史建築","desc":"浦邊出身的何仁慈早年渡海到菲律賓，靠經營雜貨起家。生意有成後，他多次往來金門與菲律賓，也在故鄉浦邊聚落興建了這棟家宅。","area":"金沙鎮・金門縣","ph":"文"},{"id":5616,"name":"何厝陳氏古厝","lat":24.473975,"lng":118.399787,"cat":"history","tag":"古蹟","desc":"陳家大厝除了正面和山牆有抹灰，其餘外牆多以素面的花崗石塊砌成。屋頂的變化則豐富得多，主屋用翹脊，兩側房舍配上彎脊。","area":"金沙鎮・金門縣","ph":"文"},{"id":5617,"name":"何敬嚴宅（小築佳趣）","lat":24.47894,"lng":118.38816,"cat":"history","tag":"歷史建築","desc":"何敬嚴在呂宋經營橡膠園，把錢寄回金門建成這棟住宅。樓房前方搭配小軒亭，兩種空間並在一起，是當地較少見的僑鄉建築形式。","area":"金沙鎮・金門縣","ph":"文"},{"id":5618,"name":"何永洋樓","lat":24.47891,"lng":118.38917,"cat":"history","tag":"歷史建築","desc":"洋樓正面的山牆做成少見的「蔥頭型」，成了辨認這棟房子的線索。中央裝飾裡可找到十八星旗、五色旗和鳳凰，兩側則點綴牡丹。","area":"金沙鎮・金門縣","ph":"文"},{"id":5619,"name":"何肅墻洋樓","lat":24.47958,"lng":118.38948,"cat":"history","tag":"歷史建築","desc":"這座兩層洋樓的一樓以圓拱作入口，牆下半部用花崗石條砌成。二樓正面並排三扇拱窗，轉到側面，各樓層窗上的裝飾又各不相同。","area":"金沙鎮・金門縣","ph":"文"},{"id":5620,"name":"何肅闕、何肅坡洋樓","lat":24.480208,"lng":118.3894,"cat":"history","tag":"歷史建築","desc":"何家兄弟早年遠赴印尼勿里洞與新加坡謀生，發跡後匯款返鄉蓋洋樓。一九四八年完工後，兄弟倆只短暫住過，又回到僑居地經商。","area":"金沙鎮・金門縣","ph":"文"},{"id":5621,"name":"何肅點、何肅海兄弟洋樓","lat":24.47927,"lng":118.38957,"cat":"history","tag":"歷史建築","desc":"臨街的前棟是傳統店屋，後棟才是有拱廊的洋樓。仔細看一樓柱頭，裝飾裡用上蠣殼，二樓的煙炙磚外廊則圍著花瓶形欄杆。","area":"金沙鎮・金門縣","ph":"文"},{"id":5622,"name":"元太武山築寨砌路摩崖石刻","lat":24.465725,"lng":118.418288,"cat":"history","tag":"古蹟","desc":"太武山古道旁的巨岩，有一面較為平整，留著五行銘文。這段直接刻在岩壁上的文字，記錄了元代在山上築寨和砌路的往事。","area":"金沙鎮・金門縣","ph":"文"},{"id":5623,"name":"北嶽廟","lat":24.50079,"lng":118.43387,"cat":"worship","desc":"五虎山麓的老廟原是山西聚落的庄頭廟，地方相傳最早可追溯到南宋。明代沿海受到倭寇侵擾時，廟宇曾與庄內民宅一同遭到焚毀。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5624,"name":"北極殿","lat":24.50501,"lng":118.40973,"cat":"worship","desc":"清光緒年間興建的北極殿奉祀玄天上帝，浯坑居民視祂為守護村落的境主。殿內右側另供奉觀世音菩薩，左側則是恩主公與恩主娘。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5625,"name":"后水頭黃奕本古厝","lat":24.48412,"lng":118.41563,"cat":"history","tag":"古蹟","desc":"屋主黃奕本經營船隊和鹽場，常因貿易往來廈門，家族也較早接觸基督信仰。女兒黃鴛鴦曾到鼓浪嶼讀神學，後來回鄉在西園興建佈道所。","area":"金沙鎮・金門縣","ph":"文"},{"id":5626,"name":"周安邦古厝","lat":24.47933,"lng":118.39024,"cat":"history","tag":"歷史建築","desc":"周安邦早年在日本經商，回到金門後蓋下這棟閩南宅院。屋內以繁複的雕刻出名，還保留名為「輪錢門」的老式防盜裝置。","area":"金沙鎮・金門縣","ph":"文"},{"id":5627,"name":"周氏二落大厝","lat":24.47892,"lng":118.38995,"cat":"history","tag":"歷史建築","desc":"這棟兩進大厝的起造經費，來自屋主早年在日本經商後寄回金門的僑匯。家族後人王金女自幼在宅內長大，也留下這個家庭居住的記憶。","area":"金沙鎮・金門縣","ph":"文"},{"id":5628,"name":"周氏古厝","lat":24.47996,"lng":118.39028,"cat":"history","tag":"歷史建築","desc":"兩側廂房以圓脊收頂，正中央裝有祥雲形的泥塑。宅院的裝飾一路延伸到牆腳，門邊石材上可以找到捲草花紋和圓滑的雙弧轉角。","area":"金沙鎮・金門縣","ph":"文"},{"id":5629,"name":"塘頭金蓮寺","lat":24.51479,"lng":118.41483,"cat":"worship","tag":"歷史建築","desc":"這座小寺廟把前後兩進連在一起，裡面其實只有一個開間。從院前依序走向拜殿與正殿，前埕上方後來還搭了弧形棚子，成為半室內空間。","area":"金沙鎮・金門縣","ph":"文"},{"id":5630,"name":"大地吳守椪古厝","lat":24.476804,"lng":118.394107,"cat":"history","tag":"古蹟","desc":"吳守椪在十九世紀中葉前往新加坡經商，致富後回到金門。一八九四年，他在大地聚落興建自宅，這棟房子至今已留下百餘年家族歷史。","area":"金沙鎮・金門縣","ph":"文"},{"id":5631,"name":"大地吳心泉宅","lat":24.47491,"lng":118.45941,"cat":"history","tag":"古蹟","desc":"兩進傳統大厝的一旁接著護龍和洋樓，前方院埕另有門樓。正屋屋脊兩端微翹，簷下成排陶製瓦當和滴水，也能看出早年處理雨水的做法。","area":"金沙鎮・金門縣","ph":"文"},{"id":5632,"name":"太武山文化景觀","lat":24.462666,"lng":118.418393,"cat":"history","tag":"文化景觀","desc":"太武山是金門最高峰，大航海時代往來臺灣海峽的船隻，曾靠這座山辨認航向。除了海上地標的身分，明代後期也發展出「太武山十二奇」的說法。","area":"金沙鎮・金門縣","ph":"文"},{"id":5633,"name":"奉直第","lat":24.49546,"lng":118.418369,"cat":"history","tag":"歷史建築","desc":"大厝前有圍牆，從兩側的龍虎門進出，正屋前後分成兩進。門面與側牆下方同樣鋪花崗石條，上方則能看到紅磚使用不同排列方式。","area":"金沙鎮・金門縣","ph":"文"},{"id":5634,"name":"官澳龍鳳宮","lat":24.51828,"lng":118.41267,"cat":"worship","tag":"古蹟","desc":"官澳這座媽祖廟最早名為「天妃廟」，創建於明萬曆年間。廟門前方就是早年的渡口，也留下沿岸居民祭拜天妃媽祖的生活背景。","area":"金沙鎮・金門縣","ph":"文"},{"id":5635,"name":"寒舍花","lat":24.50718,"lng":118.44817,"cat":"scenic","desc":"這個地名和昔日宛如三片花瓣的地貌有關。戰地年代這裡曾建有碉堡，廢哨拆毀後，原來的三片「花瓣」也只剩下一片。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5636,"name":"小浦頭黃允棋古厝","lat":24.48955,"lng":118.412,"cat":"history","tag":"古蹟","desc":"這棟黃家祖厝前後兩進，正面有五個開間，兩側又各加出房間。屋裡一共有六道縱向牆體，因此這種住宅在金門又叫「六路大厝」。","area":"金沙鎮・金門縣","ph":"文"},{"id":5637,"name":"山后中堡中書第","lat":24.50436,"lng":118.44029,"cat":"history","tag":"歷史建築","desc":"宅前的院子裡有一口井，兩邊由圍牆和隘門收住。看正面牆身，煙炙磚排出錢形花紋，靠近地面的石板上也能找到精細的雕刻。","area":"金沙鎮・金門縣","ph":"文"},{"id":5638,"name":"山后民俗文化村","lat":24.50381,"lng":118.44041,"cat":"other","desc":"金沙山后保留了一片完整的古厝聚落。到文化村看老屋，可以把相鄰房舍放在一起看，認識金門傳統村落原有的樣子。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5639,"name":"張敏衣冠塚","lat":24.51989,"lng":118.41828,"cat":"history","tag":"古蹟","desc":"衣冠塚以一整塊巨石作墓龜，表面還雕出龜背的紋路。墓碑形似牛軛，中央刻著瑞日祥雲，墓桌兩邊各有一頭石獅轉過頭來相望。","area":"金沙鎮・金門縣","ph":"文"},{"id":5640,"name":"張文帝洋樓","lat":24.49096,"lng":118.41375,"cat":"history","tag":"歷史建築","desc":"張文帝年輕時隨父親到馬來西亞，父子一起開辦「瑞祥」商號。這棟洋樓留下的，就是金門張家從故鄉渡海、在南洋合力經商的歷史。","area":"金沙鎮・金門縣","ph":"文"},{"id":5641,"name":"張氏三落大厝","lat":24.4923,"lng":118.41259,"cat":"history","tag":"歷史建築","desc":"宅院前後足有三進，每一進都是雙坡瓦頂，兩端屋脊向上翹起。院埕前的洗石子矮牆往兩側留有出口，最後一進旁還另開隘門。","area":"金沙鎮・金門縣","ph":"文"},{"id":5642,"name":"張氏古厝(沙美101號)","lat":24.49193,"lng":118.41225,"cat":"history","tag":"歷史建築","desc":"沙美這處單進張家宅，主屋是雙坡翹脊，前方兩側房間上頭卻砌了煙炙磚矮牆。從屋角能看到磚柱與花崗石牆腳交會的傳統做法。","area":"金沙鎮・金門縣","ph":"文"},{"id":5643,"name":"張氏古厝(沙美102號)","lat":24.49207,"lng":118.41245,"cat":"history","tag":"歷史建築","desc":"張家祖宅最早的兩進，是由張璋賢的曾祖父興建，到了祖父一代才添上第三進。八二三戰役前曾有軍隊駐紮，後來幾經整修，仍保留傳統民居格局。","area":"金沙鎮・金門縣","ph":"文"},{"id":5644,"name":"張氏洋樓","lat":24.49195,"lng":118.41211,"cat":"history","tag":"歷史建築","desc":"這處家宅以一座帶外廊的五腳基洋樓為主，兩間傳統側房分立前方。房舍之間用院牆連接，從平面就能看出洋樓與閩南宅院的結合。","area":"金沙鎮・金門縣","ph":"文"},{"id":5645,"name":"張璋滿古厝(85號)","lat":24.492068,"lng":118.413029,"cat":"history","tag":"歷史建築","desc":"張氏從檳城返鄉後在沙美蓋了兩處家宅，這一棟在清光緒年間竣工。國軍進駐金門後，它還曾作連部住所，直到八二三砲戰後才遷出。","area":"金沙鎮・金門縣","ph":"文"},{"id":5646,"name":"張璋滿古厝(87號)","lat":24.49209,"lng":118.41288,"cat":"history","tag":"歷史建築","desc":"沙美這棟張家老屋是屋主在檳城工作、返鄉後所建。當年特地請來泉州匠師，與附近另一棟張家大厝同是清末僑民返鄉建宅的痕跡。","area":"金沙鎮・金門縣","ph":"文"},{"id":5647,"name":"後浦頭黃卓彬洋樓","lat":24.4863,"lng":118.41488,"cat":"history","tag":"古蹟","desc":"黃卓彬早年到南洋經商，事業有成後回到後浦頭，在一九二三年興建洋樓。屋主格外看重房子是否堅固實在，留下了這棟百年家宅。","area":"金沙鎮・金門縣","ph":"文"},{"id":5648,"name":"慈德宮","lat":24.48621,"lng":118.4123,"cat":"worship","tag":"古蹟","desc":"前後兩殿之間以小亭相連，兩側的磚牆下方砌石，轉角用煙炙磚收邊。屋頂雖然都是斜坡紅瓦，前殿、後殿和護龍卻分別用了不同的屋脊。","area":"金沙鎮・金門縣","ph":"文"},{"id":5649,"name":"昭武第","lat":24.47876,"lng":118.38895,"cat":"history","tag":"歷史建築","desc":"兩進閩南大厝的正面牆腳，用花崗石砌出清楚的橫向紋理，上方再接紅磚。繞到側房看，磚牆表面抹了灰，便有了不同的材質和色澤。","area":"金沙鎮・金門縣","ph":"文"},{"id":5650,"name":"昭靈宮","lat":24.48632,"lng":118.44245,"cat":"worship","tag":"歷史建築","desc":"清光緒年間，碧山的陳姓宗親合資建起這座村廟。裡面奉祀居民稱為「大相江爺」的田府元帥，是地方信仰聚集的所在。","area":"金沙鎮・金門縣","ph":"文"},{"id":5651,"name":"會山寺","lat":24.48097,"lng":118.43021,"cat":"worship","area":"金沙鎮・金門縣","ph":"觀"},{"id":5652,"name":"李康塔洋樓","lat":24.51909,"lng":118.41316,"cat":"history","tag":"歷史建築","desc":"宅前有圍牆和院埕，前棟的彩繪與彩色磁磚圍著寫有「隴西衍派」的門楣。往裡才是兩層洋樓，前屋頂上則留著一片紅磚露台。","area":"金沙鎮・金門縣","ph":"文"},{"id":5653,"name":"東溪鄭氏家廟","lat":24.46251,"lng":118.45252,"cat":"worship","tag":"古蹟","desc":"兩進家廟的外觀簡樸，石作和木作卻做得細緻。前進的入口向內退了兩層，除了增添門面的深度，也在人走進正廳前留了歇腳的地方。","area":"金沙鎮・金門縣","ph":"文"},{"id":5654,"name":"東珩蕭顯柳古厝","lat":24.48619,"lng":118.43401,"cat":"history","tag":"歷史建築","desc":"蕭家的兩進大厝皆覆雙坡瓦頂，兩端屋脊向上翹起。牆下半部是石造檻牆，上半部可見斗子砌磚面，門前兩側還以煙炙磚柱收邊。","area":"金沙鎮・金門縣","ph":"文"},{"id":5655,"name":"東蕭蕭顯傳洋樓","lat":24.48827,"lng":118.42331,"cat":"history","tag":"古蹟","desc":"洋樓一樓和二樓原本都以五道拱排列成正面外廊。部分房舍已經坍塌，仍能辨認拱圈的輪廓，以及傳統閩南木屋架配上混凝土外廊的做法。","area":"金沙鎮・金門縣","ph":"文"},{"id":5656,"name":"東蕭蕭顯紀洋樓","lat":24.48824,"lng":118.42322,"cat":"history","tag":"古蹟","desc":"這棟洋樓兩層的外廊各有五道拱，前方屋面另留著用磚鋪的平臺。走到側面，能看出下方的條石牆腳和上方抹灰磚牆的差別。","area":"金沙鎮・金門縣","ph":"文"},{"id":5657,"name":"楓香林","lat":24.4933,"lng":118.44302,"cat":"scenic","desc":"春夏正是楓香生長的時候，陽光能穿過新長的葉子，把整片樹林映成鮮綠。走在樹下，除了看葉色，也能聞到林間淡淡的楓香。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5658,"name":"榮湖","lat":24.48594,"lng":118.4116,"cat":"scenic","desc":"這座人工湖攔取金沙溪水而成，湖邊的防風林間散落小亭與拱橋。跨過湖心的是虎嘯橋，岸上的東美亭則為紀念哲學家方東美而建。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5659,"name":"沙美基督長老教會教堂","lat":24.49169,"lng":118.41191,"cat":"worship","tag":"歷史建築","desc":"單層教堂的禮拜空間狹長，外牆用煙炙磚砌成，門框和窗框的磚一層層挑出。入口上方有十字架圖樣，也留著「中華基督教會」的字樣。","area":"金沙鎮・金門縣","ph":"文"},{"id":5660,"name":"沙美老街(沙美摩洛哥)","lat":24.49061,"lng":118.41227,"cat":"structure","area":"金沙鎮・金門縣","ph":"觀"},{"id":5661,"name":"沙美車站","lat":24.48899,"lng":118.41302,"cat":"other","desc":"沙美老街入口旁的綜合行政大樓有七層，公車站和鎮上各行政機關設在同一棟樓。挑選地方旅遊資料的服務中心，也就在車站大廳裡。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5662,"name":"浦邊何德奪古厝","lat":24.479151,"lng":118.388537,"cat":"history","tag":"古蹟","desc":"浦邊的何家大厝前後兩進，正面各有三個開間，後進比前進略寬。抬頭看兩側山牆撐起的瓦屋面，仍是閩南傳統雙斜坡和翹脊的樣子。","area":"金沙鎮・金門縣","ph":"文"},{"id":5663,"name":"浦邊何敬宙洋樓","lat":24.479254,"lng":118.389028,"cat":"history","tag":"歷史建築","desc":"兩層洋樓的廊柱上飾有六角龜紋，牆腳的石塊則排成人字與其他砌法。繞到背面，牆上還留著戰地年代的「反共抗俄」標語。","area":"金沙鎮・金門縣","ph":"文"},{"id":5664,"name":"浦邊周宅","lat":24.48061,"lng":118.39009,"cat":"history","tag":"古蹟","desc":"三進大厝前方圍著院埕，近屋處用石條作牆，前牆下半部則排成人字紋。整片房舍都鋪紅瓦，正屋屋脊上翹，旁邊房舍改用圓脊。","area":"金沙鎮・金門縣"},{"id":5665,"name":"浦邊周文獻古厝","lat":24.47948,"lng":118.389853,"cat":"history","tag":"歷史建築","desc":"原來的兩進大厝後來增建了前方房屋與兩層樓房，和右側護龍一起圍出內院。沿著院埕看，石砌牆基與煙炙磚柱都保留在前進門面上。","area":"金沙鎮・金門縣","ph":"文"},{"id":5666,"name":"浯坑鄭古懷洋樓","lat":24.50367,"lng":118.41157,"cat":"history","tag":"古蹟","desc":"鄭家宅院除了主棟洋樓，還包含門樓、護龍、側棟與防空洞。洋樓屋頂仍用傳統閩南雙坡木屋架，屋身則把承重牆和混凝土構造配在一起。","area":"金沙鎮・金門縣","ph":"文"},{"id":5667,"name":"海印寺、石門關","lat":24.462666,"lng":118.418393,"cat":"worship","tag":"古蹟","desc":"太武山頂的山坳裡有一座古寺，從前因所在位置被稱為「太武巖寺」。遠處的山形像人仰臥，民間也用「仙人偃地」來形容這片山勢。","area":"金沙鎮・金門縣","ph":"文"},{"id":5668,"name":"海印寺大雄寶殿","lat":24.46252,"lng":118.41855,"cat":"worship","tag":"歷史建築","desc":"重建後的大殿以鋼筋混凝土配上木構，外牆則用條石砌成。三層屋簷覆著筒瓦，山牆三角處還能看見花草題材的剪黏。","area":"金沙鎮・金門縣","ph":"文"},{"id":5669,"name":"獅山砲陣地","lat":24.50396,"lng":118.43708,"cat":"other","area":"金沙鎮・金門縣","ph":"觀"},{"id":5670,"name":"王仁吉、王仁乾、王仁忠兄弟洋樓","lat":24.48139,"lng":118.39432,"cat":"history","tag":"歷史建築","desc":"院牆裡的洋樓向前突出，後面另有一列房舍，兩部分以天井相連。大廳後方原就設有通往二樓的樓梯，兩側的小房間後來合併成較大的房間。","area":"金沙鎮・金門縣","ph":"文"},{"id":5671,"name":"王金城洋樓","lat":24.48148,"lng":118.39472,"cat":"history","tag":"古蹟","desc":"王金城從印尼匯款，由弟弟在金門主持興建，並請鼓浪嶼師傅設計。正面橫樑上除了騎馬人物，還能找到騎腳踏車和拄杖過橋的人。","area":"金沙鎮・金門縣","ph":"文"},{"id":5672,"name":"碧月軒","lat":24.47937,"lng":118.38919,"cat":"history","tag":"歷史建築","desc":"何敬槐在菲律賓打拚，把收入陸續寄回家鄉，除了照顧家人，也出資蓋學堂。他後來回到金門籌建碧月軒，留下僑居與返鄉的故事。","area":"金沙鎮・金門縣","ph":"文"},{"id":5673,"name":"船型堡","lat":24.49947,"lng":118.4474,"cat":"other","desc":"這棟三層高的舊堡遠看像一艘靠岸的戰艦，因此也叫「船型堡」。仔細看會發現「船首」其實朝向陸地，像是整艘船已經上了岸。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5674,"name":"蔡厝蔡氏家廟","lat":24.473034,"lng":118.417013,"cat":"worship","tag":"古蹟","desc":"厚實外牆裡的家廟只有一進，門樓和正殿之間以廊道相連。屋內隔間很少，從封閉的外觀轉進開闊的祭祀空間，是這座家廟的特色。","area":"金沙鎮・金門縣","ph":"文"},{"id":5675,"name":"蔡永耀二落大厝","lat":24.48071,"lng":118.38982,"cat":"history","tag":"歷史建築","desc":"蔡永耀早年到新加坡經商，返鄉後在浦邊興建兩進大厝。大厝前方還有他在同一時期蓋的洋樓，兩種樣式的家宅緊鄰而立。","area":"金沙鎮・金門縣","ph":"文"},{"id":5676,"name":"蔡永耀洋樓","lat":24.48085,"lng":118.38977,"cat":"history","tag":"歷史建築","desc":"平整的洋樓正面到了二樓向內縮，留出一排三開間圓拱廊。中央柱子上有泥塑對聯，兩柱之間連著花瓶形欄杆，頂上則覆著雙坡紅瓦。","area":"金沙鎮・金門縣","ph":"文"},{"id":5677,"name":"藏興古厝","lat":24.51874,"lng":118.41406,"cat":"history","tag":"古蹟","desc":"閩式宅院前後兩進，左右都有護龍，前方另有一口獨立水井。從前通往院埕要經過三座隘門，如今門已損壞，仍可看出宅院的規模。","area":"金沙鎮・金門縣","ph":"文"},{"id":5678,"name":"西園鹽場","lat":24.50705,"lng":118.40531,"cat":"other","desc":"金沙的舊鹽場用圖文展示介紹金門七百多年的製鹽歷史，也談鹽在居民日常生活中的用途。園內還留著石碑，記錄早年的鹽務與人物。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5679,"name":"西山前李宅","lat":24.49364,"lng":118.4274,"cat":"history","tag":"古蹟","desc":"西山前的李家大宅縱深三進，正面足有五開間。因為裡面一共有十六個房間，可以分給幾戶人家居住，地方上也就叫它「十六間厝」。","area":"金沙鎮・金門縣","ph":"文"},{"id":5680,"name":"西山前李氏家廟","lat":24.49399,"lng":118.42769,"cat":"worship","tag":"古蹟","desc":"李家家廟前後兩進，木架和承重牆一起撐起屋頂。外牆下半部用花崗石條長短交錯疊成，上半部換成紅磚，前後兩進的山牆樣式也不一樣。","area":"金沙鎮・金門縣","ph":"文"},{"id":5681,"name":"觀德橋","lat":24.468374,"lng":118.391382,"cat":"history","tag":"古蹟","desc":"這座單跨石橋從橋墩到橋面都用花崗石，四塊長石條便拼成整個橋面。橋的兩端還各有石獅和仙桃形望柱，是樸素橋身上的幾處裝飾。","area":"金沙鎮・金門縣","ph":"文"},{"id":5682,"name":"象山金剛寺","lat":24.46042,"lng":118.38876,"cat":"worship","desc":"頂蘭這座寺院的名字來自腳下的山。當地的山勢輪廓讓人聯想到一頭象，因此被稱作象山，寺院也沿用了這個名字。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5683,"name":"金東電影院","lat":24.47861,"lng":118.42724,"cat":"history","tag":"歷史建築","desc":"老戲院正面有五個開間，中央入口上方寫著于右任所題的五個紅色大字。除了抬頭看招牌，門左側還能讀到當年興建戲院留下的記誌。","area":"金沙鎮・金門縣","ph":"文"},{"id":5684,"name":"金沙戲院","lat":24.488898,"lng":118.413132,"cat":"culture","tag":"歷史建築","desc":"沙美復興街的街屋一路排到戲院，盡頭醒目的山牆也成了商圈的入口標記。戲院早年以大量水平和垂直線條設計門面，在整排街屋間格外鮮明。","area":"金沙鎮・金門縣","ph":"文"},{"id":5685,"name":"金沙鎮沙美萬安堂","lat":24.491038,"lng":118.41202,"cat":"worship","tag":"歷史建築","desc":"據《金門縣志》記載，這座奉祀保生大帝的廟在元代就已興建。七百多年來，它一直留在沙美聚落，是金門歷史最久的保生大帝廟。","area":"金沙鎮・金門縣","ph":"文"},{"id":5686,"name":"金門縣林務所","lat":24.46285,"lng":118.44444,"cat":"other","desc":"金沙鎮的林務所如今綠意濃密，背後是金門長年推動造林的歷史。一九五一年起，當地反覆試種、改良，才逐漸為島上的軍民生活種回樹蔭。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5687,"name":"金門縣立博物館","lat":24.49927,"lng":118.40361,"cat":"culture","desc":"金沙溪畔的閩式博物館坐落在金門東半島，前後可見太武山與金龜山。館舍傍著水岸，從建築周圍便能看見這一帶的湖光山色。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5688,"name":"陳德幸洋樓","lat":24.485689,"lng":118.440316,"cat":"history","tag":"歷史建築","desc":"碧山村口的洋樓，是陳德幸從新加坡匯款請惠安、金門師傅合作興建的。門面飾以彩瓷，山牆上還可找到成對的老鼠、鳳凰和龍形泥塑。","area":"金沙鎮・金門縣","ph":"文"},{"id":5689,"name":"陳明侑古厝","lat":24.48587,"lng":118.44033,"cat":"history","tag":"歷史建築","desc":"這座古厝四面的花崗石牆都排成人字紋，到了牆角，石材又改為水平相疊。抬頭看山牆，煙炙磚和屋脊末端的泥塑是另一層裝飾。","area":"金沙鎮・金門縣","ph":"文"},{"id":5690,"name":"陳景成洋樓","lat":24.47349,"lng":118.40448,"cat":"history","tag":"歷史建築","desc":"陳景成在馬尼拉經商，由兄長在金門代為籌建這座洋樓。正面下層是三開間圓拱，上層則排成五開間，門樓牆上還記著竣工年份。","area":"金沙鎮・金門縣","ph":"文"},{"id":5691,"name":"陳氏一落四櫸頭(碧山35號)","lat":24.48602,"lng":118.44211,"cat":"history","tag":"歷史建築","desc":"碧山這棟清末老宅以石牆為主，前方有照壁，正屋兩側另有四間側房。戰地年代曾有軍人駐紮，之後又經整修，留下不同時期的使用痕跡。","area":"金沙鎮・金門縣","ph":"文"},{"id":5692,"name":"陳氏一落四櫸頭(碧山6號)","lat":24.4866,"lng":118.44302,"cat":"history","tag":"歷史建築","desc":"屋主約在一九四〇年代從新加坡返鄉建起這棟家宅，後來曾有軍官在此居住。整修時，兩邊側房原有的平磚屋面改成了斜屋頂。","area":"金沙鎮・金門縣","ph":"文"},{"id":5693,"name":"陳氏二落大厝","lat":24.48596,"lng":118.44021,"cat":"history","tag":"歷史建築","desc":"這座兩進大宅是陳明侑的兒子所建，家族與新加坡的貿易往來密切。屋主陳金象的祖父曾經營「九八行」，名稱來自交易時抽取的百分之二利潤。","area":"金沙鎮・金門縣","ph":"文"},{"id":5694,"name":"陳氏小宗宗祠","lat":24.48613,"lng":118.44288,"cat":"worship","tag":"歷史建築","desc":"這座宗祠把傳統前進與五腳基洋樓接在一起，正面主要是洗石子。抬頭可見欄杆柱頭上的粉色花草泥塑，轉到側面又是人字形花崗石牆腳。","area":"金沙鎮・金門縣","ph":"文"},{"id":5695,"name":"陳清吉洋樓","lat":24.4858,"lng":118.44305,"cat":"history","tag":"歷史建築","desc":"屋主陳清吉早年從新加坡碼頭苦力做起，後來開設商號，也出資在家鄉辦學。洋樓的曲線山牆上既有西式獎盃柱頭，也有稻穗和牡丹泥塑。","area":"金沙鎮・金門縣","ph":"文"},{"id":5696,"name":"陳禎恩榮坊","lat":24.48109,"lng":118.43028,"cat":"history","tag":"古蹟","desc":"陽翟會山寺的右前方，立著一座以花崗石砌成的牌坊。陳健顯貴後，父親陳禎也獲朝廷誥贈，這座恩榮坊便是為了記下這份榮典。","area":"金沙鎮・金門縣","ph":"文"},{"id":5697,"name":"陳篤欽古厝","lat":24.48018,"lng":118.42766,"cat":"history","tag":"歷史建築","desc":"這棟閩南兩進大厝以石條砌牆腳，上半部改用磚砌，轉角處則加了煙炙磚柱。門面不只屋脊有裝飾，直櫺窗上方也能看到橫批。","area":"金沙鎮・金門縣","ph":"文"},{"id":5698,"name":"陳維淡古厝","lat":24.48638,"lng":118.44318,"cat":"history","tag":"歷史建築","desc":"古厝四面的花崗石以人字形排列，到轉角換成水平砌法。圓脊山牆和矮牆用了煙炙磚，山牆尾端還開出一扇細長的柳條花窗。","area":"金沙鎮・金門縣","ph":"文"},{"id":5699,"name":"陽翟老街","lat":24.47944,"lng":118.42725,"cat":"culture","desc":"軍隊駐紮陽翟時，這條街上的電影院、撞球室、澡堂和理髮廳都是軍人常去的地方。後來駐軍減少，店鋪漸漸冷清，留下昔日軍鎮的街景。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5700,"name":"陽翟陳篤篾、陳篤浪古厝","lat":24.4796,"lng":118.4284,"cat":"history","tag":"古蹟","desc":"這棟兩進大厝左側另伸出一間房，前方還增建了樓層。主屋前留有院埕，四周以院牆圍住，從外面能看出傳統宅院向一旁擴建的格局。","area":"金沙鎮・金門縣","ph":"文"},{"id":5701,"name":"雞髻頭","lat":24.48345,"lng":118.38009,"cat":"scenic","desc":"金門北岸這處岬角形似雞冠，名字就從這裡來。早年船隻在此往返金門與廈門，通往鶯山廟的沙岸還曾是跑馬場。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5702,"name":"青嶼前甲張氏宗祠","lat":24.52056,"lng":118.422971,"cat":"worship","tag":"古蹟","desc":"清末張氏族人集資在青嶼前甲建祠，這裡後來還當過小學。正面除了木雕屏堵，兩側還開了用泥塑竹節圍成的圓窗。","area":"金沙鎮・金門縣","ph":"文"},{"id":5703,"name":"青嶼張氏兄弟洋樓","lat":24.519822,"lng":118.420676,"cat":"history","tag":"古蹟","desc":"洋樓入口兩側的圓柱，是用一塊塊特製的四分之一圓紅磚交錯疊起來的。往上看，樓頂蓋的卻是閩式紅瓦歇山屋頂。","area":"金沙鎮・金門縣","ph":"文"},{"id":5704,"name":"馬山三角堡","lat":24.52313,"lng":118.40981,"cat":"other","desc":"這座舊軍事據點位在金沙鎮的馬山，也叫「無敵堡」。從金門東北角的堡址到對岸廈門角嶼，兩地相距約兩公里。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5705,"name":"馬山觀測所","lat":24.52771,"lng":118.40887,"cat":"history","desc":"馬山隔海面對角嶼，退潮時兩地只相距約一千八百公尺。這裡過去用來觀測海上活動，也因此有「天下第一哨」的稱呼。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5706,"name":"鶯山廟","lat":24.48568,"lng":118.38853,"cat":"worship","desc":"廟在呂厝海邊，背後的鶯山形似正要展翅的鳥。從清代嘉慶年間建廟以來，這裡是六地共祀的廟宇，俗稱「六甲西宮」。","area":"金沙鎮・金門縣","ph":"觀"},{"id":5707,"name":"黃信堅宅","lat":24.49545,"lng":118.41889,"cat":"history","tag":"歷史建築","desc":"宅子正身的屋脊向上翹，底下還藏著一隻小獅子。繞到兩側，能看見平砌的花崗石牆，以及門旁的綠釉花磚和紅磚。","area":"金沙鎮・金門縣","ph":"文"},{"id":5708,"name":"黃宣顯六路大厝","lat":24.487098,"lng":118.414641,"cat":"history","tag":"古蹟","desc":"這座五開間的閩式大宅兩旁各有雙護龍，所以有六路大宅的稱呼。沿著正面細看，格扇上有木雕，水車堵還繪了花鳥。","area":"金沙鎮・金門縣","ph":"文"},{"id":5709,"name":"黃昌命（納）古厝","lat":24.510984,"lng":118.404411,"cat":"history","tag":"歷史建築","desc":"兩邊的護厝夾著中央單開間的大廳，正面留出一處敞廳。左側牆腳的花崗石排成人字形，同一側還留著軍事標語。","area":"金沙鎮・金門縣","ph":"文"},{"id":5710,"name":"黃樓洋樓","lat":24.51157,"lng":118.40453,"cat":"history","tag":"歷史建築","desc":"洋樓正面以六根柱子分成五開間，一樓的圓柱用紅磚砌成。牆面用了蠣殼洗石子，柱頭旁還能找到成對的魚形裝飾。","area":"金沙鎮・金門縣","ph":"文"},{"id":5711,"name":"黃氏家廟","lat":24.48697,"lng":118.41431,"cat":"worship","tag":"歷史建築","desc":"前埕立著一面名為「紫雲屏」的照壁，往內才是前後兩進的家廟。正門兩旁各有抱鼓石，抬頭還能看見屋簷下的木雕。","area":"金沙鎮・金門縣","ph":"文"},{"id":5712,"name":"(明)丁肖鶴登太武山題詩碑","lat":24.46049,"lng":118.41029,"cat":"history","tag":"歷史建築","desc":"明代丁一中號肖鶴，曾和友人在夏天同登太武山。他把這趟遊山的感興寫成兩首詩，題在風動石左側，詩文至今仍可辨讀。","area":"金湖鎮・金門縣","ph":"文"},{"id":5713,"name":"134高地","lat":24.44649,"lng":118.39964,"cat":"other","desc":"夏興這處舊軍事據點就在太武山旁，地勢高、視野也開闊。高地上的閃光臺曾用燈號和周邊島嶼傳遞消息。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5714,"name":"E-094天空之城","lat":24.43543,"lng":118.40192,"cat":"other","desc":"后園海岸有一座突出在小海灣中央的碉堡，遠看像是凌空浮起。遊客取的「天空之城」這個暱稱，說的就是它的外觀。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5715,"name":"中正公園","lat":24.43661,"lng":118.42671,"cat":"nature","desc":"金門軍民在一九七六年合力建起這座公園，紀念蔣中正逝世週年。如今這片綠地也是當地居民平常休息和散步的地方。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5716,"name":"中正紀念林","lat":24.44132,"lng":118.43009,"cat":"scenic","desc":"太湖北岸這座林園帶有江南庭園的風格，入口大門取法浙江民居。沿著石牆看過去，牆上的漏窗把窗後的庭園景色框了起來。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5717,"name":"中興堡","lat":24.43575,"lng":118.39623,"cat":"other","desc":"這座碉堡曾因原址受到岩石阻隔而遷建。一九八六年，南雄部隊在舊址後方約五十公尺處整建了新的據點。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5718,"name":"俞大維先生紀念館","lat":24.44304,"lng":118.43153,"cat":"culture","desc":"紀念館以灰磚配綠瓦，周圍有樹木遮蔭。一進館便能看見俞大維的半身雕像，旁邊一副對聯寫的是他的文才與武略。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5719,"name":"倒影塔","lat":24.46271,"lng":118.41412,"cat":"history","desc":"石寶頂上的這座小塔，有七層、八個角，輪廓卻像葫蘆。它是明初周德興在金門所建三塔之一，位在延平郡王弈棋處後方。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5720,"name":"八二三戰史館","lat":24.44318,"lng":118.4324,"cat":"culture","desc":"一九八八年八二三砲戰滿三十週年，金門興建了這座戰史館。館舍採古典中式樣貌，綠瓦屋頂下排著鮮紅的圓柱。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5721,"name":"八二三戰役勝利紀念碑","lat":24.46479,"lng":118.43669,"cat":"history","desc":"這座碑紀念一九五八年八月二十三日爆發的金門砲戰。當天下午六時三十分，金門遭受密集砲擊，最初兩小時已落下數萬發砲彈。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5722,"name":"劉玉章雕像","lat":24.4593,"lng":118.40979,"cat":"history","desc":"劉玉章在一九五四年接任金門防衛部司令官，任內經歷九三砲戰。太武山的登山道路，就是他當時帶領官兵修築的。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5723,"name":"北椗島燈塔","lat":24.42715,"lng":118.50453,"cat":"history","tag":"古蹟","desc":"燈塔是四層樓高的圓形磚塔，外牆漆白，入口做成圓拱。塔身還嵌了三條花崗石框，白色石材也用在塔的外表面。","area":"金湖鎮・金門縣","ph":"文"},{"id":5724,"name":"南石滬公園","lat":24.41149,"lng":118.43846,"cat":"nature","desc":"料羅村外海岸這片高低起伏的岩地，從前是一座花崗岩礦場。這裡出產的石材紋理多變，中正紀念堂也曾使用。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5725,"name":"南雄八二三砲戰勝利紀念碑","lat":24.44687,"lng":118.42313,"cat":"history","tag":"歷史建築","desc":"方形基座上立著一座仿砲彈造型的紀念碑，碑身高五公尺多。繞著看，一面刻的是八二三砲戰勝利紀念碑，另一面則刻了英文。","area":"金湖鎮・金門縣","ph":"文"},{"id":5726,"name":"呂克瓶古厝","lat":24.42757,"lng":118.44597,"cat":"history","tag":"歷史建築","desc":"大厝有前後兩進，左側護龍後方還疊起樓層。外牆腳的黃花崗石在正面砌成平行的條紋，到了側面則改排成人字形。","area":"金湖鎮・金門縣","ph":"文"},{"id":5727,"name":"夏興陳鴻佐古厝","lat":24.44049,"lng":118.39568,"cat":"history","tag":"古蹟","desc":"夏興舊稱下坑，早年是陳姓族人聚居的村落。相傳古厝由陳鴻佐興建，後來兒子陳侯老從南洋經商匯款回鄉，才又擴建。","area":"金湖鎮・金門縣","ph":"文"},{"id":5728,"name":"天坑","lat":24.43397,"lng":118.40619,"cat":"other","area":"金湖鎮・金門縣","ph":"觀"},{"id":5729,"name":"尚義環保公園","lat":24.44069,"lng":118.36894,"cat":"nature","desc":"園區所在的高地立著一尊大風獅爺，是從空中抵達金門時便可能望見的地標。這種守護獸也是金門的代表形象。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5730,"name":"山外車站","lat":24.44223,"lng":118.4141,"cat":"other","desc":"車站所在的山外村，位在金門島東南方，屬於金湖鎮。山外是島上第二大聚落，車站和村子用的是同一個名字。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5731,"name":"峰上巡檢司","lat":24.42742,"lng":118.46033,"cat":"scenic","desc":"這裡原是明代周德興為防倭寇所建的城，是金門五個巡檢司城之一。今天所見造型特別的城門，是二〇一三年整修後的樣貌。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5732,"name":"庵邊呂朝選宅","lat":24.42557,"lng":118.442979,"cat":"worship","tag":"古蹟","desc":"在新加坡經商的呂朝選，於一九三三年回庵邊興建這座宅子。房子落成後，他便返回新加坡，把新宅留給母親居住。","area":"金湖鎮・金門縣","ph":"文"},{"id":5733,"name":"復國墩觀景台","lat":24.4472,"lng":118.47335,"cat":"scenic","desc":"金門島東端的復國墩是傳統古厝聚落，聚落外就是岩岸。這裡的花崗岩隆起成陡坡，沿海還留著早年軍事工事的痕跡。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5734,"name":"怡穀堂","lat":24.45488,"lng":118.37258,"cat":"worship","desc":"瓊林村民過去在這裡上社學，後來它又成了小學校址。這棟約建於清道光年間的房子，也曾作為農忙時期照顧孩子的托兒所。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5735,"name":"慰廬","lat":24.44391,"lng":118.43212,"cat":"history","desc":"這裡是明代金門西洪人洪受的故居。洪受曾任國子監助教，也在州縣教書，因門生中有許多人考取功名，當時人尊他為大師。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5736,"name":"成功陳氏宗祠","lat":24.43895,"lng":118.39025,"cat":"worship","tag":"歷史建築","desc":"宗祠分成前後兩進，第一進的屋脊中央飾有八仙。往屋脊兩端看，花鳥是用剪黏和泥塑做的，下面還畫了人物故事。","area":"金湖鎮・金門縣","ph":"文"},{"id":5737,"name":"擎天廳","lat":24.45377,"lng":118.40649,"cat":"other","desc":"太武山的山腹裡藏著一座可容納上千人的大廳，長達六十公尺。石壁上看得到天然的岩石紋理，也留著當年人工開鑿的痕跡。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5738,"name":"料羅吳氏六路大厝","lat":24.41718,"lng":118.43565,"cat":"history","tag":"古蹟","desc":"大厝前後兩進，各有五開間，兩側再加上護龍。特別的是，六路承重牆全都用木作，前排中央上翹的屋脊也和兩旁的圓脊有別。","area":"金湖鎮・金門縣","ph":"文"},{"id":5739,"name":"料羅海濱公園","lat":24.41749,"lng":118.4335,"cat":"nature","desc":"料羅灣從前是金門運補物資的要地，現在岸邊有綿長沙灘、綠地和涼亭。沿著公園往南看，高地上還立著媽祖像。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5740,"name":"新湖漁港","lat":24.43038,"lng":118.41032,"cat":"other","desc":"金湖鎮西南方的海岸上，有金門三大漁港之一的新湖漁港。對金湖地區的漁民來說，這裡也是當地最主要的漁業港口。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5741,"name":"東村呂世宜古厝","lat":24.42711,"lng":118.44554,"cat":"history","tag":"古蹟","desc":"古厝外觀樸素，四面的花崗石牆都用人字形砌法，到了轉角才改成水平排列。山牆上方換成磚砌，和下方的石牆分出層次。","area":"金湖鎮・金門縣","ph":"文"},{"id":5742,"name":"東村呂朝怡洋樓(別名:東村雙喜樓 )","lat":24.42814,"lng":118.44535,"cat":"history","tag":"古蹟","desc":"這座獨棟洋樓沒有外廊，一樓正面下半部的花崗石砌成人字形。繞到右側和背面，能看見整面都用花崗石塊砌起的牆。","area":"金湖鎮・金門縣","ph":"文"},{"id":5743,"name":"東椗島燈塔","lat":24.159269,"lng":118.2384,"cat":"history","tag":"古蹟","desc":"圓形燈塔用磚砌成，外牆漆成黑色。塔門上方有一塊門額，留下監造人畢士壁與當時廈門關稅務司休士的名字。","area":"金湖鎮・金門縣","ph":"文"},{"id":5744,"name":"梅園","lat":24.46354,"lng":118.41671,"cat":"scenic","desc":"太武山上「毋忘在莒」勒石旁，有一處和周圍山林相接的園子。登山的人常在這裡歇腳、拍照，四季看到的山林景色各有不同。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5745,"name":"榕園","lat":24.44393,"lng":118.43201,"cat":"other","desc":"太湖北岸的老榕樹聚成一片，粗壯的氣根懸在枝幹之間。抬頭看，樹枝向四周伸展、彼此交錯，樹冠連成了乘涼的好地方。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5746,"name":"欽旌節牌坊","lat":24.45986,"lng":118.38222,"cat":"other","desc":"瓊林與中蘭之間的環島北路旁，立著一座稱為「欽旌節孝坊」的牌坊。它的規模較小，因為緊鄰路邊，常有人在坊前留影。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5747,"name":"毋忘在莒","lat":24.46364,"lng":118.41611,"cat":"other","desc":"太武山近海印寺的崖邊，石上刻著蔣中正所題的四個大字。題字借戰國時齊將田單的故事，勉勵當時生活在戰地的軍民。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5748,"name":"湖前陳宗炯洋樓","lat":24.436591,"lng":118.413064,"cat":"history","tag":"古蹟","desc":"這座五腳基洋樓的兩側廂房還往上疊建了樓層。抬頭看屋頂，可以見到閩南瓦作的雙坡斜面，也有鋼筋混凝土的平頂。","area":"金湖鎮・金門縣","ph":"文"},{"id":5749,"name":"湖前陳氏古厝群","lat":24.4361,"lng":118.41097,"cat":"history","tag":"古蹟","desc":"古厝群裡的陳芳敬宅是一座前後兩進的大厝，前排一側還加建了樓層。正面水車堵裝飾細緻，屋頂則是兩端上翹的瓦脊。","area":"金湖鎮・金門縣","ph":"文"},{"id":5750,"name":"漁村小艇坑道","lat":24.43175,"lng":118.40852,"cat":"other","desc":"金門東南海岸的岩壁裡，留著一條冷戰時期挖成的小艇坑道。當年沿海有好幾處這樣的設施，小艇曾用來運補物資。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5751,"name":"無愧亭","lat":24.4511,"lng":118.38975,"cat":"history","desc":"太武山與魯王墓之間，有座碧瓦紅柱的六角亭。亭名取文天祥無愧天地的精神，裡頭的大理石碑還留有宗孝忱的書法。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5752,"name":"玉章路牌坊","lat":24.45821,"lng":118.40519,"cat":"history","desc":"牌坊所在的玉章路是太武山的登山道路，全長約三點五公里。路名由蔣中正所取，紀念曾任金門防衛部司令官的劉玉章。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5753,"name":"環保公園低碳教育館","lat":24.43734,"lng":118.3694,"cat":"nature","desc":"這是金門第一座把環境教育和低碳生活放在一起介紹的展覽館。館內把這些題目做成互動展示，讓參觀的人可以動手體驗。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5754,"name":"瓊林一門三節坊","lat":24.45392,"lng":118.37042,"cat":"worship","tag":"古蹟","desc":"瓊林村西郊的古官道上，立著一座建於清道光年間的石牌坊。一門三節的稱呼，記下的是同一家族三位寡婦的故事。","area":"金湖鎮・金門縣","ph":"文"},{"id":5755,"name":"瓊林戰鬥坑道","lat":24.45518,"lng":118.37291,"cat":"history","desc":"瓊林村地下有一條長達一千三百五十五公尺的民防坑道。村裡幾處重要建築原本就由坑道相連，地上村落底下還有另一套路網。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5756,"name":"瓊林民防館","lat":24.45514,"lng":118.37307,"cat":"culture","desc":"戰時瓊林村民曾協助軍方，連村辦公室也是當時指揮中心的一部分。後來村裡設了展示館，留下居民參與民防的這段歷史。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5757,"name":"瓊林聚落","lat":24.45482,"lng":118.37302,"cat":"history","desc":"金門島中部這片古厝聚落以蔡姓人家為主，里名是明熹宗所賜。從前村裡有人中進士就會建宗祠，因此巷弄間有好幾座宗祠。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5758,"name":"瓊林蔡氏家廟","lat":24.45435,"lng":118.37397,"cat":"worship","desc":"家廟建於明嘉靖年間，屋脊和山牆上都看得到剪黏與泥塑。抬頭看橫樑下的雕飾，還能找到蔡家祖訓「忠、孝、廉、節」。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5759,"name":"瓊林蔡氏祠堂","lat":24.454114,"lng":118.373313,"cat":"worship","tag":"古蹟","desc":"村裡這組蔡氏祠堂的格局各不相同，可以從屋子與天井的數目看出來。例如樂圃六世宗祠有三進、兩座天井，蔡氏家廟則有兩進、一座天井。","area":"金湖鎮・金門縣","ph":"文"},{"id":5760,"name":"石兔","lat":24.46128,"lng":118.41211,"cat":"history","desc":"太武山步道兩旁有些巨石形似動物，其中一處像是龜兔賽跑。石龜身上的「眼珠」也有來歷，那是當年開路時機具留下的鑽孔。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5761,"name":"羅寶田神父紀念園區","lat":24.4386,"lng":118.41937,"cat":"culture","desc":"羅寶田神父在一九五四年來到金門，後來在砲戰期間照顧傷患。他也長期為當地居民服務，太湖畔的紀念園區留下了這段故事。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5762,"name":"蔡翰舉人宅(一)","lat":24.45371,"lng":118.37474,"cat":"history","tag":"歷史建築","desc":"宅前的外埕設有舉人旗杆座，走近正面，水車堵上還能看見交趾陶。廳前的木格柵和下方磚牆相接，圓規上另有吉祥泥塑。","area":"金湖鎮・金門縣","ph":"文"},{"id":5763,"name":"蔡翰舉人宅(二)","lat":24.45356,"lng":118.37504,"cat":"history","tag":"歷史建築","desc":"這座前後兩進的大厝，左邊的護龍後來改成了現代樓房。老屋正面下方為石砌，往上換成磚牆，翹起的屋脊另有彩繪泥塑與剪黏。","area":"金湖鎮・金門縣","ph":"文"},{"id":5764,"name":"蘭湖","lat":24.452,"lng":118.3829,"cat":"scenic","desc":"今日的湖泊原是蘭林水庫，一九六八年興建完成。建水庫是為了供應瓊林和中蘭一帶的灌溉與飲水，也是金門第二大水利工程。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5765,"name":"護國寺","lat":24.43928,"lng":118.41732,"cat":"worship","area":"金湖鎮・金門縣","ph":"觀"},{"id":5766,"name":"迎賓館","lat":24.44785,"lng":118.41792,"cat":"culture","desc":"太武山南雄山麓的花崗岩裡，藏著一間一九八〇年完工的坑道賓館。戰地政務時期這裡接待外賓，還有「地下希爾頓飯店」的稱呼。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5767,"name":"鄭成功觀兵奕棋處","lat":24.46269,"lng":118.41397,"cat":"history","desc":"太武山這處天然岩洞和鄭成功與幕僚弈棋的故事有關。洞內原有刻了棋盤的石桌椅，舊物傾毀後，才由軍方重新修建。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5768,"name":"鄭由整洋樓","lat":24.44253,"lng":118.4607,"cat":"history","tag":"歷史建築","desc":"前後兩棟都是兩層高的五腳基洋樓，中間以牆相接。主樓正面以六根柱子托起磚拱，二樓柱間還能看到花瓶形的欄杆。","area":"金湖鎮・金門縣","ph":"文"},{"id":5769,"name":"金門媽祖公園","lat":24.41265,"lng":118.4344,"cat":"worship","desc":"這座公園位在料羅濱海公園的高地，由金門縣政府興建。整座園區占地四千平方公尺，是料羅海濱的一部分。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5770,"name":"金門尚義機場","lat":24.42914,"lng":118.35985,"cat":"other","desc":"機場位在金門島中部偏南，和金城、山外兩地各相距約六公里。它坐落在金湖鎮尚義里，因此大家也叫它「尚義機場」。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5771,"name":"金門植物園","lat":24.45429,"lng":118.39753,"cat":"nature","desc":"太武山腳這座植物園，前身是培育景觀苗木的太武苗圃。園內收集了兩百多種華南植物與金門原生植物，還設有溪流生態區。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5772,"name":"金門縣陶瓷廠","lat":24.43562,"lng":118.40662,"cat":"other","desc":"一九六三年成立的縣營陶瓷廠，是金門的官窯。這裡以瓷土燒製器物，再由藝師以彩繪裝飾，陶瓷和彩繪都是廠裡的特色。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5773,"name":"陳景蘭洋樓（陳坑大洋樓）","lat":24.437288,"lng":118.390161,"cat":"history","tag":"歷史建築","desc":"旅居新加坡的僑商陳景蘭返鄉建起這座白色洋樓，除了自家人住，也撥出空間做小學校舍。正面成排的拱門兩兩對稱，拱間還有細緻雕花。","area":"金湖鎮・金門縣","ph":"文"},{"id":5774,"name":"陳期宰洋樓","lat":24.44451,"lng":118.41511,"cat":"history","tag":"古蹟","desc":"洋樓外廊一樓以石柱和石樑支撐，到了二樓，換成磚柱和一道道拱圈。仔細看拱面與柱頭上的泥塑，旁邊還有花瓶形欄杆。","area":"金湖鎮・金門縣","ph":"文"},{"id":5775,"name":"陳祠櫸古厝","lat":24.44007,"lng":118.39586,"cat":"worship","tag":"歷史建築","desc":"古厝位在太武山南麓的夏興，這個聚落舊稱「下坑」。宅子採傳統三蓋廊格局，左側連著護龍，老地名也能在清代《金門志》裡找到。","area":"金湖鎮・金門縣","ph":"文"},{"id":5776,"name":"陳酙六路大厝","lat":24.43965,"lng":118.38894,"cat":"history","tag":"歷史建築","desc":"大厝正面以石牆為底，上方用煙炙磚砌出紋樣。走到側面看，前排牆腳的長石疊成五層，後排則疊到七層。","area":"金湖鎮・金門縣","ph":"文"},{"id":5777,"name":"陽明湖","lat":24.45921,"lng":118.43176,"cat":"scenic","desc":"太武山後山的紅色花崗石前方，就是這座四周林木茂盛的人工湖。秋天附近的臺灣欒樹開花，也替湖畔山景添了顏色。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5778,"name":"順濟宮","lat":24.41963,"lng":118.43458,"cat":"worship","tag":"歷史建築","desc":"廟宇在二〇一九年重建，格局分前後兩進，旁邊另有護龍。花崗石條砌成正殿外牆，抬頭則能看到屋脊上密布的剪黏和彩繪泥塑。","area":"金湖鎮・金門縣","ph":"文"},{"id":5779,"name":"頑石點頭勒石群","lat":24.46572,"lng":118.42186,"cat":"scenic","desc":"太武池附近的岩石上，能找到「頑石點頭」和「其介如石」等題字。這裡面向東方，視野開闊，山上賞日出也因此有「太武觀日」之名。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5780,"name":"高洞坑道","lat":24.43331,"lng":118.40682,"cat":"scenic","desc":"這是舊防空部隊留下的坑道，洞口曾一度被雜草遮住。入口旁還看得出過去停放戰車的位置，可以辨認這裡原有的用途。","area":"金湖鎮・金門縣","ph":"觀"},{"id":5781,"name":"二崙分駐所眷舍","lat":23.77109,"lng":120.412966,"cat":"history","tag":"歷史建築","desc":"日治時期二崙就已設立派出所，這裡是警察眷屬居住的房舍。眷舍只有一層，磚和木材並用，屋頂仍看得出日式屋架的形式。","area":"二崙鄉・雲林縣","ph":"文"},{"id":5782,"name":"二崙荷苞嶼恆心堂","lat":23.80494,"lng":120.39551,"cat":"worship","tag":"歷史建築","desc":"恆心堂與門樓在一九二一年開始興建，前後花了五年才完成。依李家後人所述，建屋的李定是早期入墾荷苞嶼的李氏族人後代。","area":"二崙鄉・雲林縣","ph":"文"},{"id":5783,"name":"原二崙派出所","lat":23.770413,"lng":120.413338,"cat":"history","tag":"古蹟","desc":"舊派出所把磚造辦公室與木造宿舍排在一起，入口上方有日式千鳥破風。宿舍外牆除了木製雨淋板，也用上編竹夾泥的做法。","area":"二崙鄉・雲林縣","ph":"文"},{"id":5784,"name":"元長傅氏大宗祠","lat":23.65041,"lng":120.31547,"cat":"worship","tag":"歷史建築","desc":"傅姓族人在一九三五年建起這座宗祠。後來韋恩颱風造成建物受損，宗親便商議依原有樣貌修繕，一九八九年完成重修。","area":"元長鄉・雲林縣","ph":"文"},{"id":5785,"name":"元長西莊番仔井","lat":23.620666,"lng":120.306062,"cat":"history","tag":"歷史建築","desc":"西莊人稱這口井為番仔井或紅毛井，相傳是荷蘭統治時期開鑿的。清乾隆年間移居此地的吳銅，後來也曾整修這口老井。","area":"元長鄉・雲林縣","ph":"文"},{"id":5786,"name":"北港大復戲院","lat":23.56997,"lng":120.304192,"cat":"culture","tag":"歷史建築","desc":"日治時期的「北港座」是北港街最早的劇場，一九二七年由龔丕趁投資興建。戰後這裡繼續演戲和放電影，前後棟先後改建。","area":"北港鎮・雲林縣","ph":"文"},{"id":5787,"name":"北港溪鐵橋","lat":23.572251,"lng":120.305226,"cat":"history","tag":"歷史建築","desc":"這座跨越北港溪的鐵橋連接雲林與嘉義兩縣，也叫復興鐵橋。一九〇九年興建時採用了弓形彎曲的鐵道橋身，台糖稱它為北港溪十一號橋。","area":"北港鎮・雲林縣","ph":"文"},{"id":5788,"name":"北港登記所","lat":23.5689,"lng":120.305109,"cat":"history","tag":"歷史建築","desc":"從前居民辦理土地登記，會來到這棟隸屬臺南地方法院的辦公廳舍。它採用簡潔的西方古典樣式，正面帶著弧度，大門稍稍偏在一側。","area":"北港鎮・雲林縣","ph":"文"},{"id":5789,"name":"北港糖廠","lat":23.56888,"lng":120.2985,"cat":"history","tag":"歷史建築","desc":"製糖工場由十六棟鋼構廠房和周邊設施組成，屋頂有的是單坡、有的是雙坡。除了鋼骨和金屬浪板，也能在煙道與蔗渣室看見磚造部分。","area":"北港鎮・雲林縣","ph":"文"},{"id":5790,"name":"北港義民廟","lat":23.567658,"lng":120.302919,"cat":"worship","tag":"古蹟","desc":"廟與墓塚共處一地，三座義塚和祠廟排出左右對稱的格局。這裡也奉祀閩籍義民，在臺灣的義民廟當中相當少見。","area":"北港鎮・雲林縣","ph":"文"},{"id":5791,"name":"北港自來水廠","lat":23.56423,"lng":120.305961,"cat":"history","tag":"古蹟","desc":"這座水塔遠看是一座分三層的建築，最上方的圓柱體用來蓄水。底下兩層做成十角形，每一面都開了半圓拱窗或拱門。","area":"北港鎮・雲林縣","ph":"文"},{"id":5792,"name":"北港蔡然標古厝","lat":23.566004,"lng":120.303987,"cat":"history","tag":"古蹟","desc":"蔡然標曾在北港公學校教漢文，也參與北港朝天宮的重修。這座故居前後各有三開間，側面的山牆用標準磚依英式砌法砌成。","area":"北港鎮・雲林縣","ph":"文"},{"id":5793,"name":"北港鎮安宮","lat":23.566862,"lng":120.301939,"cat":"worship","tag":"古蹟","desc":"北港蔡姓移民將七王爺從泉州石獅容卿帶來，起初把神尊供在家裡。清末文獻已留下王爺廟的記錄，廟頂有燕尾屋脊和剪黏裝飾。","area":"北港鎮・雲林縣","ph":"文"},{"id":5794,"name":"北港集雅軒","lat":23.56749,"lng":120.303559,"cat":"history","tag":"古蹟","desc":"這座清代街屋和笨港的北管子弟戲有關。早年地方人士因參與媽祖遶境而組成集雅軒，清咸豐年間正式開館，早期戲服還存放在朝天宮。","area":"北港鎮・雲林縣","ph":"文"},{"id":5795,"name":"原北港武德殿附屬建築","lat":23.568867,"lng":120.302475,"cat":"worship","tag":"歷史建築","desc":"北港鎮義民路上有一棟木造房屋，據傳是北港郡武德殿的附屬建築。附近街廓曾聚集郡役所、公會堂與俱樂部等公共機關。","area":"北港鎮・雲林縣","ph":"文"},{"id":5796,"name":"原台南區合會北港分公司","lat":23.569338,"lng":120.304158,"cat":"history","tag":"歷史建築","desc":"這裡曾是臺南區合會在北港的分公司。建築是一棟獨立的四層樓房，牆體採加強磚造，上方收成平屋頂。","area":"北港鎮・雲林縣","ph":"文"},{"id":5797,"name":"原謙源商號宅第甕牆","lat":23.566649,"lng":120.303521,"cat":"history","tag":"歷史建築","desc":"清道光年間，顏謙源家族在暗街仔建宅，把船上用來壓艙的酒甕拿來築牆。這戶郊商家族從前也經營碾米廠、油車和糖廊。","area":"北港鎮・雲林縣","ph":"文"},{"id":5798,"name":"國定古蹟-北港朝天宮","lat":23.567718,"lng":120.304628,"cat":"worship","tag":"古蹟","desc":"清代樹璧和尚從湄洲奉媽祖神像來到笨港，後來成為開山住持。今天廟裡的大木、雕刻和彩繪，連同屋頂的剪黏和泥塑，都是細看的地方。","area":"北港鎮・雲林縣","ph":"文"},{"id":5799,"name":"一起久久驛站","lat":23.61445,"lng":120.16304,"cat":"other","desc":"這裡把台十七線九十九公里處的公路場景，依實際大小重現。「一起久久」驛站留下的這處造景，也成了公路旅行的拍照點。","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5800,"name":"口湖下寮萬善同歸塚","lat":23.634514,"lng":120.16538,"cat":"history","tag":"古蹟","desc":"主墳旁圍著許多小墳，旁邊石碑上留有清咸豐和日治大正年間的重修字樣。後來附近陸續發現的遺骸，也收葬在這些小墳裡。","area":"口湖鄉・雲林縣","ph":"文"},{"id":5801,"name":"口湖文生天主堂","lat":23.586971,"lng":120.185356,"cat":"worship","tag":"歷史建築","desc":"這座歐式天主堂有兩層半樓高，創建者是羅星塔神父。他曾在法國留學取得哲學博士，後來到臺灣傳教，在口湖建起教堂。","area":"口湖鄉・雲林縣","ph":"文"},{"id":5802,"name":"口湖遊客中心","lat":23.54793,"lng":120.18237,"cat":"other","desc":"口湖的遊客中心從水鳥身上找到了建築的靈感。看它的外形時，可以想想水鳥展翅飛翔的姿態。","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5803,"name":"李萬居在地精神啟蒙館","lat":23.54978,"lng":120.19094,"cat":"culture","desc":"李萬居出身口湖梧北村，早年家境貧困，後來曾到上海和法國求學。館名紀念的這位同鄉，返臺後參與抗日，也透過辦報評論時政。","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5804,"name":"梧北鐵花窗社區(椬梧社區)","lat":23.54932,"lng":120.18978,"cat":"other","desc":"村口五層樓高的椬梧水塔是地標，巷弄裡的鐵花窗則拿地方故事當題材。穿過這些像畫展般的街巷，還能見到老屋、老樹和古井。","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5805,"name":"椬梧滯洪池","lat":23.542,"lng":120.17353,"cat":"other","desc":"這座滯洪池在口湖鄉椬梧，湖水旁就是一片濕地。沿著湖畔散步，水面和岸邊的濕地風光盡收眼底。","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5806,"name":"鄭豐喜紀念圖書館","lat":23.58069,"lng":120.18667,"cat":"culture","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5807,"name":"金湖萬善爺廟","lat":23.57431,"lng":120.15231,"cat":"worship","desc":"一八四五年金湖發生大水災，居民在蚶仔寮建祠悼念罹難者。今日這座廟從蚶仔寮分靈而來，一九八五年在現址重建。","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5808,"name":"馬蹄蛤主題館","lat":23.57611,"lng":120.14611,"cat":"culture","area":"口湖鄉・雲林縣","ph":"觀"},{"id":5809,"name":"古坑東和陳宅","lat":23.683813,"lng":120.568189,"cat":"history","tag":"歷史建築","desc":"這座合院是一九一八年所建，見證詔安客家族人在古坑東和開墾立足的歷程。相傳陳家當年賣了八甲田地，特別聘請唐山師傅來建屋。","area":"古坑鄉・雲林縣","ph":"文"},{"id":5810,"name":"東和派出所","lat":23.684444,"lng":120.567986,"cat":"history","tag":"歷史建築","desc":"派出所的磚造辦公室居中，兩邊接著木造宿舍，三部分一字排開。從正面看，中央屋頂的切角和入口上方挑出的雨庇最醒目。","area":"古坑鄉・雲林縣","ph":"文"},{"id":5811,"name":"四湖下桂山章寶宮","lat":23.6288,"lng":120.18704,"cat":"worship","tag":"古蹟","desc":"下桂山居民最初輪流在家裡奉祀從福建迎來的媽祖，日治初期才有小廟。後來村民和信眾再度集資，合力興建章寶宮。","area":"四湖鄉・雲林縣","ph":"文"},{"id":5812,"name":"萡子寮喔熊藝術村","lat":23.63029,"lng":120.15232,"cat":"culture","desc":"萡子寮的漁村巷弄以普天宮為中心，藝術家把熟悉的神話畫出了詼諧的一面。除了當地信仰裡的包公，牆上還有哪吒、嫦娥和牛郎織女。","area":"四湖鄉・雲林縣","ph":"觀"},{"id":5813,"name":"原土庫庄役場","lat":23.678672,"lng":120.392893,"cat":"history","tag":"歷史建築","desc":"這棟日治時期的行政廳舍像座三合院，兩翼圍著中庭，三面都有迴廊。從外頭看，西側屋脊較高、屋身也較長，兩邊並不對稱。","area":"土庫鎮・雲林縣","ph":"文"},{"id":5814,"name":"土庫第一市場","lat":23.676157,"lng":120.390935,"cat":"history","tag":"歷史建築","desc":"木造市場是長方形的，店鋪沿中央走道兩旁排開。留意腳下，走道兩邊各有排水溝，從柱間距離還能看出早年店面的寬窄。","area":"土庫鎮・雲林縣","ph":"文"},{"id":5815,"name":"土庫順天宮","lat":23.676461,"lng":120.39071,"cat":"worship","tag":"古蹟","desc":"從正面看，廟門連同兩旁龍虎門共有五門，是帝后神格的象徵。抬頭可見燕尾屋脊，以及把龍、鳳與三星放在一起的剪黏裝飾。","area":"土庫鎮・雲林縣","ph":"文"},{"id":5816,"name":"大埤三山國王廟","lat":23.627072,"lng":120.421834,"cat":"worship","tag":"古蹟","desc":"廟裡留著一方清嘉慶年間的「熙朝柱石」匾，還有乾隆和光緒年間添置的石香爐。除了木樑、石柱，也能看見清代留下的石雕柱珠。","area":"大埤鄉・雲林縣","ph":"文"},{"id":5817,"name":"原雲林縣警察局","lat":23.707789,"lng":120.540377,"cat":"history","tag":"歷史建築","desc":"這座舊警察局的前身是斗六區署及警察所。兩旁分別坐落著日治時期的斗六郡役所和斗六街役場，過去幾處公署就在同一地段。","area":"斗六市・雲林縣","ph":"文"},{"id":5818,"name":"原雲林縣遊民收容所","lat":23.702926,"lng":120.543092,"cat":"history","tag":"歷史建築","desc":"斗六公正街上的這處舊收容所，日治時期的看板原寫著「浮浪者收容所」。戰後招牌被重新漆過，裡頭的拘禁室仍有鐵質圍欄。","area":"斗六市・雲林縣","ph":"文"},{"id":5819,"name":"斗六真一寺","lat":23.712277,"lng":120.547363,"cat":"worship","tag":"古蹟","desc":"寺院前殿採泉州派做法，屋簷兩端向上挑起。細看像佛珠的布雕花籃，再往殿裡望，還能見到維多利亞式的神龕。","area":"斗六市・雲林縣","ph":"文"},{"id":5820,"name":"斗六行啟記念館","lat":23.705719,"lng":120.541884,"cat":"culture","tag":"歷史建築","desc":"紀念館的紅磚交錯排列，一層露長面、下一層露短面，稱為荷蘭式砌磚法。窗臺下方另用洗石子，和中段的紅磚形成不同層次。","area":"斗六市・雲林縣","ph":"文"},{"id":5821,"name":"雲林縣斗六糖廠糖業文化景觀","lat":23.702662,"lng":120.576493,"cat":"history","tag":"文化景觀","desc":"糖廠從前分成生產、行政、倉庫和宿舍等區域。生產區如今只剩兩棟建物，北側的行政區還能辨認出辦公室和福利社。","area":"斗六市・雲林縣","ph":"文"},{"id":5822,"name":"雲林縣榮譽國民之家美援時期建築群","lat":23.70402,"lng":120.558905,"cat":"history","tag":"歷史建築","desc":"這組建築使用美援經費興建，作為照顧退除役官兵的榮民之家。工程在民國四十五年動工，隔年四月完工，五月舉行落成典禮。","area":"斗六市・雲林縣","ph":"文"},{"id":5823,"name":"斗南分局舊辦公廳舍","lat":23.677825,"lng":120.478029,"cat":"history","tag":"古蹟","desc":"舊分局是厚實的清水磚造官廳，凸出的入口山牆通往挑高四公尺的辦公室。旁邊的舊戶政事務所則是木造日式平房，開了大片窗戶。","area":"斗南鎮・雲林縣","ph":"文"},{"id":5824,"name":"斗南火車站北側倉庫群","lat":23.673769,"lng":120.481578,"cat":"history","tag":"歷史建築","desc":"車站北側有六座清水磚倉庫，早年鹽、肥料、糖和酒都曾在這裡轉運。倉庫蓋著水泥瓦，每棟都超過四公尺高，也曾供軍隊駐紮。","area":"斗南鎮・雲林縣","ph":"文"},{"id":5825,"name":"斗南車站","lat":23.677137,"lng":120.476081,"cat":"history","tag":"歷史建築","desc":"一九〇三年設站時，站名沿用地方舊名「他里霧」，最初只有一棟簡單的木造站房。後來地方改稱斗南，車站也在一九四五年改建。","area":"斗南鎮・雲林縣","ph":"文"},{"id":5826,"name":"舊東勢鄉公所辦公廳舍及附屬倉庫","lat":23.675284,"lng":120.252667,"cat":"history","tag":"歷史建築","desc":"東勢居民為了就近辦事而爭取設鄉，獨立成鄉四年後，第一代鄉公所才落成。這棟覆瓦的老廳舍日後也當過戶政事務所、消防隊和監理站。","area":"東勢鄉・雲林縣","ph":"文"},{"id":5827,"name":"原台灣三菱製紙所辦公廳舍","lat":23.763592,"lng":120.614053,"cat":"history","tag":"歷史建築","desc":"這棟舊製紙所的辦公廳舍也曾是林內庄役場，屋頂的水泥瓦分向四面傾斜。牆的外側是一排磚拱，內側則用磚牆承重。","area":"林內鄉・雲林縣","ph":"文"},{"id":5828,"name":"濁水水利發電所","lat":23.772636,"lng":120.598878,"cat":"history","tag":"古蹟","desc":"發電所的主體用厚磚牆砌成，北側較高的水車室則以鋼筋混凝土建造。牆面上開著拱形拉窗，屋頂還有局部突起的太子樓。","area":"林內鄉・雲林縣","ph":"文"},{"id":5829,"name":"好蝦冏男社","lat":23.53369,"lng":120.20324,"cat":"other","desc":"一群年輕人回到水林鄉，選了在家鄉養蝦這份工作。「好蝦冏男社」說的就是這群聚在一起養蝦的年輕人。","area":"水林鄉・雲林縣","ph":"觀"},{"id":5830,"name":"海口庄派出所","lat":23.700388,"lng":120.199382,"cat":"history","tag":"歷史建築","desc":"派出所的外牆留有日治大正時期的清水磚，也看得到昭和年間流行的洗石子。細看建築的柱子，還能辨認出仿羅馬柱的樣式。","area":"臺西鄉・雲林縣","ph":"文"},{"id":5831,"name":"海口庄長官舍","lat":23.701013,"lng":120.200045,"cat":"history","tag":"歷史建築","desc":"這是一棟獨立的日式木造官舍，只有一層樓，屋頂蓋瓦。正面不取左右對稱，入口和凸窗所在的位置，也和背面有不同的安排。","area":"臺西鄉・雲林縣","ph":"文"},{"id":5832,"name":"莿桐保甲事務所","lat":23.759232,"lng":120.500192,"cat":"history","tag":"歷史建築","desc":"這裡曾是保甲書記辦理地方事務的場所。建築上樑時留下的木牌稱為棟札，上頭記著一九三四年七月舉行上樑儀式。","area":"莿桐鄉・雲林縣","ph":"文"},{"id":5833,"name":"莿桐饒平保甲事務所","lat":23.779821,"lng":120.518935,"cat":"history","tag":"歷史建築","desc":"日治時期的保甲制度以十戶為一甲、十甲為一保，饒平這處事務所與這套制度有關。當時保甲協助調查戶口，也參與防疫和修橋鋪路。","area":"莿桐鄉・雲林縣","ph":"文"},{"id":5834,"name":"原虎尾官營小賣市場","lat":23.709023,"lng":120.435209,"cat":"history","tag":"歷史建築","desc":"一九三六年完工的第一賣場是座轉折成直角的洋式建築，當年也是虎尾新街區的入口地標。隨著攤商向外擴展，它逐漸成為虎尾第一公有零售市場。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5835,"name":"虎尾合同廳舍","lat":23.709198,"lng":120.433887,"cat":"history","tag":"歷史建築","desc":"這棟四層樓的廳舍曾是虎尾街最高的建築，中央高塔上還設有瞭望臺。正面和側面都開了圓窗，洗石子外牆上有古典線條裝飾。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5836,"name":"虎尾建國眷村","lat":23.71453,"lng":120.4208,"cat":"history","desc":"建國一村、二村保有農村型眷村的格局，村內也留著二戰時日軍的兵舍。這片土地先是農村，成為訓練基地後，戰後又住進空軍眷屬。","area":"虎尾鎮・雲林縣","ph":"觀"},{"id":5837,"name":"虎尾民權路51巷老洋房","lat":23.709688,"lng":120.435977,"cat":"structure","tag":"歷史建築","desc":"巷裡的老洋房原是醫師住宅，約建於一九三五年前後。房子融合洋式與現代風格，後來經過整修，成了一間文創書店。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5838,"name":"虎尾涌翠閣","lat":23.712768,"lng":120.434046,"cat":"history","tag":"古蹟","desc":"木造建築的外牆覆著雨淋板，磚砌基礎每隔一段就留有通風口。抬頭看四面傾斜的日式屋頂，上頭鋪的是仿黑瓦的水泥瓦。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5839,"name":"虎尾登記所","lat":23.708563,"lng":120.432831,"cat":"history","tag":"歷史建築","desc":"這棟日式磚木建築格局方正，主屋仍保留日治後期使用的水泥瓦。外圍另有後來增加的磚造房舍，可以看出不同時期的建造痕跡。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5840,"name":"虎尾糖廠虎尾驛","lat":23.704086,"lng":120.436344,"cat":"history","tag":"歷史建築","desc":"老驛站一字排開，木頭外牆釘著雨淋板。西側入口伸出一座帶有細部木飾的門廊，小門廊的雙坡屋頂和主屋的四坡屋頂各有樣貌。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5841,"name":"虎尾糖廠酒精槽","lat":23.707247,"lng":120.438123,"cat":"history","tag":"古蹟","desc":"舊酒精工場的廠房已經拆除，磚造酒精槽仍留在原地。閒置的土地漸漸長成雜林，連槽體的基座與裂開的牆面也有植物攀附。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5842,"name":"虎尾糖廠鐵橋","lat":23.70224,"lng":120.43713,"cat":"history","tag":"古蹟","desc":"糖廠鐵橋全長約四百三十七公尺，鋼樑架在鋼筋混凝土橋墩上。仔細看各段的橋身，因應河道寬窄，鋼樑用了好幾種不同的形式。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5843,"name":"虎尾自來水廠","lat":23.712454,"lng":120.433771,"cat":"history","tag":"古蹟","desc":"水廠裡的八角形水塔有二十六公尺多高，能蓄四百公噸的水。旁邊的唧筒室有洗石子窗框，物料倉庫入口則帶有小門廊。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5844,"name":"虎尾郡守官邸","lat":23.70907,"lng":120.432872,"cat":"history","tag":"歷史建築","desc":"這棟日治時期的官邸，最早是虎尾郡守和家人生活的地方。戰後先後成為區長和法院主管的宿舍，曾有十二任雲林地方法院院長在這裡居住。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5845,"name":"虎尾郡役所","lat":23.709437,"lng":120.433577,"cat":"history","tag":"歷史建築","desc":"虎尾升格為郡後，一九二二年落成的郡役所成了地方行政中心。後來陸續增設司法室、加蓋二樓，又另外興建一棟郡守辦公室。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5846,"name":"雲林布袋戲館","lat":23.7093,"lng":120.43356,"cat":"culture","desc":"日治時期的虎尾郡役所如今成了布袋戲館，裡頭有不同世代的戲偶、劇本和表演服裝。除了看掌中角色，也能看見偶戲的舞臺是怎麼設計的。","area":"虎尾鎮・雲林縣","ph":"觀"},{"id":5847,"name":"雲林故事館-故事ㄟ厝","lat":23.70915,"lng":120.43279,"cat":"culture","desc":"日式木造的故事館，原是虎尾郡守的官邸。房子一度面臨拆除，經鎮民與地方文史工作者等人連署保存，才有了後來的整修。","area":"虎尾鎮・雲林縣","ph":"觀"},{"id":5848,"name":"雲林縣虎尾大崙腳文化景觀","lat":23.712772,"lng":120.434564,"cat":"history","tag":"文化景觀","desc":"虎尾舊地名「大崙腳」裡的崙，指的是風吹堆積成的沙丘。這一帶後來設了大崙腳公園，附近就有虎尾自來水廠與涌翠閣。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5849,"name":"雲林縣虎尾鎮中央廣播電臺虎尾分臺文化景觀","lat":23.724979,"lng":120.417078,"cat":"history","tag":"文化景觀","desc":"虎尾分臺設在昔日空軍基地的土地上，周圍曾是一片蔗田。民國六十一年電臺竣工，成為中央廣播電臺第四座分臺，以短波對中國廣播。","area":"虎尾鎮・雲林縣","ph":"文"},{"id":5850,"name":"褒忠鄧麗君幼年故居","lat":23.719896,"lng":120.311778,"cat":"history","tag":"歷史建築","desc":"鄧麗君出生在褒忠鄉田洋村，六歲才隨家人搬到蘆洲。這座她幼年住過的房子，是當地常見的合院，地方協會也參與保存故居與文物。","area":"褒忠鄉・雲林縣","ph":"文"},{"id":5851,"name":"原西螺建興路廖文毅街屋","lat":23.80153,"lng":120.45899,"cat":"structure","tag":"歷史建築","desc":"這棟街屋位於西螺延平路和建興路口，和臺灣獨立運動人物廖文毅有關。周邊還有東市場與捷發茶莊，同在老街區裡。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5852,"name":"捷發乾記茶莊","lat":23.801876,"lng":120.462522,"cat":"culture","tag":"歷史建築","desc":"茶莊分成前、中、後三棟，從街上看前棟像兩層樓，其實有三層。這棟一九三五年起建的房子，陽臺、雨庇和女兒牆混合了洋式與日式風格。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5853,"name":"西螺大橋","lat":23.811505,"lng":120.460629,"cat":"history","tag":"歷史建築","desc":"橫跨雲林和彰化的橋身，長達一千九百多公尺。橋上鋼材採華倫式桁架相連，這座橋落成時曾是遠東最長的橋梁。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5854,"name":"西螺廣福宮","lat":23.797228,"lng":120.464839,"cat":"worship","tag":"古蹟","desc":"三川殿屋脊上，兩隻彩鳳分立福祿壽三星兩側，這組裝飾稱為「雙鳳朝三星」。紅瓦底上排著綠色筒瓦，兩側還有陳天乞所作的剪黏。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5855,"name":"西螺張廖家廟崇遠堂","lat":23.776979,"lng":120.423685,"cat":"worship","tag":"歷史建築","desc":"這座家廟立在農田之間，四周的水路也和建築格局相互配合。從整體看，廟的外圍是圓的，裡頭的建築則排出方正的形狀。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5856,"name":"西螺振文書院","lat":23.794425,"lng":120.464492,"cat":"history","tag":"古蹟","desc":"書院的木雕依空間有不同做法，正殿重透雕，拜亭則多用細緻的浮雕。梁間彩繪以青綠為主，拜亭裡還懸著「千秋書祖」的匾。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5857,"name":"西螺東市場","lat":23.802119,"lng":120.463349,"cat":"history","tag":"歷史建築","desc":"老市場前排是磚木店鋪，後方另有後來增建的攤位，中間留出廣場。正面牌樓後頭藏著排水天溝，水再沿磚柱裡的陶管往下流。","area":"西螺鎮・雲林縣","ph":"文"},{"id":5858,"name":"國定古蹟麥寮拱範宮","lat":23.748248,"lng":120.255573,"cat":"worship","tag":"古蹟","desc":"清康熙年間，純真禪師自湄洲奉媽祖渡海，在海豐港一帶落腳。後來水患迫使廟宇遷往麥寮街，如今還看得見日治時期留下的對場廟宇工藝。","area":"麥寮鄉・雲林縣","ph":"文"},{"id":5859,"name":"三塊厝火車站","lat":22.638809,"lng":120.29372,"cat":"history","tag":"古蹟","desc":"早年從打狗通往九曲堂的鐵路支線，第一站就在這裡。現存日式木造站房完成於一九二三年，磚砌臺基外面另覆了一層洗石子。","area":"三民區・高雄市","ph":"文"},{"id":5860,"name":"三塊厝舊站","lat":22.63872,"lng":120.29387,"cat":"history","desc":"一九〇八年啟用的老驛站兼辦客運和貨運，其中以運貨為主。北邊煉瓦會社生產的磚材，就曾經由這座車站送往各地。","area":"三民區・高雄市"},{"id":5861,"name":"三鳳宮","lat":22.63584,"lng":120.29416,"cat":"worship","desc":"舊稱三鳳亭的廟宇是三塊厝居民的信仰中心，主祀哪吒三太子。後來遷到河北二路，建成三層樓的北方式廟宇，門扇上還能看見彩繪。","area":"三民區・高雄市"},{"id":5862,"name":"中都愛河濕地公園","lat":22.64655,"lng":120.28653,"cat":"nature","desc":"愛河南岸這片濕地位於十全路與九如路之間，順著河岸綿延約二點五公里。公園也是高雄市區沿河生態綠廊的一部分。","area":"三民區・高雄市"},{"id":5863,"name":"原高雄工專北棟教學大樓","lat":22.651577,"lng":120.328344,"cat":"history","tag":"歷史建築","desc":"一九六五年完工的北棟教學大樓，是高雄工專最早蓋好的校舍。這棟三層樓的鋼筋混凝土建築，早年稱為第二教學大樓。","area":"三民區・高雄市","ph":"文"},{"id":5864,"name":"國立科學工藝博物館","lat":22.64149,"lng":120.32255,"cat":"culture","desc":"科工館設在工業發達的高雄，是臺灣第一座以應用科學為主題的博物館。館區分南北兩館，收藏科技文物，也用展覽來介紹科學和工藝。","area":"三民區・高雄市"},{"id":5865,"name":"彪琥台灣鞋故事館","lat":22.65374,"lng":120.31344,"cat":"culture","area":"三民區・高雄市"},{"id":5866,"name":"愛河之心","lat":22.65132,"lng":120.30388,"cat":"other","desc":"愛河中上游的這處水岸，由東湖和西湖組成。兩座湖中間有橋連接，從整體輪廓看去就像一顆心，也呼應了它的名字。","area":"三民區・高雄市"},{"id":5867,"name":"檨仔林埤濕地公園","lat":22.6727,"lng":120.32707,"cat":"nature","desc":"狹長的埤塘濕地能滯洪，也提供城市裡親近生態的空間。園區北側的密林保留大片原生芒果樹，有助於緩衝一旁高速公路的干擾。","area":"三民區・高雄市"},{"id":5868,"name":"民族車站","lat":22.63865,"lng":120.3144,"cat":"other","desc":"車站以「微觀萬象」為題，入口上方的大幅彩繪名叫「繁花之境」。往上看能找到花、鳥與昆蟲，一路延伸到地下空間的則是豐富的色彩。","area":"三民區・高雄市"},{"id":5869,"name":"科工館車站","lat":22.63677,"lng":120.32708,"cat":"other","desc":"從地面看，站體和民族站十分相似，走到地下才看出各自的特色。這裡把遺傳物質的雙螺旋造型用在裝飾上，呼應附近的科工館。","area":"三民區・高雄市"},{"id":5870,"name":"臺灣煉瓦會社打狗工場〈中都唐榮磚窯廠〉","lat":22.641872,"lng":120.284501,"cat":"history","tag":"古蹟","desc":"舊磚廠留著八卦窯與兩座煙囪，從前生產的磚也是地方建築的材料。看窯身的磚拱、高牆與磚飾，還能辨認當年的砌磚手藝。","area":"三民區・高雄市","ph":"文"},{"id":5871,"name":"金獅湖蝴蝶園","lat":22.66615,"lng":120.3282,"cat":"scenic","desc":"金獅湖東側的網室裡種了蝴蝶幼蟲的食草，也有成蝶採蜜的植物。園內記錄過三十多種蝴蝶，包括大鳳蝶、端紅蝶和黃裳鳳蝶。","area":"三民區・高雄市"},{"id":5872,"name":"九番埤濕地公園","lat":22.68715,"lng":120.32643,"cat":"nature","desc":"這口埤塘早年供農田灌溉，荒廢後一度被棄土覆蓋。地方人士和環保團體爭取整治，疏通水道後，才有今天的親水區、自然林和散步道。","area":"仁武區・高雄市"},{"id":5873,"name":"八卦休閒公園","lat":22.69049,"lng":120.33836,"cat":"nature","desc":"八卦里的這片綠地除了散步和觀察濕地，也設有自行車道。公園把運動、親子休憩和聚會結合在一起，還能作為演出場地。","area":"仁武區・高雄市"},{"id":5874,"name":"內門紫竹寺","lat":22.91718,"lng":120.45503,"cat":"worship","desc":"這裡的觀音原由郭家奉祀，後來才由庄民共同建寺。內門流傳著觀音「飛爐」顯靈的故事，也把家族信仰和三百多年的廟史連在一起。","area":"內門區・高雄市"},{"id":5875,"name":"南海紫竹寺","lat":22.94175,"lng":120.46137,"cat":"worship","desc":"寺旁的宋江兵器館，收藏了陣頭使用的文物，還陳列《水滸傳》一百零八名好漢的臉譜。這裡的武陣則以舞龍的龍陣為特色。","area":"內門區・高雄市"},{"id":5876,"name":"木柵吊橋＆木柵教會","lat":22.98098,"lng":120.47147,"cat":"worship","desc":"內門木柵是西拉雅族世居地，當地教會奠基於一八六八年。幾年後英國攝影師約翰．湯姆生來到這裡，留下教會的早期影像。","area":"內門區・高雄市"},{"id":5877,"name":"洪家古厝","lat":22.95341,"lng":120.45893,"cat":"history","desc":"二埔洪家這座閩南式大宅始建於一八七〇年，後人又陸續增建。前後兩排房屋以護龍和過水廊相連，圍出一座完整的四合院。","area":"內門區・高雄市"},{"id":5878,"name":"順賢宮","lat":22.91245,"lng":120.47039,"cat":"worship","desc":"這座南式宮殿風格的廟宇前方，有一片名為聖母湖的水面。走到殿裡抬頭看，天花板壁畫畫的是盤轉的神虎。","area":"內門區・高雄市"},{"id":5879,"name":"鴨母王朱一貴文化園區","lat":22.93946,"lng":120.45337,"cat":"culture","desc":"地方人口中的「鴨母王」就是清代起事的朱一貴。內門居民為他修廟建祠，鴨母祠與興安宮一併規劃，廟埕前還留著一口井。","area":"內門區・高雄市"},{"id":5880,"name":"六龜大佛","lat":23.05517,"lng":120.67863,"cat":"other","desc":"新開部落的大佛也稱彩虹山大佛，佛身高達二十四公尺。大佛面向蜿蜒的荖濃溪，背後是一層層連綿的中央山脈。","area":"六龜區・高雄市"},{"id":5881,"name":"六龜隧道","lat":22.94963,"lng":120.64138,"cat":"other","desc":"從前為了運送製樟腦油所需的樟木，人們在十八羅漢山的礫岩間開鑿隧道。這組隧道在民國二十六年通車，六龜鄉親俗稱它「六座窟」。","area":"六龜區・高雄市","ph":"觀"},{"id":5882,"name":"原六龜里池田屋（高雄客運六龜站）","lat":22.997842,"lng":120.634525,"cat":"history","tag":"歷史建築","desc":"池田兵太郎在一九二九年興建的旅舍，後來成了高雄客運六龜站。老屋用臺灣檜木搭起挑高結構，三面房舍圍成ㄇ字形。","area":"六龜區・高雄市","ph":"文"},{"id":5883,"name":"妙崇寺","lat":23.01074,"lng":120.66919,"cat":"worship","desc":"寺院最早位在高雄前鎮，因道路拓寬才搬到清涼山。山上的寺院由七座殿堂組成，牆面雕有許多佛像，也能望見荖濃溪。","area":"六龜區・高雄市","ph":"觀"},{"id":5884,"name":"寶來妙通寺","lat":23.10078,"lng":120.68564,"cat":"worship","desc":"橘色屋頂和白牆襯著青山，遠處就能認出寶來的這座佛寺。寺裡有蓮池、樓閣和花木，從高處還可以望見荖濃溪穿過縱谷。","area":"六龜區・高雄市","ph":"觀"},{"id":5885,"name":"寶來老樹廣場","lat":23.10734,"lng":120.69853,"cat":"nature","desc":"寶來一號橋旁的廣場有幾株百年大樹環繞。站上略高的景觀平臺，可以越過樹旁望向荖濃溪的彎曲河谷和遠處山巒。","area":"六龜區・高雄市","ph":"觀"},{"id":5886,"name":"寶來花賞溫泉公園","lat":23.10739,"lng":120.70347,"cat":"nature","desc":"寶來的溫泉是無色透明的碳酸氫鹽泉，泉水約五十二度。清早山間起霧時，能看見泉面冒出的白色水氣。","area":"六龜區・高雄市","ph":"觀"},{"id":5887,"name":"彩虹山大佛","lat":23.05544,"lng":120.67753,"cat":"other","desc":"新開路上這尊佛像也叫六龜大佛，由彩虹山宗教基金會設立。從民國八十九年動工到一〇四年落成，前後花了十五年。","area":"六龜區・高雄市","ph":"觀"},{"id":5888,"name":"新威景觀大橋","lat":22.89148,"lng":120.63812,"cat":"other","desc":"荖濃溪上這座橋位於六龜大橋和大津橋之間，橋身以向外傾斜的鋼拱支撐。設計還融入了紫斑蝶的造型，是跨越兩岸時醒目的特色。","area":"六龜區・高雄市","ph":"觀"},{"id":5889,"name":"新威森林公園","lat":22.89064,"lng":120.62234,"cat":"nature","desc":"荖濃溪西岸的臺地曾是大型苗圃，以培育熱帶樹苗為主。園內曾培育兩百多種樹苗，其中桃花心木、竹子和杉木特別多，還能遠望中央山脈。","area":"六龜區・高雄市","ph":"觀"},{"id":5890,"name":"新威森林公園","lat":22.89351,"lng":120.62307,"cat":"nature","desc":"當地人把這片臺地稱為「坪頂」，它原本是荖濃溪舊河床的一部分。這裡土質好，後來成為苗圃，栽了桃花心木、杉木和竹子等樹種。","area":"六龜區・高雄市"},{"id":5891,"name":"新威遊客中心","lat":22.8909,"lng":120.62324,"cat":"other","desc":"這處遊客中心設在六龜區的新威一帶。除了接待遊客，這裡也是茂林國家風景區管理處的行政中心。","area":"六龜區・高雄市","ph":"觀"},{"id":5892,"name":"東溪大橋","lat":23.00745,"lng":120.65413,"cat":"other","desc":"這座長一百三十一公尺的橋曾在敏督利颱風期間，被暴漲的荖濃溪水沖毀。後來由中鋼協助重建，在民國九十四年完工。","area":"六龜區・高雄市","ph":"觀"},{"id":5893,"name":"檨仔腳文化共享空間","lat":23.10565,"lng":120.69433,"cat":"culture","desc":"「檨仔腳」在臺語裡就是芒果樹下，這處空間原是一座舊倉庫。寶來居民取來溪石、漂流木、稻殼和稻草，用傳統工法動手改造。","area":"六龜區・高雄市","ph":"觀"},{"id":5894,"name":"水圳恩公祠","lat":22.89693,"lng":120.62603,"cat":"worship","desc":"清咸豐年間，黃仙人見新威一帶居民只能耕種旱田，便著手開鑿水圳。這座祠所紀念的，是從荖濃溪引水灌溉的故事。","area":"六龜區・高雄市","ph":"觀"},{"id":5895,"name":"浦來溪頭社戰道","lat":23.10651,"lng":120.70133,"cat":"scenic","desc":"這條約一點七公里的步道沿著山稜修築，坡度平緩。走到稜線較高處，眼前是荖濃溪與寶來溪交會的河谷，能看出水流侵蝕的痕跡。","area":"六龜區・高雄市","ph":"觀"},{"id":5896,"name":"稇源商店六龜支店","lat":22.997558,"lng":120.63505,"cat":"history","tag":"歷史建築","desc":"旗山的稇源商店在一九一二年來六龜開分店，後來又設了物產交換所。山裡的藤、蓪草和小米，可在這裡交換食鹽、火柴等生活用品。","area":"六龜區・高雄市","ph":"文"},{"id":5897,"name":"老樹廣場","lat":23.10701,"lng":120.70264,"cat":"nature","area":"六龜區・高雄市"},{"id":5898,"name":"諦願寺","lat":23.01094,"lng":120.63856,"cat":"worship","desc":"六龜紅水坑這座佛寺是鳥松圓照寺的分院，位在彩蝶谷與荖濃溪附近。寺院背山面水，供奉釋迦牟尼佛和地藏菩薩。","area":"六龜區・高雄市","ph":"觀"},{"id":5899,"name":"龜王岩","lat":22.99322,"lng":120.63942,"cat":"other","desc":"荖濃溪畔的岩石像一隻抬起頭的龜，因為姿態高昂，地方上稱它為龜王岩。岩石旁還有黃連木攀附生長。","area":"六龜區・高雄市","ph":"觀"},{"id":5900,"name":"城市光廊","lat":22.62305,"lng":120.2989,"cat":"other","desc":"中央公園的林蔭走廊在二〇〇一年融入光影藝術，十八公尺長的走廊收集了二〇〇一張市民笑臉。九位在地藝術家也在這裡以光為題創作。","area":"前金區・高雄市"},{"id":5901,"name":"愛河","lat":22.62483,"lng":120.28904,"cat":"other","desc":"河畔步道穿過高雄市區，沿途有咖啡廳，假日還有市集。夜裡除了兩岸的燈光，水面上也能看到愛之船和貢多拉船的身影。","area":"前金區・高雄市"},{"id":5902,"name":"摩登高雄-R9中央公園站","lat":22.62486,"lng":120.3011,"cat":"nature","desc":"黃色支柱托起大片白色棚頂，是建築師理查羅傑斯為車站設計的模樣。棚頂會收集雨水，導向站內的階梯水瀑，旁邊還種著綠色植物。","area":"前金區・高雄市"},{"id":5903,"name":"真愛碼頭","lat":22.61862,"lng":120.28966,"cat":"other","desc":"愛河出海口的十二號碼頭，原先是散裝貨輪裝卸的地方。如今面向市區與旗津方向的兩座風帆造型，象徵高雄和海港的對話。","area":"前金區・高雄市"},{"id":5904,"name":"立德棒球場","lat":22.62994,"lng":120.2893,"cat":"other","desc":"這座棒球場從日治時期就已存在。後來立德少棒隊在威廉波特拿下世界冠軍，球場在民國六十三年改用立德之名紀念球隊。","area":"前金區・高雄市"},{"id":5905,"name":"臺灣銀行高雄分行","lat":22.627662,"lng":120.289591,"cat":"history","tag":"歷史建築","desc":"分行的屋頂從四個角收向尖頂，簷角還站著裝飾用的壓簷獸。再往下看，入口鋪了花崗石面磚，其他牆面則用了回字紋和獸形圖案。","area":"前金區・高雄市","ph":"文"},{"id":5906,"name":"高雄市勞工博物館","lat":22.62713,"lng":120.28988,"cat":"culture","desc":"高雄的工廠和加工出口區，留下許多關於勞動者的故事。二〇〇九年創立於駁二藝術特區的勞工博物館，就以保存這段城市經驗為主題。","area":"前金區・高雄市"},{"id":5907,"name":"高雄文學館","lat":22.6255,"lng":120.29798,"cat":"culture","desc":"中央公園裡的這棟館舍，原是戰後高雄第一棟圖書館。二〇〇三年改為推廣在地文學的文學館，館名由作家葉石濤親筆題寫。","area":"前金區・高雄市"},{"id":5908,"name":"MLD台鋁","lat":22.60394,"lng":120.3037,"cat":"other","desc":"日治時代的鋁業基地後來改建成新空間，仍沿用「台鋁」這個名字。老廠房裡保留了大型Ｙ字鋼樑，還能看出重工業建築的尺度。","area":"前鎮區・高雄市"},{"id":5909,"name":"前鎮之星","lat":22.59523,"lng":120.31527,"cat":"other","desc":"中山四路和凱旋四路交會處，有一座讓單車跨過繁忙路口的橋。它把臨港線、前鎮河與鳳山溪三處自行車道串在一起。","area":"前鎮區・高雄市"},{"id":5910,"name":"前鎮漁港","lat":22.57057,"lng":120.31533,"cat":"other","desc":"這裡是高雄最大的漁港，可容納數十艘千噸級遠洋漁船。許多漁船返港後在此卸貨，碼頭上的漁獲也隨著不同船隻而各有變化。","area":"前鎮區・高雄市"},{"id":5911,"name":"前鎮輪渡站","lat":22.58726,"lng":120.30641,"cat":"other","area":"前鎮區・高雄市"},{"id":5912,"name":"創藝所在-R7獅甲站","lat":22.60605,"lng":120.30808,"cat":"culture","desc":"獅甲的這處創意空間以設計、生活和教育為主題。它由工業局與市政府合作推動，讓紡織與設計業者、在地設計師有機會接觸消費者。","area":"前鎮區・高雄市"},{"id":5913,"name":"勞工公園","lat":22.60726,"lng":120.30931,"cat":"nature","desc":"公園以勞工為主題，樹蔭下的假日花市和廣場是居民平常休憩的地方。廣場上也立著工殤紀念碑，紀念在工作中失去生命的勞動者。","area":"前鎮區・高雄市"},{"id":5914,"name":"高雄展覽館","lat":22.60788,"lng":120.29833,"cat":"culture","desc":"亞洲新灣區這座會展中心就坐落在高雄港旁，是臺灣第一座多功能臨港會展中心。展場和港口比鄰，也是它在城市裡最容易辨認的特色。","area":"前鎮區・高雄市"},{"id":5915,"name":"高雄市漁業文化館","lat":22.57225,"lng":120.31673,"cat":"culture","desc":"高雄是臺灣遠洋漁業的發祥地，這座館便以港都的漁業為主題。館內透過照片和多媒體展示遠洋拖網、沿近海漁業，也有介紹魷魚和鮪魚漁業的展區。","area":"前鎮區・高雄市"},{"id":5916,"name":"高雄市立圖書館總館","lat":22.61024,"lng":120.30174,"cat":"culture","desc":"新光路上的總館高八層，建築外方內圓，設計靈感來自樹。植物一路融進開放的閱讀空間，人在館內看書，也能和綠意相伴。","area":"前鎮區・高雄市"},{"id":5917,"name":"高雄輕軌","lat":22.58278,"lng":120.33091,"cat":"other","desc":"從輕軌站名就能讀到高雄港邊的地名。光榮碼頭、真愛碼頭各有一站，駁二的大義、蓬萊和哈瑪星也都出現在沿線。","area":"前鎮區・高雄市"},{"id":5918,"name":"大寮共益磚窯廠","lat":22.619135,"lng":120.382146,"cat":"history","tag":"歷史建築","desc":"磚廠的八卦窯有兩層，底層窯室繞著中央煙道排列。從平面看，窯的兩端逐漸收尖，和常見兩端做成半圓的八卦窯不太一樣。","area":"大寮區・高雄市","ph":"文"},{"id":5919,"name":"大寮包公廟","lat":22.58945,"lng":120.41166,"cat":"worship","desc":"開封宮創建於一九六九年，前殿祭祀黑臉包公，中殿和後殿分別是五佛殿與玉皇殿。廟前那一對巨大的金獅，也是醒目的標記。","area":"大寮區・高雄市"},{"id":5920,"name":"曹公圳舊圳頭","lat":22.649453,"lng":120.426355,"cat":"history","tag":"歷史建築","desc":"舊圳頭的五孔涵外有日治時期加建的方形水閘框架。進水口前方還留著磚砌的船首形護墩，大部分埋在淤土裡，只露出平頂。","area":"大寮區・高雄市","ph":"文"},{"id":5921,"name":"舊振南漢餅文化館","lat":22.6223,"lng":120.38907,"cat":"culture","desc":"館裡的漢餅房把傳統糕餅和茶放在同一張桌上，也有手沖咖啡。吃餅之外，還能翻閱「時光書塔」選的書，聽古典樂團的音樂。","area":"大寮區・高雄市"},{"id":5922,"name":"九曲堂泰芳商會鳳梨罐詰工場","lat":22.65785,"lng":120.420932,"cat":"worship","tag":"歷史建築","desc":"這座鳳梨罐頭工場採方形格局，左右兩側和後方都留有迴廊。正面中央原有三道圓拱，後來用紅磚封起，另外開了窗戶。","area":"大樹區・高雄市","ph":"文"},{"id":5923,"name":"佛光山佛陀紀念館","lat":22.75729,"lng":120.44032,"cat":"culture","desc":"這座佛教博物館在二〇一一年落成，把佛教文化與歷史放進現代建築之中。館址設在高雄大樹，也是國際博物館協會的正式會員。","area":"大樹區・高雄市"},{"id":5924,"name":"佛光緣美術館 (總館)","lat":22.75196,"lng":120.44484,"cat":"culture","desc":"一九九四年，星雲大師為籌辦佛光大學而舉行的義賣會，成了美術館的起點。「佛光緣」這個名字，也記下了美術館和大學的這段因緣。","area":"大樹區・高雄市"},{"id":5925,"name":"台灣鳳梨工場","lat":22.65771,"lng":120.4208,"cat":"other","desc":"大樹的氣候和地形適合栽種鳳梨，工場所處的這一帶因此成為主要產區。清代臺灣地圖上就有「王萊山」這個地名，留下早年種鳳梨的線索。","area":"大樹區・高雄市"},{"id":5926,"name":"大樹三和瓦窯","lat":22.663657,"lng":120.426738,"cat":"history","tag":"歷史建築","desc":"三條磚窯並排，各自有一個窯口，拱頂卻不盡相同。左窯的入口呈八字形，中窯的拱頂帶尖，最右邊那座則是圓拱。","area":"大樹區・高雄市","ph":"文"},{"id":5927,"name":"大樹姑婆寮山頂莊家古厝","lat":22.709849,"lng":120.422692,"cat":"history","tag":"歷史建築","desc":"莊家先人從福建漳州來臺，在姑婆寮以種鳳梨起家，堂號為「天水堂」。古厝從清光緒年間草創，門楣留下主體在一九一九年完工的線索。","area":"大樹區・高雄市","ph":"文"},{"id":5928,"name":"東照山關帝廟","lat":22.69409,"lng":120.39355,"cat":"worship","desc":"供奉關聖帝君的廟宇源自高雄新興區的明德堂，後來在大樹小坪另建新廟。殿內有數十幅畫描繪關公事蹟，香客大樓上還立著關公像。","area":"大樹區・高雄市"},{"id":5929,"name":"竹寮取水站","lat":22.668096,"lng":120.42631,"cat":"history","tag":"古蹟","desc":"高屏溪畔的取水站在一九一三年啟用，主建築採用紅磚、弧形立面和綠色窗櫺。走到機房和修護廠，又能看到為放置機具留下的大跨度木構架。","area":"大樹區・高雄市","ph":"文"},{"id":5930,"name":"義大世界","lat":22.72984,"lng":120.40673,"cat":"other","desc":"觀音山風景區旁的園區約有九十公頃，裡頭的遊樂園以希臘情境為主題。園區也包含購物廣場與旅館，並曾舉辦跨年煙火活動。","area":"大樹區・高雄市"},{"id":5931,"name":"高屏溪斜張橋","lat":22.7656,"lng":120.45015,"cat":"other","desc":"這是臺灣第一座複合式斜張橋，也有人叫它南二高斜張橋。夜裡燈光投在跨過高屏溪的橋身上，拉出一道像彩虹般的輪廓。","area":"大樹區・高雄市"},{"id":5932,"name":"東華皮影戲","lat":22.73118,"lng":120.34282,"cat":"other","desc":"大社的東華皮戲團原名「德興班」，已有兩百年傳承。第五代傳人張德成曾和李天祿同獲選為第一屆國家民族藝師。","area":"大社區・高雄市"},{"id":5933,"name":"舉人石與舉人轎","lat":22.72745,"lng":120.35476,"cat":"history","desc":"清代籬仔內黃家曾出過幾位舉人與貢生，是當時的大戶。地方上甚至傳說，黃家人一路走到觀音山，都用不著經過別人的土地。","area":"大社區・高雄市"},{"id":5934,"name":"凝聚的綠寶石-R4高雄國際機場站","lat":22.57009,"lng":120.34173,"cat":"culture","desc":"機場捷運站用天窗引進藍天和光線，玻璃作品「凝聚的綠寶石」則用綠色呼應水與生命。這件立體公共藝術出自德國玻璃藝術家之手。","area":"小港區・高雄市"},{"id":5935,"name":"大坪頂熱帶植物園","lat":22.55653,"lng":120.38938,"cat":"nature","desc":"園內的地形從臺地、陡坡到懸崖都有，同一座公園裡便形成不同棲地。這座都會熱帶植物園也把保育、研究和環境教育納入規劃。","area":"小港區・高雄市"},{"id":5936,"name":"紅毛港文化園區","lat":22.5495,"lng":120.31776,"cat":"culture","desc":"紅毛港聚落遷村後，居民的生活記憶在高雄港第二港口入口處留了下來。園區裡有展示館、戶外展區和觀海平臺，也看得到高字塔。","area":"小港區・高雄市"},{"id":5937,"name":"台灣滷味博物館","lat":22.81757,"lng":120.26736,"cat":"culture","desc":"從夜市攤子起家的滷味業者，把工廠變成介紹滷味的博物館。隔著玻璃櫥窗能看見製作過程，館裡也以黃金蛋體驗介紹煮蛋的小訣竅。","area":"岡山區・高雄市","ph":"觀"},{"id":5938,"name":"台灣螺絲博物館","lat":22.80156,"lng":120.28688,"cat":"culture","desc":"岡山聚集了許多螺絲業者，這座三層樓的館舍記錄地方產業的發展。一樓把螺絲的生產流程和各道工序用到的機械放在一起展示。","area":"岡山區・高雄市"},{"id":5939,"name":"壽天宮","lat":22.79814,"lng":120.29112,"cat":"worship","desc":"廟裡的媽祖香火由臺南天后宮分來，清康熙年間便落腳岡山。三層宮殿的屋頂有燕尾和剪黏，殿內也留著潘麗水的彩繪。","area":"岡山區・高雄市"},{"id":5940,"name":"岡山228和平紀念公園","lat":22.79778,"lng":120.30306,"cat":"nature","desc":"這座為紀念二二八事件而建的公園，立著一座約兩層樓高的紀念碑。五隻和平鴿組成碑的造型，象徵臺灣不同族群共同生活。","area":"岡山區・高雄市"},{"id":5941,"name":"岡山文化中心","lat":22.78327,"lng":120.29827,"cat":"culture","desc":"中心有演藝廳、圖書館和皮影戲館，幾種藝文活動聚在同一片綠地裡。走到戶外，廣場能辦展覽，林間小道旁也有大型裝置藝術。","area":"岡山區・高雄市"},{"id":5942,"name":"志斌豆瓣醬故事館","lat":22.80719,"lng":120.32175,"cat":"culture","desc":"小崗山腳下這間故事館，前身是岡山區農會的一座倉庫。閒置空間改成展館後，以岡山三寶之一的豆瓣醬為主題，介紹志斌的醬料。","area":"岡山區・高雄市"},{"id":5943,"name":"航空教育展示館","lat":22.79416,"lng":120.26907,"cat":"culture","desc":"展館把飛機懸吊在空中，地面上的人也能從不同角度看機身。館內展示四十四架軍機實體，來自中國、美國及蘇聯。","area":"岡山區・高雄市"},{"id":5944,"name":"高雄市皮影戲館","lat":22.7827,"lng":120.29844,"cat":"culture","desc":"高雄是臺灣皮影戲的重要傳承地，岡山這座館外觀也取材自皮革的編織紋理。白色線條交錯成牆面，還有以皮影為題材的馬賽克壁畫。","area":"岡山區・高雄市"},{"id":5945,"name":"再見捌捌陸-臺灣眷村文化園區","lat":22.69249,"lng":120.289,"cat":"culture","desc":"園區設在左營明德新村幾戶舊眷舍裡，延續原高雄市眷村文化館的展示。名字裡的「捌捌陸」，取自二〇〇五年統計的全臺列管眷村數。","area":"左營區・高雄市"},{"id":5946,"name":"原日本海軍高雄警備府(左營海軍鎮海樓)","lat":22.688112,"lng":120.283692,"cat":"history","tag":"歷史建築","desc":"一九四三年，日本海軍將原在馬公的警備府遷到左營，這裡成為當時日本海軍在臺最高指揮機關。戰後這棟建築也曾作為海軍總司令部。","area":"左營區・高雄市","ph":"文"},{"id":5947,"name":"原生植物園","lat":22.68055,"lng":120.3012,"cat":"nature","desc":"公園以臺灣原生植物為主題，利用原有的地形起伏和舊曹公圳水渠布置園區。一路上能見到水生植物、季風雨林和珊瑚礁等不同環境。","area":"左營區・高雄市"},{"id":5948,"name":"城邑左營慈濟宮","lat":22.68091,"lng":120.29138,"cat":"worship","desc":"左營人俗稱這座廟為「老祖廟」，供奉保生大帝。廟始建於清康熙年間，歷經多次整修，仍留下早年的匾額、對聯與石牌。","area":"左營區・高雄市"},{"id":5949,"name":"左營廍後薛家古厝","lat":22.685795,"lng":120.287766,"cat":"history","tag":"古蹟","desc":"薛家最早建了第一進合院，後來隨家族繁衍，才逐步擴成三進大宅。大門旁還留著給貓進出的小方洞，和家族過去經營糧行的生活連在一起。","area":"左營區・高雄市","ph":"文"},{"id":5950,"name":"左營聖女小德蘭堂","lat":22.68353,"lng":120.28826,"cat":"worship","desc":"左營教友起初隸屬高雄聖母玫瑰堂的分部。大家後來合力買下一間木造廠房，拆下木料重組，在碑仔頭蓋起木板牆的小聖堂。","area":"左營區・高雄市"},{"id":5951,"name":"明德新村(將軍村)","lat":22.69407,"lng":120.28674,"cat":"other","desc":"這裡原是日本海軍將級軍官的宿舍，日式平房前有寬敞的庭院。戰後仍由海軍將領和眷屬居住，因此留下「將軍村」的稱呼。","area":"左營區・高雄市"},{"id":5952,"name":"洲仔濕地公園","lat":22.68055,"lng":120.29822,"cat":"nature","desc":"蓮池潭畔這片濕地採用生態工法打造，讓鳥類和水生動植物有地方棲息。公園也曾成功復育多種生物，保留潭邊的濕地環境。","area":"左營區・高雄市"},{"id":5953,"name":"清水宮","lat":22.68408,"lng":120.29963,"cat":"worship","desc":"這座廟裡有用陶瓷杯器組合而成的工藝作品。細看時，可以留意個別杯器如何拼成整件作品的模樣。","area":"左營區・高雄市"},{"id":5954,"name":"翠華路自行車天橋","lat":22.6796,"lng":120.29876,"cat":"other","desc":"自行車和行人從橋上越過翠華路，這裡是高雄第一座自行車空中走廊。入夜後從橋頂往下望，來往車流也成了攝影人拍攝光軌的題材。","area":"左營區・高雄市"},{"id":5955,"name":"見城之道","lat":22.67694,"lng":120.29142,"cat":"other","desc":"左營舊城原是土城，一八二六年重建為石城，今天還留著北門、東門和南門。見城步道把重現的城跡串起來，也能看見數百公尺的老城牆。","area":"左營區・高雄市"},{"id":5956,"name":"鐵路地下化綠園道(綠園道彩繪)","lat":22.67396,"lng":120.29357,"cat":"culture","desc":"以前的鐵道把高雄市區分成東西兩側，鐵路移到地下後，地面騰出了一條長廊。規劃成綠園道的路段，從左營一路延伸到鳳山。","area":"左營區・高雄市"},{"id":5957,"name":"雙層巴士","lat":22.68744,"lng":120.3074,"cat":"other","desc":"高雄的開頂雙層巴士最早採用大紅色車身，除了開頂座位，也有冷氣區和半開放的沙發區。從上層抬頭，少了車頂遮擋，港都街景就在眼前。","area":"左營區・高雄市"},{"id":5958,"name":"高鐵左營站","lat":22.68713,"lng":120.30765,"cat":"other","desc":"這是一座把高鐵、臺鐵和高雄捷運放在同一處的共構車站。當地說的「四鐵」還算進了公共鐵馬，也就是自行車。","area":"左營區・高雄市"},{"id":5959,"name":"高雄巨蛋","lat":22.66915,"lng":120.30142,"cat":"other","desc":"圓形屋身用大跨度鋼骨撐起，二〇〇八年完工後成了北高雄的地標。館內空間挑高四十二公尺，可容納一萬五千名觀眾。","area":"左營區・高雄市"},{"id":5960,"name":"鳳山縣舊城","lat":22.675065,"lng":120.290546,"cat":"history","tag":"古蹟","desc":"舊城的城牆以咾咕石從下往上疊砌，底層石塊大，越往上用得越小。城門內外各鑲一塊方形花崗石門額，上面的字與邊框都是陰刻。","area":"左營區・高雄市","ph":"文"},{"id":5961,"name":"鳳山舊城孔子廟崇聖祠","lat":22.683792,"lng":120.292511,"cat":"worship","tag":"古蹟","desc":"祠裡的木屋架與珠形柱礎，留著清康熙年間的建築風格。祠後的碑林收集附近原本散置的十方石碑，其中一方刻著文武官員到此下馬的諭示。","area":"左營區・高雄市","ph":"文"},{"id":5962,"name":"南寮漁港","lat":22.76236,"lng":120.23341,"cat":"other","desc":"彌陀這處漁港以近海作業為主，漁民多半下午出海，隔天清早帶著漁獲回來。船隻靠岸賣魚時，正是港邊最忙碌的時候。","area":"彌陀區・高雄市"},{"id":5963,"name":"漯底山自然公園","lat":22.77096,"lng":120.25311,"cat":"nature","desc":"彌陀這片靠海的惡地由泥岩構成，土層容易被雨水沖走，植物也不容易立足。裸露的稜線和峽谷，就是這樣慢慢形成的景色。","area":"彌陀區・高雄市"},{"id":5964,"name":"漯底社區發展協會 - 斗笠歷史","lat":22.76704,"lng":120.24353,"cat":"other","desc":"彌陀做斗笠已有百年歷史，最早是為了遮陽、避雨。看社區媽媽們一邊做一邊聊家常，才知道一頂看似簡單的斗笠，製作過程其實很繁複。","area":"彌陀區・高雄市"},{"id":5965,"name":"光之穹頂-O5R10美麗島捷運站","lat":22.63151,"lng":120.30132,"cat":"culture","desc":"車站的四座玻璃帷幕鋼構出自日本建築師高松伸，造型取意「祈禱」。這裡也是美麗島事件的發生地，車站設計因而
