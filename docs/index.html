g":120.4485,"cat":"worship","desc":"東港三大宮廟之一的東隆宮奉祀溫王爺，是在地居民寄託信仰的地方。王爺也稱千歲，地方相傳祂與唐代護駕有功、後來遇難殉海的溫鴻有關。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1731,"name":"海上教堂","lat":22.44942,"lng":120.4767,"cat":"worship","desc":"大鵬灣內的鵝黃色教堂坐落海堤一端，走過海堤便能近看水上建築。挑高玻璃窗映著海面，內部採粉色調，旁邊還有愛心鎖牆與幸福鐘。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1732,"name":"潟湖","lat":22.44824,"lng":120.4737,"cat":"other","desc":"東港溪與林邊溪帶來的泥沙，受到海潮和季風搬運，在外海逐漸堆成屏障。大鵬灣因此圍出一片只以單一潮口通海的囊狀潟湖，水深約二至六公尺。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1733,"name":"潮口平台","lat":22.45192,"lng":120.4585,"cat":"other","desc":"大鵬灣的公二平台靠近紅樹林探索水域，是從水上接近濕地景觀的起點。獨木舟、立式划槳和拖曳浮胎等活動，都利用這片潟湖裡寬廣的水面。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1734,"name":"濱灣碼頭","lat":22.43793,"lng":120.4744,"cat":"other","desc":"潟湖邊的帆船基地可見帆船、獨木舟和快艇，也讓人從岸上觀察灣內的水上活動。沿著碼頭闢出的人工沙灘約有兩百公尺，為灣岸添了一段細沙景觀。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1735,"name":"王船文化館","lat":22.46364,"lng":120.4601,"cat":"culture","desc":"東港以三年一科的迎王祭典聞名，館內從海洋信仰到打造王船，分題介紹地方習俗。造船用的樣板與七角頭轎班的傳承，讓人看懂一次迎王背後要多少人共同準備。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1736,"name":"紅樹林濕地公園","lat":22.45213,"lng":120.4563,"cat":"nature","desc":"大鵬灣西側的濕地主要用來復育紅樹林，也讓周邊社區和養殖場的排水在此淨化。水流循重力進入濕地，紅樹林在其中生長，兼有生態棲地與改善水質的作用。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1737,"name":"落日灣","lat":22.44443,"lng":120.4855,"cat":"scenic","desc":"大鵬灣周圍的養殖人家，早年各自鋪設取水管，許多管線交錯穿過地面。後來整合為共用取水池，原來忙著引水的岸邊，也多出一處讓人停留的地方。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1738,"name":"雲光島","lat":22.44558,"lng":120.4577,"cat":"other","desc":"大鵬灣的公共藝術從東港三年一科的迎王平安祭典得到靈感，把為家鄉祈福的心意編成故事。島上的童趣角色將地方信仰化為可見的形象，也寄託對環境未來的祝福。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1739,"name":"青洲灣","lat":22.44716,"lng":120.4557,"cat":"scenic","desc":"大鵬灣出海口的沙灘背靠潟湖，面向臺灣海峽和小琉球。沿觀海棧道可看見綿延沙岸、草木與海面，一次望到灣內、灣外兩種水岸風景。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1740,"name":"鵬灣跨海大橋","lat":22.4492,"lng":120.4548,"cat":"other","desc":"青洲旁的大橋跨在大鵬灣出海口，二〇一一年完工。為了讓帆船通過，橋面設計成可以開啟，灣內的水上活動也成了這座景觀橋造型的由來。","area":"東港鎮・屏東縣","ph":"觀"},{"id":1741,"name":"枋寮支廳舍","lat":22.366741,"lng":120.593476,"cat":"history","tag":"歷史建築","desc":"枋寮中興路上的日治時期廳舍，於一九一二年興建，用來辦理地方警務。房舍也安排職員住宿，讓這處老建物同時記錄警察辦公和起居的歷史。","area":"枋寮鄉・屏東縣","ph":"文"},{"id":1742,"name":"枋寮演武場","lat":22.36619,"lng":120.59307,"cat":"history","tag":"歷史建築","desc":"枋寮過去是通往東部的重要節點，日治時期在此設置武德殿供警察練習武術。演武場於一九三七年落成，柔道、劍道等訓練都曾在這裡進行。","area":"枋寮鄉・屏東縣","ph":"文"},{"id":1743,"name":"枋寮石頭營二戰日軍要塞","lat":22.421564,"lng":120.624009,"cat":"history","tag":"歷史建築","desc":"石頭營留有二戰末期日軍臨時興築的一組軍事設施，當年是為了因應可能的登陸戰。碉堡、舊指揮空間與坑道一同保存，記錄屏東沿海的戰時歷史。","area":"枋寮鄉・屏東縣","ph":"文"},{"id":1744,"name":"石頭營聖蹟亭","lat":22.425111,"lng":120.618506,"cat":"history","tag":"古蹟","desc":"枋寮玉泉村的路口，保留一座清光緒年間興建的惜字亭。早年居民將寫過字的紙或書籍集中在此焚化，透過處理字紙的方式，表達對文字和讀書人的敬意。","area":"枋寮鄉・屏東縣","ph":"文"},{"id":1745,"name":"林邊水源地水塔","lat":22.43825,"lng":120.522306,"cat":"history","tag":"歷史建築","desc":"林邊水源地的高壓水塔建於一九三八年，屬東港水道的一部分。它原以重力把水送到用戶端，附近與氣曝池、慢濾池及機房共同構成早年的供水系統。","area":"林邊鄉・屏東縣","ph":"文"},{"id":1746,"name":"林邊阮氏宅第及花園","lat":22.46276,"lng":120.530335,"cat":"nature","tag":"歷史建築","desc":"林邊阮家洋樓與花園相伴，據載由任職高雄州土木課的家族成員阮朝昂設計督造。花園曾租予紅十字會，作為來臺醫師提供原住民族醫療服務的場所。","area":"林邊鄉・屏東縣","ph":"文"},{"id":1747,"name":"鄭家古厝","lat":22.435778,"lng":120.516306,"cat":"history","tag":"歷史建築","desc":"林邊鄭家宅院由鄭德生分家經商後興建，年代可追溯到一八九九年。護龍山牆留有泥塑馬背與拱形窗，彩繪磁磚穿插在紅磚、紅瓦和洗石子之間。","area":"林邊鄉・屏東縣","ph":"文"},{"id":1748,"name":"恆春國語傳習所豬朥束分教場之跡紀念碑","lat":22.012711,"lng":120.840567,"cat":"history","tag":"歷史建築","desc":"紀念碑所在的是滿州公學校舊址，日治初期曾在豬朥束社設立教授日語的分教場。碑名裡的「國語」指當時的日語，留下殖民時期原住民族教育的一段歷史。","area":"滿州鄉・屏東縣","ph":"文"},{"id":1749,"name":"滿州鄉敬聖亭","lat":22.012333,"lng":120.837389,"cat":"history","tag":"歷史建築","desc":"滿州的敬聖亭也是惜字亭，專為焚化棄用的字紙與書籍而設。早年人們先仔細收集、整理，再挑日子上香焚紙，向先賢致意，也寄託子孫讀書有成的期盼。","area":"滿州鄉・屏東縣","ph":"文"},{"id":1750,"name":"朝林宮","lat":22.545561,"lng":120.568448,"cat":"worship","tag":"古蹟","desc":"地方相傳廟宇源於清代陳氏開墾後，確切創建年代尚待考證。前殿留有獅頭剪黏，後殿屋脊的雙龍中間夾的是葫蘆，兩旁院門上還能找到水果和海鮮造型的交趾陶。","area":"潮州鎮・屏東縣","ph":"文"},{"id":1751,"name":"林後四林平地森林園區","lat":22.538689,"lng":120.590406,"cat":"nature","desc":"潮州的平地造林區把森林遊憩和環境教育放在一起。園內採低密度的綠建築設計，讓人能在林間認識造林與生態的關係。","area":"潮州鎮・屏東縣","ph":"觀"},{"id":1752,"name":"舊潮州郵局","lat":22.550417,"lng":120.542944,"cat":"history","tag":"歷史建築","desc":"建基路上的舊郵局原是日治時期的潮州庄役場。這座官署建於一九二六年，當年處理潮州、四林等六庄的地方事務。","area":"潮州鎮・屏東縣","ph":"文"},{"id":1753,"name":"南排灣的紅寶石-高士佛社","lat":22.1222,"lng":120.83769,"cat":"history","desc":"中央山脈南端的高士部落是排灣族聚落，山上的白色鳥居和神社朝向太平洋。這片山海也是理解八瑤灣事件與牡丹社事件的地方。","area":"牡丹鄉・屏東縣","ph":"觀"},{"id":1754,"name":"雙流自然教育中心","lat":22.217531,"lng":120.799387,"cat":"scenic","desc":"內文溪穿過中央山脈與恆春半島之間的山區，沿溪可觀察瀑布和季風林。自然教育中心所在的森林，也保有排灣族聚落的痕跡。","area":"獅子鄉・屏東縣","ph":"觀"},{"id":1755,"name":"三隆宮","lat":22.34675,"lng":120.3767,"cat":"worship","desc":"小琉球人俗稱這裡為王爺廟，供奉的三位王爺合稱三府千歲。每逢三年一科的平安祭典，在外的鄉親和漁船都會回島參與。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1756,"name":"厚石裙礁","lat":22.32275,"lng":120.3612,"cat":"scenic","desc":"小琉球東南岸的裙礁散布著形狀各異的巨石。有的頂上長滿草木，遠看像人頭，也有礁石面朝大海，輪廓宛如端坐的觀音。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1757,"name":"多仔坪潮間帶","lat":22.34978,"lng":120.3653,"cat":"scenic","desc":"小琉球的礁岸隨潮水漲退變換樣貌，白天和入夜各有景致。遇上夜間退潮，可以望見月下的珊瑚礁岩剪影，聽海水在礁間流動。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1758,"name":"大寮(大福)漁港","lat":22.33444,"lng":120.374,"cat":"other","desc":"大福村東岸的漁港最初是為分擔白沙港的船運而開闢。港內也讓漁船得以休息避風，減少漁筏與大型漁船爭用泊位的情形。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1759,"name":"山豬溝","lat":22.33845,"lng":120.3625,"cat":"scenic","desc":"一段山豬精偷走仙女彩衣的傳說，為這條山溝留下名字。木棧道順著珊瑚礁地形起伏，沿途有解說牌和景觀台。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1760,"name":"琉球嶼燈塔","lat":22.32886,"lng":120.36647,"cat":"history","tag":"古蹟","desc":"小琉球南側的山頂上立著一座白色燈塔，地方也叫它白燈樓。塔身建於一九二九年，所在的高地俯臨厚石裙礁，為海上船隻指引方向。","area":"琉球鄉・屏東縣","ph":"文"},{"id":1761,"name":"琉球管理站暨遊客中心","lat":22.35421,"lng":120.3811,"cat":"other","desc":"白沙觀光港旁的遊客中心順著山坡興建，從正門走進去已是二樓。室內設有小琉球旅遊導覽，戶外平台則可望向海面。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1762,"name":"琉行之道","lat":22.34417,"lng":120.3622,"cat":"other","desc":"沿海步道穿過樹林，把舊砲陣地、漁港和太子爺廟附近的海景串在一起。衫福漁港一帶可見公共藝術「看海不是海」。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1763,"name":"白沙觀光港","lat":22.35312,"lng":120.3831,"cat":"other","desc":"小琉球迎接旅人的主要港口緊鄰中澳沙灘，一邊是客船進出的港區，一邊是海灣。夏夜抬頭可望星空，也能看見對岸的燈光。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1764,"name":"碧雲寺","lat":22.33814,"lng":120.3699,"cat":"worship","desc":"島嶼中央的古寺主祀觀音菩薩，從清代起便是小琉球居民的信仰重心。從婚嫁、彌月到漁船出海，島民都會到廟裡祈願。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1765,"name":"美人洞","lat":22.35379,"lng":120.3732,"cat":"scenic","desc":"小琉球東北角的珊瑚礁岩形成天然洞穴，背靠山坡、面向海浪。春夏可在枝葉間找葉蟬，也能留意礁岩旁活動的寄居蟹與紫地蟹。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1766,"name":"花瓶岩","lat":22.35566,"lng":120.3808,"cat":"scenic","desc":"小琉球海邊這座頭寬腳細的礁岩，原是隆起後受海浪侵蝕的珊瑚礁。頂上長出的草木像瓶裡插了花，也讓它成為船隻往來時醒目的地標。","area":"琉球鄉・屏東縣","ph":"觀"},{"id":1767,"name":"北葉觀景台","lat":22.70552,"lng":120.64548,"cat":"other","desc":"北葉國小的粉紅色校舍裡，設有一處向外眺望的北葉驛站。站在校園內的觀景台，可以看見隘寮溪和遠處展開的平原。","area":"瑪家鄉・屏東縣","ph":"觀"},{"id":1768,"name":"禮納里lnl原創空間","lat":22.6995,"lng":120.6438,"cat":"culture","desc":"禮納里災後重建時成立的四大工坊，後來合併為部落的原創空間。居民在這裡展示手工藝，也透過展覽和工作坊講述原鄉的生活。","area":"瑪家鄉・屏東縣","ph":"觀"},{"id":1769,"name":"禮納里遊客中心","lat":22.69966,"lng":120.64433,"cat":"other","desc":"走進禮納里永久屋聚落，山林間的遊客中心延續部落木構建築的線條。中心提供地方旅遊資訊，也讓訪客有機會認識族人的原鄉文化。","area":"瑪家鄉・屏東縣","ph":"觀"},{"id":1770,"name":"臺灣原住民族文化園區","lat":22.70693,"lng":120.65292,"cat":"culture","desc":"瑪家鄉北葉村的戶外博物館以臺灣原住民族文化的展示與保存為主。園區前身是瑪家山地文化村，周邊至今仍有排灣族與魯凱族聚落。","area":"瑪家鄉・屏東縣","ph":"觀"},{"id":1771,"name":"竹田車站","lat":22.5865,"lng":120.539944,"cat":"history","tag":"歷史建築","desc":"原名頓物驛的竹田車站，最初是潮州線上的簡易停靠站。隨客貨運量增加而擴建的木造站房，和月台、員工宿舍共同保存了鐵路工作的空間。","area":"竹田鄉・屏東縣","ph":"文"},{"id":1772,"name":"舊達達港糶糴村敬字亭","lat":22.57782,"lng":120.532602,"cat":"history","tag":"歷史建築","desc":"糶糴村的敬字亭與當地水利設施有段淵源。耆老記得它約與制水門同時出現，一九三三年出版的地方圖像也已拍到亭身。","area":"竹田鄉・屏東縣","ph":"文"},{"id":1773,"name":"舊達達港糶糴村糧埤伯公","lat":22.577833,"lng":120.532611,"cat":"history","tag":"歷史建築","desc":"糶糴村早年以河石奉祀伯公，後由村民募款改建。今天可見伯公碑石、龜背形護牆與後方的階梯，看得出村人歷次奉獻的痕跡。","area":"竹田鄉・屏東縣","ph":"文"},{"id":1774,"name":"萬泉寺","lat":22.580222,"lng":120.485333,"cat":"worship","tag":"歷史建築","desc":"萬丹人也稱這座清代廟宇為上帝廟，乾隆年間由地方人士募建。當時有來自福州與南靖的信眾捐出店屋，以租金支應寺中僧侶禮佛。","area":"萬丹鄉・屏東縣","ph":"文"},{"id":1775,"name":"五溝水劉氏宗祠","lat":22.59166,"lng":120.595146,"cat":"worship","tag":"古蹟","desc":"五溝水劉家先祖從廣東嘉應州渡海，在萬巒落腳開墾。隨著族人繁衍，各房於清同治年間共同建祠，留下聚族祭祖的空間。","area":"萬巒鄉・屏東縣","ph":"文"},{"id":1776,"name":"萬巒分駐所","lat":22.573625,"lng":120.569104,"cat":"history","tag":"歷史建築","desc":"萬巒在日治初期便設有警察機構，除了維持治安，也曾經辦理戶口事務。分駐所後來一度與戶政單位共用，記錄地方行政的變遷。","area":"萬巒鄉・屏東縣","ph":"文"},{"id":1777,"name":"萬巒成德京兆堂宋氏宗祠","lat":22.60555,"lng":120.60547,"cat":"worship","tag":"歷史建築","desc":"成德村的宋氏宗祠約建於清光緒初年，堂號為京兆堂。宋家將從廣東梅縣渡海、落腳萬巒的相南公尊為來臺祖。","area":"萬巒鄉・屏東縣","ph":"文"},{"id":1778,"name":"萬金天主教堂(萬金聖母聖殿)","lat":22.595053,"lng":120.611085,"cat":"worship","tag":"古蹟","desc":"萬金的天主教堂以兩座角塔夾著中央山牆，牆上可見皇冠與道明會會徽。大門上方的「天主堂」和「奉旨」石額，則留下清代的印記。","area":"萬巒鄉・屏東縣","ph":"文"},{"id":1779,"name":"忠魂碑","lat":22.103694,"lng":120.762889,"cat":"history","tag":"歷史建築","desc":"石門一帶曾是牡丹社事件的交戰地，日治時期在山坡立碑紀念日方死者。混凝土基座外有矮牆環繞，表面可見長年風化的痕跡。","area":"車城鄉・屏東縣","ph":"文"},{"id":1780,"name":"明治七年討蕃軍本營地紀念碑及石垣","lat":22.046556,"lng":120.699778,"cat":"history","tag":"歷史建築","desc":"車城龜山曾是牡丹社事件中日軍登陸的地方，原碑在清代拆除，日治時期重立。今日石碑立在混凝土基座上，背面仍留有改修刻字。","area":"車城鄉・屏東縣","ph":"文"},{"id":1781,"name":"西鄉都督遺績記念碑","lat":22.103694,"lng":120.762889,"cat":"history","tag":"歷史建築","desc":"石門的紀念碑建於日治時期，與西鄉從道率軍攻打牡丹社的歷史有關。碑文戰後曾改題「澄清海宇還我河山」，後來才恢復舊題。","area":"車城鄉・屏東縣","ph":"文"},{"id":1782,"name":"里港蔡家古厝","lat":22.776278,"lng":120.494222,"cat":"history","tag":"歷史建築","desc":"蔡家在里港留下的紅瓦宅第，可從正身兩側細看工藝。拱門上各有一隻泥塑白兔，左右牆上的交趾陶分別取材自《三國演義》與《封神榜》。","area":"里港鄉・屏東縣","ph":"文"},{"id":1783,"name":"里港鄉敬聖亭","lat":22.780435,"lng":120.494409,"cat":"history","tag":"歷史建築","desc":"里港國小校內保留了一座專門焚化字紙的敬字亭。亭子承載惜字敬聖的觀念，昔日有字的廢紙會集中投入亭中焚化。","area":"里港鄉・屏東縣","ph":"文"},{"id":1784,"name":"屏東縣霧台鄉好茶舊社","lat":22.698333,"lng":120.733055,"cat":"history","tag":"文化景觀","desc":"霧台山西側、南隘寮溪北岸的坡地，是西魯凱族好茶舊社的所在。聚落傍陡坡而建，族人代代傳承山林狩獵、耕作與祖靈祭儀。","area":"霧台鄉・屏東縣","ph":"文"},{"id":1785,"name":"魯凱族好茶舊社","lat":22.699352,"lng":120.736391,"cat":"history","tag":"古蹟","desc":"南隘寮溪北側的魯凱族舊聚落，族名音譯為古茶布安。十七世紀荷蘭文書已記下它的舊稱，清代地方文獻也留下好茶社的紀錄。","area":"霧台鄉・屏東縣","ph":"文"},{"id":1786,"name":"岩板巷","lat":22.74538,"lng":120.73068,"cat":"structure","desc":"霧台部落裡，石板鋪成的小巷沿著百步蛇行進般的線條蜿蜒。路旁以陶壺裝飾，百合、百步蛇和雲豹三種圖騰則化成引路的標記。","area":"霧臺鄉・屏東縣","ph":"觀"},{"id":1787,"name":"杜巴男紀念館","lat":22.74549,"lng":120.73077,"cat":"culture","desc":"霧台岩板巷裡有一處收藏魯凱族木雕藝術家杜巴男作品的空間。部落中許多雕刻圖騰出自他手，館舍由兒子接續照料。","area":"霧臺鄉・屏東縣","ph":"觀"},{"id":1788,"name":"神山瀑布","lat":22.75482,"lng":120.73061,"cat":"scenic","area":"霧臺鄉・屏東縣","ph":"觀"},{"id":1789,"name":"耶穌聖心堂","lat":22.74949,"lng":120.72963,"cat":"worship","desc":"神山部落的天主堂用當地石板建成，教堂內的人形座椅由族人親手雕刻。所有人像一致望向太陽升起的方向，寄託著希望。","area":"霧臺鄉・屏東縣","ph":"觀"},{"id":1790,"name":"霧台基督教長老教會","lat":22.74441,"lng":120.73109,"cat":"worship","desc":"這座霧台教會坐落在山林雲霧之中，外形像一座小城堡。藝術家杜巴男與村民就地取材，以手工完成檜木十字架和石板雕刻。","area":"霧臺鄉・屏東縣","ph":"觀"},{"id":1791,"name":"魯凱族文物館","lat":22.74467,"lng":120.73165,"cat":"culture","desc":"霧台村的三層樓文物館專門蒐集魯凱族的傳統文物。館內以族人的生活為展示主題，讓人從實物認識魯凱文化的不同面貌。","area":"霧臺鄉・屏東縣","ph":"觀"},{"id":1792,"name":"大津瀑布","lat":22.86207,"lng":120.63663,"cat":"scenic","desc":"又稱尾寮瀑布或阿烏瀑布的這道山中瀑布，水流分成五層。一般人熟悉的是下方兩層，較高處的岩石和深潭則保留了險峻地貌。","area":"高樹鄉・屏東縣","ph":"觀"},{"id":1793,"name":"大路關石獅公","lat":22.76061,"lng":120.61435,"cat":"history","desc":"舊稱大路關的廣福村供奉三座石獅，各有不同姿態。當地流傳先民為祈求庄頭平安而造獅的故事，其中一座曾被山洪帶來的泥沙掩埋。","area":"高樹鄉・屏東縣","ph":"觀"},{"id":1794,"name":"鍾理和故居","lat":22.74396,"lng":120.6187,"cat":"culture","desc":"廣興村保存了臺灣鄉土文學作家鍾理和的故居。從作品、日記、雜記到曾經使用的生活物品，都能作為認識作家日常的線索。","area":"高樹鄉・屏東縣","ph":"觀"},{"id":1795,"name":"高樹榕樘福德祠","lat":22.824111,"lng":120.585917,"cat":"worship","tag":"歷史建築","desc":"客家人稱土地公為伯公，東振村這座福德祠也叫東振開庄伯公。當地舊稱老庄，伯公信仰與先民躲避洪水、遷居開庄的傳說相連。","area":"高樹鄉・屏東縣","ph":"文"},{"id":1796,"name":"鹽埔庄役場","lat":22.757814,"lng":120.576827,"cat":"history","tag":"歷史建築","desc":"日治時期的鹽埔區曾管轄鹽埔、新圍、彭厝和大路關。地方於一九一三年興建庄役場作為辦公廳舍，留下早年地方行政的印記。","area":"鹽埔鄉・屏東縣","ph":"文"},{"id":1797,"name":"麟洛庄尾伯公","lat":22.649417,"lng":120.525631,"cat":"worship","tag":"歷史建築","desc":"麟洛早年的聚落分為麟頂、麟蹄、麟趾，位於庄尾的麟趾村奉有這座伯公。它又名柵背伯公，坐落在中正路兩戶民宅之間。","area":"麟洛鄉・屏東縣","ph":"文"},{"id":1798,"name":"二林仁和宮","lat":23.899134,"lng":120.367981,"cat":"worship","tag":"古蹟","desc":"清代位在二林街中心的媽祖廟，主祀天上聖母。地方相傳先民曾從福建湄洲請媽祖護船渡海，上岸後建廟供奉，留下沿襲至今的信仰。","area":"二林鎮・彰化縣","ph":"文"},{"id":1799,"name":"二林蔗農事件紀念館","lat":23.89966,"lng":120.3716,"cat":"culture","desc":"紀念館所在的二林公學校宿舍群，原是日治時期教職員的住處。木造雨淋板牆、日式黑瓦與架高的地板，保留早年教師住家的樣貌。","area":"二林鎮・彰化縣","ph":"觀"},{"id":1800,"name":"台灣酒窖","lat":23.90013,"lng":120.4257,"cat":"other","desc":"二林的酒窖把各家酒莊出品的酒款集中陳列在室內展示區。除了觀看不同酒莊的作品，場內也另設有專門的品酒空間。","area":"二林鎮・彰化縣","ph":"觀"},{"id":1801,"name":"彰化木棉花季","lat":23.92437,"lng":120.4292,"cat":"scenic","desc":"東螺溪畔的木棉樹連成一條花道，從埤頭延伸到二林。三月開花時，橘紅枝頭一側映著新綠水田，另一側的花影則落進溪水。","area":"二林鎮・彰化縣","ph":"觀"},{"id":1802,"name":"二八水水公園","lat":23.8145,"lng":120.6162,"cat":"nature","desc":"緊鄰集集線的公園沿用二水舊地名「二八水」。園中並排展示臺鐵的蒸汽火車與比利時製造的台糖機車，一大一小，各有來歷。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1803,"name":"二水八堡圳公園","lat":23.79904,"lng":120.645,"cat":"nature","desc":"八堡圳排水門對面的小公園裡，有件宋璽德創作的雕塑。作品名為「上善若水」，將二水地方熟悉的水車形象帶進遊憩空間。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1804,"name":"二水碧雲禪寺","lat":23.814108,"lng":120.625203,"cat":"worship","tag":"歷史建築","desc":"八卦山脈蓬萊山腰的佛寺前有水、後有山，是俗稱「巖仔」的山中寺院。寺方記載，當地信眾因流傳觀音顯靈的故事而發起建寺。","area":"二水鄉・彰化縣","ph":"文"},{"id":1805,"name":"二水老街","lat":23.81172,"lng":120.6164,"cat":"structure","desc":"從二水車站前的光文路，到相接的員集路沿線，都是二水老街的範圍。街邊可以細看紅磚洋樓，也聚集著不少在地小吃。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1806,"name":"二水花旗木","lat":23.8005,"lng":120.655,"cat":"scenic","desc":"源泉段自行車道緊貼集集線，沿線的花旗木有「桃花陣雨樹」之稱。粉白花瓣配上桃紅花萼，映著小火車轉過彎道時尤其醒目。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1807,"name":"二水車站（原二水驛）","lat":23.81315,"lng":120.618115,"cat":"history","tag":"古蹟","desc":"縱貫鐵路全線通車時，二水已設有名為「二八水驛」的停靠站。開站之初僅有一座月臺，日後隨鐵路發展逐步擴建。","area":"二水鄉・彰化縣","ph":"文"},{"id":1808,"name":"二水鄉泰山體驗營","lat":23.80295,"lng":120.6454,"cat":"other","desc":"二水國中的戶外體驗場把攀岩和探索教育結合在一起。從抱石場、巨人梯到高空獨木橋，各種設施讓人用不同方式挑戰平衡與協作。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1809,"name":"二水鼻仔頭鄭氏古厝","lat":23.797948,"lng":120.641015,"cat":"history","tag":"歷史建築","desc":"頂厝子聚落裡的這戶古宅，是鼻仔頭鄭姓家族其中一支的居所。老宅左鄰鄭氏祖厝，兩處宅第的興建都與地方水圳息息相關。","area":"二水鄉・彰化縣","ph":"文"},{"id":1810,"name":"八堡圳公園","lat":23.80136,"lng":120.65938,"cat":"nature","desc":"站在公園水門旁，可以看見濁水溪的水怎麼引進八堡圳。大雨過後，奔流湧入水門再轉入圳道，水勢和轟鳴聲格外鮮明。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1811,"name":"八堡圳取水口","lat":23.800043,"lng":120.657518,"cat":"history","tag":"歷史建築","desc":"二水的濁水溪畔是八堡圳的水源起點。溪水從此引入一圳、二圳，沿著分支與小溝向西北流去，織成灌溉彰化平原的水網。","area":"二水鄉・彰化縣","ph":"文"},{"id":1812,"name":"八堡圳頭文化創生行動基地","lat":23.79991,"lng":120.64486,"cat":"other","desc":"源泉村舊稱鼻仔頭，名字來自八卦山麓形似龍頭的山峰。八堡圳在此取水，社區也傳承製作籠仔篙、導引濁水溪水流的技藝。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1813,"name":"林先生廟","lat":23.7992,"lng":120.6449,"cat":"worship","desc":"清代八堡圳開成後，水勢多變的濁水溪仍難以引入圳道。地方相傳一位林先生指點取水方法，這座廟便與那段水利故事相連。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1814,"name":"源泉文具行-源泉故事屋","lat":23.79946,"lng":120.6441,"cat":"other","desc":"昔日源泉文具店由社區重新整理，門前仍掛著當年的舊招牌。裡頭改作故事屋，展示地方農產與文創作品，也讓居民在此舉辦活動。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1815,"name":"源泉車站","lat":23.79844,"lng":120.642,"cat":"other","desc":"集集線上的源泉小站位處彰化縣南端，九二一地震後有了新的候車空間。洗石子外牆配上紅色候車室，襯出鐵道村落的安靜景色。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1816,"name":"豐柏廣場","lat":23.82316,"lng":120.61967,"cat":"nature","desc":"二水山邊的休憩廣場設有舞臺、石桌與兒童遊樂設施。周圍連著坑內坑等步道，林間可望觀察鳥類、蝴蝶與野生獼猴。","area":"二水鄉・彰化縣","ph":"觀"},{"id":1817,"name":"伸港蚵仔寮觀夕親水趣","lat":24.14516,"lng":120.4689,"cat":"other","desc":"伸港田尾排水出海口有一片平坦開闊的灘地，地方稱為蚵仔寮。退潮後可以靜靜看招潮蟹成群活動，灘上也棲息著各種貝類。","area":"伸港鄉・彰化縣","ph":"觀"},{"id":1818,"name":"張玉姑廟","lat":24.16538,"lng":120.5135,"cat":"worship","desc":"靠近大肚溪口的伸慶宮，地方習稱張玉姑廟。廟旁保安林和泥灘地曾是鷺鷥與雁鴨棲地，賞鳥平台上也可眺望河口夕照。","area":"伸港鄉・彰化縣","ph":"觀"},{"id":1819,"name":"彰化縣自然生態教育中心 (白色海豚屋)","lat":24.15791,"lng":120.4564,"cat":"scenic","desc":"慶安水道旁的白色建築外形像躍出水面的海豚，呼應附近西海岸的白海豚棲地。從草坡望去，水面、白色風機與館舍連成一景。","area":"伸港鄉・彰化縣","ph":"觀"},{"id":1820,"name":"北斗保甲事務所","lat":23.874321,"lng":120.52458,"cat":"history","tag":"古蹟","desc":"北斗這座建於一九三六年的辦公廳舍，保存了日治時期保甲制度的痕跡。留意磚砌牆腳，可見弧拱形通氣孔與鐵柵，供架高地板通風防潮。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1821,"name":"北斗大眾爺廟","lat":23.872454,"lng":120.520935,"cat":"worship","tag":"歷史建築","desc":"北斗西德街的大眾爺廟又叫萬善祠，廟地一帶原有多座無緣塚。北勢寮居民將遺骨集中安葬後，逐漸形成共同祭祀的地方。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1822,"name":"北斗奠安宮","lat":23.87237,"lng":120.5254,"cat":"worship","desc":"北斗的媽祖信仰承自清代東螺街天后宮。舊街因水患與戰禍毀壞，居民遷往寶斗重建廟宇，以「奠安」寄託安居的心願。","area":"北斗鎮・彰化縣","ph":"觀"},{"id":1823,"name":"北斗富美舘","lat":23.874056,"lng":120.524319,"cat":"worship","tag":"歷史建築","desc":"北斗這座小廟創建於清光緒年間，後來遷至光復路。格扇與門楣的彩繪值得細看，門上是尉遲恭、秦叔寶，門楣則繪有八仙。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1824,"name":"北斗普度公壇","lat":23.870512,"lng":120.524899,"cat":"worship","tag":"歷史建築","desc":"北斗南側舊稱三角湧，居民相傳因溪流氾濫與械鬥傷亡，在此興壇祭祀無主孤魂。壇前一株老榕也是地方重視的老樹。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1825,"name":"北斗紅磚市場","lat":23.871829,"lng":120.526323,"cat":"history","tag":"歷史建築","desc":"北斗昔日最熱鬧的零售市場建於一九三五年。二〇〇三年的火災燒去屋頂與室內裝修，倖存的紅磚外牆成為地方爭取保存的市場記憶。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1826,"name":"北斗老街","lat":23.8749,"lng":120.5242,"cat":"structure","desc":"刻著「寶斗大街」的牌樓標出老街入口，街區以奠安宮為中心展開。沿斗苑路和宮前街散步，可從巴洛克式街屋看見昔日北斗的繁華。","area":"北斗鎮・彰化縣","ph":"觀"},{"id":1827,"name":"北斗郡守官舍","lat":23.875779,"lng":120.524807,"cat":"history","tag":"歷史建築","desc":"日治時期的北斗郡設有郡守官舍，地點在今天地政二巷。從當時的市區計畫與工商地圖對照，最晚在一九三七年已能找到它的身影。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1828,"name":"北斗開基祖廟福德祠","lat":23.87214,"lng":120.523286,"cat":"worship","tag":"歷史建築","desc":"福安巷裡的福德祠主祀土地公，是北斗街規模較大的土地公廟。地方相傳它創建於清康熙年間，與東螺舊街居民遷居北斗的歷史相連。","area":"北斗鎮・彰化縣","ph":"文"},{"id":1829,"name":"美人樹","lat":23.86836,"lng":120.5164,"cat":"scenic","desc":"沿著東螺溪蜿蜒的北斗河濱公園，栽有上百株美人樹。秋冬開花時，垂向溪岸的枝條綴滿粉紅花朵，橋邊水面也映出花影。","area":"北斗鎮・彰化縣","ph":"觀"},{"id":1830,"name":"卡里善之樹","lat":24.122,"lng":120.5186,"cat":"other","desc":"和美以製傘為主題的展館，講的是地方晴雨傘產業的故事。一把傘從裁剪布料、縫製到組裝，都得靠不同雙手在布面與金屬之間接力。","area":"和美鎮・彰化縣","ph":"觀"},{"id":1831,"name":"道東書院","lat":24.111258,"lng":120.493897,"cat":"history","tag":"古蹟","desc":"和美士紳在清咸豐年間募款、捐地，合力創辦這座書院。院名取「王道東來」之意，因祭祀朱子，地方人也習稱它為文祠。","area":"和美鎮・彰化縣","ph":"文"},{"id":1832,"name":"原臺中州員林郡青果同業組合檢查所","lat":23.961338,"lng":120.570415,"cat":"history","tag":"歷史建築","desc":"員林的青果檢查所見證日治時期中部香蕉外銷的產業。建築兼用磚與木材，保留編竹夾泥牆、舊式屋架，以及入口上方特殊的切角。","area":"員林市・彰化縣","ph":"文"},{"id":1833,"name":"員林市江九合濟陽堂","lat":23.95908,"lng":120.5847,"cat":"worship","desc":"這座江氏祠堂保有漳州平和客家圍屋格局，兩進正身與左右護龍圍合成院。正廳神龕是日治時期舊物，宅後還留著一口古井。","area":"員林市・彰化縣","ph":"觀"},{"id":1834,"name":"員林曹家開台祖塋","lat":23.960753,"lng":120.606762,"cat":"history","tag":"歷史建築","desc":"員林曹氏祖塋合葬曹媽何氏與曹朝宰，清乾隆年間已有安葬紀錄。墓園採「三山五埕一兜池」布局，在當時平民墓園中少見。","area":"員林市・彰化縣","ph":"文"},{"id":1835,"name":"員林江九合濟陽堂","lat":23.959337,"lng":120.584796,"cat":"worship","tag":"古蹟","desc":"員林三條里的濟陽堂屬江姓九合派下，先祖來自福建漳州平和。從堂號和族支沿革，可以認識員林各支江姓移民落腳的歷史。","area":"員林市・彰化縣","ph":"文"},{"id":1836,"name":"員林游氏宗祠","lat":23.972582,"lng":120.555428,"cat":"worship","tag":"歷史建築","desc":"大埔里的游氏宗祠是地方游姓族人祭祖之處，創建年代尚難確定。今日所見的宗祠格局，來自一九五六年的一次改建。","area":"員林市・彰化縣","ph":"文"},{"id":1837,"name":"員林神社遺跡","lat":23.948661,"lng":120.606379,"cat":"history","tag":"歷史建築","desc":"百果山風景區內仍留有員林神社的舊址。神社建於一九三一年，其興建與日本天皇登基紀念活動有關，如今本殿已經拆除。","area":"員林市・彰化縣","ph":"文"},{"id":1838,"name":"員林衡文宮","lat":23.95349,"lng":120.5777,"cat":"worship","desc":"近十層樓高的玄天上帝神像，是員林這座廟宇醒目的標誌。神像內部也設有神龕，其中一座的位置約在整尊神像心口。","area":"員林市・彰化縣","ph":"觀"},{"id":1839,"name":"員林車站│單車環市 樂活騎","lat":23.95931,"lng":120.5696,"cat":"other","desc":"高架化後的員林車站空間明亮，白色分叉立柱勾勒出醒目的站體輪廓。走出車站就是熱鬧街區，在地小吃與各式商家交錯其間。","area":"員林市・彰化縣","ph":"觀"},{"id":1840,"name":"湶洲寮卡達車休憩站","lat":23.94252,"lng":120.60823,"cat":"other","desc":"百果山遊憩區旁的湶洲寮，設有以自行車為主題的休憩園區。百果山周邊的自行車路線在此串聯，也讓單車旅人有個中途歇腳的地方。","area":"員林市・彰化縣","ph":"觀"},{"id":1841,"name":"琉璃仙境","lat":23.94183,"lng":120.5812,"cat":"other","desc":"員林這座休閒農場以婚紗外拍為主題，園內設有立體彩繪牆。證婚亭、紫色風車和大片白沙地，各自構成不同的攝影場景。","area":"員林市・彰化縣","ph":"觀"},{"id":1842,"name":"興賢書院","lat":23.958185,"lng":120.574617,"cat":"history","tag":"古蹟","desc":"員林的書院前身是供奉文昌帝君的文昌祠，清代曾有興賢社在此辦學。關於最早建祠的年份，地方留下了嘉慶與道光年間兩種說法。","area":"員林市・彰化縣","ph":"文"},{"id":1843,"name":"蜀葵花海","lat":23.959,"lng":120.5744,"cat":"scenic","desc":"彰化的春日花田裡，蜀葵以高大的花株贏得「花中巨人」的稱呼。田中窯和員林都有賞花地點，開花時節會隨氣候和花況變動。","area":"員林市・彰化縣","ph":"觀"},{"id":1844,"name":"埔心羅厝天主堂原教室（文物館）","lat":23.93788,"lng":120.513411,"cat":"worship","tag":"歷史建築","desc":"羅厝天主堂的舊教室如今是文物館，與清代羅厝居民邀請神父傳教的歷史相連。正面木門上方留有玻璃氣窗，窗扇則可上下推拉。","area":"埔心鄉・彰化縣","ph":"文"},{"id":1845,"name":"路葡萄酒莊-路葡萄隧道","lat":23.96549,"lng":120.5275,"cat":"other","desc":"果園以園主父親黃路之名命名，葡萄隧道原本是為了遮陽而架設。園中以蜜紅葡萄為主，成熟果實帶粉紅色澤，也是地方特色。","area":"埔心鄉・彰化縣","ph":"觀"},{"id":1846,"name":"北斗郡路口厝派出所","lat":23.846581,"lng":120.458825,"cat":"history","tag":"歷史建築","desc":"舊稱路口厝的聚落，因南北和東西向道路在此交會而形成。日治時期的北斗郡派出所便設在這裡，留下埤頭鄉村警政的歷史。","area":"埤頭鄉・彰化縣","ph":"文"},{"id":1847,"name":"怪獸百寶村-彰化百寶村","lat":23.89131,"lng":120.4634,"cat":"other","desc":"彰化百寶村是集中呈現地方特色產品的展示館。館舍源於縣府推動的地方創意產業計畫，以彰化在地產業與產品為主題。","area":"埤頭鄉・彰化縣","ph":"觀"},{"id":1848,"name":"台西村影像館","lat":23.84393,"lng":120.2742,"cat":"culture","desc":"以台西村為主角的影像館，透過報導攝影與紀錄片呈現社區。展覽和講座也延伸到濁水溪流域，談影像中的地方文史與環境生態。","area":"大城鄉・彰化縣","ph":"觀"},{"id":1849,"name":"大城咸安宮","lat":23.85499,"lng":120.321268,"cat":"worship","tag":"歷史建築","desc":"大城厝的咸安宮與地方移民帶來的保生大帝信仰相連。廟宇在日治昭和年間改築，仍保有當時樣貌，是大城、東城和西城一帶的信仰重地。","area":"大城鄉・彰化縣","ph":"文"},{"id":1850,"name":"興山公園","lat":23.83124,"lng":120.3171,"cat":"nature","desc":"濁水溪畔的公園林木蓊鬱，園內萬安宮供奉輔順將軍。從兩側鐘鼓樓或拱橋可看公園與周遭稻田，稻作隨季節轉為翠綠或金黃。","area":"大城鄉・彰化縣","ph":"觀"},{"id":1851,"name":"埔鹽順澤宮","lat":23.99662,"lng":120.4749,"cat":"worship","desc":"埔鹽村的玄天上帝信仰，相傳由清康熙年間定居此地的泉州陳家帶來。後代遷往溪湖、秀水時分靈另建廟宇，三地因而有了兄弟廟的情誼。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1852,"name":"大村五通宮","lat":23.976031,"lng":120.534574,"cat":"worship","tag":"歷史建築","desc":"大村與埔心交界的古廟主祀五顯大帝，坐落在昔日埔心通往鹿港的路上。創廟年代有不同說法，日治時期的寺廟臺帳則記為清乾隆年間。","area":"大村鄉・彰化縣","ph":"文"},{"id":1853,"name":"大村武魁新厝","lat":23.983169,"lng":120.538155,"cat":"history","tag":"古蹟","desc":"大村賴家留下的傳統宅第，在正身兩側設有多道護龍。有些護龍間用過水廊相連，有些留下巷道，牆腳則可見卵石打底的老做法。","area":"大村鄉・彰化縣","ph":"文"},{"id":1854,"name":"大村貢旗洋樓","lat":23.985264,"lng":120.538311,"cat":"history","tag":"歷史建築","desc":"大村賴家的洋樓將日式住宅與西洋建築樣式放在一起。兩座塔樓、斜面屋頂，以及上下層形狀各異的窗戶，都留有日治時期的設計特色。","area":"大村鄉・彰化縣","ph":"文"},{"id":1855,"name":"大村賴景祿公祠","lat":23.991795,"lng":120.546362,"cat":"worship","tag":"古蹟","desc":"大村賴姓族人祭祖的公祠保有傳統閩南式格局，建於一九三七年。抬頭可見正廳的燕尾屋脊，中央寶塔上另有葫蘆裝飾。","area":"大村鄉・彰化縣","ph":"文"},{"id":1856,"name":"大村賴氏旗杆群","lat":23.983169,"lng":120.538156,"cat":"history","tag":"歷史建築","desc":"賴氏家祠環翠堂前排列著一組旗杆座，各有成對的夾杆石。座上刻著「兄弟同榜」、「欽賜文舉人」等字，記下家族取得功名的往事。","area":"大村鄉・彰化縣","ph":"文"},{"id":1857,"name":"大村車站│田園穿梭 輕旅行","lat":23.9939,"lng":120.5644,"cat":"other","desc":"藍色裝飾、白牆與尖頂使大村車站帶有地中海風格。橫跨前後站的廊道能夠展望田野，還有機會看見列車從葡萄園間駛來。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1858,"name":"展壯台大蘭園","lat":23.99689,"lng":120.5588,"cat":"other","desc":"蘭園從育種到溫室栽培都自行投入，培育的種類包括蝴蝶蘭、文心蘭與拖鞋蘭。園內的組織培養和選種，也是花卉生產的一部分。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1859,"name":"平和社區雙心池塘","lat":23.99675,"lng":120.5772,"cat":"scenic","desc":"大村平和社區在聖瑤宮附近打造了一座雙心池塘。社區以相連的兩顆心作為池塘造型，使這個水邊角落成為拍照留念的地方。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1860,"name":"過溝村葡萄王老樹","lat":23.99225,"lng":120.5524,"cat":"scenic","desc":"過溝村農民在自家門前種下從日本引進的巨峰葡萄，再以扦插、接枝分送種苗。留下的老藤，正是大村葡萄產業從幾棵果樹起步的見證。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1861,"name":"錫安祠樹包廟","lat":23.98853,"lng":120.5149,"cat":"worship","desc":"大崙村這座小祠供奉福德正神和福德夫人。廟旁榕樹的氣根沿著柱身纏繞，把樹與廟連在一起，形成當地所說的樹包廟。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1862,"name":"陳忠露雞毛撢子","lat":23.97691,"lng":120.4869,"cat":"other","desc":"埔鹽鄉一處三合院保留著手工製作雞毛撢子的技藝。屋主陳忠露多年來持續製作這種傳統除塵用具，也讓學生到民宅認識這門手藝。","area":"大村鄉・彰化縣","ph":"觀"},{"id":1863,"name":"1895八卦山抗日保台史蹟館","lat":24.0786,"lng":120.5457,"cat":"culture","desc":"八卦山的抗日史蹟館設在戰後開鑿的防空指揮室內。分期擴建的地下坑道曾是戒嚴時期軍事設施，如今成了認識戰爭記憶的空間。","area":"彰化市・彰化縣","ph":"觀"},{"id":1864,"name":"C-119軍機公園","lat":24.07824,"lng":120.5584,"cat":"nature","desc":"園中展示的美製運輸機出自費查公司，有「空中車廂式運輸機」的稱呼。這型飛機於一九五九年由臺灣空軍正式接收。","area":"彰化市・彰化縣","ph":"觀"},{"id":1865,"name":"【二林｜和平公園】登上星球探險樂園，開啟一場充滿想像力的太空冒險","lat":23.90487,"lng":120.3636,"cat":"nature","desc":"二林和平公園把鄰近精密機械園區的科技意象，轉化為星球探險主題。開闊的遊戲空間讓孩子想像太空旅程，也設有全齡休憩區。","area":"彰化市・彰化縣","ph":"觀"},{"id":1866,"name":"乙未保台和平紀念公園","lat":24.07997,"lng":120.5529,"cat":"nature","desc":"園內的祭祀殿紀念清末乙未抗日的義軍，兩側各有一門古砲。與古砲相伴的涼亭和花架，構成今日公園的紀念空間。","area":"彰化市・彰化縣","ph":"觀"},{"id":1867,"name":"元清觀","lat":24.079622,"lng":120.542633,"cat":"worship","tag":"古蹟","desc":"彰化城內的元清觀由泉州晉江移民在清乾隆年間捐建，前殿懸有「溫陵福地」匾額。舊縣志還記下玉皇聖誕時廟前搭臺酬神的熱鬧。","area":"彰化市・彰化縣","ph":"文"},{"id":1868,"name":"八卦山天空遊戲場","lat":24.0808,"lng":120.5483,"cat":"other","desc":"八卦山的遊戲場從雲朵和當地常見的灰面鵟鷹取材，以淺藍色和流線造型描繪天空。孩子遊戲之餘，也能欣賞山上的城市景色。","area":"彰化市・彰化縣","ph":"觀"},{"id":1869,"name":"八卦山紅毛井","lat":24.079071,"lng":120.545997,"cat":"history","tag":"歷史建築","desc":"八卦山腳下的紅毛井，是舊縣志所載彰化城四口深井之一。其他幾口井已成歷史，這裡仍留有居民汲水、洗衣的日常景象。","area":"彰化市・彰化縣","ph":"文"},{"id":1870,"name":"八卦山自然生態園區","lat":24.07698,"lng":120.5492,"cat":"culture","desc":"八卦山幽谷裡的生態公園用自然工法整理地形，把水池、花園與綠坡串在一起。除了映日池和邀月池，也有順著高低落差設置的溜滑梯。","area":"彰化市・彰化縣","ph":"觀"},{"id":1871,"name":"八卦山銀橋","lat":24.078416,"lng":120.548822,"cat":"history","tag":"歷史建築","desc":"文學步道旁的銀橋原是連接彰化神社與山上紀念碑的鐵線吊橋。舊橋年久失修後，由彰化銀行出資改築為鋼筋混凝土圓拱橋。","area":"彰化市・彰化縣","ph":"文"},{"id":1872,"name":"南瑤宮","lat":24.067678,"lng":120.538567,"cat":"worship","tag":"古蹟","desc":"彰化人早年稱南門外的南瑤宮為「外媽祖」。廟宇的起源傳說與一位笨港楊姓工人有關，他來瓦窯工作時，隨身帶著故鄉的媽祖香火。","area":"彰化市・彰化縣","ph":"文"},{"id":1873,"name":"南郭郡守官舍","lat":24.075,"lng":120.547,"cat":"other","desc":"彰化郡日治時期在南郭一帶興建官舍，留下南郭國小周邊的宿舍群。隨著部分宿舍閒置，學校師生發起守護與活化老房子的行動。","area":"彰化市・彰化縣","ph":"觀"},{"id":1874,"name":"卦山村 -美學生活聚落","lat":24.07677,"lng":120.5495,"cat":"other","desc":"八卦山大佛風景區裡，藝術家與工藝創作者聚集成一座小村。各自經營的工作室、手作與飲食，讓散步的人有機會認識當地創作者。","area":"彰化市・彰化縣","ph":"觀"},{"id":1875,"name":"原彰化警察署","lat":24.080551,"lng":120.542872,"cat":"history","tag":"古蹟","desc":"彰化警察署最初借用舊郡役所的會議室辦公，後來因場地狹窄另建廳舍。日治時期的新址選在今日彰化女中對面，於一九三六年落成。","area":"彰化市・彰化縣","ph":"文"},{"id":1876,"name":"古月民俗館","lat":24.07824,"lng":120.5428,"cat":"culture","desc":"二戰空襲後拆除的天后宮原址，後來興建了彰化古月民俗館。館舍於二〇〇六年完工，在舊廟地上以典藏傳承臺灣傳統文化。","area":"彰化市・彰化縣","ph":"觀"},{"id":1877,"name":"台語文創意園區","lat":24.07664,"lng":120.5571,"cat":"culture","desc":"八卦山上昔日的成功砲兵營區，保留營舍改作推廣台語的文化園區。常設展覽之外，也透過台語電影與歌仔戲介紹母語創作。","area":"彰化市・彰化縣","ph":"觀"},{"id":1878,"name":"定光佛廟(汀州會館)","lat":24.080702,"lng":120.540141,"cat":"worship","tag":"古蹟","desc":"彰化車站前一帶的定光佛廟，也稱為汀州會館。清乾隆年間，來自福建汀州的客家移民與副將張世英共同創建了這座廟宇。","area":"彰化市・彰化縣","ph":"文"},{"id":1879,"name":"小西特色街巷","lat":24.0804,"lng":120.5391,"cat":"culture","desc":"彰化車站附近的小西街區曾是熱鬧的布市，巷弄裡還留著紅磚牆、老旅社與小吃店。近年進駐的文具店和咖啡館，也成了街角的新鄰居。","area":"彰化市・彰化縣","ph":"觀"},{"id":1880,"name":"彰化不老泉","lat":24.074427,"lng":120.556955,"cat":"history","tag":"歷史建築","desc":"日治初期，彰化以鐵管將八卦山麓的湧泉引進市街。當時在支廳與公學校前設置水槽和給水栓，留下城市早期供水的歷史。","area":"彰化市・彰化縣","ph":"文"},{"id":1881,"name":"彰化中興莊","lat":24.08264,"lng":120.5483,"cat":"other","desc":"八卦山腳下的眷村建於一九五〇年，第一代居民多為從山東青島來臺的軍人與眷屬。這片住家記下他們離開故鄉、在彰化安家的往事。","area":"彰化市・彰化縣","ph":"觀"},{"id":1882,"name":"彰化八卦山大佛","lat":24.078466,"lng":120.548769,"cat":"history","tag":"歷史建築","desc":"彰化市旁的八卦山上，大佛自一九六一年竣工後便成為城市地標。這處山地在日治時期原有紀念碑，也見證了山頭景觀的變遷。","area":"彰化市・彰化縣","ph":"文"},{"id":1883,"name":"彰化女中紅樓","lat":24.081879,"lng":120.543771,"cat":"history","tag":"歷史建築","desc":"光復路上的紅樓約建於一九二四至一九二五年間，是彰化女中的早期校舍。校史可溯及日治時期設立的公立彰化女子高等普通學校。","area":"彰化市・彰化縣","ph":"文"},{"id":1884,"name":"彰化孔子廟","lat":24.078542,"lng":120.543573,"cat":"worship","tag":"古蹟","desc":"清雍正年間彰化設縣後，知縣張鎬倡建縣儒學，成為今日的彰化孔廟。地方士紳後來也曾集資重修，留下官民共同興學的歷史。","area":"彰化市・彰化縣","ph":"文"},{"id":1885,"name":"彰化市公會堂","lat":24.07909,"lng":120.545445,"cat":"history","tag":"歷史建築","desc":"今日縣立圖書館旁的公會堂，於一九三三年竣工。當時彰化需要市民共同使用的場地，演藝、展覽、會議與集會都可在此舉行。","area":"彰化市・彰化縣","ph":"文"},{"id":1886,"name":"彰化市武德殿","lat":24.07717,"lng":120.546016,"cat":"worship","tag":"古蹟","desc":"日治時期彰化郡練習柔道與劍道的場館，坐落在磚砌臺基上。臺基的通風格柵與一旁俱樂部的雨淋板木牆，都可看出當時的建築做法。","area":"彰化市・彰化縣","ph":"文"},{"id":1887,"name":"彰化慶安宮","lat":24.076611,"lng":120.542074,"cat":"worship","tag":"古蹟","desc":"福建同安移民在清嘉慶年間共同捐建此廟，正殿供奉保生大帝。廟宇兩廂曾兼作同鄉會館，因此地方也稱它為「銀同邑廟」。","area":"彰化市・彰化縣","ph":"文"},{"id":1888,"name":"彰化懷忠祠","lat":24.076202,"lng":120.538529,"cat":"worship","tag":"古蹟","desc":"民權路巷內的懷忠祠建於清雍正年間，其興建與大甲西社事件有關。事端涉及官府要求原住民族人為興建衙署提供勞力。","area":"彰化市・彰化縣","ph":"文"},{"id":1889,"name":"彰化扇形車庫","lat":24.086207,"lng":120.539901,"cat":"history","tag":"古蹟","desc":"彰化的鐵路機關庫因海線建設與貨運需求而設置，車庫股道呈扇形展開。各股道曾增設不同高度的檢修平台，供維修人員照料機車。","area":"彰化市・彰化縣","ph":"文"},{"id":1890,"name":"彰化曇花佛堂","lat":24.076837,"lng":120.543177,"cat":"worship","tag":"歷史建築","desc":"彰化這座家族世代相傳的在家佛堂，屬齋教龍華派中的壹是堂派。從前住持林大賡的家族傳承，可認識臺灣民間齋教的一支脈絡。","area":"彰化市・彰化縣","ph":"文"},{"id":1891,"name":"彰化縣全民國防教育景點","lat":24.07858,"lng":120.5458,"cat":"history","desc":"八卦山抗日保台史蹟館是彰化的國防教育景點之一。館方從清日甲午戰爭的背景談起，帶出一八九五年八卦山抗日的歷史。","area":"彰化市・彰化縣","ph":"觀"},{"id":1892,"name":"彰化縣南北管館","lat":24.06833,"lng":120.5303,"cat":"culture","desc":"彰化傳承南管與北管音樂戲曲，至今仍可見多個歷史悠久的館閣。北管有梨春園、集樂軒，南管則有雅正齋、聚英社等團體。","area":"彰化市・彰化縣","ph":"觀"},{"id":1893,"name":"彰化縣原住民生活館","lat":24.08546,"lng":120.5603,"cat":"culture","desc":"彰化在二〇〇五年設立原住民生活館，提供原住民族群一處文化空間。館舍的設立也寄託了照顧族人、充實在地文化生活的期望。","area":"彰化市・彰化縣","ph":"觀"},{"id":1894,"name":"彰化縣立美術館","lat":24.07773,"lng":120.546,"cat":"culture","desc":"東民街與卦山路口的縣立美術館，以挑高空間和綠建築設計為特色。周邊的彰化孔廟、武德殿與圖書館，連成可步行探訪的藝文街區。","area":"彰化市・彰化縣","ph":"觀"},{"id":1895,"name":"彰化縣立體育場","lat":24.06737,"lng":120.5526,"cat":"other","desc":"大型田徑場、體育館和游泳池，構成彰化縣民平日運動的空間。附近還有八卦山棒球場與健興網球場，各自容納不同的運動項目。","area":"彰化市・彰化縣","ph":"觀"},{"id":1896,"name":"彰化苦楝花季","lat":24.09647,"lng":120.6023,"cat":"scenic","desc":"春天的東螺溪兩岸，苦楝在木棉樹間開出淡紫色小花。沿著溪湖、埤頭與北斗的河岸，可見花瓣隨風飄落，空氣中也帶著淡淡花香。","area":"彰化市・彰化縣","ph":"觀"},{"id":1897,"name":"彰化西門福德祠","lat":24.077615,"lng":120.538062,"cat":"worship","tag":"古蹟","desc":"舊彰化縣城四座城門內都曾設土地祠，西門這座也叫大西門土地公廟。廟內保留乾隆年間古匾，實際創建年份則尚難確定。","area":"彰化市・彰化縣","ph":"文"},{"id":1898,"name":"彰化車站│順著鐵軌 覓歷史","lat":24.08684,"lng":120.5407,"cat":"other","desc":"彰化車站周邊留有舊街巷和老屋，也是體驗市區小吃的地方。把街區與八卦山大佛放在同一趟散步中，可以從城市一路看向山景。","area":"彰化市・彰化縣","ph":"觀"},{"id":1899,"name":"彰化關帝廟","lat":24.076526,"lng":120.540214,"cat":"worship","tag":"古蹟","desc":"清雍正年間，知縣秦士望捐出俸祿，在彰化舊縣城南門內創建關帝廟。到了乾隆年間，地方士紳又應知縣之邀集資修繕廟宇。","area":"彰化市・彰化縣","ph":"文"},{"id":1900,"name":"彰化集樂軒","lat":24.075923,"lng":120.542278,"cat":"history","tag":"古蹟","desc":"彰化城的東門集樂軒是地方傳統曲館之一。相傳清乾隆年間，媽祖信眾請福州人楊應求來傳藝，以應婚喪喜慶與廟會的演奏需求。","area":"彰化市・彰化縣","ph":"文"},{"id":1901,"name":"扇形車庫","lat":24.08442,"lng":120.5359,"cat":"other","desc":"外號「火車頭旅館」的車庫裡，十二條股道呈扇形散開。從觀賞台俯瞰，可以看清中央轉盤如何將火車頭對準各條股道。","area":"彰化市・彰化縣","ph":"觀"},{"id":1902,"name":"新穎藝術坊","lat":24.07976,"lng":120.5417,"cat":"culture","desc":"這間藝術坊以手工藝為主，從作品、材料包到才藝教學都有涉獵。除了坊內的課程，也曾把手作帶進學校與社團。","area":"彰化市・彰化縣","ph":"觀"},{"id":1903,"name":"歡喜生態園","lat":24.06401,"lng":120.5674,"cat":"other","desc":"私人經營的低海拔植物園種有各種原生與外來喬灌木，也為蝴蝶栽種食草和蜜源植物。園區以自導方式讓人踏查，認識鄉土生態與保育。","area":"彰化市・彰化縣","ph":"觀"},{"id":1904,"name":"洪易美術館","lat":24.04881,"lng":120.6223,"cat":"culture","desc":"藝術家洪易的作品常以鮮豔色彩塑造各種動物，留下許多可供想像的細節。館中也保存他高中時的創作，可對照他後來的裝置藝術。","area":"彰化市・彰化縣","ph":"觀"},{"id":1905,"name":"節孝祠","lat":24.076875,"lng":120.546346,"cat":"worship","tag":"古蹟","desc":"彰化節孝祠的由來，與清末地方人士兩度採訪中部婦女事蹟有關。書院院長、貢生等人彙整當時所稱的節孝名單，再由官員奏請朝廷。","area":"彰化市・彰化縣","ph":"文"},{"id":1906,"name":"綠色環境學習營地","lat":24.07715,"lng":120.5572,"cat":"other","desc":"八卦台地上的閒置軍營，經整理成為環境學習營地。舊營區轉作都市綠地，兼顧生物多樣性，也讓人有機會在八卦山間休憩。","area":"彰化市・彰化縣","ph":"觀"},{"id":1907,"name":"縣139線景觀道路","lat":23.96104,"lng":120.62971,"cat":"other","desc":"這條八卦山景觀道路串起山上的風景區，沿途可見樹冠交會成的綠色隧道。季節變化為路旁換上不同面貌，也吸引騎士沿途欣賞。","area":"彰化市・彰化縣","ph":"觀"},{"id":1908,"name":"聖王廟","lat":24.07714,"lng":120.5384,"cat":"worship","desc":"又名威惠宮的聖王廟，供奉開漳聖王陳元光，曾是彰化城內漳州移民的信仰中心。古廟歷經兵燹，在清嘉慶與光緒年間先後重修。","area":"彰化市・彰化縣","ph":"觀"},{"id":1909,"name":"華陽公園","lat":24.06979,"lng":120.5563,"cat":"nature","desc":"市區一角的公園裡，茂密樹蔭旁有平緩的步道，能散步也能慢跑。晴天時草地上有日光和微風，是附近居民歇腳的地方。","area":"彰化市・彰化縣","ph":"觀"},{"id":1910,"name":"賴和紀念館","lat":24.08406,"lng":120.547,"cat":"culture","desc":"賴和家人在他昔日行醫的舊址規劃紀念館，保存這位作家的藏書、字畫與手稿。館方也陸續收藏彰化其他作家的文物，串起地方文學記憶。","area":"彰化市・彰化縣","ph":"觀"},{"id":1911,"name":"賴和詩牆","lat":24.07908,"lng":120.5488,"cat":"other","desc":"彰化八卦山風景區裡，以作家賴和為名的詩牆兼具文學與景觀意義。它所在的位置如同彰化的門面，讓地方文學成為山中地標。","area":"彰化市・彰化縣","ph":"觀"},{"id":1912,"name":"開化寺","lat":24.078602,"lng":120.540878,"cat":"worship","tag":"古蹟","desc":"中華路上的開化寺舊稱觀音亭，由知縣談經正在清雍正年間倡建。當時彰化才剛設縣，連縣署廳舍都還沒建好。","area":"彰化市・彰化縣","ph":"文"},{"id":1913,"name":"鷹揚八卦","lat":24.06743,"lng":120.5732,"cat":"scenic","desc":"清明前後，八卦山常迎來過境停棲的灰面鵟鷹與赤腹鷹。虎崗路的賞鷹平台可以觀察群鷹盤旋，也提供認識候鳥棲地的機會。","area":"彰化市・彰化縣","ph":"觀"},{"id":1914,"name":"成美文化園","lat":23.92015,"lng":120.5482,"cat":"culture","desc":"永靖的庭園以魏家古厝成美公堂和「和園」為重心。一邊是家族渡臺開墾留下的宅第，一邊可看傳統園林工藝營造的山水景致。","area":"永靖鄉・彰化縣","ph":"觀"},{"id":1915,"name":"永靖清福宮石板廟","lat":23.924192,"lng":120.561134,"cat":"worship","tag":"歷史建築","desc":"永靖陳厝厝保留著饒平客家移民的伯公信仰，清福宮的石板廟便是例子。先民到新地方安頓時，會奉祀伯公，祈求土地與人畜平安。","area":"永靖鄉・彰化縣","ph":"文"},{"id":1916,"name":"永靖車站 │新舊交織 遊趣間","lat":23.92815,"lng":120.5717,"cat":"other","desc":"永靖車站的老雨簷帶著歲月鏽痕，站旁圍牆則換上活潑彩繪。從天橋望去，鐵軌伸向遠方，還能看見彰化的山脈與平原。","area":"永靖鄉・彰化縣","ph":"觀"},{"id":1917,"name":"永靖邱氏宗祠","lat":23.92221,"lng":120.552439,"cat":"worship","tag":"歷史建築","desc":"永靖邱家的開臺祖邱華循，清乾隆年間與母親、弟弟從廣東饒平渡海。這座宗祠所承繫的族史，也記下他們初到彰化時幾度遷居的足跡。","area":"永靖鄉・彰化縣","ph":"文"},{"id":1918,"name":"永靖魏成美公堂","lat":23.918367,"lng":120.548143,"cat":"worship","tag":"歷史建築","desc":"從福建永定來臺的魏家先祖在永靖開墾，後來開設成安藥舖。家族留下的公堂結合磚牆、土埆與木構架，門額題有「禮門義路」。","area":"永靖鄉・彰化縣","ph":"文"},{"id":1919,"name":"餘三館","lat":23.912345,"lng":120.542337,"cat":"culture","tag":"古蹟","desc":"永靖陳家來自廣東饒平，宅第以卵石和泥灰砌起臺基。留意護龍屋簷的排水口，造型是泥塑鰲魚，寄託「獨占鰲頭」之意。","area":"永靖鄉・彰化縣","ph":"文"},{"id":1920,"name":"三條圳派出所","lat":23.827306,"lng":120.495335,"cat":"history","tag":"古蹟","desc":"這座派出所的前身是日治時期的潮洋厝警察官吏派出所，設於一九二七年。它的存在反映了當時警察機構深入各地聚落的治理方式。","area":"溪州鄉・彰化縣","ph":"文"},{"id":1921,"name":"彰化溪州公園","lat":23.84183,"lng":120.4963,"cat":"nature","desc":"溪州的平地公園分設苗木區和森林區，將彰化栽培的花卉與苗木引入園中。成片草地與綠樹之間，也留有各種休閒活動的空間。","area":"溪州鄉・彰化縣","ph":"觀"},{"id":1922,"name":"彰化黃花風鈴木","lat":23.84473,"lng":120.4792,"cat":"scenic","desc":"溪州至西螺一帶的路旁栽有成排黃花風鈴木，綿延數公里。每年三月前後盛開時，樹冠滿是金黃色花朵，落花又在地面鋪上另一層黃。","area":"溪州鄉・彰化縣","ph":"觀"},{"id":1923,"name":"萬景藝苑","lat":23.85984,"lng":120.5054,"cat":"culture","desc":"溪州這座園林從搶救一株仍冒出嫩芽的百年老樟樹開始。後來陸續收容老樹，以臺灣原生植栽營造園景，花木、山石與建築散布其間。","area":"溪州鄉・彰化縣","ph":"觀"},{"id":1924,"name":"西螺大橋（北段）","lat":23.822071,"lng":120.462816,"cat":"history","tag":"歷史建築","desc":"橫跨濁水溪的鐵橋把彰化與雲林連在一起，北段落在溪州水尾村。大橋於一九五二年竣工，見證兩岸自倚賴渡船以來的變遷。","area":"溪州鄉・彰化縣","ph":"文"},{"id":1925,"name":"台灣欒樹綠色隧道","lat":23.95026,"lng":120.4517,"cat":"scenic","desc":"東螺溪右岸的兩排臺灣欒樹，枝冠相接成一條綠色隧道。秋天先見黃色花瓣飄落，隨後蒴果從鮮紅漸轉紫紅，同一路段有了不同層次。","area":"溪湖鎮・彰化縣","ph":"觀"},{"id":1926,"name":"巫家捏麵館","lat":23.9722,"lng":120.478,"cat":"culture","desc":"溪湖巫家一家人都與捏麵人為伍，因而成立專門的捏麵文化館。館舍延續傳統手藝，讓原本在手指間成形的麵人有了傳承的地方。","area":"溪湖鎮・彰化縣","ph":"觀"},{"id":1927,"name":"溪湖庄役場","lat":23.962327,"lng":120.479235,"cat":"history","tag":"歷史建築","desc":"溪湖留下的庄役場廳舍建於一九三五年，當年是地方行政機關。日治時期街與庄的公所稱為役場，這座建築便保留了那段制度的印記。","area":"溪湖鎮・彰化縣","ph":"文"},{"id":1928,"name":"溪湖糖廠","lat":23.95141,"lng":120.4807,"cat":"other","desc":"高聳煙囪與碩大的煮糖蒸發槽，留下溪湖昔日製糖工場的面貌。園區也保有蒸汽火車頭，舊鐵軌上有五分車，老建築裡則看得到枝仔冰。","area":"溪湖鎮・彰化縣","ph":"觀"},{"id":1929,"name":"溪湖糖廠五分車站","lat":23.955424,"lng":120.482154,"cat":"history","tag":"歷史建築","desc":"糖廠旁的車站曾服務軌距較窄的五分車，站房結合磚牆與木構架。車站和月臺間的遮棚可見木柱斜撐，外露骨架配上雨淋板立面。","area":"溪湖鎮・彰化縣","ph":"文"},{"id":1930,"name":"溪湖軍機公園","lat":23.96274,"lng":120.4733,"cat":"nature","desc":"溪湖的軍事主題公園以退役飛機為展示主角。廣場上從運輸機到中正號戰鬥機、超級軍刀式戰轟機，可以並看幾種用途不同的老飛機。","area":"溪湖鎮・彰化縣","ph":"觀"},{"id":1931,"name":"福安宮","lat":23.96399,"lng":120.4793,"cat":"worship","desc":"居民來這座媽祖廟參拜，供奉的主神是天上聖母。關於媽祖像前吊燈搖晃的傳聞，也成了信眾口耳相傳的廟宇故事。","area":"溪湖鎮・彰化縣","ph":"觀"},{"id":1932,"name":"阿勃勒花道","lat":23.94476,"lng":120.4541,"cat":"scenic","desc":"阿勃勒又稱金鏈花，初夏時細長花序從枝頭垂落。單朵花像一隻小黃蝶，花瓣隨風成串飄下時，又有了「黃金雨」的名字。","area":"溪湖鎮・彰化縣","ph":"觀"},{"id":1933,"name":"原台中州農會田中倉庫","lat":23.853361,"lng":120.591679,"cat":"history","tag":"歷史建築","desc":"田中在日治時期是彰化的米穀集散地，農會倉庫見證這段產業歷史。當地米穀藉由縱貫鐵路運往打狗與基隆，從田間連到港口。","area":"田中鎮・彰化縣","ph":"文"},{"id":1934,"name":"台灣菸葉耕種時業改進社","lat":23.8544,"lng":120.595454,"cat":"history","tag":"歷史建築","desc":"八卦山一帶曾盛行栽種菸草，這處場舍則保留了菸葉收納和檢驗的歷史。收納場的旋轉氣窗與鑑定室舊窗，都是初建時留下的構件。","area":"田中鎮・彰化縣","ph":"文"},{"id":1935,"name":"田中夫妻樹","lat":23.87087,"lng":120.56201,"cat":"other","desc":"田中老樹公園的田野間，兩棵百年茄苳左右並立，枝葉茂密。地方人親暱地稱它們為夫妻樹，也是三民社區居民休閒時熟悉的地標。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1936,"name":"田中書山祠","lat":23.872472,"lng":120.587986,"cat":"worship","tag":"歷史建築","desc":"田中頂潭里的蕭姓族人集資建祠，祭祀從漳州南靖傳下的歷代祖先。每年農曆正月十三依古禮舉行春祭，延續家族慎終追遠的傳統。","area":"田中鎮・彰化縣","ph":"文"},{"id":1937,"name":"田中森林公園","lat":23.85306,"lng":120.5877,"cat":"nature","desc":"鼓山寺附近的森林公園林蔭濃密，能在步道上聽鳥鳴、看蝴蝶。登山小徑沿著山稜蜿蜒，自行車道則穿行山林與田野。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1938,"name":"田中森林公園","lat":23.85306,"lng":120.61196,"cat":"nature","desc":"八卦山南麓的公園依山闢建步道，可邊走邊看山林景色。較平緩處設有運動廣場和兒童遊樂區，讓不同年齡的人都能找到休憩空間。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1939,"name":"田中氣象站","lat":23.87395,"lng":120.58106,"cat":"other","desc":"田中的綜觀氣象站設有教育空間，透過動態展示說明氣象與地震。觀眾可從互動和體感認識地球科學，也了解這些知識如何用在防災。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1940,"name":"田中窯創意園區","lat":23.86933,"lng":120.57049,"cat":"culture","desc":"陶藝家葉志誠以田中為名創辦窯場，把柴燒陶藝延伸到農村的公共藝術。園區裡從拉坯、泥雕到大型景觀作品，都能看見泥土的不同用法。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1941,"name":"田中窯燒貓村","lat":23.86571,"lng":120.56908,"cat":"culture","desc":"三民社區的藝術廊道上，十一座大型陶貓散布其間。這些作品由地方陶藝家帶領居民一起製作，把農村街巷變成了共同創作的展場。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1942,"name":"田中車站 │日式氛圍 鎮風光","lat":23.8584,"lng":120.5913,"cat":"other","desc":"田中從稻田間的小聚落，以車站為中心逐漸發展成街鎮。舊站房如今成了田中藝廊，延續鐵道建築的用途，也替地方藝文留下空間。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1943,"name":"田中陳氏壽山堂","lat":23.859348,"lng":120.585835,"cat":"worship","tag":"古蹟","desc":"從漳浦來臺的陳家在田中留下壽山堂，宅第由前後兩落組成。後落保留三合院布局，較平緩的四坡水屋頂則可見日治時期的影響。","area":"田中鎮・彰化縣","ph":"文"},{"id":1944,"name":"田中（天受宮）殉職者之碑","lat":23.851456,"lng":120.583072,"cat":"worship","tag":"歷史建築","desc":"天受宮左廂屋頂上突出一座四角尖碑，是一九三四年所立的殉職者之碑。碑面留有日文紀事，記下沙崙派出所遇襲的歷史。","area":"田中鎮・彰化縣","ph":"文"},{"id":1945,"name":"田頭水文史館","lat":23.85481,"lng":120.591,"cat":"culture","area":"田中鎮・彰化縣","ph":"觀"},{"id":1946,"name":"華新MASK創意生活館","lat":23.85673,"lng":120.5698,"cat":"culture","desc":"這座以口罩為主題的觀光工廠，從創意、發明和品質談起。館方以生活教育的角度，呈現日常使用的口罩和健康之間的關係。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1947,"name":"赤水崎公園","lat":23.85673,"lng":120.6225,"cat":"nature","desc":"田中森林公園裡的赤水崎曾是彰化、南投之間的往來要道。舊道轉作親山步道後仍保有原來的林相，也接續八卦山的休憩步道。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1948,"name":"高鐵彰化站","lat":23.87363,"lng":120.5745,"cat":"other","desc":"建築師姚仁喜從彰化常見的「田」字取材，為高鐵站構思建築格局。車站將在地花卉與日光帶入現代站體，也呼應地方花卉產業。","area":"田中鎮・彰化縣","ph":"觀"},{"id":1949,"name":"田尾怡心園","lat":23.89625,"lng":120.532,"cat":"other","desc":"田尾公路花園裡的共融公園，設有磨石子溜滑梯、球體攀爬架與幼兒戲沙場。環區步道、遮陽棚和健身設施則留給散步或休息的人。","area":"田尾鄉・彰化縣","ph":"觀"},{"id":1950,"name":"隆盛木化石博物館","lat":23.90829,"lng":120.5232,"cat":"culture","desc":"館內的木化石展品呈現多種顏色與紋路，有些帶著玉石般的光澤。除了樹木的化石，也有動物和螺類等不同生物留下的痕跡。","area":"田尾鄉・彰化縣","ph":"觀"},{"id":1951,"name":"劉宅月眉池","lat":23.91373,"lng":120.6078,"cat":"history","desc":"社頭月眉池的劉家先祖來自福建漳州南靖。族人先落腳嘉義打貓，也就是今天的民雄，到了下一代才遷往月眉池開墾。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1952,"name":"台灣手套博物館","lat":23.90261,"lng":120.6032,"cat":"culture","desc":"織襪產業聚集的社頭，也有一座專談手套的博物館。創辦人從車縫運動手套起家，在展館裡將工廠經驗與手套展示結合。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1953,"name":"新和春醬油漬物工廠","lat":23.89699,"lng":120.5813,"cat":"other","desc":"張土墻在日治大正年間創立的新和春，傳承的是醬油乾式純釀工法。從早年的醬油與漬物工廠，可認識地方延續多年的釀造手藝。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1954,"name":"月眉池劉宅古厝","lat":23.92521,"lng":120.60359,"cat":"other","desc":"八卦山腳下的月眉池劉宅，以多達十三條護龍圍成寬闊的建築群。這種聚族而居的格局，也保留了早期移民在山麓相互守望的痕跡。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1955,"name":"樂活襪之鄉博物館","lat":23.90323,"lng":120.6022,"cat":"culture","desc":"社頭的織襪企業把多年來代工生產襪子的經驗帶進博物館。外觀採整棟彩色的義式建築，多種色彩並列，成了小鎮裡醒目的地標。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1956,"name":"清水岩生態展示中心","lat":23.88638,"lng":120.6139,"cat":"scenic","desc":"清水岩寺旁的生態展示中心，外形就是一隻放大的獨角仙。館內收藏數百種昆蟲標本，周邊山林則種有獨角仙喜愛的光臘樹。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1957,"name":"社頭同仁社","lat":23.895866,"lng":120.581056,"cat":"history","tag":"歷史建築","desc":"社頭車站附近的同仁社建築，建於日治大正年間。當年蕭家蕭園創辦通運公司，經營事業陸續合併其他公司，與地方運輸發展相連。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1958,"name":"社頭張厝土地公廟（永安宮）","lat":23.904583,"lng":120.576094,"cat":"worship","tag":"歷史建築","desc":"位在社頭西側的張厝庄，是彰化早年發展的七十二庄之一。永安宮是庄內的土地公廟，與各庄合祀的枋橋頭天門宮同屬聚落的信仰生活。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1959,"name":"社頭斗山祠","lat":23.882572,"lng":120.605366,"cat":"worship","tag":"古蹟","desc":"埤斗村這座蕭氏祠堂，是蕭滿泰四房後裔於清光緒年間集資興建。祠堂保存了族人從福建漳州南靖繁衍，到社頭聚居的家族記憶。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1960,"name":"社頭月眉池劉氏古厝","lat":23.924958,"lng":120.60327,"cat":"history","tag":"歷史建築","desc":"月眉池劉家先祖從福建南靖渡臺，輾轉從嘉義打貓遷到社頭。族中劉元炳曾考中武舉，獲賜「武魁」匾額，家宅也留下這段功名故事。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1961,"name":"社頭杜鵑花大道","lat":23.89517,"lng":120.6002,"cat":"scenic","desc":"原本普通的鄉間小路，因栽下杜鵑與小葉欖仁，逐漸長成綠色隧道。三月杜鵑盛開時，沿著近兩公里的道路可一路欣賞花色。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1962,"name":"社頭枋橋頭天門宮","lat":23.917328,"lng":120.581973,"cat":"worship","tag":"古蹟","desc":"枋橋頭的媽祖廟由三川殿與正殿組成，中間夾著天井，右側還有配殿。重修時新舊工法交替，建築可見木構與鋼筋混凝土並用的痕跡。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1963,"name":"社頭泰安岩","lat":23.899103,"lng":120.580185,"cat":"worship","tag":"歷史建築","desc":"泰安岩的三川殿門扇刻有螭龍，門印上分別刻著「福祿」與「壽喜」。步口廊又可看見鯉魚躍龍門和虎嘯山林兩組泥塑。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1964,"name":"社頭深坵祠","lat":23.893034,"lng":120.594423,"cat":"worship","tag":"歷史建築","desc":"蕭氏書山派族人在田中、社頭一帶落腳後，集資建祠追念先祖蕭仕鼎。祠名沿用福建祖居地的「深坵祠」，把兩地宗族淵源連在一起。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1965,"name":"社頭清水岩","lat":23.886225,"lng":120.613373,"cat":"worship","tag":"古蹟","desc":"清雍正年間，觀音坪的茅草工寮改作佛寺，成了社頭清水岩的開端。乾隆初年住持悟意又發起募建，早期寺宇以茅竹構成。","area":"社頭鄉・彰化縣","ph":"文"},{"id":1966,"name":"社頭車站 │產業交織 新脈絡","lat":23.89578,"lng":120.5808,"cat":"other","desc":"社頭車站周邊聚集不同的地方特色，從織襪產業到芭樂，都與小鎮生活相連。車站附近的福井食堂還收藏著鐵道文物。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1967,"name":"福井鐵道文物館","lat":23.89694,"lng":120.5852,"cat":"culture","desc":"社頭的便當食堂裡設有鐵道文物館，收藏來自店主陳家的鐵路記憶。從父執輩在臺鐵工作起留下的物件，逐漸累積成今日的展示。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1968,"name":"織足藏樂館","lat":23.92251,"lng":120.5826,"cat":"culture","desc":"這座館舍前身是社頭鄉產業推廣中心，由鄉公所在九二一地震後籌建。當時設館是為了推廣地方農特產品，建築於二〇〇六年完工。","area":"社頭鄉・彰化縣","ph":"觀"},{"id":1969,"name":"益源古厝","lat":24.06405,"lng":120.4957,"cat":"other","desc":"馬興陳家渡臺經商致富後，在清道光年間購地興建大宅與莊園。這處又稱益源古厝的宅第，也記錄了家族後來取得文武功名的歷程。","area":"秀水鄉・彰化縣","ph":"觀"},{"id":1970,"name":"龍騰公園","lat":24.06183,"lng":120.4913,"cat":"nature","desc":"鄰近益源古厝的公園，由建國科技大學設計。這片土地原本是公墓，改作休憩空間後，成為秀山一處新的地方地標。","area":"秀水鄉・彰化縣","ph":"觀"},{"id":1971,"name":"九龍大榕公","lat":23.82871,"lng":120.4495,"cat":"scenic","desc":"濁水溪堤防下的百年榕樹，氣根粗壯如龍爪，向四周落地生長。枝幹盤結成一大片樹冠，遠看像一片林子，其實出自同一棵樹。","area":"竹塘鄉・彰化縣","ph":"觀"},{"id":1972,"name":"竹塘醒靈宮聖蹟亭","lat":23.887617,"lng":120.412598,"cat":"worship","tag":"歷史建築","desc":"牛稠子醒靈宮的聖蹟亭，見證地方客家族群惜字崇文的傳統。亭身四面飾有彩瓷浮雕與洗石子，並保留一塊一九五五年的砂岩碑。","area":"竹塘鄉・彰化縣","ph":"文"},{"id":1973,"name":"彰化肉粽角風車","lat":24.12579,"lng":120.4117,"cat":"scenic","desc":"彰濱工業區的肉粽角海岸有一片沙灘，也是候鳥北返途中停棲的地方。除了欣賞海岸景色，這裡也能觀察歇腳的鳥群。","area":"線西鄉・彰化縣","ph":"觀"},{"id":1974,"name":"白馬的家","lat":24.14052,"lng":120.4575,"cat":"other","desc":"地方酒莊與林家馬場結合，形成以馬和動物為主題的休憩空間。草地上的地中海風建築與漂流木裝置，也曾成為婚紗攝影的取景處。","area":"線西鄉・彰化縣","ph":"觀"},{"id":1975,"name":"線西蛤蜊兵營","lat":24.143622,"lng":120.450048,"cat":"history","tag":"文化景觀","desc":"線西海邊的營舍曾是榮民蛤蜊養殖場分場。上世紀五〇年代末軍隊縮編後，部分退役軍人被安置在彰化海濱，以水產養殖展開新生活。","area":"線西鄉・彰化縣","ph":"文"},{"id":1976,"name":"彰化桐花季","lat":23.97211,"lng":120.642,"cat":"scenic","desc":"四、五月間八卦山上的油桐相繼開花，山頭與谷地染上一片片白色。山間步道兩旁也種有油桐，可以在樹下近看花開。","area":"芬園鄉・彰化縣","ph":"觀"},{"id":1977,"name":"梅庄花卉生產休憩園區","lat":24.02929,"lng":120.6436,"cat":"culture","desc":"開闊的園地保留了傳統農村風貌，主要栽培各種果樹。園內除了蜜李、棗子李和西瓜李，也有甜柿、樹葡萄與不同品種的桃。","area":"芬園鄉・彰化縣","ph":"觀"},{"id":1978,"name":"芬園寶藏寺","lat":24.002172,"lng":120.627758,"cat":"worship","tag":"古蹟","desc":"芬園進芬村的古寺，是中部舊稱「三巖二寺」的其中一座。正殿供奉觀音，後殿另祀媽祖與玉皇大帝，建寺年代則留有不同說法。","area":"芬園鄉・彰化縣","ph":"文"},{"id":1979,"name":"芬園庄役場","lat":24.013761,"lng":120.628524,"cat":"history","tag":"古蹟","desc":"彰南路上的舊鄉公所原是日治時期的芬園庄役場，於一九三五年興建。庄役場廳舍得以保存，也留下芬園地方行政發展的實物。","area":"芬園鄉・彰化縣","ph":"文"},{"id":1980,"name":"白沙坑文德宮","lat":24.04295,"lng":120.5474,"cat":"worship","desc":"白沙坑的土地公廟原名保安宮，清道光年間改稱文德宮。除地方流傳的翰林與土地公烏紗帽故事，廟方也延續迎花燈的百年習俗。","area":"花壇鄉・彰化縣","ph":"觀"},{"id":1981,"name":"花壇中庄李宅正身","lat":24.014796,"lng":120.553789,"cat":"worship","tag":"歷史建築","desc":"花壇中庄的李家祖籍福建安溪，宅第約建於清同治年間。依後人口述，先祖經商渡海，下一代選定花壇定居，才有了這座家宅。","area":"花壇鄉・彰化縣","ph":"文"},{"id":1982,"name":"花壇八卦窯","lat":24.025237,"lng":120.549825,"cat":"worship","tag":"歷史建築","desc":"花壇從日治時期就有製瓦產業，八卦窯是當地窯爐演變的一環。這種自歐洲引進的輪窯，又稱霍夫曼窯，反映提高產量與燃料效率的嘗試。","area":"花壇鄉・彰化縣","ph":"文"},{"id":1983,"name":"花壇車站│地方列車 產業旅","lat":24.02521,"lng":120.5376,"cat":"worship","desc":"花壇車站舊稱茄苳腳，改名由來在地方流傳一段諧音故事。相傳日治時有皇族將站名聽成「下等客」，因這場誤會而改稱花壇。","area":"花壇鄉・彰化縣","ph":"觀"},{"id":1984,"name":"茉莉花壇夢想館","lat":24.02694,"lng":120.538,"cat":"worship","desc":"花壇鄉農會把一座老穀倉改建成茉莉花主題館。從早年引種到農會與花農合作種植，館名連著茉莉花成為地方產業的歷程。","area":"花壇鄉・彰化縣","ph":"觀"},{"id":1985,"name":"虎山岩","lat":24.04349,"lng":120.55852,"cat":"history","desc":"花壇山間的佛寺因周圍山勢形似臥虎而得名，主祀觀世音菩薩。古木圍繞著清代創建的寺院，山邊也有隨季節開放的花海。","area":"花壇鄉・彰化縣","ph":"觀"},{"id":1986,"name":"虎山巖","lat":24.043255,"lng":120.559544,"cat":"worship","tag":"古蹟","desc":"白沙坑居民在清乾隆年間發起建寺，地方士紳賴鳳高捐地供奉觀音。早年的建築由本殿及左右兩室組成，寺後山林與寺前田園也列為廟產。","area":"花壇鄉・彰化縣","ph":"文"},{"id":1987,"name":"順達窯業","lat":24.02285,"lng":120.5576,"cat":"other","desc":"一九六五年創立的磚窯記錄了紅磚製造的變化。從最早使用的圓窯，到後來的八卦窯與自動隧道窯，都曾是它的生產方式。","area":"花壇鄉・彰化縣","ph":"觀"},{"id":1988,"name":"牧羊女親子主題園區","lat":23.96828,"lng":120.3286,"cat":"culture","area":"芳苑鄉・彰化縣","ph":"觀"},{"id":1989,"name":"王功漁港","lat":23.9698,"lng":120.3266,"cat":"scenic","desc":"從沿海一帶遠望，高聳的芳苑燈塔是辨認王功的地標。還沒到漁港就能看見塔身，也能從海岸景色裡認出王功的方向。","area":"芳苑鄉・彰化縣","ph":"觀"},{"id":1990,"name":"王功蚵藝文化館","lat":23.96834,"lng":120.3277,"cat":"culture","desc":"王功的蚵藝從一個簡單的提問開始，剝蚵後留下的蚵殼還能做什麼。地方將廢棄蚵殼用於創作，也把這門手藝帶進學校。","area":"芳苑鄉・彰化縣","ph":"觀"},{"id":1991,"name":"白馬峯普天宮","lat":23.92914,"lng":120.3167,"cat":"worship","desc":"芳中村的廟宇在二樓供奉天上聖母，媽祖兩旁分立千里眼與順風耳。殿內還可見文昌帝君等神祇，太歲殿旁則供有浮壁觀音。","area":"芳苑鄉・彰化縣","ph":"觀"},{"id":1992,"name":"福海宮","lat":23.953,"lng":120.3348,"cat":"worship","desc":"廟埕兩座旗桿與右前方的龍泉井，是福海宮周圍醒目的地景。每逢農曆三月媽祖誕辰，信眾前來參拜，廟前也會演出酬神戲。","area":"芳苑鄉・彰化縣","ph":"觀"},{"id":1993,"name":"鹿港溪","lat":24.05324,"lng":120.3601,"cat":"other","desc":"清代商船曾駛入鹿港市街南側的溪道，貨物在緊鄰老街的河畔交易。如今水岸有步道、綠帶和廣場，「鹿上行舟」等作品呼應舊港記憶。","area":"鹿港鎮・彰化縣","ph":"觀"},{"id":1994,"name":"Lipahak三峽野菜園區","lat":24.94604,"lng":121.36725,"cat":"culture","desc":"三鶯部落旁的都市農園，以復育原住民族傳統作物為重心。園地帶著原鄉景觀，讓人在都會裡也有機會認識部落的植物與環境。","area":"三峽區・新北市","ph":"觀"},{"id":1995,"name":"三峽善德橋","lat":24.926307,"lng":121.380104,"cat":"history","tag":"歷史建築","area":"三峽區・新北市","ph":"文"},{"id":1996,"name":"三峽大豹忠魂碑","lat":24.875307,"lng":121.394884,"cat":"history","tag":"古蹟","area":"三峽區・新北市","ph":"文"},{"id":1997,"name":"三峽宰樞廟","lat":24.934054,"lng":121.371314,"cat":"worship","tag":"古蹟","desc":"沿著廟宇的屋脊與山牆細看，能找到精細的剪黏和泥塑。正身兩側的松鼠與魚，分別寄託多子多孫和年年有餘的心願。","area":"三峽區・新北市","ph":"文"},{"id":1998,"name":"三峽庄役場","lat":24.934444,"lng":121.369339,"cat":"history","tag":"古蹟","desc":"三峽曾稱三角湧，是淡水河上游因河流交會與交易發展起來的聚落。庄役場的前身三角湧區役場，於一九〇一年設立。","area":"三峽區・新北市","ph":"文"},{"id":1999,"name":"三峽拱橋","lat":24.934516,"lng":121.373841,"cat":"history","tag":"古蹟","desc":"跨越三峽溪的拱橋於一九三三年落成，曾是三峽對外往來的重要橋梁。橋頭弧形矮欄帶有圓球裝飾，橋上可望見鳶山和老街市。","area":"三峽區・新北市","ph":"文"},{"id":2000,"name":"三峽挹翠樓","lat":24.933145,"lng":121.368726,"cat":"culture","tag":"歷史建築","desc":"藍染公園裡的遊客服務中心，將三峽藍染的元素帶進公共空間。服務中心於二〇一〇年完成，用地方工藝意象呼應整座公園。","area":"三峽區・新北市","ph":"文"},{"id":2001,"name":"三峽染工坊暨三峽藍染中心","lat":24.93447,"lng":121.36923,"cat":"other","desc":"清代的三角湧街曾聚集許多染坊，今日民權街的老屋外牆仍可見「染坊」字樣。在地團體成立藍染中心與染工坊，延續一度中斷的染布技藝。","area":"三峽區・新北市","ph":"觀"},{"id":2002,"name":"三峽清水祖師廟","lat":24.934,"lng":121.37023,"cat":"worship","desc":"三峽老街旁的清水祖師廟始建於清乾隆年間，戰後重建由畫家李梅樹主持美術設計。細看石雕與木雕，可見不同流派匠師和藝術家共同留下的作品。","area":"三峽區・新北市","ph":"觀"},{"id":2003,"name":"三峽老街","lat":24.93377,"lng":121.36981,"cat":"structure","desc":"舊稱三角湧的商業街在清代便已繁榮，日治時期整頓街道後，逐漸出現成排洋樓。今日沿紅磚拱廊散步，可抬頭欣賞巴洛克式牌樓。","area":"三峽區・新北市","ph":"觀"},{"id":2004,"name":"三峽蘇萬利古厝","lat":24.934687,"lng":121.390912,"cat":"history","tag":"歷史建築","desc":"橫溪南岸蘇家古宅的上下厝，屋脊上都做了花鳥剪黏。左護龍另有精細石雕，松鶴、竹鹿等圖樣寄託家人長壽與得祿的願望。","area":"三峽區・新北市","ph":"文"},{"id":2005,"name":"三峽長福巖清水祖師廟","lat":24.933792,"lng":121.370372,"cat":"worship","tag":"古蹟","desc":"三峽長福巖承繼移民渡海帶來的清水祖師信仰，前殿屋頂的裝飾尤其細緻。除了屋脊雙龍，翼角還用七色剪黏模擬浪花翻捲時的光彩。","area":"三峽區・新北市","ph":"文"},{"id":2006,"name":"北大特區藝術大道","lat":24.94635,"lng":121.37539,"cat":"culture","desc":"臺北大學三峽校區正門外的學勤路上，有一段沿住宅大樓延伸的人行大道。綠樹遮蔭、視野寬敞，是附近居民午後散步的地方。","area":"三峽區・新北市","ph":"觀"},{"id":2007,"name":"新北市客家文化園區","lat":24.94174,"lng":121.35977,"cat":"culture","desc":"這座園區蒐集、保存並展示客家傳統文物，也把歷史與語言納入推廣。透過實物和現代創意，可以從不同角度認識新北的客家文化。","area":"三峽區・新北市","ph":"觀"},{"id":2008,"name":"李梅樹紀念館","lat":24.93056,"lng":121.37286,"cat":"culture","desc":"三峽的紀念館收藏畫家李梅樹的作品與文物，呈現他長年關注的臺灣鄉土。尤其是他筆下的三峽風景，可以看見寫實畫風裡的地方風土。","area":"三峽區・新北市","ph":"觀"},{"id":2009,"name":"甘樂文創合習聚落","lat":24.9338,"lng":121.36901,"cat":"culture","desc":"三峽的合習聚落連結在地青年、產業與文化教育。它與甘樂食堂、小草書屋等地方據點相互呼應，從飲食、學習與創作支持社區生活。","area":"三峽區・新北市","ph":"觀"},{"id":2010,"name":"甘樂文創展演空間","lat":24.93327,"lng":121.369,"cat":"culture","desc":"三峽的老厝經整理成為藝文展演空間，屋內把藝術家的創作和地方文物放在一起。除了日常陳設，小型展演也讓老宅有了新的用途。","area":"三峽區・新北市","ph":"觀"},{"id":2011,"name":"白雞行修宮","lat":24.9051,"lng":121.40183,"cat":"worship","desc":"白雞山腰的行修宮是臺北行天宮的分宮，當地也稱三峽恩主公廟。殿內主祀關聖帝君，是三峽客家居民的信仰場所之一。","area":"三峽區・新北市","ph":"觀"},{"id":2012,"name":"皇后鎮森林","lat":24.91779,"lng":121.43352,"cat":"other","desc":"竹崙山區的園地被群山與竹坑溪環抱，清澈溪水構成園區的自然景色。庭園裡設有景觀座席，可以坐下來慢慢看山看水。","area":"三峽區・新北市","ph":"觀"},{"id":2013,"name":"臺北榮家韓戰義士史蹟室","lat":24.91021,"lng":121.39371,"cat":"other","area":"三峽區・新北市","ph":"觀"},{"id":2014,"name":"雲森瀑布","lat":24.83442,"lng":121.46603,"cat":"scenic","desc":"熊空中坑溪上游的雲森，取雲心與森山兩道瀑布之名。林間的平緩山徑經過清溪與木橋，有人也將鄰近的姊妹瀑布一併稱為雲森三瀑。","area":"三峽區・新北市","ph":"觀"},{"id":2015,"name":"三芝三板橋","lat":25.207176,"lng":121.518002,"cat":"history","tag":"古蹟","desc":"大屯溪谷早年需涉水而過，三板橋建起後，方便居民往來與運送農產。古橋最初由同安人林永在清道光初年出資，後於同治年間改建。","area":"三芝區・新北市","ph":"文"},{"id":2016,"name":"三芝後厝里石滬","lat":25.250598,"lng":121.457931,"cat":"history","tag":"歷史建築","desc":"三芝後厝里的海岸留有石滬，是先民在潮間帶以石塊砌成的捕魚設施。這種沿海漁業地景也分布在淡水與石門，串起北海岸的漁村歷史。","area":"三芝區・新北市","ph":"文"},{"id":2017,"name":"三芝新庄里石滬","lat":25.277705,"lng":121.49703,"cat":"history","tag":"歷史建築","desc":"新庄溪河口西側早年有兩口相連的石滬，地方因此稱為「雙連滬」。附近的新庄聚落，是清代移民在社寮港北側背風坡下開墾而成。","area":"三芝區・新北市","ph":"文"},{"id":2018,"name":"三芝田心子","lat":25.20576,"lng":121.49116,"cat":"scenic","desc":"田心子的水田映出遠山、綠樹和天空，像在三芝山間鋪開一面鏡子。晴天有藍天白雲，陰天時山影籠在霧裡，黃昏則可能染上一層金色。","area":"三芝區・新北市","ph":"觀"},{"id":2019,"name":"三芝興華驛站","lat":25.2037,"lng":121.50207,"cat":"other","desc":"陸軍興華營區退役後，整理為巴拉卡公路旁的自行車休憩驛站。迷彩房舍和哨兵亭仍保留在園內，還有退役戰車與戰機展示。","area":"三芝區・新北市","ph":"觀"},{"id":2020,"name":"三芝遊客中心及名人文物館","lat":25.24899,"lng":121.50774,"cat":"culture","desc":"三芝山坡上的遊客中心採仿唐式建築，遠處可以欣賞山海景色。裡面的文物館介紹杜聰明、江文也、李登輝與盧修一等地方人物。","area":"三芝區・新北市","ph":"觀"},{"id":2021,"name":"二號倉庫．文創","lat":25.25869,"lng":121.5007,"cat":"culture","desc":"三芝農會從前的倉庫，在地方藝術家協助下改成展覽館。裡頭可見在地創作者的手工藝、裝置藝術和陶藝，讓老倉庫有了新用途。","area":"三芝區・新北市","ph":"觀"},{"id":2022,"name":"南勢崗公園","lat":25.262,"lng":121.47871,"cat":"nature","desc":"三芝這座靠近沙灘的公園，把海岸色彩帶到了陸地。入口車道畫著深淺交替的藍色波浪，與安靜的藍色地坪一路相接。","area":"三芝區・新北市","ph":"觀"},{"id":2023,"name":"後厝漁港","lat":25.25566,"lng":121.47426,"cat":"other","desc":"淡金公路旁的後厝漁港，是三芝仍保有的漁村港口。這裡往來人潮較少，可以從港邊安靜的日常認識三芝的漁村風土。","area":"三芝區・新北市","ph":"觀"},{"id":2024,"name":"橫山梯田","lat":25.25446,"lng":121.51697,"cat":"other","desc":"大坑溪中游的橫山梯田順著地勢層層鋪開，河流與道路穿過田畦。休耕時看得出田地的幾何線條，茭白筍生長時則是一片翠綠。","area":"三芝區・新北市","ph":"觀"},{"id":2025,"name":"櫻木花道","lat":25.24855,"lng":121.47742,"cat":"scenic","desc":"三芝青山路兩旁栽有多種櫻花，形成沿路展開的賞花景觀。早春的緋寒櫻、八重櫻和吉野櫻陸續開放，花色也隨時序變化。","area":"三芝區・新北市","ph":"觀"},{"id":2026,"name":"淺水灣海濱公園","lat":25.25147,"lng":121.46991,"cat":"nature","desc":"淺水灣的海岸同時有岩岸和彎月形沙灣，白沙旁還可見覆著綠藻的礁岸。離岸不遠處另有礁石，海灣也吸引衝浪者前來。","area":"三芝區・新北市","ph":"觀"},{"id":2027,"name":"源興居","lat":25.24926,"lng":121.50904,"cat":"other","desc":"三芝遊客中心後方的源興居，曾是前總統李登輝的家。這座傳統三合院舊稱王厝營，周邊步道把生態池與古厝連在一起。","area":"三芝區・新北市","ph":"觀"},{"id":2028,"name":"番婆林觀光花園","lat":25.23736,"lng":121.49455,"cat":"nature","desc":"三芝錫板里的花園以舊地名「番婆林」為名，花卉隨四季更替。冬春可見鮮黃而帶甜香的小蒼蘭，春末初夏則有紫白相間的百子蓮。","area":"三芝區・新北市","ph":"觀"},{"id":2029,"name":"芝柏藝術村","lat":25.25516,"lng":121.51231,"cat":"culture","desc":"三芝的芝柏山莊因藝術家陸續進駐，逐漸形成有各式工作室的社區。李天祿布袋戲文物館也在村內，附近民宿與咖啡館各有自己的風格。","area":"三芝區・新北市","ph":"觀"},{"id":2030,"name":"芝蘭公園海上觀景平台","lat":25.25412,"lng":121.47253,"cat":"nature","desc":"芝蘭公園的水藍色波浪長廊朝海面伸出，盡頭的觀景平台設有裝置藝術。站在平台可環望北海岸，傍晚也能看夕陽落向海面。","area":"三芝區・新北市","ph":"觀"},{"id":2031,"name":"谷垚陶坊生活藝術館","lat":25.24317,"lng":121.47523,"cat":"culture","desc":"三芝吸引不少藝文工作者在山水間安居，谷垚陶坊便是其中一處。陶坊主人谷源滔以陶藝創作為志業，經營這間生活藝術館。","area":"三芝區・新北市","ph":"觀"},{"id":2032,"name":"三重先嗇宮","lat":25.050513,"lng":121.475913,"cat":"worship","tag":"古蹟","desc":"又稱五穀先帝廟的先嗇宮，供奉神農大帝。它最初建於新莊頭前，因水患等原因幾度遷移，清嘉慶年間才落腳如今的三重廟址。","area":"三重區・新北市","ph":"文"},{"id":2033,"name":"三重林氏古厝(崇德居)","lat":25.07219,"lng":121.4865,"cat":"other","desc":"三重林家曾經營香花生意，一九二五年由林建立興建崇德居。林建立當時也參與先嗇宮重建，古厝因而與地方廟宇有一段淵源。","area":"三重區・新北市","ph":"觀"},{"id":2034,"name":"幸福水漾公園","lat":25.06062,"lng":121.47858,"cat":"nature","desc":"公園把原有中央水渠拓寬，與花海緩坡共同構成開闊景觀。沿蜿蜒小徑可以找尋戀人排鐘和花蝶造型裝置，是不少人拍紀念照的地方。","area":"三重區・新北市","ph":"觀"},{"id":2035,"name":"幸運草地景溜滑梯","lat":25.05676,"lng":121.48119,"cat":"nature","desc":"新北大都會公園裡的共融遊戲場，以大型幸運草地景溜滑梯為主角。七公尺高的設施把地形變成遊戲場景，從遠處也很容易辨認。","area":"三重區・新北市","ph":"觀"},{"id":2036,"name":"新北大橋","lat":25.04725,"lng":121.48329,"cat":"other","desc":"橫跨二重疏洪道與大漢溪的單塔斜張橋，連起三重和板橋兩岸。大橋啟用時適逢臺北縣升格，因而正式命名為新北大橋。","area":"三重區・新北市","ph":"觀"},{"id":2037,"name":"新北大都會公園 (二重疏洪道河濱公園)","lat":25.0544,"lng":121.48323,"cat":"nature","desc":"二重疏洪道河濱公園裡的熊猴森樂園，把臺灣特色動物造型帶上堤坡。大小不同的溜滑梯與共融遊具沿坡展開，讓大人小孩都能參與。","area":"三重區・新北市","ph":"觀"},{"id":2038,"name":"碧華寺","lat":25.08257,"lng":121.48728,"cat":"worship","desc":"三重分子尾的碧華寺是三層樓仿北方形式的廟宇，門前石獅與樓梯兩側的石雕值得細看。寺裡早年奉釋迦牟尼佛，後來融合儒道佛信仰。","area":"三重區・新北市","ph":"觀"},{"id":2039,"name":"碧華布街(三重布莊博物園區)","lat":25.08119,"lng":121.4835,"cat":"culture","area":"三重區・新北市","ph":"觀"},{"id":2040,"name":"空軍三重一村","lat":25.057752,"lng":121.499018,"cat":"history","tag":"歷史建築","desc":"三重一村是戰後空軍防砲部隊的眷村，坐落在日治末期的防砲陣地舊址。軍事用地轉為眷屬安家的空間，留下不同時期的生活歷史。","area":"三重區・新北市","ph":"文"},{"id":2041,"name":"辰光橋","lat":25.05491,"lng":121.47998,"cat":"other","desc":"二重疏洪道兩岸的景觀橋，取材自牛郎織女隔著銀河相會的故事。橋身採雙層曲線交疊出觀景平台，夜間還能看見星座光雕。","area":"三重區・新北市","ph":"觀"},{"id":2042,"name":"鴨鴨公園","lat":25.0487,"lng":121.49076,"cat":"nature","desc":"大漢溪與新店溪匯流處的泥沙日久堆成沙洲，成了水鳥歇腳的地方。河畔公園便以觀察水鳥生態為主，也曾用鴨子造型創作地景藝術。","area":"三重區・新北市","ph":"觀"},{"id":2043,"name":"中和「太武山莊」","lat":25.00391,"lng":121.476191,"cat":"history","tag":"古蹟","desc":"中和民有街的太武山莊是戰地政務時期興建的軍眷宿舍。如今留下的甲種眷舍於一九六二年完工，與第十軍移防回臺的歷史相連。","area":"中和區・新北市","ph":"文"},{"id":2044,"name":"中和區「圓通禪寺」","lat":24.982749,"lng":121.492764,"cat":"worship","tag":"古蹟","area":"中和區・新北市","ph":"文"},{"id":2045,"name":"中和恐龍園區","lat":25.00819,"lng":121.4951,"cat":"culture","desc":"華中橋下的公園以恐龍為主題，沿途可見不同身形與神態的恐龍造型。場地分成火山、叢林、原野和山洞等區塊，適合親子一起探索。","area":"中和區・新北市","ph":"觀"},{"id":2046,"name":"中和瑞穗配水池","lat":24.999438,"lng":121.471554,"cat":"history","tag":"古蹟","desc":"瑞穗配水池是日治時期板橋水道的一部分，與改善地方用水及煤礦用水有關。入口的附牆柱和仿昆蟲爬痕的裝飾，是外觀細節。","area":"中和區・新北市","ph":"文"},{"id":2047,"name":"八二三紀念公園(中和公園)","lat":25.00316,"lng":121.51404,"cat":"nature","desc":"中和、永和交界附近的大片公園，也為居民熟知的四號公園。園地約十一公頃，在兩地緊密的街區間留下一片被稱為「雙和之肺」的空間。","area":"中和區・新北市","ph":"觀"},{"id":2048,"name":"員山公園","lat":25.00415,"lng":121.48009,"cat":"nature","desc":"中和員山公園內的「遊逸之丘」是一座大型共融遊戲區。長溜滑梯、滑草場和溜索沿著園地展開，讓孩子有不同方式體驗速度與坡度。","area":"中和區・新北市","ph":"觀"},{"id":2049,"name":"國旗嶺","lat":24.98453,"lng":121.49818,"cat":"scenic","desc":"又稱外南勢角山的國旗嶺，山頂有一座國旗亭。亭旁的基石整顆漆成紅色，在小小的平台上十分醒目，也是辨認山頂的線索。","area":"中和區・新北市","ph":"觀"},{"id":2050,"name":"國立臺灣圖書館","lat":25.00143,"lng":121.51249,"cat":"culture","desc":"四號公園內的國立臺灣圖書館，前身是一九一五年設立的臺灣總督府圖書館。這座早期現代圖書館也曾負責輔導全島圖書館事業發展。","area":"中和區・新北市","ph":"觀"},{"id":2051,"name":"圓通禪寺(圓通寺)","lat":24.98236,"lng":121.49279,"cat":"worship","desc":"妙清尼師在中和山上選定可遠眺觀音山的地方，開闢修行道場。寺院由最初的功德堂起步，以山石砌牆，歷經數十年才完成大雄寶殿。","area":"中和區・新北市","ph":"觀"},{"id":2052,"name":"海山神社殘蹟","lat":25.004727,"lng":121.478904,"cat":"history","tag":"古蹟","desc":"中和外員山的神社建於一九三八年，反映日治末期推動皇民化的歷史。如今可見洗石子階梯、平台，以及兩處鳥居的柱礎。","area":"中和區・新北市","ph":"文"},{"id":2053,"name":"烘爐地南山福德宮","lat":24.97186,"lng":121.49767,"cat":"worship","desc":"烘爐地的土地公廟坐落在南勢角山上，許多信眾為祈求財運而來。約三百公尺高的山地視野開闊，入夜後也能眺望大臺北燈火。","area":"中和區・新北市","ph":"觀"},{"id":2054,"name":"白馬寺","lat":24.97849,"lng":121.4947,"cat":"worship","desc":"中和白馬寺由達悟、敬定兩位尼師率眾開山，最初借用信眾的三間房舍修行。寺名紀念洛陽白馬寺，殿內主祀釋迦牟尼佛。","area":"中和區・新北市","ph":"觀"},{"id":2055,"name":"華新街(緬甸街)","lat":24.9838,"lng":121.5082,"cat":"other","desc":"南勢角的華新街又稱緬甸街，許多緬甸華僑與雲南移民家庭在此落腳。街邊飲食延續雲南和緬甸的烹調手法，成為認識社區的入口。","area":"中和區・新北市","ph":"觀"},{"id":2056,"name":"錦和運動公園","lat":24.99292,"lng":121.48865,"cat":"nature","desc":"中和的運動公園以四百公尺跑道和大片草坪為中心，也是地方舉辦大型節慶的場地。除了籃球、網球與壘球場，園內還有噴泉和登山步道。","area":"中和區・新北市","ph":"觀"},{"id":2057,"name":"五股夏綠地","lat":25.08204,"lng":121.43974,"cat":"nature","desc":"五股原本堆置垃圾的土地經環境整頓後，成了大片草地。園區內也設有資源循環教育基地，將回收物處理與環境教育放在一起。","area":"五股區・新北市","ph":"觀"},{"id":2058,"name":"五股智光禪寺","lat":25.09637,"lng":121.41927,"cat":"worship","desc":"五股山間的智光禪寺，原本只是一座供在家人修持的小佛堂。後來由如學法師主持寺務，如今寺院堂宇寬廣，周圍草木茂盛。","area":"五股區・新北市","ph":"觀"},{"id":2059,"name":"五股西雲寺","lat":25.096591,"lng":121.445935,"cat":"worship","tag":"古蹟","desc":"這座五股古寺早年稱為大士觀，供奉觀世音菩薩。地方又叫它「外巖」，與觀音山上同樣奉祀觀音、被稱作「內巖」的凌雲禪寺呼應。","area":"五股區・新北市","ph":"文"},{"id":2060,"name":"水碓觀景公園","lat":25.07365,"lng":121.42868,"cat":"nature","desc":"公園順著山坡地形規劃成好幾層森林步道，各層之間以階梯相連。沿路拾級而上，林間能聽蟲鳴鳥叫，也有機會看見蝴蝶。","area":"五股區・新北市","ph":"觀"},{"id":2061,"name":"疏洪生態公園","lat":25.09816,"lng":121.45659,"cat":"nature","desc":"退水後裸露的河灘，是五股疏洪生態公園觀察水鳥覓食的地方。遠看像小石子的灘面上，近看其實有臺灣泥蟹、萬歲大眼蟹與彈塗魚活動。","area":"五股區・新北市","ph":"觀"},{"id":2062,"name":"硬漢嶺","lat":25.12842,"lng":121.42425,"cat":"scenic","desc":"淡水河左岸的觀音山以硬漢嶺為最高峰，海拔六百一十六公尺。海洋水氣隨季風聚在山嶺，形成地方稱為「坌嶺吐霧」的雲霧景觀。","area":"五股區・新北市","ph":"觀"},{"id":2063,"name":"硬漢嶺","lat":25.13549,"lng":121.4251,"cat":"other","desc":"觀音山最高處的硬漢嶺，名字與昔日憲兵學校在此訓練有關。步道多為石階，順著較陡的山坡一路爬升，呈現山嶺的起伏。","area":"五股區・新北市","ph":"觀"},{"id":2064,"name":"蘆堤寵物公園","lat":25.08736,"lng":121.45448,"cat":"nature","desc":"微風運河旁的寵物公園以大片草地分設大犬、小犬活動區，也備有寵物遊具。飼主可在座椅區看河景，晴天還能見到有人在運河划艇。","area":"五股區・新北市","ph":"觀"},{"id":2065,"name":"觀音山猛禽展示館","lat":25.12944,"lng":121.418,"cat":"culture","desc":"觀音山遊客中心旁的展示館，專門介紹山區的猛禽和自然生態。地形模型、生態模型與互動影像相互搭配，讓人從不同角度觀察猛禽。","area":"五股區・新北市","ph":"觀"},{"id":2066,"name":"觀音山遊客中心","lat":25.12955,"lng":121.41822,"cat":"other","desc":"紅瓦白牆的遊客中心坐落在觀音山群峰間，館內展示地方步道和猛禽資料。人文展覽也介紹周邊遺址與出土陶器，帶出山區的史前活動。","area":"五股區・新北市","ph":"觀"},{"id":2067,"name":"下罟子漁港","lat":25.14275,"lng":121.38104,"cat":"other","desc":"大船往來的臺北港裡，還藏著一處較安靜的小漁港。下罟子漁港停泊著淡水、桃園等地的作業漁船，也是八里左岸自行車道的一端。","area":"八里區・新北市","ph":"觀"},{"id":2068,"name":"八里(渡船頭)老街","lat":25.15844,"lng":121.4347,"cat":"structure","desc":"淡水河口左岸的八里，清代曾與福建福州、泉州通商，後因航道淤積而逐漸轉變。如今渡船頭老街沿河聚集小吃攤、餐館與綠地。","area":"八里區・新北市","ph":"觀"},{"id":2069,"name":"八里十三行文化公園","lat":25.16486,"lng":121.41163,"cat":"nature","desc":"十三行博物館旁的文化公園，把考古意象融入兒童共融遊戲場。草坡上三道陶罐造型溜滑梯彎曲並排，呼應八里的遺址與器物。","area":"八里區・新北市","ph":"觀"},{"id":2070,"name":"八里商港公園","lat":25.15031,"lng":121.40018,"cat":"nature","desc":"八里商港旁的公園以鯨魚為主題，把磨石子溜滑梯、盪鞦韆和攀岩石融進海洋造景。遊戲區也安排無障礙通道，供輪椅使用者參與。","area":"八里區・新北市","ph":"觀"},{"id":2071,"name":"八里國民小學紅磚教室","lat":25.14947,"lng":121.403387,"cat":"history","tag":"歷史建築","area":"八里區・新北市","ph":"文"},{"id":2072,"name":"八里大眾廟","lat":25.158927,"lng":121.433613,"cat":"worship","tag":"歷史建築","area":"八里區・新北市","ph":"文"},{"id":2073,"name":"八里左岸公園","lat":25.16083,"lng":121.43001,"cat":"nature","desc":"八里左岸這座河濱公園原名西門河濱公園，沿淡水河畔展開。觀音山與寬闊河面成了眼前的背景，傍晚還可留意水邊的夕色。","area":"八里區・新北市","ph":"觀"},{"id":2074,"name":"八里左岸漫步廣場","lat":25.16227,"lng":121.42683,"cat":"nature","desc":"八里左岸原來的水興公園，改用河畔既有的丘、谷、樹林、碉堡與海潮作為設計元素。休憩設施與拓寬的自行車道，串出散步的廣場。","area":"八里區・新北市","ph":"觀"},{"id":2075,"name":"八里樂山園","lat":25.128643,"lng":121.393604,"cat":"history","tag":"歷史建築","desc":"為了照護臺灣的漢生病患者，加拿大籍醫師戴仁壽與長老教會人士推動在八里設立樂山園。園區也見證了近代漢生病防治知識傳入臺灣的歷程。","area":"八里區・新北市","ph":"文"},{"id":2076,"name":"八里水上運動中心","lat":25.16306,"lng":121.42194,"cat":"other","desc":"河岸邊的八里風帆碼頭原為帆船運動而建，後來成為水上運動中心。除了欣賞水面上的風帆，這裡也是人們跟著教練學習帆船的地方。","area":"八里區・新北市","ph":"觀"},{"id":2077,"name":"八里渡船頭公園","lat":25.15755,"lng":121.4338,"cat":"nature","desc":"八里渡船頭的共融遊戲場從河岸生態取材，把彈塗魚放大成攀爬網。沙坑、波浪岩牆與彈跳床共同拼出章魚造型，俯瞰時尤其清楚。","area":"八里區・新北市","ph":"觀"},{"id":2078,"name":"新北市立十三行博物館","lat":25.15688,"lng":121.40485,"cat":"culture","desc":"十三行博物館為保存八里的十三行遺址而興建，是以考古為主題的博物館。遺址的發現與飛機羅盤出現異常有關，後來由學者實地探勘確認。","area":"八里區・新北市","ph":"觀"},{"id":2079,"name":"柚花香道","lat":25.14154,"lng":121.39959,"cat":"other","desc":"三月的八里荖阡坑路以柚花香氣為特色，成了一條季節性的花道。山海之間的小路氣氛寧靜，沿途也散布著地方餐館與景點。","area":"八里區・新北市","ph":"觀"},{"id":2080,"name":"樂福卡丁小型賽車場","lat":25.14211,"lng":121.39797,"cat":"other","desc":"八里的小型賽車場設有約四百公尺長的跑道，提供卡丁車體驗。場邊室內休息空間開著大片景觀窗，可以在窗前欣賞場地風景。","area":"八里區・新北市","ph":"觀"},{"id":2081,"name":"永續環境教育中心","lat":25.16072,"lng":121.43028,"cat":"scenic","desc":"新北市為推動長期的環境教育、保育與研究，在二〇〇八年設立這座中心。氣候變遷、全球暖化與節能減碳，都是中心關注的主題。","area":"八里區・新北市","ph":"觀"},{"id":2082,"name":"觀海長堤","lat":25.16897,"lng":121.41664,"cat":"scenic","desc":"挖仔尾潟湖末端的長堤面向淡水河出海口，可以看見八里與對岸的漁人碼頭。沿堤走到河海相接處，能觀浪、賞鳥，也能望向兩岸景色。","area":"八里區・新北市","ph":"觀"},{"id":2083,"name":"關渡大橋","lat":25.1257,"lng":121.45746,"cat":"other","desc":"一九八三年完工的關渡大橋，以全焊接鋼拱跨越淡水河，連起八里與關渡。大橋距出海口約六公里，是河面上一處醒目的工程地景。","area":"八里區・新北市","ph":"觀"},{"id":2084,"name":"土城區原住民族生態公園","lat":24.95293,"lng":121.42953,"cat":"nature","desc":"土城永寧路的原住民族生態公園，前身是海山煤礦。昔日許多原住民族人離鄉來此採礦，這片舊址留下了他們工作與生活的故事。","area":"土城區・新北市","ph":"觀"},{"id":2085,"name":"土城媽祖田運動公園","lat":24.96669,"lng":121.42038,"cat":"worship","desc":"媽祖田的運動公園有開闊綠地，騎單車的空間與機車道分開。草地周圍設有座椅，適合騎車後歇腳，也能慢慢欣賞河畔的景色。","area":"土城區・新北市","ph":"觀"},{"id":2086,"name":"土城廣承岩寺","lat":24.9727,"lng":121.4442,"cat":"worship","desc":"廣欽老和尚的弟子傳斌法師，是這座土城寺院的首任住持。寺院創建於一九六九年，曾依山勢擴建，後因道路拓寬而改建成樓房。","area":"土城區・新北市","ph":"觀"},{"id":2087,"name":"土城彈藥庫","lat":24.96481,"lng":121.44698,"cat":"other","desc":"天上山系北麓的舊彈藥庫長年受到軍事管制，意外保留了自然環境。軍方開始遷移後，部分土地逐步開放，也出現讓居民接觸蔬果的自然教室。","area":"土城區・新北市","ph":"觀"},{"id":2088,"name":"土城普安堂","lat":24.943498,"lng":121.41647,"cat":"worship","tag":"歷史建築","area":"土城區・新北市","ph":"文"},{"id":2089,"name":"土城藝文館","lat":24.97315,"lng":121.4432,"cat":"culture","desc":"土城區公所在二〇〇七年成立藝文館，提供藝術創作者發表作品的空間。兩層樓的館舍以展覽連結社區，也讓居民在日常生活中接近藝術。","area":"土城區・新北市","ph":"觀"},{"id":2090,"name":"太極嶺","lat":24.95414,"lng":121.46361,"cat":"scenic","desc":"土城冷水坑休閒公園裡的太極嶺步道，鄰近清幽的山中湖。文筆山、將軍嶺和五城山等步道在附近交會，形成居民熟悉的山林休憩區。","area":"土城區・新北市","ph":"觀"},{"id":2091,"name":"斬龍山遺址文化公園","lat":24.97878,"lng":121.45102,"cat":"nature","area":"土城區・新北市","ph":"觀"},{"id":2092,"name":"桐花公園","lat":24.94622,"lng":121.45188,"cat":"nature","desc":"土城天上山山腰的公園坐落山谷間，兩側是南天母山與火燄山。沿石壁寮溪的木棧道順著地形上行，可以親近溪水與山林。","area":"土城區・新北市","ph":"觀"},{"id":2093,"name":"九芎根親水公園","lat":24.87866,"lng":121.66281,"cat":"nature","desc":"金瓜寮溪的水沿人工渠道引入園內，步道、池塘與涼亭點綴其間。到了夏季，九芎根的水邊還有機會看見螢火蟲飛舞。","area":"坪林區・新北市","ph":"觀"},{"id":2094,"name":"坪林尾橋","lat":24.934722,"lng":121.711456,"cat":"history","tag":"古蹟","desc":"早年因製藍與茶業而發展的坪林尾聚落，留有一座石砌基礎的橋。橋墩下段呈六角形，兩側欄杆還可以看見成排的圓拱形開口。","area":"坪林區・新北市","ph":"文"},{"id":2095,"name":"坪林生態園區","lat":24.93469,"lng":121.71337,"cat":"culture","desc":"坪林茶業博物館旁的花園依原有山勢規劃，還保留多處原始林區。依山傍水的園地裡，景觀設施與原生植被交錯分布。","area":"坪林區・新北市","ph":"觀"},{"id":2096,"name":"坪林石雕公園","lat":24.93508,"lng":121.71076,"cat":"nature","desc":"石雕公園背靠源茂山、前臨北勢溪，入口立著寓意飲水思源的九龍球。園內散布以茶文化為題的石雕，沿景觀步道還能欣賞季節花卉。","area":"坪林區・新北市","ph":"觀"},{"id":2097,"name":"坪林老街","lat":24.93639,"lng":121.712,"cat":"structure","desc":"以保坪宮為中心，短短一段老街上就有茶莊、糊紙店、豆腐攤和雜貨行。包種茶產業與居民的日常買賣，在這裡並肩延續。","area":"坪林區・新北市","ph":"觀"},{"id":2098,"name":"坪林親水吊橋","lat":24.93501,"lng":121.70408,"cat":"other","desc":"橫跨北勢溪的親水吊橋，以「雙龍合抱，共佑坪林」為設計構想。橋面連接兩岸觀魚步道，也讓茶業博物館與街區有了水上的連結。","area":"坪林區・新北市","ph":"觀"},{"id":2099,"name":"新北市坪林茶業博物館","lat":24.93443,"lng":121.713,"cat":"culture","desc":"北勢溪畔的茶業博物館採閩南安溪式四合院，搭配江南庭園景致。館內以主題展覽、體驗空間和茶藝教室，介紹臺灣茶產業與文化。","area":"坪林區・新北市","ph":"觀"},{"id":2100,"name":"粗石斛吊橋","lat":24.95255,"lng":121.74959,"cat":"other","desc":"北勢溪上游的藍色吊橋，把兩岸山林與大舌湖一帶連了起來。橋上可往下觀察溪魚游動，也是坪林幾座具代表性的新式吊橋之一。","area":"坪林區・新北市","ph":"觀"},{"id":2101,"name":"虎寮潭","lat":24.94828,"lng":121.73946,"cat":"other","desc":"從虎寮潭吊橋望向北勢溪，可見一列列像犬齒的砂岩。傾斜岩層經溪水沖刷後，較脆弱的頁岩先崩解，留下這片鋸齒狀河床。","area":"坪林區・新北市","ph":"觀"},{"id":2102,"name":"虎寮潭吊橋","lat":24.95035,"lng":121.74071,"cat":"other","desc":"吊橋橫在群山環繞的虎寮潭上，可以聽見北勢溪水聲。碧綠的溪潭旁突出稜角鮮明的岩石，低頭還有機會看見魚群游過。","area":"坪林區・新北市","ph":"觀"},{"id":2103,"name":"觀音臺","lat":24.93933,"lng":121.71246,"cat":"other","desc":"坪林國中後方山頂原是日治時期的神社，後來改建為觀音臺。圓形廣場中央的青銅觀音像坐在蓮花座上，面向南方的層層山巒。","area":"坪林區・新北市","ph":"觀"},{"id":2104,"name":"金溪駐在所","lat":24.91594,"lng":121.68187,"cat":"other","desc":"金瓜寮溪畔的金溪駐在所，是坪林茶鄉留下的日治時期警察機構。附近溪流與步道以觀魚和賞蕨聞名，與老駐在所同在這片山谷間。","area":"坪林區・新北市","ph":"觀"},{"id":2105,"name":"金瓜寮茶香生態村","lat":24.91844,"lng":121.68116,"cat":"other","desc":"金瓜寮溪畔的村落長年以種茶、製茶維生，因此得名茶香生態村。當地的茶園也是認識坪林文山包種茶與北部茶鄉生活的地方。","area":"坪林區・新北市","ph":"觀"},{"id":2106,"name":"十分瀑布公園","lat":25.04897,"lng":121.78746,"cat":"nature","desc":"基隆河主流流經十分，在河谷切出斷層、奇岩和瀑布。除了寬闊的十分瀑布，附近還能看見四廣潭的壺穴與眼鏡洞瀑布。","area":"平溪區・新北市","ph":"觀"},{"id":2107,"name":"十分老街","lat":25.04269,"lng":121.77667,"cat":"structure","desc":"當年為運煤而建的平溪線沿基隆河谷前行，到了十分，鐵軌就貼著住家與商店。列車慢慢穿過街中央，成為老街獨特的生活景象。","area":"平溪區・新北市","ph":"觀"},{"id":2108,"name":"十分車站","lat":25.04099,"lng":121.77501,"cat":"other","desc":"平溪線的十分車站保留了獨特的鐵道景象。列車停靠時，司機員交換銅製路牌，這塊老式通行證代表列車獲准駛進下一路段。","area":"平溪區・新北市","ph":"觀"},{"id":2109,"name":"大華壺穴","lat":25.05346,"lng":121.80194,"cat":"scenic","desc":"平溪至三貂嶺一帶的基隆河谷，除了瀑布，河床上還散布著許多坑洞。這些坑洞輪廓圓滑，在地形學上有個名字叫作壺穴。","area":"平溪區・新北市","ph":"觀"},{"id":2110,"name":"大華車站","lat":25.04982,"lng":121.79794,"cat":"other","desc":"大華是平溪支線上的小站，所在線路原由臺陽礦業為運煤而建。煤業退去後，這條一度面臨廢棄的支線轉成旅人探訪山城的鐵道。","area":"平溪區・新北市","ph":"觀"},{"id":2111,"name":"嶺腳車站","lat":25.03012,"lng":121.7481,"cat":"other","desc":"平溪線上的嶺腳車站位在姜子寮山南方，地方也因處於山嶺之下而得名。附近的嶺腳瀑布與山間鐵道，共同構成聚落風景。","area":"平溪區・新北市","ph":"觀"},{"id":2112,"name":"平溪公園頂歷史建築群","lat":25.034598,"lng":121.75374,"cat":"nature","tag":"歷史建築","desc":"平溪車站一帶在日治時期曾是行政中心，公園頂保留昭和橋和防空洞等遺構。橫越水池的小橋採洗石子表面，欄杆可見瓶形立柱。","area":"平溪區・新北市","ph":"文"},{"id":2113,"name":"平溪區竿蓁坑古道","lat":24.988819,"lng":121.735274,"cat":"history","tag":"文化景觀","area":"平溪區・新北市","ph":"文"},{"id":2114,"name":"平溪南無大悲救苦觀世音菩薩碣","lat":25.040324,"lng":121.744262,"cat":"history","tag":"古蹟","area":"平溪區・新北市","ph":"文"},{"id":2115,"name":"平溪嶺腳蔡家紅磚洋樓","lat":25.030891,"lng":121.748712,"cat":"history","tag":"古蹟","desc":"嶺腳車站後方的蔡家洋樓有一片開闊庭院，由成排圓拱騎樓襯著紅磚立面。陽臺和山牆的磚砌氣窗，還可細看不同形狀的鏤空。","area":"平溪區・新北市","ph":"文"},{"id":2116,"name":"平溪灰窯","lat":25.021412,"lng":121.769199,"cat":"history","tag":"歷史建築","area":"平溪區・新北市","ph":"文"},{"id":2117,"name":"平溪石底橋","lat":25.02467,"lng":121.73876,"cat":"other","desc":"平溪老街位在三坑溪與基隆河交會處，石底橋是商圈裡醒目的景點。橋上的彩虹鳥居與發光小天燈，讓夜間的河畔有了不同景色。","area":"平溪區・新北市","ph":"觀"},{"id":2118,"name":"平溪老街","lat":25.02533,"lng":121.73882,"cat":"structure","desc":"依著斜坡和鐵道興建的老房子，串起平溪的街市。傳統柑仔店、五金行與小吃店之間，也有電影《那些年，我們一起追的女孩》的天燈取景地。","area":"平溪區・新北市","ph":"觀"},{"id":2119,"name":"平溪車站","lat":25.02557,"lng":121.74005,"cat":"other","desc":"山城的這座車站位在昔日石底線上，鐵路原先專為礦場運煤。煤礦陸續關閉後，地方人士爭取留下鐵路，如今車站和天燈都成了平溪風景。","area":"平溪區・新北市","ph":"觀"},{"id":2120,"name":"平溪頌德碑","lat":25.02557,"lng":121.738237,"cat":"history","tag":"歷史建築","area":"平溪區・新北市","ph":"文"},{"id":2121,"name":"新平溪煤礦博物園區","lat":25.05245,"lng":121.77325,"cat":"culture","desc":"新平溪煤礦在原礦區設立博物園區，保存採礦設施與開採相關書件。從礦場到運煤的平溪線，能看出當年煤業如何形塑地方發展。","area":"平溪區・新北市","ph":"觀"},{"id":2122,"name":"新平溪煤礦歷史建築群","lat":25.05232,"lng":121.773314,"cat":"history","tag":"歷史建築","area":"平溪區・新北市","ph":"文"},{"id":2123,"name":"望古瀑布","lat":25.03488,"lng":121.7588,"cat":"scenic","desc":"平溪支線旁的溪谷裡藏著瀑布，木棧階梯與山腰步道通向水邊。附近的慶和吊橋遺跡，則留下望古曾因採煤興盛的痕跡。","area":"平溪區・新北市","ph":"觀"},{"id":2124,"name":"望古車站","lat":25.03451,"lng":121.76375,"cat":"other","desc":"早年為運送慶和煤礦而設的小站，最初就叫慶和車站。隨著礦業衰退，礦工進出的景象逐漸消失，留下今日安靜的望古小站。","area":"平溪區・新北市","ph":"觀"},{"id":2125,"name":"紫東社區(平溪區農會東勢生態教育會館)","lat":25.00211,"lng":121.74657,"cat":"other","desc":"平溪東勢里的紫東社區是山谷茶村，耕地不多，林木與水源卻相當豐富。聚落保留石頭古厝和古道，生態教育會館也在這裡。","area":"平溪區・新北市","ph":"觀"},{"id":2126,"name":"臺陽礦業公司平溪招待所","lat":25.022536,"lng":121.722198,"cat":"history","tag":"古蹟","desc":"菁桐坑開採石底煤礦時，臺陽礦業公司在平溪興建招待所。這處產業建築見證原本以務農為主的山村，因採煤而吸引各地人口進駐。","area":"平溪區・新北市","ph":"文"},{"id":2127,"name":"菁桐煤礦紀念公園","lat":25.02484,"lng":121.72446,"cat":"nature","desc":"菁桐車站上方的捨石山，其實是洗煤時剔出的廢石日積月累堆成的山丘。如今山上植物茂密，公園裡仍可見石塊砌成的舊礦坑口。","area":"平溪區・新北市","ph":"觀"},{"id":2128,"name":"菁桐礦業生活館","lat":25.02396,"lng":121.72429,"cat":"culture","desc":"舊臺鐵員工宿舍經整修成為生活館，展示菁桐煤礦興盛到停採的經過。周圍的車站、選洗煤場和招待所，都是山城留下的產業遺跡。","area":"平溪區・新北市","ph":"觀"},{"id":2129,"name":"菁桐老街","lat":25.02378,"lng":121.72329,"cat":"structure","desc":"從菁桐的日式木造車站旁望去，老街沿途可見寫下願望的竹筒。街尾則立著一座天燈造型的建築，將平溪祈福文化帶進街景。","area":"平溪區・新北市","ph":"觀"},{"id":2130,"name":"菁桐車站","lat":25.023874,"lng":121.723921,"cat":"history","tag":"古蹟","desc":"菁桐街上的車站與煤運有深厚淵源，平溪線前身是礦業公司興建的鐵路。日治時期鐵道部收購部分路線後，於一九二九年興建車站。","area":"平溪區・新北市","ph":"文"},{"id":2131,"name":"菁桐鐵道故事館","lat":25.02381,"lng":121.72343,"cat":"culture","desc":"菁桐老街上的鐵道故事館由鐵道迷何元富創立。館舍以兩層木屋模仿民國五十年代的建築風貌，在平溪線終點保留懷舊氣氛。","area":"平溪區・新北市","ph":"觀"},{"id":2132,"name":"菁桐電子天燈館","lat":25.02336,"lng":121.72252,"cat":"culture","desc":"菁桐老街尾端立著一座像大型天燈的建築，把平溪的祈福習俗化成山城地標。入夜後外牆亮起燈光，彷彿天燈留在街上發光。","area":"平溪區・新北市","ph":"觀"},{"id":2133,"name":"觀音巖警報鐘亭","lat":25.02581,"lng":121.73772,"cat":"worship","desc":"石底里後山坡地上的警哨亭，建於第二次世界大戰末期。當年日方為了在空襲期間監測警戒，維持煤礦和運煤鐵路的運作而設置。","area":"平溪區・新北市","ph":"觀"},{"id":2134,"name":"靜安吊橋","lat":25.04129,"lng":121.77616,"cat":"other","desc":"十分里與南山里之間的吊橋，最初為煤礦運送而設。礦業停採後改為行人使用，今天仍是十分老街與車站附近醒目的地標。","area":"平溪區・新北市","ph":"觀"},{"id":2135,"name":"二叭子植物園","lat":24.93827,"lng":121.50072,"cat":"nature","desc":"這座植物園同時保留天然林與次生林，從喬木、灌木到地面草花都有。順著登山步道，可認識暱稱「江某」、「山豬肉」等有趣的植物。","area":"新店區・新北市","ph":"觀"},{"id":2136,"name":"十四張歷史公園","lat":24.97937,"lng":121.52827,"cat":"nature","area":"新店區・新北市","ph":"觀"},{"id":2137,"name":"國家人權博物館白色恐怖景美紀念園區","lat":24.9881,"lng":121.53227,"cat":"culture","desc":"景美紀念園區前身是軍事看守所，戒嚴時期許多政治受難者曾在此遭羈押與審判。園內保留不義遺址與人權紀念碑，供人回望白色恐怖歷史。","area":"新店區・新北市","ph":"觀"},{"id":2138,"name":"太平宮","lat":24.95915,"lng":121.53303,"cat":"worship","desc":"碧潭西岸安坑社區的太平宮，從清嘉慶年間便供奉開漳聖王。廟宇保有傳統閩南建築風貌，與附近的太平運動公園相鄰。","area":"新店區・新北市","ph":"觀"},{"id":2139,"name":"安坑孝女廖氏嬌紀念碑","lat":24.96153,"lng":121.513525,"cat":"history","tag":"古蹟","desc":"紀念碑上的廖氏嬌曾就讀安坑公學校，在日治時期因孝行受表揚。她的故事也留下女子得以就讀公學校及當時旌表制度的痕跡。","area":"新店區・新北市","ph":"文"},{"id":2140,"name":"安坑輕軌公共藝術","lat":24.98435,"lng":121.52759,"cat":"culture","desc":"安坑輕軌沿線車站展示多位藝術家的公共藝術，讓候車空間各有看點。金色列車則行經新店溪左岸與山城之間，窗外可望見陽光橋和安心橋。","area":"新店區・新北市","ph":"觀"},{"id":2141,"name":"安心橋","lat":24.98493,"lng":121.5244,"cat":"other","desc":"安坑輕軌以一座單塔非對稱斜張橋跨越新店溪，橋名為安心橋。高達一百三十公尺的橋塔與斜張鋼索，構成沿線醒目的輪廓。","area":"新店區・新北市","ph":"觀"},{"id":2142,"name":"小赤壁","lat":24.95743,"lng":121.53468,"cat":"other","desc":"新店溪西岸的溪谷經水流沖刷，露出相連的陡峭巨石。因地貌令人聯想到長江赤壁，文人又以蘇軾《赤壁賦》比擬，地方遂稱小赤壁。","area":"新店區・新北市","ph":"觀"},{"id":2143,"name":"新店二十張景美軍事看守所","lat":24.98793,"lng":121.533369,"cat":"history","tag":"歷史建築","desc":"新店二十張保留了景美軍事看守所，是臺灣白色恐怖時期的重要場所。許多政治案件交由軍法審判，這處遺址也留下自由與人權受侵害的歷史。","area":"新店區・新北市","ph":"文"},{"id":2144,"name":"新店十四張歷史建築園區","lat":24.98041,"lng":121.52747,"cat":"culture","desc":"十四張曾是新店溪中游的農業聚落，清代已有多個家族在此開墾。為配合捷運興建，散居各處的古厝遷入歷史公園西北角，集中保存。","area":"新店區・新北市","ph":"觀"},{"id":2145,"name":"新店和美煤礦","lat":24.95137,"lng":121.5357,"cat":"history","tag":"歷史建築","area":"新店區・新北市","ph":"文"},{"id":2146,"name":"新店安康接待室","lat":24.949711,"lng":121.490579,"cat":"history","tag":"古蹟","desc":"安康接待室於一九七四年啟用，曾作為政治與刑事案件的偵訊及羈押場所。美麗島事件等案件曾在此偵辦，留下威權時期的歷史見證。","area":"新店區・新北市","ph":"文"},{"id":2147,"name":"新店市屈尺道碣","lat":24.950166,"lng":121.536284,"cat":"history","tag":"歷史建築","area":"新店區・新北市","ph":"文"},{"id":2148,"name":"新店文史館","lat":24.96827,"lng":121.54307,"cat":"culture","desc":"馬公公園內的文史館收藏新店居民早年使用的生活物件。常設展從地方文獻和漳泉移民後裔的日常談起，另有更換主題的特展空間。","area":"新店區・新北市","ph":"觀"},{"id":2149,"name":"新店渡","lat":24.952251,"lng":121.538563,"cat":"history","tag":"文化景觀","desc":"新店溪的擺渡歷史可追溯到清光緒年間，上中游一度有九個渡口。如今新店渡仍以人力操舟，船夫與渡船本身就是這片文化景觀的核心。","area":"新店區・新北市","ph":"文"},{"id":2150,"name":"新店溪陽光橋","lat":24.97847,"lng":121.5214,"cat":"other","desc":"橫跨新店溪的陽光橋供行人與自行車使用，單拱肋斜鋼拱與琴弦般的鋼索共同支撐橋面。河中未設橋墩，夜間燈光則勾出橋體輪廓。","area":"新店區・新北市","ph":"觀"},{"id":2151,"name":"新店獅仔頭山隘勇線","lat":24.90272,"lng":121.501064,"cat":"history","tag":"古蹟","desc":"獅仔頭山一帶留有清代至日治時期設置隘勇線的歷史痕跡，與新店溪上游的開墾及原漢衝突有關。山中還可見坍塌石寮留下的片石牆基。","area":"新店區・新北市","ph":"文"},{"id":2152,"name":"新店老街","lat":24.95689,"lng":121.53706,"cat":"structure","desc":"碧潭吊橋東岸的新店路，清道光年間已形成街市。當年烏來、木柵、安坑與景美一帶的農產和日用品在此集散，借河運而繁盛。","area":"新店區・新北市","ph":"觀"},{"id":2153,"name":"新店胡璉將軍故居","lat":24.962416,"lng":121.526352,"cat":"history","tag":"歷史建築","desc":"安坑頂城的胡璉故居，庭院以草地、圓形花臺和弧形門廊組成。建築外牆的洗石子、簷下水泥花磚與不同時期的門窗，留下歷次改建痕跡。","area":"新店區・新北市","ph":"文"},{"id":2154,"name":"新店臺北菸廠鍋爐間及煙囪","lat":24.958638,"lng":121.508261,"cat":"history","tag":"古蹟","area":"新店區・新北市","ph":"文"},{"id":2155,"name":"水資源生態教育館","lat":24.90453,"lng":121.56253,"cat":"culture","area":"新店區・新北市","ph":"觀"},{"id":2156,"name":"潤濟宮","lat":24.95216,"lng":121.48709,"cat":"worship","desc":"安坑二城居民的信仰中心，主祀俗稱「三界公」的三官大帝。這座地方古廟除主神之外，也陪祀九天道祖與王天君。","area":"新店區・新北市","ph":"觀"},{"id":2157,"name":"瑠公圳引水石硿","lat":24.952174,"lng":121.539026,"cat":"history","tag":"古蹟","desc":"清代臺北盆地水田逐漸增加，郭錫瑠父子集眾開鑿灌溉圳道。留下的引水石硿，與當年把水引入農田、增加稻米生產的歷史相連。","area":"新店區・新北市","ph":"文"},{"id":2158,"name":"碧潭吊橋","lat":24.956257,"lng":121.535696,"cat":"history","tag":"古蹟","desc":"碧潭原是新店街區與安坑、廣興等聚落的分界。萬新鐵路通車後，河岸往來日益頻繁，地方發起建造吊橋，讓居民能在兩岸通行。","area":"新店區・新北市","ph":"文"},{"id":2159,"name":"碧潭堰","lat":24.96206,"lng":121.53656,"cat":"scenic","desc":"新店溪上的碧潭堰可追溯到清代瑠公圳引水工程，也讓上游形成今日碧潭的水面景觀。堰體曾在蘇迪勒颱風中受損，後來重新整建。","area":"新店區・新北市","ph":"觀"},{"id":2160,"name":"米靈岸音樂劇場","lat":24.96791,"lng":121.54075,"cat":"culture","desc":"「米靈岸」在排灣族語中有說故事的意思。劇場以排灣族歌聲和語言串起過去與現在，訴說祖靈、土地與人彼此疼惜的神話。","area":"新店區・新北市","ph":"觀"},{"id":2161,"name":"胡璉故居紀念館","lat":24.96221,"lng":121.52664,"cat":"culture","desc":"安坑的胡璉故居帶有現代主義風格，增建後形成曲折的平面配置。西側凸出的碉堡室令人聯想到金門碉樓，陽臺與屋簷則由懸臂梁承載。","area":"新店區・新北市","ph":"觀"},{"id":2162,"name":"花園新城","lat":24.93416,"lng":121.55105,"cat":"nature","desc":"依山而建的社區聚集文學和藝術創作者，地方協會也在此舉辦展覽與講座。春季油桐花落、蘭溪畔出現螢光時，社區曾舉辦花蟲季分享山林生態。","area":"新店區・新北市","ph":"觀"},{"id":2163,"name":"裕隆城","lat":24.97806,"lng":121.54648,"cat":"other","desc":"新店裕隆汽車舊廠址改建為大型購物中心，於二〇二三年開幕。原本的工業用地如今集合書店、影城與商場，呈現街區用途的轉變。","area":"新店區・新北市","ph":"觀"},{"id":2164,"name":"陀彌天 紫竹林寺","lat":24.91192,"lng":121.54694,"cat":"worship","desc":"新店燕子湖畔的現代寺院供奉彌勒尊佛，依山傍水。廟內彩繪玻璃與聖殿外的地磚出自抽象藝術家陳金龍之手，將藝術帶進宗教空間。","area":"新店區・新北市","ph":"觀"},{"id":2165,"name":"陳逢顯毫芒雕刻博物館","lat":24.96118,"lng":121.52497,"cat":"culture","desc":"藝術家陳逢顯以米雕、微型書和微小佛像見長，有些作品小到可放進針孔。館中除毫芒雕刻之外，也收藏他的素描與書法。","area":"新店區・新北市","ph":"觀"},{"id":2166,"name":"陽光運動園區","lat":24.97697,"lng":121.52029,"cat":"culture","desc":"新店溪畔的運動園區有直排輪競速場、田徑跑道、沙灘排球場與足球場。陽光橋和河濱自行車道串起綠地，親子也有共融遊戲空間。","area":"新店區・新北市","ph":"觀"},{"id":2168,"name":"國家電影及視聽文化中心","lat":25.05598,"lng":121.44742,"cat":"culture","desc":"這座中心承接國家電影資料館與國家電影中心的工作，負責典藏、研究和修復影視聽資產。透過推廣與公共化，讓珍藏的聲音和影像重回大眾視野。","area":"新莊區・新北市","ph":"觀"},{"id":2169,"name":"塭仔底溼地公園","lat":25.05579,"lng":121.45568,"cat":"nature","desc":"新莊副都心的濕地公園，以中港大排流域原有的沼澤地名為名。園內疊水區模仿自然溪流，搭配水生植物，兼具生態復育與滯洪功能。","area":"新莊區・新北市","ph":"觀"},{"id":2170,"name":"宏匯廣場","lat":25.05968,"lng":121.44957,"cat":"nature","desc":"新莊副都心的購物中心以生活百貨為主，也聚集各類休閒娛樂空間。樓內設有展演場館，讓購物商場同時成為音樂演出的地方。","area":"新莊區・新北市","ph":"觀"},{"id":2171,"name":"廣福宮(三山國王廟)","lat":25.035526,"lng":121.455298,"cat":"worship","tag":"古蹟","desc":"新莊路上的廣福宮由廣東移民於清乾隆年間捐建，俗稱三山國王廟。前往正殿可見三山國王，後殿則奉祀三山國王夫人。","area":"新莊區・新北市","ph":"文"},{"id":2172,"name":"後村圳灌溉改善工程紀念碑及水門","lat":24.997046,"lng":121.430202,"cat":"history","tag":"歷史建築","area":"新莊區・新北市","ph":"文"},{"id":2173,"name":"新莊嚴禁截流塞狹圳道碑記","lat":25.037841,"lng":121.459564,"cat":"history","tag":"歷史建築","area":"新莊區・新北市","ph":"文"},{"id":2174,"name":"新莊慈祐宮","lat":25.034376,"lng":121.452882,"cat":"worship","tag":"古蹟","desc":"新莊人也稱這座古廟為媽祖宮，清雍正年間重修時改名慈祐宮。曾是街上不起眼的小廟，後來隨新莊發展逐步擴建，成為地方信仰中心。","area":"新莊區・新北市","ph":"文"},{"id":2175,"name":"新莊挑水巷隘門","lat":25.034209,"lng":121.451423,"cat":"structure","tag":"歷史建築","area":"新莊區・新北市","ph":"文"},{"id":2176,"name":"新莊文昌祠","lat":25.034509,"lng":121.454984,"cat":"worship","tag":"古蹟","desc":"新莊的文昌帝君原先陪祀在慈祐宮，清嘉慶年間重修慈祐宮後，地方以餘款另建文昌廟。獨立的文昌信仰空間由此發展。","area":"新莊區・新北市","ph":"文"},{"id":2177,"name":"新莊晶冠廣場","lat":25.064,"lng":121.45894,"cat":"nature","desc":"五股與新莊交界的複合商場，把餐廳、影城、會館與飯店安排在同一處。建築外觀較為低調，室內則提供不同類型的休閒空間。","area":"新莊區・新北市","ph":"觀"},{"id":2178,"name":"新莊樂生療養院","lat":25.022155,"lng":121.409103,"cat":"history","tag":"歷史建築","desc":"一九三〇年成立的療養院，是日治時期強制隔離漢生病患者的場所。院內曾有醫療、起居與信仰等不同空間，記錄患者長期生活的歷史。","area":"新莊區・新北市","ph":"文"},{"id":2179,"name":"新莊武德殿","lat":25.035045,"lng":121.453169,"cat":"worship","tag":"歷史建築","desc":"日治時期的演武場所採和洋折衷風格，以清水磚砌成承重牆。入口馬鞍形破風下立著仿西式柱，洗石子門楣與窗楣呈現仿石質感。","area":"新莊區・新北市","ph":"文"},{"id":2180,"name":"新莊武聖廟","lat":25.033612,"lng":121.450164,"cat":"worship","tag":"古蹟","desc":"新莊早期發展成物產集散地，地方廟宇也負起居民自治與自衛的作用。武聖廟便是其中之一，日後逐漸成為社區寄託信仰的場所。","area":"新莊區・新北市","ph":"文"},{"id":2181,"name":"新莊水道記碑","lat":25.040755,"lng":121.399102,"cat":"history","tag":"古蹟","area":"新莊區・新北市","ph":"文"},{"id":2182,"name":"新莊潮江寺","lat":25.032979,"lng":121.451498,"cat":"worship","tag":"歷史建築","desc":"潮江寺於一九三三年重修後成為兩層樓建築，正面兼具閩南、日式與西式元素。二樓露臺有花瓶形欄杆，牌樓中央嵌著泥塑寺名。","area":"新莊區・新北市","ph":"文"},{"id":2183,"name":"新莊青年公園(牡丹心生態公園)","lat":25.031,"lng":121.40979,"cat":"nature","desc":"十八份坑溪與啞口坑溪之間的公園，順著牡丹山系地形闢建。入口綠色隧道與山坡上的楓香相連，稜線步道旁則種有杜鵑、櫻花。","area":"新莊區・新北市","ph":"觀"},{"id":2184,"name":"新莊體育園區","lat":25.04138,"lng":121.44644,"cat":"culture","desc":"新莊市區的體育園區集合多種運動場地，平時也是附近居民休閒的地方。多功能場館除體育競賽，也供音樂演出、展覽與大型集會使用。","area":"新莊區・新北市","ph":"觀"},{"id":2167,"name":"響仁和鐘鼓廠","lat":25.0364,"lng":121.45428,"cat":"other","desc":"新莊戲班和廟會興盛，催生了地方製鼓業。阿塗師王桂枝創辦鐘鼓廠，由長子王錫坤接下製鼓手藝，鼓聲也連著新莊的表演傳統。","area":"新莊區・新北市","ph":"觀"},{"id":2185,"name":"願景館","lat":25.05992,"lng":121.45028,"cat":"culture","desc":"中港大排前端的願景館，是整治工程進行時一併興建的展館。館內介紹中港大排的工程與水利資訊，讓居民了解水道如何改造。","area":"新莊區・新北市","ph":"觀"},{"id":2186,"name":"台北放送局板橋放送所","lat":25.007454,"lng":121.464811,"cat":"culture","tag":"古蹟","desc":"板橋平原較高起的地點，日治時期被選作廣播放送所。建築在一九三〇年完工，次年啟用，地方耆老記得選址與有利播音電波傳送有關。","area":"板橋區・新北市","ph":"文"},{"id":2187,"name":"山宛然客家布袋戲團","lat":25.02183,"lng":121.47554,"cat":"other","desc":"黃武山在二〇〇二年創立劇團，將向陳錫煌、李傳燦學來的布袋戲與客家文化結合。他也曾向賴碧霞學山歌，為傳統掌中戲帶入客家聲音。","area":"板橋區・新北市","ph":"觀"},{"id":2188,"name":"府中15新北市動畫故事館暨新北市紀錄片放映院","lat":25.00939,"lng":121.45962,"cat":"culture","desc":"板橋府中的主題館把動畫藝術與紀錄片放映安排在同一棟建築。地下放映院播映紀錄片和藝術電影，也曾為視障觀眾與親子等族群規劃專場。","area":"板橋區・新北市","ph":"觀"},{"id":2189,"name":"接雲寺","lat":25.0089,"lng":121.45442,"cat":"worship","desc":"板橋西門街的觀音廟承繼中和石壁湖慈雲巖的香火。清咸豐年間由林國芳迎往板橋，幾經遷移後在現址建廟，成為地方信仰中心。","area":"板橋區・新北市","ph":"觀"},{"id":2190,"name":"新北市市民廣場","lat":25.0129,"lng":121.46529,"cat":"nature","desc":"新北市政府前的開闊廣場，南有舞臺、北有綠竹筍地標，兩側由花園和空橋圍合。平日可在廣場歇腳，也是市府舉辦活動的場地。","area":"板橋區・新北市","ph":"觀"},{"id":2191,"name":"新北市政府景觀瞭望台","lat":25.01224,"lng":121.46554,"cat":"other","desc":"新板特區的市府大樓樓高三十三層，觀景台設在接近頂樓的三十二樓。從市政建築的高處向外望，可以將周遭城市景觀收進眼底。","area":"板橋區・新北市","ph":"觀"},{"id":2192,"name":"新北市立圖書館","lat":25.00149,"lng":121.45515,"cat":"culture","desc":"從外頭看，新北市圖總館像一座堆疊著書本的大書架。建築採綠能設計，館內兼有傳統閱覽服務與數位資訊設備。","area":"板橋區・新北市","ph":"觀"},{"id":2193,"name":"新北市藝文中心","lat":25.02611,"lng":121.47234,"cat":"culture","desc":"從臺北縣立文化中心走來的藝文中心，原以各地鄉土文化為展示重點。如今館內不同空間供藝術家與團體展演，也承擔圖書資訊和社會教育功能。","area":"板橋區・新北市","ph":"觀"},{"id":2194,"name":"新北市輪椅夢公園","lat":24.98118,"lng":121.42758,"cat":"nature","desc":"板樹體育園區內的輪椅夢公園，於二〇二〇年啟用。園區在民間團體與各界協助下，引進供身障者使用的運動器材，讓輪椅運動有了專屬空間。","area":"板橋區・新北市","ph":"觀"},{"id":2195,"name":"新月橋","lat":25.02733,"lng":121.45314,"cat":"other","desc":"跨越大漢溪的鋼拱橋，將板橋藝文特區與新莊老街連在一起。橋上行人與單車各有空間，白天可看河岸濕地，入夜後則有橋身燈光。","area":"板橋區・新北市","ph":"觀"},{"id":2196,"name":"板樹體育館","lat":24.98125,"lng":121.42767,"cat":"culture","desc":"板橋與樹林交界的體育館於二〇〇一年落成，主場館分成三層使用空間。除羽球、網球與籃球的綜合場地，也有桌球、韻律及跆拳教室。","area":"板橋區・新北市","ph":"觀"},{"id":2197,"name":"板橋慈惠宮","lat":25.0094,"lng":121.45743,"cat":"worship","desc":"板橋鬧區的傳統媽祖廟夾在民宅之間，曾是舊擺接堡十七大庄的媽祖信仰中心。地方將慈惠宮與接雲寺等並稱擺接堡五大廟。","area":"板橋區・新北市","ph":"觀"},{"id":2198,"name":"板橋放送所 傳奇放送科藝文創園區","lat":25.00767,"lng":121.46458,"cat":"culture","desc":"板橋放送所由總督府技師栗山俊一設計，立面以水平線條和弧線表現現代主義風格。中空牆壁與防暑空心磚，則是為了讓室內保持通風涼爽。","area":"板橋區・新北市","ph":"觀"},{"id":2199,"name":"板橋浮洲劉氏古厝","lat":25.005274,"lng":121.442415,"cat":"history","tag":"古蹟","area":"板橋區・新北市","ph":"文"},{"id":2200,"name":"板橋車站","lat":25.01446,"lng":121.46327,"cat":"other","desc":"新板特區的板橋車站是一座二十五層樓的共構站體，寬敞大廳與商業空間相連。除了鐵路設施，裡頭還有商店街、美食街與旅遊服務中心。","area":"板橋區・新北市","ph":"觀"},{"id":2201,"name":"板橋農村公園","lat":25.03026,"lng":121.47097,"cat":"nature","desc":"板橋區農會以戰後初期的臺灣農村為構想，打造這座休憩公園。仿古三合院、民俗戲臺和福德宮之外，室內展館也展示早期農業生活。","area":"板橋區・新北市","ph":"觀"},{"id":2202,"name":"板橋迪毅堂","lat":25.007338,"lng":121.457396,"cat":"worship","tag":"古蹟","desc":"板橋林家在清代漳泉械鬥後建祠，祭祀武師徐才與殉難的丁勇，地方俗稱元帥廟。木製門扇上的彩繪門神，分別手持寶劍與官印。","area":"板橋區・新北市","ph":"文"},{"id":2203,"name":"枋橋建學碑","lat":25.010904,"lng":121.458306,"cat":"history","tag":"古蹟","desc":"板橋國小校門旁的石碑，記下林家捐資擴建枋橋公學校的原委。灰色石磚托起碑身，碑首篆刻「枋橋建學碑」，文字集中在正面。","area":"板橋區・新北市","ph":"文"},{"id":2204,"name":"林本源園邸
