id":3641,"name":"新生北路3段62巷25號","lat":25.065919,"lng":121.526378,"cat":"structure","tag":"歷史建築","desc":"新生北路巷內的老屋是國軍在一九四〇年代興建的高階官舍。建築外形帶有西式風格，庭院裡的水池與疊石則採日式設計。","area":"中山區・臺北市","ph":"文"},{"id":3642,"name":"明石元二郎鳥居及鎌田正威鳥居","lat":25.053368,"lng":121.525907,"cat":"history","tag":"歷史建築","desc":"明石元二郎的塋墓與鳥居建於日治時期。為準備明石逝世一週年的祭典，繼任總督田健治郎特別安排整修墓地，並重新製作墓碑。","area":"中山區・臺北市","ph":"文"},{"id":3643,"name":"松錦公園","lat":25.05962,"lng":121.53211,"cat":"nature","desc":"這處住宅區的綠地分為一號與二號公園，園內有植栽與寬敞的涼亭。居民常來散步、坐著聊天，附近的松江市場也有濃厚的日常氣息。","area":"中山區・臺北市","ph":"觀"},{"id":3644,"name":"林安泰古厝","lat":25.072413,"lng":121.530354,"cat":"culture","tag":"歷史建築","desc":"清代安溪林家以故鄉的「安」和商號榮泰行的「泰」為宅命名。古厝遷建時逐件拆解編號，如今在濱江街仍看得到正身與左右護龍的格局。","area":"中山區・臺北市","ph":"文"},{"id":3645,"name":"林森_康樂公園","lat":25.053087,"lng":121.524931,"cat":"nature","desc":"林森北路兩側各有一座花園，分別朝向中山北路與新生北路。這一帶曾有老兵長住的平房，後來透過公民參與，改闢成花木聚集的都市綠地。","area":"中山區・臺北市","ph":"觀"},{"id":3646,"name":"榮星花園公園","lat":25.06337,"lng":121.53886,"cat":"nature","desc":"中山區這座昔日的民營花園保留了九重葛花廊，也是人們熟悉的婚紗取景地。園內還有瑠公圳濕地生態池、楓香林道與荷花池畔的木棧道。","area":"中山區・臺北市","ph":"觀"},{"id":3647,"name":"樹火紀念紙博物館","lat":25.04822,"lng":121.53365,"cat":"culture","desc":"長春棉紙廠創辦人陳樹火催生了這間以紙為主題的博物館。入館可看手工造紙示範，也能在科學實驗區用不同感官認識紙的特性。","area":"中山區・臺北市","ph":"觀"},{"id":3648,"name":"歪腰郵筒","lat":25.052748,"lng":121.540377,"cat":"culture","desc":"龍江路的紅、綠郵筒在蘇迪勒颱風中受損，朝同一側彎下腰。兩個歪著身子的郵筒就此成為街頭地標，整修後仍保留寄信功能。","area":"中山區・臺北市","ph":"觀"},{"id":3649,"name":"王大閎建築劇場","lat":25.07051,"lng":121.524898,"cat":"nature","desc":"美術公園裡這棟住宅按建築師王大閎昔日的建國南路自宅摹擬重建。從原先供人起居的空間出發，展演以另一種角度介紹臺灣建築與生活。","area":"中山區・臺北市","ph":"觀"},{"id":3650,"name":"美堤河濱公園","lat":25.07538,"lng":121.56087,"cat":"nature","desc":"基隆河畔的草坪、自然親水灣與自行車道連成一片，適合散步或野餐。從河岸可以望見大直橋與臺北一〇一，也常能觀察飛機起降。","area":"中山區・臺北市","ph":"觀"},{"id":3651,"name":"美堤碼頭","lat":25.0754,"lng":121.55655,"cat":"nature","desc":"美堤疏散門外的碼頭是基隆河藍色公路的停靠點，坐落在視野寬闊的河濱綠地。站在岸邊可以遙望臺北一〇一，也能看松山機場的飛機起降。","area":"中山區・臺北市","ph":"觀"},{"id":3652,"name":"臨濟護國禪寺","lat":25.072429,"lng":121.520633,"cat":"worship","tag":"古蹟","desc":"圓山的禪寺由日本僧人得庵玄秀創建，寺前山門帶有江戶時代風格。大雄寶殿採全木構重簷歇山式，寺後還留有石雕佛像。","area":"中山區・臺北市","ph":"文"},{"id":3653,"name":"臺北典藏植物園_天使館","lat":25.07137,"lng":121.53162,"cat":"nature","desc":"新生園區的溫室依氣候與地域展示植物，從臺灣原生種到高山植物都有各自的展區。蘭花、蕨類、多肉植物與秋海棠呈現出不同的葉形與姿態。","area":"中山區・臺北市","ph":"觀"},{"id":3654,"name":"臺北市政府衛生局舊址","lat":25.050205,"lng":121.520692,"cat":"history","tag":"古蹟","desc":"這棟左右對稱的歐風建築曾兼作簡易住宿、職業介紹與公設質舖，戰後又供衛生機關使用。兩翼各有突出的高塔，屋頂的圓窗也很醒目。","area":"中山區・臺北市","ph":"文"},{"id":3655,"name":"臺北市立美術館","lat":25.07196,"lng":121.52437,"cat":"culture","desc":"建築師高而潘設計的館舍內，一樓以三層樓高的中庭和高大展牆容納大型作品。也可從主題展及年輕藝術家的展覽認識臺灣現代美術。","area":"中山區・臺北市","ph":"觀"},{"id":3656,"name":"臺北第三高女(中山女中)","lat":25.048512,"lng":121.537212,"cat":"history","tag":"古蹟","desc":"今日中山女高的前身曾設本科與手藝科，早年先後在士林、艋舺辦學。日治時期以臺北第三高等女學校之名在現址興建校舍，留下女子教育的歷史。","area":"中山區・臺北市","ph":"文"},{"id":3657,"name":"舞蝶共融遊戲場","lat":25.06871,"lng":121.524023,"cat":"nature","desc":"花博美術園區的遊戲場以蝴蝶和毛毛蟲為造型，設有沙坑、攀爬網與音樂遊具。除了滾輪滑梯，這裡也設計了輪椅使用者可以使用的鞦韆。","area":"中山區・臺北市","ph":"觀"},{"id":3658,"name":"花博公園","lat":25.06986,"lng":121.52123,"cat":"nature","desc":"臺北國際花卉博覽會的場地，後來成為橫跨圓山、美術與新生園區的都市公園。沿途保留立體花牆與地景花海，原有展館也延續作為活動空間。","area":"中山區・臺北市","ph":"觀"},{"id":3659,"name":"蔡瑞月舞蹈研究社","lat":25.055664,"lng":121.52199,"cat":"culture","tag":"古蹟","desc":"臺灣現代舞推手蔡瑞月的舞蹈研究社，從雙連一帶的日式木造文官宿舍發展而來。為了舞蹈教學陸續增改建，留下從居家到排練場的空間變化。","area":"中山區・臺北市","ph":"文"},{"id":3660,"name":"行天宮","lat":25.06308,"lng":121.5339,"cat":"worship","desc":"民權東路與松江路口的廟宇以關聖帝君為主神，也奉祀呂洞賓、岳飛等神祇。信眾匯聚在寬敞的廟埕，寺方沿襲不燒金紙的參拜方式。","area":"中山區・臺北市","ph":"觀"},{"id":3661,"name":"袖珍博物館","lat":25.05035,"lng":121.53614,"cat":"culture","desc":"館內以袖珍藝術重現世界各地的建築與生活，有能看見內外格局的娃娃屋，也有聚焦單一房間的屋盒。細看其中，可從羅馬遺跡一路逛到威尼斯。","area":"中山區・臺北市","ph":"觀"},{"id":3662,"name":"迎風河濱公園","lat":25.074191,"lng":121.547027,"cat":"nature","desc":"基隆河岸除了球場與親水草坪，還為狗狗闢出有圍欄的運動空間。大狗、小狗各有活動區，跑跳之後也有洗手足臺可以清洗腳掌。","area":"中山區・臺北市","ph":"觀"},{"id":3663,"name":"遼寧公園","lat":25.05366,"lng":121.54224,"cat":"nature","desc":"高聳的蒲葵圍著公園，榕樹在步道旁投下大片樹蔭。花臺與小丘讓地形略有起伏，入口附近還能找到園內受到保護的老樹。","area":"中山區・臺北市","ph":"觀"},{"id":3664,"name":"非畫廊Beyond Gallery","lat":25.049806,"lng":121.522432,"cat":"culture","desc":"這間畫廊以臺灣當代藝術為重心，也引進國際藝術家的作品。透過展覽與策展人、收藏家的交流，讓本地藝術家的創作有機會走向海外。","area":"中山區・臺北市","ph":"觀"},{"id":3665,"name":"三井物產株式會社舊倉庫","lat":25.047678,"lng":121.512427,"cat":"history","tag":"歷史建築","area":"中正區・臺北市","ph":"文"},{"id":3666,"name":"三創生活","lat":25.04535,"lng":121.53111,"cat":"culture","desc":"緊鄰光華商圈的十二層樓空間，把數位產品、影音、動漫與藝術展演聚在一起。館內散布數位螢幕，也有結合科技與創作的體驗空間。","area":"中正區・臺北市","ph":"觀"},{"id":3667,"name":"中央藝文公園_華山大草原遊戲場","lat":25.04612,"lng":121.52683,"cat":"nature","desc":"華山大草原以火車造型牆和隧道連起遊戲空間，牆上還看得到孩子留下的圖案。綠坡間的煙囪遊戲塔呼應老酒廠煙囪，旁邊有水沙設施與滑索。","area":"中正區・臺北市","ph":"觀"},{"id":3668,"name":"中正橋(川端橋)","lat":25.021931,"lng":121.516616,"cat":"history","tag":"歷史建築","desc":"舊稱川端橋的橋梁興建於日治時期，橋墩採雙柱拱形設計。從鋼筋混凝土基礎到鉚釘接合的鋼板大梁，都能辨認出初建時的構造。","area":"中正區・臺北市","ph":"文"},{"id":3669,"name":"中正紀念堂","lat":25.042192,"lng":121.508571,"cat":"history","tag":"文化景觀","desc":"這片曾作為軍事設施的土地，後來興建紀念蔣中正的大堂與兩廳院。廣場曾見證學運與各類集會，也承載許多人參與燈會的記憶。","area":"中正區・臺北市","ph":"文"},{"id":3670,"name":"二二八和平公園","lat":25.04132,"lng":121.51516,"cat":"nature","desc":"池塘、石拱橋與老樹圍成市中心的庭園，園中央立著二二八和平紀念碑。昔日臺北放送局則成為紀念館，以歷史文獻介紹事件經過與影響。","area":"中正區・臺北市","ph":"觀"},{"id":3671,"name":"亞洲水泥大樓","lat":25.04148,"lng":121.510596,"cat":"history","tag":"歷史建築","area":"中正區・臺北市","ph":"文"},{"id":3672,"name":"公館水岸廣場","lat":25.01125,"lng":121.5284,"cat":"nature","desc":"新店溪旁的開放廣場沿著沒有堤防的一段河岸展開，可散步、看水或騎車。南側的渾水抽水站則改為現場音樂空間，保留早期水源設施的身影。","area":"中正區・臺北市","ph":"觀"},{"id":3673,"name":"勸業銀行舊廈","lat":25.043565,"lng":121.514164,"cat":"history","tag":"古蹟","desc":"襄陽路轉角的舊銀行以巨柱撐起騎樓，柱頭還有獸首裝飾。外牆用人造石片做出石材質感，建築造型從古埃及與馬雅風格取材。","area":"中正區・臺北市","ph":"文"},{"id":3674,"name":"南海學園科學館","lat":25.031869,"lng":121.512371,"cat":"culture","tag":"古蹟","desc":"南海學園的老館舍源於戰後推廣科學教育的構想，館址曾數度更改才在此落腳。這裡也是國立臺灣科學教育館早期發展的起點。","area":"中正區・臺北市","ph":"文"},{"id":3675,"name":"南門_麗正門","lat":25.03515,"lng":121.51499,"cat":"history","desc":"清代臺北府城的主門以大直石材砌築，門上石額四周飾有螭龍。上方城樓後來改成北方宮殿式樣，下方石砌城座與圓拱門洞仍保留原形。","area":"中正區・臺北市","ph":"觀"},{"id":3676,"name":"南門町三二三","lat":25.03252,"lng":121.5111,"cat":"nature","desc":"臺北植物園荷花池畔的日式木屋原是茶屋，名字取自當年的番地。建築修復後另闢枯山水庭園，池畔的老茶屋也重現昔日輪廓。","area":"中正區・臺北市","ph":"觀"},{"id":3677,"name":"博愛路116號店屋","lat":25.043547,"lng":121.511394,"cat":"history","tag":"歷史建築","area":"中正區・臺北市","ph":"文"},{"id":3678,"name":"博愛路132號店屋","lat":25.042983,"lng":121.511397,"cat":"history","tag":"歷史建築","desc":"博愛路與永綏街口的這棟店屋，位處日治時期臺北城內的街區。從它所坐落的街角，可以回溯京町與大和町的發展。","area":"中正區・臺北市","ph":"文"},{"id":3679,"name":"博愛路2號店屋","lat":25.046895,"lng":121.511107,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3680,"name":"博愛路4、6、8號店屋","lat":25.046819,"lng":121.511127,"cat":"history","tag":"古蹟","desc":"這排店屋是日治時期京町改築計畫留下的建築。從街邊看去，店面的四根柱子和三扇窗戶仍清晰可辨，也延續了博愛路街屋的立面風貌。","area":"中正區・臺北市","ph":"文"},{"id":3681,"name":"博愛路_漢口街_相機街","lat":25.04533,"lng":121.51139,"cat":"structure","desc":"博愛路與漢口街一帶俗稱博漢區，早年因鄰近機關、報社而聚集照相器材行。從專營德國底片相機的老店起，這片街區逐漸成為尋找攝影器材的去處。","area":"中正區・臺北市","ph":"觀"},{"id":3682,"name":"原七星郡役所","lat":25.043461,"lng":121.522428,"cat":"history","tag":"歷史建築","area":"中正區・臺北市","ph":"文"},{"id":3683,"name":"原三井物產株式會社臺北支店","lat":25.043567,"lng":121.514864,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3684,"name":"原大阪商船株式會社臺北支店","lat":25.046709,"lng":121.514352,"cat":"history","tag":"古蹟","desc":"這棟建築原是經營臺日航線的大阪商船臺北支店，戰後曾作為臺灣航業公司的據點。公路局進駐後增建樓層，外牆也曾改貼黃褐色磁磚。","area":"中正區・臺北市","ph":"文"},{"id":3685,"name":"原文武街小島商店（衡陽路30之1號）","lat":25.042203,"lng":121.512688,"cat":"history","tag":"歷史建築","desc":"衡陽路上的老商店曾由小島伊七、林茂生等人使用，戰後也曾有白光攝影社。歷經整修的立面，仍可辨認出四柱三窗的老店面格局。","area":"中正區・臺北市","ph":"文"},{"id":3686,"name":"原文武街小島商店（衡陽路30號）","lat":25.042207,"lng":121.51275,"cat":"history","tag":"歷史建築","desc":"老店鋪外觀雖經整修，仍可從四柱三窗與留存的樓板梁辨認從前的面貌。從小島商店到戰後的白光攝影社，記錄了這段衡陽路的商業變遷。","area":"中正區・臺北市","ph":"文"},{"id":3687,"name":"原臺北信用組合","lat":25.04233,"lng":121.510626,"cat":"history","tag":"古蹟","desc":"日治時期由日本中小企業組成的信用組合，曾在榮町這棟騎樓建築辦公。從圓拱窗往中央看，雙柱撐起的入口上方還有一對鷹形裝飾。","area":"中正區・臺北市","ph":"文"},{"id":3688,"name":"原臺灣土木建築協會","lat":25.044717,"lng":121.509985,"cat":"history","tag":"歷史建築","desc":"這棟歷史建築與臺灣土木建築業的團體活動有關。臺灣區綜合營造業同業公會曾在此辦公，留下營造業組織的使用紀錄。","area":"中正區・臺北市","ph":"文"},{"id":3689,"name":"原臺灣教育會館","lat":25.031613,"lng":121.51379,"cat":"culture","tag":"古蹟","desc":"井手薰設計的會館最初用來展示教育成果，也供集會。外牆貼著褐色面磚，抬頭可見女牆上的洗石子幾何紋樣，戰後這裡也曾供省議會開會。","area":"中正區・臺北市","ph":"文"},{"id":3690,"name":"原臺灣軍司令官官邸(孫立人將軍官邸)","lat":25.029214,"lng":121.518294,"cat":"history","tag":"古蹟","desc":"日治時期臺灣軍司令官的官邸兼具日式與西式建築風格。戰後孫立人將軍曾在此居住，房屋也因此與這位將軍的經歷相連。","area":"中正區・臺北市","ph":"文"},{"id":3691,"name":"原臺灣軍司令部","lat":25.036895,"lng":121.510806,"cat":"history","tag":"古蹟","desc":"日治時期的臺灣軍司令部設在當時的書院町，占地七千多坪。昔日機關除了軍事幕僚，還包括軍醫、獸醫及法務等不同部門。","area":"中正區・臺北市","ph":"文"},{"id":3692,"name":"原臺灣重要物資營團","lat":25.044144,"lng":121.527037,"cat":"history","tag":"歷史建築","desc":"這處戰時機關鄰近倉庫區與樺山車站，曾負責重要物資的分配運送。戰後建物移交審計部，見證同一處辦公空間的兩段歷史。","area":"中正區・臺北市","ph":"文"},{"id":3693,"name":"原警察局中正二分局(牯嶺街小劇場)","lat":25.031739,"lng":121.515326,"cat":"culture","tag":"歷史建築","desc":"牯嶺街的劇場建築所在，原有一棟日式木造宿舍。戰後臺北市警察局在基地興建兩層樓磚造辦公廳舍，作為當時新增的第七分局。","area":"中正區・臺北市","ph":"文"},{"id":3694,"name":"原辰馬商會本町店鋪","lat":25.045615,"lng":121.513363,"cat":"history","tag":"歷史建築","desc":"這棟本町店鋪由河東富次興建，日治時期轉由辰馬商會持有。戰後曾收歸國有，後來轉作彰化銀行臺北分行，留下街角商業用途的變遷。","area":"中正區・臺北市","ph":"文"},{"id":3695,"name":"原馬場町區會講習堂與事務所","lat":25.026582,"lng":121.510666,"cat":"worship","tag":"歷史建築","desc":"昔日馬場町的區會事務所、講習堂及宿舍，是戰時地方公共建築的一組實例。事務所留有石板與雨淋板，講習堂則可見大跨度木構造。","area":"中正區・臺北市","ph":"文"},{"id":3696,"name":"古亭河濱公園","lat":25.019818,"lng":121.521387,"cat":"nature","desc":"永福橋與中正橋間的綠地以灌木在斜坡上排出公園名字。沿河有網球場、籃球場與溜冰場，永福橋下還設有攀岩練習場和兒童遊具。","area":"中正區・臺北市","ph":"觀"},{"id":3697,"name":"台北地下街","lat":25.04956,"lng":121.51389,"cat":"structure","desc":"臺北車站周邊的地下通廊聚集服飾、手工藝與電子產品店鋪。動漫周邊專賣店尤其集中，逛街時常能遇到想尋找收藏品的同好。","area":"中正區・臺北市","ph":"觀"},{"id":3698,"name":"司法大廈","lat":25.037825,"lng":121.512273,"cat":"history","tag":"古蹟","desc":"總統府旁的舊高等法院由井手薰設計，是日治時期重要的司法建築。大樓平面呈日字形，兩座天井讓深處的辦公空間也能採光通風。","area":"中正區・臺北市","ph":"文"},{"id":3699,"name":"嘉禾新村－永春街131巷1號、永春街131巷5號、永春街131巷3弄1號、3號、4號及防空洞","lat":25.015899,"lng":121.527022,"cat":"structure","tag":"歷史建築","desc":"新村東側曾駐有日治時期的陸軍砲兵聯隊，戰後舊建築改為眷舍。隨著軍法與通信單位遷入，周邊逐步增加不同規模的住宅，形成今日的眷村格局。","area":"中正區・臺北市","ph":"文"},{"id":3700,"name":"國定古蹟嚴家淦故居","lat":25.034369,"lng":121.51256,"cat":"history","tag":"古蹟","desc":"這處原供臺灣銀行高階人員居住的宿舍，後來成為嚴家淦故居。洋式主屋東邊增建日式木屋，兩種建築與四周的庭園共同構成官邸。","area":"中正區・臺北市","ph":"文"},{"id":3701,"name":"國家兩廳院","lat":25.03704,"lng":121.51925,"cat":"culture","desc":"黃瓦飛簷與紅柱彩拱圍出兩座宮殿式劇場，隔著廣場相望。館內設有四座表演廳，是臺北欣賞音樂與舞臺演出的重要空間。","area":"中正區・臺北市","ph":"觀"},{"id":3702,"name":"國父史蹟館","lat":25.047689,"lng":121.52016,"cat":"culture","tag":"歷史建築","desc":"館舍保留了日治時期旅館「梅屋敷」的接應室。這棟原本用來迎接旅客的建築，留下當時日本人在臺北經營旅館的歷史。","area":"中正區・臺北市","ph":"文"},{"id":3703,"name":"國立中央圖書館舊址","lat":25.032293,"lng":121.512074,"cat":"culture","tag":"歷史建築","desc":"這棟館舍由日治時期的建功神社遺址改建而成。戰後曾作為國立中央圖書館與教育資料館，留下同一處空間接連承擔不同文化工作的歷史。","area":"中正區・臺北市","ph":"文"},{"id":3704,"name":"國立中正紀念堂","lat":25.03619,"lng":121.51868,"cat":"culture","desc":"陸軍總部舊址上的藍白色紀念堂，是為紀念蔣介石而建。設計者楊卓成也設計過圓山大飯店，此處則取用了國旗上的藍與白。","area":"中正區・臺北市","ph":"觀"},{"id":3705,"name":"國立教育廣播電台","lat":25.031869,"lng":121.512371,"cat":"history","tag":"歷史建築","desc":"南海學園規劃之初，教育部希望透過廣播把教育帶給更多人。早期電臺除了在南海路設置廣播大樓，也利用科學館頂樓加建的圓形空間。","area":"中正區・臺北市","ph":"文"},{"id":3706,"name":"國立歷史博物館","lat":25.031454,"lng":121.511227,"cat":"culture","tag":"歷史建築","desc":"植物園旁的史博館原名國立歷史文物美術館，是南海學園早期成立的館舍。這座學園借鏡美國史密森尼博物館群，將公園與文化教育結合。","area":"中正區・臺北市","ph":"文"},{"id":3707,"name":"國立臺灣博物館","lat":25.04276,"lng":121.51503,"cat":"culture","desc":"二二八和平公園裡的博物館本館建於日治時期，以希臘式柱廊與羅馬式圓頂迎接訪客。走進挑高大廳，還可看見光線透過圓頂的彩繪玻璃。","area":"中正區・臺北市","ph":"觀"},{"id":3708,"name":"國立臺灣博物館_南門館","lat":25.0332,"lng":121.51596,"cat":"nature","desc":"這裡原是臺灣總督府專賣局的南門工場，負責樟腦與鴉片的製造及試驗。博物館所在的舊廠址，記錄了日治時期專賣制度下的產業歷史。","area":"中正區・臺北市","ph":"觀"},{"id":3709,"name":"國立臺灣藝術教育館","lat":25.031741,"lng":121.511894,"cat":"culture","tag":"歷史建築","desc":"這座館舍在民國四十六年竣工，最初以「國立臺灣藝術館」為名開館。後來改稱國立臺灣藝術教育館，館名也點出了推廣藝術教育的任務。","area":"中正區・臺北市","ph":"文"},{"id":3710,"name":"外交部辦公大樓","lat":25.038719,"lng":121.516216,"cat":"history","tag":"歷史建築","desc":"外交部的辦公建築出自王大閎與張德霖兩位建築師之手。前棟先行落成，十餘年後才擴建後棟，記錄部會辦公空間逐步發展的歷史。","area":"中正區・臺北市","ph":"文"},{"id":3711,"name":"大同之家(含網球場)","lat":25.034956,"lng":121.512235,"cat":"history","tag":"古蹟","desc":"嚴家淦為接待美軍援華顧問團規劃這處建築，由臺灣銀行與聯勤總部外事處合建。後來它成為官邸的附屬空間，用來辦公與接待賓客。","area":"中正區・臺北市","ph":"文"},{"id":3712,"name":"婦聯總會","lat":25.040419,"lng":121.509681,"cat":"history","tag":"古蹟","desc":"這棟日治時期官方建築所在的基地，清代曾設登瀛書院。從日治時期的淡水館、陸軍偕行社到後來的婦聯總會，歷代機構在此留下不同用途。","area":"中正區・臺北市","ph":"文"},{"id":3713,"name":"寶藏巖","lat":25.010564,"lng":121.533227,"cat":"worship","tag":"古蹟","desc":"清代僧人在新店溪畔倚著山崖建寺，因此稱為「巖」，也有石壁潭寺之名。寺中主祀觀音，屢次修繕後仍留有部分舊石柱與石構件。","area":"中正區・臺北市","ph":"文"},{"id":3714,"name":"專賣局(今臺灣菸酒股份有限公司)","lat":25.034088,"lng":121.514857,"cat":"history","tag":"古蹟","desc":"日治時期的專賣局廳舍曾是臺北的重要地標，後來由臺灣菸酒公司沿用。東翼比主體稍晚興建，原本專供掌管酒類專賣的部門辦公。","area":"中正區・臺北市","ph":"文"},{"id":3715,"name":"峰圃茶莊","lat":25.045339,"lng":121.51336,"cat":"history","tag":"歷史建築","desc":"這家茶莊在戰後從大稻埕江山樓一帶搬到重慶南路。店屋後半部曾向上增建一層作臥室，留下經商與起居共用一棟樓的痕跡。","area":"中正區・臺北市","ph":"文"},{"id":3716,"name":"市長官邸","lat":25.040334,"lng":121.524437,"cat":"history","tag":"歷史建築","desc":"這座日式大型官舍最初供臺北市尹居住，戰後成為市長官邸。前方的車寄、庭園水池與留存的舊屋架，都能看出早期官舍的配置。","area":"中正區・臺北市","ph":"文"},{"id":3717,"name":"帝國生命保險株式會社臺北支店","lat":25.041559,"lng":121.511307,"cat":"history","tag":"古蹟","desc":"日治時期的帝國生命保險公司興建這座辦公樓，作為臺北支店。戰後外交部、臺灣銀行都曾使用，建築也留下保險業與公部門的雙重記憶。","area":"中正區・臺北市","ph":"文"},{"id":3718,"name":"延平南路45號","lat":25.04507,"lng":121.510503,"cat":"history","tag":"歷史建築","desc":"街角建築的外牆採用斬石子工法，在日治時期並不多見。屋內天花板以灰泥線腳裝飾，從外牆到室內都保有早年施工的細節。","area":"中正區・臺北市","ph":"文"},{"id":3719,"name":"急公好義坊","lat":25.041211,"lng":121.514335,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3720,"name":"懷寧街96號店屋","lat":25.042149,"lng":121.513958,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3721,"name":"懷寧街98號店屋","lat":25.04211,"lng":121.513949,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3722,"name":"明星咖啡館","lat":25.044194,"lng":121.512705,"cat":"culture","tag":"歷史建築","desc":"武昌街上的明星西點麵包店是臺北舊城的老商號。這棟建築也曾是許多作家停留與創作的地方，因而在臺灣當代文學史上留下足跡。","area":"中正區・臺北市","ph":"文"},{"id":3723,"name":"曹洞宗大本山臺灣別院鐘樓","lat":25.039329,"lng":121.52201,"cat":"history","tag":"古蹟","desc":"東門外這座高聳鐘樓，原建在曹洞宗大本山臺灣別院的大殿前。當年寺內還辦有學校，讓僧侶與齋友的子弟學習佛教教義及一般知識。","area":"中正區・臺北市","ph":"文"},{"id":3724,"name":"李國鼎故居","lat":25.040634,"lng":121.527674,"cat":"history","tag":"古蹟","desc":"泰安街巷內的日式宿舍，是李國鼎晚年居住二十多年的家。客廳擺飾、書房陳設與院子裡的花草，都保存著主人日常生活的模樣。","area":"中正區・臺北市","ph":"文"},{"id":3725,"name":"李鎮源故居","lat":25.037741,"lng":121.522997,"cat":"history","tag":"歷史建築","desc":"紹興南街的舊臺北醫院官舍，是東門一帶日式住宅社區的一部分。臺灣蛇毒研究先驅李鎮源曾住在這裡，也留下醫學界與街區的連結。","area":"中正區・臺北市","ph":"文"},{"id":3726,"name":"東和禪寺","lat":25.03919,"lng":121.522806,"cat":"worship","desc":"東門外的寺院舊稱曹洞宗大本山別院，由日本僧人創建。早年寺內附設佛教學校，原本矗立在大殿之前的高聳鐘樓仍留在原地。","area":"中正區・臺北市","ph":"觀"},{"id":3727,"name":"東門_景福門","lat":25.03907,"lng":121.51765,"cat":"history","desc":"這座城門曾守著臺北府城通往錫口的道路，也因面向基隆方向而肩負防禦任務。當年的東門街就是今日凱達格蘭大道，常有集會隊伍經過。","area":"中正區・臺北市","ph":"觀"},{"id":3728,"name":"楊英風美術館","lat":25.032131,"lng":121.514497,"cat":"culture","desc":"南海學園一帶的美術館以楊英風作品為主，透過回顧展呈現藝術家的創作。館內也舉辦藝術家交流展、講座及兒童研習活動。","area":"中正區・臺北市","ph":"觀"},{"id":3729,"name":"欽差行臺","lat":25.031004,"lng":121.508655,"cat":"nature","tag":"古蹟","desc":"清代巡撫興建這處行館，供外地高級官員到臺北時住宿、議事與設宴。唐景崧曾將它改作籌防局，日治初期又成為總督府廳舍。","area":"中正區・臺北市","ph":"文"},{"id":3730,"name":"沅陵街42號店屋","lat":25.042764,"lng":121.511843,"cat":"history","tag":"歷史建築","desc":"昔日淡水縣衙門前的街道後來發展為商店街，這棟三層店屋就在其中。白色面磚間可辨認四柱三窗的立面，店內還留有弧拱。","area":"中正區・臺北市","ph":"文"},{"id":3731,"name":"海軍將官官舍","lat":25.040332,"lng":121.528277,"cat":"history","tag":"歷史建築","desc":"這棟約建於日治末期的宿舍採西洋式造型，與常見的和洋混合住宅風格有別。周邊曾形成海軍將官官舍群，馬紀壯、黎玉璽等人都曾在這一帶居住。","area":"中正區・臺北市","ph":"文"},{"id":3732,"name":"濟南基督長老教會","lat":25.043457,"lng":121.51939,"cat":"worship","tag":"古蹟","desc":"昔日的幸町教會是附近醫院與醫學院師生常來的教堂，由井手薰設計。紅磚搭配唭哩岸石，西側尖拱窗還鑲著帶圖案的玻璃。","area":"中正區・臺北市","ph":"文"},{"id":3733,"name":"牯嶺街高等官舍群","lat":25.027637,"lng":121.517762,"cat":"history","tag":"古蹟","desc":"城南的日式宿舍與臺北向城外擴張的都市計畫有關。當年為容納來臺官員、眷屬與商人，在南門、東門外開發住宅區，留下這片官舍的格局。","area":"中正區・臺北市","ph":"文"},{"id":3734,"name":"獻堂館","lat":25.032444,"lng":121.511586,"cat":"worship","tag":"歷史建築","desc":"修澤蘭原為教育部設計東方文化館，預備作為學術機構的辦公處所。後來多家金融機構參與籌建紀念館，館名也隨之改為紀念林獻堂的獻堂館。","area":"中正區・臺北市","ph":"文"},{"id":3735,"name":"番學堂遺構","lat":25.040906,"lng":121.509746,"cat":"worship","tag":"古蹟","desc":"清代劉銘傳在臺北府設學堂，招收原住民族頭目家族子弟。這處遺構留下的教育歷史，也反映當時官府在開墾山地時施行的治理政策。","area":"中正區・臺北市","ph":"文"},{"id":3736,"name":"監察院","lat":25.045425,"lng":121.51989,"cat":"history","tag":"古蹟","desc":"這棟建築原為臺北廳舍，日治時期行政區改制後成為臺北州廳。當年州的轄區從今日臺北一帶延伸到基隆、宜蘭，見證了北臺灣的行政變遷。","area":"中正區・臺北市","ph":"文"},{"id":3737,"name":"福德爺長慶廟","lat":25.025057,"lng":121.521855,"cat":"worship","tag":"歷史建築","desc":"古亭庄居民過去在聚落南側要道邊奉祀土地公，廟也曾稱為古亭庄福德爺廟。正殿保留早年大修時的木格扇門窗與門額。","area":"中正區・臺北市","ph":"文"},{"id":3738,"name":"立法院議場","lat":25.043653,"lng":121.520859,"cat":"history","tag":"歷史建築","desc":"中庭軸線上的議場由建築師虞曰鎮設計，簡潔外觀帶有現代主義風格。這裡是國會議事、審議重要法案的場所，也見證臺灣民主發展。","area":"中正區・臺北市","ph":"文"},{"id":3739,"name":"紀州庵","lat":25.021114,"lng":121.520369,"cat":"worship","tag":"古蹟","desc":"川端町的日式老屋推測是艋舺「紀州庵」料理亭的支店。當年這一帶聚集料理屋與花木生意，紀州之名則取自日本的古地名。","area":"中正區・臺北市","ph":"文"},{"id":3740,"name":"紹興北街31巷53號（糧食局倉庫）","lat":25.045292,"lng":121.526664,"cat":"structure","tag":"歷史建築","desc":"巷內的老建築曾是愛國高等技藝女學校，讓戰爭遺族有半工半讀的機會。戰後這處校舍改為臺灣省糧食局倉庫，用途也隨之改變。","area":"中正區・臺北市","ph":"文"},{"id":3741,"name":"總統府","lat":25.03997,"lng":121.512481,"cat":"history","tag":"古蹟","desc":"清末臺北城內的宗祠舊地，日治時期被選為臺灣總督府永久廳舍的基地。這棟當年供殖民政府最高行政機構使用的建築，就是後來的總統府。","area":"中正區・臺北市","ph":"文"},{"id":3742,"name":"臨沂街65巷11號日式住宅","lat":25.035842,"lng":121.529713,"cat":"structure","tag":"歷史建築","desc":"臨沂街巷內的日式住宅，由臺灣總督府法院法官石崎皆市郎為自己興建。戰後房屋改作臺灣大學教授宿舍，延續作為住宅的用途。","area":"中正區・臺北市","ph":"文"},{"id":3743,"name":"臨沂街71巷33號日式住宅","lat":25.035582,"lng":121.530435,"cat":"structure","tag":"古蹟","desc":"這棟巷內日式住宅在昭和年間登記於今道勇吉名下。戰後轉為公產，曾由中央銀行管理，留下老住宅從私人持有到公有的歷史。","area":"中正區・臺北市","ph":"文"},{"id":3744,"name":"自由之家","lat":25.034833,"lng":121.511694,"cat":"history","tag":"古蹟","desc":"這組古蹟自日治初期陸續興建，後來又經過多次增修。從建築群逐漸成形的過程，可以看見臺北發展從大稻埕、艋舺向城南延伸的歷史。","area":"中正區・臺北市","ph":"文"},{"id":3745,"name":"臺北公會堂","lat":25.043108,"lng":121.510127,"cat":"history","tag":"古蹟","desc":"清代布政使司衙門拆除後，原址興建了紀念日皇裕仁登基的公會堂。舊衙門的一部分遷到植物園，兩處建築記錄了同一塊基地的變化。","area":"中正區・臺北市","ph":"文"},{"id":3746,"name":"臺北市中山堂","lat":25.04319,"lng":121.50967,"cat":"culture","desc":"井手薰設計的臺北公會堂，是日治時期少見的大型公共建築。戰後更名為中山堂，也曾是國民大會開會與立法院議事的場所。","area":"中正區・臺北市","ph":"觀"},{"id":3747,"name":"臺北府城—東門、南門、小南門、北門","lat":25.036902,"lng":121.508139,"cat":"culture","tag":"古蹟","desc":"清代臺北府城由粵籍工匠興築，城池呈南北略長的長方形，原本開有五座城門。如今仍可在街頭辨認東門、南門、小南門與北門的位置。","area":"中正區・臺北市","ph":"文"},{"id":3748,"name":"臺北撫臺街洋樓","lat":25.046754,"lng":121.510767,"cat":"history","tag":"古蹟","desc":"這棟早期西式店鋪的騎樓有三座半圓拱，從街邊便可細看石柱的形狀。抬頭則能找到屋頂的老虎窗，是舊臺北城內少見的店屋造型。","area":"中正區・臺北市","ph":"文"},{"id":3749,"name":"臺北放送局","lat":25.040383,"lng":121.51561,"cat":"history","tag":"古蹟","desc":"栗山俊一設計的廣播建築，曾在二二八事件期間傳送各方消息與政令。如今是臺北二二八紀念館，舊放送亭則留下早期擴音傳播的痕跡。","area":"中正區・臺北市","ph":"文"},{"id":3750,"name":"臺北植物園腊葉館","lat":25.031004,"lng":121.508655,"cat":"nature","tag":"古蹟","desc":"這棟兩層磚樓專為收藏植物腊葉標本而建，見證殖產局苗圃轉型為植物園。一樓以鐵管柱支撐，二樓迴廊原本環繞著挑空空間。","area":"中正區・臺北市","ph":"文"},{"id":3751,"name":"臺北水道水源地","lat":25.012542,"lng":121.530005,"cat":"nature","tag":"古蹟","desc":"日治時期的抽水機房曾把處理過的新店溪水加壓，送往觀音山蓄水池。量水室與渾水抽水站也留在這套設施中，可以循著水流認識早期臺北的供水方式。","area":"中正區・臺北市","ph":"文"},{"id":3752,"name":"臺北第一高女","lat":25.038606,"lng":121.513015,"cat":"history","tag":"古蹟","desc":"北一女中的校址原是清代臺北城內的文廟，日治時期在此辦理女子教育。早年的校舍多為木造，主要校舍則在一九三三年建成。","area":"中正區・臺北市","ph":"文"},{"id":3753,"name":"臺北賓館","lat":25.039805,"lng":121.515877,"cat":"nature","tag":"古蹟","desc":"東門內的臺灣總督官邸因白蟻侵蝕而大修，改用當時少見的鋼骨屋架。修建後留下的後期文藝復興式外觀，是今日賓館的建築特色。","area":"中正區・臺北市","ph":"文"},{"id":3754,"name":"臺北郵局","lat":25.047462,"lng":121.512038,"cat":"history","tag":"古蹟","desc":"北門內原有木造郵局，後來由栗山俊一設計改建成鋼筋混凝土大樓。從立面的山頭裝飾、古典柱頭，到大廳天花板的線腳，都可見古典風格。","area":"中正區・臺北市","ph":"文"},{"id":3755,"name":"臺北酒廠","lat":25.044089,"lng":121.529401,"cat":"nature","tag":"古蹟","desc":"樺山町的民營芳釀酒造廠，因酒類實施專賣而由總督府徵收。廠內主要製造米酒與再製酒，戰後仍延續公營酒廠的用途。","area":"中正區・臺北市","ph":"文"},{"id":3756,"name":"臺灣民主紀念園區","lat":25.036704,"lng":121.517699,"cat":"culture","tag":"古蹟","desc":"紀念蔣中正的園區興建前，籌建小組曾向海內外建築師徵求設計。當時共收到四十三件構想，留下臺灣早期大型國際建築競圖的紀錄。","area":"中正區・臺北市","ph":"文"},{"id":3757,"name":"臺灣省城隍廟","lat":25.04395,"lng":121.51271,"cat":"worship","desc":"武昌街的城隍廟坐落在熱鬧市街之中，大殿主祀城隍爺。從街頭步入殿裡，香煙與誦經聲圍繞著神像，也留住臺北建城以來的信仰記憶。","area":"中正區・臺北市","ph":"觀"},{"id":3758,"name":"臺灣總督府交通局遞信部","lat":25.039958,"lng":121.510809,"cat":"culture","tag":"古蹟","desc":"這棟日治時期的通信總部，以西洋古典風格設計。由一樓仿石外牆上的大圓拱往上看，可見二樓並列十二根醒目的希臘複合式柱子。","area":"中正區・臺北市","ph":"文"},{"id":3759,"name":"臺灣總督府博物館","lat":25.042931,"lng":121.514991,"cat":"culture","tag":"古蹟","desc":"二二八和平公園裡的館舍，前身是紀念兒玉源太郎與後藤新平的紀念館。除兩人塑像，館藏還包括臺灣原住民族文物及漢人開墾的史料。","area":"中正區・臺北市","ph":"文"},{"id":3760,"name":"臺灣總督府電話交換局","lat":25.039598,"lng":121.511122,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3761,"name":"臺灣菸酒股份有限公司_菸酒專賣局","lat":25.03384,"lng":121.51485,"cat":"history","desc":"臺灣總督府將製藥、鹽務與樟腦等機構合併，設立專賣局。從早期的食鹽與樟腦，到後來的菸酒業務，可從這裡認識臺灣專賣制度的變化。","area":"中正區・臺北市","ph":"觀"},{"id":3762,"name":"臺灣銀行","lat":25.041467,"lng":121.512912,"cat":"history","tag":"古蹟","desc":"早年的銀行總部位在現址西側，曾是一棟紅磚斜頂建築。因舊屋受到白蟻侵蝕，後來由建築師西村好時設計新總部，留下臺灣金融發展的歷史。","area":"中正區・臺北市","ph":"文"},{"id":3763,"name":"臺鐵臺北車站","lat":25.04775,"lng":121.51704,"cat":"other","desc":"方正的車站大樓坐落在臺北市中心，走進門便是跨度開闊的挑高大廳。大樓地下匯集臺鐵、高鐵與捷運，是許多旅人記憶中的城市地標。","area":"中正區・臺北市","ph":"觀"},{"id":3764,"name":"舊廈門街派出所（川端町派出所）","lat":25.024211,"lng":121.517343,"cat":"history","tag":"歷史建築","desc":"廈門街上的老派出所建於日治時期，當年這條街通往俗稱川端橋的中正橋。派出所守著昔日要道，也成為當地居民熟悉的公共建築。","area":"中正區・臺北市","ph":"文"},{"id":3765,"name":"菊元百貨店","lat":25.042552,"lng":121.511387,"cat":"history","tag":"古蹟","desc":"重田榮治創立的百貨公司起初有六層樓，後來又加建一層。當年店內設置供顧客使用的電梯，人稱「流籠」，是早期百貨購物的新體驗。","area":"中正區・臺北市","ph":"文"},{"id":3766,"name":"華山貨運站","lat":25.047125,"lng":121.52425,"cat":"history","tag":"歷史建築","area":"中正區・臺北市","ph":"文"},{"id":3767,"name":"蒲添生故居","lat":25.045492,"lng":121.524662,"cat":"culture","tag":"歷史建築","desc":"雕塑家蒲添生住在這棟日治時期的官舍，並親自設計屋後工作室。為了製作吳稚暉的大型銅像而打造的創作空間，留下雕塑家工作的痕跡。","area":"中正區・臺北市","ph":"文"},{"id":3768,"name":"行政院","lat":25.045759,"lng":121.520122,"cat":"history","tag":"古蹟","desc":"這座辦公大樓是日治後期少見的大型政府建築，每層面積都超過千坪。建築的規模與依循現代潮流的設計，反映當時機關辦公空間的變化。","area":"中正區・臺北市","ph":"文"},{"id":3769,"name":"衡陽路11號店屋","lat":25.042433,"lng":121.513681,"cat":"history","tag":"古蹟","desc":"這間店屋推測興建於一九一二至一九一五年間。戰時的航空測量影像顯示，它所在的街屋在一九四五年六月並未遭空襲破壞。","area":"中正區・臺北市","ph":"文"},{"id":3770,"name":"衡陽路13號店屋","lat":25.042411,"lng":121.513562,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3771,"name":"衡陽路15號店屋","lat":25.04241,"lng":121.513482,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3772,"name":"衡陽路17號及重慶南路1段119號店屋","lat":25.042445,"lng":121.513408,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3773,"name":"衡陽路2號店屋","lat":25.04224,"lng":121.513941,"cat":"history","tag":"古蹟","desc":"二二八和平公園出口的轉角，曾有辰野風格的升川洋服店。這裡也是日治時期臺灣博覽會會場的一處節點，戰後又以公園號酸梅湯留下市民記憶。","area":"中正區・臺北市","ph":"文"},{"id":3774,"name":"衡陽路33號店屋","lat":25.04244,"lng":121.512651,"cat":"history","tag":"歷史建築","desc":"這棟現代主義街屋曾歷經火災與局部改建，二、三樓已換上鐵窗。沿騎樓觀察，還能分辨刷白的天花板及包覆洗石子柱的飾條。","area":"中正區・臺北市","ph":"文"},{"id":3775,"name":"衡陽路35號店屋","lat":25.042421,"lng":121.512615,"cat":"history","tag":"歷史建築","desc":"衡陽路這間老店屋仍留著原始泥塑裝飾與立面開間的比例。隔壁大樓更新設計時，也曾參考這面牌樓，可對照新舊建築如何銜接。","area":"中正區・臺北市","ph":"文"},{"id":3776,"name":"衡陽路4號店屋","lat":25.042239,"lng":121.513853,"cat":"history","tag":"古蹟","desc":"昔日臺北新公園出口的街角店屋採四柱三窗格局。從騎樓抬頭看，山牆上還留著泥塑魚飾，與一旁同時期興建的店面相呼應。","area":"中正區・臺北市","ph":"文"},{"id":3777,"name":"衡陽路54號店屋","lat":25.042182,"lng":121.51205,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3778,"name":"衡陽路56號店屋","lat":25.042182,"lng":121.511998,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3779,"name":"衡陽路58號店屋","lat":25.042186,"lng":121.51194,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3780,"name":"衡陽路60號店屋","lat":25.042183,"lng":121.511882,"cat":"history","tag":"古蹟","area":"中正區・臺北市","ph":"文"},{"id":3781,"name":"衡陽路92號店屋","lat":25.042131,"lng":121.510748,"cat":"history","tag":"古蹟","desc":"榮町舊街這棟三層磚木店屋，曾是經營和洋雜貨的奧野商店。牌樓中央仍留著商號標誌，三樓頂緣的飾帶則可看出西式裝飾的影響。","area":"中正區・臺北市","ph":"文"},{"id":3782,"name":"觀音禪堂","lat":25.039395,"lng":121.522628,"cat":"worship","tag":"古蹟","desc":"曹洞宗臺北別院一度因颱風損毀，重建時在右側增設禪堂。這座位於舊城東門外的禪堂，最初專供臺灣信眾在此禮佛。","area":"中正區・臺北市","ph":"文"},{"id":3783,"name":"逸仙公園","lat":25.04774,"lng":121.52007,"cat":"nature","desc":"臺北車站附近的這座小公園，是為紀念孫中山而設。園址曾是他來臺下榻的料亭，也是他與臺灣總督佐久間左馬太會談的地方。","area":"中正區・臺北市","ph":"觀"},{"id":3784,"name":"重慶南路一段104號店屋（原辻利茶舖）","lat":25.042508,"lng":121.513072,"cat":"history","tag":"古蹟","desc":"日治時期三好德三郎在這棟店屋經營辻利茶舖，曾是臺北重要的茶葉銷售據點。建築也曾用作榮町郵便局，見證街區商業的發展。","area":"中正區・臺北市","ph":"文"},{"id":3785,"name":"長榮海事博物館","lat":25.03872,"lng":121.51871,"cat":"culture","desc":"館內以各種模型船介紹人類航海的歷程，可以從挖鑿製成的獨木舟一路看到西式帆船。不同年代的船形與動力，也讓海事教育有了具體的模樣。","area":"中正區・臺北市","ph":"觀"},{"id":3786,"name":"開封街1段79號店屋","lat":25.046123,"lng":121.511646,"cat":"history","tag":"歷史建築","area":"中正區・臺北市","ph":"文"},{"id":3787,"name":"開封街一段81、83號店屋","lat":25.046126,"lng":121.511512,"cat":"history","tag":"歷史建築","desc":"京町改築計畫留下的三層磚樓橫跨兩間店面，屋頂向兩側傾斜。即使外牆與室內已有改裝，仍能辨認出四柱三窗的舊街屋形式。","area":"中正區・臺北市","ph":"文"},{"id":3788,"name":"黃氏節孝坊","lat":25.04305,"lng":121.515847,"cat":"history","tag":"古蹟","desc":"清代艋舺女子黃氏喪夫後，長年照顧公婆與孩子，地方為她立下這座牌坊。從坊名與旌表的來由，可以看見當時社會對女性節孝的推崇。","area":"中正區・臺北市","ph":"文"},{"id":3789,"name":"龍口町「塵芥燒卻場」","lat":25.03075,"lng":121.507999,"cat":"history","tag":"歷史建築","desc":"「塵芥燒卻場」是日治時期的垃圾焚化設施，龍口町這處曾採用岩本式焚化爐。臺北市役所當年興建三處大型焚化場，這裡是其中留存的一處。","area":"中正區・臺北市","ph":"文"},{"id":3790,"name":"i-Ride TAIPEI飛行劇院","lat":25.034354,"lng":121.566206,"cat":"culture","desc":"微風南山裡的模擬飛行劇院，把懸空動感座椅與巨型球幕結合。飛越臺灣的影像配上風、水與氣味，讓坐著的觀眾也能從空中視角欣賞地貌。","area":"信義區・臺北市","ph":"觀"},{"id":3791,"name":"台北101","lat":25.03361,"lng":121.56476,"cat":"other","desc":"信義區的高樓以層層向上的竹節造型與青綠色玻璃帷幕構成輪廓。從八十九樓觀景臺向外俯瞰，臺北盆地和街區在日夜間呈現不同景色。","area":"信義區・臺北市","ph":"觀"},{"id":3792,"name":"台灣設計館","lat":25.043705,"lng":121.559743,"cat":"culture","desc":"這座以設計為主題的博物館收藏臺灣及設計史上的經典作品。館內也透過跨領域特展，介紹國內外的設計趨勢與獲獎作品。","area":"信義區・臺北市","ph":"觀"},{"id":3793,"name":"和興炭坑","lat":25.0226,"lng":121.58083,"cat":"history","desc":"舊埤溪旁的廢棄煤礦坑經整治後成了休憩園區。沿著磚紅色地坪上的礦車軌道意象前行，可以在溪畔認識昔日採煤留下的地景。","area":"信義區・臺北市","ph":"觀"},{"id":3794,"name":"四四南村","lat":25.031971,"lng":121.561872,"cat":"culture","tag":"歷史建築","desc":"戰後由後勤部隊自行興建的眷舍，以魚骨狀巷道連成整齊的聚落。早年每戶約三坪，低矮的斜屋頂連棟住宅保留了眷村緊密的生活尺度。","area":"信義區・臺北市","ph":"文"},{"id":3795,"name":"國立國父紀念館","lat":25.040038,"lng":121.560245,"cat":"culture","desc":"王大閎設計這座紀念孫中山的館舍，於一九七二年落成。它除了紀念孫中山的生平與思想，也承擔藝術教育、學術研究與公共休憩的功能。","area":"信義區・臺北市","ph":"觀"},{"id":3796,"name":"幾米月亮公車","lat":25.03276,"lng":121.565735,"cat":"culture","desc":"這輛公車把幾米繪本《月亮忘記了》的故事搬進城市街景。抬頭便可看見車頂上的藍色小童，雙手舉著一輪帶著笑容的黃色月亮。","area":"信義區・臺北市","ph":"觀"},{"id":3797,"name":"新舞臺","lat":25.036135,"lng":121.566132,"cat":"history","tag":"文化景觀","desc":"信義區的表演空間承接了辜顯榮早年在太原路創設的臺灣新舞臺，牌匾由辜振甫題寫。相聲瓦舍、如果兒童劇團等團體也曾在此演出。","area":"信義區・臺北市","ph":"文"},{"id":3798,"name":"松山奉天宮","lat":25.03739,"lng":121.58467,"cat":"worship","desc":"虎山上的宮廟最初只是一間由居民集資搭起的竹屋，主祀玉皇上帝。後與永吉路開安宮合祀五年千歲，逐漸發展為今日的地方信仰中心。","area":"信義區・臺北市","ph":"觀"},{"id":3799,"name":"松山慈惠堂","lat":25.03654,"lng":121.58747,"cat":"worship","desc":"福壽山麓的宮堂由女居士郭葉子創建，主祀無極瑤池大聖西王金母。循著山腳來到堂前，可以認識以西王金母為核心的地方信仰。","area":"信義區・臺北市","ph":"觀"},{"id":3800,"name":"松山文創園區_松菸風格店家","lat":25.04385,"lng":121.56064,"cat":"culture","desc":"松菸園區裡的創意店家延續了原有的製造精神，有些採前店後廠，讓作品與製作空間相鄰。快閃店也讓不同創作者在此展示設計。","area":"信義區・臺北市","ph":"觀"},{"id":3801,"name":"松山菸廠","lat":25.043684,"lng":121.55935,"cat":"history","tag":"古蹟","desc":"日治時期專賣局在興雅興建現代化的大型煙草工場，與後車站一帶的臺北菸廠相繼生產。戰後由專賣局接收，延續松山製菸的產業歷史。","area":"信義區・臺北市","ph":"文"},{"id":3802,"name":"永春陂生態濕地公園","lat":25.032531,"lng":121.580071,"cat":"nature","desc":"四獸山腳下的軍方營區在部隊移防後，逐步改造為約四公頃的都市濕地。這片綠地結合生態復育與環境教育，也留下昔日營區的歷史。","area":"信義區・臺北市","ph":"觀"},{"id":3803,"name":"臺北大巨蛋","lat":25.042439,"lng":121.559504,"cat":"culture","desc":"巨大的弧形屋頂罩住信義區的體育與展演場館，從遠處就能辨認。場館周邊有開放廣場、綠地步道和公共藝術，散步也能欣賞建築輪廓。","area":"信義區・臺北市","ph":"觀"},{"id":3804,"name":"臺北市政府","lat":25.037451,"lng":121.563821,"cat":"other","desc":"仁愛路尾端的市政大樓是信義計畫區的地標，也是臺北市政府的辦公所在地。從臺北一〇一俯望，才能看清整棟建築呈雙十字形的布局。","area":"信義區・臺北市","ph":"觀"},{"id":3805,"name":"臺北市議會","lat":25.03815,"lng":121.56198,"cat":"other","desc":"臺北市的地方議會可追溯到戰後成立的市參議會。當時參議員組成的機關主要提供諮詢，反映臺北地方自治制度發展的早期樣貌。","area":"信義區・臺北市","ph":"觀"},{"id":3806,"name":"臺北機廠","lat":25.047006,"lng":121.563142,"cat":"history","tag":"古蹟","desc":"昔日的臺北鐵道工場肩負火車組裝、維修及保養，是臺灣重要的鐵路車輛工廠。廠區不只記錄車輛技術的發展，也保存鐵路工人的勞動歷史。","area":"信義區・臺北市","ph":"文"},{"id":3807,"name":"誠品畫廊","lat":25.04455,"lng":121.56146,"cat":"culture","desc":"吳清友創立的畫廊長年關注華人當代藝術，以扶植藝術家為方向。從創作到收藏，這裡也是藝術家與收藏者認識彼此作品和想法的地方。","area":"信義區・臺北市","ph":"觀"},{"id":3808,"name":"象山公園","lat":25.03042,"lng":121.57011,"cat":"nature","desc":"象山腳下的綠地以臺北樹蛙為主題，把在地生態融入景觀和兒童遊具。沿著林蔭步道散步，也能在熱鬧的信義商圈旁找到開闊的休憩空間。","area":"信義區・臺北市","ph":"觀"},{"id":3809,"name":"香堤大道廣場","lat":25.037248,"lng":121.566985,"cat":"nature","desc":"信義商圈的百貨大樓之間，有一片讓人能停下腳步的開放廣場。這裡常見活動進駐，來往逛街的人與參加活動的群眾交織出街區日常。","area":"信義區・臺北市","ph":"觀"},{"id":3810,"name":"五分吊橋","lat":25.066098,"lng":121.613593,"cat":"history","tag":"歷史建築","desc":"內湖煤礦曾經藉由吊橋橫越基隆河，這裡就是早期運煤路線留下的遺址。橋面拆除後，北岸僅存的橋柱成了辨認舊橋位置的線索。","area":"內湖區・臺北市","ph":"文"},{"id":3811,"name":"內湖庄役場會議室","lat":25.081764,"lng":121.589641,"cat":"history","tag":"古蹟","desc":"內湖老市街中心的會議室，曾屬日治時期管理地方事務的庄役場。其高聳屋頂保留了當時的建築風格，也記錄內湖從庄役場到鄉公所的變遷。","area":"內湖區・臺北市","ph":"文"},{"id":3812,"name":"內湖復育園區","lat":25.061,"lng":121.60327,"cat":"nature","desc":"基隆河旁的舊垃圾山整治後，成了有森林、遊憩區與高灘地的公園。當年特意留下約四十公尺高的小丘，讓人仍看得出原先地形的尺度。","area":"內湖區・臺北市","ph":"觀"},{"id":3813,"name":"內湖清代採石場","lat":25.090349,"lng":121.568126,"cat":"history","tag":"古蹟","desc":"清末興建臺北府城牆時，採用了內湖與大直山區出產的石材。這處採石地後來仍供應民間建材，記錄了山區產業與城市建設的關係。","area":"內湖區・臺北市","ph":"文"},{"id":3814,"name":"內湖葫蘆洲吊橋橋墩","lat":25.060152,"lng":121.606582,"cat":"history","tag":"歷史建築","desc":"基隆河一側留下的橋墩，原屬連接南港與內湖的葫蘆洲吊橋。臺北磚窯業興盛時，工人和材料都曾經取道這裡往返兩岸。","area":"內湖區・臺北市","ph":"文"},{"id":3815,"name":"內湖路統制倉","lat":25.081209,"lng":121.590027,"cat":"history","tag":"歷史建築","desc":"這座糧倉是日治時期在臺灣各地興建的制式統制倉之一。倉體採統一規格，長二十五公尺、寬十二公尺，留下早期糧食儲存設施的尺度。","area":"內湖區・臺北市","ph":"文"},{"id":3816,"name":"內湖郭氏古宅","lat":25.079616,"lng":121.586817,"cat":"history","tag":"古蹟","desc":"內湖老街西側山丘上的宅邸，原是日治時期首任內湖庄長郭氏的家。建築約落成於大正年間，也呈現當時民宅仿效官方建築繁飾的風潮。","area":"內湖區・臺北市","ph":"文"},{"id":3817,"name":"內溝溪生態展示館","lat":25.08738,"lng":121.62258,"cat":"nature","desc":"一樓的流域地形模型把內溝溪縮小到五百分之一，旁邊還陳列產業樣品、生態照片與標本。樓上的自然圖書與影像則介紹溪流整治的過程。","area":"內湖區・臺北市","ph":"觀"},{"id":3818,"name":"十四份圳舊水閘門","lat":25.08228,"lng":121.604452,"cat":"nature","tag":"歷史建築","desc":"今日大湖公園的湖泊舊稱十四份陂，是林秀俊家族闢建的灌溉水源。後來列為公共埤圳，留存的舊水閘門就是內湖早年農田用水的見證。","area":"內湖區・臺北市","ph":"文"},{"id":3819,"name":"圓覺瀑布","lat":25.09755,"lng":121.59459,"cat":"nature","desc":"大溝溪上游的步道沿著溪水延伸，盡頭可見數道白簾般的細瀑。瀑布旁設有觀景平臺與涼亭，適合坐著歇腳，細看水流落下的模樣。","area":"內湖區・臺北市","ph":"觀"},{"id":3820,"name":"大溝溪生態治水園區","lat":25.089099,"lng":121.598479,"cat":"nature","desc":"內湖這段溪谷採近自然工法營造濕地與步道，也肩負都市防洪功能。沿岸有花草與林地，春季來訪還有機會在溪邊觀察到螢火蟲。","area":"內湖區・臺北市","ph":"觀"},{"id":3821,"name":"學學文化創意基金會","lat":25.0779,"lng":121.56787,"cat":"culture","desc":"林伯實與徐莉玲邀集文化創意產業及學界人士創立學學，作為學習與交流的平台。基金會從教育、研究及展覽等面向推動臺灣的文化創意。","area":"內湖區・臺北市","ph":"觀"},{"id":3822,"name":"彩虹河濱公園","lat":25.05996,"lng":121.57231,"cat":"nature","desc":"基隆河上的紅色彩虹橋以彎曲橋身連接兩岸，是水邊醒目的拍攝主題。橋下廣場設有愛情雕塑與情人步道，地面以十二種語言寫下愛意。","area":"內湖區・臺北市","ph":"觀"},{"id":3823,"name":"成美右岸河濱公園","lat":25.055591,"lng":121.586011,"cat":"nature","desc":"內湖側的基隆河堤邊設有網球、籃球與壘球練習場，另有溜冰空間。假日的岸上常聚著帶遙控車或相機來玩的人，各自享受開闊的河濱。","area":"內湖區・臺北市","ph":"觀"},{"id":3824,"name":"樂活公園","lat":25.068287,"lng":121.618883,"cat":"nature","desc":"內溝溪北岸的一公頃綠地鄰近東湖住宅區與學校，原本曾作其他用途。整建為公園後，成了附近居民散步、放鬆的溪畔空間。","area":"內湖區・臺北市","ph":"觀"},{"id":3825,"name":"湖山六號公園","lat":25.0831,"lng":121.601989,"cat":"nature","desc":"大湖公園附近的共融遊戲場以自行車為主題，車形遊具旁還有戲沙區和平衡木。陪孩子出遊的大人可在三行亭乘涼，遠望遊戲區的動靜。","area":"內湖區・臺北市","ph":"觀"},{"id":3826,"name":"白石湖吊橋","lat":25.09917,"lng":121.58711,"cat":"nature","desc":"白石湖農業區有座淡紫色吊橋，以龍骨造型呼應周邊山勢。走過一百一十六公尺長的橋面，可以從山谷上方望見層疊的山巒與田園。","area":"內湖區・臺北市","ph":"觀"},{"id":3827,"name":"白石湖同心池","lat":25.100535,"lng":121.589037,"cat":"nature","desc":"白石湖社區把荒廢的湧泉整理成雙心形濕地，讓內圈的土地與外圈水域相依。池畔的永結亭與親水平臺，也延續了情人同心的設計想法。","area":"內湖區・臺北市","ph":"觀"},{"id":3828,"name":"碧山巖開漳聖王廟","lat":25.09715,"lng":121.58762,"cat":"worship","desc":"內湖碧山上的廟宇主祀開漳聖王陳元光，並奉祀李伯瑤、馬仁兩位將軍。陳元光因開拓福建漳州而受尊崇，這份地方信仰也隨移民傳到臺灣。","area":"內湖區・臺北市","ph":"觀"},{"id":3829,"name":"碧湖公園","lat":25.08263,"lng":121.58301,"cat":"nature","desc":"群山環繞的公園以大陂湖為中心，湖面約占全園一半以上。這片今日供人散步賞景的水域，從前是內湖農田重要的灌溉水源。","area":"內湖區・臺北市","ph":"觀"},{"id":3830,"name":"郭子儀紀念堂_內湖紅樓","lat":25.07963,"lng":121.586577,"cat":"culture","desc":"市街西側山丘上的內湖紅樓，原為日治時期首任內湖庄長郭氏的宅邸。這棟大正年間的住宅，反映當時民宅採用繁複立面裝飾的風尚。","area":"內湖區・臺北市","ph":"觀"},{"id":3831,"name":"七虎籃球場","lat":25.128535,"lng":121.497612,"cat":"history","tag":"歷史建築","desc":"「七虎」之名源於王士選率領的輜汽兵團學校籃球隊。球隊在全國運動會嶄露頭角，受邀到香港交流時取了新名，留下球場背後的籃球往事。","area":"北投區・臺北市","ph":"文"},{"id":3832,"name":"中國電影製片廠-A攝影棚、錄音室","lat":25.138507,"lng":121.487502,"cat":"history","tag":"歷史建築","desc":"北投昔日的賽馬場後來成為中國電影製片廠，留有攝影棚與錄音室。製片廠早期拍攝新聞、紀錄及軍教片，之後也拍出《緹縈》等商業電影。","area":"北投區・臺北市","ph":"文"},{"id":3833,"name":"中山樓周邊園區文化景觀","lat":25.155619,"lng":121.552655,"cat":"culture","tag":"文化景觀","area":"北投區・臺北市","ph":"文"},{"id":3834,"name":"介壽堂","lat":25.153938,"lng":121.55045,"cat":"worship","tag":"歷史建築","desc":"青邨幹訓班與革命實踐研究院曾在這座會堂舉行大型集會，建物也曾作總裁辦公室。從堂前可望向日月池與八卦升旗臺，看出園區當年的軸線。","area":"北投區・臺北市","ph":"文"},{"id":3835,"name":"八卦升旗臺","lat":25.152911,"lng":121.550142,"cat":"history","tag":"歷史建築","desc":"昔日軍方管理的升旗臺面對日月池，另一端為軍政高層集會的介壽堂。池子源自天然陷落的硫磺坑，也有牛奶池之稱。","area":"北投區・臺北市","ph":"文"},{"id":3836,"name":"凱達格蘭文化館","lat":25.13707,"lng":121.50583,"cat":"culture","desc":"北投曾是凱達格蘭族人的生活地，地名也源於族語音譯。館內從平埔族群的歷史談起，並陳列原住民族文物與當代藝術創作。","area":"北投區・臺北市","ph":"觀"},{"id":3837,"name":"前山公園","lat":25.150684,"lng":121.54818,"cat":"nature","desc":"紗帽山東側的公園引山坡溪流入園，溪水匯聚成陽明湖。沿湖可以欣賞七星山倒影，四周還有山景與湖畔公共浴室。","area":"北投區・臺北市","ph":"觀"},{"id":3838,"name":"北投不動明王石窟","lat":25.137979,"lng":121.517635,"cat":"history","tag":"古蹟","desc":"幽雅路巷間留有臺灣較少見的佛教石窟，以密教護法不動明王為主題。不動明王是五大明王之一，威猛的形象與護法身分相應。","area":"北投區・臺北市","ph":"文"},{"id":3839,"name":"北投公共浴場","lat":25.136779,"lng":121.507372,"cat":"history","tag":"古蹟","desc":"日治時期由官方興建的大浴場，見證北投溫泉鄉的發展。建築結合磚木與鋼筋混凝土，二樓以雨淋板包覆木構，屋頂另開通風窗。","area":"北投區・臺北市","ph":"文"},{"id":3840,"name":"北投公園","lat":25.136305,"lng":121.506279,"cat":"nature","desc":"溫泉鄉裡的綠地由數處公園相連而成，入口的跳泉是醒目的景觀。散步時從泉水升起的煙霧，走到有音樂與燈光相伴的水景，可看見北投不同的表情。","area":"北投區・臺北市","ph":"觀"},{"id":3841,"name":"北投公園暨周邊景觀（含兒童樂園）","lat":25.136867,"lng":121.510837,"cat":"nature","tag":"文化景觀","desc":"這座依溫泉浴場周邊地形闢成的公園，園內廣植熱帶植物。石拱橋、舊浴場與曾作水道洩壓孔的噴水池，一起保留溫泉鄉的早年景觀。","area":"北投區・臺北市","ph":"文"},{"id":3842,"name":"北投公民會館","lat":25.13793,"lng":121.5101,"cat":"culture","desc":"會館有主展館、側展室和一片綠色庭園，供北投居民交流藝文。館內可見繪畫、陶藝或攝影展覽，也有介紹北投周邊文化景點的導覽資料。","area":"北投區・臺北市","ph":"觀"},{"id":3843,"name":"北投區一德街22號","lat":25.12904,"lng":121.468389,"cat":"history","tag":"歷史建築","desc":"一德街的老屋採傳統閩南三合院格局，左右護龍在正身前圍出內埕。細看牆面，下段是石砌基礎，上段則採用斗砌磚牆。","area":"北投區・臺北市","ph":"文"},{"id":3844,"name":"北投垃圾焚化廠_觀景台","lat":25.10796,"lng":121.49926,"cat":"other","desc":"焚化廠彩繪煙囪上設有觀景臺，離地約一百一十六公尺。環繞樓層的落地窗帶來開闊視野，可遠眺陽明山、觀音山與大屯山系。","area":"北投區・臺北市","ph":"觀"},{"id":3845,"name":"北投文物館","lat":25.13818,"lng":121.514483,"cat":"culture","tag":"古蹟","desc":"群山間的兩層日式木造館舍，早年曾是佳山溫泉旅館，戰後也曾作招待所。如今館內展示民俗文物，庭園與老屋保留北投溫泉鄉的風貌。","area":"北投區・臺北市","ph":"文"},{"id":3846,"name":"北投普濟寺","lat":25.135996,"lng":121.511277,"cat":"worship","tag":"古蹟","desc":"溫泉路上的日式佛寺保存大殿與住持宅院，殿身以檜木構成，平面接近正方形。單簷歇山頂向前伸出，形成帶有江戶風格的入口玄關。","area":"北投區・臺北市","ph":"文"},{"id":3847,"name":"北投梅庭","lat":25.136929,"lng":121.508765,"cat":"history","tag":"歷史建築","desc":"北投溪谷邊的日式住宅以木柱梁撐起斜屋頂，地下室則用鋼筋混凝土闢作防空空間。寬廣庭院留下老樹，屋內還設有泉池。","area":"北投區・臺北市","ph":"文"},{"id":3848,"name":"北投溫泉博物館","lat":25.13658,"lng":121.50715,"cat":"culture","desc":"紅磚黑瓦的舊公共浴場帶有英國都鐸式鄉村建築風格。一樓浴池由羅馬式拱柱環繞，彩繪玻璃透入光線，上樓便換成日式和室空間。","area":"北投區・臺北市","ph":"觀"},{"id":3849,"name":"北投真言宗石窟建築群","lat":25.133314,"lng":121.50928,"cat":"history","tag":"古蹟","desc":"這組石窟與日治初期日本真言宗在臺傳教的歷史有關。當時信眾從高野山迎請不動尊王，後由澤德松等人在北投發起興建。","area":"北投區・臺北市","ph":"文"},{"id":3850,"name":"北投磺田福佑宮","lat":25.137239,"lng":121.499517,"cat":"worship","tag":"歷史建築","desc":"清光緒年間開設的土地公廟，基礎與牆面都用北投一帶的唭哩岸石砌成。廟內也留有同種石材雕刻的神像，可以看見地方石料在信仰中的運用。","area":"北投區・臺北市","ph":"文"},{"id":3851,"name":"北投社三層崎公園","lat":25.14462,"lng":121.49199,"cat":"nature","desc":"北投郊外的山坡曾供應陶瓷產業原料，整建成公園後順著地勢闢出花田。一串紅、四季海棠與銀葉菊交錯栽種，從高低處看各有層次。","area":"北投區・臺北市","ph":"觀"},{"id":3852,"name":"北投穀倉","lat":25.135741,"lng":121.498944,"cat":"history","tag":"古蹟","desc":"日治時期的北投信用購買組合經營這座穀倉，為本地農民提供服務。從前農民把收穫的稻穀交給農業團體收購，儲穀與碾米是相連的產業。","area":"北投區・臺北市","ph":"文"},{"id":3853,"name":"北投賴氏祖厝","lat":25.108346,"lng":121.512711,"cat":"history","tag":"歷史建築","desc":"賴家祖先清代渡臺，後人在北投建起這棟單層紅磚住宅。兩坡斜屋頂下保留內凹的入口，磚砌百葉與層層挑出的屋簷都可細看。","area":"北投區・臺北市","ph":"文"},{"id":3854,"name":"北投陳氏祠堂","lat":25.132873,"lng":121.499329,"cat":"worship","tag":"歷史建築","desc":"陳姓先民從福建同安渡臺，在北投開墾水田、定居成家。族人於清代興建祠堂，後來遇火再重修，留下移民家族在地方落腳的歷史。","area":"北投區・臺北市","ph":"文"},{"id":3855,"name":"原三興株式會社招待所","lat":25.136654,"lng":121.512301,"cat":"history","tag":"歷史建築","desc":"北投溫泉區的兩棟招待所興建於不同時期，一棟由實業家木曾留吉起造。另一棟則由三興株式會社興建，記錄公司在溫泉鄉招待賓客的歷史。","area":"北投區・臺北市","ph":"文"},{"id":3856,"name":"吉慶社區_聖誕巷","lat":25.11438,"lng":121.51082,"cat":"nature","desc":"三愛教會把聖誕樹從室內搬到街上，教友也開始在各自家門口掛燈。街坊陸續加入佈置，使北投這條尋常小巷有了「聖誕巷」之名。","area":"北投區・臺北市","ph":"觀"},{"id":3857,"name":"吟松閣","lat":25.137274,"lng":121.514307,"cat":"history","tag":"古蹟","desc":"幽雅路上的日式木造旅館以黑瓦平房為主，部分建築有兩層。從木門樓、魚池與小拱橋，到石階旁的石燈籠，庭園仍保留早年的布置。","area":"北投區・臺北市","ph":"文"},{"id":3858,"name":"周氏節孝坊","lat":25.134127,"lng":121.497783,"cat":"history","tag":"古蹟","desc":"北投的牌坊為清代女子周絹而立，紀念她早年喪夫後獨力撫養孩子、侍奉公婆。從當年呈報建坊的過程，也可認識清代地方的旌表制度。","area":"北投區・臺北市","ph":"文"},{"id":3859,"name":"國民革命軍陣亡政工人員紀念碑","lat":25.139505,"lng":121.491591,"cat":"history","tag":"歷史建築","desc":"這座紀念碑為政治作戰學校的學生而立。他們獲分發到部隊實習，於東山島戰役中陣亡，校方的這段歷史也因此留在碑名之中。","area":"北投區・臺北市","ph":"文"},{"id":3860,"name":"地熱谷_地獄谷_鬼湖","lat":25.13776,"lng":121.51162,"cat":"scenic","desc":"北投溫泉的源頭之一藏在這處山谷，水面常年籠罩著帶硫磺氣味的煙霧。翻湧的白煙讓人聯想到幽冥景象，因而有鬼湖、地獄谷等別稱。","area":"北投區・臺北市","ph":"觀"},{"id":3861,"name":"夢幻湖","lat":25.16699,"lng":121.55956,"cat":"nature","desc":"七星山東南側的濕地孕育了少見的臺灣水韭，湖岸還有狹葉泥炭蘚等植物。沿步道到觀景臺，常可看見雲霧飄移，使湖面時隱時現。","area":"北投區・臺北市","ph":"觀"},{"id":3862,"name":"大屯瀑布","lat":25.161833,"lng":121.536861,"cat":"scenic","desc":"陽明山公園附近的溪谷有多道瀑布，沿途步道會經過長滿青苔的長廊。步道盡頭設有觀景臺，眼前景色由近處瀑流轉為遠方的臺北盆地。","area":"北投區・臺北市","ph":"觀"},{"id":3863,"name":"天狗庵史蹟公園","lat":25.135833,"lng":121.506563,"cat":"worship","desc":"這片日式庭園原址是北投早期民營溫泉旅館「天狗庵」。旅館見證地方溫泉事業的起步，如今改作史蹟公園，延續溫泉鄉的風貌。","area":"北投區・臺北市","ph":"觀"},{"id":3864,"name":"張學良故居","lat":25.145706,"lng":121.504421,"cat":"history","tag":"歷史建築","desc":"這處住宅是西安事變重要人物張學良在臺遭軟禁多年的居所。除主屋與門房，基地裡還有崗哨，以及兼具防空功能的地下禮拜堂。","area":"北投區・臺北市","ph":"文"},{"id":3865,"name":"復興三路櫻花隧道","lat":25.14896,"lng":121.50449,"cat":"nature","desc":"北投大屯里的居民與公所長年照顧復興三路兩側的櫻樹。盛開時，通往白宮山莊的路段被兩排花枝圍起，形成山路上的櫻花隧道。","area":"北投區・臺北市","ph":"觀"},{"id":3866,"name":"復興武德精神堡壘","lat":25.139505,"lng":121.491591,"cat":"history","tag":"歷史建築","desc":"這座建築落成於一九五五年，與政治作戰學校的校史相連。校方以它象徵「復興武德」的精神，這層紀念意義也留在堡壘的名稱中。","area":"北投區・臺北市","ph":"文"},{"id":3867,"name":"新北投善光寺","lat":25.13551,"lng":121.5189,"cat":"worship","desc":"這座樸素的日式寺院屬淨土宗西山深草派，曾是日本移民的信仰中心。開花時可從入口階梯看寒櫻與山櫻花，兩旁石燈籠也成了花景的一部分。","area":"北投區・臺北市","ph":"觀"},{"id":3868,"name":"新北投車站","lat":25.136708,"lng":121.501892,"cat":"culture","tag":"歷史建築","desc":"最初名為新北投乘降場的車站，停駛後曾拆遷到臺灣民俗村重建。居民與市府多年爭取，讓一度離開北投的站體又回到臺北。","area":"北投區・臺北市","ph":"文"},{"id":3869,"name":"新生街5號、7號、9號","lat":25.154457,"lng":121.538559,"cat":"history","tag":"歷史建築","desc":"草山的日式溫泉度假別莊在戰後迎來新住戶，其中兩間曾是居瀛玖與丈夫張鳴的家。這排房舍記下草山從休養地轉為黨政軍要地的過程。","area":"北投區・臺北市","ph":"文"},{"id":3870,"name":"梨洲樓","lat":25.154207,"lng":121.551082,"cat":"history","tag":"歷史建築","desc":"這棟二層中庭合院曾供青邨幹訓班與革命實踐研究院的學員住宿。樓名紀念明儒黃梨洲，入口還嵌著帶有蔣中正落款的題名。","area":"北投區・臺北市","ph":"文"},{"id":3871,"name":"洲美蜆仔港公園","lat":25.100999,"lng":121.511201,"cat":"nature","desc":"洲美的濕地公園保留舊雙溪河道和護坡，洪泛時可容納多出的水量。平日則可漫步岸邊，在東側淺灘觀察草澤與濕生植物。","area":"北投區・臺北市","ph":"觀"},{"id":3872,"name":"湖底路93號房舍","lat":25.154315,"lng":121.5387,"cat":"history","tag":"歷史建築","desc":"湖底路的這棟房舍原由日本人在日治時期興建，後來也曾有英國人入住。房屋其後成為臺北市政府宿舍，留下數段不同的居住歷史。","area":"北投區・臺北市","ph":"文"},{"id":3873,"name":"照明淨寺_情人廟","lat":25.13161,"lng":121.51381,"cat":"worship","desc":"軍艦岩前山坡上的寺院四面環山，從廟前可遠望關渡平原。主殿的輪廓像一座尖塔，頂端盤踞著龍形裝飾，是這裡醒目的外觀。","area":"北投區・臺北市","ph":"觀"},{"id":3874,"name":"硫磺谷_大磺嘴","lat":25.14358,"lng":121.52119,"cat":"scenic","desc":"陽明山的地熱谷地周圍分布火成岩與沉積岩，是觀察地質的地方。當地硫酸鹽泉帶有硫磺氣味，泉水呈黃白色，俗稱白磺。","area":"北投區・臺北市","ph":"觀"},{"id":3875,"name":"章嘉活佛舍利塔塔蹟","lat":25.130611,"lng":121.507563,"cat":"history","tag":"歷史建築","desc":"塔蹟與藏傳佛教格魯派章嘉活佛的傳承有關。來臺的章嘉呼圖克圖曾擔任中國佛教會理事長，這處遺跡也連結臺灣的近代佛教史。","area":"北投區・臺北市","ph":"文"},{"id":3876,"name":"竹子湖海芋季","lat":25.1755,"lng":121.53678,"cat":"scenic","desc":"竹子湖的花田以白色海芋為主，花季時水田間可見成片白色苞片。形似倒立馬蹄的部分其實是佛焰苞，也是海芋別稱馬蹄蓮的由來。","area":"北投區・臺北市","ph":"觀"},{"id":3877,"name":"竹子湖蓬萊米原種田事務所暨種籾倉庫、竹子山莊","lat":25.168479,"lng":121.53933,"cat":"history","tag":"歷史建築","desc":"竹子湖的氣候適合試種稻米，日治時期在此設原種田，培育良種分給各地農民。設於田區的事務所與倉庫，留下蓬萊米育種的歷史。","area":"北投區・臺北市","ph":"文"},{"id":3878,"name":"臺北市立圖書館北投分館","lat":25.13653,"lng":121.50638,"cat":"nature","desc":"北投公園林木間的圖書館鄰近溫泉博物館，是臺灣早期的綠建築圖書館。館藏以生態保育為特色，自然觀察也從書頁延伸到窗外的鳥語與綠意。","area":"北投區・臺北市","ph":"觀"},{"id":3879,"name":"舜水樓","lat":25.155384,"lng":121.552588,"cat":"history","tag":"歷史建築","desc":"青邨幹訓班與革命實踐研究院曾把這棟樸素樓房用作講堂與講師宿舍。樓名取自明儒朱舜水，入口處尚可見蔣中正落款的題名。","area":"北投區・臺北市","ph":"文"},{"id":3880,"name":"草山教師研習中心","lat":25.150431,"lng":121.549832,"cat":"history","tag":"古蹟","desc":"陽明山上的教師研習中心，原是草山溫泉的一座公共浴場。昔日澡堂分設男女浴池，以八角形浴池最具特色，後來也曾用作管理局辦公廳舍。","area":"北投區・臺北市","ph":"文"},{"id":3881,"name":"草山水道系統","lat":25.159419,"lng":121.534785,"cat":"history","tag":"古蹟","desc":"日治時期為供應日益成長的臺北人口，工程人員在草山比較多處泉源。選定的兩處水源水質穩定，也避開硫磺污染，留下山區供水工程的歷史。","area":"北投區・臺北市","ph":"文"},{"id":3882,"name":"草山行館","lat":25.154475,"lng":121.538019,"cat":"culture","tag":"歷史建築","desc":"這棟原屬臺灣糖業株式會社的招待所，戰後曾是蔣中正的臨時官邸與避暑行館。石造牆體配上日式門窗，從行館一帶可俯望臺北盆地。","area":"北投區・臺北市","ph":"文"},{"id":3883,"name":"行天宮北投分宮_忠義廟","lat":25.13701,"lng":121.47757,"cat":"worship","desc":"北投居民俗稱這座關帝廟為忠義廟，主祀關聖帝君，建廟比民權東路本宮更早。地方對廟名如此熟悉，附近車站也沿用「忠義」為名。","area":"北投區・臺北市","ph":"觀"},{"id":3884,"name":"財團法人台北市關渡宮","lat":25.1177,"lng":121.46395,"cat":"worship","desc":"淡水河與基隆河匯流處附近的媽祖廟，有三百多年的歷史。參拜時可以細看廟宇建築與古文物，也能從河畔欣賞觀音山、大屯山一帶的落日。","area":"北投區・臺北市","ph":"觀"},{"id":3885,"name":"農禪寺","lat":25.122771,"lng":121.495846,"cat":"worship","tag":"歷史建築","desc":"東初上人創寺時以禪修為主、耕作維生，「農禪」二字就從這樣的日常而來。後由聖嚴法師接任住持，成為法鼓山推廣禪修的重要場所。","area":"北投區・臺北市","ph":"文"},{"id":3886,"name":"長老教會北投教堂","lat":25.131312,"lng":121.50137,"cat":"worship","tag":"古蹟","desc":"加拿大傳教士吳威廉設計了這座紅磚小教堂，屋頂以木屋架支撐。早年的信徒多是北投一帶的平埔族人，留下地方族群與基督信仰的連結。","area":"北投區・臺北市","ph":"文"},{"id":3887,"name":"關渡日軍震洋特攻艇收納所","lat":25.117352,"lng":121.463494,"cat":"history","tag":"歷史建築","desc":"關渡山壁的洞穴是第二次世界大戰末期人工開鑿的遺跡，曾供日軍存放震洋艇。洞壕之間以橫坑相通，留下戰時軍事設施的空間形貌。","area":"北投區・臺北市","ph":"文"},{"id":3888,"name":"關渡水岸公園","lat":25.11735,"lng":121.46322,"cat":"nature","desc":"關渡河岸的公園腹地開闊，人行步道與自行車道沿著水邊展開。這片今日供人休憩的水岸，早年曾是硫磺產地與出口中心。","area":"北投區・臺北市","ph":"觀"},{"id":3889,"name":"關渡碼頭","lat":25.120871,"lng":121.461979,"cat":"scenic","desc":"昔日甘豆門的港口背靠觀音山與大屯山，面向淡水河，曾是先民移入北臺灣的入口。兩河匯流處後來逐漸淤積，碼頭如今也成了散步看水的地方。","area":"北投區・臺北市","ph":"觀"},{"id":3890,"name":"陽明公園","lat":25.15921,"lng":121.54013,"cat":"nature","desc":"這一帶昔日因茅草遍地而稱草山，戰後為紀念王陽明改名陽明山。公園隨後闢建，在臺北北側山區留下一片規模開闊的公共綠地。","area":"北投區・臺北市","ph":"觀"},{"id":3891,"name":"陽明山40砲陣地紀念公園","lat":25.15428,"lng":121.54149,"cat":"nature","desc":"昔日守衛草山行館的防空砲兵陣地，整修後成了紀念公園。退役的四十公釐高射砲與立體彩繪並列，呈現當年官兵駐守山區的景象。","area":"北投區・臺北市","ph":"觀"},{"id":3892,"name":"陽明山中山樓","lat":25.155619,"lng":121.552655,"cat":"culture","tag":"古蹟","desc":"為紀念孫中山百年誕辰而建的山中樓宇，由建築師修澤蘭規劃。全樓採中國宮殿式設計，原先作為重要會議與接待國賓的場所。","area":"北投區・臺北市","ph":"文"},{"id":3893,"name":"陽明山辛亥光復樓","lat":25.15959,"lng":121.53978,"cat":"nature","desc":"陽明公園中央的樹林裡藏著一座兩層樓閣，為紀念辛亥起義六十週年而建。從樓上可俯看池中錦鯉，也能越過樹梢遠望臺北盆地。","area":"北投區・臺北市","ph":"觀"},{"id":3894,"name":"陽明書屋","lat":25.16164,"lng":121.53894,"cat":"culture","desc":"舊稱中興賓館的山間行館，曾供蔣中正夏季避暑與接待賓客。如今成為陽明山國家公園的人文史蹟，可透過導覽認識山區的近代歷史。","area":"北投區・臺北市","ph":"觀"},{"id":3895,"name":"青邨國建館","lat":25.155619,"lng":121.552655,"cat":"culture","tag":"歷史建築","desc":"館址原是日治時期草山林間學校，戰後由國防部接收為陽明山莊。基地曾供青邨幹部訓練班及革命實踐研究院使用，見證草山用途的轉變。","area":"北投區・臺北市","ph":"文"},{"id":3896,"name":"青邨圓講堂","lat":25.155619,"lng":121.552655,"cat":"history","tag":"歷史建築","desc":"青邨的圓講堂曾是國防部陽明山莊的視聽教室，供幹部訓練使用。外觀與附近中山樓、國建館同採中國宮殿式風格，可對照整組建築的設計。","area":"北投區・臺北市","ph":"文"},{"id":3897,"name":"CITYLINK南港店","lat":25.052645,"lng":121.605982,"cat":"other","desc":"南港車站旁的百貨空間以購物度假為設計概念，匯集服飾、餐飲與親子娛樂。除了主題餐廳和特色飲品，也留有能坐下來休息的地方。","area":"南港區・臺北市","ph":"觀"},{"id":3898,"name":"N24 台北方舟","lat":25.04926,"lng":121.583778,"cat":"culture","desc":"這棟老倉庫曾屬臺灣電力株式會社松山工場，戰後由臺電松山修理廠沿用。轉作辦公空間時，重新調整了舊倉庫原本不足的採光與通風。","area":"南港區・臺北市","ph":"觀"},{"id":3899,"name":"三重世貿公園","lat":25.05791,"lng":121.61528,"cat":"nature","desc":"南港展覽館與軟體園區之間，留有一塊約一點二公頃的公共綠地。公園位於經貿二路巷內，為周圍密集的辦公大樓提供休憩空間。","area":"南港區・臺北市","ph":"觀"},{"id":3900,"name":"傅斯年圖書館","lat":25.040381,"lng":121.616643,"cat":"culture","tag":"歷史建築","desc":"這座圖書館最初由歷史語言研究所籌建，作為研究中心的附設館舍。傅斯年留下的藏書捐贈給史語所後，圖書館便以這位故所長的名字命名。","area":"南港區・臺北市","ph":"文"},{"id":3901,"name":"南港公園","lat":25.0457,"lng":121.59213,"cat":"nature","desc":"東新街與成福路口的公園依山傍水，入口立著中式牌樓。園內有天然埤塘，近處的水景與遠方的四獸山，構成南港居民熟悉的公園景色。","area":"南港區・臺北市","ph":"觀"},{"id":3902,"name":"南港臺電倉庫","lat":25.04903,"lng":121.582818,"cat":"history","tag":"古蹟","desc":"臺電昔日的北部中心倉庫緊鄰鐵道，行政辦公與倉儲建築由北往南陸續興建。北側建築群大致完整，還能看出不同年代的設施如何配置。","area":"南港區・臺北市","ph":"文"},{"id":3903,"name":"南港衛生大樓","lat":25.049152,"lng":121.594413,"cat":"history","tag":"歷史建築","desc":"戰後由美援與省政府共同出資的衛生大樓，曾容納衛生試驗、疫苗及瘧疾研究單位。這棟建築記錄了臺灣集中公共衛生與防疫研究的歷史。","area":"南港區・臺北市","ph":"文"},{"id":3904,"name":"南港闕家祖厝德成居","lat":25.050948,"lng":121.615377,"cat":"history","tag":"歷史建築","desc":"闕家先祖來自福建泉州南安，清代渡海後先住橫科頭，再到南港仔莊開墾田野。德成居的家族故事，連著早期南港移民落腳成家的歷程。","area":"南港區・臺北市","ph":"文"},{"id":3905,"name":"原南港輪胎南港廠煙囪","lat":25.053322,"lng":121.60011,"cat":"history","tag":"歷史建築","desc":"輪胎工廠的舊煙囪在地震後歷經修補與遷移，如今留下基座。細看其開口與風門，仍可辨認曾經用來促進空氣對流的工業構造。","area":"南港區・臺北市","ph":"文"},{"id":3906,"name":"天人境界","lat":25.05609,"lng":121.61759,"cat":"culture","desc":"南港展覽館外的公共藝術由兩隻巨手構成，一手指向天空，一手朝向土地。手指交會處象徵天人相接，旁邊的彩環則有無限延展之意。","area":"南港區・臺北市","ph":"觀"},{"id":3907,"name":"山水綠生態公園","lat":25.0296,"lng":121.62131,"cat":"nature","desc":"南港與深坑交界處的山谷，曾是垃圾掩埋場，復育後成了大型生態綠地。起伏地勢間鋪展草坪與步道，散步時四面都能看見青翠山巒。","area":"南港區・臺北市","ph":"觀"},{"id":3908,"name":"幾米主題南港站","lat":25.051857,"lng":121.606576,"cat":"culture","desc":"南港站內有六幅取材自幾米繪本《地下鐵》的大型彩色壁畫。原本在書頁裡發生的故事，放進真實的車站空間後，也成了沿途可看的風景。","area":"南港區・臺北市","ph":"觀"},{"id":3909,"name":"新新公園","lat":25.05136,"lng":121.5903,"cat":"nature","desc":"這座南港綠地由臺鐵捐地開闢，以生態濕地為主題。原生植物與誘蝶、誘鳥植栽交錯種植，讓居民能在城市裡觀察不同生物的棲地。","area":"南港區・臺北市","ph":"觀"},{"id":3910,"name":"胡適紀念館","lat":25.04053,"lng":121.61621,"cat":"culture","desc":"胡適晚年回臺擔任中央研究院院長的生活足跡，保留在這座紀念館裡。從倡議自由主義到重視求證的治學態度，可在此認識他的思想背景。","area":"南港區・臺北市","ph":"觀"},{"id":3911,"name":"臺北流行音樂中心","lat":25.052115,"lng":121.598592,"cat":"culture","desc":"市民大道將園區分成南北兩部分，北側表演廳專為流行音樂演出設計。南側則以主題展覽介紹臺灣流行音樂的發展，補上舞臺以外的故事。","area":"南港區・臺北市","ph":"觀"},{"id":3912,"name":"臺電中心倉庫－P庫廠房","lat":25.04903,"lng":121.582818,"cat":"history","tag":"歷史建築","desc":"這棟廠房屬臺電中心倉庫群，園區源於日治時期的松山工場與倉庫。昔日工場修理發電、送電設備，也製作零件，維持日常供電所需。","area":"南港區・臺北市","ph":"文"},{"id":3913,"name":"麗山農民廣場_麗山公園","lat":25.02242,"lng":121.59585,"cat":"nature","desc":"廣場地面鑲著蘇軾〈定風波〉詞句，呼應這裡曾是學童讀書的書院。崩塌地整治後，日式涼亭、落羽松與景觀石為山間留出休息空間。","area":"南港區・臺北市","ph":"觀"},{"id":3914,"name":"「坪頂古圳」（含坪頂舊圳、坪頂新圳、登峰圳）","lat":25.134914,"lng":121.583233,"cat":"history","tag":"文化景觀","desc":"坪頂一帶的水圳包括舊圳、新圳與登峰圳。清代的舊圳和新圳由地方人士分別集資興築，水路穿過山洞，是農家合力引水的遺跡。","area":"士林區・臺北市","ph":"文"},{"id":3915,"name":"三腳渡擺渡口","lat":25.0807,"lng":121.51821,"cat":"nature","desc":"後港墘的渡口曾聯繫社子、劍潭與大龍峒，也是居民停靠船隻的港灣。耙蜆、捕魚與河邊養鴨，都是當年渡口人家維持生計的方式。","area":"士林區・臺北市","ph":"觀"},{"id":3916,"name":"內雙溪自然中心","lat":25.116021,"lng":121.577161,"cat":"nature","desc":"大崙頭山與碧溪流域間有一片茂密森林，山谷裡穿過多條自然步道。循著林蔭與溪谷觀察山林生態，可以理解這裡為何有「臺北小溪頭」之稱。","area":"士林區・臺北市","ph":"觀"},{"id":3917,"name":"八芝蘭番仔井","lat":25.121092,"lng":121.534635,"cat":"history","tag":"古蹟","desc":"士林這口老井曾以「番井沸泉」之名列入芝蘭八景。從留存的井與舊景名，可以窺見早年居民如何看待地方水源及其風景。","area":"士林區・臺北市","ph":"文"},{"id":3918,"name":"原住民文化主題公園","lat":25.1016,"lng":121.55077,"cat":"nature","desc":"故宮附近的開放綠地以原住民族文化為主題，步道地磚飾有圖騰紋樣。從入口一路走向湖畔與林蔭，文化圖案也隨著腳步展開。","area":"士林區・臺北市","ph":"觀"},{"id":3919,"name":"原士林公會堂","lat":25.092238,"lng":121.525072,"cat":"history","tag":"歷史建築","desc":"士林的舊公會堂曾讓居民團體、學校與社團在此集會交流。戰後更名中山堂，又一度成為地方聯合授課的空間，留下不同世代的記憶。","area":"士林區・臺北市","ph":"文"},{"id":3920,"name":"原巴旅館澡堂","lat":25.146965,"lng":121.549286,"cat":"history","tag":"歷史建築","desc":"這處澡堂曾屬草山的巴旅館，是日治時期山區溫泉休養文化的一部分。戰後由陽明山管理局接手，並改建作草山管理辦公室。","area":"士林區・臺北市","ph":"文"},{"id":3921,"name":"原熱帶醫學研究所士林支所本館","lat":25.088419,"lng":121.528001,"cat":"culture","tag":"古蹟","desc":"士林福德洋山子腳的舊研究建築，與日治時期熱帶醫學及公共衛生研究有關。當時由總督府營繕部門設計監造，留下官方研究機構發展的歷史。","area":"士林區・臺北市","ph":"文"},{"id":3922,"name":"台北奧萬大","lat":25.142461,"lng":121.569308,"cat":"scenic","desc":"陽明山這座園圃在春天便能賞楓，滿園紅葉和一般想像的秋日景色不同。園內還有由苗木培育的松、櫻、柏與茶花，可對照各自姿態。","area":"士林區・臺北市","ph":"觀"},{"id":3923,"name":"台北花卉村","lat":25.094679,"lng":121.497749,"cat":"nature","desc":"社子島昔日的砂石場經栽植整理，成了以花草園藝為主的園地。從蘭花溫室、盆栽到馬賽克手作教室，串起種植、觀賞與創作的體驗。","area":"士林區・臺北市","ph":"觀"},{"id":3924,"name":"國立故宮博物院","lat":25.100656,"lng":121.550554,"cat":"worship","tag":"歷史建築","desc":"故宮的館藏源於接收的清宮文物，遷臺後曾暫存臺中霧峰北溝。經清點、研究與展出，才在臺北外雙溪建立今天的館舍。","area":"士林區・臺北市","ph":"文"},{"id":3925,"name":"國立故宮博物院","lat":25.10236,"lng":121.54849,"cat":"worship","desc":"外雙溪的宮殿式館舍典藏歷代藝術，其中許多文物承自宋、元、明、清的宮廷收藏。館內以數層展廳呈現作品，樓上另有名為三希堂的休憩空間。","area":"士林區・臺北市","ph":"觀"},{"id":3926,"name":"國立臺灣科學教育館","lat":25.095592,"lng":121.516643,"cat":"culture","desc":"士林的科教館以動手和觀察認識科學，互動裝置旁也有實驗示範與情境展示。鄰近的天文館和兒童新樂園，讓這一帶形成集中的科教園區。","area":"士林區・臺北市","ph":"觀"},{"id":3927,"name":"圓山水神社","lat":25.08435,"lng":121.52722,"cat":"history","desc":"貯水池旁這座日治時期神社仍留著早年的格局。沿階梯靠近，可見石燈籠、社名碑與手水缽，兩隻狛犬守在神社之前。","area":"士林區・臺北市","ph":"觀"},{"id":3928,"name":"士林公有市場","lat":25.088717,"lng":121.524152,"cat":"history","tag":"古蹟","desc":"清代士林建街時，慈諴宮前的廟埕就是市集。日治初期將大南路廟口闢為公有市場，讓早年因信仰而聚集的買賣有了固定場所。","area":"士林區・臺北市","ph":"文"},{"id":3929,"name":"士林區仁民路50號","lat":25.133255,"lng":121.542896,"cat":"history","tag":"歷史建築","desc":"仁民路上的住宅建於一九六一年，最初曾供美軍協防司令居住。後來房屋作為美國在臺協會官邸，留下士林與駐臺機構的往來歷史。","area":"士林區・臺北市","ph":"文"},{"id":3930,"name":"士林大東路54號店屋","lat":25.089759,"lng":121.525497,"cat":"history","tag":"古蹟","desc":"大東路上的這棟店屋，坐落在日治時期士林街的中心地帶。當年的土地登記仍記有七星郡士林街的舊番地，可據此辨認老市街位置。","area":"士林區・臺北市","ph":"文"},{"id":3931,"name":"士林慈諴宮","lat":25.089679,"lng":121.524711,"cat":"worship","tag":"古蹟","desc":"清代創建的媽祖廟後來遷至八芝蘭新街，成為街庄居民的信仰中心。重建時左右兩側由不同派別的匠師承作，細看雕飾可對照兩邊手藝。","area":"士林區・臺北市","ph":"文"},{"id":3932,"name":"士林潘宅","lat":25.089539,"lng":121.524062,"cat":"history","tag":"古蹟","desc":"潘家先祖在清代渡臺，後代參與北臺灣拓墾與地方教育。家族成員潘永清也曾規劃士林新街與慈諴宮，宅邸所繫的家史與士林發展密不可分。","area":"士林區・臺北市","ph":"文"},{"id":3933,"name":"士林神農宮(芝蘭廟)","lat":25.09791,"lng":121.526239,"cat":"worship","tag":"古蹟","desc":"漳州移民建立的芝蘭廟在清代因水災遷至現址，見證士林街庄的發展。廟宇歷經多次修繕，正殿曾整理成一殿兩側各帶護室的格局。","area":"士林區・臺北市","ph":"文"},{"id":3934,"name":"士林紙廠","lat":25.09173,"lng":121.524304,"cat":"history","tag":"歷史建築","desc":"這處紙廠源於日治時期的臺灣製紙株式會社，戰後曾由臺灣紙業公司接收。後來轉為民營士林紙業，直到生產成本增加才結束造紙。","area":"士林區・臺北市","ph":"文"},{"id":3935,"name":"天母運動場區_棒球場","lat":25.113235,"lng":121.532983,"cat":"other","desc":"忠誠路與士東路口的球場可容納約一萬名觀眾，是天母重要的棒球場地。場內改鋪人工草皮後，也寫下臺灣棒球場設施發展的一頁。","area":"士林區・臺北市","ph":"觀"},{"id":3936,"name":"岩山新村","lat":25.104033,"lng":121.536155,"cat":"history","tag":"歷史建築","desc":"戰後的岩山一帶成為情報工作基地，軍情局人員依自身需要興建住屋。新村因各時期陸續增建而成形，保留了這群工作者及家屬的生活記憶。","area":"士林區・臺北市","ph":"文"},{"id":3937,"name":"平等里櫻花","lat":25.12955,"lng":121.5713,"cat":"nature","desc":"陽明山平等里寧靜的巷弄間，可見沿路綻放的山櫻花。周邊還有休閒農園、茶點與農家菜，讓山村日常也成為賞花散步的一部分。","area":"士林區・臺北市","ph":"觀"},{"id":3938,"name":"張羣故居","lat":25.090948,"lng":121.529956,"cat":"history","tag":"古蹟","desc":"王大閎為曾任行政院長的張羣設計這處住宅，外側設有鋼筋混凝土柱廊。清水磚、斬石子與壽字空心磚搭配使用，附屬房舍還留有採光天井。","area":"士林區・臺北市","ph":"文"},{"id":3939,"name":"摩耶精舍（張大千園邸）","lat":25.102693,"lng":121.554836,"cat":"history","tag":"古蹟","desc":"張大千在外雙溪購地建起摩耶精舍，並在此安度晚年。他辭世後家人依遺囑捐出園邸，由國立故宮博物院管理並設立紀念館。","area":"士林區・臺北市","ph":"文"},{"id":3940,"name":"擎天崗","lat":25.16727,"lng":121.57419,"cat":"nature","desc":"陽明山的草原步道穿過連綿的草坡，四周山稜向遠方展開。天氣晴朗時，除了周圍群山，還能從約七百七十公尺高處遠望大臺北。","area":"士林區・臺北市","ph":"觀"},{"id":3941,"name":"新園街3號","lat":25.151121,"lng":121.551568,"cat":"history","tag":"歷史建築","desc":"陽明山莊設立革命實踐研究所後，學員與職員也住進附近的新園街。據前屋主回憶，鄰舍多是同袍，一條街逐漸形成近似眷村的生活圈。","area":"士林區・臺北市","ph":"文"},{"id":3942,"name":"社子島下溪砂尾陳家祖厝","lat":25.107179,"lng":121.479903,"cat":"history","tag":"歷史建築","desc":"下溪砂尾的陳家祖厝採閩南一條龍格局，門面以木造，正身入口內凹。石砌牆基、磚牆與編竹夾泥做法並存，可近看不同材料如何相接。","area":"士林區・臺北市","ph":"文"},{"id":3943,"name":"社子島中洲埔李宅","lat":25.106046,"lng":121.477627,"cat":"history","tag":"歷史建築","desc":"李水交興建的三合院原供家族四房共居，坐東北朝西南。木板雙開門兩旁裝著洋式上下推拉窗，特殊的窗扇分割是立面上的看點。","area":"士林區・臺北市","ph":"文"},{"id":3944,"name":"社子島善居室","lat":25.09571,"lng":121.495585,"cat":"history","tag":"歷史建築","desc":"陳家的閩南四合院以三開間木造門屋迎客，屋頂鋪閩南瓦。從門面走進院內，還能辨認穿斗式木構的組合方式。","area":"士林區・臺北市","ph":"文"},{"id":3945,"name":"社子島李和興宅","lat":25.104576,"lng":121.482978,"cat":"history","tag":"歷史建築","desc":"社子島的李家宅院採合院格局，房舍有上下兩層。這種立體配置留下當地合院住宅的另一種樣貌，也是理解島上民居的例子。","area":"士林區・臺北市","ph":"文"},{"id":3946,"name":"社子島李忠記宅","lat":25.106315,"lng":121.474432,"cat":"history","tag":"歷史建築","desc":"日治時期興建的李忠記宅，是社子島保留下來的傳統漢式住宅。單層正身與兩側護龍共同構成三合院的格局。","area":"士林區・臺北市","ph":"文"},{"id":3947,"name":"社子島浮洲王宅","lat":25.110196,"lng":121.490045,"cat":"history","tag":"歷史建築","desc":"浮洲的王家宅邸由王孝在清末興建。王孝的一生跨越清代與日治時期，這棟家屋也留下社子島昔日家族居住的紀錄。","area":"士林區・臺北市","ph":"文"},{"id":3948,"name":"社子島溪洲底王宅","lat":25.099377,"lng":121.495575,"cat":"history","tag":"歷史建築","desc":"溪洲底的王姓家族原籍福建泉州同安，由福壽公一支在此繁衍。依王家後代的說法，祖屋推測在清代已經興建，是家族定居的歷史痕跡。","area":"士林區・臺北市","ph":"文"},{"id":3949,"name":"社子島溪洲底街屋","lat":25.096169,"lng":121.495764,"cat":"structure","tag":"歷史建築","desc":"這組閩南街屋建在李家土地上，房屋則由其他家族興建。兩戶共用一面牆，下方有石砌基礎，騎樓地坪也作了墊高處理。","area":"士林區・臺北市","ph":"文"},{"id":3950,"name":"社子島溪洲底郭宅","lat":25.097772,"lng":121.495486,"cat":"history","tag":"歷史建築","desc":"溪洲底的郭宅採閩南一條龍形式，入口踏階接著石砌的房屋基礎。家族屬於汾陽郭氏，也參與地方奉祀郭子儀的信仰組織。","area":"士林區・臺北市","ph":"文"},{"id":3951,"name":"社子島燕樓李家","lat":25.095937,"lng":121.495434,"cat":"history","tag":"歷史建築","desc":"清乾隆年間，來自福建同安的李家在溪洲底落腳。家族以祖先曾住燕京東角樓而稱燕樓李，祖厝中也奉有靖春公等先人的牌位。","area":"士林區・臺北市","ph":"文"},{"id":3952,"name":"社子島玄安宮","lat":25.096711,"lng":121.49515,"cat":"worship","tag":"歷史建築","area":"士林區・臺北市","ph":"文"},{"id":3953,"name":"社子島頂溪砂尾陳宅","lat":25.104819,"lng":121.485461,"cat":"history","tag":"歷史建築","desc":"這座陳家祖厝由渡臺始祖士朝公長房的後人興建，正身有五開間。三合院的護龍原本是覆草的竹編牆，日後才改成磚牆。","area":"士林區・臺北市","ph":"文"},{"id":3954,"name":"福安河濱公園","lat":25.096151,"lng":121.493592,"cat":"nature","desc":"社子島福安碼頭附近的堤壁上，畫著一組名為「福安漫遊組曲」的插畫。圖案用幾何形狀交疊構成，沿著河岸走便能尋找在地動植物的身影。","area":"士林區・臺北市","ph":"觀"},{"id":3955,"name":"福林公園","lat":25.09481,"lng":121.52904,"cat":"nature","desc":"中山北路與福林路口的三角形綠地，以六組抽象雕塑為特色。藝術家黎志文取材自太陽、雲、山、瀑布、水與井，在園中呈現不同的自然意象。","area":"士林區・臺北市","ph":"觀"},{"id":3956,"name":"羅友倫故居","lat":25.122407,"lng":121.52828,"cat":"history","tag":"歷史建築","desc":"這棟住宅是政府遷臺後首任陸軍軍官學校校長羅友倫的故居。國防部在一九六〇年代拆除原有日式木屋，沿著舊基礎改建成屋。","area":"士林區・臺北市","ph":"文"},{"id":3957,"name":"臺北表演藝術中心","lat":25.085124,"lng":121.524369,"cat":"culture","desc":"這座表演藝術中心以三加一的劇場設計規劃演出空間，讓不同形式的創作在此相遇。除了舞臺演出，也重視人才培育與藝術走入日常。","area":"士林區・臺北市","ph":"觀"},{"id":3958,"name":"臺灣戲曲中心","lat":25.10232,"lng":121.51963,"cat":"culture","desc":"國光劇團、臺灣國樂團與臺灣音樂館共同進駐這座專業劇場。館舍除了提供戲曲與音樂演出，也將藝術教育帶進士林的日常生活。","area":"士林區・臺北市","ph":"觀"},{"id":3959,"name":"芝山岩惠濟宮","lat":25.102999,"lng":121.530723,"cat":"worship","tag":"古蹟","desc":"士林芝山岩上的宮廟在清乾隆年間興建，主祀開漳聖王陳元光。此後從清代到日治時期多次重修，留下地方信仰世代延續的痕跡。","area":"士林區・臺北市","ph":"文"},{"id":3960,"name":"芝山岩隘門","lat":25.103069,"lng":121.530754,"cat":"history","tag":"古蹟","desc":"惠濟宮西側的隘門約始建於清道光年間，是聚落控制出入的防禦設施。從它扼守險要的選址，可了解早年居民如何防範械鬥與盜匪。","area":"士林區・臺北市","ph":"文"},{"id":3961,"name":"芝山文化生態綠園","lat":25.104277,"lng":121.531924,"cat":"nature","desc":"芝山岩的考古地層留下跨越數千年的七個文化層，也曾出土先民遺骸。這片山地後來又經歷芝山岩事件與軍事管制，交織不同時代的歷史。","area":"士林區・臺北市","ph":"觀"},{"id":3962,"name":"花卉試驗中心","lat":25.134069,"lng":121.545754,"cat":"nature","desc":"陽明山的環境適合培育低海拔溫帶花木，這裡長年收集茶花與杜鵑品種。從試驗栽培轉作開放公園後，民眾也能欣賞多年研究留下的花木。","area":"士林區・臺北市","ph":"觀"},{"id":3963,"name":"草山御賓館","lat":25.150748,"lng":121.552496,"cat":"culture","tag":"古蹟","desc":"中山樓旁山谷裡的賓館，原為接待來臺的日本皇太子裕仁而建。戰後曾短暫作蔣中正的住所，後來也曾是孫科長期居住的官邸。","area":"士林區・臺北市","ph":"文"},{"id":3964,"name":"草山派出所","lat":25.15052,"lng":121.550179,"cat":"history","tag":"歷史建築","desc":"這棟落成於一九三四年的派出所，是日治時期草山地區的管理機關。周邊連著御賓館與舊公共浴場，可看出山城早期公共設施的分布。","area":"士林區・臺北市","ph":"文"},{"id":3965,"name":"菁山路72巷20弄6號（巫雲山莊）","lat":25.138724,"lng":121.550848,"cat":"structure","tag":"歷史建築","desc":"菁山路巷內的老屋原是茅草土埆厝，重建為一條龍式住宅後，又陸續添建護龍與畜舍。屋主自用後改租作學生宿舍，亦與文化大學美術系的歷史相連。","area":"士林區・臺北市","ph":"文"},{"id":3966,"name":"菁礐古圳","lat":25.144407,"lng":121.566609,"cat":"scenic","desc":"內雙溪上游的菁礐溪流過菁山、平等、公館與溪山等里，是士林的水源地之一。在菁礐橋至竹篙嶺橋之間，可沿岸欣賞清澈溪流與溪谷生態。","area":"士林區・臺北市","ph":"觀"},{"id":3967,"name":"華岡博物館","lat":25.137483,"lng":121.540624,"cat":"culture","desc":"張其昀創辦華岡學府時，便主張圖書館與博物館並重。這座博物館由此構想發展而來，把大學教育、學術研究與對外推廣聯繫在一起。","area":"士林區・臺北市","ph":"觀"},{"id":3968,"name":"蔣中正宋美齡士林官邸","lat":25.094898,"lng":121.530152,"cat":"history","tag":"古蹟","desc":"蔣中正與宋美齡來臺後原住草山，士林官邸落成才搬入此處。福林路上的故居後來列為國定古蹟，留下兩人在臺生活的歷史場景。","area":"士林區・臺北市","ph":"文"},{"id":3969,"name":"郭元益糕餅博物館","lat":25.09757,"lng":121.52405,"cat":"culture","desc":"郭家先人從福建漳州渡臺，在士林橋頭挑著扁擔開始做糕餅生意。後代成立博物館，藉著老店傳承的資料，保留臺灣傳統糕餅業的歷史。","area":"士林區・臺北市","ph":"觀"},{"id":3970,"name":"閻錫山故居","lat":25.134083,"lng":121.560698,"cat":"history","tag":"古蹟","desc":"名為種能洞的石造住宅，寄託閻錫山對山西窯洞的鄉愁。屋舍選在可俯望淡水河口的山坡，厚實磚牆與加裝銅板的窗戶也反映當年的防護考量。","area":"士林區・臺北市","ph":"文"},{"id":3971,"name":"陽明山夜景","lat":25.13351,"lng":121.5381,"cat":"scenic","desc":"從陽明山多處展望點向下望，可以看見臺北市區的燈光與山上星空相映。竹子湖觀景臺、二子坪和擎天崗各有寬廣視野，夜色也隨地勢改變。","area":"士林區・臺北市","ph":"觀"},{"id":3972,"name":"陽明山美軍俱樂部","lat":25.135441,"lng":121.543357,"cat":"culture","tag":"歷史建築","desc":"文化大學附近的美軍宿舍群裡，留有昔日駐臺美軍及眷屬聚會的俱樂部。這裡原是陽明山聯誼社所在，記錄戰後山上社區的社交生活。","area":"士林區・臺北市","ph":"文"},{"id":3973,"name":"陽明山美軍福利社","lat":25.136902,"lng":121.543953,"cat":"history","tag":"歷史建築","desc":"這處福利社在一九五〇至六〇年代服務陽明山的美軍眷區。駐臺美軍與家屬曾在這裡採買，留下當年社區日常消費的生活記憶。","area":"士林區・臺北市","ph":"文"},{"id":3974,"name":"雙溪公園","lat":25.0985,"lng":121.5361,"cat":"nature","desc":"外雙溪與內雙溪在士林會流，山水園林也以雙溪為名。設計在平坦的三角形基地裡安排水池與迴廊，散步其間可欣賞中式庭園布局。","area":"士林區・臺北市","ph":"觀"},{"id":3975,"name":"順益台灣原住民博物館","lat":25.10097,"lng":121.55197,"cat":"culture","desc":"士林這座以臺灣原住民族為主題的私人博物館，外形是沉穩的灰色梯形。整面彩繪玻璃與入口中央刻有圖騰的石柱，從街上就清楚可見。","area":"士林區・臺北市","ph":"觀"},{"id":3976,"name":"全祥茶莊精製廠","lat":25.055052,"lng":121.508369,"cat":"history","tag":"古蹟","desc":"淡水河邊的茶廠曾供錦記與南興茶行加工茶葉，見證大稻埕製茶業的發展。日治時期臺灣文化協會也在此舉辦港町文化講座。","area":"大同區・臺北市","ph":"文"},{"id":3977,"name":"六館街尾洋式店屋（南京西路241、243、245、247、 249、251號）","lat":25.053666,"lng":121.510076,"cat":"history","tag":"歷史建築","desc":"迪化街南端入口旁的六戶洋式店屋連成完整街面，與板橋林家及六館街的發展有關。日治中期的鋼筋混凝土構造，配上各戶講究的立面裝飾。","area":"大同區・臺北市","ph":"文"},{"id":3978,"name":"十字軒糕餅舖","lat":25.055635,"lng":121.511558,"cat":"history","tag":"歷史建築","desc":"延平北路的老餅舖以漢餅聞名，祭典與訂婚都曾用到它的糕餅。建築外觀仍有戰後初期樸素的風格，保留了昔日太平町的街景印象。","area":"大同區・臺北市","ph":"文"},{"id":3979,"name":"南京西路237號暨迪化街1段2、4、6號店屋","lat":25.055105,"lng":121.510037,"cat":"history","tag":"歷史建築","desc":"南京西路與迪化街口的一組店屋，保留舊城商業街區的門牌脈絡。其中南京西路這戶早年的建物登記，列有磚造樓層與稱為亭仔腳的騎樓。","area":"大同區・臺北市","ph":"文"},{"id":3980,"name":"南京西路255號店屋","lat":25.053381,"lng":121.509959,"cat":"history","tag":"歷史建築","desc":"這間老店屋曾是板橋林家房屋租賃事業的一部分。日治時期先後有米行、信託業和日用品買賣在此經營，留下大稻埕街區商業的不同面貌。","area":"大同區・臺北市","ph":"文"},{"id":3981,"name":"南京西路257號店屋","lat":25.053377,"lng":121.509846,"cat":"history","tag":"歷史建築","desc":"板橋林家的林熊祥曾在此設立商號，經營米穀買賣與礦業。兒子林衡道也曾住在這棟店屋，父子後來都投入臺灣文史及古蹟保存。","area":"大同區・臺北市","ph":"文"},{"id":3982,"name":"南京西路25巷2、2-2、2-3號","lat":25.053323,"lng":121.520237,"cat":"structure","tag":"歷史建築","area":"大同區・臺北市","ph":"文"},{"id":3983,"name":"南京西路261號店屋","lat":25.053386,"lng":121.509709,"cat":"history","tag":"歷史建築","desc":"六館街上的店屋由仁濟醫院院長張暮年興建，他以臺灣瘧疾研究聞名。基地曾在高馬士商會的範圍內，留下大稻埕洋行活動的線索。","area":"大同區・臺北市","ph":"文"},{"id":3984,"name":"原下奎府町郵便局","lat":25.053877,"lng":121.515815,"cat":"history","tag":"歷史建築","desc":"日治時期的三等郵便局，戰後成為臺北圓環郵局。從側面可辨認前半部兩層、後半部單層的格局，反映大正後期的建築特色。","area":"大同區・臺北市","ph":"文"},{"id":3985,"name":"原周進春茶行（部分）","lat":25.05563,"lng":121.509042,"cat":"history","tag":"歷史建築","desc":"茶行的單層製茶工場以紅磚、木構與瓦頂建成，曾在八七水災後修復。另一棟洋風棧房後來改作偶戲博物館，延續不同用途。","area":"大同區・臺北市","ph":"文"},{"id":3986,"name":"原建成區公所廳舍","lat":25.052793,"lng":121.517295,"cat":"history","tag":"歷史建築","desc":"建成區公所曾在這棟廳舍處理地方事務，後來建成區併入大同區。原有辦公空間改作建成派出所，留下街區行政沿革的痕跡。","area":"大同區・臺北市","ph":"文"},{"id":3987,"name":"原枋隙教會","lat":25.064939,"lng":121.509456,"cat":"worship","tag":"歷史建築","area":"大同區・臺北市","ph":"文"},{"id":3988,"name":"原臺北北警察署","lat":25.059009,"lng":121.51515,"cat":"history","tag":"古蹟","desc":"街角舊警署外觀呈流線形，外牆鋪著北投窯廠燒製的上釉溝面磚。轉角入口內的一樓原設有扇形羈留室，見證日治時期的警察制度。","area":"大同區・臺北市","ph":"文"},{"id":3989,"name":"台北霞海城隍廟","lat":25.0556,"lng":121.510168,"cat":"worship","tag":"古蹟","desc":"福建同安移民將霞海城隍迎到臺灣，最初在艋舺八甲莊奉祀。械鬥失火時信徒救出神像，暫安於大稻埕商鋪，後來才籌建廟宇。","area":"大同區・臺北市","ph":"文"},{"id":3990,"name":"台灣基督長老教會大稻埕教會","lat":25.059526,"lng":121.512588,"cat":"worship","tag":"古蹟","desc":"大稻埕的教堂由清末茶商李春生捐地獻建。這位推動臺灣茶葉外銷的商人也曾著書，將基督教思想與傳統儒學帶入當地的文化生活。","area":"大同區・臺北市","ph":"文"},{"id":3991,"name":"國立臺灣博物館_鐵道部園區","lat":25.048834,"lng":121.511383,"cat":"culture","desc":"鐵道部園區所在的基地，清代曾是巡撫劉銘傳設立的機器局，內有鎔鐵所與鍛工場。從造幣、金屬加工到後來的鐵道機關，留下多層工業歷史。","area":"大同區・臺北市","ph":"觀"},{"id":3992,"name":"大千百貨","lat":25.054316,"lng":121.512209,"cat":"history","tag":"歷史建築","desc":"這棟老樓曾是大千百貨公司的營業場所，商店歇業後留下建築。從房屋形式推測，仍可在此辨認戰後初期百貨店屋的面貌。","area":"大同區・臺北市","ph":"文"},{"id":3993,"name":"大稻埕公園","lat":25.05861,"lng":121.510346,"cat":"nature","desc":"歸綏街這座公園靠近迪化街，平日能聞到南北貨的香氣，年節氣氛也格外濃。因李臨秋故居就在附近，園內還設有介紹他生平的播放設備。","area":"大同區・臺北市","ph":"觀"},{"id":3994,"name":"大稻埕千秋街店屋","lat":25.05514,"lng":121.508379,"cat":"history","tag":"古蹟","desc":"港町一帶曾是大稻埕茶葉製造與加工的中心，依靠淡水河港埠而繁盛。兩棟相連的磚造街屋造型簡潔，二樓的高窗是沿街可見的細節。","area":"大同區・臺北市","ph":"文"},{"id":3995,"name":"大稻埕圓環防空蓄水池","lat":25.053772,"lng":121.514652,"cat":"history","tag":"古蹟","desc":"昔日小販聚集的圓環，戰時曾在中央開挖防空蓄水池。遇到空襲火災即可汲水滅火，地下遺跡留下街市生活之外的一段戰爭往事。","area":"大同區・臺北市","ph":"文"},{"id":3996,"name":"大稻埕慈聖宮","lat":25.060232,"lng":121.511961,"cat":"worship","tag":"古蹟","desc":"保安街巷內的媽祖廟是早年同安移民的重要信仰中心，媽祖神像曾隨移民遷到大稻埕。廟前的榕樹、攤販與老街，至今仍構成地方熟悉的風景。","area":"大同區・臺北市","ph":"文"},{"id":3997,"name":"大稻埕戲苑","lat":25.05482,"lng":121.51047,"cat":"culture","desc":"永樂市場樓上的戲苑承接大稻埕「戲窟」的傳統，在布行密集的街區裡保留了戲臺。劇場推廣歌仔戲、京劇及南北管等傳統表演。","area":"大同區・臺北市","ph":"觀"},{"id":3998,"name":"大稻埕葉晉發商號","lat":25.061303,"lng":121.509199,"cat":"history","tag":"歷史建築","desc":"昔日米糧商號的第一進用來做生意，第二進的碾米間、穀倉與宴客廳則各有用途。樓上是家人住處，一棟房子便能看出經商與生活如何相連。","area":"大同區・臺北市","ph":"文"},{"id":3999,"name":"大稻埕變電所","lat":25.056304,"lng":121.516982,"cat":"history","tag":"古蹟","desc":"這棟日治時期的電力設施，曾在臺北供電系統中擔任變電工作。從傳統商業街區留下的變電所，也能看見大稻埕走向現代都市的歷程。","area":"大同區・臺北市","ph":"文"},{"id":4000,"name":"大稻埕辜宅","lat":25.05835,"lng":121.508503,"cat":"culture","tag":"古蹟","desc":"辜顯榮在淡水河碼頭旁興建洋樓，住宅坐東朝西，面向繁忙河岸。初建時底樓用來辦事，也留下大稻埕富商在港邊經營事業的樣貌。","area":"大同區・臺北市","ph":"文"},{"id":4001,"name":"大龍峒保安宮","lat":25.073105,"lng":121.515553,"cat":"worship","tag":"古蹟","desc":"清代同安移民以供奉保生大帝的廟宇為中心，在大龍峒發展街市。廟西的四十四坎街曾有南北各二十二間店屋，與信仰中心一同見證聚落成長。","area":"大同區・臺北市","ph":"文"},{"id":4002,"name":"太平町店屋--延平北路2段79號","lat":25.056045,"lng":121.511764,"cat":"history","tag":"歷史建築","desc":"日治時期的太平町三丁目留下這棟磚造街屋，土地曾屬建昌後街的洪家。早年的登記記載它是鋪瓦的兩層住宅，可據以想像當年住家的規模。","area":"大同區・臺北市","ph":"文"},{"id":4003,"name":"太平町店屋-延平北路2段25號","lat":25.054673,"lng":121.511846,"cat":"history","tag":"歷史建築","desc":"從街上看是並排的兩間店面，走進去才知道內部原為相通的一戶。這棟太平町老屋共有前後兩進，中間以過水廊道連接。","area":"大同區・臺北市","ph":"文"},{"id":4004,"name":"太平町店屋-延平北路2段27號","lat":25.054723,"lng":121.511843,"cat":"culture","tag":"歷史建築","desc":"大稻埕這棟店屋曾屬發記茶行洪九江，後來幾經轉手。蔡家將房屋捐贈臺北市政府後，老街的商業空間也有了新的公共用途。","area":"大同區・臺北市","ph":"文"},{"id":4005,"name":"安西街1巷11號店屋","lat":25.059208,"lng":121.51047,"cat":"structure","tag":"歷史建築","desc":"安西街巷內的兩層店屋以紅磚仿造西式洋樓外觀，細部卻沿用傳統疊磚手法。從戰時航照推測，建築應在二戰結束前已經落成。","area":"大同區・臺北市","ph":"文"},{"id":4006,"name":"安西街21巷1號","lat":25.059876,"lng":121.510172,"cat":"structure","tag":"歷史建築","desc":"這棟大稻埕巷內民宅最初登記為土木構造的單層瓦屋，後來才向上增建。狹窄的一坎一進格局，保留巷弄住家因應空間需要而改造的過程。","area":"大同區・臺北市","ph":"文"},{"id":4007,"name":"安西街2、4、6號店屋","lat":25.058402,"lng":121.510132,"cat":"history","tag":"歷史建築","desc":"大稻埕公園旁的老店屋，一共排開三間店面的寬度。屋內仍維持日治昭和時期的店屋布局，可從街面與內部格局認識當地商業住宅。","area":"大同區・臺北市","ph":"文"},{"id":4008,"name":"安西街9巷4、6、7號店屋","lat":25.059469,"lng":121.510223,"cat":"structure","tag":"歷史建築","desc":"安西街巷中的兩棟同期店屋，二樓留著三拱窗與白瓷花瓶形欄杆。樓梯從騎樓直接通往樓上，樓下的磚造圓柱則撐起沿街拱廊。","area":"大同區・臺北市","ph":"文"},{"id":4009,"name":"安西街周宅","lat":25.059202,"lng":121.510279,"cat":"history","tag":"歷史建築","desc":"大稻埕安西街的周家住宅，在日治大正十一年已有地政登錄。若從房屋的建築樣式推測，實際興建時間可能比留下登記的年代更早。","area":"大同區・臺北市","ph":"文"},{"id":4010,"name":"延平北路1段149及151號店屋（太和堂藥房）","lat":25.053594,"lng":121.511893,"cat":"worship","tag":"歷史建築","desc":"經營西藥與醫療器材的李家，原宅在戰時因開闢防火巷而拆除。戰後逐步備齊建材，在延平北路重建三層、前後兩進的住宅。","area":"大同區・臺北市","ph":"文"},{"id":4011,"name":"延平北路2段171號店屋（廬山軒）","lat":25.058519,"lng":121.511593,"cat":"history","tag":"歷史建築","desc":"昔日太平町北段的店屋由來自福州的陳誠祿買下，改建為家族經營的佛具塑像店。後續增建留下今日外觀，也承接廬山軒的工藝生意。","area":"大同區・臺北市","ph":"文"},{"id":4012,"name":"延平北路2段241號店屋","lat":25.062065,"lng":121.511392,"cat":"history","tag":"歷史建築","desc":"延平北路與涼州街轉角的店屋，位在昔日通往大龍峒與三重的太平通。附近曾聚集葉貓貓、張時聰等醫師開業，留有老臺北醫界的街區記憶。","area":"大同區・臺北市","ph":"文"},{"id":4013,"name":"延平北路2段54號店屋","lat":25.055322,"lng":121.511562,"cat":"history","tag":"歷史建築","desc":"這棟店屋與左右鄰屋同期興建，一樓沿街作店面，二樓曾是孔雀咖啡店。再往上的退縮露臺與住家，讓一排建物容納不同的生活用途。","area":"大同區・臺北市","ph":"文"},{"id":4014,"name":"延平北路一段147號店屋","lat":25.053548,"lng":121.511897,"cat":"history","tag":"歷史建築","desc":"太平町的重要街角曾由張東隆商行承租，在此開設商社。從石油、汽車零件到生活物料，當年店裡的買賣記錄大稻埕商業的多樣性。","area":"大同區・臺北市","ph":"文"},{"id":4015,"name":"延平北路二段117號店屋","lat":25.057213,"lng":121.511652,"cat":"history","tag":"歷史建築","desc":"大同區延平北路上的這間店屋，從日治大正年間開始興建。一九二五年完工時，年號正是大正十四年。","area":"大同區・臺北市","ph":"文"},{"id":4016,"name":"延平北路二段134號店屋","lat":25.057424,"lng":121.511443,"cat":"history","tag":"歷史建築","desc":"這間店屋開設之初經營硝子，也就是玻璃製品，戰後又成為進口食品批發商。從樺樹奶粉到後來的銀樓，幾次轉業留下街區消費的變化。","area":"大同區・臺北市","ph":"文"},{"id":4017,"name":"延平北路二段13號店屋","lat":25.054409,"lng":121.511825,"cat":"history","tag":"歷史建築","desc":"這棟街屋在戰後初期增建樓層與夾層，並添設鋼筋混凝土梁柱。後來一樓換鋪磨石子地磚，樓上木窗也改為鋁窗，留下不同時期的修繕痕跡。","area":"大同區・臺北市","ph":"文"},{"id":4018,"name":"延平北路二段199號店屋","lat":25.05939,"lng":121.511529,"cat":"history","tag":"歷史建築","desc":"這棟店屋由先天道人士黃玉階創建，後來泰美商行在此賣南北貨與自行車。戰後又成了博濟婦產外科醫院，一處門面串起太平町不同時期的行業。","area":"大同區・臺北市","ph":"文"},{"id":4019,"name":"延平北路二段210巷5號店屋","lat":25.059283,"lng":121.511083,"cat":"structure","tag":"歷史建築","desc":"大稻埕巷內的戰後街屋採四柱三窗格局，基地曾是日治時期的派出所。洗石子立面可見預鑄浮雕，柱身的直線凹槽呼應西式柱頭。","area":"大同區・臺北市","ph":"文"},{"id":4020,"name":"延平北路二段214號店屋","lat":25.05937,"lng":121.511328,"cat":"history","tag":"歷史建築","desc":"太平町老店屋的側牆可見唭哩岸石，上方採兩坡斜屋頂，是地方常見的傳統建築形式。日治時期附近有第一劇場與太平館，娛樂業十分興盛。","area":"大同區・臺北市","ph":"文"},{"id":4021,"name":"延平北路二段272巷20號店屋","lat":25.062009,"lng":121.51048,"cat":"structure","tag":"歷史建築","desc":"通往迪化街的老巷曾連接大橋町與太平町，巷內留有日治時期的街屋。從農具行、雜貨店到戰後興起的清茶店，可以讀出街坊的行業變化。","area":"大同區・臺北市","ph":"文"},{"id":4022,"name":"延平北路二段45號店屋","lat":25.055132,"lng":121.51178,"cat":"history","tag":"歷史建築","desc":"這棟四柱三開間的店屋，是延平北路開闢初期留下的建築。依在地口述，日治時期曾租作照相館，戰後也曾有販售裁縫機的商家進駐。","area":"大同區・臺北市","ph":"文"},{"id":4023,"name":"延平北路二段56、58號店屋","lat":25.055415,"lng":121.511586,"cat":"history","tag":"歷史建築","desc":"日治昭和年間的兩間店屋，戰後曾經整體整修，又分次改動室內。三樓改為套房，二樓加裝洗手臺，可看出老屋配合使用需求的變化。","area":"大同區・臺北市","ph":"文"},{"id":4024,"name":"延平北路二段6、8號店屋","lat":25.054131,"lng":121.511657,"cat":"history","tag":"歷史建築","desc":"舊太平町本通的兩間相鄰店屋，分別是萬順號製靴店與金華興金舖。兩棟都建於日治大正年間，記錄了大稻埕主要商街的生活買賣。","area":"大同區・臺北市","ph":"文"},{"id":4025,"name":"延平北路二段70號店屋","lat":25.055679,"lng":121.511546,"cat":"history","tag":"歷史建築","desc":"這棟兩層店屋前後分兩進，以杉木桁與承重山牆支撐，仍保存木構造。屋頂的太子窗尺寸格外大，是典型街屋格局裡相當特別的細節。","area":"大同區・臺北市","ph":"文"},{"id":4026,"name":"延平基督教會","lat":25.062466,"lng":121.512667,"cat":"worship","tag":"古蹟","desc":"早年的日本聖教會曾在此宣教，今日所見教會建築則建於日治後期。戰後李幫助牧師籌資整修，後來才更名為延平基督教會。","area":"大同區・臺北市","ph":"文"},{"id":4027,"name":"延平河濱公園","lat":25.05412,"lng":121.50707,"cat":"nature","desc":"堤外高灘地上的河濱公園，從忠孝橋一帶向北延伸。靠近民生西路的區段有成片樹蔭與草地，多年來一直是大同區居民親近河岸的地方。","area":"大同區・臺北市","ph":"觀"},{"id":4028,"name":"建成呢絨布行","lat":25.053829,"lng":121.509643,"cat":"history","tag":"歷史建築","desc":"六館街尾商圈裡的這棟建築建於戰後，後來由屋主在此創辦建成呢絨公司。一家布行的地址，也記下了這一帶曾以布莊聚集聞名的歷史。","area":"大同區・臺北市","ph":"文"},{"id":4029,"name":"張協成石廠","lat":25.061031,"lng":121.509236,"cat":"history","tag":"歷史建築","desc":"石廠旁的巷子因打石生意聚集，曾被叫作打石仔巷。當年工匠用花崗石製作騎樓梁、柱礎與柱頭，成排石材從巷內一路擺到河邊。","area":"大同區・臺北市","ph":"文"},{"id":4030,"name":"忠孝西路二段13號","lat":25.048455,"lng":121.509389,"cat":"history","tag":"歷史建築","desc":"這棟房屋在日治時期是鐵道部的慰安宿泊所，原就有住宿用途。戰後編為臺鐵第三公共宿舍，成為附近鐵路官舍群的一部分。","area":"大同區・臺北市","ph":"文"},{"id":4031,"name":"忠孝西路二段9號","lat":25.048464,"lng":121.509554,"cat":"history","tag":"歷史建築","desc":"日治時期鐵道部講習所的教室，戰後改作臺鐵第九公共宿舍。從上課到居住，這棟建築留下鐵路機構在北門一帶活動的痕跡。","area":"大同區・臺北市","ph":"文"},{"id":4032,"name":"捷運北門站_台北鐵道局","lat":25.04954,"lng":121.51018,"cat":"culture","desc":"塔城街下的北門站有四層地下空間，車站設計把公共藝術納入建築與景觀。從色彩配置等細節，可看出設計者呼應街區文化的用意。","area":"大同區・臺北市","ph":"觀"},{"id":4033,"name":"新慶利碾米廠","lat":25.060878,"lng":121.509363,"cat":"history","tag":"歷史建築","desc":"這家碾米店約在一九三〇年代開始營業，最初名叫慶利。戰後從迪化街另一處遷來才改稱新慶利，讓街區留下傳統稻米加工的店面。","area":"大同區・臺北市","ph":"文"},{"id":4034,"name":"新芳春茶行","lat":25.057072,"lng":121.512527,"cat":"culture","tag":"古蹟","desc":"大稻埕外銷南洋的茶行之一，曾在這棟三層樓的連排街屋精製包種茶。抬頭可見橫向女兒牆與突出的三角山頭，泥塑花草裝飾其間。","area":"大同區・臺北市","ph":"文"},{"id":4035,"name":"日星鑄字行","lat":25.05218,"lng":121.51638,"cat":"culture","desc":"張錫齡以「日日生產」的期盼為鑄字行取名，店裡專門製作活版印刷用的鉛字。隨電腦排版與平版印刷普及，這門行業也留下時代轉變的印記。","area":"大同區・臺北市","ph":"觀"},{"id":4036,"name":"有記茶行","lat":25.055672,"lng":121.51312,"cat":"history","tag":"歷史建築","desc":"茶行分成前後兩棟，前棟紅磚樓房臨街，原本樓下經商、樓上供居住與倉儲。後棟設精製茶工場和焙籠間，從店面一路連到製茶現場。","area":"大同區・臺北市","ph":"文"},{"id":4037,"name":"李春生紀念基督長老教會(大稻埕郵便電信支局)","lat":25.055108,"lng":121.508252,"cat":"worship","tag":"古蹟","desc":"教會所在處原為大稻埕郵便電信支局，郵務機關遷出後才改為宗教空間。教會紀念的李春生曾協助英商經營北臺灣茶業，也是地方重要人物。","area":"大同區・臺北市","ph":"文"},{"id":4038,"name":"李臨秋故居","lat":25.055176,"lng":121.508714,"cat":"culture","tag":"古蹟","desc":"寫下〈望春風〉與〈四季紅〉的李臨秋，曾住在大稻埕舊建昌街。房屋原屬茶廠相關建築，留存的木桁與生活空間記錄產業轉變後的居住樣貌。","area":"大同區・臺北市","ph":"文"},{"id":4039,"name":"林華泰茶行","lat":25.060141,"lng":121.513717,"cat":"history","tag":"歷史建築","desc":"出身泉州安溪的林家原在石碇經營茶業，後來遷至臺北。茶行延續從種茶到製茶的上下游工作，讓大稻埕茶業的脈絡不只留在店面。","area":"大同區・臺北市","ph":"文"},{"id":4040,"name":"機器局第五號倉庫","lat":25.049321,"lng":121.509026,"cat":"history","tag":"古蹟","desc":"這座倉庫所在的北門外街區，清末曾設接官亭，也是巡撫劉銘傳設置機器局之地。從留存的地名與廠區，可認識早期臺北的官方建設。","area":"大同區・臺北市","ph":"文"},{"id":4041,"name":"歸綏街文萌樓","lat":25.058419,"lng":121.514775,"cat":"history","tag":"古蹟","desc":"歸綏街的老樓曾是公娼館，留下大稻埕作為河港城市的性產業記憶。後來這裡也成為反廢娼運動的重要據點，與性工作者的歷史密切相關。","area":"大同區・臺北市","ph":"文"},{"id":4042,"name":"民樂街12號店屋","lat":25.055907,"lng":121.510798,"cat":"history","tag":"歷史建築","desc":"這棟戰後三層店屋採四柱三間的立面，柱頭帶有科林斯式雕飾。配合鑄鐵欄杆、列柱花飾與牆面模印圖案，可細看當年街屋的裝飾手藝。","area":"大同區・臺北市","ph":"文"},{"id":4043,"name":"民樂街14號店屋","lat":25.055907,"lng":121.510814,"cat":"history","tag":"歷史建築","desc":"這間店屋與相鄰的民樂街十二號建於同一年，都是戰後初期的街屋。門面採四柱三窗，屋內則是一坎、一落與一道過水的格局。","area":"大同區・臺北市","ph":"文"},{"id":4044,"name":"民樂街4、6、8號、永昌街1號暨民生西路362巷33號店屋","lat":25.055613,"lng":121.510817,"cat":"structure","tag":"歷史建築","desc":"角地前後皆臨街，戰後規劃為四間店面及華南旅社使用。五金生意和旅社結束營業後，樓層改供出租與居住，室內也陸續增建樓梯。","area":"大同區・臺北市","ph":"文"},{"id":4045,"name":"民樂街58號店屋","lat":25.057444,"lng":121.510509,"cat":"history","tag":"歷史建築","desc":"莊輝玉家族的產業曾是莊義芳商行所在地，與附近迪化街數間店屋相連。建築由李重耀及莊輝玉的孫子莊長雄共同設計。","area":"大同區・臺北市","ph":"文"},{"id":4046,"name":"民生西路333號及延平北路二段111、113、115號店屋","lat":25.057097,"lng":121.511772,"cat":"history","tag":"歷史建築","desc":"民生西路與延平北路轉角的幾個門牌，原是一棟大正年間的建築。雖然產權多次分割，騎樓木梁、一樓木構與紅磚立面仍留下原有關係。","area":"大同區・臺北市","ph":"文"},{"id":4047,"name":"永昌街7號店屋","lat":25.055615,"lng":121.510713,"cat":"history","tag":"歷史建築","desc":"永昌街連接迪化街，這棟店屋自清末便在這段商業街區落腳。戰後一九五四年改建後留下現有外觀，可藉此認識大稻埕街屋的演變。","area":"大同區・臺北市","ph":"文"},{"id":4048,"name":"永樂町派出所(迪化街1段260號)","lat":25.060414,"lng":121.50926,"cat":"history","tag":"古蹟","desc":"迪化街這處派出所大正時期名為普願街派出所，後改稱永樂町派出所。昭和年間的警察刊物留有改築紀錄，可據此推測建物興建年代。","area":"大同區・臺北市","ph":"文"},{"id":4049,"name":"波麗路餐廳","lat":25.056878,"lng":121.511967,"cat":"history","tag":"歷史建築","desc":"民生西路的老餐廳在一九三〇年代開業，戰後又由畫家顏雲連設計改裝。建築保留日治時期的現代風格，也記錄臺北早年的餐飲與文化生活。","area":"大同區・臺北市","ph":"文"},{"id":4050,"name":"泰興漆行","lat":25.059936,"lng":121.509446,"cat":"history","tag":"歷史建築","desc":"漆行前兩進在日治初期已有登記，正面的傳統閩南形式推測可能更早。延伸至安西街的第三進轉為現代式樣，一棟街屋便能對照兩種建築年代。","area":"大同區・臺北市","ph":"文"},{"id":4051,"name":"涼州街108號店屋","lat":25.060504,"lng":121.509756,"cat":"history","tag":"歷史建築","desc":"林鎮標興建「鎮記」經營人蔘買賣，曾從韓國進口高麗蔘。戰時進口中斷後，店面陸續租給洗衣店、電器行與西裝社，留下涼州街的行業變化。","area":"大同區・臺北市","ph":"文"},{"id":4052,"name":"清代機器局第一號工場遺構","lat":25.050046,"lng":121.51031,"cat":"history","tag":"歷史建築","desc":"清代機器局北廠區的第一工場，據記載曾用來翻砂與鑄模。地層中發現的鐵質遺留，以及日治時期廠房、宿舍的改建痕跡，記下基地的不同用途。","area":"大同區・臺北市","ph":"文"},{"id":4053,"name":"清代機器局遺構","lat":25.050667,"lng":121.510518,"cat":"history","tag":"古蹟","desc":"臺灣建省之初，巡撫劉銘傳在臺北設立機器局，藉以發展本地兵工業。這處遺構記錄了清末在臺建立機械製造能力、培養近代技術人才的嘗試。","area":"大同區・臺北市","ph":"文"},{"id":4054,"name":"甘州街_茶葉街","lat":25.0584,"lng":121.51297,"cat":"structure","desc":"大稻埕茶業興盛時，甘州街與鄰近歸綏街聚了十幾家茶行，「茶葉街」之名由此而來。附近的製茶、加工與買賣，共同撐起河港的茶產業。","area":"大同區・臺北市","ph":"觀"},{"id":4055,"name":"甘谷街48號店屋","lat":25.053056,"lng":121.510623,"cat":"history","tag":"歷史建築","desc":"甘谷街這間店屋在日治初期即有登記，當時是用土木磚石建成的單層瓦屋。附近聚集米商，也有正米市場，留下大稻埕米糧交易的痕跡。","area":"大同區・臺北市","ph":"文"},{"id":4056,"name":"甘谷街50號店屋","lat":25.053097,"lng":121.510625,"cat":"history","tag":"歷史建築","desc":"這棟加強磚造的店屋在戰後登記時，原來使用甘谷街五十八號門牌。後因土地分割才分成今天的四十八與五十號，可看出老街店面的變化。","area":"大同區・臺北市","ph":"文"},{"id":4057,"name":"臺北孔子廟","lat":25.072762,"lng":121.516179,"cat":"worship","tag":"古蹟","desc":"清代城內孔廟受損後，臺北士紳倡議重建，請來泉州匠師王益順設計。儀門、大成殿、崇聖祠及兩廡陸續完成，讓祭孔典禮有了新場所。","area":"大同區・臺北市","ph":"文"},{"id":4058,"name":"臺北孔廟","lat":25.07295,"lng":121.5166,"cat":"worship","desc":"大龍峒老街裡的孔廟仿曲阜本廟布局，梁柱門窗未題刻文字，顯得格外樸素。它與鄰近的保安宮及學校，共同保留地方崇文重教的傳統。","area":"大同區・臺北市","ph":"觀"},{"id":4059,"name":"臺北市交通資訊中心","lat":25.04925,"lng":121.51873,"cat":"other","desc":"這座展示中心從歷史回顧談到智慧運輸，介紹臺北街道如何規劃與管理。展示內容可見交通工程、自行車系統與交控中心控制臺等不同面向。","area":"大同區・臺北市","ph":"觀"},{"id":4060,"name":"臺灣新文化運動紀念館","lat":25.059341,"lng":121.515039,"cat":"culture","desc":"大稻埕是臺灣新文化思潮的重要發源地，日治時期許多知識分子在此活動。紀念館透過收藏與展覽，讓人認識運動參與者以及他們所處的時代。","area":"大同區・臺北市","ph":"觀"},{"id":4061,"name":"臺灣總督府交通局鐵道部(廳舍、八角樓男廁、戰時指揮中心、工務室、電源室、食堂)","lat":25.049502,"lng":121.510741,"cat":"history","tag":"古蹟","desc":"舊鐵道部街廓內留有廳舍、工務室、電源室與食堂等建築。從早期的八角樓男廁到後來的戰時指揮中心，可看出機關在不同年代的需要。","area":"大同區・臺北市","ph":"文"},{"id":4062,"name":"華亭街31號店屋","lat":25.052843,"lng":121.513909,"cat":"history","tag":"歷史建築","desc":"華亭街這棟老屋曾供臺灣人經營商行，是街上少數留下的同類建築。它與圓環周邊的商業歷史相連，見證日治時期本地商家的發展。","area":"大同區・臺北市","ph":"文"},{"id":4063,"name":"蔡合源宅第","lat":25.052508,"lng":121.517308,"cat":"history","tag":"歷史建築","desc":"這棟蔡家建築是戰後初期興建的商店之一，保留當時的店屋形式。從房屋的整體構造與營造品質，可以認識地方工匠的建築技術。","area":"大同區・臺北市","ph":"文"},{"id":4064,"name":"蔣渭水紀念公園","lat":25.05995,"lng":121.51674,"cat":"nature","desc":"原來的錦西公園改名紀念蔣渭水，因他的許多公共活動都在大稻埕展開。從開設大安醫院到參與文化協會，公園與周邊街區共享這段歷史。","area":"大同區・臺北市","ph":"觀"},{"id":4065,"name":"西寧北路1巷2號","lat":25.049255,"lng":121.508307,"cat":"structure","tag":"歷史建築","desc":"西寧北路巷內的獨棟住宅建於一九三二年，原供鐵道部高階官員居住。這棟房子與周邊宿舍一起，保留了早期鐵路機構的居住空間。","area":"大同區・臺北市","ph":"文"},{"id":4066,"name":"西寧北路29、31號店屋","lat":25.05308,"lng":121.508762,"cat":"history","tag":"歷史建築","desc":"這排店屋由陳金勝在事業興盛時興建，落成後成為嘉南商行的營業地址。它留下日治時期臺灣商人經營致富，並在大稻埕開設商號的歷史。","area":"大同區・臺北市","ph":"文"},{"id":4067,"name":"西寧北路65、67號店屋","lat":25.054726,"lng":121.508962,"cat":"history","tag":"歷史建築","desc":"兩間老店屋的街面向內退縮，是為了配合昔日港仔溝的彎道。這條通往淡水河的小運河曾運送茶葉，河道變遷後仍可從房屋位置找到痕跡。","area":"大同區・臺北市","ph":"文"},{"id":4068,"name":"西寧北路86巷8、12、14號店屋","lat":25.05516,"lng":121.508737,"cat":"structure","tag":"歷史建築","desc":"巷弄裡這組老屋在日治時期曾作茶工廠，附近貴德街則聚集茶商。工廠與商街彼此鄰近的布局，留下大稻埕製茶、加工與買賣的產業地景。","area":"大同區・臺北市","ph":"文"},{"id":4069,"name":"赤峰街","lat":25.055346,"lng":121.519607,"cat":"culture","desc":"中山與雙連之間的巷道曾聚集五金和汽車零件商家，因此有打鐵街之稱。如今古著店、復古寫真館、書店與咖啡館也進入老街，和舊產業比鄰。","area":"大同區・臺北市","ph":"觀"},{"id":4070,"name":"迪化街1段121號店屋","lat":25.057437,"lng":121.50987,"cat":"history","tag":"歷史建築","desc":"這間店屋和相鄰兩戶曾同屬莊家，一樓是三間店面，二樓住家彼此相通。整修後仍可見清代的唭哩岸石條、砌牆與日治時期的街屋形式。","area":"大同區・臺北市","ph":"文"},{"id":4071,"name":"迪化街1段131號店屋","lat":25.057695,"lng":121.509852,"cat":"history","tag":"歷史建築","desc":"這間店屋所在處是清代迪化街較早發展的街區之一，舊媽祖宮就在南側。到了日治時期，這裡也位在大稻埕商業街區的核心。","area":"大同區・臺北市","ph":"文"},{"id":4072,"name":"迪化街1段13號店屋","lat":25.0542,"lng":121.510284,"cat":"history","tag":"歷史建築","desc":"永樂町的土埆厝曾改為兩層磚造洋樓，戰時又整棟拆除、改作防空壕。戰後才先後重建前後兩進，呈現同一塊土地數度改換用途的過程。","area":"大同區・臺北市","ph":"文"},{"id":4073,"name":"迪化街1段142號店屋","lat":25.057578,"lng":121.509703,"cat":"history","tag":"歷史建築","desc":"張文鉁醫師曾在這棟街屋開設小兒科醫院，後來郭家改經營南北貨。前棟樓下作店面、樓上住人，後棟當倉庫，一家人的生意和生活相互銜接。","area":"大同區・臺北市","ph":"文"},{"id":4074,"name":"迪化街1段148號店屋","lat":25.057659,"lng":121.509675,"cat":"history","tag":"歷史建築","desc":"這棟李春生家族興建的街屋，戰後成為李國衡創辦聯華食品之處。屋內保留他使用的辦公桌，以及于右任、溥心畬等人相贈的書畫。","area":"大同區・臺北市","ph":"文"},{"id":4075,"name":"迪化街1段155號","lat":25.058382,"lng":121.509703,"cat":"history","tag":"歷史建築","desc":"迪化街這處建築的歷史可追溯到十九世紀中葉。清代、日治時期及後來的增建在同一處並存，讓人從屋舍的變化看見大稻埕市街成長。","area":"大同區・臺北市","ph":"文"},{"id":4076,"name":"迪化街1段156號店屋","lat":25.057905,"lng":121.509673,"cat":"history","tag":"歷史建築","desc":"清代同安人林藍田從基隆移居大稻埕，在中街建店經營林益順商號。這組早期店屋的第二進，後來也曾是當地居民熟悉的林五湖命相館。","area":"大同區・臺北市","ph":"文"},{"id":4077,"name":"迪化街1段174號店屋","lat":25.058351,"lng":121.509562,"cat":"history","tag":"歷史建築","desc":"兩層磚造店屋前後有兩進，臨街立面採四柱三窗。除古床、木梯與石門楣，還留有竹節造型排水管，能從小細節認識早期街屋工藝。","area":"大同區・臺北市","ph":"文"},{"id":4078,"name":"迪化街1段176號店屋","lat":25.058354,"lng":121.509555,"cat":"history","tag":"歷史建築","desc":"昔日店面先做南北貨買賣，後來有合順號等商家在此製作棺木。戰後陳財又開設源隆行經營香燭，一個地址記下多種民生行業。","area":"大同區・臺北市","ph":"文"},{"id":4079,"name":"迪化街1段178號店屋","lat":25.058425,"lng":121.509551,"cat":"history","tag":"歷史建築","desc":"永樂町五丁目這棟店屋，最早可追溯到大稻埕茶商李春生的第三代子孫。房屋長期作南北貨批發之用，延續了迪化街中北街的商業特色。","area":"大同區・臺北市","ph":"文"},{"id":4080,"name":"迪化街1段17號及南京西路233巷16號店屋","lat":25.054279,"lng":121.510275,"cat":"structure","tag":"歷史建築","desc":"蘆洲李家在大稻埕的這處店屋，曾是寧波商人翁明昌早年的營業地點。前後兩進在不同年代增改建，也留下戰後臺灣布業發展的痕跡。","area":"大同區・臺北市","ph":"文"},{"id":4081,"name":"迪化街1段181號店屋","lat":25.058989,"lng":121.509612,"cat":"history","tag":"歷史建築","desc":"沿街立面以四柱三窗分出節奏，面磚與洗石子仍保留基本樣貌。店屋前後有兩進，以過水相連，第一進裡還留有原始木桁架。","area":"大同區・臺北市","ph":"文"},{"id":4082,"name":"迪化街1段183號店屋","lat":25.059032,"lng":121.509608,"cat":"history","tag":"歷史建築","desc":"黃潭曾租下永樂町這間店屋，開信成商行販賣食品雜貨。這裡也曾是臺北市清飲會與果精會的登記地址，留下飲料同業往來的故事。","area":"大同區・臺北市","ph":"文"},{"id":4083,"name":"迪化街1段186號店屋","lat":25.05857,"lng":121.509531,"cat":"history","tag":"歷史建築","desc":"早期登記顯示，這棟店屋原是土埆造的兩層瓦房。戰後的紀錄已變為附騎樓的三層磚樓，從兩份資料便可看出房屋規模與材料的改變。","area":"大同區・臺北市","ph":"文"},{"id":4084,"name":"迪化街1段192號店屋","lat":25.058713,"lng":121.509504,"cat":"history","tag":"歷史建築","desc":"蘇家買下這棟老屋時，前後兩進都是帶閣樓的閩南建築，中間留天井與過水。後來為生活和生意所需，添建衛浴，也把後院覆蓋作倉儲。","area":"大同區・臺北市","ph":"文"},{"id":4085,"name":"迪化街1段198號店屋","lat":25.058934,"lng":121.509511,"cat":"history","tag":"歷史建築","desc":"迪化街這棟店屋在大正十一年首次登記時，屋主是翁富。參照土地登記與大稻埕市街圖，房屋推測在一九二二年以前就已存在。","area":"大同區・臺北市","ph":"文"},{"id":4086,"name":"迪化街1段200號店屋","lat":25.058964,"lng":121.509454,"cat":"history","tag":"歷史建築","desc":"陳其昌商行早年在這間店屋賣海產，往後多由南北貨商使用。後來天山行在此做批發與零售，業務又擴展到食品飲料進出口。","area":"大同區・臺北市","ph":"文"},{"id":4087,"name":"迪化街1段202號店屋","lat":25.059003,"lng":121.509461,"cat":"history","tag":"歷史建築","desc":"這棟店屋在日治明治四十一年首次辦理保存登記，當時持有人為葉榮泰。登記資料還留有大稻埕南街的舊番戶，可回溯老街當年的門牌記法。","area":"大同區・臺北市","ph":"文"},{"id":4088,"name":"迪化街1段235、237號店屋","lat":25.060131,"lng":121.509486,"cat":"history","tag":"歷史建築","desc":"迪化街北街的店屋曾由鄭萬鎰家族經營米穀雜糧，也一度租給陳三棉開設和興漆行。一排老店面連起河港街區的糧食生意與漆業。","area":"大同區・臺北市","ph":"文"},{"id":4089,"name":"迪化街1段248號店屋","lat":25.060205,"lng":121.509282,"cat":"history","tag":"歷史建築","desc":"老店屋推測最初只有一層，日治時期經市街改正後才形成兩層、前後兩進的規模。沿街立面裝飾簡明，可見當時現代式街屋的趣味。","area":"大同區・臺北市","ph":"文"},{"id":4090,"name":"迪化街1段274號店屋","lat":25.0
