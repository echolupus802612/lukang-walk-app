頂著玄武岩臺地，底層較脆弱的火山角礫岩則受海流持續侵蝕。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3177,"name":"吉貝嶼","lat":23.73025,"lng":119.60246,"cat":"scenic","desc":"澎湖北海的吉貝嶼地勢東高西低，最鮮明的特色是海流堆積的沙灘。西南側沙灘從西崁山向外延伸，盡頭還有一條探入海中的沙嘴。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3178,"name":"吉貝武聖殿","lat":23.74224,"lng":119.61324,"cat":"worship","desc":"吉貝聚落中心的兩層廟宇，主祀文衡聖帝，也就是關聖帝君。相傳村民從海邊迎回的觀音像起初也在此奉祀，後來才另建觀音寺。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3179,"name":"吉貝沙尾","lat":23.72792,"lng":119.60316,"cat":"scenic","desc":"吉貝西南岸的沙灘盡頭，延伸出一條細長沙嘴，當地稱為沙尾。海流推送珊瑚碎屑與貝殼沙，在島邊慢慢堆積，才形成這片海岸地貌。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3180,"name":"吉貝石滬文化館","lat":23.74665,"lng":119.61224,"cat":"culture","desc":"吉貝碼頭遊客中心東側的文化館，為保存島上傳統石滬文化而設。吉貝沿岸有近百口石滬，館舍讓人能從這項漁業傳統認識海島。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3181,"name":"吉貝遊客中心","lat":23.738829,"lng":119.611639,"cat":"other","desc":"這是吉貝島上提供地方旅遊資訊的服務空間，館裡也展示文物。旅人可以在候船休息之餘，從展示認識島上的文化。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3182,"name":"員貝嶼","lat":23.6472,"lng":119.632,"cat":"scenic","desc":"白沙岐頭外海的島嶼，形狀像一枚螺貝覆在水面。北岸排列出石筆、石硯等玄武岩景觀，東北側岩柱上窄下寬，褶痕宛如百褶裙。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3183,"name":"嗨鼠地景藝術","lat":23.662623,"lng":119.574153,"cat":"culture","desc":"澎湖的鼠形地景作品用青花瓷般的藍色描繪外觀，把東方文化的圖騰融入海島。站在藍天與海面前，作品的紋樣也與周圍色彩相呼應。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3184,"name":"姑婆嶼","lat":23.7157,"lng":119.5563,"cat":"scenic","desc":"白沙西北的無人島是一座玄武岩方山臺地，地面露出許多多孔狀黑岩。表層另有富含鐵質的石英砂岩，兩種岩層在島上形成鮮明對比。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3185,"name":"小白沙嶼","lat":23.678447,"lng":119.666641,"cat":"scenic","desc":"小島南端伸出白色沙嘴，海水也在岸邊蝕出豆腐狀灘岩與壺穴。換到東岸，則可看見塔狀與彎曲的柱狀玄武岩，呈現不同的地質樣貌。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3186,"name":"小赤林氏宗祠","lat":23.661131,"lng":119.597656,"cat":"worship","tag":"歷史建築","desc":"白沙小赤崁林家的四櫸頭宗祠，日治時期落成，見證族人在當地的發展。廳堂牆上還留有二戰末期駐軍架床時鑿出的痕跡。","area":"白沙鄉・澎湖縣","ph":"文"},{"id":3187,"name":"岐頭遊客中心","lat":23.649521,"lng":119.609275,"cat":"other","desc":"岐頭碼頭旁的遊客中心，提供認識員貝、雞善、錠鉤等澎湖東海島嶼的資訊。村中還有以石堆作魚藏身處的「抱墩」傳統漁法。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3188,"name":"後寮三十人公廟","lat":23.66241,"lng":119.5699,"cat":"worship","desc":"後寮人也稱這座廟為南埔廟，據廟碑記載，村民為祭祀抵禦荷軍身亡的居民而建廟。後來信眾再度集資重建，延續海岸聚落的祭祀。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3189,"name":"後寮遊客中心","lat":23.670964,"lng":119.570809,"cat":"other","desc":"白沙後寮的遊客中心，結合遊艇服務、地方旅遊諮詢與候船空間。館內也有餐飲與販賣部，供等候航程的旅人停留休息。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3190,"name":"東方龍馬","lat":23.74162,"lng":119.61925,"cat":"other","desc":"吉貝港東側的龍馬地點立有黃色鐘缽石塔，與西側紅色木魚相對。兩座都是護佑島民的石敢當，當地合稱「東鐘西叩」。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3191,"name":"澎湖水族館","lat":23.65189,"lng":119.6079,"cat":"culture","desc":"白沙岐頭村的水產試驗所擴建為水族館，灰白牆面搭配碧綠屋瓦。館內從潮間帶觸摸池到大洋池，可認識礁岩生物與飼育員的日常工作。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3192,"name":"澎湖石滬文化景觀－吉貝石滬群","lat":23.736451,"lng":119.611236,"cat":"history","tag":"文化景觀","desc":"吉貝海岸的石滬從清代已有記錄，島民後來持續修築，形成龐大的傳統漁業地景。衛星影像比對曾在島上辨認出超過一百口石滬。","area":"白沙鄉・澎湖縣","ph":"文"},{"id":3193,"name":"澎湖跨海大橋","lat":23.64831,"lng":119.54639,"cat":"other","desc":"連起白沙與西嶼的大橋，橫越水流湍急的吼門水道。過去冬季東北季風常使行船困難，跨海橋梁的興建也改變兩島居民的往來方式。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3194,"name":"澎湖跨海大橋","lat":23.658029,"lng":119.554602,"cat":"history","tag":"歷史建築","desc":"白沙與西嶼之間的大橋，在兩端設置拱形橋門，旁邊立著紀念碑與碑亭。橋梁從早期通車到後來改建，留下澎湖主要島嶼相連的歷史。","area":"白沙鄉・澎湖縣","ph":"文"},{"id":3195,"name":"澎澎灘","lat":23.65904,"lng":119.6397,"cat":"scenic","desc":"鳥嶼和員貝之間的天然沙洲，是海流將附近各島沙粒搬運、堆積的結果。颱風與持續的海流使沙洲逐步成形，滿潮時仍能看見沙灘。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3196,"name":"目斗嶼","lat":23.7841,"lng":119.602,"cat":"scenic","desc":"吉貝北方海域的小島面積不大，最鮮明的地標是黑白相間的燈塔。附近暗礁眾多、昔日船難頻仍，因此設塔為往來船隻指引方向。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3197,"name":"講美吳玉樹古宅","lat":23.632756,"lng":119.600071,"cat":"history","tag":"歷史建築","desc":"講美吳家的古宅以硓𥑮石砌牆，石材交接與牆端收頭都相當細緻。大門旁可看柱腳、柱頭與石刻門聯，連花臺和水缸的造形也有特色。","area":"白沙鄉・澎湖縣","ph":"文"},{"id":3198,"name":"通梁˙碼頭符檯","lat":23.656472,"lng":119.556,"cat":"other","desc":"通梁碼頭前兩座符檯東西相對，頂上分別可見姜太公與觀音佛祖神像。居民藉此鎮守港口，祈求漁船出入平安，反映澎湖海邊的信仰。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3199,"name":"通梁古榕","lat":23.65679,"lng":119.55721,"cat":"other","desc":"通梁保安宮前的老榕樹伸出許多氣根，逐漸撐起大片樹蔭。看似一整片樹林的枝幹其實同出一株，廟前空地也因而成了乘涼廣場。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3200,"name":"金嶼","lat":23.6925,"lng":119.59506,"cat":"scenic","desc":"白沙赤崁北方的小島流傳張百萬拾黑石致富的故事，島上的黑石其實是玄武岩。南端橫臥的岩柱遠看像獅子，當地人稱為獅仔頭。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3201,"name":"鎮海長源古宅","lat":23.643557,"lng":119.5994,"cat":"history","tag":"歷史建築","desc":"陳長源在臺南經營皮革原料有成，返鄉請中屯匠師依老格局修祖厝。大廳泥地改鋪尺二磚，原先用泥塑成的灶也換成磚砌。","area":"白沙鄉・澎湖縣","ph":"文"},{"id":3202,"name":"險礁嶼","lat":23.7118,"lng":119.608,"cat":"scenic","desc":"吉貝南方這座小島，因四周海底暗礁多而得名。北面是岩石和珊瑚淺坪，南側卻是貝殼、珊瑚碎屑堆出的金黃沙灘。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3203,"name":"鳥嶼","lat":23.66186,"lng":119.65943,"cat":"scenic","desc":"沿東岸綿延至北岸的玄武岩柱，撐起一排高高的海崖。往下看，海蝕平臺的岩柱向四方放射，受風浪侵蝕處還呈現洋蔥般的層次。","area":"白沙鄉・澎湖縣","ph":"觀"},{"id":3204,"name":"二崁傳統聚落保存區","lat":23.604503,"lng":119.518853,"cat":"history","desc":"二崁修復後的古厝，由聚落協進會接手，成了一間間小展館。從漢藥、童玩、褒歌到潮間帶，沿著村子便能讀到澎湖人家的生活。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3205,"name":"內垵村 塔公塔婆","lat":23.573917,"lng":119.499,"cat":"other","desc":"相傳北港海中的暗礁與岸邊地形，從內垵看來宛如箭矢直指聚落。村人興建一對石塔鎮煞，昔日連接兩塔的城牆幾乎與塔婆等高。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3206,"name":"外垵村˙三仙塔","lat":23.562278,"lng":119.477,"cat":"other","desc":"外垵東西兩處山頭各有三仙塔，東側已被銀合歡遮掩。西側的石塔立在海崖，旁有小碉堡與燒磚廠，從這裡能俯望整個村落。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3207,"name":"外垵漁火","lat":23.56832,"lng":119.48467,"cat":"other","desc":"元宵的外垵漁港，近百艘漁船聚在一起點亮船燈，水面成了燈會的舞臺。岸上溫王宮附近還有掛滿燈籠的平安橋與王爺夜巡。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3208,"name":"外垵餌砲","lat":23.56466,"lng":119.475733,"cat":"history","tag":"歷史建築","desc":"日治時期留下的這座假砲，見證《華盛頓海軍條約》簽署後的一段澎湖軍事史。外觀最醒目的是巨大的八角形砲座與並列的雙砲管。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3209,"name":"大菓葉柱狀玄武岩","lat":23.596018,"lng":119.516208,"cat":"scenic","desc":"日治時期，大菓葉海邊為了闢建碼頭而挖取土石，意外讓埋在土裡的玄武岩露了面。如今沿著岩壁便能看清一根根相鄰的天然石柱。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3210,"name":"小池角雙曲橋&虎目石滬","lat":23.60078,"lng":119.50845,"cat":"scenic","desc":"白色橋身從岸邊伸向海中，左右各有一座綠色涼亭。漲潮時橋下都是海水，退潮後露出大片岩盤，居民會趁這時撿螺貝或撈魚。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3211,"name":"小門地質探索館","lat":23.65388,"lng":119.51725,"cat":"culture","desc":"館內用聲光與場景呈現史前世界，從深海岩石一路看到恐龍和植物模型。蛋型投影與玄武岩介紹牆，也是展場中各有特色的兩站。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3212,"name":"小門嶼","lat":23.65114,"lng":119.52092,"cat":"scenic","desc":"西嶼北端有一道窄窄的水道，把這座小島與西嶼隔開，小門橋橫跨其間。島上雖只有半平方公里，卻集中了澎湖多樣的地形與地質景觀。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3213,"name":"小門村˙中營石塔","lat":23.653556,"lng":119.517,"cat":"other","desc":"小門與竹灣之間的山頭，村民稱作後營。相傳村內接連發生喪事，村民請示震義宮後，在中營旁立起這座石塔祈求平安。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3214,"name":"小門村˙大彎石塔","lat":23.654,"lng":119.517,"cat":"other","desc":"大彎是小門村東邊的海灣，也是石塔名字的來由。據地方耆老口述，許家求子請示溫府王爺後，村民合力立塔，留下祈求添丁的傳說。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3215,"name":"小門村˙鐵鑠石塔","lat":23.653278,"lng":119.515,"cat":"other","desc":"小門居民在群山環抱的低地成村，這座石塔寄託了鎮守山靈的信仰。地方還流傳許姓村民挖土驚動山靈、依王爺指示安塔的故事。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3216,"name":"小門菜宅","lat":23.64858,"lng":119.51961,"cat":"scenic","desc":"小門嶼步道旁，一圈圈為作物擋風的圍牆，圈出當地人稱為菜宅的田地。多數就地取石堆砌，水源豐沛處也有人以蘆竹做屏障。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3217,"name":"池西柱狀玄武岩&池西岩瀑九孔池","lat":23.60391,"lng":119.50249,"cat":"scenic","desc":"西嶼西岸中段的玄武岩顏色近黑，向北逐漸轉為褐色。除了直立的岩柱，沿岸還能辨認彎曲、倒臥或斜倚的石柱，姿態各異。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3218,"name":"漁翁島遊客中心","lat":23.60546,"lng":119.51367,"cat":"scenic","desc":"跨海大橋西嶼端的服務中心，以展覽介紹漁翁島的人文風情。登上樓上觀景臺能看見大橋側面，館前還有取材自玳瑁石斑的彩色雕塑。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3219,"name":"澎湖二崁陳宅","lat":23.604576,"lng":119.519576,"cat":"history","tag":"古蹟","desc":"陳嶺、陳邦兄弟在臺南經營藥鋪，返鄉興建這座狹長大厝。從門廳、正廳到後堂逐進抬高，兩座內埕讓各進之間都能見到天光。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3220,"name":"竹灣","lat":23.632428,"lng":119.513671,"cat":"other","desc":"西嶼竹灣的漁民在海上以箱網養殖海鱺，這片養殖場也曾入鏡拍攝廣告。海鱺可切成生魚片，是澎湖海鮮餐廳常見的主菜之一。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3221,"name":"西嶼內垵塔公塔婆","lat":23.573755,"lng":119.499398,"cat":"history","tag":"古蹟","desc":"據內垵傳說，海瀨礁與鱟仔尾的地勢像箭直指村落。清代村人呂論帶領青年合力興建陰陽雙塔，把守護家園的願望寄託在石塔上。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3222,"name":"西嶼彈藥本庫","lat":23.569019,"lng":119.510171,"cat":"history","tag":"古蹟","desc":"內垵東側的谷地曾設有火藥庫，負責供應西嶼各處砲臺。日治初期陸續興建的庫房，留下澎湖海防在前線堡壘以外的後勤歷史。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3223,"name":"西嶼東臺","lat":23.565618,"lng":119.514055,"cat":"history","tag":"古蹟","desc":"清法戰爭過後，澎湖總兵吳宏洛在各地興建海防砲臺，內垵的東臺便是其中一座。這處遺跡見證了澎湖在臺灣海峽航道上的位置。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3224,"name":"西嶼東臺","lat":23.5689,"lng":119.50787,"cat":"history","desc":"人稱東臺古堡的海岸砲臺，見證清末澎湖海防的變化。清法戰爭後法軍撤離，劉銘傳多次上奏加強防務，西嶼也由此展開築臺工程。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3225,"name":"西嶼燈塔(漁翁島燈塔)","lat":23.562421,"lng":119.46958,"cat":"history","tag":"古蹟","desc":"外垵村西側的屹仔尾岬角，面對澎湖著名的急流「西流」。這裡自古就是臺灣與廈門之間船舶辨認方位的標誌，也成為燈塔的所在。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3226,"name":"西嶼西臺","lat":23.564073,"lng":119.489281,"cat":"history","tag":"古蹟","desc":"內垵與外垵之間有片臨海高地，地方稱為中鼻尾，西臺便坐落於此。從鄭氏以來，這一帶就與東臺一同擔起澎湖西側海域的防務。","area":"西嶼鄉・澎湖縣","ph":"文"},{"id":3227,"name":"鯨魚洞","lat":23.655176,"lng":119.519813,"cat":"other","desc":"海浪在岸邊留下拱門，從外形看像一頭鯨魚，洞名便由此而來。周邊小店的小管麵線和炒小魚乾，也帶出澎湖漁村的家常滋味。","area":"西嶼鄉・澎湖縣","ph":"觀"},{"id":3228,"name":"乾益堂中藥行","lat":23.565204,"lng":119.564909,"cat":"worship","tag":"古蹟","desc":"馬公中央街頂街的老藥行，就坐落在古蹟四眼井對面。這段街道曾是媽宮商業發展的核心，井口與藥鋪相望，保留了老街的生活尺度。","area":"馬公市・澎湖縣","ph":"文"},{"id":3229,"name":"南海遊客中心","lat":23.566468,"lng":119.572513,"cat":"other","desc":"這是馬公往來望安、七美、虎井等南海島嶼的海上門戶。中心內設有候船空間與旅遊諮詢服務，聚集了準備出海的旅人。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3230,"name":"四眼井","lat":23.565101,"lng":119.564938,"cat":"history","tag":"古蹟","desc":"中央街最北端的老井坐落在三面丘地環抱的低處，南側敞開。井面有四個取水口，民間叫它四孔井，日治時期則有四目井的名稱。","area":"馬公市・澎湖縣","ph":"文"},{"id":3231,"name":"媽宮古城","lat":23.563036,"lng":119.562201,"cat":"worship","tag":"古蹟","desc":"馬公舊稱媽宮，清代已發展成商貿繁盛的「一市七街」。清法戰爭後地方開始築城設防，留下見證商港與軍事發展交會的古城。","area":"馬公市・澎湖縣","ph":"文"},{"id":3232,"name":"媽宮城隍廟","lat":23.566223,"lng":119.566317,"cat":"worship","tag":"古蹟","desc":"城隍原是城池守護神，後來也成為地方的守護神。澎湖同時有文澳與媽宮兩座城隍廟，從這裡能認識昔日官員履任前先祭城隍的信仰傳統。","area":"馬公市・澎湖縣","ph":"文"},{"id":3233,"name":"安宅里˙嶼仔尖塔","lat":23.5765,"lng":119.597,"cat":"other","desc":"嶼仔腳沙地上的石塔，曾是居民判讀海水漲退的標誌。早年澎湖土地貧瘠，村民要下海挑沙堆肥，這座塔也因此與農事緊緊相連。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3234,"name":"山水濕地公園","lat":23.51684,"lng":119.5963,"cat":"nature","desc":"山水沙灘堤防後方有片濕地，降低海堤後，內外水域重新相連。水生、濕生與旱生植物在此交會，還能留意形似海膽的定沙植物濱刺麥。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3235,"name":"嵵裡古宅","lat":23.525442,"lng":119.570518,"cat":"history","tag":"歷史建築","desc":"陳恭從少年時便在青灣一帶潛水採石，花了七年備料，再用一年把家蓋起來。老屋原覆紅瓦，屋頂遭砲火損壞後，修繕時改鋪黑瓦。","area":"馬公市・澎湖縣","ph":"文"},{"id":3236,"name":"文澳城隍廟","lat":23.565515,"lng":119.583669,"cat":"worship","tag":"古蹟","desc":"文澳舊名暗澳，曾設巡檢司，也是澎湖早期的行政中心。坐落在舊聚落中心的這座廟，是澎湖最早創建的城隍廟，與地方沿革關係深厚。","area":"馬公市・澎湖縣","ph":"文"},{"id":3237,"name":"文石書院內石碑（六面）","lat":23.567152,"lng":119.580195,"cat":"history","tag":"歷史建築","desc":"這組石刻包括文石書院的五面碑，以及記下施琅自述事功的石碑。施琅碑的額頭與邊框都刻有龍紋，碑文之外也值得細看雕飾。","area":"馬公市・澎湖縣","ph":"文"},{"id":3238,"name":"施公祠及萬軍井","lat":23.564605,"lng":119.56427,"cat":"worship","tag":"古蹟","desc":"天后宮東側的中央街上，施公祠與萬軍井同在一帶。祠廟前身是施琅受封靖海侯後建立的生祠，後來也奉祀海壇殉職官兵的木主。","area":"馬公市・澎湖縣","ph":"文"},{"id":3239,"name":"東衛呂丁思古宅","lat":23.568316,"lng":119.602335,"cat":"history","tag":"歷史建築","desc":"東衛呂氏從金門遷居澎湖，留下這座清代三合院。宅基用了福建青花石和壓艙石，再以澎湖硓𥑮石砌築，一棟房子匯集兩地石材。","area":"馬公市・澎湖縣","ph":"文"},{"id":3240,"name":"東衛石雕公園","lat":23.57018,"lng":119.59767,"cat":"nature","desc":"東衛水庫北側的公園，位在潮間帶東南邊，向北可望見西衛與澎湖灣。園內陳設四座大型石雕，也讓人想起澎湖豐富的玄武岩石材。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3241,"name":"案山里˙平安寶塔","lat":23.556667,"lng":119.574694,"cat":"other","desc":"案山相傳曾有龜蛇在村裡作亂，居民向北極殿上帝公求助，最後將牠們收服在塔中。寶劍、龜與蛇，也就成為地方傳說中的塔內三寶。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3242,"name":"桶盤地質公園","lat":23.50954,"lng":119.52115,"cat":"nature","desc":"桶盤嶼四周排滿玄武岩柱，能同時看見柱狀節理和板狀裂理。原本五角或六角的石柱，長年經過風吹浪打，稜角漸漸磨成圓弧。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3243,"name":"桶盤嶼蓮花座","lat":23.51245,"lng":119.52156,"cat":"scenic","desc":"桶盤嶼西南岸的海蝕平臺，接近海面高度，是海崖長年受浪侵蝕的結果。臺面上有海底火山口構造，中央隆起、四周下凹，形似蓮花座。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3244,"name":"澎湖公賣局北側防空壕","lat":23.568551,"lng":119.564249,"cat":"history","tag":"歷史建築","desc":"專賣局澎湖出張所旁的防空壕，是二戰期間供職員避難的地方。矮小樸實的外牆由黑色玄武岩堆砌，兩端入口旁還能看見當時設置的矮牆。","area":"馬公市・澎湖縣","ph":"文"},{"id":3245,"name":"澎湖天后宮","lat":23.564832,"lng":119.563924,"cat":"worship","tag":"古蹟","desc":"馬公中央里的媽祖廟，居澎湖「闔澎」三大公廟之首。至遲在明代就已有文獻記下它的身影，為海島長久以來的媽祖信仰留下見證。","area":"馬公市・澎湖縣","ph":"文"},{"id":3246,"name":"澎湖廳廳長官舍","lat":23.569942,"lng":119.567316,"cat":"history","tag":"歷史建築","desc":"這棟和洋折衷的磚造官舍，原供日治時期的澎湖廳長居住，戰後成為縣長公館。修復後以澎湖開拓館的新身分使用，牆基仍可見洗石子。","area":"馬公市・澎湖縣","ph":"文"},{"id":3247,"name":"澎湖廳憲兵隊","lat":23.564519,"lng":119.56379,"cat":"history","tag":"歷史建築","desc":"天后宮西側的這塊土地，清代先後設過水師協鎮署與通判衙門。日治時期改為澎湖島憲兵分隊隊址，在同一處留下幾代官署的沿革。","area":"馬公市・澎湖縣","ph":"文"},{"id":3248,"name":"澎湖廳舍","lat":23.57007,"lng":119.566468,"cat":"history","tag":"歷史建築","desc":"今日澎湖縣政府所在的建築，前身是日治時期的廳舍。它是當時五州三廳中留存至今的廳役所，從外觀仍能辨認行政建築的原有格局。","area":"馬公市・澎湖縣","ph":"文"},{"id":3249,"name":"澎湖生活博物館","lat":23.566967,"lng":119.579452,"cat":"culture","desc":"館內用文物、標本、老照片與文獻，拼出澎湖人的日常生活。展場穿插縮景模型、生態造景與聲光展示，近看器物也能理解它原來的環境。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3250,"name":"澎湖輪碼頭","lat":23.562334,"lng":119.560789,"cat":"other","desc":"這處碼頭牽繫著澎湖與臺灣本島的海上往來，也是影像作品取景的地方。廣告裡陳柏霖與柯有倫騎機車停下的場景，便是在此拍攝。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3251,"name":"澎湖遊客中心","lat":23.55639,"lng":119.606587,"cat":"other","desc":"馬公的遊客中心把澎湖古厝、王船做成模型，讓人一眼看清建築和船身的輪廓。館內也透過導覽解說與多媒體展示介紹群島風貌。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3252,"name":"澎湖郵便局","lat":23.563428,"lng":119.563903,"cat":"history","tag":"歷史建築","desc":"這棟日治時期的郵電所，記錄了澎湖早年的通訊歷史。屋頂向兩側落坡，到了入口改做切角，寬大的出簷下方可見支撐的三角木架。","area":"馬公市・澎湖縣","ph":"文"},{"id":3253,"name":"澎湖開拓館","lat":23.56973,"lng":119.56733,"cat":"culture","desc":"館舍曾是日治澎湖廳長的官邸，戰後又住過澎湖縣長。洋式與日式空間結合的宅院，採用了澎湖本地建材，後來轉作展示開拓歷史的場館。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3254,"name":"眷村文化園區","lat":23.56282,"lng":119.55825,"cat":"culture","desc":"日軍馬公重砲兵大隊進駐後修建的官舍與宿舍，成為篤行十村的前身。戰後又有軍人家庭遷入，讓這片宿舍留下不同世代的生活記憶。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3255,"name":"第一賓館","lat":23.568955,"lng":119.563351,"cat":"culture","tag":"古蹟","desc":"這座日式賓館由日軍興建，戰後先後接待過蔣中正、蔣經國與李登輝。八二三砲戰期間，蔣中正曾在這裡設立指揮所。","area":"馬公市・澎湖縣","ph":"文"},{"id":3256,"name":"篤行十村","lat":23.57063,"lng":119.57746,"cat":"other","desc":"仿製的「毋忘在莒」石碑後，是一排排修復再利用的日式木造宿舍。在地藝術家將裝置作品帶進昔日眷村，巷弄中還可見懷舊柑仔店。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3257,"name":"自由塔","lat":23.569958,"lng":119.571273,"cat":"history","tag":"歷史建築","desc":"澎湖青年為紀念韓戰停戰後戰俘獲釋，合力興建此塔。正面題有塔名，背面記下建塔者與日期，塔尖徽章上並列中華民國及韓國國旗。","area":"馬公市・澎湖縣","ph":"文"},{"id":3258,"name":"臺廈郊會館","lat":23.563921,"lng":119.564179,"cat":"worship","tag":"古蹟","desc":"昔日往來臺灣、廈門的行商曾在此棲身，街屋也兼作祭祀水仙王的廟宇。四角亭頂層原是二樓廟埕，歐式上下拉窗與洗貝殼砂牆面並存。","area":"馬公市・澎湖縣","ph":"文"},{"id":3259,"name":"臺灣總督府專賣局澎湖出張所","lat":23.567846,"lng":119.563931,"cat":"history","tag":"歷史建築","desc":"日治時期，專賣局在澎湖設置出張所，主持地方專賣業務。除了菸酒，鹽、油、火柴與樟腦油也曾由它經銷，與居民日用息息相關。","area":"馬公市・澎湖縣","ph":"文"},{"id":3260,"name":"蔡廷蘭進士第","lat":23.550677,"lng":119.611524,"cat":"history","tag":"古蹟","desc":"興仁舊稱雙頭掛，村落位在拱北山與獅山之間。澎湖出身的蔡廷蘭考中進士後，在上村興建宅第，把清代科舉的印記留在故鄉。","area":"馬公市・澎湖縣","ph":"文"},{"id":3261,"name":"虎井嶼北回歸線追日大道","lat":23.486402,"lng":119.51441,"cat":"culture","desc":"北回歸線穿過虎井嶼，步道以彩色石板浮雕標示沿線各國的風俗與旗幟。走到終點，雙手造型的裝置可用來對照不同季節的夕陽方位。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3262,"name":"虎井柱狀玄武岩","lat":23.49056,"lng":119.52778,"cat":"scenic","desc":"險峻的崖邊排列著一束束玄武岩柱，遠看如同一整片巨石林。岩壁下方轉為柔緩的草坡，常能看見山羊，與高聳石柱形成有趣的對照。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3263,"name":"虎井西山公園","lat":23.4897,"lng":119.51151,"cat":"nature","desc":"虎井的村落夾在東山與西山之間一片平地上。西山原有軍方駐守，撤防後改為公園，延續了島上山地與聚落相鄰的景觀。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3264,"name":"虎井軍事觀測所","lat":23.4861,"lng":119.50985,"cat":"other","desc":"虎井西山上的石造建築像座小碉堡，是日治時期留下的海面觀測所。地面只露出一部分，當地人替這處地下設施取了「螞蟻孔」的別名。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3265,"name":"西瀛勝境牌樓","lat":23.567702,"lng":119.56298,"cat":"history","tag":"歷史建築","desc":"牙白色牌樓的正反兩面，都題有金色的「西瀛勝境」四字。兩側上方嵌著黨徽，下方碑文則記載二二八事件，留下戰後澎湖的歷史線索。","area":"馬公市・澎湖縣","ph":"文"},{"id":3266,"name":"西衛里˙塔尖","lat":23.581556,"lng":119.583639,"cat":"other","desc":"西衛居民撿貝、採海菜的潮間帶上，矗立著一座尖塔。當年村民有感於水勢洶湧而立塔鎮煞，也把漁船平安歸港的心願寄託於此。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3267,"name":"鎖港南北石塔","lat":23.52349,"lng":119.602281,"cat":"history","tag":"古蹟","desc":"鎖港舊聚落北方，原有一座被東北季風漸漸吹散的小沙丘。南北兩座高近三層樓的石塔立在村邊，寄託居民鎮風止煞的願望。","area":"馬公市・澎湖縣","ph":"文"},{"id":3268,"name":"鎖港自行車休憩站","lat":23.54092,"lng":119.60572,"cat":"other","desc":"這處澎南自行車休憩站，把自行車與海洋意象放進休息空間。地上有在地藝術家彩繪的海洋生物，洪易則為此創作自行車主題的地景藝術。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3269,"name":"鎖港許監督古宅","lat":23.524674,"lng":119.600078,"cat":"history","tag":"歷史建築","desc":"許家住宅以硓𥑮石砌成，轉角與門邊用矩形玄武岩補強。神龕八仙桌下靠後牆處留有安地磚，是澎湖傳統安厝儀式留下的物件。","area":"馬公市・澎湖縣","ph":"文"},{"id":3270,"name":"鎖港許祖取古宅","lat":23.524948,"lng":119.600606,"cat":"history","tag":"歷史建築","desc":"許家老宅留著不同年代修繕的痕跡，細看磁磚對聯便能辨認日治時期的用心。神龕桌下靠後壁處還有安地磚，見證傳統安厝儀式。","area":"馬公市・澎湖縣","ph":"文"},{"id":3271,"name":"鎖港里˙南北石塔","lat":23.526096,"lng":119.602644,"cat":"other","desc":"南午塔與北子塔成對矗立，是澎湖居民面對東北季風時的信仰寄託。原塔倒塌後，村民依北極殿指示重建為九層，也稱鎮山子午寶塔。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3272,"name":"雞母塢古宅","lat":23.528872,"lng":119.586073,"cat":"history","tag":"歷史建築","desc":"這座歐陽家族的民宅興建於日治時期，沿用澎湖傳統形式，又採取近代構造材料。老屋久置受損後，新屋主為了保存它而提報歷史建築。","area":"馬公市・澎湖縣","ph":"文"},{"id":3273,"name":"青灣仙人掌公園","lat":23.52568,"lng":119.56693,"cat":"nature","desc":"原本廢棄的日治軍事營區，如今種著近百種仙人掌。園內還有用玄武岩砌成的碉堡與柱狀玄武岩地景，登上高處能一併遠望海面。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3274,"name":"風櫃尾74號古宅","lat":23.540005,"lng":119.546727,"cat":"history","tag":"歷史建築","desc":"整修這座傳統四櫸頭民宅時，地下出土的清代地磚為老屋年代提供了線索。門樓呈師公翹形式，屋脊端頭及牆面的萬字紋灰刻也值得細看。","area":"馬公市・澎湖縣","ph":"文"},{"id":3275,"name":"風櫃洞","lat":23.53756,"lng":119.54393,"cat":"scenic","desc":"風櫃尾南岸的玄武岩，被海浪沿著節理沖出一道狹長的溝，溝底又蝕成洞穴。海水湧入岩洞而響起的濤聲，便是「風櫃聽濤」的來由。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3276,"name":"馬公合昌建材行","lat":23.567745,"lng":119.568487,"cat":"history","tag":"歷史建築","desc":"呂安德家族曾在這棟兩層洋樓經營建材行，以磚與硓𥑮石砌出的白牆帶有浮雕。大門上方有一對木雕獅子，寄託生意興旺的心意。","area":"馬公市・澎湖縣","ph":"文"},{"id":3277,"name":"馬公市第三水源地一千噸配水塔","lat":23.568649,"lng":119.564509,"cat":"history","tag":"歷史建築","desc":"馬公開鑿深水井後，在第三水源地增設一座可儲存千噸水的配水塔。各井水源由馬達送往高處的貯水槽，巨大的塔身留下城市供水的歷史。","area":"馬公市・澎湖縣","ph":"文"},{"id":3278,"name":"馬公文石書院魁星樓","lat":23.566691,"lng":119.580193,"cat":"history","tag":"歷史建築","desc":"澎湖孔廟前身為文石書院，魁星樓原是書院的一部分。清代改建後坐落東南方，後來孔廟重修，仍將這座樓的原有樣貌保留下來。","area":"馬公市・澎湖縣","ph":"文"},{"id":3279,"name":"馬公東甲北極殿","lat":23.56493,"lng":119.566866,"cat":"worship","tag":"歷史建築","desc":"東甲居民的甲頭廟保有傳統兩進格局，木棟架是殿內的骨幹。抬頭能見樑架上的彩繪與木雕，石雕也為這座馬公老廟增添細節。","area":"馬公市・澎湖縣","ph":"文"},{"id":3280,"name":"馬公武德騎尉項得生古宅","lat":23.564606,"lng":119.564488,"cat":"history","tag":"歷史建築","desc":"這棟清代街屋採合院格局，在前後兩落之間留出天井。外牆可見紅磚與石材交錯，厝角和屋簷轉折處尤其容易看出匠人的砌築手法。","area":"馬公市・澎湖縣","ph":"文"},{"id":3281,"name":"馬公水上警察官吏派出所","lat":23.563206,"lng":119.563623,"cat":"history","tag":"歷史建築","desc":"舊時處理馬公水上警務的派出所，建築順著街角展開。中央兩層、兩翼各一層，切角入口用洗石子勾出線條，上方還保留泥塑裝飾。","area":"馬公市・澎湖縣","ph":"文"},{"id":3282,"name":"馬公港 漁人碼頭","lat":23.563732,"lng":119.568165,"cat":"other","desc":"兩處漁港之間有一段沿水延伸的木棧道，是馬公港邊的散步處。中段船形的「菊島之星」是漁產品直銷中心，讓人一眼認出港區輪廓。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3283,"name":"馬公篤行十村","lat":23.563858,"lng":119.56098,"cat":"history","tag":"歷史建築","desc":"西城門外這片宿舍區原供日軍人員居住，戰後陸續成為軍眷的家。沿街可見獨棟與雙併住宅，抬高的木造屋身、雨淋板外牆仍辨得出來。","area":"馬公市・澎湖縣","ph":"文"},{"id":3284,"name":"馬公觀音亭","lat":23.567663,"lng":119.561958,"cat":"worship","tag":"古蹟","desc":"清康熙年間，澎湖游擊薛奎在馬公創建這座奉祀觀音大士的廟宇。其後歷任地方官員與士紳多次勸捐重修，留下地方合力護持信仰的歷史。","area":"馬公市・澎湖縣","ph":"文"},{"id":3285,"name":"馬公金龜頭礮臺","lat":23.563284,"lng":119.557737,"cat":"history","tag":"古蹟","desc":"從清代稱作澎湖新城的早期設防，到後來的金龜頭礮臺，這裡曾多次築城改建。日治時期又有工程接續，名稱與遺構串起不同年代的海防史。","area":"馬公市・澎湖縣","ph":"文"},{"id":3286,"name":"馬公金龜頭礮臺","lat":23.564167,"lng":119.560741,"cat":"other","desc":"龜頭山在媽宮古城西南門外，砲臺就坐落在馬公半島西端的山上。這處面向馬公灣的舊海防設施已經修復，能從地形讀出古城與港灣的關係。","area":"馬公市・澎湖縣","ph":"觀"},{"id":3287,"name":"馬公風櫃尾荷蘭城堡","lat":23.553719,"lng":119.548544,"cat":"history","tag":"古蹟","desc":"風櫃尾的小半島俗稱蛇頭山，荷蘭人曾在此建立貿易據點。堡內原有住所與營舍，後來部分建材拆運至大員，留下澎湖與臺南相連的歷史。","area":"馬公市・澎湖縣","ph":"文"},{"id":3288,"name":"高雄關稅局馬公支關","lat":23.563273,"lng":119.565388,"cat":"history","tag":"古蹟","desc":"媽宮港成為特別輸出入港後，日治時期的稅關機構也在此設點。舊支關建築保有不同式樣的拱形開口，主體與塔樓的屋頂各有輪廓。","area":"馬公市・澎湖縣","ph":"文"},{"id":3289,"name":"1035 collab","lat":24.13984,"lng":120.68005,"cat":"history","desc":"這棟日治時期的建築原是鈴木耳鼻咽喉科醫院。修復團隊在牆層裡找到刻著「電話一零三五番」的招牌木板，留下來成為今日名稱的由來。","area":"中區・臺中市","ph":"觀"},{"id":3290,"name":"中央書局","lat":24.14085,"lng":120.68116,"cat":"culture","desc":"這家創立於日治時期的漢語書局，曾是臺中文學與藝術人士交流的重要地方。多年熄燈後於二〇二〇年重新開幕，也喚起不少老臺中人的記憶。","area":"中區・臺中市","ph":"觀"},{"id":3291,"name":"中山綠橋(舊稱：新盛橋)","lat":24.137878,"lng":120.68313,"cat":"history","tag":"歷史建築","desc":"綠川上的橋原名新盛橋，修建與臺中慶祝縱貫鐵路通車的盛會有關。戰後街道改名中山路，河名與路名合在一起，便有了如今的橋名。","area":"中區・臺中市","ph":"文"},{"id":3292,"name":"台灣太陽餅博物館","lat":24.13968,"lng":120.68241,"cat":"culture","desc":"博物館設在從日治時期留存至今的全安堂，老屋過去是販售進口藥品和日用品的藥鋪。經整修改造後，屋裡換成了臺中傳統太陽餅的故事。","area":"中區・臺中市","ph":"觀"},{"id":3293,"name":"合作金庫銀行臺中分行(原名：臺中州立圖書館)","lat":24.137959,"lng":120.680313,"cat":"history","tag":"歷史建築","desc":"銀行建築的前身是臺中州立圖書館，日治時期就在這裡推廣大眾閱讀。戰後一度由省立臺中圖書館接續辦理館務，是中部文教發展的見證。","area":"中區・臺中市","ph":"文"},{"id":3294,"name":"宮原眼科","lat":24.13784,"lng":120.68356,"cat":"worship","desc":"綠川邊的老眼科保留了紅磚外牆與舊牌樓，騎樓則以紅磚配上木頂。走進曾經的診療空間，挑高的復古圖書館式裝潢又呈現另一番景象。","area":"中區・臺中市","ph":"觀"},{"id":3295,"name":"成功路青草街","lat":24.14011,"lng":120.68452,"cat":"structure","desc":"成功路這段青草街，原屬臺中第一市場的一部分。市場經過改建，街上卻仍保有傳統市街的古樸氣息，留下老市場在街區中的生活印記。","area":"中區・臺中市","ph":"觀"},{"id":3296,"name":"新盛綠川水岸廊道","lat":24.139,"lng":120.68451,"cat":"other","desc":"綠川原名新盛溪，曾是日治時期臺中「小京都」規劃中的河川。橫跨水面的新盛橋就是今天的中山綠橋，當年的夜景亦列入臺中八景。","area":"中區・臺中市","ph":"觀"},{"id":3297,"name":"東協廣場","lat":24.13947,"lng":120.68364,"cat":"nature","desc":"臺中車站前的這座綜合大樓，把購物、休閒與異國文化聚在一起。車站前街區的多元面貌，從這棟廣場大樓便能略見一斑。","area":"中區・臺中市","ph":"觀"},{"id":3298,"name":"柳原教會","lat":24.146096,"lng":120.681229,"cat":"worship","tag":"歷史建築","desc":"舊教堂依照梅甘霧牧師提供的英國教會圖樣興建，在日治時期落成。後來會眾又在南側增建新聖殿，讓新舊兩代的禮拜空間並存。","area":"中區・臺中市","ph":"文"},{"id":3299,"name":"株式會社彰化銀行本店","lat":24.139912,"lng":120.682161,"cat":"history","tag":"古蹟","desc":"彰化銀行由臺人集資創立，總行最初設在彰化，後遷至臺中。隨著業務擴展，日治時期另建這棟總行，記下地方金融機構成長的一步。","area":"中區・臺中市","ph":"文"},{"id":3300,"name":"綠空鐵道1908","lat":24.13554,"lng":120.68265,"cat":"other","desc":"臺中鐵路高架化後，原有的鐵路空間逐漸成為綠色廊帶。臺中車站南北兩側這一段約一點六公里，延續了百年鐵道穿越城市的路徑。","area":"中區・臺中市","ph":"觀"},{"id":3301,"name":"臺中火車站","lat":24.13694,"lng":120.685267,"cat":"history","tag":"古蹟","desc":"臺中車站的發展與西部縱貫鐵路密不可分，當年全線通車的祝賀會就選在臺中公園舉行。車站周邊留存的舊貨物倉庫，也記下鐵路運貨的年代。","area":"中區・臺中市","ph":"文"},{"id":3302,"name":"臺中驛鐵道文化園區","lat":24.13678,"lng":120.68501,"cat":"culture","desc":"從第一代臺中驛、擴建的第二代車站，到鐵路高架化後的第三代站體，百年鐵道在此相會。卸下運輸任務的第二代站房，如今以國定古蹟身分保存。","area":"中區・臺中市","ph":"觀"},{"id":3303,"name":"萬春宮","lat":24.14214,"lng":120.68165,"cat":"worship","desc":"這座奉祀天上聖母的老廟始於清代，媽祖像上方懸有光緒皇帝所賜的「海晏河清」匾。前殿抬頭可見尖形藻井，構件像蛛網般向中心層層收攏。","area":"中區・臺中市","ph":"觀"},{"id":3304,"name":"郵政博物館臺中館","lat":24.13911,"lng":120.67888,"cat":"culture","desc":"走上臺中民權路郵局三樓，便來到中華郵政在中部設立的博物館。它以分享郵政館藏為宗旨，讓臺中地區民眾也能就近接觸相關文化資源。","area":"中區・臺中市","ph":"觀"},{"id":3305,"name":"中山公園湖心亭","lat":24.143628,"lng":120.684133,"cat":"nature","tag":"古蹟","desc":"臺中公園原有天然水塘，整修成池後，因縱貫鐵路全線通車慶典而在水中建亭。當年來臺主持典禮的閑院宮載仁親王，便曾在亭裡休息觀演。","area":"北區・臺中市","ph":"文"},{"id":3306,"name":"中正公園","lat":24.15748,"lng":120.68251,"cat":"nature","area":"北區・臺中市","ph":"觀"},{"id":3307,"name":"元保宮","lat":24.16283,"lng":120.67629,"cat":"worship","desc":"賴姓先民渡海來臺開墾時，從福建平和縣心田宮迎來保生大帝。這尊被信眾視作行醫濟世的神明，在賴厝廍成為護佑居民的信仰。","area":"北區・臺中市","ph":"觀"},{"id":3308,"name":"國立自然科學博物館之植物園","lat":24.15812,"lng":120.66817,"cat":"nature","desc":"科博館後方的植物園，將熱帶雨林溫室與戶外低海拔生態分區展示。沿園路可以認識臺灣不同地區的原生植物，溫室前還有蝴蝶雕塑。","area":"北區・臺中市","ph":"觀"},{"id":3309,"name":"寶覺寺","lat":24.15917,"lng":120.68771,"cat":"worship","desc":"北區健行路上的佛寺建於日治時期，廟貌採鼓樓式建築。寺中同時供奉釋迦牟尼、藥師佛與阿彌陀佛，原是參禪問學的清靜場所。","area":"北區・臺中市","ph":"觀"},{"id":3310,"name":"放送電台擴音台(舊稱：放送頭)","lat":24.144191,"lng":120.683727,"cat":"history","tag":"歷史建築","desc":"臺中公園曾以這座俗稱「放送頭」的擴音設施，向民眾播放廣播。它見證了從日治放送局到戰後電臺的變遷，直到收音機普及才歇下來。","area":"北區・臺中市","ph":"文"},{"id":3311,"name":"砲台山(舊稱：大墩)","lat":24.144831,"lng":120.683126,"cat":"history","tag":"歷史建築","desc":"臺中早期地名「大墩」，原指一座海拔約九十公尺的土丘。清代山邊聚落發展成大墩街，日治初期因山上曾架設火砲，又有砲台山之稱。","area":"北區・臺中市","ph":"文"},{"id":3312,"name":"臺中作家典藏館","lat":24.14597,"lng":120.68486,"cat":"culture","desc":"精武圖書館四樓收藏了在臺中出生、生活或寫作的作家資料。手稿上的字跡、剪報和影像，從不同角度留下地方文學與作家生活的片段。","area":"北區・臺中市","ph":"觀"},{"id":3313,"name":"臺中公園","lat":24.14431,"lng":120.68571,"cat":"nature","desc":"這座日治時期開闢的市區公園，以人工湖、曲橋與亭臺串起水邊景色。園裡也有露天音樂臺、遊戲區與網球場，散步和運動各有去處。","area":"北區・臺中市","ph":"觀"},{"id":3314,"name":"臺中市中山堂","lat":24.1553,"lng":120.68276,"cat":"culture","desc":"中正公園旁的展演建築，從外面能看見宛如四分之一圓的弧形輪廓。館體地上三層、地下兩層，自一九八九年起成為臺中的公共場館。","area":"北區・臺中市","ph":"觀"},{"id":3315,"name":"臺中市孔廟","lat":24.15432,"lng":120.68997,"cat":"worship","desc":"這裡以釋奠典禮紀念孔子誕辰，保留了莊重的祭孔傳統。廟中也有考前祈福，其他時候的攝影與寫生活動，則留下人們觀看廟宇的不同角度。","area":"北區・臺中市","ph":"觀"},{"id":3316,"name":"臺中市忠烈祠","lat":24.15276,"lng":120.69042,"cat":"worship","desc":"力行路上的忠烈祠仿清代北方宮殿形式興建，也是中部舉行國殤典禮的場所。由街邊牌樓、山門走向正殿，途中還有成對的六角亭與魚池。","area":"北區・臺中市","ph":"觀"},{"id":3317,"name":"臺中市長公館ˍ不老夢想125號","lat":24.1487,"lng":120.68682,"cat":"culture","desc":"這棟兩層樓公館將西式柱廊、裝飾欄杆與日式窗檯置於同一所住宅。二樓陽臺尤其容易看出古典柱列與簡潔的水平、垂直線條如何相接。","area":"北區・臺中市","ph":"觀"},{"id":3318,"name":"臺中放送局","lat":24.149936,"lng":120.690641,"cat":"history","tag":"歷史建築","desc":"新高町水源地的放送局，是日治時期繼臺北、臺南之後設立的第三個廣播電臺。它曾以英文呼號播音，擔任全臺廣播網路中的中繼站。","area":"北區・臺中市","ph":"文"},{"id":3319,"name":"臺灣省城大北門","lat":24.145006,"lng":120.684467,"cat":"history","tag":"歷史建築","desc":"臺中公園內這座門樓，保存的是清代臺灣省城大北門「明遠樓」的屋頂。日治時期拆城開路，恰逢公園闢建，門樓因而在園裡有了新位置。","area":"北區・臺中市","ph":"文"},{"id":3320,"name":"農委會農糧署中區分署臺中辦事處(原名：總督府農商局食糧部臺中事務所)","lat":24.148724,"lng":120.681834,"cat":"history","tag":"歷史建築","desc":"這棟木造兩層事務所原屬臺灣總督府米穀局，後改隸農商局食糧部。昔日中部的米穀業務就在此辦理，下轄清水、彰化和員林等地的出張所。","area":"北區・臺中市","ph":"文"},{"id":3321,"name":"Hione World海灣樂世界","lat":24.19896,"lng":120.7642,"cat":"other","desc":"北屯這處休閒空間同時照顧到親子與寵物。大人帶孩子出門玩，也能讓家裡的毛孩一起加入。","area":"北屯區・臺中市","ph":"觀"},{"id":3322,"name":"八二三紀念公園","lat":24.18755,"lng":120.68925,"cat":"nature","desc":"這座公園為紀念金門八二三砲戰的軍民而設。園內陳列陸、海、空三軍不同年代的裝備，旁有解說牌可分辨展示品各自所屬的歷史。","area":"北屯區・臺中市","ph":"觀"},{"id":3323,"name":"原日軍臺中飛行場機槍堡","lat":24.188586,"lng":120.658528,"cat":"history","tag":"歷史建築","desc":"這座機槍堡是二戰末期臺中飛行場留下的遺構。當年的日軍機場戰後由空軍接收，後來增加民航業務，也就是臺中人熟悉的水湳機場。","area":"北屯區・臺中市","ph":"文"},{"id":3324,"name":"大坑生態園區","lat":24.17304,"lng":120.78453,"cat":"culture","desc":"大坑山區的生態園隨四季變換觀察主題，春天可留意花朵、蝴蝶與螢火蟲。夏日的獨角仙、秋天的植物種子和冬季的青斑蝶，各有不同看頭。","area":"北屯區・臺中市","ph":"觀"},{"id":3325,"name":"大坑粉紅情人橋","lat":24.16647,"lng":120.72784,"cat":"other","desc":"數十條鋼纜從橋塔斜拉向橋面，勾出大坑這座粉紅色斜張橋的線條。橋面選用玻璃，低頭還能看見映在腳下的粉紅橋身。","area":"北屯區・臺中市","ph":"觀"},{"id":3326,"name":"大振豐洋傘文創主題館","lat":24.16186,"lng":120.72323,"cat":"culture","desc":"這間以洋傘為題的館舍，出自從事傘具出口與內銷的臺灣品牌。從自行設計、製造一路做到銷售，館名背後是本地製傘業的發展經驗。","area":"北屯區・臺中市","ph":"觀"},{"id":3327,"name":"廍子公園","lat":24.1669,"lng":120.73264,"cat":"nature","desc":"春天走進廍子公園，黃花風鈴木盛開時，一整排樹冠都會轉為金色。這片隨花期短暫出現的景致，是園裡最鮮明的季節變化。","area":"北屯區・臺中市","ph":"觀"},{"id":3328,"name":"慈善寺","lat":24.16865,"lng":120.69077,"cat":"worship","desc":"這座始建於日治時期的佛寺，後來擴建了大雄寶殿等鋼筋水泥殿宇。寺內可沿庭園散步，寺外平田里福德祠一帶則有高大的老樹。","area":"北屯區・臺中市","ph":"觀"},{"id":3329,"name":"新都生態公園","lat":24.17346,"lng":120.72857,"cat":"nature","desc":"靠近臺中市區的大坑山麓，除了各條登山步道，還有這片腹地寬廣的生態公園。帶家人沿園區散步，可以把沿途植物當作觀察主題。","area":"北屯區・臺中市","ph":"觀"},{"id":3330,"name":"昌平路皮鞋街","lat":24.1678,"lng":120.69302,"cat":"structure","desc":"北屯路與文心路之間的昌平路一段，兩邊聚集了許多皮鞋店。當中不少由工廠自行經營，讓製鞋與零售在同一條街上相接。","area":"北屯區・臺中市","ph":"觀"},{"id":3331,"name":"林懋陽故居","lat":24.166216,"lng":120.692653,"cat":"history","tag":"歷史建築","desc":"這座日治時期的三合院，是神岡社口林家的林懋陽與北屯賴端婚後的住處。宅院落成當年，兩人即遷入，在此留下兩個地方家族交會的歷史。","area":"北屯區・臺中市","ph":"文"},{"id":3332,"name":"積善樓","lat":24.16932,"lng":120.693793,"cat":"history","tag":"古蹟","desc":"這座門樓原是北屯賴長榮宅邸「懷德堂」的入口。後來因市地重劃，原宅遭拆，後代與地方人士奔走留下門樓，讓人仍可辨認大宅的門面。","area":"北屯區・臺中市","ph":"文"},{"id":3333,"name":"紙箱王 Carton King","lat":24.17784,"lng":120.73908,"cat":"other","desc":"北屯有座拿紙作為創意主題的園區，名字也和紙箱有關。紙箱王以親子為對象，大人和孩子可以一起逛。","area":"北屯區・臺中市","ph":"觀"},{"id":3334,"name":"臺中市洲際棒球場","lat":24.19943,"lng":120.68396,"cat":"other","desc":"為推動中部棒球運動而興建的比賽場館，讓臺中球迷有了共同的觀賽場所。場內設有大型彩色螢幕，遠處看臺也能掌握場上賽況。","area":"北屯區・臺中市","ph":"觀"},{"id":3335,"name":"臺中市眷村文物館","lat":24.16124,"lng":120.69518,"cat":"culture","desc":"這裡原是北屯新村，曾安置來自貴州飛機製造廠的空軍技術人員及家眷。留下的三棟代表性建物，讓眷村生活有了可以走進去的空間。","area":"北屯區・臺中市","ph":"觀"},{"id":3336,"name":"臺中市立圖書館興安分館","lat":24.16929,"lng":120.69457,"cat":"culture","desc":"北屯兒童公園裡的純白圖書館，前身是北屯兒童分館。在地藝術家吳芊頤把彩色拼貼融入建築，作品「窗景日和」形成一扇圓圓的花形窗景。","area":"北屯區・臺中市","ph":"觀"},{"id":3337,"name":"臺中文昌廟","lat":24.190711,"lng":120.68483,"cat":"worship","tag":"古蹟","desc":"舊四張犁街東南方的廟宇，原是從地方社學發展而來的儒教文祠。早年人們稱作文祠或文昌祠，到了日治時期才逐漸改稱文昌廟。","area":"北屯區・臺中市","ph":"文"},{"id":3338,"name":"臺灣民俗文物館","lat":24.17528,"lng":120.68704,"cat":"culture","desc":"民俗公園內的閩南式館舍，分成民俗館與民藝街兩部分。除了主題展覽，館內也透過抓周與手作體驗，讓傳統生活習俗有了實際接觸的機會。","area":"北屯區・臺中市","ph":"觀"},{"id":3339,"name":"公賣局第五酒廠舊區（舊稱：臺中專賣局）","lat":24.133767,"lng":120.681827,"cat":"history","tag":"歷史建築","desc":"舊酒廠原為日治時期的民營製酒工場，酒類改採政府專賣後被徵收。隨著臺中專賣支局與製酒設施陸續擴建，逐漸形成今日可辨的工業建築群。","area":"南區・臺中市","ph":"文"},{"id":3340,"name":"台中城隍廟","lat":24.12854,"lng":120.68125,"cat":"worship","desc":"合作街上的廟宇自清代創建，日治時期才遷到現址。信眾將城隍爺視作掌管地方的守護神，從廟外抬頭可見陽光映亮屋脊的瓷瓦。","area":"南區・臺中市","ph":"觀"},{"id":3341,"name":"國立公共資訊圖書館","lat":24.1274,"lng":120.6708,"cat":"culture","desc":"這座國立公共圖書館的歷史可追溯至日治時期成立的臺中州立圖書館。從地方閱讀空間發展至今，也兼具數位圖書館與輔導各地公共圖書館的任務。","area":"南區・臺中市","ph":"觀"},{"id":3342,"name":"文化部文化資產園區","lat":24.13348,"lng":120.68169,"cat":"culture","desc":"舊臺中酒廠的製酒工業空間，經整建後成為藝文作品發表的場所。今日在廠區活動的有學生、藝術團體與產業工作者，讓老酒廠延續新的用途。","area":"南區・臺中市","ph":"觀"},{"id":3343,"name":"臺中林氏宗祠","lat":24.131238,"lng":120.677562,"cat":"worship","tag":"古蹟","desc":"中部林姓家族的宗祠，前身是清代設在大里內新的林祿公祠。歷經遷移後，由中部各支林家共同出資興建，成為跨越地方的宗族祭祀場所。","area":"南區・臺中市","ph":"文"},{"id":3344,"name":"興大路阿勃勒黃金大道(興大綠園道)","lat":24.12375,"lng":120.67929,"cat":"other","desc":"中興大學前的興大園道有近半公里，初夏時阿勃勒成串的黃花垂在樹梢。微風吹過，細小花瓣飄落地面，行人彷彿走在一場黃金雨裡。","area":"南區・臺中市","ph":"觀"},{"id":3345,"name":"IKEA 宜家家居 台中店","lat":24.14704,"lng":120.64291,"cat":"other","desc":"這是瑞典家具家飾品牌在臺中的賣場，從家具到家飾都圍繞日常居家需求。設計講究外形也求實用，是辨認這個品牌風格的線索。","area":"南屯區・臺中市","ph":"觀"},{"id":3346,"name":"南屯三角街","lat":24.138765,"lng":120.639699,"cat":"structure","tag":"歷史建築","desc":"萬和路與南屯路交會處的街屋，地方稱為「三角街仔」。這段街屬於昔日犁頭店，清代鹿港貨物往東大墩與葫蘆墩時，曾沿這一帶往來。","area":"南屯區・臺中市","ph":"文"},{"id":3347,"name":"南屯文昌公廟","lat":24.137956,"lng":120.638707,"cat":"worship","tag":"歷史建築","desc":"犁頭店的文昌祠主祀五文昌，昔日多個文社曾在廂房授課。後來犁頭店公學校創立，也借過這裡當校舍，一座廟串起南屯地方教育的發展。","area":"南屯區・臺中市","ph":"文"},{"id":3348,"name":"南屯水碓繩繼堂","lat":24.123552,"lng":120.632055,"cat":"worship","tag":"古蹟","desc":"清代劉源沂在南屯溪潭北側建屋，後來邀兄長全家渡海同住。劉家沿溪開墾，逐漸形成水碓聚落，這座祖宅便與地方的起源密不可分。","area":"南屯區・臺中市","ph":"文"},{"id":3349,"name":"南屯犂頭店生活館","lat":24.13628,"lng":120.63896,"cat":"culture","desc":"這棟建築曾作南屯衛生所，後來改為主任宿舍，如今成為社區生活館。常設展示收存古早農具與日常用品，也讓居民在舊房子裡相聚辦活動。","area":"南屯區・臺中市","ph":"觀"},{"id":3350,"name":"南屯老街","lat":24.13909,"lng":120.63948,"cat":"structure","desc":"清代移民開墾臺中盆地，打造、販賣犁頭的店鋪逐漸在此聚集，因而得名犁頭店街。今日的老街串起三角街、市場與萬和宮等南屯地標。","area":"南屯區・臺中市","ph":"觀"},{"id":3351,"name":"南屯麻芛文化館ˍ犁頭店","lat":24.13757,"lng":120.63941,"cat":"culture","desc":"館名裡的「犁頭店」是南屯的舊地名。清代因應墾殖所需，打鐵鋪紛紛在這一帶打造農具、鑄造犁頭，逐步發展成農具交易中心。","area":"南屯區・臺中市","ph":"觀"},{"id":3352,"name":"圓滿戶外劇場","lat":24.14586,"lng":120.64555,"cat":"nature","desc":"劇場採圓形露天設計，借鏡古代競技場的環狀空間。觀眾席環抱表演區，視線能聚向舞臺，也讓演出的聲音在開放空間裡傳向觀眾。","area":"南屯區・臺中市","ph":"觀"},{"id":3353,"name":"壹善堂","lat":24.144514,"lng":120.614512,"cat":"worship","tag":"古蹟","desc":"清代廖勃在南屯山仔腳設齋堂，後由孫輩依齋教龍華派格局改建。傳統客家三合院裡又可見日式彩繪、西式柱飾，留下不同時期的手藝。","area":"南屯區・臺中市","ph":"文"},{"id":3354,"name":"彩虹村","lat":24.13368,"lng":120.60983,"cat":"culture","desc":"南屯春安路的巷弄裡，彩虹村以充滿色彩的素樸藝術為人熟知。除了欣賞創作，來訪者也能自己彩繪一張祈福卡，在卡片上留下心願。","area":"南屯區・臺中市","ph":"觀"},{"id":3355,"name":"戰後望高寮砲堡群（A01、A02、A03、A04）","lat":24.14591,"lng":120.577654,"cat":"history","tag":"歷史建築","desc":"臺中港建成後，軍方在南大肚山望高寮興建防禦工事。山上留下的四座砲堡屬於當年的望高寮砲陣地，是臺中戰後軍事建築的一部分。","area":"南屯區・臺中市","ph":"文"},{"id":3356,"name":"文心森林公園","lat":24.14616,"lng":120.64586,"cat":"nature","desc":"南屯這片綠地以草地、植栽、木材與天然石材安排園景。園區中央的圓滿戶外劇場讓表演走出室內，也讓散步的人有機會在公園遇見藝文活動。","area":"南屯區・臺中市","ph":"觀"},{"id":3357,"name":"望高寮夜景公園","lat":24.14362,"lng":120.5813,"cat":"nature","desc":"大肚台地高起的地勢，讓望高寮成為眺望臺中市區、臺中港與大肚溪以南的地方。從傍晚的夕陽到入夜的燈火，山上有兩種不同風景。","area":"南屯區・臺中市","ph":"觀"},{"id":3358,"name":"湖水岸藝術街坊","lat":24.13153,"lng":120.64449,"cat":"culture","desc":"豐樂公園旁兩棟住宅之間，百來公尺的巷弄聚集了民藝、古董、珠寶與餐飲小店。木質地板旁種著小葉欖仁，角落的池子還能見到錦鯉。","area":"南屯區・臺中市","ph":"觀"},{"id":3359,"name":"筏子溪門戶迎賓水岸廊道","lat":24.13048,"lng":120.61968,"cat":"other","desc":"筏子溪左岸高灘地闢有一段約一點八公里的水岸空間。沿濱水散步道走，地景藝術與立體文字地標點綴河岸，也留出親近溪水的視野。","area":"南屯區・臺中市","ph":"觀"},{"id":3360,"name":"簡氏宗祠","lat":24.134339,"lng":120.639055,"cat":"worship","tag":"古蹟","desc":"這座兩進雙護龍的宗祠始於清代，日治時期重建。前殿高懸「簡家祠堂」木匾，壁面有成對的泥塑龍虎，廊內則以木雕與交趾陶裝飾。","area":"南屯區・臺中市","ph":"文"},{"id":3361,"name":"臺中市文昌公廟","lat":24.13798,"lng":120.63861,"cat":"worship","desc":"地方文社共同籌建這座奉祀文昌帝君的廟宇，廟內花崗岩做成石板、石鼓等不同構件。文蔚社與文炳社合立的「天下文明」匾，仍記著文人結社的故事。","area":"南屯區・臺中市","ph":"觀"},{"id":3362,"name":"臺中市立圖書館李科永紀念圖書分館","lat":24.15207,"lng":120.62644,"cat":"culture","desc":"公園中的三層樓圖書館參考日本武雄圖書館的設計，把自然光線和窗外綠意帶入閱讀空間。走到戶外，還有大榕樹與休閒座椅相伴。","area":"南屯區・臺中市","ph":"觀"},{"id":3363,"name":"臺中清真寺","lat":24.13621,"lng":120.64979,"cat":"worship","desc":"南屯這座清真寺整修時，參考了麥地納先知清真寺的色彩與建築元素。從外面看，白色大穹頂與兩座高聳的喚拜塔，是辨認它的鮮明輪廓。","area":"南屯區・臺中市","ph":"觀"},{"id":3364,"name":"臺中監獄矯正教育館","lat":24.14216,"lng":120.59984,"cat":"culture","desc":"這座館舍把臺中監獄的矯正教育與技術訓練成果放在同一處展出。從作業和技訓成果，可以認識矯正機構平日的教化工作。","area":"南屯區・臺中市","ph":"觀"},{"id":3365,"name":"舊南屯溪","lat":24.128789,"lng":120.638416,"cat":"history","tag":"文化景觀","desc":"沿溪綠帶保有自然生態，也連著先民溯溪進入臺中盆地開墾的歷史。溪畔的史前麻餈埔遺址，更把人群在這裡依水而居的痕跡推向更早的年代。","area":"南屯區・臺中市","ph":"文"},{"id":3366,"name":"萬和宮","lat":24.137834,"lng":120.639267,"cat":"worship","tag":"古蹟","desc":"犁頭店一帶早年聚集打製農具的店鋪，廟宇因此又稱犁頭店聖母廟。清代開墾者自湄洲迎奉媽祖隨行，平安抵達後設祠祭祀，成為建廟的起點。","area":"南屯區・臺中市","ph":"文"},{"id":3367,"name":"豐樂雕塑公園","lat":24.13151,"lng":120.64334,"cat":"nature","desc":"南屯這座公立雕塑公園，把五十二件雕塑分散在六公頃的綠地裡。沿步道可經過人工湖、拱橋、流瀑與涼亭，在水景之間慢慢看作品。","area":"南屯區・臺中市","ph":"觀"},{"id":3368,"name":"貓霧拺井（番仔井）","lat":24.139021,"lng":120.607693,"cat":"history","tag":"歷史建築","desc":"這口水井是拍瀑拉族貓霧拺社居民生活在此時開鑿的。部落舊址大致在今日南屯春社與春安兩里之間，井名也留下原有社域的記憶。","area":"南屯區・臺中市","ph":"文"},{"id":3369,"name":"輔之居","lat":24.125175,"lng":120.642614,"cat":"history","tag":"歷史建築","desc":"原是仕紳林耀亭宅第的房子，後由林文亭購得，增建外門樓與書房教讀漢文。這裡遂成犁頭店知名私塾，也與後代參與地方文化活動有關。","area":"南屯區・臺中市","ph":"文"},{"id":3370,"name":"黎明新村","lat":24.15212,"lng":120.63213,"cat":"other","desc":"棋盤般的街道以干城街為核心，住宅保留前後庭院，街廓之間穿插綠地。社區外圍有黎明溝環繞，沿堤散步，水邊可見居民在樹下聊天乘涼。","area":"南屯區・臺中市","ph":"觀"},{"id":3371,"name":"內埔庄役場","lat":24.305069,"lng":120.710762,"cat":"history","tag":"古蹟","desc":"日治時期的內埔庄役場完工隔年，便遇到墩仔腳大地震，是當時少數倖存的建物。之後又歷經九二一地震，成為后里地方行政與震災記憶的見證。","area":"后里區・臺中市","ph":"文"},{"id":3372,"name":"后里張天機宅","lat":24.299138,"lng":120.713871,"cat":"history","tag":"古蹟","desc":"地方仕紳張天機的宅第，第一進有西式門面與柱廊，第二進卻採閩南形式。仔細看廊下座椅、洗手臺和花盆，連這些日常物件都用上了洗石子。","area":"后里區・臺中市","ph":"文"},{"id":3373,"name":"后里森林公園","lat":24.304,"lng":120.7249,"cat":"nature","desc":"這座公園曾是臺中花博與臺灣燈會場地，活動結束後成為常設綠地。園內保留「聆聽花開的聲音」、天空步道與臺灣庭園等花博設施。","area":"后里區・臺中市","ph":"觀"},{"id":3374,"name":"后里環保公園","lat":24.28819,"lng":120.70574,"cat":"nature","desc":"舊垃圾場封場後，原址經過填土與改良土質，先有了培育花草的苗圃。苗圃站穩腳步後又接續營造公園，讓這片土地逐步長回綠意。","area":"后里區・臺中市","ph":"觀"},{"id":3375,"name":"后里馬場馬廄、場本部、紀念碑","lat":24.298544,"lng":120.735537,"cat":"history","tag":"古蹟","desc":"日治時期的臺中州產馬牧場，戰後曾由農會經營，後交由軍方作為種馬牧場。馬廄、場本部與紀念碑留下來，讓后里的養馬歷史有跡可尋。","area":"后里區・臺中市","ph":"文"},{"id":3376,"name":"張連昌薩克斯風博物館","lat":24.31239,"lng":120.69458,"cat":"culture","desc":"館內從張連昌的故事談起，介紹后里發展臺灣製薩克斯風的過程。透過製作用的器具、樂器種類與工序展示，可以把舞臺上的聲音連回師傅的手藝。","area":"后里區・臺中市","ph":"觀"},{"id":3377,"name":"月眉糖廠「製糖工場」","lat":24.313985,"lng":120.694432,"cat":"history","tag":"歷史建築","desc":"這座工場最初由小松楠彌創立，名為大甲製糖所，併入北港製糖會社後改稱月眉工場。其後幾度更換經營者，也留下日治製糖產業整併的軌跡。","area":"后里區・臺中市","ph":"文"},{"id":3378,"name":"月眉觀光糖廠","lat":24.3145,"lng":120.69399,"cat":"other","desc":"老火車頭與日治時期留下的職工福利社，保留了月眉糖廠的工業記憶。如今福利社旁有噴泉與白色小橋，枝仔冰則讓人想起老糖廠的滋味。","area":"后里區・臺中市","ph":"觀"},{"id":3379,"name":"毘盧禪寺","lat":24.28889,"lng":120.74363,"cat":"worship","desc":"臺中這座禪寺奉釋迦牟尼佛為主尊，是中臺灣的佛教場所。半西式的廟宇面向寬闊庭院，呈現與傳統殿宇不同的空間面貌。","area":"后里區・臺中市","ph":"觀"},{"id":3380,"name":"泰安落羽松","lat":24.32562,"lng":120.74946,"cat":"scenic","desc":"泰安國小旁種有八百多棵落羽松，高低錯落的樹冠間還穿插地景藝術。秋冬葉色轉換，黃、綠與紅交疊，抬頭便是一層層不同顏色的松林。","area":"后里區・臺中市","ph":"觀"},{"id":3381,"name":"泰安鐵道文化園區","lat":24.32318,"lng":120.75012,"cat":"culture","desc":"舊山線停駛後，后里的泰安車站保留下來，成為可以走訪的鐵道文化園區。仔細看月臺棚架，下方的支柱竟是用二十世紀初期的舊鐵軌做成。","area":"后里區・臺中市","ph":"觀"},{"id":3382,"name":"約客厚禮","lat":24.31008,"lng":120.70549,"cat":"other","desc":"這裡的創作起點，是一家自行設計玻璃鏡球、塑膠吊飾與絨布娃娃的藝品公司。後來成立「約客與厚禮」，延續原有的裝飾藝品設計經驗。","area":"后里區・臺中市","ph":"觀"},{"id":3383,"name":"縱貫鐵路舊山線—泰安車站","lat":24.322776,"lng":120.749089,"cat":"history","tag":"古蹟","desc":"這座舊山線小站最早叫大安溪信號場，只處理列車避讓與交會。後來升格為停車場，歷經大安驛等名稱，才有了今日熟悉的泰安站名。","area":"后里區・臺中市","ph":"文"},{"id":3384,"name":"臺鐵舊山線-大安溪鐵橋","lat":24.33055,"lng":120.763911,"cat":"history","tag":"古蹟","desc":"大安溪上的舊鐵橋跨在苗栗與臺中交界，北端緊鄰三義舊山線第七號隧道。日治時期建成的橋身長逾六百公尺，連續花樑展現早期鐵道工程的節奏。","area":"后里區・臺中市","ph":"文"},{"id":3385,"name":"舊社里彩繪村","lat":24.29475,"lng":120.70098,"cat":"other","desc":"以天靈宮為中心向后里舊社里的巷弄走去，可以陸續找到分散的壁畫。二十幅作品由曾進成設計創作，讓找畫成了認識社區角落的一種方式。","area":"后里區・臺中市","ph":"觀"},{"id":3386,"name":"Lokah勇士營地","lat":24.25473,"lng":121.2454,"cat":"scenic","desc":"和平區山間的勇士營地，和希利克步道、攬勝樓相連。這裡位在兩條山區公路交會處的上方，是步道沿線的一處營地。","area":"和平區・臺中市","ph":"觀"},{"id":3387,"name":"Mqoyat日出幸福-櫻緣丘","lat":24.25595,"lng":121.25889,"cat":"other","desc":"梨山這片坡地整建後，設有觀景平臺、櫻花步道與愛情主題的藝術造景。站在平臺望向群山，沿步道則能近看櫻花與山景相會。","area":"和平區・臺中市","ph":"觀"},{"id":3388,"name":"八仙山自然教育中心","lat":24.199053,"lng":121.002284,"cat":"scenic","desc":"谷關附近的八仙山曾是臺灣三大林場之一，今日在森林遊樂區內設有自然教育中心。走進山林，可從昔日林業的足跡認識這裡多樣的森林生態。","area":"和平區・臺中市","ph":"觀"},{"id":3389,"name":"千櫻園","lat":24.24983,"lng":121.24475,"cat":"scenic","desc":"福壽山農場的高地上，千櫻園種了約六千株不同品種的櫻花。從緋寒櫻、昭和櫻到大島櫻、鬱金櫻，各有花期，春天的山坡也陸續換色。","area":"和平區・臺中市","ph":"觀"},{"id":3390,"name":"大甲溪發電廠生態園區(馬鞍壩生態園區)","lat":24.18588,"lng":120.92153,"cat":"culture","desc":"馬鞍壩的園區把水力發電設施和生態廊道連在一起，魚道可觀察魚兒逆流而上。周邊還有鳥、蝶、獼猴與山羌等動物棲息。","area":"和平區・臺中市","ph":"觀"},{"id":3391,"name":"天池","lat":24.22047,"lng":121.23761,"cat":"scenic","desc":"福壽山農場最高處的池塘，九二一地震後泉脈改變，現在主要靠雨水積蓄。池畔種著檜、松、杉等高樹，晴朗無風時，樹影落進鏡子般的水面。","area":"和平區・臺中市","ph":"觀"},{"id":3392,"name":"思源埡口","lat":24.39116,"lng":121.35272,"cat":"scenic","desc":"臺中與宜蘭交界的山口，是蘭陽溪與大甲溪等溪流的分水嶺。山嶺兩邊的氣候也不一樣，造就多樣的植物與地景，是觀察高山生態的地方。","area":"和平區・臺中市","ph":"觀"},{"id":3393,"name":"思源埡口","lat":24.39692,"lng":121.35693,"cat":"scenic","desc":"這處海拔近兩千公尺的山口，分隔大甲溪與蘭陽溪兩大水系。山林常被雲霧籠罩，冬日有機會遇見雪景，亦曾是泰雅族遷徙交流經過的地方。","area":"和平區・臺中市","ph":"觀"},{"id":3394,"name":"捎來吊橋","lat":24.20419,"lng":121.00623,"cat":"scenic","desc":"谷關的吊橋跨越大甲溪，名稱來自當地泰雅族頭目「捎來」。部落與地名都沿用了頭目之名，走過橋上也走進一段沿溪定居的歷史。","area":"和平區・臺中市","ph":"觀"},{"id":3395,"name":"攬勝樓","lat":24.25673,"lng":121.24524,"cat":"history","desc":"在梨山高處登樓遠望，可以一眼看開整片山景，「攬勝」便由此得名。午後雲霧在山間來去，同樣的視野也會隨著雲層起落改變。","area":"和平區・臺中市","ph":"觀"},{"id":3396,"name":"新佳陽黑森林","lat":24.23783,"lng":121.22525,"cat":"scenic","desc":"新佳陽部落上方的森林原是泰雅族獵場，茂密的巨木連白天都遮住日光，因此得名黑森林。昔日狩獵小徑化為步道，穿過高海拔針葉林。","area":"和平區・臺中市","ph":"觀"},{"id":3397,"name":"松茂清泉橋","lat":24.31561,"lng":121.29588,"cat":"history","tag":"歷史建築","desc":"這座鋼橋的組合柱與鉚釘，保留早期桁架橋的施工痕跡。細看橋桁一側的結構節點，還能找到以圓鋼棒構成的滾動構件，是少見的橋梁細節。","area":"和平區・臺中市","ph":"文"},{"id":3398,"name":"松鶴部落-和平區運動公園及生態池","lat":24.18094,"lng":120.98338,"cat":"nature","desc":"谷關松鶴部落旁的運動公園，將運動場地和生態池放進依山傍水的環境。來此活動身體，視線也能從場地延伸到周圍的山景與水邊。","area":"和平區・臺中市","ph":"觀"},{"id":3399,"name":"桃山瀑布","lat":24.41411,"lng":121.30259,"cat":"scenic","desc":"武陵桃山步道終點的瀑布又名煙聲，水流從約八十公尺高處落下，雨後水聲尤其響亮。站在觀景臺前，可在山壁上尋找逐漸斑駁的「煙聲」二字。","area":"和平區・臺中市","ph":"觀"},{"id":3400,"name":"梨山文物陳列館","lat":24.25248,"lng":121.25636,"cat":"culture","desc":"館內陳列泰雅族文物，也記錄中部橫貫公路的開發過程。從梨山的自然生態、部落生活到開路歷史，這座山裡的陳列館把幾條線索放在一起。","area":"和平區・臺中市","ph":"觀"},{"id":3401,"name":"梨山耶穌堂","lat":24.25671,"lng":121.26008,"cat":"worship","desc":"梨山制高點上矗立著一座哥德式教堂，所在位置海拔逾兩千公尺。它在一九六九年落成，從教堂所在的高處可以敞望山谷。","area":"和平區・臺中市","ph":"觀"},{"id":3402,"name":"梨山耶穌堂","lat":24.320726,"lng":121.308408,"cat":"worship","tag":"歷史建築","desc":"這座山上的教堂由蔣中正、宋美齡主導興建，原供兩人訪視梨山時禮拜。王玉堂建築師負責設計，土地和建物原屬宋美齡發起的中華婦女祈禱會。","area":"和平區・臺中市","ph":"文"},{"id":3403,"name":"梨山觀景臺","lat":24.25504,"lng":121.25151,"cat":"other","desc":"梨山賓館對面的小平臺，位在梨山最熱鬧的地段。平臺本身不大，從這裡向外看，山區開闊的景色卻能一下子展現在眼前。","area":"和平區・臺中市","ph":"觀"},{"id":3404,"name":"梨山賓館","lat":24.25429,"lng":121.25158,"cat":"culture","desc":"梨山早期興建的旅館，以古色古香的外觀成為中橫地標。賓館後方有生態步道，沿石階上行可看林木、聽鳥聲，也能遠眺雪山一帶群峰。","area":"和平區・臺中市","ph":"觀"},{"id":3405,"name":"楓之谷-1956秘密花園","lat":24.25445,"lng":121.25275,"cat":"nature","desc":"梨山賓館旁的祕密花園，名字中的數字指的是海拔一千九百五十六公尺。園內栽種不同品種的楓樹，鄰近還有梨山觀景臺與希利克步道。","area":"和平區・臺中市","ph":"觀"},{"id":3406,"name":"白冷圳入水口","lat":24.182766,"lng":120.921076,"cat":"history","tag":"歷史建築","desc":"白冷圳從大甲溪左岸的白冷引水，沿山腰將灌溉水送往新社。這項日治時期的工程，原是為了解決大南庄蔗苗養成所培育甘蔗的用水需求。","area":"和平區・臺中市","ph":"文"},{"id":3407,"name":"谷關遊客中心暨入關博物館","lat":24.20332,"lng":121.00678,"cat":"culture","desc":"谷關遊客中心改成微型博物館，以中橫公路與海拔變化安排展覽。從低處逐步往高山看，沿線的歷史、地理與生態便串在同一條路上。","area":"和平區・臺中市","ph":"觀"},{"id":3408,"name":"外埔忘憂谷","lat":24.30854,"lng":120.64739,"cat":"scenic","desc":"外埔這處山谷有個讓人好記的名字，叫作「忘憂谷」。這裡的風景裡有田間的稻穗，也有和稻穗相伴的雛菊。","area":"外埔區・臺中市","ph":"觀"},{"id":3409,"name":"臺中市立圖書館外埔分館","lat":24.33307,"lng":120.65218,"cat":"culture","desc":"外埔人把這棟白色圖書館稱作「小白宮」，錯落的垂直立面像書架上排開的書。大片玻璃把田野綠色與遠處火炎山的山景引進閱讀空間。","area":"外埔區・臺中市","ph":"觀"},{"id":3410,"name":"南埔鷺鷥林","lat":24.34933,"lng":120.56511,"cat":"scenic","desc":"南埔堤岸旁的樹林是觀鳥的地方，成群的鷺鷥與夜鷺會在這裡活動。沿岸留心樹間的鳥聲，也有機會看見牠們飛過林梢。","area":"大安區・臺中市","ph":"觀"},{"id":3411,"name":"大安水蓑衣生態教育園區","lat":24.35289,"lng":120.56945,"cat":"culture","desc":"塭寮溪南岸的一處水塘，專為復育臺灣特有的大安水蓑衣而設。這種水生草本開紫色筒狀花，直立的莖有四個稜角，節上還長著細毛。","area":"大安區・臺中市","ph":"觀"},{"id":3412,"name":"大安港媽祖文化園區","lat":24.38113,"lng":120.58721,"cat":"worship","area":"大安區・臺中市","ph":"觀"},{"id":3413,"name":"海墘老街","lat":24.38028,"lng":120.58585,"cat":"structure","desc":"海墘是大安海岸的老聚落，清康熙年間就已有開墾記錄。除了聚落延續至今的老街，大安海岸一帶還可見紅樹林與防風林。","area":"大安區・臺中市","ph":"觀"},{"id":3414,"name":"龜殼生態公園","lat":24.37134,"lng":120.58406,"cat":"nature","area":"大安區・臺中市","ph":"觀"},{"id":3415,"name":"大呷麵本家故事館","lat":24.33536,"lng":120.61323,"cat":"culture","desc":"這座故事館以麵條為主題，品牌談起製麵時特別重視原料選擇。依照業者的說法，自家的麵條採天然原料製作，沒有添加人工香料或色素。","area":"大甲區・臺中市","ph":"觀"},{"id":3416,"name":"大甲三寶文化館ˍ裕珍馨光明旗艦店","lat":24.34408,"lng":120.62322,"cat":"culture","desc":"酥餅原是大甲的訂婚喜餅，裕珍馨改用奶油取代豬油，做出奶油酥餅。進香客口耳相傳的這味點心，後與大甲媽祖、大甲帽蓆並稱三寶。","area":"大甲區・臺中市","ph":"觀"},{"id":3417,"name":"大甲文昌祠","lat":24.347759,"lng":120.622801,"cat":"worship","tag":"古蹟","desc":"清代大甲鄉紳出資興建義塾，將教室設在正殿兩側的廂房，殿中奉祀文昌帝君。日治時期這裡也曾作為公學校，保留地方辦學的歷史。","area":"大甲區・臺中市","ph":"文"},{"id":3418,"name":"大甲鎮瀾宮","lat":24.34523,"lng":120.62357,"cat":"worship","desc":"大甲人信奉媽祖的這座老廟，因農曆三月的媽祖遶境而聞名。廟內有紫羅蘭翡翠媽祖，地下樓的媽祖文化館另藏金色的黃金媽祖。","area":"大甲區・臺中市","ph":"觀"},{"id":3419,"name":"林氏貞孝坊","lat":24.344353,"lng":120.621816,"cat":"history","tag":"古蹟","desc":"清代的這座牌坊，源於朝廷對大甲林春娘的旌表。她自幼進入余家，未婚夫離世後仍奉養婆婆，後來又與媳婦一同養育年幼的孫子。","area":"大甲區・臺中市","ph":"文"},{"id":3420,"name":"永信醫藥文物館","lat":24.36073,"lng":120.64817,"cat":"culture","desc":"館內將製藥流程及設備搬進展示空間，讓人認識藥物從生產到使用的過程。用藥安全則透過互動遊戲與情境模擬呈現，也是創辦人李天德關心的主題。","area":"大甲區・臺中市","ph":"觀"},{"id":3421,"name":"縱貫鐵路(海線)─日南車站","lat":24.378057,"lng":120.654099,"cat":"history","tag":"古蹟","desc":"大安溪北岸的木造小站，沿用平埔族道卡斯族日南社的名字。月臺側屋頂高處嵌著醒目的牛眼窗，簷廊的分叉木柱也是海線車站的特色。","area":"大甲區・臺中市","ph":"文"},{"id":3422,"name":"臺中市大甲區中正紀念館","lat":24.33991,"lng":120.6262,"cat":"culture","desc":"何永捐建的這座紀念館，讓大甲有了第一個地方表演場館。戲劇、音樂、演講與各類展覽陸續在此登場，也陪伴許多大甲人長大。","area":"大甲區・臺中市","ph":"觀"},{"id":3423,"name":"金華山媽祖文物館","lat":24.34407,"lng":120.62077,"cat":"worship","desc":"這間文物館分享董振雄多年研究媽祖信仰的私人收藏。他長期往返兩岸尋訪，只要遇到與媽祖有關的史料和器物便加以保存，逐漸累積成館藏。","area":"大甲區・臺中市","ph":"觀"},{"id":3424,"name":"鎮瀾文化大樓","lat":24.35397,"lng":120.62116,"cat":"other","desc":"鎮瀾宮為推展媽祖文化，在和平營盤口段興建這座文化大樓。除了宗教信仰，它的設立也與民俗才藝活動、地方藝文的推廣有關。","area":"大甲區・臺中市","ph":"觀"},{"id":3425,"name":"大肚萬興宮","lat":24.15927,"lng":120.545,"cat":"worship","desc":"地方人口中的「頂街媽祖廟」，是大肚重要的信仰中心。這座老廟除了接待香客，也承載地方慶典，讓社區居民有共同聚會的場所。","area":"大肚區・臺中市","ph":"觀"},{"id":3426,"name":"大肚藍色公路","lat":24.15617,"lng":120.56829,"cat":"other","desc":"大肚山坡這一段原是單車騎士練習爬坡的路線，入夜後卻有另一番景色。路燈沿坡道亮起藍紫色冷光，從遠處看像兩道延伸的螢光帶。","area":"大肚區・臺中市","ph":"觀"},{"id":3427,"name":"磺溪書院","lat":24.150049,"lng":120.539338,"cat":"history","tag":"古蹟","desc":"大肚早年的西雝社曾設學田、籌建文昌祠，清末又在原址興建書院。坐北朝南的院落有七開間、兩進格局，記下地方仕紳辦學的歷史。","area":"大肚區・臺中市","ph":"文"},{"id":3428,"name":"縱貫鐵路(海線)─追分車站","lat":24.120584,"lng":120.570135,"cat":"history","tag":"古蹟","desc":"海線與山線交會的地方，日語稱為「追分」，車站也因此得名。這座位居海線南端的小站，在日治時期隨竹南至彰化的海線工程一同落成。","area":"大肚區・臺中市","ph":"文"},{"id":3429,"name":"DaliArt 藝術廣場","lat":24.08518,"lng":120.69623,"cat":"nature","desc":"臺中軟體園區裡的藝術廣場，規劃時就將文化創意和藝術列為核心。它讓大里的園區除了軟體產業，還有專門發展藝術文創的空間。","area":"大里區・臺中市","ph":"觀"},{"id":3430,"name":"大里杙保正集會所","lat":24.098131,"lng":120.677186,"cat":"culture","tag":"歷史建築","desc":"集會所原供日治時期的大里杙保正議事，戰後先後作為戶政與社區活動空間。四坡屋頂下的清水磚建築整修後，成了展出大里史料的文化館。","area":"大里區・臺中市","ph":"文"},{"id":3431,"name":"大里杙樹王公","lat":24.09857,"lng":120.66391,"cat":"other","desc":"樹王里一棵茄苳被地方居民奉為神樹，也稱「涼傘樹王公」。大里流傳的嘉慶君遊臺灣故事與它有關，讓一棵樹成為地方信仰的所在。","area":"大里區・臺中市","ph":"觀"},{"id":3432,"name":"大里老街","lat":24.09739,"lng":120.67733,"cat":"structure","desc":"清代烏溪流經大里，渡船頭聚集貨物與買賣人家，帶動沿岸街市興起。老街的身世與這段河運商貿的日子相連，也見證臺中盆地的開發。","area":"大里區・臺中市","ph":"觀"},{"id":3433,"name":"臺中市纖維工藝博物館","lat":24.10083,"lng":120.68315,"cat":"culture","desc":"臺中第一座市級公立博物館選擇纖維工藝作為主題，在大里落腳。這裡也是臺灣首座專門以纖維為核心的博物館，確立了鮮明的地方館舍特色。","area":"大里區・臺中市","ph":"觀"},{"id":3434,"name":"興大康橋","lat":24.11692,"lng":120.67421,"cat":"culture","desc":"中興大學後方的旱溪，因一項以英國康橋為構想的河川計畫，開闢為親水休閒空間。人們提到的「興大康橋」，指的就是這段校園旁的水岸。","area":"大里區・臺中市","ph":"觀"},{"id":3435,"name":"菩薩寺","lat":24.1069,"lng":120.67657,"cat":"worship","desc":"清水模和木頭是這座寺院的主要建築語彙，一冷一暖，與樹蔭、光影和流水相映。設計取意於晨昏與節氣的變化，讓人在建築裡也能感受自然。","area":"大里區・臺中市","ph":"觀"},{"id":3436,"name":"中科橫山公園","lat":24.21123,"lng":120.62589,"cat":"nature","desc":"原木棧道、石牆堡壘與開放式迴廊，構成橫山公園容易辨認的風景。古樸的石牆配上簡潔線條，廣大的綠地也保有多樣生態。","area":"大雅區・臺中市","ph":"觀"},{"id":3437,"name":"六寶公園","lat":24.2372,"lng":120.62602,"cat":"nature","desc":"這座約三千平方公尺的社區公園緊鄰潭雅神自行車道。除了居民平日使用，沿綠園道騎車經過的人，也可在這片綠地停下休息。","area":"大雅區・臺中市","ph":"觀"},{"id":3438,"name":"大雅中科公園","lat":24.22023,"lng":120.61839,"cat":"nature","desc":"潭雅神綠園道一路延伸到大雅，在這座公園畫下句點。除了是綠園道的終點，公園也是在地家庭一起休閒的地方。","area":"大雅區・臺中市","ph":"觀"},{"id":3439,"name":"大雅麥田","lat":24.23792,"lng":120.65277,"cat":"scenic","area":"大雅區・臺中市","ph":"觀"},{"id":3440,"name":"戰車公園","lat":24.23178,"lng":120.6247,"cat":"nature","desc":"潭雅神綠園道終點旁，三輛退役戰車停在大雅忠義里。這些戰車由國防部移交地方展示，也留下裝甲部隊曾長年駐守清泉崗的記憶。","area":"大雅區・臺中市","ph":"觀"},{"id":3441,"name":"清泉崗聖潔教會","lat":24.235297,"lng":120.621614,"cat":"worship","tag":"歷史建築","desc":"清泉崗的基督徒軍人最初在基地附近的防空洞聚集禱告。後來請宣教士衛平福協助籌募建堂經費，這段由官兵發起的聚會成為教會的起點。","area":"大雅區・臺中市","ph":"文"},{"id":3442,"name":"臺中市原住民族文化館","lat":24.23539,"lng":120.62205,"cat":"culture","desc":"這座文化館前身是臺中市原住民綜合服務中心，設於都會區。館舍以推廣中部原住民族文化為定位，也把友善與平權列為公共服務的方向。","area":"大雅區・臺中市","ph":"觀"},{"id":3443,"name":"臺中市立圖書館上楓分館","lat":24.23667,"lng":120.6661,"cat":"culture","desc":"上楓國小旁的紅磚圖書館，以環境教育為主題，外牆色調呼應麥田和楓葉。館外的生態草溝、原生植栽與室內動線相接，讓閱讀也能延伸到戶外。","area":"大雅區・臺中市","ph":"觀"},{"id":3444,"name":"趙家窯","lat":24.23245,"lng":120.64416,"cat":"culture","desc":"大雅麥鄉裡的陶窯，由出身工藝世家的趙家三兄弟推廣生活陶藝。從作品裡的生活美感，到拉坯時掌中的工夫，呈現一家人各自擅長的技藝。","area":"大雅區・臺中市","ph":"觀"},{"id":3445,"name":"921震災紀念公園","lat":24.11658,"lng":120.72383,"cat":"nature","desc":"太平位處車籠埔斷層，九二一地震後，地方在重建完成時闢建這座公園。草坪、溜冰場與兒童遊戲區讓人們在紀念震災之餘，也能回到日常生活。","area":"太平區・臺中市","ph":"觀"},{"id":3446,"name":"坪林森林公園","lat":24.14812,"lng":120.72996,"cat":"nature","desc":"太平的這座大型綠地，把森林休憩和生態滯洪放在同一個園區。園內保有一片原始森林，也設有生態滯洪池，共同構成城市裡的水綠空間。","area":"太平區・臺中市","ph":"觀"},{"id":3447,"name":"太平光興隆大橋","lat":24.11644,"lng":120.72566,"cat":"other","desc":"頭汴坑溪上的大橋，設計者將蝙蝠的姿態融入橋體。借「蝠」與「福」同音，把「福到太平」的祝願，放在兩岸居民日常經過的地方。","area":"太平區・臺中市","ph":"觀"},{"id":3448,"name":"太平會幕堂","lat":24.12835,"lng":120.71873,"cat":"worship","desc":"太平有座粉紅色的教堂，名字叫會幕堂。教堂以柔和的粉紅色調帶出浪漫的氣氛，是外觀最鮮明的特色。","area":"太平區・臺中市","ph":"觀"},{"id":3449,"name":"太平苗圃落羽松","lat":24.11878,"lng":120.80115,"cat":"scenic","desc":"東汴國小附近的小池塘，四周種著二十多棵落羽松。沿著池畔石步道繞行，秋冬時可以同時看見轉紅的樹冠，與整片落在水面上的倒影。","area":"太平區・臺中市","ph":"觀"},{"id":3450,"name":"屯區藝文中心","lat":24.15687,"lng":120.73501,"cat":"culture","desc":"這座藝文中心源於原臺中縣政府的旗艦計畫，設立時希望兼顧山、海、屯各區的文化發展。它在屯區扮演地方藝文活動據點的角色。","area":"太平區・臺中市","ph":"觀"},{"id":3451,"name":"磨仔墩故事島","lat":24.12101,"lng":120.75466,"cat":"other","desc":"金門出身的園主沿著頭汴坑河畔地形，營造一處有土窯、森林草坪與遊戲區的空間。牛軛湖、黑山羊區和林間座位，也各自找得到角落。","area":"太平區・臺中市","ph":"觀"},{"id":3452,"name":"馬卡龍公園","lat":24.14641,"lng":120.71274,"cat":"nature","desc":"太平這座共融公園用馬卡龍般的柔和色彩，將各種設施串在一起。它照顧到不同年齡的人，也讓帶著寵物出門的家庭有共同活動的空間。","area":"太平區・臺中市","ph":"觀"},{"id":3453,"name":"七分窯","lat":24.24148,"lng":120.78853,"cat":"culture","desc":"新社崑山村的陶窯由張笠夫、李春美夫婦經營，也作為臺灣陶瓷刻畫學會會址。除了水墨與陶刻創作，在這裡也能接觸捏陶和拉坯。","area":"新社區・臺中市","ph":"觀"},{"id":3454,"name":"大南劉家祖厝","lat":24.230195,"lng":120.79933,"cat":"history","tag":"歷史建築","desc":"地方人熟悉的劉五福公廳，正廳兩側共伸出五條護龍，形成多護龍合院。劉家早年經營糖廍，留下的製糖石臼仍記著新社蔗糖業的起點。","area":"新社區・臺中市","ph":"文"},{"id":3455,"name":"新社原蔗苗養成所及陳列館","lat":24.223099,"lng":120.803521,"cat":"culture","tag":"歷史建築","desc":"新社大南河階的蔗苗養成所，日治時期專門改良甘蔗品種與栽培方式。戰後改為蔗苗繁殖場，讓這片土地持續參與臺灣糖業的發展。","area":"新社區・臺中市","ph":"文"},{"id":3456,"name":"新社星願紫風車","lat":24.20408,"lng":120.79684,"cat":"other","desc":"新社商圈以一座紫色風車作為入口意象，色彩取自地方的代表色。取名「星願」，則是將新社希望傳達的幸福與夢想放進風車裡。","area":"新社區・臺中市","ph":"觀"},{"id":3457,"name":"殉職山岡先生之碑","lat":24.245057,"lng":120.803043,"cat":"history","tag":"歷史建築","desc":"碑上紀念的是來自日本愛媛縣的老師山岡榮，他曾在今日新社高中的前身任教。當年豪雨使食水嵙溪暴漲，地方為他奮身搶救學生的事蹟立碑。","area":"新社區・臺中市","ph":"文"},{"id":3458,"name":"白冷圳—抽藤坑倒虹吸管","lat":24.168083,"lng":120.829806,"cat":"history","tag":"歷史建築","desc":"白冷圳為新社臺地的蔗苗引水灌溉，沿途必須穿越大甲溪支流。橫跨抽藤坑的倒虹吸管，正是這條日治水路克服溪谷地形的一段。","area":"新社區・臺中市","ph":"文"},{"id":3459,"name":"白冷圳紀念公園","lat":24.16796,"lng":120.82948,"cat":"nature","desc":"新社河階適合培育甘蔗，缺水卻使蔗苗養成不易，於是工程人員遠赴白冷引大甲溪水。紀念公園所記下的，便是藉虹吸管跨越地形的灌溉工程。","area":"新社區・臺中市","ph":"觀"},{"id":3460,"name":"薰衣草森林 台中新社店","lat":24.12848,"lng":120.84135,"cat":"scenic","desc":"新社的山林園區以薰衣草為主角，王媽媽香草園裡還種著數十種香草。林間可留意五色鳥、啄木鳥等訪客，清澈溪水中也有苦花魚。","area":"新社區・臺中市","ph":"觀"},{"id":3461,"name":"月恆門","lat":24.22027,"lng":120.835244,"cat":"history","tag":"歷史建築","desc":"清代戴潮春事件波及東勢和興庄後，居民在庄內東西兩側築起防禦隘門。兩門分別題作「日昇」與「月恆」，今日留下的是西側的月恆門。","area":"東勢區・臺中市","ph":"文"},{"id":3462,"name":"月恆門","lat":24.25807,"lng":120.83197,"cat":"history","desc":"和興庄西側的老門前臨大甲溪，門上留有藍字對聯。聯中提到天干「癸」、「丁」所指的方位，也就寫出了這座門坐北朝南的方向。","area":"東勢區・臺中市","ph":"觀"},{"id":3463,"name":"東勢客家文化園區","lat":24.25765,"lng":120.83185,"cat":"culture","area":"東勢區・臺中市","ph":"觀"},{"id":3464,"name":"東勢林場","lat":24.28661,"lng":120.8688,"cat":"other","desc":"東勢山區這片占地二百餘公頃的林場，由彰化縣農會經營。林場以森林的多樣利用為出發點，逐步發展成以自然生態與休憩為主的園地。","area":"東勢區・臺中市","ph":"觀"},{"id":3465,"name":"東勢林業文化園區","lat":24.244092,"lng":120.833465,"cat":"culture","tag":"文化景觀","desc":"過去的大雪山林業公司在東勢建起大型製材廠，引進美式一貫作業。製材停下來之後，大製材廠、燃料倉和鍋爐間等空間成為園區的歷史主角。","area":"東勢區・臺中市","ph":"文"},{"id":3466,"name":"東勢林業文化園區","lat":24.244709,"lng":120.837585,"cat":"culture","desc":"為利用大雪山林區的木材，林業公司曾在東勢興建大製材廠。從機械伐木、卡車運材到進廠加工，這裡保存的是臺灣走向機械化林業的故事。","area":"東勢區・臺中市","ph":"觀"},{"id":3467,"name":"東勢河濱公園","lat":24.25695,"lng":120.82394,"cat":"nature","desc":"東勢大橋下沿大甲溪築起的河濱公園，地勢寬平，有球場與健身空間。沿堤散步可留意梨子、柿子造型的地標，把東勢果鄉的特色帶到河岸。","area":"東勢區・臺中市","ph":"觀"},{"id":3468,"name":"東勢溫泉","lat":24.2853,"lng":120.86771,"cat":"other","desc":"東勢林場內經鑽探開發的溫泉，屬於天然碳酸氫鈉泉。浸泡時皮膚上會出現細小氣泡，地方也因泡後感觸滑潤，俗稱它為「美人湯」。","area":"東勢區・臺中市","ph":"觀"},{"id":3469,"name":"獨角仙生態公園","lat":24.25572,"lng":120.83241,"cat":"nature","area":"東勢區・臺中市","ph":"觀"},{"id":3470,"name":"臺中客家樂活園區","lat":24.24736,"lng":120.83561,"cat":"culture","desc":"東勢高工舊校區的活動中心、禮堂與教學大樓，整建為客家樂活園區。原本的校園空間分別成了運動館、學習館，周邊還留有環山步道與運動場。","area":"東勢區・臺中市","ph":"觀"},{"id":3471,"name":"金門橋","lat":24.220211,"lng":120.83517,"cat":"history","tag":"歷史建築","desc":"和興庄月恆門前的石橋跨過排水圳，橋邊曾是庄民洗衣的地方。戰時水泥稀少，村民改以石塊堆砌，用糯米、石灰和黑糖等材料膠結。","area":"東勢區・臺中市","ph":"文"},{"id":3472,"name":"Mitsui Shopping Park LaLaport 台中","lat":24.13488,"lng":120.69282,"cat":"other","desc":"臺中車站附近這座購物中心，坐落在臺中市東區。光是各家店舖合起來的面積，就有六萬八千平方公尺。","area":"東區・臺中市","ph":"觀"},{"id":3473,"name":"台中南天宮-關帝聖君","lat":24.14292,"lng":120.69537,"cat":"worship","desc":"這座臺中關帝廟先建正殿，再完成前殿，後來又增建高聳的關聖帝君神像。神像從遠處便能望見，也成了信眾辨認南天宮的標誌。","area":"東區・臺中市","ph":"觀"},{"id":3474,"name":"大魯閣新時代","lat":24.13577,"lng":120.68775,"cat":"other","desc":"臺中的新時代購物中心改由大魯閣經營後，將運動娛樂納入商場主題。從親子休閒到餐飲購物，各種活動在同一處共享空間。","area":"東區・臺中市","ph":"觀"},{"id":3475,"name":"富興工廠1962","lat":24.13512,"lng":120.68375,"cat":"culture","desc":"臺中舊城裡的盛香堂化妝品工廠，原有約七百坪廠房。老工廠改建後迎來餐廳、咖啡館與小酒吧，製造化妝品的空間轉為文創聚落。","area":"東區・臺中市","ph":"觀"},{"id":3476,"name":"帝國製糖廠臺中營業所暨附屬設施","lat":24.13785,"lng":120.692145,"cat":"history","tag":"歷史建築","desc":"這處建築原屬帝國製糖株式會社的臺中工場，留存下來的是日治時期臺中本社的辦公廳舍。戰後它繼續作為臺糖臺中辦公處，串起兩代糖業機構。","area":"東區・臺中市","ph":"文"},{"id":3477,"name":"新天地西洋博物館","lat":24.14189,"lng":120.70151,"cat":"culture","desc":"館內展示上千件私人收藏，以西洋文化為共同主題。藏品的來源包括蘇富比、佳士得拍賣與私人收藏，讓不同來歷的物件在同一館內相遇。","area":"東區・臺中市","ph":"觀"},{"id":3478,"name":"東光園道","lat":24.13681,"lng":120.69671,"cat":"other","desc":"園道上的自行車道長約三點四公里，一路串起好幾個主題廣場。十二生肖、太極與象棋等題材依序成為沿途看點，也提供散步兜風的空間。","area":"東區・臺中市","ph":"觀"},{"id":3479,"name":"東峰公園(二二八紀念公園)","lat":24.12639,"lng":120.68864,"cat":"nature","desc":"臺中東區興大園道旁，有這片也稱二二八紀念公園的綠地。公園在一九八四年建成，面積約四千二百坪，位置就在七中路一帶。","area":"東區・臺中市","ph":"觀"},{"id":3480,"name":"泉源公園","lat":24.13644,"lng":120.6942,"cat":"nature","desc":"除了居民平日使用的公園設施，這裡也為寵物留下約四百五十坪的空間。草地將大型犬與小型犬活動範圍分開，讓狗狗各自在寬闊草皮上奔跑。","area":"東區・臺中市","ph":"觀"},{"id":3481,"name":"瑞成書局","lat":24.1435,"lng":120.68613,"cat":"other","area":"東區・臺中市","ph":"觀"},{"id":3482,"name":"秀泰生活台中站前店","lat":24.14059,"lng":120.68977,"cat":"other","desc":"站前商場以「藝庶」呼應藝術與大眾，把裝置作品放進購物休閒的空間。從室內裝潢到戶外角落都可遇見趣味創作，也有藝文展演參與其中。","area":"東區・臺中市","ph":"觀"},{"id":3483,"name":"臺中市第四市場","lat":24.140632,"lng":120.693503,"cat":"history","tag":"歷史建築","desc":"日治時期的干城町消費市場，戰後改稱第四市場。原本的木造建築老舊後重建，規劃了攤位與兩層樓連棟店宅，留下街區採買與居住相連的樣貌。","area":"東區・臺中市","ph":"文"},{"id":3484,"name":"臺中教師會館(現臺中高農實習旅館）","lat":24.127013,"lng":120.684502,"cat":"history","tag":"歷史建築","desc":"建築師修澤蘭以中國宮殿形式設計這組教師會館，將館舍分成三棟。原有的弘道樓供集會研究，養正樓規劃餐飲住宿，各棟分擔不同用途。","area":"東區・臺中市","ph":"文"},{"id":3485,"name":"臺中樂成宮","lat":24.140686,"lng":120.697989,"cat":"worship","tag":"古蹟","desc":"這座廟因鄰近旱溪而俗稱旱溪媽祖廟。相傳清代林氏先民自福建湄洲帶來媽祖香火，起初設屋奉祀，後來信徒增多才在現址興建廟宇。","area":"東區・臺中市","ph":"文"},{"id":3486,"name":"賴高山藝術紀念館","lat":24.12689,"lng":120.6893,"cat":"culture","desc":"賴高山學習漆工藝「蓬萊塗」，將臺灣意象融入雕刻創作。後來他與兒子把自宅兼漆工廠改為博物館，透過作品與生平介紹呈現臺中的樹漆文化。","area":"東區・臺中市","ph":"觀"},{"id":3487,"name":"MITSUI OUTLET PARK 台中港","lat":24.25887,"lng":120.51842,"cat":"other","desc":"梧棲的海港型購物商城把購物、餐飲與海洋旅遊放在一起。除了各國品牌店鋪，港區休閒也是商場規劃的一部分，呼應它所在的海線位置。","area":"梧棲區・臺中市","ph":"觀"},{"id":3488,"name":"大庄浩天宮","lat":24.24608,"lng":120.53975,"cat":"worship","desc":"大庄的開拓者先結成媽祖會，後來合資搭起茅草小廟，當地人稱「媽祖厝」。清代遷到大庄現址後，這段共同建廟的歷史成為浩天宮的根源。","area":"梧棲區・臺中市","ph":"觀"},{"id":3489,"name":"梧棲朝元宮","lat":24.25645,"lng":120.52975,"cat":"worship","desc":"梧棲路上的老廟是清代移建而來，供奉的「開基媽」是一尊木雕媽祖。相傳神像由鹽務司爺從湄洲天后宮迎來，見證地方海港的信仰淵源。","area":"梧棲區・臺中市","ph":"觀"},{"id":3490,"name":"梧棲真武宮","lat":24.256693,"lng":120.529019,"cat":"worship","tag":"古蹟","desc":"清代梧棲港前的六名水郊商人集資建廟，奉祀真武大帝。廟裡「威昭瀛嶼」一匾，是彰化官員於戴潮春事件後敬獻，留下港邊的歷史記錄。","area":"梧棲區・臺中市","ph":"文"},{"id":3491,"name":"梧棲老街","lat":24.25776,"lng":120.52993,"cat":"structure","desc":"梧棲街市最初由頂橫街發展，沿街可見巴洛克風格建築。眾多廟宇之中，真武宮與朝元宮尤其具有代表性，也記錄港街居民所寄託的信仰。","area":"梧棲區・臺中市","ph":"觀"},{"id":3492,"name":"梧樂新創園區","lat":24.25713,"lng":120.55186,"cat":"culture","area":"梧棲區・臺中市","ph":"觀"},{"id":3493,"name":"頂魚寮公園","lat":24.26558,"lng":120.53619,"cat":"nature","desc":"海線這座親子公園，將漁船、鯨魚與鮮豔色彩放進遊戲設施。從鯨魚滑梯、七彩座椅到故事牆與花園迷宮，各處都有孩子容易辨認的造型。","area":"梧棲區・臺中市","ph":"觀"},{"id":3494,"name":"南勢溪湧泉","lat":24.21391,"lng":120.55824,"cat":"other","desc":"沙鹿人把這條湧泉溪稱作母親之河，溪水長久供應地方生活所需。居民曾在水邊洗衣、洗菜，其中沿溪洗衣的日常逐漸成為地方文化。","area":"沙鹿區・臺中市","ph":"觀"},{"id":3495,"name":"台中港區運動公園","lat":24.20565,"lng":120.57665,"cat":"nature","desc":"這裡提供臺中海線居民多種運動空間，室內設置羽球場與韻律教室。走到戶外還有競速滑輪溜冰場，讓不同型態的運動能在同一公園進行。","area":"沙鹿區・臺中市","ph":"觀"},{"id":3496,"name":"月老廟夜景","lat":24.23011,"lng":120.60109,"cat":"worship","desc":"月老廟旁的小路往山下望，是地方所說的月老廟夜景。附近容易辨認的地標就是這座廟，賞景地點也就跟著借用了廟名。","area":"沙鹿區・臺中市","ph":"觀"},{"id":3497,"name":"沙鹿之翼","lat":24.23812,"lng":120.56899,"cat":"nature","desc":"臺灣大道與三民路交會處原本車流繁忙，地方為附近學童興建了這座人行路橋。橋在二〇〇七年完工，成為竹林國小與沙鹿高工學生通學路上的一部分。","area":"沙鹿區・臺中市","ph":"觀"},{"id":3498,"name":"臺中國際機場","lat":24.25578,"lng":120.60039,"cat":"other","desc":"臺中的民航業務原在水湳機場辦理，後來移至清泉崗。新址初期以國內航線為主，隨地方與觀光需求增加，才逐步發展區域國際航線。","area":"沙鹿區・臺中市","ph":"觀"},{"id":3499,"name":"臺中市立圖書館沙鹿深波分館","lat":24.23328,"lng":120.56379,"cat":"culture","desc":"沙鹿的鎮立圖書館最初設在鎮公所四樓，館藏逐步累積後，需要更寬敞的空間。鎮公所提供土地、在地企業共同參與，成了興建新館的起點。","area":"沙鹿區・臺中市","ph":"觀"},{"id":3500,"name":"台中海洋館","lat":24.29675,"lng":120.51964,"cat":"culture","desc":"清水的海洋館在戶外廣場設置了兩件公共藝術。作品分別名為「悠游水漾」與「到海邊坐坐」，從進館前的空間便呼應了海洋主題。","area":"清水區・臺中市","ph":"觀"},{"id":3501,"name":"梧棲海洋驛站","lat":24.29308,"lng":120.51714,"cat":"other","desc":"海巡署將原有的駐用廳舍重新整理，在梧棲設置海洋休憩站。它是「向海致敬」政策下規劃的海洋驛站之一，舊空間也因此有了新的公共用途。","area":"清水區・臺中市","ph":"觀"},{"id":3502,"name":"梧棲觀光漁港","lat":24.29303,"lng":120.52077,"cat":"scenic","desc":"清水海邊這處漁港，從小漁村發展為兼具生產與觀光的港區。沿岸設有魚貨直銷、餐飲與休閒空間，漁業工作和遊港人潮在此相遇。","area":"清水區・臺中市","ph":"觀"},{"id":3503,"name":"海灣繪本館","lat":24.26813,"lng":120.55765,"cat":"culture","desc":"清水眷村文化園區旁有一座從老眷舍改成的繪本館。原來住家的空間延續了眷村的懷舊氣息，讓閱讀多了一層與周邊老聚落的連結。","area":"清水區・臺中市","ph":"觀"},{"id":3504,"name":"清水區農村文物館","lat":24.26816,"lng":120.55972,"cat":"culture","desc":"籌設文物館時，清水各里和農事小組一起徵集舊物，農友也紛紛響應。館內收藏的傳統農具，保存了昔日務農人家實際使用器物的生活記憶。","area":"清水區・臺中市","ph":"觀"},{"id":3505,"name":"清水大楊原美軍油庫設施","lat":24.291799,"lng":120.609798,"cat":"history","tag":"歷史建築","desc":"清水大楊一帶的儲油設施，與美軍越戰期間使用清泉崗作為後勤基地有關。當時陸續興建了七座儲油槽，為大肚山留下戰後軍事活動的遺跡。","area":"清水區・臺中市","ph":"文"},{"id":3506,"name":"清水大楊油庫","lat":24.29557,"lng":120.61177,"cat":"other","desc":"大肚山臺地上這群龐大的儲油設施，曾為清泉崗基地提供後勤支援。隨著越戰結束而逐漸淡出軍事用途，留存的建築記錄了臺美關係的一段歷史。","area":"清水區・臺中市","ph":"觀"},{"id":3507,"name":"清水李氏洋宅","lat":24.270994,"lng":120.578164,"cat":"history","tag":"古蹟","desc":"這座兩層洋樓入口上方的窗櫺，留著代表屋主的「李」字。立面以淺褐色洗石子為主，門窗邊用墨綠色收線，再配上正面與側面的圓柱。","area":"清水區・臺中市","ph":"文"},{"id":3508,"name":"清水社口楊宅","lat":24.271108,"lng":120.569134,"cat":"history","tag":"古蹟","desc":"社口楊家來自福建同安，族人在清水從事墾殖與商業。老宅三合院前築有內外兩重土埆院牆，從寬廣外埕走向內埕，院落一層比一層深。","area":"清水區・臺中市","ph":"文"},{"id":3509,"name":"清水老街","lat":24.26784,"lng":120.57792,"cat":"structure","area":"清水區・臺中市","ph":"觀"},{"id":3510,"name":"清水趙家古厝","lat":24.28563,"lng":120.58772,"cat":"other","desc":"名為「天水堂」的趙家古厝，有兩進六護龍，背靠鰲峰山，旁有水道環繞。老宅四周的竹圍與前方荷花池，讓合院的輪廓藏在綠意之中。","area":"清水區・臺中市","ph":"觀"},{"id":3511,"name":"清水震災紀念碑","lat":24.268233,"lng":120.57982,"cat":"history","tag":"歷史建築","desc":"一九三五年中部大地震重創海線，清水街也有眾多居民遇難。地方留下紀念碑，碑文記錄傷亡，讓後人仍能認識這場改變聚落面貌的震災。","area":"清水區・臺中市","ph":"文"},{"id":3512,"name":"紫雲巖","lat":24.27112,"lng":120.57929,"cat":"worship","desc":"清水人也稱這座奉祀觀世音的寺廟為觀音亭，歷史可追溯至清代。正殿採兩層樓形式，左右各立鐘樓，金黃色屋瓦在殿宇上方相連。","area":"清水區・臺中市","ph":"觀"},{"id":3513,"name":"縱貫鐵路(海線)清水車站","lat":24.263623,"lng":120.569174,"cat":"history","tag":"歷史建築","desc":"海線開通初期的清水站原是木造，後在中部大地震中毀損。隔年改以鋼筋混凝土重建，如今所見的站房，記錄了震災前後鐵道建築的轉變。","area":"清水區・臺中市","ph":"文"},{"id":3514,"name":"臺中市港區藝術中心","lat":24.26946,"lng":120.55766,"cat":"culture","desc":"清水這座藝術中心順著人工矮丘與平地配置，背山面海，館舍採閩南式外觀。展覽廳、演藝廳與戶外劇場分布其間，讓觀展與看戲都各有空間。","area":"清水區・臺中市","ph":"觀"},{"id":3515,"name":"臺中市美術家資料館","lat":24.26957,"lng":120.55769,"cat":"culture","desc":"港區藝術中心展覽廳樓上，收藏著臺灣前輩與當代藝術家的作品圖檔、影音和文獻。這座資料館以記錄大臺中美術發展為目標，讓創作留下可追索的線索。","area":"清水區・臺中市","ph":"觀"},{"id":3516,"name":"鰲峰山運動公園","lat":24.27319,"lng":120.58427,"cat":"nature","area":"清水區・臺中市","ph":"觀"},{"id":3517,"name":"寶熊漁樂碼頭","lat":24.22024,"lng":120.70609,"cat":"other","desc":"釣具廠商寶熊創辦的主題園區，以釣魚休閒作為認識水上活動的起點。園內將各式釣具介紹與釣魚知識放在一起，從工具也能看懂這項休閒的門道。","area":"潭子區・臺中市","ph":"觀"},{"id":3518,"name":"摘星山莊","lat":24.224439,"lng":120.697144,"cat":"culture","tag":"古蹟","desc":"清代昭勇將軍林其中在潭子興建這座山莊，工程歷經同治與光緒兩朝。大宅依傳統合院布局，由兩進廳堂搭配多道護龍，規模開展。","area":"潭子區・臺中市","ph":"文"},{"id":3519,"name":"林九牧公祠","lat":24.223369,"lng":120.714698,"cat":"worship","tag":"古蹟","desc":"潭子、豐原與神岡的林氏後人共用這座祭祖祠堂，堂內奉祀林祿公、林其中及林振芳等祖先。傳統合院的配置也保有客家建築特色。","area":"潭子區・臺中市","ph":"文"},{"id":3520,"name":"潭子落羽松祕境","lat":24.21427,"lng":120.738,"cat":"scenic","area":"潭子區・臺中市","ph":"觀"},{"id":3521,"name":"潭子觀光蘭園","lat":24.20975,"lng":120.68833,"cat":"other","desc":"潭子這座觀賞蘭園以培育蝴蝶蘭為專長，背後有數十年養蘭經驗。園方也從事蝴蝶蘭出口，讓觀賞花卉的空間與本地蘭花產業相連。","area":"潭子區・臺中市","ph":"觀"},{"id":3522,"name":"潭子運動公園","lat":24.2096,"lng":120.70122,"cat":"nature","desc":"勝利路上的運動公園腹地寬廣，球場從籃球、羽球、網球到壘球、槌球都有。除了正式球類場地，園內也有溜冰場、兒童遊戲區和健康步道。","area":"潭子區・臺中市","ph":"觀"},{"id":3523,"name":"潭水亭","lat":24.21025,"lng":120.70768,"cat":"other","desc":"潭陽里這處信仰中心在潭子已延續兩百多年。對地方居民而言，潭水亭也是一座把聚落日常與長久信仰聯繫在一起的老廟。","area":"潭子區・臺中市","ph":"觀"},{"id":3524,"name":"潭雅神綠園道","lat":24.2328,"lng":120.69444,"cat":"other","desc":"原來的神岡線鐵路改成自行車道後，沿線串起潭子、豐原、神岡與大雅。從潭心鐵馬空橋延伸到清泉崗一帶，整條綠園道長約十三點六公里。","area":"潭子區・臺中市","ph":"觀"},{"id":3525,"name":"成功車站","lat":24.11422,"lng":120.59016,"cat":"other","area":"烏日區・臺中市","ph":"觀"},{"id":3526,"name":"烏日溫泉","lat":24.10809,"lng":120.62046,"cat":"other","desc":"大肚山高處的天然泉水屬弱鹼性碳酸氫鈉泉，水色透明，也沒有明顯氣味。山上的視野從臺中市區延伸到海線，入夜還能遠望燈火。","area":"烏日區・臺中市","ph":"觀"},{"id":3527,"name":"烏日警察官吏派出所","lat":24.108442,"lng":120.603103,"cat":"history","tag":"歷史建築","desc":"這棟日治時期的建築，同時是烏日庄警察的辦公廳舍與宿舍。當年轄區包括烏日、朥胥與學田，戰後則延續作為地方派出所。","area":"烏日區・臺中市","ph":"文"},{"id":3528,"name":"聚奎居","lat":24.119181,"lng":120.606646,"cat":"history","tag":"古蹟","desc":"烏日商人陳紹宗在日治時期興建的宅第，以傳統合院承接西式洋樓的外貌。老屋坐西北朝東南，從院落格局與外牆便能分辨兩種建築語彙。","area":"烏日區・臺中市","ph":"文"},{"id":3529,"name":"高鐵臺中站","lat":24.11169,"lng":120.61608,"cat":"other","desc":"臺灣高鐵在臺中設的車站位於烏日，因而常被稱為「高鐵烏日站」。正式站名與地方慣用的名稱，分別指出城市與車站實際所在的地區。","area":"烏日區・臺中市","ph":"觀"},{"id":3530,"name":"麻園頭溪溪濱公園","lat":24.10858,"lng":120.63059,"cat":"nature","desc":"烏日溪畔的公園用環狀自行車道串起花木、歷史廣場與文學步道。走過動物石雕和拱形花廊，入夜還能看見庭園燈光映在溪水上。","area":"烏日區・臺中市","ph":"觀"},{"id":3531,"name":"情人木橋","lat":24.27242,"lng":120.789,"cat":"scenic","desc":"食水嵙溪上這座景觀木橋長約四十公尺，整個跨距之下沒有橋墩。從岸邊觀看，橋身直接連接兩岸，木構造的跨度尤其醒目。","area":"石岡區・臺中市","ph":"觀"},{"id":3532,"name":"石岡土牛客家文化館","lat":24.26555,"lng":120.80969,"cat":"culture","desc":"土牛劉家的大埔客家老夥房在九二一地震中全倒，族親與在地團隊花了六年依原貌重建。昔日家族共同生活的空間，成了記錄山城客家墾拓的文化館。","area":"石岡區・臺中市","ph":"觀"},{"id":3533,"name":"石岡水壩","lat":24.2813,"lng":120.76952,"cat":"nature","desc":"橫跨大甲溪的攔河堰由臺灣團隊自行設計興建，上游蓄水形成大片水面。這座水壩供應臺中農業、工業與民生用水，也記錄了震災後的工程變遷。","area":"石岡區・臺中市","ph":"觀"},{"id":3534,"name":"石岡老街","lat":24.27608,"lng":120.77608,"cat":"structure","desc":"石岡街曾因鄰近火車站而興盛，林業鐵路沒落、又歷經兩次地震後，街上多改為現代建築。沿舊鐵道改成的自行車綠廊，還能找見石岡站舊址。","area":"石岡區・臺中市","ph":"觀"},{"id":3535,"name":"臺中市立圖書館石岡分館","lat":24.27404,"lng":120.77579,"cat":"culture","desc":"石岡的四層樓圖書館將閱讀延伸到戶外，另闢有綠意環繞的閱讀園區。館舍除了借閱，也承擔社會教育、藝術與民俗活動等地方文化功能。","area":"石岡區・臺中市","ph":"觀"},{"id":3536,"name":"圳前仁愛公園","lat":24.25839,"lng":120.64848,"cat":"nature","desc":"潭雅神自行車道旁的這片公園，占地約二點二三公頃。它是神岡腹地最大的公園，也是沿綠園道行進時能遇見的一片公共綠地。","area":"神岡區・臺中市","ph":"觀"},{"id":3537,"name":"社口林宅","lat":24.24846,"lng":120.682627,"cat":"history","tag":"古蹟","desc":"神岡人也稱這座林家宅第為大夫第，前身是吳、張兩姓的舊宅。清代林振芳取得官銜後購下房屋重修，至光緒初年落成，留下今日的社口林宅。","area":"神岡區・臺中市","ph":"文"},{"id":3538,"name":"社口萬興宮","lat":24.2454,"lng":120.68405,"cat":"worship","desc":"社口這座老廟的起源可追溯到清雍正年間。相傳張達京等人返臺時感念媽祖護佑，特地到湄洲天后宮迎請天上聖母，帶回地方奉祀。","area":"神岡區・臺中市","ph":"觀"},{"id":3539,"name":"神岡呂家頂瓦厝","lat":24.23941,"lng":120.691822,"cat":"history","tag":"古蹟","desc":"詔安呂家渡海來臺後，在神岡三角仔庄定居並建立公厝。到了清道光年間，呂世芳家業漸盛，重新興建的宅第便是後人所稱的頂瓦厝。","area":"神岡區・臺中市","ph":"文"},{"id":3540,"name":"神岡浮圳","lat":24.258735,"lng":120.687765,"cat":"history","tag":"文化景觀","desc":"葫蘆墩圳下埤幹線分出的這條支線，清代由開墾者與岸裡社合作開發。當年用紅土墊高圳底，因此有「浮圳」之稱，也曾被叫作紅圳。","area":"神岡區・臺中市","ph":"文"},{"id":3541,"name":"筱雲山莊","lat":24.235751,"lng":120.695332,"cat":"history","tag":"古蹟","desc":"呂炳南為奉養母親興建宅園，後來清代文人吳子光曾在此授課，並為筱雲軒命名。山莊裡兩座風格不同的園林，也留下呂家生活與讀書的風景。","area":"神岡區・臺中市","ph":"文"},{"id":3542,"name":"PARK2草悟廣場","lat":24.14957,"lng":120.66505,"cat":"nature","area":"西區・臺中市","ph":"觀"},{"id":3543,"name":"公設質舖倉庫","lat":24.138187,"lng":120.678909,"cat":"history","tag":"歷史建築","desc":"日治時期臺中的公營當舖，曾用這棟兩層樓磚造倉庫存放流當品。原來的事務所、主管宿舍與庫房各有用途，當舖停業後庫房另作使用。","area":"西區・臺中市","ph":"文"},{"id":3544,"name":"勤美術館 CMP INSPIRATION","lat":24.15192,"lng":120.66422,"cat":"culture","area":"西區・臺中市","ph":"觀"},{"id":3545,"name":"勤美誠品綠園道","lat":24.15123,"lng":120.66385,"cat":"other","desc":"草悟道與公益路旁的購物商場和市民廣場相鄰，附近也有科博館與臺灣美術館。從街區綠地走進商場，是這一帶購物和散步相接的地方。","area":"西區・臺中市","ph":"觀"},{"id":3546,"name":"國立台灣美術館","lat":24.14119,"lng":120.66263,"cat":"culture","desc":"這座國立美術館在臺中市中心開館，館地約三公頃，周邊連著美術園道商圈與草悟道。館舍與鄰近藝文空間相互呼應，也形塑了街區的藝術氣息。","area":"西區・臺中市","ph":"觀"},{"id":3547,"name":"孫立人將軍故居","lat":24.14695,"lng":120.66783,"cat":"history","desc":"孫立人將軍在臺中的舊居登錄為歷史建築後展開修復，眷屬與昔日部屬也著手籌設紀念館。他們蒐集文稿、照片與遺物，讓生平事蹟得以從私人物件讀起。","area":"西區・臺中市","ph":"觀"},{"id":3548,"name":"審計新村","lat":24.14493,"lng":120.66261,"cat":"other","desc":"這片市中心的小聚落原是臺灣省政府審計處的員工宿舍。老房子緊鄰勤美綠園道與美術館，散步穿過時，仍能讀出曾經住人的街區尺度。","area":"西區・臺中市","ph":"觀"},{"id":3549,"name":"幻覺博物館","lat":24.15605,"lng":120.65635,"cat":"culture","desc":"這座以錯覺藝術為主題的場館，源起於克羅埃西亞。它將視覺錯覺融入教育與娛樂，臺中的館舍也連結著散布世界多座城市的博物館系列。","area":"西區・臺中市","ph":"觀"},{"id":3550,"name":"林之助紀念館","lat":24.14125,"lng":120.67348,"cat":"culture","desc":"柳川沿岸的木造宿舍曾是畫家林之助的家與畫室，房子建於日治時期。留下的構造見證沿岸街區發展，也保存了藝術家長年創作的生活空間。","area":"西區・臺中市","ph":"觀"},{"id":3551,"name":"精明一街","lat":24.15623,"lng":120.65583,"cat":"structure","desc":"兩棟建築之間的街道成了徒步區，露天咖啡座把歐式商店街的氣氛帶到臺中。服飾、珠寶、鞋店與藝廊散布兩側，逛街時也能停下來看人來人往。","area":"西區・臺中市","ph":"觀"},{"id":3552,"name":"綠光計畫","lat":24.14758,"lng":120.66294,"cat":"other","desc":"中興一巷裡十二棟自來水公司的舊宿舍，經范特喜整合後成為創意聚落。計畫圍繞藝術、人文與創作，讓過去的居住空間也能承接新的使用者。","area":"西區・臺中市","ph":"觀"},{"id":3553,"name":"臺中刑務所典獄官舍","lat":24.133253,"lng":120.674519,"cat":"history","tag":"古蹟","desc":"日治時期臺中監獄的最高行政首長稱為典獄，這是他在一九一五年落成的官舍。後來「監獄」改稱「刑務所」，官舍名稱也留下這次制度轉變的痕跡。","area":"西區・臺中市","ph":"文"},{"id":3554,"name":"臺中刑務所官舍群","lat":24.133477,"lng":120.67523,"cat":"history","tag":"歷史建築","desc":"原刑務所東、北兩側的宿舍，曾分配給不同職級的工作人員。留存的十二棟房屋從日治延續到戰後，能比較木造、磚木混合，以及雙戶或四戶的格局。","area":"西區・臺中市","ph":"文"},{"id":3555,"name":"臺中刑務所浴場","lat":24.133714,"lng":120.673961,"cat":"history","tag":"古蹟","desc":"早年刑務所部分職工宿舍沒有自家浴室，因此另設共用浴場。這處日治時期的設施曾遭颱風吹毀屋頂再行修復，留下官舍住戶日常盥洗的歷史。","area":"西區・臺中市","ph":"文"},{"id":3556,"name":"臺中刑務所演武場(舊稱：刑務所演武場)","lat":24.134379,"lng":120.673899,"cat":"history","tag":"歷史建築","desc":"日治時期的司獄官曾在這座演武場研習、演示柔道與劍道。主場之外另有更衣盥洗空間，穿過南側庭院，則是當年行政人員與教師使用的木造附屬房舍。","area":"西區・臺中市","ph":"文"},{"id":3557,"name":"臺中州廳","lat":24.138376,"lng":120.677989,"cat":"history","tag":"古蹟","desc":"臺中州治所在的廳舍沿街角配置，歷經多期工程才達到後來的規模。日治時期這裡處理的行政事務，轄區涵蓋今日臺中、彰化與南投一帶。","area":"西區・臺中市","ph":"文"},{"id":3558,"name":"臺中市大墩文化中心","lat":24.14146,"lng":120.66607,"cat":"culture","desc":"臺灣早期的文化中心在臺中發展，英才路現址於一九八三年落成啟用。隨著城市發展與縣市整併，今日以大墩之名延續市民接觸藝文的公共空間。","area":"西區・臺中市","ph":"觀"},{"id":3559,"name":"臺中市役所","lat":24.138398,"lng":120.679131,"cat":"culture","tag":"歷史建築","desc":"這棟早期鋼筋混凝土建築，最初是臺中廳公共埤圳聯合會的事務所。日治時期行政改制，新設的臺中市進駐辦公，才有了「臺中市役所」這個名字。","area":"西區・臺中市","ph":"文"},{"id":3560,"name":"臺中市警察局第一分局(舊稱：臺中警察署廳舍)","lat":24.138468,"lng":120.675779,"cat":"history","tag":"歷史建築","desc":"臺中警察署最初借用州警務部的廳舍辦公，後有了總督府營繕部門設計監造的新廳舍。日治時期興建的這棟建築，戰後仍延續地方警務用途。","area":"西區・臺中市","ph":"文"},{"id":3561,"name":"草悟道","lat":24.14841,"lng":120.66478,"cat":"nature","desc":"市區這條綠帶把科博館、勤美誠品與市民廣場串起來，還能延伸到國立臺灣美術館。沿途從藝文空間走向街邊餐飲，散步便能遇見不同的城市生活。","area":"西區・臺中市","ph":"觀"},{"id":3562,"name":"金典綠園道","lat":24.15569,"lng":120.66307,"cat":"other","area":"西區・臺中市","ph":"觀"},{"id":3563,"name":"阿薩斯雕像","lat":24.14751,"lng":120.66476,"cat":"nature","desc":"草悟道上這尊大型青銅雕像，以暴雪娛樂的角色阿薩斯為主角。臺裔藝術家史帝夫王帶領三十人團隊，耗時九個多月完成雕塑。","area":"西區・臺中市","ph":"觀"},{"id":3564,"name":"Top City臺中大遠百","lat":24.16447,"lng":120.6446,"cat":"other","desc":"這座百貨公司將精品、量販、娛樂與餐飲放進地上十四層、地下兩層的空間。館內的臺灣美食區採古早臺灣風格布置，與其他樓層各有面貌。","area":"西屯區・臺中市","ph":"觀"},{"id":3565,"name":"中央公園","lat":24.18006,"lng":120.65601,"cat":"nature","desc":"水湳經貿智慧城裡的公園，由法國景觀設計師莫斯巴赫與拉姆建築團隊參與規劃。臺灣的劉培森建築師事務所負責施工監造，是跨國合作的公共空間。","area":"西屯區・臺中市","ph":"觀"},{"id":3566,"name":"佛光山惠中寺","lat":24.17927,"lng":120.62637,"cat":"worship","desc":"遷至西屯福安路的佛光山寺院，把佛教文化與教育安置在現代館舍中。除了修持，也規劃文化閱讀與藝文展覽空間，讓市區裡有一處清靜的去所。","area":"西屯區・臺中市","ph":"觀"},{"id":3567,"name":"戰後林厝3號反空降堡","lat":24.210389,"lng":120.597586,"cat":"history","tag":"歷史建築","desc":"大肚山上的圓筒形碉堡，屬於戰後修築的林厝反空降陣地。它是當年整體大肚山工程的一部分，留下臺中都會公園一帶過去的軍事地景。","area":"西屯區・臺中市","ph":"文"},{"id":3568,"name":"烈美堂","lat":24.178585,"lng":120.642658,"cat":"worship","tag":"歷史建築","desc":"西屯廖家大魚池派以這座公廳紀念開臺祖廖烈美，後來祖厝改建為兩層樓。門前原有的大魚池在徵收後成了西平公園，舊地名也藏在家族派名裡。","area":"西屯區・臺中市","ph":"文"},{"id":3569,"name":"畢律斯鐘樓","lat":24.181587,"lng":120.603122,"cat":"history","tag":"古蹟","desc":"美國教會捐贈銅鐘，紀念畢律斯長年投入亞洲教育與東海大學創校的貢獻。鐘樓四面牆兩兩相對，菱形黃色琉璃面磚與旁邊的路思義教堂呼應。","area":"西屯區・臺中市","ph":"文"},{"id":3570,"name":"秋紅谷景觀生態公園","lat":24.16801,"lng":120.63935,"cat":"nature","desc":"臺灣大道旁的下凹綠地，把湖泊、草坪與觀景橋收在低於街面的空間。白天沿湖散步能看綠樹與水面，入夜後又可見周圍城市的燈光。","area":"西屯區・臺中市","ph":"觀"},{"id":3571,"name":"自行車文化探索館","lat":24.20935,"lng":120.61212,"cat":"culture","desc":"這座自行車博物館從早期能轉向的雙輪車談起，依序介紹車輛形式與產業的演變。展覽也照顧製造工藝、科學技術和各地的自行車文化。","area":"西屯區・臺中市","ph":"觀"},{"id":3572,"name":"臺中國家歌劇院","lat":24.16265,"lng":120.6403,"cat":"other","desc":"伊東豊雄為臺中設計的歌劇院，除了三座專業劇場，還有角落沙龍等多功能空間。表演場域一路向外延伸到廣場、戶外劇場，以及屋頂的空中花園。","area":"西屯區・臺中市","ph":"觀"},{"id":3573,"name":"臺中國際會展中心","lat":24.19368,"lng":120.65128,"cat":"other","desc":"水湳經貿園區北側的會展中心，鄰近中央公園與臺中綠美圖。場館以「大樹之門」為設計意象，將展覽館與會議中心接在一起。","area":"西屯區・臺中市","ph":"觀"},{"id":3574,"name":"臺中市政府ˍ新市政大樓","lat":24.16157,"lng":120.64688,"cat":"other","desc":"西屯七期的新市政大樓由瑞士建築團隊規劃，外觀以玻璃帷幕為特色。它和鄰近的議政大樓共同構成市政中心，也成了臺灣大道上的醒目建築。","area":"西屯區・臺中市","ph":"觀"},{"id":3575,"name":"臺中市立圖書館溪西分館","lat":24.1758,"lng":120.62558,"cat":"culture","desc":"筏子溪公園綠帶旁的圖書館，以綠建材與承重牆系統安排館內空間。建築兼顧節能與採用無落柱的工法，讓閱讀場域與沿溪綠意相鄰。","area":"西屯區・臺中市","ph":"觀"},{"id":3576,"name":"臺中市立圖書館西屯分館","lat":24.17299,"lng":120.64902,"cat":"culture","desc":"鄰近逢甲夜市的圖書分館，在西屯熱鬧商圈裡提供閱讀和學習的空間。市地重劃與大型建設持續發展的街區，也保留了居民可以靜下來讀書的角落。","area":"西屯區・臺中市","ph":"觀"},{"id":3577,"name":"臺中張家祖廟","lat":24.176098,"lng":120.622089,"cat":"worship","tag":"古蹟","desc":"下七張犁的張氏家族來自福建平和，日治時期在此建起祖廟。兩進、兩廊與四護龍圍成四合院，前方寬廣廟埕還有半月池與惜字亭。","area":"西屯區・臺中市","ph":"文"},{"id":3578,"name":"臺中綠美圖(臺中市立美術館與臺中市立圖書館)","lat":24.1927,"lng":120.65507,"cat":"culture","area":"西屯區・臺中市","ph":"觀"},{"id":3579,"name":"臺中西屯張廖家廟","lat":24.182315,"lng":120.645609,"cat":"worship","tag":"古蹟","desc":"西大墩的張廖家廟又稱承祜堂，族人沿襲「生廖死張」的祖訓。三川殿、拜殿與正殿依次排列，後方圍屋用弧形轉角接上兩側護龍。","area":"西屯區・臺中市","ph":"文"},{"id":3580,"name":"臺中都會公園","lat":24.20787,"lng":120.59852,"cat":"nature","desc":"大肚山臺地上的都市森林公園，結合休閒、環境教育與保育功能。林地、水池與濕地也為動物留下棲地，在都會邊緣形成一片綠色緩衝地帶。","area":"西屯區・臺中市","ph":"觀"},{"id":3581,"name":"西大墩窯陶瓷堆","lat":24.205946,"lng":120.618206,"cat":"history","tag":"歷史建築","desc":"開闢中部科學園區時，工地發現清代中後期燒製硬陶器留下的窯址。陶瓷堆經調查清理後移到附近保存，由西大墩窯文化館展示維護。","area":"西屯區・臺中市","ph":"文"},{"id":3582,"name":"誠品生活480","lat":24.16005,"lng":120.63851,"cat":"other","area":"西屯區・臺中市","ph":"觀"},{"id":3583,"name":"路思義教堂","lat":24.1789,"lng":120.60055,"cat":"worship","desc":"東海大學的基督教校園中，這座教堂的輪廓讓人聯想到合起來禱告的雙手。平日學生穿梭其間，假日則常見家庭到教堂旁散步。","area":"西屯區・臺中市","ph":"觀"},{"id":3584,"name":"路思義教堂","lat":24.181972,"lng":120.606915,"cat":"worship","tag":"古蹟","desc":"美國路思義家族捐資興建的教堂，由貝聿銘、陳其寬與張肇康共同設計。它在一九六三年落成，將結構、材料與空間經驗融入同一座現代建築。","area":"西屯區・臺中市","ph":"文"},{"id":3585,"name":"公老坪","lat":24.26352,"lng":120.75359,"cat":"scenic","area":"豐原區・臺中市","ph":"觀"},{"id":3586,"name":"寶泉甘味手造所","lat":24.2583,"lng":120.73205,"cat":"other","desc":"豐原糕餅老店寶泉開設這座手作工廠，將糕餅與日式甜點帶進體驗空間。除了認識老品牌，人們也能親手製作點心，休息時享用下午茶。","area":"豐原區・臺中市","ph":"觀"},{"id":3587,"name":"綠空廊道","lat":24.25413,"lng":120.72305,"cat":"scenic","desc":"從豐原延伸至大慶的綠色廊道，長約二十一點七公里，沿線橫跨六個行政區。十個站點串聯城市不同街區，讓居民有連續的綠地可供休閒。","area":"豐原區・臺中市","ph":"觀"},{"id":3588,"name":"舊山線鐵道-大甲溪鐵橋","lat":24.278926,"lng":120.74599,"cat":"history","tag":"歷史建築","desc":"舊山線在后里與葫蘆墩之間橫跨大甲溪，這段也是西部縱貫鐵道最後完成的路段。中部大地震後沿線橋軌重創，鐵橋記下初建與震後修復的兩段歷史。","area":"豐原區・臺中市","ph":"文"},{"id":3589,"name":"葫蘆墩公園","lat":24.26055,"lng":120.72187,"cat":"nature","desc":"軟埤仔溪貫穿豐原這片河濱公園，把綠地沿著水岸延展開來。這裡曾是臺中世界花博場館之一，展覽結束後，沿溪仍可欣賞花草的景色。","area":"豐原區・臺中市","ph":"觀"},{"id":3590,"name":"葫蘆墩文化中心","lat":24.25281,"lng":120.73019,"cat":"culture","desc":"豐原圓環東路上的文化中心，收藏、保存地方文物，也安排各類展覽。透過展品解說與文化活動，居民能在平日休閒時接觸地方文化資產。","area":"豐原區・臺中市","ph":"觀"},{"id":3591,"name":"豐原慈濟宮","lat":24.25167,"lng":120.71901,"cat":"worship","desc":"豐原廟東夜市名字裡的「廟」，指的就是這座奉祀天上聖母的老廟。殿宇坐南朝北，廟前老榕樹旁還有一對大銅獅，是入口醒目的風景。","area":"豐原區・臺中市","ph":"觀"},{"id":3592,"name":"豐原漆藝館","lat":24.25509,"lng":120.74579,"cat":"culture","desc":"館名背後是臺中漆器工藝發展的歷史，大雪山與八仙山林場曾供應製作所需資材。日治時期又培育了一批漆工人才，讓漆器業在中部逐漸成形。","area":"豐原區・臺中市","ph":"觀"},{"id":3593,"name":"豐榮水利紀念碑","lat":24.278522,"lng":120.761018,"cat":"history","tag":"歷史建築","desc":"葫蘆墩圳取水口整修後，豐榮水利組合在附近高臺立碑紀念。大理石基座上豎立方尖碑，四面分別留下題字、立碑緣由與參與者的姓名。","area":"豐原區・臺中市","ph":"文"},{"id":3594,"name":"頂街派出所","lat":24.253696,"lng":120.722567,"cat":"history","tag":"歷史建築","desc":"日治時期的頂街派出所原為木造，因屋舍朽壞，遷建到豐原驛前廣場南側。中部大地震又使新屋受損，之後重建的廳舍留下地方警政與震災記憶。","area":"豐原區・臺中市","ph":"文"},{"id":3595,"name":"北溝故宮文物典藏山洞","lat":24.074606,"lng":120.719524,"cat":"worship","tag":"歷史建築","desc":"故宮文物抵臺初期曾存放在霧峰北溝，後來為避免空襲而另建山洞庫房。隨著陳列室成立，這裡也曾是人們接觸故宮藏品的地方。","area":"霧峰區・臺中市","ph":"文"},{"id":3596,"name":"原臺灣省議會議事大樓、朝琴館、議員會館","lat":24.054416,"lng":120.696749,"cat":"culture","tag":"古蹟","desc":"霧峰保留省議員開議的議事大樓、提供住宿的議員會館，以及原作圖書館的朝琴館。朝琴館以空心花磚引光，室內能看見隨日照改變的光影。","area":"霧峰區・臺中市","ph":"文"},{"id":3597,"name":"台灣現代音樂鈴博物館","lat":24.03288,"lng":120.67454,"cat":"culture","desc":"霧峰的協櫻精密從事音樂鈴製造，曾生產外銷日本的音樂鈴。工廠以博物館的形式與大眾見面，除了觀看成品，也提供親手製作音樂盒的體驗。","area":"霧峰區・臺中市","ph":"觀"},{"id":3598,"name":"國定古蹟霧峰林家ˍ萊園","lat":24.06156,"lng":120.70318,"cat":"history","desc":"霧峰林家宅園分作頂厝、下厝與萊園，萊園是林文欽為侍奉母親而建。今日明台家商所在的園子，也就是後來人們熟知的霧峰林家花園。","area":"霧峰區・臺中市","ph":"觀"},{"id":3599,"name":"國立自然科學博物館921地震教育園區","lat":24.0429,"lng":120.70022,"cat":"culture","desc":"這座園區將九二一地震留下的現場保存在霧峰，能見到錯動的斷層、倒塌的校舍與隆起的河床。地震如何改變地表和建物，在這裡都有實物可對照。","area":"霧峰區・臺中市","ph":"觀"},{"id":3600,"name":"國立臺灣音樂文化園區","lat":24.05867,"lng":120.69871,"cat":"culture","desc":"以古典音樂為主題的園區設有演奏廳、樂器展示區，以及一面半立體陶藝浮雕牆。在交響樂團的各式樂器之外，也能透過互動設施體驗指揮。","area":"霧峰區・臺中市","ph":"觀"},{"id":3601,"name":"白陽聖廟","lat":24.0308,"lng":120.71872,"cat":"worship","area":"霧峰區・臺中市","ph":"觀"},{"id":3602,"name":"立法院民主議政園區","lat":24.05391,"lng":120.69981,"cat":"culture","desc":"霧峰的議政園區見證臺灣從臨時省議會、省議會到省諮議會的歷程。園內舊議員會館也保留了議員在此開會時的生活空間。","area":"霧峰區・臺中市","ph":"觀"},{"id":3603,"name":"立法院民主議政園區","lat":24.05455,"lng":120.69688,"cat":"culture","desc":"霧峰的議事大樓和民主時刻館記錄了臺灣走向民主的歷程。館內可從史料與互動展覽認識議政故事，戶外園地也適合散步。","area":"霧峰區・臺中市","ph":"觀"},{"id":3604,"name":"舊省政府教育廳","lat":24.061326,"lng":120.699545,"cat":"history","tag":"歷史建築","desc":"這是省政府原計畫遷往霧峰時興建的第一座辦公廳舍。最初的兩層樓房呈不對稱的ㄇ字形，後來才在缺口添建倉庫與檔案室。","area":"霧峰區・臺中市","ph":"文"},{"id":3605,"name":"霧峰光復新村省府眷舍","lat":24.04372,"lng":120.695114,"cat":"culture","tag":"文化景觀","desc":"昔日省府員工與家屬住在這座依花園城市概念規劃的新村。沿著林蔭街道散步，可以見到成排的紅磚眷舍，也有青年進駐的藝文空間。","area":"霧峰區・臺中市","ph":"文"},{"id":3606,"name":"霧峰林家","lat":24.064209,"lng":120.700438,"cat":"culture","tag":"古蹟","desc":"阿罩霧的林家宅邸分為頂厝、下厝與萊園。下厝的大花廳曾用來設宴，從戲臺雕花到拜亭屋頂的彎椽，都能細看當時的木作工藝。","area":"霧峰區・臺中市","ph":"文"},{"id":3607,"name":"霧峰林家花園林獻堂博物館園區","lat":24.06121,"lng":120.70311,"cat":"worship","desc":"林家的宅園裡有萊園、景薰樓與蓉鏡齋，另設林獻堂博物館。園中的老建築和名人字畫，記下家族從清代以來的歷史。","area":"霧峰區・臺中市","ph":"觀"},{"id":3608,"name":"霧峰菇類產學館","lat":24.06486,"lng":120.69806,"cat":"culture","desc":"霧峰盛產金針菇等食用菇，當地以菇類為題設立博物館。館內有超過兩公尺高的蕈菇模型，可以從放大的外形開始認識真菌。","area":"霧峰區・臺中市","ph":"觀"},{"id":3609,"name":"霧峰農會酒莊","lat":24.03857,"lng":120.69295,"cat":"other","desc":"當地農會以霧峰栽種的益全香米釀造清酒，也曾到日本做釀造試驗。從酒莊的來歷，可認識這種香米在餐桌之外的用途。","area":"霧峰區・臺中市","ph":"觀"},{"id":3610,"name":"霧峰．民生．故事館","lat":24.03947,"lng":120.69267,"cat":"culture","desc":"這座故事館從霧峰的地方歷史談起，把農村生活帶進展覽與活動。透過農夫市集、農業講堂和農村體驗，可以接觸不同面貌的農業。","area":"霧峰區・臺中市","ph":"觀"},{"id":3611,"name":"青桐林生態園區","lat":24.05121,"lng":120.78064,"cat":"culture","desc":"北坑溪與南坑溪流經這片霧峰山林，早年部分土地曾供居民種植果樹。沿途可欣賞森林植被，也能看到頭嵙山地質特有的卵石岩壁。","area":"霧峰區・臺中市","ph":"觀"},{"id":3612,"name":"三陽玉府天宮","lat":24.19116,"lng":120.55282,"cat":"worship","desc":"龍井人也稱這座主祀玉皇大帝的宮廟為天公廟。金色廟宇前可見約兩公尺高的龍香，信眾鑽爐腳祈福也是這裡的信仰習俗。","area":"龍井區・臺中市","ph":"觀"},{"id":3613,"name":"亨德公園","lat":24.17561,"lng":120.56736,"cat":"nature","desc":"大肚山上的居民為紀念亨德博士對地方的奉獻，在龍井興建這座公園。園內立著亨德教授的塑像，紀念居民心中的這位人物。","area":"龍井區・臺中市","ph":"觀"},{"id":3614,"name":"磐頂教會","lat":24.17746,"lng":120.58342,"cat":"worship","desc":"龍井這座教堂的外形像一艘大船，從外側就能辨認出船艙的輪廓。外壁以天空藍和白色相間，抬頭看時與天色相互呼應。","area":"龍井區・臺中市","ph":"觀"},{"id":3615,"name":"陳三綱堂","lat":24.1789,"lng":120.5293,"cat":"worship","desc":"龍東里三角街前的陳家宅院由陳文義開基，約建於清代嘉慶、道光年間。「三綱堂」的堂名流傳鄉里，也寄託了三個兒子合力持家的故事。","area":"龍井區・臺中市","ph":"觀"},{"id":3616,"name":"麗水漁港","lat":24.20007,"lng":120.49491,"cat":"scenic","desc":"龍井的百年漁港還有少數膠筏停靠，堤岸上的海巡檢哨站則改成了藍白色觀景臺。沿岸可以賞鳥，也能看海面上的夕照。","area":"龍井區・臺中市","ph":"觀"},{"id":3617,"name":"龍目井","lat":24.20007,"lng":120.54772,"cat":"other","desc":"龍泉里的龍目井巷藏著一口古井。相傳早年先民開墾時已發現這道水源，地方還流傳著泉水從老樟樹根湧出的說法。","area":"龍井區・臺中市","ph":"觀"},{"id":3618,"name":"MAJI集食行樂_圓山花博爭豔館","lat":25.06966,"lng":121.52173,"cat":"nature","desc":"圓山花博園區一角以貨櫃和原木穀倉搭起市集。從神農市場的小農食材，到寰宇小吃街的復古桌椅，沿途還能遇見手作攤位和展演空間。","area":"中山區・臺北市","ph":"觀"},{"id":3619,"name":"中山基督長老教會","lat":25.049,"lng":121.524213,"cat":"worship","tag":"古蹟","desc":"這處教會的前身是日治時期的大正町教會，隸屬日本基督教聖公會。當年居住在大正街一帶的日本教徒會來到這裡做禮拜。","area":"中山區・臺北市","ph":"文"},{"id":3620,"name":"中山橋","lat":25.069367,"lng":121.523225,"cat":"history","tag":"歷史建築","desc":"舊橋採一大兩小的三孔拱形設計，原來的花崗石欄杆旁設有四盞青銅橋燈。後來因防洪考量拆解保存，留下四百多件構件。","area":"中山區・臺北市","ph":"文"},{"id":3621,"name":"前美國大使官邸","lat":25.053279,"lng":121.522161,"cat":"culture","tag":"古蹟","desc":"中山北路綠蔭旁的白色兩層樓洋房，曾是多任美國駐臺大使的官邸。對稱的希臘式廊柱與寬闊迴廊，是從外觀就可辨認的特色。","area":"中山區・臺北市","ph":"文"},{"id":3622,"name":"劍潭寺","lat":25.086177,"lng":121.555357,"cat":"worship","tag":"歷史建築","desc":"古寺曾數度修葺，日治後期才遷至大直。劍潭一名相傳與鄭成功擲劍平妖有關，舊址的林園裡仍留有廟柱和石碑，記錄早年的寺廟歷史。","area":"中山區・臺北市","ph":"文"},{"id":3623,"name":"台灣基督長老教會_中山教會","lat":25.04903,"lng":121.52438,"cat":"worship","desc":"昔日的大正町教會留有英國哥德式教堂風格，門前拱柱還刻著奠基年月。除了尖拱與扶壁，從高處也能辨認出十字形屋頂。","area":"中山區・臺北市","ph":"觀"},{"id":3624,"name":"命理街","lat":25.06262,"lng":121.53329,"cat":"structure","desc":"行天宮前的人行地下道裡，聚集了許多小型命理諮詢室。早年香客求籤後常來請教老師，有些店裡還掛著外國藝人到訪的合照。","area":"中山區・臺北市","ph":"觀"},{"id":3625,"name":"國民革命忠烈祠","lat":25.07838,"lng":121.53313,"cat":"worship","desc":"基隆河畔的忠烈祠背倚青山，大殿仿北京故宮太和殿的格局興建。廣場上可見三軍儀隊交接，由大門走向大殿的步伐與操槍動作整齊一致。","area":"中山區・臺北市","ph":"觀"},{"id":3626,"name":"圓山別莊","lat":25.073173,"lng":121.524532,"cat":"culture","tag":"古蹟","desc":"大稻埕茶商陳朝駿在圓山興建這座別莊，用來款待賓客與交際。建築由日本建築師設計，也留下永裕茶行興盛時期的家族故事。","area":"中山區・臺北市","ph":"文"},{"id":3627,"name":"圓山坑道","lat":25.07274,"lng":121.523686,"cat":"history","tag":"歷史建築","desc":"圓山公園的山坡底下留有早期為防空避難而建的坑道。戰後這段地下空間曾改作臺北市戰時指揮所，與山上的公園有著不同的歷史。","area":"中山區・臺北市","ph":"文"},{"id":3628,"name":"圓山自然景觀公園","lat":25.074993,"lng":121.522297,"cat":"nature","desc":"昔日的兒童育樂中心整建後，成了圓山的自然景觀公園。園裡留下摩天輪和旋轉木馬，散步時還看得見老臺北人童年熟悉的遊樂設施。","area":"中山區・臺北市","ph":"觀"},{"id":3629,"name":"基隆河河濱自行車道","lat":25.073005,"lng":121.529555,"cat":"nature","desc":"從林安泰疏散門進入左岸，沿途的解說牌記錄基隆河的源流與整治。騎到大佳一帶，大片河濱草地襯著後方圓山飯店的紅色樓宇。","area":"中山區・臺北市","ph":"觀"},{"id":3630,"name":"大佳河濱公園","lat":25.074691,"lng":121.541099,"cat":"nature","desc":"基隆河截彎取直後，中山橋與大直橋之間多了大片河岸草地。孩子可玩滑索、沙坑與山丘上的磨石溜滑梯，遠處還能望見摩天輪。","area":"中山區・臺北市","ph":"觀"},{"id":3631,"name":"大佳碼頭","lat":25.076184,"lng":121.5374,"cat":"scenic","desc":"大直橋西側的基隆河南岸設有遊艇碼頭，是水上遊覽圓山一帶的據點。這段河畔早年曾有湖沼，附近出土的貝塚留下了先民生活的痕跡。","area":"中山區・臺北市","ph":"觀"},{"id":3632,"name":"大直植福宮","lat":25.081823,"lng":121.550485,"cat":"worship","desc":"大直居民在這座兩百多年歷史的宮廟奉祀福德正神。殿內也可見送子觀音、天上聖母與保生大帝等神祇，反映地方多樣的祈願。","area":"中山區・臺北市","ph":"觀"},{"id":3633,"name":"太原五百完人紀念建築群","lat":25.073213,"lng":121.523466,"cat":"history","tag":"歷史建築","desc":"紀念太原烈士的牌坊、紀念碑、紀念堂與招魂塚沿山勢排列。從入口沿著建築中軸看去，還有一座留著孫立人題辭的招魂碑。","area":"中山區・臺北市","ph":"文"},{"id":3634,"name":"建國啤酒廠","lat":25.045917,"lng":121.535712,"cat":"history","tag":"古蹟","desc":"日治時期的高砂麥酒株式會社在此釀造啤酒，戰後由菸酒公賣局接手。廠房可見紅磚、石材與鋼骨，不同年代的構造記錄了酒廠的擴建。","area":"中山區・臺北市","ph":"文"},{"id":3635,"name":"志生樓","lat":25.064468,"lng":121.52173,"cat":"history","tag":"歷史建築","desc":"這座老樓位在大同公司總公司廠區，推測為其前身大同鐵工所興建。建物可能在戰前就已落成，後來曾由建築師主持大規模整修。","area":"中山區・臺北市","ph":"文"},{"id":3636,"name":"捷運中山地下書街_誠品R79","lat":25.054986,"lng":121.520577,"cat":"culture","desc":"中山與雙連之間的地下通廊，沿途設有開放式書區和木質書櫃。走過文學、藝術設計與兒童繪本區，也可看見文具選物和主題展覽。","area":"中山區・臺北市","ph":"觀"},{"id":3637,"name":"捷運中山站街區_心中山線形公園","lat":25.05582,"lng":121.5206,"cat":"nature","desc":"中山到雙連之間的狹長公園，以草坪、植栽與座椅串起街區。沿途可登上平臺俯望人流，也能走到下凹式廣場，探索地下的爵士廣場。","area":"中山區・臺北市","ph":"觀"},{"id":3638,"name":"文昌宮","lat":25.0592,"lng":121.52101,"cat":"worship","desc":"民生西路巷內的廟宇主祀文昌帝君，相傳神像最初由渡海商人帶來，後由居民迎回奉祀。每逢考季常有學子到廟裡祈求功名。","area":"中山區・臺北市","ph":"觀"},{"id":3639,"name":"新生公園_玫瑰園","lat":25.069351,"lng":121.528769,"cat":"nature","desc":"這片曾作為花博展區的綠地，除了球場，還設有迷宮花園與地球旅行遊戲場。散步時可在各個角落尋找「鶴群」等九座雕像。","area":"中山區・臺北市","ph":"觀"},{"id":3640,"name":"新生北路3段62巷24號","lat":25.065737,"lng":121.526512,"cat":"structure","tag":"歷史建築","desc":"巷內這棟房屋原是丁武始所有，後來由中央銀行買下。民國四十年起作為宿舍使用，留下這條巷子與央行員工生活的連結。","area":"中山區・臺北市","ph":"文"},{"
