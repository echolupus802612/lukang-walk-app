<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f3524">
<title>散步吧</title>
<style>
@font-face{font-family:"LXGW WenKai TC";src:url("fonts/walk-kai.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"LXGW WenKai TC";src:url("fonts/walk-kai-bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Noto Sans TC";src:url("fonts/walk-sans.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Noto Sans TC";src:url("fonts/walk-sans-bold.woff2") format("woff2");font-weight:700;font-display:swap}
/* VOICE: 安靜的陪伴，像有個朋友拉你出門散步。
   IDEA: 出門散步吧——小嚮導（狼耳少年）替你挑一個附近的地方、替你指路，走到了才揭曉是哪裡。
   PICTURE: 紅磚地上的狼耳小嚮導與地面導航箭頭，佔第一個畫面的一半。
   COLOUR and TYPE: 紅磚為底、金色點題、米白文字；霞鶩文楷寫提示與台詞，思源黑體寫數字。
   LAYOUT: 單欄、一個畫面：提示、小嚮導、距離、對話、主按鈕；到了整張地點卡蓋上來。 */
:root{color-scheme:light dark;
  --bg:#9a3a27;--bg2:#82301f;--ink:#fbf3e6;--soft:#f3dccb;--gold:#f2c14e;--gold2:#c9922a;
  --card:#fbf3e6;--cardink:#3a1a12;--line:rgba(251,243,230,.22)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#3b1610;--bg2:#2a0f0a;--soft:#d9bfae;--card:#241310;--cardink:#f6e9da}}
:root[data-theme=dark]{--bg:#3b1610;--bg2:#2a0f0a;--soft:#d9bfae;--card:#241310;--cardink:#f6e9da}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 38%,var(--bg) 0%,var(--bg2) 100%) fixed,var(--bg2);
  color:var(--ink);font:500 16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;
  -webkit-tap-highlight-color:transparent;user-select:none}
.app{min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--soft)}
.top b{font:700 20px/1.1 "LXGW WenKai TC",serif;color:var(--ink)}
.mode{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.hint{margin-top:14px;font:400 17px/1.4 "LXGW WenKai TC",serif;text-align:center;color:var(--soft);min-height:24px}
.stage{position:relative;flex:1 1 auto;min-height:300px;display:grid;place-items:center}
.pet{position:relative;width:min(88vw,380px);aspect-ratio:400/330}
.pet svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* 角色使用一張橫排精靈圖，JS 調整 background-position 來切換影格。腳底對齊地面環中心 (200,268)。 */
.kid{position:absolute;left:11.25%;top:-8.8%;width:77.5%;height:93.94%;
  background:no-repeat 0 0/400% 100%;image-rendering:auto}
.kid.flip{transform:scaleX(-1)}
.dist{text-align:center;font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1.05;letter-spacing:.5px}
.dist small{font-size:18px;font-weight:500;margin-left:4px;color:var(--soft)}
.dist.masked{font-size:26px}
.dist.pressable{touch-action:pan-y;-webkit-touch-callout:none}
.distanceHint{text-align:center;font-size:12px;color:var(--soft)}
.sub{text-align:center;font-size:13px;color:var(--soft);min-height:20px;margin-top:2px}
.say{margin:12px auto 0;max-width:360px;min-height:52px;text-align:center;font:400 18px/1.45 "LXGW WenKai TC",serif;
  padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.16);opacity:0;transform:translateY(6px);transition:.35s}
.say.on{opacity:1;transform:none}
.bands{display:flex;gap:8px;justify-content:center;margin-top:14px}
.bands button{flex:1;max-width:120px}
.bands.long{display:grid;grid-template-columns:repeat(3,1fr)}
.bands.long button{max-width:none;padding:0 4px;font-size:14px}
button{font:500 16px/1 "Noto Sans TC",sans-serif;color:var(--ink);background:rgba(0,0,0,.18);
  border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 14px;cursor:pointer}
button.sel{background:var(--ink);color:var(--bg2);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.main{display:block;width:100%;margin-top:12px;min-height:56px;font:700 20px/1 "LXGW WenKai TC",serif;
  background:var(--gold);color:#3a1a12;border:0;box-shadow:0 6px 0 var(--gold2)}
.main:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold2)}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.sim{display:none;gap:8px;margin-top:10px}.sim.on{display:flex}.sim button{flex:1;font-size:15px}
.foot{margin-top:12px;text-align:center;font-size:13px;color:var(--soft)}
.foot a{color:var(--soft)}
.footlinks{display:flex;justify-content:center;align-items:center;gap:10px}
.footlinks button{min-height:44px;padding:4px 14px;font-size:14px}
.navlinks{display:flex;justify-content:center;gap:8px;margin-top:8px}
.navlinks button{font-size:14px}
.credit{display:grid;place-items:center;align-self:center;min-height:44px;padding:0 10px;text-align:center;font-size:11px;color:var(--soft);opacity:.75}
/* 地點卡 */
.veil{position:fixed;inset:0;background:rgba(20,6,3,.55);display:none;place-items:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:5}
.veil.on{display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr)}
.card{width:min(100%,400px);max-height:100%;min-height:0;overflow:auto;background:var(--card);color:var(--cardink);
  border-radius:20px;padding:18px 22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;animation:rise .5s ease}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.card .no{font:700 15px/1 "LXGW WenKai TC",serif;color:var(--gold2);letter-spacing:4px}
.card h2{font:700 clamp(30px,9vw,40px)/1.1 "LXGW WenKai TC",serif;margin:8px 0 6px;text-wrap:balance}
.card .ph{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin:14px 0 0;background:rgba(0,0,0,.08)}
.card .tag{display:inline-block;font-size:13px;border:1px solid currentColor;border-radius:999px;padding:2px 10px;opacity:.7}
.card p{font:400 17px/1.6 "LXGW WenKai TC",serif;text-align:start;margin:16px 0 4px}
.card button{width:100%;margin-top:16px;background:#9a3a27;color:#fbf3e6;border:0}
.card button.snap{background:none;color:#9a3a27;border:2px solid #9a3a27;margin-top:12px}
/* 分享透卡預覽 */
#sharev{z-index:6}
.share img{display:block;width:100%;max-height:62dvh;object-fit:contain;margin:0 auto}
.share .row button{margin-top:0}.share .row button.alt{background:none;color:#9a3a27;border:2px solid #9a3a27}
.share .msg{font-size:13px;opacity:.75;min-height:18px;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (max-height:720px){
  .app:has(#bands:not([hidden])) .say:not(.on){display:none}
  .hint,.bands,.foot{margin-top:8px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>散步吧</b><span class="mode" id="mode">尚未出發</span></div>
  <div class="hint" id="hint">選一個遠近，出門散步吧</div>

  <div class="stage">
    <div class="pet" id="pet" role="img" aria-label="小嚮導指著方向">
    <svg viewBox="0 0 400 330" aria-hidden="true">
      <!-- 導航箭頭：大到角色踩在上面，平躺在地面（同樣透視壓扁），以腳底為中心原地轉向目標 -->
      <g transform="translate(200 268) scale(1 .42)">
        <g id="wedge"><g transform="scale(3.4) translate(0 3)">
          <path d="M0 -38 L28 32 L0 17 L-28 32 Z" fill="none" stroke="rgba(42,13,7,.5)" stroke-width="7" stroke-linejoin="round"/>
          <path d="M0 -38 L28 32 L0 17 L-28 32 Z" fill="#f2c14e" stroke="#f2c14e" stroke-width="3" stroke-linejoin="round"/>
        </g></g>
      </g>
      <!-- 腳下影子壓在箭頭上，看起來是踩著 -->
      <ellipse cx="200" cy="268" rx="74" ry="15" fill="rgba(42,13,7,.4)"/>
      <!-- 「北」沿著環走，告訴你手機朝哪 -->
      <g transform="translate(200 268) scale(1 .42)">
        <text id="north" y="9" text-anchor="middle" font-size="24" fill="rgba(251,243,230,.7)" transform="translate(0 -172) scale(1 2.4)">北</text>
      </g>
    </svg>
    <div class="kid" id="kid"></div>
    </div>
  </div>

  <div class="dist" id="dist">？<small></small></div>
  <div class="distanceHint" id="distanceHint" hidden>長按可切換距離顯示</div>
  <div class="sub" id="sub"></div>
  <div class="say" id="say" aria-live="polite"></div>

  <div class="bands" id="bands">
    <button data-b="0" aria-pressed="false">近 ~500m</button><button data-b="1" class="sel" aria-pressed="true">中 ~1km</button><button data-b="2" aria-pressed="false">遠 ~2km</button>
    <button data-b="3" aria-pressed="false" hidden>2–10 公里</button><button data-b="4" aria-pressed="false" hidden>10–100 公里</button><button data-b="5" aria-pressed="false" hidden>100 公里以上</button>
  </div>
  <button class="main" id="go">出門散步吧</button>
  <div class="row" id="walkrow" hidden><button id="redraw">換個地方</button><button id="voice">語音：開</button><button id="stop">收工</button></div>
  <div class="sim" id="sim"><button id="stepTo">▲ 往目的地走</button><button id="stepRand">亂走</button><button id="turn">轉身 90°</button></div>
  <div class="foot" id="foot"></div>
  <div class="foot" role="status" id="notificationWarning" hidden>這趟散步沒有開啟到達通知，回到這裡仍能查看地點。</div>
  <div class="foot" role="status" id="storageWarning" hidden></div>
  <div class="navlinks" id="navlinks" hidden><button id="returnNavigation">帶我回去</button><button id="navigationSettings">導航設定</button></div>
  <div class="footlinks">
    <button id="photoAlbum" hidden>相片足跡</button>
    <button id="journalNote" hidden>記一筆</button>
    <a id="credits" class="credit" href="https://echolupus802612.github.io/lukang-walk-app-content/credits.html" target="_blank" rel="noopener">資料來源</a>
  </div>
</div>

<div class="veil" id="veil"><div class="card" role="dialog" aria-modal="true" aria-labelledby="cname">
  <div class="no" id="cno">第 1 站</div><h2 id="cname"></h2><span class="tag" id="ctag"></span>
  <img class="ph" id="cph" alt="" hidden>
  <p id="cdesc"></p>
  <button id="snap" class="snap">拍一張留念</button>
  <button id="visitNote" class="snap" hidden>這趟的筆記</button>
  <div class="navlinks" id="cardNavlinks" hidden><button id="cardReturnNavigation" class="snap">帶我回去</button><button id="cardNavigationSettings" class="snap">導航設定</button></div>
  <button id="again">再走一趟</button>
</div></div>

<div class="veil" id="sharev"><div class="card share" role="dialog" aria-modal="true" aria-label="分享透卡">
  <img id="shareImg" alt="">
  <p class="msg" id="shareMsg" role="status"></p>
  <div class="row"><button id="shareGo">分享</button><button id="shareRetake" class="alt">重拍</button><button id="shareClose" class="alt">關閉</button></div>
</div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>/* 分享用的透卡：整張圖就是一張圓角卡片（貼文版面），使用者拍的照片只放在中間的照片格；
   狼耳小嚮導站在照片右下角，腳超出照片、落到下方，外圍是一圈虛線（像刀模貼紙）。
   版面借用社群貼文的感覺，但名稱、圖示都是自己的，不用任何平台的商標。
   renderShareCard({photo, sticker, avatar, theme, name, stop, line, place, date, nick, focusX, focusY})
   → 寬 1080、高約 1621 的 canvas，四角透明（請存成 PNG） */
(function () {
  const U = 417, ROWS = 626;                // 版面原稿的寬、高（以這組數字換算座標）
  const W = 1080, s = W / U, H = Math.round(ROWS * s);
  const THEMES = {
    pink: {bar: '#f9a8cc', barInk: '#211a1d', paper: '#ffffff', ink: '#211a1d', soft: '#5a4f54', accent: '#ec4a5a',
           avatarBg: '#2a2326', edge: 'rgba(33,26,29,.22)', dash: 'rgba(90,79,84,.75)'},
    brick: {bar: '#9a3a27', barInk: '#fbf3e6', paper: '#fbf3e6', ink: '#3a1a12', soft: '#6b4a3e', accent: '#e0a43a',
            avatarBg: '#f2c14e', edge: 'rgba(58,26,18,.25)', dash: 'rgba(107,74,62,.8)'}
  };
  const KAI = '"LXGW WenKai TC", serif', SANS = '"Noto Sans TC", sans-serif';
  const Y = v => v * s;
  const M = 5;                              // 卡片內緣留白
  const PHOTO = [122, 430];                 // 照片格的上下緣（原稿座標）

  function cover(ctx, img, x, y, w, h, fx = 0.5, fy = 0.5) {
    const r = Math.max(w / img.width, h / img.height), sw = w / r, sh = h / r;
    ctx.drawImage(img, (img.width - sw) * fx, (img.height - sh) * fy, sw, sh, x, y, w, h);
  }
  function rr(ctx, x, y, w, h, r) {        // r 可以是一個數字，或 [左上, 右上, 右下, 左下]
    const [a, b, c, d] = Array.isArray(r) ? r : [r, r, r, r];
    ctx.beginPath(); ctx.moveTo(x + a, y); ctx.arcTo(x + w, y, x + w, y + h, b); ctx.arcTo(x + w, y + h, x, y + h, c);
    ctx.arcTo(x, y + h, x, y, d); ctx.arcTo(x, y, x + w, y, a); ctx.closePath();
  }
  /* 圖示：全部自己畫的線條，不沿用任何平台的圖示 */
  const icon = {
    feet(c, x, y, z, col) {           // 兩個腳印
      c.fillStyle = col;
      for (const [dx, dy, rot] of [[-0.28, 0.12, -0.25], [0.28, -0.12, 0.25]]) {
        c.save(); c.translate(x + dx * z, y + dy * z); c.rotate(rot);
        c.beginPath(); c.ellipse(0, 0.08 * z, 0.13 * z, 0.22 * z, 0, 0, 7); c.fill();
        for (const [tx, ty, tr] of [[-0.09, -0.2, .045], [0, -0.24, .05], [0.09, -0.2, .045]]) {
          c.beginPath(); c.arc(tx * z, ty * z, tr * z, 0, 7); c.fill();
        }
        c.restore();
      }
    },
    dots(c, x, y, z, col) { c.fillStyle = col; for (const d of [-0.3, 0, 0.3]) { c.beginPath(); c.arc(x + d * z, y, 0.07 * z, 0, 7); c.fill(); } },
    heart(c, x, y, z, col, fill) {
      c.beginPath(); c.moveTo(x, y + 0.36 * z);
      c.bezierCurveTo(x - 0.62 * z, y - 0.02 * z, x - 0.38 * z, y - 0.5 * z, x, y - 0.2 * z);
      c.bezierCurveTo(x + 0.38 * z, y - 0.5 * z, x + 0.62 * z, y - 0.02 * z, x, y + 0.36 * z);
      if (fill) { c.fillStyle = col; c.fill(); } else { c.strokeStyle = col; c.stroke(); }
    },
    bubble(c, x, y, z, col) {         // 圓角對話框，尾巴在左下
      c.strokeStyle = col; rr(c, x - 0.4 * z, y - 0.34 * z, 0.8 * z, 0.6 * z, 0.22 * z); c.stroke();
      c.beginPath(); c.moveTo(x - 0.22 * z, y + 0.25 * z); c.lineTo(x - 0.3 * z, y + 0.42 * z); c.lineTo(x - 0.04 * z, y + 0.26 * z); c.stroke();
    },
    plane(c, x, y, z, col) {          // 紙飛機：簡單的折線
      c.strokeStyle = col; c.beginPath();
      c.moveTo(x - 0.4 * z, y - 0.05 * z); c.lineTo(x + 0.42 * z, y - 0.36 * z); c.lineTo(x + 0.12 * z, y + 0.4 * z);
      c.lineTo(x - 0.02 * z, y + 0.06 * z); c.closePath(); c.stroke();
      c.beginPath(); c.moveTo(x - 0.02 * z, y + 0.06 * z); c.lineTo(x + 0.42 * z, y - 0.36 * z); c.stroke();
    },
    house(c, x, y, z, col) {
      c.fillStyle = col; c.beginPath(); c.moveTo(x, y - 0.38 * z); c.lineTo(x + 0.38 * z, y - 0.02 * z); c.lineTo(x + 0.28 * z, y - 0.02 * z);
      c.lineTo(x + 0.28 * z, y + 0.36 * z); c.lineTo(x + 0.08 * z, y + 0.36 * z); c.lineTo(x + 0.08 * z, y + 0.12 * z); c.lineTo(x - 0.08 * z, y + 0.12 * z);
      c.lineTo(x - 0.08 * z, y + 0.36 * z); c.lineTo(x - 0.28 * z, y + 0.36 * z); c.lineTo(x - 0.28 * z, y - 0.02 * z); c.lineTo(x - 0.38 * z, y - 0.02 * z); c.closePath(); c.fill();
    },
    search(c, x, y, z, col) {
      c.strokeStyle = col; c.beginPath(); c.arc(x - 0.06 * z, y - 0.06 * z, 0.26 * z, 0, 7); c.stroke();
      c.beginPath(); c.moveTo(x + 0.13 * z, y + 0.13 * z); c.lineTo(x + 0.36 * z, y + 0.36 * z); c.stroke();
    },
    plus(c, x, y, z, col) {
      c.strokeStyle = col; rr(c, x - 0.36 * z, y - 0.36 * z, 0.72 * z, 0.72 * z, 0.16 * z); c.stroke();
      c.beginPath(); c.moveTo(x, y - 0.18 * z); c.lineTo(x, y + 0.18 * z); c.moveTo(x - 0.18 * z, y); c.lineTo(x + 0.18 * z, y); c.stroke();
    }
  };

  /* 刀模貼紙：角色外圍隔一段距離畫一圈虛線。先把角色輪廓往外擴，再用「行進方格」描出外框路徑 */
  function dieCut(img, frame, frames, size, gap, color, width, dash) {
    const fw = img.width / frames, pad = Math.ceil(gap + width * 2), n = size + pad * 2;
    const out = document.createElement('canvas'); out.width = out.height = n;
    const mask = document.createElement('canvas'); mask.width = mask.height = n;
    const mg = mask.getContext('2d'), sil = document.createElement('canvas'); sil.width = sil.height = size;
    const sg = sil.getContext('2d'); sg.drawImage(img, frame * fw, 0, fw, img.height, 0, 0, size, size);
    for (let a = 0; a < 36; a++) mg.drawImage(sil, pad + Math.cos(a / 36 * 6.283) * gap, pad + Math.sin(a / 36 * 6.283) * gap);
    mg.drawImage(sil, pad, pad);
    // 方格取樣：每 3 像素一格，透明度過半算在輪廓內
    const step = 3, gw = Math.floor(n / step) + 1, d = mg.getImageData(0, 0, n, n).data;
    const inside = (gx, gy) => { const x = gx * step, y = gy * step; return x >= 0 && y >= 0 && x < n && y < n && d[(y * n + x) * 4 + 3] > 128; };
    const adj = new Map(), key = (x, y) => x + ',' + y, link = (p, q) => {
      for (const [a, b] of [[p, q], [q, p]]) { const k = key(...a); (adj.get(k) || adj.set(k, []).get(k)).push(b); }
    };
    for (let gy = -1; gy < gw; gy++) for (let gx = -1; gx < gw; gx++) {
      const c0 = inside(gx, gy), c1 = inside(gx + 1, gy), c2 = inside(gx + 1, gy + 1), c3 = inside(gx, gy + 1);
      const T = [gx * 2 + 1, gy * 2], R = [gx * 2 + 2, gy * 2 + 1], B = [gx * 2 + 1, gy * 2 + 2], L = [gx * 2, gy * 2 + 1];
      const k = (c0 ? 1 : 0) | (c1 ? 2 : 0) | (c2 ? 4 : 0) | (c3 ? 8 : 0);
      const segs = {1: [[L, T]], 2: [[T, R]], 3: [[L, R]], 4: [[R, B]], 5: [[L, T], [R, B]], 6: [[T, B]], 7: [[L, B]],
                    8: [[B, L]], 9: [[T, B]], 10: [[T, R], [B, L]], 11: [[R, B]], 12: [[R, L]], 13: [[T, R]], 14: [[L, T]]}[k] || [];
      for (const [p, q] of segs) link(p, q);
    }
    const g = out.getContext('2d'); g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.setLineDash(dash);
    const seen = new Set();
    for (const start of adj.keys()) {
      if (seen.has(start)) continue;
      const loop = []; let cur = start, prev = null;
      while (cur && !seen.has(cur)) {
        seen.add(cur); const [x, y] = cur.split(',').map(Number); loop.push([x * step / 2, y * step / 2]);
        const next = (adj.get(cur) || []).map(p => key(...p)).find(k => k !== prev && !seen.has(k));
        prev = cur; cur = next;
      }
      if (loop.length < 12) continue;          // 太小的碎片不畫
      g.beginPath();
      for (let i = 0; i < loop.length; i += 2) {   // 每隔一點取一次，線條比較順
        const [x, y] = loop[i]; i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath(); g.stroke();
    }
    g.setLineDash([]); g.drawImage(img, frame * fw, 0, fw, img.height, pad, pad, size, size);
    return {canvas: out, pad};
  }

  window.renderShareCard = function (o) {

    const fw = o.avatar.width / 4;            // 待機動作第一格，只取頭部
    c.drawImage(o.avatar, fw * 0.28, o.avatar.height * 0.06, fw * 0.44, fw * 0.44, ax - av * 0.62, ay - av * 0.55, av * 1.24, av * 1.24);
    c.restore();
    c.fillStyle = t.ink; c.font = `700 ${Y(15)}px ${SANS}`; c.textAlign = 'left';
    c.fillText(o.nick || '散步吧・小嚮導', Y(64), ay);
    // 分頁小點
    for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(W / 2 + (i - 2) * Y(9), Y(441), Y(2.3), 0, 7); c.fillStyle = i === 1 ? t.accent : 'rgba(58,26,18,.22)'; c.fill(); }
    // 動作列
    c.lineWidth = Y(2.4);
    icon.heart(c, Y(34), Y(476), Y(30), t.accent, true);
    icon.bubble(c, Y(82), Y(475), Y(30), t.ink);
    icon.plane(c, Y(129), Y(475), Y(30), t.ink);
    // 文字：距離、地名＋第幾站、地點與日期
    c.fillStyle = t.ink; c.textBaseline = 'alphabetic';
    c.font = `700 ${Y(14)}px ${SANS}`; c.fillText(o.line, Y(22), Y(518));
    c.font = `500 ${Y(16)}px ${KAI}`;
    c.fillText(o.stop == null ? o.name : `${o.name}・第 ${o.stop} 站`, Y(22), Y(542));
    c.fillStyle = t.soft; c.font = `500 ${Y(11)}px ${SANS}`; c.fillText([o.place,o.date].filter(Boolean).join('　'), Y(22), Y(563));
    // 底列四個圖示，平均排開
    c.lineWidth = Y(2.2);

    // 小嚮導：站在照片右下角，腳落到照片下方
    const size = Math.round(Y(196)), cut = dieCut(o.sticker, o.frame ?? 1, 4, size, Y(7), t.dash, Y(1.4), [Y(3.2), Y(3.2)]);
    c.drawImage(cut.canvas, Y(244) - cut.pad, Y(322) - cut.pad);
    // 透卡的反光：一道很淡的斜光
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0.4, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,.1)'); g.addColorStop(0.6, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    c.strokeStyle = t.edge; c.lineWidth = Y(1); rr(c, Y(0.5), Y(0.5), W - Y(1), H - Y(1), Y(14)); c.stroke();
    return cv;
  };

4,"cat":"worship","desc":"主祀普庵祖師，也供奉黃府王爺夫人。鹿港人習慣讓難帶的小孩認夫人媽當乾媽。","area":"鹿港一帶・彰化縣"},{"id":16,"name":"鹿港南靖宮","lat":24.05766,"lng":120.43161,"cat":"worship","tag":"古蹟","desc":"鹿港南靖宮創建於乾隆48年（西元1783年），依「鹿港南靖宮沿革碑」碑文記載得知。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":17,"name":"鹿港玉珍齋","lat":24.05464,"lng":120.434661,"cat":"shop","tag":"歷史建築","desc":"玉珍齋是鹿港最具代表性之一的傳統糕餅店，聞名全臺。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":18,"name":"鹿港牛墟頭景靈宮","lat":24.056515,"lng":120.435897,"cat":"worship","desc":"原是鹿港四方土地公裡的「東方土地公」廟，咸豐年間改奉蘇府三王爺，才改名景靈宮。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":19,"name":"鹿港城隍廟","lat":24.05832,"lng":120.432093,"cat":"worship","tag":"古蹟","desc":"鹿港城隍廟又名「鱉亭宮」，也稱「鱉亭寺」，據傳在乾隆19年（西元1754年）創立，有「分府城隍」之稱，並有敕封「忠祐侯」的封爵。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":20,"name":"鹿港福靈宮","lat":24.058553,"lng":120.434702,"cat":"worship","desc":"祭祀林爽文事件中抗清的王勳（王芬）。最早只是他墓旁的小祠，地方上叫「王恩大哥廟」。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":21,"name":"后宅闔港潤澤宮李殿王","lat":24.054236,"lng":120.432894,"cat":"worship","desc":"主祀李殿王，是鹿港八郊共同祭祀的「閤港廟」之一。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":22,"name":"鹿港敬義園紀念碑","lat":24.054997,"lng":120.43147,"cat":"history","tag":"歷史建築","desc":"「敬義園」是清領時期鹿港地區的慈善團體，其創立於乾隆42年（西元1777年），由中國浙江紹興魏子鳴與鹿仔港巡檢王坦捐倡，得士紳林振嵩和泉廈二郊鳩資設立。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":23,"name":"九曲巷","lat":24.054186,"lng":120.434469,"cat":"structure","desc":"本名金盛巷，紅磚巷道彎來繞去，十宜樓、意樓都藏在這一帶。","area":"鹿港一帶・彰化縣","ph":"觀"},{"id":24,"name":"鹿港元昌行","lat":24.054382,"lng":120.435008,"cat":"history","tag":"歷史建築","desc":"元昌行位於今彰化縣鹿港鎮中山路188號，為昔時鹿港五福街金和興街上的商號，所在地為鹿港最主要的商業街區。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":25,"name":"泊仔寮洽義堂","lat":24.057671,"lng":120.430988,"cat":"worship","desc":"蘇府王爺廟，流傳著王爺娶妻的故事。王爺的夫人「康夫人」常被信徒請回家，安撫愛哭的孩子。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":26,"name":"新祖宮","lat":24.058156,"lng":120.431307,"cat":"worship","desc":"台灣唯一由皇帝下詔、用官費蓋的媽祖廟，1788 年建。廟前立著「文武官員至此下馬」石碑。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":27,"name":"施姓宗祠","lat":24.059507,"lng":120.433052,"cat":"worship","area":"鹿港一帶・彰化縣","ph":"共"},{"id":28,"name":"鹿護福宮","lat":24.054793,"lng":120.436271,"cat":"worship","desc":"景福巷裡的角頭廟，主祀李府千歲。","area":"鹿港一帶・彰化縣"},{"id":29,"name":"玉渠宮","lat":24.053435,"lng":120.433837,"cat":"worship","desc":"主祀戲神田都元帥，清代戲班到鹿港，開演前要先來這裡「拜碼頭」。廟門用金雞、銀犬石雕代替石獅。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":30,"name":"鹿港辜宅","lat":24.054172,"lng":120.436195,"cat":"history","desc":"辜顯榮家族的宅邸，1914 年起建，洋樓兩翼各有一座八角形塔樓。現在是鹿港民俗文物館，台灣第一座私人博物館。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":31,"name":"鹿港十宜樓","lat":24.053381,"lng":120.435194,"cat":"structure","tag":"歷史建築","desc":"慶昌全盛時期，自慶昌意樓（今中山路121號）至慶昌十宜樓（今中山路149號）間兩側街屋，可能擁有十五間店屋。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":32,"name":"鹿港天后宮","lat":24.059446,"lng":120.431209,"cat":"worship","tag":"古蹟","desc":"鹿港天后宮前身媽祖廟相傳創建年代甚早，原廟位於現址北側，古地名「船仔頭」附近（今三條巷內），奉祀天上聖母媽祖，是早年閩籍移民的守護神之一。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":33,"name":"永安宮","lat":24.059039,"lng":120.430492,"cat":"worship","desc":"主祀薛府王爺，這裡原是清代水師的營盤地。旁祀的曾大老爺是戰死的水師軍官，神像穿四品官服，考生常來拜。","area":"鹿港一帶・彰化縣","ph":"觀"},{"id":34,"name":"鹿港丁家古厝","lat":24.053361,"lng":120.435737,"cat":"history","tag":"古蹟","desc":"五福街上之「新協源」丁家大宅（今彰化縣鹿港鎮中山路130、132、134號）原屬王氏所有，此店厝於道光10年（西元1830年）前已形成，據信此宅之始建時間應早於道光10年（西元18…","area":"鹿港一帶・彰化縣","ph":"文"},{"id":35,"name":"威靈廟(鹿港大將爺)","lat":24.052753,"lng":120.432574,"cat":"worship","desc":"地方上叫「大將爺廟」，主祀的大將爺相傳是明朝將軍劉綎。鹿港八景十二勝的「威靈謁刀」說的就是這裡。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":36,"name":"鹿港陸濟堂","lat":24.058207,"lng":120.429651,"cat":"worship","area":"鹿港一帶・彰化縣","ph":"共"},{"id":37,"name":"集英宮","lat":24.058783,"lng":120.430008,"cat":"worship","desc":"由三座小廟合併而成，主祀玄天上帝。1927 年惠安船主來訪，送了一塊「德被海濱」匾。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":38,"name":"意樓","lat":24.052939,"lng":120.435495,"cat":"structure","desc":"慶昌古厝裡的一座小閣樓，牆邊那棵楊桃樹，背後有一段淒美的愛情故事。","area":"鹿港一帶・彰化縣","ph":"觀"},{"id":39,"name":"甕牆","lat":24.052965,"lng":120.435975,"cat":"other","desc":"巨商顏東義宅邸圍牆的一段，牆面砌著甕，左右兩面共約 120 個，是現存最完整的一段。","area":"鹿港一帶・彰化縣","ph":"觀"},{"id":40,"name":"鹿港鹽業文化館","lat":24.053199,"lng":120.436654,"cat":"culture","area":"鹿港一帶・彰化縣"},{"id":41,"name":"鹿港日茂行","lat":24.058602,"lng":120.429252,"cat":"history","tag":"古蹟","desc":"鹿港日茂行主人林振嵩於乾隆30年（西元1765年）由中國福建泉州永寧渡海來臺，並定居鹿港，初以販鹽為業，後因經商得法而致富。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":42,"name":"鹿港鳳山寺","lat":24.052029,"lng":120.434437,"cat":"worship","tag":"古蹟","desc":"清雍正年間，鹿港鳳山寺初未建廟，僅塑廣澤尊王神像，神像可能奉祀於民宅或另設置臨時祭壇。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":43,"name":"鹿港金銀廳","lat":24.052062,"lng":120.432126,"cat":"history","tag":"歷史建築","desc":"鹿港金銀廳興建於昭和10年（西元1935年），現今位於彰化縣鹿港鎮菜園里菜園路67巷17號。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":44,"name":"鹿港興安宮","lat":24.05222,"lng":120.435677,"cat":"worship","tag":"古蹟","desc":"鹿港興安宮俗稱「興化媽祖宮」，是鹿港最早的媽祖廟之一。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":45,"name":"武澤宮","lat":24.051938,"lng":120.434934,"cat":"worship","area":"鹿港一帶・彰化縣"},{"id":46,"name":"鹿港北方福德祠","lat":24.0602,"lng":120.43015,"cat":"worship","tag":"歷史建築","desc":"鹿港街鎮原有四方土地公廟，分居鹿港街廓的東西南北四個方位，福德祠為「北土地公廟」，也是碩果僅存且原貌保存最完整的土地公廟，餘三位土地公廟不是轉為其他廟宇的陪祀神祇（東、西土地公廟）…","area":"鹿港一帶・彰化縣","ph":"文"},{"id":47,"name":"摸乳巷","lat":24.051682,"lng":120.432559,"cat":"structure","desc":"長約 80 公尺，最窄處只有約 70 公分，兩人迎面只能側身擦過。原本是兩排房子之間的排水溝。","area":"鹿港一帶・彰化縣","ph":"觀"},{"id":48,"name":"本壇宮","lat":24.051418,"lng":120.434499,"cat":"worship","area":"鹿港一帶・彰化縣"},{"id":49,"name":"郭厝保安宮","lat":24.061621,"lng":120.432255,"cat":"worship","desc":"郭姓宗族的廟，主祀廣澤尊王與郭子儀。相傳前身是清真寺，郭姓宗親至今祭祖仍不用豬肉。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":50,"name":"鎮安宮","lat":24.051722,"lng":120.43642,"cat":"worship","desc":"中山路上的角頭廟，主祀李府千歲。","area":"鹿港一帶・彰化縣"},{"id":51,"name":"鹿港紫極殿","lat":24.050913,"lng":120.433395,"cat":"worship","desc":"菜園里的上帝公廟，門神是彩繪名師郭新林的作品，已被指定為一般古物。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":52,"name":"鹿港龍山寺","lat":24.050366,"lng":120.434931,"cat":"worship","tag":"古蹟","desc":"台灣清領時期較著名的龍山寺共有五座，由北至南依序為咸豐8年（1858年）年的淡水龍山寺、乾隆3年（1738年）年的萬華龍山寺、乾隆41年（1776年）年的鹿港龍山寺、雍正年間的台南…","area":"鹿港一帶・彰化縣","ph":"文"},{"id":53,"name":"中央廣播電臺鹿港分臺暨周遭廣播設施地景文化景觀","lat":24.059991,"lng":120.427346,"cat":"nature","tag":"文化景觀","desc":"「中央廣播電臺」成立於民國17年（西元1928年）的南京丁家橋，民國38年（西元1949年）隨中國國民黨來臺，更名為「中國廣播公司」；民國69年（西元1980年）中央廣播電臺改隸國…","area":"鹿港一帶・彰化縣","ph":"文"},{"id":54,"name":"鹿港金門舘","lat":24.050017,"lng":120.435435,"cat":"structure","tag":"古蹟","desc":"臺灣有三座金門舘，分別位於艋舺（萬華）、臺南安平及鹿港。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":55,"name":"文德宮","lat":24.049598,"lng":120.436155,"cat":"worship","desc":"祭祀溫府王爺三兄弟與三位夫人，信徒會來向夫人求姻緣。舊廟在九二一地震後拆除重建。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":57,"name":"台灣基督長老教會鹿港教會","lat":24.05068,"lng":120.439139,"cat":"worship","area":"鹿港一帶・彰化縣","ph":"共"},{"id":58,"name":"鹿港生態公園","lat":24.064252,"lng":120.43689,"cat":"nature","area":"鹿港一帶・彰化縣"},{"id":59,"name":"鹿港地藏王廟","lat":24.048329,"lng":120.436658,"cat":"worship","tag":"古蹟","desc":"地藏王廟位於昔稱菜園之地，北接車圍、南聯寺口、西側為鹿港溪、東側為大眾爺塚。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":60,"name":"文開書院","lat":24.048789,"lng":120.438152,"cat":"history","desc":"1828 年落成的書院，名字紀念為台灣帶來教化的沈光文。1975 年失火後重建，只剩山門是道光年間的原物。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":61,"name":"福興鄉農會碾米廠暨穀倉","lat":24.049428,"lng":120.43994,"cat":"structure","tag":"歷史建築","desc":"福興鄉農會成立於大正13年（西元1924年），當時稱為「有限責任福興信用組合」，隸屬於臺中州「臺灣總督府農商局食糧部臺中事務所」，並配合臺灣總督府推動糧食增產政策，逐步興建穀倉及相…","area":"鹿港一帶・彰化縣","ph":"文"},{"id":62,"name":"頂厝公園","lat":24.055115,"lng":120.443617,"cat":"structure","area":"鹿港一帶・彰化縣"},{"id":63,"name":"鹿港文武廟","lat":24.04868,"lng":120.439097,"cat":"worship","tag":"古蹟","desc":"鹿港文武廟為三合一式的傳統文教祭祀空間，以文開書院居左、文祠居中、武廟居右等三個建築體組成的一大建築群，故統稱為「文武廟」。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":64,"name":"橋頭太興宮","lat":24.05094,"lng":120.441752,"cat":"worship","area":"鹿港一帶・彰化縣"},{"id":65,"name":"鹿港護安宮","lat":24.047099,"lng":120.438163,"cat":"worship","desc":"主祀吳府王爺，相傳曾跟著華佗學醫。元宵節時，旁邊的楊橋公園會擺出大型花燈。","area":"鹿港一帶・彰化縣","ph":"共"},{"id":66,"name":"楊橋公園","lat":24.046799,"lng":120.437906,"cat":"structure","desc":"楊橋原是跨過舊鹿港溪的一座木橋，「楊橋踏月」是鹿港八景之一。","area":"鹿港一帶・彰化縣","ph":"觀"},{"id":67,"name":"慈普寺","lat":24.056657,"lng":120.445467,"cat":"worship","desc":"頂厝里的佛寺，主祀釋迦牟尼佛。","area":"鹿港一帶・彰化縣"},{"id":69,"name":"同安寮福安宮","lat":24.030107,"lng":120.440994,"cat":"worship","desc":"主祀池府千歲。","area":"鹿港一帶・彰化縣"},{"id":70,"name":"原彰化飛行場防空塔（番婆及外埔）","lat":24.042994,"lng":120.462769,"cat":"structure","tag":"歷史建築","desc":"又因外觀造型特殊，不僅為辨識原彰化飛行場位置的重要地標，亦見證彰化地區於第二次世界大戰末期的軍事設施發展。","area":"鹿港一帶・彰化縣","ph":"文"},{"id":1001,"name":"仙洞坪棋盤石","lat":23.90165,"lng":120.79928,"cat":"scenic","desc":"中寮溪谷裡，巨岩經雨水沖刷與地殼變動，裂成一塊塊方整的岩石。低頭細看，石縫間長出的青草，恰好勾勒出棋盤的格線。","area":"中寮鄉・南投縣","ph":"觀"},{"id":1002,"name":"Sbayan泰雅民族起源地","lat":24.02864,"lng":121.144413,"cat":"history","tag":"文化景觀","desc":"泰雅族的口傳故事裡，祖先從裂開的巨石中走出，再遷往各地建立部落。對回到此地尋根的族人來說，這裡承載著共同的祖訓與記憶。","area":"仁愛鄉・南投縣","ph":"文"},{"id":1003,"name":"Sbayan泰雅民族起源地","lat":24.116489,"lng":121.155874,"cat":"history","tag":"文化景觀","desc":"瑞岩部落下方的台地，是泰雅族賽考列克族群口傳的發源地。相傳頭目曾站在石上宣布族人分頭遷徙，台地上的巨石也成了後人追溯祖源的標記。","area":"仁愛鄉・南投縣","ph":"文"},{"id":1004,"name":"奧萬大自然教育中心","lat":23.953645,"lng":121.179027,"cat":"scenic","desc":"數條溪流在奧萬大的狹谷間交會，四周是群山和松楓林。自然教育中心以森林為教室，走上吊橋，還能眺望溪谷與能高南峰。","area":"仁愛鄉・南投縣","ph":"觀"},{"id":1005,"name":"鳶峰觀景台(合歡山暗空公園)","lat":24.11767,"lng":121.23742,"cat":"nature","desc":"合歡山暗空公園在鳶峰設有專供觀星的平台，可以在少光害的山間仰望星空。園內的行星意象牆，也把天文主題帶進白日的山景。","area":"仁愛鄉・南投縣","ph":"觀"},{"id":1006,"name":"土虱灣","lat":23.79194,"lng":120.96443,"cat":"scenic","desc":"濁水溪穿過峽谷，在連綿山峰之間轉了近半圈，形成一道河灣。布農語地名帶有「大彎」的意思，描繪的正是這段溪流的形狀。","area":"信義鄉・南投縣","ph":"觀"},{"id":1007,"name":"地利資訊站","lat":23.79211,"lng":120.94433,"cat":"history","desc":"濁水溪畔有位手捧植栽的布農耆老，是創作者全得富以木棍搭架、柳杉木板拼成的巨人。身旁的遊客資訊站也介紹部落遊程與馬告香氛。","area":"信義鄉・南投縣","ph":"觀"},{"id":1008,"name":"東埔溫泉","lat":23.56143,"lng":120.93097,"cat":"scenic","desc":"東埔廣場的泡腳池面向山景，旁邊立著一頭白鹿。這座塑像取材自布農族水鹿泡湯療傷的傳說，廣場的石板牆則呼應部落傳統家屋。","area":"信義鄉・南投縣","ph":"觀"},{"id":1009,"name":"楠仔腳蔓社學堂遺蹟","lat":23.61797,"lng":120.884199,"cat":"worship","tag":"古蹟","desc":"久美部落一帶留有清代學堂的遺蹟，當年由雲林撫墾局委員陳世烈選址興建。學童在此學習漢文，入口的「萬興關」也是他所題。","area":"信義鄉・南投縣","ph":"文"},{"id":1010,"name":"達瑪巒文化藝術團劇場","lat":23.7952,"lng":120.94607,"cat":"culture","desc":"潭南、地利與雙龍部落都有自己的歌舞團隊，達瑪巒文化藝術團便是其中之一。團員重新梳理傳統樂舞，再把這些舞步與音樂帶進新的舞台創作。","area":"信義鄉・南投縣","ph":"觀"},{"id":1011,"name":"雙龍七彩吊橋園區","lat":23.78067,"lng":120.94982,"cat":"culture","desc":"雙龍部落東南方的瀑布分成上下兩段，隔著山谷可見七彩吊橋凌空而過。沿林間小徑往瀑布走，山櫻和梅樹在各自的花季為步道添香。","area":"信義鄉・南投縣","ph":"觀"},{"id":1012,"name":"雙龍瀑布七彩吊橋","lat":23.78169,"lng":120.94512,"cat":"scenic","desc":"橫過雙龍瀑布峽谷的吊橋有四百二十階，橋面依序漆上七彩顏色。從山林間望去，一級級彩階連成長線，像一條橫跨深谷的巨龍。","area":"信義鄉・南投縣","ph":"觀"},{"id":1013,"name":"中興新村","lat":23.95651,"lng":120.68556,"cat":"other","desc":"昔日臺灣省政府的駐地，留下林蔭大道、宿舍與歐式外觀的中興會堂。走到中興郵局第七支局，還能在郵票牆上一覽過去發行的三百多張郵票。","area":"南投市・南投縣","ph":"觀"},{"id":1014,"name":"中興新村文化景觀","lat":23.946566,"lng":120.693783,"cat":"history","tag":"文化景觀","desc":"這座省政新市鎮採用英式花園城市的構想，以步行距離安排生活空間。第一鄰里的小學位在住宅區中心，宿舍街廓與附近辦公廳舍相互呼應。","area":"南投市・南投縣","ph":"文"},{"id":1015,"name":"中興會堂","lat":23.949206,"lng":120.696204,"cat":"history","tag":"歷史建築","desc":"楊卓成設計的會堂曾供省政府集會，也曾在夜裡為居民放映電影。俗稱「小白宮」的建築左右對稱，門前的拱廊與山牆都帶有西方古典風格。","area":"南投市・南投縣","ph":"文"},{"id":1016,"name":"中華電信中興服務中心","lat":23.956271,"lng":120.688212,"cat":"history","tag":"歷史建築","desc":"省府時代的電信局曾在樓上設置查號台與長途電話話房，樓下則收發電報。從北側可見花格磚牆與清水混凝土柱樑，外牆還保有灰色洗石子。","area":"南投市・南投縣","ph":"文"},{"id":1017,"name":"南投市中山公園「聚芳館」","lat":23.911059,"lng":120.688224,"cat":"nature","tag":"歷史建築","desc":"中山公園裡這座歐式建築落成於一九二二年，當時是南投郡展示物產的地方。地方土產與手工藝品都曾在這裡亮相，當中尤以「南投燒」陶器出名。","area":"南投市・南投縣","ph":"文"},{"id":1018,"name":"南投市農會","lat":23.908147,"lng":120.687008,"cat":"history","tag":"歷史建築","desc":"這棟兩層樓的磚造農會建築落成於一九三六年，屋簷下仍可見日式屋瓦。細看外牆，每塊俗稱「國防磚」的面磚上，都有一道道平行的溝紋。","area":"南投市・南投縣","ph":"文"},{"id":1019,"name":"南投戲院","lat":23.90795,"lng":120.68788,"cat":"culture","desc":"這家創立於一九二一年的老戲院，從早年的舞台秀場一路走到放映院線電影。外觀恢復了民國五十五年的樣貌，也曾邀請地方神明一同看電影。","area":"南投市・南投縣","ph":"觀"},{"id":1020,"name":"南投稅務出張所","lat":23.910756,"lng":120.684303,"cat":"history","tag":"歷史建築","desc":"日治時期南投郡的稅務曾在此辦理，建築左右兩翼分別容納辦公室。中央兩層樓採平屋頂，兩側較矮的斜屋頂鋪著日本灰瓦，後方圍出中庭。","area":"南投市・南投縣","ph":"文"},{"id":1021,"name":"旗杆厝","lat":23.910554,"lng":120.685724,"cat":"history","tag":"歷史建築","desc":"張春華考取功名後，家宅門前便立起旗杆祭祖，成了鄉里辨認張家的地標。右護龍前還留著紅磚旗杆座，上頭兩塊花崗石可以看見固定木栓的方孔。","area":"南投市・南投縣","ph":"文"},{"id":1022,"name":"橫山賞鷹平台","lat":23.89611,"lng":120.63314,"cat":"scenic","desc":"春秋兩季，過境猛禽飛過八卦山脈，站在山脈最高處的平台便有機會觀察。平台視野也伸向彰化平原，遠處還能眺望濁水溪流域。","area":"南投市・南投縣","ph":"觀"},{"id":1023,"name":"武德殿及其附屬建築群","lat":23.909416,"lng":120.683986,"cat":"worship","tag":"歷史建築","desc":"日治時期，軍警與學生曾在這座武德殿練習柔道、劍道。沿台階抬頭望，屋脊上的經卷形鬼瓦刻著「武」字，山牆兩側另有狐格子裝飾。","area":"南投市・南投縣","ph":"文"},{"id":1024,"name":"波尼亞灣(原特色遊學中心)","lat":23.81743,"lng":120.8855,"cat":"culture","desc":"日月潭風景區內的光明國小在併校後，校地成了特色遊學中心。親愛音樂文化基金會進駐後，以舊校園為場地，規劃結合生活與音樂的體驗營隊。","area":"南投市・南投縣","ph":"觀"},{"id":1025,"name":"猴探井天空之橋","lat":23.90845,"lng":120.6316,"cat":"other","desc":"八卦山裡有一處像井的山谷，谷前的小山峰形似蹲在井口往下望的猴子，猴探井因而得名。山上步道分別通往茶園涼亭和眺望台。","area":"南投市・南投縣","ph":"觀"},{"id":1026,"name":"碧山岩","lat":23.9619,"lng":120.64645,"cat":"other","desc":"山寺以碧瓦灰牆映襯寺前白象，從這裡可以遠望田野與蜿蜒的貓羅溪。附近的挑水古道則有另一番景致，油桐花開時，白色花瓣沿途飄落。","area":"南投市・南投縣","ph":"觀"},{"id":1027,"name":"祭祀公業張琯溪公宗祠","lat":23.91396,"lng":120.688108,"cat":"worship","tag":"歷史建築","desc":"南投張氏琯溪派祖籍福建平和，族人因舊祠遭颱風摧毀而在此重建宗祠。穿過三開間的門廳，兩旁廂廊由過水廊銜接護龍，可見傳統木作的布局。","area":"南投市・南投縣","ph":"文"},{"id":1028,"name":"老樟母女樹","lat":23.94618,"lng":120.63574,"cat":"other","desc":"遠看是一株高大的樟樹，靠近才會發現，三百多年的老樟身旁還長著一棵小杜英。兩樹枝葉交織，模樣宛如母女相依，成了當地熟悉的地標。","area":"南投市・南投縣","ph":"觀"},{"id":1029,"name":"臺灣新生報中興新村辦事處(原館)","lat":23.950185,"lng":120.693662,"cat":"history","tag":"歷史建築","desc":"修澤蘭為中興新村設計的報館，以低扁的紅磚立面搭配圓形木窗。這棟一九六三年興建的房舍後來也曾作為銀行辦事處，地震受損後經過修復。","area":"南投市・南投縣","ph":"文"},{"id":1030,"name":"臺灣省政府","lat":23.958323,"lng":120.687279,"cat":"history","tag":"古蹟","desc":"一九五七年，臺灣省政府遷入中興新村，這裡成了協調全省各地事務的行政中心。廳舍正面中央三層、兩翼兩層，平屋頂下保有洗石子外牆。","area":"南投市・南投縣","ph":"文"},{"id":1031,"name":"臺灣省政資料館","lat":23.95563,"lng":120.683239,"cat":"culture","desc":"省府圖表室發展成今天的資料館，收藏臺灣省政建設的文物與紀錄。除了看各項施政的歷史展示，還可從古蹟模型細看臺灣老建築的模樣。","area":"南投市・南投縣","ph":"觀"},{"id":1032,"name":"臺灣銀行中興新村分行","lat":23.955808,"lng":120.688508,"cat":"history","tag":"歷史建築","desc":"為服務省府和地方居民而成立的銀行分行，從一九五八年起在中興新村辦理金融業務。入口石柱帶有雕刻，長形窗、花格磚和洗石子構成細長的立面。","area":"南投市・南投縣","ph":"文"},{"id":1033,"name":"荔枝王","lat":23.91723,"lng":120.63929,"cat":"other","desc":"早年來此開墾的居民種下荔枝，如今四株兩百多歲的荔枝樹在此相伴生長。地方至今沿用「荔枝腳」這個稱呼，名字裡也留著老樹的身影。","area":"南投市・南投縣","ph":"觀"},{"id":1034,"name":"藍田書院","lat":23.907231,"lng":120.684732,"cat":"history","tag":"古蹟","desc":"清代地方仕紳合力在南投創設書院，取「種玉樹人、青出於藍」之意為它命名。書院供奉文昌帝君，早年讀書人便在兩側廂房研習。","area":"南投市・南投縣","ph":"文"},{"id":1035,"name":"行政院農業委員會水土保持局(原臺灣省政府水土保持局)","lat":23.955586,"lng":120.687365,"cat":"history","tag":"歷史建築","desc":"省府農林廳昔日的水土保持局辦公廳舍，由建築師虞曰鎮設計。入口設在建物轉折處，橫向長窗與一列列垂直遮陽板交錯，是立面最醒目的細節。","area":"南投市・南投縣","ph":"文"},{"id":1036,"name":"行政院農業委員會農糧署(原臺灣省政府農林廳)","lat":23.95515,"lng":120.687772,"cat":"history","tag":"歷史建築","desc":"中興新村光華路上的舊農林廳，由建築師虞曰鎮順著基地轉折安排辦公空間。成排辦公室由單側走廊串起，從外面可見水平樑線和垂直柱列。","area":"南投市・南投縣","ph":"文"},{"id":1037,"name":"七星陣地公園","lat":23.83102,"lng":120.63853,"cat":"nature","desc":"松柏嶺高地俯臨濁水溪與彰化平原，曾設有多處軍事陣地與指揮所。受天宮附近七座退役碉堡後來整理為公園，留下高地昔日用於防守的痕跡。","area":"名間鄉・南投縣","ph":"觀"},{"id":1038,"name":"南投縣陳姓宗親會西水祠","lat":23.876634,"lng":120.694477,"cat":"worship","tag":"歷史建築","desc":"陳氏族人集資將家廟從井仔頭遷到新街村，兩進殿宇成了家族祭祀之所。前殿入口內凹，龍柱撐起屋簷，兩側牆面還各有龍虎雕塑呼應。","area":"名間鄉・南投縣","ph":"文"},{"id":1039,"name":"受天宮","lat":23.83192,"lng":120.63079,"cat":"worship","desc":"松柏嶺上的廟宇主祀北極玄天上帝，在地人也稱祂為帝爺公。從農曆正月到三月初三，各地香客陸續前來進香，乩童與文武陣頭也隨隊登場。","area":"名間鄉・南投縣","ph":"觀"},{"id":1040,"name":"品茶養生園區","lat":23.84692,"lng":120.62762,"cat":"culture","desc":"松柏嶺昔日俯瞰彰雲平原的砲台，經過綠化整理，成了茶園裡的休憩空間。園內還看得到舊軍事設施，連原有的水塔也融入了茶壺造型。","area":"名間鄉・南投縣","ph":"觀"},{"id":1041,"name":"松柏嶺遊客中心(茶文化主題館)","lat":23.83396,"lng":120.63612,"cat":"other","desc":"八卦山脈南端的松柏嶺適合種茶，當地已有三百多年的製茶歷史。遊客中心裡的茶文化主題館透過展示與體驗，帶人認識這片中低海拔茶區。","area":"名間鄉・南投縣","ph":"觀"},{"id":1042,"name":"縣定古蹟永濟義渡碑(名間鄉)","lat":23.85347,"lng":120.677505,"cat":"history","tag":"古蹟","desc":"濁水溪兩岸早年仰賴船夫擺渡，地方居民便募資買田，用田租支付船工與修船開銷。這塊碑留下了永濟義渡的故事，也記下名間與竹山兩地的往來。","area":"名間鄉・南投縣","ph":"文"},{"id":1043,"name":"集集綠色隧道","lat":23.83287,"lng":120.73238,"cat":"scenic","desc":"上千棵老樟樹立在路旁，交疊的枝葉為集集的小路撐起一條綠色隧道。隧道銜接環鎮自行車道，可沿路探訪清代的明新書院與地震遺址武昌宮。","area":"名間鄉・南投縣","ph":"觀"},{"id":1044,"name":"九份二山地震紀念園區","lat":23.96057,"lng":120.84973,"cat":"culture","desc":"九二一地震時，九份二山大量土石滑落，阻斷水流，留下兩座相鄰的堰塞湖。園區也保留地表的大坑洞和一間傾斜的屋舍，可以看出地震如何改變山村。","area":"國姓鄉・南投縣","ph":"觀"},{"id":1045,"name":"國姓鄉北港溪石橋(糯米橋)","lat":24.058474,"lng":120.90646,"cat":"history","tag":"古蹟","desc":"北港溪早年靠簡便木橋通行，日治時期改建為石拱橋。石料採自北港村附近的山區，由工人逐塊鑿出形狀、編號，再以牛車送到溪邊拼成橋身。","area":"國姓鄉・南投縣","ph":"文"},{"id":1046,"name":"國姓鄉南港村–林屋伙房","lat":23.943868,"lng":120.865725,"cat":"history","tag":"歷史建築","desc":"南港村山腳下，四座三合院一字排開，是林家從新竹北埔南遷後建立的客家聚落。家族從捕鹿轉為養鹿，伙房內歷年受贈的匾額也留下這段家業的印記。","area":"國姓鄉・南投縣","ph":"文"},{"id":1047,"name":"泰雅渡假村","lat":24.06832,"lng":120.94329,"cat":"other","desc":"園內的獵人教室、傳統建築與泰雅勇士像，從不同角度介紹泰雅族文化。看過文物館收藏的歷史器物，還可以沿生態步道，走訪蓮花池、野溪與森林。","area":"國姓鄉・南投縣","ph":"觀"},{"id":1048,"name":"中台世界博物館","lat":24.0127,"lng":120.94999,"cat":"culture","desc":"與中台禪寺相鄰的博物館依山而建，館內收藏佛教藝術與碑林拓片。抬頭可見大廳仿石窟穹頂的天花，光線從蓮花彩繪玻璃灑落，映在層層化佛上。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1049,"name":"中台禪寺","lat":24.00909,"lng":120.94459,"cat":"worship","desc":"惟覺老和尚與建築師李祖原合作，將禪宗修行的理念融入寺院設計。庭園以奇石和姿態各異的樹木造景，寺內另有禪堂、四天王殿與收藏文物的展覽館。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1050,"name":"埔里南村義民祠","lat":23.963823,"lng":120.944578,"cat":"worship","tag":"歷史建築","desc":"客家移民從新竹新埔的義民廟分香，在埔里南村建祠紀念陣亡先民。這座小祠經過幾次整修，斜屋頂上的臺灣薄瓦與傳統柱樑仍保有清代閩式風貌。","area":"埔里鎮・南投縣","ph":"文"},{"id":1051,"name":"埔里遊客中心","lat":23.96957,"lng":120.92995,"cat":"other","desc":"高大的樹木環繞遊客中心，這座取得綠建築標章的房子，外形像一艘停在林間的船。除了認識埔里及日月潭一帶的遊程，還能在青農小鋪看見本地農產。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1052,"name":"埔里黃宅","lat":23.976554,"lng":120.938722,"cat":"history","tag":"歷史建築","desc":"埔里黃家舊宅在地震中倒塌後，家人延請石岡匠師在原址重建閩式三合院。七開間正身以當地木材搭成，彩繪、雕刻與泥塑中可見多種文化的圖案。","area":"埔里鎮・南投縣","ph":"文"},{"id":1053,"name":"寶湖宮天地堂地母廟","lat":23.95145,"lng":120.98947,"cat":"worship","desc":"面向金鶯山的廟宇依山而建，主祀象徵大地的地母娘娘。廟前設有八卦九龍池，殿內可看雕樑畫棟，農曆十月十八日的地母聖誕也是埔里的重要廟會。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1054,"name":"恆吉宮媽祖廟","lat":23.96519,"lng":120.96213,"cat":"worship","desc":"走到埔里市區南興街底，孔廟左側就是居民祭拜媽祖的地方。廟裡時常可見煙霧裊裊升起，為這處位在街尾的信仰中心添了幾分莊重氣氛。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1055,"name":"木生昆蟲博物館","lat":23.96429,"lng":120.94537,"cat":"culture","desc":"這座純白色昆蟲館的外形取自展翅的蝴蝶，館內珍藏一隻罕見的雌雄同體大鳳蝶標本。生態園裡種了多種蜜源植物，也能觀察活蝶在植栽間自由飛舞。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1056,"name":"桃米生態村","lat":23.94382,"lng":120.9298,"cat":"scenic","desc":"桃米的森林、溪流和濕地，是青蛙、蜻蜓與蝴蝶生活的地方。九二一地震後，居民投入生態導覽，四、五月的夜裡，村中還有機會見到螢火蟲。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1057,"name":"楓香巨木群公園","lat":23.97596,"lng":120.99167,"cat":"nature","desc":"這座埔里小公園保留了一群臺灣原生的老楓香，散步時可以近看樹幹與樹冠。木棧道、紅瓦牆和休憩區圍出了樹下歇腳的空間。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1058,"name":"牛耳藝術渡假村","lat":23.96573,"lng":120.94329,"cat":"scenic","desc":"走進埔里的藝術園區，林淵等雕刻家的石雕散落在園中，鄉土題材處處可見。園內另有童玩廣場和大片油桐林，四、五月開花時，白色花瓣會落滿林間。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1059,"name":"紙教堂新故鄉見學園區","lat":23.94141,"lng":120.92707,"cat":"worship","desc":"阪神大地震後，鷹取教會一度以紙管搭成的教堂作為臨時聚會所，這座教堂後來遷到埔里桃米。五十八根紙管在透光天幕下列出迴廊，與一旁用彎曲鋼材搭成的見學中心相映。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1060,"name":"虎頭山地理中心碑園區","lat":23.97385,"lng":120.97968,"cat":"culture","desc":"虎頭山下的地理中心碑由兩道白色弧牆環抱，頂端交錯的圓環形似半開的百合。沿碑後石階登高，山頂有天文測量原點，也能從松林旁俯望埔里盆地。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1061,"name":"造紙龍手創館","lat":23.9478,"lng":120.95841,"cat":"culture","desc":"埔里以造紙聞名，這間由紙廠轉型的手創館展示機械造紙過程，也介紹彩浪紙怎麼做。手作工坊裡，一條條紙捲能組成各式立體造型。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1062,"name":"醒靈寺","lat":23.96779,"lng":120.94612,"cat":"worship","desc":"埔里居民早年在家中奉祀關聖帝君，後來建起改化堂，幾經更名成為今日的寺院。入口有一對石獅守望，庭內小橋流水，站在高處還能望見遠山。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1063,"name":"龍南天然漆博物館","lat":23.96771,"lng":120.9656,"cat":"culture","desc":"埔里這座漆藝博物館收藏明清家具與器物，也保存臺灣天然漆產業的文物。從漆樹生長、割取生漆到漆器成形，館內展示讓人循序看懂一件作品的來歷。","area":"埔里鎮・南投縣","ph":"觀"},{"id":1064,"name":"南投：水里蛇窯陶藝文化園區","lat":23.801734,"lng":120.865386,"cat":"culture","desc":"水里的木材與陶土吸引陶師林江松遷來築窯，昔日尤以燒製大水缸聞名。順著山坡向上砌築的土磚窯，窯身細長如蛇，至今仍能看出傳統柴燒窯場的格局。","area":"水里鄉・南投縣","ph":"觀"},{"id":1065,"name":"振昌興業股份有限公司建築群","lat":23.834842,"lng":120.86554,"cat":"history","tag":"歷史建築","desc":"振昌木業曾在車埕設廠，加工丹大林區的木材，村裡許多人家都靠林業維生。遺留下來的辦公室牆面下磚上木，宿舍則可見檜木構造與日式斜屋頂。","area":"水里鄉・南投縣","ph":"文"},{"id":1066,"name":"水里親水公園","lat":23.81226,"lng":120.84857,"cat":"nature","desc":"水里溪旁的親水公園是當地夏天戲水的去處，瘋水祭時常見一家大小在溪畔同樂。水雲橋從公園旁跨過溪流，站在橋上還能欣賞傍晚的夕陽。","area":"水里鄉・南投縣","ph":"觀"},{"id":1067,"name":"水雲橋","lat":23.81314,"lng":120.84891,"cat":"other","desc":"橫跨水里溪的鋼骨景觀橋，以太陽能供應夜間照明。白天從橋上可賞溪景，傍晚適合看夕陽，橋下沿著河濱還有散步道和溜冰場。","area":"水里鄉・南投縣","ph":"觀"},{"id":1068,"name":"石觀音吉仙宮","lat":23.87265,"lng":120.87201,"cat":"worship","desc":"水里一帶的樟腦工人曾集資建起木造觀音廟，奉祀石觀音佛母。地方相傳暴雨後山間現出七座石蓮花，被認作觀音坐蓮，因而有了建廟的緣起。","area":"水里鄉・南投縣","ph":"觀"},{"id":1069,"name":"賴家古厝","lat":23.783229,"lng":120.864029,"cat":"history","tag":"歷史建築","desc":"水里永興村的木造三合院於一九三〇年落成，正身和護龍的屋簷下保留細緻雕飾。左護龍採用歇山式屋頂，是整座宅院裡容易辨認的特色。","area":"水里鄉・南投縣","ph":"文"},{"id":1070,"name":"車埕木業展示館","lat":23.83378,"lng":120.86588,"cat":"culture","desc":"振昌木業的舊鋸木廠改為展示館後，工廠本身也成了展品。抬頭可見修復的舊木構架保存在新屋頂下，留下車埕以加工木料維生的歲月。","area":"水里鄉・南投縣","ph":"觀"},{"id":1071,"name":"車埕貯木池","lat":23.83348,"lng":120.8658,"cat":"scenic","desc":"早年從山裡運來的原木，由檜木天車吊入池中浸泡，較不容易乾裂變形。如今環池步道繞著水面，池畔的落羽松、遠山映入水面，修復的天車也留在池旁。","area":"水里鄉・南投縣","ph":"觀"},{"id":1072,"name":"車埕遊客中心","lat":23.83207,"lng":120.86606,"cat":"other","desc":"車埕國小廢校後，舊校舍「學海堂」變成遊客中心，校門和司令台仍保留原貌。操場停著一節藍皮車廂和實體火車頭，從司令台改成的候車亭就能看見。","area":"水里鄉・南投縣","ph":"觀"},{"id":1073,"name":"八通關古道","lat":23.551986,"lng":120.948868,"cat":"history","tag":"古蹟","desc":"這條清代古道在一八七五年開闢，從南投竹山通往花蓮玉里。牡丹社事件後，清廷為了加強對山區的控制而開闢東西通道，這裡就是當年的中路。","area":"竹山鎮・南投縣","ph":"文"},{"id":1074,"name":"台中菸葉場竹山輔導站(原專賣局臺中支局竹山葉煙草收納場)","lat":23.757352,"lng":120.685849,"cat":"history","tag":"歷史建築","desc":"竹山曾是種植菸草的重鎮，日治時期便在這裡設置菸葉收納場。早年一到收成季節，各地菸葉集中到輔導站收購、入庫，留下地方菸業興盛的記憶。","area":"竹山鎮・南投縣","ph":"文"},{"id":1075,"name":"瑞龍瀑布園區","lat":23.66468,"lng":120.68882,"cat":"culture","desc":"穿過孟竹林步道，濃密的竹林一路伴到瑞龍吊橋。吊橋另一端可見約三十公尺高的瀑布，水流從高處翻落，撞出四散的水花。","area":"竹山鎮・南投縣","ph":"觀"},{"id":1076,"name":"甘泉井及石頭公","lat":23.805437,"lng":120.72737,"cat":"history","tag":"歷史建築","desc":"竹山社寮的古井以石塊圍砌，據記載，總兵吳光亮喝過井水，因味甘而為井命名。井旁還有一座石砌土地公，居民也曾抽取泉水灌溉田園。","area":"竹山鎮・南投縣","ph":"文"},{"id":1077,"name":"社寮穀倉","lat":23.813796,"lng":120.722362,"cat":"history","tag":"歷史建築","desc":"地方農業組合於一九三五年興建穀倉，用來集中貯存稻穀。低矮的水泥磚平房有兩面斜屋頂，牆內藏著多層填料，用來防潮，也避免老鼠鑽入。","area":"竹山鎮・南投縣","ph":"文"},{"id":1078,"name":"竹山社寮敬聖亭","lat":23.814456,"lng":120.722279,"cat":"history","tag":"古蹟","desc":"社寮的敬聖亭與民間珍惜字紙的習俗有關，這類建築也叫惜字亭。早年人們撿拾寫過字的紙張，洗淨曬乾後集中焚化，藉此向造字先師倉頡致敬。","area":"竹山鎮・南投縣","ph":"文"},{"id":1079,"name":"竹山神社鳥居及竹山神社附屬設施","lat":23.757863,"lng":120.671699,"cat":"history","tag":"歷史建築","desc":"竹山公園入口留下日治時期神社的鳥居，當年從入口到神殿，沿途還曾設有另外兩座。留意公園裡的石燈籠與狛犬，也能找到舊神社參道的痕跡。","area":"竹山鎮・南投縣","ph":"文"},{"id":1080,"name":"竹山連興宮","lat":23.756274,"lng":120.685168,"cat":"worship","tag":"古蹟","desc":"竹山街上的媽祖廟取「水沙連興旺」之意為名，是竹山與鹿谷共同的信仰中心。前殿供奉黑面媽祖，木構彩繪、古匾及門前帶有龍虎紋樣的石柱都值得細看。","area":"竹山鎮・南投縣","ph":"文"},{"id":1081,"name":"竹山郡役所作戰指揮所(防空壕)","lat":23.757801,"lng":120.682102,"cat":"history","tag":"歷史建築","desc":"日治末期興建的半地下防空壕，位在竹山郡守官舍附近，可能兼作戰時指揮所。裡頭除走道外還隔出兩間辦公室，桌椅也用混凝土製成。","area":"竹山鎮・南投縣","ph":"文"},{"id":1082,"name":"竹山隆恩圳隧渠","lat":23.816103,"lng":120.761956,"cat":"history","tag":"古蹟","desc":"清代墾戶為灌溉社寮農田，以人力鑿穿山壁引水入圳。隧渠旁設有多處俗稱「水窗」的橫坑，大水時能分散水勢，水少時則依溪流方向把水引進來。","area":"竹山鎮・南投縣","ph":"文"},{"id":1083,"name":"縣定古蹟永濟義渡碑(竹山鎮)","lat":23.816965,"lng":120.722855,"cat":"history","tag":"古蹟","desc":"竹山社寮和名間濁水村曾隔溪相望，兩岸居民往來全靠渡船。董榮華等人為減輕鄉親負擔而募資辦義渡，這塊碑留下地方合力撐起渡口的故事。","area":"竹山鎮・南投縣","ph":"文"},{"id":1084,"name":"陳善述老宅","lat":23.812771,"lng":120.73242,"cat":"history","tag":"歷史建築","desc":"醫師陳善述返鄉行醫時住在這座五開間老宅，當年由養父請匠師興建。正身只在左側伸出護龍，抬頭還能看見彰化匠師柯煥章留在簷口的彩繪。","area":"竹山鎮・南投縣","ph":"文"},{"id":1085,"name":"陳家古厝（武秀才陳獻瑞家宅）","lat":23.812852,"lng":120.731969,"cat":"history","tag":"歷史建築","desc":"竹山後埔仔第一位武秀才陳獻瑞曾住在這裡，五開間的三合院由祖父陳喦所建。門樓以紅磚砌出鏤空牆面，配上雕花石材，仍可見當年宅第的氣派。","area":"竹山鎮・南投縣","ph":"文"},{"id":1086,"name":"原手工業品陳列館","lat":23.980042,"lng":120.69217,"cat":"culture","tag":"古蹟","desc":"昔日手工業品陳列館展出工藝競賽優勝作品和研究試作，曾是匠師彼此觀摩的場所。白色建築自下而上逐層展寬，中央挑空展場引進自然光。","area":"草屯鎮・南投縣","ph":"文"},{"id":1087,"name":"崇善堂","lat":23.956509,"lng":120.67411,"cat":"worship","tag":"歷史建築","desc":"草屯林家從自家公廳起設齋堂，後來發展成齋教龍華派的三合院式堂舍。正身前方另有拜亭，歇山式屋頂與後方廳堂的硬山屋頂各有輪廓。","area":"草屯鎮・南投縣","ph":"文"},{"id":1088,"name":"敷榮堂","lat":23.996047,"lng":120.664998,"cat":"worship","tag":"歷史建築","desc":"洪得中從草屯老家分出，於一九二八年在新庄興建這座中西合璧的三合院。紅磚、木樑柱和薄瓦構成宅院，門樓外還有一彎月眉池。","area":"草屯鎮・南投縣","ph":"文"},{"id":1089,"name":"月眉厝龍德廟","lat":23.971298,"lng":120.650419,"cat":"worship","tag":"古蹟","desc":"貓羅溪東岸的林姓族人從福建南靖遷來，也帶來家鄉保生大帝的香火。月眉厝的廟宇由家族各房共同維繫，地方所稱的「六腳頭」便與這段歷史有關。","area":"草屯鎮・南投縣","ph":"文"},{"id":1090,"name":"毓繡美術館","lat":23.99279,"lng":120.76658,"cat":"culture","desc":"九九峰山腳下的私人美術館以當代寫實藝術為主題，清水模建築掩映在山林間。展廳外的庭院也是夫妻創辦人規劃的一部分，隔著落地窗便能賞白梅。","area":"草屯鎮・南投縣","ph":"觀"},{"id":1091,"name":"登瀛書院","lat":23.988759,"lng":120.667479,"cat":"history","tag":"古蹟","desc":"草屯清代書院以三合院格局圍出講學空間，正殿供奉文昌帝君，兩旁排列齋舍。廂壁上有書卷形雕飾，正面帶三道燕尾的照壁也格外醒目。","area":"草屯鎮・南投縣","ph":"文"},{"id":1092,"name":"碧峰國民小學禮堂","lat":23.969371,"lng":120.66609,"cat":"history","tag":"歷史建築","desc":"草屯當年只有一筆禮堂經費，碧峰和新庄兩校商量後，各自先蓋半座。碧峰保留了日治時期興建的舞台，直到戰後才補齊其餘空間，成為完整禮堂。","area":"草屯鎮・南投縣","ph":"文"},{"id":1093,"name":"草屯國民小學禮堂","lat":23.98178,"lng":120.687271,"cat":"history","tag":"歷史建築","desc":"草鞋墩公學校的講堂在一九二一年落成，曾是草屯地方的大型集會場所。紅磚色的磁磚與水泥牆面少有裝飾，戰後增建的室內舞台則沿用舊建築的尺度。","area":"草屯鎮・南投縣","ph":"文"},{"id":1094,"name":"草屯朝陽宮","lat":23.983499,"lng":120.663974,"cat":"worship","tag":"古蹟","desc":"早年草屯洪、李、林、簡四姓共同出資建廟，供奉相傳從泉州分靈的湄洲聖二媽。正殿木架保留清代匠師的雕工，抬頭可看見人物挑角、挑樑的生動模樣。","area":"草屯鎮・南投縣","ph":"文"},{"id":1095,"name":"草屯燉倫堂","lat":24.000986,"lng":120.655069,"cat":"worship","tag":"古蹟","desc":"洪氏家族從福建漳浦分批遷臺，定居草屯後，各房子孫陸續建立宗祠。位於頂茄荖的這一座，由敦樸派下陽明派於清道光年間興建。","area":"草屯鎮・南投縣","ph":"文"},{"id":1096,"name":"草鞋墩雅舍","lat":23.979278,"lng":120.688929,"cat":"history","tag":"歷史建築","desc":"兩棟建於日治時期的日式木屋，過去是林務人員的宿舍。外牆的木板層層搭接，屋頂覆著日式黑瓦，保留了草屯少見的老宿舍模樣。","area":"草屯鎮・南投縣","ph":"文"},{"id":1097,"name":"大眾爺祠(大樟樹)","lat":23.82884,"lng":120.77995,"cat":"worship","desc":"居民為安葬戰亂中的亡者而建祠祭拜，廟前大樟樹則被鄉親尊稱為樟樹公。老樹有一個形似臺灣的樹洞，領角鴞也曾在樹上築巢育雛。","area":"集集鎮・南投縣","ph":"觀"},{"id":1098,"name":"明新書院","lat":23.827566,"lng":120.799518,"cat":"history","tag":"古蹟","desc":"集集仕紳籌建書院時，還利用了濁水溪氾濫後漂下的巨木。三合院正殿前鋪著本地砂岩石板，仰望屋脊，可以看見童子騎麒麟與兩側的龍飾。","area":"集集鎮・南投縣","ph":"文"},{"id":1099,"name":"武昌宮","lat":23.83089,"lng":120.79213,"cat":"worship","desc":"集集居民在此奉祀北極玄天上帝，舊廟擴建完成不久便遇上九二一地震。信眾救出了神像，倒塌的殿宇則原地保留，成為小鎮記錄震災的地標。","area":"集集鎮・南投縣","ph":"觀"},{"id":1100,"name":"永興大樟樹","lat":23.82878,"lng":120.78007,"cat":"history","desc":"水里永興村的三棵母子樟樹相伴生長，樹下有大樹公廟與土地公廟。村民平日來乘涼聊天，遇上廟會，還會以樹冠作篷，在樹下演歌仔戲和布袋戲。","area":"集集鎮・南投縣","ph":"觀"},{"id":1101,"name":"泰順廊橋","lat":23.83078,"lng":120.79213,"cat":"other","desc":"集集武昌宮旁這座有屋頂的木橋，仿照浙江泰順的北澗橋建造。抬頭能看到橋上廊屋，走到橋中央則供奉著月老星君，寄託人們對姻緣的期盼。","area":"集集鎮・南投縣","ph":"觀"},{"id":1102,"name":"添興窯及其附屬設施","lat":23.832878,"lng":120.755274,"cat":"history","tag":"歷史建築","desc":"一九五五年築成的第一座蛇窯保留至今，曾用薪柴燒製大水缸、酒甕和琉璃瓦。九二一地震一度重創窯體，修復後的窯內還留著多年燒陶的痕跡。","area":"集集鎮・南投縣","ph":"文"},{"id":1103,"name":"生物多樣性研究所保育教育館","lat":23.82836,"lng":120.80122,"cat":"culture","desc":"集集這座保育教育館把臺灣的生態系搬進展場，介紹本土特有動植物與牠們面臨的環境問題。除了看主題展覽，也能透過生態影片和解說認識保育工作。","area":"集集鎮・南投縣","ph":"觀"},{"id":1104,"name":"開闢鴻荒石碣","lat":23.82097,"lng":120.76518,"cat":"history","desc":"濁水溪畔的巨石上刻有「開闢鴻荒」四字，是清代吳光亮規劃開山時所題。站在草嶺腳看這方石碣，也就看見八通關古道開闢前留下的一筆紀錄。","area":"集集鎮・南投縣","ph":"觀"},{"id":1105,"name":"集集攔河堰","lat":23.81834,"lng":120.76333,"cat":"scenic","desc":"集集大橋下的攔河堰攔蓄濁水溪的水，供應中南部農田灌溉。橫過溪面的堰體設有十八座排洪閘門和四道排沙閘門，還特別保留魚道。","area":"集集鎮・南投縣","ph":"觀"},{"id":1106,"name":"集集林尾陳宅永福堂","lat":23.823609,"lng":120.770137,"cat":"worship","tag":"歷史建築","desc":"林仔尾的陳家先人從福建渡海來臺，在此落腳開墾。後代陳朝聘父子於一八四〇年興建木造的閩南式三合院，成為集集早期民宅留下的老面貌。","area":"集集鎮・南投縣","ph":"文"},{"id":1107,"name":"集集樟腦出張所建築群","lat":23.829135,"lng":120.786779,"cat":"history","tag":"歷史建築","desc":"集集曾是樟腦產業重鎮，日治時期的出張所就負責管理各地腦灶。木造辦公廳舍和宿舍彼此相連，對稱的大門前有兩根木柱，支撐著遮雨的門廊。","area":"集集鎮・南投縣","ph":"文"},{"id":1108,"name":"集集火車站","lat":23.826538,"lng":120.784885,"cat":"history","tag":"歷史建築","desc":"早年為興建日月潭發電廠，臺灣電力株式會社鋪設鐵路運送建材。集集便是這條支線上的木造車站，從一九二二年通車起，見證了二水到車埕的鐵道歷史。","area":"集集鎮・南投縣","ph":"文"},{"id":1109,"name":"集集軍史公園","lat":23.82711,"lng":120.79542,"cat":"nature","desc":"九二一地震後，集集將退役軍事裝備集中在公園內展示，讓人近看三軍文物。露天展品包括戰鬥機和運輸機，還能比較不同型式戰車的外觀。","area":"集集鎮・南投縣","ph":"觀"},{"id":1110,"name":"集集館","lat":23.827906,"lng":120.781231,"cat":"culture","tag":"歷史建築","desc":"清水溪畔的宅院最初是日治時期的旅社，戰後改作陳家住宅。竹山木匠將屋子改成日式與西式混合的風貌，保留原有浴室，庭園則有拱橋、蓮池與假山。","area":"集集鎮・南投縣","ph":"文"},{"id":1111,"name":"三聖宮","lat":23.82235,"lng":120.90731,"cat":"worship","desc":"頭社盆地南邊的小廟供奉三山國王，早先神像分別安在庄內民宅。居民因求雨等信仰而倡議合建一座廟，從此有了全庄一起祈求、祭拜的地方。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1112,"name":"九族文化村","lat":23.86532,"lng":120.94818,"cat":"other","desc":"魚池鄉的山間樂園集合了原住民族文化、遊樂設施和歐式花園。園裡可以從懸吊式雲霄飛車走到羅馬風格的噴泉，搭上纜車則能換個角度俯瞰日月潭。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1113,"name":"九族文化村","lat":23.86911,"lng":120.94786,"cat":"other","desc":"園內可以到娜魯灣劇場欣賞原住民族歌舞，也能在九族廣場觀看祭典演出。園區另一頭還有水上雲霄飛車、自由落體等設施，以及適合散步的歐洲花園。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1114,"name":"九龍口大平台","lat":23.87199,"lng":120.9192,"cat":"scenic","desc":"水上平台沿湖岸舒展成波浪形，設計取自九龍遨遊的姿態，也作為小型露天表演空間。沿著圓弧邊緣看出去，近處有水上浮田，遠方則可辨認慈恩塔。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1115,"name":"伊達邵文物館","lat":23.84878,"lng":120.93458,"cat":"culture","desc":"伊達邵國小裡的文物館以邵族圖騰裝飾，收藏族人狩獵、捕魚和耕作的器具。館裡也保留舂出杵音的木杵與傳統樂器，是校園裡的文化教材。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1116,"name":"伊達邵遊客中心","lat":23.84901,"lng":120.92944,"cat":"other","desc":"伊達邵碼頭旁的遊客中心取船身造型，建築設計也呼應邵族的傳統杵音。走到二樓觀景台，視野如同從船首展開，可以看日月潭的湖色隨晨昏變化。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1117,"name":"向山眺望平台","lat":23.85495,"lng":120.90546,"cat":"scenic","desc":"從向山遊客中心旁的步道走向潭邊，可見一座往水面伸出的鋼構平台。懸臂式橋身高約十公尺，腳下的鏤空格柵透出湖水，走起來彷彿懸在潭面上。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1118,"name":"向山行政暨遊客中心","lat":23.85114,"lng":120.90212,"cat":"other","desc":"團紀彥設計的清水模建築貼著草坡伸展，弧形外牆像雙手環抱日月潭。視線沿著屋頂走回地面，再越過池緣，池水裡便映出湖畔的山色。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1119,"name":"啟示玄機院孔明廟","lat":23.89211,"lng":120.92061,"cat":"worship","desc":"魚池這座廟奉祀諸葛亮，院前孔明像一手執羽扇，一手拿書卷。臥龍台上還塑有劉備三顧茅廬的故事，樓下奉祀諸葛武侯與玄天上帝，樓上則供奉關公。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1120,"name":"大福神","lat":23.86464,"lng":120.91067,"cat":"scenic","desc":"原田哲男選用白色大理石創作這件雕塑，希望觀者先留意石材本身的美感。作品所說的福氣，也包含內心的充實、待人的慷慨，以及靜下來沉思的時刻。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1121,"name":"婚紗廣場/向山落羽松","lat":23.85309,"lng":120.90202,"cat":"nature","desc":"向山遊客中心附近的草地以植栽排出雙心，成了新人拍攝婚紗的背景。沿著一排排落羽松望去，近處的樹影、碧綠潭水與遠山在同一幅景裡。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1122,"name":"拉魯島","lat":23.85555,"lng":120.91111,"cat":"scenic","desc":"日月潭中央的小島是邵族敬重的祖靈之地，族人稱它為拉魯，有心中聖山的意思。島上種植茄苳樹，寄託子孫世代延續的心意。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1123,"name":"文武廟","lat":23.86995,"lng":120.92755,"cat":"worship","desc":"日治時期興建水力發電工程，潭水上升，水社龍鳳宮與卜吉益化堂因而遷離原址。兩廟在北岸松柏崙合建，後來重建成今日宏大的北朝式殿宇。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1124,"name":"日月潭纜車站","lat":23.85208,"lng":120.93486,"cat":"other","desc":"東南湖畔的纜車站與九族文化村隔著卜吉山相望，兩站以空中纜線相連。車廂翻過山頭時，日月潭的水面與山巒從腳下展開，遠處還可望見埔里盆地。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1125,"name":"日月潭耶穌堂","lat":23.86355,"lng":120.91019,"cat":"worship","desc":"涵碧半島山腰的樹林間，有一座黃牆白柱的羅馬式小教堂。這裡原是蔣介石夫婦到日月潭時禮拜祈禱的地方，從教堂往外看便是開闊的潭面。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1126,"name":"景石","lat":23.85284,"lng":120.9023,"cat":"scenic","desc":"白色大理石被雕成繞回自身的帶狀，中央像開了一扇矩形的窗。沿著作品移動，窗框會變成三角形，背後的風景也跟著換了取景角度。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1127,"name":"月牙灣/頭社壩","lat":23.84092,"lng":120.90525,"cat":"scenic","desc":"日月潭南側這道水灣位在月潭一帶，湖面寬廣而平靜。沿岸自行車道穿過不同林相，從樹間望向水面，還能看到遠處山頭上的慈恩塔。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1128,"name":"朝霧碼頭","lat":23.86775,"lng":120.91617,"cat":"scenic","desc":"面朝東方的碼頭常在清晨籠著薄霧，日光慢慢映上水面，形成著名的「水社朝霧」。每年大批泳者橫渡日月潭時，也從這片湖岸出發。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1129,"name":"梅荷園","lat":23.86401,"lng":120.91104,"cat":"scenic","desc":"涵碧文學步道入口附近的高地，曾是憲兵觀察水社碼頭與往來人員的崗哨。九二一地震後這裡改成觀景台，能俯瞰碼頭、湖光山色與夜間煙火。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1130,"name":"水社壩","lat":23.86214,"lng":120.90182,"cat":"scenic","desc":"為了增加水力發電所需的蓄水量，一九三四年在水社溪谷築起攔水壩。它與西南側的頭社壩共同攔水，抬高了潭面，也連起原本分隔的日潭與月潭。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1131,"name":"水社碼頭","lat":23.86483,"lng":120.91162,"cat":"scenic","desc":"涵碧半島旁的浮動碼頭面向日月潭，遊艇與電動船常在這裡停靠。從背後熱鬧的水社街區走到岸邊，就能看見船隻陸續出發遊湖的景象。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1132,"name":"永結同心橋","lat":23.85463,"lng":120.90206,"cat":"scenic","desc":"向山自行車道上有一對取「永結同心」之意的橋。永結橋以弧形鋼構順著山谷延伸，白色的同心橋則取材自邵族漁具，把傳統四手網的形狀帶上橋身。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1133,"name":"溢水吐/溢流井","lat":23.86252,"lng":120.90439,"cat":"scenic","desc":"當地人稱為「天井」的圓形設施，其實是日月潭排放多餘湖水的溢流井。潭水一旦超過井口高度，便自然流入上寬下窄的漏斗，再經隧道排往水里溪。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1134,"name":"澀水窯","lat":23.92096,"lng":120.9208,"cat":"other","desc":"澀水的白仙土適合製陶，早年的迴仔窯曾用它燒製日用器皿。九二一地震後，居民一起設立陶藝教室、重新搭建磚造柴窯，接續村裡一度中斷的手藝。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1135,"name":"玄光寺","lat":23.8521,"lng":120.9136,"cat":"worship","desc":"靠近日月潭水面的寺院曾短暫安奉玄奘法師的頂骨舍利，之後舍利才遷往玄奘寺。沿湖畔台階上行，可見寺中供奉的玄奘金身與「民族宗師」匾額。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1136,"name":"玄光碼頭","lat":23.85276,"lng":120.91318,"cat":"scenic","desc":"玄光寺下方的湖岸設有遊船碼頭，仿唐式建築配上復古字體的匾額，與山邊寺院相呼應。碼頭旁的茶葉蛋攤，也成了許多人遊潭時熟悉的風景。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1137,"name":"玄奘寺","lat":23.84737,"lng":120.91713,"cat":"worship","desc":"依著青龍山、面向日月潭的寺院，以碧瓦朱柱構成樸素的仿唐建築。寺院落成後，唐代赴印度取經的高僧玄奘，其頂骨舍利由玄光寺迎奉至此。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1138,"name":"竹石園生態渡假會館","lat":23.87298,"lng":120.91871,"cat":"culture","desc":"日月潭北側的生態研習園區，以竹林、蝴蝶與地方產業為主題。從竹夢廣場拾級而上，不同種類的竹子沿著古樸石階生長，組成園區入口的風景。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1139,"name":"見晶宮","lat":23.87226,"lng":120.91964,"cat":"worship","desc":"九龍口旁的土地公廟，有個來自日月潭的名字。相傳興建水力發電工程時，居民在這裡最早看見閃閃發亮的「龍仔銀」飛向埔里，於是取名「見晶」。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1140,"name":"親手窯","lat":23.89156,"lng":120.9233,"cat":"other","desc":"園主把陶藝與粗獷木雕放進園區，從展示空間到餐廳，都留有親手設計的痕跡。除了看各種裝置，來這裡也能捲起衣袖，體驗在轉盤上手拉坯。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1141,"name":"銃櫃天寶堂","lat":23.81751,"lng":120.88377,"cat":"worship","desc":"武登村的廟後矗立著一尊高大的太子元帥像，從遠處就能辨認銃櫃這個聚落。日治時期創建的廟宇以關公、呂洞賓和灶王爺三恩主為主神。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1142,"name":"頭社古日潭浮田文化景觀","lat":23.828536,"lng":120.902638,"cat":"history","tag":"文化景觀","desc":"頭社的草泥炭沼澤地面鬆軟，早期村民用草莖纏住木頭，承托耕土種稻。這種讓田浮在濕地上的做法，是居民適應盆地特殊土質而發展出的農耕方式。","area":"魚池鄉・南投縣","ph":"文"},{"id":1143,"name":"頭社活盆地","lat":23.83093,"lng":120.8982,"cat":"scenic","desc":"日月潭西南方的頭社原是一片淺湖，水草長年淤積，形成富含有機物的泥炭土。鬆軟的地面踩起來會像波浪般晃動，居民因而稱它為「曼波田」。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1144,"name":"頭社金針花園區","lat":23.82795,"lng":120.90349,"cat":"nature","desc":"魚池頭社把金針花種在水田裡，讓湖區也有一片不同於山坡的花田。園中花色除了熟悉的金黃，還有橙紅、白與桃紅，花季一路從春末延續到秋天。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1145,"name":"龍鳳宮","lat":23.86702,"lng":120.90556,"cat":"worship","desc":"走近湖畔的廟門，立體龍鳳浮雕與廟前地板上的同款圖案遙相呼應。廟內奉祀慚愧祖師、玄天上帝與天上聖母，也有源自拉魯島的月下老人祠。","area":"魚池鄉・南投縣","ph":"觀"},{"id":1146,"name":"溪頭自然教育園區","lat":23.67451,"lng":120.79725,"cat":"culture","desc":"溪頭的森林裡，松柏、紅檜與肖楠共同撐起濃密樹冠，昆蟲和鳥類穿梭其間。沿森林步道或空中走廊散步，能從不同高度觀察林間的動靜。","area":"鹿谷鄉・南投縣","ph":"觀"},{"id":1147,"name":"鹿谷聖蹟亭","lat":23.751406,"lng":120.748709,"cat":"history","tag":"古蹟","desc":"清代新寮街的文人發起興建惜字亭，由童生黃時中承辦。那時人們珍惜寫過字的紙，會把字紙收集起來送到亭裡焚化，表達對文字的敬意。","area":"鹿谷鄉・南投縣","ph":"文"},{"id":1148,"name":"KANO遊客中心","lat":23.48227,"lng":120.46416,"cat":"other","desc":"嘉義的遊客中心位在棒球主題園區入口，以俐落線條結合木都意象，外形像一隻展翅的蝴蝶。附近有市立棒球場與嘉義公園，也連著樹木園的綠意。","area":"東區・嘉義市"},{"id":1149,"name":"一江山紀念碑","lat":23.48319,"lng":120.46481,"cat":"other","desc":"這座紀念碑為一九五五年一江山島戰役中犧牲的官兵而設。一江山是浙江外海的小島，隔年九月立起石碑，成為人們追念這場戰事的地方。","area":"東區・嘉義市"},{"id":1150,"name":"一江山陣亡將士紀念碑","lat":23.482879,"lng":120.464337,"cat":"history","tag":"歷史建築","desc":"嘉義公園裡的紀念碑立於一九五六年，追念前一年一江山島戰役中陣亡的官兵。石碑所紀念的小島位在浙江外海，當時是大陳列島的門戶。","area":"東區・嘉義市","ph":"文"},{"id":1151,"name":"丙午震災紀念碑","lat":23.48381,"lng":120.46456,"cat":"history","desc":"一九〇六年清晨，民雄與梅山之間發生大地震，嘉義市街房屋損毀嚴重。莊伯容撰寫的「震災記」刻在石碑上，留下市街重建之前的災難記憶。","area":"東區・嘉義市"},{"id":1152,"name":"九華山地藏庵","lat":23.48319,"lng":120.45631,"cat":"worship","desc":"嘉義這座廟庵以地藏王菩薩為主尊，沿著不同殿堂還能看到觀世音與藥師佛。相傳正殿的鎮殿地藏像出自交趾陶匠師葉王之手。","area":"東區・嘉義市"},{"id":1153,"name":"二二八紀念碑","lat":23.47631,"lng":120.46244,"cat":"other","desc":"嘉義為追念一九四七年的二二八事件，規劃了紀念公園與紀念碑。公園在事件四十九週年當天落成，成為嘉雲南地區寄託哀思與期盼族群和解的地方。","area":"東區・嘉義市"},{"id":1154,"name":"八獎溪義渡","lat":23.462722,"lng":120.470568,"cat":"history","tag":"古蹟","desc":"八掌溪夏秋暴漲，兩岸的居民早年得靠竹筏往來。彌陀禪寺以西曾設有義渡，保留下來的碑記，讓人想起商旅和在地人一起等候過溪的年代。","area":"東區・嘉義市","ph":"文"},{"id":1155,"name":"十二門古砲","lat":23.48381,"lng":120.46531,"cat":"history","desc":"這批古砲於一九七五年移到現址，其中一門的砲管仍可看見嘉慶十二年與臺協水師左營的鑄字。其餘古砲的來歷則還有待考證。","area":"東區・嘉義市"},{"id":1156,"name":"原嘉義城隍廟戲臺(林宅)","lat":23.494049,"lng":120.451277,"cat":"worship","tag":"歷史建築","desc":"嘉義城隍廟昔日的宣講堂也是戲臺，後來遷建為林家住宅。木構建築融合臺灣與日式做法，門前欄杆以紅磚搭配綠釉花磚，屋脊則用了鬼瓦收尾。","area":"東區・嘉義市","ph":"文"},{"id":1157,"name":"原嘉義神社暨附屬館所(嘉義市史蹟資料館)","lat":23.481102,"lng":120.467727,"cat":"history","tag":"古蹟","desc":"嘉義市史蹟資料館的前身是神社齋館與社務所，都在日治末期興建。早年參拜者先在齋館準備、齋戒，兩棟建物也留下了當年的神社生活。","area":"東區・嘉義市","ph":"文"},{"id":1158,"name":"原嘉義電信局","lat":23.478177,"lng":120.451282,"cat":"history","tag":"歷史建築","desc":"這座一九三九年興建的建築，原是嘉義的電話交換室，與同一街廓的郵局同期。當年市民使用電話的需求增加，交換設備也從這段時期逐步改良。","area":"東區・嘉義市","ph":"文"},{"id":1159,"name":"台灣第一商業銀行嘉義分行","lat":23.48078,"lng":120.45302,"cat":"history","tag":"歷史建築","desc":"中央噴水圓環旁的銀行原址，可追溯到日治時期的嘉義銀行。抬頭能看見洗石子外牆與鐵花窗，挑高大廳裡則有六根大圓柱，與外頭的圓環景致相呼應。","area":"東區・嘉義市","ph":"文"},{"id":1160,"name":"嘉大植物園","lat":23.47381,"lng":120.48844,"cat":"nature","desc":"半圓球形的溫室以原生森林和溪岸為主題，仿造岩壁的瀑布從約八公尺高處落下。周邊園區另按植物環境分區，包括恆春、蘭嶼、水生與旱生植物。","area":"東區・嘉義市"},{"id":1161,"name":"嘉義仁武宮","lat":23.481521,"lng":120.450831,"cat":"worship","tag":"古蹟","desc":"嘉義北榮街的老廟創建於清康熙年間，主神是民間俗稱「大道公」的保生大帝。這位泉州移民與醫界敬奉的守護神，來自宋代醫師吳夲的傳說。","area":"東區・嘉義市","ph":"文"},{"id":1162,"name":"嘉義公園","lat":23.482849,"lng":120.463639,"cat":"nature","tag":"文化景觀","desc":"嘉義人在日治時期便有了這座公園，設計時保留起伏的地貌和天然溪流。西北角後來增設兒童遊園地，公園也曾用過「中山公園」這個名字。","area":"東區・嘉義市","ph":"文"},{"id":1163,"name":"嘉義城隍廟","lat":23.47838,"lng":120.45401,"cat":"worship","tag":"古蹟","desc":"諸羅知縣周鍾瑄於清康熙年間建起城隍廟，從此和嘉義居民的日常信仰相連。歷經市街改正與都市擴張，原來的刺竹城垣已消失，廟宇仍立在創建原址。","area":"東區・嘉義市","ph":"文"},{"id":1164,"name":"嘉義市共和路與北門街林管處國有宿眷舍","lat":23.486153,"lng":120.454005,"cat":"culture","tag":"歷史建築","desc":"共和路與北門街一帶的巷弄裡，成片宿舍記錄了嘉義林務職員與家眷的生活。部分房舍也曾借作辦公空間，之後成為單身員工的住處。","area":"東區・嘉義市","ph":"文"},{"id":1165,"name":"嘉義市政府文化局","lat":23.48731,"lng":120.45231,"cat":"culture","desc":"嘉義市立文化中心是文化局的前身，園區把圖書館、音樂廳和博物館安排在庭園四周。走進博物館地下室，還能看見嘉義地方技藝交趾陶的專館。","area":"東區・嘉義市"},{"id":1166,"name":"嘉義市東市場","lat":23.478859,"lng":120.453726,"cat":"history","tag":"歷史建築","desc":"忠孝路與中正路口的東市場源於一九〇〇年，是嘉義早年的公設市場。從露天市街攤販走向集中管理的市集，它記錄了日治時期改善公共衛生的一次轉變。","area":"東區・嘉義市","ph":"文"},{"id":1167,"name":"嘉義市立博物館","lat":23.48719,"lng":120.45169,"cat":"culture","desc":"嘉義製材所旁的博物館，早期以地質、化石等自然主題介紹家鄉。更新展示後改以城市為軸心，把市民的歷史和日常文化帶進博物館。","area":"東區・嘉義市"},{"id":1168,"name":"嘉義文化創意產業園區","lat":23.47694,"lng":120.44006,"cat":"culture","desc":"嘉義火車站旁的舊酒廠，最初是一九一六年創設的大正製酒嘉義工場。這裡曾生產高粱酒，為嘉義留下「白酒故鄉」的稱呼，廠區後來轉作文化創意園區。","area":"東區・嘉義市"},{"id":1169,"name":"嘉義林區管理處辦公區內木構造建築群","lat":23.485269,"lng":120.453168,"cat":"history","tag":"歷史建築","desc":"林森西路上的木造辦公房舍，在日治時期分批建成，曾是營林所嘉義出張所的辦公區。從這些留下來的建築，可以看見阿里山林業在市區設置的行政據點。","area":"東區・嘉義市","ph":"文"},{"id":1170,"name":"嘉義樹木園","lat":23.48394,"lng":120.46781,"cat":"scenic","desc":"嘉義公園東北側的林地最初用來培育橡膠樹苗，後來陸續試種熱帶經濟樹種。從一九〇八年設園以來，這裡也曾以保留母樹的方式經營。","area":"東區・嘉義市"},{"id":1171,"name":"嘉義神社手水舍","lat":23.48156,"lng":120.46794,"cat":"history","desc":"嘉義市史蹟資料館對面的手水舍，是昔日神社供參拜者洗手、漱口的地方。停水多年後水流恢復，池邊解說牌也介紹如何用一勺水完成淨身的禮節。","area":"東區・嘉義市"},{"id":1172,"name":"嘉義第二司法新村","lat":23.48538,"lng":120.458631,"cat":"history","tag":"歷史建築","desc":"維新路巷內這片宿舍於一九六一年興建，供嘉義監獄的職員居住。它也是舊監獄聚落的一部分，讓人看見圍牆之外與獄政工作相連的日常生活。","area":"東區・嘉義市","ph":"文"},{"id":1173,"name":"嘉義蘇周連宗祠","lat":23.474338,"lng":120.45159,"cat":"worship","tag":"古蹟","desc":"這座三合院本是蘇家民宅，後來改為蘇、周、連三姓共同的宗祠。五開間屋宅保留雕花門楣、彩繪和木窗，從簷下吊筒還能細看傳統匠師的木作。","area":"東區・嘉義市","ph":"文"},{"id":1174,"name":"嘉義農業試驗分所辦公室","lat":23.48435,"lng":120.467985,"cat":"history","tag":"歷史建築","desc":"日治時期嘉義農事試驗支所的辦公廳舍，落成於一九三五年。米黃色牆面點綴同色系溝紋面磚，朝南的走廊由一整排圓拱門串起。","area":"東區・嘉義市","ph":"文"},{"id":1175,"name":"埤子頭植物園","lat":23.49206,"lng":120.44769,"cat":"nature","desc":"文化中心附近的平地植物園，原本與丘陵上的山仔頂植物園配對試種橡膠樹苗。後來園內陸續培育熱帶與副熱帶造林樹種，也供研究和教學使用。","area":"東區・嘉義市"},{"id":1176,"name":"天理教嘉義東門教會","lat":23.4806,"lng":120.458008,"cat":"worship","tag":"古蹟","desc":"安和街上的日式教會建築，留下天理教從日本傳入嘉義的歷史。磚木教會以紅色琉璃瓦覆頂，入口有鳥居，前院草坪的造景也融入天理教教徽。","area":"東區・嘉義市","ph":"文"},{"id":1177,"name":"孔廟","lat":23.48219,"lng":120.46656,"cat":"worship","desc":"大成殿裡主祀孔子，另有顏子、子思等弟子的神位陪祀。平日所見的廟堂裝飾簡樸，到了祭孔典禮，則以鐘鼓、音樂和舞蹈依循儀式行禮。","area":"東區・嘉義市"},{"id":1178,"name":"射日塔","lat":23.48131,"lng":120.46906,"cat":"culture","desc":"嘉義公園裡的圓塔立在舊忠烈祠原址，塔頂特別做出傾斜的輪廓。從地面往上看，好像一朵巨大的豔紫荊向著天空綻放，正呼應嘉義的市花。","area":"東區・嘉義市"},{"id":1179,"name":"彌陀映月橋","lat":23.46156,"lng":120.46844,"cat":"other","desc":"八掌溪上的單塔斜張橋連接嘉義縣市兩岸，約五十公尺高的橋塔立在溪面上。過橋可接黃金風鈴木步道或河濱運動公園，沿途欣賞開闊溪景。","area":"東區・嘉義市"},{"id":1180,"name":"慈龍寺","lat":23.48344,"lng":120.44969,"cat":"worship","desc":"這座寺院起初名為觀音亭，主祀觀世音菩薩，也祭拜註生娘娘與土地公。嘉義大地震曾震毀舊亭，地方居民後來募款，在原址重新建起廟宇。","area":"東區・嘉義市"},{"id":1181,"name":"文化中心旁杉池","lat":23.48881,"lng":120.45269,"cat":"culture","desc":"阿里山鐵路建成後，山上運下來的木材曾浸存在文化中心附近的池子裡。因為池中多是檜木，杉池也被稱作檜池，岸邊樹蔭留著嘉義木業年代的風景。","area":"東區・嘉義市"},{"id":1182,"name":"森林之歌","lat":23.48669,"lng":120.44831,"cat":"nature","desc":"文化路旁的木塔以直立條木圍合，取意自阿里山高聳的神木。彎曲的通道則像森林鐵道繞過山嶺，走入藤編甬道，可看見光影從縫隙間灑落。","area":"東區・嘉義市"},{"id":1183,"name":"水源地水錶室","lat":23.48411,"lng":120.470779,"cat":"history","tag":"歷史建築","desc":"嘉義水道在日治時期建成，水源地裡這間小屋當時被稱作「量水器室」。除了讓水源地處理淨水，也由這裡的設備記下每天供給市區的水量。","area":"東區・嘉義市","ph":"文"},{"id":1184,"name":"水源地沉澱井暨濾過井","lat":23.48384,"lng":120.47708,"cat":"history","tag":"歷史建築","desc":"這組建於一九一四年的設施，是嘉義早期自來水系統用來沉澱、過濾原水的地方。部分濾過井外觀呈圓形，入口有方柱、幾何形山牆和檜木窗。","area":"東區・嘉義市","ph":"文"},{"id":1185,"name":"沉睡森林主題公園","lat":23.48731,"lng":120.45469,"cat":"nature","desc":"北門驛前的小公園經插畫家莊信棠重新設計，綠樹、防空洞與路燈間藏著熟睡的動物。穿過櫻花造型拱門，可以沿路找找白熊、粉紅象和貓頭鷹。","area":"東區・嘉義市"},{"id":1186,"name":"滑草場與星光溜滑梯","lat":23.48219,"lng":120.46519,"cat":"other","desc":"嘉義市立棒球場前的廣場，改造成鋪有人工草皮的滑草場，也有寬大的磨石子溜滑梯。從四公尺多高的坡頂滑下，終點便是呼應球場的棒球宮格。","area":"東區・嘉義市"},{"id":1187,"name":"牆之道","lat":23.48044,"lng":120.46744,"cat":"culture","desc":"嘉義公園把閩南建築常見的牆與門洞串成一段步行空間，兩端分別是天干壇與地支壇。穿過圓形、六角形和八卦形拱洞時，同一段牆也會看出不同層次。","area":"東區・嘉義市"},{"id":1188,"name":"玉山一二村","lat":23.48648,"lng":120.44882,"cat":"history","tag":"歷史建築","desc":"製材工場旁的宿舍群，與杉池、森林鐵道共同留下嘉義木業的往事。院牆後的老屋有雨淋板外牆，山牆開了氣窗，還能辨認橫拉格子窗和日式凸窗。","area":"東區・嘉義市","ph":"文"},{"id":1189,"name":"王天星醫生故居暨嘉星診療所","lat":23.470479,"lng":120.45405,"cat":"history","tag":"古蹟","desc":"醫師王天星曾在臺灣和日本研習醫學，回到診療所服務的病人橫跨內科、小兒科等多科。早年藥品缺乏，他也在自設的實驗室研製藥品，其中以皮膚外用藥為人熟知。","area":"東區・嘉義市","ph":"文"},{"id":1190,"name":"矯正塾1921","lat":23.48544,"lng":120.45944,"cat":"other","desc":"嘉義舊監維新路巷內的十九號和二十一號宿舍，合用門牌數字為營運中心命名。木屋、草坪和彎曲的小徑留著宿舍格局，這組數字也恰好呼應舊監上棟的年份。","area":"東區・嘉義市"},{"id":1191,"name":"祥太文化館","lat":23.47669,"lng":120.47694,"cat":"culture","desc":"館內收藏葉王、洪坤福與林添木等匠師的交趾陶作品，從人物衣褶和神情可細看傳統雕塑。樓層各有主題，一樓講忠孝節義，二樓則走進神仙與民間傳說。","area":"東區・嘉義市"},{"id":1192,"name":"福康安紀功碑","lat":23.48344,"lng":120.46406,"cat":"history","desc":"石龜背上豎起高碑，是乾隆皇帝為褒揚福康安所立。碑的故事牽連林爽文事件，也記下諸羅縣在這段歷史中獲賜「嘉義」之名的緣由。","area":"東區・嘉義市"},{"id":1193,"name":"聖奧德天主堂","lat":23.496939,"lng":120.45106,"cat":"worship","tag":"歷史建築","desc":"嘉義教區因教友增加，於一九六二年興建這座教堂。屋頂線條由北向南傾斜，西側山牆還保留部分空心磚，既讓空氣流通，也讓光透進堂內。","area":"東區・嘉義市","ph":"文"},{"id":1194,"name":"舊監更生島","lat":23.48529,"lng":120.45964,"cat":"history","desc":"日治時期興建的嘉義舊監獄，與宿舍共同組成跨越百年的聚落。這座由受刑人參與施作的監獄，採賓夕凡尼亞式格局，建築本身便保留了當年管理監獄的構想。","area":"東區・嘉義市","ph":"觀"},{"id":1195,"name":"蕭萬長文物館","lat":23.4682,"lng":120.48373,"cat":"culture","desc":"嘉義大學圖書館內的展館，保存蕭萬長從擔任公職到副總統期間的文物。勳章、藝品、書畫與文獻由本人捐給學校，入口另有講述個人生平的日晷。","area":"東區・嘉義市"},{"id":1196,"name":"蘭潭月影潭心","lat":23.46594,"lng":120.48069,"cat":"scenic","desc":"蘭潭邊的鏤空裝置以鋁片編成鳥巢，中央輪廓又像桃子，呼應嘉義舊稱「桃城」。走入作品向潭面望去，水波與月影也點出了「潭心」和「談心」的雙關。","area":"東區・嘉義市"},{"id":1197,"name":"蘭潭音樂噴泉","lat":23.46544,"lng":120.48019,"cat":"nature","desc":"蘭潭水面上的噴泉隨音樂與燈光改變隊形，水柱時而扭成麻花，時而圍出皇冠或拱門。最高一道水柱可達五十公尺，岸邊還能一起望見「月影潭心」。","area":"東區・嘉義市"},{"id":1198,"name":"虎‧棒‧水泉","lat":23.48169,"lng":120.46481,"cat":"other","desc":"嘉義市立棒球場大門旁，以水泉和兩組青銅雕塑記錄地方棒球故事。沿著嘉農球員當年走過的棒球世紀大道，還能在名人牆上認識打進甲子園的隊員。","area":"東區・嘉義市"},{"id":1199,"name":"行嘉吊橋","lat":23.45686,"lng":120.45439,"cat":"other","desc":"為了讓兩岸學童和居民往來方便，何明德行善團出資出力，在二〇〇七年搭起這座橋。走到橋畔，可見種著臺灣欒樹的自行車道與河濱公園。","area":"東區・嘉義市"},{"id":1200,"name":"軍輝橋","lat":23.45831,"lng":120.45819,"cat":"other","desc":"昔日的白鷺橋漆成灰白色，遠望像一列白鷺飛過溪面，大雨過後的景象曾被稱為「鷺橋跨浪」。舊橋沖毀後重建，為了紀念協力的官兵，改名軍輝橋。","area":"東區・嘉義市"},{"id":1201,"name":"道爺圳糯米橋","lat":23.487145,"lng":120.471707,"cat":"history","tag":"古蹟","desc":"芳草橋的混凝土橋面下，藏著清代地方仕紳捐建的石橋，原名永安橋。大小不一的石塊疊成半圓形單拱，讓道爺圳的水流從橋底穿過。","area":"東區・嘉義市","ph":"文"},{"id":1202,"name":"鎮南聖神宮","lat":23.477676,"lng":120.455807,"cat":"worship","tag":"歷史建築","desc":"共和路上的廟宇原稱鎮南宮，自清乾隆年間便奉祀五府千歲。廟史裡也留下地方人士獻匾的紀錄，包括進士黃驤雲所題的「福惠斯民」。","area":"東區・嘉義市","ph":"文"},{"id":1203,"name":"阿里山林業暨鐵道文化景觀","lat":23.487179,"lng":120.454359,"cat":"history","tag":"文化景觀","desc":"阿里山的木材曾循森林鐵道運進嘉義，在北門驛一帶卸下。從車庫、製材所、貯木池到員工宿舍，沿線的建物串起了木料從山上來到城市的過程。","area":"東區・嘉義市","ph":"文"},{"id":1204,"name":"阿里山林業村暨檜意森活村","lat":23.486236,"lng":120.453939,"cat":"scenic","desc":"嘉義北門曾因阿里山木材集散而繁榮，逐漸形成兼有工作與生活空間的林業村。製材所、營林俱樂部和共和路一帶的宿舍，是這段林業歷史留下的建築。","area":"東區・嘉義市","ph":"觀"},{"id":1205,"name":"阿里山林業鐵路","lat":23.484926,"lng":120.448609,"cat":"scenic","desc":"日治時期為運送木材而鋪設的鐵道，從嘉義平地一路攀升到阿里山。沿途可見熱帶、暖帶與溫帶三種林相，支線還通往清晨賞日出的祝山。","area":"東區・嘉義市","ph":"觀"},{"id":1206,"name":"阿里山森林鐵路車庫園區","lat":23.48631,"lng":120.45131,"cat":"culture","desc":"園區前身是北門修理工場，隨著阿里山鐵路興建而逐步擴充。車頭、客車和載貨車輛過去都在這裡建造或修理，留下森林鐵路運轉背後的工作現場。","area":"東區・嘉義市"},{"id":1207,"name":"阿里山鐵路北門驛","lat":23.487642,"lng":120.454634,"cat":"culture","tag":"古蹟","desc":"日式木造的北門驛曾是阿里山鐵路沿線的重要車站，也帶動周圍貨運生意。站房分出票房、候車室和辦公室，驛前廣場的公共藝術延續著人們對鐵道的記憶。","area":"東區・嘉義市","ph":"文"},{"id":1208,"name":"陳澄波畫架","lat":23.48406,"lng":120.46356,"cat":"other","desc":"嘉義畫家陳澄波常以家鄉街景與人物入畫，設立畫架正是為了紀念這份連結。他以油畫《嘉義街外》入選日本帝國美術展覽會，也曾參與創立臺陽美術協會。","area":"東區・嘉義市"},{"id":1209,"name":"雙忠廟","lat":23.47874,"lng":120.454515,"cat":"worship","tag":"歷史建築","desc":"嘉義忠孝路上的古廟祀奉張巡與許遠，兩人是唐代安史之亂中守衛睢陽的將領。地方相傳這是諸羅山較早的漢人廟宇，因此有「諸羅山首廟」的稱呼。","area":"東區・嘉義市","ph":"文"},{"id":1210,"name":"中央噴水池","lat":23.47994,"lng":120.44969,"cat":"scenic","desc":"許世賢擔任嘉義市長時興建的噴水池，從圓環中央噴出高低變換的水柱，夜裡還會亮起彩燈。選舉前夕人群曾在這裡集結，也讓圓環成為市民熟悉的政治地標。","area":"西區・嘉義市"},{"id":1211,"name":"中正公園","lat":23.48169,"lng":120.44781,"cat":"nature","desc":"嘉義市中心這塊土地，曾是洪雅族諸羅山社公署、清代外教場與日治時期的公會堂。成為公園後，名人雕像錯落園中，也是市民欣賞戶外表演的地方。","area":"西區・嘉義市"},{"id":1212,"name":"劉厝里百年老樹","lat":23.46711,"lng":120.41558,"cat":"scenic","desc":"劉厝里公墓附近的老鳥榕，樹形自然而然撐成一把大傘，樹齡估計約兩百年。居民尊稱老樹為萬靈公，並在樹旁整理環境、組成廟務管理委員會。","area":"西區・嘉義市"},{"id":1213,"name":"北回歸線標誌","lat":23.46615,"lng":120.4256,"cat":"other","desc":"嘉義博愛路與世賢路口，並立著六座呈現歷年造型的北回歸線標誌。這組地標在二〇〇四年夏至啟用，讓人從城市街角認識北溫帶與熱帶的分界。","area":"西區・嘉義市"},{"id":1214,"name":"北香湖公園","lat":23.49356,"lng":120.44456,"cat":"nature","desc":"嘉義西區以林業文化為主題的公園，藉北香湖重現諸羅八景中的「北香秋荷」。湖畔廣植喬木與灌木，綠地也和附近的博愛公園、埤子頭植物園相接。","area":"西區・嘉義市"},{"id":1215,"name":"原南國運送店","lat":23.48303,"lng":120.443527,"cat":"history","tag":"歷史建築","desc":"北興街的老店面曾是運送業者的辦公處，文獻中留下「南國」與「丸嘉」兩個名稱。位置正好在臺鐵、林鐵和糖鐵交會之處，呼應當地運糖、運材的往事。","area":"西區・嘉義市","ph":"文"},{"id":1216,"name":"原嘉義郡水利組合之水閘門及水道","lat":23.480732,"lng":120.424874,"cat":"history","tag":"歷史建築","desc":"竹圍子一帶的水閘門與水道，是日治時期嘉義郡水利組合留下的灌溉設施。圓拱中央的金屬機具用來升降閘門，門上還刻著組合名稱和興建年月。","area":"西區・嘉義市","ph":"文"},{"id":1217,"name":"原嘉義酒廠","lat":23.477176,"lng":120.44006,"cat":"history","tag":"歷史建築","desc":"日治時期，赤司初太郎在嘉義創設大正製酒工場，後來因酒類專賣改由官方接手。從民間酒廠到專賣局工場，這處舊址記錄了臺灣製酒業制度的轉變。","area":"西區・嘉義市","ph":"文"},{"id":1218,"name":"原植松木行","lat":23.48434,"lng":120.44743,"cat":"history","tag":"歷史建築","desc":"阿里山林業發展帶動嘉義木材生意，植松便是當時在此營業的日資木行之一。兩層樓房舍以磚木混合建成，外牆覆雨淋板，細木條交錯成窗格。","area":"西區・嘉義市","ph":"文"},{"id":1219,"name":"嘉義之心願景館","lat":23.47931,"lng":120.44181,"cat":"culture","desc":"嘉義火車站前的舊臺汽客運站，改成介紹鐵路高架化的社區工作站與願景館。英文館名沿用車站的意象，延續人們來此聚集、交換消息的空間用途。","area":"西區・嘉義市"},{"id":1220,"name":"嘉義市北社尾王姓宗祠","lat":23.494632,"lng":120.42384,"cat":"worship","tag":"歷史建築","desc":"清代來臺開墾的王氏家族，於日治時期在北社尾建起宗祠。正殿兩側書卷形窗戶裡，工匠以水泥捏出竹節作為窗櫺，上方另有泥塑和剪黏裝飾。","area":"西區・嘉義市","ph":"文"},{"id":1221,"name":"嘉義市立美術館","lat":23.47681,"lng":120.44069,"cat":"culture","desc":"昔日菸酒專賣機關的廳舍成了美術館的古蹟館區，樓梯間還看得見八角形的柱子。新空間則在大廳使用集成材樑柱，呼應嘉義作為木材之都的歷史。","area":"西區・嘉義市"},{"id":1222,"name":"嘉義市身心障礙綜合園區─再耕園","lat":23.47222,"lng":120.42807,"cat":"culture","desc":"嘉義市為身心障礙者設立的園區，把職業評量、訓練與福利諮詢集中在一起。除了規劃生涯轉銜，也設有庇護工場和商店，讓培訓能連結到工作現場。","area":"西區・嘉義市"},{"id":1223,"name":"嘉義慈濟宮","lat":23.480434,"lng":120.448947,"cat":"worship","tag":"歷史建築","desc":"嘉義國華街巷內的廟宇，清代由地方人士募資興建，早年祭祀鄭國姓公與清水祖師。如今主祀五府千歲，廟史也和嘉義家將的起源相連。","area":"西區・嘉義市","ph":"文"},{"id":1224,"name":"嘉義火車站","lat":23.479112,"lng":120.441123,"cat":"history","tag":"古蹟","desc":"現存站房是一九三三年改建的樣貌，寬敞的大廳和候車室回應了當年逐漸增加的旅客。這裡串起縱貫鐵路與阿里山森林鐵路，早年也匯集木材與蔗糖運輸。","area":"西區・嘉義市","ph":"文"},{"id":1225,"name":"嘉義西門長老教會禮拜堂","lat":23.473207,"lng":120.447472,"cat":"worship","tag":"古蹟","desc":"垂楊路的老禮拜堂建於一九四一年，前身是日本基督教團的嘉義教會。黑色雨淋板外牆襯著白窗框，正面塔樓頂端的木十字架點出建築的用途。","area":"西區・嘉義市","ph":"文"},{"id":1226,"name":"大溪厝水環境教育園區","lat":23.48019,"lng":120.40119,"cat":"culture","desc":"紫微宮旁原有的荒地，整理成兼顧水質淨化和生態教學的公園。地底有處理水質的設施，地面則有人工濕地和賞鳥亭，可以從不同角度認識水岸環境。","area":"西區・嘉義市"},{"id":1227,"name":"新嘉義座/阮劇團","lat":23.47527,"lng":120.4385,"cat":"culture","desc":"嘉義舊酒廠原來製作高粱酒麴的樓層，由阮劇團在二〇一八年改為展演空間。場館沿用「嘉義座」的名字，讓昔日釀酒的老廠房有了戲劇與放映的新用途。","area":"西區・嘉義市","ph":"觀"},{"id":1228,"name":"港坪運動公園","lat":23.477,"lng":120.42213,"cat":"nature","desc":"嘉義市立運動公園因坐落港坪里，也被居民稱作港坪運動公園。球場之外還有溜冰場、極限運動場和兒童遊戲空間，一家人能在園內各自找到伸展身手的地方。","area":"西區・嘉義市"},{"id":1229,"name":"紅毛井","lat":23.477848,"lng":120.454453,"cat":"history","tag":"歷史建築","desc":"蘭井街上的古井可追溯至荷蘭時期，推測開鑿於十七世紀中葉。當時派駐諸羅山社一帶的人員逐漸增多，居民生活所需的用水也成了鑿井的緣由。","area":"西區・嘉義市","ph":"文"},{"id":1230,"name":"臺灣花磚博物館","lat":23.48331,"lng":120.44606,"cat":"culture","desc":"嘉義這間博物館專門收藏臺灣花磚，從老宅拆卸、搶救的磚片經修復後得以展出。從一片片花紋可以想見，早年富戶如何藉這些小巧的裝飾妝點門宅。","area":"西區・嘉義市"},{"id":1231,"name":"菸酒公賣局嘉義分局","lat":23.476893,"lng":120.440514,"cat":"history","tag":"古蹟","desc":"日治時期的專賣局嘉義支局，曾在這座廳舍處理地方專賣業務。建築轉角做成圓弧，外牆以洗石子和橫紋面磚劃出水平線條，旁邊另有昔日門市與酒庫。","area":"西區・嘉義市","ph":"文"},{"id":1232,"name":"中埔遊客中心","lat":23.40069,"lng":120.51207,"cat":"other","desc":"這裡原是中埔鄉立幼稚園的圓山分班，地方孩子曾在此上課。後來學齡人數減少，孩子轉往鄰近幼兒園，空出的校舍也改成了迎接旅人的遊客中心。","area":"中埔鄉・嘉義縣","ph":"觀"},{"id":1233,"name":"吳鳳廟","lat":23.446005,"lng":120.541276,"cat":"worship","tag":"古蹟","desc":"紀念吳鳳的廟宇以五岳朝天式山牆作入口牌樓，門內是一大片樹蔭與步道。拜殿、正殿和後方廂房圍出祭祀空間，另有記錄地方歷史的文物展示室和碑亭。","area":"中埔鄉・嘉義縣","ph":"文"},{"id":1234,"name":"道將圳赤蘭溪導水路竣功記念碑","lat":23.439935,"lng":120.483145,"cat":"history","tag":"歷史建築","desc":"嘉義的農田早年便由道將圳引水灌溉。中埔這座紀念碑記下赤蘭溪導水路的完工，也留下老水圳的一段歷史。","area":"中埔鄉・嘉義縣","ph":"文"},{"id":1235,"name":"六腳陳港宅第","lat":23.508629,"lng":120.31054,"cat":"history","tag":"歷史建築","desc":"六腳這處宅第的主人陳港，曾擔任灣內保甲聯合會長。後代也先後在六腳、蒜頭的農會與嘉南農田水利會任職，家族歷史牽連地方農業與水利。","area":"六腳鄉・嘉義縣","ph":"文"},{"id":1236,"name":"蒜頭糖廠五分車站","lat":23.479672,"lng":120.299674,"cat":"history","tag":"古蹟","desc":"早年的蒜頭糖廠從灣內、田尾等地收集甘蔗，五分車站是糖業運輸留下的建築。木造站房建於一九三〇年，裡頭分成候車室與辦公室兩個空間。","area":"六腳鄉・嘉義縣","ph":"文"},{"id":1237,"name":"蒜頭糖廠文化景觀","lat":23.479459,"lng":120.29971,"cat":"history","tag":"文化景觀","desc":"日治時期的蒜頭糖廠曾是明治製糖的重要生產據點，製糖工作延續多年。廠區保留製糖、倉儲、運輸設施與員工宿舍，可以一起看見生產和生活的空間。","area":"六腳鄉・嘉義縣","ph":"文"},{"id":1238,"name":"大埔情人公園","lat":23.30197,"lng":120.58939,"cat":"nature","desc":"曾文水庫東北角的湖岸公園，用心形拱門迎接前來散步的人。沿著園路可見巨型玫瑰花束、香水瓶等裝置，連旅遊資訊站也用粉紅色呼應玫瑰主題。","area":"大埔鄉・嘉義縣","ph":"觀"},{"id":1239,"name":"大埔鄉北極殿","lat":23.29915,"lng":120.59421,"cat":"worship","desc":"早年遷來大埔的漳州移民，把隨身攜帶的玄天上帝香火留下。清乾隆年間，庄長黃阿斜籌建廟宇，從此成為大埔居民共同祭拜北極玄天上帝的地方。","area":"大埔鄉・嘉義縣","ph":"觀"},{"id":1240,"name":"大林慢城發展協會","lat":23.60219,"lng":120.45463,"cat":"culture","desc":"大林舊稱大埔林，許多帶「林」的地名還留著昔日森林的記憶。地方發展協會把萬國戲院、中藥文物館和老街屋串成散步路線，從店家與老建築認識小鎮。","area":"大林鎮・嘉義縣","ph":"觀"},{"id":1241,"name":"大林濟陽衍派街屋","lat":23.602359,"lng":120.455153,"cat":"structure","tag":"歷史建築","desc":"大林鎮留存著這棟日治時期的傳統街屋。鎮上同一時期的街屋已經少見，這裡還看得到當年的建築樣貌。","area":"大林鎮・嘉義縣","ph":"文"},{"id":1242,"name":"大林萬國戲院","lat":23.602452,"lng":120.456471,"cat":"culture","tag":"歷史建築","desc":"大林戲院興盛的年代，樊家從經營大林戲院起步，後又興建萬國戲院。地方人士贈送的「客滿」匾額與營業證書，留下小鎮戲院開張和經營的見證。","area":"大林鎮・嘉義縣","ph":"文"},{"id":1243,"name":"原太保庄役場","lat":23.458967,"lng":120.332348,"cat":"history","tag":"歷史建築","desc":"日治時期，太保庄的行政機關曾在這棟建物辦公。從這處舊庄役場，可以追溯太保地方政府的辦公空間，以及庄級行政制度在當地留下的痕跡。","area":"太保市・嘉義縣","ph":"文"},{"id":1244,"name":"故宮博物院-南部院區","lat":23.47313,"lng":120.29272,"cat":"worship","desc":"國立故宮博物院的南部院區於二〇一五年底啟用。設立這座院區的初衷，是讓南北兩地居民都有機會親近博物院，分享文化資源。","area":"太保市・嘉義縣","ph":"觀"},{"id":1245,"name":"1920美漾森林","lat":23.34604,"lng":120.12902,"cat":"scenic","desc":"這片海岸森林主要由木麻黃、水黃皮和銀合歡組成，周圍還有濕地環境。鄰近地區生活著多種脊椎動物，共同構成海岸林與濕地的生態。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1246,"name":"好美船屋(好美農漁產)","lat":23.33687,"lng":120.13972,"cat":"culture","desc":"布袋這棟船屋把房子做成了大船的模樣，從外觀就能看出它和海洋的關係。船屋裡說的，也是這片海的歷史故事。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1247,"name":"好美里3D彩繪村","lat":23.33847,"lng":120.13777,"cat":"culture","desc":"布袋的好美里早年稱作魍港，聚落裡的散步小徑如今以立體彩繪串起。藝術家曾進成與居民共同創作，讓平面的圖畫在街巷間產生立體的視覺趣味。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1248,"name":"布袋543故事館","lat":23.37784,"lng":120.15683,"cat":"culture","desc":"故事館前身是布袋留置所，當地居民習慣叫它「海關」。門口的「布袋嘴」裝置取自地方舊名，館內則透過藝術策展述說布袋的歷史變化與居民生活。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1249,"name":"布袋嘉應廟","lat":23.37807,"lng":120.15736,"cat":"worship","desc":"布袋鎮裡有兩座同名的嘉應廟，各自延續不同的祭祀習俗。這一座以燒王船聞名，另外一座則在新塭，每年以衝水路的方式迎接客王。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1250,"name":"布袋蔡家古厝","lat":23.378447,"lng":120.159884,"cat":"history","tag":"歷史建築","desc":"布袋昔日繁榮時，鎮上曾有好幾座以硓咕石築成的古厝，許多後來只剩殘壁。蔡家的老宅仍保有完整面貌，是嘉義地區少見的硓咕石民宅。","area":"布袋鎮・嘉義縣","ph":"文"},{"id":1251,"name":"新來源醬園","lat":23.38455,"lng":120.17032,"cat":"other","desc":"布袋早年靠近曬鹽場，取得釀醬所需的鹽十分方便，周邊因而聚集許多醬油作坊。隨產業改變，這家老醬園仍沿用手工釀造，延續鹽鄉的醬油滋味。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1252,"name":"新塭嘉應廟","lat":23.327,"lng":120.16042,"cat":"worship","desc":"新塭漁民出海祈求平安，常到廟裡祭拜九龍三公王爺。「三公」指的是南宋末年的魏天忠、父親魏國佐和祖父魏了翁，是一家三代共同受祀。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1253,"name":"新岑公園","lat":23.34277,"lng":120.17251,"cat":"nature","desc":"南布袋濕地邊的這座公園，是觀察黑面琵鷺與其他候鳥的地方。步道沿著防風林延伸，林邊的賞鳥牆讓人能隔著一段距離，安靜觀看鳥群活動。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1254,"name":"洲南鹽場","lat":23.38393,"lng":120.16737,"cat":"culture","desc":"布袋一八二四年開闢的鹽場，至今仍有部分鹽田延續天日曬鹽。其餘田區在停曬後逐漸形成濕地，冬候鳥也在這片昔日的產鹽地找到棲身之所。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1255,"name":"貞愛親王殿下御上陸紀念之碑","lat":23.378075,"lng":120.15685,"cat":"worship","tag":"歷史建築","desc":"日本曾為貞愛親王率艦自布袋口登陸一事立下長碑，碑身刻著紀念文字。戰後石碑被拉倒、埋入房屋地基，直到二〇〇二年才重新出土。","area":"布袋鎮・嘉義縣","ph":"文"},{"id":1256,"name":"高跟鞋教堂","lat":23.37779,"lng":120.14876,"cat":"worship","desc":"布袋海邊立著一隻藍色玻璃高跟鞋，鞋子本身就是一座建築。人們說的「高跟鞋教堂」，指的正是海濱這隻玻璃鞋。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1257,"name":"魍港太聖宮","lat":23.3385,"lng":120.13809,"cat":"worship","desc":"好美里漁民出海前會到廟裡向媽祖祈求平安，延續沿海聚落的信仰。宮內珍藏一尊有三百多年歷史的明代媽祖像，也吸引外地信眾前來祭拜。","area":"布袋鎮・嘉義縣","ph":"觀"},{"id":1258,"name":"六興宮","lat":23.510522,"lng":120.336399,"cat":"worship","tag":"古蹟","desc":"笨港水患後，將軍王得祿將三媽迎回溪北，後來又在自宅旁建廟奉祀。廟名取溪北等六個村庄共同興盛之意，宮內還留有「水德增光」匾額。","area":"新港鄉・嘉義縣","ph":"文"},{"id":1259,"name":"新港台糖復興鐵橋(原臺糖嘉北線五分仔鐵道暨北港溪鐵橋)","lat":23.569684,"lng":120.313473,"cat":"history","tag":"歷史建築","desc":"北港溪上這座長逾八百公尺的鐵橋，曾讓糖業五分車載著旅客和貨物往返。客運停辦後仍繼續運貨，橋上的鋼梁與一座座排架留下窄軌鐵路的身影。","area":"新港鄉・嘉義縣","ph":"文"},{"id":1260,"name":"新港大興宮","lat":23.557435,"lng":120.346551,"cat":"worship","tag":"古蹟","desc":"新港的老廟保存咸豐年間的「帝德化生」古匾，也留有捐資整修的碑記。嘉義接連發生地震、拜亭歪斜後，地方居民和商家再次集資重修。","area":"新港鄉・嘉義縣","ph":"文"},{"id":1261,"name":"新港奉天宮","lat":23.556524,"lng":120.347854,"cat":"worship","tag":"古蹟","desc":"昔日笨港商船往來頻繁，沿岸居民普遍敬奉媽祖。這座新南港街上的廟宇由遷來的居民建立，供奉天上聖母，延續舊港街庄的信仰。","area":"新港鄉・嘉義縣","ph":"文"},{"id":1262,"name":"板陶窯交趾剪黏工藝文化基地","lat":23.56531,"lng":120.32076,"cat":"culture","desc":"新港的工藝基地介紹兩種曾常見於廟宇的裝飾手藝。交趾陶以彩釉塑出生動人物，剪黏則由匠師把瓷片裁成所需形狀，再逐一貼在塑好的立體造型上。","area":"新港鄉・嘉義縣","ph":"觀"},{"id":1263,"name":"林開泰診療所舊宅","lat":23.557562,"lng":120.34724,"cat":"history","tag":"古蹟","desc":"林開泰自臺灣總督府醫學校畢業後，於一九一六年回新港街開設診療所。這處舊宅記錄了地方醫師返鄉行醫的經歷，也與其父林維朝的家族歷史相連。","area":"新港鄉・嘉義縣","ph":"文"},{"id":1264,"name":"笨港水仙宮","lat":23.561838,"lng":120.308896,"cat":"worship","tag":"古蹟","desc":"舊笨港是五穀與貨物集散的貿易港，商船往來也帶來多種信仰。嘉義與雲林交界的水仙宮奉祀水仙尊王大禹，留下居民與水路為鄰的生活記憶。","area":"新港鄉・嘉義縣","ph":"文"},{"id":1265,"name":"原朴子上水道頭文化景觀","lat":23.468828,"lng":120.248331,"cat":"history","tag":"文化景觀","desc":"朴子居民早年多仰賴井水，日治時期才在朴子溪旁的平地興建自來水設施。一九三五年開始供水後，市街有了較潔淨的水源，成套的水道設施也保留至今。","area":"朴子市・嘉義縣","ph":"文"},{"id":1266,"name":"朴子原東石神社","lat":23.464459,"lng":120.242475,"cat":"history","tag":"歷史建築","area":"朴子市・嘉義縣","ph":"文"},{"id":1267,"name":"朴子市刺繡文化館","lat":23.46805,"lng":120.2485,"cat":"culture","desc":"早年的朴子繡品從門簾、寢具到布袋戲偶的衣服都有，也供應歌仔戲戲服與新娘嫁妝。地方設立文化館、開辦研習班，讓這門曾經興盛的針線手藝繼續傳承。","area":"朴子市・嘉義縣","ph":"觀"},{"id":1268,"name":"朴子水道配水塔","lat":23.468424,"lng":120.25037,"cat":"history","tag":"古蹟","desc":"朴子早年冬季井水不足，建成以朴子溪為水源的上水道後，居民用水才有改善。配水塔帶有歐式風貌，塔架撐起圓形水槽，上頭還有鐘塔造型的裝飾。","area":"朴子市・嘉義縣","ph":"文"},{"id":1269,"name":"朴子配天宮","lat":23.4677,"lng":120.245301,"cat":"worship","tag":"古蹟","desc":"朴子的媽祖廟保有元宵賞花燈的傳統，也留著兩組匠師「對場作」的巧思。站在三川殿中央抬頭細看，左右木構與雕刻各有變化，能看出雙方不同的手藝。","area":"朴子市・嘉義縣","ph":"文"},{"id":1270,"name":"東石郡役所","lat":23.465189,"lng":120.246365,"cat":"history","tag":"古蹟","desc":"日治時期的東石郡役所兼辦地方行政與警務，兩層樓裡曾設事務室、大禮堂與扇形拘留所。老建築後來由朴子警察分局使用，立面仍可見西式柱頭與磚砌圓拱。","area":"朴子市・嘉義縣","ph":"文"},{"id":1271,"name":"牛挑灣吳杯初濟生病院","lat":23.41074,"lng":120.25301,"cat":"history","tag":"歷史建築","desc":"醫師吳杯初從臺灣總督府醫學校畢業後回到牛挑灣，在一九二八年創設西式診所。兩層磚造洋樓也兼作家宅，前廊由四柱撐起，樓上另有露臺。","area":"朴子市・嘉義縣","ph":"文"},{"id":1272,"name":"向禾休閒漁場","lat":23.50901,"lng":120.16073,"cat":"other","area":"東石鄉・嘉義縣","ph":"觀"},{"id":1273,"name":"東石先天宮","lat":23.45696,"lng":120.14901,"cat":"worship","desc":"東石港邊的廟宇面海而建，雄偉的殿宇與漁村生活相伴已有三百多年。當地漁民長年在此祭拜，讓這座臨海老廟成為港邊的信仰中心。","area":"東石鄉・嘉義縣","ph":"觀"},{"id":1274,"name":"東石漁人碼頭","lat":23.44876,"lng":120.13527,"cat":"other","desc":"從岸邊望向東石的漁港，最容易認出的就是港邊的彩色小屋。各色屋舍聚在一起，為眼前的碼頭添上一片鮮明色彩。","area":"東石鄉・嘉義縣","ph":"觀"},{"id":1275,"name":"東石蔦松許宅","lat":23.456717,"lng":120.150555,"cat":"history","tag":"歷史建築","desc":"蔦松湖底的許氏宅院分前後兩落，由曾任庄長的許能春與兒子許雹分別建造。前落五開間正身和兩側護龍分開，圍出一片寬廣的前埕。","area":"東石鄉・嘉義縣","ph":"文"},{"id":1276,"name":"白水湖","lat":23.40436,"lng":120.152,"cat":"scenic","desc":"東石的白水湖原是曬鹽的鹽埕，地名要從擋海的堤防說起。早年颱風來時，未築牢的海堤容易崩壞，海水倒灌，從鹽田望去就像一片白色浪花。","area":"東石鄉・嘉義縣","ph":"觀"},{"id":1277,"name":"鰲鼓濕地森林園區","lat":23.507984,"lng":120.160605,"cat":"nature","desc":"台糖曾填海造陸，在鰲鼓耕種甘蔗、經營漁牧。低窪農地與魚塭後來因地層下陷、雨水蓄積而變成濕地，如今為候鳥與留鳥提供棲息空間。","area":"東石鄉・嘉義縣","ph":"觀"},{"id":1278,"name":"1314觀景台","lat":23.55954,"lng":120.67905,"cat":"scenic","desc":"海鼠山頂加上平台高度正好是一千三百一十四公尺，名字也因此有「一生一世」的意思。四周茶園隨山勢綿延，天候合適時還可看見日出或雲海。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1279,"name":"三元宮","lat":23.56194,"lng":120.60428,"cat":"worship","desc":"梅山太平村的這座廟坐落在海拔約一千公尺的山區，是村民共同的信仰中心。一九七六年遷到現址重建，寬廣的殿宇從此陪伴山村居民的生活。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1280,"name":"千年蝙蝠洞","lat":23.53523,"lng":120.66398,"cat":"scenic","desc":"燕子崖上方的岩層一路延伸，構成了蝙蝠洞所在的岩壁。這面連綿兩百多公尺的石壁，也是辨認這處地景與隔鄰山崖關係的線索。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1281,"name":"南天巨屏","lat":23.55415,"lng":120.67184,"cat":"scenic","desc":"瑞峰村的砂岩峭壁高約六十公尺，橫向綿延約兩百公尺，像一道天然屏風。冬季北風吹來時，高聳的岩壁還能為後方村落擋風，是瑞峰十景之一。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1282,"name":"古磨坊毛樹溪吊橋古蹟","lat":23.54994,"lng":120.62259,"cat":"other","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1283,"name":"嚴禁匠民越界私墾碑","lat":23.566835,"lng":120.599672,"cat":"history","tag":"古蹟","desc":"梅山原是原住民族生活的地方，清代漢人入墾後，越界占地造成的衝突漸多。禁止匠民私自越界開墾的碑刻，記錄了當時官府如何劃界與管制土地。","area":"梅山鄉・嘉義縣","ph":"文"},{"id":1284,"name":"太平36彎眺景","lat":23.56305,"lng":120.59579,"cat":"other","desc":"從梅山往太平的山坡上，公路以一道道近半圈的大彎盤旋上升。望過路旁交錯生長的檳榔和龍眼樹，每轉一彎，就能換個方向看群山與平原。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1285,"name":"太平雲梯","lat":23.55971,"lng":120.60088,"cat":"scenic","desc":"梅山太平山與龜山之間，橫著一座長兩百八十一公尺的景觀吊橋。橋身所在的高度約海拔一千公尺，把兩座山頭之間的高空變成可以步行的空間。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1286,"name":"民番界碑","lat":23.56676,"lng":120.59975,"cat":"scenic","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1287,"name":"泰興巖","lat":23.54143,"lng":120.63452,"cat":"worship","desc":"梅山太興村的古廟主祀觀音佛祖，是當地重要的信仰中心。廟宇歷經歲月仍保有傳統建築藝術，因而登錄在嘉義縣的縣定古蹟之列。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1288,"name":"源興宮","lat":23.53928,"lng":120.67342,"cat":"worship","desc":"梅山瑞里的幼葉林聚落，百年來有一處居民共同的信仰中心。當地人所說的源興宮，就是守護幼葉林的這座廟。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1289,"name":"燕子崖","lat":23.53456,"lng":120.67237,"cat":"scenic","desc":"岩壁上的橫紋來自長年風蝕，細小孔洞排列其間，相傳燕子曾在這裡築巢。崖下山徑沿著凹壁通過，雨季水從崖頂瀉落，眼前就像多了一幅水簾。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1290,"name":"碧湖觀景台","lat":23.56857,"lng":120.62335,"cat":"scenic","desc":"碧鳳山上的觀景台位在碧湖茶園，向東可將瑞太一帶的村落、河谷與群峰收進眼底。轉向北方還能眺望草嶺潭遺址，晴朗時甚至望得見玉山主峰。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1291,"name":"綠色隧道","lat":23.5477,"lng":120.67485,"cat":"scenic","desc":"瑞里這條竹林間的小路原為農用道路，地方產業用得上，健行的人也喜歡循路散步。這裡曾作為武俠片場景，也曾在竹林間擺上茶席。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1292,"name":"雲之南道","lat":23.55867,"lng":120.60277,"cat":"scenic","desc":"太平雲梯出口另一側有條沿山腰上行的步道，全長約一點五公里。隨著山路緩緩轉彎，山坡上的茶園便逐漸展開，成了散步沿途的主要風景。","area":"梅山鄉・嘉義縣","ph":"觀"},{"id":1293,"name":"龍宮瀑布","lat":23.
