60855,"lng":121.50926,"cat":"history","tag":"歷史建築","desc":"陳天順家族曾擁有這棟店屋的前兩進，當地後來也有茶藝館。經營花生油時，三進空間依序作門市、倉庫與工廠，將生產和銷售連在一起。","area":"大同區・臺北市","ph":"文"},{"id":4091,"name":"迪化街1段278號店屋","lat":25.06093,"lng":121.509249,"cat":"culture","tag":"歷史建築","desc":"德振商號曾在這裡販售竹製生活用品，後來劉文裕行接著經營雜糧。再往後轉作南北貨店，見證迪化街商家依市場需求更換商品的歷史。","area":"大同區・臺北市","ph":"文"},{"id":4092,"name":"迪化街1段308號店屋（明善堂）","lat":25.061575,"lng":121.509158,"cat":"worship","tag":"歷史建築","desc":"清末原作店舖的街屋，後來在閣樓下設置神龕，成了宣講勸善的明善堂。在迪化街以街屋作宗教場所的例子不多，可見當地信仰融入生活的方式。","area":"大同區・臺北市","ph":"文"},{"id":4093,"name":"迪化街1段67號店屋","lat":25.05594,"lng":121.509992,"cat":"history","tag":"歷史建築","desc":"茂元中藥舖昔日在大稻埕頗有名氣，這棟街屋也曾為名醫郭火炎所有。郭雪湖的〈南街殷賑〉裡還能找到它，讓人對照畫作與真實街景。","area":"大同區・臺北市","ph":"文"},{"id":4094,"name":"迪化街1段79號店屋","lat":25.056219,"lng":121.510011,"cat":"history","tag":"歷史建築","desc":"吳家曾在這裡開設老春成，做和服與棉布生意，戰後又以捷利商行經營臺日貿易。房屋同時是家族住所，二樓廳堂保留了日常生活的痕跡。","area":"大同區・臺北市","ph":"文"},{"id":4095,"name":"迪化街1段85號店屋","lat":25.056377,"lng":121.509992,"cat":"history","tag":"歷史建築","desc":"這間街屋在日治時期屬黃姓地主，戰後幾度轉手。昭和年間的商工名錄記載，當時這裡開著一家名為太生儀的鐘錶店。","area":"大同區・臺北市","ph":"文"},{"id":4096,"name":"迪化街1段98號店屋","lat":25.056536,"lng":121.510255,"cat":"history","tag":"歷史建築","desc":"這棟街屋與相鄰兩戶，牽連著經營布業和鳳梨產業的謝、黃兩家。臺灣鳳梨公司創辦人之一謝成源，也把大稻埕的商業與罐頭外銷連在一起。","area":"大同區・臺北市","ph":"文"},{"id":4097,"name":"迪化街一段109號店屋","lat":25.05402,"lng":121.510101,"cat":"history","tag":"歷史建築","desc":"頂下郊拚後，林右藻帶人遷到大稻埕建屋，這裡是當年復振商號三連棟店屋的位置之一。商號落腳的歷史，也留下中街早期開發的線索。","area":"大同區・臺北市","ph":"文"},{"id":4098,"name":"迪化街一段114號店屋","lat":25.056611,"lng":121.509816,"cat":"history","tag":"歷史建築","desc":"這棟街屋的門面出自迪化街南街市區改正的年代。沿街觀察它保留下來的立面形式，可以認識一九一〇年代商街的建築審美。","area":"大同區・臺北市","ph":"文"},{"id":4099,"name":"迪化街一段116號店屋","lat":25.056661,"lng":121.509801,"cat":"history","tag":"歷史建築","desc":"南街的兩層店屋採四柱三窗立面，洗石子、泥塑與柱頭裝飾並列，騎樓下還有磚拱。原屋曾受鄰損而改建，今日外觀則依早年樣貌重建。","area":"大同區・臺北市","ph":"文"},{"id":4100,"name":"迪化街一段123、125號（原怡和泰商行IWATAI）","lat":25.057485,"lng":121.509857,"cat":"history","tag":"歷史建築","desc":"大稻埕米商陳得貴在中街創建怡和泰商行，與莊輝玉、郭烏隆被當地人合稱「三仙」。三位商人的店屋都在中街，留下日治時期米商聚集的街景。","area":"大同區・臺北市","ph":"文"},{"id":4101,"name":"迪化街一段127號店屋","lat":25.057581,"lng":121.50985,"cat":"history","tag":"歷史建築","desc":"日治時期，迪化街中街聚集多家經營南北貨的大商號。這間店屋也是其中一處雜貨商行，保留了老街以批發買賣而興盛的歷史。","area":"大同區・臺北市","ph":"文"},{"id":4102,"name":"迪化街一段130號店屋","lat":25.057215,"lng":121.509716,"cat":"history","tag":"歷史建築","desc":"狹長的店屋中留著天井，後棟還有一座「秀樓」。古地圖顯示房子原在港仔溝小運河東側，從秀樓曾可遠望河岸。","area":"大同區・臺北市","ph":"文"},{"id":4103,"name":"迪化街一段132號店屋","lat":25.057505,"lng":121.509707,"cat":"history","tag":"歷史建築","desc":"這裡曾是文具貿易商周益芳的店屋，也與日治時期女性畫家周紅綢有關。二樓大廳和臥室保留早年的家具文物，留下商家日常的面貌。","area":"大同區・臺北市","ph":"文"},{"id":4104,"name":"迪化街一段207號店屋(原廣和堂藥舖)","lat":25.059525,"lng":121.50958,"cat":"worship","tag":"歷史建築","desc":"廣和堂藥舖所在的街屋，大正年間已登記為一棟土木造的兩層瓦房。戰後初期的建物紀錄仍列兩層，記下老藥舖早年的建築規模。","area":"大同區・臺北市","ph":"文"},{"id":4105,"name":"迪化街一段256號店屋","lat":25.060327,"lng":121.509299,"cat":"history","tag":"歷史建築","desc":"淡水河水門旁的老街屋幾度轉業，先由江家做棺木生意，再由陳家經營油漆行。李家後來在此賣南北貨，一處店面見證河港商業的變化。","area":"大同區・臺北市","ph":"文"},{"id":4106,"name":"迪化街一段270號店屋","lat":25.060782,"lng":121.509263,"cat":"history","tag":"歷史建築","desc":"大稻埕北段的普願街上，這棟兩層紅磚店屋以前後兩進相連。四柱三窗的仿洋樓立面下，推測曾是吳澄淇經營第一代和豐商行的地方。","area":"大同區・臺北市","ph":"文"},{"id":4107,"name":"迪化街一段284號店屋","lat":25.061066,"lng":121.509232,"cat":"history","tag":"歷史建築","desc":"陳天送曾在此經營源順商號，與日本長崎泰益號往來留下千餘封書信。店屋雖經整修，騎樓和沿街窗戶仍保有原先形式。","area":"大同區・臺北市","ph":"文"},{"id":4108,"name":"迪化街一段312巷4號","lat":25.061657,"lng":121.508966,"cat":"structure","tag":"歷史建築","desc":"這棟巷內街屋與鄰近六號原是同一建築，落成後才分成兩筆地號。門面共兩間、深度一進，仍能從外觀看出最初的配置。","area":"大同區・臺北市","ph":"文"},{"id":4109,"name":"迪化街一段312巷6號","lat":25.061664,"lng":121.508911,"cat":"structure","tag":"歷史建築","desc":"相鄰的四號與六號在一九一六年同時建成，原來共用一棟建築。房內以木作調整過隔間，外部立面和主體結構則保留早期樣貌。","area":"大同區・臺北市","ph":"文"},{"id":4110,"name":"迪化街一段329號店屋","lat":25.062524,"lng":121.509319,"cat":"history","tag":"歷史建築","desc":"日治時期大稻埕北段是米業中心，唐家的米行也在這裡落腳。店屋原與隔壁三三一號相通，連著的兩個門面留下米糧生意的規模。","area":"大同區・臺北市","ph":"文"},{"id":4111,"name":"迪化街一段339號店屋","lat":25.062773,"lng":121.50933,"cat":"history","tag":"歷史建築","desc":"這座日治時期的家宅在戰後曾租給中藥店，騎樓與二樓拱形磚牆仍屬舊構。抬頭可見圓木屋架，留下商業街上住宅建築的一面。","area":"大同區・臺北市","ph":"文"},{"id":4112,"name":"迪化街一段349號店屋","lat":25.062983,"lng":121.509336,"cat":"history","tag":"歷史建築","desc":"這間老店屋位處大稻埕北街的入口，從大橋頭一帶步行進入迪化街便會經過。它也是串起北側歷史街景、辨認老街起點的一棟建築。","area":"大同區・臺北市","ph":"文"},{"id":4113,"name":"迪化街一段372號店屋","lat":25.063006,"lng":121.50921,"cat":"history","tag":"歷史建築","desc":"原本排在中北街店屋之間的房子，因臺北橋改建拆除北側鄰屋，才變成街角。兩側厚牆用唭哩岸石砌成，仍可見日治時期的石作手藝。","area":"大同區・臺北市","ph":"文"},{"id":4114,"name":"迪化街一段46巷16號店屋","lat":25.05492,"lng":121.509569,"cat":"structure","tag":"歷史建築","desc":"這裡原是吳文秀經營良德茶行的地方，門前曾有小運河。日治時期旁邊就是永樂座，可想見茶商往來與戲院觀眾一同出現在巷口的日常。","area":"大同區・臺北市","ph":"文"},{"id":4115,"name":"迪化街一段84號店屋","lat":25.055883,"lng":121.509904,"cat":"history","tag":"歷史建築","desc":"兩層街屋前後分兩進，以過水相接，早年為瑞發商號，後來改經營中藥。在店面上方的山牆還能看到「林合益」的招牌。","area":"大同區・臺北市","ph":"文"},{"id":4116,"name":"迪化街一段87號店屋","lat":25.056412,"lng":121.509947,"cat":"history","tag":"歷史建築","desc":"德成藥行的店屋也是畫家陳德旺的出生地，把藥業與大稻埕畫壇連在一起。日治時期成立的美術團體也曾將事務所登記在這裡。","area":"大同區・臺北市","ph":"文"},{"id":4117,"name":"迪化街一段90號店屋","lat":25.056064,"lng":121.509832,"cat":"history","tag":"歷史建築","desc":"大稻埕這棟店屋曾先後用來開設藥行與經營貿易公司。從日治時期到戰後，產權幾度轉手，房屋用途也留下老街商業活動的歷史。","area":"大同區・臺北市","ph":"文"},{"id":4118,"name":"迪化街一段96號店屋","lat":25.056151,"lng":121.509871,"cat":"history","tag":"歷史建築","desc":"老屋推測原是清代閩南街屋，日治時期隨市區改正，改建成兩層牌樓厝。巴洛克式立面與地籍記載的磚造瓦房，一起記下街區外觀的轉變。","area":"大同區・臺北市","ph":"文"},{"id":4119,"name":"迪化街二段374號","lat":25.073241,"lng":121.512622,"cat":"history","tag":"歷史建築","desc":"日治時期的街屋外牆鑲著馬約利卡磚，是門面上值得留意的細節。這種裝飾從大正初期到昭和初期頗為流行，也成為臺灣老街屋的特色。","area":"大同區・臺北市","ph":"文"},{"id":4120,"name":"迪化街年貨大街","lat":25.05491,"lng":121.51032,"cat":"structure","desc":"大稻埕的老街以南北乾貨、中藥材、布匹與茶葉聞名，年節採買時尤為熱鬧。沿街仰望，清末至日治時期的店屋把西式裝飾與本地建材組合在一起。","area":"大同區・臺北市","ph":"觀"},{"id":4121,"name":"鄭州路26巷7號","lat":25.049379,"lng":121.509582,"cat":"structure","tag":"歷史建築","desc":"鄭州路巷內的建物日治時期曾作訓練所，戰後改供黨部辦公。鄰近另一處建物也曾作鐵路黨部禮堂，共同留下這片街區的機構活動史。","area":"大同區・臺北市","ph":"文"},{"id":4122,"name":"重慶北路3段283巷1號（大龍峒四十四坎店屋二落）","lat":25.072776,"lng":121.514004,"cat":"structure","tag":"歷史建築","area":"大同區・臺北市","ph":"文"},{"id":4123,"name":"鐵道部臺北工場車輛修理工場","lat":25.049775,"lng":121.510679,"cat":"history","tag":"古蹟","desc":"北門外的機械工場可追溯至清末劉銘傳設立的機器局，當時已在此製造機械、修理火車。日治時期納入鐵道部，延續了鐵路維修的用途。","area":"大同區・臺北市","ph":"文"},{"id":4124,"name":"陳天來故居","lat":25.056009,"lng":121.508491,"cat":"history","tag":"古蹟","desc":"大稻埕茶商陳天來在一九二〇年代興建這座住宅，供家族起居。往來做生意的客商也在此受招待，家宅因而兼有茶商交際的功能。","area":"大同區・臺北市","ph":"文"},{"id":4125,"name":"陳德星堂","lat":25.055511,"lng":121.515864,"cat":"worship","tag":"古蹟","desc":"臺北陳氏大宗祠原在府城內，日治時期換地遷往大稻埕重建。匠師陳應彬設計的前殿有重簷歇山頂，木構與斗拱都是細看的重點。","area":"大同區・臺北市","ph":"文"},{"id":4126,"name":"陳悅記祖宅(老師府)","lat":25.075541,"lng":121.511934,"cat":"history","tag":"古蹟","desc":"同安移民陳遜言在大龍峒港仔墘蓋起公媽廳，是這座祖宅的起點。陳家經商之餘也興辦文教，家族的發展和大龍峒早年的科舉風氣相連。","area":"大同區・臺北市","ph":"文"},{"id":4127,"name":"黑美人大酒家","lat":25.054072,"lng":121.511844,"cat":"history","tag":"歷史建築","desc":"這棟約建於一九三〇年代的酒家，外牆以磚砌成，屋頂覆黑瓦。當年大稻埕在風災後推行磚瓦建築，這類材料也成了街屋的共同風貌。","area":"大同區・臺北市","ph":"文"},{"id":4128,"name":"下內埔營舍","lat":25.020939,"lng":121.545461,"cat":"history","tag":"歷史建築","desc":"戰後的單層磚木營舍以魚鱗狀木板建造，原供聯勤單位使用。裝甲部隊移防後，營區陸續轉為軍官與單身退伍軍人的住所。","area":"大安區・臺北市","ph":"文"},{"id":4129,"name":"傅園","lat":25.016344,"lng":121.533764,"cat":"history","tag":"古蹟","desc":"臺大校園裡紀念傅斯年的園地，與這位歷史學家及教育家的生平相連。園中建築採西方古典形式，可見取自古希臘多立克式的設計。","area":"大安區・臺北市","ph":"文"},{"id":4130,"name":"僑光堂","lat":25.015242,"lng":121.537556,"cat":"worship","tag":"歷史建築","desc":"這座會堂在一九六七年落成，曾是臺灣與海外華僑舉辦聯繫活動的集會中心。從其早期用途，可認識臺灣推動僑務與僑教的背景。","area":"大安區・臺北市","ph":"文"},{"id":4131,"name":"六張犁高氏古厝","lat":25.021719,"lng":121.553667,"cat":"history","tag":"歷史建築","desc":"清代中葉的三合院保留泉州安溪風格，石門檻、燕尾屋脊與出簷斗拱各有特色。除部分磚造牆面，屋身多處仍能看見土埆壁。","area":"大安區・臺北市","ph":"文"},{"id":4132,"name":"原臺北刑務所官舍","lat":25.030618,"lng":121.524653,"cat":"history","tag":"歷史建築","desc":"這組官舍原供臺北刑務所的獄政管理人員居住，與監所周邊配置屬同一時期。從職員居住的空間，也可認識早期監所日常運作的一面。","area":"大安區・臺北市","ph":"文"},{"id":4133,"name":"原臺灣總督府殖產局營林所臺北出張所","lat":25.029398,"lng":121.523988,"cat":"history","tag":"歷史建築","desc":"這棟營林所臺北出張所的建築，曾經是林務局員工生活起居的宿舍。後來房子改作倉庫，從住人的地方變成儲物的空間。","area":"大安區・臺北市","ph":"文"},{"id":4134,"name":"和平東路1段187號","lat":25.026489,"lng":121.533362,"cat":"history","tag":"歷史建築","desc":"和平東路一段這一帶，保留有約建於一九三〇年代的日式住宅。從仍然完整的建築形式，可以辨認日治時期留在街區的居住樣貌。","area":"大安區・臺北市","ph":"文"},{"id":4135,"name":"和平東路2段18巷10號","lat":25.024822,"lng":121.535841,"cat":"structure","tag":"歷史建築","desc":"這棟房屋坐落在日治時期錦小學校的北側。周圍的街地推測是因學校建設而開發，從房屋位置可看見街坊與校園的歷史關係。","area":"大安區・臺北市","ph":"文"},{"id":4136,"name":"大安十二甲東門住宅利用信用購買組合房舍","lat":25.031518,"lng":121.530212,"cat":"history","tag":"歷史建築","area":"大安區・臺北市","ph":"文"},{"id":4137,"name":"大安森林公園","lat":25.03244,"lng":121.5349,"cat":"nature","desc":"大安區市中心的公園有大片樹林與自然水池，入口花壇種著草花和觀葉植物。往南的竹林可辨認葫蘆竹、金絲竹與四方竹等不同種類。","area":"大安區・臺北市","ph":"觀"},{"id":4138,"name":"大院子","lat":25.024134,"lng":121.532339,"cat":"culture","desc":"原為臺灣大學公共宿舍的建築群，附近居民習慣稱作「大院子」。宿舍經火災後歷時三年多修復，重新開放時也沿用了這個地方稱呼。","area":"大安區・臺北市","ph":"觀"},{"id":4139,"name":"天主教台北聖家堂","lat":25.02888,"lng":121.53395,"cat":"worship","desc":"大安森林公園對面的天主教堂，從上方看可辨認十字架形的平面。新生南路還聚集清真寺與其他基督宗教教堂，沿街形成多種信仰並存的風貌。","area":"大安區・臺北市","ph":"觀"},{"id":4140,"name":"富陽自然生態公園","lat":25.01672,"lng":121.5575,"cat":"nature","desc":"富陽街底的綠地從日治時期就被用來存放彈藥，戰後也曾有國軍駐守。軍隊撤出後，山林逐漸轉作公園，留下軍事用地轉型為自然園地的歷程。","area":"大安區・臺北市","ph":"觀"},{"id":4141,"name":"敦安公園","lat":25.03449,"lng":121.55382,"cat":"nature","desc":"敦煌里的住宅圍繞著這座小公園，附近也有幼兒園。早上是居民團體做氣功與韻律操的場地，後來換孩子們活動，呈現鄰里公園的日常節奏。","area":"大安區・臺北市","ph":"觀"},{"id":4142,"name":"文昌街_家具街","lat":25.0322,"lng":121.55647,"cat":"structure","desc":"信義路與臨江街之間的家具街，早年多是木材、五金與水泥建材行。曾有師傅直接在門口釘沙發，後來更多家具業者遷入，才形成今日街景。","area":"大安區・臺北市","ph":"觀"},{"id":4143,"name":"月涵堂","lat":25.030024,"lng":121.526171,"cat":"worship","tag":"歷史建築","desc":"清華校友為紀念校長梅貽琦發起興建這座會堂，也用作清華大學臺北辦事處。其形式反映一九六〇年代現代建築思潮在臺灣的發展。","area":"大安區・臺北市","ph":"文"},{"id":4144,"name":"東區地下街","lat":25.04169,"lng":121.54646,"cat":"structure","desc":"忠孝復興與忠孝敦化之間的地下長廊，沿途串連七座廣場。從服飾、飾品與生活雜貨到電子產品、餐飲，可以一路看見東區商街的不同面貌。","area":"大安區・臺北市","ph":"觀"},{"id":4145,"name":"梁實秋故居","lat":25.023766,"lng":121.527861,"cat":"history","tag":"歷史建築","desc":"作家梁實秋擔任臺師大英語系主任時，住在這棟獨立的單層木屋。住宅原是日治時期的高等官舍，後來納入師大教師宿舍使用。","area":"大安區・臺北市","ph":"文"},{"id":4146,"name":"殷海光故居","lat":25.024183,"lng":121.531995,"cat":"culture","tag":"古蹟","desc":"溫州街綠意濃密的巷弄曾聚居多位臺大學者，殷海光也曾在此生活。這位自由主義思想家長期批評威權政治，故居記下戰後知識分子的處境。","area":"大安區・臺北市","ph":"文"},{"id":4147,"name":"清真寺","lat":25.027934,"lng":121.534195,"cat":"worship","tag":"古蹟","desc":"新生南路的清真寺由外交部長葉公超倡議，並獲伊斯蘭國家的資助興建。它回應在臺穆斯林的信仰需求，也留下戰後臺灣對外交往的歷史。","area":"大安區・臺北市","ph":"文"},{"id":4148,"name":"溫州街22巷6、8號","lat":25.023755,"lng":121.532481,"cat":"structure","tag":"歷史建築","desc":"溫州街這組官舍在一九三〇年竣工，撥供臺北帝國大學職員與家眷居住。兩戶相連的門牌，也是原有宿舍群保存下來的一部分。","area":"大安區・臺北市","ph":"文"},{"id":4149,"name":"濟南路3段50號（省長臺北官邸）","lat":25.040132,"lng":121.536017,"cat":"history","tag":"歷史建築","desc":"濟南路上的省長官邸是一棟戰後興建的兩層獨立住宅，採加強磚造構造。基地對面曾有聯合國發展方案辦事處，留下冷戰年代街區的國際往來記憶。","area":"大安區・臺北市","ph":"文"},{"id":4150,"name":"福州山公園","lat":25.01601,"lng":121.55484,"cat":"nature","desc":"辛亥路與臥龍街旁的山坡，整理時盡量保留原有地形與風貌。園內依山友意見增設涼亭，讓散步的人能在串連的綠地間坐下歇腳。","area":"大安區・臺北市","ph":"觀"},{"id":4151,"name":"空軍總司令部(原臺灣總督府工業研究所)","lat":25.039168,"lng":121.539854,"cat":"history","tag":"古蹟","desc":"大安十二甲的空軍總部舊址，原是日治時期規劃的工業研究基地。廳舍之外還設計了電氣、發酵與機械等工場，可看出研究與生產相連的格局。","area":"大安區・臺北市","ph":"文"},{"id":4152,"name":"紫藤廬","lat":25.02462,"lng":121.534306,"cat":"history","tag":"古蹟","desc":"新生南路巷內的日式木屋原為中級官員宿舍，獨門獨院。戰後周德偉在此居住，後代將宅院改為茶藝館，老屋也從私人住家轉成會客飲茶的地方。","area":"大安區・臺北市","ph":"文"},{"id":4153,"name":"義芳居古厝","lat":25.011512,"lng":121.547304,"cat":"history","tag":"古蹟","desc":"清光緒年間，陳朝來在下內埔庄興建這處宅第。屋址靠著蟾蜍山、芳蘭山與中埔山相連的山腳，留下臺北盆地邊緣早期聚落的風貌。","area":"大安區・臺北市","ph":"文"},{"id":4154,"name":"臺北市福景宮","lat":25.029709,"lng":121.557172,"cat":"worship","tag":"歷史建築","desc":"日治末期，劉良同發起鄉里居民集力興建土地公廟，主祀福德正神。後來信徒購下廟地、整修宮貌並增建辦公空間，形成今日格局。","area":"大安區・臺北市","ph":"文"},{"id":4155,"name":"臺大昆蟲館","lat":25.011296,"lng":121.54053,"cat":"culture","tag":"古蹟","desc":"這棟館舍與早年農業試驗所的昆蟲研究有關，原以農作物相關昆蟲為研究對象。後來納入臺大昆蟲系使用，還設有收存昆蟲的標本室。","area":"大安區・臺北市","ph":"文"},{"id":4156,"name":"臺大農業陳列館","lat":25.018653,"lng":121.539726,"cat":"culture","tag":"歷史建築","desc":"臺大校園裡的「洞洞館」建於戰後，設計以象徵手法呈現中國建築意象。和校園原有的日治時期歐式建築並看，能辨認不同年代的建築語彙。","area":"大安區・臺北市","ph":"文"},{"id":4157,"name":"芳蘭大厝","lat":25.013467,"lng":121.547946,"cat":"history","tag":"古蹟","desc":"泉州安溪陳家在清嘉慶年間興建這棟山腳三合院，後代又陸續蓋起玉芳居與義芳居。它是臺北盆地近山地帶少數留下的清代宅院之一。","area":"大安區・臺北市","ph":"文"},{"id":4158,"name":"虹廬","lat":25.040107,"lng":121.534166,"cat":"history","tag":"歷史建築","desc":"建築師王大閎約在一九六四年設計了這棟四層集合住宅。設計者自己也住在四樓，使這裡同時留下他的建築作品與個人生活足跡。","area":"大安區・臺北市","ph":"文"},{"id":4159,"name":"蟾蜍山","lat":25.0089,"lng":121.55253,"cat":"history","tag":"文化景觀","desc":"瑠公圳曾沿山腳供水，日治時期的農業機關又在坡地周邊興建廳舍與宿舍。戰後隨空軍指揮部設立，煥民新村也加入這片山腳聚落。","area":"大安區・臺北市","ph":"文"},{"id":4160,"name":"通化公園","lat":25.032233,"lng":121.554573,"cat":"nature","desc":"文昌街與通化街交會處的小公園，原以兩條街名各取一字稱為文通公園。外側是家具街，附近還有臨江街夜市，四周都是居民熟悉的商業街景。","area":"大安區・臺北市","ph":"觀"},{"id":4161,"name":"霧裡薛圳第二支線明渠","lat":25.025867,"lng":121.531644,"cat":"history","tag":"古蹟","area":"大安區・臺北市","ph":"文"},{"id":4162,"name":"青田街11巷1號","lat":25.027096,"lng":121.532144,"cat":"structure","tag":"歷史建築","desc":"這處獨棟木造宅院建於一九二九年，曾供臺北帝國大學教授今村完道一家居住。圍牆內有庭院，原有起居空間後來改作展覽與辦公使用。","area":"大安區・臺北市","ph":"文"},{"id":4163,"name":"青田街7巷8號","lat":25.028019,"lng":121.532832,"cat":"structure","tag":"歷史建築","desc":"這一帶的日式住家由臺北帝國大學與臺北高商的學者發起、自行出資興建。青田街七巷的住宅保有當時形式，後來也作為臺灣大學宿舍。","area":"大安區・臺北市","ph":"文"},{"id":4164,"name":"青田街8巷10號","lat":25.027512,"lng":121.531127,"cat":"structure","tag":"歷史建築","desc":"青田街八巷裡的這處日式住宅，所在街區約在一九三〇年代興建。房屋原是臺電宿舍，留存的完整形式也記錄臺電職員早年的居住環境。","area":"大安區・臺北市","ph":"文"},{"id":4165,"name":"青田街9巷4號","lat":25.027458,"lng":121.53215,"cat":"structure","tag":"歷史建築","desc":"青田街九巷的日式住宅源自學者們自費造屋的構想。日治時期臺北帝國大學與臺北高商的教授參與發起，在這條巷子留下共同生活的街區。","area":"大安區・臺北市","ph":"文"},{"id":4166,"name":"青田街9巷6號","lat":25.02743,"lng":121.532636,"cat":"structure","tag":"歷史建築","desc":"約在一九三〇年代，佐藤佐等教授發起自資興建日式住屋。這間位於青田街九巷的家宅，是當時臺北高商與帝大學者居住社區的一部分。","area":"大安區・臺北市","ph":"文"},{"id":4167,"name":"青田街9巷8號","lat":25.027477,"lng":121.532924,"cat":"structure","tag":"歷史建築","desc":"臺北帝國大學與臺北高商的學者，曾自行出資在青田街一帶造屋定居。這間巷內的日式住宅保留了約一九三〇年代學人住區的歷史。","area":"大安區・臺北市","ph":"文"},{"id":4168,"name":"馬廷英故居_青田七六","lat":25.02795,"lng":121.53261,"cat":"culture","desc":"足立仁教授在青田街興建這棟以檜木為主的住宅，屋內日式、西式空間各有安排。書齋可見玻璃凸窗，另一側的臥室則鋪榻榻米。","area":"大安區・臺北市","ph":"觀"},{"id":4169,"name":"龍安坡黃宅濂讓居","lat":25.023875,"lng":121.539157,"cat":"history","tag":"古蹟","desc":"泉州安溪黃家渡臺後，從淡水蕃薯寮再遷入臺北盆地。到了第四代，幾位兄弟在龍安坡合力興建濂讓居，留下移民家族數代開墾的故事。","area":"大安區・臺北市","ph":"文"},{"id":4170,"name":"140高地公園","lat":25.0043,"lng":121.566596,"cat":"nature","desc":"萬芳社區出現前，這片丘陵叫作抱仔腳，只住著數十戶人家。今日公園保留山地起伏，最高處枹子腳山約有一百三十八公尺。","area":"文山區・臺北市","ph":"觀"},{"id":4171,"name":"「革命實踐研究院院舍」秋瑾堂、育樂室、民眾會堂、保健所","lat":24.9881,"lng":121.555325,"cat":"history","tag":"歷史建築","desc":"秋瑾堂、育樂室、民眾會堂與保健所，同屬革命實踐研究院在木柵的院舍。中興山莊原作分院，後與遷來的陽明山本院合併，供研究及幹部訓練。","area":"文山區・臺北市","ph":"文"},{"id":4172,"name":"仙岩公園","lat":24.99803,"lng":121.54968,"cat":"nature","desc":"公園外圍的植栽連成環狀綠廊，中央廣場以兒童遊戲區為主。想走一段有起伏的路，還可沿小山丘的環山步道登高。","area":"文山區・臺北市","ph":"觀"},{"id":4173,"name":"優人神鼓山上劇場","lat":24.964727,"lng":121.57181,"cat":"culture","tag":"文化景觀","desc":"優人神鼓在優劇場時期便於山上建立訓練與修行的空間。劇場以大自然為背景，將團員日常修練與舞臺上的表演連在一起。","area":"文山區・臺北市","ph":"文"},{"id":4174,"name":"天恩宮","lat":24.97021,"lng":121.5922,"cat":"worship","desc":"貓空內彎山間的一貫道道場，是一座三層樓高的宮殿式建築。白色欄杆、橙瓦與紅柱相互襯托，從山路上就能辨認出它的外形。","area":"文山區・臺北市","ph":"觀"},{"id":4175,"name":"戀人平台","lat":24.978832,"lng":121.589666,"cat":"culture","desc":"指南宮的月下老人旁有一座木棧平臺，地方稱為戀人平臺。平臺上的月娘椅以筊杯為造型，把廟宇信仰融進可以坐下歇腳的設計。","area":"文山區・臺北市","ph":"觀"},{"id":4176,"name":"指南宮","lat":24.97982,"lng":121.58662,"cat":"worship","desc":"木柵指南山麓的宮觀在清代從山西永樂宮分靈，廟區遍布古木。純陽寶殿、凌霄寶殿等五座主要殿宇分布其間，構成山上寬廣的參拜空間。","area":"文山區・臺北市","ph":"觀"},{"id":4177,"name":"文山公民會館","lat":24.99,"lng":121.56974,"cat":"culture","desc":"木柵國小的舊校長宿舍閒置多年後，經居民參與討論並翻修成為會館。館舍保留日式住宅的樸素感，加入現代空間作為地方交流場所。","area":"文山區・臺北市","ph":"觀"},{"id":4178,"name":"景美溪河濱自行車道","lat":24.98135,"lng":121.56629,"cat":"nature","desc":"景美溪旁的自行車道沿著青草地與溪水延伸，途中可見動物園與政大球場。到了道南河濱公園，還有籃球、溜冰與羽球等運動空間。","area":"文山區・臺北市","ph":"觀"},{"id":4179,"name":"景美集應廟","lat":24.991792,"lng":121.541782,"cat":"worship","tag":"古蹟","desc":"高姓族人奉祀的廟宇原在竹圍內，清同治年間遷到景美現址。兩座殿堂、兩廊與兩側護龍構成院落，保有清代中型寺廟的格局。","area":"文山區・臺北市","ph":"文"},{"id":4180,"name":"樟山寺","lat":24.972964,"lng":121.579464,"cat":"worship","desc":"貓空山上的寺院主祀觀音，相傳緣起於居民發現一尊形似觀音的石像。後來信眾出資建廟，廟前開闊的廣場也成為眺望臺北市區的地方。","area":"文山區・臺北市","ph":"觀"},{"id":4181,"name":"福興宮","lat":25.002255,"lng":121.551383,"cat":"worship","tag":"歷史建築","desc":"景美這座土地公廟創立於清代，是十五份聚落發展的重要見證。地方居民長年奉祀福德正神，廟宇也承載著早期開墾人家的共同信仰。","area":"文山區・臺北市","ph":"文"},{"id":4182,"name":"綠光平台","lat":24.978735,"lng":121.589904,"cat":"culture","desc":"位在指南宮站一帶的平臺，可眺望貓空山區的風景。入夜後，白天由太陽能板儲存的電力點亮平臺，也讓綠能原理有了具體的展示。","area":"文山區・臺北市","ph":"觀"},{"id":4183,"name":"臺灣基督長老教會文山教會","lat":24.989147,"lng":121.569731,"cat":"worship","tag":"歷史建築","desc":"清末木柵山區的張迺鴻等信眾組成教會，後來在現址購地建堂。如今的禮拜堂於一九六四年落成，延續山區基督徒聚會的歷史。","area":"文山區・臺北市","ph":"文"},{"id":4184,"name":"興福庄建塚記念碑","lat":25.002115,"lng":121.548101,"cat":"history","tag":"古蹟","desc":"這座石碑記錄鄉紳與商戶集資買地，供萬華、古亭一帶貧困人家安葬的往事。碑文留下辜顯榮、陳天來等人的捐款，以及興福庄公共墓地的來由。","area":"文山區・臺北市","ph":"文"},{"id":4185,"name":"興隆公園","lat":25.00016,"lng":121.5511,"cat":"nature","desc":"觀景湖居於園中央，垂柳、假山與噴泉環繞池畔。沿著湖邊步道可看見拱橋跨過水面，這片古典庭園也曾吸引新人來拍攝婚紗。","area":"文山區・臺北市","ph":"觀"},{"id":4186,"name":"賴氏萬壽塔","lat":25.003061,"lng":121.546762,"cat":"history","tag":"歷史建築","desc":"大稻埕賴氏在一九四〇年興建這座墓塔，用作家族祖塔。「萬壽塔」的名稱與家族安葬先人的用途，留下賴氏宗族的歷史記憶。","area":"文山區・臺北市","ph":"文"},{"id":4187,"name":"革命實踐研究院司令臺","lat":24.988503,"lng":121.555928,"cat":"history","tag":"歷史建築","desc":"木柵中興分院的司令臺，原屬革命實踐研究院幹部講習場地。蔣中正也曾在臺上向受訓人員講話，留下戰後黨政訓練的歷史場景。","area":"文山區・臺北市","ph":"文"},{"id":4188,"name":"北市一號倉庫","lat":25.047405,"lng":121.545719,"cat":"history","tag":"歷史建築","desc":"這座倉庫屬於二戰末期至戰後初期的統制倉形式。抬頭可見以檜木桁架撐起的大跨度屋頂，配上多層牆體，構成糧食倉儲的特色。","area":"松山區・臺北市","ph":"文"},{"id":4189,"name":"富民生態公園","lat":25.06011,"lng":121.56422,"cat":"nature","desc":"松山住宅區裡的公園以水生生態為主，園內闢有近百公尺的生態水道。沿水邊散步，能在市區裡認識宛如北臺灣溪流縮影的棲地。","area":"松山區・臺北市","ph":"觀"},{"id":4190,"name":"富錦街","lat":25.06063,"lng":121.55911,"cat":"nature","desc":"松山巷弄中多是四層老公寓，陸續有家具店、設計小店與咖啡館進駐。沿街也有以臺灣食材為主的店家，保留住宅街區適合慢逛的尺度。","area":"松山區・臺北市","ph":"觀"},{"id":4191,"name":"彩虹橋","lat":25.05215,"lng":121.57665,"cat":"nature","desc":"這座跨越基隆河的紅色人行橋，以彎曲的橋身連起松山和內湖。橋上木欄杆與粉紅、淡藍地磚相配，四條主鋼纜則撐起中央橋段。","area":"松山區・臺北市","ph":"觀"},{"id":4192,"name":"松山市場","lat":25.050218,"lng":121.576132,"cat":"history","tag":"古蹟","desc":"清代松山因水運帶來商機，河港周邊逐漸形成市集。日治時期正式興建市場後，買賣延續下來，也留下這一帶超過百年的商業記憶。","area":"松山區・臺北市","ph":"文"},{"id":4193,"name":"松山慈祐宮","lat":25.05108,"lng":121.57773,"cat":"worship","desc":"松山的古廟主要奉祀黑面媽祖，從清代以來便是地方信仰所在。三川殿屋脊上兩條龍朝向福祿壽三仙，石獅也為殿前增添莊嚴氣息。","area":"松山區・臺北市","ph":"觀"},{"id":4194,"name":"松山機場第一航廈","lat":25.061978,"lng":121.551995,"cat":"history","tag":"歷史建築","desc":"最初建於一九六〇年代的航廈，是戰後臺灣現代化的重要設施。後來由建築師王大閎整合歷次增改建部分，形成如今可辨認的外觀。","area":"松山區・臺北市","ph":"文"},{"id":4195,"name":"松山陳宅","lat":25.050758,"lng":121.574005,"cat":"history","tag":"古蹟","desc":"饒河街上的陳家宅邸現存部分原是第二進，家族成員曾任松山庄長，也有人從事煤礦與公衛。從一棟家宅，可見陳家與松山發展的多重連結。","area":"松山區・臺北市","ph":"文"},{"id":4196,"name":"河流彎曲之處，域見繁花光穹","lat":25.05013,"lng":121.57768,"cat":"culture","desc":"這件公共藝術取材自松山河道彎曲的地貌，以數萬根管狀構件從挑高空間垂下。高低錯落的線條像河灣裡迴旋的水波，從不同位置看層次各異。","area":"松山區・臺北市","ph":"觀"},{"id":4197,"name":"自由巷及鄭南榕紀念館","lat":25.0615,"lng":121.54555,"cat":"culture","desc":"民權東路巷內的「自由巷」，紀念鄭南榕爭取言論自由的歷史。巷中的紀念館與巷口銜牌，讓一處日常街景保留下臺灣民主運動的重要地點。","area":"松山區・臺北市","ph":"觀"},{"id":4198,"name":"臺北小巨蛋","lat":25.05139,"lng":121.54974,"cat":"culture","desc":"舊臺北市立棒球場拆除後，原址興建可容納約一萬五千人的多功能體育館。主場館與副館共同構成小巨蛋，成為松山街區的大型室內活動空間。","area":"松山區・臺北市","ph":"觀"},{"id":4199,"name":"臺北市藝文推廣處_城市舞台","lat":25.04839,"lng":121.55228,"cat":"culture","desc":"這座藝文場館前身是臺北市立社會教育館，展覽廳與大廳可供靜態作品展示。整修後的表演空間以城市舞臺為名，持續呈現音樂、舞蹈與戲劇。","area":"松山區・臺北市","ph":"觀"},{"id":4200,"name":"臺北松山機場觀景台","lat":25.06423,"lng":121.55082,"cat":"other","desc":"第二航廈樓上的戶外觀景臺視野開闊，能近距離觀察停機坪上的飛機。從滑行、起飛到落地都可留意，旁邊也設有座椅供人停留。","area":"松山區・臺北市","ph":"觀"},{"id":4201,"name":"臺灣股票博物館","lat":25.061075,"lng":121.544522,"cat":"culture","desc":"臺灣證券交易全面無實體化之後，紙本股票也成為一段金融史。這座博物館以股票為題，記錄市場從發行有形憑證走向電子化的變化。","area":"松山區・臺北市","ph":"觀"},{"id":4202,"name":"錫口(彩虹)碼頭","lat":25.051424,"lng":121.574914,"cat":"nature","desc":"松山舊稱錫口，河邊渡口原是商貨南來北往的集散地。後來在舊港口一帶興建碼頭、整修護岸與親水步道，讓人能沿水岸認識錫口的來歷。","area":"松山區・臺北市","ph":"觀"},{"id":4203,"name":"6號彩虹 / Rainbow Six","lat":25.042703,"lng":121.507603,"cat":"culture","desc":"西門町六號出口外的地面鋪展著彩虹色帶，是街口醒目的地景。它在臺灣同性婚姻合法化的同一年劃設，象徵城市對性別平等與人權的重視。","area":"萬華區・臺北市","ph":"觀"},{"id":4204,"name":"「華西街1、3、5、7、9及11號」店屋","lat":25.036868,"lng":121.498369,"cat":"history","tag":"歷史建築","desc":"昔日艋舺遊廓範圍內的兩層店屋，以紅磚和木構築成。從騎樓磚拱、圓柱到二樓三扇窗上的平拱，可沿街觀察民間磚砌工藝的變化。","area":"萬華區・臺北市","ph":"文"},{"id":4205,"name":"「華西街2、4、6及8號」店屋","lat":25.039883,"lng":121.498463,"cat":"history","tag":"歷史建築","desc":"華西街西側的店屋在日治時期興建，戰後曾分配給軍眷居住。遭遇火災後仍留有大弧拱與西式柱，可與街道東側的同時期建築對看。","area":"萬華區・臺北市","ph":"文"},{"id":4206,"name":"中正河濱公園","lat":25.0234,"lng":121.513129,"cat":"nature","desc":"萬華南端的新店溪畔，有一片位在中正橋旁的休閒綠地。天橋上可遠望臺北一〇一，兒童遊戲場則設有環形滑軌鞦韆與溜索。","area":"萬華區・臺北市","ph":"觀"},{"id":4207,"name":"仁濟療養院","lat":25.031836,"lng":121.496993,"cat":"history","tag":"歷史建築","desc":"這處歷史悠久的療養院，房舍多為木構造，屋頂覆著黑瓦。院內大致保有創設初期的空間分布，從配置可辨認早年日式建築的特色。","area":"萬華區・臺北市","ph":"文"},{"id":4208,"name":"剝皮寮歷史建築群","lat":25.036881,"lng":121.502225,"cat":"history","tag":"歷史建築","desc":"康定路巷內的老街保有清代規劃的街道輪廓，路旁建築從一層到三層不等。清代店屋與日治時期的牌樓厝並列，記錄艋舺市街的成長。","area":"萬華區・臺北市","ph":"文"},{"id":4209,"name":"原臺灣瓦斯株式會社（煤氣遺構）","lat":25.045296,"lng":121.503251,"cat":"history","tag":"歷史建築","desc":"日治初期的市街圖，已在這塊土地畫出瓦斯工場的煙囪與廠房。後來的名鑑與地籍圖又記為焦炭販賣所，留下艋舺早期煤氣產業的線索。","area":"萬華區・臺北市","ph":"文"},{"id":4210,"name":"原臺灣製糖株式會社臺北製糖所倉庫","lat":25.03334,"lng":121.494577,"cat":"history","tag":"古蹟","desc":"萬華大理街一帶舊稱下崁庄，清代已有牛隻拖動石磨榨蔗的糖廍。日治時期改設新式製糖工廠，倉庫則留下製糖從傳統走向機械生產的歷史。","area":"萬華區・臺北市","ph":"文"},{"id":4211,"name":"台北天后宮","lat":25.042798,"lng":121.506321,"cat":"worship","desc":"西門町鬧區裡的媽祖廟以天上聖母為主神，與龍山寺、祖師廟同為清代艋舺的重要寺廟。廟內同祀臺灣與日本神佛，是其信仰上的特色。","area":"萬華區・臺北市","ph":"觀"},{"id":4212,"name":"台北江夏黃種德堂大宗祠","lat":25.037319,"lng":121.496529,"cat":"worship","tag":"古蹟","desc":"艋舺富商黃阿祿曾在料館口建宅，後由其嫂捐出，改為族人祭祖與議事的宗祠。這段由女性捐宅成立宗祠的故事，在臺北格外少見。","area":"萬華區・臺北市","ph":"文"},{"id":4213,"name":"和平西路三段_鳥店街","lat":25.03484,"lng":121.50367,"cat":"structure","desc":"和平西路上的鳥店一家挨著一家，店前掛著鳥籠，也陳列各種飼育用具。走在艋舺大道與南寧路之間，可以聽見兩側此起彼落的鳥鳴。","area":"萬華區・臺北市","ph":"觀"},{"id":4214,"name":"和平青草園_萬華402號公園","lat":25.03271,"lng":121.49721,"cat":"nature","desc":"艋舺大道與西園路交會處的三角形綠地，原有仁濟療養院與民宅。開闢公園時保留了一些生長良好的喬木，留下舊街區裡原有的綠蔭。","area":"萬華區・臺北市","ph":"觀"},{"id":4215,"name":"學海書院（今高氏宗祠）","lat":25.03633,"lng":121.495628,"cat":"worship","tag":"古蹟","desc":"艋舺的清代書院由淡水同知婁雲倡建，後由曹謹續成。如今成為高氏宗祠，仍是臺北少見能追溯早期書院歷史的建築。","area":"萬華區・臺北市","ph":"文"},{"id":4216,"name":"慈雲寺","lat":25.04644,"lng":121.504157,"cat":"worship","tag":"古蹟","desc":"漢口街鬧市裡的佛寺是西門外填地後興建的齋堂式寺院。日治時期由張氏籌資建造，寺內供奉觀音，保留一處清幽的禮佛空間。","area":"萬華區・臺北市","ph":"文"},{"id":4217,"name":"新富市場","lat":25.036021,"lng":121.501896,"cat":"culture","tag":"古蹟","desc":"日治時期興建的公有市場，與附近東三水街的攤販集中場相連成萬華市場街區。幾處市場各有風貌，記錄居民多年來採買與交易的日常。","area":"萬華區・臺北市","ph":"文"},{"id":4218,"name":"新店溪河濱自行車道","lat":25.01641,"lng":121.4953,"cat":"nature","desc":"河濱車道過華江橋後沿新店溪展開，穿過市區建築之間連續的河岸綠地。沿途能看橋梁與河面，候鳥來訪時還有機會觀察雁鴨。","area":"萬華區・臺北市","ph":"觀"},{"id":4219,"name":"楊氏古厝及古井","lat":25.021694,"lng":121.49661,"cat":"history","tag":"歷史建築","desc":"萬華這處有百年歷史的宅院，是楊姓宗族在當地聚居的起點。老屋和古井一起留下早年居住的痕跡，也連結萬華地區的開拓史。","area":"萬華區・臺北市","ph":"文"},{"id":4220,"name":"漢口街2段125號店屋","lat":25.046484,"lng":121.504,"cat":"history","tag":"歷史建築","desc":"漢口街的老店屋外牆貼著溝面磚，山牆上有勳章與卷草紋的泥塑裝飾。細看柱端，還能發現帶馬雅風格的蜻蜓圖樣。","area":"萬華區・臺北市","ph":"文"},{"id":4221,"name":"臺北製糖所文化園區","lat":25.0332,"lng":121.49506,"cat":"nature","desc":"清代大理街一帶曾遍植甘蔗、聚集糖廍，日治時期則設立新式糖廠。工廠與輸送軌道改變街區面貌，也留下周邊居民倚靠糖業生活的記憶。","area":"萬華區・臺北市","ph":"觀"},{"id":4222,"name":"舊八甲庄郵便局","lat":25.036602,"lng":121.504612,"cat":"history","tag":"歷史建築","desc":"艋舺東側八甲庄的郵局在日治時期便兼辦電報，是當地重要的通訊據點。兩層獨棟建築帶有騎樓，構造結合木材與加強磚造。","area":"萬華區・臺北市","ph":"文"},{"id":4223,"name":"艋舺助順將軍廟（晉德宮）","lat":25.045881,"lng":121.503394,"cat":"worship","tag":"古蹟","desc":"惠安移民從原鄉分靈來臺，興建晉德宮奉祀助順將軍。清代連接艋舺與大稻埕的一段街道，也因這座廟而有了將軍廟街之稱。","area":"萬華區・臺北市","ph":"文"},{"id":4224,"name":"艋舺地藏庵","lat":25.036944,"lng":121.500684,"cat":"worship","tag":"古蹟","desc":"西昌街上的地藏王廟創建於清乾隆年間，從祀府城隍與田都元帥。廟宇留有單殿式格局，雕飾簡潔樸拙，一旁另有大眾廟。","area":"萬華區・臺北市","ph":"文"},{"id":4225,"name":"艋舺水仙宮舊址","lat":25.038492,"lng":121.500582,"cat":"worship","desc":"西昌街與桂林路口的碑記，標示了清代水仙宮的位置。艋舺商人為祈求船運平安而建廟奉祀大禹，後因廟宇毀損及都市計畫而遷離。","area":"萬華區・臺北市","ph":"觀"},{"id":4226,"name":"艋舺洪氏祖厝","lat":25.031524,"lng":121.503744,"cat":"history","tag":"古蹟","desc":"清代洪家宅院採三進加單邊護龍的格局，磚牆上可見燕尾屋脊。泉州白石、福杉以及本地觀音山石、唭哩岸石，共同構成這座耕讀人家的住宅。","area":"萬華區・臺北市","ph":"文"},{"id":4227,"name":"艋舺清水巖","lat":25.040318,"lng":121.502137,"cat":"worship","tag":"古蹟","desc":"來自福建安溪的移民在艋舺奉祀故鄉分靈的清水祖師，地方稱這裡為祖師廟。廟宇始於清乾隆年間，曾在頂下郊拚的械鬥中受毀。","area":"萬華區・臺北市","ph":"文"},{"id":4228,"name":"艋舺王宅二進遺構","lat":25.038215,"lng":121.500502,"cat":"history","tag":"歷史建築","desc":"王家古宅原有五進，如今留下的是第二進的木門框、廳堂外牆與隔間牆基。門上的對聯寫著家族來歷與定居艋舺的往事。","area":"萬華區・臺北市","ph":"文"},{"id":4229,"name":"艋舺老街(台北第一街)","lat":25.040146,"lng":121.5006,"cat":"structure","desc":"青山宮前的貴陽街舊稱蕃薯市街，是艋舺早年商業興起之處，也有臺北第一街之稱。沿路仍能遇見清代與日治時期留下的紅磚建築。","area":"萬華區・臺北市","ph":"觀"},{"id":4230,"name":"艋舺謝宅","lat":25.040878,"lng":121.500607,"cat":"history","tag":"古蹟","desc":"番薯市附近的謝家古宅是一座保留下來的四合院，曾與清代郊行貿易密切相關。謝家經營臺北和漳泉之間的買賣，也參與艋舺河港的發展。","area":"萬華區・臺北市","ph":"文"},{"id":4231,"name":"艋舺集義宮","lat":25.034881,"lng":121.501452,"cat":"worship","tag":"歷史建築","area":"萬華區・臺北市","ph":"文"},{"id":4232,"name":"艋舺青山宮","lat":25.039997,"lng":121.499537,"cat":"worship","tag":"古蹟","desc":"艋舺發生瘟疫時，惠安移民從故鄉青山廟迎來靈安尊王。疫後居民仍奉祀這位守護神，後來集資興建青山宮，留下移民信仰的歷史。","area":"萬華區・臺北市","ph":"文"},{"id":4233,"name":"艋舺龍山寺","lat":25.036778,"lng":121.499934,"cat":"worship","tag":"古蹟","desc":"艋舺的泉州移民迎奉家鄉分靈的觀世音菩薩，龍山寺就此成為舊市街重要的信仰中心。從寺廟與周邊商街的關係，可認識淡水河東岸的聚落發展。","area":"萬華區・臺北市","ph":"文"},{"id":4234,"name":"華中河濱公園","lat":25.0154,"lng":121.49476,"cat":"nature","desc":"新店溪在此轉彎，河岸展開一片像弦月的寬闊沖積平原。草地適合散步看夕陽，樹間常有野鳥跳躍，也能留意河裡游動覓食的魚群。","area":"萬華區・臺北市","ph":"觀"},{"id":4235,"name":"華江雁鴨自然公園","lat":25.03871,"lng":121.49522,"cat":"nature","desc":"華江橋附近的沙洲與濕地是候鳥停棲之處，秋冬常有大群雁鴨與岸鳥來訪。沿堤外的野鳥觀測區，可以從岸邊觀察牠們在水際活動。","area":"萬華區・臺北市","ph":"觀"},{"id":4236,"name":"萬座曉劇場","lat":25.03327,"lng":121.49483,"cat":"culture","desc":"進駐萬華的曉劇場以自製演出與策展培養地方觀眾，也和學校、社會團體合作。艋舺國際舞蹈節與藝術進駐計畫，讓不同地方的表演者在此交流。","area":"萬華區・臺北市","ph":"觀"},{"id":4237,"name":"萬華林宅","lat":25.033532,"lng":121.498397,"cat":"history","tag":"古蹟","desc":"日治時期林家的三層宅邸基地不規則，三面臨路，從街角看特別醒目。房屋採鋼筋混凝土結構，結合中西特色，頂樓還設有遠眺的平臺。","area":"萬華區・臺北市","ph":"文"},{"id":4238,"name":"西園29服飾創作基地_臺北服飾文化館","lat":25.03246,"lng":121.49819,"cat":"culture","desc":"大理服飾商圈裡的三層紅磚建築，原為臺北服飾文化館。轉為服飾創作基地後，仍與周邊製衣、買賣服飾的街區保持連結。","area":"萬華區・臺北市","ph":"觀"},{"id":4239,"name":"西園路_佛具街","lat":25.03797,"lng":121.49972,"cat":"structure","desc":"龍山寺旁的西園路一段聚集佛具商家，與早期移民思念原鄉神祇有關。走在廣州街到桂林街一帶，可從佛像雕刻看見信仰與地方工藝的連結。","area":"萬華區・臺北市","ph":"觀"},{"id":4240,"name":"西寧南路14-3號店屋","lat":25.046766,"lng":121.506958,"cat":"history","tag":"歷史建築","desc":"西寧南路街廓的轉角上，這棟公有店屋以醒目的外觀收住一段街景。它建於戰後，設計延續日治時期學院派建築的風格。","area":"萬華區・臺北市","ph":"文"},{"id":4241,"name":"西本願寺廣場","lat":25.04,"lng":121.50717,"cat":"worship","desc":"中華路轉進長沙街，可見鐘樓立在小丘上，附近的輪番所則保留深色木造住宅樣貌。樹心會館以紅磚牆、西式木屋架配日式屋頂，和洋風格交會在庭園裡。","area":"萬華區・臺北市","ph":"觀"},{"id":4242,"name":"西本願寺輪番所，遺蹟  (參道、本堂、御廟所)","lat":25.040354,"lng":121.506454,"cat":"worship","tag":"歷史建築","desc":"輪番所是本願寺駐寺負責人的宿舍，原先暫用的住處曾在火災中受損。後來興建新舍，與參道、本堂及御廟所遺跡一同留下寺院布局。","area":"萬華區・臺北市","ph":"文"},{"id":4243,"name":"西本願寺（鐘樓、樹心會館）","lat":25.040358,"lng":121.507144,"cat":"worship","tag":"古蹟","desc":"本願寺為了舉辦講演與各類集會，在日治時期興建樹心會館。會館與鐘樓共同留在園區裡，記錄佛寺傳教之外的公共活動。","area":"萬華區・臺北市","ph":"文"},{"id":4244,"name":"西門町","lat":25.04458,"lng":121.50753,"cat":"culture","desc":"徒步商圈的入口以彩虹地景迎人，走入巷內可見塗鴉、創意店舖與電影院。潮流服飾、特色小吃和街頭娛樂，交織出西門町的流行文化。","area":"萬華區・臺北市","ph":"觀"},{"id":4245,"name":"西門紅樓（原新起街市場）","lat":25.042065,"lng":121.506935,"cat":"culture","tag":"古蹟","desc":"西門外最初的木造市場，後來改建成八角形紅磚洋樓與後方十字形建築。兩層樓高的八角量體格外醒目，留下新起街市場早年服務街坊的歷史。","area":"萬華區・臺北市","ph":"文"},{"id":4246,"name":"貴陽街二段117號店屋","lat":25.040126,"lng":121.502256,"cat":"history","tag":"歷史建築","desc":"艋舺早年發展的商街上，這棟兩層磚造店屋以圓拱窗朝向街面。窗洞與磚牆的比例，保留了貴陽街老店舖日常而耐看的身影。","area":"萬華區・臺北市","ph":"文"},{"id":4247,"name":"貴陽街二段119號店屋","lat":25.040126,"lng":121.502256,"cat":"history","tag":"歷史建築","desc":"貴陽街是萬華早期的商業市街，路旁這棟店屋仍有兩層磚樓的輪廓。正面以磚砌成的圓拱窗，留下早年沿街住商建築的樣式。","area":"萬華區・臺北市","ph":"文"},{"id":4248,"name":"金義合行","lat":25.034266,"lng":121.501236,"cat":"history","tag":"古蹟","desc":"洋式店屋的磚立面鋪著不同花色的馬賽克，旁邊另有後來增建的一翼。屋內保留公媽廳、辦公室與舊大門，後方花園還設有水景與假山。","area":"萬華區・臺北市","ph":"文"},{"id":4249,"name":"雙園街79號","lat":25.030464,"lng":121.493705,"cat":"history","tag":"歷史建築","desc":"雙園街的建築屬於早期整建住宅，也是保存較完整的警察局眷屬宿舍。從這處集體住家，可認識臺北都市發展與戰後公教人員的居住歷史。","area":"萬華區・臺北市","ph":"文"},{"id":4250,"name":"青年公園","lat":25.02227,"lng":121.50703,"cat":"nature","desc":"萬華西側的開放公園，前身曾是練兵場，後來改建機場。因與北側的松山機場相對而稱南機場，今日大片綠地仍連著這段地方歷史。","area":"萬華區・臺北市","ph":"觀"},{"id":4251,"name":"青草巷歷史建築群","lat":25.037009,"lng":121.500494,"cat":"structure","tag":"歷史建築","desc":"龍山寺旁的巷子以買賣青草藥材聞名，一間間店屋留住這門地方產業。這裡也是泉州三邑移民聚居的艋舺街區，青草行業與廟口生活緊鄰。","area":"萬華區・臺北市","ph":"文"},{"id":4252,"name":"青雲閣","lat":25.038982,"lng":121.497917,"cat":"history","tag":"歷史建築","area":"萬華區・臺北市","ph":"文"},{"id":4253,"name":"馬場町河濱公園","lat":25.01886,"lng":121.50391,"cat":"nature","desc":"新店溪畔的軍用地轉為公園後，與華江雁鴨公園及中正河濱公園相連。沿著自行車道穿過草地，能一邊看溪水，一邊望見兩岸高樓。","area":"萬華區・臺北市","ph":"觀"},{"id":4254,"name":"龍山寺地下街","lat":25.03607,"lng":121.49989,"cat":"worship","desc":"艋舺公園底下藏著兩層地下商場，正對著地面的龍山寺。廣州街、西園路與三水街一帶的人流，經由公園多處出入口匯入地下通廊。","area":"萬華區・臺北市","ph":"觀"},{"id":4255,"name":"龍山文創基地","lat":25.036074,"lng":121.499624,"cat":"culture","desc":"這個萬華的創作基地以培養在地設計師與藝術家為主。從街區導覽、表演到互動工作坊，可用聲音、工藝或食物等不同方式認識艋舺。","area":"萬華區・臺北市","ph":"觀"},{"id":4256,"name":"烏山頭水庫暨嘉南大圳水利系統","lat":23.205555,"lng":120.39,"cat":"history","tag":"文化景觀","desc":"跨越官田、六甲的水庫與嘉南大圳，由八田與一設計監造，臺日技術人員及勞工共同興建。水壩採少見的半水力填充法，是這套水利工程的特色。","area":"臺南市","ph":"文"},{"id":4257,"name":"七股海產街","lat":23.13818,"lng":120.11378,"cat":"structure","area":"七股區・臺南市","ph":"觀"},{"id":4258,"name":"七股潟湖","lat":23.12359,"lng":120.07842,"cat":"other","desc":"七股人稱潟湖為內海仔，水面上可見蚵棚、定置漁網與釣魚的小舟。乘竹筏穿過潟湖，沿岸紅樹林還有白鷺鷥和招潮蟹活動。","area":"七股區・臺南市","ph":"觀"},{"id":4259,"name":"七股潟湖","lat":23.15295,"lng":120.07248,"cat":"scenic","desc":"曾文溪歷次改道形塑了七股漁民口中的內海仔，東側緊鄰鹽場。從青山港汕到新浮崙汕，南北排列的四座沙洲勾勒出潟湖與外海的邊界。","area":"七股區・臺南市","ph":"觀"},{"id":4260,"name":"七股觀海樓","lat":23.14491,"lng":120.07711,"cat":"other","desc":"七股海邊的觀景樓是攝影人守候落日的地方。夏日雷雨過後，天色常從海平面向上漸次變化，雲層掩映時又會呈現不同光影。","area":"七股區・臺南市","ph":"觀"},{"id":4261,"name":"七股遊客中心","lat":23.1539,"lng":120.10323,"cat":"other","area":"七股區・臺南市","ph":"觀"},{"id":4262,"name":"七股頂山鹽警槍樓","lat":23.178247,"lng":120.116815,"cat":"history","tag":"歷史建築","area":"七股區・臺南市","ph":"文"},{"id":4263,"name":"七股黑板樹廊道","lat":23.13429,"lng":120.14512,"cat":"other","desc":"七股濱海地區的南三十四區道，兩旁整齊栽著生長快速的黑板樹。樹冠很快便能相連，形成長廊般的樹蔭，替日照強烈的沿海道路遮陽。","area":"七股區・臺南市","ph":"觀"},{"id":4264,"name":"七股龍山宮","lat":23.13999,"lng":120.1143,"cat":"worship","desc":"七股龍山里的居民習慣把村內大廟稱作「王宮」，宏偉外觀是海邊聚落的地標。廟中主祀王爺，也奉祀天上聖母、田都元帥等神祇。","area":"七股區・臺南市","ph":"觀"},{"id":4265,"name":"六孔碼頭","lat":23.12359,"lng":120.07861,"cat":"other","area":"七股區・臺南市","ph":"觀"},{"id":4266,"name":"台江六孔管理站(含遊客中心)","lat":23.1227,"lng":120.07766,"cat":"other","desc":"白色弧拱沿著六孔碼頭展開，遊客中心便設在潟湖竹筏往來的岸邊。除了觀賞夕陽，這一帶也曾舉辦七股海鮮節與摸蛤仔的活動。","area":"七股區・臺南市","ph":"觀"},{"id":4267,"name":"台灣鹽博物館","lat":23.15535,"lng":120.10565,"cat":"culture","area":"七股區・臺南市","ph":"觀"},{"id":4268,"name":"台鹽七股機車庫","lat":23.152073,"lng":120.105653,"cat":"history","tag":"歷史建築","desc":"七股鹽場機車庫的大門上，留著鹽務總局局長朱玖瑩題寫的「機車庫」。階梯狀山牆搭配洗石子線條，旁邊另有巡道車庫及木工訓練班工作房。","area":"七股區・臺南市","ph":"文"},{"id":4269,"name":"國聖港燈塔","lat":23.10068,"lng":120.0359,"cat":"other","desc":"臺灣本島極西點的燈塔立在頂頭額沙洲上，四周空曠，砂地延伸到海邊。日落時雲彩在塔後變換，附近還設有紀念極西位置的郵筒與地標。","area":"七股區・臺南市","ph":"觀"},{"id":4270,"name":"正王府","lat":23.08618,"lng":120.05497,"cat":"other","desc":"地方傳說將廟的來歷連到雷家三兄弟渡海的故事。相傳他們從福建帶著溫府千歲神像航向臺灣，在國聖港外遇上風浪，連人帶船沉沒。","area":"七股區・臺南市","ph":"觀"},{"id":4271,"name":"篤加聚落文物展覽館","lat":23.1596,"lng":120.12769,"cat":"culture","desc":"篤加聚落由福建移墾來臺的邱姓家族繁衍而成，居民因血緣而聚居。從家族落腳、成家到形成整個村落的過程，可以認識臺南早期開發的一面。","area":"七股區・臺南市","ph":"觀"},{"id":4272,"name":"網仔寮沙洲","lat":23.29453,"lng":120.10961,"cat":"scenic","desc":"七股內海中段有條狹長的沙洲，像一道屏障將潟湖與外海分開。臺灣西部河川帶下的砂土，由海浪搬運、長年堆積，才漸漸露出海面。","area":"七股區・臺南市","ph":"觀"},{"id":4273,"name":"頂頭額沙洲","lat":23.10503,"lng":120.03719,"cat":"scenic","desc":"國聖港燈塔旁的狹長沙洲，是七股內海南端的天然屏障。海浪將河川輸出的砂土慢慢堆起，空曠的砂丘與夕照讓海岸帶有近似荒漠的景色。","area":"七股區・臺南市","ph":"觀"},{"id":4274,"name":"黑面琵鷺生態展示館","lat":23.08139,"lng":120.06271,"cat":"culture","desc":"鄰近賞鳥亭與主要棲地的展示館建在水上，造型設計考量降低對生態的干擾。館內從黑面琵鷺的生命史，介紹到濕地環境與保育運動。","area":"七股區・臺南市","ph":"觀"},{"id":4275,"name":"黑面琵鷺生態展示館（原黑面琵鷺研究及保育管理中心）","lat":23.08098,"lng":120.08245,"cat":"culture","desc":"通往保護區的大片魚塭間，有一棟特殊的水上建築，就是黑面琵鷺生態展示館。它是七股保護區的重要據點，也用來推廣濕地環境教育。","area":"七股區・臺南市","ph":"觀"},{"id":4276,"name":"黑面琵鷺賞鳥亭","lat":23.07915,"lng":120.05285,"cat":"scenic","desc":"台江濱海灘地與魚塭是黑面琵鷺的度冬棲地，賞鳥亭提供觀察的位置。牠們白天常成群休息，春季北返前則有機會到水位合適的魚塭覓食。","area":"七股區・臺南市","ph":"觀"},{"id":4277,"name":"下營小葉欖仁綠色隧道","lat":23.24126,"lng":120.27768,"cat":"other","desc":"下營的道路兩旁栽著小葉欖仁，綿延約一點三公里。濃密枝葉從兩側向路中央伸展，走在下方，眼前是一段連續不斷的綠蔭。","area":"下營區・臺南市","ph":"觀"},{"id":4278,"name":"下營玄天上帝廟及文化館","lat":23.2348,"lng":120.26096,"cat":"worship","desc":"下營市街中心的三層大廟主祀玄天上帝，相傳由鄭成功部將劉國軒屯墾時倡建。每逢上帝公誕辰，信眾齊聚，是地方熱鬧的信仰大事。","area":"下營區・臺南市","ph":"觀"},{"id":4279,"name":"下營風鈴木廊道","lat":23.2339,"lng":120.23171,"cat":"other","desc":"下營這段約兩點五公里長的道路，兩旁都是洋紅風鈴木。平日枝葉相連形成綠色隧道，花開時一團團洋紅花簇又換了沿途景色。","area":"下營區・臺南市","ph":"觀"},{"id":4280,"name":"武承恩公園","lat":23.23355,"lng":120.26064,"cat":"nature","desc":"下營的湖畔公園裡，小橋連接玄武亭、觀湖樓等亭臺。入口處留有上帝廟重建時拆下的石鼓與舊石堵，旁邊也能讀到廟的沿革。","area":"下營區・臺南市","ph":"觀"},{"id":4281,"name":"茅港尾天后宮","lat":23.22356,"lng":120.283,"cat":"worship","area":"下營區・臺南市","ph":"觀"},{"id":4282,"name":"顏水龍紀念公園","lat":23.24332,"lng":120.26707,"cat":"nature","desc":"出身下營紅毛厝的畫家顏水龍，曾赴日本與法國學畫，長年投入油畫與公共藝術。家鄉為紀念他的貢獻闢建公園，園中立有畫家銅像。","area":"下營區・臺南市","ph":"觀"},{"id":4283,"name":"88藝療所","lat":22.99863,"lng":120.19917,"cat":"other","desc":"普濟街的人安醫院老屋，如今成了五條港街區的藝文空間。從藝術家進駐、展覽到社區居民參與的普濟燈會，舊診療場所延續了與街坊的聯繫。","area":"中西區・臺南市","ph":"觀"},{"id":4284,"name":"五妃廟","lat":22.981949,"lng":120.204983,"cat":"worship","tag":"古蹟","desc":"這座廟源自明鄭時期的五妃墓，舊稱五烈墓。鄭氏政權降清時，寧靖王與身邊五位妃妾相繼殉死，墓與廟也留下府城政權更迭的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4285,"name":"五條港文化園區","lat":22.99868,"lng":120.19643,"cat":"culture","desc":"清代臺江逐漸淤積後，仍有五條河道從海邊伸向府城。新港墘港、佛頭港等河港周圍聚集商家，繁忙的港埠成了今日臺南中西區的雛形。","area":"中西區・臺南市","ph":"觀"},{"id":4286,"name":"全臺吳氏大宗祠","lat":22.996499,"lng":120.205635,"cat":"worship","tag":"古蹟","desc":"清代吳姓族人曾倡議興建大宗祠，後由總兵吳光亮與知府吳本杰召集商民合力完成。宗祠供家族祭祖與議事，也是府城宗族生活的見證。","area":"中西區・臺南市","ph":"文"},{"id":4287,"name":"八吉境關帝廳","lat":22.991449,"lng":120.201092,"cat":"worship","tag":"歷史建築","area":"中西區・臺南市","ph":"文"},{"id":4288,"name":"北極殿","lat":22.994489,"lng":120.204713,"cat":"worship","tag":"古蹟","desc":"殿內奉祀玄天上帝，民間也稱上帝公或北極大帝。除了屠宰業者敬奉，地方家長也會在神誕時帶孩子前來，祈求平安成長。","area":"中西區・臺南市","ph":"文"},{"id":4289,"name":"原五福商店","lat":22.99264,"lng":120.1998,"cat":"history","tag":"歷史建築","desc":"中正路舊稱銀座通，是府城日治時期新開闢的商街。五福商店與稍後落成的林百貨、小出商行等店舖比鄰，見證當年舶來品買賣的繁華。","area":"中西區・臺南市","ph":"文"},{"id":4290,"name":"原住吉組宅邸（高家宅邸）","lat":22.992014,"lng":120.210025,"cat":"history","tag":"古蹟","area":"中西區・臺南市","ph":"文"},{"id":4291,"name":"原台南公會堂","lat":22.99432,"lng":120.206104,"cat":"history","tag":"古蹟","desc":"日治初期，臺南地方舉辦大型集會與宴席時，常須向吳家或兩廣會館借場地。官民後來共同籌建公會堂，為府城設立固定的公眾集會場所。","area":"中西區・臺南市","ph":"文"},{"id":4292,"name":"原台南合同廳舍","lat":22.992514,"lng":120.204356,"cat":"history","tag":"古蹟","desc":"「合同廳舍」指不同機關合署辦公的場所，臺南這棟建築曾供錦町警察官吏使用。消防組與警察會館也同處一地，記錄日治時期的地方治安與消防制度。","area":"中西區・臺南市","ph":"文"},{"id":4293,"name":"原台南大正公園","lat":22.992583,"lng":120.205055,"cat":"nature","tag":"古蹟","desc":"日治時期臺南推動市區改正，把舊城多條街道匯集於圓環。原設於三界壇的銅像與周邊行政機關，使大正公園一帶成為當年府城的重要中心。","area":"中西區・臺南市","ph":"文"},{"id":4294,"name":"原台南州會","lat":22.992057,"lng":120.203857,"cat":"history","tag":"古蹟","desc":"從臺灣文學館望去，綠色空橋連往舊州會建築，兩座官署昔日以此相通。州會曾轉為臺南市議會，修復後又成為中西區圖書館。","area":"中西區・臺南市","ph":"文"},{"id":4295,"name":"原台南州青果同業組合香蕉倉庫","lat":22.993222,"lng":120.198389,"cat":"history","tag":"古蹟","desc":"西市場旁的倉庫推測前身是魚賣場，後來才用來儲存香蕉。屋頂以黑燻瓦搭配局部玻璃瓦採光，原本南北兩側開放，方便人員與貨物進出。","area":"中西區・臺南市","ph":"文"},{"id":4296,"name":"原台南愛國婦人會館","lat":22.988921,"lng":120.20427,"cat":"culture","tag":"古蹟","desc":"日治時期的愛國婦人會吸納日本官員及臺灣仕紳家眷，為軍事救護與殖民政策提供後援。臺南留下的會館，記錄女性如何被納入當時的動員體制。","area":"中西區・臺南市","ph":"文"},{"id":4297,"name":"原台南放送局","lat":22.986319,"lng":120.203822,"cat":"history","tag":"古蹟","desc":"日治時期臺灣南部的廣播機構，主要向臺南、高雄播送節目。早年以日語音樂與娛樂為民眾熟悉，戰爭期間廣播也被用來宣傳。","area":"中西區・臺南市","ph":"文"},{"id":4298,"name":"原台南武德殿","lat":22.990455,"lng":120.203474,"cat":"worship","tag":"古蹟","desc":"忠義國小的禮堂原是日治時期的武德殿，一樓厚實的基座托住上方主體。入口屋頂有弓形曲線，外牆雖像木構斗拱，實際採鋼筋混凝土仿作。","area":"中西區・臺南市","ph":"文"},{"id":4299,"name":"原台南神社事務所","lat":22.989719,"lng":120.202524,"cat":"history","tag":"古蹟","desc":"臺南神社外苑留有一棟日式建築，究竟作事務所還是休憩所，地方記載有不同說法。深遠屋簷替迴廊遮風避雨，銀燻瓦與木質懸魚裝飾則保留傳統社殿風貌。","area":"中西區・臺南市","ph":"文"},{"id":4300,"name":"原台南警察署","lat":22.991097,"lng":120.205165,"cat":"history","tag":"古蹟","desc":"這棟一九三一年興建的警察署，是臺灣留存較早的警察機關建築之一。從它的早期用途，可以認識日治時期警察本署與地方警察組織的發展。","area":"中西區・臺南市","ph":"文"},{"id":4301,"name":"原台南運河海關","lat":22.996313,"lng":120.192638,"cat":"history","tag":"古蹟","desc":"運河旁的海關辦公建築採日式木構，外牆覆雨淋板，後方原有倉庫與附屬房舍。庭園靠牆處還留著高雄關的界碑，標示昔日關區範圍。","area":"中西區・臺南市","ph":"文"},{"id":4302,"name":"原嘉南大圳組合事務所","lat":22.990677,"lng":120.205206,"cat":"history","tag":"古蹟","desc":"嘉南平原旱澇不均，日治時期設立公共埤圳組合，負責籌建嘉南大圳。這座事務所與灌溉工程相連，見證農田用水如何成為跨地區的公共事務。","area":"中西區・臺南市","ph":"文"},{"id":4303,"name":"原廣陞樓","lat":22.999281,"lng":120.201578,"cat":"history","tag":"古蹟","desc":"高順與高城兄弟在明治町建起這棟樓房經營布莊，外觀採古典折衷式樣。房屋後來轉讓盧世澤，改為當時街區內頗具規模的酒樓。","area":"中西區・臺南市","ph":"文"},{"id":4304,"name":"原日本勸業銀行台南支店","lat":22.992133,"lng":120.203162,"cat":"history","tag":"古蹟","desc":"林百貨對街的舊勸業銀行，沿街兩面都立著高大的神殿式圓柱。細看二樓拱窗，頂端有花飾與橢圓通氣窗，和外廊沉穩的外觀互相呼應。","area":"中西區・臺南市","ph":"文"},{"id":4305,"name":"原林百貨店","lat":22.991784,"lng":120.202665,"cat":"history","tag":"古蹟","desc":"末廣町商街的「五棧樓仔」開業時，店內流籠曾是府城的新鮮體驗。修復後的大樓仍保留屋頂鳥居與神龕，殘牆上的彈痕也留下戰時記憶。","area":"中西區・臺南市","ph":"文"},{"id":4306,"name":"原臺南刑務所木造建築群","lat":22.988736,"lng":120.198739,"cat":"history","tag":"古蹟","desc":"昔日刑務所位於土墼埕，宿舍、要道館與共同浴場構成司法獄政區的一角。合宿的多戶住屋圍出方形中庭，要道館內原設有劍道與柔道場。","area":"中西區・臺南市","ph":"文"},{"id":4307,"name":"原臺南大宮町日式住宅","lat":22.99308,"lng":120.200983,"cat":"worship","tag":"歷史建築","desc":"這棟日式住宅坐落在清代臺澎兵備道署的舊地，屋外留有庭院。應接室、座敷與起居空間都設凸窗，門窗上的鑽石紋與花草紋玻璃讓光線透入屋內。","area":"中西區・臺南市","ph":"文"},{"id":4308,"name":"原臺南山林事務所","lat":22.990932,"lng":120.203743,"cat":"history","tag":"古蹟","desc":"昔日林業機關的兩層辦公樓，如今用作葉石濤文學紀念館。一樓平拱窗、二樓圓拱窗上下相對，入口雨庇與屋簷都有醒目的托架。","area":"中西區・臺南市"},{"id":4309,"name":"原臺南州廳","lat":22.991962,"lng":120.204602,"cat":"history","tag":"古蹟","desc":"總督府技師森山松之助設計的州廳，日治時期在幸町落成。建築在第二次世界大戰遭轟炸損毀，後來歷經多次整修，留存府城行政中心的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4310,"name":"原臺南庶民信用組合日式建物","lat":22.991938,"lng":120.203545,"cat":"history","tag":"歷史建築","area":"中西區・臺南市","ph":"文"},{"id":4311,"name":"原臺南愛國婦人會館","lat":22.98902,"lng":120.20424,"cat":"culture","desc":"昔日愛國婦人會的臺灣南支部設在臺南，會館採和洋混合風格。建築分成南北兩棟，北側用作集會，南側則是成員居住的宿舍。","area":"中西區・臺南市","ph":"觀"},{"id":4312,"name":"原臺南測候所","lat":22.993666,"lng":120.205062,"cat":"history","tag":"古蹟","desc":"測候所中央的圓塔被府城居民暱稱為「胡椒管」，外圍單層屋頂呈放射狀展開。這裡是臺灣首批氣候觀測據點之一，修復後作為氣象文物展示場。","area":"中西區・臺南市","ph":"文"},{"id":4313,"name":"台南法華寺","lat":22.983885,"lng":120.209471,"cat":"worship","tag":"古蹟","desc":"寺院中有一道延壽橋，七塊長石板構成橋面，上方覆著木構橋廊。走到中段可見橋亭與鵝頸椅，院牆還穿插琉璃花格窗及圓拱門。","area":"中西區・臺南市","ph":"文"},{"id":4314,"name":"台南石鼎美古宅","lat":22.995585,"lng":120.198988,"cat":"history","tag":"古蹟","desc":"府城郊商石時榮建宅時，先蓋護龍，等兒子石耀宗中舉後才興建正身。地方流傳「袂起大厝，先起護龍」的說法，也道出商家對功名的期望。","area":"中西區・臺南市","ph":"文"},{"id":4315,"name":"台南開基靈祐宮","lat":22.998074,"lng":120.203726,"cat":"worship","tag":"古蹟","desc":"府城的玄天上帝信仰可追溯到明鄭時期，開基靈祐宮是當時建立的真武廟之一。在地方信仰中，帝爺公也扮演守護這片街區的角色。","area":"中西區・臺南市","ph":"文"},{"id":4316,"name":"基督教臺南浸信會教堂","lat":22.989237,"lng":120.203205,"cat":"worship","tag":"歷史建築","desc":"戰後美南浸信會沿臺灣主要城市設立據點，臺南是其中較晚開拓的一站。早期信徒曾借用市議會聚會，後又租用健康路上的日式房舍。","area":"中西區・臺南市","ph":"文"},{"id":4317,"name":"大井頭","lat":22.995433,"lng":120.201664,"cat":"history","tag":"古蹟","desc":"民權路上的古井不像常見古蹟突出地面，井口覆著鑄鐵蓋，混在往來街景之中。路邊立有說明碑，提醒行人留意腳下這處府城遺跡。","area":"中西區・臺南市","ph":"文"},{"id":4318,"name":"大天后宮（寧靖王府邸）","lat":22.996617,"lng":120.201473,"cat":"worship","tag":"古蹟","desc":"府城這座媽祖廟原是明鄭時期寧靖王朱術桂的府邸。清初施琅將王府改為天后宮，早期改建以裝飾為主，讓廟宇留有王府建築的來歷。","area":"中西區・臺南市","ph":"文"},{"id":4319,"name":"太平境馬雅各紀念教會","lat":22.99342,"lng":120.20535,"cat":"worship","desc":"公園路上醒目的白色教堂，淵源可追溯至英國長老教會醫師馬雅各來臺宣教。從溝仔頂教會到花園町教會，歷來的名稱也跟著府城街區改變。","area":"中西區・臺南市","ph":"觀"},{"id":4320,"name":"媽祖樓天后宮","lat":23.00042,"lng":120.19753,"cat":"worship","area":"中西區・臺南市","ph":"觀"},{"id":4321,"name":"廣安宮","lat":22.997423,"lng":120.201673,"cat":"worship","tag":"古蹟","desc":"新美街早年稱米街，清代在此興建的廟宇曾因道路拓寬北移，與共善堂邢王爺合祀。如今隱在窄巷內，三川殿仍可細看木構與石作裝飾。","area":"中西區・臺南市","ph":"文"},{"id":4322,"name":"延平郡王祠（含鄭成功文物館）","lat":22.98768,"lng":120.207964,"cat":"worship","tag":"歷史建築","desc":"紀念鄭成功的祠宇，在清代曾有開山王廟，日治與戰後陸續改建。今日所見建築完成於一九六〇年代，旁有文物館延伸介紹鄭成功相關歷史。","area":"中西區・臺南市","ph":"文"},{"id":4323,"name":"接官亭","lat":22.996984,"lng":120.19568,"cat":"history","tag":"古蹟","desc":"清代府城渡頭西移到安瀾橋附近後，這裡成為迎送往來官員的所在。留存的石坊用泉州白石作柱，梁上有螭虎、雙龍搶珠等精細雕飾。","area":"中西區・臺南市","ph":"文"},{"id":4324,"name":"擇賢堂","lat":22.991346,"lng":120.203237,"cat":"worship","tag":"古蹟","desc":"清光緒年間，原在報恩堂修行的齋友共同出資，成立先天派的擇賢堂。從在葉昌貞家中持修到另建齋堂，記下府城民間宗教社群的發展。","area":"中西區・臺南市","ph":"文"},{"id":4325,"name":"普濟殿","lat":22.99897,"lng":120.19919,"cat":"worship","desc":"廟旁街巷四通八達，地方以鳳凰城的傳說解釋這樣的布局。相傳普濟殿居於八卦網中央，周邊道路像網，要把為府城帶來興盛的鳳凰留住。","area":"中西區・臺南市","ph":"觀"},{"id":4326,"name":"泮宮石坊","lat":22.9902,"lng":120.20664,"cat":"worship","desc":"這座石坊曾是臺南孔廟最外層入口，清代知府蔣元樞重修孔廟時聘石匠雕造。後來南門路從中穿過，石坊才與原來所屬的廟區隔街相望。","area":"中西區・臺南市","ph":"觀"},{"id":4327,"name":"海安路藝術街","lat":22.99552,"lng":120.19975,"cat":"structure","desc":"海安路拓寬後留下半截屋牆、外露鋼筋與斑駁磚瓦。策展人杜昭賢邀集藝術家以這些地景創作，入夜燈光映照時，整條街就成了戶外展場。","area":"中西區・臺南市","ph":"觀"},{"id":4328,"name":"淺草新天地","lat":22.99379,"lng":120.19762,"cat":"history","desc":"正興街與國華街間的市集名稱，源自日治時期西門市場外圍的淺草商場。後來以二手市集結合文創攤位，讓年輕人也聚集到老市場街區。","area":"中西區・臺南市","ph":"觀"},{"id":4329,"name":"清代考棚遺構","lat":22.993089,"lng":120.208686,"cat":"history","tag":"歷史建築","area":"中西區・臺南市","ph":"文"},{"id":4330,"name":"清代道署遺構","lat":22.99277,"lng":120.20203,"cat":"history","tag":"古蹟","area":"中西區・臺南市","ph":"文"},{"id":4331,"name":"湯德章紀念公園","lat":22.99254,"lng":120.20547,"cat":"nature","desc":"府城街道在日治時期重新規劃，以圓環作為多條道路交會的中心。臺南州廳、合同廳舍等公共建築環繞公園，可從此看出當年市政中心的布局。","area":"中西區・臺南市","ph":"觀"},{"id":4332,"name":"看西街長老教會","lat":22.9961,"lng":120.19853,"cat":"worship","desc":"府城的宗教建築也包括基督教會，看西街的教會便是其中一處。從十九世紀起，醫師與牧師陸續來臺宣教，為臺南街巷帶來不同的信仰風景。","area":"中西區・臺南市","ph":"觀"},{"id":4333,"name":"祀典武廟","lat":22.996511,"lng":120.202214,"cat":"worship","tag":"古蹟","desc":"明鄭時期的大關帝廟，入清後成為主祀關公的官方祀典廟宇。從清廷對關公信仰的推崇，可了解這座府城武廟的名稱與地位如何形成。","area":"中西區・臺南市","ph":"文"},{"id":4334,"name":"神農街","lat":22.99757,"lng":120.19655,"cat":"structure","desc":"清代五條港繁盛時，商人從這條街出入府城，往來船貨也帶動沿街買賣。昔日的河港經百年演變成為都市道路，街巷仍連著港口記憶。","area":"中西區・臺南市","ph":"觀"},{"id":4335,"name":"總趕宮","lat":22.991995,"lng":120.199726,"cat":"worship","tag":"古蹟","desc":"府城船夫與漁民奉祀倪聖公，視他為熟悉港道、守護臺江船運的神明。三川殿有花卉、瑞獸剪黏，鏤空大門也兼具採光的作用。","area":"中西區・臺南市","ph":"文"},{"id":4336,"name":"臺南原清水寺街連棟街屋","lat":22.991774,"lng":120.206583,"cat":"worship","tag":"歷史建築","desc":"清水寺街曾是府城出小南門往鳳山的要道，居民重修道路後沿街建屋。日治初期這裡已是新興商區，也有日本商家向臺灣屋主租店營業。","area":"中西區・臺南市","ph":"文"},{"id":4337,"name":"臺南地方法院","lat":22.989517,"lng":120.200988,"cat":"history","tag":"古蹟","desc":"日治時期規劃的法院在一九一四年落成，是府城早期的司法建築。戰後西側高塔曾因地基下沉、牆面龜裂而面臨改動，留下古蹟維護的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4338,"name":"臺南報恩堂","lat":22.992478,"lng":120.203491,"cat":"worship","tag":"古蹟","desc":"先天派門人黃昌成最早在府城右營埔建小祠傳教，信徒增加後才集資改成瓦房。因日治政府籌建醫院徵用原址，齋堂後來遷至忠義路一帶。","area":"中西區・臺南市","ph":"文"},{"id":4339,"name":"臺南天壇","lat":22.99382,"lng":120.20406,"cat":"worship","tag":"古蹟","desc":"府城俗稱天公埕的祭祀場所，相傳與鄭成功郊天有關，碑記也留下這段傳承。早年在露天祭壇祈福，每逢玉皇上帝誕辰便舉行祭典。","area":"中西區・臺南市","ph":"文"},{"id":4340,"name":"臺南孔子廟","lat":22.990205,"lng":120.204103,"cat":"worship","tag":"古蹟","desc":"陳永華在明鄭時期創建先師聖廟，廟旁設明倫堂，使祭孔與講學在同一地相連。清代地方官捐資修葺，正殿曾懸有「萬世師表」匾。","area":"中西區・臺南市","ph":"文"},{"id":4341,"name":"臺南市利源巷隘門","lat":22.995942,"lng":120.201393,"cat":"structure","tag":"歷史建築","area":"中西區・臺南市","ph":"文"},{"id":4342,"name":"臺南市歷史館（原臺南市立博物館）","lat":22.98737,"lng":120.20821,"cat":"culture","desc":"延平郡王祠旁的歷史館，透過地方文物、史料與展示介紹臺南的成長。除了城市沿革，也能從常民生活的物件與地方文化，認識不同時代的府城。","area":"中西區・臺南市","ph":"觀"},{"id":4343,"name":"臺南德化堂","lat":22.989135,"lng":120.206134,"cat":"worship","tag":"古蹟","desc":"府城的龍華派齋堂由謝普爵等人發起，清道光年間號召齋友捐資興建。早期設在馬公廟街糖間埕，見證齋教信眾在臺南結社修行的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4344,"name":"臺南景福祠","lat":22.997704,"lng":120.198431,"cat":"worship","tag":"古蹟","desc":"佛頭港曾有眾多商船往返，普濟街的土地公廟便是附近商民的信仰所託。廟內保存「萬物資生」古匾，正殿燕尾脊上還可見雙龍搶珠的剪黏。","area":"中西區・臺南市","ph":"文"},{"id":4345,"name":"臺南東嶽殿","lat":22.990522,"lng":120.209357,"cat":"worship","tag":"古蹟","desc":"府城俗稱嶽帝廟的寺廟奉祀東嶽大帝，也就是泰山之神。民間相信祂掌管生死，清代以來已有信眾在此祈求平安與健康。","area":"中西區・臺南市","ph":"文"},{"id":4346,"name":"臺南水仙宮","lat":22.9967,"lng":120.19818,"cat":"worship","tag":"古蹟","desc":"府城海岸線向西推移後，五條港成了商船運貨的重要水路。廟前的南勢港曾沿神農街向西延伸，留下水仙宮與港區商業生活的連結。","area":"中西區・臺南市","ph":"文"},{"id":4347,"name":"臺南鄭氏家廟","lat":22.992583,"lng":120.203023,"cat":"worship","tag":"古蹟","desc":"府城最初奉祀鄭成功的祠堂，清代轉為家廟，宗親贖回後改建為鄭氏大宗祠。日治時期因市區改正拆去部分建物，家族仍延續祭祀。","area":"中西區・臺南市","ph":"文"},{"id":4348,"name":"臺南重慶寺","lat":22.991584,"lng":120.203612,"cat":"worship","tag":"歷史建築","desc":"這座臨濟宗寺院曾坐落於府城寧南坊，確切創建年代因史料不同而難定。早年建築呈三開間，三川門、正殿和後殿兩旁另有廂房。","area":"中西區・臺南市","ph":"文"},{"id":4349,"name":"臺灣府城城垣南門段殘蹟","lat":22.98561,"lng":120.20628,"cat":"history","desc":"樹林街旁保留八十多公尺長的府城南段城牆，如今也成為臺南女中的部分圍牆。修整時特意留下剖面，讓人看見城牆外觀之下的內部構造。","area":"中西區・臺南市","ph":"觀"},{"id":4350,"name":"臺灣府城城門及城垣殘蹟","lat":23.000751,"lng":120.194368,"cat":"history","tag":"古蹟","desc":"清代臺灣府城最初以木柵圍城，設四大門、三小門，後來又沿柵種刺竹。多座城門陸續改用石材，並增建小西門，留下城防逐步成形的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4351,"name":"臺灣府城大南門","lat":22.98695,"lng":120.20354,"cat":"other","area":"中西區・臺南市","ph":"觀"},{"id":4352,"name":"臺灣府城隍廟","lat":22.992015,"lng":120.209075,"cat":"worship","tag":"古蹟","desc":"府城的城隍廟過去靠近行政機關，新官上任會先到廟裡祭拜。抬頭可見「爾來了」匾額和大算盤，象徵城隍在民間信仰中察辨善惡的職責。","area":"中西區・臺南市","ph":"文"},{"id":4353,"name":"臺灣臨濮堂施姓大宗祠","lat":22.9951,"lng":120.19591,"cat":"worship","tag":"歷史建築","area":"中西區・臺南市","ph":"文"},{"id":4354,"name":"臺灣首廟天壇「天公廟」","lat":22.99387,"lng":120.20396,"cat":"worship","desc":"相傳此處原是明鄭時期祭告天地的壇場，清代才正式建廟，主祀玉皇上帝。正殿前簡潔的「一字匾」，是府城著名匾額之一。","area":"中西區・臺南市","ph":"觀"},{"id":4355,"name":"萬福庵照牆","lat":22.996192,"lng":120.202942,"cat":"worship","tag":"古蹟","desc":"庵前照牆是舊建築留下的入口屏障，內用紅磚砌築、外刷白灰。雙重屋脊中央略高，旁邊老榕樹的樹瘤形似猴群，也有「猴靈樹王公」之稱。","area":"中西區・臺南市","ph":"文"},{"id":4356,"name":"葉石濤文學紀念館（原山林事務所）","lat":22.99125,"lng":120.20465,"cat":"culture","desc":"舊山林事務所如今紀念臺灣作家葉石濤，他筆下常見在臺南生活的體會。從工作、戀愛到過日子，平凡日常也是認識他與府城關係的線索。","area":"中西區・臺南市","ph":"觀"},{"id":4357,"name":"蕭氏節孝坊","lat":22.990564,"lng":120.19893,"cat":"history","tag":"古蹟","desc":"清代蕭氏年輕喪夫後，照顧婆婆與祖母，也撫養兩個兒子長大。她的事蹟後來被呈報旌表，牌坊留下當時社會表彰女性節孝的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4358,"name":"蝸牛巷","lat":22.99302,"lng":120.20063,"cat":"culture","area":"中西區・臺南市","ph":"觀"},{"id":4359,"name":"西市場","lat":22.993953,"lng":120.19821,"cat":"history","tag":"古蹟","desc":"府城人稱為大菜市的公有市場，有醒目的馬薩式屋頂。老市場所留的汲水器、魚賣店磁磚畫，與修復後的熟食攤位和下沉廣場同在一個街區。","area":"中西區・臺南市","ph":"文"},{"id":4360,"name":"西德堂","lat":22.999877,"lng":120.194606,"cat":"worship","tag":"歷史建築","desc":"這處屬金幢教的齋堂，由陳快在清道光年間創立，初名西竹庵堂。日治時期因原址遭徵收而遷移，後又用第二任堂主的房舍改建。","area":"中西區・臺南市","ph":"文"},{"id":4361,"name":"西羅殿","lat":22.9969,"lng":120.19584,"cat":"worship","desc":"五條港郭姓族人在清康熙年間建廟，供奉廣澤尊王，地方也稱聖王公廟。殿中留有「恩祐全台」與「保安天下」等匾額，可細看歷代贈匾。","area":"中西區・臺南市","ph":"觀"},{"id":4362,"name":"赤崁文化園區","lat":22.997,"lng":120.20239,"cat":"culture","desc":"荷蘭人在安平築城後，又隔著臺江在赤崁社一帶建普羅民遮堡，作為政經據點。周邊發展出的赤崁街與普羅民遮街，也成了府城早期商業的一部分。","area":"中西區・臺南市","ph":"觀"},{"id":4363,"name":"赤崁東街陳宅","lat":22.997508,"lng":120.203681,"cat":"worship","tag":"古蹟","desc":"這棟住宅原為醫師陳天一返鄉執業所規劃，房屋完工前他已殉職。其子陳一鶴後來在此行醫，將一樓大廳兩側的住家空間改供診療。","area":"中西區・臺南市","ph":"文"},{"id":4364,"name":"赤崁樓","lat":22.99722,"lng":120.20242,"cat":"history","desc":"普羅民遮堡原是荷蘭人在赤崁設立的據點，歷次整修改建後成為今日的樓閣。園內海神廟、文昌閣與蓬壺書院，並列呈現不同時代的用途。","area":"中西區・臺南市","ph":"觀"},{"id":4365,"name":"赤嵌樓","lat":22.997516,"lng":120.202478,"cat":"history","tag":"古蹟","desc":"赤崁街與民族路口的樓宇，最早源於荷蘭人在此興建的堡壘。早年漢人也稱它紅毛樓或番仔樓，這些舊稱留下府城與荷蘭統治的歷史連結。","area":"中西區・臺南市","ph":"文"},{"id":4366,"name":"金華府","lat":22.997368,"lng":120.196544,"cat":"worship","tag":"古蹟","desc":"神農街上的廟宇主祀關聖帝君與馬、李二位王爺，相傳為五條港許姓族人興建。前殿燕尾脊上可見泥塑彩畫，兩側厚牆與鄰房相接。","area":"中西區・臺南市","ph":"文"},{"id":4367,"name":"開基武廟原正殿","lat":22.996408,"lng":120.200773,"cat":"worship","tag":"古蹟","desc":"昔日關帝港口附近的廟宇俗稱小關帝廟，港名也因鄰近廟口而來。信眾到廟裡參拜抽籤的人多，廟前街道遂有抽籤巷之稱。","area":"中西區・臺南市","ph":"文"},{"id":4368,"name":"開基永華宮","lat":22.9897,"lng":120.20517,"cat":"worship","desc":"孔廟旁府中街的巷子裡，藏著主祀廣澤尊王的宮廟。地方為紀念陳永華對文教的貢獻，以他為廟命名，裡頭也收藏早年的祭祀文物。","area":"中西區・臺南市","ph":"觀"},{"id":4369,"name":"陳世興宅","lat":22.996055,"lng":120.202884,"cat":"history","tag":"古蹟","desc":"陳家先祖在清初渡臺，後代以「陳世興」之名投資海埔地開墾。從府城向南北兩側闢田園、築魚塭，宅邸留下家族經商與土地開發的故事。","area":"中西區・臺南市","ph":"文"},{"id":4370,"name":"陳德聚堂","lat":22.99421,"lng":120.202252,"cat":"worship","tag":"古蹟","desc":"鄭氏時期陳澤在府城下大埕建宅，後因他受尊稱為統領公，家宅也稱統領府。後代整修住宅並轉為家廟，延續陳氏的祖先祭祀。","area":"中西區・臺南市","ph":"文"},{"id":4371,"name":"集福宮","lat":22.99979,"lng":120.19616,"cat":"worship","desc":"兌悅門旁信義街的石板路，舊時是五條港之一的新港墘港。沿岸搬貨的黃、王、劉姓碼頭工人從故鄉迎來玄天上帝，祈求船運與工作平安。","area":"中西區・臺南市","ph":"觀"},{"id":4372,"name":"風神廟","lat":22.997317,"lng":120.195749,"cat":"worship","tag":"古蹟","desc":"清代南河港旁的廟宇主祀風神爺，航海者與貿易商來此祈求風調雨順。它也曾位於官員往來臺灣與廈門的重要入口，連著府城水運的歷史。","area":"中西區・臺南市","ph":"文"},{"id":4373,"name":"鷲嶺食肆(原鶯料理)","lat":22.99368,"lng":120.20469,"cat":"other","desc":"日本料理人天野久吉在臺南開設鶯料理，因鄰近州廳、公會堂與銀行，常有政商人士到此宴聚。這段交際史也為料亭留下「地下決策中心」的稱呼。","area":"中西區・臺南市","ph":"觀"},{"id":4374,"name":"二層行溪舊公路橋","lat":22.914886,"lng":120.224691,"cat":"history","tag":"歷史建築","desc":"二層行溪曾是清代臺灣縣與鳳山縣的界河，舊公路橋就橫跨其上。橋體可見一體成形的混凝土護欄與不同時期修建的鋼梁，記下兩岸連結的歷史。","area":"仁德區・臺南市","ph":"文"},{"id":4375,"name":"二行清王宮","lat":22.91601,"lng":120.22264,"cat":"worship","desc":"仁德二行里舊稱二層行，是早期漢人開墾的據點，明鄭時期曾設萬年縣治。地方在宮前廣場立碑紀念，廟埕也因此連著府城以南的行政歷史。","area":"仁德區・臺南市","ph":"觀"},{"id":4376,"name":"仁德二空貿易四村興建碑","lat":22.959841,"lng":120.220704,"cat":"history","tag":"歷史建築","area":"仁德區・臺南市","ph":"文"},{"id":4377,"name":"仁德二空防空碉堡","lat":22.959981,"lng":120.222799,"cat":"history","tag":"歷史建築","area":"仁德區・臺南市","ph":"文"},{"id":4378,"name":"仁德十三甲武德宮","lat":22.94458,"lng":120.22271,"cat":"worship","desc":"十三甲庄頭供奉的中路武財神，相傳由清代渡臺先民從原鄉迎來，最初安奉在民宅。居民後來以土埆興建元帥廟，留下庄廟從家屋起步的歷程。","area":"仁德區・臺南市","ph":"觀"},{"id":4379,"name":"保安車站","lat":22.932954,"lng":120.23163,"cat":"history","tag":"古蹟","desc":"這座車站因車路墘製糖所的運輸需要，在日治時期自舊址向北遷移重建。站房留下仁德早年糖業與鐵路相互依靠的歷史。","area":"仁德區・臺南市","ph":"文"},{"id":4380,"name":"十鼓文創園區","lat":22.93936,"lng":120.23,"cat":"culture","desc":"舊糖廠的倉庫與製糖設施，成了十鼓擊樂團演出和活動的空間。園內保留多座日治時期建築，還能在工業遺產間接觸鼓樂與體能設施。","area":"仁德區・臺南市","ph":"觀"},{"id":4381,"name":"台南都會公園","lat":22.93731,"lng":120.22362,"cat":"nature","desc":"白色的奇美博物館矗立在大片草地與景觀池畔，是園中醒目的建築。水邊除了游動的天鵝，也常有白鷺鷥停下來休息、覓食。","area":"仁德區・臺南市","ph":"觀"},{"id":4382,"name":"大甲萬龍宮","lat":22.91392,"lng":120.21669,"cat":"worship","desc":"仁德港崎頭的廟宇背臨二仁溪，坐南朝北，採五門三殿形式。廟前成對的旗杆分立龍虎兩側，象徵受敕封神明的威儀。","area":"仁德區・臺南市","ph":"觀"},{"id":4383,"name":"太子廟明直宮","lat":22.99138,"lng":120.25739,"cat":"worship","desc":"仁德的宮廟主祀中壇元帥，也就是三太子。地方傳說把建廟起源連到鯽魚潭，一段逆流而上的木頭和一路跟隨的蚱蜢，引來居民注意。","area":"仁德區・臺南市","ph":"觀"},{"id":4384,"name":"奇美博物館","lat":22.93482,"lng":120.22619,"cat":"culture","desc":"阿波羅噴泉與橋上的奧林帕斯眾神雕像，沿著水面一路引向博物館。入口的高聳圓頂與希臘式列柱相接，遠望頗有歐洲宮殿的風貌。","area":"仁德區・臺南市","ph":"觀"},{"id":4385,"name":"岳王廟","lat":22.99169,"lng":120.27007,"cat":"worship","desc":"清道光年間落成的廟宇，坐落在舊稱六甲店的街區。昔日附近港口有小帆船停泊，街道兩旁店舖密集，地方名稱也來自這段商業歷史。","area":"仁德區・臺南市","ph":"觀"},{"id":4386,"name":"臺南家具產業博物館","lat":22.92394,"lng":120.22206,"cat":"culture","desc":"路旁高約五公尺的「大椅王」，是由永興家具行工廠改成的博物館地標。館內展示臺灣家具，也保留從工廠生產走向產業展示的歷程。","area":"仁德區・臺南市","ph":"觀"},{"id":4387,"name":"臺灣Holocaust和平紀念館(車路墘教會)","lat":22.93031,"lng":120.23088,"cat":"worship","desc":"車路墘教會二樓的紀念館，透過老照片與實物講述二戰期間猶太人受納粹迫害的歷史。從樓梯走向展場，可循著歐洲小鎮生活遭戰爭改變的過程觀看。","area":"仁德區・臺南市","ph":"觀"},{"id":4388,"name":"佳里北極玄天宮","lat":23.15392,"lng":120.179297,"cat":"worship","tag":"歷史建築","desc":"佳里蔡家祠堂舊稱榮昌堂，族人先祖於清代自福建漳州渡臺。後來家族祭祀逐漸擴展為三五甲角頭居民共祀的廟宇，留住街庄形成的過程。","area":"佳里區・臺南市","ph":"文"},{"id":4389,"name":"佳里木棉花道","lat":23.18006,"lng":120.15236,"cat":"other","desc":"佳里路旁的木棉又稱斑芝花，花色從橙到紅都有。春天花朵沿著長街陸續綻放，站在花道上可見兩旁樹冠染成一片火紅。","area":"佳里區・臺南市","ph":"觀"},{"id":4390,"name":"佳里金唐殿","lat":23.161184,"lng":120.176538,"cat":"worship","tag":"古蹟","desc":"佳里市場旁的廟宇可見匠師何金龍的剪黏作品，屋脊與壁堵各有題材。三川殿以雙龍搶珠為飾，轉看正殿則是雙龍護塔，龍身緊貼脊頂。","area":"佳里區・臺南市","ph":"文"},{"id":4391,"name":"佳里震興宮","lat":23.190977,"lng":120.188427,"cat":"worship","tag":"古蹟","desc":"三川殿門上是蔡草如的門神彩繪，屋脊剪黏則出自佳里匠師王保原之手。從雙龍護塔、魚躍龍門到廟角交趾陶，可細看不同工藝在殿前相遇。","area":"佳里區・臺南市","ph":"文"},{"id":4392,"name":"北頭洋平埔文化園區","lat":23.17297,"lng":120.16371,"cat":"culture","desc":"古稱蕭壠社的佳里一帶流傳著飛番的故事。相傳一位平埔族人擅跑，甚至在乾隆皇帝面前賽過馬匹，成了認識北頭洋地方文化的一段傳說。","area":"佳里區・臺南市","ph":"觀"},{"id":4393,"name":"原佳里郵便局","lat":23.16516,"lng":120.177515,"cat":"history","tag":"歷史建築","desc":"佳里的日治時期郵局保留了和洋兼具的外觀，屋簷下可見木製三角托架。木造格窗、百葉通氣窗與入口兩側的洗石子花圃，都是老建築的細節。","area":"佳里區・臺南市","ph":"文"},{"id":4394,"name":"原大日本武德會社宅","lat":23.163917,"lng":120.176087,"cat":"history","tag":"歷史建築","area":"佳里區・臺南市","ph":"文"},{"id":4395,"name":"子龍廟永昌宮","lat":23.17566,"lng":120.20894,"cat":"worship","desc":"佳里子龍里有座以子龍為名的庄廟，廟中主祀趙聖輔天帝君。這個封號指的是三國名將趙子龍，也點出了地方信仰的主角。","area":"佳里區・臺南市","ph":"觀"},{"id":4396,"name":"蕭壠文化園區","lat":23.17294,"lng":120.17935,"cat":"culture","desc":"老糖廠的倉庫如今設有藝陣館、西拉雅平埔文化館與兒童圖書館。穿過留有原本屋架的建築群，還能看見運糖軌道與昔日的小火車。","area":"佳里區・臺南市","ph":"觀"},{"id":4397,"name":"九品蓮花生態教育園區","lat":23.24486,"lng":120.31682,"cat":"culture","desc":"六甲的蓮花園由林朕古創立，培育的蓮花達數百種之多。除了觀賞不同品種的花形，園區也將栽培、產業與生態教育結合。","area":"六甲區・臺南市","ph":"觀"},{"id":4398,"name":"六甲鎮南宮","lat":23.22722,"lng":120.36673,"cat":"worship","desc":"六甲這座宮廟由柳營人林景棠創設，主祀孚佑帝君，後來隨信眾增加而擴建。廟後的赤山步道較為平緩，沿途有供歇腳和眺望的平臺。","area":"六甲區・臺南市","ph":"觀"},{"id":4399,"name":"林鳳營車站","lat":23.242612,"lng":120.320966,"cat":"history","tag":"歷史建築","desc":"日式站房採四坡屋頂，屋脊留著鬼瓦裝飾，候車室三面都有木造迴廊。細看廊柱，上下兩段木料以斜口螺栓銜接，立在錐形洗石子基座上。","area":"六甲區・臺南市","ph":"文"},{"id":4400,"name":"蓮花世界","lat":23.24507,"lng":120.31765,"cat":"other","desc":"林鳳營農場主人林森津多年鑽研蓮花，培育出數百個品種，地方稱他蓮花博士。園裡除了色彩豐富的香水蓮，也有少見的黑色睡蓮。","area":"六甲區・臺南市","ph":"觀"},{"id":4401,"name":"赤山龍湖巖","lat":23.21835,"lng":120.36176,"cat":"worship","desc":"六甲赤山半山腰上的佛寺，周圍環繞開闊湖水，少有住宅或商業街區。來到這裡可在靜下來的湖山之間，細看佛寺各處的裝飾工藝。","area":"六甲區・臺南市","ph":"觀"},{"id":4402,"name":"原三分子日軍射擊場靶溝遺構","lat":23.003794,"lng":120.226036,"cat":"history","tag":"歷史建築","area":"北區・臺南市","ph":"文"},{"id":4403,"name":"原日本陸軍臺南偕行社","lat":22.999953,"lng":120.212002,"cat":"history","tag":"歷史建築","desc":"日軍將校曾在偕行社集會、研習與聯誼，臺南留下的三棟建築都有外露木框的半木構立面。中央棟入口的切角屋頂，輪廓近似日式頭盔。","area":"北區・臺南市","ph":"文"},{"id":4404,"name":"原日軍台南衛戍病院","lat":23.002348,"lng":120.215666,"cat":"history","tag":"古蹟","desc":"這處日治時期的軍醫院位在今成大光復校區北側，戰後也長期收治軍人。後來地方熟悉的八〇四醫院就設在這裡，院址其後撥交成功大學。","area":"北區・臺南市","ph":"文"},{"id":4405,"name":"原日軍步兵第二聯隊官舍群","lat":23.004114,"lng":120.208431,"cat":"history","tag":"古蹟","desc":"臺南公園西側的土地在清代曾設鎮守臺澎總兵官署，長期是軍事要地。日治時期延用軍方用地設置營區與官舍，留下不同年代的軍事聚落。","area":"北區・臺南市","ph":"文"},{"id":4406,"name":"原臺南公園管理所","lat":23.003161,"lng":120.211519,"cat":"nature","tag":"古蹟","desc":"日治時期規劃臺南公園時，管理空間設在園區中段，方便照管庭園與公共設施。園景順著既有地形與池沼安排，兼具市民休憩與植物教育功能。","area":"北區・臺南市","ph":"文"},{"id":4407,"name":"台南公園(羊蹄甲林)、台南苦楝花(知事官邸)","lat":23.00206,"lng":120.2119,"cat":"nature","desc":"臺南公園的燕潭以月影映入水面的「燕潭曉月」聞名。潭畔是居民散步運動、親子嬉戲的地方，百年公園的風景也和府城人的日常相伴。","area":"北區・臺南市","ph":"觀"},{"id":4408,"name":"大觀音亭","lat":22.998482,"lng":120.20615,"cat":"worship","tag":"古蹟","desc":"鎮北坊的觀音亭因與小東門內的小觀音亭相對而稱「大」。早期《臺灣府志》記下廟中觀音金身與兩旁十八羅漢，可見府城觀音信仰的歷史。","area":"北區・臺南市","ph":"文"},{"id":4409,"name":"烏鬼井","lat":23.001762,"lng":120.204025,"cat":"history","tag":"古蹟","desc":"自強街巷內的古井位在鎮北坊，相傳井水充沛，取用不竭。早年除了附近居民，來往船隻也到這裡補充飲水，留下府城水路生活的記憶。","area":"北區・臺南市","ph":"文"},{"id":4410,"name":"王姓大宗祠","lat":22.999096,"lng":120.205919,"cat":"worship","tag":"古蹟","desc":"日治時期王汝禎等宗親發起籌設王姓大宗祠，數年後再度集力推動。族人曾在臺南公會堂正式成立宗親會，為跨家族的祭祖活動奠下基礎。","area":"北區・臺南市","ph":"文"},{"id":4411,"name":"神農殿","lat":23.00401,"lng":120.2053,"cat":"worship","area":"北區・臺南市","ph":"觀"},{"id":4412,"name":"臺南興濟宮","lat":22.998409,"lng":120.206305,"cat":"worship","tag":"古蹟","desc":"漳州與泉州移民把保生大帝信仰帶到府城，這座宮廟也在明鄭時期草創。信眾稱主神為吳真人或大道公，因此廟宇另有吳真人廟等稱呼。","area":"北區・臺南市","ph":"文"},{"id":4413,"name":"臺南轉運站","lat":23.00265,"lng":120.20947,"cat":"other","desc":"主站體兩側用六十四個貨櫃堆疊組合，建築本身就能看出模組的輪廓。可回收的貨櫃分別容納候車、商業與辦公用途，也保留日後調整空間的彈性。","area":"北區・臺南市","ph":"觀"},{"id":4414,"name":"西華堂","lat":22.999595,"lng":120.210296,"cat":"worship","tag":"古蹟","desc":"熱鬧市街的小巷中藏著金幢派齋堂，堂內主祀三寶佛。入口凹壽有「西華祖堂」匾，旁邊八角窗的琉璃花磚與木作彩繪值得細看。","area":"北區・臺南市","ph":"文"},{"id":4415,"name":"重道崇文坊","lat":23.002036,"lng":120.211642,"cat":"history","tag":"古蹟","desc":"清廷為表彰林朝英捐資修建縣學文廟，頒下「重道崇文」匾額並准予立坊。這座清嘉慶年間的牌坊，也是府城至今留存的牌坊之一。","area":"北區・臺南市","ph":"文"},{"id":4416,"name":"鎮北坊文化園區","lat":23.00851,"lng":120.208,"cat":"culture","desc":"清代鎮北坊聚集行政官署與軍事設施，今日範圍多在臺南北區。循著舊地名散步，自強街曾稱大銃街，崇安街也留有總爺街的稱呼。","area":"北區・臺南市","ph":"觀"},{"id":4417,"name":"開元寺","lat":23.011234,"lng":120.222556,"cat":"worship","tag":"古蹟","desc":"寺址原是鄭經在洲仔尾興建的北園別館，後來才改作佛寺。由外山門到大士殿共分五進，各進以庭院相隔，紅瓦廂房沿兩側展開。","area":"北區・臺南市","ph":"文"},{"id":4418,"name":"開基天后宮","lat":22.99963,"lng":120.202586,"cat":"worship","tag":"古蹟","desc":"這座府城宮廟主祀天上聖母，民間也暱稱媽祖婆。相傳媽祖本名林默，來自福建湄洲，隨著移民渡海，其信仰在臺灣各地扎根。","area":"北區・臺南市","ph":"文"},{"id":4419,"name":"三寮灣東隆宮","lat":23.23874,"lng":120.11163,"cat":"worship","area":"北門區・臺南市","ph":"觀"},{"id":4420,"name":"北門井仔腳瓦盤鹽田","lat":23.25956,"lng":120.10798,"cat":"history","tag":"歷史建築","desc":"北門井仔腳的瓦盤鹽田有兩百年歷史，是海岸居民長期製鹽的印記。從這片鹽田與聚落的關係，可認識沿海人家以鹽為業的往昔。","area":"北門區・臺南市","ph":"文"},{"id":4421,"name":"北門嶼基督教會","lat":23.26994,"lng":120.12398,"cat":"worship","desc":"永隆溝旁的白色教堂坐落在烏腳病醫療紀念館區內，與北門鹽鄉的生活史相連。教堂後方的小白宮與溝邊夕照，同是當地常見的取景畫面。","area":"北門區・臺南市","ph":"觀"},{"id":4422,"name":"北門嶼陳家古厝","lat":23.26582,"lng":120.12552,"cat":"history","tag":"歷史建築","desc":"陳德成夫婦率四個兒子在北門嶼興建三合院，從閩南採購木材、磚瓦與石料。還特地延請閩南匠師渡海營造，單是石作就耗費多年。","area":"北門區・臺南市","ph":"文"},{"id":4423,"name":"北門提溴塔","lat":23.26184,"lng":120.12536,"cat":"history","area":"北門區・臺南市","ph":"觀"},{"id":4424,"name":"北門潟湖","lat":23.25779,"lng":120.10707,"cat":"other","desc":"井仔腳鹽田旁的潟湖適合看夕照，晚霞讓一格格鹽田隨天色變換。鹽灘池裡也有堆鹽與挑鹽體驗，讓人踏在老瓦盤上認識製鹽工作。","area":"北門區・臺南市","ph":"觀"},{"id":4425,"name":"北門潟湖","lat":23.25973,"lng":120.10553,"cat":"other","desc":"臺南北門的潟湖也是看候鳥的地方。站在潟湖的水岸邊，有機會看見一群候鳥同時展翅，從水邊飛過。","area":"北門區・臺南市","ph":"觀"},{"id":4426,"name":"北門遊客中心","lat":23.26715,"lng":120.12397,"cat":"other","desc":"遊客中心由北門洗滌鹽工廠西南側的倉庫群改建而成。外牆可見取材自地方畫家洪通的畫作，旁邊還有彩繪牆與藝術裝置。","area":"北門區・臺南市","ph":"觀"},{"id":4427,"name":"北門錢來也雜貨店","lat":23.26812,"lng":120.12363,"cat":"history","desc":"斜瓦平房原是臺鹽鹽工福利社，供工人採買日用品與休閒。鹽場停業後一度閒置，後來以偶像劇《王子變青蛙》的雜貨店場景受到關注。","area":"北門區・臺南市","ph":"觀"},{"id":4428,"name":"北門鹽場(北門舊埕州北場鹽田)","lat":23.2667,"lng":120.12025,"cat":"other","area":"北門區・臺南市","ph":"觀"},{"id":4429,"name":"北門鹽場建物群及週邊古鹽田","lat":23.26884,"lng":120.12439,"cat":"history","tag":"歷史建築","desc":"急水溪口以南、三寮灣溪以北的鹽場，涵蓋井仔腳、蚵寮與洲北等鹽田。洲北鹽田曾數度遷移，沿革可追溯至明鄭時期洲仔尾的鹽業。","area":"北門區・臺南市","ph":"文"},{"id":4430,"name":"南鯤鯓代天府","lat":23.286132,"lng":120.143086,"cat":"worship","tag":"古蹟","desc":"北門的王爺廟奉祀李、池、吳、朱、范五府千歲。相傳舊廟因海嘯損毀，鄉人後來在桄榔山虎峰重建，形成今日的信仰中心。","area":"北門區・臺南市","ph":"文"},{"id":4431,"name":"台灣烏腳病醫療紀念館","lat":23.26955,"lng":120.12368,"cat":"culture","desc":"北門的醫療紀念館記錄曾影響臺灣西南沿海聚落的烏腳病。這種疾病會傷及下肢周邊血管，當地長期飲用含砷深井水被認為與發病有關。","area":"北門區・臺南市","ph":"觀"},{"id":4432,"name":"新安宮藝文中心","lat":23.28602,"lng":120.13342,"cat":"worship","desc":"鯤江里靠近南鯤鯓代天府的漁村，是畫家洪通生活創作的地方。這處藝文空間連著他的地方記憶，鮮明色彩與難以解讀的符號都是作品特色。","area":"北門區・臺南市","ph":"觀"},{"id":4433,"name":"東隆宮文化中心","lat":23.23833,"lng":120.1118,"cat":"worship","desc":"三寮灣矮小漁村裡，七層樓高的文化中心從遠處就很醒目。館內以廟宇藝術與迎神祭典為主題，讓人認識地方迎神賽會的熱鬧氣氛。","area":"北門區・臺南市","ph":"觀"},{"id":4434,"name":"東隆宮王爺信仰文物館","lat":23.2383,"lng":120.1117,"cat":"worship","desc":"東隆文化中心裡的文物館以王爺信仰為主題，收藏多種民俗文物。從地方留下的物件，可認識王爺祭祀與生活之間的連結。","area":"北門區・臺南市","ph":"觀"},{"id":4435,"name":"水晶教堂","lat":23.264,"lng":120.12271,"cat":"worship","area":"北門區・臺南市","ph":"觀"},{"id":4436,"name":"洪通故居彩繪村","lat":23.28176,"lng":120.14159,"cat":"culture","desc":"南鯤鯓附近的鯤江里，是素人畫家洪通的故鄉。地方稱他「朱豆叔仔」，他五十歲才開始作畫，後來以獨特創作讓小漁村受到注意。","area":"北門區・臺南市","ph":"觀"},{"id":4437,"name":"蘆竹溝漁港","lat":23.23451,"lng":120.09604,"cat":"other","desc":"將軍溪邊的漁港面對兩座沙洲，平靜水面映著一排排蚵棚。小筏在棚間穿梭，岸上白色蚵殼堆旁，有時要仔細看才能發現棲著的白鷺鷥。","area":"北門區・臺南市","ph":"觀"},{"id":4438,"name":"蘆竹溝觀光漁港","lat":23.23451,"lng":120.0963,"cat":"other","desc":"將軍溪出海口北岸的這座漁村，早年聚落間隔著許多溝渠。居民用蘆竹搭便橋進庄，「蘆竹溝」的地名就從這種生活方式而來。","area":"北門區・臺南市","ph":"觀"},{"id":4439,"name":"蚵寮漁港","lat":23.28544,"lng":120.1334,"cat":"other","area":"北門區・臺南市","ph":"觀"},{"id":4440,"name":"南化遊客中心","lat":23.03667,"lng":120.4781,"cat":"other","desc":"烏山腳下的遊客中心是銀級綠建築，俐落的外形融入周圍山景。館內備有熱水與淋浴等設施，也讓走訪南化或騎車的旅人能歇腳看山。","area":"南化區・臺南市","ph":"觀"},{"id":4441,"name":"大圓滿廟","lat":23.04261,"lng":120.47897,"cat":"worship","desc":"南化山路盡頭的藏傳佛寺屬紅教，紅色建築旁可見彩色幡旗與金色經輪。來訪人少時，寺院的鮮明色彩與周邊安靜環境格外突出。","area":"南化區・臺南市","ph":"觀"},{"id":4442,"name":"玉山寶光聖堂","lat":23.06905,"lng":120.51457,"cat":"worship","desc":"南化這處道場是臺南一貫道寶光組的信仰中心。王壽有感於年長道親陸續辭世，希望有人依信仰協助身後事，因此開始尋地籌建寶塔。","area":"南化區・臺南市","ph":"觀"},{"id":4443,"name":"龍湖寺","lat":23.02648,"lng":120.49683,"cat":"worship","desc":"五峯山上的巨大觀音像是寺院地標，在遠方就能辨認。廟前視野遼闊，可以遠望高雄茄萣與臺南市區，附近還能接上烏山登山步道。","area":"南化區・臺南市","ph":"觀"},{"id":4444,"name":"原臺灣總督府專賣局臺南支局","lat":22.96772,"lng":120.187997,"cat":"history","tag":"古蹟","desc":"俗稱鹽埕出張所的辦公廳舍，是日治時期管理鹽務的場所。迴廊連著主體與附屬建物，英式、日式雨淋板也呈現這組移築建築的和洋特色。","area":"南區・臺南市","ph":"文"},{"id":4445,"name":"忠靈塔（第三屆全省體育會紀念塔）","lat":22.97818,"lng":120.207991,"cat":"history","tag":"歷史建築","area":"南區・臺南市","ph":"文"},{"id":4446,"name":"水交社文化園區","lat":22.97765,"lng":120.20157,"cat":"culture","desc":"水交社的眷舍以水泥基臺架高，木格窗與磚瓦屋簷下還可見排水管。屋舍間的溝渠、荷花池、蘆葦與盤根老樹，保留了眷村院落的生活尺度。","area":"南區・臺南市","ph":"觀"},{"id":4447,"name":"灣裡萬年殿「鯤喜灣文化園區」","lat":22.93333,"lng":120.18048,"cat":"worship","desc":"位在臺江內海七鯤鯓之一的灣裡，萬年殿是一座臨海的王爺廟。廟中的百年王船，把聚落居民的信仰與昔日海岸生活連在一起。","area":"南區・臺南市","ph":"觀"},{"id":4448,"name":"第三屆全省運動會牌坊","lat":22.981222,"lng":120.207103,"cat":"history","tag":"歷史建築","area":"南區・臺南市","ph":"文"},{"id":4449,"name":"臺南市客家文化會館","lat":22.98525,"lng":120.19458,"cat":"culture","desc":"入口木招牌與花紋燈籠迎接來客，館內還以紙傘和紅燈籠布置。從農家器具、生活用品到手工藝與飲食，可認識臺南客家人的日常文化。","area":"南區・臺南市","ph":"觀"},{"id":4450,"name":"藍晒圖文創園區","lat":22.98709,"lng":120.19689,"cat":"culture","desc":"舊司法宿舍改成文創園區後，海安路熟悉的藍晒圖也以立體形式重現。入夜後白色線條映在藍牆上，與一旁暖黃燈光照亮的老樹相對。","area":"南區・臺南市","ph":"觀"},{"id":4451,"name":"鯤喜灣文化園區","lat":22.93147,"lng":120.17641,"cat":"culture","desc":"從鯤鯓碼頭到二仁溪畔，這片文化園區沿著臺南南區的海岸線展開。途中串起黃金海岸、喜樹藝術聚落與灣裡商圈，沙灘和村落交替出現。","area":"南區・臺南市","ph":"觀"},{"id":4452,"name":"鯤喜灣文化園區-保安宮","lat":22.9252,"lng":120.18061,"cat":"worship","desc":"這座戰後興建的宮廟，聚集了四位傳統工藝名家的作品。從葉進祿的剪黏、潘麗水的門神與梁枋，到蔡草如的神龕壁畫和施弘毅的石雕，都能細看。","area":"南區・臺南市","ph":"觀"},{"id":4453,"name":"鯤喜灣文化園區-海景天橋(龍崗天橋)","lat":22.9615,"lng":120.16956,"cat":"culture","desc":"海邊聚落裡的天橋一端接著國小，一端通向沙灘。這段當地居民與孩子日常走過的路，也讓人能從稍高處看沿岸聚落與海景。","area":"南區・臺南市","ph":"觀"},{"id":4454,"name":"鯤喜灣文化園區-萬皇宮","lat":22.9415,"lng":120.17778,"cat":"worship","desc":"喜樹地方的王爺廟奉祀葉、朱、李三府千歲，建築仿宮殿形式。廟內可看潘麗水等匠師的彩繪雕刻，十二年一度的王船建醮則是地方大事。","area":"南區・臺南市","ph":"觀"},{"id":4455,"name":"鯤喜灣文化園區-龍山寺","lat":22.96168,"lng":120.17153,"cat":"worship","desc":"泉州安溪與漳州平和移民，分別迎來清水祖師與三平祖師，在四鯤鯓立廟合祀。地方也以祖師公廟稱呼這座起源於明鄭時期的寺廟。","area":"南區・臺南市","ph":"觀"},{"id":4456,"name":"鳳凰吊橋","lat":22.97739,"lng":120.20849,"cat":"other","desc":"竹溪上這座長約二十五公尺的小吊橋，連接竹溪寺與市立體育公園。竹溪一帶在明清時期便是府城文人喜愛遊覽的地方，橋身與溪景相互呼應。","area":"南區・臺南市","ph":"觀"},{"id":4457,"name":"鹽埕北極殿","lat":22.96716,"lng":120.18854,"cat":"worship","desc":"鹽埕的玄天上帝廟長年陪伴以耕作、曬鹽維生的居民。早年廟旁的泮港可運鹽到安平，河港雖已消失，仍能從周邊曲折街巷想像昔日地形。","area":"南區・臺南市","ph":"觀"},{"id":4458,"name":"鹽埕天后宮","lat":22.97129,"lng":120.18947,"cat":"worship","desc":"廟後的帆港曾將鹽田產品運往安平，地方因此也稱此廟為帆港天后宮。宮內主祀媽祖，另奉來自泉州信仰的武惠尊王。","area":"南區・臺南市","ph":"觀"},{"id":4459,"name":"黑橋牌香腸博物館","lat":22.97969,"lng":120.18463,"cat":"culture","desc":"品牌名稱來自府前路旁起家的烏橋仔，博物館則以香腸產業為主題。入口的大碗公重現早年廟口香腸攤玩骰子的景象，從街頭記憶談起。","area":"南區・臺南市","ph":"觀"},{"id":4460,"name":"善化慶安宮","lat":23.133037,"lng":120.290144,"cat":"worship","tag":"古蹟","desc":"善化中山路一帶舊稱灣裡街，也是西拉雅目加溜灣社的生活地。清代在此設文昌閣奉祀五文昌帝君，東西兩廊兼作講學場所，曾是地方文教中心。","area":"善化區・臺南市","ph":"文"},{"id":4461,"name":"善化糖廠","lat":23.15428,"lng":120.28883,"cat":"other","desc":"善化的老糖廠以壓榨甘蔗的濃厚香氣，留在附近居民的記憶裡。廠邊有成片排列整齊的綠樹，也有人專程來取景或品嘗糖廠冰品。","area":"善化區・臺南市","ph":"觀"},{"id":4462,"name":"善化茄拔天后宮古井","lat":23.135308,"lng":120.326913,"cat":"worship","tag":"歷史建築","desc":"天后宮旁的古井以弧形磚塊砌成，其來歷相傳與鄭成功時期的屯墾有關。茄拔原是目加溜灣社分社所在，後來又有湄洲媽祖信仰傳入。","area":"善化區・臺南市","ph":"文"},{"id":4463,"name":"曾文溪鐵道舊橋遺蹟","lat":23.171543,"lng":120.321195,"cat":"history","tag":"歷史建築","area":"善化區・臺南市","ph":"文"},{"id":4464,"name":"糖廍連灶遺構","lat":23.14184,"lng":120.28896,"cat":"history","tag":"歷史建築","area":"善化區・臺南市","ph":"文"},{"id":4465,"name":"南瀛天文教育園區","lat":23.11766,"lng":120.39164,"cat":"culture","desc":"大內山坡上的天文園區分設觀測館、展示館與星象館，夜間觀星環境開闊、光害較低。白天從周邊也能看曾文溪曲流、河階與泥岩地形。","area":"大內區・臺南市","ph":"觀"},{"id":4466,"name":"南瀛天文館","lat":23.11806,"lng":120.39173,"cat":"culture","area":"大內區・臺南市","ph":"觀"},{"id":4467,"name":"大內石仔瀨天后宮","lat":23.12462,"lng":120.35472,"cat":"worship","desc":"石仔瀨的地方廟宇以天上聖母為主神，殿內還奉祀千里眼、順風耳。觀音、保生大帝、中壇元帥與虎爺等也在此同受香火。","area":"大內區・臺南市","ph":"觀"},{"id":4468,"name":"楊長利公厝","lat":23.11783,"lng":120.36182,"cat":"history","tag":"歷史建築","area":"大內區・臺南市","ph":"文"},{"id":4469,"name":"西拉雅部落-頭社","lat":23.14347,"lng":120.38662,"cat":"other","desc":"相傳新港社族人遷往淺山後，在此建立第一個支社，因此得名頭社。部落北側有三間式公廨，族人在太上龍頭忠義廟中奉祀祖靈太祖。","area":"大內區・臺南市","ph":"觀"},{"id":4470,"name":"頭社太上龍頭忠義廟「西拉雅公廨」","lat":23.15122,"lng":120.3839,"cat":"worship","desc":"頭社這座掛著廟名的建築，是西拉雅族祭祀太祖的公廨。日治時期原以草寮搭成，戰後改為黑瓦磚房，仍延續族人祭祀祖靈的用途。","area":"大內區・臺南市","ph":"觀"},{"id":4471,"name":"學甲大灣清濟宮","lat":23.21108,"lng":120.18633,"cat":"worship","desc":"學甲大灣的廟碑記下地方對水官大帝與保生大帝的崇敬。碑文分別以禹王、吳真人稱呼兩位神明，也提到立廟塑像與祭典的傳統。","area":"學甲區・臺南市","ph":"觀"},{"id":4472,"name":"學甲慈濟宮","lat":23.233949,"lng":120.180491,"cat":"worship","tag":"古蹟","desc":"學甲居民早年為求開墾平安奉祀保生大帝，逐步形成地方信仰中心。廟中留有葉王交趾陶與何金龍剪黏，可從人物釉色看到屋脊的細緻場景。","area":"學甲區・臺南市","ph":"文"},{"id":4473,"name":"陳桂記大宗祠","lat":23.24296,"lng":120.16214,"cat":"worship","desc":"這座宗祠的家族記憶可追溯到明鄭運糧官陳一桂，他攜家人與部眾從金門渡臺。族人在頭港與將軍溪之間的浮洲定居，將聚落命名中州。","area":"學甲區・臺南市","ph":"觀"},{"id":4474,"name":"頑皮世界野生動物園","lat":23.2809,"lng":120.20947,"cat":"scenic","desc":"臺南這座老字號動物園裡，入口可見金剛鸚鵡，園內也有企鵝、藪貓與狐獴。從長頸鹿到水豚，不同體形與習性的動物都是觀察對象。","area":"學甲區・臺南市","ph":"觀"},{"id":4475,"name":"『腳の眼鏡』足部科學體驗中心(紅崴科技股份有限公司)","lat":23.04329,"lng":120.15244,"cat":"other","desc":"這間觀光工廠以足部科學與健康為主題，提出「知足、正足、立足、跨足、滿足」的概念。寬敞大廳裡，楊惠姍製作的琉璃千手觀音像格外醒目。","area":"安南區・臺南市","ph":"觀"},{"id":4476,"name":"原安平鹽田船溜暨專賣局臺南支局安平出張所","lat":23.025935,"lng":120.143612,"cat":"history","tag":"古蹟","desc":"四草湖北岸的鹽田在日治時期開闢，後因行政改制而更名安順鹽田。留存的鹽務廳舍四周環繞迴廊，雨淋板外牆與附屬日式房舍勾勒昔日風貌。","area":"安南區・臺南市","ph":"文"},{"id":4477,"name":"原日本鐘淵曹達株式會社臺南工場辦公廳舍","lat":23.030249,"lng":120.123381,"cat":"history","tag":"歷史建築","area":"安南區・臺南市","ph":"文"},{"id":4478,"name":"台江十三佃鄭家社區博物館","lat":23.05446,"lng":120.19555,"cat":"culture","desc":"十三佃的鄭家祖厝與地方學校、廟宇及社區大學合作，把整個村落當成博物館。從家族與聚落的生活場景出發，可以認識臺江的墾拓史。","area":"安南區・臺南市","ph":"觀"},{"id":4479,"name":"台江生態文化園區","lat":23.00225,"lng":120.13875,"cat":"culture","desc":"位於台江國家公園的園區，將紅樹林、候鳥與濕地生態帶進環境教育。漁鹽產業與古戰場的歷史痕跡，也讓這片海岸有自然以外的故事。","area":"安南區・臺南市","ph":"觀"},{"id":4480,"name":"四草大眾廟","lat":23.00839,"lng":120.13623,"cat":"worship","area":"安南區・臺南市","ph":"觀"},{"id":4481,"name":"四草大眾廟","lat":23.01993,"lng":120.13513,"cat":"worship","desc":"安南四草的漁民在這座已有兩百多年歷史的廟宇奉祀鎮海元帥。元帥壽誕是地方信仰的重要日子，廟也凝聚著海邊聚落的生活。","area":"安南區・臺南市","ph":"觀"},{"id":4482,"name":"四草砲台（四草礮臺-鎮海城）","lat":23.01904,"lng":120.13481,"cat":"history","desc":"清英第一次鴉片戰爭期間，臺灣兵備道姚瑩規劃安平與臺江沿岸的防務。四草留下的砲臺，是當時奏議興建的十七座砲臺之一。","area":"安南區・臺南市","ph":"觀"},{"id":4483,"name":"四草礮臺(鎮海城)","lat":23.01859,"lng":120.134986,"cat":"history","tag":"古蹟","desc":"四草湖北岸的舊砲臺，曾與南岸數座砲臺共同守護安平港與府城。這處清代海防遺跡又稱鎮海城，一側牆垣可見黑白相間的卵石。","area":"安南區・臺南市","ph":"文"},{"id":4484,"name":"四草綠色隧道","lat":23.01978,"lng":120.13577,"cat":"scenic","desc":"水道兩岸的紅樹林朝中央生長，枝葉交會成一層層半圓形綠頂。管筏順水緩緩前行時，眼前的深綠廊道一路往遠處收攏。","area":"安南區・臺南市","ph":"觀"},{"id":4485,"name":"國立臺灣歷史博物館","lat":23.05787,"lng":120.23496,"cat":"culture","desc":"博物館坐落在昔日臺江內海之地，這裡曾吸引各地商人乘船來交易。隨著內海逐漸淤積成陸，館址本身便說明臺灣土地與生活環境的變遷。","area":"安南區・臺南市","ph":"觀"},{"id":4486,"name":"布袋嘴寮代天府(百年魚木)","lat":23.06239,"lng":120.20823,"cat":"worship","desc":"代天府所在的聚落位於總頭寮與中洲寮之間，先民來自嘉義布袋，因而舊稱布袋嘴寮。聚落一度併入鄰里，後來才恢復設里並定名布袋里。","area":"安南區・臺南市","ph":"觀"},{"id":4487,"name":"正統鹿耳門聖母廟","lat":23.06771,"lng":120.12737,"cat":"worship","desc":"土城地區的宮廟仿北京紫禁城的宮殿形式興建，是當地重要的信仰中心。走到廟前廣場，可見高大的順風耳與千里眼兩尊神將分立左右。","area":"安南區・臺南市","ph":"觀"},{"id":4488,"name":"臺南鹽田永鎮宮","lat":23.03344,"lng":120.14732,"cat":"worship","desc":"原在安順鹽場南寮的廟宇，以北門永隆宮的「永」與鎮海元帥的「鎮」合成廟名。鹽田庄因開發與生態保護而遷庄，廟宇也隨居民遷往新址。","area":"安南區・臺南市","ph":"觀"},{"id":4489,"name":"鄭成功紀念公園","lat":23.05841,"lng":120.11402,"cat":"nature","desc":"相傳鄭成功由鹿耳門進入臺灣，地方為紀念這段登陸歷史而闢建公園。園地由正統鹿耳門聖母廟捐出，入口的紅色牌樓是醒目的地標。","area":"安南區・臺南市","ph":"觀"},{"id":4490,"name":"香光聖堂","lat":23.05259,"lng":120.21292,"cat":"worship","desc":"這處一貫道聖堂主祀彌勒、燃燈與釋迦古佛，另設無盡藏文物館收藏古文物。廟埕前的主牌樓與四株百年茄苳，構成參拜前先見到的景色。","area":"安南區・臺南市","ph":"觀"},{"id":4491,"name":"鹽田生態文化村","lat":23.02602,"lng":120.14127,"cat":"other","area":"安南區・臺南市","ph":"觀"},{"id":4492,"name":"鹿耳門歷史文化區域地方文化館","lat":23.03721,"lng":120.12446,"cat":"culture","desc":"鹿耳門溪兩岸的聚落各自發展媽祖信仰，也保存關於鄭成功登陸的不同地方記憶。從文化館可認識媽祖宮仔、土城仔與這段河口歷史的關係。","area":"安南區・臺南市","ph":"觀"},{"id":4493,"name":"鹿耳門鎮門宮","lat":23.02086,"lng":120.11014,"cat":"worship","area":"安南區・臺南市","ph":"觀"},{"id":4494,"name":"安定保安宮","lat":23.11997,"lng":120.23674,"cat":"worship","desc":"安定的宮廟主祀保生大帝與天上聖母，也合祀城隍爺、註生娘娘等神祇。清代初建時的廟址在大道公營，與今天的廟宇所在地不同。","area":"安定區・臺南市","ph":"觀"},{"id":4495,"name":"蘇厝第一代天府真護宮","lat":23.12517,"lng":120.25122,"cat":"worship","area":"安定區・臺南市","ph":"觀"},{"id":4496,"name":"蘇厝長興宮","lat":23.12953,"lng":120.25056,"cat":"worship","desc":"相傳清康熙年間，蘇厝先民在曾文溪拾獲王船，便在溪旁搭草寮奉祀。當地人稱水道多變的曾文溪為青瞑蛇，庄廟故事也與河岸生活相連。","area":"安定區・臺南市","ph":"觀"},{"id":4497,"name":"二鯤鯓礮臺(億載金城)","lat":22.988034,"lng":120.159618,"cat":"history","tag":"古蹟","desc":"牡丹社事件後，沈葆楨聘請法國工程師，在二鯤鯓興建守護府城的砲臺。堡壘的設計參考巴黎城防形式，也是億載金城這處海防古蹟的由來。","area":"安平區・臺南市","ph":"文"},{"id":4498,"name":"億載金城 (二鯤鯓砲台)","lat":22.98836,"lng":120.16001,"cat":"history","area":"安平區・臺南市","ph":"觀"},{"id":4499,"name":"原安平港導流堤南堤","lat":22.986472,"lng":120.14938,"cat":"history","tag":"古蹟","desc":"舊港南堤所在的安平昔日是一座離島，與府城海岸之間隔著臺江灣。周邊沙洲與水道構成大船進出的港口地形，安平也曾以一鯤鯓為名。","area":"安平區・臺南市","ph":"文"},{"id":4500,"name":"原安平陳保正厝","lat":23.000564,"lng":120.163446,"cat":"history","tag":"歷史建築","desc":"延平街上的店舖住宅，曾是日治時期地方人物陳織雲的宅第。陳氏在清代隨水軍來臺駐防安平，後來家宅便設在聚落核心的商業街上。","area":"安平區・臺南市","ph":"文"},{"id":4501,"name":"原臺南運河安平海關","lat":22.998507,"lng":120.163941,"cat":"history","tag":"古蹟","desc":"臺南新運河開通時，安平船溜旁設置稅關派出所，後來成為運河博物館。紅磚承重牆與窗臺的白色仿石裝飾相間，館內可認識河港文史。","area":"安平區・臺南市","ph":"文"},{"id":4502,"name":"原臺灣總督府專賣局臺南支局安平分室","lat":23.002382,"lng":120.156381,"cat":"history","tag":"古蹟","desc":"昔日辦理專賣事務的安平分室，前後兩棟木屋採用不同形式的雨淋板。迴廊把庭園和屋舍連在一起，東側入口則有西式露臺般的玄關。","area":"安平區・臺南市","ph":"文"},{"id":4503,"name":"原英商德記洋行","lat":23.003457,"lng":120.159774,"cat":"history","tag":"古蹟","desc":"這家英商洋行最早在廈門創立，清代臺灣開放通商後才到安平設行。從港邊的洋行舊址，可以認識外商在府城開港後拓展貿易的歷史。","area":"安平區・臺南市","ph":"文"},{"id":4504,"name":"妙壽宮","lat":22.999646,"lng":120.161682,"cat":"worship","tag":"古蹟","desc":"安平古堡南方的渡頭邊，清代移民建廟奉祀保生大帝，並配祀三府王爺與土地公。「妙壽」二字取自保生大帝的封號，留下廟名與主神的關係。","area":"安平區・臺南市","ph":"文"},{"id":4505,"name":"安平古堡","lat":23.00092,"lng":120.16062,"cat":"history","desc":"荷蘭人在安平建起熱蘭遮堡，兼作防禦要塞與商業據點。鄭成功取得城堡後，把內城改為辦公所在，地方也因而以「王城」稱呼這片地方。","area":"安平區・臺南市","ph":"觀"},{"id":4506,"name":"安平天主教文物館","lat":23.00013,"lng":120.15941,"cat":"culture","desc":"聖樂倫天主堂一樓附設的文物館，收藏近千件宗教文物，並輪替展示。教堂鄰近小砲臺與洋行，讓西安平的港區歷史多了一處宗教風景。","area":"安平區・臺南市","ph":"觀"},{"id":4507,"name":"安平天后宮(開臺天后宮)","lat":23.00063,"lng":120.16066,"cat":"worship","desc":"安平的媽祖廟主祀天上聖母，神像相傳由鄭成功渡海來臺時迎奉。地方信仰把媽祖守護航程與軍隊登臺的故事，留在「開臺」二字之中。","area":"安平區・臺南市","ph":"觀"},{"id":4508,"name":"安平小砲臺","lat":22.999471,"lng":120.158533,"cat":"history","tag":"古蹟","desc":"這座砲臺原是為守衛安平港而建，如今周圍卻早已成了陸地。從砲臺與現在海岸的距離，可以想像港口因淤積而改變位置的歷程。","area":"安平區・臺南市","ph":"文"},{"id":4509,"name":"安平市仔街何旺厝","lat":23.00077,"lng":120.162752,"cat":"history","tag":"古蹟","desc":"延平老街的狹面寬住宅，是永豐餘創辦人何傳家族的祖厝，後作安平文化資產館。屋內連接二樓的樓梯又小又陡，最能看出老街屋的尺度。","area":"安平區・臺南市","ph":"文"},{"id":4510,"name":"安平樹屋","lat":23.00331,"lng":120.15956,"cat":"other","desc":"德記洋行後方的樹屋原本是商行倉庫，推測興建於十九世紀末至日治初期。後來鹽業公司也在此設倉，並增建到今日可見的規模。","area":"安平區・臺南市","ph":"觀"},{"id":4511,"name":"安平海頭社魏宅","lat":23.002121,"lng":120.162915,"cat":"history","tag":"古蹟","desc":"清代水師副總兵魏大猷後代的祖宅，在日治時期遷到現址重建。正身旁伸出單邊廂房，磚牆抹著蚵灰，正廳門上還有「景星慶雲」題字。","area":"安平區・臺南市","ph":"文"},{"id":4512,"name":"安平盧經堂厝","lat":23.00046,"lng":120.16008,"cat":"worship","tag":"古蹟","desc":"安平開港通商後，盧經堂以替外商辦理交易的買辦身分興起。這棟宅邸留下傳統郊商以外另一種商人活動，也連著安平港的對外貿易史。","area":"安平區・臺南市","ph":"文"},{"id":4513,"name":"安平老街(延平老街)","lat":23.00076,"lng":120.16173,"cat":"structure","desc":"延平老街早年的路幅只需容人與推車通過，直到今天仍保有狹窄街廓。沿街店舖密集，抬頭觀察兩旁老屋，也能看到熱鬧人潮之外的安平。","area":"安平區・臺南市","ph":"觀"},{"id":4514,"name":"安平蚵灰窯暨附屬建築","lat":23.002254,"lng":120.164892,"cat":"history","tag":"古蹟","desc":"安平人曾把蚵殼燒成蚵灰，用來黏合建築，也用來填補木船接縫。這座留存的蚵灰窯記下從海邊取材、再把成品用回聚落與漁船的產業。","area":"安平區・臺南市","ph":"文"},{"id":4515,"name":"安平鄉土文化館","lat":23.00032,"lng":120.16248,"cat":"culture","desc":"西門國小把昔日校長宿舍整理成鄉土文化館，延續老屋與安平教育的連結。木造房身配上瓦頂，仍可看出日治時期住宅的樣貌。","area":"安平區・臺南市","ph":"觀"},{"id":4516,"name":"朱玖瑩故居","lat":23.00334,"lng":120.15968,"cat":"culture","desc":"德記洋行旁的臺鹽宿舍，曾是鹽務總局局長、書法家朱玖瑩晚年的住處。館內展示他的顏體書法，也留下他以「安平老人」自號的生活足跡。","area":"安平區・臺南市","ph":"觀"},{"id":4517,"name":"海山館","lat":23.001382,"lng":120.162602,"cat":"worship","tag":"古蹟","desc":"這處館舍與清代福建班兵來臺輪值的歷史有關。入口兩旁有書卷形竹節窗，朝向巷道的側門塑有劍獅，院牆與窗格都藏著安平工藝的細節。","area":"安平區・臺南市","ph":"文"},{"id":4518,"name":"熱蘭遮堡遺構","lat":23.00111,"lng":120.15952,"cat":"history","tag":"古蹟","desc":"荷蘭東印度公司在安平興建堡壘，作為東亞海上貿易的轉運地，也肩負防禦任務。留存的遺構讓人從港口位置認識十七世紀商貿與城防的關係。","area":"安平區・臺南市","ph":"文"},{"id":4519,"name":"王雞屎洋宅","lat":23.00134,"lng":120.15912,"cat":"other","desc":"安平這棟洋樓直接取用屋主王雞屎的名字，他曾承攬鹽業公司的搬運工作。落成時四周多是閩式平房，洋樓與低矮街屋形成鮮明對照。","area":"安平區・臺南市","ph":"觀"},{"id":4520,"name":"臺南延平街古井","lat":23.000888,"lng":120.161498,"cat":"history","tag":"古蹟","desc":"熱蘭遮堡東南方的石板街，曾仰賴這口古井取得淡水，相傳井水充沛甘甜。日治時期安平有了自來水後，街坊仍繼續使用這處水源。","area":"安平區・臺南市","ph":"文"},{"id":4521,"name":"若晞茶空間(原台鹽宿舍)","lat":23.00213,"lng":120.15918,"cat":"other","area":"安平區・臺南市","ph":"觀"},{"id":4522,"name":"虱目魚主題館","lat":22.98312,"lng":120.15583,"cat":"culture","area":"安平區・臺南市","ph":"觀"},{"id":4523,"name":"西社西㡣殿","lat":23.00108,"lng":120.15942,"cat":"worship","desc":"國勝路巷內的古廟主祀池府千歲，是安平王城西社居民的信仰所在。匾名看似少見的「㡣」，其實是「龍」的異體字，讀音也相同。","area":"安平區・臺南市","ph":"觀"},{"id":4524,"name":"觀夕平台","lat":22.99023,"lng":120.14713,"cat":"scenic","desc":"安平海邊的三角形平臺兩側是防風林，前方沙灘常見孩子玩沙與放風箏。黃昏時人們停下腳步，看天邊雲彩隨夕陽改變顏色。","area":"安平區・臺南市","ph":"觀"},{"id":4525,"name":"八田與一紀念園區","lat":23.21393,"lng":120.36481,"cat":"culture","desc":"烏山頭水庫北側的園區，為紀念嘉南大圳設計者八田與一而設。修復建築時曾到他的故鄉石川縣考察，也借重日本木匠技術來呈現原貌。","area":"官田區・臺南市","ph":"觀"},{"id":4526,"name":"台鹽隆田儲運站","lat":23.190705,"lng":120.319065,"cat":"history","tag":"歷史建築","desc":"昔日鹽場的鐵路網與對外運輸線相接，隆田留下了儲存、轉運鹽品的倉庫群。磚倉的牆面有荷蘭式與法式砌法，也可對照不同時期的工法。","area":"官田區・臺南市","ph":"文"},{"id":4527,"name":"嘉南大圳官田溪渡槽橋","lat":23.17797,"lng":120.339164,"cat":"history","tag":"古蹟","area":"官田區・臺南市","ph":"文"},{"id":4528,"name":"嘉南大圳曾文溪渡槽橋","lat":23.154906,"lng":120.338692,"cat":"history","tag":"古蹟","desc":"嘉南大圳跨過曾文溪時，以架空水槽把灌溉水送到河流另一側。這座渡槽橋是八田與一設計的水利系統之一，讓圳水不因地面高低與溪谷中斷。","area":"官田區・臺南市","ph":"文"},{"id":4529,"name":"嘉南大圳渡仔頭溪渡槽橋","lat":23.168809,"lng":120.339952,"cat":"history","tag":"古蹟","area":"官田區・臺南市","ph":"文"},{"id":4530,"name":"大崎村落創藝基地","lat":23.19109,"lng":120.37142,"cat":"culture","desc":"烏山頭水庫蓄水時，原住在庫區的居民遷到隔一座山丘的大崎村。後來南藝大建築藝術研究所畢業生長期駐村，讓創作與村落生活在此相遇。","area":"官田區・臺南市","ph":"觀"},{"id":4531,"name":"官田原三筊埤古水道遺構","lat":23.208243,"lng":120.36594,"cat":"history","tag":"古蹟","area":"官田區・臺南市","ph":"文"},{"id":4532,"name":"官田水雉生態教育園區","lat":23.18305,"lng":120.31085,"cat":"culture","desc":"官田愛鳥人士從兩個貨櫃屋與一片荒地起步，慢慢整理出適合水雉生活的埤塘。周邊菱角田與水田提供食物，賞鳥亭的望遠鏡可用來觀察鳥類。","area":"官田區・臺南市","ph":"觀"},{"id":4533,"name":"官田水雉生態教育園區","lat":23.18445,"lng":120.31311,"cat":"culture","desc":"官田的濕地保育基地為水雉留下棲地，這種姿態輕巧的鳥也被稱為凌波仙子。園區結合觀察與環境教育，讓人認識保育工作和濕地之間的關係。","area":"官田區・臺南市","ph":"觀"},{"id":4534,"name":"葫蘆埤自然公園","lat":23.19822,"lng":120.29724,"cat":"nature","desc":"清代為灌溉開闢的番子田埤，被道路穿過後形似綁帶葫蘆，因而有了新名。菱角田間農人划舟的畫面，人稱「菱香舟影」，周邊也有水雉繁衍。","area":"官田區・臺南市","ph":"觀"},{"id":4535,"name":"跨虹吊橋","lat":23.20645,"lng":120.36373,"cat":"scenic","desc":"烏山頭水庫裡的小吊橋，曾是大崎居民與南藝大師生日常出入的重要通道。後來周邊道路拓寬，橋才從生活要道慢慢轉為遊人欣賞的景物。","area":"官田區・臺南市","ph":"觀"},{"id":4536,"name":"隆田10號糧倉","lat":23.195699,"lng":120.32105,"cat":"history","tag":"歷史建築","area":"官田區・臺南市","ph":"文"},{"id":4537,"name":"隆田chacha文化資產教育園區","lat":23.19096,"lng":120.31904,"cat":"culture","desc":"隆田的舊倉庫群保留四種鐵路匯集的產業遺跡，改造後成為文化資產教育園區。嘉南大圳主題劇場、互動裝置與考古展示，帶出平原水利與產業歷史。","area":"官田區・臺南市","ph":"觀"},{"id":4538,"name":"隆田隆本復興宮","lat":23.19921,"lng":120.31586,"cat":"worship","desc":"官田隆本村的復興宮位在西拉雅族早期居住的區域。這一帶俗稱「番仔田」，舊地名也留下隆本聚落與平埔族群生活的歷史連結。","area":"官田區・臺南市","ph":"觀"},{"id":4539,"name":"七股鹽場減資建物群","lat":23.178262,"lng":120.092588,"cat":"history","tag":"歷史建築","area":"將軍區・臺南市","ph":"文"},{"id":4540,"name":"台南漚汪原遂園","lat":23.205494,"lng":120.101183,"cat":"history","tag":"歷史建築","desc":"漚汪這處四合院前端曾設診所，後端與東側供家人居住。兩層洋樓、閩式磚木平房和連續磚拱圍出中庭，一處院落可見多種工法並用。","area":"將軍區・臺南市","ph":"文"},{"id":4541,"name":"將軍溪口紅樹林","lat":23.22579,"lng":120.11626,"cat":"scenic","desc":"從將軍溪堤上望去，大片紅樹林沿著河口一路伸向內陸。這片綠帶孕育出海口的生態，也讓人在漁市與沙灘之外看見將軍海岸的另一面。","area":"將軍區・臺南市","ph":"觀"},{"id":4542,"name":"將軍漁港","lat":23.21117,"lng":120.08859,"cat":"other","desc":"港邊的漁市連著可料理漁獲的餐廳，是臺南沿海規模較大的漁港。除了漁業日常，夏日的「將軍吼」音樂節也曾以這片水岸為舞臺。","area":"將軍區・臺南市","ph":"觀"},{"id":4543,"name":"將軍觀光漁港","lat":23.21161,"lng":120.08834,"cat":"other","area":"將軍區・臺南市","ph":"觀"},{"id":4544,"name":"方圓美術館","lat":23.19912,"lng":120.15749,"cat":"culture","desc":"將軍首任鄉長黃清舞的故居遂園，也曾是他為鄉民看診的遂生醫院。老屋改為美術館後，仍可見四合院配上拱門迴廊的中西合璧設計。","area":"將軍區・臺南市","ph":"觀"},{"id":4545,"name":"漚汪文衡殿","lat":23.198,"lng":120.1581,"cat":"worship","desc":"漚汪的關公信仰最初在民宅奉祀，清康熙年間才建廟。廟中不少石雕以關公為主角，細看能從人物與場景辨認出〈洛陽斬孟坦〉等三國故事。","area":"將軍區・臺南市","ph":"觀"},{"id":4546,"name":"青山漁港","lat":23.18967,"lng":120.0861,"cat":"other","desc":"安平與將軍兩大漁港之間，還有一座屬於青鯤鯓聚落的港口。走到青山漁港，可以看見臺南沿海小漁村不同於大港的生活風貌。","area":"將軍區・臺南市","ph":"觀"},{"id":4547,"name":"青鯤鯓扇形鹽田","lat":23.19387,"lng":120.08901,"cat":"other","desc":"將軍漁港以南、青鯤鯓以北的鹽田呈扇形，原屬七股鹽場第一工區。臺鹽在一九七〇年代開闢這片土地曬鹽，是臺灣較晚開發的鹽田。","area":"將軍區・臺南市","ph":"觀"},{"id":4548,"name":"馬沙溝3D彩繪村","lat":23.21714,"lng":120.09536,"cat":"other","desc":"馬沙溝以李聖宮為中心，把立體彩繪分散在漁村的大街小巷。作品出現在牆上也延伸到地面，轉過街角就可能遇見取材自當地生活的畫面。","area":"將軍區・臺南市","ph":"觀"},{"id":4549,"name":"鹽分地帶文化館-香雨書院","lat":23.19223,"lng":120.15706,"cat":"culture","desc":"鹽分地帶農田間的白色書院，前方有紅磚地坪與題著院名的矮牆。館內展出地方文物、藝術作品、老照片與古地圖，讓農村變遷有跡可循。","area":"將軍區・臺南市","ph":"觀"},{"id":4550,"name":"原臺南水道","lat":23.099204,"lng":120.36315,"cat":"history","tag":"古蹟","desc":"日治時期的臺南水道分為水源地與淨水池兩區，留有濾過器室、抽水機房及水質檢驗室。從水源地的老樹到淨水池前的長階梯，可以循線認識早期供水工程。","area":"山上區・臺南市","ph":"文"},{"id":4551,"name":"台南山上花園水道博物館","lat":23.09681,"lng":120.36,"cat":"nature","desc":"花園裡有孩子戲水的水花，走進花叢深處，又是另一種景色。紅磚屋頂著灰黑斜瓦，斑駁的建築留下昔日水道的痕跡。","area":"山上區・臺南市","ph":"觀"},{"id":4552,"name":"山上天后宮","lat":23.10283,"lng":120.358,"cat":"worship","desc":"廟裡供奉的「二娘娘」相傳曾是鄭成功水師的航海守護神。神像自福建渡海來臺，隨駐守大內北仔尾的部將落腳當地。","area":"山上區・臺南市","ph":"觀"},{"id":4553,"name":"臺南山上花園水道博物館","lat":23.09666,"lng":120.36015,"cat":"nature","desc":"日治時期興建的臺南水道，留下成套的淨水設施與歷史建築。循著庭園走進展區，可以認識百年前自來水工程如何運作。","area":"山上區・臺南市","ph":"觀"},{"id":4554,"name":"蘭科植物園","lat":23.09319,"lng":120.37461,"cat":"nature","desc":"山上牛稠埔的蘭園由吳明坤夫婦創辦，兩人本來專注於蘭花種苗改良。後來想讓更多人認識親手培育的花朵，便有了這座植物園。","area":"山上區・臺南市","ph":"觀"},{"id":4555,"name":"308高地","lat":22.97747,"lng":120.44265,"cat":"scenic","desc":"從左鎮草山的制高點望出去，眼前盡是起伏的白堊山稜。夏季陣雨過後，若陽光穿過山間薄霧，原本蒼白的山頭會染上金色。","area":"左鎮區・臺南市","ph":"觀"},{"id":4556,"name":"二寮日出","lat":22.99769,"lng":120.41131,"cat":"scenic","desc":"白堊山稜上長著竹林，竹梢在雲霧裡時隱時現。夏季雨後若遇上晴朗的清晨，初升的陽光會斜穿霧氣，照出深淺交錯的山景。","area":"左鎮區・臺南市","ph":"觀"},{"id":4557,"name":"二寮觀日平台","lat":22.9954,"lng":120.41035,"cat":"s
