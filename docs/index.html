cenic","desc":"二寮的觀景平台以低海拔雲海聞名，許多攝影愛好者來此守候日出。天色轉亮時，可以在這片靠近城市的山間看見曙光。","area":"左鎮區・臺南市","ph":"觀"},{"id":4558,"name":"噶瑪噶居寺","lat":23.05372,"lng":120.40005,"cat":"worship","desc":"左鎮山區這座藏傳佛寺，立有一尊高約二十公尺的佛像。除了仰望佛像，也可以近看殿宇各處的藏傳佛教裝飾與藝術細節。","area":"左鎮區・臺南市","ph":"觀"},{"id":4559,"name":"左鎮北極殿","lat":23.06798,"lng":120.40983,"cat":"worship","area":"左鎮區・臺南市","ph":"觀"},{"id":4560,"name":"左鎮教會（羅來受教會）","lat":23.04775,"lng":120.40407,"cat":"worship","area":"左鎮區・臺南市","ph":"觀"},{"id":4561,"name":"慈蓮寺","lat":23.00871,"lng":120.40173,"cat":"worship","desc":"岡林一處群山圍繞的盆地裡，白色牌樓與藍色琉璃瓦標示出寺院入口。清晨起霧時，附近的白堊山勢在霧裡層層浮現。","area":"左鎮區・臺南市","ph":"觀"},{"id":4562,"name":"臺南左鎮化石園區","lat":23.06418,"lng":120.38925,"cat":"culture","desc":"菜寮溪流域出土了豐富化石，左鎮也因此成為化石研究的重鎮。園區把菜寮化石館、自然史教育館和光榮國小串在一起，呈現在地的考古與自然史。","area":"左鎮區・臺南市","ph":"觀"},{"id":4563,"name":"草山月世界","lat":23.00946,"lng":120.42638,"cat":"scenic","desc":"草山溪、岡林溪切開了質地鬆軟的山岩，留下光禿的鋸齒狀山脊與峭壁。這一帶草木難以生長，荒地間仍可見耐旱的刺竹。","area":"左鎮區・臺南市","ph":"觀"},{"id":4564,"name":"要月吊橋","lat":23.00556,"lng":120.43019,"cat":"scenic","desc":"草山的舊吊橋曾是居民出入的要道，早年以附近住戶李德興的名字為橋名。上游另築新橋以後，舊橋拆除重建，成為今日的要月吊橋。","area":"左鎮區・臺南市","ph":"觀"},{"id":4565,"name":"下茄苳旌忠廟","lat":23.351647,"lng":120.363389,"cat":"worship","tag":"歷史建築","desc":"當地人習慣稱這裡為元帥廟，正殿主祀岳府元帥岳飛。廟宇創建於清代，與下茄苳泰安宮同為附近街庄的重要信仰中心。","area":"後壁區・臺南市","ph":"文"},{"id":4566,"name":"台糖烏樹林園區","lat":23.32872,"lng":120.37372,"cat":"culture","desc":"後壁的烏樹林糖廠保留了糖業鐵道，從前運送甘蔗的小火車也成了園區主角。老車站曾連繫白河、東山與新營，今日還可認識五分車的運作。","area":"後壁區・臺南市","ph":"觀"},{"id":4567,"name":"墨林農村文物展示館","lat":23.37887,"lng":120.33656,"cat":"culture","desc":"菁寮醫師梁耀明的故居，留著看診時用過的家具和器物。屋裡也收藏農村舊用品，進駐的藍染工坊則延續了地方手作傳統。","area":"後壁區・臺南市","ph":"觀"},{"id":4568,"name":"後壁上茄苳樟樹廊道","lat":23.37481,"lng":120.37488,"cat":"other","desc":"八掌溪與急水溪沖積出後壁狹長的平原，充沛水源也養出了大片稻田。上茄苳的樟樹廊道就在這片田野間，樹影與農田各有層次。","area":"後壁區・臺南市","ph":"觀"},{"id":4569,"name":"後壁無米樂社區(無米里社區由菁寮里、墨林里、後廍里所組成)","lat":23.38096,"lng":120.33756,"cat":"other","desc":"紀錄片《無米樂》把鏡頭帶進後壁的農村，崑濱伯、文林伯等人成為片中的主角。從這些村民的故事，可以認識臺南農家的日常與處世態度。","area":"後壁區・臺南市","ph":"觀"},{"id":4570,"name":"後壁車站","lat":23.366246,"lng":120.360529,"cat":"history","tag":"歷史建築","desc":"木造站房裡的檜木柱在上方分岔成Ｙ形，下方則立在洗石子基座上。站旁的《無米樂》人物塑像，讓鐵道建築也連起後壁農村的故事。","area":"後壁區・臺南市","ph":"文"},{"id":4571,"name":"後菁寮義昌碾米廠","lat":23.380125,"lng":120.336625,"cat":"history","tag":"歷史建築","desc":"菁寮一帶從前有好幾間碾米廠，義昌便是其中之一。這間廠曾由地方居民共同經營，經黃姓業主轉手後，才由梁乃文夫婦接掌。","area":"後壁區・臺南市","ph":"文"},{"id":4572,"name":"臺灣蘭花生物科技園區","lat":23.34007,"lng":120.37881,"cat":"culture","desc":"後壁的溫室聚落集結了臺灣蘭花栽培產業，也是臺灣國際蘭展的舉辦地。展覽以不同主題搭配在地培育的蘭花，讓人看見育種與栽培的成果。","area":"後壁區・臺南市","ph":"觀"},{"id":4573,"name":"芙蓉埤生態園區","lat":23.33403,"lng":120.35783,"cat":"culture","desc":"原是林家祖厝前的風水池，一度堆滿廢土，後來由社區居民整治成生態埤塘。池中的人工浮島種著淨水植物，沿步道可見山芙蓉等原生植物。","area":"後壁區・臺南市","ph":"觀"},{"id":4574,"name":"菁寮老街","lat":23.37867,"lng":120.33588,"cat":"structure","desc":"清代的菁寮是前往諸羅縣城的重要驛站，商家圍繞十字路口聚集。從旅館、撞球間到戲院都曾在此營業，留下老街往日熱鬧的輪廓。","area":"後壁區・臺南市","ph":"觀"},{"id":4575,"name":"菁寮聖十字架天主堂","lat":23.37911,"lng":120.33586,"cat":"worship","desc":"後壁菁寮的這座天主堂由建築師波姆設計。這位普立茲克建築獎得主的作品，也讓人能在臺南農村看見他的教堂建築。","area":"後壁區・臺南市","ph":"觀"},{"id":4576,"name":"菁寮金德興藥舖","lat":23.37924,"lng":120.33594,"cat":"history","tag":"古蹟","desc":"阮家的金德興藥舖用福州杉木搭建，木構件彼此以榫接相扣。抬頭看閣樓，窗框的竹節造型與八角形輪廓，是這棟老屋細緻的地方。","area":"後壁區・臺南市","ph":"文"},{"id":4577,"name":"原新化回生院","lat":23.034393,"lng":120.305043,"cat":"history","tag":"歷史建築","area":"新化區・臺南市","ph":"文"},{"id":4578,"name":"原新化街役場","lat":23.038252,"lng":120.307377,"cat":"history","tag":"歷史建築","desc":"這座一九三四年興建的街役場，後來成了古蹟餐坊。從外觀看不出裡面的木作規模，走進屋內抬頭看，還能辨認原有的屋頂構造。","area":"新化區・臺南市","ph":"文"},{"id":4579,"name":"原新化郡公會堂","lat":23.037954,"lng":120.310447,"cat":"history","tag":"歷史建築","desc":"日治時期的新化居民有了專供會議與表演使用的公會堂。從原本借用廟埕或宅邸集會，到另建公共場所，這棟建築記下了社交生活的轉變。","area":"新化區・臺南市","ph":"文"},{"id":4580,"name":"天壇護安宮","lat":23.03479,"lng":120.30948,"cat":"worship","desc":"地方俗稱這座廟為王公廟，奉祀的護國尊王與謝府元帥分別是東晉的謝安、謝玄。兩人是叔姪，也同是淝水之戰的功臣。","area":"新化區・臺南市","ph":"觀"},{"id":4581,"name":"平埔原住民族群文化會館","lat":23.05926,"lng":120.29608,"cat":"culture","desc":"會館所在的永就里舊稱番仔寮，正位在昔日新港社與大目降交界。從這個位置認識平埔原住民族文化，也能理解周邊西拉雅部落的地理關係。","area":"新化區・臺南市","ph":"觀"},{"id":4582,"name":"新化朝天宮","lat":23.03957,"lng":120.30724,"cat":"worship","desc":"新化地方傳說裡，地震毀廟後蜘蛛精出來作亂，居民依媽祖指示重建宮廟並繞境鎮壓。這段故事也連著地方陣頭「大目降十八嬈」的由來。","area":"新化區・臺南市","ph":"觀"},{"id":4583,"name":"新化武德殿","lat":23.033263,"lng":120.308821,"cat":"worship","tag":"歷史建築","desc":"昔日柔道與劍道的練習場所，在建築上也融入了西式裝飾。可以順著洗石子外框看木窗的排列，矩形窗與上方圓窗彼此呼應。","area":"新化區・臺南市","ph":"文"},{"id":4584,"name":"新化神社遺構","lat":23.026783,"lng":120.336783,"cat":"worship","tag":"歷史建築","desc":"虎頭埤頭山上的新化社創設於日治時期，起初列為無格社。地方興建神社的緣起，還牽涉報社舉辦的「臺灣八景」徵選活動。","area":"新化區・臺南市","ph":"文"},{"id":4585,"name":"新化老街","lat":23.03587,"lng":120.30803,"cat":"structure","desc":"巴洛克風格的街屋連成街景，留下新化作為臺南山區入口的商業氣象。日治時期商賈雲集，街上也有日本人、漢人與平埔族群往來。","area":"新化區・臺南市","ph":"觀"},{"id":4586,"name":"新化鍾家古厝","lat":23.038748,"lng":120.31111,"cat":"history","tag":"古蹟","desc":"祖籍福建同安的鍾家在清末遷到此地，鍾鏡清的宅第建於一八八五年。日軍來臺之際，北白川宮能久親王也曾借宿這座宅院。","area":"新化區・臺南市","ph":"文"},{"id":4587,"name":"楊逵紀念館","lat":23.03784,"lng":120.30745,"cat":"culture","desc":"紀念館保存了新化作家楊逵使用過的桌椅，木桌上還有一處凹痕。相傳他寫作思考時習慣以手肘撐桌，日積月累才留下這道印記。","area":"新化區・臺南市","ph":"觀"},{"id":4588,"name":"歐威電影館","lat":23.03789,"lng":120.30763,"cat":"culture","desc":"新化老街附近也留有電影人的足跡，歐威電影館便是其中一站。鄰近的楊逵紀念館與新化街役場，可以接著走訪，認識地方文史的不同面向。","area":"新化區・臺南市","ph":"觀"},{"id":4589,"name":"洋仔保生大帝廟","lat":23.03542,"lng":120.29707,"cat":"worship","desc":"新化豐榮里俗稱洋仔，當地的保生大帝廟舊稱大帝宮。縣志記有大道公廟的淵源，確切創建年代仍待考，現有廟史則可見清代多次翻修的紀錄。","area":"新化區・臺南市","ph":"觀"},{"id":4590,"name":"綠谷西拉雅","lat":23.01608,"lng":120.36853,"cat":"other","desc":"新化曾是平埔族人聚居的地方，園區重新呈現早期的生活景象。循著傳統文化與農村生態兩條線索，可以認識這片土地與居民的關係。","area":"新化區・臺南市","ph":"觀"},{"id":4591,"name":"虎月吊橋","lat":23.02649,"lng":120.33694,"cat":"other","desc":"吊橋橫跨虎頭埤水面，另一頭接上湖中的小島。走到島上涼亭回望，清晨與黃昏的光影都映進湖面，這片水域也曾出現在電影《天台》中。","area":"新化區・臺南市","ph":"觀"},{"id":4592,"name":"南部科學園區","lat":23.10146,"lng":120.28201,"cat":"culture","desc":"高科技廠區之間散布著滯洪池、草地與生態保護區。沿途也能看到裝置藝術和帶有族群文化特色的西拉雅廣場。","area":"新市區・臺南市","ph":"觀"},{"id":4593,"name":"國立臺灣史前文化博物館南科考古館","lat":23.10029,"lng":120.28377,"cat":"culture","desc":"南科開發期間的考古調查，陸續發現多處年代相疊的遺址。館內保存與展示搶救發掘的成果，從距今約五千年到三百多年前，都留下生活痕跡。","area":"新市區・臺南市","ph":"觀"},{"id":4594,"name":"大社張氏中廳","lat":23.092569,"lng":120.31745,"cat":"history","tag":"歷史建築","area":"新市區・臺南市","ph":"文"},{"id":4595,"name":"大社東勢北極殿","lat":23.09039,"lng":120.32914,"cat":"worship","desc":"大社里有數座玄天上帝廟，東勢北極殿珍藏泥塑的玄天上帝神像。殿後涼亭保存上帝公印，廟庭兩側還可見從泉州而來的七星石燈。","area":"新市區・臺南市","ph":"觀"},{"id":4596,"name":"新市永安宮","lat":23.07728,"lng":120.29385,"cat":"worship","desc":"這裡奉祀的媽祖又稱木柵媽祖，名稱保留了臺江內海舊時木柵港的記憶。居民因水患等因素遷往高地，今日的廟宇則可細看閩南式木構與彩繪。","area":"新市區・臺南市","ph":"觀"},{"id":4597,"name":"樹谷生活科學館","lat":23.10348,"lng":120.26241,"cat":"culture","desc":"館內從生物、考古和科學三方面展開自然史故事，骨骼標本尤其醒目。恐龍骨架與長毛象化石高高立起，周圍還能看到其他古生物的化石。","area":"新市區・臺南市","ph":"觀"},{"id":4598,"name":"南瀛綠都心5號公園","lat":23.31068,"lng":120.31477,"cat":"nature","desc":"民治市政中心前的公園，是許多新營居民共同的記憶。數十年來，新營與周邊地區的不少活動都選在這裡舉行，串起地方日常。","area":"新營區・臺南市","ph":"觀"},{"id":4599,"name":"原新營糖廠員工餐廳","lat":23.2985,"lng":120.31606,"cat":"history","tag":"歷史建築","area":"新營區・臺南市","ph":"文"},{"id":4600,"name":"原鹽水港製糖株式會社總社辦公室","lat":23.298267,"lng":120.319159,"cat":"history","tag":"古蹟","desc":"急水溪畔的新營糖廠，過去隸屬以耕地白糖聞名的鹽水港製糖株式會社。從臺資創設到日資成為主力，總社辦公室也見證製糖事業的轉變。","area":"新營區・臺南市","ph":"文"},{"id":4601,"name":"同濟宮","lat":23.31115,"lng":120.31811,"cat":"worship","desc":"新營居民口中的王公廟，奉祀開漳聖王及李府、池府等多位千歲。廟中也可見中壇元帥、註生娘娘與媽祖，凝聚了地方多樣的民間信仰。","area":"新營區・臺南市","ph":"觀"},{"id":4602,"name":"天鵝湖公園(舊名埤寮埤)","lat":23.33161,"lng":120.31724,"cat":"nature","desc":"原名埤寮埤的湖泊，過去是附近農田的灌溉水源。沿木棧道繞湖散步，可以望見拱橋橫跨水面，以及湖畔荷花映著綠意的景色。","area":"新營區・臺南市","ph":"觀"},{"id":4603,"name":"新營印度紫檀綠色隧道","lat":23.26641,"lng":120.27222,"cat":"other","desc":"鐵線里的印度紫檀沿路形成綠色隧道，同一聚落還有清代創建的通濟宮。看過樹蔭，也可留意古廟的龍柱、剪黏以及黑白兩尊軟身媽祖。","area":"新營區・臺南市","ph":"觀"},{"id":4604,"name":"新營太子宮","lat":23.294994,"lng":120.273808,"cat":"worship","tag":"古蹟","desc":"這座廟奉祀民間俗稱三太子的哪吒，地方也跟著廟宇繁盛起來。太子宮後來同時成為地名，居民仍沿用這個熟悉的稱呼指稱廟宇。","area":"新營區・臺南市","ph":"文"},{"id":4605,"name":"新營濟安宮","lat":23.30243,"lng":120.31131,"cat":"worship","desc":"新營人俗稱這座保生大帝廟為「大廟」。相傳早年有人受神明託夢，庄民便從福建同安白礁迎來神像，起初只搭了草寮奉祀。","area":"新營區・臺南市","ph":"觀"},{"id":4606,"name":"新營真武殿","lat":23.29977,"lng":120.31311,"cat":"worship","area":"新營區・臺南市","ph":"觀"},{"id":4607,"name":"新營縣府日式木造官舍","lat":23.310295,"lng":120.322405,"cat":"history","tag":"歷史建築","desc":"日式木造官舍的玄關設有格子拉門，上方的小窗負責引光通風。木牆裡藏有竹片交編、敷泥抹灰的傳統工法，外側再覆上層層木板。","area":"新營區・臺南市","ph":"文"},{"id":4608,"name":"新營鐵道文化園區","lat":23.2999,"lng":120.31664,"cat":"culture","area":"新營區・臺南市","ph":"觀"},{"id":4609,"name":"民治市政中心","lat":23.31155,"lng":120.31473,"cat":"other","desc":"這裡原是臺南縣政府所在地，縣市合併後改為臺南市政府民治市政中心。今日的新營仍保有這處行政據點，承接大臺南北部的市政事務。","area":"新營區・臺南市","ph":"觀"},{"id":4610,"name":"臺南市南瀛客家文化會館","lat":23.30902,"lng":120.3122,"cat":"culture","desc":"新營市區兩棟舊縣府建物整修後，成了推廣客家文化的據點。館內陳設帶著客家特色，也透過研習與交流活動服務在地鄉親。","area":"新營區・臺南市","ph":"觀"},{"id":4611,"name":"鐵線橋通濟宮","lat":23.26466,"lng":120.27661,"cat":"worship","tag":"古蹟","desc":"急水溪畔的鐵線橋舊時是農產進出的港鎮，通濟宮便坐落在這個聚落。廟前可看洗石子龍柱，三川門與正殿山牆則各有不同題材的泥塑。","area":"新營區・臺南市","ph":"文"},{"id":4612,"name":"原台南廳長官邸","lat":22.993346,"lng":120.215061,"cat":"history","tag":"古蹟","desc":"昔日臺南廳長的住所包含洋館與和館，兩者留下的樣貌不同。洋館迴廊仍可細看木雕托架與古典柱頭，和館則留下磚造地基和花磚地坪。","area":"東區・臺南市","ph":"文"},{"id":4613,"name":"原日軍臺灣步兵第二聯隊營舍","lat":22.99975,"lng":120.216058,"cat":"history","tag":"古蹟","desc":"日治時期的步兵聯隊留下三棟營舍，後來成為大學館舍。建築外側的拱廊一段段相連，兩棟原兵舍的入口還以古典柱列和山牆凸顯門面。","area":"東區・臺南市","ph":"文"},{"id":4614,"name":"原臺南縣知事官邸","lat":22.992596,"lng":120.213382,"cat":"history","tag":"古蹟","desc":"日治初期，府城東側崙仔頂的高地被選作官舍區。知事官邸兼有首長居住與接待賓客的用途，留下當年官員公務與起居的空間記憶。","area":"東區・臺南市","ph":"文"},{"id":4615,"name":"原臺灣府城東門段城垣殘蹟","lat":22.98681,"lng":120.215,"cat":"history","desc":"光華街上的這段殘牆，原在府城大東門與小東門之間。從構造與外觀推測，它可能與成大校內的小東門段同為清代改築土城時的遺構。","area":"東區・臺南市","ph":"觀"},{"id":4616,"name":"原臺灣總督府專賣局臺南出張所","lat":22.998978,"lng":120.212831,"cat":"history","tag":"古蹟","desc":"日治時期設立的專賣局出張所，曾負責保管鴉片煙與藥品試驗等事務。老建築的拱門、拱窗圍著庭園，窗臺下還可留意通氣孔的形式。","area":"東區・臺南市","ph":"文"},{"id":4617,"name":"台南文化創意產業園區","lat":22.99906,"lng":120.21265,"cat":"culture","desc":"車站旁的紅色老建築曾是總督府專賣局的出張所，如今轉作文化創意園區。原本處理專賣業務的空間成了展場，身後則立著現代高樓。","area":"東區・臺南市","ph":"觀"},{"id":4618,"name":"台灣基督長老教會歷史檔案館","lat":22.98967,"lng":120.21389,"cat":"worship","desc":"館藏記錄基督教宣教師在臺活動的歷程，也保留語言文字的歷史線索。從早期對原住民族語的記錄，到後來推動醫療與教育，都可見其影響。","area":"東區・臺南市","ph":"觀"},{"id":4619,"name":"大東門","lat":22.987,"lng":120.21746,"cat":"history","desc":"府城大東門立在圓環中央，兩面的門額各有名字，東側是東安門，西側是迎春門。留意城門上昔日防守用的射擊口，還能想見它原有的用途。","area":"東區・臺南市","ph":"觀"},{"id":4620,"name":"巴克禮公園","lat":22.97086,"lng":120.22253,"cat":"nature","desc":"與臺南文化中心相對的大片綠地，林間小徑散落著穿過枝葉的光影。春夏草木茂密，偶爾可見螢光，到了秋冬則換成黃紅色的落羽松。","area":"東區・臺南市","ph":"觀"},{"id":4621,"name":"彌陀寺","lat":22.98821,"lng":120.21439,"cat":"worship","desc":"府城四大名剎之一的彌陀寺，起初規模較小，稱作彌陀室。清代商家與信徒合捐的大鐘歷經戰火，留下信眾共同護持寺院的故事。","area":"東區・臺南市","ph":"觀"},{"id":4622,"name":"後甲關帝殿","lat":22.98512,"lng":120.23263,"cat":"worship","area":"東區・臺南市","ph":"觀"},{"id":4623,"name":"德高厝上帝廟","lat":22.9659,"lng":120.23514,"cat":"worship","desc":"德高厝舊稱竹篙厝，得名於山頂高聳的刺竹。相傳庄民迎請下灣上帝公入庄消災，後來集議建廟，早年的香爐也題有德高厝與玄天上帝。","area":"東區・臺南市","ph":"觀"},{"id":4624,"name":"成大榕園","lat":23.00033,"lng":120.21616,"cat":"other","desc":"校園裡這棵大榕樹，相傳由日本皇太子裕仁訪臺時親手種下。多年來成大學生在樹下迎新送舊，畢業時相約合影，也讓榕樹成為共同記憶。","area":"東區・臺南市","ph":"觀"},{"id":4625,"name":"東安坊文化園區","lat":22.98736,"lng":120.2175,"cat":"culture","desc":"以東門城為中心，向東可認識教會、新樓醫院與長榮學校的歷史。城門以西則有東嶽殿與城隍廟，沿途可看見不同信仰在府城留下的足跡。","area":"東區・臺南市","ph":"觀"},{"id":4626,"name":"知事官邸生活館","lat":22.99241,"lng":120.21313,"cat":"culture","area":"東區・臺南市","ph":"觀"},{"id":4627,"name":"臺南東門長老教會原主日學教室","lat":22.987466,"lng":120.215597,"cat":"worship","tag":"歷史建築","area":"東區・臺南市","ph":"文"},{"id":4628,"name":"臺南東門長老教會禮拜堂","lat":22.987776,"lng":120.215603,"cat":"worship","tag":"古蹟","area":"東區・臺南市","ph":"文"},{"id":4629,"name":"臺南火車站","lat":22.997206,"lng":120.21237,"cat":"history","tag":"古蹟","desc":"日治時期的臺南驛最早採洋風站房，隨城市發展，原有空間逐漸不敷使用。縱貫鐵路擴充的年代，也開啟了改建這座城市門面的討論。","area":"東區・臺南市","ph":"文"},{"id":4630,"name":"臺南車站","lat":22.99723,"lng":120.21257,"cat":"history","desc":"府城流傳一則約人見面的老笑話，說是要在火車站的「火」字下等。抬頭看站名就知道，寫的是「臺南車站」，哪裡找得到那個字。","area":"東區・臺南市","ph":"觀"},{"id":4631,"name":"臺灣府城城垣小東門段殘蹟","lat":22.99958,"lng":120.21819,"cat":"history","desc":"府城北側與東側的防線之間，小東門串起大東門與大北門兩段城垣。沿著留下的牆段追想，早年的木柵城曾從龍山寺一帶向北延伸。","area":"東區・臺南市","ph":"觀"},{"id":4632,"name":"臺灣府城巽方砲臺(巽方靖鎮)","lat":22.9843,"lng":120.2196,"cat":"history","desc":"民宅之間藏著一座以咾咕石砌成的清代砲臺。它位在大東門東南方，取八卦中的巽位為名，抬頭還能見到「巽方靖鎮」題字。","area":"東區・臺南市","ph":"觀"},{"id":4633,"name":"許嵩煙故居","lat":22.985962,"lng":120.221435,"cat":"history","tag":"古蹟","area":"東區・臺南市","ph":"文"},{"id":4634,"name":"長榮女中長榮大樓","lat":22.98889,"lng":120.22037,"cat":"history","desc":"長榮女中的前身是清末創設的新樓女學校，當年入學的一項條件是不能裹小腳。第一批僅有十九位學生，留下臺灣早期女子教育的身影。","area":"東區・臺南市","ph":"觀"},{"id":4635,"name":"龍山寺","lat":22.98656,"lng":120.21954,"cat":"worship","desc":"清代在東門城外以咾咕石砌成的佛寺，後來歷經道路拓寬與多次重建。現址三層樓的寺院裡，仍留有清代古匾等文物。","area":"東區・臺南市","ph":"觀"},{"id":4636,"name":"東山孚佑宮(仙公廟)","lat":23.26773,"lng":120.50119,"cat":"worship","desc":"東山咖啡公路沿線的仙公廟，供奉八仙之一的呂洞賓。到二樓還能見到齊聚一堂的八仙神像，從個別主神認識整組民間信仰人物。","area":"東山區・臺南市","ph":"觀"},{"id":4637,"name":"東山牛肉崎警察官吏派出所","lat":23.279524,"lng":120.415217,"cat":"history","tag":"歷史建築","desc":"派出所建在東山東側丘陵，所在聚落稱為牛肉崎。相傳山路坡陡彎多，過去拉車的牛上坡得挨鞭，這個帶點戲謔的地名便流傳下來。","area":"東山區・臺南市","ph":"文"},{"id":4638,"name":"東山碧軒寺","lat":23.32606,"lng":120.4034,"cat":"worship","desc":"東山居民長久以來在這座寺裡奉祀觀音，香火一路延續下來。談起地方上共同的信仰，碧軒寺便是中心。","area":"東山區・臺南市","ph":"觀"},{"id":4639,"name":"東山鄉農會日式碾米廠","lat":23.321832,"lng":120.40285,"cat":"history","tag":"歷史建築","desc":"日治時期的米倉與碾米廠整修後，成為展出東山農產文化的空間。三層樓的木造碾米廠下方砌磚，上方以編竹夾泥築牆，外側再覆雨淋板。","area":"東山區・臺南市","ph":"文"},{"id":4640,"name":"西口小瑞士","lat":23.23163,"lng":120.44872,"cat":"scenic","desc":"烏山嶺西側出水口有一處像天井般的漩渦，水流景象是溪谷的看點。附近綠草鋪展，清幽的谷地也因此得了「小瑞士」的別稱。","area":"東山區・臺南市","ph":"觀"},{"id":4641,"name":"西拉雅部落-吉貝耍","lat":23.29497,"lng":120.38559,"cat":"other","desc":"吉貝耍的西拉雅語地名意為木棉，點出了部落與植物的連結。雖然村裡的木棉逐漸減少，族人對阿立母與祖靈的信仰仍延續下來。","area":"東山區・臺南市","ph":"觀"},{"id":4642,"name":"乳牛的家","lat":23.2682,"lng":120.29532,"cat":"other","desc":"柳營酪農區裡的牧場原是酪農戶，後來開放民眾親近動物。拿著牧草餵羊，或用奶瓶餵小乳牛，都能接觸平日較少見的牧場生活。","area":"柳營區・臺南市","ph":"觀"},{"id":4643,"name":"嘉南大圳龜重溪渡槽橋","lat":23.288435,"lng":120.386989,"cat":"history","tag":"古蹟","desc":"龜重溪上的渡槽橋屬於嘉南大圳北幹線，讓灌溉水能越過溪流。架高的水槽接續沿丘陵配置的給水系統，再把水送往下游農田。","area":"柳營區・臺南市","ph":"文"},{"id":4644,"name":"太康綠色隧道","lat":23.29122,"lng":120.32594,"cat":"other","desc":"柳營義士路兩旁的老芒果樹高高相接，形成綿延約四點五公里的樹蔭。這段日治時期被稱為軍路的林蔭道，今天仍保有成排行道樹的景觀。","area":"柳營區・臺南市","ph":"觀"},{"id":4645,"name":"德元埤荷蘭村","lat":23.26403,"lng":120.34135,"cat":"scenic","desc":"枝狀分岔的埤塘與安靜水道之間，有拱橋、穀倉和岸邊的荷蘭風車。沿綠地走下去，還會遇上放大版的木鞋與鬱金香造景。","area":"柳營區・臺南市","ph":"觀"},{"id":4646,"name":"柳營代天院","lat":23.27869,"lng":120.31746,"cat":"other","area":"柳營區・臺南市","ph":"觀"},{"id":4647,"name":"柳營劉家大房古厝","lat":23.277428,"lng":120.309017,"cat":"history","tag":"歷史建築","area":"柳營區・臺南市","ph":"文"},{"id":4648,"name":"柳營吳晉淮故居","lat":23.287038,"lng":120.301771,"cat":"history","tag":"歷史建築","desc":"火燒店聚落的吳家宅院以紅瓦覆頂，正身與兩側護龍採用不同的屋瓦工法。近看還能發現木作挑簷、編竹泥牆與簷廊的六角形洗石子鋪面。","area":"柳營區・臺南市","ph":"文"},{"id":4649,"name":"柳營尖山埤渡假村","lat":23.26426,"lng":120.39403,"cat":"scenic","desc":"尖山埤水庫被群山圍起，岸邊花木隨四季輪流開放，景色像一座小花園。盛夏花間常有蝴蝶飛舞，是這片水域生態中特別容易留意的風景。","area":"柳營區・臺南市","ph":"觀"},{"id":4650,"name":"柳營尖山埤渡假村","lat":23.26649,"lng":120.39331,"cat":"scenic","desc":"台糖經營的度假村沿著尖山埤水庫鋪展，山坡與水岸到處可見綠意。園內步道旁有彩繪牆面，親子遊戲區與水邊木屋也各有景致。","area":"柳營區・臺南市","ph":"觀"},{"id":4651,"name":"老牛的家","lat":23.26386,"lng":120.34155,"cat":"other","desc":"柳營的農人從前常靠水牛幫忙耕田，機械取代牛力後，老牛也陸續退休。這處安養空間收留年老的水牛，延續農村與耕牛之間的情分。","area":"柳營區・臺南市","ph":"觀"},{"id":4652,"name":"果農之家","lat":23.19966,"lng":120.51244,"cat":"other","desc":"楠西密枝是楊桃產地，果農之家就設在這片果鄉。除了在農場體驗農業生活，也可以從水果入菜的料理，認識當地果實的另一種吃法。","area":"楠西區・臺南市","ph":"觀"},{"id":4653,"name":"楠西玄天上帝廟","lat":23.17825,"lng":120.48274,"cat":"worship","desc":"當地人也把這座奉祀玄天上帝的廟宇稱為北極殿，殿內陪祀開天炎帝與中壇元帥。後殿則供奉玉皇大帝、南北斗星君與註生娘娘等神明。","area":"楠西區・臺南市","ph":"觀"},{"id":4654,"name":"楠西龜丹石造土地公廟","lat":23.13327,"lng":120.497754,"cat":"worship","tag":"歷史建築","area":"楠西區・臺南市","ph":"文"},{"id":4655,"name":"永興吊橋","lat":23.18669,"lng":120.47878,"cat":"other","area":"楠西區・臺南市","ph":"觀"},{"id":4656,"name":"玄空法寺","lat":23.18059,"lng":120.48198,"cat":"worship","desc":"曾文水庫附近的這座寺院講究園林造景，也以「佛心印聖石」聞名。護法殿奉祀伽藍菩薩，另有供奉觀世音菩薩的觀音殿。","area":"楠西區・臺南市","ph":"觀"},{"id":4657,"name":"鹿陶洋江家宗祠","lat":23.155518,"lng":120.490145,"cat":"worship","tag":"歷史建築","area":"楠西區・臺南市","ph":"文"},{"id":4658,"name":"鹿陶洋江家聚落","lat":23.15662,"lng":120.48936,"cat":"history","desc":"清代從福建渡海而來的江家祖先在楠西墾居，子孫世代在此生活。今日聚落仍保有閩南農村的樣貌，散步其間可看見宗族長久定居留下的痕跡。","area":"楠西區・臺南市","ph":"觀"},{"id":4659,"name":"龜丹溫泉體驗池","lat":23.13689,"lng":120.50845,"cat":"other","desc":"楠西龜丹的泉水清澈無味，屬於弱鹼性碳酸泉。露天泡湯時能抬頭望見山區的天空，池畔另有木棧道，可在水邊稍坐休息。","area":"楠西區・臺南市","ph":"觀"},{"id":4660,"name":"保西代天府","lat":22.99764,"lng":120.27771,"cat":"worship","desc":"這座古廟奉祀朱府、池府與李府三位千歲，居民親切地稱祂們為三老爺。廟宇過去稱大人廟，戰後才改稱代天府。","area":"歸仁區・臺南市","ph":"觀"},{"id":4661,"name":"原保證責任歸仁信用購買販賣利用組合","lat":22.970619,"lng":120.299898,"cat":"history","tag":"歷史建築","desc":"歸仁昔日的信用組合留下這棟兩層磚造廳舍。從正面看，階梯形山牆開了三個圓形通氣窗，上方還有以幾何圖形構成的泥塑「南」字。","area":"歸仁區・臺南市","ph":"文"},{"id":4662,"name":"敦源聖廟","lat":22.96913,"lng":120.30107,"cat":"worship","desc":"歸仁這座孔廟因文人組成的敦源社得名，由社友、詩人與地方仕紳集資興建。廟中供奉共同鑄造的孔子銅像，延續地方的國學傳統。","area":"歸仁區・臺南市","ph":"觀"},{"id":4663,"name":"東門美術館","lat":22.97378,"lng":120.29537,"cat":"culture","desc":"臺南這處當代美術展場，明亮的空間裡曾展出國內外藝術家的作品。從繪畫、雕塑到攝影與新媒體，都在它的展覽範圍之內。","area":"歸仁區・臺南市","ph":"觀"},{"id":4664,"name":"歸仁仁壽宮","lat":22.9698,"lng":120.29295,"cat":"worship","area":"歸仁區・臺南市","ph":"觀"},{"id":4665,"name":"歸仁潁川家廟","lat":22.996694,"lng":120.274928,"cat":"worship","tag":"歷史建築","desc":"這裡是陳家先祖落腳之處，清代建起兩進三開間的閩南式家廟。抬頭可看穿斗木架、紅瓦與燕尾脊，屋身也繪有花草、雲形和龍紋。","area":"歸仁區・臺南市","ph":"文"},{"id":4666,"name":"二王廟","lat":23.01939,"lng":120.24746,"cat":"worship","desc":"永康二王廟早期奉祀延平王鄭經，後來的主神轉為關聖帝君。廟裡至今仍供奉鄭府二王爺，保留了地方信仰轉變的線索。","area":"永康區・臺南市","ph":"觀"},{"id":4667,"name":"原永康飛行場無線羅針所","lat":23.021724,"lng":120.22011,"cat":"history","tag":"歷史建築","desc":"日治時期，永康飛行場附近設有無線羅針所，留下數棟建物。可留意紅磚砌成的連續拱廊與上下拉窗，房間之間以戶外走廊相連。","area":"永康區・臺南市","ph":"文"},{"id":4668,"name":"大地化石礦石博物館","lat":23.03402,"lng":120.27182,"cat":"culture","desc":"這座私人博物館聚焦化石與礦石，展品既有臺灣出土的標本，也有來自世界各地的收藏。明亮展間依類別陳列，方便對照觀察各種標本。","area":"永康區・臺南市","ph":"觀"},{"id":4669,"name":"大灣廣護宮","lat":23.00725,"lng":120.2674,"cat":"worship","desc":"大灣當地的王公廟主祀廣惠聖王，指的正是東晉名臣謝安。這支信仰跟著漳州移民渡海來臺，居民也以王公爺稱呼這位神明。","area":"永康區・臺南市","ph":"觀"},{"id":4670,"name":"大灣謝家古厝","lat":23.00631,"lng":120.26576,"cat":"history","tag":"歷史建築","area":"永康區・臺南市","ph":"文"},{"id":4671,"name":"崑山湖(鯽魚潭)","lat":22.99877,"lng":120.25318,"cat":"other","desc":"昔日臺江內海的水域演變成潭，因盛產鯽魚而稱鯽魚潭。它又因位在府城以東被稱為東湖，民間風水說法則留下龍潭的別名。","area":"永康區・臺南市","ph":"觀"},{"id":4672,"name":"永康三崁店糖廠神社遺蹟","lat":23.054524,"lng":120.244921,"cat":"history","tag":"古蹟","desc":"三崁店糖廠林木間保留著日治時期的神社遺址。木構建築雖已消失，仍可沿參道辨認鳥居、石燈與本殿基座，拼湊昔日神社的格局。","area":"永康區・臺南市","ph":"文"},{"id":4673,"name":"永康三崁店糖廠防空洞群","lat":23.054776,"lng":120.245015,"cat":"history","tag":"歷史建築","desc":"糖廠的舊宿舍區和神苑林地散布著數座防空洞。各洞外觀並不相同，有的入口砌成磚拱，有的則呈水泥圓筒形，還可見咾咕石堆起的矮牆。","area":"永康區・臺南市","ph":"文"},{"id":4674,"name":"永康公園","lat":23.00247,"lng":120.24346,"cat":"nature","desc":"高大的椰子樹引人走入公園，沿著生態步道還能看到蓮池。園地前身是雲山農場，昔日蔣經國的行館也保留下來，轉作紀念文化館。","area":"永康區・臺南市","ph":"觀"},{"id":4675,"name":"洲仔尾保寧宮","lat":23.03877,"lng":120.22911,"cat":"worship","desc":"洲仔尾居民奉祀保生大帝的廟宇最早稱為真君廟，清代翻修才掛上保寧宮匾額。地方會視庄內情況舉辦迎神賽會，延續聚落的祭典。","area":"永康區・臺南市","ph":"觀"},{"id":4676,"name":"臺南市立圖書館總館","lat":23.02474,"lng":120.23767,"cat":"culture","area":"永康區・臺南市","ph":"觀"},{"id":4677,"name":"鄭成功墓址紀念碑","lat":23.03693,"lng":120.22897,"cat":"culture","desc":"永康洲仔尾是鄭成功與鄭經父子昔日的墓址，地方志書也記下了這個地名。父子後來歸葬福建南安，臺南縣政府在原址立碑紀念。","area":"永康區・臺南市","ph":"觀"},{"id":4678,"name":"余清芳抗日紀念碑","lat":23.12958,"lng":120.4818,"cat":"other","desc":"玉井虎頭山曾是噍吧哖抗日事件的基地，也是雙方激戰的地方。山上的紀念碑記下余清芳等人的事蹟，提醒來者這裡曾經歷的死傷。","area":"玉井區・臺南市","ph":"觀"},{"id":4679,"name":"噍吧哖文化園區","lat":23.12626,"lng":120.46004,"cat":"culture","desc":"園區紀念一九一五年在噍吧哖爆發的抗日事件，這場事件也稱西來庵事件。從余清芳等人籌募經費，到抗爭與後續逮捕，牽動了臺灣各地的民眾。","area":"玉井區・臺南市","ph":"觀"},{"id":4680,"name":"噍吧哖紀念公園","lat":23.11962,"lng":120.45744,"cat":"nature","desc":"公園位在玉井入口，巨大的愛文芒果造型點出地方物產。立碑之處曾是噍吧哖事件中抗日志士遭殺害的戰場，也留下了沉重的歷史記憶。","area":"玉井區・臺南市","ph":"觀"},{"id":4681,"name":"新天王殿","lat":23.11112,"lng":120.47031,"cat":"worship","desc":"玉井沙仔田庄的廟宇舊稱大王公廟，奉祀壢王大千歲、盤古萬歲及天王千歲。廟內有一面忠義牆，刻著信眾相傳由三王兄弟降示的詩文。","area":"玉井區・臺南市","ph":"觀"},{"id":4682,"name":"玉井北極殿","lat":23.12423,"lng":120.46147,"cat":"worship","desc":"玉井這座廟裡有一口龜池，也是地方信仰的一部分。對北極殿來說，龜池象徵的是廟裡的玄天上帝信仰。","area":"玉井區・臺南市","ph":"觀"},{"id":4683,"name":"仙祖廟(紫雲殿)","lat":23.3396,"lng":120.49962,"cat":"worship","desc":"大凍山登山口附近的紫雲殿，主祀呂洞賓與李老君。廟地林木扶疏，庭園裡的九龍池塑有九尾金龍，與周圍花草構成山間寺院的景色。","area":"白河區・臺南市","ph":"觀"},{"id":4684,"name":"六重溪平埔文化園區","lat":23.31288,"lng":120.46259,"cat":"culture","desc":"六重溪重建公廨，讓中斷過的夜祭重新有了舉行的空間。園區也搭起傳統竹屋，收藏平埔族群的生活器皿，呈現部落日常與信仰的連結。","area":"白河區・臺南市","ph":"觀"},{"id":4685,"name":"六重溪溫泉","lat":23.31272,"lng":120.47798,"cat":"other","desc":"六重溪的泉水湧出時約攝氏三十五度，泥質含量高，還會帶著氣泡。這處靠近關子嶺的幽靜泉源同屬碳酸氫鈉泉，出水量較少。","area":"白河區・臺南市","ph":"觀"},{"id":4686,"name":"六重溪親水公園","lat":23.31012,"lng":120.45883,"cat":"nature","desc":"白河六重溪部落旁的親水公園，是三重溪、六重溪與九重溪匯集的地方。部落也保存平埔族群與漢人的文物，讓溪畔風景與聚落生活相連。","area":"白河區・臺南市","ph":"觀"},{"id":4687,"name":"台灣意象書法館","lat":23.38461,"lng":120.46809,"cat":"culture","desc":"白河的崎內國小廢校後，在地書法家陳世憲與團隊進駐，把校園轉作書法藝術空間。昔日上課的地方有了作品展覽，也成為交流書藝的據點。","area":"白河區・臺南市","ph":"觀"},{"id":4688,"name":"嘉南大圳八掌溪渡槽橋","lat":23.404227,"lng":120.389657,"cat":"history","tag":"古蹟","area":"白河區・臺南市","ph":"文"},{"id":4689,"name":"嘉南大圳急水溪渡槽橋","lat":23.336824,"lng":120.393769,"cat":"history","tag":"古蹟","desc":"嘉南大圳北幹線利用渡槽跨越急水溪，讓水繼續流向灌區。從架高的水槽，可以理解水圳遇到河道時，如何保持輸水路線的連續。","area":"白河區・臺南市","ph":"文"},{"id":4690,"name":"小南海自然生態公園","lat":23.39035,"lng":120.39412,"cat":"nature","desc":"湖畔的普陀禪寺供奉南海觀世音菩薩，小南海便因此得名。吊橋把寺院與生態公園連起來，沿著樹蔭散步，可以從不同角度欣賞湖面。","area":"白河區・臺南市","ph":"觀"},{"id":4691,"name":"崁頂福安宮","lat":23.29727,"lng":120.50283,"cat":"worship","desc":"關子嶺大凍山南側的福安宮，是以土地公信仰聞名的廟宇。廟裡奉祀天界、地界與人界的三界土地公，分靈也遍及臺灣各地。","area":"白河區・臺南市","ph":"觀"},{"id":4692,"name":"嶺頂公園","lat":23.33812,"lng":120.50357,"cat":"nature","desc":"白河嶺頂這座公園和臺灣迷你高爾夫球的歷史有關。臺灣第一座迷你高爾夫球場，就設在這裡。","area":"白河區・臺南市","ph":"觀"},{"id":4693,"name":"嶺頂旅遊資訊站(大成殿)","lat":23.33726,"lng":120.50388,"cat":"worship","area":"白河區・臺南市","ph":"觀"},{"id":4694,"name":"林初埤木棉花道","lat":23.37747,"lng":120.41002,"cat":"scenic","desc":"林初埤旁成排的木棉樹到了花季，火紅花朵一路延伸，替路面覆上一片暖色。有人來拍婚紗，也有人只想沿路散步，看看枝頭的花。","area":"白河區・臺南市","ph":"觀"},{"id":4695,"name":"林子內教會","lat":23.36786,"lng":120.46169,"cat":"worship","desc":"這座白河教會創設於一九六三年，之後逐步把服務帶入林子內社區。從關懷老人、陪伴兒少，到與居民改善周遭環境，都成為教會生活的一部分。","area":"白河區・臺南市","ph":"觀"},{"id":4696,"name":"水火同源","lat":23.32193,"lng":120.48416,"cat":"scenic","desc":"這處又名水火洞的景觀，最引人注意的便是水面持續冒出的火焰。水與火同時出現在眼前的景象，曾被列入臺南八景。","area":"白河區・臺南市","ph":"觀"},{"id":4697,"name":"火山碧雲寺","lat":23.32516,"lng":120.48093,"cat":"worship","area":"白河區・臺南市","ph":"觀"},{"id":4698,"name":"玉豐芒果樹綠色隧道","lat":23.37649,"lng":120.43926,"cat":"other","desc":"白河竹門到玉豐之間，兩旁的老芒果樹交織成綠色隧道。從樹蔭向外望，近處是成片蓮田，遠方則有關子嶺的枕頭山作背景。","area":"白河區・臺南市","ph":"觀"},{"id":4699,"name":"白河大仙寺","lat":23.339378,"lng":120.474286,"cat":"worship","tag":"古蹟","desc":"臨濟宗的參徹禪師在清代渡海來臺，行經白河玉枕山，選在山中結草庵弘法。這座草庵成為大仙寺的起點，留下行腳僧開寺的淵源。","area":"白河區・臺南市","ph":"文"},{"id":4700,"name":"白河將軍埤南洋櫻廊道","lat":23.38948,"lng":120.39741,"cat":"other","desc":"將軍埤溼地旁的廊道，由南洋櫻和印度紫檀交織成蔭。花開時可看南洋櫻滿樹粉嫩，平日也能欣賞紫檀平展的枝條與層次分明的樹冠。","area":"白河區・臺南市","ph":"觀"},{"id":4701,"name":"白河後壁印度紫檀廊道","lat":23.35737,"lng":120.39445,"cat":"other","desc":"白河與後壁之間的兩排印度紫檀，枝條向兩側伸展，層層樹冠遮出大片陰涼。冬天葉片落盡，春天又從枝梢冒出新芽，四季各有景致。","area":"白河區・臺南市","ph":"觀"},{"id":4702,"name":"白河沈氏宗祠","lat":23.364056,"lng":120.43278,"cat":"worship","tag":"歷史建築","desc":"白河三間厝聚落以全安宮為界，分為頂頭與下頭兩個角頭。沈氏宗祠位在頂頭沈姓人家聚居的中心，位置也反映出當地家族的分布。","area":"白河區・臺南市","ph":"文"},{"id":4703,"name":"竹門綠色隧道","lat":23.37642,"lng":120.43997,"cat":"other","desc":"白河竹門的筆直道路兩側，從日治時期種下的芒果樹已長得高大。濃密枝葉在上方接成一道綠蔭，夏天穿行其間，旁邊就是開闊農田。","area":"白河區・臺南市","ph":"觀"},{"id":4704,"name":"紅葉公園","lat":23.34225,"lng":120.50573,"cat":"nature","desc":"從紅蜥蜴牌樓往上走，可見蝴蝶造型裝飾一路相伴。關子嶺這片公園栽種誘蝶植物，吸引紫斑蝶等蝶類棲息，也是地方推廣生態教育的場域。","area":"白河區・臺南市","ph":"觀"},{"id":4705,"name":"臺灣木材故事館","lat":23.33707,"lng":120.50357,"cat":"culture","desc":"林管處昔日的員工宿舍，整修後成了介紹臺灣木材的展館。展覽從木頭本身談到器物與工具，透過擴增實境及感官體驗認識木材文化。","area":"白河區・臺南市","ph":"觀"},{"id":4706,"name":"蓮潭","lat":23.33364,"lng":120.45881,"cat":"scenic","desc":"白河北端的蓮潭與廣安，是當地蓮花栽培早期發展的地方。八掌溪附近的平原多埤塘與黏土，田埂分出的大片蓮田，也成了聚落的風景。","area":"白河區・臺南市","ph":"觀"},{"id":4707,"name":"蓮花公園","lat":23.38752,"lng":120.41767,"cat":"nature","desc":"白河散布各處的蓮田，在這座公園集中成一片開闊花海。沿步道走到池中央的涼亭坐下，微風吹來時，能看見荷葉與花朵一波波起伏。","area":"白河區・臺南市","ph":"觀"},{"id":4708,"name":"關子嶺溫泉","lat":23.33965,"lng":120.50439,"cat":"other","desc":"關子嶺自日治時期發現天然泉源以來，便以少見的泥漿溫泉聞名。它與北投、陽明山、四重溪並列臺灣四大溫泉，史誌也留下靈泉的美稱。","area":"白河區・臺南市","ph":"觀"},{"id":4709,"name":"關子嶺碧雲寺","lat":23.325238,"lng":120.480877,"cat":"worship","tag":"古蹟","desc":"相傳釋應祥為尋覓山中修行之所，選在枕頭山南腰，從大仙寺迎來觀音聖像。寺內後來陸續增建清虛宮與三寶殿，歷次修建也留下匾聯。","area":"白河區・臺南市","ph":"文"},{"id":4710,"name":"八份姑媽宮","lat":23.12864,"lng":120.21611,"cat":"worship","desc":"八份庄民奉祀鄞、何、李、紀四位仙姑，這座廟也是西港香科的發源地。地方相傳清代居民在曾文溪發現神船，迎回船首的王令供奉。","area":"西港區・臺南市","ph":"觀"},{"id":4711,"name":"西港劉厝警察官吏派出所","lat":23.127947,"lng":120.180228,"cat":"history","tag":"古蹟","area":"西港區・臺南市","ph":"文"},{"id":4712,"name":"西港慶安宮","lat":23.12124,"lng":120.20194,"cat":"worship","desc":"西港的媽祖廟流傳著鯉魚穴的風水故事，廟裡廟外也常見鯉魚裝飾。地方廟史還記著中壇元帥與城隍境主的信仰，以及後來迎奉媽祖的經過。","area":"西港區・臺南市","ph":"觀"},{"id":4713,"name":"千佛山菩提寺","lat":22.95715,"lng":120.34657,"cat":"worship","desc":"關廟群山之間的寺院前有一座大潭，平靜水面映出整座廟宇。往山頂看還有釋迦牟尼佛像與金剛經佛塔，是山寺景觀的另一個焦點。","area":"關廟區・臺南市","ph":"觀"},{"id":4714,"name":"大潭埤","lat":22.95672,"lng":120.34288,"cat":"other","area":"關廟區・臺南市","ph":"觀"},{"id":4715,"name":"臺灣馬樂活山莊","lat":23.00488,"lng":120.32944,"cat":"other","area":"關廟區・臺南市","ph":"觀"},{"id":4716,"name":"關廟山西宮","lat":22.96164,"lng":120.32605,"cat":"worship","area":"關廟區・臺南市","ph":"觀"},{"id":4717,"name":"原鹽水港製糖株式會社岸內製糖所實驗室","lat":23.332221,"lng":120.261707,"cat":"history","tag":"歷史建築","desc":"岸內製糖所的舊實驗室位在工場南側，紅磚牆以荷蘭式砌法築成。仔細看一排拱窗，弧形與平直的磚飾交替延伸，立面簡潔卻有變化。","area":"鹽水區・臺南市","ph":"文"},{"id":4718,"name":"台灣詩路","lat":23.27756,"lng":120.22687,"cat":"nature","desc":"林明堃想為臺灣詩留一個故鄉，便在木棉樹下打造了這條詩路。沿途紅磚牆上嵌著燒製的陶片，收錄《菅芒花》等數十首臺灣詩作。","area":"鹽水區・臺南市","ph":"觀"},{"id":4719,"name":"大豐南天宮(蔡觀音廟)","lat":23.26436,"lng":120.22236,"cat":"worship","desc":"大埔庄早年以簡單草壇供奉廣澤尊王，也稱四太保。據廟誌所載，神像原由旅人攜帶來臺，途經大埔時降示要留在庄內，成了建廟的起源。","area":"鹽水區・臺南市","ph":"觀"},{"id":4720,"name":"月津港聚波亭","lat":23.32063,"lng":120.263862,"cat":"worship","tag":"古蹟","desc":"昔日月津港的「聚波漁火」曾列為地方八景，旁邊大眾廟奉祀雷府大將公。廟裡還有一座用麻將牌搭起的小廟，供奉武財神。","area":"鹽水區・臺南市","ph":"文"},{"id":4721,"name":"月津港親水公園","lat":23.31695,"lng":120.26717,"cat":"nature","desc":"月津是鹽水的舊稱，地方以「一府、二鹿、三艋舺、四月津」記起古港的繁華。今日鹽水仍以元宵蜂炮聞名，這個舊地名也留在親水公園的名字裡。","area":"鹽水區・臺南市","ph":"觀"},{"id":4722,"name":"永成戲院","lat":23.319011,"lng":120.26836,"cat":"culture","tag":"歷史建築","desc":"這座鹽水戲院前身是永成碾米廠的糧倉，戰時廠房遭空襲燒毀。戰後黃家把後方倉庫改成放映電影的空間，讓舊糧倉有了新的觀眾。","area":"鹽水區・臺南市","ph":"文"},{"id":4723,"name":"護庇宮","lat":23.31803,"lng":120.26714,"cat":"worship","desc":"鹽水古港的媽祖廟曾是漁民與商船出海時的信仰寄託。廟裡留有多尊媽祖像，能從中看見清代糖商與其他商人護持廟宇的痕跡。","area":"鹽水區・臺南市","ph":"觀"},{"id":4724,"name":"鹽水八角樓","lat":23.320035,"lng":120.267328,"cat":"history","tag":"古蹟","desc":"清代在鹽水經營糖業致富的葉家，延請唐山師傅用福州杉與磚石興建宅第。除了木造樓身，還可留意綠釉花磚窗與二樓的雙喜窗。","area":"鹽水區・臺南市","ph":"文"},{"id":4725,"name":"鹽水天主聖神堂","lat":23.31893,"lng":120.26611,"cat":"worship","desc":"斜瓦屋頂與紅色樑柱讓這座天主堂帶著臺灣傳統廟宇的樣貌。進門後，祭壇與成排木椅旁立著紅色楹柱，柱上書法對聯又換了另一種觀看教堂的角度。","area":"鹽水區・臺南市","ph":"觀"},{"id":4726,"name":"鹽水橋南老街","lat":23.31597,"lng":120.26788,"cat":"structure","desc":"月津港淤積後，昔日商賈往來的鬧街逐漸安靜下來。今天沿整排老街屋漫步，仍可從泉利打鐵舖的敲打聲與街上的地方文物認識舊鹽水。","area":"鹽水區・臺南市","ph":"觀"},{"id":4727,"name":"鹽水武廟","lat":23.32387,"lng":120.26577,"cat":"worship","desc":"地方傳說，原在麻豆奉祀的一幅關聖帝君畫像，被風吹到鹽水的榕樹上。居民見畫像請不回去，便在當地建廟，延續至今成了鹽水的信仰中心。","area":"鹽水區・臺南市","ph":"觀"},{"id":4728,"name":"原電姬館","lat":23.18376,"lng":120.24492,"cat":"culture","tag":"歷史建築","area":"麻豆區・臺南市","ph":"文"},{"id":4729,"name":"海埔池王府","lat":23.20398,"lng":120.21156,"cat":"other","desc":"麻豆海埔的廟宇奉祀池、李、吳、朱、范五府千歲，以池王爺為主神。相傳昔日王爺往來麻豆與南鯤鯓時在此停駐，海埔也有王爺埔的別名。","area":"麻豆區・臺南市","ph":"觀"},{"id":4730,"name":"總爺藝文中心","lat":23.18407,"lng":120.26807,"cat":"culture","desc":"走過橘黃色鳥居，就進入大樹夾道的林蔭，旁邊是開闊整齊的草地。草坪上的樹影和枝葉間的微風，構成這座藝文中心格外悠閒的一面。","area":"麻豆區・臺南市","ph":"觀"},{"id":4731,"name":"蔴荳古港文化園區","lat":23.18939,"lng":120.26945,"cat":"culture","desc":"水堀頭昔日是倒風內海的三叉港，商船可通往福建，也曾從這裡運出砂糖。港口的貿易史之外，地方還流傳此處是龍穴的風水故事。","area":"麻豆區・臺南市","ph":"觀"},{"id":4732,"name":"麻豆代天府","lat":23.19034,"lng":120.26109,"cat":"worship","desc":"地方稱這裡為五王廟，供奉代天巡狩、查察善惡的五府千歲。麻豆與南鯤鯓之間流傳迎回五王遶境驅疫的故事，成為廟宇的重要淵源。","area":"麻豆區・臺南市","ph":"觀"},{"id":4733,"name":"麻豆大埕郭舉人宅","lat":23.186451,"lng":120.250325,"cat":"history","tag":"古蹟","desc":"大埕郭家從務農發展到經營兩岸商船貿易，後代也考取文武功名。宅第紅磚牆上可見剪刀形的鐵件，是把屋內木梁與山牆拉在一起的壁鎖。","area":"麻豆區・臺南市","ph":"文"},{"id":4734,"name":"麻豆文化館","lat":23.18291,"lng":120.24844,"cat":"culture","desc":"館內收藏與麻豆有關的地方文物，也提供藝術家展出作品的空間。除了看展，這裡也是藝術家與文史工作者碰面交流的地方。","area":"麻豆區・臺南市","ph":"觀"},{"id":4735,"name":"麻豆林家四房厝","lat":23.179711,"lng":120.244956,"cat":"history","tag":"歷史建築","desc":"麻豆林家先祖林文敏自福建安溪渡海來臺，家族後來與板橋、霧峰林家並稱臺灣三林。四房厝雖經部分拆除，仍可從木雕、紅磚與綠釉花磚看出宅院細節。","area":"麻豆區・臺南市","ph":"文"},{"id":4736,"name":"麻豆總爺糖廠","lat":23.184945,"lng":120.267774,"cat":"history","tag":"古蹟","desc":"日治時期，明治製糖株式會社選在麻豆設立第三工場。附近的蔗田、曾文溪水源與鐵道，湊齊新式製糖所需要的原料、用水和運輸條件。","area":"麻豆區・臺南市","ph":"文"},{"id":4737,"name":"麻豆護濟宮","lat":23.184583,"lng":120.246124,"cat":"worship","tag":"古蹟","desc":"相傳湄洲媽祖神像隨移民在倒風內海麻豆港附近登陸，最初以竹材搭成小祠奉祀。清代興建的護濟宮以媽祖為主神，並配祀註生娘娘與福德正神。","area":"麻豆區・臺南市","ph":"文"},{"id":4738,"name":"原龍崎庄長官舍","lat":22.965556,"lng":120.360128,"cat":"history","tag":"歷史建築","desc":"龍崎庄役場的首長稱為庄長，這棟官舍留下日治時期的起居空間。屋內柱梁、地板與門窗多用木材，竹編泥牆外再覆上一層層雨淋板。","area":"龍崎區・臺南市","ph":"文"},{"id":4739,"name":"望龍吊橋","lat":22.96598,"lng":120.3604,"cat":"nature","desc":"龍崎虎形山公園裡的這座吊橋，接替了日治時期興建的虎形山吊橋。從橋左側望向草木間，仍能找見舊橋基座，周圍清幽也曾有情人橋之稱。","area":"龍崎區・臺南市","ph":"觀"},{"id":4740,"name":"牛埔農塘","lat":22.92751,"lng":120.40955,"cat":"scenic","desc":"龍崎泥岩惡地圍出開闊的農塘，黃昏時的山形與湖色讓這裡有夢幻湖之稱。園區利用眼前的地形，帶人認識泥岩地帶的水土保持。","area":"龍崎區・臺南市","ph":"觀"},{"id":4741,"name":"虎形山公園","lat":22.96468,"lng":120.36003,"cat":"nature","desc":"龍崎這座山從外形看來像一頭盤踞的猛虎，虎形山的名字便由此而來。園內有山也有水，安靜的環境讓多種野生動物在此棲息。","area":"龍崎區・臺南市","ph":"觀"},{"id":4742,"name":"龍崎文衡殿","lat":22.94876,"lng":120.38325,"cat":"worship","desc":"臺南龍崎這座廟宇，把熟悉的電影英雄雕像放進了傳統殿堂。從鋼鐵人、綠巨人浩克到柯博文，這些角色與神像並列，形成少見的廟宇景象。","area":"龍崎區・臺南市","ph":"觀"},{"id":4743,"name":"龍崎文衡殿","lat":22.95141,"lng":120.37705,"cat":"worship","desc":"山中的文衡殿奉祀關聖帝君，神像與儀仗之外，還陳列半層樓高的英雄雕像。大黃蜂、鋼鐵人和綠巨人浩克等角色，為廟裡增添了另一種風景。","area":"龍崎區・臺南市","ph":"觀"},{"id":4744,"name":"龍船窩","lat":22.94622,"lng":120.4299,"cat":"scenic","desc":"龍船山的稜線像一艘行在雲間的龍舟，龍船窩便因此得名。靠近紫竹寺的觀日平台位在山稜上，視野開闊，是地方知名的日出景觀。","area":"龍崎區・臺南市","ph":"觀"},{"id":4745,"name":"利吉惡地","lat":22.81549,"lng":121.13836,"cat":"scenic","desc":"卑南溪東側的惡地綿延甚廣，以利吉村附近露出的地形最為明顯。這片臺東的地方級地質公園，設有景觀設施與步道，呈現惡地的地質特色。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4746,"name":"利吉旅遊資訊站","lat":22.82398,"lng":121.13422,"cat":"scenic","desc":"卑南溪畔的木造資訊站位在利吉社區，鄰近小黃山與利吉惡地。走進室內，可透過圖文及影片認識當地特殊地質、生態、物產與聚落歷史。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4747,"name":"利吉流籠遺跡","lat":22.808293,"lng":121.135968,"cat":"history","tag":"歷史建築","desc":"利吉大橋下方的兩塊大石，留著流籠臺與部分水泥階梯。早年雨季溪水漲起，居民靠鋼索流籠渡過卑南溪，後來甚至加裝引擎載人載貨。","area":"卑南鄉・臺東縣","ph":"文"},{"id":4748,"name":"千年夫妻樹","lat":22.83967,"lng":121.07553,"cat":"scenic","desc":"山坡上兩棵老榕樹一前一後，被地方稱作夫妻樹。較低處的老婆樹葉片寬圓、會結果，較高處的老公樹枝幹粗硬，葉形也較細長。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4749,"name":"卑南遊客中心","lat":22.8008,"lng":121.09499,"cat":"other","desc":"下賓朗部落附近的遊客中心，有明亮寬敞的休息空間。可以坐下翻閱書籍與旅遊摺頁，也能向服務人員打聽花東縱谷的地方風景與飲食。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4750,"name":"杉原灣","lat":22.83078,"lng":121.18611,"cat":"other","desc":"臺東東海岸少見的沙質海灣，在這裡展開約一點五公里的金黃沙灘。從岸邊向外望，開闊的太平洋一路延伸到海天交會處。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4751,"name":"知本圳親水公園","lat":22.69493,"lng":121.01743,"cat":"nature","desc":"日治時期興建的水圳進水口，後來成為知本圳親水公園的基礎。原本荒僻的左岸堤邊，透過生態工法與植栽整理，成了可以親近水圳的綠地。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4752,"name":"知本溫泉","lat":22.69304,"lng":121.01812,"cat":"other","desc":"早年溫泉水便從知本溪床湧出，日治時期在此開發浴池與公共浴場。今日山谷裡聚集許多溫泉旅館，泡在熱湯裡便可望見遠方山嵐。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4753,"name":"知本自然教育中心","lat":22.687168,"lng":120.992126,"cat":"scenic","desc":"知本的熱帶季風林裡，榕樹、茄苳與藤本植物構成茂密林相。沿途可觀察植物纏勒與絞殺的現象，白榕垂下的大量氣根更形成「千根榕」景觀。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4754,"name":"臺東原生應用植物園","lat":22.85305,"lng":121.10393,"cat":"nature","desc":"卑南鄉的這座植物園以草本藥草為主題，培育多種臺灣本土植物。散步在開闊的綠地間，可以近看各種藥草，認識臺東的植物生態。","area":"卑南鄉・臺東縣","ph":"觀"},{"id":4755,"name":"舊檳榔火車站站房","lat":22.808786,"lng":121.092684,"cat":"history","tag":"歷史建築","desc":"卑南賓朗的舊站最早是臺東線上的招呼站，名為日奈敷乘降場，後來才升格為車站。站名的讀音源自當地舊稱，也留住了部落地名的痕跡。","area":"卑南鄉・臺東縣","ph":"文"},{"id":4756,"name":"大武之心南迴驛","lat":22.33794,"lng":120.89463,"cat":"other","desc":"大武的這處南迴驛站占地寬廣，主建築是一棟兩層樓的休憩空間。對沿著臺東南迴一帶旅行的人來說，這裡是途中規模較大的歇腳處。","area":"大武鄉・臺東縣","ph":"觀"},{"id":4757,"name":"大武彩虹街","lat":22.35892,"lng":120.9068,"cat":"structure","desc":"大武市區旁的彩繪天橋很醒目，附近房屋的外牆也漆上不同顏色。從遠處望去，色塊向外放射，讓這一帶有了彩虹街的名字。","area":"大武鄉・臺東縣","ph":"觀"},{"id":4758,"name":"大武漁港","lat":22.33966,"lng":120.89366,"cat":"scenic","desc":"大武的漁港依著太平洋而建，港邊的藍天與海面視野開闊。在寧靜的漁村看曙光從東方升起，是這處海岸特有的風景。","area":"大武鄉・臺東縣","ph":"觀"},{"id":4759,"name":"巴塱衛山忘憂亭","lat":22.32253,"lng":120.87888,"cat":"scenic","desc":"大武南興村的巴塱衛山是臺灣小百岳之一，山頂約海拔三百二十五公尺。忘憂亭一帶視野開闊，晴朗時可遠眺太平洋上的綠島與蘭嶼。","area":"大武鄉・臺東縣","ph":"觀"},{"id":4760,"name":"金龍湖","lat":22.35176,"lng":120.89037,"cat":"scenic","desc":"雙峰夾出的山凹間，舊稱大埤湖的金龍湖略呈葫蘆形。湖畔有沼澤、次生林與廢耕田形成的草原，附近溼地偶爾能看見水牛和白鷺。","area":"大武鄉・臺東縣","ph":"觀"},{"id":4761,"name":"三和海濱公園","lat":22.66993,"lng":121.03573,"cat":"nature","desc":"入口處水藍色的海馬造型立碑，是辨認這座海濱公園的標誌。沿著公園走上觀景平台，眼前便是視野開闊的太平洋。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4762,"name":"千禧曙光紀念園區","lat":22.6168,"lng":121.01069,"cat":"culture","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4763,"name":"原住民祖先發祥地碑","lat":22.66802,"lng":121.03341,"cat":"history","desc":"卑南族口傳故事裡，祖先在海陸變動後漂流到太麻里一帶登陸。族人稱這處地方為陸發安或巴拿巴拿樣，意思是發祥地，碑就立在這片土地上。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4764,"name":"向陽薪傳木工坊","lat":22.50826,"lng":120.95885,"cat":"culture","desc":"多良國小裁撤後留下的校舍，改裝成木工坊與阿底旦文化故事館。工坊就在多良車站上方，舊校園也因此有了傳承木作與文化的新身分。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4765,"name":"多良公車站","lat":22.50714,"lng":120.95919,"cat":"other","desc":"臺東多良的海岸邊，一座小小候車亭恰好面向開闊的太平洋。站在亭前，晴天可見海面與藍天相連，尋常的候車空間也成了賞海的角落。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4766,"name":"大武山生態教育館","lat":22.530204,"lng":120.9396,"cat":"culture","desc":"臺東這座教育館專門介紹大武山自然保留區，從森林生態談到山區人文。館內的展示與研習空間，也說明設立保留區的目的和自然保育的工作。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4767,"name":"太麻里福興宮","lat":22.61228,"lng":121.00555,"cat":"worship","desc":"太麻里的這座老土地公廟裡，掛著一盞巨大的紅燈籠。旁邊還有一隻格外醒目的大型招財貓塑像，為傳統廟宇增添童趣。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4768,"name":"櫻木花道平交道","lat":22.62142,"lng":121.00676,"cat":"other","desc":"太麻里車站附近的鐵路平交道，從陸地向外望正好可見海面。藍天、碧海與鐵道交會的畫面讓人聯想到漫畫《灌籃高手》，因而有了這個暱稱。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4769,"name":"華源曙光觀景台","lat":22.65492,"lng":121.02289,"cat":"scenic","desc":"華源山腰上的平台朝向太平洋，順著山勢可俯瞰層層深淺不同的藍。破曉時，海平面先露出微光，接著金色霞光慢慢染上雲層。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4770,"name":"華源海灣","lat":22.66253,"lng":121.02894,"cat":"scenic","desc":"太麻里的曙光紀念公園以迎接新年日出聞名，華源則是當地另一處看海的地方。海岸在這裡形成海灣，能換個角度欣賞南迴沿線的海景。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4771,"name":"金崙大橋","lat":22.53391,"lng":120.96861,"cat":"other","desc":"這座高架橋是南迴公路拓寬工程的一部分，橫過臺東太麻里的金崙。從特定角度以長鏡頭望去，橋面像是一路伸入太平洋，成為攝影者熟悉的畫面。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4772,"name":"金崙聖若瑟天主堂","lat":22.53273,"lng":120.96373,"cat":"worship","desc":"金崙的天主堂取排灣族傳統陶甕為造型靈感，以黑色石板建造。從外形到用材都帶著濃厚的部落文化特色，讓海岸聚落裡的教堂格外醒目。","area":"太麻里鄉・臺東縣","ph":"觀"},{"id":4773,"name":"桃源村蝴蝶谷","lat":22.91575,"lng":121.085,"cat":"scenic","desc":"鹿鳴溪上游的蝴蝶谷是桃源村與鹿野共享的水源區，早年因群蝶飛舞而得名。當地人士與縣府投入復育後，溪谷水岸逐漸恢復生態。","area":"延平鄉・臺東縣","ph":"觀"},{"id":4774,"name":"紅葉少棒紀念館","lat":22.89358,"lng":121.06368,"cat":"culture","desc":"臺東布農族的紅葉部落，孕育了帶動臺灣棒球風氣的紅葉少棒隊。紀念館的故事從紅葉國小說起，孩子對戶外活動與棒球的熱愛，成為球隊的起點。","area":"延平鄉・臺東縣","ph":"觀"},{"id":4775,"name":"舊鹿鳴橋","lat":22.898452,"lng":121.085174,"cat":"history","tag":"歷史建築","desc":"鋼索吊橋橫跨桃源村河階下方的鹿野溪，正是延平、鹿野與卑南三鄉交會的地方。舊橋曾是重要聯絡橋梁，新橋建成後仍服務內山聚落。","area":"延平鄉・臺東縣","ph":"文"},{"id":4776,"name":"鸞山森林文化博物館","lat":22.89933,"lng":121.15212,"cat":"culture","desc":"這座森林博物館直接以山林為展場，保存原始森林與多棵原生白榕。榕樹氣根不斷向外扎根，得了「會走路的樹」之名，也可在這裡認識布農族的山林智慧。","area":"延平鄉・臺東縣","ph":"觀"},{"id":4777,"name":"鸞山部落(森林博物館)","lat":22.89777,"lng":121.15395,"cat":"culture","desc":"都蘭山一帶的布農族鸞山部落，保存了楠樹與榕樹混生的森林。粗大的榕樹氣根交錯延伸，老枝幹枯去後由氣根取代，看起來像樹木正在移動。","area":"延平鄉・臺東縣","ph":"觀"},{"id":4778,"name":"三仙台","lat":23.12316,"lng":121.41104,"cat":"other","desc":"起伏的跨海拱橋橫臥在臺灣本島與三仙台島之間，遠望如同海面上的長龍。東岸晨曦照亮橋與島嶼，也映出黑潮經過的太平洋海面。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4779,"name":"三仙台遊客中心","lat":23.12326,"lng":121.4071,"cat":"other","desc":"東部海岸的三仙台設有一處遊客中心，為前來看海與賞景的旅人提供服務。中心經重新建置後，於二〇一六年重新啟用。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4780,"name":"基翬漁港","lat":23.11744,"lng":121.39698,"cat":"scenic","desc":"靠近三仙台的基翬，在阿美族語中有海灣或彎曲之處的意思。這裡曾是竹筏出海的港灣，走進聚落還能看見早年居民用咕咾石砌成的圍籬。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4781,"name":"宜灣卡片教堂","lat":23.20697,"lng":121.39645,"cat":"worship","desc":"宜灣這座教堂屬於臺灣基督長老教會。長老教會在臺灣的歷史可追溯至十九世紀，當年的宣教師也以醫療、教育等方式支持地方居民。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4782,"name":"宜灣天主堂","lat":23.210379,"lng":121.400482,"cat":"worship","tag":"歷史建築","desc":"宜灣部落北側的天主堂名為和平之后堂，早期神父曾借住阿美族傳道的家開始工作。堂旁的紀念墓園原是史泰南神父親手整理的農園。","area":"成功鎮・臺東縣","ph":"文"},{"id":4783,"name":"宜灣長老教會","lat":23.208294,"lng":121.396879,"cat":"worship","tag":"歷史建築","desc":"宜灣部落的禮拜堂曾在風災中受損，重建時參考耶誕卡上的歐洲小教堂圖樣。正面有尖塔、拱門和白色浮雕，轉到側面才看得出門面只有薄薄一層。","area":"成功鎮・臺東縣","ph":"文"},{"id":4784,"name":"廣恆發商號及古厝","lat":23.160729,"lng":121.403029,"cat":"history","tag":"歷史建築","desc":"成廣澳曾是東海岸的貿易港灣，來自屏東內埔的客家商人溫泰坤在此開設廣恆發。洋樓式街屋兼做批發與零售，記下早年海岸商業的規模。","area":"成功鎮・臺東縣","ph":"文"},{"id":4785,"name":"成功新港漁港","lat":23.1032,"lng":121.37685,"cat":"other","desc":"漁港名字裡的「新港」，保留了今日成功鎮的舊地名。地方更早稱為麻荖漏社，一帶也出土過距今約三千五百年的麒麟文化文物。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4786,"name":"成功海洋環境教室","lat":23.09935,"lng":121.3795,"cat":"other","desc":"新港漁港旁的教室介紹黑潮流經的海域，以及在此活動的鯨豚。除了認識海洋生物，還能從鏢旗魚的器具和作業過程，了解成功特有的漁業文化。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4787,"name":"成功海濱公園","lat":23.10405,"lng":121.38497,"cat":"nature","desc":"新港漁港東北側的海濱公園，是成功居民散步和騎單車的地方。園地鄰近三仙台，也串起比西里岸與海洋環境教室等東海岸景點。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4788,"name":"成功漁港","lat":23.09922,"lng":121.3802,"cat":"scenic","desc":"新港漁港岸邊的漁業大樓造型像一艘船，漁船帶回的魚貨則在市場拍賣。當地海鮮餐廳的廚師也會參與競標，讓人看到漁獲從港口走向餐桌的過程。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4789,"name":"成功萬善廟","lat":23.09779,"lng":121.38218,"cat":"worship","desc":"成功漁港旁的萬善廟，供奉著與當地漁業關係密切的旗魚神。這座廟宇匯集漁民信仰與海上傳說，呈現東海岸漁村獨特的信仰風貌。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4790,"name":"新港教會會館(菅宮勝太郎宅)","lat":23.0999,"lng":121.378709,"cat":"worship","tag":"歷史建築","desc":"日治時期的新港支廳長菅宮勝太郎接到調職命令，為了留在新港而辭職，並在此興建宅第。這棟後來成為教會會館的老屋，留下他與地方的淵源。","area":"成功鎮・臺東縣","ph":"文"},{"id":4791,"name":"比西里岸","lat":23.12967,"lng":121.40076,"cat":"scenic","desc":"三仙台附近的比西里岸，是阿美族人過去養羊的濱海部落。如今走在村裡，可遇見漂流木做成的羊、幾米的畫作，以及部落孕育的鼓樂團。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4792,"name":"泰源隧道(小馬隧道)","lat":22.990403,"lng":121.309579,"cat":"history","tag":"歷史建築","desc":"隧道原由阿美族人開挖，起初是引馬武窟溪水灌溉小馬農田的暗渠。為了連通泰源盆地，日治政府後來又強迫族人以人力拓寬，成為可供人車通過的隧道。","area":"成功鎮・臺東縣","ph":"文"},{"id":4793,"name":"海洋環境教室","lat":23.09796,"lng":121.3829,"cat":"other","desc":"成功鎮遊艇碼頭旁的教室，透過展示與互動帶人認識海洋。從鯨豚聲音到漁港居民的生活，都能成為了解東海岸生態與保育的線索。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4794,"name":"石雨傘","lat":23.17502,"lng":121.4019,"cat":"scenic","desc":"三仙台與八仙洞之間，礫岩海岬從隆起的海蝕平台伸向海中。岸上原有數座形似雨傘的海蝕岩柱，如今獨立的一座仍保有醒目的傘形。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4795,"name":"美山驛站","lat":23.15562,"lng":121.39992,"cat":"other","desc":"東海岸沿線的驛站是為單車旅行設置的休憩空間，美山也是其中一站。騎車途中可以在此歇腳補給，這類據點也提供單車維修等服務。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4796,"name":"臺東縣成功鎮原住民文物館","lat":23.10043,"lng":121.38368,"cat":"culture","desc":"新港漁港附近的文物館以阿美族文化為主，透過攝影、繪畫及影音呈現部落生活。展演與工作坊也讓族人以藝術家的身分，親自說出自己的故事。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4797,"name":"都威橋(舊)","lat":23.19032,"lng":121.395907,"cat":"history","tag":"歷史建築","desc":"日治時期興建的舊橋橫跨都威溪，位在都威部落南端。鋼筋混凝土橋身由兩座橋墩支撐，每座橋墩都留了一道圓拱形開口。","area":"成功鎮・臺東縣","ph":"文"},{"id":4798,"name":"都歷園區","lat":23.02035,"lng":121.32496,"cat":"culture","desc":"都歷部落過去稱這片土地為旮都瑪樣，意思是熊出沒的地方。園區內有東部海岸的遊客中心、阿美族民俗中心，以及戶外遊憩和表演空間。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4799,"name":"都歷遊客中心","lat":23.02011,"lng":121.32488,"cat":"other","desc":"坐山面海的遊客中心北望成功鎮與三仙台，往南則有機會眺見綠島。這裡鄰近阿美族民俗中心，也曾作為月光海音樂會的場地。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4800,"name":"阿美族民俗中心","lat":23.018,"lng":121.32493,"cat":"other","desc":"中心依日本建築教育家千千岩助太郎的手繪圖，仿照花蓮太巴塱社祭司的住家搭建。抬頭細看梁柱，上面的木雕圖案是太巴塱阿美族的特色。","area":"成功鎮・臺東縣","ph":"觀"},{"id":4801,"name":"加母子灣","lat":22.86416,"lng":121.21019,"cat":"scenic","desc":"東河鄉南端的海灣，是都蘭阿美族人捕獵與舉行祭典的傳統海域。灣內海況較平穩、漁產豐富，地名也與族語中取得、採集的意思有關。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4802,"name":"台東八幡神社","lat":22.9031,"lng":121.25217,"cat":"other","desc":"東河的這座日式小神社至今仍有人奉祀，前來的人常在此祈求行旅平安。因為深受機車與自行車騎士喜愛，也多了一個「機車神社」的暱稱。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4803,"name":"新東糖廠文化園區","lat":22.87239,"lng":121.22655,"cat":"culture","desc":"都蘭山下的糖廠由民間出資興建，曾以盛產紅糖聞名。停產後閒置的工廠轉型為文化園區，藝術創作也走進了昔日製糖的空間。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4804,"name":"月光小棧","lat":22.88752,"lng":121.21055,"cat":"scenic","desc":"都蘭山麓的小屋曾是電影《月光下，我記得》的拍攝地，二樓還留著當時的場景。一樓由在地藝文團隊經營，成為藝術家展覽與演出的空間。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4805,"name":"東河舊橋(吉田橋)","lat":22.976036,"lng":121.304927,"cat":"history","tag":"歷史建築","desc":"馬武窟溪上的舊橋歷經數度改建，日治時期的檜木吊橋以設計者為名，稱作吉田橋。戰後改以鋼筋水泥重建，如今的橋面則留給行人賞景。","area":"東河鄉・臺東縣","ph":"文"},{"id":4806,"name":"水往上流奇觀","lat":22.86843,"lng":121.21817,"cat":"scenic","desc":"都蘭附近這道農田灌溉溝渠，乍看之下彷彿水正逆坡而上。沿著水面和兩側地形仔細對照，便可體會坡度造成的視覺錯覺，渠邊也立有「奇觀」石碑。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4807,"name":"江賢二藝術園區","lat":22.95653,"lng":121.28735,"cat":"culture","desc":"藝術家江賢二移居臺東後，逐步把海岸山脈間的舊畫室擴建為藝術園區。清水模建築順著山勢延展，周圍的自然景色也成為觀看作品時的背景。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4808,"name":"泰源幽谷","lat":22.97632,"lng":121.30492,"cat":"scenic","desc":"泰源與東河部落之間，馬武窟溪在山間刻出幽深峽谷。登仙橋至泰源一帶的山壁逼近水岸，清流自峭壁間流過，因此有「小天祥」的美稱。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4809,"name":"泰源幽谷","lat":23.019805,"lng":121.323438,"cat":"scenic","desc":"馬武窟溪從泰源盆地向東切過海岸山脈，形成綿延約四公里的峽谷。循著水勢望去，清溪、巨石與兩岸峭壁一路延伸，最後通向太平洋。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4810,"name":"都蘭新東糖廠","lat":22.872394,"lng":121.226416,"cat":"history","tag":"歷史建築","desc":"都蘭山下這間糖廠的前身由賴文騫創辦，與農戶契作甘蔗，專門生產紅糖。因產量不敷需求，後來邀請陳傳合股擴廠，留下地方製糖業的發展軌跡。","area":"東河鄉・臺東縣","ph":"文"},{"id":4811,"name":"都蘭遺址","lat":22.88487,"lng":121.21953,"cat":"history","desc":"都蘭背倚山脈、面向太平洋，長年的地質變動造就綿延的海階。考古遺址便坐落在這片地形上，為今日的阿美族聚落增添更早的人類活動線索。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4812,"name":"都蘭部落(都蘭國)","lat":22.87192,"lng":121.22606,"cat":"other","desc":"在都蘭，部落青年帶人從敲製樹皮布、做椰子碗與竹杯認識阿美族生活。餐桌上的野菜來自長輩栽種，漁獲則由青年捕來，呈現山海相連的飲食。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4813,"name":"金樽漁港","lat":22.9557,"lng":121.29401,"cat":"scenic","desc":"東河的金樽漁港介於成功新港與臺東富岡之間，港邊也是釣客熟悉的釣點。東北季風吹來的浪況適合衝浪，讓這片海岸也成為衝浪運動的場地。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4814,"name":"金樽貓洞","lat":22.94983,"lng":121.28763,"cat":"scenic","desc":"金樽陸連島上的海蝕洞有個圓圓的洞口，頂端恰好伸出兩個尖角。遠望像小貓從島上探頭，因而得名貓洞，潮水退去才顯出通往島上的海岸。","area":"東河鄉・臺東縣","ph":"觀"},{"id":4815,"name":"伯朗大道","lat":23.09878,"lng":121.2126,"cat":"scenic","desc":"池上這條田間道路因咖啡廣告取景，得了伯朗大道的暱稱。筆直道路旁還岔出一條彎曲小徑，兩側稻田連成一片，風吹過時能看見稻浪起伏。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4816,"name":"伯朗大道","lat":23.09993,"lng":121.2185,"cat":"other","desc":"錦新三號道路筆直穿過池上的田野，兩側沒有電線桿阻擋視線。稻穗成熟時，成片金黃隨風搖動，這片景色也曾出現在咖啡與航空公司的廣告中。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4817,"name":"台糖池上牧野渡假村","lat":23.10912,"lng":121.19854,"cat":"other","desc":"昔日台糖池上糖漿廠位於卑南溪畔，後來轉型為度假村。園區維持低度開發，從開闊綠野眺望花東縱谷，還能連起附近新開園老田區的農村景觀。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4818,"name":"大坡池","lat":23.11958,"lng":121.22532,"cat":"scenic","desc":"池上這片內陸淡水草澤，早年曾是居民捕魚維生的水域。如今沿岸綠意環繞，天氣晴朗時，平靜的湖面映著藍天與中央山脈。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4819,"name":"天堂路","lat":23.09504,"lng":121.21569,"cat":"worship","desc":"一條蜿蜒的田間小路從池上稻海中伸出，中段與東西向的伯朗大道交會。彎道把視線引向遠方南橫山群，稻浪與群山成了同行的風景。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4820,"name":"池上圳水利公園","lat":23.10325,"lng":121.19586,"cat":"nature","desc":"清末開鑿的池上圳，經日治時期擴建及後續改造，滋養大片池上農田。公園圍繞這套水圳系統設置，從眼前的水路就能理解池上米與灌溉的關係。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4821,"name":"池上新開園老田區","lat":23.089641,"lng":121.208725,"cat":"history","tag":"文化景觀","desc":"池上的新開園老田區橫跨錦園、萬安與新興三村，田間沒有電線桿的小路因廣告取景而廣為人知。眼前的開闊稻海，也是農民持續耕作的土地。","area":"池上鄉・臺東縣","ph":"文"},{"id":4822,"name":"池上浮圳(第六支圳)","lat":23.103254,"lng":121.211768,"cat":"history","tag":"歷史建築","desc":"灌溉水圳築在土堤上，水面高過兩側農田，因此有了「浮圳」這個稱呼。沿圳可看見水車與休憩涼亭，從高處望出去則是池上平原的大片稻田。","area":"池上鄉・臺東縣","ph":"文"},{"id":4823,"name":"池上穀倉藝術館","lat":23.12433,"lng":121.2173,"cat":"culture","desc":"池上車站旁這座藝術館，前身是梁正賢家中的老穀倉。元智大學師生參與改造，把居民對池上的記憶帶入設計，也讓舊倉庫有了展覽的新用途。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4824,"name":"池上飯包文化故事館","lat":23.12426,"lng":121.2209,"cat":"culture","desc":"早年的池上飯包是給鐵路旅客的竹葉飯糰，裡頭包肉乾與酸梅。後來換成木盒盛裝池上米飯，搭配卜肉、燒肉與醬菜，故事館記下了這段變化。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4825,"name":"稻米原鄉館","lat":23.09734,"lng":121.21918,"cat":"culture","desc":"萬安社區把新開園老田區旁的閒置倉庫，整理成介紹池上稻米的場館。除了展示農家生活，也透過米食手作與田間體驗，讓人認識這片稻鄉。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4826,"name":"萬安禾鴨生態池","lat":23.08943,"lng":121.22045,"cat":"scenic","desc":"萬安把種稻與養鴨放在同一套農作方式裡，以水田為基礎生產有機食物。池邊能看禾鴨悠游，抬高視線，四周則是花東縱谷的農村風景。","area":"池上鄉・臺東縣","ph":"觀"},{"id":4827,"name":"六口溫泉","lat":23.1752,"lng":121.02992,"cat":"other","desc":"當年修築南橫公路的工人發現岩壁湧出泉水，挖洞引泉，讓自己在工作之餘泡湯。如今這處海端溫泉仍有人閒坐泡腳，也有居民帶蛋來蒸煮。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4828,"name":"初來橋","lat":23.12256,"lng":121.16571,"cat":"other","desc":"海端的初來橋跨過新武呂溪，串起花東縱谷與南橫山區。橋梁的設計融入布農族文化元素，從溪谷風景也能辨認出在地聚落的特色。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4829,"name":"利稻山莊","lat":23.18638,"lng":121.02297,"cat":"history","tag":"歷史建築","desc":"這座依坡而建的木造山莊，曾是南橫健行隊的重要據點。階梯連起不同高度的廣場，陡斜的橘色屋頂與米白色雨淋板，勾勒出建築鮮明的輪廓。","area":"海端鄉・臺東縣","ph":"文"},{"id":4830,"name":"嘉明湖","lat":23.29324,"lng":121.03416,"cat":"scenic","desc":"向陽山東側的高山裡，橢圓形湖泊被綠色植被環繞。晴朗時天空的藍倒映在清澈湖面，像一顆藏在山中的寶石，也有「天使的眼淚」之稱。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4831,"name":"埡口","lat":23.26407,"lng":120.96134,"cat":"scenic","desc":"臺東與高雄交界的埡口位在南橫公路高處，附近的大關山隧道穿越中央山脈主脊。這處隧道與山口，也是南橫沿線最具代表性的高山地標之一。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4832,"name":"天龍吊橋","lat":23.173844,"lng":121.042134,"cat":"history","tag":"歷史建築","desc":"新武呂溪上的天龍吊橋，前身是日治時期關山越橫斷道路的一座鐵線橋，曾連繫兩岸部落。北岸岩壁仍留著工事紀念碑，刻有當年施工人員的名字。","area":"海端鄉・臺東縣","ph":"文"},{"id":4833,"name":"布農族文化館","lat":23.09794,"lng":121.17595,"cat":"culture","desc":"海端鄉的文化館坐落在南橫公路東段，寬闊園地被綠意環繞。建築外觀融入原住民族文化元素，也是旅人走近布農族部落文化的地方。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4834,"name":"逢坂抗日紀念碑","lat":23.1337,"lng":121.14044,"cat":"history","desc":"海端這座約一點五公尺高的石柱，紀念布農族人於一九三三年反抗日本殖民統治的事件。它與初來紀念碑、拉瑪達星星紀念公園共同留下地方的抗日記憶。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4835,"name":"霧鹿古砲台","lat":23.16999,"lng":121.04058,"cat":"history","desc":"霧鹿古砲臺連著布農族抵抗日本殖民統治的歷史。當局強制遷移山區聚落並收繳狩獵器具，族人為守護家園而反抗，其中以霧鹿事件著稱。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4836,"name":"霧鹿峽谷","lat":23.17264,"lng":121.03509,"cat":"scenic","desc":"霧鹿與利稻之間，新武呂溪在群山裡切出巨大的彎曲峽谷。關山連峰的斷崖經溪水長年沖刷，兩側岩壁近乎直立，襯得谷底水流格外深遠。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4837,"name":"霧鹿峽谷","lat":23.17381,"lng":121.0393,"cat":"scenic","desc":"清澈的霧鹿溪沿著大彎道奔流，兩側陡峭岩壁帶有豐富色層。從天龍吊橋望進峽谷，可以同時看見蜿蜒溪流與高起的崖面，是南橫八景之一。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4838,"name":"霧鹿砲台","lat":23.17007,"lng":121.04046,"cat":"other","desc":"霧鹿部落後方的制高點上，有兩座砲身斑駁的古砲。站在這裡能俯瞰部落與峽谷，遠望層疊的中央山脈，也能理解這處地點與抗日歷史的關聯。","area":"海端鄉・臺東縣","ph":"觀"},{"id":4839,"name":"中寮漁港","lat":22.67566,"lng":121.47259,"cat":"scenic","desc":"綠島西北方的中寮漁港，原以簡單碼頭和防波堤供村裡漁筏停靠。由於漂砂讓港內水深難以維持，後來又增設內堤與碼頭。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4840,"name":"哈巴狗岩","lat":22.65437,"lng":121.50962,"cat":"scenic","desc":"從海參坪的小長城向海望去，有塊岩石像一隻趴著的哈巴狗。它與旁邊的睡美人岩同在綠島東岸，反映火山岩體風化後多變的輪廓。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4841,"name":"哈巴狗與睡美人岩","lat":22.65502,"lng":121.50952,"cat":"other","desc":"沿綠島海參坪的小長城步道登上觀海亭，能從高處辨認睡美人岩與哈巴狗岩。下方月彎形海灣圍著珊瑚裙礁，浪花與白色沙灘連成一幅海景。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4842,"name":"大白沙","lat":22.6375,"lng":121.49417,"cat":"scenic","desc":"綠島常見珊瑚礁岩岸，大白沙卻保有大片淺色沙岸。貝殼與珊瑚碎片岩化形成灘岩，外圍寬廣的潮間帶還散布著生物豐富的潮池。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4843,"name":"帆船鼻","lat":22.63538,"lng":121.50694,"cat":"scenic","desc":"綠島東南角的帆船鼻三面環海，是珊瑚礁隆起形成的平坦海階。台地上鋪滿青草，從高出海面約三十公尺的草原遠望，有如綠色地毯鋪向海邊。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4844,"name":"朝日溫泉","lat":22.63703,"lng":121.50418,"cat":"other","desc":"帆船鼻海岸的溫泉面向太平洋日出方向，日治時期稱為旭溫泉。帶海水鹹味的泉水屬硫酸鹽氯化物泉，岸邊可見圓形的露天浴池。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4845,"name":"柚仔湖聚落遺址","lat":22.665794,"lng":121.508339,"cat":"history","tag":"歷史建築","desc":"綠島東側的柚仔湖聚落緊鄰海灣，三面背著陡崖。早期的竹木草屋後來改以咾咕石砌牆、屋頂鋪水泥瓦，居民遷出後留下了這些房舍遺跡。","area":"綠島鄉・臺東縣","ph":"文"},{"id":4846,"name":"柚子湖","lat":22.66564,"lng":121.51004,"cat":"history","desc":"綠島人所說的柚子湖是一處灣澳，地名中的「湖」來自閩南語「澳」的音轉。它與楠仔湖隔著一道海岬，兩旁仍留有咾咕石牆與水泥瓦老屋遺跡。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4847,"name":"海參坪","lat":22.65819,"lng":121.50493,"cat":"scenic","desc":"綠島東岸這處灣澳源於火山口受侵蝕後的地形，月彎形珊瑚裙礁像一道天然防波堤。從海蝕柱、白色貝殼沙灘到潮間帶，沿岸能看見多種海岸景觀。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4848,"name":"烏油窟","lat":22.67705,"lng":121.4667,"cat":"scenic","desc":"綠島燈塔北側的礁岸，海水受環狀礁石阻擋，形成一池平靜的小潟湖。潮汐影響著水池，無浪時的水面會透出藍綠色光澤。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4849,"name":"白色恐怖綠島紀念園區","lat":22.67548,"lng":121.49438,"cat":"culture","desc":"綠島東北角的紀念園區，保存了新生訓導處、綠洲山莊等不同年代的監禁場所。建築群與島嶼地景並存，讓人從現場認識白色恐怖的歷史。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4850,"name":"睡美人岩","lat":22.654,"lng":121.50717,"cat":"scenic","desc":"從海參坪的小長城向外眺望，睡美人岩與一旁彷彿趴著的哈巴狗岩構成一對奇景。綠島東岸的火山地形經過風化，留下各自不同的岩石輪廓。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4851,"name":"綠島人權文化園區","lat":22.674499,"lng":121.498316,"cat":"culture","tag":"文化景觀","desc":"園區涵蓋綠洲山莊、人權紀念公園、燕子洞等地，留下綠島不同時期的歷史現場。監禁與生活空間緊鄰海岸，也使這片島嶼地景成為人權教育的場域。","area":"綠島鄉・臺東縣","ph":"文"},{"id":4852,"name":"綠島南寮漁港","lat":22.65791,"lng":121.47449,"cat":"scenic","desc":"南寮漁港以南的珊瑚礁海岸緩緩入海，海底可見傘珊瑚、靈芝珊瑚與桶狀海綿。熱帶魚和蝦蟹穿梭其間，豐富的海底景觀讓這裡成為綠島的潛點。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4853,"name":"綠島樓門岩","lat":22.68105,"lng":121.51353,"cat":"scenic","desc":"一連串小珊瑚礁岩中，最高大的一塊被貫穿成圓洞，海流從洞中通過。從遠處看，岩塊就像一道立在海上的拱門，因而得名樓門岩。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4854,"name":"綠島燈塔","lat":22.676516,"lng":121.466321,"cat":"history","tag":"歷史建築","desc":"美國胡佛總統號郵輪在綠島外海觸礁時，中寮居民駕船救援並安置乘客。美國各界為感謝島民而捐款興建燈塔，最初稱為火燒島燈塔。","area":"綠島鄉・臺東縣","ph":"文"},{"id":4855,"name":"綠島監獄","lat":22.67303,"lng":121.47633,"cat":"other","desc":"綠島曾設有不同型態的監禁設施，其中綠島監獄至今仍負責收容受刑人。它隸屬法務部矯正署，採高度管理隔離，與島上的監禁歷史密切相關。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4856,"name":"綠島觀音洞","lat":22.67147,"lng":121.50652,"cat":"scenic","desc":"地方相傳漁民在海上遇險，循著火光才得以返航，事後發現洞中有尊形似觀音的天然石筍。因石像面朝東、背向來者，信眾另有反向敬拜的習俗。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4857,"name":"綠島豆丁海馬海底郵筒(綠島海底世界)","lat":22.65519,"lng":121.47316,"cat":"scenic","desc":"綠島石朗海域的水下沙地上，設有一座豆丁海馬造型的郵筒。這個郵筒坐落在海面下約十一公尺，潛水者可把特製明信片投入其中寄出。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4858,"name":"綠島遊客中心","lat":22.66859,"lng":121.4689,"cat":"other","desc":"綠島航空站附近的遊客中心，是不少人初抵島上時認識綠島的第一站。從這裡先對島嶼風景有些概念，再往周邊的海岸與潛水地點探索。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4859,"name":"綠島遊客中心","lat":22.67219,"lng":121.46861,"cat":"other","desc":"展覽室從綠島的地質起源談起，也解說朝日溫泉如何形成。從水芫花、梅花鹿、椰子蟹一路看到海底珊瑚，可以初步認識島上的不同生態環境。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4860,"name":"馬蹄橋","lat":22.64103,"lng":121.48996,"cat":"scenic","desc":"這座短橋跨在綠島臨太平洋的海岸，從橋上就能看見海浪迎面而來。岸邊地形多變，東北季風或颱風影響時，浪勢尤其猛烈。","area":"綠島鄉・臺東縣","ph":"觀"},{"id":4861,"name":"TTstyle原創館-波浪屋","lat":22.75308,"lng":121.14726,"cat":"culture","desc":"波浪形屋頂覆在貨櫃與鋼筋構成的建築上，是這座原創館醒目的外形。走進館內，還能從原住民族職人的手藝，認識臺東的在地創作。","area":"臺東市・臺東縣","ph":"觀"},{"id":4862,"name":"中華會館","lat":22.753813,"lng":121.155552,"cat":"culture","tag":"歷史建築","desc":"日治時期臺東華僑集資組成會館，曾為鄉親提供食宿、工作介紹與救濟。兩層樓的西式建築仍可見弧形拱窗，以及山頭上的稻穗裝飾。","area":"臺東市・臺東縣","ph":"文"},{"id":4863,"name":"公東的教堂","lat":22.76829,"lng":121.13284,"cat":"worship","desc":"公東高工校園內的教堂由瑞士建築師達興登設計，以清水模塑造簡潔的外觀。這棟臺灣現代主義建築，也連著錫質平神父在臺東興辦教育的歷史。","area":"臺東市・臺東縣","ph":"觀"},{"id":4864,"name":"公東高工聖堂大樓","lat":22.76709,"lng":121.13495,"cat":"worship","desc":"這棟聖堂大樓所在的公東高工，由白冷會錫質平神父籌辦，為花東青年提供職業教育。早年由瑞士技師授課，歐洲引進的教材與方法也在這裡生根。","area":"臺東市・臺東縣","ph":"觀"},{"id":4865,"name":"卑南大圳水利公園","lat":22.80686,"lng":121.13279,"cat":"nature","desc":"卑南圳最早在日治時期興建，之後歷經多次整修。隨著灌溉系統擴大，大批移民遷來建立聚落，水圳也記錄了地方農墾的變化。","area":"臺東市・臺東縣","ph":"觀"},{"id":4866,"name":"卑南遺址公園","lat":22.79211,"lng":121.1158,"cat":"nature","desc":"公園把考古現場、展示空間與自然環境放在一起，考古工作也持續進行。除了在展廳認識卑南文化，還能在現地看月形石柱等史前遺跡。","area":"臺東市・臺東縣","ph":"觀"},{"id":4867,"name":"卡地布文化園區","lat":22.70796,"lng":121.05494,"cat":"culture","desc":"知本的卡地布部落保存青年會所、青少年聚會所，以及三大氏族的祖靈屋。這些建築至今仍是卑南族人集會活動的重要場所，延續著部落生活。","area":"臺東市・臺東縣","ph":"觀"},{"id":4868,"name":"台東天后宮","lat":22.75685,"lng":121.15548,"cat":"worship","desc":"相傳清代提督張兆連因感念媽祖在大庄事件中顯靈解圍，捐出俸祿倡議建廟。廟中仍懸有光緒皇帝所賜的「佑誠昭靈」匾額。","area":"臺東市・臺東縣","ph":"觀"},{"id":4869,"name":"台東書書果實 BOOK-BOOK FRUIT TAITUNG","lat":22.74121,"lng":121.13898,"cat":"culture","desc":"這項臺東閱讀計畫以在地水果為原型，想像出六顆各具本領的「書書果實」。它串起書店、部落、學校與博物館，透過閱讀探索南島文化和地方故事。","area":"臺東市・臺東縣","ph":"觀"},{"id":4870,"name":"台灣糖業公司台東廠中山堂","lat":22.76827,"lng":121.129165,"cat":"history","tag":"歷史建築","desc":"臺東糖廠對面的中山堂，原是臺東製糖株式會社的俱樂部。它在日治時期糖業興盛之際落成，記下製糖工場以外的公共集會生活。","area":"臺東市・臺東縣","ph":"文"},{"id":4871,"name":"台灣糖業公司台東糖廠","lat":22.766942,"lng":121.127714,"cat":"culture","tag":"歷史建築","desc":"昔日臺東製糖株式會社從生產赤糖起家，後來設置新式工廠。廠區轉作文化創意園區，儲蔗場的天車改成露天舞臺，舊工業設施也成了藝術風景。","area":"臺東市・臺東縣","ph":"文"},{"id":4872,"name":"國本農場","lat":22.791023,"lng":121.119723,"cat":"history","tag":"歷史建築","desc":"王登科在臺東創辦的農場，曾引進大莖種蔗苗，改善製糖原料供應。農場內的三合院題名瑞村堂，黑色水泥瓦、日式鬼瓦與中式屋脊並見。","area":"臺東市・臺東縣","ph":"文"},{"id":4873,"name":"國立臺東生活美學館","lat":22.75525,"lng":121.15105,"cat":"culture","desc":"臺東縣政府對街的展館位在舊武德殿原址，今日所見是改建後的現代建築。明亮展間展出在地藝術家的作品，涵蓋繪畫、雕塑及多媒體創作。","area":"臺東市・臺東縣","ph":"觀"},{"id":4874,"name":"國立臺灣史前文化博物館","lat":22.76069,"lng":121.09136,"cat":"culture","desc":"博物館的設立源於卑南遺址的發現，展覽從臺灣歷年考古成果談到當代考古議題。走出展廳，館外還有大片草坪與摩艾石像造景。","area":"臺東市・臺東縣","ph":"觀"},{"id":4875,"name":"天主教白冷外方傳教會","lat":22.758232,"lng":121.146282,"cat":"worship","tag":"歷史建築","desc":"白冷會傳教士來臺東傳教，也協助居民修屋、築堤與開墾。會院建築以迴廊圍出中央庭園，辦公處的卵石遮陽牆與磚砌聖堂各有特色。","area":"臺東市・臺東縣","ph":"文"},{"id":4876,"name":"富岡地質公園 (小野柳)","lat":22.79478,"lng":121.19818,"cat":"nature","desc":"富岡漁港北邊的海岸經海浪侵蝕與風化，變出多樣的岩石地形，也有小野柳之稱。沿著臨太平洋的地質公園，可以一邊看海，一邊觀察岸邊岩貌。","area":"臺東市・臺東縣","ph":"觀"},{"id":4877,"name":"富岡漁港","lat":22.79174,"lng":121.19275,"cat":"scenic","desc":"臺東市北郊的富岡港兼有漁業與客運功能，也是綠島、蘭嶼與本島往來的重要門戶。港邊的旅運中心以海浪般流動的線條回應海港景色。","area":"臺東市・臺東縣","ph":"觀"},{"id":4878,"name":"寶町藝文中心","lat":22.75814,"lng":121.15322,"cat":"culture","desc":"臺東中山路上的舊官舍群，原是日治時期臺東街長的官舍建築。如今老屋轉作小型藝文園區，室內可舉辦藝術展覽與演出，也為市民留下休憩空間。","area":"臺東市・臺東縣","ph":"觀"},{"id":4879,"name":"小野柳遊客中心","lat":22.79564,"lng":121.19607,"cat":"scenic","desc":"富岡地質公園入口的斜屋頂建築裡，設有介紹海岸地形的展示館。從地質模型到寄居蟹生態模型，都能讓人先認識小野柳與海岸山脈的形成。","area":"臺東市・臺東縣","ph":"觀"},{"id":4880,"name":"市長公館","lat":22.75786,"lng":121.152897,"cat":"culture","tag":"歷史建築","desc":"臺東街改制時，日治政府為街長興建了這棟獨戶官舍。後來稱為市長公館的歷史建築，從規模與形式仍可看出當時依職等配置宿舍的制度。","area":"臺東市・臺東縣","ph":"文"},{"id":4881,"name":"新生廣場","lat":22.75235,"lng":121.14781,"cat":"nature","desc":"臺東舊站特區裡的廣場經過整建，形成寬敞的公共空間。除了讓附近居民和旅人歇腳，市區的文化活動也能在這裡聚集人潮。","area":"臺東市・臺東縣","ph":"觀"},{"id":4882,"name":"海洋生態意象廣場","lat":22.75177,"lng":121.16251,"cat":"nature","desc":"臺東海濱公園裡的廣場，以戶外美術館為構想，把太平洋生物搬上陸地。海龜、海豚、鯨魚和扇貝等形象，由繽紛的馬賽克磁磚逐片拼成。","area":"臺東市・臺東縣","ph":"觀"},{"id":4883,"name":"海濱公園","lat":22.74927,"lng":121.15755,"cat":"nature","desc":"臺東市東側有一片沿太平洋延伸約一公里的公園，寬闊草地一路接到海灘。山海鐵馬道也經過這裡，散步或騎單車都能看見開闊海景。","area":"臺東市・臺東縣","ph":"觀"},{"id":4884,"name":"玉豐窯業（蛇窯）","lat":22.791209,"lng":121.147105,"cat":"history","tag":"歷史建築","desc":"富源山附近的蛇窯由李仕玉興建，曾以山上陶土燒製日用陶器。細長窯身由土磚砌成，一端是火口，另一端是煙囪，兩側另排著相對的小火口。","area":"臺東市・臺東縣","ph":"文"},{"id":4885,"name":"知本天主堂","lat":22.706586,"lng":121.049666,"cat":"worship","tag":"歷史建築","desc":"卡地布部落的天主堂，以幾何線條、木雕與石板圍牆呈現卑南族文化。入口內外的石板雕刻彩繪，從開天闢地的神話說到教堂興建的故事。","area":"臺東市・臺東縣","ph":"文"},{"id":4886,"name":"知本農場第5村28莊","lat":22.72428,"lng":121.075687,"cat":"history","tag":"歷史建築","desc":"這處農莊原為退伍後就地安置的單身場員宿舍，成排住屋之間設有共同活動的中山室。屋前曬場用來曬農作物，圍牆則取開墾時撿來的石塊堆成。","area":"臺東市・臺東縣","ph":"文"},{"id":4887,"name":"臺東兒童運動公園","lat":22.75055,"lng":121.14679,"cat":"nature","desc":"綠地中的運動公園依不同年齡安排設施，幼兒與較大的孩子各有遊戲空間。青少年和成人也能使用體健設施，讓家人各自找到合適的活動。","area":"臺東市・臺東縣","ph":"觀"},{"id":4888,"name":"臺東地政事務所舊址","lat":22.754011,"lng":121.145385,"cat":"history","tag":"歷史建築","desc":"鯉魚山山麓的舊辦公廳舍，日治時期俗稱土地登記所，負責臺東地區的土地登記事務。戰後改為臺東地政事務所，記下地方地政制度的延續。","area":"臺東市・臺東縣","ph":"文"},{"id":4889,"name":"臺東天后宮","lat":22.757219,"lng":121.155013,"cat":"worship","tag":"歷史建築","desc":"這座廟早年以臺東平原的舊地名命名，稱為埤南天后宮。清代創建時原在今日和平街東禪寺所在，後來才遷到中華路一帶。","area":"臺東市・臺東縣","ph":"文"},{"id":4890,"name":"臺東市北町日式建築宿舍群","lat":22.75869,"lng":121.15182,"cat":"history","desc":"臺東北町的日式官舍原供臺東高等女學校與臺東中學校教職員居住。成群保存的宿舍建於一九三九年，留下日治時期兩所學校的生活足跡。","area":"臺東市・臺東縣","ph":"觀"},{"id":4891,"name":"臺東市長官舍建築群","lat":22.758286,"lng":121.153217,"cat":"history","tag":"歷史建築","desc":"中山路上從市長公館向東北延伸，排列著三棟各住兩戶的日式官舍。這組日治時期建築保留了獨戶公館與雙戶宿舍相鄰的配置。","area":"臺東市・臺東縣","ph":"文"},{"id":4892,"name":"臺東森林公園","lat":22.76857,"lng":121.15599,"cat":"nature","desc":"卑南溪口溼地附近的森林公園，將森林、湖泊與河口串在一起。琵琶湖以清澈湖水見長，鷺鷥湖適合賞鳥，活水湖則有另一番水上活動風景。","area":"臺東市・臺東縣","ph":"觀"},{"id":4893,"name":"臺東縣議會舊址","lat":22.762373,"lng":121.14282,"cat":"history","tag":"歷史建築","desc":"舊縣議會的翹起屋頂像一頂官帽，前方白色格柵兼具遮陽和通風作用。再看兩側弧形窗臺與後方空心花磚，可見建築應對風勢與日照的設計。","area":"臺東市・臺東縣","ph":"文"},{"id":4894,"name":"臺東美術館","lat":22.7643,"lng":121.14991,"cat":"culture","desc":"展館外的寬闊草坪散布著公共藝術，原住民族圖騰與漂流木作品都能在此找到。從戶外質樸的材料與造型，一路走進以美術為主題的展覽空間。","area":"臺東市・臺東縣","ph":"觀"},{"id":4895,"name":"臺東舊鐵道路廊","lat":22.75287,"lng":121.14585,"cat":"culture","desc":"臺東舊站廢站後，通往卑南大圳的舊鐵道改鋪成木棧道，綿延約六公里。靠近市區的一段由沿線住家與商店共同照料，形成帶有社區花園氣息的散步路廊。","area":"臺東市・臺東縣","ph":"觀"},{"id":4896,"name":"臺東航空站","lat":22.7563,"lng":121.10712,"cat":"other","desc":"機場建築融入臺東原住民族的文化意象，走出機艙便能望見開闊的景色。這裡也是臺東與綠島、蘭嶼等離島往來的重要門戶。","area":"臺東市・臺東縣","ph":"觀"},{"id":4897,"name":"臺東車站","lat":22.79374,"lng":121.1231,"cat":"other","desc":"東部幹線與南迴線在臺東車站交會，是許多人抵達臺東的第一站。站內設有遊客服務中心，可在展開行程前先認識當地旅遊資訊。","area":"臺東市・臺東縣","ph":"觀"},{"id":4898,"name":"臺東轉運站","lat":22.7518,"lng":121.14741,"cat":"other","desc":"臺東市區的轉運站由舊火車站改建，原有空間有了不同用途。昔日月台成為山海鐵馬道的起點，候車室則轉作介紹地方風景的旅遊服務中心。","area":"臺東市・臺東縣","ph":"觀"},{"id":4899,"name":"馬蘭車站","lat":22.76547,"lng":121.12882,"cat":"culture","desc":"早期的馬蘭站是木造站房，東線拓寬時改建為磚造水泥建築。車站過去以油庫與糖廠貨運為主，隨著貨源消失，最終也結束營運。","area":"臺東市・臺東縣","ph":"觀"},{"id":4900,"name":"鯉魚山公園","lat":22.75557,"lng":121.14242,"cat":"nature","desc":"臺東市中心的鯉魚山是一座不高的丘陵，卻擁有開闊的山頂視野。天氣晴朗時可遠望綠島甚至蘭嶼，也是居民晨昏散步、親近自然的綠地。","area":"臺東市・臺東縣","ph":"觀"},{"id":4901,"name":"五孔洞","lat":22.08038,"lng":121.51144,"cat":"scenic","desc":"洞邊的岩石裡包著大小不一的黑色岩塊，有些只有幾公分，有些達數公尺。仔細看岩塊上不規則的氣孔，孔洞密的地方很像火山渣。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4902,"name":"八代灣","lat":22.02487,"lng":121.55316,"cat":"scenic","desc":"蘭嶼達悟族人的拼板舟停在八代灣的沙灘上，流線形的船身漆著鮮明的色彩。到了傍晚，夕陽下的船影又是另一番模樣。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4903,"name":"情人洞","lat":22.06187,"lng":121.57333,"cat":"scenic","desc":"洞外的海浪撞上嶙峋的岩石，濤聲隆隆。洞下卻是岩石圍起來的一潭清水，水清得能望見潭底。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4904,"name":"東清灣","lat":22.05299,"lng":121.56363,"cat":"scenic","desc":"蘭嶼東側的海灣從東清部落前方向南伸展，形狀狹長。部落前另有一處礁石環繞的天然港灣，常見的拼板舟就停在這裡。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4905,"name":"玉女岩(火把岩)","lat":22.08066,"lng":121.5175,"cat":"scenic","desc":"從外海回望，岸上這塊中空的岩石像一束紮起來的蘆葦。朗島部落另有個傳說，把它看作站在父母之間、想勸兩人別吵架的孩子。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4906,"name":"紅頭岩(像水渠一樣)","lat":22.07981,"lng":121.50028,"cat":"scenic","desc":"海蝕和風化在蘭嶼岸邊留下許多奇岩，這一塊側看像張人臉。夕陽把岩面照紅時，像一顆伏在海上的紅色頭顱，蘭嶼舊名「紅頭嶼」也與它有關。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4907,"name":"舊蘭嶼燈塔","lat":22.05624,"lng":121.50837,"cat":"scenic","desc":"開元港邊的小山丘上立著一座燈塔，從遠處望去像庭園裡的小景。山丘雖然不高，從塔邊卻能俯瞰整個港口。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4908,"name":"蘭嶼氣象站","lat":22.03703,"lng":121.558406,"cat":"history","tag":"歷史建築","desc":"達悟族人當年受臺灣總督府徵調，在蘭嶼的山頂上修建了這座氣象站。二次大戰時這裡曾遭轟炸，風塔和辦公室的牆上還留著彈痕。","area":"蘭嶼鄉・臺東縣","ph":"文"},{"id":4909,"name":"蘭嶼燈塔","lat":22.08142,"lng":121.50409,"cat":"other","desc":"蘭嶼西北側的丘陵上立著島上的新燈塔，是全臺海拔最高的燈塔。島上還有一座小巧的舊塔，位置在開元港邊。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4910,"name":"蘭嶼鄉朗島部落傳統領域","lat":22.063768,"lng":121.567977,"cat":"history","tag":"文化景觀","desc":"朗島部落的住家順著山麓緩坡分布，外圍的水芋田被叫作「綠色的冰箱」。海灣供應漁獲，是部落的「藍色的冰箱」，也是舉行祭儀的地方。","area":"蘭嶼鄉・臺東縣","ph":"文"},{"id":4911,"name":"蘭嶼雅美族野銀部落傳統建築","lat":22.037253,"lng":121.567365,"cat":"history","tag":"歷史建築","desc":"在野銀，達悟族人的傳統住家沿著面海的緩坡而建。主屋和工作房的位置先往坡地裡挖出凹穴，構成這片聚落特有的深穴式建築。","area":"蘭嶼鄉・臺東縣","ph":"文"},{"id":4912,"name":"軍艦岩","lat":22.07902,"lng":121.57961,"cat":"scenic","desc":"從海上小島的輪廓就能看出「軍艦」這名字的由來。附近海流湍急，魚多、種類也多，這片海域早年便是東清部落的傳統漁場。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4913,"name":"野銀冷泉","lat":22.0334,"lng":121.5766,"cat":"scenic","desc":"山泉從地下湧出，在海邊被一圈礁岩留住，成了天然的冷泉池。淡水長年流過，連靠海的礁岩上也長著一片片青草。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4914,"name":"開元港","lat":22.0577,"lng":121.50814,"cat":"scenic","desc":"蘭嶼的客船、貨船和漁船都在這座港口進出。站在港邊，北面是紅頭岩所在的海岬，轉向椰油村還能望見饅頭岩。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4915,"name":"雙獅岩","lat":22.08514,"lng":121.56728,"cat":"scenic","desc":"蘭嶼海邊的岩塊經過長年風化和海浪沖蝕，留下較堅硬的部分。當地許多岩石按外形取名，雙獅岩就是其中一處。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4916,"name":"青青草原","lat":22.00412,"lng":121.57103,"cat":"scenic","desc":"春天的草原上，野百合和山菊花在綠草間開出黃白花色。到了秋冬，東北季風吹過草地，原本滿眼的綠意便換成一片枯黃。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4917,"name":"龍頭岩","lat":22.00193,"lng":121.58836,"cat":"scenic","desc":"這是蘭嶼經海蝕與風化形成的奇岩之一。島上的岩層除了安山岩質熔岩與集塊岩，還可以見到隆起的珊瑚礁。","area":"蘭嶼鄉・臺東縣","ph":"觀"},{"id":4918,"name":"南田海岸親水公園","lat":22.28112,"lng":120.89021,"cat":"nature","desc":"上南田與下南田部落之間的公園面向太平洋。旁邊海岸的南田石外表光滑黝黑，白色石英在每顆石頭上留下不同的花紋。","area":"達仁鄉・臺東縣","ph":"觀"},{"id":4919,"name":"卡夫龍安南島文化交流園區","lat":22.52674,"lng":120.92595,"cat":"culture","desc":"在歷坵村，部落和臺東縣政府一起重現了排灣族的男祭司家屋、女巫師家屋和穀倉保種中心。三座建築各有用途，也讓人認識部落如何保存作物種子。","area":"金峰鄉・臺東縣","ph":"觀"},{"id":4920,"name":"小米學堂","lat":22.52609,"lng":120.92376,"cat":"worship","desc":"歷坵國小的舊校舍如今成了認識小米的地方。排灣族人把小米視為有靈性的作物，除了拿來煮飯、熬粥和釀酒，部落裡也流傳著相關故事與禁忌。","area":"金峰鄉・臺東縣","ph":"觀"},{"id":4921,"name":"魯拉克斯吊橋","lat":22.52313,"lng":120.92312,"cat":"other","desc":"這座吊橋跨過金崙溪，連著歷坵部落所在的金峰鄉與太麻里鄉。舊橋在風災中毀損，後來由村民和各機關合力重建。","area":"金峰鄉・臺東縣","ph":"觀"},{"id":4922,"name":"八仙洞","lat":23.39717,"lng":121.47668,"cat":"history","desc":"長濱面海的峭壁上散布著許多海蝕洞，原在海面附近的洞穴隨地殼抬升，留在如今的山壁上。這裡也是考古學家發現舊石器時代長濱文化的地方。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4923,"name":"樟原","lat":23.41314,"lng":121.4828,"cat":"other","desc":"這個以阿美族居民為主的聚落位在臺東東海岸北端，一邊是太平洋，一邊是海岸山脈。當地居民的生計和耕作、捕魚關係密切。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4924,"name":"樟原橋(舊)","lat":23.40074,"lng":121.47938,"cat":"history","tag":"歷史建築","desc":"水母丁溪上並排著三代樟原橋，最老的一座用三個拱形橋墩立在溪中巨石上。橋身外側砌著卵石，兩旁的欄杆則採用砂岩。","area":"長濱鄉・臺東縣","ph":"文"},{"id":4925,"name":"樟原長老教會","lat":23.41646,"lng":121.48318,"cat":"worship","desc":"舊教堂遭颱風損壞後，居民在整修時把教堂改成一艘大船的模樣。遠看像船即將駛入樟原港，靠近還能看到外牆上的部落圖騰。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4926,"name":"烏石鼻","lat":23.22657,"lng":121.41537,"cat":"scenic","desc":"長濱海邊伸出一處黝黑的岬角，遠看像突起的鼻子。岩漿冷卻收縮留下柱狀岩石，岸邊還散布著海浪侵蝕出的石柱和洞穴。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4927,"name":"玉長公路","lat":23.24714,"lng":121.41704,"cat":"other","desc":"這段公路在花蓮玉里與臺東長濱之間鑽過海岸山脈。沿途景色從山谷一路變換，視野開闊的地方還能俯瞰太平洋。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4928,"name":"玉長公路","lat":23.26388,"lng":121.38631,"cat":"other","desc":"花東縱谷與東海岸之間隔著海岸山脈，玉里到長濱的這段公路以隧道穿山而過。整段路長十六公里多，把山脈兩側的風景連在一起。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4929,"name":"金剛大道","lat":23.3303,"lng":121.44752,"cat":"scenic","desc":"長光部落有一條筆直的產業道路，兩側的梯田鋪展在金剛山腳與太平洋之間。稻穗轉黃時，海風一吹，田裡便翻起一片金色的浪。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4930,"name":"長光遺址","lat":23.32881,"lng":121.45829,"cat":"history","desc":"金剛山腳下曾因地主整地，讓一具埋在地下的岩棺重見天日。後來發現的墓園與玉器，留下新石器時代晚期麒麟文化的痕跡。","area":"長濱鄉・臺東縣","ph":"觀"},{"id":4931,"name":"嘉賓旅社","lat":23.046824,"lng":121.16455,"cat":"history","tag":"歷史建築","desc":"關山舊站前這間旅社，起初是吳嘉隆開的華香食堂。臨街的木造平房在屋頂加高開氣窗，俗稱太子樓，後來又在後方加蓋兩層木樓供人住宿。","area":"關山鎮・臺東縣","ph":"文"},{"id":4932,"name":"達谷梵秘境","lat":23.06944,"lng":121.19235,"cat":"scenic","desc":"卑南溪畔的這片人工池，原是河川工程留下的濕地，後來才加以整建。池名「達谷梵」取自當地德高部落的阿美語發音。","area":"關山鎮・臺東縣","ph":"觀"},{"id":4933,"name":"關山大圳五雷鎮水碑及泰山石敢當","lat":23.113959,"lng":121.180647,"cat":"history","tag":"歷史建築","desc":"新武呂溪過去經常氾濫，鄉民為了祈求水患平息，請道長畫符，再把符刻在石碑上。五雷鎮水碑最早就立在溪岸，後來曾遷到堤頂。","area":"關山鎮・臺東縣","ph":"文"},{"id":4934,"name":"關山天后宮","lat":23.04906,"lng":121.16281,"cat":"worship","desc":"正殿裡除了粉面的鎮殿媽祖，也保有開基媽祖神像。走到左殿還有一處特別的地方，關聖帝君旁供奉的是雕成神像的孔夫子。","area":"關山鎮・臺東縣","ph":"觀"},{"id":4935,"name":"關山舊火車站","lat":23.046714,"lng":121.164714,"cat":"history","tag":"歷史建築","desc":"關山舊稱里壠，車站也曾叫作里壠驛。這段鐵道最早由人力推車行駛，後來改作糖業鐵道，再成為連接花蓮、臺東的國有鐵路。","area":"關山鎮・臺東縣","ph":"文"},{"id":4936,"name":"關山親水公園","lat":23.04,"lng":121.17389,"cat":"nature","desc":"卑南溪旁的公園裡，有人工湖、賞鳥屋和觀星台。戲水河道和噴泉廣場的水源來自地下自然湧出的伏流，夏天也透著涼意。","area":"關山鎮・臺東縣","ph":"觀"},{"id":4937,"name":"關山鎮天后宮","lat":23.04923,"lng":121.16282,"cat":"worship","tag":"歷史建築","desc":"抬頭看正殿和三川殿，層層抬高的屋頂上，燕尾脊飾著龍、鳳與花卉剪黏。兩側殿宇沿中軸對稱排列，中間一路從牌樓通向供奉媽祖的正殿。","area":"關山鎮・臺東縣","ph":"文"},{"id":4938,"name":"關山鎮里壠官舍","lat":23.047124,"lng":121.160441,"cat":"history","tag":"歷史建築","desc":"中正路上的兩棟日式木造官舍，外牆都用柳杉板層層搭接，牆腳再用磚墊高防潮。兩棟屋頂造型各異，屋脊上卻都留有星形標誌的鬼瓦。","area":"關山鎮・臺東縣","ph":"文"},{"id":4939,"name":"中興崗哨","lat":22.88899,"lng":121.14113,"cat":"other","desc":"鹿野溪和卑南溪匯流處的高台，曾設崗哨守護鹿野溪上的鐵路橋。如今從這裡可以拍到行經的火車，也能遠望都蘭山和擺子南山。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4940,"name":"二層坪水橋","lat":22.95152,"lng":121.16251,"cat":"other","desc":"紅白相間的拱橋橫過瑞隆村的稻田，遠處就是中央山脈。橋上承載的是灌溉水圳，到了水道末端，還會看見水彷彿往上流的景象。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4941,"name":"天際航空─熱氣球飛行夢工場","lat":22.94584,"lng":121.13654,"cat":"other","desc":"進駐臺東飛行啟蒙基地的天際航空，提供熱氣球自由飛行的空中遊覽。除了載人升空，這裡也推廣熱氣球知識，規劃相關教學。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4942,"name":"崑慈堂","lat":22.90452,"lng":121.12042,"cat":"worship","desc":"老樹環繞的廟堂主祀瑤池金母，這塊地原是日治時期鹿野移民村的神社。戰後居民先在原址祭拜土地公，後來又陸續迎來媽祖和瑤池金母。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4943,"name":"武陵綠色隧道","lat":22.95703,"lng":121.12721,"cat":"other","desc":"鹿野舊台九線有一段長長的林蔭路，樟樹、木麻黃和小葉欖仁從兩側遮住路面。偶爾從樹冠間抬頭，還能看見飛行傘劃過天空。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4944,"name":"武陵綠色隧道","lat":22.95945,"lng":121.1253,"cat":"scenic","desc":"舊公路兩旁的樟樹、小葉欖仁和木麻黃連成一片樹蔭。這段綠色隧道也會舉辦二六二六市集，林間偶爾還看得到空中的飛行傘。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4945,"name":"瑞源水車碾米廠及附屬設施","lat":22.955535,"lng":121.157157,"cat":"history","tag":"歷史建築","desc":"這間木造製材所後來裝上直立式渦輪水車，引鹿寮溪的水帶動機器碾米。溪水也能發電，讓同一股水力兼顧製材和農村的稻米加工。","area":"鹿野鄉・臺東縣","ph":"文"},{"id":4946,"name":"馬背調整池水利公園","lat":22.92043,"lng":121.11583,"cat":"nature","desc":"龍田村的高台茶區和鳳梨區之間，有一口為農田噴灌蓄水的人工池。池水來自鹿野大圳，蓄水容量約有六萬公噸。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4947,"name":"鹿野庄(區)役場","lat":22.903463,"lng":121.12866,"cat":"history","tag":"歷史建築","desc":"龍田村裡的這棟建築，曾是日治時期鹿野區處理地方事務的辦公處。當年區長先借用民宅辦公，隔年才興建這座區役場。","area":"鹿野鄉・臺東縣","ph":"文"},{"id":4948,"name":"鹿野梅花鹿公園","lat":22.94224,"lng":121.15063,"cat":"nature","desc":"鹿野這個名字和過去棲息在荒野上的梅花鹿有關。後來當地把舊運動公園改成鹿園，重新引進梅花鹿，讓人能近距離觀察牠們。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4949,"name":"鹿野神社","lat":22.90496,"lng":121.12049,"cat":"other","desc":"平原上的神社曾由鹿野村的日本移民共同修建，戰後遭拆除，只留下基座。當地居民爭取保存後，日本神社修繕師傅和臺灣木工一起在原址重建。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4950,"name":"鹿野親子公園","lat":22.94132,"lng":121.15061,"cat":"nature","desc":"草坪旁有座像巨大香菇的魔法屋，屋頂趴著小動物，裡面其實是洗手間。園內還有溜滑梯和蹺蹺板，從草地往外看就是稻田和山林。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4951,"name":"鹿野遊客中心","lat":22.92384,"lng":121.12508,"cat":"other","desc":"這裡也是高台茶葉的展示中心，可以認識鹿野出產的茶。當地的紅烏龍帶有果香，滋味醇厚，口感介於烏龍茶與紅茶之間。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4952,"name":"鹿野高台","lat":22.91646,"lng":121.12156,"cat":"scenic","desc":"從高台上望出去，眼前的田野一路延伸到卑南溪谷底。這裡也是東部從事空中活動的天然場地，夏天可以看見熱氣球緩緩升空。","area":"鹿野鄉・臺東縣","ph":"觀"},{"id":4953,"name":"龍田邱仁銘宅","lat":22.903863,"lng":121.127311,"cat":"history","tag":"歷史建築","desc":"日治時期，糖廠為移民村建的木屋保留在龍田。西側主屋原本蓋茅草，換成水泥瓦後仍留著陡峭的四面斜頂，和東側增建的平緩屋頂很不一樣。","area":"鹿野鄉・臺東縣","ph":"文"},{"id":4954,"name":"保安寺","lat":23.67243,"lng":121.43527,"cat":"worship","desc":"前殿還保有古樸的樣子，後殿則高大氣派，兩者留下不同時期的修繕痕跡。寺裡主祀釋迦牟尼佛，也是居民舉辦佛誕祭典的地方。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4955,"name":"光復鄉北富村富田古井","lat":23.661216,"lng":121.453546,"cat":"history","tag":"歷史建築","desc":"這是太巴塱部落八口古井之一，井壁以石頭和糯米砌成，曾供應北富村的飲用水。自來水普及後古井一度停用，後來由阿美族人合力修復。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4956,"name":"光復鄉北富村富田納骨碑","lat":23.660676,"lng":121.454201,"cat":"history","tag":"歷史建築","desc":"這座低矮的納骨碑立在阿美族先人的墓地附近。碑身微微向後傾斜，正面刻著「納骨碑」三個字，是部落居民追念先人的地方。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4957,"name":"光復鄉大華村古厝（益壽堂）","lat":23.665849,"lng":121.423452,"cat":"worship","tag":"歷史建築","desc":"這排兩層樓街屋是張枝明行醫時開設的藥房。山牆中央刻著屋主的「張」字，兩側各有一頭石獅，圓拱窗之間的柱子上還寫著對聯。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4958,"name":"光復鄉大豐村古厝（穎川堂）","lat":23.590616,"lng":121.380183,"cat":"worship","tag":"歷史建築","desc":"鍾阿宗一家從頭份移居花蓮後，延請師傅蓋起這座客家三合院。如今保留了中堂與左右廂房，屋頂已經從當年的紅瓦換成鐵皮。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4959,"name":"光復鄉阿美族太巴塱kakita'an祖屋","lat":23.657157,"lng":121.451858,"cat":"history","tag":"文化景觀","desc":"這座祖屋和太巴塱阿美族人的部落生活密不可分。族人除了在這裡生活，也把這裡當作舉行祭祀的場所。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4960,"name":"光復鄉馬太鞍部落納骨碑","lat":23.675529,"lng":121.430624,"cat":"history","tag":"歷史建築","desc":"族人過去會把無人收埋的骨骸和刀、弓箭等遺物集中埋葬，供人弔祭。後來立起的碑由卵石砌成，水泥碑面上刻著「納骨碑」三個字。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4961,"name":"台糖公司花蓮糖廠(舊名:鹽水港製糖株式會社花蓮港製糖所大和工場)","lat":23.657775,"lng":121.420945,"cat":"history","tag":"文化景觀","desc":"昔日的花蓮糖廠裡，除了製糖工廠和倉庫，還留有整片日式木造房舍。員工宿舍、診所和辦公室都在這裡，從中能看見糖廠員工的日常生活。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4962,"name":"大興瀑布紀念公園","lat":23.64297,"lng":121.38011,"cat":"nature","desc":"整治過的溪流旁設有石造紀念碑，記下大興當地曾經歷的災害。沿著園內的解說牌，可以對照眼前的河道，認識水土保持工程。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4963,"name":"大農大富平地森林園區","lat":23.61485,"lng":121.41773,"cat":"nature","desc":"南北兩條自行車道穿過平地森林，沿途有機會看見環頸雉出來覓食。春天有花、夏天有螢火蟲，秋冬又可見變色的楓葉。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4964,"name":"大農大富平地森林園區","lat":23.615173,"lng":121.414622,"cat":"nature","desc":"過去台糖種甘蔗的大農、大富兩座農場，如今長成大片平地森林。台灣櫸、光蠟樹和楓香在縱谷間混生，讓兩側山脈的生態有了連結。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4965,"name":"太巴塱文物館","lat":23.65706,"lng":121.45497,"cat":"culture","desc":"館內收藏阿美族太巴塱部落的文物，也整理族人代代相傳的歷史和神話。看展時可以從眼前的器物，再認識部落口耳相傳的故事。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4966,"name":"拉藍的家","lat":23.65838,"lng":121.41286,"cat":"other","desc":"入口的原木雕刻把馬太鞍部落的圖騰與傳說刻進木頭裡。這處半開放空間結合文史工作室、餐飲和民宿，也展示阿美族人的漁獵與農耕生活。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4967,"name":"興泉圳風鈴木","lat":23.59307,"lng":121.38661,"cat":"scenic","desc":"灌溉用的興泉圳夾在兩排黃花風鈴木之間，花道綿延近三百公尺。三月盛開時，抬頭是一片金黃，低頭還能看見水中的花影。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4968,"name":"花蓮糖廠原料區辦公室","lat":23.655227,"lng":121.420122,"cat":"history","tag":"歷史建築","desc":"這棟日治時期的辦公室，曾隸屬花蓮糖廠前身的大和工場。外牆覆著層層搭接的木板，四周另設斜木支撐，用來抵禦颱風與地震。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4969,"name":"花蓮糖廠招待所","lat":23.653149,"lng":121.419042,"cat":"history","tag":"古蹟","desc":"糖廠以前用這棟招待所接待賓客，屋內有會議室、套房和會客空間。從外面能看見架高的屋基與木板牆，入口玄關的木工尤其細緻。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4970,"name":"花蓮糖廠製糖工場","lat":23.658651,"lng":121.422204,"cat":"history","tag":"古蹟","desc":"光復的製糖工場前身是日治時期的大和工場。綠色廠房上排列著一座座雙斜面的鐵皮屋頂，旁邊高聳的煙囪是光復醒目的地標。","area":"光復鄉・花蓮縣","ph":"文"},{"id":4971,"name":"花蓮觀光糖廠(光復糖廠)","lat":23.65869,"lng":121.42061,"cat":"other","desc":"縱谷平原上高高的煙囪，標出了昔日製糖工廠的位置。廠區保留了生產設施和日式宿舍，也能吃到糖廠各種口味的冰棒和冰淇淋。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4972,"name":"馬太鞍古屋","lat":23.67298,"lng":121.42574,"cat":"other","desc":"這是馬太鞍部落留存下來的阿美族傳統木屋，建於日治時期。屋頂外加了保護層，裡頭仍看得到排列整齊的箭竹、深褐色樑柱，也聞得到檜木香。","area":"光復鄉・花蓮縣","ph":"觀"},{"id":4973,"name":"mai-asang kasing佳心舊部落","lat":23.34834,"lng":121.2147,"cat":"history","tag":"文化景觀","desc":"佳心舊聚落裡，到處可見布農族人耕作時壘起的石頭。從耕地、工寮到家屋的位置，還能辨認族人集團移住前如何在山裡生活。","area":"卓溪鄉・花蓮縣","ph":"文"},{"id":4974,"name":"伊入柑布農部落環境教育中心","lat":23.22081,"lng":121.26562,"cat":"scenic","desc":"「伊入柑」有柑橘的意思，過去是布農族獵人和族人相約碰面的地方。如今這裡的環境教育中心背靠中央山脈，面向縱谷，傳承部落的山林知識。","area":"卓溪鄉・花蓮縣","ph":"觀"},{"id":4975,"name":"卓清村老樟樹","lat":23.29507,"lng":121.27052,"cat":"scenic","desc":"卓樂部落天主堂廣場旁，一棵受保護的老樟樹朝四周伸展，樹冠廣達一百六十五平方公尺。聚落裡的人也能在濃密的樹蔭下歇腳。","area":"卓溪鄉・花蓮縣","ph":"觀"},{"id":4976,"name":"南安瀑布","lat":23.31166,"lng":121.24783,"cat":"scenic","desc":"從大里仙山流下的水，在山壁邊化作一道約五十公尺高的瀑布，直落下方的深潭。這裡靠近玉山國家公園東側入口，全年都看得到充沛水流。","area":"卓溪鄉・花蓮縣","ph":"觀"},{"id":4977,"name":"南安遊客中心","lat":23.30279,"lng":121.25844,"cat":"scenic","desc":"坐落在拉庫拉庫溪谷的遊客中心，是認識玉山國家公園東部山區的解說站。往建築前方望去，一大片有機稻田被稱為「玉山腳下第一畝田」。","area":"卓溪鄉・花蓮縣","ph":"觀"},{"id":4978,"name":"AMIS海祭廣場","lat":23.9455,"lng":121.60662,"cat":"nature","desc":"花蓮溪出海口旁有一片開闊的廣場，是吉安鄉阿美族部落舉辦傳統祭典的地方。站在這裡可以望向太平洋，直接看見海上波濤的變化。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4979,"name":"七腳川事件紀念碑","lat":23.98641,"lng":121.55528,"cat":"other","desc":"溪畔這座大石碑記下七腳川事件，也就是日治時期阿美族人與日本政府的衝突。後人可以在碑前追思，回顧族人當年的抗爭。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4980,"name":"五穀宮","lat":23.974,"lng":121.5743,"cat":"worship","desc":"吉安客家庄的居民在這裡祭拜神農大帝，又稱五穀先帝，同時也是醫藥之神。廟頂有細密的剪黏裝飾，廟裡的祭儀則和祈求平安與豐收有關。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4981,"name":"光華農場旁牌樓","lat":23.931382,"lng":121.555331,"cat":"history","tag":"歷史建築","desc":"綠色琉璃瓦底下，仿木構架的牌樓其實是鋼筋混凝土造的。旁邊的光華分場原是河川砂石地，後來由退除役官兵在這裡墾荒。","area":"吉安鄉・花蓮縣","ph":"文"},{"id":4982,"name":"初英親水生態公園","lat":23.95453,"lng":121.54237,"cat":"nature","desc":"落羽松和樟樹在田野間排出一條林蔭廊道，讓行經初英山自行車道的人可以停下來歇腳。園內也保留農田水利的脈絡，可沿著水邊觀察生態。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4983,"name":"初音山(初英山)","lat":23.97094,"lng":121.53137,"cat":"other","desc":"花東縱谷平原邊緣的這座山列入台灣小百岳，也是奇萊東稜最東端的山頭。太平洋的水氣吹來，海拔九百多公尺的山體常被雲霧環繞。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4984,"name":"勝安宮","lat":23.9779,"lng":121.5867,"cat":"worship","desc":"吉安這座道教宮廟供奉王母娘娘，整體採用中國宮殿式建築。站在寬廣的廟埕裡，最醒目的就是前方高大的八卦樓。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4985,"name":"化仁海堤 (吉野石羊)","lat":23.95363,"lng":121.60574,"cat":"other","desc":"一隻圓潤的石羊臥在水泥堤岸上，面朝太平洋。原本為了防洪擋浪而築的海堤，如今也成了居民沿海散步、看浪的地方。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4986,"name":"吉安不盡跌水井","lat":23.949572,"lng":121.52374,"cat":"history","tag":"歷史建築","desc":"灌溉水到了這裡會急速跌進下方的靜水池，在池裡翻攪，消去部分衝力。路旁這口井深約八公尺，從中可認識吉野圳處理水位落差的做法。","area":"吉安鄉・花蓮縣","ph":"文"},{"id":4987,"name":"吉安創客棧","lat":23.96645,"lng":121.55894,"cat":"other","desc":"農民以前會把菸葉送到福興買菸場，由這裡負責收購。如今舊場地成了創客棧，讓吉安的職人和青年創作者有地方動手實作、彼此交流。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4988,"name":"吉安好客藝術村","lat":23.98049,"lng":121.56482,"cat":"culture","desc":"老樟樹和一大片鋪磚廣場是園區裡容易辨認的景物。這裡有展示在地產業文物的空間，也是吉安居民舉辦客家文化活動與平日歇腳的地方。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4989,"name":"吉安慶修院","lat":23.973699,"lng":121.564755,"cat":"worship","tag":"古蹟","desc":"這座日式木造寺院曾是吉野移民村的信仰中心，也作為講堂使用。抬頭看屋頂，四面坡在頂端聚成一點，是日本傳統的「寶形造」。","area":"吉安鄉・花蓮縣","ph":"文"},{"id":4990,"name":"吉安橫斷道路開鑿記念碑","lat":23.948884,"lng":121.523234,"cat":"history","tag":"古蹟","desc":"初英發電廠圍牆旁並立著兩座不同岩材的石碑。一座紀念能高橫斷道路東段開鑿完工，另一座則為施工時殉職的人員而立。","area":"吉安鄉・花蓮縣","ph":"文"},{"id":4991,"name":"吉安海濱公園","lat":23.96223,"lng":121.60796,"cat":"nature","desc":"吉安溪在這裡流入太平洋，礫石灘旁就是人工海堤。從水岸步道望出去，一側是開闊的海面，回頭則能看見層層相疊的中央山脈。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4992,"name":"吉安溪臺灣欒樹","lat":23.96873,"lng":121.59444,"cat":"scenic","desc":"吉安溪兩岸的堤防平時是居民散步的地方，沿途種著綿延數公里的臺灣欒樹。入秋後，樹冠陸續染上鮮黃與嫩紅，河岸也跟著換了顏色。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4993,"name":"吉安韭菜花田","lat":23.96515,"lng":121.5533,"cat":"scenic","desc":"每到夏末秋初，吉安農田裡的韭菜開出一簇簇小白花，有了「九月雪」的暱稱。細看花朵像一把把小傘，遠處則是中央山脈的稜線。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4994,"name":"嘉德花田","lat":23.95567,"lng":121.57391,"cat":"scenic","desc":"縱谷平原上也看得到金針花海，這片田裡還種了多種經改良的萱草。春末夏初，不同花色一起鋪開，背後就是中央山脈的綠色山稜。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4995,"name":"山海正甜吉製冰所","lat":23.97193,"lng":121.56239,"cat":"other","desc":"吉安鄉農會把在地農作物做成冰淇淋和冰棒，也在這裡展示地方特產。店外的藍白配色，取的是花蓮海洋與天空的顏色。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4996,"name":"干城鐵道櫻花公園","lat":23.94217,"lng":121.5447,"cat":"nature","desc":"閒置的鐵路用地變成一條平坦的社區公園，綠地之間還留著部分舊軌道。春天時，沿線的櫻花接連綻放，把散步的路染成粉紅色。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4997,"name":"張家樹園","lat":23.97863,"lng":121.57292,"cat":"other","desc":"紅色鳥居與朱色拱橋，是這座日式庭園裡最醒目的景物。仿古庭院和現代建築之間，除了能賞景，也設有餐飲空間和小型動物園。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4998,"name":"慈惠堂","lat":23.97794,"lng":121.5859,"cat":"worship","desc":"吉安的這座堂是臺灣瑤池金母信仰的發祥地，各地分堂的信眾會到此祈福。堂裡可聽見誦經聲，也能看到穿著青色道服的信徒。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":4999,"name":"松湖驛站","lat":23.94386,"lng":121.54846,"cat":"scenic","desc":"湖邊高大的落羽松映進平靜的水面，是這處庭園驛站最醒目的風景。到了秋冬，羽毛般的葉片從綠轉紅，水中的倒影也跟著換色。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":5000,"name":"洄瀾橋","lat":23.96292,"lng":121.60622,"cat":"other","desc":"白色鋼橋繫著紅色纜繩，橫過吉安溪出海口。橋面留給行人和自行車，將花蓮市太平洋公園與吉安的濱海自行車道接在一起。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":5001,"name":"知卡宣綠森林親水公園","lat":23.95214,"lng":121.58288,"cat":"nature","desc":"城堡造型的大門後方是一座平坦開闊的公園，有原生樹林和水生植物池。沿著綠地散步能觀察植物，園內也有季節性開放的戲水設施。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":5002,"name":"臺灣總督府專賣局花蓮支局吉野村煙草耕作指導員駐在所","lat":23.974001,"lng":121.563753,"cat":"history","tag":"歷史建築","desc":"這棟房子曾是吉野村菸草耕作指導員的駐在所。門窗的設計頗有巧思，視線高度用霧面玻璃，上方換成透明玻璃，還加了能轉動的窗扇來通風。","area":"吉安鄉・花蓮縣","ph":"文"},{"id":5003,"name":"花蓮吉野開村記念碑","lat":23.980212,"lng":121.565419,"cat":"history","tag":"古蹟","desc":"慶豐市場附近的草地上，有石碑記著日本官營移民村吉野村的開墾歷史。其中一塊刻著「拓地開村」，四個字由當時的臺灣總督中川健藏題寫。","area":"吉安鄉・花蓮縣","ph":"文"},{"id":5004,"name":"蓮城蓮花園","lat":23.95729,"lng":121.54584,"cat":"nature","desc":"幾口方正的灌溉池引進木瓜溪的水，池面長滿各色睡蓮。沿著田埂走，可以靠近看看不同品種的花色和葉片形狀。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":5005,"name":"阿美族文化館","lat":23.9699,"lng":121.58085,"cat":"culture","desc":"這裡曾是那荳蘭、薄薄與里漏三社一起舉行豐年祭和成年禮的地方。如今館舍用雙斜屋頂呼應部落聚會所，館內也傳承阿美族的歷史和工藝。","area":"吉安鄉・花蓮縣","ph":"觀"},{"id":5006,"name":"七七高地","lat":23.93276,"lng":121.60764,"cat":"other","desc":"海拔七十七公尺的小山丘，原是軍事據點，如今成了觀景平台。山上保留著防風林，視線越過樹林便能望向花蓮溪注入太平洋的地方。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5007,"name":"吳全城開拓記念碑","lat":23.888911,"lng":121.552409,"cat":"history","tag":"古蹟","desc":"清代吳全、蔡伯玉等人沿花蓮溪而上，來到今天的平和村一帶，與先到的墾民分地耕作。紀念碑記下這段往事，碑下的大石基座以不規則的方式砌成。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5008,"name":"和南寺","lat":23.87639,"lng":121.59869,"cat":"worship","desc":"面海的綠色山坡上，米黃色觀音坐像遠遠就能辨認。這座道場以藝術傳達佛法，園內把雕塑、建築與聲光作品放在同一片山海之間。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5009,"name":"壽豐溪口石灰窯","lat":23.814891,"lng":121.464964,"cat":"history","tag":"歷史建築","desc":"壽豐溪上游出產石灰石和白雲石，溪口村因此發展出燒石灰的產業。留下的兩座石灰窯開口寬窄不同，其中一座已被盤繞的榕樹根包了起來。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5010,"name":"池南自然教育中心","lat":23.918393,"lng":121.50154,"cat":"scenic","desc":"昔日轉運木材的場地，如今成了認識森林的戶外教室。蒸汽火車頭和大型集材機留在原地，周邊的森林則能看到低海拔山區的動植物。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5011,"name":"理新礦業股份有限公司台灣閃玉礦業事務所","lat":23.862377,"lng":121.454034,"cat":"history","tag":"歷史建築","desc":"這棟礦業事務所與花蓮開採台灣閃玉的歷史有關。建築外牆下方砌磚、上方覆木板，兩面斜下的鐵皮屋頂則由木桁架撐起。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5012,"name":"白鮑溪親水園區","lat":23.88973,"lng":121.51108,"cat":"culture","desc":"清澈的溪水穿過產有豐田玉和蛇紋石的河谷。經生態工法整治的河岸保留原來的地形，沿砌石護岸旁的階梯能走近溪水，觀察河川生態。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5013,"name":"立川漁場","lat":23.86466,"lng":121.52226,"cat":"scenic","desc":"壽豐的天然湧泉被引進養殖池，用來養黃金蜆。館裡可以認識蜆如何長大，體驗池則讓人自己下水摸蜆，試試「摸蜊仔兼洗褲」的滋味。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5014,"name":"舊豐田移民村警察官吏派出所(壽豐鄉文史館)","lat":23.841097,"lng":121.507966,"cat":"history","tag":"歷史建築","desc":"以前管理豐田移民村警政的派出所，整修後成了壽豐鄉文史館。建築外圍繞著ㄇ字形走廊，牆內還保留竹片、泥層與石灰組成的老構造。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5015,"name":"花蓮縣考古博物館","lat":23.84848,"lng":121.49364,"cat":"culture","desc":"豐田舊市場的灰色混凝土骨架保留下來，裡面如今展示花蓮各地出土的史前文物。館內以玉石工藝為重點，可以認識東臺灣早年如何製作玉器。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5016,"name":"花蓮農場招待所","lat":23.871707,"lng":121.515037,"cat":"history","tag":"歷史建築","desc":"這棟招待所原是鹽水港製糖株式會社花蓮港製糖所的所長公館。外牆能見到層層搭接的木板，屋基上的木百葉小窗則是早年的通風設計。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5017,"name":"花蓮遊客中心","lat":23.90478,"lng":121.60289,"cat":"other","desc":"遊客中心順著海岸山脈北側的山坡而建，從這裡望得見太平洋。館內用展示與多媒體介紹東海岸沿線的自然環境和人文景觀。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5018,"name":"豐田大同戲院","lat":23.84944,"lng":121.49507,"cat":"culture","desc":"豐田這間戲院以前除了放電影，也借給社區辦表演。電影散場後，它一度改成集合住宅，住過來到當地工作的磨玉師傅與西瓜商人。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5019,"name":"豐田村移民指導所事務室","lat":23.84144,"lng":121.5088,"cat":"history","tag":"歷史建築","desc":"這是日治時期豐田官營移民村留下的辦公建築，見證早年管理移民村的歷史。留意外牆上可上下推動的雙窗，屋頂底下則是西式木桁架。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5020,"name":"豐田神社參道與遺構(碧蓮寺之周邊設施)","lat":23.838939,"lng":121.501547,"cat":"worship","tag":"歷史建築","desc":"豐田移民村昔日的神社留下了鳥居、石燈和參拜用的道路。沿第一座鳥居往裡還有第二座鳥居，原有的石雕狛犬則移到了碧蓮寺前兩側。","area":"壽豐鄉・花蓮縣","ph":"文"},{"id":5021,"name":"遠雄海洋公園","lat":23.90126,"lng":121.60354,"cat":"nature","desc":"園區順著面向太平洋的緩坡而建，建築模仿十九世紀英國碼頭與海岸嘉年華的樣子。裡面既有海洋生物展示，也看得到戶外遊樂設施。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5022,"name":"鈺展苗圃（落羽松秘境）","lat":23.88889,"lng":121.52635,"cat":"scenic","desc":"壽豐這座私人苗圃原本培育樹木，其中一區的落羽松就長在淺水池裡。水面平靜時，筆直的樹幹一排排倒映在池中。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5023,"name":"鈺展苗圃（落羽松秘境）","lat":23.89104,"lng":121.52529,"cat":"other","desc":"這片落羽松林的看點，是整片林子會隨季節變色。樹冠先染上金黃，到了冬季落葉以前，還會轉成一大片橘紅色。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5024,"name":"鯉魚潭","lat":23.92783,"lng":121.50988,"cat":"scenic","desc":"鯉魚山旁的湖面南北狹長，是花蓮最大的內陸湖泊。附近山巒映進平靜的潭水裡，除了在水上遊湖，也能沿湖畔騎車看山。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5025,"name":"鯉魚潭遊客中心","lat":23.935,"lng":121.50778,"cat":"scenic","desc":"潭北岸的館舍裡有原住民族風格的木雕。展館用模型、照片和圖文介紹鯉魚潭如何形成，從館裡看過再到水邊，更容易認出周圍地景。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5026,"name":"鹽寮","lat":23.90294,"lng":121.6038,"cat":"other","desc":"花蓮港一帶早年的食鹽曾在這裡煮製，「鹽寮」就因此得名。村裡有綿長的礫石海灘，夏天的「海或．瘋市集」也聚集各地手作者。","area":"壽豐鄉・花蓮縣","ph":"觀"},{"id":5027,"name":"吉拉米代-吉哈拉艾天空梯田","lat":23.14264,"lng":121.27207,"cat":"scenic","desc":"阿美族人沿著海岸山脈的陡坡開出一層層稻田，因此有了「天空梯田」的稱呼。吉哈拉艾這個地名，則來自當地溪裡的台東間爬岩鰍。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5028,"name":"富南磚窯場","lat":23.140325,"lng":121.23739,"cat":"history","tag":"歷史建築","desc":"縱谷田野間的紅磚煙囪，標示著昔日燒製紅磚的窯場。這裡的八卦窯外觀近似橢圓形，裡頭的拱形窯室繞成一圈，可以分隔開來燒磚。","area":"富里鄉・花蓮縣","ph":"文"},{"id":5029,"name":"富里車站","lat":23.17921,"lng":121.24861,"cat":"other","desc":"富里是花東縱谷的米鄉，車站也把地方產業放進了設計裡。淺鵝黃色的長方形站房立在平原上，外觀用的都是簡單俐落的線條。","area":"富里鄉・花蓮縣","
