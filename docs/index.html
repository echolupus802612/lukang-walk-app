ph":"觀"},{"id":5030,"name":"富里鄉東里村邱家古厝","lat":23.267666,"lng":121.304378,"cat":"history","tag":"古蹟","desc":"東里這棟傳統民居前方有水圳，把前埕和道路隔開。抬頭看簷廊，支撐屋簷的兩根石柱雕成竹節形，在一般民宅裡少見。","area":"富里鄉・花蓮縣","ph":"文"},{"id":5031,"name":"小天祥","lat":23.14353,"lng":121.27261,"cat":"scenic","desc":"東富公路在這裡夾在陡峭岩壁和幽深溪谷之間，路旁還有人工鑿出的小石門。因為景色讓人想起太魯閣峽谷，才有「小天祥」的稱呼。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5032,"name":"御皇米百年文化故事館","lat":23.2681,"lng":121.30344,"cat":"culture","desc":"街邊的樸實廠房裡保留了昔日加工稻穀的機器。順著館內的產業文物看下去，可以認識花東縱谷的稻米如何從田間進入加工場。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5033,"name":"東富禪寺","lat":23.21988,"lng":121.29492,"cat":"worship","desc":"山林間的佛寺是僧眾修行、信徒參拜的地方，也開放庭園供人散步。寺前有一大片修剪整齊的草坪，望出去就是開闊的花東縱谷。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5034,"name":"東里車站與東里鐵馬驛站","lat":23.2689,"lng":121.30413,"cat":"other","desc":"這座小車站被縱谷的農田包圍，最開闊的風景就在月台邊。站上月台往外望，眼前是一整片延伸開來的綠色稻田。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5035,"name":"玉長公路","lat":23.2784,"lng":121.34888,"cat":"other","desc":"這段公路從花東縱谷平原出發，穿越海岸山脈，另一端就是東海岸。蜿蜒的柏油路把山區兩側連在一起，也讓沿線景色從山林轉向海邊。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5036,"name":"羅山大魚池","lat":23.1863,"lng":121.28612,"cat":"scenic","desc":"當地長輩叫它「大埤塘」，池水來自斷層湧泉，泥火山噴出物則把水攔了下來。早年灌溉和養魚用的埤塘，如今有木棧橋曲折地跨過水面。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5037,"name":"羅山展售中心-稻田藝術","lat":23.20654,"lng":121.27278,"cat":"other","desc":"富里鄉農會把展售中心旁的休耕田用作露天展場。收割後留下的乾稻草成了創作材料，稻草藝術季時，田裡會出現一件件巨型作品。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5038,"name":"羅山有機農業村","lat":23.20167,"lng":121.27566,"cat":"scenic","desc":"群山環繞的羅山聚落以有機農業發展，是臺灣首處有機農業村。村裡引山區的水作灌溉與日常使用，田裡耕作也不依賴化學農藥和肥料。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5039,"name":"羅山瀑布","lat":23.18183,"lng":121.29519,"cat":"scenic","desc":"溪水從海岸山脈的峭壁分兩層傾瀉而下，總落差約一百二十公尺。雨水豐沛的季節，即使站在遠處的縱谷平原也看得見白色瀑流。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5040,"name":"花蓮縣富里鄉豐南村吉哈拉艾文化景觀","lat":23.145647,"lng":121.280994,"cat":"history","tag":"文化景觀","desc":"石厝溝溪流域裡，梯田、水圳和人家沿著溪流的中下游分布。六條水圳灌溉這裡的水稻田，也把部落生活與山坡上的耕地連在一起。","area":"富里鄉・花蓮縣","ph":"文"},{"id":5041,"name":"馬里旺紀念碑","lat":23.16155,"lng":121.22736,"cat":"other","desc":"石碑立在淺山高處的涼亭裡，俯瞰縱谷平原和田野。它記下二十世紀初這一帶的族群衝突，以及地方教育與開墾的往事。","area":"富里鄉・花蓮縣","ph":"觀"},{"id":5042,"name":"七星柴魚博物館","lat":24.02717,"lng":121.62913,"cat":"culture","desc":"舊柴魚加工廠裡，仍能看出早年燻製漁獲的空間格局。館內講的是七星潭的漁業故事，從定置漁網到柴魚加工，都和附近的海洋有關。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5043,"name":"亞泥生態園區","lat":24.13356,"lng":121.6402,"cat":"culture","desc":"水泥廠旁的大網室是復育在地生物的地方，園區裡有蝴蝶、竹節蟲和原生植物。近看可以觀察昆蟲的生命週期，也能認識牠們需要的棲地。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5044,"name":"南海園海洋驛站","lat":24.04522,"lng":121.60398,"cat":"scenic","desc":"海巡署在新城設了這座藍白色驛站，也有人叫它「小虎鯨海洋驛站」。外觀融入海洋意象，裡面除了讓人歇腳，也推廣海洋教育。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5045,"name":"新城保安宮","lat":24.01733,"lng":121.60633,"cat":"worship","desc":"嘉里村的居民習慣叫這裡「天公廟」，廟內主祀玉皇大帝。高大的宮殿式建築從遠處就能辨認，是北花蓮一帶醒目的地標。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5046,"name":"新城天主堂","lat":24.12903,"lng":121.6503,"cat":"worship","desc":"入口先遇見日本神社留下的鳥居，再往內卻是一座天主教禮拜堂。船形的禮拜堂覆著藤蔓，和周圍的老樹一起留住這塊地不同時期的樣貌。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5047,"name":"新城海堤","lat":24.12374,"lng":121.65528,"cat":"other","desc":"弧形的混凝土海堤護著新城聚落，堤頂鋪成了平坦的步道。站在上頭往外望，目光可以從腳下的礫石灘一直延伸到太平洋的海平線。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5048,"name":"新城神社舊址","lat":24.1293,"lng":121.65037,"cat":"worship","tag":"古蹟","desc":"天主教禮拜堂所在的庭園，仍保留舊神社的參道、石燈籠和兩座鳥居。園中還有「殉難將士瘞骨碑」，記下日軍與太魯閣族衝突的歷史。","area":"新城鄉・花蓮縣","ph":"文"},{"id":5049,"name":"新城老街","lat":24.12635,"lng":121.65184,"cat":"structure","desc":"博愛路上，低矮木屋與洗石子店面錯落在民宅間，舊招牌還掛在屋簷下。老照相館曾替居民拍證件照，後來也成了電影《盛夏光年》的取景地。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5050,"name":"新城鄉原研海庄役場","lat":24.126369,"lng":121.65338,"cat":"history","tag":"歷史建築","desc":"這是日治時期研海地方行政機關留下的建築。屋頂四面向下傾斜，混凝土和木板外牆上開著直立的長窗，圍牆局部還露出砌牆用的卵石。","area":"新城鄉・花蓮縣","ph":"文"},{"id":5051,"name":"洄遊吧食魚體驗館","lat":24.02696,"lng":121.63149,"cat":"culture","desc":"七星潭鄰近黑潮，當地居民早年靠近海捕魚維生。體驗館從漁村生活談起，保留這片海灣的捕魚記憶，讓人認識觀光發展以前的七星潭。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5052,"name":"靜思精舍","lat":24.05454,"lng":121.60175,"cat":"other","desc":"中央山脈前的田園間，灰瓦白牆的建築群是慈濟功德會的發祥地。這裡至今仍是常住眾修行的道場，保留著早年樸實的樣貌。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5053,"name":"龍泉親水公園","lat":24.01725,"lng":121.60307,"cat":"nature","desc":"天然湧泉滋養著公園裡的濕地植物，兩口長形荷塘之間有彎曲的生態溝渠。從平原上的水邊往後望，還能看到中央山脈的稜線。","area":"新城鄉・花蓮縣","ph":"觀"},{"id":5054,"name":"台灣黑熊教育館","lat":23.33531,"lng":121.31745,"cat":"culture","desc":"玉里國小的舊教室變成認識台灣黑熊的展館，外牆上畫著醒目的黑熊。館內談黑熊生態與保育，腳下仍是老教室的磨石子地板，窗框也保留了木作。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5055,"name":"安通溫泉旅舍","lat":23.28119,"lng":121.3418,"cat":"history","tag":"歷史建築","desc":"安通溪畔的溫泉在日治時期設過警察招待所和公共澡堂，後來才改由民間經營。旅舍留下當年的木造平房，入口設在轉角，玄關柱用了洗石子。","area":"玉里鎮・花蓮縣","ph":"文"},{"id":5056,"name":"安通越嶺道","lat":23.28471,"lng":121.37239,"cat":"scenic","desc":"這條古道曾是玉里和長濱居民翻越海岸山脈的捷徑。沿途穿過低海拔闊葉林和陡峭山稜，從山上能望向縱谷，也能看到太平洋。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5057,"name":"林務局玉里國有眷舍","lat":23.337959,"lng":121.31339,"cat":"history","tag":"歷史建築","desc":"中華路巷裡的木造宿舍曾由專賣局使用，戰後成了林務局員工的住處。雙併宿舍的屋頂斜向四面，獨棟宿舍則只有兩面斜坡。","area":"玉里鎮・花蓮縣","ph":"文"},{"id":5058,"name":"樂樂溪橋（客城鐵橋）","lat":23.32103,"lng":121.31058,"cat":"other","desc":"花東線列車經過玉里郊外時，會從兩座鮮紅的鋼拱下穿過。橋身跨過樂樂溪寬闊的河床，在四周的農田裡顯得格外醒目。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5059,"name":"歐亞板塊及菲律賓海板塊交界紀念碑","lat":23.32133,"lng":121.3296,"cat":"other","desc":"跨越秀姑巒溪的舊鐵橋如今是玉富自行車道的一段。橋面上的紀念碑標出歐亞板塊與菲律賓海板塊交界，讓人看得見腳下的地質界線。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5060,"name":"玉泉寺","lat":23.33693,"lng":121.30819,"cat":"worship","desc":"中央山脈山麓的佛寺供奉佛祖和觀音，寺名就取自後方的泉水。這口泉終年湧流，也是玉里居民前來取水、順道歇腳的地方。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5061,"name":"玉里信用組合及倉庫群","lat":23.33823,"lng":121.315154,"cat":"history","tag":"歷史建築","desc":"地方人士在日治時期合組信用組合，讓玉里有了辦理存款和放款的金融機構。建築正面方整對稱，窗子分成上中下三段，各有不同開法。","area":"玉里鎮・花蓮縣","ph":"文"},{"id":5062,"name":"玉里協天宮","lat":23.33374,"lng":121.31609,"cat":"worship","desc":"這座廟主祀關聖帝君，約在十九世紀七〇年代就已在玉里發展。仰頭看屋脊有高高翹起的燕尾，廟身還能看到繁複的石雕。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5063,"name":"玉里濕地 (啟模濕地公園）","lat":23.34542,"lng":121.32952,"cat":"nature","desc":"這片濕地接收城鎮的生活污水，透過生態工法淨化水質。開闊的池面映著山稜，也是水鳥和兩棲類生活的場所，居民平時會來散步。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5064,"name":"玉里社殘蹟","lat":23.334552,"lng":121.308212,"cat":"worship","tag":"古蹟","desc":"玉里社原有的殿宇已毀，往山坡走仍能見到兩座鳥居、參道階梯和部分石燈籠。鳥居旁留有表忠碑，附近也立著紀念八通關開鑿的石碑。","area":"玉里鎮・花蓮縣","ph":"文"},{"id":5065,"name":"玉里神社遺址","lat":23.33387,"lng":121.30739,"cat":"other","desc":"民宅巷弄間的灰色混凝土鳥居，標示出舊神社的位置。日治時期留下的構造沿著山坡分布，和周圍後來蓋起的房屋並列。","area":"玉里鎮・花蓮縣","ph":"觀"},{"id":5066,"name":"玉里迪階陸橋殘蹟","lat":23.440803,"lng":121.349882,"cat":"history","tag":"古蹟","desc":"這處東部鐵道遺構約有七公尺高，基座以上的兩層磚砌體向上收窄。細看磚牆，長邊和短邊逐層交替露出，是荷蘭式砌法的特徵。","area":"玉里鎮・花蓮縣","ph":"文"},{"id":5067,"name":"長良連家古厝","lat":23.274164,"lng":121.28826,"cat":"history","tag":"歷史建築","desc":"連家的住宅有七開間，房舍圍成ㄇ字形，前庭留著半月形的池子。左側的石造倉庫也很特別，牆壁用石塊砌到兩尺厚。","area":"玉里鎮・花蓮縣","ph":"文"},{"id":5068,"name":"Satokoay (舞鶴)遺址","lat":23.4706,"lng":121.35917,"cat":"history","desc":"舞鶴台地的平坦草地上豎著兩根巨大的板岩石柱，也叫掃叭石柱。它們是東臺灣史前巨石文化的遺留，周邊部落也流傳著相關故事。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5069,"name":"北回歸線標誌公園","lat":23.46573,"lng":121.3574,"cat":"nature","desc":"舞鶴台地上矗立著一座白色的大日晷，標示北回歸線的地理意義。附近除了步道，還擺著一把巨型茶壺，兩種不同的造型都很顯眼。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5070,"name":"富源保安宮","lat":23.576315,"lng":121.375888,"cat":"worship","tag":"歷史建築","desc":"這裡俗稱城隍廟，最早是謝芳榮搭建茅屋奉祀城隍，信仰源自福建同安。如今廟身有五開間，走過入口牌樓就能看到正殿和偏殿。","area":"瑞穗鄉・花蓮縣","ph":"文"},{"id":5071,"name":"富興森林小火車","lat":23.58091,"lng":121.3995,"cat":"scenic","desc":"富興的遊園小火車把鳳梨田和平地樹林串成一路，開放式車廂裡就看得見農田。鳳梨產季時，一顆顆成熟的果實散布在田間。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5072,"name":"拔仔庄常民文化館","lat":23.58081,"lng":121.3802,"cat":"culture","desc":"富源村舊稱拔仔庄，火車站旁的鐵路舊倉庫如今成了地方文化館。方正的水泥建築裡，收藏著從清代開墾以來的生活記憶。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5073,"name":"掃叭隧道","lat":23.46584,"lng":121.34795,"cat":"history","tag":"古蹟","desc":"這條臺東線舊隧道當年靠人力開鑿，兩端洞口都留有題字。北口寫著「無窮」，南口寫著「宏達」，磚面上還看得到長短相間的荷蘭式砌法。","area":"瑞穗鄉・花蓮縣","ph":"文"},{"id":5074,"name":"瑞穗欒樹大道","lat":23.49403,"lng":121.35173,"cat":"scenic","desc":"通往瑞穗溫泉區的路上，兩旁的台灣欒樹伸展枝葉，在路面上方交織成綠蔭。沿著同一段路散步，不同季節看到的樹冠色調也會跟著改變。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5075,"name":"瑞穗泛舟服務中心","lat":23.48744,"lng":121.39986,"cat":"scenic","desc":"秀姑巒溪畔的服務中心把原住民族文化元素融入建築，裡面介紹泛舟與水上安全。夏天溪面上常見紅色橡皮艇，沿著溪谷往長虹橋前進。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5076,"name":"瑞穗生態教育館","lat":23.496902,"lng":121.374,"cat":"culture","desc":"林務局的舊工作站如今介紹玉里野生動物保護區的動植物。館裡除了展示花蓮的森林生態，還保存了一件台灣黑熊的毛皮標本。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5077,"name":"瑞穗鄉慶安宮土地公廟","lat":23.570393,"lng":121.400599,"cat":"worship","tag":"歷史建築","desc":"這座土地公祠由大和村居民集資興建，地震後遷移重建，台基以外仍是原來的構件。小廟外形樸素，細看屋面和脊上卻有雕刻。","area":"瑞穗鄉・花蓮縣","ph":"文"},{"id":5078,"name":"秀姑巒溪","lat":23.322,"lng":121.337,"cat":"scenic","desc":"河水切穿海岸山脈，在彎曲的峽谷裡形成深潭和一道道激流，最後流進太平洋。充沛的水量和明顯的落差，也讓這裡成了花東的泛舟河段。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5079,"name":"紅葉菸樓","lat":23.49432,"lng":121.35849,"cat":"history","desc":"瑞穗過去也種菸，烘好的菸葉會送到鳳林販售。巷裡一棟棟菸樓還留著覆上青苔的黑瓦，紅磚牆和木板上則多了詩句與彩繪。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5080,"name":"紅葉菸樓","lat":23.49469,"lng":121.34675,"cat":"other","desc":"萬榮的住宅巷弄裡，黑瓦屋頂上再凸出一截排氣樓，就是昔日烘菸的地方。這些菸樓留下了花東縱谷農家把菸草烘成菸葉的產業記憶。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5081,"name":"鶴岡遊客中心","lat":23.52407,"lng":121.39087,"cat":"scenic","desc":"背靠海岸山脈的遊客中心，也是花東縱谷國家風景區管理處的所在地。建築前有一大片平坦草地，旁邊還有涼亭，可歇腳看山。","area":"瑞穗鄉・花蓮縣","ph":"觀"},{"id":5082,"name":"中部東西橫貫公路慈雲橋","lat":24.212563,"lng":121.430013,"cat":"history","tag":"歷史建築","desc":"中橫早年缺乏物資，不少臨時橋在公路通車後才陸續改建。慈雲橋採用華倫式鋼桁架，斜桿交錯之間另有直立的支撐桿。","area":"秀林鄉・花蓮縣","ph":"文"},{"id":5083,"name":"大禹嶺","lat":24.17835,"lng":121.30427,"cat":"other","desc":"合歡山和畢祿山之間的鞍部，是中橫公路主線的最高點。這裡也是分水嶺，立霧溪和大甲溪兩側的氣流交會，山間常有雲霧。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5084,"name":"天祥","lat":24.18224,"lng":121.49441,"cat":"other","desc":"大沙溪與立霧溪在這裡匯流，溪水長年堆積、侵蝕，留下峽谷間一片開闊的河階。跨越溪谷的稚暉橋，是這一帶容易認出的地標。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5085,"name":"太魯閣大橋","lat":24.14383,"lng":121.64408,"cat":"other","desc":"淡藍與灰白相間的鋼拱橋跨過立霧溪出海口，連起新城和秀林。橋身的色調是配合天空與溪水挑選的，遠望時能和周圍景色融在一起。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5086,"name":"太魯閣牌樓","lat":24.15548,"lng":121.621635,"cat":"history","tag":"歷史建築","desc":"錦文橋頭的朱紅色牌樓上，題著「東西橫貫公路」六字，紀念中橫的開鑿。四列柱子撐起黃色琉璃瓦屋頂，牌樓旁還立著石獅。","area":"秀林鄉・花蓮縣","ph":"文"},{"id":5087,"name":"太魯閣臺地","lat":24.15831,"lng":121.62121,"cat":"other","desc":"進入峽谷前，立霧溪邊有一片長滿草的扇形河階，背後緊挨著高聳山壁。國家公園的遊客中心和行政總部都設在這塊少見的平地上。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5088,"name":"小風口","lat":24.16249,"lng":121.28787,"cat":"other","desc":"接近三千公尺高的隘口匯集立霧溪與大甲溪兩側的氣流，山風很強。平台周圍可見山巒起伏，坡上則長著低矮的玉山箭竹。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5089,"name":"崇德礫灘","lat":24.16775,"lng":121.65781,"cat":"scenic","desc":"深灰細石和圓礫鋪成狹長的海岸，浪一退，能聽見石頭跟著滾動的聲音。這裡望得見清水斷崖，也能看見定置漁場的漁船作業。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5090,"name":"後山蕨起","lat":24.05741,"lng":121.59431,"cat":"scenic","desc":"林間長著大片山蘇，這處園區把太魯閣族的部落生活和食農體驗放在一起。沿途能近看大型蕨類如何生長，也有機會參與農作採收。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5091,"name":"木瓜溪文物生態故事館","lat":23.96668,"lng":121.48892,"cat":"culture","desc":"台電在木瓜溪畔設館，介紹東部水力發電的歷史。展覽把流域的自然生態和電力開發放在一起，也是認識慕谷慕魚地區的一個起點。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5092,"name":"板下海灣","lat":24.17807,"lng":121.65786,"cat":"scenic","desc":"月牙形的灘岸鋪著灰黑礫石和圓潤的鵝卵石，前方就是太平洋。這片海灣貼近中央山脈東側，從海平面便能仰望清水斷崖的峭壁。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5093,"name":"清水斷崖","lat":24.21889,"lng":121.69306,"cat":"other","desc":"太魯閣國家公園裡這一段海岸，高聳的岩壁幾乎垂直落入太平洋。沿岸數公里都能看到灰白岩層緊貼深淺不同的藍色海水。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5094,"name":"碧綠神木","lat":24.18078,"lng":121.40316,"cat":"other","desc":"中橫公路旁這株枝葉繁茂的巨木是巒大杉，樹高約五十公尺。這種臺灣原生樹木少有長到這般規模的個體，在山路上格外醒目。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5095,"name":"秀林加灣神社殘蹟","lat":24.083179,"lng":121.60518,"cat":"history","tag":"歷史建築","desc":"舊神社的遺構沿著地勢分成三層，入口的鳥居立在最下方。往上還能辨認出石階和祭拜前用來淨手的設施，神社本體的殘跡則在頂層。","area":"秀林鄉・花蓮縣","ph":"文"},{"id":5096,"name":"秀林普明寺","lat":24.05441,"lng":121.59978,"cat":"worship","tag":"歷史建築","desc":"這裡的信仰可追溯到日治時期北埔農場興建的地藏堂。如今大殿屋簷留有雕飾滴水瓦，兩側屋脊能看到鳳凰與獅子造型。","area":"秀林鄉・花蓮縣","ph":"文"},{"id":5097,"name":"西寶臺地","lat":24.19841,"lng":121.48382,"cat":"scenic","desc":"立霧溪北岸這片平坦臺地，是河流向下切割、地殼逐漸抬升所留下的河階。這裡也是太魯閣國家公園裡少見有人務農的聚落。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5098,"name":"達基力部落屋","lat":24.15809,"lng":121.64987,"cat":"other","desc":"木雕圖騰柱立在入口，後方的部落屋順著山勢而建，沒有門窗，四周都是綠意。半露天的空間裡有太魯閣族藝術與技藝展示，也供應部落料理。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5099,"name":"關原","lat":24.18447,"lng":121.34278,"cat":"other","desc":"中橫沿線這段平坦的高山稜脊，是觀察山區天氣變化的地方。白霧在山間聚起時，從這裡可以看到關原的雲海。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5100,"name":"馬耀雕房","lat":24.07445,"lng":121.60815,"cat":"other","desc":"阿美族藝術家馬耀在這裡創作，也把大小不同的立體石雕放在園裡展示。自然光照在作品上，可以看清石頭原本的色澤和粗糙紋理。","area":"秀林鄉・花蓮縣","ph":"觀"},{"id":5101,"name":"中國廣播股份有限公司花蓮電台（原台灣放送協會花蓮港放送局）","lat":23.982955,"lng":121.614726,"cat":"culture","tag":"歷史建築","desc":"美崙山林木間的舊電台，曾在戰時負責宣傳與地方通訊。簡潔的外觀保留了日治末期的建築風格，如今裡面也容納藝術活動。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5102,"name":"交通部台鐵管理局花蓮管理處","lat":23.974639,"lng":121.610583,"cat":"history","tag":"歷史建築","desc":"從前調度花東鐵路的機關就設在這裡，處長室、工務段和警務段都留了下來。園區裡能同時看見西式尖塔與日式木造四合院。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5103,"name":"介壽新村","lat":23.9874,"lng":121.6197,"cat":"other","desc":"眷村巷弄裡有居民畫的彩繪，往屋頂看還能找到老宅的鬼瓦。這片空軍眷村沿用了日式住宅，留下戰後移民在花蓮生活的痕跡。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5104,"name":"前花蓮火車站加水塔","lat":23.975365,"lng":121.6091,"cat":"history","tag":"歷史建築","desc":"花蓮舊站遷走後，原來的鐵軌成了今天的福町路，替蒸汽機車供水的塔卻留了下來。其中一座圓塔由六根方柱撐起，足有三層樓高。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5105,"name":"又一村文創園區","lat":23.97819,"lng":121.60233,"cat":"culture","desc":"兩排舊宿舍之間，保留著大庭院和枝葉茂密的老樹。昔日的居住空間如今有手作工藝和餐飲進駐，假日也會在這裡辦市集。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5106,"name":"台灣鐵路局花蓮管理處處長官邸","lat":23.973658,"lng":121.612788,"cat":"history","tag":"歷史建築","desc":"這棟鐵路處長官邸的木造外牆仍可見檜木板，大門卻採西式列柱。四周是同屬鐵路宿舍的日式木屋，院內還留有大型防空洞。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5107,"name":"台鐵花蓮舊工務段、舊警務段建築群","lat":23.97472,"lng":121.60966,"cat":"history","tag":"歷史建築","desc":"舊工務段和警務段的木屋外牆覆著雨淋板，屋內斜撐的木材用來抵禦風震。除了房舍，這裡也保留了鐵道、火車和防空洞。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5108,"name":"向日廣場","lat":23.99814,"lng":121.64082,"cat":"nature","desc":"彩色牆面和尖屋頂讓港邊這座廣場很容易辨認。清晨可以看到日光從海平面升起，也能站在海風裡，看船隻進出港口。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5109,"name":"四八高地瞭望台","lat":24.02229,"lng":121.63487,"cat":"scenic","desc":"海岸台地隆起約四十八公尺，瞭望台因此得名。從台地邊緣可以俯瞰七星潭的月牙形海灣，遠處還能辨認白色的奇萊鼻燈塔。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5110,"name":"大陳故事館","lat":24.00447,"lng":121.61718,"cat":"culture","desc":"眷村巷裡的兩層樓房，外牆畫著鮮豔的漁船和風帆。裡面的文物和記錄，講的是大陳島居民如何渡海、在花蓮重新安家的故事。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5111,"name":"太平洋公園","lat":23.96639,"lng":121.60917,"cat":"nature","desc":"昔日的南濱與北濱公園連成一片狹長綠地，正面對著太平洋。兩潭自行車道串起兩端，沿線除了海景，還看得到原有的海岸植物。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5112,"name":"日出香榭大道","lat":23.97481,"lng":121.60709,"cat":"other","desc":"昔日的市區排水渠道如今成了連向海邊的寬闊步道。腳下的花崗石以黑白兩色拼出幾何圖案，兩旁則排列著整齊的棕櫚。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5113,"name":"明禮路14巷2號日式住宅(三浦勳宅)","lat":23.981797,"lng":121.609212,"cat":"structure","tag":"歷史建築","desc":"這棟日式住宅的外牆覆著一層層雨淋板，屋頂兼有四面和兩面斜坡的造型。門窗邊的雨戶和上方的欄間也保存了下來。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5114,"name":"曙光橋","lat":23.979331,"lng":121.618046,"cat":"history","tag":"歷史建築","desc":"美崙溪出海口的舊鋼骨上，鋪著供行人和自行車通過的木棧道。這座橋把花蓮港與市區接在一起，也是居民沿河散步的地方。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5115,"name":"松園別館","lat":23.982518,"lng":121.615515,"cat":"culture","tag":"歷史建築","desc":"老松樹圍繞的這片建築，曾是日軍花蓮兵事部的辦公地點。除了前後兩棟宿舍與服務空間，基地內還能看見磚造和木造房舍。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5116,"name":"汎札萊・原夢館","lat":23.97298,"lng":121.61093,"cat":"culture","desc":"灰色清水模外牆內，原本閒置的場館成了原住民族品牌展示作品的地方。這裡集合了來自原鄉的生活用品和工藝創作，也供人挑選購買。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5117,"name":"田浦生態池園區","lat":23.97709,"lng":121.59651,"cat":"culture","desc":"住宅區裡還保留著一片濕地，池邊長著水生植物、原生喬木與灌木。散步的人走在架高的木棧道上，和生物棲息的地方保持距離。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5118,"name":"石來運轉噴泉廣場","lat":23.97443,"lng":121.6108,"cat":"nature","desc":"池中央的大理石球從前靠水壓托起，沉重的石球也能持續轉動。如今以靜態方式展示，仍可看出這座噴泉如何把在地石材與水力結合。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5119,"name":"福住橋暨第二福住橋","lat":23.967425,"lng":121.608843,"cat":"history","tag":"歷史建築","desc":"兩座洗石子水泥小橋，曾跨過花蓮舊商街福住通一帶的排水溝。第二座橋的橋頭柱上，還找得到用日文草寫留下的橋名。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5120,"name":"美崙山公園","lat":23.98544,"lng":121.61241,"cat":"nature","desc":"花蓮市區的平原上隆起一座獨立小山丘，海拔約一百零八公尺。山上植被茂密，登高向西可以看見山巒以及蜿蜒的美崙溪。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5121,"name":"美崙溪畔公園","lat":23.98195,"lng":121.61774,"cat":"nature","desc":"從尚志橋到出海口，美崙溪旁一直伴著一條帶狀公園。橫過河面的紅色菁華橋連起兩岸，也是沿溪散步時格外醒目的景物。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5122,"name":"美崙濱海公園","lat":23.98365,"lng":121.62424,"cat":"nature","desc":"市區邊緣的草坡一直延伸到海邊，眼前就是開闊的太平洋。這裡靠近花蓮港，站在綠地上還能看見航道和往來的船隻。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5123,"name":"臺灣原住民族文化館","lat":24.00798,"lng":121.62476,"cat":"culture","desc":"大片灰瓦覆在雙斜屋頂上，讓人想起傳統石板屋。館內收藏花蓮原住民族的部落文物，也展示阿美族、太魯閣族等族群的當代藝術與工藝。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5124,"name":"花崗山親子戲沙池","lat":23.97829,"lng":121.61325,"cat":"other","desc":"醒目的藍鯨魚待在下沉的沙地中央，透露了遊戲場原來的樣子。這裡原是泳池，改成戲沙池後，凹下去的池身就成了孩子遊玩的空間。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5125,"name":"花蓮台肥招待所","lat":23.989192,"lng":121.624371,"cat":"history","tag":"古蹟","desc":"這棟大型日式招待所保留了新舊並列的樣子。右側已改用水泥牆和新瓦頂，左側還能看到昔日木造住宅的格局與雨淋板外牆。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5126,"name":"花蓮和平廣場","lat":23.97963,"lng":121.61874,"cat":"nature","desc":"美崙溪出海口旁有一片略高於海面的紀念廣場，兩潭自行車道也經過這裡。站在開闊處，一邊能望向太平洋，一邊能看港內船隻進出。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5127,"name":"花蓮城隍廟","lat":23.97342,"lng":121.60585,"cat":"worship","desc":"成功街上的廟宇從日治時期就供奉護國城隍爺，是花蓮市區的信仰中心。古樸的廟門立在現代街區之間，仍可辨認早年廟宇的樣貌。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5128,"name":"花蓮將軍府1936","lat":23.98055,"lng":121.61284,"cat":"other","desc":"八棟黑瓦檜木房舍曾是花蓮港分屯大隊的宿舍，有獨棟也有兩戶相連的形式。如今在這片軍事住宅聚落裡，還有餐飲和文化體驗空間。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5129,"name":"花蓮市好客文化會館","lat":23.98169,"lng":121.6068,"cat":"culture","desc":"街區裡的日式木屋外牆飾有客家文學元素，裡頭展示花蓮客家的歷史文物。這裡也是社區居民交流、舉辦文化教育活動的地方。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5130,"name":"花蓮市美崙溪高灘地寵物公園","lat":24.00782,"lng":121.58068,"cat":"nature","desc":"美崙溪畔的高灘地有一片用圍籬圈起的草坪，專門留給狗兒跑跳。大型犬和小型犬分開活動，各自都有平坦開闊的空間。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5131,"name":"花蓮文化創意產業園區","lat":23.97624,"lng":121.60486,"cat":"culture","desc":"花蓮舊酒廠的廠房和戶外空地，變成了市中心的藝文園區。走在錯落的老建築間，仍看得出釀酒廠原來的規模，廠房裡也有展演活動。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5132,"name":"花蓮港","lat":23.98662,"lng":121.63249,"cat":"other","desc":"東西兩道防波堤環起一座人工港，把太平洋的波浪擋在外面。港區背靠中央山脈，裡面的大型貨輪和起重機則是商港日常的風景。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5133,"name":"花蓮港天宮","lat":24.00752,"lng":121.58746,"cat":"worship","desc":"當地居民叫這裡「港天媽」，廟內主祀天上聖母。前殿兩側的龍柱特別醒目，龍頭朝下，張開的龍口竟是通往三樓的階梯入口。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5134,"name":"花蓮港山林事業所","lat":23.980365,"lng":121.615933,"cat":"history","tag":"古蹟","desc":"主建築左右對稱，鋼筋混凝土牆面覆著洗石子，屋頂則由木架支撐。大門的古典拱弧和裝飾柱，讓外觀帶著日式與西式混合的味道。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5135,"name":"花蓮港高爾夫球俱樂部","lat":23.999365,"lng":121.625931,"cat":"history","tag":"古蹟","desc":"圓弧形窗戶和向前突出的拱門，是這棟球會建築最醒目的線條。屋面底下由木桁架支撐，中央原有的圓頂在風災後改蓋了鐵皮。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5136,"name":"花蓮港鳥踏石公園","lat":23.98796,"lng":121.62947,"cat":"nature","desc":"林木間的大型原木色鳥居，是這座港邊公園的標記。兩潭自行車道旁的帶狀綠地，保留舊鐵道的痕跡，也能看到沿海生長的植物。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5137,"name":"花蓮漁港","lat":23.99643,"lng":121.63864,"cat":"other","desc":"防波堤裡停著漁船和白色的賞鯨船，船身映在平靜的港面上。這裡既是東部漁獲集散地，也是船隻駛向太平洋尋訪鯨豚的出發港。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5138,"name":"花蓮玫瑰石藝術舘","lat":23.96704,"lng":121.60844,"cat":"culture","desc":"白色建築有圓拱迴廊和高高的椰子樹，裡面是私人收藏的玫瑰石。館方用「琉璃光畫」展示石材，讓人看見石頭透光的樣貌。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5139,"name":"花蓮環保公園","lat":24.01405,"lng":121.64515,"cat":"nature","desc":"海岬上的開闊草地原是一座垃圾掩埋場，覆土後重新種植草木，才成了今天的濱海公園。從突出的岬角往外望，就是遼闊的太平洋。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5140,"name":"花蓮縣石雕博物館","lat":23.98951,"lng":121.62837,"cat":"culture","desc":"草坪上散落著大型石雕，還沒進館就能先看到作品。這裡收藏歷屆國際石雕藝術季留下的創作，也展示國內外藝術家對石材的運用。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5141,"name":"花蓮美術館","lat":23.98954,"lng":121.62943,"cat":"culture","desc":"館舍外觀嵌著黑色建築量體，走進去卻是一片白色中庭。館內展出梳理花蓮美術發展的典藏作品，也提供空間給當代創作者辦展。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5142,"name":"花蓮舊酒廠","lat":23.976073,"lng":121.604659,"cat":"history","tag":"歷史建築","desc":"昔日釀酒用的廠房、日式木屋和一口古井，都留在這片酒廠裡。井水原本專供釀酒，抬頭還能看見部分老廠房用木架撐起的屋頂。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5143,"name":"花蓮觀光酒廠","lat":24.01846,"lng":121.63575,"cat":"other","desc":"這裡既是花蓮製酒的生產基地，也讓人認識釀造工藝。酒廠曾研發食用奈米金技術，除了黃金酒，園區還有精釀啤酒等產品。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5144,"name":"許聰敏故居","lat":23.975604,"lng":121.611534,"cat":"history","tag":"古蹟","desc":"復興街上的這棟街屋建於日治後期，立面已採用簡潔的幾何造型。向外伸出的雨庇在牆上畫出一道水平線，成了外觀最鮮明的細節。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5145,"name":"進豐親子公園","lat":23.98757,"lng":121.60538,"cat":"nature","desc":"這座公園把親子活動安排在圖書館兒童館和漫畫教室旁邊。孩子可以在戶外使用遊具，也能在同一片生活園區裡坐下來閱讀。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5146,"name":"郭子究故居","lat":23.987313,"lng":121.624593,"cat":"history","tag":"歷史建築","desc":"被稱為「花蓮音樂之父」的郭子究曾住在這裡。故居是戰後早期的木造房屋，外牆沿用日式雨淋板，保留了音樂家在花蓮生活的痕跡。","area":"花蓮市・花蓮縣","ph":"文"},{"id":5147,"name":"郭子究音樂文化館","lat":23.98707,"lng":121.62461,"cat":"culture","desc":"花蓮高中的舊教師宿舍，現在用來展示音樂家郭子究的創作和生活。深色木牆與庭園仍在，幾棟日式房舍也保有原來的聚落樣貌。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5148,"name":"靜思堂","lat":23.9945,"lng":121.59137,"cat":"worship","desc":"灰白色建築的三層飛簷從遠處看像一個「人」字。外牆用洗石子做出粗樸的觸感，裡面兼有慈濟舉行集會的禮堂和展覽空間。","area":"花蓮市・花蓮縣","ph":"觀"},{"id":5149,"name":"碧赫潭","lat":23.70648,"lng":121.40174,"cat":"other","desc":"山巒間的蓄水池呈現深綠色，靜下來的水面映著天光與稜線。這裡既是大加汗部落歇腳的地方，也和當地居民的宗教信仰有關。","area":"萬榮鄉・花蓮縣","ph":"觀"},{"id":5150,"name":"花蓮縣萬榮鄉原住民文物館","lat":23.71653,"lng":121.40905,"cat":"culture","desc":"太魯閣族、布農族與賽德克族的文物在這座館舍相遇。除了收藏與展示，館裡也提供技藝學習和藝術展演的空間，和部落生活保持聯繫。","area":"萬榮鄉・花蓮縣","ph":"觀"},{"id":5151,"name":"奚卜蘭遊客中心(新太平洋一號店)","lat":23.46615,"lng":121.48841,"cat":"other","desc":"秀姑巒溪裡的石灰岩經水流沖刷，潔白圓潤，人稱「秀姑漱玉」。遊客中心從這些石頭取材，以白色仿石外牆和鋁格柵遮陽板呼應溪床景色。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5152,"name":"新社梯田","lat":23.65437,"lng":121.53943,"cat":"scenic","desc":"東海岸的稻田一路緊鄰太平洋，田埂隨著地勢分出高低層次。站在這片臨海梯田，可以把風裡的稻浪和田外的海浪一起收進眼底。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5153,"name":"月洞","lat":23.48046,"lng":121.5078,"cat":"scenic","desc":"石梯坪以南有一處天然鐘乳石洞，港口部落將它視為淨地。洞中積水成池，相傳水位隨月亮盈虧而變，因此也有人叫它「月井」。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5154,"name":"石梯坪","lat":23.48525,"lng":121.51173,"cat":"other","desc":"海浪和風在岸邊岩石上刻出不同的形狀，潮間帶也有許多生物。仔細找找岩石間的水域，可以觀察海星、海參、寄居蟹和魚群。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5155,"name":"石梯坪","lat":23.49139,"lng":121.50885,"cat":"scenic","desc":"白色凝灰岩和火山角礫岩構成大片岩盤，海浪長期沖蝕，留下階梯般的岸線。層層隆起的岩面一路伸向海中，是近看東岸地質的地方。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5156,"name":"石梯漁港","lat":23.49419,"lng":121.50613,"cat":"other","desc":"這座漁港早年以鏢旗魚聞名，後來也是臺灣賞鯨產業的發源地。如今防波堤裡同時停著漁船和賞鯨船，仍看得出港口和外海漁場的關係。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5157,"name":"芭崎","lat":23.73125,"lng":121.55867,"cat":"scenic","desc":"東海岸山路的髮夾彎旁有一座瞭望台，景色在轉彎處豁然開朗。眼前從翠綠山林換成一整片太平洋，回望還能看見高聳的海岸山脈。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5158,"name":"長虹橋","lat":23.46767,"lng":121.48885,"cat":"scenic","desc":"拱形橋身橫跨秀姑巒溪出海口，也是溪上泛舟行程靠岸的地方。沿著岸邊步道走，有機會看見水鳥在河床覓食，以及靠近橋邊的泛舟筏。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5159,"name":"高山部落(高山森林基地)","lat":23.68402,"lng":121.54486,"cat":"scenic","desc":"這處布農族聚落依山面海，把從前的農耕梯田用來傳承部落文化。基地內還保留著海岸林，走進林間也能找到遠望太平洋的視野。","area":"豐濱鄉・花蓮縣","ph":"觀"},{"id":5160,"name":"台鐵舊林榮車站倉庫","lat":23.80317,"lng":121.451386,"cat":"history","tag":"歷史建築","desc":"這裡原是東線鐵道的平林停車場，戰後改名林榮車站。鐵路拓寬改線後車站停用，站房雖已拆除，倉庫仍留下當地曾有車站的痕跡。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5161,"name":"平林圳過水橋","lat":23.79301,"lng":121.44923,"cat":"history","tag":"歷史建築","desc":"灌溉用的水圳到了清水溪邊，由六座梯形橋墩撐著越過溪流。沿線原有卵石乾砌的渠道，接上混凝土水橋，將水送到南平與北林的農地。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5162,"name":"廖快菸樓","lat":23.75309,"lng":121.46815,"cat":"other","desc":"鳳林的農家過去用菸樓烘乾菸葉，屋頂向上凸出的氣窗就是辨認它的線索。厚實土牆搭配通風構造，讓農人能調節烘菸的環境。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5163,"name":"支亞干橋（豐平橋）","lat":23.81177,"lng":121.451697,"cat":"history","tag":"歷史建築","desc":"舊公路上的這座混凝土橋用一連串拱圈跨過溪流。仔細看拱圈和橋面之間，還有直立的柱牆支撐，是橋身構造特別的地方。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5164,"name":"林田圳虹吸式圳道","lat":23.76345,"lng":121.4667,"cat":"history","tag":"歷史建築","desc":"日治時期的林田移民村為了耕作而興建水圳，從萬里溪引水到三個聚落的田地。早期渠道是土溝，留下了村民開墾和灌溉的歷史。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5165,"name":"林田山中山堂及康樂新村殘構","lat":23.716888,"lng":121.398138,"cat":"history","tag":"歷史建築","desc":"林田山伐木興盛時，中山堂是林場員工的康樂設施，康樂新村則是員工宿舍。山腰上曾排滿檜木房舍，一場火災使許多老屋只留下遺跡。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5166,"name":"林田山林業文化園區","lat":23.718526,"lng":121.401492,"cat":"culture","desc":"鳳林這座林場從前叫「森坂」，伐木興盛時曾熱鬧得有「小上海」之稱。禁伐後工人陸續離去，留下的伐木基地成了認識花蓮林業的地方。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5167,"name":"林田神社殘蹟","lat":23.748773,"lng":121.465952,"cat":"history","tag":"歷史建築","desc":"田野裡的灰色鳥居和筆直參道，是原來林田移民村神社留下的線索。木造殿宇雖然已經消失，仍能從道路和鳥居的位置辨認神社的格局。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5168,"name":"林田警察官吏派出所及舊林田派出所","lat":23.752546,"lng":121.467728,"cat":"history","tag":"歷史建築","desc":"林田警察官吏派出所的屋頂兼有四面斜坡和兩面斜坡，牆身仍可見日式木構造。另一棟舊林田派出所則以鋼筋混凝土興建。","area":"鳳林鎮・花蓮縣","ph":"文"},{"id":5169,"name":"箭瑛公園","lat":23.73134,"lng":121.49118,"cat":"nature","desc":"依著山丘而建的紀念園裡，兩尊銅像面向花蓮溪谷。園名紀念山興國小教師張箭與鄧玉瑛，兩人當年為到校上課，渡溪時不幸罹難。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5170,"name":"箭瑛大橋","lat":23.7322,"lng":121.48875,"cat":"history","desc":"橫過花蓮溪的兩座白色橋塔形似合十的雙手，白色纜索從塔上向外伸展。這座脊背橋把鳳林市區與對岸的山興里連在一起。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5171,"name":"花手巾植物染工坊","lat":23.74535,"lng":121.44736,"cat":"culture","desc":"棚架上晾著一塊塊彩色染布，工坊名字來自早年客家婦女隨身帶的印花手巾。這裡是社區婦女創作的地方，專門運用植物來染布。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5172,"name":"菸樓圖書館（鳳林鎮立圖書館）","lat":23.74631,"lng":121.45287,"cat":"other","desc":"鳳林鎮立圖書館把在地菸樓的造型放進公共建築，從街上就能辨認。居民借書的地方，也保留了客家聚落曾靠種菸、烘菸維生的記憶。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5173,"name":"蜂之鄉-蜜蜂生態教育館","lat":23.7788,"lng":121.45815,"cat":"culture","desc":"館內從蜜蜂如何替植物授粉談起，也陳列各種蜂產品。透過實物和互動展示，可以把蜜蜂在自然界的工作，和人們日常接觸的蜂產連在一起。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5174,"name":"鳳凰山莊(賽斯村)","lat":23.75669,"lng":121.42556,"cat":"other","desc":"這處山莊位在鳳林溪上游，周邊有青山、溪水，也靠近鳳凰瀑布。除了住宿，這裡還有露營和烤肉的場地，餐飲、活動都在山林間。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5175,"name":"鳳凰山莊(賽斯村)","lat":23.75815,"lng":121.43384,"cat":"scenic","desc":"鳳林溪上游的山莊順著地勢安排建築，把原有的植被留在周圍。這裡早年曾劃入鳳凰瀑布風景區，如今有露營、住宿和活動空間。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5176,"name":"鳳凰瀑布","lat":23.75825,"lng":121.42309,"cat":"scenic","desc":"鳳林溪上游的瀑布順著斜岩壁落進水潭，撞上石塊就濺起白色水花。周圍低海拔溪谷除了保有自然生態，也涵養著鳳林的水源。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5177,"name":"鳳林公路公園","lat":23.76157,"lng":121.45537,"cat":"nature","desc":"入口白色高柱上的鳳凰雕塑，讓人一眼就認出鳳林的地方意象。這片公路旁的綠地供騎車和開車的人歇腳，也展示地方文化。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5178,"name":"鳳林壽天宮","lat":23.74523,"lng":121.44727,"cat":"worship","desc":"鳳林客家庄的居民在這裡祭拜關聖帝君，廟裡也同時容納佛、道、儒三教信仰。廟前寬廣的廣場，是地方舉行節慶祭儀與聚會的地方。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5179,"name":"鳳林客家文物館","lat":23.7475,"lng":121.45149,"cat":"culture","desc":"鳳林公園的樹蔭裡，舊圖書館和老人會館改作了客家文物館。館內保留不少日常生活器具，可以從中看見客家人移居縱谷、開墾生活的樣貌。","area":"鳳林鎮・花蓮縣","ph":"觀"},{"id":5180,"name":"月眉吊橋","lat":24.67009,"lng":120.966,"cat":"other","desc":"早年南庄、三灣與頭份之間的往來，曾倚靠小銅鑼圈的這座吊橋。鋼樑橋面上還鋪過人力車軌道，專門用來將煤炭運過河。","area":"三灣鄉・苗栗縣","ph":"觀"},{"id":5181,"name":"百年埤塘","lat":24.63876,"lng":120.9487,"cat":"history","desc":"三灣位在灌溉水系的尾端，田地供水不穩，早年農民便開鑿埤塘來蓄水。後來永和山水庫興建，這些埤塘也留下地方開墾的痕跡。","area":"三灣鄉・苗栗縣","ph":"觀"},{"id":5182,"name":"三義木雕博物館","lat":24.40592,"lng":120.7612,"cat":"culture","desc":"這座公立博物館專門收藏木雕，展品兼有臺灣與國外藝術家的作品。二館擴建後，除了展示空間，也有木雕教學和圖書資料室。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5183,"name":"勝興火車站","lat":24.388753,"lng":120.781834,"cat":"history","tag":"古蹟","desc":"站房是單層木屋，兩片斜屋頂下的牆體採西式木構造。戰後車站因應工作需要，陸續添了發電機室、倉庫、道班設施和宿舍。","area":"三義鄉・苗栗縣","ph":"文"},{"id":5184,"name":"勝興車站鐵道文化景觀","lat":24.387596,"lng":120.782102,"cat":"history","tag":"文化景觀","desc":"縱貫鐵路在這裡來到全線最高點，最初設的是伯公坑信號場。後來改叫十六份驛，才從調度列車的據點發展成有客運和貨運的車站。","area":"三義鄉・苗栗縣","ph":"文"},{"id":5185,"name":"勝興陶坊(原十六份文化館)","lat":24.38754,"lng":120.782,"cat":"culture","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5186,"name":"卓也小屋手工坊","lat":24.39103,"lng":120.7956,"cat":"culture","desc":"三義客家庄的工坊，把傳統藍染運用在各種日用品上。小至扇子、手帕，大到棉衫、圍巾與手提袋，都能看到藍染的花色。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5187,"name":"大興善寺","lat":24.44796,"lng":120.7597,"cat":"worship","desc":"竹林與樹木環繞的佛寺，是由福慧尼師創建的。尼師修持大悲法門，也曾長期禁語，就連傳授弟子時都是透過書寫交談。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5188,"name":"山板樵文化生活館","lat":24.40206,"lng":120.7945,"cat":"culture","desc":"山林裡的館舍前身是一間木雕工作室，後來發展出臉譜主題。入口一排色彩鮮明的「五路財神」臉譜，就是這裡最容易認出的景物。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5189,"name":"水美木雕街","lat":24.40073,"lng":120.763,"cat":"structure","desc":"中正路兩旁林立著雕刻店，師傅常順著巨木本來的形狀下刀。街上的木雕以樟木為主，也會用到檜木與檀香木，各有不同面貌。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5190,"name":"火炎山森林生態教育館","lat":24.41491,"lng":120.7728,"cat":"culture","desc":"三義市區這棟生態教育館，從外觀到室內都取材自火炎山的自然地景。館內以展示和課程介紹臺灣的地質、地貌與森林生態。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5191,"name":"火炎山生態教育館","lat":24.414898,"lng":120.772899,"cat":"culture","desc":"這座位於三義的教育館以火炎山的天然地貌為主題，建築分為地上三層、地下兩層。從外觀到內部展示，都圍繞著這片地景來設計。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5192,"name":"臺鐵舊山線─內社川鐵橋","lat":24.340728,"lng":120.766604,"cat":"history","tag":"古蹟","desc":"這座舊山線鐵橋由坂本敏一設計，底下的混凝土橋墩做成橢圓形，裡面是空心的。橋上則把華倫式鋼桁架和鋼鈑橋段組合在一起。","area":"三義鄉・苗栗縣","ph":"文"},{"id":5193,"name":"臺鐵舊山線─大安溪鐵橋","lat":24.328711,"lng":120.757005,"cat":"history","tag":"古蹟","desc":"舊山線跨越大安溪的橋身用鋼桁架分散列車通過時的重量。這種上方帶弧線、列車從下方通過的橋形，俗稱「花樑橋」。","area":"三義鄉・苗栗縣","ph":"文"},{"id":5194,"name":"臺鐵舊山線─魚藤坪鐵橋","lat":24.358644,"lng":120.773202,"cat":"history","tag":"古蹟","desc":"渡邊悟設計這座舊山線鐵橋時，特別考慮到地震。橋身分成六節鋼鈑桁，下面配上中空的鋼筋混凝土橋腳，兼顧穩定與耐震。","area":"三義鄉・苗栗縣","ph":"文"},{"id":5195,"name":"舊山線鐵道自行車","lat":24.38823,"lng":120.7821,"cat":"history","desc":"舊山線停駛後，原有的軌道又以鐵道自行車的形式載人穿過三義山城。沿路能看林相和地方景觀，也能近看昔日鐵路工程的痕跡。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5196,"name":"西湖渡假村","lat":24.38964,"lng":120.7617,"cat":"scenic","desc":"歐式花園和林間步道都在這片度假園區裡，另有認識自然的叢林生態教室。維多利亞館陳列地方特產，戶外還設有迷你高爾夫球場。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5197,"name":"雲洞山莊","lat":24.38861,"lng":120.8221,"cat":"scenic","desc":"關刀山上的山莊外觀像座城堡，觀景台正對山巒，能俯看大湖與三義。這裡也用自種自養的食材，做出客家風味的家常菜。","area":"三義鄉・苗栗縣","ph":"觀"},{"id":5198,"name":"魚藤坪斷橋","lat":24.358377,"lng":120.773794,"cat":"history","tag":"古蹟","desc":"舊鐵橋原本把磚石橋腳、連拱和鋼製橋身組在一起。如今細看斷橋的橋腳與拱側，仍能看見磚塊長短交錯、逐層疊砌的紋路。","area":"三義鄉・苗栗縣","ph":"文"},{"id":5199,"name":"公館西河堂林屋下公廳","lat":24.49619,"lng":120.83407,"cat":"worship","tag":"歷史建築","area":"公館鄉・苗栗縣","ph":"文"},{"id":5200,"name":"出磺坑","lat":24.5,"lng":120.84,"cat":"history","tag":"文化景觀","desc":"沿著礦場纜車道兩側，還能看見舊辦公室、醫務所和員工宿舍。出磺坑也留有戰後增建的工廠，從建築分布可以辨認員工生活和工作的地方。","area":"公館鄉・苗栗縣","ph":"文"},{"id":5201,"name":"出磺坑北寮舊辦公室","lat":24.460005,"lng":120.855627,"cat":"history","tag":"歷史建築","desc":"礦場辦公室面向纜車道，中間留了一塊用卵石混凝土鋪成的空地。旗竿基座還在，屋內的格局也保有日治時期的辦公空間樣貌。","area":"公館鄉・苗栗縣","ph":"文"},{"id":5202,"name":"出磺坑舊醫務所","lat":24.459621,"lng":120.855325,"cat":"history","tag":"歷史建築","desc":"礦場的舊醫務所建在連續的磚造地基上，屋邊地面以卵石和混凝土鋪成。從牆腳還能看到紅磚砌出的基礎，以及西側的磚造腰牆。","area":"公館鄉・苗栗縣","ph":"文"},{"id":5203,"name":"出磺坑舊重機具維修庫","lat":24.459685,"lng":120.855804,"cat":"history","tag":"歷史建築","desc":"這棟磚牆庫房在礦場纜車道中繼站，專門維修採油用的重機具。庫裡特地鋪了輕便鐵軌，沉重的機器便能沿軌道移進移出。","area":"公館鄉・苗栗縣","ph":"文"},{"id":5204,"name":"出礦坑礦場","lat":24.46002,"lng":120.856,"cat":"history","desc":"公館開礦村的這座礦場，留下臺灣早期開採石油的歷史。正門附近的出磺坑第一號井遺址，就是日本人在這裡開採的第一口油井。","area":"公館鄉・苗栗縣","ph":"觀"},{"id":5205,"name":"桐遊柿界","lat":24.49152,"lng":120.837,"cat":"other","desc":"園區順著地勢分成上下兩層，上層的主建築有大片玻璃，夕陽可以照進用餐區。下層保留草地、樹木和燈光步道，還放著一架白色鋼琴。","area":"公館鄉・苗栗縣","ph":"觀"},{"id":5206,"name":"苗栗特色館","lat":24.48953,"lng":120.8278,"cat":"culture","desc":"公館的舊陸軍維修廠經過改建，把客家文化和苗栗的窯業帶進園區。除了陶瓷博物館，這裡還看得到四方窯、苗栗窯與木炭窯。","area":"公館鄉・苗栗縣","ph":"觀"},{"id":5207,"name":"卓蘭詹氏繼述堂","lat":24.310842,"lng":120.826577,"cat":"worship","tag":"歷史建築","desc":"詹氏家族這棟建築起初只有前後兩堂和兩側走廊。後來兩旁才增建護樓，入口也添了門樓，成為今日格局的一部分。","area":"卓蘭鎮・苗栗縣","ph":"文"},{"id":5208,"name":"卓蘭軍民（昭忠）廟","lat":24.31105,"lng":120.83439,"cat":"worship","tag":"古蹟","desc":"廟宇和墓塚結合在同一處，是這裡最特別的格局。廟後陳列三十多塊墓碑，各自留有碑文，中央則供奉劉少斌將軍的碑牌。","area":"卓蘭鎮・苗栗縣","ph":"文"},{"id":5209,"name":"峨崙廟","lat":24.31148,"lng":120.8265,"cat":"worship","desc":"清道光年間興建的古廟主祀三山國王，是卓蘭鎮民的信仰中心。廟裡的古鐘也有一段戰時往事，曾在徵收民間金屬時被送往大湖郡。","area":"卓蘭鎮・苗栗縣","ph":"觀"},{"id":5210,"name":"松原農庄","lat":24.29798,"lng":120.8641,"cat":"other","desc":"卓蘭內灣里的農庄以葡萄和楊桃為主，也用自家水果做成加工品。所在地的早晚溫差大，是果實累積甜味的條件之一。","area":"卓蘭鎮・苗栗縣","ph":"觀"},{"id":5211,"name":"林務局大湖工作站卓蘭辦公室","lat":24.312972,"lng":120.824861,"cat":"history","tag":"歷史建築","desc":"這裡原屬臺灣省農林廳的山林管理機構，是大湖分所在卓蘭的辦公廳。後來改稱大湖工作站卓蘭辦公室，留下林業機關沿革的線索。","area":"卓蘭鎮・苗栗縣","ph":"文"},{"id":5212,"name":"罩蘭藝文中心","lat":24.31296,"lng":120.832,"cat":"culture","desc":"卓蘭高中的弘道館裡設有一座藝文中心，表演廳能容納兩百名觀眾。這裡既有在地人的舞台，也辦舞蹈、戲劇、攝影和工藝展演。","area":"卓蘭鎮・苗栗縣","ph":"觀"},{"id":5213,"name":"十三間老街","lat":24.59728,"lng":120.9992,"cat":"structure","desc":"南庄昔日最熱鬧的大街，曾因葛樂禮颱風帶來的洪水而沒落，居民陸續遷走。後來青年返鄉投入，加上地方重新規劃，老街才逐漸恢復生氣。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5214,"name":"南庄南江村福德祠","lat":24.582185,"lng":120.978513,"cat":"worship","tag":"歷史建築","desc":"神桌山步道旁的石頭伯公廟，是南江村茶業興盛時由二十多位茶農合力建起的。廟身用石頭鑿砌，早年的木屋架上鋪著傳統紅瓦。","area":"南庄鄉・苗栗縣","ph":"文"},{"id":5215,"name":"南庄永昌宮廟坪前古井","lat":24.599674,"lng":120.998915,"cat":"worship","tag":"歷史建築","desc":"永昌宮廟前的圓井有六公尺多深，井身用卵石一道道砌起。突出地面的井口如今加了不鏽鋼蓋，周圍的石板則排成方整的地坪。","area":"南庄鄉・苗栗縣","ph":"文"},{"id":5216,"name":"南庄田美永和宮","lat":24.61125,"lng":121.011614,"cat":"worship","tag":"歷史建築","desc":"這座單殿兩廂的宮廟，正面有五開間，左右由廂廊連起。廟身以鋼筋混凝土結合部分木構造，西南側後來還增建了相連的長照中心。","area":"南庄鄉・苗栗縣","ph":"文"},{"id":5217,"name":"南庄老街(桂花巷)","lat":24.59889,"lng":120.9988,"cat":"structure","desc":"永昌宮旁的小巷裡，還能看見日治時期留下的街屋。巷內的桂花釀和各式客家小吃是南庄特產，走出老街，附近還有吊橋和水岸公園。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5218,"name":"南庄遊客中心","lat":24.59799,"lng":120.99999,"cat":"other","desc":"緊鄰南庄老街的遊客中心，建築拿過綠建築標章。設計從植栽綠化、讓基地保住雨水，到平日的能源與水資源利用，都列入了考量。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5219,"name":"南庄郵便局","lat":24.600044,"lng":120.999138,"cat":"history","tag":"歷史建築","area":"南庄鄉・苗栗縣","ph":"文"},{"id":5220,"name":"南庄雲水度假森林","lat":24.5993,"lng":121.0111,"cat":"other","desc":"南庄溪旁的度假園區裡，有一片讓人停下來看樹影的落羽松林。除了林間和四周的山景，園區裡也有泡湯和用餐的空間。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5221,"name":"向天湖","lat":24.58313,"lng":121.0343,"cat":"scenic","desc":"群山圍住湖面，當地人也叫它「仰天湖」，相傳名字來自先人仰望天空的景象。這裡同時是南庄認識賽夏族傳統文化的地方。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5222,"name":"嘎嘎歐岸部落文化園區(八卦力部落)","lat":24.52733,"lng":120.9605,"cat":"culture","desc":"蓬萊村的八卦力部落坐落在八座山之間，賽夏族人稱這裡為「嘎嘎歐岸」。當地將部落風格融入住宿空間，發展成文化園區。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5223,"name":"康濟吊橋","lat":24.59637,"lng":120.9994,"cat":"other","desc":"這座一百五十四公尺長的吊橋，將南庄東村、西村與南江村一帶串聯起來。走到橋中央，迎面是開闊的群山，也感受得到山間吹來的風。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5224,"name":"故新竹廳巡查五十嵐常輝外拾名之碑","lat":24.536498,"lng":121.026849,"cat":"history","tag":"歷史建築","area":"南庄鄉・苗栗縣","ph":"文"},{"id":5225,"name":"東河瓦祿","lat":24.59892,"lng":121.04102,"cat":"other","desc":"南庄東河一帶有多個族群共同生活，向天湖、大竹圍等地是賽夏族部落。鹿場、鹿湖和石壁則有泰雅族聚落，東河也有客家居民。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5226,"name":"獅頭山勸化堂","lat":24.64197,"lng":121.0101,"cat":"worship","desc":"這是獅頭山較早建立的寺廟之一，因祭祀玉皇大帝而有「天堂」之稱。廟裡各處可細看木雕、石雕和浮雕，雕刻間也有色彩豐富的彩繪。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5227,"name":"瓦祿產業文化館","lat":24.59886,"lng":121.0411,"cat":"culture","desc":"東河吊橋附近這棟日式木屋，原是戰後興建的派出所。停用後由地方人士爭取修整，如今裡面展示文化與特色工藝，也提供地方旅遊資訊。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5228,"name":"神仙谷","lat":24.54567,"lng":121.0305,"cat":"scenic","desc":"鹿湖溪、鹿場溪和風美溪在山間匯流，切出陡峭的峽谷與瀑布。下過雨後，霧氣飄在瀑布之間，讓人明白「神仙谷」這個名字的由來。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5229,"name":"賽夏族民俗文物館","lat":24.58342,"lng":121.0338,"cat":"culture","desc":"向天湖畔的館舍為保存賽夏族文物而設，一樓設有典藏室。面向湖水的餐廳以落地窗代替實牆，從屋裡也能看見山色映進湖面。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5230,"name":"鬍鬚梅園文物館","lat":24.60027,"lng":121.0079,"cat":"culture","desc":"相傳畫家張大千到南庄時，曾感嘆在這裡看不到梅花，讓園主下定決心種梅。張大千後來沒能親眼見到花開，南庄卻因此多了一座梅園。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5231,"name":"鹿場","lat":24.5381,"lng":121.0277,"cat":"scenic","desc":"這個山區的泰雅族部落原名「久布斯」，聚落生活和山林、溪流關係密切。早年居住在靠山近水的地方，也方便族人日常取水。","area":"南庄鄉・苗栗縣","ph":"觀"},{"id":5232,"name":"原大湖蠶業改良場建築群","lat":24.423653,"lng":120.869851,"cat":"history","tag":"歷史建築","desc":"大湖發展養蠶產業時留下的建築，包括養蠶室、雙併宿舍和日式木屋。原本使用日式黑瓦的蠶室後來也曾作為招待所，留下不同時期的用途。","area":"大湖鄉・苗栗縣","ph":"文"},{"id":5233,"name":"大湖十份崠茶亭","lat":24.408008,"lng":120.840251,"cat":"history","tag":"古蹟","desc":"這座石造小茶亭只有五坪多，裡頭還保留著石爐灶和石椅。留意屋頂輪廓，屋脊兩端微微翹起，簷口也順著曲線往上揚。","area":"大湖鄉・苗栗縣","ph":"文"},{"id":5234,"name":"大湖竹篙屋吳屋伙房","lat":24.416772,"lng":120.862093,"cat":"history","tag":"歷史建築","desc":"吳家的三合院兼有傳統、日式與西式作法，石板地面之間也用上木枕和紅磚。入口右邊還留著舊門臼，屋頂則鋪了日式和瓦。","area":"大湖鄉・苗栗縣","ph":"文"},{"id":5235,"name":"大湖草莓文化館","lat":24.42892,"lng":120.8681,"cat":"culture","desc":"館內展示草莓的生態，也記錄大湖如何把草莓種成地方產業。上到空中花園，連涼亭與花圃都做成草莓的形狀，能從高處望見周邊景色。","area":"大湖鄉・苗栗縣","ph":"觀"},{"id":5236,"name":"大湖開闢紀念碑","lat":24.419186,"lng":120.864417,"cat":"history","tag":"歷史建築","desc":"法雲寺正殿後方立著一座砂岩碑，基座像三層階梯。長方形碑座的各面分別刻下吳定新、吳定連等人開墾大湖的事蹟。","area":"大湖鄉・苗栗縣","ph":"文"},{"id":5237,"name":"大湖震災記念塔","lat":24.420111,"lng":120.864339,"cat":"history","tag":"歷史建築","desc":"關刀山大地震一週年時，大湖立起這座砂岩紀念塔。碑座的日文記下當年的災情，圓柱碑身上則同時留有民國和昭和紀年的刻字。","area":"大湖鄉・苗栗縣","ph":"文"},{"id":5238,"name":"大窩生態園區","lat":24.40144,"lng":120.8823,"cat":"culture","desc":"大湖鄉的大窩以山林為主，園區裡大部分還保有原始林相。山間的小聚落住著三十多戶人家，多數是務農的客家居民。","area":"大湖鄉・苗栗縣","ph":"觀"},{"id":5239,"name":"羅福星紀念館","lat":24.42626,"lng":120.8687,"cat":"culture","desc":"深藍色屋頂搭著淺黃橙色外牆，從遠處就能認出山腰上的紀念館。建築融入客家圓樓的樣式，紀念曾在日治時期策動抗日的羅福星。","area":"大湖鄉・苗栗縣","ph":"觀"},{"id":5240,"name":"聖衡宮","lat":24.38767,"lng":120.8255,"cat":"worship","desc":"姜麻園的這座宮廟，起初是邱阿德在自己家裡成立的宣化堂，香火漸盛後才改建。宮後的雲洞山上還設有瞭望台，可以登高看山景。","area":"大湖鄉・苗栗縣","ph":"觀"},{"id":5241,"name":"聯合保甲事務所","lat":24.424191,"lng":120.866032,"cat":"history","tag":"歷史建築","desc":"這棟獨立的單層洋式建築以磚牆為主，頂上是四面斜下的屋頂。正面後來增設遮陽板，左右也添建了空間，可以看見使用需求改變的痕跡。","area":"大湖鄉・苗栗縣","ph":"文"},{"id":5242,"name":"半天寮好望角","lat":24.60196,"lng":120.7312,"cat":"scenic","desc":"後龍海邊的山丘抬高了視線，港灣和沿岸浪花都能望得很遠。站在高處既可看潮水進退，黃昏時也能看著夕陽落向海面。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5243,"name":"原台灣省糧食局後龍1號糧倉","lat":24.616603,"lng":120.788374,"cat":"history","tag":"歷史建築","desc":"這間單層糧倉的牆很厚，英式砌法的紅磚外面又覆了一層水泥砂漿。正面有廊道，牆角與立面另加混凝土柱和磚砌扶壁支撐。","area":"後龍鎮・苗栗縣","ph":"文"},{"id":5244,"name":"台灣水牛城","lat":24.58734,"lng":120.7681,"cat":"other","desc":"這座休閒牧場把餐飲、草原和動植物觀察放進同一片園地。園區裡有成蔭的樹木，從入口走向餐廳的路就綿延約一千五百公尺。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5245,"name":"同興老街","lat":24.61053,"lng":120.7636,"cat":"structure","desc":"後龍最早形成的街道，曾是漢人與平埔族人交換土產的集散地。後來溪流淤積，居民開墾溪邊土地，逐漸形成今天後龍市中心的街區。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5246,"name":"外埔漁港","lat":24.64822,"lng":120.7701,"cat":"scenic","desc":"後龍外埔的漁港過去以快艇一支釣聞名，後來經整建成為漁人碼頭。港邊既保有漁業的地方記憶，也曾是苗栗海洋觀光季的活動場地。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5247,"name":"大山火車站","lat":24.645688,"lng":120.8037,"cat":"history","tag":"歷史建築","desc":"單層站房兼有日式和西式建築的特色，立面以簡單的橫直線條分隔。入口與候車室的牆上，可以看到整修時換上的橫疊雨淋板。","area":"後龍鎮・苗栗縣","ph":"文"},{"id":5248,"name":"大山車站","lat":24.64564,"lng":120.8038,"cat":"history","desc":"這座車站啟用時稱為「大山腳驛」，日治時期常用來運送稻米。站外一帶連綿著沙丘，這樣的土地也適合栽種西瓜。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5249,"name":"後龍外埔石滬群","lat":24.66001,"lng":120.779549,"cat":"history","tag":"文化景觀","desc":"外埔海邊的石滬堤上，常能看見石蚵、笠螺和蝦蟹。石縫間還住著海葵，漲潮後伸展出一圈觸手，就像花朵在水裡綻開。","area":"後龍鎮・苗栗縣","ph":"文"},{"id":5250,"name":"後龍過港隧道","lat":24.599745,"lng":120.723299,"cat":"history","tag":"歷史建築","desc":"過港的三座鐵路隧道共有六個洞門，每個洞門形狀都不同。第一號隧道的南口還特別延長，藉此擋住海風吹來的沙，避免鐵軌被掩埋。","area":"後龍鎮・苗栗縣","ph":"文"},{"id":5251,"name":"慈雲宮","lat":24.61454,"lng":120.7869,"cat":"worship","desc":"後龍這座奉祀媽祖的道教廟宇，建廟已有兩百多年。除了地方世代相傳的信仰，廟中也保存了相當完整的歷史文獻。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5252,"name":"清海宮","lat":24.59939,"lng":120.7232,"cat":"worship","desc":"後龍海邊的宮廟有一尊高三十二點二公尺的媽祖像，山海就在神像身後。偶爾有海線列車從旁經過，從遠處看，彷彿媽祖也跟著出巡。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5253,"name":"苗栗客家圓樓","lat":24.60349,"lng":120.8233,"cat":"culture","desc":"北勢溪畔的環形建築仿照福建客家土樓，在苗栗呈現在地客家文化。樓外的環池步道、弧形平台與親水棧道，也把圓樓連到溪岸風景。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5254,"name":"英才書院","lat":24.61387,"lng":120.8303,"cat":"history","desc":"這座仿閩南傳統書院的建築，安排了文昌祠、大成殿和講學堂。院落保留古典書院的空間次序，庭園裡另用池水與小橋營造讀書的氛圍。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5255,"name":"過港貝化石層","lat":24.59976,"lng":120.7251,"cat":"other","desc":"岩層裡留著約一百萬至六百萬年前的海洋生物痕跡。除了雙殼貝和卷貝，還有翼足類與珊瑚化石，這片化石層在日治時期已被指定保存。","area":"後龍鎮・苗栗縣","ph":"觀"},{"id":5256,"name":"二本松解說站","lat":24.398,"lng":120.9859,"cat":"other","desc":"舊駐在所前曾有兩株高大的松樹，「二本松」的名字就來自它們。如今舊址成了解說站，晴天可從平台俯瞰大安溪谷和山裡的部落。","area":"泰安鄉・苗栗縣","ph":"觀"},{"id":5257,"name":"水雲吊橋","lat":24.47144,"lng":120.987,"cat":"other","desc":"汶水溪畔的這座吊橋，是電視劇《我可能不會愛你》的取景地。劇中的李大仁和程又青曾在橋上合照，也讓觀眾記住這段山區風景。","area":"泰安鄉・苗栗縣","ph":"觀"},{"id":5258,"name":"泰安出火部落廣場","lat":24.3888,"lng":120.9322,"cat":"nature","desc":"出火部落和鄰近的司馬限部落都有天然地底瓦斯，長年供應當地生活所需。從煮飯、燒水，到烹煮桂竹筍，都和這項地底資源有關。","area":"泰安鄉・苗栗縣","ph":"觀"},{"id":5259,"name":"清安豆腐街","lat":24.4465,"lng":120.9051,"cat":"structure","desc":"洗水溪與汶水溪交會處的老街呈丁字形，也叫洗水坑老街。雜貨店、麵館之間有不少專做手工豆腐的小店，「豆腐街」的稱呼就從這裡來。","area":"泰安鄉・苗栗縣","ph":"觀"},{"id":5260,"name":"烏嘎彥竹林","lat":24.42092,"lng":120.9196,"cat":"scenic","desc":"泰安的竹林在道路兩旁合成一條翠綠隧道，陽光穿過枝葉，把光影灑在路上。這段景色也曾出現在日本微電影《日本旅人奇遇台灣之旅》裡。","area":"泰安鄉・苗栗縣","ph":"觀"},{"id":5261,"name":"仙山靈洞宮","lat":24.54212,"lng":120.9486,"cat":"worship","desc":"獅潭與南庄交界的山裡，有座供奉關公的宮廟。雲霧常繞著仙山飄過，廟裡則是金碧的色彩和精細的雕樑畫棟。","area":"獅潭鄉・苗栗縣","ph":"觀"},{"id":5262,"name":"汶水老街","lat":24.45632,"lng":120.8764,"cat":"structure","desc":"汶水溪流經鬆軟的頁岩層，洪水過後往往混濁許久。客語用「汶」來形容水濁，老街所在的汶水地名，也和這條溪的模樣有關。","area":"獅潭鄉・苗栗縣","ph":"觀"},{"id":5263,"name":"獅潭新店楊屋","lat":24.525806,"lng":120.922278,"cat":"history","tag":"歷史建築","desc":"這棟街屋民宅建於中部大地震之後，保有農村住宅一屋多用的格局。後院另外安排了牛舍和豬舍，和家人的居住空間同屬一處宅院。","area":"獅潭鄉・苗栗縣","ph":"文"},{"id":5264,"name":"獅潭鄉文化會館","lat":24.5409,"lng":120.9215,"cat":"culture","desc":"舊鄉公所遷走後，原本閒置的辦公空間改成了地方文化會館。獅潭居民因此有了能舉辦藝文活動，也能保存地方文化的場地。","area":"獅潭鄉・苗栗縣","ph":"觀"},{"id":5265,"name":"中港慈裕宮","lat":24.682483,"lng":120.863753,"cat":"worship","tag":"古蹟","desc":"三進院落以兩廊相連，左右各有護龍，整座廟面寬七開間。走到正殿，中央一間比旁邊兩間寬得多，從柱子間距就能看出主次。","area":"竹南鎮・苗栗縣","ph":"文"},{"id":5266,"name":"中港福德宮古井","lat":24.691469,"lng":120.853077,"cat":"worship","tag":"歷史建築","area":"竹南鎮・苗栗縣","ph":"文"},{"id":5267,"name":"原新竹州農業傳習所廳舍","lat":24.713043,"lng":120.872902,"cat":"history","tag":"歷史建築","desc":"農業傳習所的辦公廳舍以磚牆承重，牆上撐著西式木桁架。從外面看，屋面結合了兩面與四面斜下的日式屋頂，並非單一造型。","area":"竹南鎮・苗栗縣","ph":"文"},{"id":5268,"name":"台鐵竹南站2號倉庫","lat":24.670889,"lng":120.880333,"cat":"history","tag":"歷史建築","desc":"竹南車站旁這座倉庫，曾在戰後鐵路貨運興旺的年代儲放貨物。和周圍幾棟同樣用途的鐵路倉庫相比，二號倉庫的構造尤其講究。","area":"竹南鎮・苗栗縣","ph":"文"},{"id":5269,"name":"后厝龍鳳宮","lat":24.69365,"lng":120.8665,"cat":"worship","desc":"竹南居民把中港慈裕宮與后厝龍鳳宮並稱「內外媽祖」，這裡供奉的是外媽祖。廟宇在清道光年間正式創建，主祀天上聖母。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5270,"name":"天仁茶文化館","lat":24.71549,"lng":120.9211,"cat":"culture","desc":"竹南茶文化園區裡的兩層樓館舍，把製茶、茶器和品茶安排在不同展區。從茶葉的歷史看到實際製茶過程，也能認識臺灣出產的茶。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5271,"name":"崎頂一、二號隧道","lat":24.726414,"lng":120.874657,"cat":"history","tag":"歷史建築","desc":"這兩座鐵路隧道採磚造構築，寬闊的洞口原本要容納雙軌。從洞門往上看，入口以當年稱作洋灰磚的水泥磚砌成，造型簡潔而氣派。","area":"竹南鎮・苗栗縣","ph":"文"},{"id":5272,"name":"崎頂隧道","lat":24.72125,"lng":120.8703,"cat":"history","desc":"寬闊的雙軌隧道口曾是早年列車宣傳照的取景地。外側洞門用水泥磚砌成，往裡看則能見到襯在隧道上半部的紅磚圓拱。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5273,"name":"濱海森林公園","lat":24.69473,"lng":120.8531,"cat":"nature","desc":"竹南這段筆直綿長的海岸，木麻黃和棕櫚樹一路成蔭。人們沿海邊散步或騎自行車，傍晚還能看夕陽落向臺灣海峽。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5274,"name":"獅山多功能運動公園","lat":24.67778,"lng":120.8703,"cat":"nature","desc":"這座親子遊戲場把山林和昆蟲變成可以玩的地景。溜滑梯有的取材自火炎山起伏的山丘，有的做成瓢蟲模樣，都設在獅山運動公園裡。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5275,"name":"竹南蛇窯","lat":24.65682,"lng":120.872844,"cat":"history","tag":"歷史建築","desc":"林添福帶著九位製陶師和一頭牛，合力建起這座二十公尺長的窯爐。當年燒的是花盆和日常用陶，如今它也是少數留存的蛇窯之一。","area":"竹南鎮・苗栗縣","ph":"文"},{"id":5276,"name":"竹南龍鳳漁港","lat":24.69975,"lng":120.8583,"cat":"scenic","desc":"這個天然漁港位在冷水溪出海口與龍鳳大排交會處的南岸。附近海床多礁石，底棲魚類豐富，烏魚和白鯧也在當地漁獲之列。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5277,"name":"苗北藝文中心","lat":24.69073,"lng":120.8859,"cat":"culture","desc":"這座藝文中心裡，大型演藝廳以外還有實驗劇場、戶外展演區和藝術家工作室。從音樂、戲劇到舞蹈，苗栗北部的展演活動在這裡匯集。","area":"竹南鎮・苗栗縣","ph":"觀"},{"id":5278,"name":"原苑裡中繼所","lat":24.448131,"lng":120.654709,"cat":"history","tag":"歷史建築","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5279,"name":"台灣藺草學會－農村工藝生活館","lat":24.41671,"lng":120.68659,"cat":"culture","desc":"大安溪沖積平原上的山腳社區，過去一直有編藺草的手藝。居民組成學會培養編織人才，也讓工藝品有地方展示、交流和發展新設計。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5280,"name":"山腳蔡氏濟陽堂","lat":24.416345,"lng":120.686096,"cat":"worship","tag":"古蹟","desc":"這處苑裡山腳蔡家祖厝約建於清嘉慶末年，已有兩百多年歷史。「濟陽堂」是蔡姓的堂號，也成了家族世代相傳的宅名。","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5281,"name":"心雕居","lat":24.44867,"lng":120.6442,"cat":"culture","desc":"苑裡海邊的石板屋，是藝術家陳炯輝生前創作木雕的地方。他曾在這裡闢建山地門雕刻社，以刻刀與木鎚在木材上雕出作品。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5282,"name":"慈和宮","lat":24.44753,"lng":120.6543,"cat":"worship","desc":"苑裡居民早年稱這裡為「城外媽祖」，廟裡主祀天上聖母。它和順天宮同是地方的重要信仰中心，市區發展也帶動了廟宇規模擴大。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5283,"name":"房裡古城","lat":24.43815,"lng":120.6344,"cat":"history","desc":"房裡原是道卡斯族房裡社所在，清代在聚落北邊發展出商業街區。當年製鹽、染布興盛，大街鋪石板，沿街屋前還搭有遮雨棚。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5284,"name":"房裡溪義渡亭","lat":24.435,"lng":120.6467,"cat":"history","desc":"房裡溪過去常因驟雨氾濫，行人渡河不易。清代地方士紳捐資設義渡，用田租支付渡船開銷，碑上至今記著「房裡溪官義渡」的名稱。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5285,"name":"房裡蔡泉盛號","lat":24.435263,"lng":120.647098,"cat":"history","tag":"古蹟","desc":"這棟傳統磚屋融合閩式與客家風格，正廳前的圓柱是一層層弧形紅磚砌成的。細看屋身，還能欣賞斗磚上的雕刻、彩繪和堆花。","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5286,"name":"東里家風-百年古厝","lat":24.44265,"lng":120.668,"cat":"history","desc":"中溝鄭家聚落依山臨溪，中央的紅磚三合院就是東里家風。古厝保有交趾陶裝飾和兩側護龍，院前還有一株和宅子相伴的百年龍柏。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5287,"name":"濱海藝文中心水泥管造景","lat":24.45389,"lng":120.6439,"cat":"culture","desc":"藝文中心旁的稻田邊，兩層水泥管疊在一起，讓人想起《哆啦Ａ夢》裡孩子們的秘密基地。從圓形管口望出去，綠色稻浪就成了背景。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5288,"name":"狗狗水世界","lat":24.41667,"lng":120.6908,"cat":"other","desc":"這座園區特別為狗兒留出大片草地，可以奔跑玩耍。旁邊還有三百坪的專屬戲水泳池，讓狗兒除了在岸上活動，也能下水游泳。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5289,"name":"苑港觀光漁港","lat":24.46007,"lng":120.6489,"cat":"scenic","desc":"這裡早年叫苑裡港，名字來自苑裡溪的出海口。河港夠寬也夠深，商船曾停得桅杆林立，「苑港停舟」因此被列入蓬山八景。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5290,"name":"苑裡公有零售市場","lat":24.44318,"lng":120.652795,"cat":"history","tag":"歷史建築","desc":"市場本館夾在為公路和天下路之間，平面像一個轉了彎的直角。沿天下路的是短邊，另一側長長的館身沿著為公路伸展，東北方另有別館。","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5291,"name":"苑裡圳舊水門","lat":24.361143,"lng":120.715075,"cat":"history","tag":"古蹟","desc":"水門的四座進水隧道用方石砌成拱形，前方格柵可擋住漂來的樹枝。木閘門早年靠手動鑄鐵機具升降，後來才改採油壓控制。","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5292,"name":"苑裡房里順天宮","lat":24.435161,"lng":120.646683,"cat":"worship","tag":"歷史建築","desc":"宮廟前後兩進一路展開，正殿有雙連的山牆，左右還設配殿與護龍。抬頭看屋脊，有細緻的剪黏裝飾，三川殿門面則畫著鮮明彩繪。","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5293,"name":"苑裡掀海風","lat":24.43983,"lng":120.65152,"cat":"culture","desc":"苑裡這間獨立書店由跨領域青年共同經營，讀書之外，也帶人走進地方生活。藺草技藝、傳統市場和郭芝苑的音樂，都是認識苑裡的入口。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5294,"name":"蕉埔邱家水窟","lat":24.409826,"lng":120.677505,"cat":"history","tag":"歷史建築","desc":"河岸上方用來耕作的平台，留有一口以卵石砌成的山坡水塘。四周樹林環繞，水塘順著坡地分布，也能調節水氣並暫時留住洪水。","area":"苑裡鎮・苗栗縣","ph":"文"},{"id":5295,"name":"藺草文化館","lat":24.41431,"lng":120.6858,"cat":"culture","desc":"苑裡婦女早在清初就把柔韌的藺草編成草蓆，後來還發展出輕巧、帶草香的外銷草帽。文化館保存的，就是這段曾支撐許多家庭的編織歷史。","area":"苑裡鎮・苗栗縣","ph":"觀"},{"id":5296,"name":"功維敘隧道","lat":24.55664,"lng":120.8121,"cat":"history","desc":"貓裏山公園旁留著山線鐵路的舊隧道，洞身全長四百六十公尺。北口「功維敘」三個大字出自臺灣總督兒玉源太郎之手，雙軌通車後舊洞才停用。","area":"苗栗市・苗栗縣","ph":"觀"},{"id":5297,"name":"原台灣省糧食局苗栗倉庫","lat":24.564628,"lng":120.823438,"cat":"history","tag":"歷史建築","desc":"糧倉的磚牆撐起西式木屋架，兩面斜屋頂的邊緣還留有鬼瓦殘跡。沿著牆面能細看上下成對的通風口，以及用鑄鐵做的落水管。","area":"苗栗市・苗栗縣","ph":"文"},{"id":5298,"name":"新東大橋","lat":24.54539,"lng":120.8312,"cat":"other","desc":"後龍溪堤防旁能望見大橋夜裡變換的燈色，站在高處也能遠看市區燈影。堤外是沿溪自行車道，橋下另有河濱公園。","area":"苗栗市・苗栗縣","ph":"觀"},{"id":5299,"name":"玉清宮","lat":24.56473,"lng":120.8267,"cat":"worship","desc":"居民習慣到這裡向恩主公請示，婚嫁和喜慶擇日也與宮廟息息相關。廟裡保有問卜的習俗，是苗栗人日常生活裡的一處信仰中心。","area":"苗栗市・苗栗縣","ph":"觀"},{"id":5300,"name":"臺鐵苗栗站5號倉庫","lat":24.56894,"lng":120.82287,"cat":"history","tag":"歷史建築","area":"苗栗市・苗栗縣","ph":"文"},{"id":5301,"name":"苗栗工藝園區","lat":24.53266,"lng":120.8162,"cat":"culture","desc":"原來輔導裝飾陶瓷加工的技術中心，如今成了苗栗的工藝園區。陶藝和其他地方工藝聚在這片舊廠區裡，延續了苗栗製陶的歷史。","area":"苗栗市・苗栗縣","ph":"觀"},{"id":5302,"name":"苗栗市田心謝氏陳留堂","lat":24.568562,"lng":120.82769,"cat":"worship","tag":"歷史建築","desc":"謝家老宅的牆身混用磚、石與土埆，底部則用平整石材砌成。走到正屋和橫屋之間的巷子，還能看到步口搭起的木構架。","area":"苗栗市・苗栗縣","ph":"文"},{"id":5303,"name":"苗栗文昌祠","lat":24.55392,"lng":120.818263,"cat":"worship","tag":"古蹟","desc":"寬闊的廟埕前立著照壁，兩側的山門才是進入祠院的入口。從前殿經過中庭和拜殿到正殿，可以看清這座兩進院落的層次。","area":"苗栗市・苗栗縣","ph":"文"},{"id":5304,"name":"苗栗義塚","lat":24.572993,"lng":120.823553,"cat":"history","tag":"古蹟","desc":"磚牆圍起的義塚地勢北高南低，石造墓碑立在中央。由墓塚向外依序有供祭拜的墓桌和內外墓埕，保留了完整的傳統墓園格局。","area":"苗栗市・苗栗縣","ph":"文"},{"id":5305,"name":"貓裏喵親子公園","lat":24.56295,"lng":120.8372,"cat":"nature","desc":"一隻彩色大章魚盤在遊戲場裡，從章魚洞伸出八道磨石子滑梯，有直有彎。公園裡也能找到苗栗吉祥物「貓裏喵」和牠的家人。","area":"苗栗市・苗栗縣","ph":"觀"},{"id":5306,"name":"賴氏節孝坊","lat":24.555622,"lng":120.810485,"cat":"history","tag":"古蹟","desc":"四根花崗石柱撐起三層牌坊，部分花板則另外用砂岩雕成。上層屋簷下可以看到「聖旨」牌，周圍還有石獅、望柱和欄杆。","area":"苗栗市・苗栗縣","ph":"文"},{"id":5307,"name":"農糧署苗栗辦事處","lat":24.565585,"lng":120.82373,"cat":"history","tag":"歷史建築","desc":"這棟兩層樓的辦公廳舍順著院落排成直角，外觀用洗石子和水平線條分出層次。窗子向內凹進去，保留戰後早期公家機關的建築風格。","area":"苗栗市・苗栗縣","ph":"文"},{"id":5308,"name":"四湖劉恩寬大伙房","lat":24.538793,"lng":120.769475,"cat":"history","tag":"歷史建築","desc":"劉家的傳統閩南大宅，把漳州式屋脊和泉州式屋簷做在同一片屋面上。從屋外看最醒目的是起伏的曲線，部分木構件後來改成了水泥。","area":"西湖鄉・苗栗縣","ph":"文"},{"id":5309,"name":"媽祖石雕","lat":24.5594,"lng":120.7569,"cat":"worship","desc":"五龍宮後方的溪畔立著一尊石雕媽祖，高約二十六點六六公尺。神像由數百塊花崗岩和清斗石組成，沿溪就能看到高高的輪廓。","area":"西湖鄉・苗栗縣","ph":"觀"},{"id":5310,"name":"彭城劉氏宗祠","lat":24.5353,"lng":120.7494,"cat":"worship","desc":"四湖村的劉家宗祠供奉來臺開基的恩寬公和歷代祖先，也配祀觀音與福德正神。宗祠始建於清乾隆年間，就在瑞湖國小前方。","area":"西湖鄉・苗栗縣","ph":"觀"},{"id":5311,"name":"茅仔埔青錢第","lat":24.5308,"lng":120.7627,"cat":"history","desc":"茅仔埔這棟張家老宅始建於清同治年間，之後曾數度改建。這裡也是西湖鄉前鄉長張慶修的老家，地方人以「青錢第」稱呼它。","area":"西湖鄉・苗栗縣","ph":"觀"},{"id":5312,"name":"西湖敬聖亭及福德祠","lat":24.531345,"lng":120.745217,"cat":"worship","tag":"歷史建築","desc":"敬聖亭由砂岩砌成，上下分為三層，外形方整。旁邊的福德祠也是石造小空間，裡頭的福德正神牌位用砂岩刻成，金爐則用磚砌。","area":"西湖鄉・苗栗縣","ph":"文"},{"id":5313,"name":"金龍窯","lat":24.51747,"lng":120.7824,"cat":"other","desc":"這座老窯從日用陶器起家，酒甕、水缸和花器都是常做的物件。李依伍從福州渡海來臺創業後，由第二代兄弟接手，成立了金龍窯。","area":"西湖鄉・苗栗縣","ph":"觀"},{"id":5314,"name":"黃金一路-苗栗伯朗大道","lat":24.55311,"lng":120.7478,"cat":"other","desc":"路牌上寫的是「環鄉小徑」，當地人也叫它「黃金一路」。彎彎的小路穿過一片片稻田，抬眼還能看見低矮的山巒在田野後方連成一線。","area":"西湖鄉・苗栗縣","ph":"觀"},{"id":5315,"name":"大井確士紀念碑","lat":24.568983,"lng":120.712166,"cat":"history","tag":"歷史建築","desc":"紀念碑由基座、碑座和碑身三部分疊成，正面刻著大井確士的軍階與姓名。繞到背面還能看見兩個日期，分別記錄立碑和改碑的時間。","area":"通霄鎮・苗栗縣","ph":"文"},{"id":5316,"name":"愛心公路","lat":24.5386,"lng":120.7067,"cat":"other","desc":"通霄新埔里的山路在高處回望時，兩段彎道恰好勾出愛心形狀。近處可見起伏的山稜，嶺頂的觀景台還看得見西海岸的落日。","area":"通霄鎮・苗栗縣","ph":"觀"},{"id":5317,"name":"新埔火車站","lat":24.540768,"lng":120.695272,"cat":"history","tag":"歷史建築","desc":"這座單層站房把木構架和石牆組在一起，兼有日式與西式建築特色。立面上只用簡單的橫直線條分隔，和頂上的水泥瓦相互映襯。","area":"通霄鎮・苗栗縣","ph":"文"},{"id":5318,"name":"新埔車站","lat":24.54017,"lng":120.6952,"cat":"other","desc":"苗栗海線留有幾座日治時期的木造車站，新埔就是其中之一。老站房和鐵道設施都留著使用痕跡，能看見早年海線小站的模樣。","area":"通霄鎮・苗栗縣","ph":"觀"},{"id":5319,"name":"白沙屯拱天宮","lat":24.57147,"lng":120.7091,"cat":"worship","desc":"白沙屯人早年將軟身媽祖供奉在民宅裡，後來才建廟安奉，親切地叫祂「白沙屯媽」。抬頭看屋頂，多彩剪黏和貼著金箔的外簷格外醒目。","area":"通霄鎮・苗栗縣","ph":"觀"},{"id":5320,"name":"白沙屯海邊","lat":24.57302,"lng":120.708,"cat":"scenic","desc":"通霄西北端的小村落緊鄰海灘，從田邊小路就能望向大海。平日這裡人少，田野和岸邊一起保留著白沙屯漁村安靜的樣子。","area":"通霄鎮・苗栗縣","ph":"觀"},{"id":5321,"name":"荒木藝術中心","lat":24.48029,"lng":120.6735,"cat":"culture","desc":"通霄這間木雕工廠最初叫作東方木雕藝術創作社，後來改名荒木藝苑。它從六〇年代一路走來，見證當地木雕產業興盛的時光。","area":"通霄鎮・苗栗縣","ph":"觀"},{"id":5322,"name":"虎頭山日露戰役記念碑","lat":24.493754,"lng":120.684833,"cat":"history","tag":"歷史建築","desc":"虎頭山頂在日俄戰爭期間曾設有海軍望樓和無線送信所。後來立起的紀念碑，記下當時利用山頂觀察與通信的歷史。","area":"通霄鎮・苗栗縣","ph":"文"},{"id":5323,"name":"通霄鐵道糧倉建築群","lat":24.49138,"lng":120.678458,"cat":"history","tag":"歷史建築","desc":"長方形的鐵道糧倉屋頂向兩側傾斜，短邊山牆上設了窗扇與通氣窗。長邊留有兩處出入口，用一道長廊串起庫房外側。","area":"通霄鎮・苗栗縣","ph":"文"},{"id":5324,"name":"通霄隴西堂秀禮公廳","lat":24.450303,"lng":120.723741,"cat":"worship","tag":"古蹟","area":"通霄鎮・苗栗縣","ph":"文"},{"id":5325,"name":"通霄騰清公祠","lat":24.463418,"lng":120.727354,"cat":"worship","tag":"歷史建築","desc":"李騰清精通醫術，從銅鑼遷到通霄南河後，受到鄉里的敬重。清光緒年間李家因五世同堂獲旌表，住屋後來重建為公祠，並立牌坊紀念。","area":"通霄鎮・苗栗縣","ph":"文"},{"id":5326,"name":"馬家庄","lat":24.49284,"lng":120.7283,"cat":"history","desc":"通霄楓樹里的小村落以傳統四合院為主，留有土角厝和老炭窯。馬家以「扶風堂」為祖祠，堂名也能追溯家族自陝西扶風遷來的歷史。","area":"通霄鎮・苗栗縣","ph":"觀"},{"id":5327,"name":"木頭窯","lat":24.62318,"lng":120.8935,"cat":"culture","desc":"造橋鄉間的陶藝工作室旁，有老樟樹和軟毛柿共生的景象。這裡除了持續創作陶器，也長年推廣陶藝，讓製陶技藝走進地方教育。","area":"造橋鄉・苗栗縣","ph":"觀"},{"id":5328,"name":"舊山線-見返坂隧道群","lat":24.627215,"lng":120.852908,"cat":"history","tag":"古蹟","desc":"見返坂隧道用紅磚砌出五層拱圈，兩端洞口分別題著「穿月」和「噴雲」。同屬舊山線的造橋隧道也呈弧形，兩端洞門卻各有不同輪廓。","area":"造橋鄉・苗栗縣","ph":"文"},{"id":5329,"name":"談文湖鐵道砌石邊坡","lat":24.659795,"lng":120.843727,"cat":"history","tag":"文化景觀","desc":"中港溪出海口沙洲附近，日治時期曾用一塊塊方石斜砌出鐵路邊坡。表面後來覆上混凝土，邊坡本身仍保有當時的構築形制。","area":"造橋鄉・苗栗縣","ph":"文"},{"id":5330,"name":"談文車站","lat":24.656538,"lng":120.85852,"cat":"history","tag":"歷史建築","desc":"這棟日式與西式混合的站房，屋頂由兩道方向相垂直的斜脊組成。從側面看，屋簷略微突出山牆，簷邊還設有收邊的破風板。","area":"造橋鄉・苗栗縣","ph":"文"},{"id":5331,"name":"龍昇湖","lat":24.634,"lng":120.8248,"cat":"scenic","desc":"造橋西側的小湖也叫「大潭埤」，湖邊綠樹間散落著幾戶人家。沿湖看去，還能找到龍湖宮與靈天禪寺，兩座廟都坐落在這片水岸。","area":"造橋鄉・苗栗縣","ph":"觀"},{"id":5332,"name":"臺灣客家文化館","lat":24.46239,"lng":120.7712,"cat":"culture","desc":"園區順著原來的丘陵起伏規劃，把主展館、廣場和戶外步道連在一起。水景與綠地圍繞著建築，沿著步道能慢慢看清整片園地的地勢。","area":"銅鑼鄉・苗栗縣","ph":"觀"},{"id":5333,"name":"舊銅鑼分駐所","lat":24.492632,"lng":120.788381,"cat":"history","tag":"歷史建築","desc":"這排單層清水磚屋，中間是派出所，左右兩側原是警察宿舍。入口的混凝土門廊頂部平坦，邊緣還用古典線腳收出細細的輪廓。","area":"銅鑼鄉・苗栗縣","ph":"文"},{"id":5334,"name":"銅鑼惇敘堂","lat":24.49986,"lng":120.77624,"cat":"worship","tag":"歷史建築","area":"銅鑼鄉・苗栗縣","ph":"文"},{"id":5335,"name":"銅鑼炮仗花海公園","lat":24.48125,"lng":120.7959,"cat":"nature","desc":"長條形綠地裡的炮仗花開成一道花廊，是銅鑼環保公園醒目的景色。沿著步道還有涼亭和觀景台，能從高處眺望後龍溪一帶。","area":"銅鑼鄉・苗栗縣","ph":"觀"},{"id":5336,"name":"銅鑼窯","lat":24.49775,"lng":120.7775,"cat":"other","desc":"竹森村的張家老窯創立於一九六七年，手藝傳了三代。作坊保留手擠坯的做法，師傅用雙手慢慢做出大甕、水缸這些大型陶器。","area":"銅鑼鄉・苗栗縣","ph":"觀"},{"id":5337,"name":"銅鑼窯","lat":24.49779,"lng":120.77492,"cat":"culture","desc":"創辦人張信享十三歲起就跟福州師傅學手擠坯，後來自己在銅鑼設窯。當年做的花盆、醃甕和醬油缸，都是和生活密切相關的陶器。","area":"銅鑼鄉・苗栗縣","ph":"觀"},{"id":5338,"name":"銅鑼茶廠","lat":24.45941,"lng":120.7741,"cat":"culture","desc":"明亮俐落的茶廠坐落銅鑼，延續當地百年的茶產業。台灣農林在這裡採自然農法和有機栽種，也透過種茶這件事推廣環境教育。","area":"銅鑼鄉・苗栗縣","ph":"觀"},{"id":5339,"name":"銅鑼車站","lat":24.486389,"lng":120.769528,"cat":"history","tag":"歷史建築","desc":"這座站房是地震後以鋼筋混凝土重建的。它和造橋、泰安等站在同一時期興建，從中可看見苗栗舊山線車站在震災後重建的歷史。","area":"銅鑼鄉・苗栗縣","ph":"文"},{"id":5340,"name":"關刀山大地震紀念碑群","lat":24.472889,"lng":120.773944,"cat":"history","tag":"歷史建築","desc":"一九三五年的新竹、臺中州大地震，在今天的苗栗縣造成一千三百多人罹難。災後銅鑼、獅潭、大湖等地陸續立碑，記下各地受災的往事。","area":"銅鑼鄉・苗栗縣","ph":"文"},{"id":5341,"name":"中山堂&中正館","lat":24.68631,"lng":120.913,"cat":"culture","desc":"頭份的中山堂整修時特地把舞台加深加寬，讓大型表演團體也能登台。旁邊的中正館則由圖書館改建，一樓留給展覽、社團研習與聚會。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5342,"name":"原台灣省糧食局頭份糧倉","lat":24.6853,"lng":120.905911,"cat":"history","tag":"歷史建築","area":"頭份市・苗栗縣","ph":"文"},{"id":5343,"name":"大化宮","lat":24.68128,"lng":120.9427,"cat":"worship","desc":"廟裡奉祀的三山國王，信仰源自潮州的獨山、明山與中山。清乾隆年間，徐公德來從鎮平原鄉隨身帶著爐香過海，留下這段信仰淵源。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5344,"name":"尚順育樂世界","lat":24.68904,"lng":120.904,"cat":"other","desc":"這是一處把購物和娛樂放在一起的商場，裡面有影城，也有健身和遊戲空間。日用品、服飾與家居店鋪並列，逛街之餘可以接著看電影。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5345,"name":"永和山自行車觀光園道","lat":24.66193,"lng":120.9246,"cat":"scenic","desc":"水庫一帶的自行車園道以沿線自然景色和客家文化為主題。除了路邊的解說牌，還有百歲橋和東興石壁上的題詩石雕可以細看。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5346,"name":"永貞宮","lat":24.67935,"lng":120.8851,"cat":"worship","desc":"頭份田寮的廟前有棵老榕樹，樹蔭遮住一片安靜的廟埕。這座廟由徐英健在清咸豐年間倡建，外觀宏大，仍保有樸實的風格。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5347,"name":"蘆竹湳古厝","lat":24.6769,"lng":120.89,"cat":"history","desc":"老農村裡保留五十多座三合院遺跡，紅磚房舍之間穿插著一條條窄巷。沿著巷子走，有時像走進迷宮，也能近看傳統農家院落的格局。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5348,"name":"頭份後花園","lat":24.68671,"lng":120.9522,"cat":"nature","desc":"老崎的紅土丘陵上，茶園一壟壟鋪展，和楓香、松樹、相思樹林交錯。步道連起這些小片風景，沿途既有樹蔭，也能聽見蟬鳴鳥叫。","area":"頭份市・苗栗縣","ph":"觀"},{"id":5349,"name":"徐府竹仔閣","lat":24.57949,"lng":120.8491,"cat":"history","desc":"徐家老宅在後龍溪龍頸潭南岸，「竹仔閣」的名稱有不只一種說法。一說房子周圍長滿翠竹，另一說則和徐家過去搭建的竹製閣樓有關。","area":"頭屋鄉・苗栗縣","ph":"觀"},{"id":5350,"name":"洛雷托聖母之家","lat":24.57725,"lng":120.8533,"cat":"history","desc":"頭屋這座天主教朝聖場所仿照義大利的洛雷托聖母之家興建。它在民國九十六年落成，讓這項源自義大利的信仰在苗栗有了相應的空間。","area":"頭屋鄉・苗栗縣","ph":"觀"},{"id":5351,"name":"濟世宮","lat":24.56433,"lng":120.8883,"cat":"worship","desc":"扒仔岡原有一座供奉觀音菩薩的同善寺，是這座宮廟的前身。後來地方信眾又在寺裡奉祀關聖帝君、孚佑帝君和司命真君三位恩主。","area":"頭屋鄉・苗栗縣","ph":"觀"},{"id":5352,"name":"象山孔廟","lat":24.57516,"lng":120.8646,"cat":"worship","desc":"日治時期，地方人士在玉衡宮內開辦象山漢學院，也供奉孔子神位。後來士紳倡議改建，這段教授漢學與祭孔的歷史便留在地方信仰裡。","area":"頭屋鄉・苗栗縣","ph":"觀"},{"id":5353,"name":"三連嶼","lat":26.236479,"lng":120.061468,"cat":"scenic","desc":"東引北方外海的三座小島連成一列，岩石長年受到海浪侵蝕。陡峭的島岸上可以辨認海蝕柱、天然拱門，以及岩體一層層的裂理。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5354,"name":"北竿遊客中心","lat":26.216276,"lng":119.974564,"cat":"scenic","desc":"這裡是認識北竿的旅遊服務據點，館內除了地圖和景點資料，還有展示區。從島上的岩石地形，到生態和居民生活的歷史，都能在裡面找到線索。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5355,"name":"北竿鄉五間排","lat":26.234349,"lng":119.993916,"cat":"history","tag":"歷史建築","desc":"橋仔這五戶一字排開的住家，共用木構架和外圍牆體。兩端的房子有三面採光，中間三戶只從前後進光，迎風側屋簷還築起女兒牆。","area":"北竿鄉・連江縣","ph":"文"},{"id":5356,"name":"大坵","lat":26.24712,"lng":120.00114,"cat":"scenic","desc":"北竿北邊的離島上，有草地、低矮灌木和一整片自然海岸。島上的梅花鹿採放養方式生活，鹿群在草地和灌叢之間活動，是這裡的特色。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5357,"name":"戰爭和平紀念公園主題館","lat":26.220593,"lng":120.008542,"cat":"nature","desc":"北竿的紀念公園保留了戰地年代的坑道和地下堡壘，主題館則展示戰備文物。從這些遺跡和實物，可以認識當時軍民在島上生活的背景。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5358,"name":"橋仔聚落","lat":26.234914,"lng":119.993763,"cat":"scenic","desc":"靠海的北竿村落順著山勢而建，一層層花崗岩石屋之間穿過狹窄巷弄。沿著老屋與石牆散步，可以認出早期居民順應海島地形的居住方式。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5359,"name":"白沙港","lat":26.20531,"lng":119.96881,"cat":"scenic","desc":"北竿這座港口三面有山圍著，形成天然避風的港灣。港內連著南竿、莒光與東引等島嶼的航線，是北竿居民與外島往來的重要地方。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5360,"name":"碧園","lat":26.220779,"lng":119.990129,"cat":"scenic","desc":"北竿島中部有一座結合紀念與休憩的園地，石碑立在整齊的草地間。步道沿著綠地展開，視野開闊，可以在這裡停下來看看島上風景。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5361,"name":"芹壁天后宮","lat":26.22415,"lng":119.982449,"cat":"worship","tag":"古蹟","desc":"花崗石砌成的閩東式廟宇，正殿是天后宮，旁邊的偏殿是大王宮。面對正門時，左側還有一間碧蛙館，各自占一個開間。","area":"北竿鄉・連江縣","ph":"文"},{"id":5362,"name":"芹壁社區發展協會","lat":26.22395,"lng":119.98186,"cat":"history","desc":"芹壁的房舍承襲福建閩東的建築做法，用厚重的花崗岩砌牆。聚落裡的五脊四坡屋頂和封火山牆，仍留著馬祖居民從原鄉帶來的營造習慣。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5363,"name":"芹壁聚落","lat":26.224782,"lng":119.983668,"cat":"scenic","desc":"北竿山坡上的花崗岩石屋層層面海而建，陡峭的階梯把不同高度的人家連在一起。從屋頂之間望出去，就是讓芹壁有「馬祖地中海」稱呼的藍色海灣。","area":"北竿鄉・連江縣","ph":"觀"},{"id":5364,"name":"龜島","lat":26.22684,"lng":119.98312,"cat":"scenic","area":"北竿鄉・連江縣","ph":"觀"},{"id":5365,"name":"仁愛村(鐵板)","lat":26.145062,"lng":119.926349,"cat":"scenic","desc":"南竿的仁愛村又叫「鐵板」，聚落緊鄰鐵板灣。村子裡商店、餐飲和住宿集中，從日常採買到旅人歇腳，都和這座海灣的生活圈相連。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5366,"name":"八八坑道","lat":26.160305,"lng":119.953247,"cat":"scenic","desc":"原為戰備開鑿的地下坑道，後來成了馬祖酒廠貯酒的地方。坑裡的溫度和濕度穩定，讓老酒與陳高能在地底慢慢熟成。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5367,"name":"勝利山莊","lat":26.153306,"lng":119.934706,"cat":"scenic","desc":"復興村山腰的招待所是過去接待軍官的地方，四周環著樹林和海岸。簡潔結實的房舍保留部分早年構造，還能看出軍旅時期的建築樣式。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5368,"name":"勝天公園","lat":26.152622,"lng":119.916943,"cat":"nature","desc":"南竿這片公園順著山坡安排步道、綠地和紀念設施。走到觀景平台，能從高處俯看聚落和海岸，園內的紀念碑則留下島上的歷史記憶。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5369,"name":"南竿北海坑道","lat":26.142495,"lng":119.928954,"cat":"scenic","desc":"鐵板灣旁的花崗岩山壁裡，藏著一條蜿蜒的地下水道。這座戰地時期的坑道由人工鑿成，原先是讓往來運送物資的小艇停泊的地方。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5370,"name":"南竿遊客中心","lat":26.158879,"lng":119.949734,"cat":"scenic","desc":"這裡是馬祖國家風景區管理處的所在地，除了辦公和旅遊諮詢，也有展示空間。展覽從島嶼地質、生態一路談到聚落，串起馬祖的自然與人文。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5371,"name":"印地安人頭岩","lat":26.140465,"lng":119.930056,"cat":"scenic","desc":"福澳港附近的花崗岩受海浪和風化雕琢，從側面看竟像一張人臉。額頭、鼻樑與下巴的線條都能辨認，成了這塊海岸奇岩的名字由來。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5372,"name":"四維村","lat":26.170453,"lng":119.920565,"cat":"scenic","desc":"南竿的這座山海聚落曾是重要駐地，居民生活也留下軍旅年代的痕跡。聚落周圍的林地、步道與海岸相連，散步時景色在山海之間變換。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5373,"name":"大漢據點","lat":26.140628,"lng":119.926491,"cat":"scenic","desc":"南竿山區的堅硬岩體裡，鑿出一處面向外海的舊海防據點。坑道內還有昔日人員居住和工作的空間，留下駐軍長期在地下生活的痕跡。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5374,"name":"大砲連","lat":26.145698,"lng":119.940795,"cat":"scenic","desc":"這處舊砲兵陣地順著南竿山區的岩層開鑿，部分坑道和砲座仍保存著。山岩裡人工開出的空間，留下島嶼戰地年代的工程痕跡。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5375,"name":"媽祖巨神像","lat":26.16087,"lng":119.916875,"cat":"worship","desc":"南竿的媽祖像以花崗岩雕成，高高立在園區裡，象徵海島居民祈求平安的信仰。周圍有步道和觀景平台，可以從不同位置看神像與海岸。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5376,"name":"枕戈待旦紀念公園","lat":26.155882,"lng":119.940146,"cat":"nature","desc":"南竿高地上立著「枕戈待旦」四個大字，記下早年駐軍長期戒備的生活。如今四周成了紀念公園，從高處也能望見馬港一帶。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5377,"name":"津沙境天后宮","lat":26.145824,"lng":119.913638,"cat":"worship","desc":"小小的宮廟面向海灣，背後就是津沙漁村的石屋。居民在這裡奉祀天上聖母，閩東聚落的老房子與廟宇挨在一起，留著漁村生活的樣子。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5378,"name":"津沙聚落","lat":26.146118,"lng":119.913211,"cat":"scenic","desc":"南竿南側海灣裡，花崗岩古厝依著山勢一路排到沙灘附近。彎曲的窄巷穿過閩東石屋，屋牆、坡地和金色沙岸緊緊相鄰。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5379,"name":"牛角聚落","lat":26.163374,"lng":119.952381,"cat":"scenic","desc":"這座古老漁村依山面海，成排的閩東石厝順著南竿的山坡高低排列。走進舊巷，還能見到石板階梯與傳統石屋連在一起的格局。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5380,"name":"白馬文武大王廟","lat":26.162073,"lng":119.917884,"cat":"worship","desc":"復興村居民在這座廟裡奉祀文武大王，祈求海上平安與風調雨順。廟宇外觀樸實，保有閩東的建築特色，也是附近居民的信仰中心。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5381,"name":"秋桂亭","lat":26.167728,"lng":119.92538,"cat":"scenic","desc":"介壽村山坡的樹林裡，有一座傳統樣式的觀景亭。亭旁視野開闊，可以俯瞰南竿聚落與海岸，也能望見軍旅年代留下的設施。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5382,"name":"蔬菜公園","lat":26.156776,"lng":119.952039,"cat":"nature","desc":"南竿復興村這片綠地，以前是供軍方使用的菜園。如今菜園變成散步的公園，周圍山林環抱，從園裡還能俯看海岸與聚落。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5383,"name":"藍眼淚生態館","lat":26.167831,"lng":119.919182,"cat":"culture","desc":"馬祖海面夜裡有時會泛起藍光，館內用燈光、多媒體和模擬環境重現這種景象。展覽也介紹「藍眼淚」形成的原因，以及它與季節的關係。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5384,"name":"連江縣政府舊址","lat":26.143208,"lng":119.925615,"cat":"history","tag":"歷史建築","desc":"仁愛村這棟建築，原是國軍進駐馬祖初期因應行政需求所建的縣政府。如今馬祖日報社在這裡辦公，屋內也設了馬祖故事館。","area":"南竿鄉・連江縣","ph":"文"},{"id":5385,"name":"金板境天后宮","lat":26.141991,"lng":119.92418,"cat":"worship","tag":"歷史建築","desc":"廟裡供奉天上聖母媽祖，是南竿居民祈求海上平安的地方。宮廟外觀樸雅，延續閩東傳統建築的樣式，與周圍依山而建的聚落相連。","area":"南竿鄉・連江縣","ph":"文"},{"id":5386,"name":"鐵堡","lat":26.142006,"lng":119.920898,"cat":"scenic","desc":"突出海面的巨岩上有座四面臨海的舊堡壘，從岸上就能看出它特殊的地勢。鋼筋水泥和花崗岩構成堡身，留下南竿昔日海防的印記。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5387,"name":"馬祖境天后宮","lat":26.158251,"lng":119.918152,"cat":"worship","desc":"馬港居民長年在這座天后宮祭拜媽祖，它也是馬祖重要的信仰中心。廟宇把閩東傳統匠藝和海島生活結合，保有島民祭祀海神的歷史。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5388,"name":"馬祖戰地文化景觀","lat":26.157869,"lng":119.951915,"cat":"history","tag":"文化景觀","desc":"馬祖在一九五六年進入戰地政務時期，島上居民的生活長年與駐軍相伴。散布各地的防禦工事、運補設施和標語，留下那段軍政合一的歷史。","area":"南竿鄉・連江縣","ph":"文"},{"id":5389,"name":"馬祖民俗文物館","lat":26.15028,"lng":119.935577,"cat":"culture","desc":"介壽村的文物館收藏老漁具、傳統服飾和民間信仰用具，也有軍用品。透過聚落模型和生活器物，可以看到馬祖從漁村到戰地的不同面貌。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5390,"name":"馬祖酒廠","lat":26.160977,"lng":119.951769,"cat":"scenic","desc":"復興村的酒廠以老酒和陳高出名，園區裡展示製酒技藝和酒廠的歷史。這些酒也常出現在馬祖的傳統禮俗裡，和島民的日常生活分不開。","area":"南竿鄉・連江縣","ph":"觀"},{"id":5391,"name":"一線天","lat":26.36623,"lng":120.50544,"cat":"scenic","desc":"海浪順著岩石的垂直裂理侵蝕，切出一道狹長的深溝。兩旁數十公尺高的岩壁幾乎合攏，抬頭只剩一線天光，名字便是這麼來的。","area":"東引鄉・連江縣","ph":"觀"},{"id":5392,"name":"中柱島","lat":26.370196,"lng":120.483993,"cat":"scenic","desc":"跨海堤道把這座平坦的小島和東引本島連在一起，島上三面環海。站在開闊處能望見東引海岸線，也看得到船隻進出中柱港。","area":"東引鄉・連江縣","ph":"觀"},{"id":5393,"name":"中柱港","lat":26.363954,"lng":120.484367,"cat":"scenic","desc":"東引這座港灣三面被山圍住，一側向海，地形替船隻擋下部分季風和海浪。戰地年代它是物資補給的基地，也是島上和外界往來的門戶。","area":"東引鄉・連江縣","ph":"觀"},{"id":5394,"name":"后澳","lat":26.381202,"lng":120.477583,"cat":"scenic","desc":"漁村依著彎曲海灣而建，清晨能看見漁船返回沙灘附近。潮水退去後，平常隱在浪下的海蝕平台和礁岩，就成了岸邊最顯眼的景色。","area":"東引鄉・連江縣","ph":"觀"},{"id":5395,"name":"和尚看經","lat":26.365682,"lng":120.486902,"cat":"scenic","desc":"東引海邊的岩石經過長年海蝕和風化，留下像人一般的輪廓。換個角度遠望，岸上的巨石像一位面向海面、低頭端坐讀經的和尚。","area":"東引鄉・連江縣","ph":"觀"},{"id":5396,"name":"國之北疆","lat":26.382792,"lng":120.476079,"cat":"scenic","desc":"刻著「國之北疆」四個大字的石碑，是東引象徵北方國境的地標。碑前視線開闊，可以沿著湛藍的海面一直望向北方海域。","area":"東引鄉・連江縣","ph":"觀"},{"id":5397,"name":"太白天聲","lat":26.36561,"lng":120.509745,"cat":"scenic","desc":"海浪拍向東引岸邊的海蝕洞時，海水擠壓洞裡的空氣，發出低沉的共鳴。聲音在狹窄空間裡迴盪，聽起來像遠處的雷聲。","area":"東引鄉・連江縣","ph":"觀"},{"id":5398,"name":"安東坑道","lat":26.365006,"lng":120.496303,"cat":"scenic","desc":"東引昔日為戰備開鑿的坑道，順著山體在地底曲折延伸。內部的堅硬岩壁仍可見人工鑿痕，記錄當年在岩層裡施工的痕跡。","area":"東引鄉・連江縣","ph":"觀"},{"id":5399,"name":"忠誠門","lat":26.366981,"lng":120.486731,"cat":"scenic","desc":"東引路旁的石造拱門，曾標示戰地管制時期的出入口。門額寫著「忠誠」二字，樸實堅固的樣式也留下駐軍年代的印記。","area":"東引鄉・連江縣","ph":"觀"},{"id":5400,"name":"感恩亭","lat":26.3703,"lng":120.484065,"cat":"scenic","desc":"四維村高處的小涼亭順著坡地而建，從亭邊能俯看南竿聚落、海岸和山巒。「感恩」二字，也寄託了對馬祖土地與軍民共同生活往事的感懷。","area":"東引鄉・連江縣","ph":"觀"},{"id":5401,"name":"東引中路客廳","lat":26.36726,"lng":120.48754,"cat":"culture","desc":"忠誠門裡的長階梯叫作「中路」，早年是東引最熱鬧的街區。商家沿階而開，漁民也在魚寮歇腳，後來人口外移，地方才又投入心力活化老街。","area":"東引鄉・連江縣","ph":"觀"},{"id":5402,"name":"東引遊客中心","lat":26.360019,"lng":120.484238,"cat":"scenic","desc":"館裡展出東引的地質、生態，也整理了駐軍與居民共同生活的歷史。除了看看展覽，這裡還有地圖和景點介紹，可以對照島上的地貌。","area":"東引鄉・連江縣","ph":"觀"},{"id":5403,"name":"東引鄉劉依祥宅","lat":26.367201,"lng":120.487231,"cat":"history","tag":"歷史建築","desc":"樂華村的兩層老宅用花崗岩、紅磚和福州杉木建成，正面門窗都帶圓拱。側牆上還留有魚形出水口，馬祖人稱這種裝飾為「雨漏」。","area":"東引鄉・連江縣","ph":"文"},{"id":5404,"name":"東海雄風","lat":26.368393,"lng":120.487394,"cat":"scenic","desc":"東引東側的臨海高地正迎海風，站在平台便能看見海天相接。低頭是海浪拍擊岩岸的景象，強勁的風也是這片高地的特色。","area":"東引鄉・連江縣","ph":"觀"},{"id":5405,"name":"東湧燈塔","lat":26.365891,"lng":120.510739,"cat":"history","tag":"古蹟","desc":"世尾山的海崖上矗立著一座白色圓頂燈塔，從清光緒年間便開始為船隻引路。從東海往來臺灣海峽的船隻，曾以它為海上的指引。","area":"東引鄉・連江縣","ph":"文"},{"id":5406,"name":"海現龍闕","lat":26.369932,"lng":120.488712,"cat":"scenic","desc":"東引海邊的巨岩被海浪切出一道拱門，潮水會從岩洞中穿過。遠望岩塊輪廓，像一條龍昂著頭、身體伏在地上，名字就從這裡來。","area":"東引鄉・連江縣","ph":"觀"},{"id":5407,"name":"烈女義坑","lat":26.368334,"lng":120.507319,"cat":"scenic","desc":"海浪與風化順著岩層的垂直裂理，切出深深的峽縫。兩旁峭壁近乎筆直，這裡的名字則來自當地流傳的烈女故事。","area":"東引鄉・連江縣","ph":"觀"},{"id":5408,"name":"燕秀潮音","lat":26.357997,"lng":120.489007,"cat":"scenic","desc":"海浪擠進東引岸邊狹窄的洞穴時，水聲會在岩壁間來回迴盪。這種低沉的潮音有如海面正在呼吸，也成了當地人描述這片岸邊的方式。","area":"東引鄉・連江縣","ph":"觀"},{"id":5409,"name":"羅漢坪","lat":26.382987,"lng":120.474402,"cat":"scenic","desc":"臨海岩壁的輪廓像一排端坐的羅漢，這片斷崖因而得名。從高處可以望見層層展開的海蝕平台，以及岩岸外開闊的海面。","area":"東引鄉・連江縣","ph":"觀"},{"id":5410,"name":"靜伏鱷魚","lat":26.375599,"lng":120.477945,"cat":"scenic","desc":"西引外海一帶的岩石受海浪侵蝕，從特定角度看去，輪廓像一隻趴著的大鱷魚。岩身貼著海面，這片海岸也因此有了生動的名字。","area":"東引鄉・連江縣","ph":"觀"},{"id":5411,"name":"馬祖酒廠東引展售中心","lat":26.36417,"lng":120.49057,"cat":"scenic","desc":"展售中心以馬祖酒廠的高粱酒為主，也有東引限定的酒品和禮盒。從不同酒款的陳列，可以認識馬祖以高粱釀酒的地方特色。","area":"東引鄉・連江縣","ph":"觀"},{"id":5412,"name":"中流嶼","lat":25.97003,"lng":119.97983,"cat":"scenic","desc":"東莒南方海上獨立著一座小岩礁，四周都是拍上岸的海浪。島體因海蝕而露出清楚的花崗岩紋理，從水面突起的形狀也格外顯眼。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5413,"name":"后澳村","lat":26.22498,"lng":120.00997,"cat":"scenic","desc":"海邊的傳統漁村裡，石屋沿著坡地高低排列，窄巷串起一面面石牆。除了漁港和老聚落，附近還看得到海蝕地形與歷史遺構。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5414,"name":"大埔石刻","lat":25.950198,"lng":119.962957,"cat":"history","tag":"古蹟","desc":"東莒臨海的岩壁上刻著明代碑文，記下沈有容抗倭立功的事蹟。這段文字就保留在原來的海岸地形上，是認識馬祖早期歷史的線索。","area":"莒光鄉・連江縣","ph":"文"},{"id":5415,"name":"大浦聚落","lat":25.954996,"lng":119.973552,"cat":"scenic","desc":"漁業和海上往來曾是村民生活的重心，一棟棟閩東石厝便順著海灣旁的山坡而建。老房子之間的巷弄蜿蜒相連，最後通向海邊。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5416,"name":"東犬燈塔","lat":25.96776,"lng":119.985712,"cat":"history","tag":"古蹟","desc":"清末興建的這座西式燈塔，是用一塊塊花崗石砌成的。停燈期間較少受到後來的改動，因此留下早期文物，可看出當時燈塔的形式。","area":"莒光鄉・連江縣","ph":"文"},{"id":5417,"name":"東犬燈塔(東莒島燈塔)","lat":25.963984,"lng":119.990603,"cat":"scenic","desc":"東莒北端的山崖上，白色圓形塔身正對著開闊海域。這座清光緒年間興建的燈塔，長久以來在島嶼和外海之間為船隻指引方向。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5418,"name":"林坳嶼","lat":25.946432,"lng":119.963382,"cat":"scenic","desc":"東莒外海這座花崗岩小島長年與本島分隔，是馬祖列島的極南點。從岸上遠望，能認出海浪與風化塑出的離岸岩體輪廓。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5419,"name":"樂道澳","lat":25.980366,"lng":119.933152,"cat":"scenic","desc":"西莒北方的山谷向海敞開，泥沙在谷口淤積，形成當地人曾稱為「嘮叨澳」的澳口。從環島北路高處，還能俯瞰如今的水庫全貌。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5420,"name":"熾坪隴考古遺址","lat":25.957775,"lng":119.976546,"cat":"scenic","desc":"東莒西側海邊的遺址，出土過石器、陶片和早期生活用具。這些遺物留下了史前人類在馬祖活動的痕跡，也讓人認識島嶼更早的生活。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5421,"name":"田沃村五靈公廟","lat":25.976589,"lng":119.939882,"cat":"worship","tag":"歷史建築","desc":"這座兩層樓的廟宇圍著狹小天井，格局緊湊，俗稱「一顆印」。側面特地開了大窗引進光線，牆上還能找到用彩色磁磚拼出的圖樣。","area":"莒光鄉・連江縣","ph":"文"},{"id":5422,"name":"神祕小海灣","lat":25.95668,"lng":119.98237,"cat":"scenic","desc":"福正和大浦兩個聚落之間，有一處面向外海的小澳口。從高處能望見遼闊海面，在藍眼淚出現的季節，這裡也是觀察夜間海光的地點。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5423,"name":"福正聚落","lat":25.966261,"lng":119.982157,"cat":"scenic","desc":"東莒的老漁村依山面海，房子多用當地花崗岩砌成。走進小巷，仍可見閩東石屋南北排列的格局，看出居民如何順著山海建起家園。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5424,"name":"莒光遊客中心","lat":25.965087,"lng":119.981083,"cat":"scenic","desc":"館內設有解說區，從莒光的地形和自然環境，介紹到聚落裡的生活和戰地文化。除了展覽，這裡也整理了當地景點的地圖和導覽資料。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5425,"name":"菜浦澳","lat":25.982145,"lng":119.944116,"cat":"scenic","desc":"田沃村海岸的花崗岩上，能看見一道道清楚的裂理。海浪長年沿岩盤侵蝕，留下峭壁和礁岩，這處澳口也曾是西莒夏季出入的港口。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5426,"name":"西牛嶼","lat":25.973207,"lng":119.975452,"cat":"scenic","desc":"東莒外海的孤立小島，四周被海浪長年沖刷。花崗岩因此留下平坦的岩面和突出的崖線，從輪廓就看得出海水在岩上留下的痕跡。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5427,"name":"青帆港","lat":25.969247,"lng":119.933685,"cat":"scenic","desc":"西莒主要的港口三面環山，山勢替港灣遮蔽風浪，水面比外海平穩。船隻和貨物在這裡往來，附近也因此成了居民日常生活與商業的重心。","area":"莒光鄉・連江縣","ph":"觀"},{"id":5428,"name":"L18據點","lat":24.4208,"lng":118.22005,"cat":"other","desc":"這處烈嶼舊據點由駐軍興建，造型參考了當年的軍事建築。它還有個少見的靈感來源，是動畫《科學小飛俠》裡的鳳凰號。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5429,"name":"上林林信屏洋樓","lat":24.427002,"lng":118.230154,"cat":"history","tag":"古蹟","desc":"兩層樓的洋樓前方接著閩南傳統房舍，屋頂有四面斜坡。臨院的正面分成三開間，兩旁牆上還能找到色彩鮮明的馬約利卡磁磚。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5430,"name":"九宮坑道","lat":24.42363,"lng":118.26269,"cat":"worship","desc":"烈嶼這條坑道和大金門的翟山坑道一樣，都在戰時為物資運補而建。坑道主體開鑿在堅硬的花崗岩裡，留下島上工程的痕跡。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5431,"name":"八二三砲戰勝利紀念碑","lat":24.42702,"lng":118.25887,"cat":"history","desc":"湖下村入口的圓形基座上，豎著一枚綠白相間的巨大砲彈。彈身刻有金色文字，以鮮明的造型紀念八二三砲戰期間的前線軍民。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5432,"name":"八達樓子","lat":24.42998,"lng":118.24573,"cat":"history","desc":"烈嶼圓環中央的紀念建築做成城堡形狀，樓頂有七尊士兵雕像，分別朝向四周。這組雕像是為了紀念一九三三年抗日戰事中的戰士。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5433,"name":"前埔保障宮","lat":24.42823,"lng":118.23455,"cat":"worship","tag":"歷史建築","desc":"這座小廟只有一進，屋頂是雙斜坡，兩側山牆呈八字形。正面的「保障宮」匾旁還能看到卷軸式彩繪，畫的是花開富貴與竹報平安。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5434,"name":"勇士堡","lat":24.44792,"lng":118.25151,"cat":"history","tag":"歷史建築","desc":"舊堡入口的小橋兩旁，各有一座城堡造型的哨所。圓拱門面上留著「勇士堡」三字，沿路牆上的軍事標語也是當年駐軍生活的痕跡。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5435,"name":"勝利門","lat":24.42699,"lng":118.25866,"cat":"history","desc":"小金門湖下村路口有座醒目的白色圓拱門，遠遠就能辨認。這塊地原先立著砲彈造型的八二三抗戰紀念碑，留下地方紀念戰事的故事。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5436,"name":"北風爺、風雞","lat":24.43676,"lng":118.23978,"cat":"history","desc":"小金門有兩種鎮風避邪的民間信仰，一是北風爺，一是風雞。兩者的來歷與形象各不相同，卻都和島上居民面對風害、祈求平安的生活有關。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5437,"name":"后麟步槍模擬射擊館","lat":24.43905,"lng":118.25866,"cat":"culture","desc":"后頭村的場館原是軍方後勤補給營區，後來也有醫療站進駐。園內保留下來的庫房和牆面標誌，還能辨認保修、運輸與醫勤等工作。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5438,"name":"國姓井","lat":24.43845,"lng":118.23514,"cat":"history","desc":"下田村的古井有一則鄭成功的傳說。相傳他帶兵登陸小金門時苦無飲水，便指地要士兵挖井，果然湧出清泉，村民因此稱它為國姓井。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5439,"name":"地雷主題館","lat":24.44666,"lng":118.25188,"cat":"culture","desc":"小金門的鐵漢堡和勇士堡曾是戰時堡壘，戰事平息後陸續開放。部分軍事空間改作主題館，讓人能在舊堡裡認識這段戰地歷史。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5440,"name":"大膽二膽（大擔小擔）戰地文化景觀","lat":24.38946,"lng":118.16331,"cat":"history","tag":"文化景觀","desc":"大膽與二膽原名「大擔」和「小擔」，位在烈嶼西南方，早年就與廈門港往來的歷史有關。島上還留有文人和武將題字的石刻。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5441,"name":"大膽島","lat":24.38573,"lng":118.16918,"cat":"history","desc":"這座面積不大、地勢平緩的小島，和廈門相距只有四千四百公尺。兩岸軍事對峙時，大膽島曾是前線，後來經整建才讓人得以看見島上的往事。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5442,"name":"將軍堡","lat":24.44092,"lng":118.26646,"cat":"history","tag":"歷史建築","desc":"八二三砲戰期間，蔣經國曾在王昇、柯遠芬護送下乘船到前線，和當地將領商議戰況。這座堡壘的名稱，寄託了對當年守軍的紀念。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5443,"name":"方宅","lat":24.43578,"lng":118.23808,"cat":"history","tag":"歷史建築","desc":"方氏族人到新加坡發展後，把錢寄回金門興建這棟家宅，後來又增建樓房。戰地政務時期，家裡還挖過防空洞，留下另一段生活痕跡。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5444,"name":"李將軍廟(上林將軍廟)","lat":24.42914,"lng":118.22843,"cat":"worship","desc":"上林村這座廟建於明朝中葉，離西湖與陵水湖都不遠。村民在此奉祀李府將軍，也祭拜場官爺和擋境爺，保留在地信仰的特色。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5445,"name":"東坑孫嘉通洋樓","lat":24.44279,"lng":118.23155,"cat":"history","tag":"歷史建築","desc":"洋樓前方的女兒牆用煙炙磚砌成，下方牆腳則用了烈嶼常見的蚵堵石。石塊在人字形牆面交錯排列，這種做法也叫「魚鱗砌」。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5446,"name":"東林海濱公園","lat":24.42508,"lng":118.25177,"cat":"nature","desc":"東林聚落東南側的金色沙灘，早年曾遍布戰地防禦設施。隨著這些設施拆除，如今人們沿著海邊散步、看浪，岸邊有了不同的用途。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5447,"name":"林氏六路大厝","lat":24.43539,"lng":118.23789,"cat":"history","tag":"歷史建築","desc":"林家大宅的屋脊向上翹起，牆腳則以花崗石層層平砌。最特別的是右側牆身，裡面鑲著一尊已有百年歷史的風獅爺。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5448,"name":"沙溪堡","lat":24.41166,"lng":118.2128,"cat":"scenic","desc":"青岐村外突出的岬角由花崗片麻岩和花崗岩構成，舊堡就位在上頭。從南山頭方向望去，岬角的輪廓像鳥嘴，當地又稱它「鳳嘴」。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5449,"name":"湖井頭戰史館","lat":24.44662,"lng":118.23105,"cat":"culture","desc":"烈嶼西北的湖井頭與廈門僅隔一段海面，戰時曾是心戰喊話基地。它和大金門的馬山、古寧頭及大膽島，都留下同一時代的歷史。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5450,"name":"烈女廟","lat":24.418,"lng":118.22308,"cat":"worship","desc":"青岐村這座廟在小金門西南端，居民也稱它為「王仙姑廟」。烈嶼的地方廟宇不少，這裡是當地香火相當興盛的一處。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5451,"name":"烈嶼中華民國萬歲碑","lat":24.427973,"lng":118.235119,"cat":"history","tag":"歷史建築","desc":"九宮碼頭高處的紀念碑，是誠實部隊在戰地政務時期所立。它坐落在往來碼頭的路上，長久成了居民與旅人辨認烈嶼的地標。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5452,"name":"烈嶼吳秀才厝","lat":24.42234,"lng":118.22968,"cat":"history","tag":"古蹟","desc":"上庫吳家靠航運與鹽場致富，吳景山在清道光年間興建了這座大合院。左右兩側各有護龍，是烈嶼島上占地最大的古厝。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5453,"name":"烈嶼東林宋代東井","lat":24.427501,"lng":118.249457,"cat":"history","tag":"古蹟","desc":"花崗石板砌成的井欄，兩面留有不同年代的刻字。北面記著南宋時林彥智捐井，南面的「大德乙巳重修」則留下後來修井的記錄。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5454,"name":"烈嶼鄉文化館","lat":24.43116,"lng":118.24475,"cat":"culture","desc":"舊鄉公所經整修改成展示館，原來辦理鄉務的空間，如今陳列烈嶼的地方文化資產。館裡也有人解說這些物件，介紹小金門的生活與歷史。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5455,"name":"紅土溝三營區L-36據點","lat":24.44955,"lng":118.23829,"cat":"history","desc":"舊營區位在烈嶼紅土海岸的凹地，名稱就從這片紅土而來。營內的等身士兵雕像，有的在出操、有的在拉單槓，重現當年軍旅生活的日常。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5456,"name":"羅厝媽祖公園","lat":24.42521,"lng":118.26281,"cat":"worship","desc":"羅厝漁港邊設有兒童遊具，港內除了作業漁船，也停著交通船和巡邏艇。旁邊的活動中心由漁會使用，還有展示小金門農漁特產的空間。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5457,"name":"羅厝羅氏兄弟洋樓","lat":24.42578,"lng":118.25984,"cat":"history","tag":"古蹟","desc":"兩層洋樓的正面用六根紅磚柱分成五開間，一樓柱頭以磚逐層挑出。頂樓留著平坦露台，從整排立柱就能認出這棟房子的特色。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5458,"name":"習山湖公園","lat":24.42466,"lng":118.25003,"cat":"nature","desc":"公園正對東林沙灘與大海，孩子玩的設施和海岸景色就在一起。遊戲場裡除了土丘滑梯、鞦韆和攀爬塔，還有能並排滑行的雙軌滑索。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5459,"name":"西方林天來洋樓","lat":24.435251,"lng":118.238407,"cat":"history","tag":"古蹟","desc":"這棟兩層洋樓前方連著傳統房舍，雙斜屋頂下由九架樑支撐。牆腳以花崗石砌成，上方改用磚牆抹灰，可以近看新舊營造作法如何並用。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5460,"name":"西湖","lat":24.43659,"lng":118.23167,"cat":"scenic","desc":"陵水湖北方還有一座水面開闊的湖泊，岸邊留著烈嶼的戰地記憶。七輛不同型式的坦克車沿岸陳列，和眼前的湖水構成特別的景象。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5461,"name":"鐵漢堡","lat":24.44691,"lng":118.25519,"cat":"history","tag":"歷史建築","desc":"高大的仿城牆圍住整座舊堡，從外側幾乎看不到裡面的景物。走到刻有堡名的大門旁，可見一輛保留下來展示的防砲車。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5462,"name":"陵水湖","lat":24.42302,"lng":118.22521,"cat":"scenic","desc":"烈嶼最大的淡水湖是人工開鑿的，湖畔的水草為鳥類提供棲身之處。到了冬天，從雁鴨、白冠水雞到鸕鶿，都有機會在這片濕地觀察到。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5463,"name":"雙口海濱公園","lat":24.43924,"lng":118.229,"cat":"nature","desc":"雙口海岸過去是村民乘渡船往來廈門的地方，兩岸相距約六公里。戰地年代村莊周圍曾挖設壕溝，海濱也留下從渡口到海防重地的歷史。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5464,"name":"青岐蘭亭別墅","lat":24.41535,"lng":118.228078,"cat":"history","tag":"古蹟","desc":"正屋兩旁的房舍與中間的門樓，共同圍出宅前的空間，左側還連著樓房。從側面看，屋簷前高後低，平直屋脊與兩側圓脊同時可見。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5465,"name":"麒麟山森林公園","lat":24.43916,"lng":118.25456,"cat":"nature","desc":"海拔一百一十九公尺的麒麟山，是烈嶼最高的地方。山上曾是軍事訓練用的靶場，停用之後才逐漸轉型為今天的森林公園。","area":"烈嶼鄉・金門縣","ph":"觀"},{"id":5466,"name":"黃厝洪氏古厝","lat":24.413915,"lng":118.227732,"cat":"history","tag":"古蹟","desc":"洪家古厝右側接著一棟樓房，正面下半部的牆身特別能看出地方特色。匠人就近取用烈嶼的玄武岩，讓不規則的石塊彼此相嵌成牆。","area":"烈嶼鄉・金門縣","ph":"文"},{"id":5467,"name":"烏坵燈塔","lat":24.993296,"lng":119.452137,"cat":"history","tag":"古蹟","desc":"這座清代燈塔見證十九世紀福建沿海與臺灣海峽的航路發展。它起初列為金門縣定古蹟，後來因保存價值再被指定為國定古蹟。","area":"烏坵鄉・金門縣","ph":"文"},{"id":5468,"name":"世懋堂(黃氏三房宗祠)","lat":24.41215,"lng":118.29544,"cat":"worship","tag":"歷史建築","desc":"黃氏三房宗祠前有院埕和照壁，照壁上寫著「指日高陞」。大門的石框刻著對聯，深色磁磚牆身下方則能看見花崗石砌成的牆腳。","area":"金城鎮・金門縣","ph":"文"},{"id":5469,"name":"世澤堂（黃氏小宗宗祠）","lat":24.41112,"lng":118.29686,"cat":"worship","tag":"歷史建築","desc":"寫著「紫雲屏」的照壁立在祠堂前方，後面是一座有左右護龍的兩進院落。前簷以石材支撐，採用前水頭一帶常見的漳州式做法。","area":"金城鎮・金門縣","ph":"文"},{"id":5470,"name":"代天府","lat":24.43096,"lng":118.31961,"cat":"worship","desc":"金門東門這座廟同時供奉溫王爺和池王爺。地方相傳池王爺代天巡狩經過，受到原本鎮守此地的溫王爺邀請，兩位王爺便一起庇佑鄉里。","area":"金城鎮・金門縣","ph":"觀"},{"id":5471,"name":"傅氏古厝","lat":24.43348,"lng":118.31865,"cat":"history","tag":"歷史建築","desc":"傅家宅院的前埕以紅磚鋪地，裡面還有一口水井和空心磚砌的照壁。走到院門可見牆腳的花崗石，往上則換成紅磚組成的牆身。","area":"金城鎮・金門縣","ph":"文"},{"id":5472,"name":"僑鄉金門-王慶雲洋樓1934","lat":24.43184,"lng":118.31766,"cat":"other","desc":"這棟五腳基洋樓保留了金門僑鄉的歷史，早年出洋經商的居民會把南洋建築特色帶回家鄉。如今老樓也成了地方文化活動的空間。","area":"金城鎮・金門縣","ph":"觀"},{"id":5473,"name":"前水頭得月樓及黃輝煌洋樓","lat":24.40975,"lng":118.29851,"cat":"history","tag":"古蹟","desc":"黃輝煌經商致富後，請福建匠師陳南安在水頭設計這座高樓。落成時它是聚落裡最高的建築，名稱取自「近水樓台先得月」的意思。","area":"金城鎮・金門縣","ph":"文"},{"id":5474,"name":"北堤長頸鹿公園","lat":24.429,"lng":118.31774,"cat":"nature","desc":"金城市區旁的小公園以一座高大的長頸鹿遊具最醒目。長長的脖子搭配鮮明色彩，讓原本不大的遊戲場有了孩子一眼就認出的標記。","area":"金城鎮・金門縣","ph":"觀"},{"id":5475,"name":"北鎮廟","lat":24.43387,"lng":118.31894,"cat":"worship","desc":"後浦北門境的境主是玄天上帝，居民也稱祂為「上帝公」。這座廟曾經整修，後來又在二〇〇〇年重建，才成了今天所見的模樣。","area":"金城鎮・金門縣","ph":"觀"},{"id":5476,"name":"古區陳氏家廟","lat":24.41005,"lng":118.31295,"cat":"worship","tag":"歷史建築","desc":"陳家家廟前後兩進，木構架採用層層疊起的斗座來支撐。兩旁與後面的牆腳用花崗石砌成，四角留著清水磚柱，閩式屋脊則向上翹起。","area":"金城鎮・金門縣","ph":"文"},{"id":5477,"name":"古地城隍廟","lat":24.40191,"lng":118.30551,"cat":"worship","area":"金城鎮・金門縣","ph":"觀"},{"id":5478,"name":"古崗樓","lat":24.39427,"lng":118.31558,"cat":"scenic","desc":"淡水畫家莊武男也擅長修廟，這座湖邊樓閣就是由他在一九六四年負責興建。從樓頂俯看古崗湖，晴天時水面泛光，遠近山色都映進眼前。","area":"金城鎮・金門縣","ph":"觀"},{"id":5479,"name":"古崗蔡氏開基祖厝","lat":24.39725,"lng":118.31703,"cat":"history","tag":"歷史建築","desc":"古崗舊名許坑，是濟陽派蔡氏族人渡海來金門後定居的地方。這棟開基祖厝約建於清嘉慶年間，留下蔡家在古崗繁衍的家族記憶。","area":"金城鎮・金門縣","ph":"文"},{"id":5480,"name":"同安渡頭","lat":24.4376,"lng":118.30916,"cat":"scenic","desc":"金城這處渡頭過去是前往漳州與廈門的主要碼頭。商貿興盛的年代，貨物和旅客在這裡往來，渡頭也曾是地方生意匯集的所在。","area":"金城鎮・金門縣","ph":"觀"},{"id":5481,"name":"吳稚暉紀念公園","lat":24.4151,"lng":118.28888,"cat":"nature","desc":"綠蔭間立著吳稚暉的銅像和紀念碑，碑文由蔣介石題寫。公園緊鄰金門港旅運中心，從這裡還能俯看小三通船舶進出港口。","area":"金城鎮・金門縣","ph":"觀"},{"id":5482,"name":"基督教會堂","lat":24.433771,"lng":118.317543,"cat":"worship","tag":"歷史建築","desc":"這棟單層教堂以紅磚砌牆，牆腳改用花崗石。山牆上留著「基督教會堂」和「１９２４」字樣，入口上方另有一個立體十字架。","area":"金城鎮・金門縣","ph":"文"},{"id":5483,"name":"外武廟","lat":24.43308,"lng":118.31492,"cat":"worship","desc":"這間廟俗稱「馬舍宮」，供奉關公的坐騎赤兔馬，以及部將和馬伕。它原與後浦的武廟相配，後來又奉祀韓王爺，成了西門境的地方信仰中心。","area":"金城鎮・金門縣","ph":"觀"},{"id":5484,"name":"大夫第","lat":24.40106,"lng":118.32165,"cat":"history","tag":"歷史建築","desc":"薛紹纘早年到菲律賓經商致富，清末返鄉後興建這座大宅和上書房。屋主曾捐得大夫官職，門額上懸掛的「大夫第」匾正是由此而來。","area":"金城鎮・金門縣","ph":"文"},{"id":5485,"name":"寶月庵","lat":24.39923,"lng":118.3065,"cat":"worship","desc":"明代的南庵曾供奉觀音與羅漢，原址在今天的金門酒廠內。庵前的寶月泉水質良好，酒廠成立時為取水釀酒拆除了庵堂，泉水也與高粱酒結下淵源。","area":"金城鎮・金門縣","ph":"觀"},{"id":5486,"name":"將軍第","lat":24.43307,"lng":118.31813,"cat":"history","tag":"古蹟","desc":"這座三進大宅右側連著護龍，前兩進的翹脊裝飾著剪黏和泥塑。正面下方用石砌，上方換成煙炙磚，細看還能找到雙囍字樣的磚雕。","area":"金城鎮・金門縣","ph":"文"},{"id":5487,"name":"小西門模範廁","lat":24.413135,"lng":118.327064,"cat":"history","tag":"古蹟","desc":"僑商吳朝枰返鄉出資建了這處長條形公廁，內有二十二口編號的廁池。牆上各嵌一塊刻著號碼的磚，入口山牆卻做成洋樓般的曲線。","area":"金城鎮・金門縣","ph":"文"},{"id":5488,"name":"延平郡王祠","lat":24.42448,"lng":118.30477,"cat":"worship","desc":"金城西南郊的仿古宮殿，是金門紀念鄭成功的祠宇。明末清初鄭成功以金門為基地，這裡視野開闊，也留下他在海上觀兵的歷史記憶。","area":"金城鎮・金門縣","ph":"觀"},{"id":5489,"name":"建功嶼","lat":24.42746,"lng":118.30005,"cat":"scenic","desc":"浯江溪口有一座小島，過去也稱董嶼、珠嶼或鰲嶼。它立在大金門和烈嶼之間，曾是海上的衛哨，因此有了「建功砥柱」的稱呼。","area":"金城鎮・金門縣","ph":"觀"},{"id":5490,"name":"建威第","lat":24.43105,"lng":118.31427,"cat":"history","tag":"歷史建築","desc":"從有屋頂的院門進去，前方的軒亭和左側護龍圍著主屋。正屋和院門同鋪紅瓦、屋脊上翹，軒亭則改用筒瓦，屋面各有特色。","area":"金城鎮・金門縣","ph":"文"},{"id":5491,"name":"後浦何宅","lat":24.43136,"lng":118.31669,"cat":"history","tag":"歷史建築","desc":"這棟後浦民宅在一九二一年由何夫人陳氏興建。她的丈夫是福建惠安木匠何水贊，家人隨工作遷居金門，先租屋，後來才有了自己的家宅。","area":"金城鎮・金門縣","ph":"文"},{"id":5492,"name":"後浦大夫第","lat":24.43319,"lng":118.31564,"cat":"history","tag":"歷史建築","desc":"後浦這座兩進大厝約建於清道光年間，原屬蔣家，後來轉售給許家。前方仍有自成一座小門樓的院門，過了門才進到家宅的範圍。","area":"金城鎮・金門縣","ph":"文"},{"id":5493,"name":"後浦東門境洪氏古厝","lat":24.43106,"lng":118.31908,"cat":"history","tag":"古蹟","desc":"洪家大厝前後兩進，中間留了一口讓光線落進來的天井。兩進房屋都以花崗石砌牆基、紅磚疊牆身，大廳兩側還看得到木作樑架。","area":"金城鎮・金門縣","ph":"文"},{"id":5494,"name":"後浦林斐章大宅","lat":24.433354,"lng":118.318753,"cat":"history","tag":"古蹟","desc":"院門牆腳的玄武石排成六角龜殼紋，上方是覆著筒瓦的翹脊。大宅正面另用了泉州白石，連柱腳下的石雕也做得相當細緻。","area":"金城鎮・金門縣","ph":"文"},{"id":5495,"name":"後浦武廟","lat":24.4331,"lng":118.31674,"cat":"worship","tag":"歷史建築","desc":"後浦居民也稱這裡為內武廟，和西門一帶的外武廟相呼應。它在明末初建時就是地方祭拜關帝的廟宇，後來見證後浦發展成為金門的行政中心。","area":"金城鎮・金門縣","ph":"文"},{"id":5496,"name":"後浦許允選洋樓","lat":24.430562,"lng":118.316206,"cat":"history","tag":"古蹟","desc":"洋樓的基腳用長條石疊砌，磚造外廊由拱門分出不同開間。中央一座大弧拱，左右兩側換成圓拱，拱頂還各嵌著拱心石。","area":"金城鎮・金門縣","ph":"文"},{"id":5497,"name":"後浦陳氏祠堂","lat":24.43293,"lng":118.31705,"cat":"worship","tag":"歷史建築","desc":"陳氏祠堂前後兩進都鋪綠色筒瓦，連簷下的瓦當和滴水也選用同色。前後屋脊各有變化，脊上還能看見傳統剪黏裝飾。","area":"金城鎮・金門縣","ph":"文"},{"id":5498,"name":"後豐港洪旭古厝","lat":24.41841,"lng":118.30146,"cat":"history","tag":"古蹟","desc":"這座洪家宅院由前後兩組房舍連成，走起來有三進大厝的層次。正面三個開間全都向內縮，沿著屋簷形成一條平整通長的廊道。","area":"金城鎮・金門縣","ph":"文"},{"id":5499,"name":"後豐港洪
